 transform=\"translate(620 226)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">consumer 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 75 ns</text></g><g transform=\"translate(738 178)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">producer 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 30 ns</text></g><g transform=\"translate(738 226)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">consumer 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 80 ns</text></g><g transform=\"translate(856 178)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">producer 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 35 ns</text></g><g transform=\"translate(856 226)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">consumer 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 85 ns</text></g><g transform=\"translate(974 178)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">producer 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 40 ns</text></g><g transform=\"translate(974 226)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">consumer 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 90 ns</text></g><g transform=\"translate(1092 178)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">producer 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 45 ns</text></g><g transform=\"translate(1092 226)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">consumer 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 95 ns</text></g><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the twentieth thread waits ninety-five nanoseconds for the lock, and then one to two MILLISECONDS for its own work.</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">so yes, the hand-off is one at a time -- and no, that is not where the time goes. What costs is the park and the wake, not the lock.</text><text x=\"24\" y=\"348\" text-anchor=\"start\" font-size=\"12.5\" fill=\"var(--text)\">and the follow-up question: who goes next, and can one producer be starved?</text><g transform=\"translate(24 362)\"><rect width=\"580\" height=\"118\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"290.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who goes next is decided by the Condition, not the lock</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">a producer that finds no room parks on notFull</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">a Condition's wait set is served first-in, first-out</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">so the parked producers are woken in the order they slept</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">barging only affects a thread that arrives at lock() itself</text></g><g transform=\"translate(660 362)\"><rect width=\"546\" height=\"118\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"273.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">measured: 4 producers, buffer of 1, a 120 ms window</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">default lock: about 7,000 items each -- spread 1.00x, every run</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">new ReentrantLock(true): 3x, then 31x, once 11,460x -- it SCATTERS</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">and it pushes a fifth to a third fewer items through</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">so fairness cost throughput and bought nothing the Condition had not</text></g><text x=\"615\" y=\"500\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">so the honest answer to \"is it fair?\" is a measurement, not a boolean: lock fairness governs threads queued at lock(), and these are</text><text x=\"615\" y=\"518\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">parked on a Condition -- which is why it bought nothing here and cost throughput. Test 13 asserts the even spread and the price of the fair lock.</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself first: if every item goes through one lock, have you serialised the whole pipeline? You have, for about five nanoseconds. Inside the lock there is one array write, one index update, one increment and one signal &mdash; and a signal is a queue push, not a wake-up, so it costs almost nothing. Measured on JDK 21, an uncontended put and take together are nine to ten nanoseconds; <code>HandoffCost</code> in <code>Extensions.java</code> is the loop that says so. Everything slow is outside: the consumer's work (one to two milliseconds in the demo), building the task, and every listener call, which happens after the unlock inside a try/catch so a broken dashboard cannot stall the pipeline. So when twenty threads arrive at the same instant, the twentieth waits about ninety-five nanoseconds for the lock &mdash; and then one to two milliseconds for its own work. Then the follow-up: <i>who goes next, and can a producer starve?</i> Not the lock's decision, as it turns out. A producer that finds no room parks on <code>notFull</code>, and a Condition's wait set is served first-in-first-out, so parked producers are woken in the order they fell asleep. Fairness on the lock (<code>new ReentrantLock(true)</code>) only stops a thread arriving at <code>lock()</code> from barging past a thread that was already woken. Measure it: four producers pushing through a buffer of one for 120 milliseconds. The default lock gave each of them about seven thousand items &mdash; a spread of 1.00, on every run. <code>new ReentrantLock(true)</code> <i>scattered</i> them instead: 3x on a good run, 31x on a bad one, and once 11,460x, when one producer got a single item &mdash; while pushing a fifth to a third fewer items through, because every hand-over becomes a context switch. So the fair lock did not buy the even counts here. The Condition had already bought them, and fairness only added a bill. Turn it on when you can show a thread being overtaken at <code>lock()</code> itself, and say what it costs.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"16\" width=\"580\" height=\"200\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"310\" y=\"38\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">is one lock a bottleneck? do the arithmetic first</text><text x=\"34\" y=\"62\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">one put + one take, uncontended: 9-10 ns measured, so ~5 ns per lock trip</text><text x=\"34\" y=\"88\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a million items a second = 10 ms of lock in every second = 1% busy</text><text x=\"34\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the 10x10 run: 20,000 items in 31-46 ms = over 400,000 items a second</text><text x=\"34\" y=\"140\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">and ~1,400 of those puts had to park -- back-pressure, not contention</text><text x=\"34\" y=\"166\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--acc)\">the lock is not the bottleneck. The park / unpark handshake is.</text><text x=\"34\" y=\"192\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--acc)\">so the first rung of the ladder is not a better lock. It is a bigger buffer.</text><text x=\"905\" y=\"38\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(620 56)\"><rect width=\"586\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"293.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1  raise the capacity, and measure</text><text x=\"293.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">200k items, 1 producer 1 consumer: cap 1 = 780 ms, cap 16 = 50 ms, cap 1024 = 10 ms</text></g><g transform=\"translate(620 110)\"><rect width=\"586\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"293.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2  batch the hand-off</text><text x=\"293.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">drainTo(list, 64): one lock trip for sixty-four items instead of sixty-four trips</text></g><g transform=\"translate(620 164)\"><rect width=\"586\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"293.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3  stop writing it: ThreadPoolExecutor + a bounded queue</text><text x=\"293.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the JDK's queue, pool and rejection handler; past that, two locks, then a lock-free ring</text></g><text x=\"615\" y=\"236\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">say the arithmetic before you climb: a lock-free ring buffer that nobody measured is complexity somebody else will have to maintain</text></svg></div><div class=\"move\"><p>Five nanoseconds inside the lock means a million items a second spends ten milliseconds of every second holding it: one per cent busy. The ten-by-ten run pushes twenty thousand items through a single lock in thirty to forty-six milliseconds, and roughly fourteen hundred of those puts had to park &mdash; which tells you the truth straight away: this pipeline is limited by the park-and-wake handshake, not by the lock. So the first rung is not a cleverer lock. Raise the capacity and measure &mdash; <code>HandoffCost.ladderMs</code> does exactly this, and <code>ExtDemo</code> prints it: two hundred thousand items through one producer and one consumer take about 780 milliseconds at capacity one, 50 at capacity sixteen and 10 at capacity 1024, because a bigger buffer means the two sides rarely have to meet. Second rung, batch the hand-off: <code>drainTo(list, 64)</code> is one lock trip for sixty-four items instead of sixty-four trips. Third rung, stop writing it: a <code>ThreadPoolExecutor</code> with a bounded <code>ArrayBlockingQueue</code> is this entire page, maintained by somebody else. Past that there is <code>LinkedBlockingQueue</code>, which splits the lock into a put lock and a take lock so producers and consumers stop colliding, and then a lock-free ring with per-slot sequence numbers, which is what the LMAX Disruptor is. Say the arithmetic first: a lock-free ring nobody measured is complexity somebody else will have to maintain.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 340\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(24 14)\"><rect width=\"300\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an item is lost, or done twice</text></g><path d=\"M324 31 H374\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(374 14)\"><rect width=\"832\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"416.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lock, wait in a while loop; test 1: 10x10 threads, 20,000 items, each seen exactly once</text></g><g transform=\"translate(24 52)\"><rect width=\"300\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a check outside the lock loses a wakeup</text></g><path d=\"M324 69 H374\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(374 52)\"><rect width=\"832\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"416.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">read the guard under the lock you signal under; test 11: the broken take burns its whole 400 ms timeout</text></g><g transform=\"translate(24 90)\"><rect width=\"300\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">shutdown throws the backlog away</text></g><path d=\"M324 107 H374\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(374 90)\"><rect width=\"832\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"416.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">join producers, then one pill each; test 3: 400 items, the buffer still full at stop, all 400 done</text></g><g transform=\"translate(24 128)\"><rect width=\"300\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a stop-now drops what is queued</text></g><path d=\"M324 145 H374\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(374 128)\"><rect width=\"832\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"416.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hand it back and count it; test 12: 32 items returned, discarded == 32, the ledger balances</text></g><g transform=\"translate(24 166)\"><rect width=\"300\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an interrupt eats the task in hand</text></g><path d=\"M324 183 H374\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(374 166)\"><rect width=\"832\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"416.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">park it before the thread dies; test 6: the dead-letter holds task#77 and the ledger balances</text></g><g transform=\"translate(24 204)\"><rect width=\"300\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">work throws and the item disappears</text></g><path d=\"M324 221 H374\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(374 204)\"><rect width=\"832\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"416.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AccountedWork routes it; test 7: 86 done + 14 parked == 100 admitted</text></g><text x=\"615\" y=\"264\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">four more blocks cover the rest: the bound holds on a capacity of ONE (test 2), a full buffer parks instead of spinning (test 5),</text><text x=\"615\" y=\"282\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">both builds of the hand-off pass the same exactly-once check (test 8), and fairness is measured rather than asserted (test 13).</text><text x=\"615\" y=\"308\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">thirteen blocks, 1.5 seconds, and it must print ALL PASS -- every wait in the file has a timeout, so a broken pipeline FAILS a check</text><text x=\"615\" y=\"326\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">instead of hanging the run. A threading test that can hang is not a test, it is a coin flip.</text></svg></div><div class=\"move\"><p>Six failures carry the design, and each has a block in <code>FailureTests.java</code> that would go red if the code regressed: an item lost or done twice, a wakeup lost because the guard was read outside the lock, a shutdown that throws the backlog away, a stop-now that drops it instead of handing it back, an interrupt that takes the task in hand to the grave, and work that throws. Four more blocks cover the bound on a capacity of one, a full buffer parking instead of spinning, the same exactly-once check on both builds of the hand-off, and fairness measured rather than asserted. Thirteen blocks, 1.5 seconds, and the page does not build unless they all pass. The rule that makes them usable: every wait in the file has a timeout. A threading test that can hang is not a test, it is a coin flip &mdash; so a broken pipeline fails a named check in a second instead of freezing your build for ten minutes.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 314\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"16\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"35.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"230\" y=\"35.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"320\" y=\"35.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"850\" y=\"35.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"46\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"65.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"230\" y=\"65.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"65.0\" font-size=\"11\" fill=\"var(--text)\">interface OverflowPolicy { boolean submit(h, t, m, out); }</text><text x=\"850\" y=\"65.0\" font-size=\"11\" fill=\"var(--text)\">\"never stall\" is a new class, not an edit</text><rect x=\"20\" y=\"76\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"95.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"230\" y=\"95.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"95.0\" font-size=\"11\" fill=\"var(--text)\">new AccountedWork(work, metrics, onFailure) wraps EVERY work</text><text x=\"850\" y=\"95.0\" font-size=\"11\" fill=\"var(--text)\">no work function can break the count</text><rect x=\"20\" y=\"106\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"125.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"230\" y=\"125.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"320\" y=\"125.0\" font-size=\"11\" fill=\"var(--text)\">fanout.onEvent(...) after the unlock, inside a try/catch</text><text x=\"850\" y=\"125.0\" font-size=\"11\" fill=\"var(--text)\">a broken listener is not an outage</text><rect x=\"20\" y=\"136\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"155.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"230\" y=\"155.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"155.0\" font-size=\"11\" fill=\"var(--text)\">NEW -> RUNNING -> DRAINING -> TERMINATED, checked on entry</text><text x=\"850\" y=\"155.0\" font-size=\"11\" fill=\"var(--text)\">start() twice throws instead of forking threads</text><rect x=\"20\" y=\"166\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"185.0\" font-size=\"11\" fill=\"var(--text)\">Command / sentinel</text><text x=\"230\" y=\"185.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"185.0\" font-size=\"11\" fill=\"var(--text)\">Task.POISON: one reserved value, compared by ==</text><text x=\"850\" y=\"185.0\" font-size=\"11\" fill=\"var(--text)\">the stop signal queues like any other item</text><rect x=\"20\" y=\"196\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"215.0\" font-size=\"11\" fill=\"var(--text)\">Producer-Consumer</text><text x=\"230\" y=\"215.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"320\" y=\"215.0\" font-size=\"11\" fill=\"var(--text)\">the whole page: it IS the pattern, and it is a concurrency one</text><text x=\"850\" y=\"215.0\" font-size=\"11\" fill=\"var(--text)\">two speeds, decoupled by one bounded buffer</text><rect x=\"20\" y=\"226\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"245.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"230\" y=\"245.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"245.0\" font-size=\"11\" fill=\"var(--muted)\">new LockHandoff(16) at the call site: one line, chosen once</text><text x=\"850\" y=\"245.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when the build comes from config</text><rect x=\"20\" y=\"256\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"275.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"230\" y=\"275.0\" font-size=\"11\" fill=\"var(--text)\">never here</text><text x=\"320\" y=\"275.0\" font-size=\"11\" fill=\"var(--muted)\">every test builds its own Pipeline; nothing calls getInstance()</text><text x=\"850\" y=\"275.0\" font-size=\"11\" fill=\"var(--muted)\">shared mutable global state in a threaded design</text><text x=\"615\" y=\"300\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence, and the ones you left out have one too</text></svg></div><div class=\"move\"><p>Strategy is move 3: what a full buffer means is the rule that changes, so it sits behind a one-method interface the pipeline is handed. Decorator is the same move's wrapper, <code>AccountedWork</code>, which adds the exactly-once counting to any work function instead of trusting each one to count itself. Observer is move 4's rule that nothing slow may happen inside the lock, so listeners are called after the unlock and their exceptions are swallowed. State is move 6: four named states, checked on entry, so calling <code>start()</code> twice throws instead of quietly forking a second set of threads. The poison pill is a sentinel and, read another way, a Command: the stop instruction travels through the same queue as the work, which is the only reason it arrives in the right order. And the honest one: Producer-Consumer <i>is itself</i> a pattern &mdash; a concurrency pattern rather than a Gang-of-Four one &mdash; and the whole page is it. Factory did not earn a place: the hand-off is built once at a call site, and it earns the name the day that choice comes from configuration. Singleton earns nothing at all, because every test builds its own pipeline.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 258\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"16\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"37.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"37.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"470\" y=\"37.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"37.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"71.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"71.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"470\" y=\"71.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"71.0\" font-size=\"11\" fill=\"var(--text)\">Handoff guards the slots. Producer makes. Consumer does. Pipeline wires and stops.</text><rect x=\"20\" y=\"84\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"105.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"105.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"470\" y=\"105.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"105.0\" font-size=\"11\" fill=\"var(--text)\">DropOldest is a new file; the buffer, producer, consumer and shutdown are untouched</text><rect x=\"20\" y=\"118\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"139.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"139.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"470\" y=\"139.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 8</text><text x=\"580\" y=\"139.0\" font-size=\"11\" fill=\"var(--text)\">the same failure tests pass on both builds of the Handoff; only the trade-off changes</text><rect x=\"20\" y=\"152\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"173.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"173.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"470\" y=\"173.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"173.0\" font-size=\"11\" fill=\"var(--text)\">OverflowPolicy, Work, FailurePolicy, PipelineListener, Clock: one method each</text><rect x=\"20\" y=\"186\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"207.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"207.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"470\" y=\"207.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"580\" y=\"207.0\" font-size=\"11\" fill=\"var(--text)\">configure(policy, work, onFailure) -- which is how a test hands in work that throws</text><text x=\"615\" y=\"244\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>S: one reason to change per class, which move 2 gave you &mdash; the hand-off guards the slots, the producer makes, the consumer does, the pipeline wires and stops, and nobody does two of those. O: a new overflow behaviour is a new file and one changed line, never an edit to tested concurrency code. L: the strongest evidence on this page is that the same failure tests pass on both builds of the hand-off &mdash; the lock with two Conditions in <code>Main.java</code> and the JDK's own queue in <code>Extensions.java</code> &mdash; so only the trade-off changes, never the correctness. I: five interfaces with one method each, so a fake for a test is a lambda. D: the pipeline depends on interfaces and is handed the implementations, which is precisely why a test can hand it work that throws on every seventh task and then check that not one of the hundred items disappeared.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 318\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(24 18)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">drop oldest, drop newest, a deadline</text></g><path d=\"M354 40 H414\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(414 18)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind OverflowPolicy plus one configure line</text></g><text x=\"1140\" y=\"45\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(24 72)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a dashboard, an alert, autoscaling</text></g><path d=\"M354 94 H414\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(414 72)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more listener, called after the unlock; the lock does not change</text></g><text x=\"1140\" y=\"99\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(24 126)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">PAUSED, or a stage that stops alone</text></g><path d=\"M354 148 H414\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(414 126)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more state and one more checked transition</text></g><text x=\"1140\" y=\"153\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(24 180)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across items</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">same key, in order; N at a time</text></g><path d=\"M354 202 H414\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(414 180)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lane per key, or a semaphore beside the same lock</text></g><text x=\"1140\" y=\"207\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 4 + 5</text><g transform=\"translate(24 234)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a crash must not lose the buffer</text></g><path d=\"M354 256 H414\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(414 234)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">append before the hand-off, ack after the work; unacked items are redelivered,</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">so delivery becomes at-least-once and the consumer dedupes by id</text></g><text x=\"1140\" y=\"261\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 6 + 12</text><text x=\"615\" y=\"304\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five, the hand-off and its wait protocol do not change at all; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (drop the newest, evict the oldest, give up after eighty milliseconds) is a new class behind <code>OverflowPolicy</code> plus one line in configure. Someone new who wants to know (a dashboard, an alert, an autoscaler reading the depth) is one more listener called after the unlock. A new step in a life (PAUSED, or a stage that stops on its own) is one more state and one more checked transition. A new invariant across items (same key in order, or at most N in flight) is one lane per key or a semaphore beside the same lock. And state that must outlive the process is the real one: append the item to a log <i>before</i> handing it over, ack it <i>after</i> the work succeeds, and redeliver whatever is unacked at restart &mdash; which makes delivery at-least-once rather than exactly-once, so the consumer has to dedupe by task id. That is the same idempotency key a payment system uses, and it is the honest answer to \"is this Kafka?\": no, and here is the seam where it would become one. For all five, the hand-off and its wait protocol do not change at all. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 860\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M823.0 210L823.0 182\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M960 396L990 396L990 194L960 194\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1111.0 112L1111.0 86\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1002 230L986 230L986 62L1002 62\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1111.0 470L1111.0 442\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M634 637.0L986 637L986 333L1002 333.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M634 165.0L672 99.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M461.0 314L461.0 334\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"474\" y=\"328\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">runs</text><path d=\"M288 200L272 200L272 474L288 474\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M634 160L650 160L650 550L672 550\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M288 165.0L268 100L268 340L250 340\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M634 60L994 60L994 40L1002 40\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M634 80L982 80L982 330L1002 330\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M634 100L970 100L970 412L1002 412\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"960\" y=\"126\" text-anchor=\"end\" font-size=\"10.5\" fill=\"var(--acc)\">the rules, handed in</text><path d=\"M288 60L266 60L266 224L250 224\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><path d=\"M288 120L274 120L274 144L250 144\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M634 387.0L672 150\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M634 513.0L654 500L654 170L672 170\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M288 513.0L270 500L270 60L250 60\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M288 637.0L262 622L262 360L250 360\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"712\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">who is asleep, and where: two waiting rooms inside one lock</text><g transform=\"translate(20 726)\"><rect width=\"100\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"50.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">producer-0</text></g><g transform=\"translate(128 726)\"><rect width=\"100\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"50.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">producer-1</text></g><g transform=\"translate(236 726)\"><rect width=\"100\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"50.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">producer-2</text></g><path d=\"M336 748 H366\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(370 726)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">notFull</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">asleep while full</text></g><path d=\"M550 748 H580\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url ll=\"var(--muted)\">an add signals notEmpty and wakes exactly one consumer. Two rooms, so a wake-up never goes to a thread that cannot move.</text><g transform=\"translate(10 16)\"><rect width=\"240\" height=\"82\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Task</text><line x1=\"0\" y1=\"26\" x2=\"240\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">id: int</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">payload: String</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">POISON: Task  (the sentinel)</text></g><g transform=\"translate(10 120)\"><rect width=\"240\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"120.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"120.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Clock</text><line x1=\"0\" y1=\"34\" x2=\"240\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">nowMs(): long</text></g><g transform=\"translate(10 200)\"><rect width=\"240\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"120.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"120.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PipelineListener</text><line x1=\"0\" y1=\"34\" x2=\"240\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">onEvent(event, detail)</text></g><g transform=\"translate(10 282)\"><rect width=\"240\" height=\"170\" rx=\"4\" fill=\"var(--bg3)\" middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"109.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">OverflowPolicy</text><line x1=\"0\" y1=\"34\" x2=\"218\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">submit(h, t, m, out)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">  : boolean</text></g><g transform=\"translate(1002 112)\"><rect width=\"218\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"109.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">BlockUntilRoom</text><line x1=\"0\" y1=\"26\" x2=\"218\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">offer, else park on notFull</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">and count the park</text></g><g transform=\"translate(1002 208)\"><rect width=\"218\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"109.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;extension&raquo;</text><text x=\"109.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DropNewest | DropOldest</text><line x1=\"0\" y1=\"34\" x2=\"218\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">shed on arrival, or</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">evict the oldest</text></g><g transform=\"translate(1002 306)\"><rect width=\"218\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"109.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"109.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Work</text><line x1=\"0\" y1=\"34\" x2=\"218\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">process(t)</text></g><g transform=\"translate(1002 388)\"><rect width=\"218\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"109.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"109.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FailurePolicy</text><line x1=\"0\" y1=\"34\" x2=\"218\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">onFailed(t, cause, m)</text></g><g transform=\"translate(1002 470)\"><rect width=\"218\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"109.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DeadLetterSink</text><line x1=\"0\" y1=\"26\" x2=\"218\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">parked: Queue&lt;Task&gt;</text><line x1=\"0\" y1=\"48\" x2=\"218\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">park it, never lose it</text></g><g><path d=\"M20 838L64 838\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"842\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 838L284 838\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"842\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 838L504 838\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"842\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 838L684 838\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"842\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 838L904 838\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"842\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values; &laquo;extension&raquo; = the class lives in Extensions.java, so it is the answer to a follow-up rather than part of the core file). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements, and there are two of them into <code>Handoff</code> because the hand-off is built twice: the lock with two Conditions here, and the JDK's own queue as a follow-up. Filled diamond = owns: the pipeline owns the buffer, the threads and the counters. Plain arrow = references: a producer calls <code>put</code>, a consumer calls <code>take</code>, and both carry Tasks. Dashed green = handed in through <code>configure()</code>. Dotted blue = notifies, after the unlock. <b>Where state lives:</b> all shared mutable state is in one class, <code>LockHandoff</code> &mdash; the array, the three integers and the two Conditions &mdash; and that is the only object with a lock on the hot path. The pipeline has a second lock, but it guards the life cycle only and is never taken while an item moves. The counters are atomic and take no lock at all, because each is an independent single increment. <b>The band at the bottom</b> is the part a class diagram normally hides: the two queues of sleeping threads. A producer that finds no room sleeps on <code>notFull</code>; a consumer that finds nothing sleeps on <code>notEmpty</code>; every change signals the <i>other</i> room, so a wake-up always goes to a thread that can actually make progress. Notice what is <i>not</i> here: no Scheduler, because the JVM is the scheduler, and no stop flag on the consumer, because the stop signal travels through the buffer as a Task.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>The green comment above each class and method says what it does and what it guarantees; read only those first for the shape, then the bodies. Main.java is the whole system and compiles on its own; Extensions.java holds the reference code for every follow-up on page 05 (plus an <code>ExtDemo</code> main that runs all of it); it also prints the two timings quoted in moves 7 and 8, so the arithmetic on this page is something you can re-run. FailureTests.java proves thirteen claims in about 1.5 seconds, every wait in it bounded by a timeout. Each copy button copies that whole file. <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS.</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * One unit of work moving through the pipeline. POISON is a reserved instance that is never real work: it is\n * the stop signal that travels in-band, compared by identity (==), so no payload can ever impersonate it.\n */\nfinal class Task {\n    /** The stop signal. Exactly one per consumer is put into the buffer at shutdown, behind every real task. */\n    static final Task POISON = new Task(-1, &quot;poison&quot;);\n    final int id;\n    final String payload;\n    Task(int id, String payload) { this.id = id; this.payload = payload; }\n    @Override public String toString() { return &quot;task#&quot; + id; }\n}\n\n/** Where time comes from. Injected, so a test can control a deadline. A wait itself is always on the real machine. */\ninterface Clock { long nowMs(); }\n\n/**\n * What a consumer does with one task. Handed in, so a test can make the work slow, make it throw, or make it\n * count. The pipeline never knows what the work is; it only knows when it returned.\n */\ninterface Work {\n    /** Process one task. Throwing a RuntimeException sends the task to the failure policy, never to nowhere. */\n    void process(Task t) throws InterruptedException;\n}\n\n/** What happens to a task whose work threw. Handed in, so the pipeline never silently decides to lose an item. */\ninterface FailurePolicy {\n    /** Called with the failed task. It must either park it somewhere or count it; it must not throw. */\n    void onFailed(Task t, RuntimeException cause, Metrics m);\n}\n\n/** Told after the fact, never with a lock held. A listener that throws cannot break a producer or a consumer. */\ninterface PipelineListener {\n    /** One event: STATE, BACKPRESSURED, DROPPED or DEAD_LETTER, with a human line of detail. */\n    void onEvent(String event, String detail);\n}\n\n/**\n * The hand-off: the one place a producer thread and a consumer thread meet. Every method is safe to call from\n * any thread. Three builds implement it -- synchronized/wait/notify, ReentrantLock with two Conditions, and\n * java.util.concurrent&#x27;s ArrayBlockingQueue -- and the rest of the pipeline cannot tell which it was given.\n */\ninterface Handoff {\n    /** Hand the item over, waiting while the buffer is full. Returns only when the item IS in the buffer. */\n    void put(Task t) throws InterruptedException;\n    /** The same, but give up after timeoutMs. false means the item was never handed over. */\n    boolean put(Task t, long timeoutMs) throws InterruptedException;\n    /** Hand it over only if there is room this instant. Never waits. */\n    boolean offer(Task t);\n    /** Take the next item, waiting while the buffer is empty. */\n    Task take() throws InterruptedException;\n    /** Take the next item, or null if none arrives within timeoutMs. */\n    Task poll(long timeoutMs) throws InterruptedException;\n    /** Make room by dropping the oldest item, then add. Returns what was dropped, or null if there was room. */\n    Task putEvictingOldest(Task t);\n    /** How many items are in the buffer right now. A number that is already stale when you read it. */\n    int size();\n    /** The bound. Memory is O(capacity) whatever the arrival rate; that bound IS the safety property. */\n    int capacity();\n    /** Which build this is, for the demo line that runs all three. */\n    String name();\n}\n\n/**\n * Counters every thread tallies. These are independent single increments, so they are lock-free AtomicLongs;\n * the buffer needs a multi-step invariant, so it takes a lock. That is the whole rule for choosing between them.\n */\nfinal class Metrics {\n    /** Items created by a producer, counted before the hand-off is attempted. */\n    final AtomicLong produced = new AtomicLong();\n    /** Items that made it into the buffer. Counted only AFTER the hand-off returned. */\n    final AtomicLong admitted = new AtomicLong();\n    /** Items the overflow policy shed on arrival, never handed over at all. */\n    final AtomicLong dropped = new AtomicLong();\n    /** Items that WERE handed over and were later evicted to make room. A different loss, counted separately. */\n    final AtomicLong evicted = new AtomicLong();\n    /** Items created but never handed over, because the producer was interrupted mid-put. */\n    final AtomicLong abandoned = new AtomicLong();\n    /** Items whose work returned normally. */\n    final AtomicLong consumed = new AtomicLong();\n    /** Items whose work threw. */\n    final AtomicLong failed = new AtomicLong();\n    /** Items parked by the failure policy, so a failure is never a disappearance. */\n    final AtomicLong deadLettered = new AtomicLong();\n    /** Items still in the buffer when shutdownNow() was called: handed back to the caller, never run. */\n    final AtomicLong discarded = new AtomicLong();\n    /** How many times a producer found the buffer full and had to wait. This number IS back-pressure. */\n    final AtomicLong backpressured = new AtomicLong();\n    /** How long producers spent parked in total. */\n    final AtomicLong blockedNanos = new AtomicLong();\n    /** Items taken but not yet finished. The ledger balances only when this is zero. */\n    final AtomicInteger inFlight = new AtomicInteger();\n    /** The deepest the buffer was ever seen. It must never exceed the capacity. */\n    final AtomicInteger maxDepth = new AtomicInteger();\n    /** Pills actually taken by consumers. Must equal the consumer count after a clean shutdown. */\n    final AtomicInteger pillsTaken = new AtomicInteger();\n\n    /** Remember the high-water mark of the buffer. Used by the test that proves the bound held. */\n    void observeDepth(int depth) { maxDepth.accumulateAndGet(depth, Math::max); }\n\n    /** An immutable copy a monitor or a dashboard can print without touching the hot path. */\n    MetricsSnapshot snapshot(int depth) {\n        return new MetricsSnapshot(produced.get(), admitted.get(), dropped.get(), evicted.get(), abandoned.get(),\n            consumed.get(), deadLettered.get(), discarded.get(), backpressured.get(), blockedNanos.get() / 1_000_000L,\n            maxDepth.get(), depth, inFlight.get(), pillsTaken.get());\n    }\n}\n\n/**\n * One reading of the counters. The two identities below are the exactly-once promise of the whole design; they\n * are exact at rest (after shutdown) and approximate while threads run, because the fields are read one at a time.\n */\nrecord MetricsSnapshot(long produced, long admitted, long dropped, long evicted, long abandoned, long consumed,\n                       long deadLettered, long discarded, long backpressured, long blockedMs, int maxDepth,\n                       int depth, int inFlight, int pillsTaken) {\n    /**\n     * The exactly-once ledger, in two lines. Every item made was handed over, shed on arrival, or abandoned by an\n     * interrupted producer; and every item handed over was consumed, parked in the dead-letter queue, evicted to\n     * make room, handed back by shutdownNow, still in the buffer, or still in a consumer&#x27;s hand. Nothing else is\n     * possible, so if these two lines hold, no item was lost and no item was done twice.\n     */\n    boolean balanced() {\n        return produced == admitted + dropped + abandoned\n            &amp;&amp; admitted == consumed + deadLettered + evicted + discarded + depth + inFlight;\n    }\n    @Override public String toString() {\n        return &quot;produced=&quot; + produced + &quot; admitted=&quot; + admitted + &quot; dropped=&quot; + dropped + &quot; evicted=&quot; + evicted\n            + &quot; abandoned=&quot; + abandoned + &quot; consumed=&quot; + consumed + &quot; deadLettered=&quot; + deadLettered\n            + &quot; discarded=&quot; + discarded\n            + &quot; depth=&quot; + depth + &quot; inFlight=&quot; + inFlight + &quot; maxDepth=&quot; + maxDepth\n            + &quot; backpressured=&quot; + backpressured + &quot; blockedMs=&quot; + blockedMs + &quot; pills=&quot; + pillsTaken\n            + &quot; balanced=&quot; + balanced();\n    }\n}\n\n/**\n * The hand-off itself: a ReentrantLock and TWO Conditions over a fixed array ring. A Condition is a queue of\n * sleeping threads attached to the lock. Producers sleep on notFull, consumers sleep on notEmpty, so a signal\n * always wakes a thread that can actually make progress. Everything inside the lock is array arithmetic; nothing\n * slow is allowed in. (The sibling page, Bounded Blocking Queue, builds this same object three other ways.)\n */\nfinal class LockHandoff implements Handoff {\n    private final Task[] ring;\n    private final int cap;\n    private int head, tail, count;\n    private final ReentrantLock lock;\n    private final Condition notFull, notEmpty;\n\n    LockHandoff(int capacity) { this(capacity, false); }\n    /**\n     * fair = true hands the lock to the thread that has waited longest, so no producer can be starved by a\n     * neighbour that keeps barging in. It costs throughput, because every hand-over becomes a context switch.\n     */\n    LockHandoff(int capacity, boolean fair) {\n        if (capacity &lt; 1) throw new IllegalArgumentException(&quot;capacity must be at least 1&quot;);\n        cap = capacity; ring = new Task[capacity];\n        lock = new ReentrantLock(fair);\n        notFull = lock.newCondition();\n        notEmpty = lock.newCondition();\n    }\n    /** Park on notFull while the buffer is full, then add and wake exactly one waiting consumer. */\n    @Override public void put(Task t) throws InterruptedException {\n        lock.lockInterruptibly();\n        try {\n            while (count == cap) notFull.await();\n            enqueue(t);\n            notEmpty.signal();\n        } finally { lock.unlock(); }\n    }\n    /** The timed twin, on awaitNanos: it returns the time LEFT, so the deadline survives a spurious wake-up. */\n    @Override public boolean put(Task t, long timeoutMs) throws InterruptedException {\n        long nanos = TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n        lock.lockInterruptibly();\n        try {\n            while (count == cap) {\n                if (nanos &lt;= 0L) return false;\n                nanos = notFull.awaitNanos(nanos);\n            }\n            enqueue(t); notEmpty.signal(); return true;\n        } finally { lock.unlock(); }\n    }\n    @Override public boolean offer(Task t) {\n        lock.lock();\n        try {\n            if (count == cap) return false;\n            enqueue(t); notEmpty.signal(); return true;\n        } finally { lock.unlock(); }\n    }\n    @Override public Task take() throws InterruptedException {\n        lock.lockInterruptibly();\n        try {\n            while (count == 0) notEmpty.await();\n            Task t = dequeue();\n            notFull.signal();\n            return t;\n        } finally { lock.unlock(); }\n    }\n    @Override public Task poll(long timeoutMs) throws InterruptedException {\n        long nanos = TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n        lock.lockInterruptibly();\n        try {\n            while (count == 0) {\n                if (nanos &lt;= 0L) return null;\n                nanos = notEmpty.awaitNanos(nanos);\n            }\n            Task t = dequeue(); notFull.signal(); return t;\n        } finally { lock.unlock(); }\n    }\n    /** Drop the oldest and add the new one as ONE step under the lock, so the bound can never be exceeded. */\n    @Override public Task putEvictingOldest(Task t) {\n        lock.lock();\n        try {\n            Task evicted = count == cap ? dequeue() : null;\n            enqueue(t);\n            notEmpty.signal();\n            return evicted;\n        } finally { lock.unlock(); }\n    }\n    @Override public int size() { lock.lock(); try { return count; } finally { lock.unlock(); } }\n    @Override public int capacity() { return cap; }\n    @Override public String name() { return &quot;ReentrantLock(fair=&quot; + lock.isFair() + &quot;) + notFull/notEmpty&quot;; }\n\n    private void enqueue(Task t) { ring[tail] = t; tail = (tail + 1) % cap; count++; }\n    private Task dequeue() { Task t = ring[head]; ring[head] = null; head = (head + 1) % cap; count--; return t; }\n}\n\n/**\n * What happens when the buffer is full. THIS is the decision the interviewer changes mid-round, so it is one\n * method behind an interface and is handed in: the buffer, the producer and the consumer never learn its name.\n */\ninterface OverflowPolicy {\n    /** true = the item is in the buffer; false = it was shed and will never be consumed. Announce on out, lock-free. */\n    boolean submit(Handoff h, Task t, Metrics m, PipelineListener out) throws InterruptedException;\n}\n\n/**\n * The default policy, and the honest one: when the buffer is full the producer waits. That wait IS back-pressure\n * -- the consumer&#x27;s slowness travelling backwards up the pipeline -- and it is why memory stays bounded.\n */\nfinal class BlockUntilRoom implements OverflowPolicy {\n    @Override public boolean submit(Handoff h, Task t, Metrics m, PipelineListener out) throws InterruptedException {\n        if (h.offer(t)) return true;                        // the common case: room, no waiting, no bookkeeping\n        m.backpressured.incrementAndGet();\n        out.onEvent(&quot;BACKPRESSURED&quot;, Thread.currentThread().getName() + &quot; parked with &quot; + t + &quot;, buffer full at &quot; + h.capacity());\n        long t0 = System.nanoTime();\n        h.put(t);                                           // park on notFull until a consumer frees a slot\n        m.blockedNanos.addAndGet(System.nanoTime() - t0);\n        return true;\n    }\n}\n\n/**\n * The wrapper the pipeline puts around WHATEVER work it was handed, so the exactly-once count cannot be broken\n * by work written next year: an item counts as consumed only after the work RETURNS, and work that throws goes\n * to the failure policy instead of vanishing. Same shape as the split-checker in the money problems: a Decorator.\n */\nfinal class AccountedWork implements Work {\n    private final Work base;\n    private final Metrics m;\n    private final FailurePolicy onFailure;\n    AccountedWork(Work base, Metrics m, FailurePolicy onFailure) { this.base = base; this.m = m; this.onFailure = onFailure; }\n    @Override public void process(Task t) throws InterruptedException {\n        try {\n            base.process(t);\n        } catch (RuntimeException e) {\n            m.failed.incrementAndGet();\n            onFailure.onFailed(t, e, m);                    // parked, not lost\n            return;\n        }\n        m.consumed.incrementAndGet();                       // counted only after the work actually finished\n    }\n}\n\n/** The default failure policy: park the task in a queue somebody can drain later. Nothing is ever dropped silently. */\nfinal class DeadLetterSink implements FailurePolicy {\n    private final Queue&lt;Task&gt; parked = new ConcurrentLinkedQueue&lt;&gt;();\n    @Override public void onFailed(Task t, RuntimeException cause, Metrics m) {\n        m.deadLettered.incrementAndGet();\n        parked.add(t);\n    }\n    /** The parked tasks, oldest first. A real system would retry these or show them to an operator. */\n    Queue&lt;Task&gt; parked() { return parked; }\n    int size() { return parked.size(); }\n}\n\n/**\n * Makes tasks on its own thread and hands each to the overflow policy. It never touches the lock, never decides\n * what a full buffer means, and stops making items the moment the stop flag is set -- so nothing is added after stop.\n */\nfinal class Producer implements Runnable {\n    private final String name;\n    private final int baseId, count;\n    private final Handoff handoff;\n    private final OverflowPolicy policy;\n    private final Metrics m;\n    private final PipelineListener out;\n    private final AtomicBoolean stopped;\n    private final CountDownLatch gate;\n    Producer(String name, int baseId, int count, Handoff handoff, OverflowPolicy policy, Metrics m,\n             PipelineListener out, AtomicBoolean stopped, CountDownLatch gate) {\n        this.name = name; this.baseId = baseId; this.count = count; this.handoff = handoff;\n        this.policy = policy; this.m = m; this.out = out; this.stopped = stopped; this.gate = gate;\n    }\n    @Override public void run() {\n        try {\n            gate.await();                                   // every thread starts at the same instant: a real race\n            for (int i = 0; i &lt; count; i++) {\n                if (stopped.get()) return;                  // no item is even created after stop\n                Task t = new Task(baseId + i, name + &quot;:&quot; + i);\n                m.produced.incrementAndGet();\n                if (policy.submit(handoff, t, m, out)) {\n                    m.admitted.incrementAndGet();           // counted only once it is IN the buffer\n                } else {\n                    m.dropped.incrementAndGet();\n                    out.onEvent(&quot;DROPPED&quot;, name + &quot; shed &quot; + t);\n                }\n                m.observeDepth(handoff.size());\n            }\n        } catch (InterruptedException e) {\n            m.abandoned.incrementAndGet();                  // made but never handed over: the ledger says so\n            Thread.currentThread().interrupt();             // restore the flag, then end the thread\n        }\n    }\n}\n\n/**\n * Takes tasks and does the work. It stops on the POISON pill it takes out of the buffer, never on a flag it\n * polls, so every real task queued ahead of that pill is processed first. An interrupt is not a shutdown: if one\n * arrives with a task in hand, that task goes to the failure policy rather than disappearing with the thread.\n */\nfinal class Consumer implements Runnable {\n    private final String name;\n    private final Handoff handoff;\n    private final Work work;\n    private final Metrics m;\n    private final FailurePolicy onFailure;\n    private final CountDownLatch gate;\n    Consumer(String name, Handoff handoff, Work work, Metrics m, FailurePolicy onFailure, CountDownLatch gate) {\n        this.name = name; this.handoff = handoff; this.work = work; this.m = m; this.onFailure = onFailure; this.gate = gate;\n    }\n    @Override public void run() {\n        Task inHand = null;\n        try {\n            gate.await();\n            for (;;) {\n                inHand = handoff.take();                    // parks on notEmpty while the buffer is empty\n                if (inHand == Task.POISON) {                // identity, not equals: only the real pill stops us\n                    m.pillsTaken.incrementAndGet();\n                    inHand = null;\n                    return;\n                }\n                m.inFlight.incrementAndGet();\n                work.process(inHand);\n                m.inFlight.decrementAndGet();\n                inHand = null;\n            }\n        } catch (InterruptedException e) {\n            if (inHand != null) {\n                m.inFlight.decrementAndGet();\n                m.failed.incrementAndGet();\n                onFailure.onFailed(inHand, new IllegalStateException(name + &quot; interrupted holding &quot; + inHand), m);\n            }\n            Thread.currentThread().interrupt();\n        }\n    }\n}\n\n/** The pipeline&#x27;s life. DRAINING is the interesting one: producers have stopped, the backlog has not. */\nenum PipelineState { NEW, RUNNING, DRAINING, TERMINATED }\n\n/**\n * The aggregate root: it owns the hand-off, the threads, the counters and the life cycle, and it is the only\n * class that knows the shutdown protocol. One lock, and it guards the life cycle only -- the hand-off has its\n * own. Every rule it uses is handed in through configure(); it builds none of them.\n */\nfinal class Pipeline {\n    private final Handoff handoff;\n    private final Metrics metrics = new Metrics();\n    private final ReentrantLock lock = new ReentrantLock();      // guards state + the two thread lists, nothing else\n    private final List&lt;PipelineListener&gt; listeners = new CopyOnWriteArrayList&lt;&gt;();\n    private final List&lt;Thread&gt; producerThreads = new ArrayList&lt;&gt;();\n    private final List&lt;Thread&gt; consumerThreads = new ArrayList&lt;&gt;();\n    private final AtomicBoolean stopped = new AtomicBoolean();\n    private final CountDownLatch gate = new CountDownLatch(1);   // released once every thread exists\n    private PipelineState state = PipelineState.NEW;\n    private OverflowPolicy policy = new BlockUntilRoom();\n    private Work work = t -&gt; { };\n    private FailurePolicy onFailure = new DeadLetterSink();\n    private Clock clock = System::currentTimeMillis;\n\n    Pipeline(Handoff handoff) { this.handoff = handoff; }\n\n    /** The three rules, handed in. The pipeline never constructs a policy, a work function or a failure rule. */\n    void configure(OverflowPolicy policy, Work work, FailurePolicy onFailure) {\n        lock.lock();\n        try {\n            if (state != PipelineState.NEW) throw new IllegalStateException(&quot;configure before start; this pipeline is &quot; + state);\n            this.policy = policy; this.work = work; this.onFailure = onFailure;\n        } finally { lock.unlock(); }\n    }\n    /** Add a listener. It is called after the fact and outside every lock. */\n    void addListener(PipelineListener l) { listeners.add(l); }\n    /** Hand in a clock, so a test can decide what a shutdown deadline means. */\n    void setClock(Clock c) { clock = c; }\n\n    /** The single listener everything else is given: it fans out, and a listener that throws is swallowed here. */\n    private final PipelineListener fanout = (event, detail) -&gt; {\n        for (PipelineListener l : listeners) {\n            try { l.onEvent(event, detail); } catch (RuntimeException ignored) { /* a broken listener is not an outage */ }\n        }\n    };\n\n    /**\n     * Create the threads under the lock, start them outside it, then open the gate so all of them begin at the\n     * same instant. Consumers are created first so they are already parked on notEmpty when work starts arriving.\n     */\n    void start(int producers, int itemsEach, int consumers) {\n        lock.lock();\n        try {\n            if (state != PipelineState.NEW) throw new IllegalStateException(&quot;start() once, from NEW; this pipeline is &quot; + state);\n            Work counted = new AccountedWork(work, metrics, onFailure);     // the wrapper that guards the count\n            for (int c = 0; c &lt; consumers; c++) {\n                Runnable r = new Consumer(&quot;consumer-&quot; + c, handoff, counted, metrics, onFailure, gate);\n                consumerThreads.add(new Thread(r, &quot;consumer-&quot; + c));\n            }\n            for (int p = 0; p &lt; producers; p++) {\n                Runnable r = new Producer(&quot;producer-&quot; + p, p * itemsEach, itemsEach, handoff, policy, metrics, fanout, stopped, gate);\n                producerThreads.add(new Thread(r, &quot;producer-&quot; + p));\n            }\n            state = PipelineState.RUNNING;\n        } finally { lock.unlock(); }\n        for (Thread t : consumerThreads) t.start();\n        for (Thread t : producerThreads) t.start();\n        gate.countDown();\n        fanout.onEvent(&quot;STATE&quot;, &quot;RUNNING: &quot; + producers + &quot; producers x &quot; + itemsEach + &quot; items, &quot; + consumers\n            + &quot; consumers, capacity &quot; + handoff.capacity() + &quot;, hand-off = &quot; + handoff.name());\n    }\n\n    /**\n     * Wait for the producers to finish the work they planned, without telling them to stop. This is the normal\n     * end of a run: the source is exhausted, and only then does the drain begin. Bounded: false means the deadline passed.\n     */\n    boolean awaitProducers(long timeoutMs) throws InterruptedException {\n        long deadline = clock.nowMs() + timeoutMs;\n        for (Thread t : producerThreads) {\n            long left = deadline - clock.nowMs();\n            if (left &lt;= 0L) return false;\n            t.join(left);\n            if (t.isAlive()) return false;\n        }\n        return true;\n    }\n\n    /**\n     * The shutdown protocol, in the order that makes it safe:\n     * 1. flip to DRAINING and set the stop flag, so no producer starts another item;\n     * 2. join the producers -- after this line nobody can add anything, which is what makes step 3 sound;\n     * 3. put exactly one POISON pill per consumer; FIFO puts every pill behind eve

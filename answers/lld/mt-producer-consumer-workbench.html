<div class="top"><h1>Producer-Consumer</h1><span class="sub">LLD &middot; Java &middot; OpenJDK 21: demo, 13 failure tests and a 10x10 exactly-once race pass</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Build a producer-consumer pipeline. Several threads produce work, several threads consume it, and a fixed-size buffer sits between them. When the consumers fall behind, the producers must feel it; when the run is over, nothing may be left in the buffer and no thread may be left alive. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>One side of the program makes work &mdash; rows off a socket, images to resize, events to index &mdash; and the other side does it, and the two sides run at different speeds on different threads. Between them sits a buffer with a fixed number of slots. If the makers are faster, the buffer fills, and something has to happen: the makers wait, or work gets thrown away. That choice is the whole design, and the wrong answer is an unbounded queue, which does not remove the problem but converts a slow consumer into an out-of-memory crash an hour later. The second half of the problem is stopping: when the source is exhausted, every item already in the buffer still has to be processed, and every thread has to actually end &mdash; not be killed, not be left parked forever. The one thing that must always be true is arithmetic: every item produced is consumed exactly once, never twice, never zero times.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile, and a <code>main</code> that starts ten producers and ten consumers and prints counts that add up. The interviewer is watching for, in this order: the questions you ask before typing (what happens when it is full, and must shutdown drain, are the first two); which classes exist and which one owns the buffer; the hand-off end to end; the race, written as a wait protocol rather than a lock sprinkled on top &mdash; check under the lock, wait in a <code>while</code> loop, signal after the change; where the rule that will change (what a full buffer means) lives; and the shutdown &mdash; both of them &mdash; which is where most candidates lose the round. Then the twists: per-key order, batching, many stages, a pool instead of threads, and what changes the day this crosses a process boundary.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 338\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">produce</text><g transform=\"translate(175 26)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a producer thread makes a task</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">on its own thread, at its own speed</text></g><path d=\"M415 53 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 26)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ask the overflow policy</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">block, shed, or give up</text></g><path d=\"M675 53 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 26)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hand it over under the lock</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">in the buffer before it is counted</text></g><path d=\"M935 53 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 26)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">count it admitted</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">exactly once, and never before</text></g><text x=\"88\" y=\"181\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">consume</text><g transform=\"translate(175 150)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take: sleep while empty</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no spinning, no burnt core</text></g><path d=\"M415 177 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 150)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">do the slow work</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">milliseconds, outside every lock</text></g><path d=\"M675 177 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 150)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">count it consumed</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">only after the work returned</text></g><path d=\"M935 177 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 150)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">it threw? park it</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a dead-letter, never a loss</text></g><path d=\"M815 80 V92\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(560 92)\"><rect width=\"510\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"255.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">buffer full: the producer parks, or the item is shed</text></g><text x=\"88\" y=\"232\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">stop</text><text x=\"175\" y=\"232\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">shutdown(ms): producers stop and are joined, then one pill per consumer goes in behind every real task; each consumer drains and ends</text><text x=\"88\" y=\"258\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">stop now</text><text x=\"175\" y=\"258\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">shutdownNow(ms): every thread is interrupted, and whatever is still in the buffer is handed BACK to the caller as a list</text><text x=\"88\" y=\"284\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"284\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">stats(), at any moment, without stopping anything: how deep is the buffer? how many produced, admitted, consumed, dropped, parked?</text><text x=\"615\" y=\"322\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">many producers and many consumers on one buffer: every item is consumed exactly once, and the buffer never holds more than its capacity</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>When the buffer is full, do producers wait, or do we drop? Is any loss acceptable?</td><td>Producers wait; loss is a policy you can switch on</td><td>The full-buffer rule behind a one-method interface (move 3)</td></tr><tr><td>What capacity, and how much faster are the producers?</td><td>A small capacity, producers faster &mdash; so it fills</td><td>Whether back-pressure is visible at all; the numbers in move 8</td></tr><tr><td>On shutdown, must queued work be finished, or must we stop this second?</td><td>Both: a drained stop, and a stop-now that hands the backlog back</td><td>Poison pills and the order of the protocol, plus shutdownNow (move 6)</td></tr><tr><td>Do we need strict global order, or only order within a key?</td><td>FIFO in the buffer; no promise across producers</td><td>One queue, or one lane per key (moves 5, 12)</td></tr><tr><td>How many producers and consumers, and are they threads or a pool?</td><td>A thread each for now; a pool is a follow-up</td><td>Whether the code reads plainly; who owns the threads (move 2)</td></tr><tr><td>What happens when processing a task throws?</td><td>Park it in a dead-letter queue and keep going</td><td>A failure rule handed in, not a try/catch buried in the consumer (moves 3, 9)</td></tr><tr><td>Am I allowed to use <code>java.util.concurrent</code>, or do you want it hand-built?</td><td>Hand-built buffer, then say what the JDK already gives you</td><td>Whether you write the wait protocol or call <code>ThreadPoolExecutor</code> (moves 8, 12)</td></tr><tr><td>One JVM, or is this a real queue between processes?</td><td>One JVM, in memory</td><td>No durability yet; a crash loses the buffer (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Many producer threads make items; many consumer threads process them; one bounded buffer sits between.</li>\n<li>A consumer with nothing to do sleeps until work arrives, and wakes the instant it does.</li>\n<li>When the buffer is full the producer waits &mdash; that wait is back-pressure, and it is a feature.</li>\n<li>The full-buffer decision is swappable: block, drop the newest, evict the oldest, or give up after a deadline.</li>\n<li>Two shutdowns: the drained one (everything queued is still processed) and the stop-now one, which interrupts the threads and hands the unprocessed work back to the caller.</li>\n<li>Work that throws does not vanish: it is parked in a dead-letter queue and counted.</li>\n<li>Counters an operator can read: produced, admitted, dropped, consumed, depth, park events, blocked time.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Every item produced is consumed exactly once: none lost, none done twice.</li>\n<li>The buffer never holds more than its capacity, for a single instant, under any number of threads.</li>\n<li>Memory is O(capacity) whatever the arrival rate &mdash; an unbounded queue is an out-of-memory crash on a delay.</li>\n<li>put and take are O(1), nothing slow runs inside the lock, and a waiting thread costs no CPU: it sleeps, it does not spin.</li>\n<li>No producer and no consumer is starved: every thread that waits is eventually served, and the page says what that costs.</li>\n<li>Shutdown is bounded: it returns with an answer, it never hangs.</li>\n<li>In memory, one JVM, no durability (say it; a crash loses the buffer &mdash; a follow-up adds the seam).</li></ul></div></div>\n<div class=\"move\"><h3>One run, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 180\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"105\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 0 ms   the gate opens</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">3 producers, 2 consumers, capacity 4</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">both consumers asleep on notEmpty</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one latch releases all five at once</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"105\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 6 ms   the buffer is full</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">producer-2 parks holding task#44</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">about 50 park events in 60 items</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">memory stops growing</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"105\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 112 ms   producers done</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">4 items still in the buffer</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">producers joined, then 2 pills in</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">RUNNING -> DRAINING</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"105\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 120 ms   TERMINATED</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">produced 60, admitted 60, done 60</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">depth 0, pills 2, threads alive 0</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the ledger balances</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> the buffer is bounded and a full buffer parks the producer, because the bound is the safety property; the full-buffer rule is handed in, so \"never stall\" is a one-line change; shutdown drains &mdash; producers are joined first, then one poison pill per consumer &mdash; and the stop-now variant hands the backlog back instead of dropping it; every wait is a <code>while</code> loop under the lock, and nothing slow runs inside it; counters are atomic, not lock-protected. Named as out of scope: durability across a crash, per-key ordering, batching, a consumer pool &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">The same twelve moves as every other page, but on a threading problem three of them carry the round: move 4 becomes a wait protocol rather than just a lock, move 6 becomes three orders &mdash; the order inside the hand-off and the order of each of the two shutdowns &mdash; and move 7 has to answer who goes next. The buffer itself gets one build here; the sibling page, Bounded Blocking Queue, is where it is built four ways. Nothing is chosen up front, and nothing is named before the move that produced it.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class \u2014 and one of them is where two threads meet.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 225\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PRODUCERS make TASKS; a bounded BUFFER holds them; CONSUMERS take them and do WORK; a PIPELINE starts and stops it all; COUNTERS say it added up</text><g transform=\"translate(24 110)\"><rect width=\"158\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"79.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Task</text><text x=\"79.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">id and payload</text></g><path d=\"M103.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(196 110)\"><rect width=\"176\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"88.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Producer</text><text x=\"88.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">its own id range</text></g><path d=\"M284.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(386 110)\"><rect width=\"200\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Handoff (buffer)</text><text x=\"100.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the meeting point</text></g><path d=\"M486.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(600 110)\"><rect width=\"176\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"88.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Consumer</text><text x=\"88.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what it holds now</text></g><path d=\"M688.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(790 110)\"><rect width=\"176\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"88.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Pipeline</text><text x=\"88.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">threads, state</text></g><path d=\"M878.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(980 110)\"><rect width=\"110\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"55.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Work rule</text><text x=\"55.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state</text></g><path d=\"M1035.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1104 110)\"><rect width=\"106\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"53.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">POISON</text><text x=\"53.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one value</text></g><path d=\"M1157.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a rule, or a single reserved value</text><text x=\"615\" y=\"210\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">one noun is not like the others: the buffer is the only place two threads touch the same memory, so it is the only object that needs a lock</text></svg></div><div class=\"move\"><p>Reading the paragraph again: <b>producers</b> make <b>tasks</b>; a bounded <b>buffer</b> holds them; <b>consumers</b> take them and do <b>work</b>; a <b>pipeline</b> starts and stops the whole thing; <b>counters</b> say afterwards that it added up. A task has an id and a payload and never changes, so it is a small final class. A producer owns its own id range and its own loop; a consumer owns whatever it is holding right now; both hold state, so both are classes. The buffer holds the slots, how many are used, and the threads asleep waiting on it: a class. The work rule holds no state at all &mdash; it is a calculation &mdash; so it is an interface. One noun is genuinely different from the rest: the buffer is the only object two threads touch at the same time, so it is the only one that needs a lock. Writing that sentence down early is most of the design, because it tells you that everything else stays ordinary code.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 288\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(24 20)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">make a task</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M324 42 H384\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(384 20)\"><rect width=\"470\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"235.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Producer  (owns its id range and nothing shared)</text><text x=\"235.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M854 42 H914\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(914 20)\"><rect width=\"292\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"146.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">new Task(baseId + i, ...)</text><text x=\"146.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(24 74)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">decide what a full buffer means</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M324 96 H384\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(384 74)\"><rect width=\"470\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"235.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">OverflowPolicy  (owns no state: pure)</text><text x=\"235.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M854 96 H914\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(914 74)\"><rect width=\"292\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"146.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">policy.submit(h, t, m, out)</text><text x=\"146.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(24 128)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">put it in / take it out</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M324 150 H384\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(384 128)\"><rect width=\"470\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"235.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Handoff  (owns the slots, the lock, the waits)</text><text x=\"235.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M854 150 H914\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(914 128)\"><rect width=\"292\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"146.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">h.put(t)  /  h.take()</text><text x=\"146.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(24 182)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">start, drain, stop, stop NOW</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M324 204 H384\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(384 182)\"><rect width=\"470\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"235.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Pipeline  (owns the threads and the life cycle)</text><text x=\"235.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M854 204 H914\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(914 182)\"><rect width=\"292\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"146.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">start / shutdown / shutdownNow</text><text x=\"146.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"254\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the test for a threading problem: a verb that touches memory two threads can see goes to the ONE class that owns that memory</text><text x=\"615\" y=\"274\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">everything else -- making a task, doing the work, counting -- stays ordinary single-threaded code, which is why it stays readable</text></svg></div><div class=\"move\"><p>\"Make a task\" touches nothing anyone else can see, so it belongs to the producer. \"Decide what a full buffer means\" touches no state either &mdash; it reads a situation and returns a decision &mdash; so it belongs to a pure rule, <code>policy.submit(h, t, m, out)</code>. \"Put it in\" and \"take it out\" touch the slots, the count and the sleeping threads, all of which live in one object, so they belong to the hand-off: <code>h.put(t)</code> and <code>h.take()</code>. \"Start, drain, stop\" touches the threads, the life-cycle state and the counters at once, and only the pipeline sees all three, so <code>shutdown(ms)</code> and <code>shutdownNow(ms)</code> are its methods. The test for a threading problem is the usual one with a clause added: a verb that touches memory two threads can see must go to the one class that owns that memory, and nowhere else. Do that and there is exactly one file where concurrency lives, and one class inside it.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 285\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(24 70)\"><rect width=\"244\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"122.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Pipeline</text><text x=\"122.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(policy, work, onFailure)</text></g><path d=\"M268 115 H312 V38 H360\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(360 16)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">OverflowPolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what a FULL buffer means</text></g><g transform=\"translate(720 16)\"><rect width=\"486\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"243.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BlockUntilRoom / DropNewest / DropOldest / TimedBlock</text><text x=\"243.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M720 38 H660\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M268 115 H312 V92 H360\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(360 70)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Work</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what a consumer actually does</text></g><g transform=\"translate(720 70)\"><rect width=\"486\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"243.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">any lambda: resize, index, charge a card</text><text x=\"243.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M720 92 H660\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M268 115 H312 V146 H360\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(360 124)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FailurePolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what a THROWN task means</text></g><g transform=\"translate(720 124)\"><rect width=\"486\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"243.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DeadLetterSink / BoundedDeadLetters / retry-then-park</text><text x=\"243.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M720 146 H660\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M268 115 H312 V200 H360\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(360 178)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PipelineListener</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who is told, after the fact</text></g><g transform=\"translate(720 178)\"><rect width=\"486\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"243.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a log line, a metric, a dashboard, a lambda</text><text x=\"243.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M720 200 H660\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The pipeline never builds a rule, so \"the feed must never stall\" is one new class and one changed line</text><text x=\"615\" y=\"270\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one rule wraps the others: AccountedWork(work) does the exactly-once counting for EVERY work function, including the ones written next year</text></svg></div><div class=\"move\"><p>What a full buffer means will change; it is the first thing they change. What a consumer actually does will change. What a thrown task means will change. Who gets told will change. So each is a one-method interface the pipeline is <i>given</i> in <code>configure()</code> and never builds: <code>OverflowPolicy</code>, <code>Work</code>, <code>FailurePolicy</code>, <code>PipelineListener</code>. This is where the patterns come from, not the other way round. A swappable rule behind an interface is <b>Strategy</b>, and it is why \"the feed must never stall\" is one new class and one changed line rather than surgery on tested concurrency code. A rule that wraps another rule and adds to it is <b>Decorator</b>: <code>AccountedWork</code> wraps whatever work it is handed and does the counting itself, so an item counts as consumed only after the work returns, and work that throws goes to the failure policy instead of vanishing. A pipeline that announces \"a producer parked\" without knowing what a dashboard is, is <b>Observer</b>. I do them; I do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many threads change at once gets one owner and one lock \u2014 then mind the two gaps.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 414\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"24\" y=\"32\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">two producer threads, one buffer of 8 holding 7, no lock</text><text x=\"24\" y=\"78\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--acc)\">producer-1</text><path d=\"M104 73 H700\" stroke=\"var(--line)\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/><text x=\"24\" y=\"126\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--acc)\">producer-2</text><path d=\"M104 121 H700\" stroke=\"var(--line)\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/><g transform=\"translate(120 56)\"><rect width=\"130\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"65.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reads count = 7</text></g><g transform=\"translate(260 104)\"><rect width=\"130\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"65.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reads count = 7</text></g><g transform=\"translate(400 56)\"><rect width=\"130\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"65.0\" y=\"11.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">writes slot 7</text><text x=\"65.0\" y=\"27.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">count = 8</text></g><g><rect x=\"540\" y=\"104\" width=\"130\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"#ff6b6b\" stroke-width=\"1.4\"/><text x=\"605\" y=\"120\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#ff6b6b\">writes slot 7</text><text x=\"605\" y=\"133\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#ff6b6b\">count = 9</text></g><path d=\"M104 158 H700\" stroke=\"var(--line)\"/><path d=\"M185 154 V162\" stroke=\"var(--muted)\"/><text x=\"185\" y=\"176\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">t1</text><path d=\"M325 154 V162\" stroke=\"var(--muted)\"/><text x=\"325\" y=\"176\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">t2</text><path d=\"M465 154 V162\" stroke=\"var(--muted)\"/><text x=\"465\" y=\"176\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">t3</text><path d=\"M605 154 V162\" stroke=\"var(--muted)\"/><text x=\"605\" y=\"176\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">t4</text><rect x=\"104\" y=\"192\" width=\"596\" height=\"66\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"402\" y=\"214\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#ff6b6b\">the gap: both threads saw room, so both wrote the same slot.</text><text x=\"402\" y=\"236\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#ff6b6b\">one item is gone for good, and count now says 9 in a buffer of 8.</text><g transform=\"translate(730 40)\"><rect width=\"480\" height=\"170\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the fix: one owner, one lock, two waiting rooms</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the check and the write are ONE step, inside the lock</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">no room? sleep on notFull -- do not spin, do not retry</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">a take frees a slot and signals notFull: one producer wakes</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">an add signals notEmpty: one consumer wakes</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">the wait is a while loop, because the slot can be gone again</text><text x=\"14\" y=\"126\" font-size=\"10.5\" fill=\"var(--muted)\">counters stay outside: single increments, so AtomicLong</text></g><text x=\"970\" y=\"240\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the lock lives where the shared state lives: inside the hand-off.</text><text x=\"970\" y=\"260\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the pipeline has its own lock, and it guards the life cycle only.</text><text x=\"24\" y=\"306\" text-anchor=\"start\" font-size=\"12.5\" fill=\"var(--text)\">the second gap, and the one only threading has: the signal arrives BEFORE the wait</text><g transform=\"translate(24 318)\"><rect width=\"268\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"134.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">consumer reads: empty</text><text x=\"134.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no lock held, so the answer is stale</text></g><path d=\"M292 340 H312\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(312 318)\"><rect width=\"268\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"134.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">producer adds + signals</text><text x=\"134.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nobody is waiting: the signal is dropped</text></g><path d=\"M580 340 H600\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(600 318)\"><rect width=\"268\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"134.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">consumer calls wait()</text><text x=\"134.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the item is already in the buffer</text></g><path d=\"M868 340 H888\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g><rect x=\"888\" y=\"318\" width=\"268\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"#ff6b6b\" stroke-width=\"1.4\"/><text x=\"1022\" y=\"336\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#ff6b6b\">asleep, with work waiting</text><text x=\"1022\" y=\"351\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#ff6b6b\">400 ms burnt; a plain wait() = forever</text></g><text x=\"615\" y=\"382\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">that is a LOST WAKEUP. The fix is one line: read the guard and wait while holding the same lock the signaller holds --</text><text x=\"615\" y=\"400\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">await() releases the lock and re-takes it as ONE step, so no signal can slip into the gap. Test 11 forces it and measures it.</text></svg></div><div class=\"move\"><p>Two producers reach a buffer of eight that holds seven. Both read the count, both see room, both write slot seven: one item is gone for good, and the count now says nine in a buffer of eight. The bug is not the write; it is the gap between checking and acting, and the fix is to make those one step inside a lock held by the object that owns the slots. Now the part a parking lot never has. When there is genuinely no room, the producer must not spin and must not retry &mdash; it must sleep, and be woken by whoever makes room. That is a <code>Condition</code>: a queue of sleeping threads attached to the lock. Two of them, because there are two reasons to sleep: producers on <code>notFull</code>, consumers on <code>notEmpty</code>. And that opens the <i>second</i> gap, the one only threading has. If a thread decides \"it is empty\" and then goes to sleep, and the signal arrives in between, the signal is thrown away: a signal wakes whoever is in the wait set at that instant, and at that instant the wait set was empty. That is a <b>lost wakeup</b>, and the thread now sleeps on top of work that is already there. The rule that kills it is one line: read the guard, decide, and wait while holding the same lock the signaller holds &mdash; <code>await()</code> releases the lock and re-takes it as one step, so nothing can slip into the gap. And the wait is a <code>while</code> loop, never an <code>if</code>, for the other reason: between the signal and re-acquiring the lock, another thread can take the slot back, and the JVM is also permitted to wake a waiter for no reason at all (a <b>spurious wakeup</b>). Counters stay outside all of this: single independent increments, so <code>AtomicLong</code>.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 302\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(24 18)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is the next item, oldest first?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M374 37 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 18)\"><rect width=\"480\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Task[] ring + head, tail, count</text><text x=\"240.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M910 37 H966\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(966 18)\"><rect width=\"240\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(24 64)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is there room? is there anything?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M374 83 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 64)\"><rect width=\"480\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one int, count, under the same lock</text><text x=\"240.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M910 83 H966\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(966 64)\"><rect width=\"240\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(24 110)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who is waiting for a slot, or for work?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M374 129 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 110)\"><rect width=\"480\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two Conditions: notFull, notEmpty</text><text x=\"240.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M910 129 H966\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(966 110)\"><rect width=\"240\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) wake, one thread</text></g><g transform=\"translate(24 156)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many produced, consumed, dropped?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M374 175 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 156)\"><rect width=\"480\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one AtomicLong each, no lock at all</text><text x=\"240.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M910 175 H966\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(966 156)\"><rect width=\"240\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) CAS</text></g><g transform=\"translate(24 202)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which ids were processed? (the proof)</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M374 221 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 202)\"><rect width=\"480\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AtomicIntegerArray indexed by task id</text><text x=\"240.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M910 221 H966\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(966 202)\"><rect width=\"240\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><text x=\"615\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the array IS the bound: a fixed ring never grows and never allocates, so \"bounded memory\" is a property of the shape, not of a check</text><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and the two Conditions are a collection too -- each is a queue of sleeping threads, which is why signalling the right one wakes only a thread that can move</text></svg></div><div class=\"move\"><p>\"What is the next item, oldest first?\" is a fixed array used as a ring, with a head, a tail and a count: enqueue and dequeue are three assignments each. \"Is there room? is there anything?\" is that same count, read under the same lock &mdash; one number, one owner, no second source of truth to drift. \"Who is waiting?\" is a collection too, and people forget it: each <code>Condition</code> is a queue of sleeping threads, which is exactly why signalling the right one wakes a thread that can actually move. \"How many produced, consumed, dropped?\" is one <code>AtomicLong</code> per counter and no lock at all, because each is an independent single increment. And the proof the design works is a collection as well: an <code>AtomicIntegerArray</code> indexed by task id, so a test can say every id was seen exactly once. The array is also the bound &mdash; a fixed ring cannot grow, so \"bounded memory\" is a property of the shape rather than of a check somebody might forget to write.</p></div><div class=\"move\"><h3>Move 6: the life cycle is the pipeline's, and the order of operations is the whole of both shutdowns.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 470\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(24 16)\"><rect width=\"192\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"96.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">NEW</text><text x=\"96.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">threads not made</text></g><path d=\"M216 38 H240\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(240 16)\"><rect width=\"192\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"96.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RUNNING</text><text x=\"96.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">hand-off cycling< ext><g transform=\"translate(145 106)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stops making items</text></g><g transform=\"translate(351 106)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DEAD</text></g><g transform=\"translate(557 106)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">--</text></g><g transform=\"translate(763 106)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">--</text></g><g transform=\"translate(969 106)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">--</text></g><text x=\"24\" y=\"176\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--acc)\">buffer</text><g transform=\"translate(145 152)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">4 items</text></g><g transform=\"translate(351 152)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">4 items</text></g><g transform=\"translate(557 152)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">4 items + 2 pills</text></g><g transform=\"translate(763 152)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 pills</text></g><g transform=\"translate(969 152)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">empty</text></g><text x=\"24\" y=\"222\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--acc)\">consumer-1</text><g transform=\"translate(145 198)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">working</text></g><g transform=\"translate(351 198)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">working</text></g><g transform=\"translate(557 198)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">working</text></g><g transform=\"translate(763 198)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">takes its pill</text></g><g transform=\"translate(969 198)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ended</text></g><text x=\"24\" y=\"268\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--acc)\">consumer-2</text><g transform=\"translate(145 244)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">working</text></g><g transform=\"translate(351 244)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">working</text></g><g transform=\"translate(557 244)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">working</text></g><g transform=\"translate(763 244)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">takes its pill</text></g><g transform=\"translate(969 244)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ended</text></g><text x=\"615\" y=\"318\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">joining the producers BEFORE the pills go in is the whole protocol: that is what makes \"the pill sits behind every real task\" true.</text><text x=\"615\" y=\"338\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">swap those two lines and a consumer can stop while work is still arriving. FIFO does the rest: no consumer can reach a pill early.</text><text x=\"24\" y=\"378\" text-anchor=\"start\" font-size=\"12.5\" fill=\"var(--text)\">and the other one, shutdownNow(ms), for the caller who cannot wait for the backlog:</text><g transform=\"translate(24 392)\"><rect width=\"276\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"138.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">interrupt every thread</text><text x=\"138.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a parked put or take wakes and ends</text></g><path d=\"M300 414 H320\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(320 392)\"><rect width=\"276\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"138.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">join, with the same deadline</text><text x=\"138.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">it returns an answer, it never hangs</text></g><path d=\"M596 414 H616\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(616 392)\"><rect width=\"276\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"138.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">drain the ring into a list</text><text x=\"138.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one poll(0) at a time until it is empty</text></g><path d=\"M892 414 H912\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(912 392)\"><rect width=\"276\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"138.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hand it back, count discarded</text><text x=\"138.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">so the ledger still balances</text></g><text x=\"615\" y=\"456\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the difference in one line: shutdown(ms) finishes the backlog, shutdownNow(ms) gives it back. Neither one drops it on the floor.</text></svg></div><div class=\"move\"><p>The pipeline goes NEW, RUNNING, DRAINING, TERMINATED, and DRAINING is the one people forget: producers have stopped, the backlog has not. Three orders have to be right. First the wait protocol, on every hand-off: take the lock, check the condition in a <code>while</code> loop, sleep if it does not hold, make the change, signal the <i>other</i> condition, unlock. Second the drained shutdown, which is where rounds are lost. Set the stop flag, so no producer starts another item. <i>Join the producers</i> &mdash; after that line nothing can be added, and that is what makes the next step sound. Now put exactly one poison pill per consumer into the buffer: because the buffer is FIFO, every pill sits behind every real task, so no consumer can reach one early. Join the consumers; each drains the backlog, takes exactly one pill and ends. Flip to TERMINATED. Reverse the join and the pills and a consumer can stop while work is still arriving. Third, the shutdown the interviewer asks for next: stop <i>now</i>. Interrupt every thread, join them with the same deadline, drain whatever is left in the ring into a list, and hand that list back to the caller, counting each item <code>discarded</code>. The difference in one sentence: <code>shutdown</code> finishes the backlog, <code>shutdownNow</code> gives it back, and neither drops it. Every wait in both protocols takes a deadline, so a shutdown returns with an answer rather than hanging.</p></div><div class=\"move\"><h3>Move 7: yes, the hand-off happens one at a time. Ask for how long, what is inside the lock, and who goes next.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 532\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(24 16)\"><rect width=\"580\" height=\"120\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"290.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about 5 nanoseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">ring[tail] = t;  tail = (tail + 1) % cap;  count++</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">notEmpty.signal()  --  a queue push, not a wake-up</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one put + o

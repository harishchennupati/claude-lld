quot;STATE&quot;, &quot;TERMINATED: &quot; + stats());\n        return true;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; Now stop it this second \u2014 the caller cannot wait for the backlog. What happens to the queued work?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It is handed back, not dropped. <code>shutdownNow(ms)</code> starts the same way &mdash; DRAINING, stop flag &mdash; then interrupts every thread instead of queueing pills, joins them with the same deadline, drains whatever is left in the ring into a list, and returns that list to the caller. Each of those items is counted <code>discarded</code>, which is why the ledger still balances afterwards: they were not lost, they changed owner. An item a consumer was already holding is not in the list &mdash; the interrupt sends that one to the failure policy instead, so it is in the dead-letter queue. The test starts two producers on ten thousand items each, stops after forty milliseconds, and then checks the arithmetic on a run where every column is non-zero &mdash; one run printed 62 admitted = 28 done + 2 dead-lettered + 32 handed back. The columns move every time you run it, which is the point: the test asserts the equation, never the numbers. This is exactly what <code>ExecutorService.shutdownNow()</code> does, and now you know why it returns a <code>List</code>.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The other shutdown: stop NOW and hand back the work that will never run. Same first step -- flip to\n     * DRAINING and set the stop flag -- then interrupt every thread instead of queueing pills, join them with\n     * the same deadline, and drain whatever is left in the buffer into a list the CALLER owns. Those items are\n     * counted discarded, so the ledger still balances: nothing was lost, it was handed over. An item a consumer\n     * was already holding is not in this list; the interrupt sends that one to the failure policy instead.\n     * This is exactly what ExecutorService.shutdownNow() does, and why it returns a List.\n     */\n    List&lt;Task&gt; shutdownNow(long timeoutMs) throws InterruptedException {\n        lock.lock();\n        try {\n            if (state == PipelineState.NEW || state == PipelineState.TERMINATED) {\n                state = PipelineState.TERMINATED; return List.of();\n            }\n            state = PipelineState.DRAINING;\n        } finally { lock.unlock(); }\n        stopped.set(true);\n        for (Thread t : producerThreads) t.interrupt();       // a parked producer wakes with InterruptedException\n        for (Thread t : consumerThreads) t.interrupt();       // a parked consumer wakes and ends\n        long deadline = clock.nowMs() + timeoutMs;\n        for (Thread t : producerThreads) { long left = deadline - clock.nowMs(); if (left &gt; 0L) t.join(left); }\n        for (Thread t : consumerThreads) { long left = deadline - clock.nowMs(); if (left &gt; 0L) t.join(left); }\n        List&lt;Task&gt; undone = new ArrayList&lt;&gt;();\n        for (Task t = handoff.poll(0); t != null; t = handoff.poll(0)) {\n            if (t == Task.POISON) continue;                   // a pill is not work and is not handed back\n            undone.add(t);\n            metrics.discarded.incrementAndGet();\n        }\n        lock.lock();\n        try { state = PipelineState.TERMINATED; } finally { lock.unlock(); }\n        fanout.onEvent(&quot;STATE&quot;, &quot;TERMINATED by shutdownNow: &quot; + undone.size() + &quot; unprocessed items handed back&quot;);\n        return undone;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>5 &middot; Why a poison pill and not a volatile stop flag? Show me the difference.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A pill travels in-band, so FIFO ordering does the reasoning for you: it sits behind every real task, and a consumer physically cannot see it until it has processed everything ahead of it. A flag is out of band, so a consumer can see it while items are still queued and simply walk away &mdash; the test measures exactly that, and the naive version strands all forty items. A flag can be made correct, and the draining version here is the honest one: the flag must mean \"every producer has been joined\", and a consumer exits only when the flag is set AND a timed poll comes back empty. That costs one poll timeout of latency on the way out and needs no pill counting, which is what you want when the consumer count is dynamic. Two costs of pills are worth saying before they are asked: you must know how many consumers there are, and a consumer that dies early leaves its pill sitting in the buffer. And FIFO is load-bearing &mdash; the day somebody swaps the ring for a priority queue, the pill must be forced to sort last or the consumers stop with work still queued behind them.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the other shutdown -- a stop flag with a drain, and the version that strands items\n/**\n * The alternative to poison pills. The flag must mean &quot;every producer has been JOINED&quot;, not &quot;producers were\n * asked to stop&quot;: a consumer exits only when the flag is set AND a timed poll comes back empty, which is only\n * safe if nothing can add after the flag. Cost: up to one poll timeout of extra latency on the way out.\n * Benefit: no pills to count, and it works when consumers outnumber the pills you can afford to inject.\n */\nfinal class DrainingConsumer implements Runnable {\n    private final Handoff h;\n    private final AtomicBoolean producersJoined;\n    private final Work work;\n    private final long pollMs;\n    DrainingConsumer(Handoff h, AtomicBoolean producersJoined, Work work, long pollMs) {\n        this.h = h; this.producersJoined = producersJoined; this.work = work; this.pollMs = pollMs;\n    }\n    @Override public void run() {\n        try {\n            for (;;) {\n                Task t = h.poll(pollMs);\n                if (t == null) { if (producersJoined.get()) return; continue; }   // empty AND nothing can arrive\n                work.process(t);\n            }\n        } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n    }\n}\n\n/**\n * The junior version, kept here to be measured rather than argued about: it checks the flag FIRST and exits,\n * so whatever is still in the buffer is stranded. The test counts exactly how many items it abandons.\n */\nfinal class NaiveStopConsumer implements Runnable {\n    private final Handoff h;\n    private final AtomicBoolean stop;\n    private final Work work;\n    NaiveStopConsumer(Handoff h, AtomicBoolean stop, Work work) { this.h = h; this.stop = stop; this.work = work; }\n    @Override public void run() {\n        try {\n            while (!stop.get()) {\n                Task t = h.poll(5);\n                if (t != null) work.process(t);\n            }\n        } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>6 &middot; A consumer is asleep and the buffer is not empty. How did that happen?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Somebody read the guard outside the lock. A signal wakes whoever is in the wait set <i>at that instant</i>; if the thread has decided \"it is empty\" but has not yet called <code>wait()</code>, the wait set is empty, the signal is thrown away, and the thread then sleeps on top of an item that is already there. That is a lost wakeup: with a plain <code>wait()</code> it sleeps forever, and with <code>wait(400)</code> it burns the whole timeout &mdash; which is what the test measures, forcing the interleaving with two latches so the bug shows up on every run instead of at 3 a.m. The fix is one line: read the guard, decide, and wait while holding the same lock the signaller holds, because <code>await()</code> releases the lock and re-takes it as a single step. Separately, the wait must be a <code>while</code> loop and never an <code>if</code>, for two reasons: another thread can take the slot back between the signal and your re-acquisition, and the JVM is allowed to wake a waiter for no reason at all &mdash; a spurious wakeup. The loop re-checks and goes back to sleep, so neither one can turn into a bug. One more sentence if they push: with <code>synchronized</code> there is a single wait set, so <code>notify()</code> can wake a producer when only a consumer could have moved &mdash; you must call <code>notifyAll()</code> and pay for the herd. Two Conditions exist so a signal can be aimed.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the lost wakeup -- the bug that only happens when you check the guard outside the lock\n/**\n * The classic threading bug, written down so it can be measured instead of argued about. This buffer reads the\n * guard (&quot;is it empty?&quot;) with NO lock held and only then takes the monitor to wait. A producer that adds an item\n * and calls notify() in that gap signals an empty wait set: nobody is waiting yet, so the signal is thrown away,\n * and the consumer then goes to sleep on top of an item that is already sitting in the buffer. That is a lost\n * wakeup. With a plain wait() it sleeps forever; with wait(ms) it wastes the whole timeout. The rule that kills\n * it is one line long: read the guard, decide, and wait while HOLDING the same lock the signaller holds.\n * The two latches exist only so a test can land the signal exactly in the gap and get the same answer every run.\n */\nfinal class LostWakeupHandoff {\n    private final ArrayDeque&lt;Task&gt; q = new ArrayDeque&lt;&gt;();\n    /** Counted down after the guard is read and before the wait, so a test knows when the gap is open. */\n    final CountDownLatch guardRead = new CountDownLatch(1);\n    /** The test opens this once it has added an item and signalled, so the wait happens AFTER the signal. */\n    final CountDownLatch signalSent = new CountDownLatch(1);\n\n    /** A correct put: it holds the monitor and signals under it. It is the take that is broken. */\n    void put(Task t) { synchronized (this) { q.addLast(t); notify(); } }\n\n    /** The broken take. Step 1 reads the guard outside the lock, so the answer is stale by step 3. */\n    Task takeLosingWakeups(long waitMs) throws InterruptedException {\n        boolean empty;\n        synchronized (this) { empty = q.isEmpty(); }      // 1. the guard is read, and the lock is RELEASED\n        guardRead.countDown();\n        signalSent.await(3, TimeUnit.SECONDS);            // 2. the put and the notify land in this gap\n        synchronized (this) {\n            if (empty) wait(waitMs);                      // 3. sleeps, although the item is already here\n            return q.pollFirst();\n        }\n    }\n    int size() { synchronized (this) { return q.size(); } }\n}\n\n// 11. the lost wakeup: a signal that lands between the check and the wait is thrown away.\n        //     The interleaving is forced with two latches, so the bug shows up on every run instead of at 3 a.m.\n        LostWakeupHandoff broken = new LostWakeupHandoff();\n        long[] slept = new long[1];\n        Thread victim = new Thread(() -&gt; {\n            try {\n                long t0 = System.currentTimeMillis();\n                broken.takeLosingWakeups(400);\n                slept[0] = System.currentTimeMillis() - t0;\n            } catch (InterruptedException ignored) { }\n        }, &quot;lost-wakeup-victim&quot;);\n        victim.start();\n        check(broken.guardRead.await(2, TimeUnit.SECONDS), &quot;the broken take read the guard and released the lock&quot;);\n        broken.put(new Task(5, &quot;arrives in the gap&quot;));        // add + notify with nobody in the wait set yet\n        broken.signalSent.countDown();                        // only now does the victim call wait()\n        victim.join(3_000);\n        check(!victim.isAlive() &amp;&amp; slept[0] &gt;= 300,\n            &quot;checking the guard OUTSIDE the lock loses the wakeup: the item was already there, and the take still &quot;\n            + &quot;slept &quot; + slept[0] + &quot; ms (with a plain wait() it would sleep forever)&quot;);\n        //     the same race against the real hand-off: await() releases the lock atomically, so no signal is lost.\n        Handoff correct = new LockHandoff(4);\n        CountDownLatch got = new CountDownLatch(1);\n        Thread waiter = new Thread(() -&gt; { try { correct.take(); got.countDown(); } catch (InterruptedException ignored) { } }, &quot;correct-waiter&quot;);\n        waiter.start();\n        check(waitUntilParked(waiter, 2_000), &quot;a consumer on the real hand-off parks inside the lock&quot;);\n        long beforePut = System.currentTimeMillis();\n        correct.put(new Task(6, &quot;same race&quot;));\n        check(got.await(2, TimeUnit.SECONDS) &amp;&amp; System.currentTimeMillis() - beforePut &lt; 500,\n            &quot;and it is woken at once, because await() releases the lock and re-takes it as one step&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; One of my producers is never getting in. Is your lock fair?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Answer it with a measurement, not a boolean. Who goes next is decided by the <code>Condition</code>, not by the lock: a producer that finds no room parks on <code>notFull</code>, and a Condition's wait set is served first-in-first-out, so parked producers are woken in the order they fell asleep. Lock fairness only stops a thread arriving at <code>lock()</code> from barging past one that was already woken. The probe runs four producers through a buffer of one for 120 milliseconds. The default unfair lock gave each producer about seven thousand items, a spread of 1.00 on every run. Then the part worth saying out loud, because it is the opposite of the textbook answer: <code>new ReentrantLock(true)</code> made it <i>worse</i> &mdash; 3x on a good run, 31x on a bad one, once 11,460x when one producer got a single item &mdash; and pushed a fifth to a third fewer items through, because every hand-over becomes a context switch. The reason is the one above: these producers are parked on a Condition, not queued at <code>lock()</code>, so lock fairness never touches them. It buys neither the invariant nor, here, the spread. The starvation that does bite a pipeline is a different one: head-of-line blocking, where one slow key or one slow lane holds up everything behind it &mdash; and that is fixed with lanes, not with a fair lock.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: fairness and starvation -- measured, because &quot;is it fair?&quot; is a question about numbers\n/**\n * Starvation is not a theory, it is a spread. N producers push through a buffer of ONE for a fixed window; the\n * probe returns how many items each of them got through. The answer surprises people, so measure before you\n * claim: the DEFAULT unfair lock comes out dead even here, a spread of 1.00. A producer that finds the buffer\n * full never fights for the lock at all -- it parks on the notFull Condition, and a Condition&#x27;s wait set is\n * served first-in-first-out, so the order producers fell asleep in IS the order they are served in. Lock\n * fairness governs only threads arriving at lock() itself, which on this design is the instant after a\n * wake-up. So new ReentrantLock(true) does not buy the even counts -- it scatters them (spreads from 3x to\n * over 1000x, run to run) and pushes a fifth to a third fewer items through, because every hand-over becomes\n * a context switch. Correctness is identical either way. Fairness is a knob you turn on a measurement.\n */\nfinal class FairnessProbe {\n    /** Returns one count per producer: how many items each got through the buffer inside the window. */\n    static long[] run(boolean fair, int producers, long windowMs) throws InterruptedException {\n        Handoff h = new LockHandoff(1, fair);\n        long[] counts = new long[producers];                  // index k is written only by producer k\n        AtomicBoolean stop = new AtomicBoolean();\n        CountDownLatch gate = new CountDownLatch(1);          // all producers start at the same instant\n        Thread consumer = new Thread(() -&gt; {\n            try { for (;;) if (h.take() == Task.POISON) return; } catch (InterruptedException ignored) { }\n        }, &quot;probe-consumer&quot;);\n        consumer.start();\n        Thread[] ps = new Thread[producers];\n        for (int i = 0; i &lt; producers; i++) {\n            final int k = i;\n            ps[k] = new Thread(() -&gt; {\n                try { gate.await(); while (!stop.get()) { h.put(new Task(k, &quot;probe&quot;)); counts[k]++; } }\n                catch (InterruptedException ignored) { }\n            }, &quot;probe-producer-&quot; + k);\n        }\n        for (Thread t : ps) t.start();\n        gate.countDown();\n        Thread.sleep(windowMs);\n        stop.set(true);\n        for (Thread t : ps) { t.join(2_000); t.interrupt(); }  // a producer parked on a full buffer is woken\n        h.put(Task.POISON);\n        consumer.join(2_000);\n        return counts;\n    }\n    /** max / min: 1.0 is perfectly even, and a big number is the shape of starvation. */\n    static double spread(long[] counts) {\n        long min = Long.MAX_VALUE, max = 0;\n        for (long c : counts) { min = Math.min(min, c); max = Math.max(max, c); }\n        return min == 0 ? Double.POSITIVE_INFINITY : (double) max / min;\n    }\n}\n\n// 13. fairness and starvation, measured: 4 producers through a buffer of ONE for 120 ms.\n        //     The surprise is that the UNFAIR lock is the even one here -- because a producer that finds the buffer\n        //     full parks on the notFull Condition, and a Condition&#x27;s wait set is served first-in-first-out. So the\n        //     two things worth asserting are the even spread and the price of the fair lock, not the fair spread.\n        long[] unfair = FairnessProbe.run(false, 4, 120);\n        long[] fair = FairnessProbe.run(true, 4, 120);\n        long unfairTotal = 0, fairTotal = 0;\n        for (long c : unfair) unfairTotal += c;\n        for (long c : fair) fairTotal += c;\n        double us2 = FairnessProbe.spread(unfair), fs2 = FairnessProbe.spread(fair);\n        check(FairnessProbe.spread(unfair) &lt; 3.0, &quot;no producer is starved by the default lock: counts &quot;\n            + Arrays.toString(unfair) + &quot;, spread &quot; + String.format(&quot;%.2f&quot;, us2) + &quot;x (the notFull queue is FIFO)&quot;);\n        check(fairTotal &lt; unfairTotal, &quot;and new ReentrantLock(true) is paid for in context switches: &quot; + unfairTotal\n            + &quot; items unfair vs &quot; + fairTotal + &quot; fair in the same 120 ms window&quot;);\n        System.out.println(&quot;      the fair lock&#x27;s own spread this run: &quot; + Arrays.toString(fair) + &quot; = &quot;\n            + String.format(&quot;%.2f&quot;, fs2) + &quot;x -- printed, NOT asserted, because it scatters and moves run to run.&quot;\n            + &quot; That is the finding: lock fairness does not govern threads parked on a Condition.&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>8 &middot; A consumer throws on one task. Where does that task go, and do your numbers still add up?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nowhere silently. The pipeline wraps whatever work it was handed in <code>AccountedWork</code>, which is the only place counting happens: the item counts as consumed only after the work returns, and a RuntimeException is caught and handed to the failure policy, which parks it in a dead-letter queue and counts it there. So consumed plus dead-lettered equals admitted, and the test proves it with work that throws on every seventh id: 86 done plus 14 parked equals 100. The same wrapper handles the nastier case &mdash; an interrupt arriving while a consumer holds a task &mdash; by parking what is in hand before the thread ends. Retrying is a decorator on top: <code>RetryingWork</code> tries N times and lets the last failure escape, so the dead-letter path stays the single exit.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The wrapper the pipeline puts around WHATEVER work it was handed, so the exactly-once count cannot be broken\n * by work written next year: an item counts as consumed only after the work RETURNS, and work that throws goes\n * to the failure policy instead of vanishing. Same shape as the split-checker in the money problems: a Decorator.\n */\nfinal class AccountedWork implements Work {\n    private final Work base;\n    private final Metrics m;\n    private final FailurePolicy onFailure;\n    AccountedWork(Work base, Metrics m, FailurePolicy onFailure) { this.base = base; this.m = m; this.onFailure = onFailure; }\n    @Override public void process(Task t) throws InterruptedException {\n        try {\n            base.process(t);\n        } catch (RuntimeException e) {\n            m.failed.incrementAndGet();\n            onFailure.onFailed(t, e, m);                    // parked, not lost\n            return;\n        }\n        m.consumed.incrementAndGet();                       // counted only after the work actually finished\n    }\n}\n\n// ---- ext: a task that keeps failing -- retry a few times, then park it, never lose it\n/**\n * A Decorator on the work, not a change to the consumer: try the real work up to attempts times, and let the\n * last failure escape so the failure policy parks it. The consumer, the buffer and the policy never change.\n */\nfinal class RetryingWork implements Work {\n    private final Work base;\n    private final int attempts;\n    private final AtomicInteger retries = new AtomicInteger();\n    RetryingWork(Work base, int attempts) { this.base = base; this.attempts = attempts; }\n    @Override public void process(Task t) throws InterruptedException {\n        RuntimeException last = null;\n        for (int i = 0; i &lt; attempts; i++) {\n            try { base.process(t); return; }\n            catch (RuntimeException e) { last = e; retries.incrementAndGet(); }\n        }\n        throw last;                                          // AccountedWork turns this into a dead-letter\n    }\n    int retries() { return retries.get(); }\n}\n\n/**\n * A dead-letter sink that is itself a bounded buffer, so a storm of failures cannot become an out-of-memory\n * crash either: the same reasoning that bounded the main hand-off bounds the failure path.\n */\nfinal class BoundedDeadLetters implements FailurePolicy {\n    private final Handoff parked;\n    private final AtomicInteger overflowed = new AtomicInteger();\n    BoundedDeadLetters(int capacity) { parked = new LockHandoff(capacity); }\n    @Override public void onFailed(Task t, RuntimeException cause, Metrics m) {\n        m.deadLettered.incrementAndGet();\n        if (!parked.offer(t)) overflowed.incrementAndGet();   // never block a consumer on the failure path\n    }\n    int size() { return parked.size(); }\n    int overflowed() { return overflowed.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>9 &middot; One lock for the whole hand-off. Does that scale, and would you ship this or use java.util.concurrent?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It scales, and the answer is arithmetic rather than opinion. Inside the lock there is one array write, one index update, one increment and one signal; an uncontended put and take together measure nine to ten nanoseconds on JDK 21 (the <code>HandoffCost</code> probe in Extensions.java is the loop), so the critical section is about five. A million items a second holds the lock ten milliseconds in every second: one per cent busy. The ten-by-ten run pushes twenty thousand items through in thirty to forty-six milliseconds and parks roughly fourteen hundred times, which is the real finding &mdash; the cost is the park-and-wake handshake, not the lock. So the ladder starts with capacity, not cleverness: two hundred thousand items through one producer and one consumer take about 780 ms at capacity one, 50 ms at sixteen and 10 ms at 1024. Then batching, one lock trip for sixty-four items. Then the honest answer to the second half of the question: no, I would not ship the hand-built one. A <code>ThreadPoolExecutor</code> with a bounded <code>ArrayBlockingQueue</code> is this entire page in fifteen lines &mdash; the queue is the hand-off, the pool threads are the consumers, and the <code>RejectedExecutionHandler</code> is the OverflowPolicy: <code>AbortPolicy</code> throws, <code>DiscardPolicy</code> is DropNewest, <code>DiscardOldestPolicy</code> is DropOldest, and <code>CallerRunsPolicy</code> is back-pressure, because the submitting thread has to run the task itself and stops producing while it does. <code>shutdown()</code> plus <code>awaitTermination()</code> is the drained stop and <code>shutdownNow()</code> is the stop-now. What the JDK does not give you is the ledger: no exactly-once counters, no dead-letter queue, no depth metric. That part you still write, and it is the part this page is about.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * And the honest answer to &quot;would you ship this?&quot;: no -- you would ship these fifteen lines. A ThreadPoolExecutor\n * with a BOUNDED queue is this whole page, assembled from the JDK. The mapping is one to one: the\n * ArrayBlockingQueue is the hand-off; the pool threads are the consumers; the RejectedExecutionHandler is the\n * OverflowPolicy (AbortPolicy throws, DiscardPolicy is DropNewest, DiscardOldestPolicy is DropOldest, and\n * CallerRunsPolicy is back-pressure -- the submitting thread runs the task itself and therefore stops producing\n * while it does); shutdown() plus awaitTermination() is the drained shutdown, and shutdownNow() is the stop-now\n * that hands back the work that never ran. What it does NOT give you is the ledger: no exactly-once counters, no\n * dead-letter queue, no depth metric. That is the part you still write, and it is the part this page is about.\n */\nfinal class JdkPipeline {\n    private final ThreadPoolExecutor pool;\n    private final AtomicLong ran = new AtomicLong();\n    JdkPipeline(int workers, int capacity) {\n        pool = new ThreadPoolExecutor(workers, workers, 0L, TimeUnit.MILLISECONDS,\n            new ArrayBlockingQueue&lt;&gt;(capacity), new ThreadPoolExecutor.CallerRunsPolicy());\n    }\n    /** Submitting IS the put: when the queue is full the caller runs the task, which is back-pressure. */\n    void submit(Task t, Work work) {\n        pool.execute(() -&gt; {\n            try { work.process(t); ran.incrementAndGet(); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n    }\n    /** The drained stop: no new work is accepted, everything queued still runs. */\n    boolean drainAndStop(long ms) throws InterruptedException { pool.shutdown(); return pool.awaitTermination(ms, TimeUnit.MILLISECONDS); }\n    /** The stop-now: the tasks that never ran come back to the caller, exactly like Pipeline.shutdownNow(). */\n    List&lt;Runnable&gt; stopNow() { return pool.shutdownNow(); }\n    long ran() { return ran.get(); }\n}\n\n// ---- ext: what the lock actually costs -- the two numbers behind &quot;one lock is not the bottleneck&quot;\n/**\n * Move 8 says the lock is not where the time goes. That is a claim, and a claim you have not run is an opinion,\n * so here are the two measurements behind it. First the floor: one thread alternating put and take on a buffer\n * of sixteen, warmed up so the JIT has compiled it. Nothing is contended, so what is left is the lock, the array\n * write, the index update and the signal -- and it comes out around nine nanoseconds for the pair. Second the\n * capacity ladder: one producer and one consumer pushing the same number of items through buffers of 1, 16 and\n * 1024. A buffer of one forces a park and a wake on nearly every item; a big buffer lets both sides run for long\n * stretches without meeting. The gap between the two is the real cost, and it is the park, not the lock. The\n * numbers move with the machine and the load; the ratio between them does not.\n */\nfinal class HandoffCost {\n    /** Nanoseconds for one put plus one take, single-threaded and uncontended: the floor the lock can reach. */\n    static double uncontendedNanos(int iterations) throws InterruptedException {\n        Handoff h = new LockHandoff(16);\n        Task t = new Task(1, &quot;x&quot;);\n        for (int i = 0; i &lt; 200_000; i++) { h.put(t); h.take(); }      // warm-up: let the JIT compile the loop\n        long t0 = System.nanoTime();\n        for (int i = 0; i &lt; iterations; i++) { h.put(t); h.take(); }\n        return (System.nanoTime() - t0) / (double) iterations;\n    }\n\n    /** Milliseconds to move `items` through a buffer of `capacity` with one producer and one consumer. */\n    static long ladderMs(int capacity, int items) throws InterruptedException {\n        Handoff h = new LockHandoff(capacity);\n        Thread consumer = new Thread(() -&gt; {\n            try { for (;;) if (h.take() == Task.POISON) return; } catch (InterruptedException ignored) { }\n        }, &quot;ladder-consumer&quot;);\n        consumer.start();\n        Task t = new Task(1, &quot;x&quot;);\n        long t0 = System.nanoTime();\n        for (int i = 0; i &lt; items; i++) h.put(t);\n        h.put(Task.POISON);                                            // the same stop signal, in band\n        consumer.join();\n        return (System.nanoTime() - t0) / 1_000_000L;\n    }\n}\n\n// ---- ext: batching -- amortise the hand-off over many items\n/**\n * One lock trip per item is the cost that actually shows up in a profile, not the lock itself. Take one item\n * with a wait, then sweep up whatever is already there without waiting: a burst becomes one batch. A real\n * implementation adds int drainTo(Collection, max) to the buffer and copies the whole ring under ONE lock --\n * that is what ArrayBlockingQueue.drainTo does, and it is why a batching consumer is worth writing.\n */\nfinal class Batches {\n    static List&lt;Task&gt; takeUpTo(Handoff h, int max, long waitMs) throws InterruptedException {\n        List&lt;Task&gt; batch = new ArrayList&lt;&gt;(max);\n        Task first = h.poll(waitMs);\n        if (first == null) return batch;\n        batch.add(first);\n        while (batch.size() &lt; max) {\n            Task t = h.poll(0);\n            if (t == null) break;\n            batch.add(t);\n        }\n        return batch;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Tasks for the same account must be processed in order. And now there are three stages.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One buffer with many consumers gives no per-key ordering at all, so route by a hash of the key into N lanes with one consumer per lane: same key, same lane, same consumer, therefore same order, and no global lock. The price is head-of-line blocking, since one slow key stalls its whole lane. Stages are the other direction: a consumer of one buffer is the producer of the next, and the property that matters is that back-pressure composes &mdash; if the last buffer fills, its stage slows, which fills the buffer feeding it, which slows the stage before it, all the way back to the source. Every stage stays bounded with no coordination between them. The pill travels too: a stage that takes POISON passes one on before it exits, so one injection stops the whole chain in order.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: order per key -- one lane per key, so &quot;same account, same order&quot; survives many consumers\n/**\n * One buffer with many consumers gives you no ordering at all: two tasks for the same account can be processed\n * in either order. Route by a hash of the key into N lanes, one consumer per lane, and order within a key is\n * restored without a global lock. The price is head-of-line blocking: one slow key stalls its whole lane.\n */\nfinal class KeyedLanes {\n    private final Handoff[] lanes;\n    KeyedLanes(int laneCount, int capacityEach) {\n        lanes = new Handoff[laneCount];\n        for (int i = 0; i &lt; laneCount; i++) lanes[i] = new LockHandoff(capacityEach);\n    }\n    /** The lane a key always lands in. Same key, same lane, same consumer, therefore same order. */\n    Handoff laneFor(String key) { return lanes[Math.floorMod(key.hashCode(), lanes.length)]; }\n    int laneCount() { return lanes.length; }\n    Handoff lane(int i) { return lanes[i]; }\n}\n\n// ---- ext: many stages -- back-pressure composes backwards along the whole chain\n/**\n * A consumer of one buffer is the producer of the next. The property that matters: if the LAST buffer fills,\n * its stage slows, which fills the buffer feeding it, which slows the stage before it, all the way back to the\n * source -- so the whole chain has bounded memory, with no coordination between stages. The pill travels too:\n * a stage that takes POISON passes one on before it exits, so one injection stops the entire chain in order.\n */\nfinal class Stage implements Runnable {\n    private final Handoff in, out;\n    private final Work work;\n    private final String name;\n    Stage(String name, Handoff in, Handoff out, Work work) { this.name = name; this.in = in; this.out = out; this.work = work; }\n    @Override public void run() {\n        try {\n            for (;;) {\n                Task t = in.take();\n                if (t == Task.POISON) { if (out != null) out.put(Task.POISON); return; }\n                work.process(t);\n                if (out != null) out.put(t);                 // this put is where back-pressure enters the chain\n            }\n        } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n    }\n    String stageName() { return name; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>11 &middot; Is it actually keeping up? Answer that in O(1), without stopping anything.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Back-pressure is invisible without numbers, so the counters are a product feature, not debug code. Depth, produced, admitted, consumed, dropped, park events and total blocked time are atomic longs read without a lock, and one immutable snapshot gives a monitor a consistent line to print. Two derived numbers earn their place: items per second since the last sample, and how much time producers spent parked &mdash; that second one is the honest measure of whether the consumers are behind. Sustained high depth says add consumers, sustained zero depth says you over-provisioned, and that is exactly the signal an autoscaler uses. It is also the same signal as Kafka consumer lag, which is a good sentence to say out loud: depth is lag, measured in one JVM.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the monitoring surface -- back-pressure is invisible without numbers\n/**\n * Read-only sampling of the counters so a dashboard can see depth, throughput and blocked time without touching\n * the hot path. Two derived numbers earn their place: items per second, and the share of producer time spent\n * parked -- the second one is the honest measure of whether the consumers are keeping up.\n */\nfinal class Monitor {\n    private final Pipeline p;\n    private MetricsSnapshot previous;\n    private long previousMs;\n    Monitor(Pipeline p) { this.p = p; previous = p.stats(); previousMs = System.currentTimeMillis(); }\n    /** One line an operator can read: depth, rate since the last sample, and how much back-pressure there was. */\n    String line() {\n        MetricsSnapshot now = p.stats();\n        long ms = Math.max(1L, System.currentTimeMillis() - previousMs);\n        long rate = (now.consumed() - previous.consumed()) * 1000L / ms;\n        previous = now; previousMs = System.currentTimeMillis();\n        return &quot;depth=&quot; + now.depth() + &quot;/&quot; + p.handoff().capacity() + &quot; consumed/s=&quot; + rate\n            + &quot; dropped=&quot; + now.dropped() + &quot; parkEvents=&quot; + now.backpressured() + &quot; blockedMs=&quot; + now.blockedMs();\n    }\n}\n\n// ---- ext: scale the consumers -- a pool instead of a thread each, and a monitor that watches depth\n/**\n * Thread-per-consumer reads plainly and makes the race visible, which is why the main file uses it. In\n * production the consumers are a sized pool and the number is a decision made from a number: sustained high\n * depth says &quot;add consumers&quot;, sustained zero depth says &quot;you over-provisioned&quot;. Depth IS the lag signal --\n * the same one Kafka calls consumer lag.\n */\nfinal class AutoScaler {\n    private final Handoff h;\n    private final int high, low;\n    private final List&lt;String&gt; decisions = new ArrayList&lt;&gt;();\n    AutoScaler(Handoff h, int highWaterPercent, int lowWaterPercent) {\n        this.h = h; this.high = h.capacity() * highWaterPercent / 100; this.low = h.capacity() * lowWaterPercent / 100;\n    }\n    /** One sample. A real scaler needs several consecutive samples before it acts, or it oscillates. */\n    String sample() {\n        int d = h.size();\n        String decision = d &gt;= high ? &quot;GROW&quot; : d &lt;= low ? &quot;SHRINK&quot; : &quot;HOLD&quot;;\n        decisions.add(decision + &quot;@&quot; + d);\n        return decision;\n    }\n    List&lt;String&gt; decisions() { return decisions; }\n}\n\n/** Consumers as a pool: the same pill protocol works, one pill per worker, submitted after the producers are joined. */\nfinal class PooledConsumers {\n    private final ExecutorService pool;\n    private final int workers;\n    private final Handoff h;\n    PooledConsumers(Handoff h, int workers, Work work, Metrics m, FailurePolicy onFailure) {\n        this.h = h; this.workers = workers;\n        pool = Executors.newFixedThreadPool(workers);\n        CountDownLatch open = new CountDownLatch(0);\n        for (int i = 0; i &lt; workers; i++) pool.execute(new Consumer(&quot;pool-&quot; + i, h, work, m, onFailure, open));\n    }\n    /** Drain and stop: one pill per worker, then a bounded wait. Never Thread.stop, never shutdownNow first. */\n    boolean drainAndStop(long timeoutMs) throws InterruptedException {\n        for (int i = 0; i &lt; workers; i++) h.put(Task.POISON);\n        pool.shutdown();\n        return pool.awaitTermination(timeoutMs, TimeUnit.MILLISECONDS);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Persist it. A crash must not lose the buffer, and now there are two processes.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Then it is not a bounded buffer any more, and the honest answer starts by saying so: everything on this page lives in one JVM and a crash loses whatever is in the ring. The smallest seam that fixes it is a decorator on the hand-off: append the item to a log <i>before</i> handing it over, ack it <i>after</i> the work has succeeded, and redeliver whatever is unacked at restart. That turns delivery into at-least-once rather than exactly-once, so the consumer has to record the ids it has finished and skip duplicates &mdash; the same idempotency key a payment system uses. Across two processes the lock and the Conditions become somebody else's problem: Kafka, SQS or RabbitMQ, where the buffer depth you have been measuring is called consumer lag and the back-pressure you built by blocking is called flow control.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: beyond one JVM -- what an in-memory buffer is not, and the smallest seam that fixes it\n/**\n * A bounded buffer in one process is not a queue: a crash loses everything in it. The seam is an append-then-ack\n * log in front of the hand-off. put() records the item BEFORE handing it over; the consumer acks after the work\n * succeeds; whatever is unacked at restart is redelivered. That makes delivery at-least-once, not exactly-once,\n * so the consumer must be idempotent -- dedupe by task id is the same trick as an idempotency key on a payment.\n */\nfinal class DurableHandoff implements Handoff {\n    private final Handoff base;\n    private final Map&lt;Integer, Task&gt; unacked = new ConcurrentHashMap&lt;&gt;();\n    private final Set&lt;Integer&gt; alreadyDone = ConcurrentHashMap.newKeySet();\n    DurableHandoff(Handoff base) { this.base = base; }\n    @Override public void put(Task t) throws InterruptedException { unacked.put(t.id, t); base.put(t); }\n    @Override public boolean put(Task t, long ms) throws InterruptedException {\n        unacked.put(t.id, t);\n        boolean in = base.put(t, ms);\n        if (!in) unacked.remove(t.id);\n        return in;\n    }\n    @Override public boolean offer(Task t) { unacked.put(t.id, t); boolean in = base.offer(t); if (!in) unacked.remove(t.id); return in; }\n    @Override public Task take() throws InterruptedException { return base.take(); }\n    @Override public Task poll(long ms) throws InterruptedException { return base.poll(ms); }\n    @Override public Task putEvictingOldest(Task t) { unacked.put(t.id, t); return base.putEvictingOldest(t); }\n    @Override public int size() { return base.size(); }\n    @Override public int capacity() { return base.capacity(); }\n    @Override public String name() { return &quot;durable(&quot; + base.name() + &quot;)&quot;; }\n    /** The consumer records the id as done as part of its OWN work, before it acks. */\n    void markDone(Task t) { alreadyDone.add(t.id); }\n    /** Only after the ack may the item leave the log. A crash between markDone and ack causes a redelivery. */\n    void ack(Task t) { unacked.remove(t.id); }\n    /** True if this id was already processed. At-least-once delivery means the consumer must ask. */\n    boolean isDuplicate(Task t) { return alreadyDone.contains(t.id); }\n    /** After a restart: everything not acked goes back in. Some of it will be a second delivery. */\n    int redeliver() throws InterruptedException {\n        int n = 0;\n        for (Task t : new ArrayList&lt;&gt;(unacked.values())) { base.put(t); n++; }\n        return n;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>13 &middot; Where does time come from, what does an interrupt mean, and how do you test a wait without making the test flaky?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Time comes from an injected <code>Clock</code>, and the pipeline uses it only for deadlines and stamps &mdash; which is the honest limit worth stating: you cannot fake the clock a wait actually sleeps on, because the parking is done by the JVM. An interrupt has one meaning here: you own whatever you are holding, so clean it up. A consumer interrupted with a task in hand parks that task in the dead-letter queue, restores the interrupt flag with <code>Thread.currentThread().interrupt()</code> and ends; a producer interrupted mid-put counts the item abandoned so the ledger still closes. Never swallow it, and never keep working after it. So threading tests are written with latches and bounded timeouts instead of sleeps: to prove a full buffer parks a producer, the test starts one, waits until its thread state is WAITING, then asserts a latch has NOT counted down within 200 ms; to prove one take releases it, the same latch must count down within three seconds. Every wait in the file has a bound, so a broken pipeline fails a check rather than hanging the run.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Takes tasks and does the work. It stops on the POISON pill it takes out of the buffer, never on a flag it\n * polls, so every real task queued ahead of that pill is processed first. An interrupt is not a shutdown: if one\n * arrives with a task in hand, that task goes to the failure policy rather than disappearing with the thread.\n */\nfinal class Consumer implements Runnable {\n    private final String name;\n    private final Handoff handoff;\n    private final Work work;\n    private final Metrics m;\n    private final FailurePolicy onFailure;\n    private final CountDownLatch gate;\n    Consumer(String name, Handoff handoff, Work work, Metrics m, FailurePolicy onFailure, CountDownLatch gate) {\n        this.name = name; this.handoff = handoff; this.work = work; this.m = m; this.onFailure = onFailure; this.gate = gate;\n    }\n    @Override public void run() {\n        Task inHand = null;\n        try {\n            gate.await();\n            for (;;) {\n                inHand = handoff.take();                    // parks on notEmpty while the buffer is empty\n                if (inHand == Task.POISON) {                // identity, not equals: only the real pill stops us\n                    m.pillsTaken.incrementAndGet();\n                    inHand = null;\n                    return;\n                }\n                m.inFlight.incrementAndGet();\n                work.process(inHand);\n                m.inFlight.decrementAndGet();\n                inHand = null;\n            }\n        } catch (InterruptedException e) {\n            if (inHand != null) {\n                m.inFlight.decrementAndGet();\n                m.failed.incrementAndGet();\n                onFailure.onFailed(inHand, new IllegalStateException(name + &quot; interrupted holding &quot; + inHand), m);\n            }\n            Thread.currentThread().interrupt();\n        }\n    }\n}\n\n// 5. back-pressure, measured: a full buffer parks the producer, and exactly one take releases it.\n        Handoff full = new LockHandoff(2);\n        full.put(new Task(1, &quot;a&quot;));\n        full.put(new Task(2, &quot;b&quot;));\n        CountDownLatch handedOver = new CountDownLatch(1);\n        Thread blocked = new Thread(() -&gt; {\n            try { full.put(new Task(3, &quot;c&quot;)); handedOver.countDown(); } catch (InterruptedException ignored) { }\n        }, &quot;blocked-producer&quot;);\n        blocked.start();\n        check(waitUntilParked(blocked, 2_000), &quot;the third producer reached a waiting state&quot;);\n        check(!handedOver.await(200, TimeUnit.MILLISECONDS), &quot;its put has NOT returned after 200 ms: that wait is back-pressure&quot;);\n        check(full.size() == 2, &quot;and the buffer is still exactly at its capacity of 2&quot;);\n        full.take();\n        check(handedOver.await(3, TimeUnit.SECONDS), &quot;one take releases the parked producer within 3 s&quot;);\n        blocked.join(3_000);\n        check(!blocked.isAlive() &amp;&amp; full.size() == 2, &quot;the producer finished and the buffer is full again&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Which pattern is where, which SOLID letter is where, and what did NOT earn a place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None of them was chosen up front. Strategy is move 3: what a full buffer means is the rule that changes, so it sits behind a one-method interface handed in through configure. Decorator is the same move's wrapper, AccountedWork, which adds the exactly-once counting to any work function. Observer is move 4's rule that nothing slow runs inside the lock, so listeners are called after the unlock inside a try/catch. State is move 6, four named states checked on entry. The poison pill is a sentinel and, read another way, a Command. For SOLID: S is move 2, one owner per piece of state; O is DropOldest, a new file and one line; L is the strongest evidence on the page, because the same tests pass on both builds of the hand-off; I is five interfaces with one method each; D is configure(), which is why a test can hand in work that throws. Factory did not earn a place, and Singleton earns nothing at all: every test builds its own pipeline, which is exactly what a shared global would take away.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: the rule that changes, behind one method, handed in\ninterface OverflowPolicy { boolean submit(Handoff h, Task t, Metrics m, PipelineListener out) throws InterruptedException; }\npipeline.configure(new DropOldest(), work, new DeadLetterSink());   // &quot;never stall&quot; = one changed line\n\n// Decorator: the exactly-once count belongs to the pipeline, not to the work it was handed\nWork counted = new AccountedWork(work, metrics, onFailure);\n\n// Observer: announced after the unlock, and a broken listener is swallowed\nfor (PipelineListener l : listeners) try { l.onEvent(event, detail); } catch (RuntimeException ignored) { }\n\n// State: four named states, checked on entry, so start() twice throws instead of forking more threads\nenum PipelineState { NEW, RUNNING, DRAINING, TERMINATED }\n\n// Sentinel / Command: the stop instruction travels through the same queue as the work\nstatic final Task POISON = new Task(-1, &quot;poison&quot;);\nif (inHand == Task.POISON) { m.pillsTaken.incrementAndGet(); return; }   // identity, never equals\n\n// Factory: not yet. One line at the call site, chosen once\nHandoff h = new LockHandoff(16);   // or new LockHandoff(16, true) for a fair lock\n\n// Singleton: never. Every test builds its own pipeline, which is the point\nPipeline p = new Pipeline(new LockHandoff(16));\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * One unit of work moving through the pipeline. POISON is a reserved instance that is never real work: it is\n * the stop signal that travels in-band, compared by identity (==), so no payload can ever impersonate it.\n */\nfinal class Task {\n    /** The stop signal. Exactly one per consumer is put into the buffer at shutdown, behind every real task. */\n    static final Task POISON = new Task(-1, \"poison\");\n    final int id;\n    final String payload;\n    Task(int id, String payload) { this.id = id; this.payload = payload; }\n    @Override public String toString() { return \"task#\" + id; }\n}\n\n/** Where time comes from. Injected, so a test can control a deadline. A wait itself is always on the real machine. */\ninterface Clock { long nowMs(); }\n\n/**\n * What a consumer does with one task. Handed in, so a test can make the work slow, make it throw, or make it\n * count. The pipeline never knows what the work is; it only knows when it returned.\n */\ninterface Work {\n    /** Process one task. Throwing a RuntimeException sends the task to the failure policy, never to nowhere. */\n    void process(Task t) throws InterruptedException;\n}\n\n/** What happens to a task whose work threw. Handed in, so the pipeline never silently decides to lose an item. */\ninterface FailurePolicy {\n    /** Called with the failed task. It must either park it somewhere or count it; it must not throw. */\n    void onFailed(Task t, RuntimeException cause, Metrics m);\n}\n\n/** Told after the fact, never with a lock held. A listener that throws cannot break a producer or a consumer. */\ninterface PipelineListener {\n    /** One event: STATE, BACKPRESSURED, DROPPED or DEAD_LETTER, with a human line of detail. */\n    void onEvent(String event, String detail);\n}\n\n/**\n * The hand-off: the one place a producer thread and a consumer thread meet. Every method is safe to call from\n * any thread. Three builds implement it -- synchronized/wait/notify, ReentrantLock with two Conditions, and\n * java.util.concurrent's ArrayBlockingQueue -- and the rest of the pipeline cannot tell which it was given.\n */\ninterface Handoff {\n    /** Hand the item over, waiting while the buffer is full. Returns only when the item IS in the buffer. */\n    void put(Task t) throws InterruptedException;\n    /** The same, but give up after timeoutMs. false means the item was never handed over. */\n    boolean put(Task t, long timeoutMs) throws InterruptedException;\n    /** Hand it over only if there is room this instant. Never waits. */\n    boolean offer(Task t);\n    /** Take the next item, waiting while the buffer is empty. */\n    Task take() throws InterruptedException;\n    /** Take the next item, or null if none arrives within timeoutMs. */\n    Task poll(long timeoutMs) throws InterruptedException;\n    /** Make room by dropping the oldest item, then add. Returns what was dropped, or null if there was room. */\n    Task putEvictingOldest(Task t);\n    /** How many items are in the buffer right now. A number that is already stale when you read it. */\n    int size();\n    /** The bound. Memory is O(capacity) whatever the arrival rate; that bound IS the safety property. */\n    int capacity();\n    /** Which build this is, for the demo line that runs all three. */\n    String name();\n}\n\n/**\n * Counters every thread tallies. These are independent single increments, so they are lock-free AtomicLongs;\n * the buffer needs a multi-step invariant, so it takes a lock. That is the whole rule for choosing between them.\n */\nfinal class Metrics {\n    /** Items created by a producer, counted before the hand-off is attempted. */\n    final AtomicLong produced = new AtomicLong();\n    /** Items that made it into the buffer. Counted only AFTER the hand-off returned. */\n    final AtomicLong admitted = new AtomicLong();\n    /** Items the overflow policy shed on arrival, never handed over at all. */\n    final AtomicLong dropped = new AtomicLong();\n    /** Items that WERE handed over and were later evicted to make room. A different loss, counted separately. */\n    final AtomicLong evicted = new AtomicLong();\n    /** Items created but never handed over, because the producer was interrupted mid-put. */\n    final AtomicLong abandoned = new AtomicLong();\n    /** Items whose work returned normally. */\n    final AtomicLong consumed = new AtomicLong();\n    /** Items whose work threw. */\n    final AtomicLong failed = new AtomicLong();\n    /** Items parked by the failure policy, so a failure is never a disappearance. */\n    final AtomicLong deadLettered = new AtomicLong();\n    /** Items still in the buffer when shutdownNow() was called: handed back to the caller, never run. */\n    final AtomicLong discarded = new AtomicLong();\n    /** How many times a producer found the buffer full and had to wait. This number IS back-pressure. */\n    final AtomicLong backpressured = new AtomicLong();\n    /** How long producers spent parked in total. */\n    final AtomicLong blockedNanos = new AtomicLong();\n    /** Items taken but not yet finished. The ledger balances only when this is zero. */\n    final AtomicInteger inFlight = new AtomicInteger();\n    /** The deepest the buffer was ever seen. It must never exceed the capacity. */\n    final AtomicInteger maxDepth = new AtomicInteger();\n    /** Pills actually taken by consumers. Must equal the consumer count after a clean shutdown. */\n    final AtomicInteger pillsTaken = new AtomicInteger();\n\n    /** Remember the high-water mark of the buffer. Used by the test that proves the bound held. */\n    void observeDepth(int depth) { maxDepth.accumulateAndGet(depth, Math::max); }\n\n    /** An immutable copy a monitor or a dashboard can print without touching the hot path. */\n    MetricsSnapshot snapshot(int depth) {\n        return new MetricsSnapshot(produced.get(), admitted.get(), dropped.get(), evicted.get(), abandoned.get(),\n            consumed.get(), deadLettered.get(), discarded.get(), backpressured.get(), blockedNanos.get() / 1_000_000L,\n            maxDepth.get(), depth, inFlight.get(), pillsTaken.get());\n    }\n}\n\n/**\n * One reading of the counters. The two identities below are the exactly-once promise of the whole design; they\n * are exact at rest (after shutdown) and approximate while threads run, because the fields are read one at a time.\n */\nrecord MetricsSnapshot(long produced, long admitted, long dropped, long evicted, long abandoned, long consumed,\n                       long deadLettered, long discarded, long backpressured, long blockedMs, int maxDepth,\n                       int depth, int inFlight, int pillsTaken) {\n    /**\n     * The exactly-once ledger, in two lines. Every item made was handed over, shed on arrival, or abandoned by an\n     * interrupted producer; and every item handed over was consumed, parked in the dead-letter queue, evicted to\n     * make room, handed back by shutdownNow, still in the buffer, or still in a consumer's hand. Nothing else is\n     * possible, so if these two lines hold, no item was lost and no item was done twice.\n     */\n    boolean balanced() {\n        return produced == admitted + dropped + abandoned\n            && admitted == consumed + deadLettered + evicted + discarded + depth + inFlight;\n    }\n    @Override public String toString() {\n        return \"produced=\" + produced + \" admitted=\" + admitted + \" dropped=\" + dropped + \" evicted=\" + evicted\n            + \" abandoned=\" + abandoned + \" consumed=\" + consumed + \" deadLettered=\" + deadLettered\n            + \" discarded=\" + discarded\n            + \" depth=\" + depth + \" inFlight=\" + inFlight + \" maxDepth=\" + maxDepth\n            + \" backpressured=\" + backpressured + \" blockedMs=\" + blockedMs + \" pills=\" + pillsTaken\n            + \" balanced=\" + balanced();\n    }\n}\n\n/**\n * The hand-off itself: a ReentrantLock and TWO Conditions over a fixed array ring. A Condition is a queue of\n * sleeping threads attached to the lock. Producers sleep on notFull, consumers sleep on notEmpty, so a signal\n * always wakes a thread that can actually make progress. Everything inside the lock is array arithmetic; nothing\n * slow is allowed in. (The sibling page, Bounded Blocking Queue, builds this same object three other ways.)\n */\nfinal class LockHandoff implements Handoff {\n    private final Task[] ring;\n    private final int cap;\n    private int head, tail, count;\n    private final ReentrantLock lock;\n    private final Condition notFull, notEmpty;\n\n    LockHandoff(int capacity) { this(capacity, false); }\n    /**\n     * fair = true hands the lock to the thread that has waited longest, so no producer can be starved by a\n     * neighbour that keeps barging in. It costs throughput, because every hand-over becomes a context switch.\n     */\n    LockHandoff(int capacity, boolean fair) {\n        if (capacity < 1) throw new IllegalArgumentException(\"capacity must be at least 1\");\n        cap = capacity; ring = new Task[capacity];\n        lock = new ReentrantLock(fair);\n        notFull = lock.newCondition();\n        notEmpty = lock.newCondition();\n    }\n    /** Park on notFull while the buffer is full, then add and wake exactly one waiting consumer. */\n    @Override public void put(Task t) throws InterruptedException {\n        lock.lockInterruptibly();\n        try {\n            while (count == cap) notFull.await();\n            enqueue(t);\n            notEmpty.signal();\n        } finally { lock.unlock(); }\n    }\n    /** The timed twin, on awaitNanos: it returns the time LEFT, so the deadline survives a spurious wake-up. */\n    @Override public boolean put(Task t, long timeoutMs) throws InterruptedException {\n        long nanos = TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n        lock.lockInterruptibly();\n        try {\n            while (count == cap) {\n                if (nanos <= 0L) return false;\n                nanos = notFull.awaitNanos(nanos);\n            }\n            enqueue(t); notEmpty.signal(); return true;\n        } finally { lock.unlock(); }\n    }\n    @Override public boolean offer(Task t) {\n        lock.lock();\n        try {\n            if (count == cap) return false;\n            enqueue(t); notEmpty.signal(); return true;\n        } finally { lock.unlock(); }\n    }\n    @Override public Task take() throws InterruptedException {\n        lock.lockInterruptibly();\n        try {\n            while (count == 0) notEmpty.await();\n            Task t = dequeue();\n            notFull.signal();\n            return t;\n        } finally { lock.unlock(); }\n    }\n    @Override public Task poll(long timeoutMs) throws InterruptedException {\n        long nanos = TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n        lock.lockInterruptibly();\n        try {\n            while (count == 0) {\n                if (nanos <= 0L) return null;\n                nanos = notEmpty.awaitNanos(nanos);\n            }\n            Task t = dequeue(); notFull.signal(); return t;\n        } finally { lock.unlock(); }\n    }\n    /** Drop the oldest and add the new one as ONE step under the lock, so the bound can never be exceeded. */\n    @Override public Task putEvictingOldest(Task t) {\n        lock.lock();\n        try {\n            Task evicted = count == cap ? dequeue() : null;\n            enqueue(t);\n            notEmpty.signal();\n            return evicted;\n        } finally { lock.unlock(); }\n    }\n    @Override public int size() { lock.lock(); try { return count; } finally { lock.unlock(); } }\n    @Override public int capacity() { return cap; }\n    @Override public String name() { return \"ReentrantLock(fair=\" + lock.isFair() + \") + notFull/notEmpty\"; }\n\n    private void enqueue(Task t) { ring[tail] = t; tail = (tail + 1) % cap; count++; }\n    private Task dequeue() { Task t = ring[head]; ring[head] = null; head = (head + 1) % cap; count--; return t; }\n}\n\n/**\n * What happens when the buffer is full. THIS is the decision the interviewer changes mid-round, so it is one\n * method behind an interface and is handed in: the buffer, the producer and the consumer never learn its name.\n */\ninterface OverflowPolicy {\n    /** true = the item is in the buffer; false = it was shed and will never be consumed. Announce on out, lock-free. */\n    boolean submit(Handoff h, Task t, Metrics m, PipelineListener out) throws InterruptedException;\n}\n\n/**\n * The default policy, and the honest one: when the buffer is full the producer waits. That wait IS back-pressure\n * -- the consumer's slowness travelling backwards up the pipeline -- and it is why memory stays bounded.\n */\nfinal class BlockUntilRoom implements OverflowPolicy {\n    @Override public boolean submit(Handoff h, Task t, Metrics m, PipelineListener out) throws InterruptedException {\n        if (h.offer(t)) return true;                        // the common case: room, no waiting, no bookkeeping\n        m.backpressured.incrementAndGet();\n        out.onEvent(\"BACKPRESSURED\", Thread.currentThread().getName() + \" parked with \" + t + \", buffer full at \" + h.capacity());\n        long t0 = System.nanoTime();\n        h.put(t);                                           // park on notFull until a consumer frees a slot\n        m.blockedNanos.addAndGet(System.nanoTime() - t0);\n        return true;\n    }\n}\n\n/**\n * The wrapper the pipeline puts around WHATEVER work it was handed, so the exactly-once count cannot be broken\n * by work written next year: an item counts as consumed only after the work RETURNS, and work that throws goes\n * to the failure policy instead of vanishing. Same shape as the split-checker in the money problems: a Decorator.\n */\nfinal class AccountedWork implements Work {\n    private final Work base;\n    private final Metrics m;\n    private final FailurePolicy onFailure;\n    AccountedWork(Work base, Metrics m, FailurePolicy onFailure) { this.base = base; this.m = m; this.onFailure = onFailure; }\n    @Override public void process(Task t) throws InterruptedException {\n        try {\n            base.process(t);\n        } catch (RuntimeException e) {\n            m.failed.incrementAndGet();\n            onFailure.onFailed(t, e, m);                    // parked, not lost\n            return;\n        }\n        m.consumed.incrementAndGet();                       // counted only after the work actually finished\n    }\n}\n\n/** The default failure policy: park the task in a queue somebody can drain later. Nothing is ever dropped silently. */\nfinal class DeadLetterSink implements FailurePolicy {\n    private final Queue<Task> parked = new ConcurrentLinkedQueue<>();\n    @Override public void onFailed(Task t, RuntimeException cause, Metrics m) {\n        m.deadLettered.incrementAndGet();\n        parked.add(t);\n    }\n    /** The parked tasks, oldest first. A real system would retry these or show them to an operator. */\n    Queue<Task> parked() { return parked; }\n    int size() { return parked.size(); }\n}\n\n/**\n * Makes tasks on its own thread and hands each to the overflow policy. It never touches the lock, never decides\n * what a full buffer means, and stops making items the moment the stop flag is set -- so nothing is added after stop.\n */\nfinal class Producer implements Runnable {\n    private final String name;\n    private final int baseId, count;\n    private final Handoff handoff;\n    private final OverflowPolicy policy;\n    private final Metrics m;\n    private final PipelineListener out;\n    private final AtomicBoolean stopped;\n    private final CountDownLatch gate;\n    Producer(String name, int baseId, int count, Handoff handoff, OverflowPolicy policy, Metrics m,\n             PipelineListener out, AtomicBoolean stopped, CountDownLatch gate) {\n        this.name = name; this.baseId = baseId; this.count = count; this.handoff = handoff;\n        this.policy = policy; this.m = m; this.out = out; this.stopped = stopped; this.gate = gate;\n    }\n    @Override public void run() {\n        try {\n            gate.await();                                   // every thread starts at the same instant: a real race\n            for (int i = 0; i < count; i++) {\n                if (stopped.get()) return;                  // no item is even created after stop\n                Task t = new Task(baseId + i, name + \":\" + i);\n                m.produced.incrementAndGet();\n                if (policy.submit(handoff, t, m, out)) {\n                    m.admitted.incrementAndGet();           // counted only once it is IN the buffer\n                } else {\n                    m.dropped.incrementAndGet();\n                    out.onEvent(\"DROPPED\", name + \" shed \" + t);\n                }\n                m.observeDepth(handoff.size());\n            }\n        } catch (InterruptedException e) {\n            m.abandoned.incrementAndGet();                  // made but never handed over: the ledger says so\n            Thread.currentThread().interrupt();             // restore the flag, then end the thread\n        }\n    }\n}\n\n/**\n * Takes tasks and does the work. It stops on the POISON pill it takes out of the buffer, never on a flag it\n * polls, so every real task queued ahead of that pill is processed first. An interrupt is not a shutdown: if one\n * arrives with a task in hand, that task goes to the failure policy rather than disappearing with the thread.\n */\nfinal class Consumer implements Runnable {\n    private final String name;\n    private final Handoff handoff;\n    private final Work work;\n    private final Metrics m;\n    private final FailurePolicy onFailure;\n    private final CountDownLatch gate;\n    Consumer(String name, Handoff handoff, Work work, Metrics m, FailurePolicy onFailure, CountDownLatch gate) {\n        this.name = name; this.handoff = handoff; this.work = work; this.m = m; this.onFailure = onFailure; this.gate = gate;\n    }\n    @Override public void run() {\n        Task inHand = null;\n        try {\n            gate.await();\n            for (;;) {\n                inHand = handoff.take();                    // parks on notEmpty while the buffer is empty\n                if (inHand == Task.POISON) {                // identity, not equals: only the real pill stops us\n                    m.pillsTaken.incrementAndGet();\n                    inHand = null;\n                    return;\n                }\n                m.inFlight.incrementAndGet();\n                work.process(inHand);\n                m.inFlight.decrementAndGet();\n                inHand = null;\n            }\n        } catch (InterruptedException e) {\n            if (inHand != null) {\n                m.inFlight.decrementAndGet();\n                m.failed.incrementAndGet();\n                onFailure.onFailed(inHand, new IllegalStateException(name + \" interrupted holding \" + inHand), m);\n            }\n            Thread.currentThread().interrupt();\n        }\n    }\n}\n\n/** The pipeline's life. DRAINING is the interesting one: producers have stopped, the backlog has not. */\nenum PipelineState { NEW, RUNNING, DRAINING, TERMINATED }\n\n/**\n * The aggregate root: it owns the hand-off, the threads, the counters and the life cycle, and it is the only\n * class that knows the shutdown protocol. One lock, and it guards the life cycle only -- the hand-off has its\n * own. Every rule it uses is handed in through configure(); it builds none of them.\n */\nfinal class Pipeline {\n    private final Handoff handoff;\n    private final Metrics metrics = new Metrics();\n    private final ReentrantLock lock = new ReentrantLock();      // guards state + the two thread lists, nothing else\n    private final List<PipelineListener> listeners = new CopyOnWriteArrayList<>();\n    private final List<Thread> producerThreads = new ArrayList<>();\n    private final List<Thread> consumerThreads = new ArrayList<>();\n    private final AtomicBoolean stopped = new AtomicBoolean();\n    private final CountDownLatch gate = new CountDownLatch(1);   // released once every thread exists\n    private PipelineState state = PipelineState.NEW;\n    private OverflowPolicy policy = new BlockUntilRoom();\n    private Work work = t -> { };\n    private FailurePolicy onFailure = new DeadLetterSink();\n    private Clock clock = System::currentTimeMillis;\n\n    Pipeline(Handoff handoff) { this.handoff = handoff; }\n\n    /** The three rules, handed in. The pipeline never constructs a policy, a work function or a failure rule. */\n    void configure(OverflowPolicy policy, Work work, FailurePolicy onFailure) {\n        lock.lock();\n        try {\n            if (state != PipelineState.NEW) throw new IllegalStateException(\"configure before start; this pipeline is \" + state);\n            this.policy = policy; this.work = work; this.onFailure = onFailure;\n        } finally { lock.unlock(); }\n    }\n    /** Add a listener. It is called after the fact and outside every lock. */\n    void addListener(PipelineListener l) { listeners.add(l); }\n    /** Hand in a clock, so a test can decide what a shutdown deadline means. */\n    void setClock(Clock c) { clock = c; }\n\n    /** The single listener everything else is given: it fans out, and a listener that throws is swallowed here. */\n    private final PipelineListener fanout = (event, detail) -> {\n        for (PipelineListener l : listeners) {\n            try { l.onEvent(event, detail); } catch (RuntimeException ignored) { /* a broken listener is not an outage */ }\n        }\n    };\n\n    /**\n     * Create the threads under the lock, start them outside it, then open the gate so all of them begin at the\n     * same instant. Consumers are created first so they are already parked on notEmpty when work starts arriving.\n     */\n    void start(int producers, int itemsEach, int consumers) {\n        lock.lock();\n        try {\n            if (state != PipelineState.NEW) throw new IllegalStateException(\"start() once, from NEW; this pipeline is \" + state);\n            Work counted = new AccountedWork(work, metrics, onFailure);     // the wrapper that guards the count\n            for (int c = 0; c < consumers; c++) {\n                Runnable r = new Consumer(\"consumer-\" + c, handoff, counted, metrics, onFailure, gate);\n                consumerThreads.add(new Thread(r, \"consumer-\" + c));\n            }\n            for (int p = 0; p < producers; p++) {\n                Runnable r = new Producer(\"producer-\" + p, p * itemsEach, itemsEach, handoff, policy, metrics, fanout, stopped, gate);\n                producerThreads.add(new Thread(r, \"producer-\" + p));\n            }\n            state = PipelineState.RUNNING;\n        } finally { lock.unlock(); }\n        for (Thread t : consumerThreads) t.start();\n        for (Thread t : producerThreads) t.start();\n        gate.countDown();\n        fanout.onEvent(\"STATE\", \"RUNNING: \" + producers + \" producers x \" + itemsEach + \" items, \" + consumers\n            + \" consumers, capacity \" + handoff.capacity() + \", hand-off = \" + handoff.name());\n    }\n\n    /**\n     * Wait for the producers to finish the work they planned, without telling them to stop. This is the normal\n     * end of a run: the source is exhausted, and only then does the drain begin. Bounded: false means the deadline passed.\n     */\n    boolean awaitProducers(long timeoutMs) throws InterruptedException {\n        long deadline = clock.nowMs() + timeoutMs;\n        for (Thread t : producerThreads) {\n            long left = deadline - clock.nowMs();\n            if (left <= 0L) return false;\n            t.join(left);\n            if (t.isAlive()) return false;\n        }\n        return true;\n    }\n\n    /**\n     * The shutdown protocol

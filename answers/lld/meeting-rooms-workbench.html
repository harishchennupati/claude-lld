&quot;, 9, 0, 10, 0).forSeats(6).needing(Feature.VIDEO)).booking().roomId().equals(&quot;Kaveri&quot;),\n              &quot;the same day under smallest-fit: Kaveri, the 8-seat room&quot;);\n        u.configure(new LeastIdleTime(), new NotInPast(new MaxLength(new AnyTime(), 720)), new InviteAnyway());\n        long[] auditNow = {mon(7, 0)};\n        RoomAuditLog log = new RoomAuditLog(() -&gt; auditNow[0]);\n        u.addListener(log);\n        Result tight = u.scheduleMeeting(req(&quot;z&quot;, 9, 0, 10, 0).forSeats(6).needing(Feature.VIDEO));\n        check(tight.booking().roomId().equals(&quot;Yamuna&quot;), &quot;least idle time: Yamuna (free 9-10 exactly), not Kaveri (free 9-12), though Kaveri is smaller&quot;);\n        auditNow[0] += 3 * 1440;\n        u.cancelBooking(tight.booking().id());\n        auditNow[0] += 5 * 1440;\n        check(log.purgeOlderThan(7) == 1 &amp;&amp; log.entries(&quot;Yamuna&quot;).size() == 1, &quot;the audit log deletes the entry older than 7 days and keeps the newer one&quot;);\n\n        // 15. holds, and classes with capacity above one\n        System.out.println(&quot;15. holds, gym classes, doctors&#x27; slots&quot;);\n        BookingService hs = Main.office();\n        long[] clock = {mon(9, 0)};\n        hs.setClock(() -&gt; clock[0]);\n        HoldDesk desk = new HoldDesk(hs, () -&gt; clock[0], 10);\n        Result held = desk.hold(&quot;Ganga&quot;, req(&quot;asha&quot;, 14, 0, 15, 0));\n        check(hs.bookRoom(&quot;Ganga&quot;, req(&quot;ravi&quot;, 14, 0, 15, 0)).status() == Status.ROOM_TAKEN, &quot;a hold keeps others out like a booking&quot;);\n        clock[0] += 10;\n        check(!desk.confirm(held.booking().id()) &amp;&amp; hs.bookRoom(&quot;Ganga&quot;, req(&quot;ravi&quot;, 14, 0, 15, 0)).ok(), &quot;at its deadline the hold is gone and the room is free again&quot;);\n        Result held2 = desk.hold(&quot;Kaveri&quot;, req(&quot;asha&quot;, 14, 0, 15, 0));\n        clock[0] += 5;\n        check(desk.confirm(held2.booking().id()) &amp;&amp; desk.releaseExpired() == 0 &amp;&amp; hs.get(held2.booking().id()) != null, &quot;confirmed in time: it stays after the deadline&quot;);\n        ClassDesk gym = new ClassDesk(() -&gt; mon(6, 0));\n        gym.addClass(new ClassSlot(&quot;HIIT&quot;, &quot;HIIT&quot;, mon(7, 0, 8, 0), 10));\n        List&lt;ClassDesk.Answer&gt; answers = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        CountDownLatch go3 = new CountDownLatch(1), done3 = new CountDownLatch(30);\n        for (int i = 0; i &lt; 30; i++) {\n            gym.addMember(&quot;m&quot; + i, Tier.GOLD);\n            final String who = &quot;m&quot; + i;\n            new Thread(() -&gt; {\n                try { go3.await(); answers.add(gym.book(who, &quot;HIIT&quot;)); }\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n                finally { done3.countDown(); }\n            }).start();\n        }\n        go3.countDown();\n        done3.await();\n        check(Collections.frequency(answers, ClassDesk.Answer.BOOKED) == 10 &amp;&amp; Collections.frequency(answers, ClassDesk.Answer.WAITLISTED) == 20,\n              &quot;thirty members, ten seats, one instant: exactly ten seated, twenty waiting&quot;);\n        String firstWaiting = gym.waiting(&quot;HIIT&quot;).get(0), leaver = gym.seated(&quot;HIIT&quot;).get(0);\n        check(gym.cancel(leaver, &quot;HIIT&quot;) == ClassDesk.Answer.CANCELLED &amp;&amp; gym.seated(&quot;HIIT&quot;).contains(firstWaiting) &amp;&amp; gym.seated(&quot;HIIT&quot;).size() == 10,\n              &quot;a cancel seats the first member waiting, and only one&quot;);\n        check(gym.book(firstWaiting, &quot;HIIT&quot;) == ClassDesk.Answer.ALREADY_BOOKED &amp;&amp; gym.seated(&quot;HIIT&quot;).size() == 10, &quot;booking twice is booking once&quot;);\n        ClassDesk late = new ClassDesk(() -&gt; mon(6, 31));\n        late.addMember(&quot;s&quot;, Tier.SILVER);\n        for (int k = 0; k &lt; 4; k++) late.addClass(new ClassSlot(&quot;C&quot; + k, &quot;yoga&quot;, mon(7 + k, 0, 8 + k, 0), 5));\n        late.addClass(new ClassSlot(&quot;O&quot;, &quot;overlap&quot;, mon(7, 30, 8, 30), 5));\n        check(late.book(&quot;s&quot;, &quot;C0&quot;) == ClassDesk.Answer.BOOKED &amp;&amp; late.book(&quot;s&quot;, &quot;O&quot;) == ClassDesk.Answer.OVERLAPS, &quot;one member cannot be in two overlapping classes (or two doctors at once)&quot;);\n        check(late.book(&quot;s&quot;, &quot;C1&quot;) == ClassDesk.Answer.BOOKED &amp;&amp; late.book(&quot;s&quot;, &quot;C2&quot;) == ClassDesk.Answer.BOOKED &amp;&amp; late.book(&quot;s&quot;, &quot;C3&quot;) == ClassDesk.Answer.NO_CLASSES_LEFT,\n              &quot;Silver means three classes: the fourth is refused&quot;);\n        check(late.cancel(&quot;s&quot;, &quot;C0&quot;) == ClassDesk.Answer.TOO_LATE &amp;&amp; late.cancel(&quot;s&quot;, &quot;C1&quot;) == ClassDesk.Answer.CANCELLED &amp;&amp; late.book(&quot;s&quot;, &quot;C3&quot;) == ClassDesk.Answer.BOOKED,\n              &quot;06:31 is too late to leave the 07:00 class; leaving the 08:00 one gives the class back&quot;);\n\n        // 16. tennis courts: as few as possible, never two bookings on a court at once\n        System.out.println(&quot;16. tennis courts&quot;);\n        Random rc = new Random(5);\n        int badPlans = 0;\n        for (int k = 0; k &lt; 200; k++) {\n            List&lt;CourtBooking&gt; dayb = new ArrayList&lt;&gt;();\n            for (int i = 0; i &lt; 30; i++) { int st = rc.nextInt(600); dayb.add(new CourtBooking(i, st, st + 10 + rc.nextInt(90))); }\n            int clean = k % 2 == 0 ? 0 : 15;\n            Map&lt;Integer, Integer&gt; plan = CourtPlanner.assignCourts(dayb, clean, k % 3 == 0 ? 3 : 0, 30);\n            Map&lt;Integer, List&lt;CourtBooking&gt;&gt; perCourt = new HashMap&lt;&gt;();\n            for (CourtBooking b : dayb) perCourt.computeIfAbsent(plan.get(b.id()), x -&gt; new ArrayList&lt;&gt;()).add(b);\n            for (List&lt;CourtBooking&gt; l : perCourt.values()) {\n                l.sort(Comparator.comparingInt(CourtBooking::start));\n                for (int i = 1; i &lt; l.size(); i++) if (l.get(i).start() &lt; l.get(i - 1).finish() + clean) badPlans++;\n            }\n            if (clean == 0 &amp;&amp; k % 3 != 0 &amp;&amp; perCourt.size() != CourtPlanner.minCourts(dayb)) badPlans++;\n        }\n        check(badPlans == 0, &quot;200 random days: no court is double-booked (cleaning included), and with no cleaning the court count equals the most bookings at one moment&quot;);\n        check(CourtPlanner.conflict(new CourtBooking(1, 9, 11), new CourtBooking(2, 10, 12)) &amp;&amp; !CourtPlanner.conflict(new CourtBooking(1, 9, 11), new CourtBooking(2, 11, 12)),\n              &quot;9-11 and 10-12 clash; 9-11 and 11-12 do not&quot;);\n\n        // 17. the database refuses an overlap itself; a lock per room keeps the invariant and never deadlocks\n        System.out.println(&quot;17. persistence and a lock per room&quot;);\n        InMemoryBookingRepository repo = new InMemoryBookingRepository();\n        CountDownLatch go4 = new CountDownLatch(1), done4 = new CountDownLatch(50);\n        AtomicInteger stored = new AtomicInteger();\n        for (int i = 0; i &lt; 50; i++) {\n            final int k = i;\n            new Thread(() -&gt; {\n                try { go4.await(); if (repo.insertIfFree(new Booking(&quot;R&quot; + k, &quot;Kaveri&quot;, mon(10, 0, 11, 0), &quot;p&quot; + k, &quot;&quot;, 1, Set.of(), List.of(), null))) stored.incrementAndGet(); }\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n                finally { done4.countDown(); }\n            }).start();\n        }\n        go4.countDown();\n        done4.await();\n        check(stored.get() == 1 &amp;&amp; repo.forRoom(&quot;Kaveri&quot;, mon(0, 0, 23, 59)).size() == 1, &quot;fifty app servers insert the same room and hour: one row&quot;);\n        PerRoomBooker pr = new PerRoomBooker(List.of(new Room(&quot;A&quot;, &quot;&quot;, 0, 4, Set.of()), new Room(&quot;B&quot;, &quot;&quot;, 0, 8, Set.of()), new Room(&quot;C&quot;, &quot;&quot;, 0, 12, Set.of())));\n        Booking inA = pr.bookRoom(&quot;A&quot;, &quot;x&quot;, mon(12, 0, 13, 0)), inB = pr.bookRoom(&quot;B&quot;, &quot;y&quot;, mon(14, 0, 15, 0));\n        Thread m1 = new Thread(() -&gt; { for (int k = 0; k &lt; 5000; k++) pr.move(inA.id(), k % 2 == 0 ? &quot;B&quot; : &quot;A&quot;, mon(12, 0, 13, 0)); });\n        Thread m2 = new Thread(() -&gt; { for (int k = 0; k &lt; 5000; k++) pr.move(inB.id(), k % 2 == 0 ? &quot;A&quot; : &quot;B&quot;, mon(14, 0, 15, 0)); });\n        m1.start(); m2.start(); m1.join(10_000); m2.join(10_000);\n        check(!m1.isAlive() &amp;&amp; !m2.isAlive() &amp;&amp; pr.overlaps() == 0, &quot;10,000 moves between two rooms in both directions at once: no deadlock (locks in id order), no overlap&quot;);\n\n        // 18. the calendar side: permissions, proposals, the time most can make, rules from strings, a grid, Cleartrip&#x27;s commands\n        System.out.println(&quot;18. the calendar side and the command-line version&quot;);\n        BookingService sc = Main.office();\n        SharedCalendars share = new SharedCalendars(sc);\n        Result mt = sc.bookRoom(&quot;Kaveri&quot;, req(&quot;asha&quot;, 10, 0, 11, 0).titled(&quot;pricing&quot;).inviting(&quot;ravi&quot;));\n        share.share(&quot;asha&quot;, &quot;meera&quot;, Access.VIEW);\n        check(share.view(&quot;kiran&quot;, &quot;asha&quot;, mon(0, 0, 23, 59)).equals(List.of(&quot;busy 10:00-11:00&quot;)) &amp;&amp; share.view(&quot;meera&quot;, &quot;asha&quot;, mon(0, 0, 23, 59)).get(0).startsWith(&quot;pricing&quot;),\n              &quot;without a grant you see only busy blocks; with VIEW you see the title&quot;);\n        boolean refusedEdit = false;\n        try { share.move(&quot;meera&quot;, mt.booking().id(), mon(12, 0, 13, 0)); } catch (SecurityException e) { refusedEdit = true; }\n        check(refusedEdit, &quot;VIEW cannot move the meeting&quot;);\n        String prop = share.propose(&quot;ravi&quot;, mt.booking().id(), mon(15, 0, 16, 0));\n        check(share.accept(&quot;asha&quot;, prop).status() == Status.MOVED &amp;&amp; sc.get(mt.booking().id()).when().equals(mon(15, 0, 16, 0)), &quot;ravi proposes 15:00, asha accepts, the meeting moves&quot;);\n        BookingService ma = Main.office();\n        ma.bookRoom(&quot;Ganga&quot;, req(&quot;p1&quot;, 10, 0, 12, 0));\n        ma.bookRoom(&quot;Kaveri&quot;, req(&quot;p2&quot;, 10, 0, 11, 0));\n        ma.bookRoom(&quot;Narmada&quot;, req(&quot;p3&quot;, 11, 0, 13, 0));\n        MostAvailable.Pick pick = MostAvailable.find(ma, List.of(&quot;p1&quot;, &quot;p2&quot;, &quot;p3&quot;), 60, mon(10, 0, 13, 0));\n        check(pick.when().equals(mon(12, 0, 13, 0)) &amp;&amp; pick.free().equals(List.of(&quot;p1&quot;, &quot;p2&quot;)), &quot;no hour suits all three: 12:00 suits two, the most&quot;);\n        Recurrence every2 = RecurrenceFactory.parse(&quot;FREQ=WEEKLY;INTERVAL=2;UNTIL=20261109&quot;, Time.OFFICE);\n        boolean unsupported = false;\n        try { RecurrenceFactory.parse(&quot;FREQ=WEEKLY;BYDAY=MO;UNTIL=20261109&quot;, Time.OFFICE); } catch (IllegalArgumentException e) { unsupported = true; }\n        check(every2.everyDays() == 14 &amp;&amp; every2.dates(mon(16, 0, 17, 0)).size() == 4 &amp;&amp; unsupported, &quot;an RRULE every two weeks gives 4 dates; an unsupported part is refused by name&quot;);\n        BookingPolicy hourGrid = new SlotGrid(new AnyTime(), 60, Time.OFFICE);\n        check(hourGrid.whyNot(mon(10, 0, 11, 0), 0) == null &amp;&amp; mon(10, 0) % 60 != 0 &amp;&amp; hourGrid.whyNot(mon(10, 30, 11, 30), 0) != null,\n              &quot;a whole-hour grid on the wall clock allows 10:00 (which is 04:30 UTC) and refuses 10:30&quot;);\n        CommandDriver cli = new CommandDriver(LocalDate.of(2026, 9, 28));\n        for (String cmd : List.of(&quot;ADD BUILDING b1&quot;, &quot;ADD FLOOR b1 7&quot;, &quot;ADD CONFROOM b1 7 c1 6&quot;, &quot;ADD CONFROOM b1 7 c2 10&quot;, &quot;BOOK u1 1:5 b1 7 c1&quot;, &quot;BOOK u2 3:10 b1 7 c2&quot;)) cli.run(cmd);\n        check(cli.run(&quot;SEARCH 3:10 b1 7&quot;).equals(&quot;No Rooms available&quot;) &amp;&amp; cli.run(&quot;SUGGEST 3:10&quot;).equals(&quot;5:12 b1/7/c1, 6:13 b1/7/c1, 7:14 b1/7/c1&quot;)\n              &amp;&amp; cli.run(&quot;BOOK u3 1:14 b1 7 c1&quot;).equals(&quot;ERROR: longer than 12 hours&quot;) &amp;&amp; cli.run(&quot;LIST BOOKING b1 7&quot;).equals(&quot;1:5 7 b1 c1\\n3:10 7 b1 c2&quot;)\n              &amp;&amp; cli.run(&quot;BOOK u4 1:2 b9 7 c1&quot;).equals(&quot;ERROR: no building b9&quot;), &quot;Cleartrip&#x27;s commands: search, suggest, the 12-hour cap, the list, a clear error for a bad building&quot;);\n\n        System.out.println(failed == 0 ? &quot;ALL PASS&quot; : failed + &quot; FAILED&quot;);\n        if (failed &gt; 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design a meeting room booking system for our office. Rooms have seats and equipment. People book a room, or ask for any room that fits, invite colleagues, cancel, move a meeting, repeat it every week, and find a time when everyone is free. Two meetings must never get the same room at the same time. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions; the first two are \"does 11:00-12:00 clash with 10:00-11:00?\" and \"who picks the room?\". Then type in the order of Main.java: <code>Interval</code> with its one-line overlap test; <code>Room</code> and <code>Booking</code>; the room's TreeMap with the two-lookup <code>isFree</code>; the request; the rule interfaces with one implementation each (room chooser, time rule, conflict rule, clock, listener); the service with its lock (<code>scheduleMeeting</code> and <code>bookRoom</code>, <code>cancelBooking</code>, then <code>reschedule</code> in its order); and a main with the race. If the clock runs out, the one thing that must exist is booking and cancelling under one lock with the two-lookup check on [start, end). The people's calendars, the series and the slot finder are the second half hour.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Uber&#x27;s version: the rooms are just ids, and scheduleMeeting(start, end) returns a room or an error. Write it in fifteen minutes. And what got one candidate rejected?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It is this page's service with two changes at the edge. The version below is codezym's (a practice site that tags it to Uber, Salesforce and Amazon): the chooser returns the lexicographically smallest free room id (the first in dictionary order), and times are <i>closed</i>, so [10, 20] and [20, 30] clash. A closed [s, e] is stored as the half-open [s, e + 1), and nothing inside changes; <code>bookMeeting</code> returns the room, or \"\" when none is free. Uber's own wording, <code>scheduleMeeting</code> returning a reservation id with the room, is the same call with a generated id. The rejected candidate (LeetCode Discuss, 2025) looked up the first meeting starting at or after the new meeting's END. That meeting can never overlap, so a meeting starting inside the new one was never seen: [5, 11) was booked on top of [10, 15). The fix is the page's second lookup, the first meeting after the START. The interviewer had called it \"a data-structure question\": the sorted map per room is the data structure they wanted to see.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Is [start, end) free here? Two lookups, O(log n). Because this room&#x27;s bookings never overlap, only\n     * the last one starting at or before our start can run into us from the left, and only the first one\n     * starting after our start can run into us from the right. ignoreId lets a meeting move over its own\n     * old time.\n     */\n    boolean isFree(Interval w, String ignoreId) {\n        Map.Entry&lt;Long, Booking&gt; before = byStart.floorEntry(w.start());\n        if (before != null &amp;&amp; !before.getValue().id().equals(ignoreId) &amp;&amp; before.getValue().when().end() &gt; w.start()) return false;\n        Map.Entry&lt;Long, Booking&gt; after = byStart.higherEntry(w.start());\n        if (after != null &amp;&amp; after.getValue().id().equals(ignoreId)) after = byStart.higherEntry(after.getKey());\n        return after == null || after.getKey() &gt;= w.end();\n    }\n\n// ---- ext: the short version asked at Uber -------------------------------------------------------------\n/**\n * The short version (Uber&#x27;s coding rounds; codezym tags it Uber, Salesforce, Amazon): rooms are just ids,\n * bookMeeting(meetingId, start, end) returns the lexicographically smallest free room or &quot;&quot;, and times are\n * CLOSED: [10, 20] and [20, 30] clash. It is the same service with two changes at the edge: the LowestId\n * chooser, and a closed [s, e] stored as the half-open [s, e + 1).\n */\nfinal class RoomBooking {\n    private final BookingService svc = new BookingService();\n    private final Map&lt;String, String&gt; meetings = new HashMap&lt;&gt;();          // caller&#x27;s meeting id -&gt; booking id\n\n    RoomBooking(List&lt;String&gt; roomIds) {\n        svc.configure(new LowestId(), new AnyTime(), new InviteAnyway());\n        for (String id : roomIds) svc.addRoom(new Room(id, &quot;&quot;, 0, Integer.MAX_VALUE, Set.of()));\n    }\n    /** The smallest free room id for the closed range [start, end], or &quot;&quot; when no room can host it. */\n    synchronized String bookMeeting(String meetingId, int startTime, int endTime) {\n        if (endTime &lt; startTime || meetings.containsKey(meetingId)) return &quot;&quot;;\n        Result r = svc.scheduleMeeting(MeetingRequest.of(meetingId, startTime, endTime + 1L));\n        if (!r.ok()) return &quot;&quot;;\n        meetings.put(meetingId, r.booking().id());\n        return r.booking().roomId();\n    }\n    /** True only when the meeting exists and is active; it is then cancelled. */\n    synchronized boolean cancelMeeting(String meetingId) {\n        String id = meetings.remove(meetingId);\n        return id != null &amp;&amp; svc.cancelBooking(id);\n    }\n\n    /**\n     * What a candidate rejected at Uber (2025) wrote, cut down to the check. It asks for the first meeting\n     * starting at or after the new meeting&#x27;s END. That meeting can never overlap, so a meeting that starts\n     * INSIDE the new one is never seen. The right second lookup is the first meeting after the START.\n     */\n    static boolean rejectedIsFree(TreeMap&lt;Integer, Integer&gt; startToEnd, int start, int end) {\n        Map.Entry&lt;Integer, Integer&gt; floor = startToEnd.floorEntry(start);\n        Map.Entry&lt;Integer, Integer&gt; ceil = startToEnd.ceilingEntry(end);          // the bug: should be higherEntry(start)\n        boolean clash = (floor != null &amp;&amp; floor.getValue() &gt; start) || (ceil != null &amp;&amp; ceil.getKey() &lt; end);\n        return !clash;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two people press Book for the same hour in Yamuna at the same instant. Prove it cannot double-book, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading \"Yamuna is free at 14:00\" and writing the meeting in. <code>bookLocked</code> does the rules, the check and every write inside one lock, so no other caller can run in that gap. The proof is a test, not a paragraph: fifty threads wait on one latch, the latch opens, all fifty book Yamuna 14:00-15:00, and the test counts one BOOKED and forty-nine ROOM_TAKEN. It then checks that the room holds exactly one meeting, because \"one winner\" would also be true if the meeting had been lost. The second half runs fifty threads booking, moving and cancelling at random, 2,000 calls, and then audits: no two meetings overlap in any room, and the rooms, the ids and every calendar agree.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 8. the race: one room, one hour, fifty threads; then fifty threads at random: no overlap anywhere\n        System.out.println(&quot;8. the race&quot;);\n        BookingService race = Main.office();\n        int n = 50;\n        CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(n);\n        List&lt;Result&gt; results = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        for (int i = 0; i &lt; n; i++) {\n            final String who = &quot;p&quot; + i;\n            new Thread(() -&gt; {\n                try { go.await(); results.add(race.bookRoom(&quot;Yamuna&quot;, req(who, 14, 0, 15, 0))); }\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n                finally { done.countDown(); }\n            }).start();\n        }\n        go.countDown();\n        done.await();\n        check(results.stream().filter(Result::ok).count() == 1, &quot;fifty callers, one room, one hour: exactly one booked&quot;);\n        check(results.stream().filter(x -&gt; x.status() == Status.ROOM_TAKEN).count() == n - 1, &quot;the other forty-nine were told it is taken&quot;);\n        check(race.listBookingsForRoom(&quot;Yamuna&quot;, mon(0, 0, 23, 59)).size() == 1, &quot;and the room holds one meeting, not zero&quot;);\n        BookingService busy = Main.office();\n        CountDownLatch go2 = new CountDownLatch(1), done2 = new CountDownLatch(n);\n        AtomicInteger errors = new AtomicInteger();\n        for (int i = 0; i &lt; n; i++) {\n            final int seed = i;\n            new Thread(() -&gt; {\n                Random rr = new Random(seed);\n                List&lt;String&gt; mine = new ArrayList&lt;&gt;();\n                try {\n                    go2.await();\n                    for (int k = 0; k &lt; 40; k++) {\n                        int op = rr.nextInt(10);\n                        long st = mon(8, 45) + 15L * rr.nextInt(40);\n                        if (op &lt; 7 || mine.isEmpty()) {\n                            Result x = busy.scheduleMeeting(MeetingRequest.of(&quot;u&quot; + seed, st, st + 15L * (1 + rr.nextInt(8))).forSeats(1 + rr.nextInt(10))\n                                                               .inviting(&quot;g&quot; + rr.nextInt(20)));\n                            if (x.ok()) mine.add(x.booking().id());\n                        } else if (op &lt; 9) busy.reschedule(mine.get(rr.nextInt(mine.size())), new Interval(st, st + 30));\n                        else busy.cancelBooking(mine.remove(rr.nextInt(mine.size())));\n                    }\n                } catch (Exception e) { errors.incrementAndGet(); }\n                finally { done2.countDown(); }\n            }).start();\n        }\n        go2.countDown();\n        done2.await();\n        check(errors.get() == 0 &amp;&amp; busy.audit().isEmpty(), &quot;fifty threads, 2,000 books, moves and cancels: no overlapping pair in any room, every index agrees&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock for the whole office. Does that scale, or is every booking now in one queue?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It is one queue, for microseconds. Measured with 200 rooms and 10,000 meetings: a named room holds the lock for under a microsecond, any room for about 5 microseconds, the slot finder for about 50 with three busy people over a week. A 5,000-person office books about one meeting a second in its busiest hour; with a search and twenty reads alongside, that is about 0.06 ms of lock a second. The mails, the network and the person deciding are all outside it. To grow, climb in this order. First a read-write lock, because calendars, door screens and searches are reads. Then a lock per room, below: a booking takes one room's lock, \"any room\" tries rooms one lock at a time, and a move takes both rooms' locks in id order, so two moves never wait on each other. Then the database decides. Know what the second rung costs: a room and its people's calendars no longer change in one step.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a lock per room -------------------------------------------------------------------------------\n/**\n * Rung 2 of the ladder: a lock per room instead of one for the office. A named room takes one lock; &quot;any\n * room&quot; tries the fitting rooms smallest first, one lock at a time, checking again under each; moving a\n * meeting between rooms takes both locks in room-id order, so two moves can never wait for each other.\n * What it gives up: the room and the people&#x27;s calendars no longer change in one step (calendars left out here).\n */\nfinal class PerRoomBooker {\n    private final Map&lt;String, RoomTimeline&gt; rooms = new TreeMap&lt;&gt;();       // filled in the constructor, never changed: safe to read\n    private final Map&lt;String, ReentrantLock&gt; locks = new HashMap&lt;&gt;();\n    private final Map&lt;String, Booking&gt; live = new ConcurrentHashMap&lt;&gt;();    // meeting id -&gt; current copy\n    private final AtomicLong nextId = new AtomicLong();\n\n    PerRoomBooker(List&lt;Room&gt; all) {\n        for (Room r : all) { rooms.put(r.id(), new RoomTimeline(r)); locks.put(r.id(), new ReentrantLock()); }\n    }\n    /** This room or nothing (null). Only this room&#x27;s lock is taken. */\n    Booking bookRoom(String roomId, String who, Interval w) {\n        ReentrantLock l = locks.get(roomId);\n        l.lock();\n        try {\n            RoomTimeline t = rooms.get(roomId);\n            if (!t.isFree(w, null)) return null;\n            Booking b = new Booking(&quot;P&quot; + nextId.incrementAndGet(), roomId, w, who, &quot;meeting&quot;, 1, Set.of(), List.of(), null);\n            t.add(b);\n            live.put(b.id(), b);\n            return b;\n        } finally { l.unlock(); }\n    }\n    /** Any room that seats `seats`, smallest first, one lock at a time; a room taken meanwhile is skipped. */\n    Booking bookAny(String who, Interval w, int seats) {\n        List&lt;RoomTimeline&gt; order = new ArrayList&lt;&gt;(rooms.values());\n        order.sort(Comparator.comparingInt((RoomTimeline t) -&gt; t.room.capacity()).thenComparing(t -&gt; t.room.id()));\n        for (RoomTimeline t : order) {\n            if (!t.room.fits(seats, Set.of())) continue;\n            Booking b = bookRoom(t.room.id(), who, w);\n            if (b != null) return b;\n        }\n        return null;\n    }\n    /** Move a meeting to a room and a time: both rooms locked, lower id first, checked, then swapped. Null when refused. */\n    Booking move(String meetingId, String toRoom, Interval to) {\n        Booking b = live.get(meetingId);\n        String a = b.roomId().compareTo(toRoom) &lt;= 0 ? b.roomId() : toRoom, z = a.equals(b.roomId()) ? toRoom : b.roomId();\n        locks.get(a).lock();\n        try {\n            locks.get(z).lock();                                               // the same room twice is fine: re-entrant\n            try {\n                if (live.get(meetingId) != b) return null;                     // it moved while we were locking: the caller retries\n                if (!rooms.get(toRoom).isFree(to, b.id())) return null;\n                Booking moved = b.movedTo(toRoom, to);\n                rooms.get(b.roomId()).remove(b);\n                rooms.get(toRoom).add(moved);\n                live.put(meetingId, moved);\n                return moved;\n            } finally { locks.get(z).unlock(); }\n        } finally { locks.get(a).unlock(); }\n    }\n    /** How many overlapping pairs there are in all rooms (must be 0), each room read under its lock. */\n    int overlaps() {\n        int bad = 0;\n        for (RoomTimeline t : rooms.values()) {\n            locks.get(t.room.id()).lock();\n            try {\n                List&lt;Booking&gt; all = t.all();\n                for (int i = 1; i &lt; all.size(); i++) if (all.get(i - 1).when().overlaps(all.get(i).when())) bad++;\n            } finally { locks.get(t.room.id()).unlock(); }\n        }\n        return bad;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; A move fails halfway. What is the state of the system? Show me the code.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing is half done. <code>reschedule</code> checks the time rules, then finds a room (the same one if it is free at the new time, where the meeting's own old time does not count, otherwise the chooser picks another that fits), then checks the people. All three only read. If any of them refuses, it returns the reason with the meeting exactly as it was, still holding its old room. Only after all three pass does it swap: remove the old copy from the room, the id map and each calendar, then insert the new copy under the same id. Those are map writes that cannot fail. Every guest is asked again, because they agreed to the old time. The test fills the only other video room, asks for 11:00-12:00, gets NO_ROOM_FITS, and checks that 10:00 is still held and ravi's calendar still shows it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Move a meeting to a new time: the same room if it is free then (the meeting&#x27;s own old time does not\n     * count), else the chooser picks another room that fits. In this order: the rules, a room, the people;\n     * only then the swap, and every guest is asked again. A refusal leaves the meeting exactly where it was.\n     */\n    Result reschedule(String meetingId, Interval to) {\n        List&lt;CalendarEvent&gt; events = new ArrayList&lt;&gt;();\n        Result out;\n        lock.lock();\n        try {\n            Booking old = byId.get(meetingId);\n            if (old == null) throw new NoSuchElementException(&quot;no meeting &quot; + meetingId);\n            if (to.equals(old.when())) return new Result(Status.MOVED, old, null, List.of());   // already there: nobody is asked again\n            String why = policy.whyNot(to, clock.nowMinutes());\n            if (why != null) return refused(Status.RULE_BROKEN, old, why);\n            RoomTimeline target = rooms.get(old.roomId());\n            if (!target.isFree(to, old.id())) {\n                List&lt;RoomTimeline&gt; free = freeRooms(to, old.seats(), old.needs(), old.id());\n                if (free.isEmpty()) return refused(Status.NO_ROOM_FITS, old, &quot;no room free &quot; + to + &quot;; &quot; + old + &quot; stays&quot;);\n                target = chosen(free, to);\n            }\n            List&lt;String&gt; busy = busyPeople(old.everyone(), to, old.id());\n            if (conflicts.refuse(busy)) return new Result(Status.GUEST_BUSY, old, busy + &quot; already in a meeting&quot;, busy);\n            Booking moved = old.movedTo(target.room.id(), to);                     // proven: now the swap, writes only\n            erase(old);\n            insert(moved);                                                         // answers start again at NEEDS_ACTION\n            events.add(new CalendarEvent(Change.MOVED, moved, old, null, null));\n            out = new Result(Status.MOVED, moved, null, busy);\n        } finally { lock.unlock(); }\n        publish(events);\n        return out;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; Repeat it every Monday until 21 December. What if week three clashes? Do you store the rule or every date? Cancel one date, or all?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p><code>bookRecurring</code> turns the rule into dates first, outside the lock, because that is pure arithmetic. Inside the lock it checks every date (the time rules, the room, the people) and writes nothing until all have passed. One clash means nothing is booked and the clashing dates come back, so the person can pick another room or skip that week. When all pass, each date is written as its own meeting with a shared series id: <code>cancelBooking</code> removes one date, <code>cancelSeries</code> the rest. Storing each date keeps the overlap check the same two lookups as any meeting, which is why a series must end and is capped at 400 dates. A calendar that allows \"forever\" stores the rule plus its exceptions and expands only the weeks on screen; the calendar-file standard (iCalendar) and the Google Calendar API both work that way. That is the answer to Zepto's \"store the rule or the instances?\". Each date is counted in days on the local calendar, so 16:00 stays 16:00 (follow-up 15).</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Book one room on every date of a series, all or nothing. Every date is checked first (the rules, the\n     * room, the people); if any fails, nothing is written and the failing dates come back. Only when all\n     * are proven is every date written, inside the same lock.\n     */\n    SeriesResult bookRecurring(String roomId, MeetingRequest first, Recurrence rule) {\n        List&lt;Interval&gt; dates = rule.dates(first.when());                          // pure: worked out before the lock\n        List&lt;CalendarEvent&gt; events = new ArrayList&lt;&gt;();\n        SeriesResult out;\n        lock.lock();\n        try {\n            RoomTimeline t = timeline(roomId);\n            if (!t.room.fits(first.seats(), first.needs()))\n                return new SeriesResult(null, List.of(), dates, roomId + &quot; does not fit this meeting&quot;);\n            List&lt;String&gt; everyone = new ArrayList&lt;&gt;(List.of(first.organizer()));\n            everyone.addAll(first.guests());\n            long now = clock.nowMinutes();\n            List&lt;Interval&gt; clashes = new ArrayList&lt;&gt;();\n            for (Interval d : dates)\n                if (policy.whyNot(d, now) != null || !t.isFree(d, null) || conflicts.refuse(busyPeople(everyone, d, null)))\n                    clashes.add(d);\n            if (!clashes.isEmpty()) return new SeriesResult(null, List.of(), clashes, clashes.size() + &quot; of &quot; + dates.size() + &quot; dates clash&quot;);\n            String sid = &quot;S&quot; + (++nextSeries);\n            List&lt;Booking&gt; made = new ArrayList&lt;&gt;();\n            Set&lt;String&gt; ids = new LinkedHashSet&lt;&gt;();\n            for (Interval d : dates) {                                             // every date proven: write them all\n                Booking b = new Booking(&quot;B&quot; + (++nextMeeting), roomId, d, first.organizer(), first.title(),\n                                        first.seats(), first.needs(), first.guests(), sid);\n                insert(b);\n                made.add(b);\n                ids.add(b.id());\n                events.add(new CalendarEvent(Change.BOOKED, b, null, null, null));\n            }\n            series.put(sid, ids);\n            out = new SeriesResult(sid, made, List.of(), null);\n        } finally { lock.unlock(); }\n        publish(events);\n        return out;\n    }\n\n    /** Cancel every remaining date of a series in one step. Returns how many were cancelled. */\n    int cancelSeries(String seriesId) {\n        List&lt;CalendarEvent&gt; events = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            Set&lt;String&gt; ids = series.remove(seriesId);\n            if (ids == null) return 0;\n            for (String id : ids) {\n                Booking b = byId.get(id);\n                erase(b);\n                answers.remove(id);\n                events.add(new CalendarEvent(Change.CANCELLED, b, null, null, null));\n            }\n        } finally { lock.unlock(); }\n        publish(events);\n        return events.size();\n    }\n\n/**\n * How a meeting repeats: every `everyDays` days (1 = daily, 7 = weekly) up to and including the date\n * `until`, at the same wall-clock time in `zone`. At most 400 dates, so one series never holds the lock long.\n */\nrecord Recurrence(int everyDays, LocalDate until, ZoneId zone) {\n    static final int MAX_DATES = 400;\n    Recurrence {\n        if (everyDays &lt;= 0) throw new IllegalArgumentException(&quot;repeat every 1 day or more&quot;);\n    }\n    /** Weekly in the office&#x27;s zone. */\n    static Recurrence weekly(LocalDate until) { return new Recurrence(7, until, Time.OFFICE); }\n    /** Daily in the office&#x27;s zone. */\n    static Recurrence daily(LocalDate until) { return new Recurrence(1, until, Time.OFFICE); }\n    /**\n     * Every date of the series, the first included. Pure: it touches nothing. Each date is counted in days\n     * from the FIRST one, in the series&#x27; zone, so 09:00 stays 09:00 across a daylight-saving change.\n     */\n    List&lt;Interval&gt; dates(Interval first) {\n        ZonedDateTime start = Time.local(first.start(), zone);\n        if (until.isBefore(start.toLocalDate())) throw new IllegalArgumentException(&quot;the series ends before it starts&quot;);\n        List&lt;Interval&gt; out = new ArrayList&lt;&gt;();\n        for (long k = 0; ; k++) {\n            ZonedDateTime d = start.plusDays(k * everyDays);\n            if (d.toLocalDate().isAfter(until)) break;\n            if (out.size() == MAX_DATES) throw new IllegalArgumentException(&quot;more than &quot; + MAX_DATES + &quot; dates&quot;);\n            long s = d.toEpochSecond() / 60;\n            if (!out.isEmpty() &amp;&amp; out.get(out.size() - 1).end() &gt; s) throw new IllegalArgumentException(&quot;each meeting runs into the next&quot;);\n            out.add(new Interval(s, s + first.minutes()));\n        }\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; Find the first 30 minutes when asha, ravi and meera are all free, with a room for three with video. And if no time suits all of them?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p><code>findFirstSlot</code> collects each person's busy times inside the window (a declined meeting does not count), sorts them and merges overlapping or touching ones into blocks: the classic merge-intervals step. The gaps between the blocks are when all of them are free. For each gap long enough, it asks every room that fits for its first opening inside the gap, walking that room's sorted meetings; the earliest opening wins, and when several rooms open at that minute the chooser picks. On the page's morning, 10:30-11:30 and 11:00-12:00 merge into one block, the quarter hour before it is too short, and the answer is 12:00 in Ganga. When no time suits everyone (Adobe's \"all or the most\"), <code>MostAvailable</code> tries only the window's start and the end of each meeting, counts who is free at each, and keeps the earliest best. A test checks the finder against trying every minute on 60 random days.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The first `minutes`-long slot inside `window` when every one of `who` is free (a declined meeting\n     * does not count) and some room fits: merge everyone&#x27;s busy time into blocks, walk the gaps between\n     * the blocks, and in each gap long enough ask every fitting room for its first opening. When several\n     * rooms open at that same minute, the chooser picks.\n     */\n    Optional&lt;Slot&gt; findFirstSlot(List&lt;String&gt; who, long minutes, Interval window, int seats, Set&lt;Feature&gt; needs) {\n        if (minutes &lt;= 0) throw new IllegalArgumentException(&quot;a slot lasts at least a minute&quot;);\n        lock.lock();\n        try {\n            List&lt;Interval&gt; busy = new ArrayList&lt;&gt;();\n            for (String p : who) busy.addAll(busyLocked(p, window));\n            List&lt;Interval&gt; walls = merge(busy);\n            walls.add(new Interval(window.end(), window.end() + 1));              // a last wall where the window ends\n            long t = window.start();\n            for (Interval wall : walls) {\n                long gapEnd = Math.min(wall.start(), window.end());\n                if (gapEnd - t &gt;= minutes) {\n                    long best = -1;\n                    List&lt;RoomTimeline&gt; openAtBest = new ArrayList&lt;&gt;();\n                    for (RoomTimeline room : rooms.values()) {\n                        if (!room.room.fits(seats, needs)) continue;\n                        long open = room.firstOpening(t, minutes, gapEnd);\n                        if (open &lt; 0) continue;\n                        if (best &lt; 0 || open &lt; best) { best = open; openAtBest.clear(); }\n                        if (open == best) openAtBest.add(room);\n                    }\n                    if (best &gt;= 0) {\n                        Interval slot = new Interval(best, best + minutes);\n                        return Optional.of(new Slot(slot, chosen(openAtBest, slot).room.id()));\n                    }\n                }\n                t = Math.max(t, wall.end());\n            }\n            return Optional.empty();\n        } finally { lock.unlock(); }\n    }\n\n    /** Sort by start and fuse overlapping or touching intervals: [9:00,10:00) [9:30,11:00) [11:00,12:00) become [9:00,12:00). */\n    static List&lt;Interval&gt; merge(List&lt;Interval&gt; in) {\n        List&lt;Interval&gt; sorted = new ArrayList&lt;&gt;(in);\n        sorted.sort(Comparator.comparingLong(Interval::start));\n        List&lt;Interval&gt; out = new ArrayList&lt;&gt;();\n        for (Interval i : sorted) {\n            if (!out.isEmpty() &amp;&amp; i.start() &lt;= out.get(out.size() - 1).end()) {\n                Interval last = out.remove(out.size() - 1);\n                out.add(new Interval(last.start(), Math.max(last.end(), i.end())));\n            } else out.add(i);\n        }\n        return out;\n    }\n\n// ---- ext: the time most people can make -----------------------------------------------------------------\n/**\n * Adobe&#x27;s variant: no time suits everyone, so find the time the MOST people can make. The only starts worth\n * trying are the window&#x27;s start and the end of someone&#x27;s meeting (any other start can slide earlier without\n * losing anyone), so count who is free at each and keep the best, earliest first.\n */\nfinal class MostAvailable {\n    /** The chosen time, who can come, who cannot. */\n    record Pick(Interval when, List&lt;String&gt; free, List&lt;String&gt; busy) {}\n    /** O(C x P x k) for C candidate starts, P people and k meetings each in the window. */\n    static Pick find(BookingService svc, List&lt;String&gt; who, long minutes, Interval window) {\n        Map&lt;String, List&lt;Interval&gt;&gt; busy = new LinkedHashMap&lt;&gt;();\n        TreeSet&lt;Long&gt; starts = new TreeSet&lt;&gt;(List.of(window.start()));\n        for (String p : who) {\n            List&lt;Interval&gt; taken = svc.busyTimes(p, window);\n            busy.put(p, taken);\n            for (Interval i : taken) starts.add(i.end());\n        }\n        Pick best = null;\n        for (long t : starts) {\n            if (t + minutes &gt; window.end()) break;\n            Interval slot = new Interval(t, t + minutes);\n            List&lt;String&gt; free = new ArrayList&lt;&gt;(), out = new ArrayList&lt;&gt;();\n            for (String p : who) (busy.get(p).stream().anyMatch(i -&gt; i.overlaps(slot)) ? out : free).add(p);\n            if (best == null || free.size() &gt; best.free().size()) best = new Pick(slot, free, out);\n        }\n        return best;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>7 &middot; Cleartrip&#x27;s version is a command line: rooms on floors of buildings, BOOK u1 1:5 b1 7 c1, SEARCH with optional filters, at most 12 hours, and SUGGEST the next three free slots.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The service does not change; the command driver is a thin caller that parses a line, calls one method and prints one line. A room's id is building/floor/room, so c1 on floor 7 of b1 is unique across buildings, and the room carries its building and floor for filtering. BOOK is <code>bookRoom</code> with the 12-hour cap as the time rule. SEARCH is <code>getAvailableRooms</code>: two lookups in each room, never a scan of meetings, filtered by building and floor when they are given. LIST BOOKING is <code>listBookingsForRoom</code> over the floor's rooms: one sorted-map range each. SUGGEST tries each later whole hour of the same length and names the first free room, until it has three. Bad input, such as an unknown building, comes back as an ERROR line and never as a stack trace. That is what Cleartrip's prompt asks for (\"fail gracefully with a proper error message\"), and Flipkart's and Udaan's say the same.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the command-line version asked at Cleartrip ---------------------------------------------------\n/**\n * Cleartrip&#x27;s machine-coding version: commands in, lines out, rooms on floors of buildings, slots in whole\n * hours of one day, at most 12 hours, a search with optional building, floor and seats, and SUGGEST for the\n * next three times that are free. A thin caller: it parses and prints; the service decides everything.\n *   ADD BUILDING b1 | ADD FLOOR b1 7 | ADD CONFROOM b1 7 c1 6 | BOOK u1 1:5 b1 7 c1 | CANCEL u1 1:5 b1 7 c1\n *   LIST BOOKING b1 7 | SEARCH 2:3 [b1 [7 [3]]] | SUGGEST 3:10\n */\nfinal class CommandDriver {\n    private final BookingService svc = new BookingService();\n    private final LocalDate day;\n    private final Map&lt;String, Set&lt;Integer&gt;&gt; floors = new TreeMap&lt;&gt;();      // the buildings and their floors, for validation\n    private final Map&lt;String, List&lt;String&gt;&gt; roomsByFloor = new TreeMap&lt;&gt;(); // &quot;b1/7&quot; -&gt; its room ids, for LIST BOOKING\n\n    CommandDriver(LocalDate day) {\n        this.day = day;\n        svc.configure(new SmallestFit(), new MaxLength(new AnyTime(), 12 * 60), new InviteAnyway());\n    }\n    /** Run one command and return what it prints. Bad input comes back as an ERROR line, never a crash. */\n    String run(String line) {\n        String[] w = line.trim().split(&quot;\\\\s+&quot;);\n        try {\n            String cmd = w[0] + (w[0].equals(&quot;ADD&quot;) || w[0].equals(&quot;LIST&quot;) ? &quot; &quot; + w[1] : &quot;&quot;);\n            return switch (cmd) {\n                case &quot;ADD BUILDING&quot; -&gt; { floors.putIfAbsent(w[2], new TreeSet&lt;&gt;()); yield &quot;Added building &quot; + w[2] + &quot; into the system.&quot;; }\n                case &quot;ADD FLOOR&quot; -&gt; { building(w[2]).add(Integer.parseInt(w[3])); yield &quot;Added floor &quot; + w[3] + &quot; in building &quot; + w[2] + &quot;.&quot;; }\n                case &quot;ADD CONFROOM&quot; -&gt; {\n                    floor(w[2], w[3]);\n                    svc.addRoom(new Room(id(w[2], w[3], w[4]), w[2], Integer.parseInt(w[3]), w.length &gt; 5 ? Integer.parseInt(w[5]) : 10, Set.of()));\n                    roomsByFloor.computeIfAbsent(w[2] + &quot;/&quot; + w[3], k -&gt; new ArrayList&lt;&gt;()).add(id(w[2], w[3], w[4]));\n                    yield &quot;Added conference room &quot; + w[4] + &quot; on floor &quot; + w[3] + &quot; in &quot; + w[2] + &quot;.&quot;;\n                }\n                case &quot;BOOK&quot; -&gt; {\n                    floor(w[3], w[4]);\n                    Result r = svc.bookRoom(id(w[3], w[4], w[5]), MeetingRequest.of(w[1], slot(w[2]).start(), slot(w[2]).end()));\n                    yield r.ok() ? &quot;Booked &quot; + w[5] + &quot; &quot; + w[2] + &quot; for &quot; + w[1] + &quot; (&quot; + r.booking().id() + &quot;)&quot; : &quot;ERROR: &quot; + r.reason();\n                }\n                case &quot;CANCEL&quot; -&gt; {\n                    for (Booking b : svc.listBookingsForRoom(id(w[3], w[4], w[5]), slot(w[2])))\n                        if (b.when().equals(slot(w[2])) &amp;&amp; b.organizer().equals(w[1]) &amp;&amp; svc.cancelBooking(b.id())) yield &quot;Cancelled &quot; + w[5] + &quot; &quot; + w[2] + &quot;.&quot;;\n                    yield &quot;ERROR: &quot; + w[1] + &quot; has no booking of &quot; + w[5] + &quot; at &quot; + w[2];\n                }\n                case &quot;LIST BOOKING&quot; -&gt; {\n                    floor(w[2], w[3]);\n                    StringBuilder out = new StringBuilder();\n                    Interval whole = new Interval(hour(0), hour(24));\n                    for (String room : roomsByFloor.getOrDefault(w[2] + &quot;/&quot; + w[3], List.of()))\n                        for (Booking b : svc.listBookingsForRoom(room, whole))\n                            out.append(hours(b.when())).append(&#x27; &#x27;).append(w[3]).append(&#x27; &#x27;).append(w[2]).append(&#x27; &#x27;).append(room.substring(room.lastIndexOf(&#x27;/&#x27;) + 1)).append(&#x27;\\n&#x27;);\n                    yield out.length() == 0 ? &quot;No bookings&quot; : out.toString().trim();\n                }\n                case &quot;SEARCH&quot; -&gt; {\n                    int seats = w.length &gt; 4 ? Integer.parseInt(w[4]) : 1;\n                    List&lt;String&gt; hits = new ArrayList&lt;&gt;();\n                    for (Room r : svc.getAvailableRooms(slot(w[1]), seats, Set.of()))\n                        if ((w.length &lt; 3 || r.building().equals(w[2])) &amp;&amp; (w.length &lt; 4 || r.floor() == Integer.parseInt(w[3])))\n                            hits.add(r.id().substring(r.id().lastIndexOf(&#x27;/&#x27;) + 1) + &quot; &quot; + r.floor() + &quot; &quot; + r.building());\n                    yield hits.isEmpty() ? &quot;No Rooms available&quot; : String.join(&quot;\\n&quot;, hits);\n                }\n                case &quot;SUGGEST&quot; -&gt; String.join(&quot;, &quot;, suggest(slot(w[1]), 3));\n                default -&gt; &quot;ERROR: unknown command: &quot; + line;\n            };\n        } catch (RuntimeException e) { return &quot;ERROR: &quot; + e.getMessage(); }\n    }\n    /** The next `count` start hours after the asked-for one, same length, where some room is free; the room is named. */\n    List&lt;String&gt; suggest(Interval asked, int count) {\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        long len = asked.minutes();\n        for (long s = asked.start() + 60; s + len &lt;= hour(24) &amp;&amp; out.size() &lt; count; s += 60) {\n            List&lt;Room&gt; free = svc.getAvailableRooms(new Interval(s, s + len), 1, Set.of());\n            if (!free.isEmpty()) out.add(hours(new Interval(s, s + len)) + &quot; &quot; + free.get(0).id());\n        }\n        return out;\n    }\n    /** &quot;1:5&quot; -&gt; 01:00-05:00 on the driver&#x27;s day. */\n    private Interval slot(String hh) {\n        String[] p = hh.split(&quot;:&quot;);\n        return new Interval(hour(Integer.parseInt(p[0])), hour(Integer.parseInt(p[1])));\n    }\n    /** The minute of a whole hour of the day, office time (24 = the next midnight). */\n    private long hour(int h) { return day.atStartOfDay(Time.OFFICE).plusHours(h).toEpochSecond() / 60; }\n    /** 01:00-05:00 -&gt; &quot;1:5&quot;. */\n    private String hours(Interval i) { return (i.start() - hour(0)) / 60 + &quot;:&quot; + (i.end() - hour(0)) / 60; }\n    /** A room id unique across buildings: b1/7/c1. */\n    private static String id(String b, String f, String room) { return b + &quot;/&quot; + f + &quot;/&quot; + room; }\n    /** A known building&#x27;s floors, or an error. */\n    private Set&lt;Integer&gt; building(String b) {\n        Set&lt;Integer&gt; f = floors.get(b);\n        if (f == null) throw new NoSuchElementException(&quot;no building &quot; + b);\n        return f;\n    }\n    /** Check that a floor exists in a building. */\n    private void floor(String b, String f) {\n        if (!building(b).contains(Integer.parseInt(f))) throw new NoSuchElementException(&quot;no floor &quot; + f + &quot; in &quot; + b);\n    }\n}\n\n/** The rooms that seat `seats`, have `needs` and are free for all of w, in id order. O(R log n) for R rooms. */\n    List&lt;Room&gt; getAvailableRooms(Interval w, int seats, Set&lt;Feature&gt; needs) {\n        lock.lock();\n        try {\n            List&lt;Room&gt; out = new ArrayList&lt;&gt;();\n            for (RoomTimeline t : freeRooms(w, seats, needs, null)) out.add(t.room);\n            return out;\n        } finally { lock.unlock(); }\n    }\n    /** A room&#x27;s meetings overlapping a window (its day on the door screen), in order. O(log n + k). */\n    List&lt;Booking&gt; listBookingsForRoom(String roomId, Interval window) {\n        lock.lock();\n        try { return timeline(roomId).between(window); } finally { lock.unlock(); }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Uber&#x27;s follow-ups: rooms now have capacities; choose the room that leaves the least idle time around the meeting; keep an audit log per room and delete entries after X days.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Capacity is already in <code>Room.fits</code>. Least idle time is a new chooser. For each free room that fits, it adds the gap back to the room's previous meeting and the gap on to its next one (to the edge of the day when there is none), and takes the smallest. With Yamuna free only 9-10 and Kaveri free 9-12, a 9-10 meeting goes to Yamuna and fills its gap exactly, although smallest-fit would have picked the smaller Kaveri. The audit log is a listener, so the booking code never knows it exists. It keeps, per room, a TreeMap from the minute an entry was written to the entries. Deleting everything older than X days is one <code>headMap(cutoff).clear()</code>, which touches only the entries it deletes. A move between rooms is written under both.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: least idle time and the audit log -------------------------------------------------------------\n/**\n * Uber&#x27;s follow-up: give the meeting to the room that leaves the least idle time around it (&quot;spillage&quot;):\n * the gap back to the room&#x27;s previous meeting plus the gap on to its next one, each counted to the edge of\n * that day when there is none. Room 1 free 9-10 and room 2 free 9-12: a 9-10 meeting takes room 1.\n */\nfinal class LeastIdleTime implements RoomChooser {\n    /** Least idle minutes, then the smallest room, then id. */\n    public RoomTimeline choose(List&lt;RoomTimeline&gt; free, Interval w) {\n        return Collections.min(free, Comparator.comparingLong((RoomTimeline t) -&gt; idle(t, w))\n                                               .thenComparingInt(t -&gt; t.room.capacity()).thenComparing(t -&gt; t.room.id()));\n    }\n    /** Minutes the room would sit empty just before and just after w, within w&#x27;s day. */\n    static long idle(RoomTimeline t, Interval w) {\n        LocalDate day = Time.local(w.start(), Time.OFFICE).toLocalDate();\n        long dayStart = day.atStartOfDay(Time.OFFICE).toEpochSecond() / 60;\n        long dayEnd = day.plusDays(1).atStartOfDay(Time.OFFICE).toEpochSecond() / 60;\n        Booking prev = t.before(w.start()), next = t.after(w.end());\n        long left = w.start() - Math.max(dayStart, prev == null ? dayStart : prev.when().end());\n        long right = Math.min(dayEnd, next == null ? dayEnd : next.when().start()) - w.end();\n        return Math.max(0, left) + Math.max(0, right);\n    }\n}\n\n/**\n * Uber&#x27;s other follow-up: an audit log per room (what was booked, moved, cancelled or answered, and when),\n * with entries older than X days deleted. A listener, so the booking code never knows it exists. Per room\n * a TreeMap keyed by the minute an entry was written, so the purge is one headMap(cutoff).clear() that\n * touches only what it deletes.\n */\nfinal class RoomAuditLog implements CalendarListener {\n    private final Clock clock;\n    private final Map&lt;String, TreeMap&lt;Long, List&lt;String&gt;&gt;&gt; byRoom = new HashMap&lt;&gt;();\n\n    RoomAuditLog(Clock clock) { this.clock = clock; }\n    /** Write the change under its room; a move between rooms is written under both. */\n    public synchronized void onEvent(CalendarEvent e) {\n        long now = clock.nowMinutes();\n        String line = e.kind() + &quot; &quot; + e.booking().id() + &quot; &quot; + e.booking().when() + (e.person() == null ? &quot;&quot; : &quot; &quot; + e.person() + &quot; &quot; + e.answer());\n        write(e.booking().roomId(), now, line);\n        if (e.before() != null &amp;&amp; !e.before().roomId().equals(e.booking().roomId())) write(e.before().roomId(), now, line + &quot; (moved out)&quot;);\n    }\n    /** Delete every entry written more than `days` days ago. Returns how many went. */\n    synchronized int purgeOlderThan(int days) {\n        long cutoff = clock.nowMinutes() - days * 1440L;\n        int gone = 0;\n        for (TreeMap&lt;Long, List&lt;String&gt;&gt; log : byRoom.values()) {\n            SortedMap&lt;Long, List&lt;String&gt;&gt; old = log.headMap(cutoff);\n            for (List&lt;String&gt; l : old.values()) gone += l.size();\n            old.clear();\n        }\n        return gone;\n    }\n    /** A room&#x27;s entries, oldest first. */\n    synchronized List&lt;String&gt; entries(String roomId) {\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (List&lt;String&gt; l : byRoom.getOrDefault(roomId, new TreeMap&lt;&gt;()).values()) out.addAll(l);\n        return out;\n    }\n    /** Append one line under a room and a minute. */\n    private void write(String room, long now, String line) {\n        byRoom.computeIfAbsent(room, k -&gt; new TreeMap&lt;&gt;()).computeIfAbsent(now, k -&gt; new ArrayList&lt;&gt;()).add(line);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>9 &middot; Rules change mid-round: no meeting over 12 hours, office hours only, nothing in the past, then slots on a 30-minute grid. Where does each one go?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Each is a class that wraps the rule before it and adds one check. It asks the wrapped rule first and returns its reason if there is one, otherwise its own. So a new rule is a new class and one changed line in <code>configure()</code>, and <code>BookingService</code> never opens. Unlike prices that stack (surge then cap and cap then surge give different bills), the order barely matters here: every rule must pass, so the order changes only which reason you see first. The grid rule has one trap worth saying aloud. India is five and a half hours ahead of UTC, so a grid checked on UTC minutes puts the hour marks at half past; the rule reads the wall clock in the office's zone instead. A test shows that 10:00 in India is 04:30 UTC and is still allowed on a whole-hour grid.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * A rule about WHEN a meeting may happen: the longest meeting, office hours, nothing in the past. It\n * returns why not, or null when the time is allowed. Rules wrap each other, so a new rule edits no old one.\n */\ninterface BookingPolicy { String whyNot(Interval when, long now); }\n\n/** Allows every time: the innermost rule, which the others wrap. */\nfinal class AnyTime implements BookingPolicy {\n    /** Always allowed. */\n    public String whyNot(Interval when, long now) { return null; }\n}\n\n/** No meeting longer than a cap (12 hours in Cleartrip&#x27;s version). Wraps the rule before it. */\nfinal class MaxLength implements BookingPolicy {\n    private final BookingPolicy base;\n    private final long maxMinutes;\n    MaxLength(BookingPolicy base, long maxMinutes) { this.base = base; this.maxMinutes = maxMinutes; }\n    /** The wrapped rule first, then the length. */\n    public String whyNot(Interval w, long now) {\n        String why = base.whyNot(w, now);\n        if (why != null) return why;\n        return w.minutes() &gt; maxMinutes ? &quot;longer than &quot; + maxMinutes / 60 + &quot; hours&quot; : null;\n    }\n}\n\n/** No meeting may start before now. Wraps the rule before it. */\nfinal class NotInPast implements BookingPolicy {\n    private final BookingPolicy base;\n    NotInPast(BookingPolicy base) { this.base = base; }\n    /** The wrapped rule first, then the start against the clock. */\n    public String whyNot(Interval w, long now) {\n        String why = base.whyNot(w, now);\n        if (why != null) return why;\n        return w.start() &lt; now ? &quot;starts in the past&quot; : null;\n    }\n}\n\n/** Only inside office hours, on one day, in a zone: for example 08:00 to 20:00. Wraps the rule before it. */\nfinal class OfficeHours implements BookingPolicy {\n    private final BookingPolicy base;\n    private final int openHour, closeHour;\n    private final ZoneId zone;\n    OfficeHours(BookingPolicy base, int openHour, int closeHour, ZoneId zone) {\n        this.base = base; this.openHour = openHour; this.closeHour = closeHour; this.zone = zone;\n    }\n    /** The wrapped rule first, then: starts at or after opening, ends by closing, same day. */\n    public String whyNot(Interval w, long now) {\n        String why = base.whyNot(w, now);\n        if (why != null) return why;\n        ZonedDateTime s = Time.local(w.start(), zone), e = Time.local(w.end(), zone);\n        boolean inside = s.toLocalDate().equals(e.toLocalDate()) &amp;&amp; s.getHour() &gt;= openHour\n                         &amp;&amp; e.getHour() * 60 + e.getMinute() &lt;= closeHour * 60;\n        return inside ? null : &quot;outside office hours &quot; + openHour + &quot;:00-&quot; + closeHour + &quot;:00&quot;;\n    }\n}\n\n// ---- ext: a time rule on a grid -------------------------------------------------------------------------\n/**\n * One more time rule, stacked on the others without editing them: a meeting starts and ends on a grid (30\n * minutes for Flipkart&#x27;s doctors, whole hours in Cleartrip&#x27;s version). The grid is read on the WALL clock:\n * India is UTC+5:30, so a grid on UTC minutes would put the hour marks at half past. Every rule must pass,\n * so the order of wrapping changes only which reason is reported first.\n */\nfinal class SlotGrid implements BookingPolicy {\n    private final BookingPolicy base;\n    private final int gridMinutes;\n    private final ZoneId zone;\n    SlotGrid(BookingPolicy base, int gridMinutes, ZoneId zone) { this.base = base; this.gridMinutes = gridMinutes; this.zone = zone; }\n    /** The wrapped rule first, then: start and end on the grid, local time. */\n    public String whyNot(Interval w, long now) {\n        String why = base.whyNot(w, now);\n        if (why != null) return why;\n        ZonedDateTime s = Time.local(w.start(), zone), e = Time.local(w.end(), zone);\n        boolean onGrid = (s.getHour() * 60 + s.getMinute()) % gridMinutes == 0 &amp;&amp; (e.getHour() * 60 + e.getMinute()) % gridMinutes == 0;\n        return onGrid ? null : &quot;slots are &quot; + gridMinutes + &quot; minutes, on the &quot; + gridMinutes + &quot;-minute marks&quot;;\n    }\n}\n\n// the one line that changes in the setup:\nsvc.configure(new SmallestFit(),\n    new SlotGrid(new OfficeHours(new NotInPast(new MaxLength(new AnyTime(), 12 * 60)), 8, 20, Time.OFFICE), 30, Time.OFFICE),\n    new InviteAnyway());\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Amazon&#x27;s twist: a user picks a slot but has not confirmed it yet. Hold it for ten minutes; if they never confirm, free it.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A hold is a real booking, so nobody else can take the room, and a desk remembers it with its deadline. <code>confirm()</code> before the deadline removes the deadline, and the booking simply stays. There is no timer thread: every call first sweeps the holds whose deadline has passed and cancels them, so an abandoned hold is released on the next touch. Confirm and expiry are decided under the desk's lock, so exactly one of them wins for each hold. The service is always called outside that lock, so the two locks are never taken in opposite orders. Time comes from the injected clock, so the test moves the clock ten minutes instead of sleeping, then checks that confirm returns false and the room can be booked again.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: hold, then confirm ----------------------------------------------------------------------------\n/**\n * &quot;Selected but not booked yet&quot; (Amazon): a hold takes the room like a booking, so nobody else can, and\n * carries a deadline. confirm() before the deadline keeps it; after it, the hold is already released.\n * Every call sweeps expired holds first, so no timer thread is needed. The desk&#x27;s lock guards only its own\n * map of deadlines; the service is always called outside it.\n */\nfinal class HoldDesk {\n    private final BookingService svc;\n    private final Clock clock;\n    private final long holdMinutes;\n    private final Map&lt;String, Long&gt; deadline = new HashMap&lt;&gt;();              // meeting id -&gt; the minute its hold ends\n    private final ReentrantLock lock = new ReentrantLock();\n\n    HoldDesk(BookingService svc, Clock clock, long holdMinutes) { this.svc = svc; this.clock = clock; this.holdMinutes = holdMinutes; }\n    /** Hold a room: a real booking, remembered here with its deadline. */\n    Result hold(String roomId, MeetingRequest r) {\n        releaseExpired();\n        Result res = svc.bookRoom(roomId, r);\n        if (res.ok()) {\n            lock.lock();\n            try { deadline.put(res.booking().id(), clock.nowMinutes() + holdMinutes); } finally { lock.unlock(); }\n        }\n        return res;\n    }\n    /** Keep the hold for good. False when it expired (the room is free again) or was never held. */\n    boolean confirm(String meetingId) {\n        releaseExpired();\n        lock.lock();\n        try { return deadline.remove(meetingId) != null; } finally { lock.unlock(); }\n    }\n    /** Cancel every hold whose deadline has passed; exactly one of confirm and expiry wins, under the lock. Returns how many. */\n    int releaseExpired() {\n        List&lt;String&gt; gone = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            long now = clock.nowMinutes();\n            for (Iterator&lt;Map.Entry&lt;String, Long&gt;&gt; it = deadline.entrySet().iterator(); it.hasNext(); ) {\n                Map.Entry&lt;String, Long&gt; e = it.next();\n                if (e.getValue() &lt;= now) { gone.add(e.getKey()); it.remove(); }\n            }\n        } finally { lock.unlock(); }\n        for (String id : gone) svc.cancelBooking(id);                          // outside the desk&#x27;s lock\n        return gone.size();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; Now it is a gym class with 20 seats, or a doctor&#x27;s 30-minute slot: capacity above one, a waiting list, tiers (Platinum 10 classes, Gold 5, Silver 3), and no cancelling in the last 30 minutes.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The shape changes from one meeting per room per time to up to N members per class. So a class holds a set of members and a queue of those waiting, all behind one desk lock. <code>book()</code> is idempotent (a retry that arrives twice is applied once). It refuses a member who is already in an overlapping class (the doctor version: one patient, one slot at a time) or has used up their tier, and otherwise seats or queues them. <code>cancel()</code> refuses inside the last 30 minutes, gives the class back to the member's quota, and then seats the first waiting member who is still allowed, in the same lock. So the freed seat is never lost and never given twice. The ranked list of open slots takes a Comparator (start time today, a doctor's rating tomorrow): Strategy again. The race test: thirty members, ten seats, one instant, exactly ten seated.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: capacity above one: gym classes and doctors&#x27; slots -------------------------------------------\n/** A membership tier and how many classes it lets a member book (PhonePe&#x27;s version: 10, 5, 3). */\nenum Tier {\n    PLATINUM(10), GOLD(5), SILVER(3);\n    final int classes;\n    Tier(int classes) { this.classes = classes; }\n}\n\n/** One class, or one doctor&#x27;s slot (capacity 1): its time, its seats, who is in, who waits, in order. */\nfinal class ClassSlot {\n    final String id, title;\n    final Interval when;\n    final int capacity;\n    final Set&lt;String&gt; booked = new LinkedHashSet&lt;&gt;();                      // guarded by the desk&#x27;s lock\n    final Deque&lt;String&gt; waiting = new ArrayDeque&lt;&gt;();                      // first in, first promoted\n\n    ClassSlot(String id, String title, Interval when, int capacity) {\n        this.id = id; this.title = title; this.when = when; this.capacity = capacity;\n    }\n}\n\n/**\n * Gym classes and doctors&#x27; slots: the meeting-room core with capacity above one, behind one lock. book() is\n * idempotent (a retry is not a second seat), refuses a member who is already in an overlapping class or has\n * no classes left in their tier, and queues when the class is full. cancel() works until 30 minutes before\n * the start, gives the class back to the member&#x27;s quota, and seats the first waiting member who is still\n * allowed, inside the same lock, so a freed seat is never lost and never given twice.\n */\nfinal class ClassDesk {\n    /** How a request ended. */\n    enum Answer { BOOKED, ALREADY_BOOKED, WAITLISTED, OVERLAPS, NO_CLASSES_LEFT, TOO_LATE, NOT_BOOKED, CANCELLED }\n    static final long CANCEL_CUTOFF_MINUTES = 30;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Map&lt;String, ClassSlot&gt; classes = new HashMap&lt;&gt;();\n    private final Map&lt;String, Tier&gt; tiers = new HashMap&lt;&gt;();\n    private final Map&lt;String, Integer&gt; used = new HashMap&lt;&gt;();              // classes booked, per member\n    private final Map&lt;String, List&lt;ClassSlot&gt;&gt; mine = new HashMap&lt;&gt;();       // member -&gt; classes booked\n    private final Clock clock;\n\n    ClassDesk(Clock clock) { this.clock = clock; }\n    /** Register a member with a tier. */\n    void addMember(String m, Tier t) { lock.lock(); try { tiers.put(m, t); } finally { lock.unlock(); } }\n    /** Schedule a class. */\n    void addClass(ClassSlot c) { lock.lock(); try { classes.put(c.id, c); } finally { lock.unlock(); } }\n    /** A seat, or a place in the queue. */\n    Answer book(String member, String classId) {\n        lock.lock();\n        try {\n            ClassSlot c = cls(classId);\n            if (c.booked.contains(member)) return Answer.ALREADY_BOOKED;          // a retry changes nothing\n            if (c.waiting.contains(member)) return Answer.WAITLISTED;\n            Answer no = allowed(member, c);\n            if (no != null) return no;\n            if (c.booked.size() &lt; c.capacity) { seat(member, c); return Answer.BOOKED; }\n            c.waiting.addLast(member);\n            return Answer.WAITLISTED;\n        } finally { lock.unlock(); }\n    }\n    /** Give up a seat (or a place in the queue); the first waiting member who is still allowed takes the seat. */\n    Answer cancel(String member, String classId) {\n        lock.lock();\n        try {\n            ClassSlot c = cls(classId);\n            if (c.waiting.remove(member)) return Answer.CANCELLED;\n            if (!c.booked.contains(member)) return Answer.NOT_BOOKED;\n            if (clock.nowMinutes() &gt; c.when.start() - CANCEL_CUTOFF_MINUTES) return Answer.TOO_LATE;\n            c.booked.remove(member);\n            used.merge(member, -1, Integer::sum);\n            mine.get(member).remove(c);\n            while (!c.waiting.isEmpty() &amp;&amp; c.booked.size() &lt; c.capacity) {\n                String next = c.waiting.pollFirst();\n                if (allowed(next, c) == null) seat(next, c);                         // one who can no longer take it is skipped\n            }\n            return Answer.CANCELLED;\n        } finally { lock.unlock(); }\n    }\n    /** The ids of classes with a free seat, in the order the handed-in ranking says: start time today, a doctor&#x27;s rating tomorrow. */\n    List&lt;String&gt; open(Comparator&lt;ClassSlot&gt; ranking) {\n        lock.lock();\n        try {\n            List&lt;ClassSlot&gt; free = new ArrayList&lt;&gt;();\n            for (ClassSlot c : classes.values()) if (c.booked.size() &lt; c.capacity) free.add(c);\n            free.sort(ranking);\n            List&lt;String&gt; ids = new ArrayList&lt;&gt;();\n            for (ClassSlot c : free) ids.add(c.id);\n            return ids;                                     // ids, not the slots: their sets are guarded by this lock\n        } finally { lock.unlock(); }\n    }\n    /** Who is in, and who waits, in order: a copy. */\n    List&lt;String&gt; seated(String classId) { lock.lock(); try { return new ArrayList&lt;&gt;(cls(classId).booked); } finally { lock.unlock(); } }\n    /** The waiting list, first first: a copy. */\n    List&lt;String&gt; waiting(String classId) { lock.lock(); try { return new ArrayList&lt;&gt;(cls(classId).waiting); } finally { lock.unlock(); } }\n    /** Why a member may not take this class, or null when they may. */\n    private Answer allowed(String member, ClassSlot c) {\n        Tier t = tiers.get(member);\n        if (t == null) throw new NoSuchElementException(&quot;no member &quot; + member);\n        if (used.getOrDefault(member, 0) &gt;= t.classes) return Answer.NO_CLASSES_LEFT;\n        for (ClassSlot other : mine.getOrDefault(member, List.of())) if (other.when.overlaps(c.when)) return Answer.OVERLAPS;\n        return null;\n    }\n    /** Give a member a seat and count it against their tier. */\n    private void seat(String member, ClassSlot c) {\n        c.booked.add(member);\n        used.merge(member, 1, Integer::sum);\n        mine.computeIfAbsent(member, k -&gt; new ArrayList&lt;&gt;()).add(c);\n    }\n    /** A class by id, or an exception naming it. */\n    private ClassSlot cls(String id) {\n        ClassSlot c = classes.get(id);\n        if (c == null) throw new NoSuchElementException(&quot;no class &quot; + id);\n        return c;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Invitations: every guest gets one, the organiser hears each answer, a move asks everyone again. Then Zepto&#x27;s: share my calendar with view or edit rights, and let a guest propose a new time.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Answers live in the service, one map per meeting, and a move resets them to NEEDS_ACTION because the guests agreed to the old time. Every change becomes an event published after the lock is released, so a slow or broken mail server cannot hold up a booking; the Mailer is one listener. Sharing is data: per owner, a map from viewer to access (busy blocks only by default, VIEW, or EDIT). <code>view()</code> shows titles and rooms only to VIEW or EDIT; everyone else sees \"busy 10:00-11:00\". <code>move()</code> refuses anyone who is not the organiser and has no EDIT. A proposal is stored, not applied. When the organiser accepts it, it is just <code>reschedule()</code>, so it is all or nothing for free.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** A guest answers. The organiser is told after the unlock. Throws when this person was not invited. */\n    void respond(String meetingId, String guest, Rsvp answer) {\n        if (answer == Rsvp.NEEDS_ACTION) throw new IllegalArgumentException(&quot;NEEDS_ACTION is not an answer&quot;);\n        CalendarEvent e;\n        lock.lock();\n        try {\n            Booking b = byId.get(meetingId);\n            if (b == null) throw new NoSuchElementException(&quot;no meeting &quot; + meetingId);\n            Map&lt;String, Rsvp&gt; a = answers.get(meetingId);\n            if (!a.containsKey(guest)) throw new IllegalArgumentException(guest + &quot; is not invited to &quot; + meetingId);\

lf; a lock per room keeps the invariant and never deadlocks\n        System.out.println(\"17. persistence and a lock per room\");\n        InMemoryBookingRepository repo = new InMemoryBookingRepository();\n        CountDownLatch go4 = new CountDownLatch(1), done4 = new CountDownLatch(50);\n        AtomicInteger stored = new AtomicInteger();\n        for (int i = 0; i < 50; i++) {\n            final int k = i;\n            new Thread(() -> {\n                try { go4.await(); if (repo.insertIfFree(new Booking(\"R\" + k, \"Kaveri\", mon(10, 0, 11, 0), \"p\" + k, \"\", 1, Set.of(), List.of(), null))) stored.incrementAndGet(); }\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n                finally { done4.countDown(); }\n            }).start();\n        }\n        go4.countDown();\n        done4.await();\n        check(stored.get() == 1 && repo.forRoom(\"Kaveri\", mon(0, 0, 23, 59)).size() == 1, \"fifty app servers insert the same room and hour: one row\");\n        PerRoomBooker pr = new PerRoomBooker(List.of(new Room(\"A\", \"\", 0, 4, Set.of()), new Room(\"B\", \"\", 0, 8, Set.of()), new Room(\"C\", \"\", 0, 12, Set.of())));\n        Booking inA = pr.bookRoom(\"A\", \"x\", mon(12, 0, 13, 0)), inB = pr.bookRoom(\"B\", \"y\", mon(14, 0, 15, 0));\n        Thread m1 = new Thread(() -> { for (int k = 0; k < 5000; k++) pr.move(inA.id(), k % 2 == 0 ? \"B\" : \"A\", mon(12, 0, 13, 0)); });\n        Thread m2 = new Thread(() -> { for (int k = 0; k < 5000; k++) pr.move(inB.id(), k % 2 == 0 ? \"A\" : \"B\", mon(14, 0, 15, 0)); });\n        m1.start(); m2.start(); m1.join(10_000); m2.join(10_000);\n        check(!m1.isAlive() && !m2.isAlive() && pr.overlaps() == 0, \"10,000 moves between two rooms in both directions at once: no deadlock (locks in id order), no overlap\");\n\n        // 18. the calendar side: permissions, proposals, the time most can make, rules from strings, a grid, Cleartrip's commands\n        System.out.println(\"18. the calendar side and the command-line version\");\n        BookingService sc = Main.office();\n        SharedCalendars share = new SharedCalendars(sc);\n        Result mt = sc.bookRoom(\"Kaveri\", req(\"asha\", 10, 0, 11, 0).titled(\"pricing\").inviting(\"ravi\"));\n        share.share(\"asha\", \"meera\", Access.VIEW);\n        check(share.view(\"kiran\", \"asha\", mon(0, 0, 23, 59)).equals(List.of(\"busy 10:00-11:00\")) && share.view(\"meera\", \"asha\", mon(0, 0, 23, 59)).get(0).startsWith(\"pricing\"),\n              \"without a grant you see only busy blocks; with VIEW you see the title\");\n        boolean refusedEdit = false;\n        try { share.move(\"meera\", mt.booking().id(), mon(12, 0, 13, 0)); } catch (SecurityException e) { refusedEdit = true; }\n        check(refusedEdit, \"VIEW cannot move the meeting\");\n        String prop = share.propose(\"ravi\", mt.booking().id(), mon(15, 0, 16, 0));\n        check(share.accept(\"asha\", prop).status() == Status.MOVED && sc.get(mt.booking().id()).when().equals(mon(15, 0, 16, 0)), \"ravi proposes 15:00, asha accepts, the meeting moves\");\n        BookingService ma = Main.office();\n        ma.bookRoom(\"Ganga\", req(\"p1\", 10, 0, 12, 0));\n        ma.bookRoom(\"Kaveri\", req(\"p2\", 10, 0, 11, 0));\n        ma.bookRoom(\"Narmada\", req(\"p3\", 11, 0, 13, 0));\n        MostAvailable.Pick pick = MostAvailable.find(ma, List.of(\"p1\", \"p2\", \"p3\"), 60, mon(10, 0, 13, 0));\n        check(pick.when().equals(mon(12, 0, 13, 0)) && pick.free().equals(List.of(\"p1\", \"p2\")), \"no hour suits all three: 12:00 suits two, the most\");\n        Recurrence every2 = RecurrenceFactory.parse(\"FREQ=WEEKLY;INTERVAL=2;UNTIL=20261109\", Time.OFFICE);\n        boolean unsupported = false;\n        try { RecurrenceFactory.parse(\"FREQ=WEEKLY;BYDAY=MO;UNTIL=20261109\", Time.OFFICE); } catch (IllegalArgumentException e) { unsupported = true; }\n        check(every2.everyDays() == 14 && every2.dates(mon(16, 0, 17, 0)).size() == 4 && unsupported, \"an RRULE every two weeks gives 4 dates; an unsupported part is refused by name\");\n        BookingPolicy hourGrid = new SlotGrid(new AnyTime(), 60, Time.OFFICE);\n        check(hourGrid.whyNot(mon(10, 0, 11, 0), 0) == null && mon(10, 0) % 60 != 0 && hourGrid.whyNot(mon(10, 30, 11, 30), 0) != null,\n              \"a whole-hour grid on the wall clock allows 10:00 (which is 04:30 UTC) and refuses 10:30\");\n        CommandDriver cli = new CommandDriver(LocalDate.of(2026, 9, 28));\n        for (String cmd : List.of(\"ADD BUILDING b1\", \"ADD FLOOR b1 7\", \"ADD CONFROOM b1 7 c1 6\", \"ADD CONFROOM b1 7 c2 10\", \"BOOK u1 1:5 b1 7 c1\", \"BOOK u2 3:10 b1 7 c2\")) cli.run(cmd);\n        check(cli.run(\"SEARCH 3:10 b1 7\").equals(\"No Rooms available\") && cli.run(\"SUGGEST 3:10\").equals(\"5:12 b1/7/c1, 6:13 b1/7/c1, 7:14 b1/7/c1\")\n              && cli.run(\"BOOK u3 1:14 b1 7 c1\").equals(\"ERROR: longer than 12 hours\") && cli.run(\"LIST BOOKING b1 7\").equals(\"1:5 7 b1 c1\\n3:10 7 b1 c2\")\n              && cli.run(\"BOOK u4 1:2 b9 7 c1\").equals(\"ERROR: no building b9\"), \"Cleartrip's commands: search, suggest, the 12-hour cap, the list, a clear error for a bad building\");\n\n        System.out.println(failed == 0 ? \"ALL PASS\" : failed + \" FAILED\");\n        if (failed > 0) System.exit(1);\n    }\n}\n"};
function wireCopy(root){root.querySelectorAll('button.copy').forEach(b=>{b.onclick=()=>{const key=b.dataset.key;const txt=key?RAW[key]:b.closest('.ed').querySelector('code').textContent;navigator.clipboard.writeText(txt).then(()=>{b.textContent='copied';setTimeout(()=>b.textContent='copy',1500);});};});}
const KW=/\b(abstract|boolean|break|case|catch|class|continue|default|do|double|else|enum|extends|final|finally|for|if|implements|import|int|interface|long|new|null|package|private|protected|public|return|static|super|switch|synchronized|this|throw|throws|try|void|while|var|record|true|false)\b/g;
const TY=/\b([A-Z][A-Za-z0-9]*)\b/g;
function hl(src){let inDoc=false;return src.split('\n').map((l,i)=>{let e=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const t=e.trim();let out;if(inDoc||t.startsWith('/**')){out='<span class="d">'+e+'</span>';if(t.startsWith('/**'))inDoc=!t.endsWith('*/');else if(t.endsWith('*/'))inDoc=false;}else{const parts=e.split(/(\/\/.*$|"(?:[^"\\]|\\.)*")/);out=parts.map((p,j)=>j%2?(p.startsWith('//')?'<span class="c">'+p+'</span>':'<span class="s">'+p+'</span>'):p.replace(KW,'<span class="k">$1</span>').replace(TY,'<span class="t">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>')).join('');}return '<span class="ln">'+(i+1)+'</span>'+out;}).join('\n');}
let cur=parseInt(localStorage.getItem('meeting-rooms.step')||'1',10);
const side=document.getElementById('side'),study=document.getElementById('study');
function classesSoFar_unused(n){const out=[];STEPS.filter(s=>s.id<=n&&s.code).forEach(s=>{(s.code.match(/(?:class|interface|enum)\s+([A-Z]\w*)/g)||[]).forEach(m=>out.push({name:m.split(/\s+/)[1],step:s.id}));});return out;}
function render(){
  side.innerHTML='';let g='';STEPS.forEach(s=>{if(s.stage!==g){g=s.stage;side.insertAdjacentHTML('beforeend','<div class="grp">'+g+'</div>');}side.insertAdjacentHTML('beforeend','<div class="st'+(s.id===cur?' on':s.id<cur?' done':'')+'" data-id="'+s.id+'"><span class="n">'+String(s.id).padStart(2,'0')+'</span><span>'+s.title+'</span></div>');});
  const s=STEPS[cur-1];
  study.innerHTML='<div class="hdr"><span class="stage">'+s.stage+'</span><h2>'+String(s.id).padStart(2,'0')+' &middot; '+s.title+'</h2></div>'+(s.think?'<div class="think">'+s.think+'</div>':'')+(s.body||'')+(s.code?'<div class="ed"><div class="tab"><b>'+(s.file||'Main.java')+'</b><button class="copy" data-src="ed">copy</button></div><pre><code class="java">'+hl(s.code)+'</code></pre></div>':'')+'<div class="nav"><button id="prev">&larr; prev</button><button id="next" class="pri">next &rarr;</button></div>';
  study.querySelectorAll('pre code.java').forEach(el=>{el.innerHTML=hl(el.textContent);});wireCopy(study);wireTimers(study);const miss=document.getElementById('miss');if(miss){try{miss.value=localStorage.getItem('meeting-rooms.miss')||'';}catch(e){}miss.addEventListener('input',()=>{try{localStorage.setItem('meeting-rooms.miss',miss.value);}catch(e){}});}
  document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
  document.querySelector('.wrap').classList.toggle('wide',!!s.wide);document.querySelector('.wrap').classList.toggle('code',!!s.code);localStorage.setItem('meeting-rooms.step',cur);study.scrollIntoView();
}
function go(n){if(n<1||n>STEPS.length)return;cur=n;setMode('study');render();}
side.addEventListener('click',e=>{const t=e.target.closest('.st');if(t)go(+t.dataset.id);});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
const main=document.getElementById('main');
function setMode(m){}
function wireTimers(root){root.querySelectorAll('button.timer[data-min]').forEach(b=>{const total=+b.dataset.min*60;let left=total,id=null;const show=()=>{b.textContent=(id?'':'start ')+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');};b.onclick=()=>{if(id){clearInterval(id);id=null;b.classList.remove('run');show();return;}if(left<=0)left=total;b.classList.remove('done');b.classList.add('run');id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;b.classList.remove('run');b.classList.add('done');b.textContent='time -- open the fold';}},1000);show();};show();});}
render();

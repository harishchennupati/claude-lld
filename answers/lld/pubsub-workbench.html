,000 ms timeout: no wakeup was lost&quot;);\n        waiter.shutdown();\n        wk.close();\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>4 &middot; One lock per topic. Have you just serialised the whole broker?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No, and the answer is arithmetic. For one topic, yes: publishes take turns, which is what serialised means. But each turn is short: read the tail, build the message, store it in its slot, signal the waiting subscribers. With twenty subscribers that measured about 0.3 microseconds, so two thousand publishes a second hold the lock 0.07% of the time. The lock is per topic, so ten thousand topics never meet. The ring has no slow case: no trim and no copy, the same cost at any size. If they push, name the ladder from move 8: partitions, then compare-and-set, then the log leaves the process. The lock is the unfair kind on purpose. A fair one hands every acquire through a queue, which costs more than the work inside it. Nothing here is held long enough for a publisher to starve (wait forever while others cut in). The readers have their own ceiling: one thread per subscription is fine into the low hundreds. Past that, use a fixed pool that still runs each subscription's messages one at a time; Subscription does not change.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">final class Topic {\n    private final String name;\n    private final Message[] ring;                                       // offset o is in slot o % ring.length; guarded by lock\n    private long head = 0;                                              // the oldest offset still in the ring; guarded by lock\n    private long lastAtMs = Long.MIN_VALUE;                             // the newest timestamp so far; guarded by lock\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Condition appended = lock.newCondition();\n    // The two numbers a dashboard asks for a thousand times a second, rewritten inside the lock and read outside it.\n    // volatile: a reader on any thread sees the latest write without taking the lock. One message stale is harmless.\n    private volatile long tail = 0;                                     // the offset the NEXT message will get\n    private volatile long earliest = 0;                                 // = head, for readers that take no lock\n\n    Topic(String name, int capacity) {\n        if (capacity &lt; 1) throw new IllegalArgumentException(&quot;retention must be at least one message&quot;);\n        this.name = name; this.ring = new Message[capacity];\n    }\n    /** The topic&#x27;s name, which is the only thing a publisher needs to know. */\n    String name() { return name; }\n\n    /**\n     * The critical step, and the reason this class has a lock. Assigning an offset and storing at it are TWO\n     * operations: two publishers that both read tail = 7 would both write slot 7, and one message would vanish.\n     * Here both happen as one step. On a full ring the store overwrites the oldest message and head moves up by\n     * one: O(1), nothing is copied. The waiting dispatchers are signalled before the lock is released: the signal\n     * must happen under the same lock they check under, or it lands between their check and their wait and is lost.\n     */\n    Message append(String key, String payload, Map&lt;String, String&gt; headers, long atMs) {\n        Map&lt;String, String&gt; h = headers == null ? Map.of() : Map.copyOf(headers);   // copied before the lock, not inside it\n        lock.lock();\n        try {\n            long off = tail;\n            lastAtMs = Math.max(lastAtMs, atMs);                        // a clock that steps back never reorders the log\n            Message m = new Message(off, name, key, payload, h, lastAtMs);\n            ring[(int) (off % ring.length)] = m;                        // on a full ring this overwrites offset off - size ...\n            if (off - head == ring.length) head++;                      // ... which is now gone, and counted\n            tail = off + 1; earliest = head;                            // republish the two numbers readers poll\n            appended.signalAll();\n            return m;\n        } finally { lock.unlock(); }\n    }\n\n    /** The message at this offset, or null if it has not been published yet or the ring has overwritten it. O(1). */\n    Message readAt(long offset) { lock.lock(); try { return at(offset); } finally { lock.unlock(); } }\n    private Message at(long offset) {                                   // lock must be held\n        return (offset &lt; head || offset &gt;= tail) ? null : ring[(int) (offset % ring.length)];\n    }\n    /** The offset the NEXT message will be given. tail minus a cursor is that subscriber&#x27;s lag. One volatile read: no lock. */\n    long tailOffset() { return tail; }\n    /** The oldest offset still in the ring. A cursor below this has fallen off the back. One volatile read: no lock. */\n    long earliestOffset() { return earliest; }\n    /** An offset pulled inside what exists: not below the oldest message still held, not past the next one to come. */\n    long clamp(long offset) { return Math.max(earliest, Math.min(offset, tail)); }\n    /** How many messages the ring holds when it is full: the retention, in messages. */\n    int capacity() { return ring.length; }\n    /** How many messages the ring has overwritten. Counted, not hidden: visible loss beats invisible loss. */\n    long droppedCount() { return earliest; }\n    /** How many messages are in the ring right now. */\n    int retained() { lock.lock(); try { return (int) (tail - head); } finally { lock.unlock(); } }\n\n    /**\n     * Wait for the message at this offset, up to a timeout. The check and the wait are inside ONE lock, the same\n     * lock the publisher signals under, and inside a `while`. That makes a lost wakeup impossible and a spurious\n     * one (a wake-up with no signal, which Java allows) harmless. Returns null on timeout, or when the ring has\n     * already overwritten the offset. An interrupt is passed on, never swallowed: it means &quot;stop&quot;.\n     */\n    Message awaitAt(long offset, long timeoutMs) throws InterruptedException {\n        lock.lock();\n        try {\n            long left = TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n            while (true) {\n                if (offset &lt; head) return null;                         // overwritten before we read it; the caller fast-forwards\n                Message m = at(offset);\n                if (m != null) return m;\n                if (left &lt;= 0) return null;\n                left = appended.awaitNanos(left);\n            }\n        } finally { lock.unlock(); }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; A handler throws. Where is the cursor afterwards, and what guarantee have you just implemented?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The cursor has not moved: the increment is the last statement of the loop, and it runs only when deliver returns true. deliver calls the handler with no lock held. On an exception it asks the policy how long to wait, sleeps, and tries again. When the policy answers a negative number, it parks the message in the dead-letter sink and returns true anyway. Giving up must move the cursor, or the subscription is stuck forever on one bad message. A filter that throws takes the same path. A stop in the middle returns false, so that message is handed out again. That is at-least-once, and it is one line: move the increment above the handler call and you have at-most-once, which is right for a metrics ping. The price of at-least-once is duplicates, so handlers must be idempotent. When the business code is not, IdempotentHandler remembers the ids it has handled and skips a repeat. In production those ids live in the database, written in the same transaction as the business change.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Hand one message to the filter and the handler, outside every lock, and survive either one throwing.\n     * Returns true when the message is finished with: skipped, handled, or given up on and parked. That is the\n     * only time the caller may commit. Returns false when stop() came first: the handler was interrupted, or\n     * the stop arrived while it was failing. That message goes to whoever reads from this cursor next.\n     */\n    private boolean deliver(Message m) {\n        for (int attempt = 1; ; attempt++) {\n            try {\n                if (!filter.accepts(m)) {                               // not ours: no handler call, but the cursor still moves\n                    skipped.incrementAndGet();\n                    events.onEvent(new Event(EventType.SKIPPED, topic.name(), m.offset(), id, 0, clock.nowMs()));\n                    return true;\n                }\n                handler.onMessage(m);                                   // user code: no lock of ours is held here\n                delivered.incrementAndGet();\n                events.onEvent(new Event(EventType.DELIVERED, topic.name(), m.offset(), id, attempt, clock.nowMs()));\n                return true;\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();\n                return false;                                           // stop() interrupted the handler: do NOT commit\n            } catch (Exception e) {                                     // not Throwable: an OutOfMemoryError must end the thread\n                if (state == SubState.STOPPED) return false;            // stopped while failing: no retry, no parking\n                long wait = retry.backoffMs(attempt, e);                // a throwing filter lands here too, like a handler\n                if (wait &lt; 0) {                                         // the policy gave up: park it and MOVE ON\n                    sink.park(new Dead(m, id, attempt, e.toString(), clock.nowMs()));\n                    deadLettered.incrementAndGet();\n                    events.onEvent(new Event(EventType.DEAD_LETTERED, topic.name(), m.offset(), id, attempt, clock.nowMs()));\n                    return true;                                        // giving up must never stall the subscription\n                }\n                retried.incrementAndGet();\n                events.onEvent(new Event(EventType.RETRIED, topic.name(), m.offset(), id, attempt, clock.nowMs()));\n                try { clock.sleepMs(wait); }\n                catch (InterruptedException stop) { Thread.currentThread().interrupt(); return false; }   // stop() during the wait\n            }\n        }\n    }\n\n// ---- ext: exactly-once for the handler -- at-least-once plus a memory of ids, which is the only honest version\n/**\n * At-least-once means duplicates, so the handler must be idempotent: handling a message twice must have the same\n * effect as handling it once. When the business code is not, this decorator gets there: it remembers the ids\n * already handled and skips a repeat. The memory is bounded, because an unbounded one is a slow leak. It is also\n * locked, because one instance is often shared: ConsumerGroup hands the same handler to every member&#x27;s thread.\n * In production the ids live in the database, written in the same transaction as the business change.\n */\nfinal class IdempotentHandler implements Handler {\n    private final Handler base;\n    private final AtomicLong duplicates = new AtomicLong();\n    private final LinkedHashMap&lt;String, Boolean&gt; seen;\n    IdempotentHandler(Handler base, int remember) {\n        this.base = base;\n        this.seen = new LinkedHashMap&lt;&gt;(16, 0.75f, false) {\n            @Override protected boolean removeEldestEntry(Map.Entry&lt;String, Boolean&gt; eldest) { return size() &gt; remember; }\n        };\n    }\n    public void onMessage(Message m) throws Exception {\n        String id = m.headers().getOrDefault(&quot;id&quot;, m.topic() + &quot;@&quot; + m.offset());\n        synchronized (seen) {\n            if (seen.put(id, Boolean.TRUE) != null) { duplicates.incrementAndGet(); return; }   // already done: ack it again\n        }\n        try { base.onMessage(m); }                                       // outside the lock: members still run side by side\n        catch (Exception e) { synchronized (seen) { seen.remove(id); } throw e; }   // a failure is not &quot;done&quot;: retry it\n    }\n    /** How many repeats were swallowed. The number that tells you at-least-once is doing its job. */\n    long duplicates() { return duplicates.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; Someone calls unsubscribe while a delivery is in flight. What happens to the thread, and to that message?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p><code>stop</code> does three things, and the third is the one people forget. It sets the state to STOPPED, wakes a thread parked on the pause condition, and interrupts the dispatcher thread. The interrupt matters because that thread is almost never somewhere it can see a flag. It is waiting in <code>awaitNanos</code> for the next message, or asleep in a sixty-second backoff between retries. In the wait, awaitAt passes the <code>InterruptedException</code> up and the loop ends. In the backoff, deliver catches it, sets the interrupt flag again and returns <i>false</i>, the one path that does not commit. Either way the cursor stays where it was, and nothing is parked in the dead-letter sink. A replacement subscription started at that offset is handed the same message: at-least-once, proven by test 12. The interrupt is sent under the subscription's gate lock, and run() clears its thread under the same lock. So a stop that arrives late can never hit a pooled thread that has already moved on to another subscription. Say the limit out loud too: an interrupt is only a request. A handler that swallows it, or is blocked on a socket with no read timeout, cannot be stopped by anyone, so the timeout belongs on whatever the handler calls.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * End this subscription for good: STOPPED is final. A flag, a signal for a paused thread, and an interrupt,\n     * because the dispatcher may be waiting in awaitNanos or asleep in a backoff. All three happen under the gate,\n     * and run() clears `worker` under the same gate, so the interrupt can only reach this subscription&#x27;s own\n     * thread, never a pooled thread that has already moved on to another subscription.\n     */\n    void stop() {\n        gate.lock();\n        try {\n            state = SubState.STOPPED;\n            resumed.signalAll();\n            if (worker != null) worker.interrupt();\n        } finally { gate.unlock(); }\n    }\n\n        // 12. shutting down in the middle of a delivery: the thread ends at once and the message is NOT committed\n        Broker sd = new Broker(1_000);\n        InMemoryDeadLetters parked12 = new InMemoryDeadLetters();\n        sd.configure(new FixedDelayRetry(10, 60_000), parked12);                  // a minute between attempts, on purpose\n        CountDownLatch threw = new CountDownLatch(1);\n        Subscription stuck = sd.subscribe(&quot;stuck&quot;, &quot;slowjobs&quot;, m -&gt; { threw.countDown(); throw new IllegalStateException(&quot;downstream is down&quot;); });\n        sd.publish(&quot;slowjobs&quot;, null, &quot;j1&quot;);\n        check(threw.await(2, TimeUnit.SECONDS), &quot;the handler ran and threw, so the dispatcher is now asleep in a 60-second backoff&quot;);\n        long t12 = System.nanoTime();\n        sd.unsubscribe(&quot;stuck&quot;);\n        boolean ended = Main.awaitUntil(() -&gt; !stuck.running(), 2000);\n        long stopMs = (System.nanoTime() - t12) / 1_000_000;\n        check(ended &amp;&amp; stopMs &lt; 1_000, &quot;unsubscribe ended the dispatch loop in &quot; + stopMs + &quot; ms, not 60 s: stop() interrupts a parked thread&quot;);\n        check(stuck.offset() == 0, &quot;the cursor never moved: a shutdown in the middle of a delivery commits nothing&quot;);\n        check(parked12.size() == 0, &quot;and nothing was dead-lettered -- the message is unfinished, not given up on&quot;);\n        List&lt;String&gt; again = new CopyOnWriteArrayList&lt;&gt;();\n        sd.subscribe(&quot;stuck2&quot;, &quot;slowjobs&quot;, m -&gt; again.add(m.payload()), SubscribeOptions.opts().fromOffset(stuck.offset()));\n        check(Main.awaitUntil(() -&gt; again.equals(List.of(&quot;j1&quot;)), 2000), &quot;a replacement starting at that cursor is handed it again: at-least-once, proven&quot;);\n        sd.close();\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>7 &middot; A subscriber was down for an hour. What does it see when it is back, and what if no message may be lost (Razorpay)?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Whatever it had not finished, and nothing twice. Its cursor is the offset it will read next, committed only after a handler returned. So a restart from that number repeats nothing it acknowledged and skips nothing it did not. Subscribing with fromOffset does that in one line; fromEarliest replays everything the ring still holds. The hard case is a ring that filled up while it was down. By default the ring overwrites the oldest messages, and the subscriber skips ahead and adds the gap to its missed counter: a loss you can see, which is Kafka's choice. Razorpay's statement forbids that loss. Then a publish must never overwrite a message someone has not read. BackPressure lets a publish through only while the slowest cursor is less than a full ring behind, and refuses a publisher that has waited too long. Publishers of that topic take turns at the check, so two can never take the last free slot (test 17: eight publishers, 200 messages, none missed). For an outage longer than memory allows, spill the oldest messages to a file and read them back when the consumer returns; Razorpay lists that as a plus point.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 3. a subscriber restarts: it resumes at the offset it had committed, sees nothing twice and misses nothing\n        Broker rs = new Broker(1_000);\n        rs.configure(new FixedDelayRetry(3, 1), new InMemoryDeadLetters());\n        List&lt;String&gt; before = new CopyOnWriteArrayList&lt;&gt;(), after = new CopyOnWriteArrayList&lt;&gt;();\n        rs.subscribe(&quot;reader&quot;, &quot;feed&quot;, m -&gt; before.add(m.payload()));\n        for (int i = 0; i &lt; 5; i++) rs.publish(&quot;feed&quot;, &quot;k&quot;, &quot;m&quot; + i);\n        Main.awaitUntil(() -&gt; before.size() == 5, 2000);\n        long saved = rs.sub(&quot;reader&quot;).offset();\n        check(saved == 5, &quot;the cursor after five acknowledged messages is 5, the offset it will read NEXT&quot;);\n        rs.unsubscribe(&quot;reader&quot;);\n        for (int i = 5; i &lt; 10; i++) rs.publish(&quot;feed&quot;, &quot;k&quot;, &quot;m&quot; + i);           // published while it was down\n        rs.subscribe(&quot;reader&quot;, &quot;feed&quot;, m -&gt; after.add(m.payload()), SubscribeOptions.opts().fromOffset(saved));\n        check(Main.awaitUntil(() -&gt; after.size() == 5, 2000), &quot;the restarted subscriber picked up five messages&quot;);\n        check(after.equals(List.of(&quot;m5&quot;, &quot;m6&quot;, &quot;m7&quot;, &quot;m8&quot;, &quot;m9&quot;)), &quot;exactly the five it had not seen: no repeat, no gap&quot;);\n        rs.close();\n\n// ---- ext: guaranteed delivery -- a full ring makes the publisher wait for the slowest subscriber (back-pressure)\n/**\n * By default a full ring overwrites its oldest message and counts the loss: Kafka&#x27;s choice. Razorpay&#x27;s statement\n * asks for the opposite: every subscriber gets every message, even one that was down for an hour. Then a publish\n * must never overwrite a message some subscriber has not read. It waits for the slowest subscriber, and is\n * refused after a budget. That is back-pressure: the slow side pushes back on the fast side. The check and the\n * publish run one publisher at a time per topic, so two publishers can never both take the last free slot.\n * Every publisher of the topic must come through here.\n */\nfinal class BackPressure {\n    private final Broker broker;\n    private final Map&lt;String, ReentrantLock&gt; gates = new ConcurrentHashMap&lt;&gt;();\n    BackPressure(Broker broker) { this.broker = broker; }\n\n    /** Publish once the ring has a slot no subscriber still needs. Wait while it has none, then refuse loudly. */\n    long publish(String topic, String key, String payload, long budgetMs) throws InterruptedException {\n        Topic t = broker.topic(topic);\n        ReentrantLock gate = gates.computeIfAbsent(topic, k -&gt; new ReentrantLock());\n        long deadline = System.nanoTime() + TimeUnit.MILLISECONDS.toNanos(budgetMs);\n        while (true) {\n            gate.lock();\n            try {                                                       // check and publish as one step\n                if (t.tailOffset() - broker.slowestCursor(topic) &lt; t.capacity()) return broker.publish(topic, key, payload);\n            } finally { gate.unlock(); }\n            if (System.nanoTime() &gt;= deadline)\n                throw new IllegalStateException(&quot;back-pressure: every slot of &quot; + topic + &quot; holds a message somebody has not read&quot;);\n            Thread.sleep(1);                                            // nobody signals when a cursor moves: look again in 1 ms\n        }\n    }\n    // the three answers for a full log, in the order a system usually grows through them: overwrite the oldest and\n    // count it (the default ring, Kafka&#x27;s choice); make the publisher wait (this); or spill the oldest messages to\n    // disk and read them back when the slow consumer returns (Razorpay&#x27;s plus point; the FileStore below is that file).\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>8 &middot; One subscriber takes two seconds per message. What happens to the publisher, and to the other subscribers?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing happens to either. The publisher's call ends when the message is in the ring, which takes under a microsecond, and it never looks at a subscriber. The slow handler runs on its own dispatcher thread with no lock held, so the only thing that grows is that subscription's own lag. The test publishes six messages, checks the publish loop took no measurable time, checks the fast subscriber received all six, and checks the slow one is still behind. The junior version of this design calls every handler inside publish, which makes one slow subscriber an outage for everyone and one throwing subscriber a fan-out that stops halfway. The good version has a real cost worth saying: a stuck handler stalls its own subscription forever, so production puts a timeout on whatever the handler calls.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 7. one slow subscriber stalls neither the publisher nor the other subscribers\n        Broker sl = new Broker(1_000);\n        sl.configure(new FixedDelayRetry(3, 1), new InMemoryDeadLetters());\n        AtomicLong fast = new AtomicLong();\n        sl.subscribe(&quot;fast&quot;, &quot;mixed&quot;, m -&gt; fast.incrementAndGet());\n        sl.subscribe(&quot;slow&quot;, &quot;mixed&quot;, m -&gt; Thread.sleep(200));                   // 200 ms per message, on purpose\n        long t0 = System.nanoTime();\n        for (int i = 0; i &lt; 6; i++) sl.publish(&quot;mixed&quot;, &quot;k&quot;, &quot;m&quot; + i);\n        long publishMs = (System.nanoTime() - t0) / 1_000_000;\n        check(publishMs &lt; 100, &quot;six publishes returned in &quot; + publishMs + &quot; ms: a publisher never waits for a handler&quot;);\n        check(Main.awaitUntil(() -&gt; fast.get() == 6, 3000), &quot;the fast subscriber got all six immediately&quot;);\n        check(sl.sub(&quot;slow&quot;).delivered() &lt; 6, &quot;the slow one is still behind (&quot; + sl.sub(&quot;slow&quot;).lag() + &quot; to go) and that is its own problem&quot;);\n        sl.close();\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; Now make it competing consumers: a group of three workers, each message handled by exactly one of them, and per-key order kept.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It needs no new broker code at all, which is the sign that move 5 was right. A group member is a normal subscription with a filter that accepts only its own slice of the keys. So the three read the same log at three cursors, and each handles one message in three. Messages with the same key hash to the same member, so per-key order survives; a message with no key falls back to its offset, which spreads them in turn. The honest price is that each member walks the whole log and skips two thirds of it. That is fine at these volumes, and it is exactly what real Kafka fixes by giving each member its own partition log instead. That is the partitions extension below: the same idea one level down, and the reason consumer groups hand out partitions, not keys.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: consumer groups -- competing consumers, where each message is handled by exactly ONE member\n/**\n * Fan-out gives every subscriber every message. A consumer group is the other shape: three workers share the\n * load and each message is handled once. It needs no new broker code at all \u2014 a group member is a normal\n * subscription with a filter that accepts only its own slice of the key space. Messages with the same key\n * always land on the same member, so per-key order survives.\n */\nfinal class ConsumerGroup {\n    /** Start `members` subscriptions on one topic, each taking one slice. Returns them so a caller can stop one. */\n    static List&lt;Subscription&gt; join(Broker broker, String groupId, String topic, int members, Handler handler) {\n        List&lt;Subscription&gt; out = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; members; i++) {\n            final int slot = i;\n            out.add(broker.subscribe(groupId + &quot;#&quot; + i, topic, handler,\n                SubscribeOptions.opts().fromEarliest().filter(m -&gt; slotOf(m, members) == slot)));\n        }\n        return out;\n    }\n    /** Which member owns this message: by key if there is one, else round-robin by offset. */\n    static int slotOf(Message m, int members) {\n        long h = m.key() == null ? m.offset() : (m.key().hashCode() &amp; 0x7fffffffL);\n        return (int) Math.floorMod(h, members);\n    }\n    // the honest price of doing it with filters: every member walks the whole log and skips 2 messages in 3.\n    // Kafka gives each member its OWN partition log instead, which is the partitions extension below \u2014 the\n    // same idea one level down, and the reason real consumer groups rebalance partitions rather than keys.\n}\n\n// ---- ext: partitions -- N logs behind one name, so N publishers never meet, and order still holds per key\n/**\n * Rung 1 of the ladder from move 8. One topic is one log and one lock; a partitioned topic is N logs and N\n * locks, with the key deciding which. Two publishers using different keys never wait for each other, and\n * per-key order survives because a key always lands in the same partition, which has one subscription and one\n * thread. What is lost is total order across the topic \u2014 exactly the trade Kafka makes.\n */\nfinal class PartitionedTopic {\n    private final Broker broker;\n    private final String name;\n    private final int partitions;\n    PartitionedTopic(Broker broker, String name, int partitions) {\n        this.broker = broker; this.name = name; this.partitions = partitions;\n    }\n    /** The partition this key belongs to, forever. Changing the count reshuffles keys, which is why it is fixed. */\n    int partitionOf(String key) { return key == null ? 0 : (int) Math.floorMod(key.hashCode() &amp; 0x7fffffffL, partitions); }\n    /** The name of one underlying topic. */\n    String partitionName(int p) { return name + &quot;-p&quot; + p; }\n    /** Publish into the key&#x27;s partition. One lock per partition, so N publishers scale linearly. */\n    long publish(String key, String payload) { return broker.publish(partitionName(partitionOf(key)), key, payload); }\n    /** One subscription per partition, all running the same handler: per-key order, N threads. */\n    List&lt;Subscription&gt; subscribeAll(String subId, Handler h) {\n        List&lt;Subscription&gt; out = new ArrayList&lt;&gt;();\n        for (int p = 0; p &lt; partitions; p++)\n            out.add(broker.subscribe(subId + &quot;-p&quot; + p, partitionName(p), h, SubscribeOptions.opts().fromEarliest()));\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Razorpay&#x27;s version: subscribers pull. consume() returns their next messages and ack() confirms them. What changes?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The log and the cursors stay; only who runs the read loop changes. PullConsumers keeps one cursor per topic and consumer, which subscribe starts at the end of the log or at the oldest message. consume reads up to max messages from that cursor, leaves out the ones the consumer's filter rejects, and moves nothing. It returns a Batch: the messages, plus the offset to acknowledge. ack(next) commits the whole batch in one step and never moves backwards, so a consumer that crashes before ack is handed the same batch again: at-least-once. In the practice-site version (codezym), consume moves the cursor at once; that is consume and ack in one call, which is at-most-once. A consumer that is down just stops calling, and its cursor waits. With waitMs above zero, consume waits in awaitAt until a publish wakes it: a long poll, which is also Uber's \"notify the consumer when a message arrives\". Kafka itself works this way: a consumer calls poll() and then commits. A push-style listener, such as Spring's @KafkaListener, is a poll loop the library runs for you, just like Subscription.run().</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: pull instead of push -- consume() and ack(), the shape of Razorpay&#x27;s statement and codezym&#x27;s Kafka task\n/** One batch handed to a pulling consumer, and the offset to acknowledge once all of it is done. */\nrecord Batch(List&lt;Message&gt; messages, long next) {}\n\n/**\n * The same log and the same cursors, but nobody pushes: a consumer calls consume() when it is ready. consume()\n * reads from the committed cursor and moves nothing, so a consumer that crashes before ack() is handed the same\n * batch again: at-least-once. ack(next) commits the whole batch at once. A filter leaves messages out of the\n * batch, and the ack steps over them too. No thread per consumer: one that is down simply stops calling, and its\n * cursor waits where it was. One caller per consumer id at a time; two callers would be handed the same batch.\n */\nfinal class PullConsumers {\n    private final Broker broker;\n    private final Map&lt;String, AtomicLong&gt; cursors = new ConcurrentHashMap&lt;&gt;();   // &quot;topic/consumer&quot; -&gt; next offset to read\n    private final Map&lt;String, Filter&gt; filters = new ConcurrentHashMap&lt;&gt;();\n    PullConsumers(Broker broker) { this.broker = broker; }\n\n    /** Register a consumer: a new one starts at the end of the log, or at the oldest message the ring still holds. */\n    void subscribe(String topic, String consumerId, boolean fromEarliest, Filter filter) {\n        Topic t = broker.topic(topic);\n        cursors.putIfAbsent(topic + &quot;/&quot; + consumerId, new AtomicLong(fromEarliest ? t.earliestOffset() : t.tailOffset()));\n        filters.put(topic + &quot;/&quot; + consumerId, filter);\n    }\n    /**\n     * Up to max messages from the committed cursor, in order, leaving out what the filter rejects. Moves nothing.\n     * With waitMs above zero and nothing new, it waits in awaitAt until a publish wakes it: a long poll.\n     */\n    Batch consume(String topic, String consumerId, int max, long waitMs) throws InterruptedException {\n        Topic t = broker.topic(topic);\n        long next = t.clamp(cursor(topic, consumerId).get());           // what the ring overwrote is gone: start past it\n        if (waitMs &gt; 0) t.awaitAt(next, waitMs);                        // long poll: back as soon as offset `next` exists\n        List&lt;Message&gt; out = new ArrayList&lt;&gt;();\n        Filter f = filters.get(topic + &quot;/&quot; + consumerId);\n        for (Message m; out.size() &lt; max &amp;&amp; (m = t.readAt(next)) != null; next++)\n            if (f.accepts(m)) out.add(m);\n        return new Batch(out, next);\n    }\n    /** The consumer finished everything below `next`: commit it. Never backwards, never past the end of the log. */\n    void ack(String topic, String consumerId, long next) {\n        long upTo = Math.min(next, broker.topic(topic).tailOffset());\n        cursor(topic, consumerId).accumulateAndGet(upTo, Math::max);\n    }\n    /** The committed cursor: the next offset this consumer will be handed. */\n    long committed(String topic, String consumerId) { return cursor(topic, consumerId).get(); }\n    private AtomicLong cursor(String topic, String consumerId) {\n        AtomicLong c = cursors.get(topic + &quot;/&quot; + consumerId);\n        if (c == null) throw new NoSuchElementException(&quot;not subscribed: &quot; + consumerId + &quot; on &quot; + topic);\n        return c;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>11 &middot; The dashboard asks every subscriber&#x27;s lag a thousand times a second. Make it O(1).</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It already is. Lag is the topic's tail offset minus the subscription's cursor: two volatile reads and a subtraction, and nothing is scanned, counted or re-read. The tail is a volatile long that <code>append</code> rewrites inside the lock precisely so this read stays outside it. A metrics thread asking a thousand times a second must never queue behind a publisher, and a number that is one message stale is harmless. That shape follows directly from one log with a cursor per subscriber. With a queue per subscriber you would be asking for the size of a concurrent queue, which is at best approximate and at worst a walk over the whole queue. The broker's lagReport walks the subscription map once and does that subtraction per subscriber, so the whole dashboard is O(number of subscriptions). The alarm on top is a listener plus a filter over the report, and it needs no new state anywhere.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** The message at this offset, or null if it has not been published yet or the ring has overwritten it. O(1). */\n    Message readAt(long offset) { lock.lock(); try { return at(offset); } finally { lock.unlock(); } }\n    private Message at(long offset) {                                   // lock must be held\n        return (offset &lt; head || offset &gt;= tail) ? null : ring[(int) (offset % ring.length)];\n    }\n    /** The offset the NEXT message will be given. tail minus a cursor is that subscriber&#x27;s lag. One volatile read: no lock. */\n    long tailOffset() { return tail; }\n    /** The oldest offset still in the ring. A cursor below this has fallen off the back. One volatile read: no lock. */\n    long earliestOffset() { return earliest; }\n    /** An offset pulled inside what exists: not below the oldest message still held, not past the next one to come. */\n    long clamp(long offset) { return Math.max(earliest, Math.min(offset, tail)); }\n\n// ---- ext: lag metrics and an alarm -- the observer earning its keep\n/**\n * A listener that counts what the broker does, plus the alarm a dashboard actually needs: which subscribers are\n * falling behind. The counts come from events; the lag comes from the O(1) numbers the subscriptions already\n * keep, so nothing is scanned and no counter can drift from the truth.\n */\nfinal class LagMonitor implements BrokerListener {\n    private final EnumMap&lt;EventType, AtomicLong&gt; counts = new EnumMap&lt;&gt;(EventType.class);\n    LagMonitor() { for (EventType t : EventType.values()) counts.put(t, new AtomicLong()); }\n    public void onEvent(Event e) { counts.get(e.type()).incrementAndGet(); }\n    /** How many of this kind of event the broker has emitted. */\n    long count(EventType t) { return counts.get(t).get(); }\n    /** Every subscription more than `threshold` messages behind, worst first. */\n    static List&lt;String&gt; alarming(Broker broker, long threshold) {\n        List&lt;Map.Entry&lt;String, Long&gt;&gt; over = new ArrayList&lt;&gt;();\n        broker.lagReport().forEach((id, lag) -&gt; { if (lag &gt; threshold) over.add(Map.entry(id, lag)); });\n        over.sort((a, b) -&gt; Long.compare(b.getValue(), a.getValue()));\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (Map.Entry&lt;String, Long&gt; e : over) out.add(e.getKey() + &quot; (&quot; + e.getValue() + &quot; behind)&quot;);\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Persist it: messages must survive a restart. And then there are two processes.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The log goes behind a MessageStore and the cursors behind an OffsetStore, and no other class changes. The topic's ring becomes a cache of the newest part of the file. Each line carries its offset, and key and payload are Base64-encoded (turned into plain letters and digits), so a tab or a newline inside a payload cannot break a line. A restart reads the file back in offset order and puts each message back at its own offset and time. It goes straight into the topic rather than through publish, so no listener stores it a second time (test 19). A subscriber resumes with one line, because its cursor was always just a number. Two processes is where an in-process broker stops being the right tool, and you should say so. The log moves out to Kafka, Pulsar or a table with an increasing id. The topic's lock becomes the partition leader's, and the cursor becomes a committed offset in the broker's own store. Every class here keeps its name, which is why the mapping table is the same explanation at two sizes.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- the log on disk, and the cursors too, so a restart resumes instead of starting over\n/** The seam. The topic&#x27;s ring becomes a cache of the newest part of this file; nothing else in the design changes. */\ninterface MessageStore {\n    /** Append one message after the topic gave it its offset. The line carries the offset, so a replay puts it back in place. */\n    void append(Message m) throws IOException;\n    /** Every stored message of one topic, in offset order. One sequential file read. */\n    List&lt;Message&gt; replay(String topic) throws IOException;\n}\n\n/**\n * One append-only text file, one message per line: offset, topic, key, payload, timestamp. Key and payload are\n * Base64, so a tab or a newline inside them cannot break a line. A real one uses fixed-size files (&quot;segments&quot;)\n * and forces each write to disk (FileChannel.force) before the publish returns.\n */\nfinal class FileStore implements MessageStore {\n    private final Path file;\n    FileStore(Path file) throws IOException { this.file = file; if (!Files.exists(file)) Files.createFile(file); }\n    public synchronized void append(Message m) throws IOException {\n        String line = m.offset() + &quot;\\t&quot; + m.topic() + &quot;\\t&quot; + enc(m.key()) + &quot;\\t&quot; + enc(m.payload()) + &quot;\\t&quot; + m.atMs() + &quot;\\n&quot;;\n        Files.writeString(file, line, StandardCharsets.UTF_8, StandardOpenOption.APPEND);\n    }\n    /** Lines may be out of order, because two publishers&#x27; listeners can write in either order: sort by offset. */\n    public List&lt;Message&gt; replay(String topic) throws IOException {\n        List&lt;Message&gt; out = new ArrayList&lt;&gt;();\n        for (String line : Files.readAllLines(file, StandardCharsets.UTF_8)) {\n            String[] f = line.split(&quot;\\t&quot;, -1);\n            if (f.length == 5 &amp;&amp; f[1].equals(topic))\n                out.add(new Message(Long.parseLong(f[0]), f[1], dec(f[2]), dec(f[3]), Map.of(), Long.parseLong(f[4])));\n        }\n        out.sort(Comparator.comparingLong(Message::offset));\n        return out;\n    }\n    private static String enc(String s) { return s == null ? &quot;-&quot; : Base64.getEncoder().encodeToString(s.getBytes(StandardCharsets.UTF_8)); }\n    private static String dec(String f) { return f.equals(&quot;-&quot;) ? null : new String(Base64.getDecoder().decode(f), StandardCharsets.UTF_8); }\n}\n\n/** Where a subscriber&#x27;s committed cursor lives across a restart. In Kafka this is the __consumer_offsets topic. */\ninterface OffsetStore {\n    /** Remember that this subscription has finished everything below `offset`. */\n    void commit(String subscriptionId, long offset);\n    /** The remembered cursor, or the default for a subscriber that has never run. */\n    long committed(String subscriptionId, long orElse);\n}\n\n/** The in-memory version, which is the file version wearing a different coat. */\nfinal class InMemoryOffsets implements OffsetStore {\n    private final Map&lt;String, Long&gt; at = new ConcurrentHashMap&lt;&gt;();\n    public void commit(String subscriptionId, long offset) { at.put(subscriptionId, offset); }\n    public long committed(String subscriptionId, long orElse) { return at.getOrDefault(subscriptionId, orElse); }\n}\n\n/** Restore a broker from a store after a restart, then resume each subscriber from its committed cursor. */\nfinal class Recovery {\n    /**\n     * Put every stored message of a topic back into a fresh broker, at its own offset and with its own time.\n     * Straight into the topic, not through publish(): a replay is not a new message, so no listener may store it again.\n     */\n    static int restore(Broker broker, MessageStore store, String topic) throws IOException {\n        Topic t = broker.topic(topic);\n        List&lt;Message&gt; stored = store.replay(topic);\n        for (Message m : stored) {\n            Message back = t.append(m.key(), m.payload(), m.headers(), m.atMs());\n            if (back.offset() != m.offset()) throw new IllegalStateException(&quot;the stored log has a gap or a repeat at &quot; + m.offset());\n        }\n        return stored.size();\n    }\n    /** Subscribe where this subscriber left off. One line, because the cursor was always just a number. */\n    static Subscription resume(Broker broker, OffsetStore offsets, String subId, String topic, Handler h) {\n        return broker.subscribe(subId, topic, h, SubscribeOptions.opts().fromOffset(offsets.committed(subId, 0)));\n    }\n    // and the two-process answer: this is where an in-process broker stops being the right tool. The log moves\n    // out (Kafka, Pulsar, a table with a monotonic id), the topic&#x27;s lock becomes the partition leader&#x27;s, and the\n    // cursor becomes a committed offset in the broker&#x27;s own store. Every class here keeps its name \u2014 which is\n    // why &quot;explain Kafka&quot; and &quot;explain this file&quot; are the same explanation at two sizes.\n}\n\n// ---- ext: the Kafka mapping -- every class in Main.java has a name in the system they will compare this to\n/** The table to put on the whiteboard when they ask &quot;so how is this different from Kafka?&quot;. */\nfinal class KafkaMapping {\n    static final String[][] ROWS = {\n        {&quot;Topic (the ring + head offset)&quot;, &quot;one partition&#x27;s log: segment files on disk&quot;},\n        {&quot;Message.offset&quot;, &quot;the partition offset: same meaning, only ever goes up&quot;},\n        {&quot;ring size; the oldest is overwritten&quot;, &quot;retention.ms / retention.bytes: old segments are deleted&quot;},\n        {&quot;Subscription.cursor (AtomicLong)&quot;, &quot;a committed offset in the __consumer_offsets topic&quot;},\n        {&quot;one dispatcher thread per subscription&quot;, &quot;one consumer in a group, polling its partitions&quot;},\n        {&quot;PullConsumers.consume / ack&quot;, &quot;poll() / commitSync(): a Kafka consumer pulls&quot;},\n        {&quot;Filter on the key (ConsumerGroup)&quot;, &quot;partition assignment inside a consumer group&quot;},\n        {&quot;cursor.incrementAndGet() after the handler&quot;, &quot;enable.auto.commit=false, then commitSync() after processing&quot;},\n        {&quot;DeadLetterSink&quot;, &quot;a .dlq topic: not in Kafka itself; Kafka Connect and Spring Kafka add one&quot;},\n        {&quot;lag() = tail - cursor&quot;, &quot;consumer lag, the one metric that matters&quot;},\n        {&quot;fast-forward when the ring overwrote&quot;, &quot;OffsetOutOfRange, then auto.offset.reset=earliest&quot;},\n    };\n    /** Print it, so the mapping is code rather than something you hope to remember. */\n    static void print() {\n        for (String[] r : ROWS) System.out.printf(&quot;  %-42s -&gt; %s%n&quot;, r[0], r[1]);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>13 &middot; Where does time come from, and how do you test a five-minute backoff schedule without waiting five minutes?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One injected interface does both jobs: Clock answers what time it is and also does the waiting, with a default method so the production clock is still a lambda. Nothing else in the system reads the wall clock or calls Thread.sleep. A test hands in a clock that records every requested wait and returns at once. So the backoff schedule can be checked exactly (10, 20, 40), and the whole suite runs in about a second. The same seam stamps each message's time, and append never lets a timestamp go below the one before it. So a wall clock stepped back by six seconds cannot break seek-by-time (test 16).</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Where time comes from, in both senses: what time is it, and how to wait. Injected, so a test can stamp a\n * message with any instant and run a five-minute backoff schedule in no time at all.\n */\ninterface Clock {\n    /** Wall clock, milliseconds. The only place in this file that knows what &quot;now&quot; means. */\n    long nowMs();\n    /** Wait this long. A test&#x27;s clock records what it was asked for and returns at once. */\n    default void sleepMs(long ms) throws InterruptedException { if (ms &gt; 0) Thread.sleep(ms); }\n}\n\n// in a test: the clock records what it was asked to wait for, and never actually waits\nstatic final class TestClock implements Clock {\n    volatile long now = 1_700_000_000_000L;\n    final List&lt;Long&gt; sleeps = new CopyOnWriteArrayList&lt;&gt;();\n    public long nowMs() { return now; }\n    @Override public void sleepMs(long ms) { sleeps.add(ms); now += ms; }\n}\nbroker.setClock(clock);\n// ... a handler that throws three times ...\ncheck(clock.sleeps.equals(List.of(10L, 20L, 40L)), &quot;the waits before giving up were 10, 20 and 40 ms&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Which pattern is where, and why did each one earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None was chosen up front; each is what a move produced. Observer is not a pattern this design uses; it is what the design <i>is</i>: publish names a topic and never a subscriber. Strategy, Decorator and Builder all come out of move 3. Retry, sink, filter and clock are rules handed in. BoundedRetry wraps whatever policy it is given, so no rule, present or future, can retry forever. SubscribeOptions has five settings and every one is optional: the rare case where a builder beats a constructor. Iterator is move 5: the cursor is an iterator over a shared log, which is why a fourth subscriber adds a cursor, not a copy of everything. State is move 6, twice over: the delivery life cycle and the subscription's own. Singleton earned nothing: the broker is handed to its callers, so each test builds a fresh one.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Observer: the whole product. publish names a topic; it has never heard of a subscriber\nlong publish(String topicName, String key, String payload) { ... }\nSubscription subscribe(String subId, String topicName, Handler h, SubscribeOptions o) { ... }\n\n// Strategy: a rule behind a one-method interface, handed in, never built by the broker\ninterface RetryPolicy { long backoffMs(int attempt, Exception failure); }\n\n// Decorator: add the invariant to every policy, present and future, instead of trusting each one\nnew BoundedRetry(o.retry == null ? defaultRetry : o.retry, MAX_ATTEMPTS, MAX_BACKOFF_MS)\n\n// Iterator: one log, N cursors. This line is the entire fan-out mechanism\nprivate final AtomicLong cursor;           // the next offset to read; written only by the dispatcher\n\n// State: the delivery life cycle, and the subscription&#x27;s own\nenum SubState { ACTIVE, PAUSED, STOPPED }\nif (!deliver(m)) break;                    // stopped mid-delivery: nothing is committed\ncursor.incrementAndGet();                  // handled, skipped or parked: commit\n\n// Builder: five optional knobs, which is exactly the case a long constructor handles badly\nSubscribeOptions.opts().fromEarliest().retry(new ExponentialBackoff(5, 10, 1000)).filter(m -&gt; &quot;IN&quot;.equals(m.key()))\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Which SOLID letter is where in this code, and where would a Factory earn its place?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>S: the topic stores and hands back by offset; the subscription drives one cursor and one handler; a policy answers \"again, and how long\"; the broker wires them together. So changing the retry rule cannot break the log. O and L together: exponential backoff, never-retry-this, a dead-letter topic and a file store were each a new class behind an existing interface. No caller ever asks which one it got, because the whole contract is \"a negative answer means give up\". I and D together: five interfaces with one method each, all handed in, which is why every fake in the tests is a lambda. Factory is the interesting one, because it has <i>not</i> earned its place: topics appear through a single computeIfAbsent, which is a registry, not a factory. It earns the name the day a topic needs a configuration of its own (its own retention, its own partition count), because then construction stops being one line. Razorpay's statement lists \"a separate component that creates and lists topics\" as a plus point. That is this registry moved into its own class, and the natural home for that factory.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// S: four classes, four reasons to change\nfinal class Topic { /* the log and the offsets */ }\nfinal class Subscription { /* one cursor, one handler, one thread */ }\ninterface RetryPolicy { long backoffMs(int attempt, Exception failure); }\n\n// D + I: handed in, one method each, so a test fake is a lambda\ncap.configure((attempt, failure) -&gt; 0, parked);       // &quot;always retry, immediately&quot; -- and BoundedRetry stops it\nbroker.setClock(() -&gt; fixedInstant);\n\n// Factory: not yet. This one line is the registry; it earns the name when a topic needs a config\nTopic topic(String name) { return topics.computeIfAbsent(name, n -&gt; new Topic(n, retention)); }\n// the day it becomes:  topics.computeIfAbsent(name, n -&gt; topicFactory.create(n, configFor(n)));\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.BooleanSupplier;\n\n/** A subscription's life. ACTIVE is reading; PAUSED keeps the cursor but stops reading; STOPPED is finished. */\nenum SubState { ACTIVE, PAUSED, STOPPED }\n\n/** What the broker just did. A listener switches on this; a new case never changes the listener's one method. */\nenum EventType { PUBLISHED, DELIVERED, RETRIED, DEAD_LETTERED, SKIPPED, FAST_FORWARDED }\n\n/** One thing that happened, handed to every listener outside every lock. A value, so it is safe to share. */\nrecord Event(EventType type, String topic, long offset, String subscriptionId, int attempts, long atMs) {}\n\n/**\n * One published message. Immutable on purpose: ONE object sits in the topic's log and is handed to twenty\n * handlers on twenty threads, with no copying and no chance that a bad handler changes what the next one sees.\n * The offset is the message's position in its topic's log and is assigned by the topic, never by the caller.\n */\nrecord Message(long offset, String topic, String key, String payload, Map<String, String> headers, long atMs) {\n    /** Defensive copy of the headers, so the map the publisher kept cannot be edited under a handler's feet. */\n    Message { headers = headers == null ? Map.of() : Map.copyOf(headers); }\n    /** Short form for logs and demos: topic@offset[key] payload. */\n    @Override public String toString() { return topic + \"@\" + offset + (key == null ? \"\" : \"[\" + key + \"]\") + \" \" + payload; }\n}\n\n/** A message a subscription gave up on: what it was, who failed, after how many tries, and why. Parked, not dropped. */\nrecord Dead(Message message, String subscriptionId, int attempts, String reason, long atMs) {}\n\n/**\n * Where time comes from, in both senses: what time is it, and how to wait. Injected, so a test can stamp a\n * message with any instant and run a five-minute backoff schedule in no time at all.\n */\ninterface Clock {\n    /** Wall clock, milliseconds. The only place in this file that knows what \"now\" means. */\n    long nowMs();\n    /** Wait this long. A test's clock records what it was asked for and returns at once. */\n    default void sleepMs(long ms) throws InterruptedException { if (ms > 0) Thread.sleep(ms); }\n}\n\n// \"a handler will fail, and 'I failed' must differ from 'done'\" -> let onMessage throw -> the retry rule has something to read\n/**\n * The subscriber's business code. It is ALLOWED to throw, and that is the whole contract: if a failure were\n * swallowed, retry, dead-lettering and every delivery guarantee would be impossible to express. One method, so\n * a handler can be a lambda.\n */\ninterface Handler {\n    /** Handle one message. Returning normally means \"done, commit it\"; throwing means \"I failed, retry me\". */\n    void onMessage(Message m) throws Exception;\n}\n\n/** Should this subscription see this message at all? One method, so a filter is a lambda. */\ninterface Filter {\n    /** True if the subscription should be given this message; false means skip it and move the cursor on. */\n    boolean accepts(Message m);\n    /** The default: everybody sees everything, which is what fan-out means. */\n    static Filter all() { return m -> true; }\n}\n\n// \"a flat 20ms retry hammers a struggling downstream\" is a rule that WILL change mid-round -> put it behind an interface -> Strategy\n/**\n * \"Again, and how long do I wait?\" \u2014 the whole retry rule in one method. A negative answer means give up: park\n * the message in the dead-letter sink and move the cursor on. The failure is passed in so a policy can tell a\n * timeout from a malformed payload without ever changing this signature.\n */\ninterface RetryPolicy {\n    /** Milliseconds to wait before attempt+1, or any negative number meaning \"stop trying\". */\n    long backoffMs(int attempt, Exception failure);\n}\n\n/** Where a message goes when the retry policy gives up. One method, because today it is a list and tomorrow a topic. */\ninterface DeadLetterSink {\n    /** Park a message nobody could process. Must not throw; must not block the dispatcher for long. */\n    void park(Dead d);\n}\n\n// \"the others must be told\" must not sit inside the offset arithmetic -> announce after the unlock -> Observer\n/** Anyone who wants to hear what the broker did: metrics, a lag alarm, a trace. Called outside every lock. */\ninterface BrokerListener {\n    /** One event. A listener that throws is logged and ignored; it can never break a publish or a delivery. */\n    void onEvent(Event e);\n}\n\n/** Wait the same amount every time, and give up after n attempts. The rule you start with; rarely the one you ship. */\nfinal class FixedDelayRetry implements RetryPolicy {\n    private final int maxAttempts; private final long delayMs;\n    FixedDelayRetry(int maxAttempts, long delayMs) { this.maxAttempts = maxAttempts; this.delayMs = delayMs; }\n    public long backoffMs(int attempt, Exception failure) { return attempt >= maxAttempts ? -1 : delayMs; }\n}\n\n/**\n * Double the wait each time up to a cap, so a struggling downstream is not hammered: 10, 20, 40, 80 ... capped.\n * A new class, not an edit: nothing inside Topic, Subscription or Broker moved to make this exist.\n */\nfinal class ExponentialBackoff implements RetryPolicy {\n    private final int maxAttempts; private final long baseMs, capMs;\n    ExponentialBackoff(int maxAttempts, long baseMs, long capMs) { this.maxAttempts = maxAttempts; this.baseMs = baseMs; this.capMs = capMs; }\n    public long backoffMs(int attempt, Exception failure) {\n        if (attempt >= maxAttempts) return -1;\n        return Math.min(capMs, baseMs << Math.min(attempt - 1, 30));    // 1 -> base, 2 -> 2x base, 3 -> 4x base ...\n    }\n}\n\n// the invariant \"a subscription always makes progress\" must hold for policies that do not exist yet -> wrap every policy -> Decorator\n/**\n * Wraps ANY retry policy and enforces the one thing a subscription cannot live without: progress. No policy,\n * not even one written next year that forgets to give up or throws, may run past maxAttempts or sleep longer\n * than maxBackoffMs. The broker wraps every policy it is handed, so this is not an option a caller can forget.\n */\nfinal class BoundedRetry implements RetryPolicy {\n    private final RetryPolicy base; private final int maxAttempts; private final long maxBackoffMs;\n    BoundedRetry(RetryPolicy base, int maxAttempts, long maxBackoffMs) {\n        this.base = base; this.maxAttempts = maxAttempts; this.maxBackoffMs = maxBackoffMs;\n    }\n    public long backoffMs(int attempt, Exception failure) {\n        if (attempt >= maxAttempts) return -1;                          // the hard stop: park it and move on\n        long wait;\n        try { wait = base.backoffMs(attempt, failure); }\n        catch (RuntimeException brokenPolicy) { return -1; }            // a policy with a bug gives up; it never kills the reader\n        if (wait < 0) return -1;                                        // the policy gave up first: respect it\n        return Math.min(wait, maxBackoffMs);\n    }\n}\n\n/** The default sink: keep them in a list a human or a test can read. A real one writes to a topic or a table. */\nfinal class InMemoryDeadLetters implements DeadLetterSink {\n    private final List<Dead> parked = Collections.synchronizedList(new ArrayList<>());   // O(1) append\n    public void park(Dead d) { parked.add(d); }\n    /** Everything parked so far, oldest first. */\n    List<Dead> all() { return List.copyOf(parked); }\n    /** How many messages nobody could process. The number that should be on a dashboard. */\n    int size() { return parked.size(); }\n}\n\n/**\n * The aggregate root: one topic is a ring of messages plus ONE lock. The ring is a fixed array used in a circle:\n * offset o lives in slot o % size, so a new message overwrites the one exactly `size` offsets older. Offsets\n * must never be duplicated or skipped, and this is the only class that assigns them. What the ring overwrote\n * is counted, not hidden. Two different topics never wait for each other, because the lock is per topic.\n */\nfinal class Topic {\n    private final String name;\n    private final Message[] ring;                                       // offset o is in slot o % ring.length; guarded by lock\n    private long head = 0;                                              // the oldest offset still in the ring; guarded by lock\n    private long lastAtMs = Long.MIN_VALUE;                             // the newest timestamp so far; guarded by lock\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Condition appended = lock.newCondition();\n    // The two numbers a dashboard asks for a thousand times a second, rewritten inside the lock and read outside it.\n    // volatile: a reader on any thread sees the latest write without taking the lock. One message stale is harmless.\n    private volatile long tail = 0;                                     // the offset the NEXT message will get\n    private volatile long earliest = 0;                                 // = head, for readers that take no lock\n\n    Topic(String name, int capacity) {\n        if (capacity < 1) throw new IllegalArgumentException(\"retention must be at least one message\");\n        this.name = name; this.ring = new Message[capacity];\n    }\n    /** The topic's name, which is the only thing a publisher needs to know. */\n    String name() { return name; }\n\n    /**\n     * The critical step, and the reason this class has a lock. Assigning an offset and storing at it are TWO\n     * operations: two publishers that both read tail = 7 would both write slot 7, and one message would vanish.\n     * Here both happen as one step. On a full ring the store overwrites the oldest message and head moves up by\n     * one: O(1), nothing is copied. The waiting dispatchers are signalled before the lock is released: the signal\n     * must happen under the same lock they check under, or it lands between their check and their wait and is lost.\n     */\n    Message append(String key, String payload, Map<String, String> headers, long atMs) {\n        Map<String, String> h = headers == null ? Map.of() : Map.copyOf(headers);   // copied before the lock, not inside it\n        lock.lock();\n        try {\n            long off = tail;\n            lastAtMs = Math.max(lastAtMs, atMs);                        // a clock that steps back never reorders the log\n            Message m = new Message(off, name, key, payload, h, lastAtMs);\n            ring[(int) (off % ring.length)] = m;                        // on a full ring this overwrites offset off - size ...\n            if (off - head == ring.length) head++;                      // ... which is now gone, and counted\n            tail = off + 1; earliest = head;                            // republish the two numbers readers poll\n            appended.signalAll();\n            return m;\n        } finally { lock.unlock(); }\n    }\n\n    /** The message at this offset, or null if it has not been published yet or the ring has overwritten it. O(1). */\n    Message readAt(long offset) { lock.lock(); try { return at(offset); } finally { lock.unlock(); } }\n    private Message at(long offset) {                                   // lock must be held\n        return (offset < head || offset >= tail) ? null : ring[(int) (offset % ring.length)];\n    }\n    /** The offset the NEXT message will be given. tail minus a cursor is that subscriber's lag. One volatile read: no lock. */\n    long tailOffset() { return tail; }\n    /** The oldest offset still in the ring. A cursor below this has fallen off the back. One volatile read: no lock. */\n    long earliestOffset() { return earliest; }\n    /** An offset pulled inside what exists: not below the oldest message still held, not past the next one to come. */\n    long clamp(long offset) { return Math.max(earliest, Math.min(offset, tail)); }\n    /** How many messages the ring holds when it is full: the retention, in messages. */\n    int capacity() { return ring.length; }\n    /** How many messages the ring has overwritten. Counted, not hidden: visible loss beats invisible loss. */\n    long droppedCount() { return earliest; }\n    /** How many messages are in the ring right now. */\n    int retained() { lock.lock(); try { return (int) (tail - head); } finally { lock.unlock(); } }\n\n    /**\n     * Wait for the message at this offset, up to a timeout. The check and the wait are inside ONE lock, the same\n     * lock the publisher signals under, and inside a `while`. That makes a lost wakeup impossible and a spurious\n     * one (a wake-up with no signal, which Java allows) harmless. Returns null on timeout, or when the ring has\n     * already overwritten the offset. An interrupt is passed on, never swallowed: it means \"stop\".\n     */\n    Message awaitAt(long offset, long timeoutMs) throws InterruptedException {\n        lock.lock();\n        try {\n            long left = TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n            while (true) {\n                if (offset < head) return null;                         // overwritten before we read it; the caller fast-forwards\n                Message m = at(offset);\n                if (m != null) return m;\n                if (left <= 0) return null;\n                left = appended.awaitNanos(left);\n            }\n        } finally { lock.unlock(); }\n    }\n}\n\n// \"the knobs are about to multiply\" -> five optional settings on one call -> Builder, and here it genuinely earns its place\n/**\n * The optional settings on a subscription: where to start, what to retry with, where to park failures, and what\n * to filter out. Every one is optional, which is exactly when a builder beats a five-argument constructor:\n * `opts().fromEarliest().retry(new ExponentialBackoff(5, 10, 1000)).filter(m -> \"IN\".equals(m.key()))`.\n */\nfinal class SubscribeOptions {\n    RetryPolicy retry; DeadLetterSink sink; Filter filter = Filter.all();\n    long startAt = -1; boolean earliest = false;\n    /** Start a fresh set of options. Nothing is required. */\n    static SubscribeOptions opts() { return new SubscribeOptions(); }\n    /** Use this retry rule instead of the broker's default. It is still wrapped in BoundedRetry. */\n    SubscribeOptions retry(RetryPolicy r) { this.retry = r; return this; }\n    /** Park this subscription's failures somewhere of its own. */\n    SubscribeOptions deadLetters(DeadLetterSink s) { this.sink = s; return this; }\n    /** Only see the messages this predicate accepts; the rest advance the cursor without a handler call. */\n    SubscribeOptions filter(Filter f) { this.filter = f; return this; }\n    /** Replay everything still retained, instead of starting at the end of the log. */\n    SubscribeOptions fromEarliest() { this.earliest = true; return this; }\n    /** Start at an exact offset \u2014 what a restarted consumer that saved its cursor does. */\n    SubscribeOptions fromOffset(long offset) { this.startAt = offset; return this; }\n}\n\n/**\n * One subscriber's read position, and the single thread that drives it. This is the class that makes fan-out\n * cheap in memory: three subscribers are three longs pointing into one log, not three copies of every message.\n * One thread per subscription is also what gives each subscriber the topic's order for free, and what keeps a\n * slow or throwing handler from delaying anybody but itself.\n */\nfinal class Subscription implements Runnable {\n    private static final long POLL_MS = 50;                             // how long a dispatcher waits before re-checking its state\n\n    private final String id;\n    private final Topic topic;\n    private final Handler handler;\n    private final RetryPolicy retry;\n    private final DeadLetterSink sink;\n    private final Filter filter;\n    private final Clock clock;\n    private final BrokerListener events;\n    private final AtomicLong cursor;                                    // the next offset to read; written only by the dispatcher\n    private final AtomicLong seekTo = new AtomicLong(-1);               // a seek another thread asked for; -1 = none\n    private final AtomicLong delivered = new AtomicLong(), deadLettered = new AtomicLong();\n    private final AtomicLong skipped = new AtomicLong(), missed = new AtomicLong(), retried = new AtomicLong();\n    private volatile SubState state = SubState.ACTIVE;                  // changed only under the gate\n    private volatile boolean running;                                   // true while the dispatch loop is executing\n    private Thread worker;                                              // the thread running the loop; guarded by gate\n    private final ReentrantLock gate = new ReentrantLock();             // for the life cycle only, never for the log\n    private final Condition resumed = gate.newCondition();\n\n    Subscription(String id, Topic topic, Handler handler, long startOffset, RetryPolicy retry,\n                 DeadLetterSink sink, Filter filter, Clock clock, BrokerListener events) {\n        this.id = id; this.topic = topic; this.handler = handler; this.retry = retry; this.sink = sink;\n        this.filter = filter; this.clock = clock; this.events = events; this.cursor = new AtomicLong(startOffset);\n    }\n\n    /**\n     * The dispatch loop, and the whole delivery guarantee is the order of its last two statements. Read at the\n     * cursor; hand the message over with NO lock held; and only when the handler has returned, or the policy has\n     * given up and the message is parked, move the cursor on. Commit after delivery means a stop in the middle\n     * hands that message out again: at-least-once, so handlers must be idempotent. Moving the increment above\n     * the handler call would flip this to at-most-once: that is the whole difference, one line.\n     */\n    public void run() {\n        gate.lock();\n        try { worker = Thread.currentThread(); running = true; } finally { gate.unlock(); }\n        try {\n            while (state != SubState.STOPPED) {\n                if (state == SubState.PAUSED) { awaitResume(); continue; }\n                long seek = seekTo.getAndSet(-1);\n                if (seek >= 0) cursor.set(topic.clamp(seek));           // a replay or a skip that another thread asked for\n                long at = cursor.get();\n                long earliest = topic.earliestOffset();\n                if (at < earliest) {                                    // the ring overwrote what we had not read: skip, and COUNT it\n                    missed.addAndGet(earliest - at);\n                    cursor.set(earliest);\n                    events.onEvent(new Event(EventType.FAST_FORWARDED, topic.name(), earliest, id, 0, clock.nowMs()));\n                    continue;\n                }\n                Message m = topic.awaitAt(at, POLL_MS);\n                if (m == null || state != SubState.ACTIVE) continue;    // nothing yet, or paused while we waited: leave it\n                if (!deliver(m)) break;                                 // stopped mid-delivery: commit nothing, it comes back\n                cursor.incrementAndGet();                               // THE line: commit only AFTER the handler is done with it\n            }\n        } catch (InterruptedException e) {\n            Thread.currentThread().interrupt();                         // stop() woke us from a wait: nothing was in flight\n        } finally {\n            gate.lock();\n            try { state = SubState.STOPPED; running = false; worker = null; } finally { gate.unlock(); }\n        }\n    }\n\n    /**\n     * Hand one message to the filter and the handler, outside every lock, and survive either one throwing.\n     * Returns true when the message is finished with: skipped, handled, or given up on and parked. That is the\n     * only time the caller may commit. Returns false when stop() came first: the handler was interrupted, or\n     * the stop arrived while it was failing. That message goes to whoever reads from this cursor next.\n     */\n    private boolean deliver(Message m) {\n        for (int attempt = 1; ; attempt++) {\n            try {\n                if (!filter.accepts(m)) {                               // not ours: no handler call, but the cursor still moves\n                    skipped.incrementAndGet();\n                    events.onEvent(new Event(EventType.SKIPPED, topic.name(), m.offset(), id, 0, clock.nowMs()));\n                    return true;\n                }\n                handler.onMessage(m);                                   // user code: no lock of ours is held here\n                delivered.incrementAndGet();\n                events.onEvent(new Event(EventType.DELIVERED, topic.name(), m.offset(), id, attempt, clock.nowMs()));\n                return true;\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();\n                return false;                                           // stop() interrupted the handler: do NOT commit\n            } catch (Exception e) {                                     // not Throwable: an OutOfMemoryError must end the thread\n                if (state == SubState.STOPPED) return false;            // stopped while failing: no retry, no parking\n                long wait = retry.backoffMs(attempt, e);                // a throwing filter lands here too, like a handler\n                if (wait < 0) {                                         // the policy gave up: park it and MOVE ON\n                    sink.park(new Dead(m, id, attempt, e.toString(), clock.nowMs()));\n                    deadLettered.incrementAndGet();\n                    events.onEvent(new Event(EventType.DEAD_LETTERED, topic.name(), m.offset(), id, attempt, clock.nowMs()));\n                    return true;                                        // giving up must never stall the subscription\n                }\n                retried.incrementAndGet();\n                events.onEvent(new Event(EventType.RETRIED, topic.name(), m.offset(), id, attempt, clock.nowMs()));\n                try { clock.sleepMs(wait); }\n                catch (InterruptedException stop) { Thread.currentThread().interrupt(); return false; }   // stop() during the wait\n            }\n        }\n    }\n\n    /** Stop reading but keep the cursor. Takes effect before the next message; one already in the handler finishes. */\n    void pause() {\n        gate.lock();\n        try { if (state == SubState.ACTIVE) state = SubState.PAUSED; } finally { gate.unlock(); }\n    }\n    /** Start reading again from the kept cursor. */\n    void resume() {\n        gate.lock();\n        try { if (state == SubState.PAUSED) { state = SubState.ACTIVE; resumed.signalAll(); } } finally { gate.unlock(); }\n    }\n    /**\n     * End this subscription for good: STOPPED is final. A flag, a signal for a paused thread, and an interrupt,\n     * because the dispatcher may be waiting in awaitNanos or asleep in a backoff. All three happen under the gate,\n     * and run() clears `worker` under the same gate, so the interrupt can only reach this subscription's own\n     * thread, never a pooled thread that has already moved on to another subscription.\n     */\n    void stop() {\n        gate.lock();\n        try {\n            state = SubState.STOPPED;\n            resumed.signalAll();\n            if (worker != null) worker.interrupt();\n        } finally { gate.unlock(); }\n    }\n    private void awaitResume() throws InterruptedException {\n        gate.lock();\n        try { while (state == SubState.PAUSED) resumed.await(); } finally { gate.unlock(); }\n    }\n\n    /** How far behind the end of the log this sub

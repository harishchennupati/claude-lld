extension below \u2014 the\n    // same idea one level down, and the reason real consumer groups rebalance partitions rather than keys.\n}\n\n// ---- ext: never retry a message that can never work -- one decorator, no change to any policy or to Subscription\n/** A failure that will fail identically forever: a malformed payload, a schema mismatch, a deleted account. */\nclass PermanentFailure extends Exception {\n    PermanentFailure(String message) { super(message); }\n}\n\n/**\n * Wraps ANY retry policy and refuses to retry a permanent failure: &quot;exponential backoff, but never five times\n * on a message that can never work&quot;. A new class and one line at the subscribe call; ExponentialBackoff,\n * Subscription, Topic and Broker are all untouched, which is the whole point of the interface.\n */\nfinal class NoRetryFor implements RetryPolicy {\n    private final RetryPolicy base;\n    private final Class&lt;? extends Exception&gt; permanent;\n    NoRetryFor(RetryPolicy base, Class&lt;? extends Exception&gt; permanent) { this.base = base; this.permanent = permanent; }\n    public long backoffMs(int attempt, Exception failure) {\n        if (permanent.isInstance(failure)) return -1;                    // straight to the dead-letter sink\n        return base.backoffMs(attempt, failure);\n    }\n}\n\n// ---- ext: a dead-letter TOPIC -- park failures where a human tool can subscribe to them and replay them\n/**\n * The sink that a production broker ships with: instead of a list nobody reads, a message nobody could process\n * is published to &quot;&lt;topic&gt;.dlq&quot; with why-it-failed in the headers. The dead-letter queue is then just another\n * topic, so the repair tool is just another subscriber and a replay is just another publish.\n */\nfinal class DeadLetterTopic implements DeadLetterSink {\n    private final Broker broker;\n    private final String suffix;\n    DeadLetterTopic(Broker broker, String suffix) { this.broker = broker; this.suffix = suffix; }\n    public void park(Dead d) {\n        Message m = d.message();\n        broker.publish(m.topic() + suffix, m.key(), m.payload(),\n            Map.of(&quot;dlq.reason&quot;, d.reason(),\n                   &quot;dlq.attempts&quot;, String.valueOf(d.attempts()),\n                   &quot;dlq.subscription&quot;, d.subscriptionId(),\n                   &quot;dlq.origin&quot;, m.topic() + &quot;@&quot; + m.offset()));\n    }\n    /** Replay one parked message back onto its original topic, once it is fixed. */\n    static long replay(Broker broker, Message parked) {\n        String origin = parked.headers().get(&quot;dlq.origin&quot;);\n        String topic = origin == null ? parked.topic() : origin.substring(0, origin.lastIndexOf(&#x27;@&#x27;));\n        return broker.publish(topic, parked.key(), parked.payload());\n    }\n}\n\n// ---- ext: exactly-once for the handler -- at-least-once plus a memory of ids, which is the only honest version\n/**\n * At-least-once means duplicates, so the handler must be idempotent: handling a message twice must have the same\n * effect as handling it once. When the business code is not, this decorator gets there: it remembers the ids\n * already handled and skips a repeat. The memory is bounded, because an unbounded one is a slow leak. It is also\n * locked, because one instance is often shared: ConsumerGroup hands the same handler to every member&#x27;s thread.\n * In production the ids live in the database, written in the same transaction as the business change.\n */\nfinal class IdempotentHandler implements Handler {\n    private final Handler base;\n    private final AtomicLong duplicates = new AtomicLong();\n    private final LinkedHashMap&lt;String, Boolean&gt; seen;\n    IdempotentHandler(Handler base, int remember) {\n        this.base = base;\n        this.seen = new LinkedHashMap&lt;&gt;(16, 0.75f, false) {\n            @Override protected boolean removeEldestEntry(Map.Entry&lt;String, Boolean&gt; eldest) { return size() &gt; remember; }\n        };\n    }\n    public void onMessage(Message m) throws Exception {\n        String id = m.headers().getOrDefault(&quot;id&quot;, m.topic() + &quot;@&quot; + m.offset());\n        synchronized (seen) {\n            if (seen.put(id, Boolean.TRUE) != null) { duplicates.incrementAndGet(); return; }   // already done: ack it again\n        }\n        try { base.onMessage(m); }                                       // outside the lock: members still run side by side\n        catch (Exception e) { synchronized (seen) { seen.remove(id); } throw e; }   // a failure is not &quot;done&quot;: retry it\n    }\n    /** How many repeats were swallowed. The number that tells you at-least-once is doing its job. */\n    long duplicates() { return duplicates.get(); }\n}\n\n// ---- ext: pull instead of push -- consume() and ack(), the shape of Razorpay&#x27;s statement and codezym&#x27;s Kafka task\n/** One batch handed to a pulling consumer, and the offset to acknowledge once all of it is done. */\nrecord Batch(List&lt;Message&gt; messages, long next) {}\n\n/**\n * The same log and the same cursors, but nobody pushes: a consumer calls consume() when it is ready. consume()\n * reads from the committed cursor and moves nothing, so a consumer that crashes before ack() is handed the same\n * batch again: at-least-once. ack(next) commits the whole batch at once. A filter leaves messages out of the\n * batch, and the ack steps over them too. No thread per consumer: one that is down simply stops calling, and its\n * cursor waits where it was. One caller per consumer id at a time; two callers would be handed the same batch.\n */\nfinal class PullConsumers {\n    private final Broker broker;\n    private final Map&lt;String, AtomicLong&gt; cursors = new ConcurrentHashMap&lt;&gt;();   // &quot;topic/consumer&quot; -&gt; next offset to read\n    private final Map&lt;String, Filter&gt; filters = new ConcurrentHashMap&lt;&gt;();\n    PullConsumers(Broker broker) { this.broker = broker; }\n\n    /** Register a consumer: a new one starts at the end of the log, or at the oldest message the ring still holds. */\n    void subscribe(String topic, String consumerId, boolean fromEarliest, Filter filter) {\n        Topic t = broker.topic(topic);\n        cursors.putIfAbsent(topic + &quot;/&quot; + consumerId, new AtomicLong(fromEarliest ? t.earliestOffset() : t.tailOffset()));\n        filters.put(topic + &quot;/&quot; + consumerId, filter);\n    }\n    /**\n     * Up to max messages from the committed cursor, in order, leaving out what the filter rejects. Moves nothing.\n     * With waitMs above zero and nothing new, it waits in awaitAt until a publish wakes it: a long poll.\n     */\n    Batch consume(String topic, String consumerId, int max, long waitMs) throws InterruptedException {\n        Topic t = broker.topic(topic);\n        long next = t.clamp(cursor(topic, consumerId).get());           // what the ring overwrote is gone: start past it\n        if (waitMs &gt; 0) t.awaitAt(next, waitMs);                        // long poll: back as soon as offset `next` exists\n        List&lt;Message&gt; out = new ArrayList&lt;&gt;();\n        Filter f = filters.get(topic + &quot;/&quot; + consumerId);\n        for (Message m; out.size() &lt; max &amp;&amp; (m = t.readAt(next)) != null; next++)\n            if (f.accepts(m)) out.add(m);\n        return new Batch(out, next);\n    }\n    /** The consumer finished everything below `next`: commit it. Never backwards, never past the end of the log. */\n    void ack(String topic, String consumerId, long next) {\n        long upTo = Math.min(next, broker.topic(topic).tailOffset());\n        cursor(topic, consumerId).accumulateAndGet(upTo, Math::max);\n    }\n    /** The committed cursor: the next offset this consumer will be handed. */\n    long committed(String topic, String consumerId) { return cursor(topic, consumerId).get(); }\n    private AtomicLong cursor(String topic, String consumerId) {\n        AtomicLong c = cursors.get(topic + &quot;/&quot; + consumerId);\n        if (c == null) throw new NoSuchElementException(&quot;not subscribed: &quot; + consumerId + &quot; on &quot; + topic);\n        return c;\n    }\n}\n\n// ---- ext: guaranteed delivery -- a full ring makes the publisher wait for the slowest subscriber (back-pressure)\n/**\n * By default a full ring overwrites its oldest message and counts the loss: Kafka&#x27;s choice. Razorpay&#x27;s statement\n * asks for the opposite: every subscriber gets every message, even one that was down for an hour. Then a publish\n * must never overwrite a message some subscriber has not read. It waits for the slowest subscriber, and is\n * refused after a budget. That is back-pressure: the slow side pushes back on the fast side. The check and the\n * publish run one publisher at a time per topic, so two publishers can never both take the last free slot.\n * Every publisher of the topic must come through here.\n */\nfinal class BackPressure {\n    private final Broker broker;\n    private final Map&lt;String, ReentrantLock&gt; gates = new ConcurrentHashMap&lt;&gt;();\n    BackPressure(Broker broker) { this.broker = broker; }\n\n    /** Publish once the ring has a slot no subscriber still needs. Wait while it has none, then refuse loudly. */\n    long publish(String topic, String key, String payload, long budgetMs) throws InterruptedException {\n        Topic t = broker.topic(topic);\n        ReentrantLock gate = gates.computeIfAbsent(topic, k -&gt; new ReentrantLock());\n        long deadline = System.nanoTime() + TimeUnit.MILLISECONDS.toNanos(budgetMs);\n        while (true) {\n            gate.lock();\n            try {                                                       // check and publish as one step\n                if (t.tailOffset() - broker.slowestCursor(topic) &lt; t.capacity()) return broker.publish(topic, key, payload);\n            } finally { gate.unlock(); }\n            if (System.nanoTime() &gt;= deadline)\n                throw new IllegalStateException(&quot;back-pressure: every slot of &quot; + topic + &quot; holds a message somebody has not read&quot;);\n            Thread.sleep(1);                                            // nobody signals when a cursor moves: look again in 1 ms\n        }\n    }\n    // the three answers for a full log, in the order a system usually grows through them: overwrite the oldest and\n    // count it (the default ring, Kafka&#x27;s choice); make the publisher wait (this); or spill the oldest messages to\n    // disk and read them back when the slow consumer returns (Razorpay&#x27;s plus point; the FileStore below is that file).\n}\n\n// ---- ext: lag metrics and an alarm -- the observer earning its keep\n/**\n * A listener that counts what the broker does, plus the alarm a dashboard actually needs: which subscribers are\n * falling behind. The counts come from events; the lag comes from the O(1) numbers the subscriptions already\n * keep, so nothing is scanned and no counter can drift from the truth.\n */\nfinal class LagMonitor implements BrokerListener {\n    private final EnumMap&lt;EventType, AtomicLong&gt; counts = new EnumMap&lt;&gt;(EventType.class);\n    LagMonitor() { for (EventType t : EventType.values()) counts.put(t, new AtomicLong()); }\n    public void onEvent(Event e) { counts.get(e.type()).incrementAndGet(); }\n    /** How many of this kind of event the broker has emitted. */\n    long count(EventType t) { return counts.get(t).get(); }\n    /** Every subscription more than `threshold` messages behind, worst first. */\n    static List&lt;String&gt; alarming(Broker broker, long threshold) {\n        List&lt;Map.Entry&lt;String, Long&gt;&gt; over = new ArrayList&lt;&gt;();\n        broker.lagReport().forEach((id, lag) -&gt; { if (lag &gt; threshold) over.add(Map.entry(id, lag)); });\n        over.sort((a, b) -&gt; Long.compare(b.getValue(), a.getValue()));\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (Map.Entry&lt;String, Long&gt; e : over) out.add(e.getKey() + &quot; (&quot; + e.getValue() + &quot; behind)&quot;);\n        return out;\n    }\n}\n\n// ---- ext: partitions -- N logs behind one name, so N publishers never meet, and order still holds per key\n/**\n * Rung 1 of the ladder from move 8. One topic is one log and one lock; a partitioned topic is N logs and N\n * locks, with the key deciding which. Two publishers using different keys never wait for each other, and\n * per-key order survives because a key always lands in the same partition, which has one subscription and one\n * thread. What is lost is total order across the topic \u2014 exactly the trade Kafka makes.\n */\nfinal class PartitionedTopic {\n    private final Broker broker;\n    private final String name;\n    private final int partitions;\n    PartitionedTopic(Broker broker, String name, int partitions) {\n        this.broker = broker; this.name = name; this.partitions = partitions;\n    }\n    /** The partition this key belongs to, forever. Changing the count reshuffles keys, which is why it is fixed. */\n    int partitionOf(String key) { return key == null ? 0 : (int) Math.floorMod(key.hashCode() &amp; 0x7fffffffL, partitions); }\n    /** The name of one underlying topic. */\n    String partitionName(int p) { return name + &quot;-p&quot; + p; }\n    /** Publish into the key&#x27;s partition. One lock per partition, so N publishers scale linearly. */\n    long publish(String key, String payload) { return broker.publish(partitionName(partitionOf(key)), key, payload); }\n    /** One subscription per partition, all running the same handler: per-key order, N threads. */\n    List&lt;Subscription&gt; subscribeAll(String subId, Handler h) {\n        List&lt;Subscription&gt; out = new ArrayList&lt;&gt;();\n        for (int p = 0; p &lt; partitions; p++)\n            out.add(broker.subscribe(subId + &quot;-p&quot; + p, partitionName(p), h, SubscribeOptions.opts().fromEarliest()));\n        return out;\n    }\n}\n\n// ---- ext: persistence -- the log on disk, and the cursors too, so a restart resumes instead of starting over\n/** The seam. The topic&#x27;s ring becomes a cache of the newest part of this file; nothing else in the design changes. */\ninterface MessageStore {\n    /** Append one message after the topic gave it its offset. The line carries the offset, so a replay puts it back in place. */\n    void append(Message m) throws IOException;\n    /** Every stored message of one topic, in offset order. One sequential file read. */\n    List&lt;Message&gt; replay(String topic) throws IOException;\n}\n\n/**\n * One append-only text file, one message per line: offset, topic, key, payload, timestamp. Key and payload are\n * Base64, so a tab or a newline inside them cannot break a line. A real one uses fixed-size files (&quot;segments&quot;)\n * and forces each write to disk (FileChannel.force) before the publish returns.\n */\nfinal class FileStore implements MessageStore {\n    private final Path file;\n    FileStore(Path file) throws IOException { this.file = file; if (!Files.exists(file)) Files.createFile(file); }\n    public synchronized void append(Message m) throws IOException {\n        String line = m.offset() + &quot;\\t&quot; + m.topic() + &quot;\\t&quot; + enc(m.key()) + &quot;\\t&quot; + enc(m.payload()) + &quot;\\t&quot; + m.atMs() + &quot;\\n&quot;;\n        Files.writeString(file, line, StandardCharsets.UTF_8, StandardOpenOption.APPEND);\n    }\n    /** Lines may be out of order, because two publishers&#x27; listeners can write in either order: sort by offset. */\n    public List&lt;Message&gt; replay(String topic) throws IOException {\n        List&lt;Message&gt; out = new ArrayList&lt;&gt;();\n        for (String line : Files.readAllLines(file, StandardCharsets.UTF_8)) {\n            String[] f = line.split(&quot;\\t&quot;, -1);\n            if (f.length == 5 &amp;&amp; f[1].equals(topic))\n                out.add(new Message(Long.parseLong(f[0]), f[1], dec(f[2]), dec(f[3]), Map.of(), Long.parseLong(f[4])));\n        }\n        out.sort(Comparator.comparingLong(Message::offset));\n        return out;\n    }\n    private static String enc(String s) { return s == null ? &quot;-&quot; : Base64.getEncoder().encodeToString(s.getBytes(StandardCharsets.UTF_8)); }\n    private static String dec(String f) { return f.equals(&quot;-&quot;) ? null : new String(Base64.getDecoder().decode(f), StandardCharsets.UTF_8); }\n}\n\n/** Where a subscriber&#x27;s committed cursor lives across a restart. In Kafka this is the __consumer_offsets topic. */\ninterface OffsetStore {\n    /** Remember that this subscription has finished everything below `offset`. */\n    void commit(String subscriptionId, long offset);\n    /** The remembered cursor, or the default for a subscriber that has never run. */\n    long committed(String subscriptionId, long orElse);\n}\n\n/** The in-memory version, which is the file version wearing a different coat. */\nfinal class InMemoryOffsets implements OffsetStore {\n    private final Map&lt;String, Long&gt; at = new ConcurrentHashMap&lt;&gt;();\n    public void commit(String subscriptionId, long offset) { at.put(subscriptionId, offset); }\n    public long committed(String subscriptionId, long orElse) { return at.getOrDefault(subscriptionId, orElse); }\n}\n\n/** Restore a broker from a store after a restart, then resume each subscriber from its committed cursor. */\nfinal class Recovery {\n    /**\n     * Put every stored message of a topic back into a fresh broker, at its own offset and with its own time.\n     * Straight into the topic, not through publish(): a replay is not a new message, so no listener may store it again.\n     */\n    static int restore(Broker broker, MessageStore store, String topic) throws IOException {\n        Topic t = broker.topic(topic);\n        List&lt;Message&gt; stored = store.replay(topic);\n        for (Message m : stored) {\n            Message back = t.append(m.key(), m.payload(), m.headers(), m.atMs());\n            if (back.offset() != m.offset()) throw new IllegalStateException(&quot;the stored log has a gap or a repeat at &quot; + m.offset());\n        }\n        return stored.size();\n    }\n    /** Subscribe where this subscriber left off. One line, because the cursor was always just a number. */\n    static Subscription resume(Broker broker, OffsetStore offsets, String subId, String topic, Handler h) {\n        return broker.subscribe(subId, topic, h, SubscribeOptions.opts().fromOffset(offsets.committed(subId, 0)));\n    }\n    // and the two-process answer: this is where an in-process broker stops being the right tool. The log moves\n    // out (Kafka, Pulsar, a table with a monotonic id), the topic&#x27;s lock becomes the partition leader&#x27;s, and the\n    // cursor becomes a committed offset in the broker&#x27;s own store. Every class here keeps its name \u2014 which is\n    // why &quot;explain Kafka&quot; and &quot;explain this file&quot; are the same explanation at two sizes.\n}\n\n// ---- ext: replay from a point in time -- because nobody remembers an offset, they remember &quot;since 9am&quot;\n/** Offset lookup by timestamp: a binary search over the ring, because append never lets a timestamp go down. */\nfinal class TimeSeek {\n    /** The first offset at or after this instant; the tail if everything retained is older. O(log n). */\n    static long offsetAt(Topic topic, long atMs) {\n        long lo = topic.earliestOffset(), hi = topic.tailOffset();\n        while (lo &lt; hi) {\n            long mid = lo + (hi - lo) / 2;\n            Message m = topic.readAt(mid);\n            if (m == null || m.atMs() &gt;= atMs) hi = mid; else lo = mid + 1;\n        }\n        return lo;\n    }\n}\n\n// ---- ext: the Kafka mapping -- every class in Main.java has a name in the system they will compare this to\n/** The table to put on the whiteboard when they ask &quot;so how is this different from Kafka?&quot;. */\nfinal class KafkaMapping {\n    static final String[][] ROWS = {\n        {&quot;Topic (the ring + head offset)&quot;, &quot;one partition&#x27;s log: segment files on disk&quot;},\n        {&quot;Message.offset&quot;, &quot;the partition offset: same meaning, only ever goes up&quot;},\n        {&quot;ring size; the oldest is overwritten&quot;, &quot;retention.ms / retention.bytes: old segments are deleted&quot;},\n        {&quot;Subscription.cursor (AtomicLong)&quot;, &quot;a committed offset in the __consumer_offsets topic&quot;},\n        {&quot;one dispatcher thread per subscription&quot;, &quot;one consumer in a group, polling its partitions&quot;},\n        {&quot;PullConsumers.consume / ack&quot;, &quot;poll() / commitSync(): a Kafka consumer pulls&quot;},\n        {&quot;Filter on the key (ConsumerGroup)&quot;, &quot;partition assignment inside a consumer group&quot;},\n        {&quot;cursor.incrementAndGet() after the handler&quot;, &quot;enable.auto.commit=false, then commitSync() after processing&quot;},\n        {&quot;DeadLetterSink&quot;, &quot;a .dlq topic: not in Kafka itself; Kafka Connect and Spring Kafka add one&quot;},\n        {&quot;lag() = tail - cursor&quot;, &quot;consumer lag, the one metric that matters&quot;},\n        {&quot;fast-forward when the ring overwrote&quot;, &quot;OffsetOutOfRange, then auto.offset.reset=earliest&quot;},\n    };\n    /** Print it, so the mapping is code rather than something you hope to remember. */\n    static void print() {\n        for (String[] r : ROWS) System.out.printf(&quot;  %-42s -&gt; %s%n&quot;, r[0], r[1]);\n    }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        Broker broker = new Broker(50);\n        LagMonitor metrics = new LagMonitor();\n        broker.addListener(metrics);\n        broker.configure(new ExponentialBackoff(4, 1, 20), new DeadLetterTopic(broker, &quot;.dlq&quot;));\n\n        // 1. consumer group: three workers, nine messages, each handled exactly once, same key to the same worker\n        Map&lt;String, List&lt;String&gt;&gt; byWorker = new ConcurrentHashMap&lt;&gt;();\n        ConsumerGroup.join(broker, &quot;billing&quot;, &quot;orders&quot;, 3, m -&gt; {\n            byWorker.computeIfAbsent(Thread.currentThread().getName() + &quot;/&quot; + ConsumerGroup.slotOf(m, 3),\n                k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(m.payload());\n        });\n        String[] keys = {&quot;acc-1&quot;, &quot;acc-2&quot;, &quot;acc-3&quot;};\n        for (int i = 0; i &lt; 9; i++) broker.publish(&quot;orders&quot;, keys[i % 3], &quot;order-&quot; + i);\n        Main.awaitUntil(() -&gt; byWorker.values().stream().mapToInt(List::size).sum() == 9, 2000);\n        System.out.println(&quot;consumer group: 9 messages over &quot; + byWorker.size() + &quot; workers, &quot;\n            + byWorker.values().stream().mapToInt(List::size).sum() + &quot; handled in total, no duplicates=&quot;\n            + (new HashSet&lt;&gt;(byWorker.values().stream().flatMap(List::stream).toList()).size() == 9));\n\n        // 2 + 3. a permanent failure goes straight to the dead-letter TOPIC; a transient one is retried\n        AtomicInteger transientTries = new AtomicInteger();\n        List&lt;String&gt; dlq = new CopyOnWriteArrayList&lt;&gt;();\n        broker.subscribe(&quot;dlq-reader&quot;, &quot;payments.dlq&quot;, m -&gt; dlq.add(m.payload() + &quot; &lt;- &quot; + m.headers().get(&quot;dlq.reason&quot;)),\n            SubscribeOptions.opts().fromEarliest());\n        broker.subscribe(&quot;payments&quot;, &quot;payments&quot;, m -&gt; {\n            if (m.payload().startsWith(&quot;junk&quot;)) throw new PermanentFailure(&quot;not JSON&quot;);\n            if (transientTries.incrementAndGet() &lt;= 2) throw new IllegalStateException(&quot;gateway timeout&quot;);\n        }, SubscribeOptions.opts().fromEarliest().retry(new NoRetryFor(new ExponentialBackoff(6, 1, 20), PermanentFailure.class)));\n        broker.publish(&quot;payments&quot;, &quot;a&quot;, &quot;junk-1&quot;);\n        broker.publish(&quot;payments&quot;, &quot;b&quot;, &quot;good-1&quot;);\n        Main.awaitUntil(() -&gt; dlq.size() == 1 &amp;&amp; broker.sub(&quot;payments&quot;).delivered() == 1, 2000);\n        System.out.println(&quot;permanent failure parked after &quot; + broker.sub(&quot;payments&quot;).deadLettered()\n            + &quot; give-up, transient retried &quot; + broker.sub(&quot;payments&quot;).retried() + &quot; times; dlq topic holds &quot; + dlq);\n\n        // 4. exactly-once for the handler: the same message id delivered twice, the business code runs once\n        AtomicInteger charged = new AtomicInteger();\n        IdempotentHandler once = new IdempotentHandler(m -&gt; charged.incrementAndGet(), 1000);\n        broker.subscribe(&quot;charges&quot;, &quot;charges&quot;, once, SubscribeOptions.opts().fromEarliest());\n        for (int i = 0; i &lt; 3; i++) broker.publish(&quot;charges&quot;, &quot;c&quot;, &quot;charge-7&quot;, Map.of(&quot;id&quot;, &quot;txn-7&quot;));\n        Main.awaitUntil(() -&gt; broker.sub(&quot;charges&quot;).delivered() == 3, 2000);\n        System.out.println(&quot;idempotent handler: 3 deliveries, &quot; + charged.get() + &quot; charge, &quot;\n            + once.duplicates() + &quot; duplicates swallowed&quot;);\n\n        // 5. pull: consume() moves nothing, ack() commits the batch, a filtered consumer skips what is not its own\n        PullConsumers pull = new PullConsumers(broker);\n        pull.subscribe(&quot;refunds&quot;, &quot;ledger&quot;, true, Filter.all());\n        pull.subscribe(&quot;refunds&quot;, &quot;india&quot;, true, m -&gt; &quot;IN&quot;.equals(m.key()));\n        for (int i = 0; i &lt; 5; i++) broker.publish(&quot;refunds&quot;, i % 2 == 0 ? &quot;IN&quot; : &quot;US&quot;, &quot;refund-&quot; + i);\n        Batch first = pull.consume(&quot;refunds&quot;, &quot;ledger&quot;, 3, 0);\n        Batch again = pull.consume(&quot;refunds&quot;, &quot;ledger&quot;, 3, 0);                 // no ack yet: the same three again\n        pull.ack(&quot;refunds&quot;, &quot;ledger&quot;, first.next());\n        Batch in = pull.consume(&quot;refunds&quot;, &quot;india&quot;, 10, 0);\n        System.out.println(&quot;pull: ledger got &quot; + first.messages().size() + &quot;, then the same &quot; + again.messages().size()\n            + &quot; before its ack; committed now &quot; + pull.committed(&quot;refunds&quot;, &quot;ledger&quot;) + &quot;; india got &quot;\n            + in.messages().stream().map(Message::payload).toList() + &quot;, next ack &quot; + in.next());\n\n        // 6. guaranteed delivery: a subscriber that is down (paused) holds the ring; the publisher waits, is refused, then gets in\n        Broker tiny = new Broker(4);\n        Subscription down = tiny.subscribe(&quot;down&quot;, &quot;bursty&quot;, m -&gt; {});\n        down.pause();\n        BackPressure gate = new BackPressure(tiny);\n        for (int i = 0; i &lt; 4; i++) gate.publish(&quot;bursty&quot;, &quot;k&quot;, &quot;burst-&quot; + i, 100);\n        try {\n            gate.publish(&quot;bursty&quot;, &quot;k&quot;, &quot;burst-x&quot;, 120);\n            System.out.println(&quot;back-pressure: published&quot;);\n        } catch (IllegalStateException e) {\n            System.out.println(&quot;back-pressure: refused -- &quot; + e.getMessage());\n        }\n        down.resume();\n        System.out.println(&quot;after resume: burst-x published at offset &quot; + gate.publish(&quot;bursty&quot;, &quot;k&quot;, &quot;burst-x&quot;, 2_000)\n            + &quot;, the subscriber missed &quot; + down.missed());\n        tiny.close();\n\n        // 7. the lag alarm: a slow subscriber falls behind and the alarm names it\n        broker.subscribe(&quot;molasses&quot;, &quot;bursty&quot;, m -&gt; Thread.sleep(50), SubscribeOptions.opts().fromEarliest());\n        for (int i = 0; i &lt; 4; i++) broker.publish(&quot;bursty&quot;, &quot;k&quot;, &quot;burst-&quot; + i);\n        System.out.println(&quot;lag alarm (&gt;1 behind): &quot; + LagMonitor.alarming(broker, 1));\n        System.out.println(&quot;metrics: published=&quot; + metrics.count(EventType.PUBLISHED)\n            + &quot; delivered=&quot; + metrics.count(EventType.DELIVERED)\n            + &quot; retried=&quot; + metrics.count(EventType.RETRIED)\n            + &quot; dead=&quot; + metrics.count(EventType.DEAD_LETTERED)\n            + &quot; skipped=&quot; + metrics.count(EventType.SKIPPED));\n\n        // 8. partitions: same key, same partition, order kept per key, four locks instead of one\n        PartitionedTopic trades = new PartitionedTopic(broker, &quot;trades&quot;, 4);\n        Map&lt;String, List&lt;String&gt;&gt; perKey = new ConcurrentHashMap&lt;&gt;();\n        trades.subscribeAll(&quot;tape&quot;, m -&gt; perKey.computeIfAbsent(m.key(), k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(m.payload()));\n        for (int i = 0; i &lt; 6; i++) { trades.publish(&quot;INFY&quot;, &quot;infy-&quot; + i); trades.publish(&quot;TCS&quot;, &quot;tcs-&quot; + i); }\n        Main.awaitUntil(() -&gt; perKey.getOrDefault(&quot;INFY&quot;, List.of()).size() == 6\n                           &amp;&amp; perKey.getOrDefault(&quot;TCS&quot;, List.of()).size() == 6, 2000);\n        System.out.println(&quot;partitions: INFY on p&quot; + trades.partitionOf(&quot;INFY&quot;) + &quot; -&gt; &quot; + perKey.get(&quot;INFY&quot;)\n            + &quot;  (order per key kept=&quot; + perKey.get(&quot;INFY&quot;).equals(List.of(&quot;infy-0&quot;, &quot;infy-1&quot;, &quot;infy-2&quot;, &quot;infy-3&quot;, &quot;infy-4&quot;, &quot;infy-5&quot;)) + &quot;)&quot;);\n\n        // 9. persistence: write the log to a file, restart into a fresh broker, resume a subscriber at its cursor\n        Path file = Files.createTempFile(&quot;pubsub-log&quot;, &quot;.tsv&quot;);\n        FileStore store = new FileStore(file);\n        OffsetStore offsets = new InMemoryOffsets();\n        Broker before = new Broker(1000);\n        before.addListener(e -&gt; {\n            if (e.type() == EventType.PUBLISHED) {\n                try { store.append(before.topic(e.topic()).readAt(e.offset())); } catch (IOException io) { throw new UncheckedIOException(io); }\n            }\n        });\n        for (int i = 0; i &lt; 5; i++) before.publish(&quot;events&quot;, &quot;e&quot;, &quot;event-&quot; + i);\n        offsets.commit(&quot;reader&quot;, 3);                                       // this subscriber had finished the first three\n        before.close();\n\n        Broker after = new Broker(1000);\n        int restored = Recovery.restore(after, store, &quot;events&quot;);\n        List&lt;String&gt; resumed = new CopyOnWriteArrayList&lt;&gt;();\n        Recovery.resume(after, offsets, &quot;reader&quot;, &quot;events&quot;, m -&gt; resumed.add(m.payload()));\n        Main.awaitUntil(() -&gt; resumed.size() == 2, 2000);\n        System.out.println(&quot;persistence: &quot; + restored + &quot; messages restored from &quot; + file.getFileName()\n            + &quot;, the reader resumed at offset 3 and saw &quot; + resumed);\n\n        // 10. replay from a point in time, with the clock handed in so the timestamps are exactly what we say\n        Broker timed = new Broker(100);\n        long[] tick = { 1_700_000_000_000L };\n        timed.setClock(() -&gt; tick[0]);\n        for (int i = 0; i &lt; 5; i++) { timed.publish(&quot;clicks&quot;, &quot;c&quot;, &quot;click-&quot; + i); tick[0] += 60_000; }   // one a minute\n        long cut = 1_700_000_000_000L + 3 * 60_000;\n        System.out.println(&quot;seek by time: three minutes in, the first offset at or after is &quot;\n            + TimeSeek.offsetAt(timed.topic(&quot;clicks&quot;), cut) + &quot; (click-3)&quot;);\n        timed.close();\n\n        // 11. the mapping they will ask for\n        System.out.println(&quot;how this maps onto Kafka:&quot;);\n        KafkaMapping.print();\n\n        after.close();\n        broker.close();\n        Files.deleteIfExists(file);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.io.*;\nimport java.nio.file.*;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n// targeted failure tests: each one proves a claim the page makes (move 9, and the follow-ups that name a test number).\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n    static List&lt;String&gt; payloads(Batch b) { return b.messages().stream().map(Message::payload).toList(); }\n\n    /** A clock the test owns: &quot;now&quot; is whatever it says, and a backoff is recorded instead of waited for. */\n    static final class TestClock implements Clock {\n        volatile long now = 1_700_000_000_000L;\n        final List&lt;Long&gt; sleeps = new CopyOnWriteArrayList&lt;&gt;();\n        public long nowMs() { return now; }\n        @Override public void sleepMs(long ms) { sleeps.add(ms); now += ms; }\n    }\n\n    public static void main(String[] args) throws Exception {\n\n        // 1. fifty threads publish into ONE topic at the same instant: every offset must be handed out exactly\n        //    once, the log must hold all of them, and each publisher&#x27;s own messages must be in increasing order.\n        Broker race = new Broker(200_000);\n        race.configure(new FixedDelayRetry(3, 1), new InMemoryDeadLetters());\n        AtomicLong consumed = new AtomicLong();\n        race.subscribe(&quot;counter&quot;, &quot;ticks&quot;, m -&gt; consumed.incrementAndGet());\n        int threads = 50, each = 40, total = threads * each;\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;List&lt;Long&gt;&gt;&gt; runs = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; threads; t++) {\n            final int me = t;\n            runs.add(pool.submit(() -&gt; {\n                go.await();\n                List&lt;Long&gt; mine = new ArrayList&lt;&gt;(each);\n                for (int k = 0; k &lt; each; k++) mine.add(race.publish(&quot;ticks&quot;, &quot;p&quot; + me, me + &quot;:&quot; + k));\n                return mine;\n            }));\n        }\n        go.countDown();\n        Set&lt;Long&gt; offsets = new HashSet&lt;&gt;();\n        boolean ordered = true;\n        for (Future&lt;List&lt;Long&gt;&gt; f : runs) {\n            List&lt;Long&gt; mine = f.get();\n            offsets.addAll(mine);\n            for (int k = 1; k &lt; mine.size(); k++) if (mine.get(k) &lt;= mine.get(k - 1)) ordered = false;\n        }\n        pool.shutdown();\n        check(offsets.size() == total, &quot;2000 concurrent publishes got 2000 DISTINCT offsets, none duplicated&quot;);\n        check(race.topic(&quot;ticks&quot;).tailOffset() == total, &quot;the log holds all 2000: none was lost to a concurrent add&quot;);\n        boolean contiguous = true;\n        for (long off = 0; off &lt; total; off++) if (race.topic(&quot;ticks&quot;).readAt(off) == null) contiguous = false;\n        check(contiguous, &quot;the offsets are contiguous 0..1999: no hole anywhere in the log&quot;);\n        check(ordered, &quot;each publisher&#x27;s own messages kept their order relative to each other&quot;);\n        check(Main.awaitUntil(() -&gt; consumed.get() == total, 5000), &quot;one subscriber received all 2000 of them&quot;);\n        race.close();\n\n        // 2. fan-out: three subscribers each get every message, in order, from ONE copy of the log\n        Broker fan = new Broker(1_000);\n        fan.configure(new FixedDelayRetry(3, 1), new InMemoryDeadLetters());\n        List&lt;List&lt;String&gt;&gt; seen = List.of(new CopyOnWriteArrayList&lt;&gt;(), new CopyOnWriteArrayList&lt;&gt;(), new CopyOnWriteArrayList&lt;&gt;());\n        for (int i = 0; i &lt; 3; i++) { final int n = i; fan.subscribe(&quot;sub&quot; + i, &quot;news&quot;, m -&gt; seen.get(n).add(m.payload())); }\n        List&lt;String&gt; expected = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 20; i++) { fan.publish(&quot;news&quot;, &quot;k&quot;, &quot;n&quot; + i); expected.add(&quot;n&quot; + i); }\n        check(Main.awaitUntil(() -&gt; seen.stream().allMatch(l -&gt; l.size() == 20), 3000), &quot;all three subscribers received all 20&quot;);\n        check(seen.stream().allMatch(l -&gt; l.equals(expected)), &quot;and each received them in publish order&quot;);\n        check(fan.topic(&quot;news&quot;).retained() == 20, &quot;the topic stored 20 messages once, not 60: fan-out is three cursors, not three copies&quot;);\n        fan.close();\n\n        // 3. a subscriber restarts: it resumes at the offset it had committed, sees nothing twice and misses nothing\n        Broker rs = new Broker(1_000);\n        rs.configure(new FixedDelayRetry(3, 1), new InMemoryDeadLetters());\n        List&lt;String&gt; before = new CopyOnWriteArrayList&lt;&gt;(), after = new CopyOnWriteArrayList&lt;&gt;();\n        rs.subscribe(&quot;reader&quot;, &quot;feed&quot;, m -&gt; before.add(m.payload()));\n        for (int i = 0; i &lt; 5; i++) rs.publish(&quot;feed&quot;, &quot;k&quot;, &quot;m&quot; + i);\n        Main.awaitUntil(() -&gt; before.size() == 5, 2000);\n        long saved = rs.sub(&quot;reader&quot;).offset();\n        check(saved == 5, &quot;the cursor after five acknowledged messages is 5, the offset it will read NEXT&quot;);\n        rs.unsubscribe(&quot;reader&quot;);\n        for (int i = 5; i &lt; 10; i++) rs.publish(&quot;feed&quot;, &quot;k&quot;, &quot;m&quot; + i);           // published while it was down\n        rs.subscribe(&quot;reader&quot;, &quot;feed&quot;, m -&gt; after.add(m.payload()), SubscribeOptions.opts().fromOffset(saved));\n        check(Main.awaitUntil(() -&gt; after.size() == 5, 2000), &quot;the restarted subscriber picked up five messages&quot;);\n        check(after.equals(List.of(&quot;m5&quot;, &quot;m6&quot;, &quot;m7&quot;, &quot;m8&quot;, &quot;m9&quot;)), &quot;exactly the five it had not seen: no repeat, no gap&quot;);\n        rs.close();\n\n        // 4. the handler throws, then works: it is retried on the policy&#x27;s schedule and the cursor moves only after\n        TestClock clock4 = new TestClock();\n        Broker rt = new Broker(1_000);\n        rt.setClock(clock4);\n        InMemoryDeadLetters parked4 = new InMemoryDeadLetters();\n        rt.configure(new ExponentialBackoff(5, 10, 1_000), parked4);\n        AtomicInteger calls = new AtomicInteger();\n        rt.subscribe(&quot;flaky&quot;, &quot;jobs&quot;, m -&gt; { if (calls.incrementAndGet() &lt; 3) throw new IllegalStateException(&quot;gateway timeout&quot;); });\n        rt.publish(&quot;jobs&quot;, null, &quot;job-1&quot;);\n        check(Main.awaitUntil(() -&gt; rt.sub(&quot;flaky&quot;).delivered() == 1, 2000), &quot;the message was delivered in the end&quot;);\n        check(calls.get() == 3, &quot;the handler ran three times: two failures and the success&quot;);\n        check(clock4.sleeps.equals(List.of(10L, 20L)), &quot;the waits doubled -- 10 ms then 20 ms -- straight from the injected clock&quot;);\n        check(rt.sub(&quot;flaky&quot;).offset() == 1, &quot;the cursor moved only after the handler returned: at-least-once, not at-most-once&quot;);\n        check(parked4.size() == 0, &quot;nothing was dead-lettered, because the retry eventually worked&quot;);\n        rt.close();\n\n        // 5. a message nobody can handle: retried per the policy, parked, and the subscription CARRIES ON\n        TestClock clock5 = new TestClock();\n        Broker dl = new Broker(1_000);\n        dl.setClock(clock5);\n        InMemoryDeadLetters parked5 = new InMemoryDeadLetters();\n        dl.configure(new ExponentialBackoff(4, 10, 1_000), parked5);\n        List&lt;String&gt; handled = new CopyOnWriteArrayList&lt;&gt;();\n        dl.subscribe(&quot;strict&quot;, &quot;jobs&quot;, m -&gt; {\n            if (m.payload().equals(&quot;poison&quot;)) throw new IllegalArgumentException(&quot;cannot parse&quot;);\n            handled.add(m.payload());\n        });\n        dl.publish(&quot;jobs&quot;, null, &quot;a&quot;); dl.publish(&quot;jobs&quot;, null, &quot;poison&quot;); dl.publish(&quot;jobs&quot;, null, &quot;b&quot;);\n        check(Main.awaitUntil(() -&gt; dl.sub(&quot;strict&quot;).offset() == 3, 3000), &quot;the cursor reached the end: giving up never stalls a subscription&quot;);\n        check(handled.equals(List.of(&quot;a&quot;, &quot;b&quot;)), &quot;the two good messages were handled, the poison one was stepped over&quot;);\n        check(parked5.size() == 1 &amp;&amp; parked5.all().get(0).attempts() == 4, &quot;the poison message is parked, with four attempts recorded&quot;);\n        check(clock5.sleeps.equals(List.of(10L, 20L, 40L)), &quot;the three waits before giving up were 10, 20 and 40 ms&quot;);\n        check(dl.sub(&quot;strict&quot;).delivered() == 2 &amp;&amp; dl.sub(&quot;strict&quot;).deadLettered() == 1, &quot;counts: 2 delivered, 1 dead-lettered&quot;);\n        dl.close();\n\n        // 6. retention overtakes a slow subscriber: the head is dropped, the cursor is fast-forwarded, and the gap is COUNTED\n        Broker ret = new Broker(10);\n        ret.configure(new FixedDelayRetry(3, 1), new InMemoryDeadLetters());\n        CountDownLatch entered = new CountDownLatch(1), release = new CountDownLatch(1);\n        AtomicLong got = new AtomicLong();\n        Subscription slowpoke = ret.subscribe(&quot;slowpoke&quot;, &quot;firehose&quot;, m -&gt; {\n            if (got.get() == 0) { entered.countDown(); release.await(); }        // stuck on the very first message\n            got.incrementAndGet();\n        });\n        ret.publish(&quot;firehose&quot;, null, &quot;m0&quot;);\n        check(entered.await(2, TimeUnit.SECONDS), &quot;the subscriber is inside the handler for offset 0, cursor not yet moved&quot;);\n        for (int i = 1; i &lt; 50; i++) ret.publish(&quot;firehose&quot;, null, &quot;m&quot; + i);\n        check(ret.topic(&quot;firehose&quot;).retained() == 10, &quot;retention keeps only the last ten messages&quot;);\n        check(ret.topic(&quot;firehose&quot;).droppedCount() == 40, &quot;forty were trimmed off the head of the log&quot;);\n        release.countDown();\n        check(Main.awaitUntil(() -&gt; slowpoke.delivered() == 11, 3000), &quot;the subscriber caught up on what is still there: 11 delivered&quot;);\n        check(slowpoke.missed() == 39, &quot;the 39 messages retention dropped under it are COUNTED: visible loss beats invisible loss&quot;);\n        check(slowpoke.delivered() + slowpoke.missed() == 50, &quot;all fifty are accounted for, none quietly vanished&quot;);\n        ret.close();\n\n        // 7. one slow subscriber stalls neither the publisher nor the other subscribers\n        Broker sl = new Broker(1_000);\n        sl.configure(new FixedDelayRetry(3, 1), new InMemoryDeadLetters());\n        AtomicLong fast = new AtomicLong();\n        sl.subscribe(&quot;fast&quot;, &quot;mixed&quot;, m -&gt; fast.incrementAndGet());\n        sl.subscribe(&quot;slow&quot;, &quot;mixed&quot;, m -&gt; Thread.sleep(200));                   // 200 ms per message, on purpose\n        long t0 = System.nanoTime();\n        for (int i = 0; i &lt; 6; i++) sl.publish(&quot;mixed&quot;, &quot;k&quot;, &quot;m&quot; + i);\n        long publishMs = (System.nanoTime() - t0) / 1_000_000;\n        check(publishMs &lt; 100, &quot;six publishes returned in &quot; + publishMs + &quot; ms: a publisher never waits for a handler&quot;);\n        check(Main.awaitUntil(() -&gt; fast.get() == 6, 3000), &quot;the fast subscriber got all six immediately&quot;);\n        check(sl.sub(&quot;slow&quot;).delivered() &lt; 6, &quot;the slow one is still behind (&quot; + sl.sub(&quot;slow&quot;).lag() + &quot; to go) and that is its own problem&quot;);\n        sl.close();\n\n        // 8. a handler that always throws, and a listener that always throws, isolate: everyone else is unaffected\n        Broker iso = new Broker(1_000);\n        InMemoryDeadLetters parked8 = new InMemoryDeadLetters();\n        iso.configure(new FixedDelayRetry(2, 1), parked8);\n        iso.addListener(e -&gt; { if (e.type() == EventType.PUBLISHED) throw new RuntimeException(&quot;metrics is down&quot;); });\n        AtomicLong good = new AtomicLong();\n        iso.subscribe(&quot;bad&quot;, &quot;events&quot;, m -&gt; { throw new IllegalStateException(&quot;always fails&quot;); });\n        iso.subscribe(&quot;good&quot;, &quot;events&quot;, m -&gt; good.incrementAndGet());\n        iso.subscribe(&quot;keys&quot;, &quot;events&quot;, m -&gt; {}, SubscribeOptions.opts().filter(m -&gt; &quot;IN&quot;.equals(m.key())));\n        for (int i = 0; i &lt; 5; i++) check(iso.publish(&quot;events&quot;, i % 2 == 0 ? &quot;IN&quot; : &quot;US&quot;, &quot;m&quot; + i) == i,\n                                          &quot;publish &quot; + i + &quot; returned offset &quot; + i + &quot; although the listener threw&quot;);\n        check(Main.awaitUntil(() -&gt; good.get() == 5 &amp;&amp; iso.sub(&quot;bad&quot;).offset() == 5, 3000),\n              &quot;the good subscriber got all five while the failing one dead-lettered all five&quot;);\n        check(parked8.size() == 5, &quot;all five were parked by the failing subscription, and none by anybody else&quot;);\n        check(iso.sub(&quot;keys&quot;).delivered() == 3 &amp;&amp; iso.sub(&quot;keys&quot;).skipped() == 2,\n              &quot;the filtered subscription handled 3 of 5 and stepped over 2 without calling its handler&quot;);\n        iso.close();\n\n        // 9. a retry policy written next year that never gives up cannot stall a subscription: BoundedRetry caps it\n        TestClock clock9 = new TestClock();\n        Broker cap = new Broker(1_000);\n        cap.setClock(clock9);\n        InMemoryDeadLetters parked9 = new InMemoryDeadLetters();\n        cap.configure((attempt, failure) -&gt; 0, parked9);                          // &quot;always retry, immediately&quot;\n        AtomicInteger tries = new AtomicInteger();\n        cap.subscribe(&quot;forever&quot;, &quot;jobs&quot;, m -&gt; { tries.incrementAndGet(); throw new IllegalStateException(&quot;always&quot;); });\n        cap.publish(&quot;jobs&quot;, null, &quot;x&quot;); cap.publish(&quot;jobs&quot;, null, &quot;y&quot;);\n        check(Main.awaitUntil(() -&gt; cap.sub(&quot;forever&quot;).offset() == 2, 3000), &quot;both messages were finished with, not retried forever&quot;);\n        check(tries.get() == 2 * Broker.MAX_ATTEMPTS, &quot;the wrapper stopped each one at &quot; + Broker.MAX_ATTEMPTS + &quot; attempts: &quot; + tries.get() + &quot; handler calls&quot;);\n        check(parked9.size() == 2, &quot;and both ended up in the dead-letter sink&quot;);\n        cap.close();\n        Broker cap2 = new Broker(1_000);\n        InMemoryDeadLetters parked9b = new InMemoryDeadLetters();\n        cap2.configure((attempt, failure) -&gt; { throw new IllegalStateException(&quot;a bug in the policy&quot;); }, parked9b);\n        cap2.subscribe(&quot;broken&quot;, &quot;jobs&quot;, m -&gt; { throw new IllegalStateException(&quot;always&quot;); });\n        cap2.publish(&quot;jobs&quot;, null, &quot;x&quot;); cap2.publish(&quot;jobs&quot;, null, &quot;y&quot;);\n        check(Main.awaitUntil(() -&gt; cap2.sub(&quot;broken&quot;).offset() == 2, 3000) &amp;&amp; parked9b.size() == 2,\n              &quot;a policy that THROWS counts as giving up: both parked, the cursor at the end, the dispatcher alive&quot;);\n        cap2.close();\n\n        // 10. pause holds back the very next message; resume carries on from exactly there; unsubscribe ends the\n        //     thread; STOPPED is final\n        Broker ps = new Broker(1_000);\n        ps.configure(new FixedDelayRetry(3, 1), new InMemoryDeadLetters());\n        List&lt;String&gt; heard = new CopyOnWriteArrayList&lt;&gt;();\n        Subscription sub = ps.subscribe(&quot;watcher&quot;, &quot;clicks&quot;, m -&gt; heard.add(m.payload()));\n        for (int i = 0; i &lt; 3; i++) ps.publish(&quot;clicks&quot;, &quot;k&quot;, &quot;c&quot; + i);\n        Main.awaitUntil(() -&gt; heard.size() == 3, 2000);\n        sub.pause();\n        ps.publish(&quot;clicks&quot;, &quot;k&quot;, &quot;c3&quot;); ps.publish(&quot;clicks&quot;, &quot;k&quot;, &quot;c4&quot;);        // at once: the dispatcher is still in awaitAt\n        Thread.sleep(150);\n        check(sub.offset() == 3 &amp;&amp; sub.lag() == 2 &amp;&amp; heard.size() == 3,\n              &quot;paused: nothing was handed over after pause() returned; the cursor stayed at 3 and the lag grew to 2&quot;);\n        sub.resume();\n        check(Main.awaitUntil(() -&gt; heard.size() == 5, 2000), &quot;resumed: it picked up exactly where it stopped&quot;);\n        check(ps.unsubscribe(&quot;watcher&quot;), &quot;unsubscribe removed it&quot;);\n        check(Main.awaitUntil(() -&gt; !sub.running(), 2000), &quot;and its dispatch loop actually returned, so the thread does not leak&quot;);\n        sub.pause(); sub.resume();\n        check(sub.state() == SubState.STOPPED, &quot;STOPPED is final: pause() and resume() on a stopped subscription change nothing&quot;);\n        check(!ps.unsubscribe(&quot;watcher&quot;), &quot;unsubscribing twice is false, not an exception&quot;);\n        ps.close();\n\n        // 11. the lost wakeup: a dispatcher parked inside awaitAt is woken by the publish itself, not by a timeout.\n        //     The check and the wait are under the SAME lock the publisher signals under, inside a while loop.\n        Broker wk = new Broker(1_000);\n        wk.configure(new FixedDelayRetry(3, 1), new InMemoryDeadLetters());\n        Topic quiet = wk.topic(&quot;late-news&quot;);\n        long t11 = System.nanoTime();\n        check(quiet.awaitAt(0, 60) == null &amp;&amp; (System.nanoTime() - t11) / 1_000_000 &gt;= 55,\n              &quot;with nothing published, awaitAt waits its whole timeout and returns null rather than a message&quot;);\n        ExecutorService waiter = Executors.newSingleThreadExecutor();\n        Future&lt;Long&gt; woke = waiter.submit(() -&gt; {                                 // parks for up to five seconds\n            long t = System.nanoTime();\n            return quiet.awaitAt(0, 5_000) == null ? -1L : (System.nanoTime() - t) / 1_000_000;\n        });\n        Thread.sleep(60);                                                         // it is asleep in awaitNanos by now\n        wk.publish(&quot;late-news&quot;, null, &quot;extra&quot;);\n        long wokeMs = woke.get();\n        check(wokeMs &gt;= 0, &quot;the parked reader was handed the message the publisher appended&quot;);\n        check(wokeMs &lt; 2_000, &quot;and the publish itself woke it after &quot; + wokeMs + &quot; ms, not the 5,000 ms timeout: no wakeup was lost&quot;);\n        waiter.shutdown();\n        wk.close();\n\n        // 12. shutting down in the middle of a delivery: the thread ends at once and the message is NOT committed\n        Broker sd = new Broker(1_000);\n        InMemoryDeadLetters parked12 = new InMemoryDeadLetters();\n        sd.configure(new FixedDelayRetry(10, 60_000), parked12);                  // a minute between attempts, on purpose\n        CountDownLatch threw = new CountDownLatch(1);\n        Subscription stuck = sd.subscribe(&quot;stuck&quot;, &quot;slowjobs&quot;, m -&gt; { threw.countDown(); throw new IllegalStateException(&quot;downstream is down&quot;); });\n        sd.publish(&quot;slowjobs&quot;, null, &quot;j1&quot;);\n        check(threw.await(2, TimeUnit.SECONDS), &quot;the handler ran and threw, so the dispatcher is now asleep in a 60-second backoff&quot;);\n        long t12 = System.nanoTime();\n        sd.unsubscribe(&quot;stuck&quot;);\n        boolean ended = Main.awaitUntil(() -&gt; !stuck.running(), 2000);\n        long stopMs = (System.nanoTime() - t12) / 1_000_000;\n        check(ended &amp;&amp; stopMs &lt; 1_000, &quot;unsubscribe ended the dispatch loop in &quot; + stopMs + &quot; ms, not 60 s: stop() interrupts a parked thread&quot;);\n        check(stuck.offset() == 0, &quot;the cursor never moved: a shutdown in the middle of a delivery commits nothing&quot;);\n        check(parked12.size() == 0, &quot;and nothing was dead-lettered -- the message is unfinished, not given up on&quot;);\n        List&lt;String&gt; again = new CopyOnWriteArrayList&lt;&gt;();\n        sd.subscribe(&quot;stuck2&quot;, &quot;slowjobs&quot;, m -&gt; again.add(m.payload()), SubscribeOptions.opts().fromOffset(stuck.offset()));\n        check(Main.awaitUntil(() -&gt; again.equals(List.of(&quot;j1&quot;)), 2000), &quot;a replacement starting at that cursor is handed it again: at-least-once, proven&quot;);\n        sd.close();\n\n        // 13. seek while a message is in the handler: the dispatcher applies the seek before its next read, so the\n        //     replay starts exactly where it was asked to and nothing is skipped\n        Broker sk = new Broker(1_000);\n        List&lt;Long&gt; order = new CopyOnWriteArrayList&lt;&gt;();\n        CountDownLatch holding = new CountDownLatch(1), letGo = new CountDownLatch(1);\n        Subscription replayer = sk.subscribe(&quot;replayer&quot;, &quot;log&quot;, m -&gt; {\n            if (m.offset() == 3 &amp;&amp; holding.getCount() &gt; 0) { holding.countDown(); letGo.await(); }\n            order.add(m.offset());\n        }, SubscribeOptions.opts().fromEarliest());\n        for (int i = 0; i &lt; 5; i++) sk.publish(&quot;log&quot;, &quot;k&quot;, &quot;m&quot; + i);\n        check(holding.await(2, TimeUnit.SECONDS), &quot;the handler is holding offset 3 when another thread calls seek(0)&quot;);\n        replayer.seek(0);\n        letGo.countDown();\n        check(Main.awaitUntil(() -&gt; order.size() == 9, 2000) &amp;&amp; order.equals(List.of(0L, 1L, 2L, 3L, 0L, 1L, 2L, 3L, 4L)),\n              &quot;3 finished, then the replay began at 0 itself, not at 1: &quot; + order);\n        sk.close();\n\n        // 14. a filter that throws (here: a message with no key) fails like a handler: retried, parked, and the\n        //     subscription carries on instead of dying on the spot\n        Broker fl = new Broker(1_000);\n        InMemoryDeadLetters parked14 = new InMemoryDeadLetters();\n        fl.configure(new FixedDelayRetry(2, 1), parked14);\n        List&lt;String&gt; india = new CopyOnWriteArrayList&lt;&gt;();\n        Subscription picky = fl.subscribe(&quot;india&quot;, &quot;orders&quot;, m -&gt; india.add(m.payload()),\n            SubscribeOptions.opts().filter(m -&gt; m.key().startsWith(&quot;IN&quot;)));       // m.key() is null for the first message\n        fl.publish(&quot;orders&quot;, null, &quot;no-key&quot;); fl.publish(&quot;orders&quot;, &quot;IN-1&quot;, &quot;o1&quot;);\n        fl.publish(&quot;orders&quot;, &quot;US-1&quot;, &quot;o2&quot;);   fl.publish(&quot;orders&quot;, &quot;IN-2&quot;, &quot;o3&quot;);\n        check(Main.awaitUntil(() -&gt; picky.offset() == 4, 2000), &quot;the cursor reached the end: the throwing filter did not kill the dispatcher&quot;);\n        check(india.equals(List.of(&quot;o1&quot;, &quot;o3&quot;)) &amp;&amp; picky.skipped() == 1 &amp;&amp; parked14.size() == 1,\n              &quot;the two IN orders were handled, the US one skipped, the keyless one parked&quot;);\n        fl.close();\n\n        // 15. an interrupt means stop. A handler that throws InterruptedException by itself ends its subscription\n        //     cleanly, instead of leaving the thread spinning at full CPU on an interrupt that nobody clears\n        Broker ir = new Broker(1_000);\n        AtomicInteger irCalls = new AtomicInteger();\n        Subscription quitter = ir.subscribe(&quot;quitter&quot;, &quot;jobs&quot;, m -&gt; {\n            if (irCalls.incrementAndGet() == 1) throw new InterruptedException(&quot;raised inside the handler&quot;);\n        });\n        ir.publish(&quot;jobs&quot;, null, &quot;j1&quot;);\n        check(Main.awaitUntil(() -&gt; !quitter.running(), 2000) &amp;&amp; quitter.state() == SubState.STOPPED,\n              &quot;the dispatch loop ended and the subscription says STOPPED&quot;);\n        check(quitter.offset() == 0 &amp;&amp; irCalls.get() == 1, &quot;the cursor never moved, and the handler was not called again&quot;);\n        ir.close();\n\n        // 16. the wall clock steps back: a timestamp never goes below the one before it, so seek-by-time stays right\n        TestClock back = new TestClock();\n        Broker tb = new Broker(1_000);\n        tb.setClock(back);\n        back.now = 10_000; tb.publish(&quot;ticks&quot;, null, &quot;a&quot;);\n        back.now = 4_000;  tb.publish(&quot;ticks&quot;, null, &quot;b&quot;);                        // the clock was stepped back six seconds\n        back.now = 12_000; tb.publish(&quot;ticks&quot;, null, &quot;c&quot;);\n        Topic ticks = tb.topic(&quot;ticks&quot;);\n        check(ticks.readAt(1).atMs() == 10_000, &quot;b was stamped 10,000, not 4,000: time inside one log never goes backwards&quot;);\n        check(TimeSeek.offsetAt(ticks, 5_000) == 0, &quot;so &#x27;everything since 5,000&#x27; starts at a (offset 0), not at c&quot;);\n        tb.close();\n\n        // 17. guaranteed delivery: eight publishers go through the back-pressure gate into a ring of 16 with one slow\n        //     reader. No publish may overwrite a message the reader has not handled yet\n        Broker gd = new Broker(16);\n        AtomicLong handled17 = new AtomicLong();\n        Subscription slowReader = gd.subscribe(&quot;slow&quot;, &quot;orders&quot;, m -&gt; { Thread.sleep(1); handled17.incrementAndGet(); });\n        BackPressure gate = new BackPressure(gd);\n        ExecutorService pubs = Executors.newFixedThreadPool(8);\n        CountDownLatch go17 = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; sent = new ArrayList&lt;&gt;();\n        for (int p = 0; p &lt; 8; p++) {\n            final int me = p;\n            sent.add(pubs.submit(() -&gt; { go17.await(); for (int k = 0; k &lt; 25; k++) gate.publish(&quot;orders&quot;, &quot;k&quot;, me + &quot;:&quot; + k, 10_000); return null; }));\n        }\n        go17.countDown();\n        for (Future&lt;?&gt; f : sent) f.get();\n        pubs.shutdown();\n        check(Main.awaitUntil(() -&gt; handled17.get() == 200, 5000), &quot;the slow reader handled all 200&quot;);\n        check(slowReader.missed() == 0, &quot;and missed none: no publish overwrote a message it had not read&quot;);\n        gd.close();\n\n        // 18. pull instead of push: consume() moves nothing, ack() commits, a filter leaves messages out, and a long\n        //     poll is woken by the publish itself\n        Broker pb = new Broker(1_000);\n        PullConsumers pull = new PullConsumers(pb);\n        pull.subscribe(&quot;orders&quot;, &quot;billing&quot;, true, Filter.all());\n        pull.subscribe(&quot;orders&quot;, &quot;india&quot;, true, m -&gt; &quot;IN&quot;.equals(m.key()));\n        for (int i = 0; i &lt; 5; i++) pb.publish(&quot;orders&quot;, i % 2 == 0 ? &quot;IN&quot; : &quot;US&quot;, &quot;o&quot; + i);\n        Batch first = pull.consume(&quot;orders&quot;, &quot;billing&quot;, 3, 0), repeat = pull.consume(&quot;orders&quot;, &quot;billing&quot;, 3, 0);\n        check(payloads(first).equals(List.of(&quot;o0&quot;, &quot;o1&quot;, &quot;o2&quot;)) &amp;&amp; payloads(repeat).equals(payloads(first)),\n              &quot;without an ack the same three come back: a consumer that crashed before ack() loses nothing&quot;);\n        pull.ack(&quot;orders&quot;, &quot;billing&quot;, first.next());\n        check(payloads(pull.consume(&quot;orders&quot;, &quot;billing&quot;, 10, 0)).equals(List.of(&quot;o3&quot;, &quot;o4&quot;)), &quot;after ack(3) the next batch starts at offset 3&quot;);\n        Batch in = pull.consume(&quot;orders&quot;, &quot;india&quot;, 10, 0);\n        check(payloads(in).equals(List.of(&quot;o0&quot;, &quot;o2&quot;, &quot;o4&quot;)) &amp;&amp; in.next() == 5,\n              &quot;the filtered consumer got the three IN orders, and its ack will step over the two US ones&quot;);\n        pull.ack(&quot;orders&quot;, &quot;india&quot;, in.next());\n        ExecutorService poller = Executors.newSingleThreadExecutor();\n        Future&lt;Long&gt; waited = poller.submit(() -&gt; {\n            long t = System.nanoTime();\n            Batch b = pull.consume(&quot;orders&quot;, &quot;india&quot;, 10, 5_000);                 // nothing new yet: a long poll\n            return b.messages().isEmpty() ? -1L : (System.nanoTime() - t) / 1_000_000;\n        });\n        Thread.sleep(60);\n        pb.publish(&quot;orders&quot;, &quot;IN&quot;, &quot;o5&quot;);\n        long waitedMs = waited.get();\n        check(waitedMs &gt;= 0 &amp;&amp; waitedMs &lt; 2_000, &quot;the long poll was woken by the publish after &quot; + waitedMs + &quot; ms, not by its 5,000 ms timeout&quot;);\n        poller.shutdown();\n        pb.close();\n\n        // 19. persistence: a tab or a newline inside a payload survives, lines written out of order come back at their\n        //     own offsets and times, and a restore does not write everything to the file a second time\n        Path file = Files.createTempFile(&quot;pubsub-test&quot;, &quot;.tsv&quot;);\n        FileStore store = new FileStore(file);\n        store.append(new Message(1, &quot;audit&quot;, &quot;k&quot;, &quot;line one\\nline two&quot;, Map.of(), 2_000));   // offset 1 reached the file first\n        store.append(new Message(0, &quot;audit&quot;, null, &quot;a\\ttab&quot;, Map.of(), 1_000));\n        Broker restarted = new Broker(1_000);\n        restarted.addListener(e -&gt; {                                              // the same &quot;store every publish&quot; listener as before\n            if (e.type() != EventType.PUBLISHED) return;\n            try { store.append(restarted.topic(e.topic()).readAt(e.offset())); } catch (IOException io) { throw new UncheckedIOException(io); }\n        });\n        check(Recovery.restore(restarted, store, &quot;audit&quot;) == 2, &quot;both stored messages were read back&quot;);\n        Message r0 = restarted.topic(&quot;audit&quot;).readAt(0), r1 = restarted.topic(&quot;audit&quot;).readAt(1);\n        check(r0 != null &amp;&amp; r1 != null &amp;&amp; &quot;a\\ttab&quot;.equals(r0.payload()) &amp;&amp; &quot;line one\\nline two&quot;.equals(r1.payload()) &amp;&amp; r0.key() == null,\n              &quot;each came back at its own offset, with the tab and the newline intact&quot;);\n        check(r0.atMs() == 1_000 &amp;&amp; r1.atMs() == 2_000, &quot;with the time it was stored with, not the time of the restart&quot;);\n        check(Files.readAllLines(file).size() == 2, &quot;and the restore wrote nothing back to the file: a replay is not a new publish&quot;);\n        Files.deleteIfExists(file);\n        restarted.close();\n\n        // 20. one IdempotentHandler shared by eight threads, as a consumer group shares it: every distinct id is\n        //     handled exactly once, and the remembered ids stay consistent under the lock\n        AtomicLong charged = new AtomicLong();\n        IdempotentHandler shared = new IdempotentHandler(m -&gt; charged.incrementAndGet(), 100);\n        ExecutorService members = Executors.newFixedThreadPool(8);\n        CountDownLatch go20 = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; ran = new ArrayList&lt;&gt;();\n        for (int p = 0; p &lt; 8; p++) {\n            final int me = p;\n            ran.add(members.submit(() -&gt; {\n                go20.await();\n                for (int k = 0; k &lt; 20_000; k++) shared.onMessage(new Message(k, &quot;charges&quot;, null, &quot;c&quot;, Map.of(&quot;id&quot;, me + &quot;:&quot; + k), 0));\n                return null;\n            }));\n        }\n        go20.countDown();\n        boolean finished = true;\n        for (Future&lt;?&gt; f : ran) { try { f.get(10, TimeUnit.SECONDS); } catch (TimeoutException hung) { finished = false; } }\n        members.shutdownNow();\n        check(finished &amp;&amp; charged.get() == 160_000 &amp;&amp; shared.duplicates() == 0,\n              &quot;160,000 distinct ids from 8 threads: each charged once, none taken for a duplicate, no thread stuck&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design an in-process pub/sub system. Publishers post messages to named topics and subscribers get them without the two ever knowing about each other &mdash; many publishers, many subscribers, and a handler that is allowed to fail. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (fan-out or competing consumers, push or pull, and at-most-once or at-least-once come first). The must-write core is about 150 lines: Message, Handler, Topic with its lock, append and awaitAt, Subscription with its dispatch loop and the commit as the last statement, a thin Broker with publish, subscribe and unsubscribe, and a main with fifty publishing threads. Amazon's 30-minute version (event types, subscribe, unsubscribe, every subscriber receives) is that core alone. Then add what the interviewer asks for, in the order of Main.java: the retry policies and the BoundedRetry wrapper, the dead-letter sink, the filter, pause and seek, the listeners, and SubscribeOptions. If the statement says subscribers call consume() and ack() (Razorpay's version), keep the log and the cursors and write follow-up 10 instead of the thread.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; Twenty minutes in: &quot;back off exponentially instead of a flat 20 ms, and never retry a message that can never work.&quot;</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two changes, both new classes, and nothing inside Topic, Subscription or Broker moves. ExponentialBackoff starts at the base, doubles the wait after each failure up to a cap, and gives up after n attempts: with a base of 10 ms and four attempts, it waits 10 ms, 20 ms and 40 ms, then stops. \"Never retry a message that can never work\" is a wrapper rather than a new policy. NoRetryFor holds any policy and answers &minus;1 (give up) the moment the failure is of a type you declared permanent, so it composes with the backoff instead of replacing it. The call site is one line: <code>opts().retry(new NoRetryFor(new ExponentialBackoff(6, 10, 1000), PermanentFailure.class))</code>. It was cheap because the failure is passed to the policy, so telling a timeout from a malformed payload never needed a new signature. Where the given-up message goes is the other interface. DeadLetterTopic publishes it to <code>orders.dlq</code> with the reason in its headers, so the repair tool is just another subscriber and a replay is just another publish.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Double the wait each time up to a cap, so a struggling downstream is not hammered: 10, 20, 40, 80 ... capped.\n * A new class, not an edit: nothing inside Topic, Subscription or Broker moved to make this exist.\n */\nfinal class ExponentialBackoff implements RetryPolicy {\n    private final int maxAttempts; private final long baseMs, capMs;\n    ExponentialBackoff(int maxAttempts, long baseMs, long capMs) { this.maxAttempts = maxAttempts; this.baseMs = baseMs; this.capMs = capMs; }\n    public long backoffMs(int attempt, Exception failure) {\n        if (attempt &gt;= maxAttempts) return -1;\n        return Math.min(capMs, baseMs &lt;&lt; Math.min(attempt - 1, 30));    // 1 -&gt; base, 2 -&gt; 2x base, 3 -&gt; 4x base ...\n    }\n}\n\n// ---- ext: never retry a message that can never work -- one decorator, no change to any policy or to Subscription\n/** A failure that will fail identically forever: a malformed payload, a schema mismatch, a deleted account. */\nclass PermanentFailure extends Exception {\n    PermanentFailure(String message) { super(message); }\n}\n\n/**\n * Wraps ANY retry policy and refuses to retry a permanent failure: &quot;exponential backoff, but never five times\n * on a message that can never work&quot;. A new class and one line at the subscribe call; ExponentialBackoff,\n * Subscription, Topic and Broker are all untouched, which is the whole point of the interface.\n */\nfinal class NoRetryFor implements RetryPolicy {\n    private final RetryPolicy base;\n    private final Class&lt;? extends Exception&gt; permanent;\n    NoRetryFor(RetryPolicy base, Class&lt;? extends Exception&gt; permanent) { this.base = base; this.permanent = permanent; }\n    public long backoffMs(int attempt, Exception failure) {\n        if (permanent.isInstance(failure)) return -1;                    // straight to the dead-letter sink\n        return base.backoffMs(attempt, failure);\n    }\n}\n\n// ---- ext: a dead-letter TOPIC -- park failures where a human tool can subscribe to them and replay them\n/**\n * The sink that a production broker ships with: instead of a list nobody reads, a message nobody could process\n * is published to &quot;&lt;topic&gt;.dlq&quot; with why-it-failed in the headers. The dead-letter queue is then just another\n * topic, so the repair tool is just another subscriber and a replay is just another publish.\n */\nfinal class DeadLetterTopic implements DeadLetterSink {\n    private final Broker broker;\n    private final String suffix;\n    DeadLetterTopic(Broker broker, String suffix) { this.broker = broker; this.suffix = suffix; }\n    public void park(Dead d) {\n        Message m = d.message();\n        broker.publish(m.topic() + suffix, m.key(), m.payload(),\n            Map.of(&quot;dlq.reason&quot;, d.reason(),\n                   &quot;dlq.attempts&quot;, String.valueOf(d.attempts()),\n                   &quot;dlq.subscription&quot;, d.subscriptionId(),\n                   &quot;dlq.origin&quot;, m.topic() + &quot;@&quot; + m.offset()));\n    }\n    /** Replay one parked message back onto its original topic, once it is fixed. */\n    static long replay(Broker broker, Message parked) {\n        String origin = parked.headers().get(&quot;dlq.origin&quot;);\n        String topic = origin == null ? parked.topic() : origin.substring(0, origin.lastIndexOf(&#x27;@&#x27;));\n        return broker.publish(topic, parked.key(), parked.payload());\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Fifty threads publish to one topic at the same instant. Prove you cannot duplicate or lose an offset, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading the tail and storing at it: two threads both read 7, both write slot 7, and one message disappears. append does both inside the topic's lock, so no other publisher can run in that gap. The proof is not a count but a set. Fifty threads wait on one latch, each publishes forty messages, and each collects the offsets it was handed. The test then checks four things: the two thousand offsets are two thousand distinct values; the tail is exactly 2000; every offset from 0 to 1999 reads back (no gap); and each publisher's own offsets increased. A subscriber counting in the background must also have seen all two thousand. Then state the ordering promise precisely, because they will push on it. Offsets come out in the order the lock handed them out, so every subscriber sees one topic's messages in exactly that order. Nothing is promised about two independent publishers: if their order matters, they must be one publisher, or share one key.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. fifty threads publish into ONE topic at the same instant: every offset must be handed out exactly\n        //    once, the log must hold all of them, and each publisher&#x27;s own messages must be in increasing order.\n        Broker race = new Broker(200_000);\n        race.configure(new FixedDelayRetry(3, 1), new InMemoryDeadLetters());\n        AtomicLong consumed = new AtomicLong();\n        race.subscribe(&quot;counter&quot;, &quot;ticks&quot;, m -&gt; consumed.incrementAndGet());\n        int threads = 50, each = 40, total = threads * each;\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;List&lt;Long&gt;&gt;&gt; runs = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; threads; t++) {\n            final int me = t;\n            runs.add(pool.submit(() -&gt; {\n                go.await();\n                List&lt;Long&gt; mine = new ArrayList&lt;&gt;(each);\n                for (int k = 0; k &lt; each; k++) mine.add(race.publish(&quot;ticks&quot;, &quot;p&quot; + me, me + &quot;:&quot; + k));\n                return mine;\n            }));\n        }\n        go.countDown();\n        Set&lt;Long&gt; offsets = new HashSet&lt;&gt;();\n        boolean ordered = true;\n        for (Future&lt;List&lt;Long&gt;&gt; f : runs) {\n            List&lt;Long&gt; mine = f.get();\n            offsets.addAll(mine);\n            for (int k = 1; k &lt; mine.size(); k++) if (mine.get(k) &lt;= mine.get(k - 1)) ordered = false;\n        }\n        pool.shutdown();\n        check(offsets.size() == total, &quot;2000 concurrent publishes got 2000 DISTINCT offsets, none duplicated&quot;);\n        check(race.topic(&quot;ticks&quot;).tailOffset() == total, &quot;the log holds all 2000: none was lost to a concurrent add&quot;);\n        boolean contiguous = true;\n        for (long off = 0; off &lt; total; off++) if (race.topic(&quot;ticks&quot;).readAt(off) == null) contiguous = false;\n        check(contiguous, &quot;the offsets are contiguous 0..1999: no hole anywhere in the log&quot;);\n        check(ordered, &quot;each publisher&#x27;s own messages kept their order relative to each other&quot;);\n        check(Main.awaitUntil(() -&gt; consumed.get() == total, 5000), &quot;one subscriber received all 2000 of them&quot;);\n        race.close();\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; Your dispatch loop says &quot;if there is nothing at my cursor, wait&quot;. Walk me through what breaks.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two different bugs, and this design closes both in one method. The first is the <b>lost wakeup</b>. Between the check that finds nothing and the call that goes to sleep, a publisher can append and signal. The sleeper never hears it: it waits out its whole timeout, or forever without one. <code>awaitAt</code> closes that gap by doing the check and the wait inside the topic's own lock, the same lock <code>append</code> signals under, so a publisher cannot run in between. The second is the <b>spurious wakeup</b>: <code>await</code> may return with nothing having changed. That is why the check is a <code>while</code> and not an <code>if</code>. On any wakeup it looks at the ring again, and goes back to sleep if the message is still not there. The fifty-millisecond timeout is not a patch for either bug. It makes an idle dispatcher look at its own state (paused? a seek waiting?) at least every fifty milliseconds; stop() does not need it, because stop() interrupts. Test 11 catches a broken version: a reader parked with a five-second budget must come back about sixty milliseconds after the publish, not after five seconds.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Wait for the message at this offset, up to a timeout. The check and the wait are inside ONE lock, the same\n     * lock the publisher signals under, and inside a `while`. That makes a lost wakeup impossible and a spurious\n     * one (a wake-up with no signal, which Java allows) harmless. Returns null on timeout, or when the ring has\n     * already overwritten the offset. An interrupt is passed on, never swallowed: it means &quot;stop&quot;.\n     */\n    Message awaitAt(long offset, long timeoutMs) throws InterruptedException {\n        lock.lock();\n        try {\n            long left = TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n            while (true) {\n                if (offset &lt; head) return null;                         // overwritten before we read it; the caller fast-forwards\n                Message m = at(offset);\n                if (m != null) return m;\n                if (left &lt;= 0) return null;\n                left = appended.awaitNanos(left);\n            }\n        } finally { lock.unlock(); }\n    }\n\n        // 11. the lost wakeup: a dispatcher parked inside awaitAt is woken by the publish itself, not by a timeout.\n        //     The check and the wait are under the SAME lock the publisher signals under, inside a while loop.\n        Broker wk = new Broker(1_000);\n        wk.configure(new FixedDelayRetry(3, 1), new InMemoryDeadLetters());\n        Topic quiet = wk.topic(&quot;late-news&quot;);\n        long t11 = System.nanoTime();\n        check(quiet.awaitAt(0, 60) == null &amp;&amp; (System.nanoTime() - t11) / 1_000_000 &gt;= 55,\n              &quot;with nothing published, awaitAt waits its whole timeout and returns null rather than a message&quot;);\n        ExecutorService waiter = Executors.newSingleThreadExecutor();\n        Future&lt;Long&gt; woke = waiter.submit(() -&gt; {                                 // parks for up to five seconds\n            long t = System.nanoTime();\n            return quiet.awaitAt(0, 5_000) == null ? -1L : (System.nanoTime() - t) / 1_000_000;\n        });\n        Thread.sleep(60);                                                         // it is asleep in awaitNanos by now\n        wk.publish(&quot;late-news&quot;, null, &quot;extra&quot;);\n        long wokeMs = woke.get();\n        check(wokeMs &gt;= 0, &quot;the parked reader was handed the message the publisher appended&quot;);\n        check(wokeMs &lt; 2_000, &quot;and the publish itself woke it after &quot; + wokeMs + &quot; ms, not the 5

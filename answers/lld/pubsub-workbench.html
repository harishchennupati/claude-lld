\" stroke-width=\"1.3\"/><text x=\"402.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check and wait under the SAME lock, in a while; test 11: the publish woke it, not the timeout</text></g><g transform=\"translate(30 96)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a handler or its filter throws</text></g><path d=\"M350 114 H396\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(396 96)\"><rect width=\"804\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"402.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry by the policy, park it, move the cursor on; tests 5, 14: the cursor still reaches the end</text></g><g transform=\"translate(30 136)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a retry rule never gives up, or throws</text></g><path d=\"M350 154 H396\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(396 136)\"><rect width=\"804\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"402.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BoundedRetry wraps every policy; test 9: stopped at 20 attempts, or parked at once</text></g><g transform=\"translate(30 176)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the ring outruns a slow reader</text></g><path d=\"M350 194 H396\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(396 176)\"><rect width=\"804\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"402.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">counted (test 6: 11 + 39 = 50), or back-pressure makes the publisher wait (test 17: 0 missed)</text></g><g transform=\"translate(30 216)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one handler takes two seconds</text></g><path d=\"M350 234 H396\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(396 216)\"><rect width=\"804\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"402.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">it runs outside the lock, on its own thread; test 7: six publishes in 0 ms</text></g><g transform=\"translate(30 256)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stop or seek mid-delivery</text></g><path d=\"M350 274 H396\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(396 256)\"><rect width=\"804\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"402.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">commit nothing; apply a seek before the next read; tests 12, 13: cursor still 0, replay from 0</text></g><g transform=\"translate(30 296)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an interrupt that is not a stop()</text></g><path d=\"M350 314 H396\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(396 296)\"><rect width=\"804\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"402.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an interrupt always means stop; test 15: the thread ends instead of spinning forever</text></g><text x=\"615\" y=\"356\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a failure test: FailureTests.java runs seventy-five checks and must print ALL PASS</text></svg></div><div class=\"move\"><p>Two threads publishing at the same instant: fifty of them, and every offset must be distinct. A dispatcher sleeping through a publish, the lost wakeup. Its test is the sharp one, because a weak test cannot tell the fix from the bug. Park a reader on an empty topic with a five-second budget and publish sixty milliseconds later: it must come back in about sixty milliseconds. If it comes back after five seconds, the signal was lost and only the timeout saved you. A handler or a filter that throws, and a retry rule that never gives up or throws itself: retry, park, and the cursor must still reach the end. The ring outrunning a slow subscriber: eleven delivered plus thirty-nine missed must be exactly fifty, and with back-pressure nothing may be missed at all. One handler that takes two seconds, and a metrics listener that throws: neither may cost a publisher anything. A stop or a seek while a message is in the handler: the stop commits nothing, and the replay starts exactly where it was asked to. An interrupt that nobody meant as a stop still ends the thread, instead of leaving it spinning. Each is a few lines in FailureTests.java, which runs seventy-five checks; a design that cannot show its tests is only making claims.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 350\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"850\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">broker.subscribe(id, topic, handler) -- publish names no subscriber</text><text x=\"850\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">the whole point: neither side knows the other</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">interface RetryPolicy { long backoffMs(attempt, failure); }</text><text x=\"850\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">a new retry rule is a class, not an edit</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">new BoundedRetry(policy, 20, 60_000) wraps EVERY policy</text><text x=\"850\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">no rule, present or future, retries forever</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Iterator</text><text x=\"220\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 5</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">the cursor: one AtomicLong per subscription over one log</text><text x=\"850\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">a fourth subscriber adds a cursor, not a copy</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"220\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">SubState, and the delivery order: read, deliver, THEN commit</text><text x=\"850\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">at-least-once is one visible line</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">Builder</text><text x=\"220\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">opts().fromEarliest().retry(p).filter(f) -- five optional knobs</text><text x=\"850\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">the rare LLD where it truly earns its place</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"220\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">the broker is handed to its callers; nothing calls getInstance()</text><text x=\"850\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh broker per case</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"220\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">topics appear via topics.computeIfAbsent(name, ...), one line</text><text x=\"850\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when a topic needs a config</text><rect x=\"20\" y=\"290\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Command</text><text x=\"220\" y=\"309.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"310\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">no move produced one: a message is data, not an instruction</text><text x=\"850\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">a pattern without a move is decoration</text><text x=\"615\" y=\"335\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>The table is the answer; what it cannot show is the order things happened in. Every name in it was earned by a move and written down afterwards, which is why each has a line of code beside it instead of a paragraph of defence. Two are worth saying out loud in the room. Observer is not a pattern this design uses; it is what the design <i>is</i>: <code>publish</code> names a topic and has never heard of a subscriber. And Builder, which is decoration in most LLDs, earns its place here: <code>SubscribeOptions</code> has five settings and all five are optional, which is exactly what a five-argument constructor handles badly. The bottom three rows are worth as much as the top six. Naming a pattern no move produced is decoration, and \"not yet, and here is what would change my mind\" is a stronger answer than a name.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"450\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"560\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"450\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"560\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Topic: the log. Subscription: one cursor, one handler. RetryPolicy: again or not.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"450\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">ExponentialBackoff, NoRetryFor, a .dlq sink, a FileStore: each one a new class</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"450\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">retry.backoffMs(attempt, e);  a negative answer means give up, from any policy</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"450\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">Handler, Filter, DeadLetterSink, BrokerListener, RetryPolicy: each can be a lambda</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"450\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"560\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">opts().retry(...).deadLetters(...).filter(...);  broker.setClock(() -&gt; t)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>The table is a check, not a recitation. Every letter has to point at a move and at a line of this code. A letter that cannot point at one is telling you something about the design, not about the acronym. The row to say out loud is D, because it is what makes the tests possible at all. The subscription is handed its policy, its sink, its filter and its clock, and never writes <code>new</code> on any of them. That is why a test can hand it a clock that runs a five-minute backoff schedule in no time, and a policy that never gives up.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 322\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 22)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">backoff, a filter, a different sink</text></g><path d=\"M360 44 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 22)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind the interface, plus one line at subscribe</text></g><text x=\"1150\" y=\"49\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 76)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">metrics, a lag alarm, tracing</text></g><path d=\"M360 98 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 76)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more BrokerListener; the log and the cursors do not move</text></g><text x=\"1150\" y=\"103\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 130)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">paused, draining, quarantined</text></g><path d=\"M360 152 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 130)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more SubState and one more checked transition</text></g><text x=\"1150\" y=\"157\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 184)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across readers</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">each message handled by exactly one worker</text></g><path d=\"M360 206 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 184)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same log, one filter per group member: consumer groups</text></g><text x=\"1150\" y=\"211\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 3 + 5</text><g transform=\"translate(30 238)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">persist it; then two processes</text></g><path d=\"M360 260 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 238)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the log behind a MessageStore and the cursor behind an OffsetStore;</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">append becomes a write to a file on disk; commit becomes an offset commit</text></g><text x=\"1150\" y=\"265\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"308\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the Topic, the cursor and the tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>Four of the five are small. A new rule is a new class behind an existing interface, plus one line at the subscribe call. Someone new who wants to know is one more listener, and the log and the cursors do not move. A new step in a life is one more state and one more checked transition. A new invariant across readers (a rule that must always hold; here, each message handled by exactly one worker instead of all of them) is consumer groups. It needs no new broker code, because it is the same log with one filter per member. The fifth sounds big and is not. The log goes behind a <code>MessageStore</code> and the cursor behind an <code>OffsetStore</code>. The append becomes a write to a file on disk, the commit becomes an offset commit, and every class keeps its name. That is why \"explain Kafka\" and \"explain this file\" turn out to be the same explanation at two sizes. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 800\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M245 73.0L310 129\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M475.0 238L475.0 275\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"481.0\" y=\"260.5\" font-size=\"10.5\" fill=\"var(--muted)\">owns, by name</text><path d=\"M310 180L300 180L300 631L310 631\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M310 129L290 129L290 457L245 457\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><path d=\"M310 631L258 631L258 187L245 187\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M310 660L270 660L270 275L245 275\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M310 690L282 690L282 370L245 370\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M640 631L655 631L655 392L640 392\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"662\" y=\"500\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">reads by offset;</text><text x=\"662\" y=\"516\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">many share one</text><path d=\"M640 392.0L670 392L670 299L690 299.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M640 570L690 545\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M802.5 135L802.5 102\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M802.5 385L802.5 348\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"808.5\" y=\"370.5\" font-size=\"10.5\" fill=\"var(--muted)\">carries</text><path d=\"M640 129.0L668 129L668 61L690 61.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M640 700L930 700L930 407L960 407.0\" fi "87\" font-size=\"11.5\" fill=\"var(--muted)\">atMs: long</text></g><g transform=\"translate(690 520)\"><rect width=\"225\" height=\"50\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"112.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"112.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SubState</text><line x1=\"0\" y1=\"34\" x2=\"225\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">ACTIVE, PAUSED, STOPPED</text></g><g transform=\"translate(960 20)\"><rect width=\"255\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"127.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"127.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RetryPolicy</text><line x1=\"0\" y1=\"34\" x2=\"255\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">backoffMs(attempt, failure)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">  : long   (&lt; 0 = give up)</text></g><g transform=\"translate(960 115)\"><rect width=\"255\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"127.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">BoundedRetry</text><line x1=\"0\" y1=\"26\" x2=\"255\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">base: RetryPolicy (wrapped)</text><line x1=\"0\" y1=\"48\" x2=\"255\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">wraps ANY policy and</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">caps attempts + backoff</text></g><g transform=\"translate(960 215)\"><rect width=\"255\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"127.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FixedDelayRetry</text><line x1=\"0\" y1=\"26\" x2=\"255\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">the same wait, n times</text></g><g transform=\"translate(960 290)\"><rect width=\"255\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"127.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ExponentialBackoff</text><line x1=\"0\" y1=\"26\" x2=\"255\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">base &lt;&lt; (attempt-1), capped</text></g><g transform=\"translate(960 380)\"><rect width=\"255\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"127.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"127.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DeadLetterSink</text><line x1=\"0\" y1=\"34\" x2=\"255\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">park(Dead d)</text></g><g transform=\"translate(960 455)\"><rect width=\"255\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"127.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">InMemoryDeadLetters</text><line x1=\"0\" y1=\"26\" x2=\"255\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">park(d) &rarr; a list</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">all() / size()</text></g><g transform=\"translate(960 560)\"><rect width=\"255\" height=\"122\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"127.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SubscribeOptions</text><line x1=\"0\" y1=\"26\" x2=\"255\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">retry / sink / filter</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">startAt: long,  earliest: boolean</text><line x1=\"0\" y1=\"64\" x2=\"255\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">opts()  -- a fresh set</text><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">retry(r) / deadLetters(s) / filter(f)</text><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">fromEarliest() / fromOffset(n)</text></g><g><path d=\"M20 778L64 778\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"782\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 778L284 778\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"782\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 778L504 778\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"782\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 778L684 778\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"782\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 778L904 778\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"782\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the broker owns its topics and its subscriptions, and a topic owns its ring of messages. Plain arrow = references: a subscription points at a topic it does <i>not</i> own, because many subscriptions share one topic and stopping one must not close it. Dashed green = handed in. Dotted blue = notifies. <b>Where state lives:</b> the topic has the ring, the head and tail offsets and the one lock, and nothing else in the system writes an offset. A subscription has one cursor, plus a seek waiting to be applied, its thread, its state and its counters. The broker has the two maps and the thread pool, and no lock at all. A retry policy and a filter have no state, which is why one instance can serve every subscription. Notice what is <i>not</i> here: no queue anywhere, and no list of subscribers on the topic. A topic does not know who is reading it; the cursors do all the work, which is the whole design in one sentence.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does: read only those first for the shape, then the bodies for the mechanics. When you get to <code>Subscription.run()</code>, read the last two statements of the loop slowly, because they are the delivery guarantee. Each copy button copies that whole file for your IDE. Below Main.java, Extensions.java holds every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it. FailureTests.java holds seventy-five checks proving the claims of move 9; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS.</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.BooleanSupplier;\n\n/** A subscription&#x27;s life. ACTIVE is reading; PAUSED keeps the cursor but stops reading; STOPPED is finished. */\nenum SubState { ACTIVE, PAUSED, STOPPED }\n\n/** What the broker just did. A listener switches on this; a new case never changes the listener&#x27;s one method. */\nenum EventType { PUBLISHED, DELIVERED, RETRIED, DEAD_LETTERED, SKIPPED, FAST_FORWARDED }\n\n/** One thing that happened, handed to every listener outside every lock. A value, so it is safe to share. */\nrecord Event(EventType type, String topic, long offset, String subscriptionId, int attempts, long atMs) {}\n\n/**\n * One published message. Immutable on purpose: ONE object sits in the topic&#x27;s log and is handed to twenty\n * handlers on twenty threads, with no copying and no chance that a bad handler changes what the next one sees.\n * The offset is the message&#x27;s position in its topic&#x27;s log and is assigned by the topic, never by the caller.\n */\nrecord Message(long offset, String topic, String key, String payload, Map&lt;String, String&gt; headers, long atMs) {\n    /** Defensive copy of the headers, so the map the publisher kept cannot be edited under a handler&#x27;s feet. */\n    Message { headers = headers == null ? Map.of() : Map.copyOf(headers); }\n    /** Short form for logs and demos: topic@offset[key] payload. */\n    @Override public String toString() { return topic + &quot;@&quot; + offset + (key == null ? &quot;&quot; : &quot;[&quot; + key + &quot;]&quot;) + &quot; &quot; + payload; }\n}\n\n/** A message a subscription gave up on: what it was, who failed, after how many tries, and why. Parked, not dropped. */\nrecord Dead(Message message, String subscriptionId, int attempts, String reason, long atMs) {}\n\n/**\n * Where time comes from, in both senses: what time is it, and how to wait. Injected, so a test can stamp a\n * message with any instant and run a five-minute backoff schedule in no time at all.\n */\ninterface Clock {\n    /** Wall clock, milliseconds. The only place in this file that knows what &quot;now&quot; means. */\n    long nowMs();\n    /** Wait this long. A test&#x27;s clock records what it was asked for and returns at once. */\n    default void sleepMs(long ms) throws InterruptedException { if (ms &gt; 0) Thread.sleep(ms); }\n}\n\n// &quot;a handler will fail, and &#x27;I failed&#x27; must differ from &#x27;done&#x27;&quot; -&gt; let onMessage throw -&gt; the retry rule has something to read\n/**\n * The subscriber&#x27;s business code. It is ALLOWED to throw, and that is the whole contract: if a failure were\n * swallowed, retry, dead-lettering and every delivery guarantee would be impossible to express. One method, so\n * a handler can be a lambda.\n */\ninterface Handler {\n    /** Handle one message. Returning normally means &quot;done, commit it&quot;; throwing means &quot;I failed, retry me&quot;. */\n    void onMessage(Message m) throws Exception;\n}\n\n/** Should this subscription see this message at all? One method, so a filter is a lambda. */\ninterface Filter {\n    /** True if the subscription should be given this message; false means skip it and move the cursor on. */\n    boolean accepts(Message m);\n    /** The default: everybody sees everything, which is what fan-out means. */\n    static Filter all() { return m -&gt; true; }\n}\n\n// &quot;a flat 20ms retry hammers a struggling downstream&quot; is a rule that WILL change mid-round -&gt; put it behind an interface -&gt; Strategy\n/**\n * &quot;Again, and how long do I wait?&quot; \u2014 the whole retry rule in one method. A negative answer means give up: park\n * the message in the dead-letter sink and move the cursor on. The failure is passed in so a policy can tell a\n * timeout from a malformed payload without ever changing this signature.\n */\ninterface RetryPolicy {\n    /** Milliseconds to wait before attempt+1, or any negative number meaning &quot;stop trying&quot;. */\n    long backoffMs(int attempt, Exception failure);\n}\n\n/** Where a message goes when the retry policy gives up. One method, because today it is a list and tomorrow a topic. */\ninterface DeadLetterSink {\n    /** Park a message nobody could process. Must not throw; must not block the dispatcher for long. */\n    void park(Dead d);\n}\n\n// &quot;the others must be told&quot; must not sit inside the offset arithmetic -&gt; announce after the unlock -&gt; Observer\n/** Anyone who wants to hear what the broker did: metrics, a lag alarm, a trace. Called outside every lock. */\ninterface BrokerListener {\n    /** One event. A listener that throws is logged and ignored; it can never break a publish or a delivery. */\n    void onEvent(Event e);\n}\n\n/** Wait the same amount every time, and give up after n attempts. The rule you start with; rarely the one you ship. */\nfinal class FixedDelayRetry implements RetryPolicy {\n    private final int maxAttempts; private final long delayMs;\n    FixedDelayRetry(int maxAttempts, long delayMs) { this.maxAttempts = maxAttempts; this.delayMs = delayMs; }\n    public long backoffMs(int attempt, Exception failure) { return attempt &gt;= maxAttempts ? -1 : delayMs; }\n}\n\n/**\n * Double the wait each time up to a cap, so a struggling downstream is not hammered: 10, 20, 40, 80 ... capped.\n * A new class, not an edit: nothing inside Topic, Subscription or Broker moved to make this exist.\n */\nfinal class ExponentialBackoff implements RetryPolicy {\n    private final int maxAttempts; private final long baseMs, capMs;\n    ExponentialBackoff(int maxAttempts, long baseMs, long capMs) { this.maxAttempts = maxAttempts; this.baseMs = baseMs; this.capMs = capMs; }\n    public long backoffMs(int attempt, Exception failure) {\n        if (attempt &gt;= maxAttempts) return -1;\n        return Math.min(capMs, baseMs &lt;&lt; Math.min(attempt - 1, 30));    // 1 -&gt; base, 2 -&gt; 2x base, 3 -&gt; 4x base ...\n    }\n}\n\n// the invariant &quot;a subscription always makes progress&quot; must hold for policies that do not exist yet -&gt; wrap every policy -&gt; Decorator\n/**\n * Wraps ANY retry policy and enforces the one thing a subscription cannot live without: progress. No policy,\n * not even one written next year that forgets to give up or throws, may run past maxAttempts or sleep longer\n * than maxBackoffMs. The broker wraps every policy it is handed, so this is not an option a caller can forget.\n */\nfinal class BoundedRetry implements RetryPolicy {\n    private final RetryPolicy base; private final int maxAttempts; private final long maxBackoffMs;\n    BoundedRetry(RetryPolicy base, int maxAttempts, long maxBackoffMs) {\n        this.base = base; this.maxAttempts = maxAttempts; this.maxBackoffMs = maxBackoffMs;\n    }\n    public long backoffMs(int attempt, Exception failure) {\n        if (attempt &gt;= maxAttempts) return -1;                          // the hard stop: park it and move on\n        long wait;\n        try { wait = base.backoffMs(attempt, failure); }\n        catch (RuntimeException brokenPolicy) { return -1; }            // a policy with a bug gives up; it never kills the reader\n        if (wait &lt; 0) return -1;                                        // the policy gave up first: respect it\n        return Math.min(wait, maxBackoffMs);\n    }\n}\n\n/** The default sink: keep them in a list a human or a test can read. A real one writes to a topic or a table. */\nfinal class InMemoryDeadLetters implements DeadLetterSink {\n    private final List&lt;Dead&gt; parked = Collections.synchronizedList(new ArrayList&lt;&gt;());   // O(1) append\n    public void park(Dead d) { parked.add(d); }\n    /** Everything parked so far, oldest first. */\n    List&lt;Dead&gt; all() { return List.copyOf(parked); }\n    /** How many messages nobody could process. The number that should be on a dashboard. */\n    int size() { return parked.size(); }\n}\n\n/**\n * The aggregate root: one topic is a ring of messages plus ONE lock. The ring is a fixed array used in a circle:\n * offset o lives in slot o % size, so a new message overwrites the one exactly `size` offsets older. Offsets\n * must never be duplicated or skipped, and this is the only class that assigns them. What the ring overwrote\n * is counted, not hidden. Two different topics never wait for each other, because the lock is per topic.\n */\nfinal class Topic {\n    private final String name;\n    private final Message[] ring;                                       // offset o is in slot o % ring.length; guarded by lock\n    private long head = 0;                                              // the oldest offset still in the ring; guarded by lock\n    private long lastAtMs = Long.MIN_VALUE;                             // the newest timestamp so far; guarded by lock\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Condition appended = lock.newCondition();\n    // The two numbers a dashboard asks for a thousand times a second, rewritten inside the lock and read outside it.\n    // volatile: a reader on any thread sees the latest write without taking the lock. One message stale is harmless.\n    private volatile long tail = 0;                                     // the offset the NEXT message will get\n    private volatile long earliest = 0;                                 // = head, for readers that take no lock\n\n    Topic(String name, int capacity) {\n        if (capacity &lt; 1) throw new IllegalArgumentException(&quot;retention must be at least one message&quot;);\n        this.name = name; this.ring = new Message[capacity];\n    }\n    /** The topic&#x27;s name, which is the only thing a publisher needs to know. */\n    String name() { return name; }\n\n    /**\n     * The critical step, and the reason this class has a lock. Assigning an offset and storing at it are TWO\n     * operations: two publishers that both read tail = 7 would both write slot 7, and one message would vanish.\n     * Here both happen as one step. On a full ring the store overwrites the oldest message and head moves up by\n     * one: O(1), nothing is copied. The waiting dispatchers are signalled before the lock is released: the signal\n     * must happen under the same lock they check under, or it lands between their check and their wait and is lost.\n     */\n    Message append(String key, String payload, Map&lt;String, String&gt; headers, long atMs) {\n        Map&lt;String, String&gt; h = headers == null ? Map.of() : Map.copyOf(headers);   // copied before the lock, not inside it\n        lock.lock();\n        try {\n            long off = tail;\n            lastAtMs = Math.max(lastAtMs, atMs);                        // a clock that steps back never reorders the log\n            Message m = new Message(off, name, key, payload, h, lastAtMs);\n            ring[(int) (off % ring.length)] = m;                        // on a full ring this overwrites offset off - size ...\n            if (off - head == ring.length) head++;                      // ... which is now gone, and counted\n            tail = off + 1; earliest = head;                            // republish the two numbers readers poll\n            appended.signalAll();\n            return m;\n        } finally { lock.unlock(); }\n    }\n\n    /** The message at this offset, or null if it has not been published yet or the ring has overwritten it. O(1). */\n    Message readAt(long offset) { lock.lock(); try { return at(offset); } finally { lock.unlock(); } }\n    private Message at(long offset) {                                   // lock must be held\n        return (offset &lt; head || offset &gt;= tail) ? null : ring[(int) (offset % ring.length)];\n    }\n    /** The offset the NEXT message will be given. tail minus a cursor is that subscriber&#x27;s lag. One volatile read: no lock. */\n    long tailOffset() { return tail; }\n    /** The oldest offset still in the ring. A cursor below this has fallen off the back. One volatile read: no lock. */\n    long earliestOffset() { return earliest; }\n    /** An offset pulled inside what exists: not below the oldest message still held, not past the next one to come. */\n    long clamp(long offset) { return Math.max(earliest, Math.min(offset, tail)); }\n    /** How many messages the ring holds when it is full: the retention, in messages. */\n    int capacity() { return ring.length; }\n    /** How many messages the ring has overwritten. Counted, not hidden: visible loss beats invisible loss. */\n    long droppedCount() { return earliest; }\n    /** How many messages are in the ring right now. */\n    int retained() { lock.lock(); try { return (int) (tail - head); } finally { lock.unlock(); } }\n\n    /**\n     * Wait for the message at this offset, up to a timeout. The check and the wait are inside ONE lock, the same\n     * lock the publisher signals under, and inside a `while`. That makes a lost wakeup impossible and a spurious\n     * one (a wake-up with no signal, which Java allows) harmless. Returns null on timeout, or when the ring has\n     * already overwritten the offset. An interrupt is passed on, never swallowed: it means &quot;stop&quot;.\n     */\n    Message awaitAt(long offset, long timeoutMs) throws InterruptedException {\n        lock.lock();\n        try {\n            long left = TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n            while (true) {\n                if (offset &lt; head) return null;                         // overwritten before we read it; the caller fast-forwards\n                Message m = at(offset);\n                if (m != null) return m;\n                if (left &lt;= 0) return null;\n                left = appended.awaitNanos(left);\n            }\n        } finally { lock.unlock(); }\n    }\n}\n\n// &quot;the knobs are about to multiply&quot; -&gt; five optional settings on one call -&gt; Builder, and here it genuinely earns its place\n/**\n * The optional settings on a subscription: where to start, what to retry with, where to park failures, and what\n * to filter out. Every one is optional, which is exactly when a builder beats a five-argument constructor:\n * `opts().fromEarliest().retry(new ExponentialBackoff(5, 10, 1000)).filter(m -&gt; &quot;IN&quot;.equals(m.key()))`.\n */\nfinal class SubscribeOptions {\n    RetryPolicy retry; DeadLetterSink sink; Filter filter = Filter.all();\n    long startAt = -1; boolean earliest = false;\n    /** Start a fresh set of options. Nothing is required. */\n    static SubscribeOptions opts() { return new SubscribeOptions(); }\n    /** Use this retry rule instead of the broker&#x27;s default. It is still wrapped in BoundedRetry. */\n    SubscribeOptions retry(RetryPolicy r) { this.retry = r; return this; }\n    /** Park this subscription&#x27;s failures somewhere of its own. */\n    SubscribeOptions deadLetters(DeadLetterSink s) { this.sink = s; return this; }\n    /** Only see the messages this predicate accepts; the rest advance the cursor without a handler call. */\n    SubscribeOptions filter(Filter f) { this.filter = f; return this; }\n    /** Replay everything still retained, instead of starting at the end of the log. */\n    SubscribeOptions fromEarliest() { this.earliest = true; return this; }\n    /** Start at an exact offset \u2014 what a restarted consumer that saved its cursor does. */\n    SubscribeOptions fromOffset(long offset) { this.startAt = offset; return this; }\n}\n\n/**\n * One subscriber&#x27;s read position, and the single thread that drives it. This is the class that makes fan-out\n * cheap in memory: three subscribers are three longs pointing into one log, not three copies of every message.\n * One thread per subscription is also what gives each subscriber the topic&#x27;s order for free, and what keeps a\n * slow or throwing handler from delaying anybody but itself.\n */\nfinal class Subscription implements Runnable {\n    private static final long POLL_MS = 50;                             // how long a dispatcher waits before re-checking its state\n\n    private final String id;\n    private final Topic topic;\n    private final Handler handler;\n    private final RetryPolicy retry;\n    private final DeadLetterSink sink;\n    private final Filter filter;\n    private final Clock clock;\n    private final BrokerListener events;\n    private final AtomicLong cursor;                                    // the next offset to read; written only by the dispatcher\n    private final AtomicLong seekTo = new AtomicLong(-1);               // a seek another thread asked for; -1 = none\n    private final AtomicLong delivered = new AtomicLong(), deadLettered = new AtomicLong();\n    private final AtomicLong skipped = new AtomicLong(), missed = new AtomicLong(), retried = new AtomicLong();\n    private volatile SubState state = SubState.ACTIVE;                  // changed only under the gate\n    private volatile boolean running;                                   // true while the dispatch loop is executing\n    private Thread worker;                                              // the thread running the loop; guarded by gate\n    private final ReentrantLock gate = new ReentrantLock();             // for the life cycle only, never for the log\n    private final Condition resumed = gate.newCondition();\n\n    Subscription(String id, Topic topic, Handler handler, long startOffset, RetryPolicy retry,\n                 DeadLetterSink sink, Filter filter, Clock clock, BrokerListener events) {\n        this.id = id; this.topic = topic; this.handler = handler; this.retry = retry; this.sink = sink;\n        this.filter = filter; this.clock = clock; this.events = events; this.cursor = new AtomicLong(startOffset);\n    }\n\n    /**\n     * The dispatch loop, and the whole delivery guarantee is the order of its last two statements. Read at the\n     * cursor; hand the message over with NO lock held; and only when the handler has returned, or the policy has\n     * given up and the message is parked, move the cursor on. Commit after delivery means a stop in the middle\n     * hands that message out again: at-least-once, so handlers must be idempotent. Moving the increment above\n     * the handler call would flip this to at-most-once: that is the whole difference, one line.\n     */\n    public void run() {\n        gate.lock();\n        try { worker = Thread.currentThread(); running = true; } finally { gate.unlock(); }\n        try {\n            while (state != SubState.STOPPED) {\n                if (state == SubState.PAUSED) { awaitResume(); continue; }\n                long seek = seekTo.getAndSet(-1);\n                if (seek &gt;= 0) cursor.set(topic.clamp(seek));           // a replay or a skip that another thread asked for\n                long at = cursor.get();\n                long earliest = topic.earliestOffset();\n                if (at &lt; earliest) {                                    // the ring overwrote what we had not read: skip, and COUNT it\n                    missed.addAndGet(earliest - at);\n                    cursor.set(earliest);\n                    events.onEvent(new Event(EventType.FAST_FORWARDED, topic.name(), earliest, id, 0, clock.nowMs()));\n                    continue;\n                }\n                Message m = topic.awaitAt(at, POLL_MS);\n                if (m == null || state != SubState.ACTIVE) continue;    // nothing yet, or paused while we waited: leave it\n                if (!deliver(m)) break;                                 // stopped mid-delivery: commit nothing, it comes back\n                cursor.incrementAndGet();                               // THE line: commit only AFTER the handler is done with it\n            }\n        } catch (InterruptedException e) {\n            Thread.currentThread().interrupt();                         // stop() woke us from a wait: nothing was in flight\n        } finally {\n            gate.lock();\n            try { state = SubState.STOPPED; running = false; worker = null; } finally { gate.unlock(); }\n        }\n    }\n\n    /**\n     * Hand one message to the filter and the handler, outside every lock, and survive either one throwing.\n     * Returns true when the message is finished with: skipped, handled, or given up on and parked. That is the\n     * only time the caller may commit. Returns false when stop() came first: the handler was interrupted, or\n     * the stop arrived while it was failing. That message goes to whoever reads from this cursor next.\n     */\n    private boolean deliver(Message m) {\n        for (int attempt = 1; ; attempt++) {\n            try {\n                if (!filter.accepts(m)) {                               // not ours: no handler call, but the cursor still moves\n                    skipped.incrementAndGet();\n                    events.onEvent(new Event(EventType.SKIPPED, topic.name(), m.offset(), id, 0, clock.nowMs()));\n                    return true;\n                }\n                handler.onMessage(m);                                   // user code: no lock of ours is held here\n                delivered.incrementAndGet();\n                events.onEvent(new Event(EventType.DELIVERED, topic.name(), m.offset(), id, attempt, clock.nowMs()));\n                return true;\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();\n                return false;                                           // stop() interrupted the handler: do NOT commit\n            } catch (Exception e) {                                     // not Throwable: an OutOfMemoryError must end the thread\n                if (state == SubState.STOPPED) return false;            // stopped while failing: no retry, no parking\n                long wait = retry.backoffMs(attempt, e);                // a throwing filter lands here too, like a handler\n                if (wait &lt; 0) {                                         // the policy gave up: park it and MOVE ON\n                    sink.park(new Dead(m, id, attempt, e.toString(), clock.nowMs()));\n                    deadLettered.incrementAndGet();\n                    events.onEvent(new Event(EventType.DEAD_LETTERED, topic.name(), m.offset(), id, attempt, clock.nowMs()));\n                    return true;                                        // giving up must never stall the subscription\n                }\n                retried.incrementAndGet();\n                events.onEvent(new Event(EventType.RETRIED, topic.name(), m.offset(), id, attempt, clock.nowMs()));\n                try { clock.sleepMs(wait); }\n                catch (InterruptedException stop) { Thread.currentThread().interrupt(); return false; }   // stop() during the wait\n            }\n        }\n    }\n\n    /** Stop reading but keep the cursor. Takes effect before the next message; one already in the handler finishes. */\n    void pause() {\n        gate.lock();\n        try { if (state == SubState.ACTIVE) state = SubState.PAUSED; } finally { gate.unlock(); }\n    }\n    /** Start reading again from the kept cursor. */\n    void resume() {\n        gate.lock();\n        try { if (state == SubState.PAUSED) { state = SubState.ACTIVE; resumed.signalAll(); } } finally { gate.unlock(); }\n    }\n    /**\n     * End this subscription for good: STOPPED is final. A flag, a signal for a paused thread, and an interrupt,\n     * because the dispatcher may be waiting in awaitNanos or asleep in a backoff. All three happen under the gate,\n     * and run() clears `worker` under the same gate, so the interrupt can only reach this subscription&#x27;s own\n     * thread, never a pooled thread that has already moved on to another subscription.\n     */\n    void stop() {\n        gate.lock();\n        try {\n            state = SubState.STOPPED;\n            resumed.signalAll();\n            if (worker != null) worker.interrupt();\n        } finally { gate.unlock(); }\n    }\n    private void awaitResume() throws InterruptedException {\n        gate.lock();\n        try { while (state == SubState.PAUSED) resumed.await(); } finally { gate.unlock(); }\n    }\n\n    /** How far behind the end of the log this subscriber is: tail minus cursor. O(1), no scan of anything. */\n    long lag() { return Math.max(0, topic.tailOffset() - cursor.get()); }\n    /**\n     * Replay, or skip ahead. The request is one write to one long, and the dispatcher applies it before it reads\n     * the next message: a message already in the handler finishes first, and nothing is skipped. Clamped to what\n     * the ring still holds. No other subscriber notices, which is the whole argument for a cursor over a queue.\n     */\n    void seek(long offset) { seekTo.set(Math.max(0, offset)); }\n\n    /** The next offset this subscription will read. */\n    long offset() { return cursor.get(); }\n    String id() { return id; }\n    String topicName() { return topic.name(); }\n    SubState state() { return state; }\n    /**\n     * True while the dispatch loop is still executing. stop() sets the STATE to STOPPED at once, but the thread\n     * only leaves the loop when it wakes; this is how a test proves the interrupt actually landed and the pooled\n     * thread went back to the pool instead of sleeping out a sixty-second backoff.\n     */\n    boolean running() { return running; }\n    /** Messages the handler accepted. */\n    long delivered() { return delivered.get(); }\n    /** Messages the policy gave up on and the sink parked. */\n    long deadLettered() { return deadLettered.get(); }\n    /** Messages the filter rejected without calling the handler. */\n    long skipped() { return skipped.get(); }\n    /** Messages the ring overwrote before this subscriber reached them. The honest number. */\n    long missed() { return missed.get(); }\n    /** How many handler calls failed and were tried again. */\n    long retried() { return retried.get(); }\n}\n\n/**\n * The one type a caller ever touches. It owns the topics, the subscriptions and the dispatcher threads, and it\n * holds no lock of its own \u2014 the offsets are the topic&#x27;s business. A publisher names a topic and never a\n * subscriber, and a subscriber never hears about a publisher: that is what makes this pub/sub and not a method call.\n */\nfinal class Broker implements AutoCloseable {\n    /** No retry policy, whatever a caller hands in, may exceed these. See BoundedRetry. */\n    static final int MAX_ATTEMPTS = 20;\n    static final long MAX_BACKOFF_MS = 60_000;\n\n    private final Map&lt;String, Topic&gt; topics = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Subscription&gt; subs = new ConcurrentHashMap&lt;&gt;();\n    private final List&lt;BrokerListener&gt; listeners = new CopyOnWriteArrayList&lt;&gt;();\n    private final ExecutorService dispatchers = Executors.newCachedThreadPool(r -&gt; {\n        Thread t = new Thread(r, &quot;dispatcher&quot;);                          // daemons: a forgotten broker never holds the JVM open\n        t.setDaemon(true);\n        return t;\n    });\n    private final int retention;\n    private volatile RetryPolicy defaultRetry = new FixedDelayRetry(3, 10);   // volatile: set by one thread, read by all\n    private volatile DeadLetterSink defaultSink = new InMemoryDeadLetters();\n    private volatile Clock clock = System::currentTimeMillis;\n\n    /** A broker whose topics each keep the newest ten thousand messages. */\n    Broker() { this(10_000); }\n    /** A broker with an explicit retention, in messages per topic: the size of each topic&#x27;s ring. */\n    Broker(int retentionPerTopic) { this.retention = retentionPerTopic; }\n\n    /**\n     * Hand in the rules. The broker never builds a retry policy or a sink itself, and it never trusts one\n     * either: every policy is wrapped in BoundedRetry at subscribe time, so a rule that forgets to give up\n     * cannot make a subscription retry forever.\n     */\n    void configure(RetryPolicy retry, DeadLetterSink sink) {\n        this.defaultRetry = Objects.requireNonNull(retry);\n        this.defaultSink = Objects.requireNonNull(sink);\n    }\n    /** Tests hand in a clock so a message&#x27;s timestamp and a backoff schedule are whatever the test says. */\n    void setClock(Clock c) { this.clock = c; }\n    /** Subscribe a listener. Setup only; listeners are called outside every lock. */\n    void addListener(BrokerListener l) { listeners.add(l); }\n\n    /**\n     * Publish. The offset is assigned and the message stored as ONE step inside the topic&#x27;s lock; the listeners\n     * are told after the lock is released. This call never waits for a subscriber: a handler that takes two\n     * seconds makes its own subscription lag and nothing else. Returns the offset the message was given.\n     */\n    long publish(String topicName, String key, String payload) { return publish(topicName, key, payload, Map.of()); }\n\n    /** Publish with headers. Same critical step; the headers are copied into the immutable message. */\n    long publish(String topicName, String key, String payload, Map&lt;String, String&gt; headers) {\n        Topic t = topic(topicName);\n        Message m = t.append(key, payload, headers, clock.nowMs());     // the locked part: one append, microseconds\n        fire(new Event(EventType.PUBLISHED, topicName, m.offset(), null, 0, m.atMs()));\n        return m.offset();\n    }\n\n    /** The topic, created on first use. O(1). */\n    Topic topic(String name) { return topics.computeIfAbsent(name, n -&gt; new Topic(n, retention)); }\n\n    /** Subscribe with the defaults: start at the end of the log, the broker&#x27;s retry rule and sink, no filter. */\n    Subscription subscribe(String subId, String topicName, Handler h) {\n        return subscribe(subId, topicName, h, SubscribeOptions.opts());\n    }\n\n    /**\n     * Subscribe with options. The subscription is given its rules \u2014 never told to build them \u2014 and is started\n     * on its own dispatcher thread. The id must be free, so a double-subscribe is an error and not a silent\n     * second consumer.\n     */\n    Subscription subscribe(String subId, String topicName, Handler h, SubscribeOptions o) {\n        Topic t = topic(topicName);\n        long start = o.earliest ? t.earliestOffset() : t.tailOffset();\n        if (o.startAt &gt;= 0) start = t.clamp(o.startAt);                 // not below what the ring holds, not past its end\n        Subscription s = new Subscription(subId, t, h, start,\n            new BoundedRetry(o.retry == null ? defaultRetry : o.retry, MAX_ATTEMPTS, MAX_BACKOFF_MS),\n            o.sink == null ? defaultSink : o.sink, o.filter, clock, this::fire);\n        if (subs.putIfAbsent(subId, s) != null) throw new IllegalStateException(&quot;subscription id already in use: &quot; + subId);\n        dispatchers.execute(s);\n        return s;\n    }\n\n    /** End one subscription and free its thread. Returns false if there was no such subscription. */\n    boolean unsubscribe(String subId) {\n        Subscription s = subs.remove(subId);\n        if (s == null) return false;\n        s.stop();\n        return true;\n    }\n\n    /** The subscription, or an error. O(1). */\n    Subscription sub(String subId) {\n        Subscription s = subs.get(subId);\n        if (s == null) throw new NoSuchElementException(&quot;no such subscription: &quot; + subId);\n        return s;\n    }\n    /** How far behind a subscriber is. O(1): one subtraction, never a scan. */\n    long lag(String subId) { return sub(subId).lag(); }\n    /** Every subscription&#x27;s lag, for a dashboard. O(number of subscriptions), and nothing else. */\n    Map&lt;String, Long&gt; lagReport() {\n        Map&lt;String, Long&gt; out = new TreeMap&lt;&gt;();\n        subs.forEach((id, s) -&gt; out.put(id, s.lag()));\n        return out;\n    }\n    /**\n     * The oldest offset some subscriber of this topic still needs: the smallest cursor, or the tail if nobody reads\n     * the topic. O(number of subscriptions). Back-pressure asks this before it lets a publish overwrite anything.\n     */\n    long slowestCursor(String topicName) {\n        long min = topic(topicName).tailOffset();\n        for (Subscription s : subs.values()) if (s.topicName().equals(topicName)) min = Math.min(min, s.offset());\n        return min;\n    }\n    /** Who listens to this topic. A filter over the map; publishers never see this. */\n    List&lt;String&gt; subscribersOf(String topicName) {\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        subs.forEach((id, s) -&gt; { if (s.topicName().equals(topicName)) out.add(id); });\n        Collections.sort(out);\n        return out;\n    }\n    /** The topics that exist right now. */\n    Set&lt;String&gt; topicNames() { return new TreeSet&lt;&gt;(topics.keySet()); }\n\n    /** Tell every listener, outside every lock, and survive one that throws. */\n    private void fire(Event e) {\n        for (BrokerListener l : listeners) {\n            try { l.onEvent(e); } catch (RuntimeException ex) { System.err.println(&quot;[listener failed] &quot; + ex.getMessage()); }\n        }\n    }\n\n    /** Stop every subscription and end every dispatcher thread. Safe to call twice. */\n    @Override public void close() {\n        subs.values().forEach(Subscription::stop);\n        subs.clear();\n        dispatchers.shutdownNow();\n    }\n}\n\n/**\n * Proof it works: fan-out to three subscribers, a filter, a handler that fails and is retried, a message\n * nobody can process being parked, a late subscriber replaying history, pause and resume, and finally fifty\n * threads publishing into ONE topic at the same instant with every offset assigned exactly once.\n */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        Broker broker = new Broker(1_000);\n        InMemoryDeadLetters parked = new InMemoryDeadLetters();\n        broker.configure(new ExponentialBackoff(4, 5, 100), parked);\n        broker.addListener(e -&gt; {\n            if (e.type() == EventType.DEAD_LETTERED)\n                System.out.println(&quot;[alarm] gave up on &quot; + e.topic() + &quot;@&quot; + e.offset() + &quot; after &quot; + e.attempts() + &quot; attempts&quot;);\n        });\n\n        // three subscribers on one topic. Each gets every message, and each keeps its own place in the log.\n        List&lt;String&gt; audit = new CopyOnWriteArrayList&lt;&gt;();\n        List&lt;String&gt; email = new CopyOnWriteArrayList&lt;&gt;();\n        List&lt;String&gt; india = new CopyOnWriteArrayList&lt;&gt;();\n        broker.subscribe(&quot;audit&quot;, &quot;orders&quot;, m -&gt; audit.add(m.payload()));\n        broker.subscribe(&quot;email&quot;, &quot;orders&quot;, m -&gt; email.add(m.payload()));\n        broker.subscribe(&quot;india&quot;, &quot;orders&quot;, m -&gt; india.add(m.payload()),\n            SubscribeOptions.opts().filter(m -&gt; &quot;IN&quot;.equals(m.key())));   // the same log, a narrower view\n\n        for (int i = 1; i &lt;= 5; i++) broker.publish(&quot;orders&quot;, i % 2 == 0 ? &quot;IN&quot; : &quot;US&quot;, &quot;order-&quot; + i);\n        awaitUntil(() -&gt; audit.size() == 5 &amp;&amp; email.size() == 5 &amp;&amp; india.size() == 2, 2000);\n        System.out.println(&quot;fan-out: audit=&quot; + audit + &quot; email=&quot; + email.size() + &quot; india(filtered)=&quot; + india);\n        System.out.println(&quot;subscribers of orders: &quot; + broker.subscribersOf(&quot;orders&quot;) + &quot;  lag &quot; + broker.lagReport());\n\n        // a handler that fails twice and then works: retried per the policy, delivered once, nothing parked\n        AtomicInteger tries = new AtomicInteger();\n        List&lt;String&gt; flaky = new CopyOnWriteArrayList&lt;&gt;();\n        broker.subscribe(&quot;payments&quot;, &quot;orders&quot;, m -&gt; {\n            if (tries.incrementAndGet() &lt;= 2) throw new IllegalStateException(&quot;gateway timeout&quot;);\n            flaky.add(m.payload());\n        }, SubscribeOptions.opts().fromEarliest().retry(new ExponentialBackoff(5, 5, 50)));\n        awaitUntil(() -&gt; flaky.size() == 5, 2000);\n        System.out.println(&quot;flaky handler: &quot; + tries.get() + &quot; handler calls for 5 messages, delivered &quot;\n            + broker.sub(&quot;payments&quot;).delivered() + &quot;, retried &quot; + broker.sub(&quot;payments&quot;).retried());\n\n        // a message nobody can process: retried, then parked, and the subscription CARRIES ON\n        List&lt;String&gt; strict = new CopyOnWriteArrayList&lt;&gt;();\n        broker.subscribe(&quot;strict&quot;, &quot;orders&quot;, m -&gt; {\n            if (m.payload().equals(&quot;order-3&quot;)) throw new IllegalArgumentException(&quot;malformed payload&quot;);\n            strict.add(m.payload());\n        }, SubscribeOptions.opts().fromEarliest().retry(new FixedDelayRetry(3, 1)));\n        awaitUntil(() -&gt; strict.size() == 4, 2000);\n        System.out.println(&quot;poison message: delivered &quot; + strict + &quot;, parked &quot; + parked.size()\n            + &quot; (&quot; + parked.all().get(0).reason() + &quot; after &quot; + parked.all().get(0).attempts() + &quot; attempts)&quot;);\n\n        // a late subscriber replays what is still retained; nobody else notices\n        List&lt;String&gt; late = new CopyOnWriteArrayList&lt;&gt;();\n        broker.subscribe(&quot;late&quot;, &quot;orders&quot;, m -&gt; late.add(m.payload()), SubscribeOptions.opts().fromEarliest());\n        awaitUntil(() -&gt; late.size() == 5, 2000);\n        System.out.println(&quot;late subscriber replayed &quot; + late.size() + &quot; messages from offset &quot;\n            + broker.topic(&quot;orders&quot;).earliestOffset());\n\n        // pause keeps the cursor; resume picks up exactly where it stopped\n        Subscription auditSub = broker.sub(&quot;audit&quot;);\n        auditSub.pause();\n        broker.publish(&quot;orders&quot;, &quot;IN&quot;, &quot;order-6&quot;);\n        broker.publish(&quot;orders&quot;, &quot;US&quot;, &quot;order-7&quot;);\n        System.out.println(&quot;paused at offset &quot; + auditSub.offset() + &quot;, lag &quot; + auditSub.lag() + &quot;, audit still &quot; + audit.size());\n        auditSub.resume();\n        awaitUntil(() -&gt; audit.size() == 7, 2000);\n        System.out.println(&quot;resumed: audit=&quot; + audit.size() + &quot;, lag &quot; + auditSub.lag());\n\n        // unsubscribe ends one subscription; the others never notice\n        broker.unsubscribe(&quot;late&quot;);\n        System.out.println(&quot;after unsubscribe, subscribers of orders: &quot; + broker.subscribersOf(&quot;orders&quot;));\n\n        // -------------------------------------------------------------- fifty threads publish at the same instant\n        Broker race = new Broker(200_000);\n        race.configure(new FixedDelayRetry(3, 1), new InMemoryDeadLetters());\n        AtomicLong seen = new AtomicLong();\n        race.subscribe(&quot;counter&quot;, &quot;ticks&quot;, m -&gt; seen.incrementAndGet());\n        int threads = 50, each = 40;\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;List&lt;Long&gt;&gt;&gt; runs = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; threads; t++) {\n            final int me = t;\n            runs.add(pool.submit(() -&gt; {\n                go.await();\n                List&lt;Long&gt; mine = new ArrayList&lt;&gt;(each);\n                for (int k = 0; k &lt; each; k++) mine.add(race.publish(&quot;ticks&quot;, &quot;p&quot; + me, me + &quot;:&quot; + k));\n                return mine;                                             // the offsets THIS publisher was given\n            }));\n        }\n        go.countDown();\n        Set&lt;Long&gt; all = new HashSet&lt;&gt;();\n        boolean ordered = true;\n        for (Future&lt;List&lt;Long&gt;&gt; f : runs) {\n            List&lt;Long&gt; mine = f.get();\n            all.addAll(mine);\n            for (int k = 1; k &lt; mine.size(); k++) if (mine.get(k) &lt;= mine.get(k - 1)) ordered = false;\n        }\n        pool.shutdown();\n        int total = threads * each;\n        awaitUntil(() -&gt; seen.get() == total, 5000);\n        System.out.println(threads + &quot; publishers x &quot; + each + &quot;: distinct offsets=&quot; + all.size() + &quot;/&quot; + total\n            + &quot;, tail=&quot; + race.topic(&quot;ticks&quot;).tailOffset() + &quot;, per-publisher order kept=&quot; + ordered\n            + &quot;, one subscriber saw &quot; + seen.get());\n        if (all.size() != total || race.topic(&quot;ticks&quot;).tailOffset() != total || !ordered)\n            throw new AssertionError(&quot;an offset was duplicated or lost&quot;);\n        race.close();\n        broker.close();\n    }\n\n    /** Poll until a condition holds or the budget runs out. How a demo or a test waits for a dispatcher thread. */\n    static boolean awaitUntil(BooleanSupplier cond, long budgetMs) throws InterruptedException {\n        long deadline = System.currentTimeMillis() + budgetMs;\n        while (System.currentTimeMillis() &lt; deadline) {\n            if (cond.getAsBoolean()) return true;\n            Thread.sleep(2);\n        }\n        return cond.getAsBoolean();\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.io.*;\nimport java.nio.charset.StandardCharsets;\nimport java.nio.file.*;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: consumer groups -- competing consumers, where each message is handled by exactly ONE member\n/**\n * Fan-out gives every subscriber every message. A consumer group is the other shape: three workers share the\n * load and each message is handled once. It needs no new broker code at all \u2014 a group member is a normal\n * subscription with a filter that accepts only its own slice of the key space. Messages with the same key\n * always land on the same member, so per-key order survives.\n */\nfinal class ConsumerGroup {\n    /** Start `members` subscriptions on one topic, each taking one slice. Returns them so a caller can stop one. */\n    static List&lt;Subscription&gt; join(Broker broker, String groupId, String topic, int members, Handler handler) {\n        List&lt;Subscription&gt; out = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; members; i++) {\n            final int slot = i;\n            out.add(broker.subscribe(groupId + &quot;#&quot; + i, topic, handler,\n                SubscribeOptions.opts().fromEarliest().filter(m -&gt; slotOf(m, members) == slot)));\n        }\n        return out;\n    }\n    /** Which member owns this message: by key if there is one, else round-robin by offset. */\n    static int slotOf(Message m, int members) {\n        long h = m.key() == null ? m.offset() : (m.key().hashCode() &amp; 0x7fffffffL);\n        return (int) Math.floorMod(h, members);\n    }\n    // the honest price of doing it with filters: every member walks the whole log and skips 2 messages in 3.\n    // Kafka gives each member its OWN partition log instead, which is the partitions

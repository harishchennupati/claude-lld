<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design an in-process pub/sub system. Publishers post messages to named topics and subscribers get them without the two ever knowing about each other &mdash; many publishers, many subscribers, and a handler that is allowed to fail. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>One part of a program wants to announce that something happened: an order was placed, a file arrived. Other parts want to hear about it, and the announcer must not need to know who they are or how long they take. Messages go to a named <b>topic</b>; anybody can subscribe to a topic and is then handed every message published to it, in order. A subscriber can be slow, can start an hour late, can crash and come back, and can fail on one particular message. None of that may hurt the publisher or any other subscriber. The thing that must always be true is about <b>offsets</b>. Every message gets a position, its offset, in its topic's log: the list of messages that is only ever appended to. Offsets are handed out one at a time, with no duplicate and no gap. A subscriber's cursor (its read position) never moves past a message its handler was not given. Everything else hangs off that one decision: retries, dead letters (messages given up on and parked), replay, and lag (how far behind a subscriber is).</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that publishes, fans out to several subscribers and survives a handler that throws. The interviewer is watching for, in this order: the questions you ask before typing; which classes exist and which one owns the log; a publish and a delivery end to end; what happens when two threads publish at the same instant; where the rule that will change (how to retry) lives, so a new one is a class and not an edit; and what the cursor does when a handler fails. The first three questions are fan-out (every subscriber gets every message) or competing consumers (each message goes to one worker), push or pull, and at-most-once or at-least-once. At-most-once means a message is never handled twice, but can be lost. At-least-once means it is never lost, but can be handled twice, so the handler must be idempotent: handling a message twice has the same effect as handling it once. Then the twists: consumer groups (workers that share one stream of messages), consumers that pull, a consumer that is down for an hour, dead-letter topics, back-pressure (making publishers wait when readers fall behind), persistence, and \"so how is this different from Kafka?\"</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 382\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"78\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">publish</text><g transform=\"translate(165 30)\"><rect width=\"242\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a thread calls publish</text><text x=\"121.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">topic, key, payload</text></g><path d=\"M407 57 H427\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(427 30)\"><rect width=\"242\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take the topic's lock</text><text x=\"121.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">offset = tail</text></g><path d=\"M669 57 H689\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(689 30)\"><rect width=\"242\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">store in the ring, signal</text><text x=\"121.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one step: nobody else is inside</text></g><path d=\"M931 57 H951\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(951 30)\"><rect width=\"242\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">unlock, then tell listeners</text><text x=\"121.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a slow listener stalls nobody</text></g><text x=\"78\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">deliver</text><g transform=\"translate(165 165)\"><rect width=\"242\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one thread per subscriber</text><text x=\"121.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads at its own cursor</text></g><path d=\"M407 192 H427\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(427 165)\"><rect width=\"242\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">run the handler, no lock held</text><text x=\"121.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">it is allowed to throw</text></g><path d=\"M669 192 H689\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(689 165)\"><rect width=\"242\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry, then park if hopeless</text><text x=\"121.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the policy decides, not the broker</text></g><path d=\"M931 192 H951\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(951 165)\"><rect width=\"242\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">only now: cursor + 1</text><text x=\"121.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">commit AFTER the handler</text></g><path d=\"M600.0 84 V95\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 95)\"><rect width=\"340\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"170.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a publish never waits for a subscriber</text></g><path d=\"M615.0 219 V230\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(395 230)\"><rect width=\"440\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"220.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">still failing: parked, and the cursor moves on</text></g><text x=\"78\" y=\"300\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"165\" y=\"300\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, without touching a message: how far behind is this subscriber?   what is at offset 91,204?   who listens to orders?</text><text x=\"78\" y=\"332\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">stop</text><text x=\"165\" y=\"332\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">unsubscribe(id): interrupt the thread wherever it is parked, commit nothing that was in flight, let a replacement read it again</text><text x=\"615\" y=\"366\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">fifty publishers at the same instant: every offset is handed out exactly once, and no cursor skips a message that was never given to its handler</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Fan-out, or competing consumers: does everyone get every message, or does each message go to one worker?</td><td>Fan-out; groups are a follow-up</td><td>A cursor per subscriber, not a queue per subscriber (moves 1, 5)</td></tr><tr><td>Push or pull: do we call each subscriber's handler, or does the subscriber call consume() and then ack()?</td><td>Push, one thread per subscriber; pull is follow-up 10 (Razorpay's version)</td><td>Who runs the read loop: Subscription.run(), or the consumer itself (moves 2, 6)</td></tr><tr><td>At-most-once or at-least-once? It is one line, so let us pick it on purpose.</td><td>At-least-once; handlers are idempotent</td><td>Where <code>cursor + 1</code> sits relative to the handler call (move 6)</td></tr><tr><td>Does a late subscriber see history? May a message be dropped before a slow subscriber has read it?</td><td>Yes, what the ring still holds; a drop is counted (Razorpay says never drop: follow-up 7)</td><td>A ring per topic (a fixed array used in a circle: the newest message overwrites the oldest), not delete-on-read (moves 5, 6)</td></tr><tr><td>Must a subscriber see one topic's messages in order?</td><td>Yes, per topic per subscriber</td><td>One dispatcher thread (the thread that reads for one subscriber) per subscription (moves 4, 7)</td></tr><tr><td>What happens to a message that can never be processed: drop, block, or park?</td><td>Retry a few times, then park it</td><td>A retry rule and a dead-letter sink, both handed in (move 3)</td></tr><tr><td>How many publishers at once, and how many subscribers per topic?</td><td>Tens of threads, tens of subscribers</td><td>One lock per topic is enough; the ladder is named, not climbed (moves 4, 8)</td></tr><tr><td>Does anything survive a restart?</td><td>No: one process, in memory</td><td>No store yet; a follow-up slots one in behind an interface (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>A broker holds named topics; anybody can publish to one without knowing who is listening.</li>\n<li>Many subscribers per topic, and every one of them gets every message: fan-out.</li>\n<li>Each subscriber keeps its own read position (its cursor), so a slow one falls behind instead of blocking anyone.</li>\n<li>A late subscriber can start at the end, or replay whatever history the topic still holds.</li>\n<li>A handler is allowed to fail: retry it by a rule, and park what can never work.</li>\n<li>Pause, resume, seek, unsubscribe, and report how far behind each subscriber is.</li>\n<li>A subscription can carry a filter, so it sees a slice of the topic and skips the rest.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Many publishers at once: no offset duplicated, none skipped, and each publisher's own order kept.</li>\n<li>Publish is O(1) and read-by-offset is O(1); lag is one subtraction, never a scan.</li>\n<li>Per-subscriber order: a subscriber sees a topic's messages in the order they were published.</li>\n<li>One slow or throwing handler stalls no publisher and no other subscriber.</li>\n<li>Bounded memory per topic: a ring of fixed size, and what it overwrites is counted, not hidden.</li>\n<li>Retry rule, dead-letter destination and time are all swappable without touching the log.</li>\n<li>In memory, one process, nothing survives a restart (say it; a follow-up adds a store).</li></ul></div></div>\n<div class=\"move\"><h3>One morning, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"258\" height=\"128\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"129.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:00:00.000  the burst</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">50 threads publish 2,000 orders</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">offsets 0 .. 1999, none issued twice</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">tail = 2000; the ring holds all 2,000</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">no publisher waited for a subscriber</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"258\" height=\"128\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"129.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:00:00.004  three readers</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">audit at 2000, email at 2000</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">fraud at 1412: it is 588 behind</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one log, three cursors</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">not three copies of anything</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"258\" height=\"128\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"129.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:03:11  fraud's handler throws</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">waits 10 ms, 20 ms, 40 ms, gives up</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">orders@1584 parked, with the reason</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">cursor moves to 1585 anyway</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">giving up must not stall a reader</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"258\" height=\"128\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"129.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:40:00  fraud restarts</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">resumes at the offset it committed</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the ring overwrote 400 under it</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">skips ahead, and 400 is COUNTED</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">a loss you can see, not a silent one</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> push, fan-out, at-least-once, so handlers must be idempotent. One log per topic, a ring of fixed size, with a cursor per subscriber rather than a queue per subscriber; what the ring overwrites is counted. One thread per subscription, so each subscriber gets the topic's order for free. In memory, one process. Named as out of scope: consumer groups, consumers that pull, a guarantee for a consumer that is down, persistence, exactly-once &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, elevator, BookMyShow) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On this problem one decision carries everything: one append-only log per topic with a cursor per subscriber, instead of a queue per subscriber. Get that in move 5 and replay, late joiners, lag and cheap fan-out are all free; get it wrong and no amount of later cleverness buys them back.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a PUBLISHER puts a MESSAGE on a TOPIC; a SUBSCRIPTION reads it at its own OFFSET and hands it to a HANDLER; a RETRY RULE decides what happens when it fails</text><g transform=\"translate(30 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Message</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">immutable: a record</text></g><path d=\"M117.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(220 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Topic</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">log, offsets, one lock</text></g><path d=\"M312.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 110)\"><rect width=\"200\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Subscription</text><text x=\"100.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">cursor, thread, state</text></g><path d=\"M520.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(635 110)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Broker</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the maps, the threads</text></g><path d=\"M717.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(815 110)\"><rect width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"75.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Handler</text><text x=\"75.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M890.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(980 110)\"><rect width=\"105\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"52.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Publisher</text><text x=\"52.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a caller</text></g><path d=\"M1032.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1100 110)\"><rect width=\"110\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"55.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Lag</text><text x=\"55.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a question</text></g><path d=\"M1155.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a caller, an interface, or a number a method computes</text></svg></div><div class=\"move\"><p>Reading the paragraph again: a <b>publisher</b> puts a <b>message</b> on a <b>topic</b>; a <b>subscription</b> reads it at its own <b>offset</b> and hands it to a <b>handler</b>; a <b>retry rule</b> decides what happens when the handler fails. A topic has a log, a next offset and a lock, all of which change: a class, and the one that matters. A subscription has a cursor, a thread and a state: a class. A message never changes once published, so it is a record. It must be immutable for a real reason, not for tidiness: one object sits in the log and is handed to twenty handlers on twenty threads at once. A broker has the map of topics and the map of subscriptions: a class. A handler has no state at all, so it is an interface. A publisher is not a class here; it is whoever calls <code>publish</code>. And an offset is not a class either: it is a long, on the message and on the cursor.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 22)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">give a message its position</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 44 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 22)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Topic  (owns the log and the offsets)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 44 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 22)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">topic.append(key, payload, ...)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 76)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">remember how far I have read</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 98 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 76)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Subscription  (owns one cursor)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 98 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 76)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cursor.incrementAndGet()</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 130)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hand it over and survive a throw</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 152 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 130)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Subscription  (owns the thread too)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 152 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 130)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">deliver(m): boolean</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 184)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">find the topic, start the thread</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 206 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 184)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Broker  (owns the maps)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 206 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 184)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">broker.publish / subscribe</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"258\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and notice the verb that is NOT here: \"send it to everybody\". There is no fan-out loop and no copying:</text><text x=\"615\" y=\"277\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">fan-out is three subscriptions reading one log at three positions; a fourth adds a cursor and a thread, never a copy</text></svg></div><div class=\"move\"><p>The table is mechanical once the question is put the right way round: a verb goes to whoever owns the state it touches. Giving a message its position touches the log and the next offset, so it is the topic's. Remembering how far I have read touches one cursor, so it is the subscription's, and so is <code>deliver</code>, because whether that cursor moves is the whole question. What matters here is the verb that is <i>not</i> in the list: \"send it to everybody\". There is no fan-out loop anywhere in this design, and nothing is ever copied. Fan-out is three subscriptions reading one log at three different positions. A fourth subscriber adds one cursor and one thread, never another copy of the messages.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(24 76)\"><rect width=\"250\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Broker / Subscription</text><text x=\"125.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(...), SubscribeOptions</text></g><path d=\"M274 121 H330 V42 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 20)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Handler</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the subscriber's own code</text></g><g transform=\"translate(750 20)\"><rect width=\"450\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"225.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">any lambda:  m -> charge(m.payload())</text><text x=\"225.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">handed in, never built inside</text></g><path d=\"M750 42 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M274 121 H330 V100 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 78)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RetryPolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">again, and how long?</text></g><g transform=\"translate(750 78)\"><rect width=\"450\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"225.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FixedDelayRetry / ExponentialBackoff / NoRetryFor</text><text x=\"225.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">handed in, never built inside</text></g><path d=\"M750 100 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M274 121 H330 V158 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DeadLetterSink</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where a hopeless message goes</text></g><g transform=\"translate(750 136)\"><rect width=\"450\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"225.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">InMemoryDeadLetters, or a .dlq topic</text><text x=\"225.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">handed in, never built inside</text></g><path d=\"M750 158 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M274 121 H330 V216 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 194)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Filter / BrokerListener / Clock</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who sees what, who is told, the time</text></g><g transform=\"translate(750 194)\"><rect width=\"450\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"225.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a lambda each: they have one method</text><text x=\"225.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">handed in, never built inside</text></g><path d=\"M750 216 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed = handed in. The broker never writes new on a rule, so a new backoff is a new class and one changed line</text><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one rule wraps the others: BoundedRetry(policy) forces EVERY policy, including next year's, to give up eventually</text></svg></div><div class=\"move\"><p>How to retry will change. Twenty minutes in they will say: \"a flat twenty milliseconds hammers a struggling downstream; back off exponentially, and never retry a message that can never work\". Where a hopeless message goes will change: a list today, a dead-letter topic tomorrow. Who is told will change: metrics, a lag alarm, a trace, each one a listener. What a subscriber sees will change: a filter. Each becomes a one-method interface that the subscription is <i>given</i> and never builds. This is where the patterns come from, not the other way round. A swappable rule behind an interface is <b>Strategy</b>. A rule that wraps another rule and adds to it is <b>Decorator</b>. The one that matters here is <code>BoundedRetry</code>, which the broker wraps around every policy it is handed. So a rule written next year cannot retry a poison message (one that fails every time) forever. A broker that announces \"a message landed\" without knowing what a metrics system is, is <b>Observer</b>, and in this system Observer is the product itself. The names come later, in move 10; what matters here is that every rule is a separate object you can swap.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 242\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 26)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread A</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads tail = 7</text></g><g transform=\"translate(30 106)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread B</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads tail = 7</text></g><g transform=\"translate(350 66)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the ring</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">tail = 7</text></g><path d=\"M220 48 H350 V66\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M220 128 H350 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"285\" y=\"36\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"285\" y=\"156\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"580\" y=\"16\" width=\"300\" height=\"140\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"730\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"730\" y=\"66\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both write slot 7: one message</text><text x=\"730\" y=\"86\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">is lost, and nothing reports it:</text><text x=\"730\" y=\"106\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">offset 7 was handed out twice</text><text x=\"730\" y=\"136\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: assign AND store as ONE step</text><g transform=\"translate(910 40)\"><rect width=\"290\" height=\"96\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"42.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Topic.lock</text><text x=\"145.0\" y=\"58.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">assign, store, signal</text></g><text x=\"615\" y=\"186\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the second shared thing is the WAIT: a dispatcher that checks \"anything at offset 7?\", sees nothing and then sleeps can miss a</text><text x=\"615\" y=\"205\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">publish that lands in between. So the check and the wait sit inside the SAME lock the publisher signals under, in a while loop.</text><text x=\"615\" y=\"228\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">one lock per TOPIC, not per broker: ten thousand topics never wait for each other, and a handler is never inside it</text></svg></div><div class=\"move\"><p>Two threads publish at the same instant. Assigning an offset and storing at it are two operations: both read <code>tail</code> as 7, both write slot 7, and one message is simply gone. So the two operations happen as one step, inside a lock owned by the class that owns the log: the topic. The second shared thing is less obvious, and it is the one that separates a good answer from a great one: the <i>waiting</i>. A dispatcher asks \"is there anything at offset 7?\", sees nothing, and goes to sleep. A publish that lands between the question and the sleep is missed: a lost wakeup. So the check and the wait sit inside the same lock the publisher signals under, in a <code>while</code> loop. The loop also makes a spurious wakeup (a wake-up with no signal, which Java allows) harmless. The lock is per <i>topic</i>, and no handler, no retry and no listener is ever inside it.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 264\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"350\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is at offset 91,204?</text><text x=\"175.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 38 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 18)\"><rect width=\"560\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a ring: Message[],  slot = offset % size</text><text x=\"280.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M990 38 H1040\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1040 18)\"><rect width=\"160\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 66)\"><rect width=\"350\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how far behind is this subscriber?</text><text x=\"175.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 86 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 66)\"><rect width=\"560\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AtomicLong cursor, volatile tail;  lag = tail - cursor</text><text x=\"280.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M990 86 H1040\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1040 66)\"><rect width=\"160\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), no lock</text></g><g transform=\"translate(30 114)\"><rect width=\"350\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which subscription / which topic?</text><text x=\"175.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 134 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 114)\"><rect width=\"560\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ConcurrentHashMap by id</text><text x=\"280.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M990 134 H1040\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1040 114)\"><rect width=\"160\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 162)\"><rect width=\"350\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what did we give up on?</text><text x=\"175.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 182 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 162)\"><rect width=\"560\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an append-only list in the sink</text><text x=\"280.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M990 182 H1040\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1040 162)\"><rect width=\"160\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) append</text></g><text x=\"615\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and the shape that is WRONG here: a queue per subscriber. It copies every message N times, deletes on read, and with that</text><text x=\"615\" y=\"251\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">one choice you have thrown away replay, late joiners and any lag number. Cursor, not queue &mdash; everything else hangs off it.</text></svg></div><div class=\"move\"><p>\"What is at offset 91,204?\" is a ring: a fixed array used in a circle. Offset o sits in slot o % size (the remainder after dividing by the size), so finding a message is one step, O(1). A new message on a full ring simply overwrites the oldest one: no copying, ever. \"How far behind is this subscriber?\" is one AtomicLong per subscription, and lag is tail minus cursor: O(1), never a scan of anything. The tail needs one extra line of care. The topic keeps it in a <code>volatile long</code> (a field every thread reads fresh, without a lock) that <code>append</code> rewrites inside the lock. So a dashboard asking a thousand subscribers for their lag reads a field and never queues behind a publisher. \"Which subscription, which topic?\" are concurrent hash maps by id. \"What did we give up on?\" is an append-only list in the sink. But the shape worth arguing about is the one you do <i>not</i> pick: a queue per subscriber. It copies every message once per subscriber and deletes on read, and with that one choice you have thrown away replay, late joiners and any lag number for a dashboard. One log, N cursors: every other decision hangs off that one. The price is stated honestly: the ring has a fixed size, so a subscriber that falls too far behind loses messages, and the loss is counted.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 308\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(24 24)\"><rect width=\"178\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"89.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FETCHED</text><text x=\"89.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read under the lock</text></g><g transform=\"translate(242 24)\"><rect width=\"178\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"89.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DELIVERING</text><text x=\"89.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">lock released, handler runs</text></g><g transform=\"translate(24 112)\"><rect width=\"178\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"89.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ACKED</text><text x=\"89.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the handler returned</text></g><g transform=\"translate(242 112)\"><rect width=\"178\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"89.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RETRY WAIT</text><text x=\"89.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">sleep the backoff</text></g><g transform=\"translate(242 200)\"><rect width=\"178\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"89.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DEAD-LETTERED</text><text x=\"89.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the policy gave up</text></g><path d=\"M202 46 H242\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 68 V134 H202\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M380 68 V112\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M420 134 H444 V46 H424\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M331 156 V200\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"222\" y=\"272\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">ACKED and DEAD-LETTERED both lead to cursor + 1</text><rect x=\"460\" y=\"16\" width=\"750\" height=\"200\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"835\" y=\"40\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order at delivery, and why it is this order</text><text x=\"475\" y=\"64\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 read the message at the cursor -- the topic's lock is held only for this</text><text x=\"475\" y=\"86\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 release the lock; run the handler; it may take two seconds and it may throw</text><text x=\"475\" y=\"108\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 on a throw: ask the policy, wait, try again, or park it in the sink</text><text x=\"475\" y=\"130\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4 only now: cursor + 1.  The commit is the LAST statement</text><text x=\"475\" y=\"152\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a stop in the middle hands the message out again: at-least-once;</text><text x=\"475\" y=\"174\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">move the increment ABOVE the handler and it is at-most-once. That is the whole difference.</text><text x=\"835\" y=\"200\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and the subscription has a life too: ACTIVE &harr; PAUSED &rarr; STOPPED, and STOPPED is final</text><text x=\"615\" y=\"294\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">publishing has its own order: assign and store before signalling, and tell the listeners only after the unlock</text></svg></div><div class=\"move\"><p>One message's trip through one subscription starts FETCHED, under the topic's lock, and becomes DELIVERING once the lock is released. Then it is ACKED if the handler returns, or goes to RETRY WAIT and back to DELIVERING, or ends DEAD-LETTERED when the policy gives up. ACKED and DEAD-LETTERED both lead to the same place, <code>cursor + 1</code>. Giving up must never stall a subscription: a reader stuck forever on one bad message is the commonest bug in a hand-written bus. That gives the order. Read at the cursor, with the lock held only for the read. Release it. Run the handler, which may take two seconds and may throw. Retry or park. Only then move the cursor: that is the commit. The commit is the last statement, and that is the delivery guarantee written down. A stop in the middle hands the message out again, so this is at-least-once, and handlers must be idempotent. Move the increment above the handler call and you have at-most-once, which is the right choice for a metrics ping. One line, the whole difference: say which one you picked before you write the loop. The subscription has a life of its own too: ACTIVE to PAUSED and back, then STOPPED, which is final. Each change happens under the subscription's own small lock, so a late pause() cannot bring a stopped subscription back.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one topic's publishes happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 315\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"545\" height=\"152\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"272.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the topic's lock: about 0.3 microseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">read tail, build the message, store it in its slot</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">a full ring: that store overwrote the oldest; head + 1</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">republish tail and earliest</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">signalAll: each waiting subscriber is queued to wake</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">no loop over the log and no copy: the same cost at any size</text></g><path d=\"M575 96 H645\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"610\" y=\"86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(645 20)\"><rect width=\"555\" height=\"152\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"277.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside it: microseconds to seconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the handler: 50 us in process, up to 2 s over HTTP</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the retry backoff: 10 ms to a minute</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the listeners: after the unlock, in a try/catch</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the dead-letter write: a list today, a topic later</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">none of these can make a publisher wait</text></g><text x=\"615\" y=\"200\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">ten threads publish to the same topic at the same instant (20 subscribers; measured, median of 3,000 runs)</text><g transform=\"translate(30 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">done: 0.2 us</text></g><g transform=\"translate(148 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">done: 0.2 us</text></g><g transform=\"translate(266 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">done: 0.2 us</text></g><g transform=\"translate(384 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">done: 0.3 us</text></g><g transform=\"translate(502 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">done: 0.3 us</text></g><g transform=\"translate(620 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">done: 0.3 us</text></g><g transform=\"translate(738 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">done: 0.3 us</text></g><g transform=\"translate(856 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">done: 0.4 us</text></g><g transform=\"translate(974 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">done: 0.5 us</text></g><g transform=\"translate(1092 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">done: 1.0 us</text></g><text x=\"615\" y=\"283\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tenth usually finishes in about one microsecond. About one time in ten it had to sleep and be woken, which costs about 0.1 ms.</text><text x=\"615\" y=\"301\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">It never waits for a subscriber: no handler, no retry and no listener is ever inside the lock. One at a time is true, and nobody can tell.</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself: if every publish takes the topic's lock, is this a queue with extra steps? It is, for about a third of a microsecond. The left-hand card is everything that happens in there, and none of it is slow. There is no loop over the log and no copying, so the cost is the same at ten messages or ten million. The only part that grows is <code>signalAll</code>, which touches each waiting subscriber once. Everything slow is on the other side of the unlock: the handler, the backoff, the listeners. Measured with twenty subscribers, the tenth of ten simultaneous publishers usually finishes in about one microsecond. About one time in ten it has to sleep and be woken by the operating system, which costs about a tenth of a millisecond. It never waits for a subscriber at all, and that is the property publishers actually care about.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 254\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per topic: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a publish holds the lock ~0.3 us (20 subscribers, measured)</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">an order service: 2,000 publishes a second into one topic</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">that is 0.7 ms of lock in every second: 0.07% busy</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">even a 40,000/s burst is 13 ms a second: 1.3%</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">20 subscribers add 20 cursors and 20 threads, not 20 copies</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 partitions: N rings, N locks, key &rarr; partition</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">per-key order kept; total order across the topic is the price</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 claim the slot with compare-and-set</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the LMAX Disruptor shape: no lock at all, for millions a second</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 move the log out of the process</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">Kafka or Pulsar: when one machine's memory is not enough</text></g><text x=\"615\" y=\"222\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and a second ladder for the readers: one thread per subscription is fine to a few hundred; past that, a fixed pool of threads</text><text x=\"615\" y=\"241\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">that still runs each subscription's messages one at a time &mdash; and Subscription does not change: it was always a Runnable with a cursor</text></svg></div><div class=\"move\"><p>Say the number before you say the design. With twenty subscribers a publish holds the topic's lock for about a third of a microsecond (measured on a laptop). An order service publishing two thousand messages a second into one topic holds that lock for 0.7 milliseconds in every second: busy 0.07% of the time. Even a burst of forty thousand a second is 1.3%. The lock is per topic, so the number of topics does not matter. Memory is the other number to say out loud: ten thousand retained messages at about two hundred bytes is two megabytes per topic. Twenty subscribers add twenty cursors and twenty threads, not twenty copies. Only then the ladder, and notice how little each rung disturbs. Partitions (N rings behind one topic name, the message key picking the ring) change only which ring a key lands in. Per-key order is kept and total order across the topic is given up, which is exactly the trade Kafka makes. Claiming slots with compare-and-set (one CPU instruction that writes only if the value is still the one you read) drops the lock. It is worth it only at millions a second. Moving the log out of the process is the last rung, and that is Kafka. The readers have their own rung: a fixed pool of threads that still runs each subscription's messages one at a time. Subscription does not change for it, because it was always a Runnable with a cursor. Climbing either ladder without the arithmetic is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 370\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 16)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two threads publish at the same instant</text></g><path d=\"M350 34 H396\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(396 16)\"><rect width=\"804\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"402.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">assign and store as one locked step; test 1: 50 threads, 2,000 distinct offsets</text></g><g transform=\"translate(30 56)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a dispatcher sleeps through a publish</text></g><path d=\"M350 74 H396\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(396 56)\"><rect width=\"804\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)

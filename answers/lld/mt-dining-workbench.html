 fill=\"var(--text)\">p0</text><text x=\"50.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds fork 0</text></g><g transform=\"translate(990.7563644116826 120.26548483250778)\"><rect width=\"100\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"50.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">p1</text><text x=\"50.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds fork 1</text></g><g transform=\"translate(936.9922173392861 285.7345151674922)\"><rect width=\"100\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"50.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">p2</text><text x=\"50.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds fork 2</text></g><g transform=\"translate(763.0077826607139 285.7345151674922)\"><rect width=\"100\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"50.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">p3</text><text x=\"50.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds fork 3</text></g><g transform=\"translate(709.2436355883173 120.26548483250781)\"><rect width=\"100\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"50.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">p4</text><text x=\"50.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds fork 4</text></g><text x=\"900\" y=\"175\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#ff6b6b\">a circular wait</text><text x=\"900\" y=\"193\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">every arrow points at</text><text x=\"900\" y=\"208\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">somebody who is also waiting</text><g transform=\"translate(30 292)\"><rect width=\"570\" height=\"68\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same five, one line changed</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">take the LOWER-NUMBERED fork first: p4 reaches for fork 0</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">before fork 4, so it never holds 4 while waiting for 0</text></g><text x=\"615\" y=\"374\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the shared state is the fork and its owner is itself: one lock per fork, never one lock for the table. The failure is a shape, not a lost update.</text><text x=\"615\" y=\"394\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">four things must be true at once for that ring: exclusive forks, hold-one-and-wait, no taking a fork back by force, and a cycle. Delete ONE and it cannot form.</text></svg></div><div class=\"move\"><p>On every other design the danger is two threads reading the same number and both writing it back. Here the fork is already a lock, so nothing can be lost; the danger is the opposite shape. Release five philosophers in the same instant with the obvious protocol and each one takes the fork on its left, which always succeeds, because there are five forks for five people. Then each reaches right, and every right-hand fork is in a neighbour's hand. Nobody is doing anything wrong, nobody can be blamed, and nobody ever moves again. Four conditions make that ring: forks are exclusive, a philosopher holds one while waiting for the next, nothing can take a fork back by force, and the waiting closes into a cycle. The first and the third are the problem statement &mdash; a fork really is exclusive, and you really cannot snatch one out of a hand &mdash; so there are exactly two answers, and every fix on this page is one of them. Delete the cycle: put a global order on the forks, or post a waiter so all five can never reach at once. Or delete hold-and-wait: never keep one fork while you wait for the other, which drop-and-retry does by handing the first one back and the wait/notify version on page 05 does by reserving both under a single lock. Saying which of the four your fix deletes is what makes an answer sound worked out rather than remembered.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 330\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"360\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which two forks are mine?</text><text x=\"180.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 36 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 18)\"><rect width=\"520\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">forks[i] and forks[(i+1) % n], an array</text><text x=\"260.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 36 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 18)\"><rect width=\"170\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), no map</text></g><g transform=\"translate(30 62)\"><rect width=\"360\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who is holding fork 3 right now?</text><text x=\"180.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 80 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 62)\"><rect width=\"520\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a volatile int owner on the fork</text><text x=\"260.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 80 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 62)\"><rect width=\"170\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) read</text></g><g transform=\"translate(30 106)\"><rect width=\"360\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is p2 waiting for?</text><text x=\"180.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 124 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 106)\"><rect width=\"520\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a volatile int waitingFor on the philosopher</text><text x=\"260.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 124 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 106)\"><rect width=\"170\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) read</text></g><g transform=\"translate(30 150)\"><rect width=\"360\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is there a ring anywhere?</text><text x=\"180.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 168 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 150)\"><rect width=\"520\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">walk the n edges those two fields make</text><text x=\"260.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 168 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 150)\"><rect width=\"170\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(n), off the path</text></g><g transform=\"translate(30 194)\"><rect width=\"360\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many meals has p4 had?</text><text x=\"180.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 212 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 194)\"><rect width=\"520\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a long written only by p4's own thread</text><text x=\"260.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 212 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 194)\"><rect width=\"170\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), no contention</text></g><g transform=\"translate(30 238)\"><rect width=\"360\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">may I even sit down? (the waiter)</text><text x=\"180.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 256 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 238)\"><rect width=\"520\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Semaphore(n - 1)</text><text x=\"260.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 256 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 238)\"><rect width=\"170\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><text x=\"615\" y=\"296\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">nothing here is a map, because nothing here is looked up by a key: a ring of n is an array, and the neighbour of i is arithmetic</text><text x=\"615\" y=\"316\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">meals are counted in a field owned by one thread and read after join(), which is a happens-before edge: a shared counter would add contention to measure contention</text></svg></div><div class=\"move\"><p>There is not a single map in this design, because nothing is looked up by a key. \"Which forks are mine?\" is arithmetic: fork <i>i</i> and fork <i>(i+1) mod n</i> out of an array. \"Who is holding fork 3?\" is a volatile int on the fork, written the instant it is acquired. \"What is p2 waiting for?\" is a volatile int on the philosopher, written just before it blocks. Those two fields are the entire input to the detector: n edges, so finding a ring is one pass over an array, and it happens on a watchdog thread rather than in anybody's way. Meals are a plain <code>long</code> written only by its own thread and read after <code>join()</code>, which is a happens-before edge and needs no lock &mdash; a shared counter would have added contention to the very thing we are measuring.</p></div><div class=\"move\"><h3>Move 6: the life cycle is four states, and the order inside one round is what keeps a fork from being stranded.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 376\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 46)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">THINKING</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds nothing</text></g><path d=\"M195 69 H215\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(215 46)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">HUNGRY</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reaching, holds 0 or 1</text></g><path d=\"M380 69 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 46)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EATING</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds both</text></g><path d=\"M482 46 V22 H112 V46\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"297\" y=\"16\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">put both back, and round again</text><g transform=\"translate(400 150)\"><rect width=\"180\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DONE</text><text x=\"90.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">rounds are over</text></g><path d=\"M490 92 V150\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><rect x=\"620\" y=\"20\" width=\"590\" height=\"190\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"915\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside one round, and why it is this order</text><text x=\"635\" y=\"68\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 think, then say HUNGRY -- holding nothing, so nobody is blocked by you</text><text x=\"635\" y=\"89\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 ask the POLICY for both forks: it returns with both, or with none</text><text x=\"635\" y=\"110\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 only now say EATING and eat: the meal is counted after it happened</text><text x=\"635\" y=\"131\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4 a finally puts both forks back, whatever happened while eating</text><text x=\"635\" y=\"152\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5 say THINKING, then tell the observers -- forks already on the table</text><text x=\"635\" y=\"173\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">an interrupt, a timeout or an exception cannot leave a fork held,</text><text x=\"635\" y=\"194\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">which is why the table is never poisoned by one bad philosopher</text><text x=\"615\" y=\"240\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one round of p0 on a clock, and what is in its hands</text><g transform=\"translate(30 258)\"><rect width=\"150\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">think</text><text x=\"75.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds 0</text></g><g transform=\"translate(180 258)\"><rect width=\"110\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"55.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">HUNGRY</text><text x=\"55.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds 0</text></g><g transform=\"translate(290 258)\"><rect width=\"170\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">takes fork 0</text><text x=\"85.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds 1</text></g><g transform=\"translate(460 258)\"><rect width=\"170\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">takes fork 1</text><text x=\"85.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds 2</text></g><g transform=\"translate(630 258)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eat, 3 ms</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds 2</text></g><g transform=\"translate(960 258)\"><rect width=\"240\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">puts both back</text><text x=\"120.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds 0</text></g><path d=\"M430 320 V306\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"430\" y=\"336\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#ff6b6b\">interrupted here: fork 0 goes back, nothing eaten</text><path d=\"M790 320 V306\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"830\" y=\"336\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#ff6b6b\">it throws here: the finally still returns both forks</text><text x=\"615\" y=\"362\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the state is a field on the philosopher, not a shared map: it is written by one thread and read by the detector and the metrics, which is all a volatile int is for</text></svg></div><div class=\"move\"><p>THINKING holds nothing. HUNGRY is reaching, and may be holding one fork for a moment. EATING means both forks are in hand. DONE is the end of the rounds. The order inside a round is the design: think, say HUNGRY while holding nothing, ask the policy for both forks &mdash; and the policy's contract is all-or-nothing, so it returns with two or with none &mdash; then and only then say EATING and eat, count the meal after it actually happened, and put both forks back inside a <code>finally</code>. That finally is load-bearing: a philosopher that is interrupted mid-reach hands back the fork it already took, and a philosopher whose meal throws still returns both. There is no state in which a fork is held by somebody who has stopped running, which is the concurrency equivalent of \"nothing is ever half-written\".</p></div><div class=\"move\"><h3>Move 7: yes, a fork is held for the whole meal. That is the one design here where the critical section IS the work.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 428\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"615\" y=\"26\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">fifteen milliseconds at the table: five philosophers, a 3 ms meal, resource ordering</text><path d=\"M150 44 V235\" stroke=\"var(--line)\" stroke-dasharray=\"3 4\"/><text x=\"150.0\" y=\"38\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">0 ms</text><path d=\"M356 44 V235\" stroke=\"var(--line)\" stroke-dasharray=\"3 4\"/><text x=\"356.0\" y=\"38\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">3 ms</text><path d=\"M562 44 V235\" stroke=\"var(--line)\" stroke-dasharray=\"3 4\"/><text x=\"562.0\" y=\"38\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">6 ms</text><path d=\"M768 44 V235\" stroke=\"var(--line)\" stroke-dasharray=\"3 4\"/><text x=\"768.0\" y=\"38\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">9 ms</text><path d=\"M974 44 V235\" stroke=\"var(--line)\" stroke-dasharray=\"3 4\"/><text x=\"974.0\" y=\"38\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">12 ms</text><path d=\"M1180 44 V235\" stroke=\"var(--line)\" stroke-dasharray=\"3 4\"/><text x=\"1180.0\" y=\"38\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">15 ms</text><text x=\"40\" y=\"70\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">p0</text><text x=\"75\" y=\"70\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">forks 0,1</text><g transform=\"translate(150.0 52)\"><rect width=\"206.0\" height=\"28\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"103.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eat</text></g><g transform=\"translate(768.0 52)\"><rect width=\"206.0\" height=\"28\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"103.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eat</text></g><text x=\"40\" y=\"106\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">p1</text><text x=\"75\" y=\"106\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">forks 1,2</text><g transform=\"translate(356.0 88)\"><rect width=\"206.0\" height=\"28\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"103.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eat</text></g><g transform=\"translate(974.0 88)\"><rect width=\"206.0\" height=\"28\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"103.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eat</text></g><text x=\"40\" y=\"142\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">p2</text><text x=\"75\" y=\"142\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">forks 2,3</text><g transform=\"translate(150.0 124)\"><rect width=\"206.0\" height=\"28\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"103.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eat</text></g><g transform=\"translate(562.0 124)\"><rect width=\"206.0\" height=\"28\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"103.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eat</text></g><text x=\"40\" y=\"178\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">p3</text><text x=\"75\" y=\"178\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">forks 3,4</text><g transform=\"translate(356.0 160)\"><rect width=\"206.0\" height=\"28\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"103.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eat</text></g><g transform=\"translate(768.0 160)\"><rect width=\"206.0\" height=\"28\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"103.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eat</text></g><text x=\"40\" y=\"214\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">p4</text><text x=\"75\" y=\"214\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">forks 4,0</text><g transform=\"translate(562.0 196)\"><rect width=\"206.0\" height=\"28\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"103.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eat</text></g><g transform=\"translate(974.0 196)\"><rect width=\"206.0\" height=\"28\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"103.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eat</text></g><text x=\"615\" y=\"256\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">two eat in every slot and never three: with five philosophers the ceiling is floor(5 / 2) = 2, and that is the problem's ceiling, not the code's</text><g transform=\"translate(30 276)\"><rect width=\"570\" height=\"120\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what a fork's lock actually costs</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">two tryLocks, two unlocks and a little bookkeeping per meal</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">measured: 10,000 meals with no eating at all in ~15 ms</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">so about 1.5 microseconds of locking per meal</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">a real 3 ms meal is two thousand times that</text></g><g transform=\"translate(630 276)\"><rect width=\"570\" height=\"120\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">so what is the queue for?</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">not the lock's internals: the fork itself</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the fork is held for the WHOLE meal, on purpose</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">this is the rare case where the critical section IS the work</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">shortening it means eating faster, nothing else</text></g><text x=\"615\" y=\"414\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every other design says \"hold the lock for microseconds\". Here you cannot: a philosopher holds both forks for as long as it eats, so the ORDER of taking them is the design.</text></svg></div><div class=\"move\"><p>The usual advice &mdash; hold the lock for microseconds, do the slow thing outside it &mdash; cannot be followed here: eating <i>is</i> holding both forks. So measure both halves. The locking itself is nothing: ten thousand meals with instant meals run in about fifteen milliseconds, one and a half microseconds of lock traffic per meal. A real meal of three milliseconds is two thousand times that. So the queue is never for the lock's internals, it is for the fork itself, and the only lever is the order in which forks are taken. The second number is the ceiling: five philosophers share five forks and each meal needs two, so at most two can eat at once &mdash; floor(n/2) &mdash; and a schedule that reaches it rotates cleanly, with every philosopher eating twice in fifteen milliseconds. When somebody proposes one lock for the whole table, this is the number that answers them: the peak falls from two to one and the same hundred and fifty meals take about 650 ms instead of about 380.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"200\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">is this fast? do the arithmetic before you optimise</text><text x=\"35\" y=\"68\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">10,000 meals with instant meals: ~15 ms, so ~1.5 us of forks per meal</text><text x=\"35\" y=\"93\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a real meal of 3 ms is 2,000 times the cost of the two locks</text><text x=\"35\" y=\"118\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">five philosophers, two eating at once: floor(n / 2) is the ceiling</text><text x=\"35\" y=\"143\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">think = eat means 2.5 want to eat and 2 can, so ~20% of life is waiting</text><text x=\"35\" y=\"168\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the waiter costs one more counter: 10,000 meals in ~40 ms</text><text x=\"35\" y=\"193\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">drop-and-retry drops ~180 forks: the same 10,000 in ~400 ms</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, cheapest first</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1  resource ordering: lower fork id first</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one comparison, nothing else -- but you must own the numbering</text></g><g transform=\"translate(600 112)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2  a waiter: Semaphore(n - 1) seats</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no numbering needed; one shared counter, fair queue</text></g><g transform=\"translate(600 166)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3  tryLock with random backoff</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no order, no waiter; pays in dropped forks, livelocks without the randomness</text></g><text x=\"615\" y=\"236\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">beyond the ladder: Chandy-Misra, where forks are clean or dirty tokens passed between neighbours &mdash; no order, no waiter, starvation-free. Named, not built.</text></svg></div><div class=\"move\"><p>Ordering costs one integer comparison per meal and buys structural freedom from deadlock; measured, ten thousand meals in about fifteen milliseconds. The waiter costs a fair semaphore acquire as well, roughly three times the lock traffic, and buys the same guarantee <i>without</i> needing to own the numbering of the forks &mdash; which is the rung you climb to when the interviewer forbids a global order. Drop-and-retry costs far more: the same ten thousand meals took around four hundred milliseconds and threw away about a hundred and eighty half-acquisitions, because every failed attempt throws away work, and without a randomised backoff it does not deadlock but livelocks, which is worse, because it looks busy. Beyond the ladder is Chandy-Misra, where each fork is clean or dirty and neighbours pass them on request: no global order, no central waiter, and starvation-freedom as well. Name it; do not build it in an hour.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 368\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 16)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">all five take a left fork at once</text></g><path d=\"M340 34 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 16)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the ring, on purpose; test 1: a wedge latch, a grace timeout, and a detector that names 5 philosophers</text></g><g transform=\"translate(30 56)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a philosopher waits for ever</text></g><path d=\"M340 74 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 56)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ordering deletes the cycle; test 2: 10,000 meals finish with no deadlock, 2,000 each</text></g><g transform=\"translate(30 96)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the interviewer bans renumbering</text></g><path d=\"M340 114 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 96)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a waiter with n-1 seats; test 3: 5,000 meals, and every seat comes back</text></g><g transform=\"translate(30 136)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eating throws half way through</text></g><path d=\"M340 154 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 136)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a finally around the meal; test 6: p2 throws 200 times, every fork still ends free</text></g><g transform=\"translate(30 176)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a wedged run has to be broken</text></g><path d=\"M340 194 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 176)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lockInterruptibly; test 7: an interrupt unwinds 5-second meals at once</text></g><g transform=\"translate(30 216)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the \"fix\" is one lock for the table</text></g><path d=\"M340 234 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 216)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">measure it; test 5: peak eaters falls from 2 to 1 and the same 150 meals take ~650 ms instead of ~380</text></g><g transform=\"translate(30 256)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a detector that cries wolf</text></g><path d=\"M340 274 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 256)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">test 11: 40 samples of a healthy run, and no ring confirmed -- one sample is only a suspicion</text></g><g transform=\"translate(30 296)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the wait/notify version sleeps for ever</text></g><path d=\"M340 314 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 296)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one condition per seat, signalled after the change; test 15: one condition + signal() loses the wakeup</text></g><text x=\"615\" y=\"354\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim on this page has a test: FailureTests.java runs thirty-seven of them in about three seconds and must print ALL PASS</text></svg></div><div class=\"move\"><p>All five reaching at once (show it on purpose: a latch makes every philosopher hold a left fork, and a grace timeout on the second fork means the demonstration ends in 400 ms instead of hanging the JVM). A philosopher waiting for ever (ordering; ten thousand meals finish). A ban on renumbering (the waiter; five thousand meals and every seat handed back). A meal that throws (the finally; every fork still free at the end, and the neighbours never blocked). A wedged run that must be broken (interruptible locks; an interrupt unwinds five-second meals immediately). The plausible bad fix (one lock for the table; the peak eaters number falls to one and the clock says so). A detector that cries wolf (forty samples of a healthy run, and no ring ever confirmed: our detector reads two fields that move while it is reading them, so a single sample really can compose a ring on a healthy table, and the rule is the same ring twice before you believe it). And, if you write the wait/notify version instead, the failure that replaces the ring: a wakeup delivered to the wrong thread, which the test reproduces on purpose by putting two waiters on one condition and calling signal() once. Each of those is a few lines in FailureTests.java, which runs thirty-seven checks in about three seconds.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"850\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface ForkPolicy { acquireBoth(p); releaseBoth(p); }</text><text x=\"850\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">every deadlock fix is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">publish(id, state) after the forks are back, in a try/catch</text><text x=\"850\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">metrics that cannot slow a meal down</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"220\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">THINKING &rarr; HUNGRY &rarr; EATING, one field, one writer</text><text x=\"850\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">the detector and the metrics read one int</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 12</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">stoppable(work): wraps any Work and adds the stop check</text><text x=\"850\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">a graceful stop without touching the loop</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Monitor object</text><text x=\"220\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 1</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Fork = the data plus the lock that guards it, in one class</text><text x=\"850\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">nobody can touch a fork without the lock</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"220\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">the table is handed to its caller; nothing calls getInstance()</text><text x=\"850\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds four tables in four lines</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"220\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">new OrderedPolicy() at the call site is the whole construction</text><text x=\"850\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when policies come from config</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"220\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"310\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">a table is n, a policy and a round count</text><text x=\"850\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">three required fields is a constructor</text><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and the watchdog is not a pattern at all: a detector is a monitor, and naming it a \"pattern\" is how people end up shipping the naive protocol with an alarm on it</text></svg></div><div class=\"move\"><p>Strategy is move 3 and it is the spine of this design: the acquisition rule behind <code>ForkPolicy</code>, so ordering, the waiter, backoff, asymmetry and the wait/notify version are five files and no edits. Observer is move 3 as well &mdash; the table announces a state change after the forks are back, inside a try/catch, so a metrics collector or a broken listener can never stretch a meal. State is move 6, four values in one field with one writer, which is what makes the detector's read cheap. Decorator turns up in the shutdown twist: <code>stoppable(work)</code> wraps any Work and adds the flag check, so a graceful stop needs no change to the philosopher's loop. And the Fork is the textbook <b>monitor object</b> &mdash; the data and the lock that guards it in one class &mdash; which is worth naming because it is the reason a boolean-plus-a-lock design is wrong rather than merely clumsy. Singleton earned nothing: the table is handed to its caller. Factory earns its name the day policies arrive from configuration. Builder never does: a table is three required fields.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Fork: mutual exclusion. Philosopher: the loop. Table: the wiring. A policy: one rule.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">AsymmetricPolicy is a new file; Philosopher and DiningTable never change</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">policy.acquireBoth(this);  never \"is this the ordered one?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one job each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">ForkPolicy is two halves of one rule; Work, DiningObserver and Clock have one method</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">new DiningTable(5, new ArbitratorPolicy(5), 1000).configure(think, eat)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>S: the fork does mutual exclusion, the philosopher runs the loop, the table does the wiring, a policy holds one rule &mdash; and nobody does two of those, which is why the deadlock fix is never tangled with the meal. O: asymmetric seating arrived as a new file in Extensions.java and nothing in Main.java moved. L: the philosopher calls <code>policy.acquireBoth(this)</code> and never asks which policy it got, which is why the same failure test runs against every one of them. I: <code>ForkPolicy</code> is two halves of a single rule, and Work, DiningObserver and Clock have one method each, so a fake is a lambda. D: the table is constructed with its policy and configured with its work, so a test can hand in a meal that throws, a clock that lies, and a policy designed to deadlock.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 22)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">asymmetric seats, Chandy-Misra</text></g><path d=\"M370 43 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 22)\"><rect width=\"660\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind ForkPolicy plus one line at the call site</text></g><text x=\"1145\" y=\"47\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 76)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">fairness, a dashboard, tracing</text></g><path d=\"M370 97 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 76)\"><rect width=\"660\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer, called after the forks are back</text></g><text x=\"1145\" y=\"101\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 130)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a graceful stop, a paused seat</text></g><path d=\"M370 151 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 130)\"><rect width=\"660\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more state and one more checked transition</text></g><text x=\"1145\" y=\"155\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 184)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across threads</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a philosopher who needs a knife too</text></g><path d=\"M370 205 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 184)\"><rect width=\"660\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the SAME order over all three resources, everywhere</text></g><text x=\"1145\" y=\"209\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 238)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">forks shared by two machines</text></g><path d=\"M370 259 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 238)\"><rect width=\"660\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the lock becomes a lease in a store, and every write carries</text><text x=\"330.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a fencing token, because a lease can expire while its holder still thinks it is eating</text></g><text x=\"1145\" y=\"263\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"306\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for the first four the philosopher, the fork and the table do not change at all; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (asymmetric seats, Chandy-Misra, a priority for the hungriest) is a new class behind <code>ForkPolicy</code> and one changed argument. Somebody new who wants to know (fairness numbers, a dashboard, tracing) is one more observer, called after the forks are back. A new step in a life (a graceful stop, a seat that can be paused) is one more state and one more checked transition. A new invariant across threads (a philosopher who needs a knife as well as two forks) is the same move 4 answer generalised: sort <i>all</i> the resources by id and take them in that order, everywhere, which is also the fix for the two-account bank transfer that deadlocks in production. And state that must outlive the process (two machines sharing forks) turns the lock into a lease in a shared store, with the honest caveat that a lease can expire while its holder still believes it is eating, so every write it makes has to carry a fencing token. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 800\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 r(--text)\">thrown by NaivePolicy</text></g><g transform=\"translate(975 20)\"><rect width=\"245\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"122.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"122.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ForkPolicy</text><line x1=\"0\" y1=\"34\" x2=\"245\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">acquireBoth(p)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">releaseBoth(p)</text></g><g transform=\"translate(975 130)\"><rect width=\"245\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"122.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">NaivePolicy</text><line x1=\"0\" y1=\"26\" x2=\"245\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">graceMs, wedge latch</text><line x1=\"0\" y1=\"48\" x2=\"245\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">left, then right, then give up</text></g><g transform=\"translate(975 225)\"><rect width=\"245\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"122.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">OrderedPolicy</text><line x1=\"0\" y1=\"26\" x2=\"245\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">lower fork id first</text></g><g transform=\"translate(975 305)\"><rect width=\"245\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"122.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ArbitratorPolicy</text><line x1=\"0\" y1=\"26\" x2=\"245\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">seats: Semaphore(n-1)</text><line x1=\"0\" y1=\"48\" x2=\"245\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">a seat, then both forks</text></g><g transform=\"translate(975 400)\"><rect width=\"245\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"122.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">TimeoutBackoffPolicy</text><line x1=\"0\" y1=\"26\" x2=\"245\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">tryMs, backoff</text><line x1=\"0\" y1=\"48\" x2=\"245\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">drop and retry, randomly</text></g><g transform=\"translate(975 495)\"><rect width=\"245\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"122.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">AsymmetricPolicy <tspan font-size=\"10\" fill=\"var(--acc2)\">ext</tspan></text><line x1=\"0\" y1=\"26\" x2=\"245\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">odd seats reach right first</text></g><g transform=\"translate(975 575)\"><rect width=\"245\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"122.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">GlobalLockPolicy</text><line x1=\"0\" y1=\"26\" x2=\"245\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">table: ReentrantLock</text><line x1=\"0\" y1=\"48\" x2=\"245\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">one lock: no parallelism</text></g><g transform=\"translate(975 660)\"><rect width=\"245\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"122.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">MonitorPolicy <tspan font-size=\"10\" fill=\"var(--acc2)\">ext</tspan></text><line x1=\"0\" y1=\"26\" x2=\"245\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">mutex + one Condition a seat</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">eating / hungry: boolean[]</text><line x1=\"0\" y1=\"64\" x2=\"245\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">both forks, or wait in a loop</text></g><g><path d=\"M20 772L64 772\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"776\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 772L284 772\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"776\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 772L504 772\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"776\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 772L684 772\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"776\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 772L904 772\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"776\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values; &laquo;record&raquo; = a value with no behaviour; &laquo;exception&raquo; = what a policy throws when it refuses to keep waiting). A small blue <b>ext</b> after a name means that class lives in Extensions.java: it is a follow-up's answer, not something you type in the hour. Everything without it is in Main.java. Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements: seven policies, one interface, which is the whole design in one picture. Filled diamond = owns: the table creates the forks and the philosophers and their lifetime is its own. Plain arrow = references: a philosopher points at the two forks it shares with its neighbours, and those are the same two objects its neighbours point at. Dashed green = handed in at construction. Dotted blue = notifies. <b>Where state lives:</b> all of it is in the fork and the philosopher. A fork has the lock, the current owner and a count of hands on it; a philosopher has what it is doing, what it is reaching for, and how many meals it has had. The table owns no lock of its own &mdash; the forks are the locks &mdash; and the policy owns no state at all except the waiter's seat counter. Notice what is missing: there is no Deadlock class and no central book of who holds what, because the two volatile ints on the fork and the philosopher already are that book, and WaitGraph just reads them.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it, including a real deadlock broken by a watchdog) and FailureTests.java (thirty-seven checks in about three seconds; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.List;\nimport java.util.concurrent.CopyOnWriteArrayList;\nimport java.util.concurrent.CountDownLatch;\nimport java.util.concurrent.Semaphore;\nimport java.util.concurrent.ThreadLocalRandom;\nimport java.util.concurrent.TimeUnit;\nimport java.util.concurrent.atomic.AtomicInteger;\nimport java.util.concurrent.atomic.AtomicLong;\nimport java.util.concurrent.locks.LockSupport;\nimport java.util.concurrent.locks.ReentrantLock;\n\n/**\n * Where time comes from. Injected, so a test can stamp events with any instant it likes\n * and nothing in the system reads the wall clock by itself.\n */\ninterface Clock {\n    /** The current instant in milliseconds. */\n    long nowMs();\n}\n\n/**\n * The life of one philosopher. THINKING is the only state in which it holds nothing;\n * HUNGRY means it is reaching (and may be blocked); EATING means it holds BOTH forks.\n */\nenum PhilosopherState { THINKING, HUNGRY, EATING, DONE }\n\n/**\n * A bounded piece of work standing in for thinking or eating. Handed in, so a test can make\n * a meal instant, slow, or a meal that throws half way through.\n */\ninterface Work {\n    /** Do the work for one philosopher; may be interrupted while it waits. */\n    void perform(int philosopherId) throws InterruptedException;\n\n    /** Work that sleeps for a fixed number of milliseconds. */\n    static Work sleepMs(long ms) { return id -&gt; { if (ms &gt; 0) Thread.sleep(ms); }; }\n\n    /** Work that returns immediately: used by the tests that want raw lock traffic. */\n    static Work none() { return id -&gt; { }; }\n}\n\n/**\n * Thrown by a policy that refuses to wait any longer for the second fork. It is how the naive\n * protocol is demonstrated without hanging a JVM: the philosopher gives the fork it holds back\n * and reports the circular wait instead of sitting in it forever.\n */\nfinal class WouldDeadlock extends RuntimeException {\n    private final int philosopherId, forkId;\n\n    /** Records which philosopher gave up and which fork it was reaching for. */\n    WouldDeadlock(int philosopherId, int forkId) {\n        super(&quot;philosopher &quot; + philosopherId + &quot; gave up waiting for fork &quot; + forkId);\n        this.philosopherId = philosopherId;\n        this.forkId = forkId;\n    }\n\n    /** The philosopher that gave up. */\n    int philosopherId() { return philosopherId; }\n\n    /** The fork it could not get. */\n    int forkId() { return forkId; }\n}\n\n/**\n * A fork: one thing that exactly one philosopher may hold at a time, which is the definition of\n * a mutual-exclusion lock, so it IS a lock and not a boolean that would then need its own lock.\n * The lock is taken interruptibly so a supervisor can rescue a wedged run; the owner id is\n * published so a detector can see who holds what; and &quot;hands&quot; counts holders so the tests can\n * prove the invariant (never more than one) instead of trusting it.\n */\nfinal class Fork {\n    private final int id;\n    private final ReentrantLock lock;\n    private volatile int owner = -1;\n    private final AtomicInteger hands = new AtomicInteger();\n    private volatile boolean violated = false;\n\n    /** A fork with an id; fair = the lock hands itself to the longest waiter (slower, starvation-free). */\n    Fork(int id, boolean fair) { this.id = id; this.lock = new ReentrantLock(fair); }\n\n    /** The fork&#x27;s number, 0..n-1 around the table. This number is what resource ordering orders by. */\n    int id() { return id; }\n\n    /** Take the fork, waiting as long as it takes; throws if the thread is interrupted while waiting. */\n    void pickUp(int by) throws InterruptedException { lock.lockInterruptibly(); claim(by); }\n\n    /** Take the fork if it comes free within the timeout; false means somebody else still holds it. */\n    boolean tryPickUp(int by, long ms) throws InterruptedException {\n        if (!lock.tryLock(ms, TimeUnit.MILLISECONDS)) return false;\n        claim(by);\n        return true;\n    }\n\n    /** Record the new holder and count the hands on this fork: two hands would break the invariant. */\n    private void claim(int by) {\n        owner = by;\n        if (hands.incrementAndGet() != 1) violated = true;\n    }\n\n    /**\n     * Put the fork back. Two guards, and both matter: the lock may only be released by the thread\n     * that took it, and the caller must be the recorded owner. A putDown from anybody else is a\n     * harmless no-op rather than an IllegalMonitorStateException, so a clumsy caller -- or a\n     * finally that runs after a failed acquire -- can never free somebody else&#x27;s fork.\n     */\n    void putDown(int by) {\n        if (owner != by || !lock.isHeldByCurrentThread()) return;\n        hands.decrementAndGet();\n        owner = -1;\n        lock.unlock();\n    }\n\n    /** Who holds this fork right now, or -1 if it is on the table. Read by the deadlock detector. */\n    int owner() { return owner; }\n\n    /** True when nobody holds the fork. */\n    boolean isFree() { return !lock.isLocked(); }\n\n    /** True if two philosophers were ever counted holding this fork at once: the invariant broken. */\n    boolean violated() { return violated; }\n}\n\n/**\n * The one rule that decides whether this program deadlocks: how a philosopher gets BOTH forks.\n * Everything else in the system is fixed, so every deadlock-avoidance idea is a new implementation\n * of this interface, handed to the table, with Philosopher and DiningTable untouched (Strategy).\n */\ninterface ForkPolicy {\n    /** Acquire b

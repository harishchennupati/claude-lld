<div class="top"><h1>Dining Philosophers</h1><span class="sub">LLD &middot; multithreading &middot; Java &middot; OpenJDK 21: demo, a safe deadlock, 37 failure checks</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Five philosophers sit around a table. Between each pair there is one fork, and a philosopher needs the two forks beside it to eat. Write it so they all keep eating and no philosopher waits forever. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>Five philosophers sit in a circle. There is one fork between each pair, so five forks for five people, and eating needs two: the one on your left and the one on your right. Each philosopher spends its life thinking, getting hungry, eating, and putting the forks back. A fork can only be in one hand at a time, so a philosopher who wants to eat may have to wait for a neighbour to finish. That is the whole story, and it is a trap: write the obvious thing &mdash; take the left fork, then the right &mdash; and if all five reach at the same instant, every one of them ends up holding one fork and waiting for a neighbour who is waiting for them. Nothing crashes, nothing is logged, no thread wakes up: the program simply stops for ever. The thing that must always be true is two-sided: a fork is in exactly one hand, and the set of philosophers waiting on each other must never close into a ring.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Working code with a <code>main</code> that runs threads, not a picture of a table. The interviewer is watching for, in this order: the questions you ask before typing (how many, block or time out, must the deadlock be shown); which classes exist and what a fork actually is (a lock, not a boolean); one meal end to end; the race &mdash; can you make the deadlock happen on purpose and say which of the four conditions each fix removes; where the acquisition rule lives, so a new fix is a new class rather than an edit; what happens when a philosopher is interrupted or throws mid-meal; and only then the twists: starvation, metrics, a graceful stop, and where the same problem shows up in production code.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 330\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">one meal</text><g transform=\"translate(175 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">think</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holding nothing at all</text></g><path d=\"M415 57 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take BOTH forks</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the policy decides how</text></g><path d=\"M675 57 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eat</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">both forks in hand, 3 ms</text></g><path d=\"M935 57 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">put both back</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">in a finally, always</text></g><path d=\"M555 84 V97\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 97)\"><rect width=\"420\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"210.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">interrupted, or gave up: put back what you hold</text><text x=\"210.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nothing is ever left half-held</text></g><text x=\"88\" y=\"182\" text-anchor=\"middle\" font-size=\"13\" fill=\"#ff6b6b\">the trap</text><g transform=\"translate(175 155)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take the fork on your left</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">everyone can, at once</text></g><path d=\"M415 182 H435\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 155)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reach for the right-hand one</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">your neighbour has it</text></g><path d=\"M675 182 H695\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 155)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">all five hold one fork</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">and all five are waiting</text></g><path d=\"M935 182 H955\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 155)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">nobody ever moves again</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no error, no crash, no log</text></g><text x=\"88\" y=\"245\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">run</text><text x=\"175\" y=\"245\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">start() releases all five in the same instant &middot; awaitFinish(ms) waits with a deadline &middot; interruptAll() rescues a table that is stuck</text><text x=\"88\" y=\"275\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"275\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, without stopping anybody: who is eating, how many meals has each had, is anyone waiting in a ring?</text><text x=\"615\" y=\"315\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">five threads reach in the same instant: a fork is in exactly one hand, and no set of philosophers may end up waiting on each other in a ring</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>How many philosophers, and is N fixed at construction?</td><td>Five, fixed</td><td>An array of forks; left = i, right = (i+1) mod N (moves 1, 5)</td></tr><tr><td>Is a fork a flag I guard, or a lock in its own right?</td><td>A lock</td><td><code>Fork</code> wraps a <code>ReentrantLock</code> (move 1). The other shape &mdash; one lock over a state array, one condition per seat &mdash; is on page 05</td></tr><tr><td>Deadlock-freedom only, or no starvation either?</td><td>No deadlock first; fairness as a knob</td><td>Which fix you pick and what the tests can honestly claim (moves 4, 9)</td></tr><tr><td>Does a hungry philosopher block for ever, or give up?</td><td>Block; a timeout policy is one of the options</td><td>Whether <code>acquireBoth</code> may throw, and what the caller does (moves 3, 6)</td></tr><tr><td>Do you want the deadlock shown, or only avoided?</td><td>Shown &mdash; on purpose and safely</td><td>A naive policy with a grace timeout, plus a detector (moves 3, 9)</td></tr><tr><td>Fixed rounds, or run until somebody stops it?</td><td>Fixed rounds; a stop flag is a follow-up</td><td>How the demo ends and how a supervisor stops a live run (moves 6, 12)</td></tr><tr><td>Do we need live metrics: meals each, who is waiting?</td><td>Yes, and reading them must cost nothing</td><td>Volatile counters per philosopher plus an observer (moves 5, 3)</td></tr><tr><td>One JVM, or forks shared across processes?</td><td>One JVM, threads and locks</td><td>No leases and no fencing tokens yet; a follow-up (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>N philosophers around one table, N forks, one between each pair; philosopher i uses forks i and (i+1) mod N.</li>\n<li>A philosopher thinks, takes both of its forks, eats, and puts both back &mdash; for a set number of rounds.</li>\n<li>Two philosophers who do not share a fork must be able to eat at the same time.</li>\n<li>The rule for taking both forks is swappable: ordering, a waiter, try-and-back-off, one per class.</li>\n<li>The broken protocol must be demonstrable on purpose, and the circular wait reported, not guessed at.</li>\n<li>A supervisor can stop a run: cleanly between meals, or by force if somebody is stuck.</li>\n<li>Read, at any moment: meals per philosopher, who is hungry, how many are eating.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>A fork is held by exactly one philosopher at a time &mdash; measured, not assumed.</li>\n<li>No deadlock: the run always ends, and the reason is structural, not a timeout.</li>\n<li>No fork is ever left held: every failure path returns everything it took.</li>\n<li>Taking and returning a fork is O(1); finding a ring is O(N) over an array, off the hot path.</li>\n<li>The fix must keep the parallelism: floor(N/2) philosophers still eat at once.</li>\n<li>Every philosopher keeps getting meals in a bounded run (fairness is a knob, and its limits are stated).</li>\n<li>In memory, one JVM, threads and ReentrantLocks (say it; leases across processes are a follow-up).</li></ul></div></div>\n<div class=\"move\"><h3>One dinner, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H930\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><text x=\"1055\" y=\"30\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a second run, from the start</text><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">00.000  five sit down</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one latch opens and five threads</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">reach in the same instant</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">forks 0 to 4 are all on the table</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"#ff6b6b\" stroke=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#ff6b6b\">00.000  left fork first</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">all five take a left fork:</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">p0 has 0, p1 has 1 ... p4 has 4</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">p0 waits for 1 ... p4 waits for 0</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\" stroke=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">00.400  the grace runs out</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the first to give up drops its left fork</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">and the ring unravels behind it:</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">0 meals in those 400 ms, the ring named</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"none\" stroke=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--acc)\">next run  one line changed</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">lower fork id first: 10,000 meals</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">2,000 each, two eating at once,</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">8 ms, no fork ever in two hands</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> a fork is a lock, not a boolean; five philosophers, fixed, each with forks i and (i+1) mod 5; a philosopher blocks rather than polls, and the lock is interruptible so a supervisor can rescue it; the acquisition rule is the one thing that changes, so it goes behind an interface; I will show the deadlock on purpose, with a grace timeout so nothing hangs, and then delete it. Named as out of scope: starvation proofs, forks across processes, Chandy-Misra &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">The same moves as every other design on this site, with one difference: on a parking lot the moves protect a number from two writers, and here they protect the whole program from a shape. Move 4 is where this problem lives &mdash; draw the ring, name the four conditions, delete one &mdash; and moves 6 and 7 are where the answer is made honest: what is held at every instant, and how long it is held for.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class &mdash; and one of them is a lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 225\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a PHILOSOPHER takes two FORKS, EATS and puts them back; a TABLE seats them in a ring; a POLICY decides how to take both</text><g transform=\"translate(30 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Fork</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who holds it: a lock</text></g><path d=\"M117.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(225 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Philosopher</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">state, meals: a thread</text></g><path d=\"M317.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DiningTable</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the ring, the seats</text></g><path d=\"M522.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(635 110)\"><rect width=\"180\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"90.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ForkPolicy</text><text x=\"90.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M725.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(835 110)\"><rect width=\"180\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"90.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PhilosopherState</text><text x=\"90.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a fixed list: an enum</text></g><path d=\"M925.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1035 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">deadlock</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">not a class: a shape</text></g><path d=\"M1122.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: an interface, a fixed list of values, or a property of the whole graph</text><text x=\"615\" y=\"210\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">a fork is the one worth arguing about: \"held by exactly one philosopher at a time\" IS mutual exclusion, so it is a lock, not a boolean that would then need its own lock</text></svg></div><div class=\"move\"><p>Reading the paragraph again: a <b>philosopher</b> takes two <b>forks</b>, <b>eats</b>, and puts them back; a <b>table</b> seats five of them in a ring; a <b>rule</b> decides how a philosopher takes both. A philosopher has state that moves &mdash; what it is doing, how many meals it has had &mdash; and it has its own thread, so it is a class. A fork has the only state that matters: who is holding it. And that sentence, \"held by exactly one philosopher at a time\", is the definition of mutual exclusion, so a fork <i>is</i> a lock rather than a boolean you would then have to guard with a lock. The table holds the ring and the wiring. The acquisition rule has no state at all, so it is an interface. What is <i>not</i> a class is the deadlock: it is not a thing anybody owns, it is a shape the whole graph can fall into, which is exactly why nobody notices it until everything stops.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 22)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take one fork, put it back</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 43 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 22)\"><rect width=\"420\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Fork  (owns the lock and the owner)</text><text x=\"210.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M850 43 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 22)\"><rect width=\"300\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">fork.pickUp(id) / putDown(id)</text><text x=\"150.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 76)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">get BOTH forks, or neither</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 97 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 76)\"><rect width=\"420\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ForkPolicy  (owns the rule, no state)</text><text x=\"210.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M850 97 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 76)\"><rect width=\"300\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">policy.acquireBoth(p)</text><text x=\"150.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 130)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">think, eat, count the meal</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 151 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 130)\"><rect width=\"420\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Philosopher  (owns its own counters)</text><text x=\"210.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M850 151 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 130)\"><rect width=\"300\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">philosopher.run()</text><text x=\"150.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 184)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">seat N in a ring, start them together</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 205 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 184)\"><rect width=\"420\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DiningTable  (owns forks and seats)</text><text x=\"210.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M850 205 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 184)\"><rect width=\"300\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">table.start()</text><text x=\"150.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 238)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who holds what, who waits for what</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 259 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 238)\"><rect width=\"420\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WaitGraph  (owns nothing: a read)</text><text x=\"210.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M850 259 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 238)\"><rect width=\"300\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WaitGraph.find(forks, seats)</text><text x=\"150.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"310\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">\"get both forks\" is the one verb whose owner is not obvious: it touches two forks and belongs to neither, so it becomes a thing of its own</text></svg></div><div class=\"move\"><p>\"Take a fork and put it back\" touches one fork, so <code>fork.pickUp(id)</code> and <code>fork.putDown(id)</code> live on the fork &mdash; and putDown checks that you are the holder, so a clumsy caller cannot free somebody else's fork. \"Think, eat, count the meal\" touches only the philosopher's own fields, so it is <code>run()</code>. \"Seat five in a ring and start them in the same instant\" touches every fork and every seat, so it is the table. \"Who holds what and who is waiting\" touches nothing at all &mdash; it only reads &mdash; so it is a static method over an array. That leaves the interesting one: \"get both forks\". It touches two forks and belongs to neither of them, and it is the only line in the whole program that decides whether this deadlocks, so it becomes a thing of its own.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 302\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L1

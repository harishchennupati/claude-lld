each pair there is one fork, and a philosopher needs the two forks beside it to eat. Write it so they all keep eating and no philosopher waits forever. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (is a fork a lock, and do you want the deadlock shown, are the first two); then type in the order of Main.java: the Clock and Work interfaces, the PhilosopherState enum, Fork with its lock and its guarded putDown, the ForkPolicy interface, the naive policy with its grace timeout, the ordered policy, the arbitrator, Philosopher with its try/finally, WaitGraph, then DiningTable with the start latch, and a main that wedges the naive run, names the ring and then runs ten thousand meals with ordering.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; You may not renumber the forks. No global order is allowed. Now fix the deadlock.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A cycle needs all five philosophers reaching at the same time, so stop the fifth from sitting down: a waiter with four seats for five philosophers. A philosopher takes a seat before it touches a fork and gives the seat back with the forks, so at any instant at most four are reaching and at least one of them has both its forks free on one side. The semaphore is fair, so the queue for a seat is first-come-first-served. Philosopher and DiningTable do not change at all: this is a new ForkPolicy and one changed constructor argument, which is the whole point of move 3. It costs one extra counter on the hot path -- measured, ten thousand meals in about 40 ms against about 15 ms for ordering.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The fix for when you are not allowed to renumber the resources: a waiter seats at most n-1\n * philosophers at a time. A full cycle needs all n reaching at once, so with one seat missing at\n * least one philosopher always gets both forks. The semaphore is fair, so the queue for a seat\n * is first-come-first-served and nobody is skipped forever.\n */\nfinal class ArbitratorPolicy implements ForkPolicy {\n    private final Semaphore seats;\n    private final int capacity;\n\n    /** n = the number of philosophers; the waiter hands out n-1 seats. */\n    ArbitratorPolicy(int n) { this.capacity = n - 1; this.seats = new Semaphore(capacity, true); }\n\n    /** Take a seat first, then both forks; if anything fails, the seat goes back with the forks. */\n    @Override public void acquireBoth(Philosopher p) throws InterruptedException {\n        seats.acquire();\n        boolean ok = false;\n        try {\n            p.markWaiting(p.left().id());\n            p.left().pickUp(p.id());\n            try {\n                p.markWaiting(p.right().id());\n                p.right().pickUp(p.id());\n                ok = true;\n            } catch (InterruptedException e) {\n                p.left().putDown(p.id());\n                throw e;\n            }\n        } finally {\n            p.markWaiting(-1);\n            if (!ok) seats.release();\n        }\n    }\n\n    /** Both forks, then the seat -- in that order, so a freed seat always comes with free forks. */\n    @Override public void releaseBoth(Philosopher p) {\n        p.right().putDown(p.id());\n        p.left().putDown(p.id());\n        seats.release();\n    }\n\n    /** Seats currently free; must be back to n-1 when dinner is over. */\n    int freeSeats() { return seats.availablePermits(); }\n\n    /** How many may reach for forks at once. */\n    int capacity() { return capacity; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>2 &middot; Forget taking two forks one after the other. Do it with wait and notify.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One ReentrantLock over the whole table, two small arrays -- who is hungry, who is eating -- and one Condition per seat. A hungry philosopher marks itself hungry under that lock and tries to grant itself a meal: if neither neighbour is eating it sets eating[i] = true and signals its own condition, and if it cannot, it waits in a while loop until a neighbour finishes and grants it. The forks are only picked up after the grant, so nobody ever holds one fork while waiting for the other -- this deletes hold-and-wait, where ordering and the waiter both delete the cycle instead, and unlike drop-and-retry it throws no work away. Releasing runs in the order that matters: both forks down first, then the lock, then eating[i] = false, then a grant attempt for each neighbour, so a philosopher is only ever woken for forks that are already on the table. The interrupt path is the fiddly part and it has its own test, because there are two ways to be left holding a grant you can no longer use: signalled and interrupted in the same breath, or interrupted in the gap between the grant and the fork pick-up, where lockInterruptibly throws even though the fork is sitting free -- and both have to hand the grant on rather than drop it and strand two neighbours. Measured: 5,000 meals, no deadlock, peak two eating at once -- the same parallelism as ordering -- and both arrays empty at the end, with the honest caveat that this is deadlock-free but not starvation-free: two neighbours taking turns can keep a philosopher hungry for ever.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the wait protocol -- one lock for the table, one condition per seat\n/**\n * The other shape of this problem, and the one an interviewer means when they say &quot;do it with\n * wait/notify&quot;. Instead of locking two forks one after the other, there is ONE lock over a small\n * array of who-is-eating, and one Condition per philosopher. A hungry philosopher looks at its two\n * neighbours under that lock: if neither is eating it takes both forks in the same breath, and if\n * either is, it waits on its own condition until a neighbour finishes and wakes it. Nobody ever\n * holds one fork while waiting for another, so no ring can form: this deletes HOLD-AND-WAIT, the\n * second Coffman condition, where ordering and the waiter both delete the fourth one, the cycle.\n *\n * Read this class for the three rules of the wait protocol, which is the same in every language:\n *   1. CHECK THE CONDITION UNDER THE LOCK. eating[] and hungry[] are only ever read or written\n *      while `mutex` is held, so nobody can see half of a change.\n *   2. WAIT IN A LOOP, never an if. await() may return with nobody having signalled (a spurious\n *      wakeup), and even a real signal only means &quot;go and look again&quot; -- by the time the woken\n *      thread gets the lock back, a third thread may have taken what it was woken for.\n *   3. CHANGE THE STATE FIRST, THEN SIGNAL. Signal before the change and the woken thread\n *      re-checks, sees nothing, and goes back to sleep for ever: that is a lost wakeup.\n *\n * Two honest caveats. The table lock is held for a handful of array reads -- microseconds -- and\n * is released before the meal, so this is nothing like GlobalLockPolicy&#x27;s one-lock-per-meal. And\n * it is deadlock-free but not starvation-free: two neighbours taking turns can keep a philosopher\n * hungry forever, and the fix is one more array (the instant each went hungry) plus &quot;and no hungry\n * neighbour has waited longer than me&quot; in the test below.\n */\nfinal class MonitorPolicy implements ForkPolicy {\n    private final int n;\n    private final ReentrantLock mutex = new ReentrantLock();\n    private final Condition[] mayEat;\n    private final boolean[] eating, hungry;\n\n    /** n philosophers around the ring; every one of them gets its own condition to wait on. */\n    MonitorPolicy(int n) {\n        this.n = n;\n        this.mayEat = new Condition[n];\n        this.eating = new boolean[n];\n        this.hungry = new boolean[n];\n        for (int i = 0; i &lt; n; i++) mayEat[i] = mutex.newCondition();\n    }\n\n    /** Say hungry under the lock, take both forks if the neighbours are idle, else wait in a loop. */\n    @Override public void acquireBoth(Philosopher p) throws InterruptedException {\n        int i = p.id();\n        mutex.lockInterruptibly();\n        try {\n            hungry[i] = true;\n            grantIfPossible(i);\n            while (!eating[i]) mayEat[i].await();        // WHILE, not if: a wakeup is a hint, not a promise\n        } catch (InterruptedException e) {\n            hungry[i] = false;                           // interrupted while waiting: leave no claim behind\n            if (eating[i]) {                             // signalled AND interrupted in the same breath:\n                eating[i] = false;                       // the grant is real, so hand it on rather than drop it\n                grantIfPossible((i + n - 1) % n);\n                grantIfPossible((i + 1) % n);\n            }\n            throw e;\n        } finally {\n            mutex.unlock();\n        }\n        // Granted means the table lock has already reserved both forks, so neither call below can block.\n        // That is the whole claim of this design, so check it rather than believe it: if either fork is in\n        // a hand at this instant the grant was not atomic, and the test would rather see that than a hang.\n        if (!p.left().isFree() || !p.right().isFree())\n            throw new IllegalStateException(&quot;p&quot; + i + &quot; was granted a meal while a neighbour still held a fork&quot;);\n        try {\n            p.left().pickUp(p.id());\n            p.right().pickUp(p.id());\n        } catch (InterruptedException e) {\n            // The gap nobody thinks about, and a real bug until it is handled: the grant is already made\n            // and the table lock is already released, and only NOW does the supervisor interrupt us.\n            // lockInterruptibly throws the moment the flag is set even though the fork is sitting free,\n            // so without this the seat stays marked EATING for ever and both neighbours wait on a\n            // philosopher that has gone home. Give back whatever was taken, then give back the grant.\n            p.right().putDown(p.id());\n            p.left().putDown(p.id());\n            releaseGrant(i);\n            throw e;\n        }\n    }\n\n    /** Forks back first, then the seat state, then wake whichever neighbour can now eat. */\n    @Override public void releaseBoth(Philosopher p) {\n        p.right().putDown(p.id());\n        p.left().putDown(p.id());                        // the forks are on the table BEFORE anybody is woken for them\n        releaseGrant(p.id());\n    }\n\n    /** Clear the seat under the table lock and offer the meal to each neighbour. Forks must already be back. */\n    private void releaseGrant(int i) {\n        mutex.lock();\n        try {\n            eating[i] = false;\n            grantIfPossible((i + n - 1) % n);\n            grantIfPossible((i + 1) % n);\n        } finally {\n            mutex.unlock();\n        }\n    }\n\n    /** The state change and the signal, in that order, with the lock held by the caller. */\n    private void grantIfPossible(int i) {\n        int left = (i + n - 1) % n, right = (i + 1) % n;\n        if (hungry[i] &amp;&amp; !eating[left] &amp;&amp; !eating[right]) {\n            hungry[i] = false;\n            eating[i] = true;                            // the state changes first...\n            mayEat[i].signal();                          // ...and only then is anybody told\n        }\n    }\n\n    /** True when no philosopher is left marked hungry or eating: the arrays must end clean. */\n    boolean quiescent() {\n        mutex.lock();\n        try {\n            for (int i = 0; i &lt; n; i++) if (eating[i] || hungry[i]) return false;\n            return true;\n        } finally {\n            mutex.unlock();\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>3 &middot; Why notifyAll and not notify? And why is the wait always in a while loop?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Because a Condition has one queue, and signal() moves whichever thread happens to be at the head of it. If several threads wait on the same condition for different things, that thread may be waiting for something else entirely: it re-tests, finds its own test still false, goes back to sleep -- and takes the only wakeup with it. The thread the change was actually for is never told, and the program stalls with nobody holding anything. The test builds exactly that, deterministically: two waiters on one condition, the first parked before the second is even started so the queue order is a fact and not luck, then one signal() -- and the thread the change was for is still asleep 300 ms later, while signalAll() gets it through. The while loop is the other half of the rule: a wakeup only ever means \"go and look again\", both because await() can return without anybody signalling and because a third thread can take what you were woken for before you get the lock back. MonitorPolicy above escapes the choice altogether by giving every philosopher its own condition, so signal() wakes exactly one thread, the right one, and there is no thundering herd to pay for.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: signal vs signalAll, and why the wait is always in a while loop\n/**\n * The two rules of the wait protocol that interviewers actually probe, shown failing rather than\n * quoted. Both are about WHO gets told when a condition changes.\n *\n * ONE CONDITION FOR EVERYBODY + signal() LOSES WAKEUPS. A Condition has its own queue. signal()\n * moves the thread at the HEAD of that queue, whoever it is, and that thread may be waiting for\n * something else entirely: it re-tests, sees its own condition still false, and goes back to\n * sleep -- taking the only wakeup with it. The thread the change was actually for is never told\n * and sleeps for ever. This is the real content of &quot;use notifyAll, not notify&quot;: with one queue\n * for several different conditions, signal() is a bug, and signalAll() pays a thundering herd to\n * cover it. MonitorPolicy above takes the third and best option -- one condition PER philosopher,\n * so signal() wakes exactly the thread the grant was made for and nobody else stirs.\n *\n * THE WAIT IS ALWAYS IN A while LOOP. Both waiters below re-test after waking, which is what makes\n * the lost wakeup show up as a stall instead of as a philosopher eating with somebody else&#x27;s fork.\n * An `if` here would let the woken thread run on a condition that is no longer true.\n *\n * The demonstration is deterministic, not lucky: the first waiter is parked before the second one\n * is even started, so the condition queue order is known, and every wait has a deadline.\n */\nfinal class WakeupRules {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Condition ready = lock.newCondition();\n    private int token = 0;\n\n    /** A thread that waits, in a while loop, until token == want, then counts the latch down. */\n    private Thread waiter(int want, CountDownLatch through) {\n        Thread t = new Thread(() -&gt; {\n            lock.lock();\n            try {\n                while (token != want) ready.await();      // WHILE: a wakeup only means &quot;look again&quot;\n                through.countDown();\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();       // the test&#x27;s way of ending a thread that is still waiting\n            } finally {\n                lock.unlock();\n            }\n        }, &quot;waiter-for-&quot; + want);\n        t.setDaemon(true);\n        t.start();\n        return t;\n    }\n\n    /** Spin until n threads are parked on the condition, so the queue order is a fact and not a race. */\n    private void awaitParked(int n) throws InterruptedException {\n        for (int i = 0; i &lt; 2_000; i++) {\n            lock.lock();\n            try { if (lock.getWaitQueueLength(ready) &gt;= n) return; } finally { lock.unlock(); }\n            Thread.sleep(1);\n        }\n        throw new IllegalStateException(&quot;the waiters never parked&quot;);\n    }\n\n    /**\n     * Two threads wait on ONE condition for two different things. The first waits for a token that\n     * never arrives; the second waits for the one we are about to set. Returns true if the second\n     * thread -- the one the change was for -- actually got through within the deadline.\n     * With signalAll it does. With signal it does not, because the wakeup went to the first.\n     */\n    static boolean woken(boolean signalAll) throws InterruptedException {\n        WakeupRules w = new WakeupRules();\n        CountDownLatch never = new CountDownLatch(1), through = new CountDownLatch(1);\n        Thread first = w.waiter(2, never);                // head of the queue, waiting for a 2 that never comes\n        w.awaitParked(1);\n        Thread second = w.waiter(1, through);             // behind it, waiting for the 1 we are about to set\n        w.awaitParked(2);\n        w.lock.lock();\n        try {\n            w.token = 1;                                  // the state changes first...\n            if (signalAll) w.ready.signalAll(); else w.ready.signal();   // ...and only then is anybody told\n        } finally {\n            w.lock.unlock();\n        }\n        boolean got = through.await(300, TimeUnit.MILLISECONDS);\n        first.interrupt(); second.interrupt();            // nothing here is left parked, either way\n        first.join(1_000); second.join(1_000);\n        return got;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>4 &middot; What does java.util.concurrent already give you here, and why ReentrantLock rather than synchronized?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nearly every piece except the one that matters. ReentrantLock gives three things synchronized cannot: lockInterruptibly, which is the only reason a wedged run can be rescued at all; tryLock with a timeout, which is the whole of the backoff policy and the grace timeout in the naive demonstration; and newCondition, so one lock can have a separate wait queue per philosopher instead of one queue for everybody. Semaphore(n - 1, true) is the waiter, fair queueing included. CountDownLatch is the start gate that makes five threads reach in the same instant, and ThreadMXBean.findDeadlockedThreads() is the production detector. What the JDK does not give you is the answer: there is no dining-philosophers class, because the acquisition rule IS the design and it is the one thing you have to write. synchronized is still the right default when you need none of the three -- it is shorter, it cannot be left unlocked, and the JVM optimises it -- but it blocks uninterruptibly, so a table built on it can be stopped only by killing the process.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// 1. lockInterruptibly: the rescue path. synchronized has no equivalent, at all.\nvoid pickUp(int by) throws InterruptedException { lock.lockInterruptibly(); claim(by); }\nvoid interruptAll() { for (Thread t : threads) if (t != null) t.interrupt(); }\n\n// 2. tryLock with a deadline: the grace timeout that turns a hang into evidence, and the backoff policy\nboolean tryPickUp(int by, long ms) throws InterruptedException {\n    if (!lock.tryLock(ms, TimeUnit.MILLISECONDS)) return false;\n    claim(by);\n    return true;\n}\n\n// 3. newCondition: one wait queue PER philosopher, so signal() wakes exactly the right thread\nfor (int i = 0; i &lt; n; i++) mayEat[i] = mutex.newCondition();\n\n// the waiter is a fair semaphore, and nothing else\nthis.seats = new Semaphore(n - 1, true);\n\n// the race itself is a latch: five threads, one instant\nprivate final CountDownLatch gate = new CountDownLatch(1);\nvoid awaitStart() throws InterruptedException { gate.await(); }\n\n// and the detector the JVM hands you for free, which is what jstack prints\nlong[] ids = ManagementFactory.getThreadMXBean().findDeadlockedThreads();\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>5 &middot; Don&#x27;t describe the deadlock. Reproduce it, on purpose, in a test that does not hang.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two pieces. A wedge latch inside the naive policy: every philosopher takes its left fork, counts down, and waits until all five have done so, which turns a rare interleaving into a certainty. And a grace timeout on the second fork: instead of blocking for ever the philosopher waits 400 ms, hands its first fork back and reports the circular wait. Meanwhile a detector thread samples the two volatile ints -- who owns each fork, what each philosopher is reaching for -- and walks the five edges looking for a ring. The test asserts the ring has five philosophers, that nobody ate during the whole grace window, and that every fork was back on the table afterwards. Every philosopher thread is a daemon, so even a broken version of this cannot wedge the JVM.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. the naive protocol really does form a circular wait -- shown with timeouts, never a hang.\n        //    A latch holds every philosopher until all five have their LEFT fork; then every one of them\n        //    reaches right, and the detector reads the ring off the table while they are all stuck in it.\n        CountDownLatch wedge = new CountDownLatch(5);\n        NaivePolicy naive = new NaivePolicy(400, wedge);\n        DiningTable bad = new DiningTable(5, naive, 1).configure(Work.none(), Work.none());\n        long t1 = System.currentTimeMillis();\n        bad.start();\n        Cycle ring = watchFor(bad, 1_000);\n        boolean unwound = bad.awaitFinish(3_000);\n        long naiveMs = System.currentTimeMillis() - t1;\n        check(ring != null &amp;&amp; ring.size() == 5, &quot;the naive protocol forms a ring of 5: &quot; + ring);\n        check(naive.timeouts() &gt;= 1, &quot;at least one philosopher had to give up to break it: &quot; + naive.timeouts() + &quot; of 5 did&quot;);\n        check(naiveMs &gt;= 400, &quot;nobody could eat during the whole 400 ms grace window (run took &quot; + naiveMs + &quot; ms)&quot;);\n        check(unwound &amp;&amp; bad.allForksFree(), &quot;every philosopher returned and every fork went back on the table&quot;);\n        long abandoned = 0;\n        for (int i = 0; i &lt; 5; i++) abandoned += bad.seat(i).abandoned();\n        check(abandoned + bad.totalMeals() == 5, &quot;all 5 rounds ended as a meal or a named give-up, none still holding a fork: &quot;\n            + bad.totalMeals() + &quot; ate, &quot; + abandoned + &quot; gave up&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>6 &middot; It is three in the morning and the service has stopped. How would you know it is a deadlock?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two detectors, and neither of them is a fix. The JVM already knows who owns which ReentrantLock, so ThreadMXBean.findDeadlockedThreads() reports a genuine cycle rather than guessing from a timeout, and getThreadInfo names the threads and the lock each is blocked on -- that is exactly what jstack prints in a thread dump. The watchdog here polls it, prints the ring, and then interrupts everybody, which only works because every fork is taken with lockInterruptibly: a wedged philosopher throws, drops the fork it holds and unwinds. The second detector is the application's own: the wait-for graph built from two volatile ints, which also works for locks the JVM cannot see, such as a lease in Redis -- but it samples a moving picture, so it must see the SAME ring twice before it reports one, or it will cry wolf on a healthy table about once in forty runs. A test checks that direction too: forty samples of a healthy run, and nothing ever confirmed, because a detector that cries wolf gets switched off.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the real deadlock, and the watchdog that breaks it\n/**\n * The protocol with no grace timeout at all: left fork, then right fork, waiting forever. This is\n * the version that genuinely deadlocks, kept here (not in Main) because the only safe way to run it\n * is with a watchdog armed. lockInterruptibly is what makes the rescue possible: a wedged\n * philosopher can be interrupted, throws, drops the fork it holds, and unwinds.\n */\nfinal class TrueNaivePolicy implements ForkPolicy {\n    private final CountDownLatch wedge;\n\n    /** The wedge latch guarantees every philosopher holds a left fork before any reaches for a right one. */\n    TrueNaivePolicy(CountDownLatch wedge) { this.wedge = wedge; }\n\n    /** Left, then right, with no timeout: the circular wait, for real. */\n    @Override public void acquireBoth(Philosopher p) throws InterruptedException {\n        p.markWaiting(p.left().id());\n        p.left().pickUp(p.id());\n        if (wedge != null) { wedge.countDown(); wedge.await(1, TimeUnit.SECONDS); }\n        p.markWaiting(p.right().id());\n        try { p.right().pickUp(p.id()); }\n        catch (InterruptedException e) { p.left().putDown(p.id()); throw e; }   // the rescue path\n        finally { p.markWaiting(-1); }\n    }\n\n    /** Both forks go back. */\n    @Override public void releaseBoth(Philosopher p) { p.right().putDown(p.id()); p.left().putDown(p.id()); }\n}\n\n/**\n * The production answer to &quot;how would you know?&quot;: the JVM already tracks who owns which\n * ReentrantLock, so ThreadMXBean.findDeadlockedThreads() reports a real cycle rather than guessing\n * from a timeout. This watchdog polls it, prints the threads in the ring, and breaks them out.\n * It is a monitor, not a fix -- the fix is the acquisition policy on page 02, move 4.\n */\nfinal class DeadlockWatchdog implements Runnable {\n    private final DiningTable table;\n    private final long budgetMs, everyMs;\n    private volatile String report = &quot;no deadlock seen&quot;;\n    private volatile boolean fired = false;\n\n    /** Watch this table for budgetMs, sampling every everyMs. */\n    DeadlockWatchdog(DiningTable table, long budgetMs, long everyMs) {\n        this.table = table; this.budgetMs = budgetMs; this.everyMs = everyMs;\n    }\n\n    /** Poll the JVM; on a real cycle, name the threads and interrupt everybody so they unwind. */\n    @Override public void run() {\n        ThreadMXBean jvm = ManagementFactory.getThreadMXBean();\n        long end = System.currentTimeMillis() + budgetMs;\n        while (System.currentTimeMillis() &lt; end) {\n            long[] ids = jvm.findDeadlockedThreads();\n            if (ids != null &amp;&amp; ids.length &gt; 0) {\n                List&lt;String&gt; names = new ArrayList&lt;&gt;();\n                for (ThreadInfo ti : jvm.getThreadInfo(ids, true, true))\n                    names.add(ti.getThreadName() + &quot; blocked on &quot; + ti.getLockName()\n                              + &quot; owned by &quot; + ti.getLockOwnerName());\n                report = &quot;DEADLOCK: &quot; + names;\n                fired = true;\n                table.interruptAll();                        // the rescue: interruptible locks make this possible\n                return;\n            }\n            LockSupport.parkNanos(everyMs * 1_000_000L);\n        }\n        table.interruptAll();                                // backstop: never leave a run wedged, even undetected\n    }\n\n    /** True if the JVM reported a genuine cycle. */\n    boolean fired() { return fired; }\n\n    /** What it saw, in one line. */\n    String report() { return report; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; Does your fix cost you concurrency? Prove it, don&#x27;t assert it.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It does not, and the number is the peak count of philosophers eating at the same instant. The table increments a counter when a meal starts and decrements it when the meal ends, keeping the maximum, so any run reports what it actually achieved. With resource ordering and a three-millisecond meal the peak is two, which is the ceiling of the problem itself: five philosophers sharing five forks, two forks per meal, so floor(5/2) = 2. The same run with one big lock around the whole meal -- the fix somebody always proposes -- reports a peak of one and takes about 650 ms instead of about 380 ms for the same hundred and fifty meals. That comparison is the answer to \"why not just synchronize the table\", and it takes ten lines of test.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 5. the fix must keep the parallelism: ordering lets two eat at once, one big lock lets one.\n        DiningTable par = new DiningTable(5, new OrderedPolicy(), 30).configure(Work.sleepMs(1), Work.sleepMs(3));\n        long t5 = System.currentTimeMillis();\n        par.start();\n        par.awaitFinish(20_000);\n        long parMs = System.currentTimeMillis() - t5;\n        DiningTable serial = new DiningTable(5, new GlobalLockPolicy(), 30).configure(Work.sleepMs(1), Work.sleepMs(3));\n        long t5b = System.currentTimeMillis();\n        serial.start();\n        serial.awaitFinish(20_000);\n        long serialMs = System.currentTimeMillis() - t5b;\n        check(par.peakEating() &gt;= 2, &quot;resource ordering still runs &quot; + par.peakEating() + &quot; philosophers at once (&quot; + parMs + &quot; ms)&quot;);\n        check(serial.peakEating() == 1, &quot;one big lock &#x27;fixes&#x27; the deadlock by serialising everybody: peak 1 (&quot; + serialMs + &quot; ms)&quot;);\n        check(serialMs &gt; parMs, &quot;and it costs real time: &quot; + serialMs + &quot; ms against &quot; + parMs + &quot; ms for the same 150 meals&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>8 &middot; Prove that no philosopher starves.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Be careful here, because the honest answer is that deadlock-freedom and starvation-freedom are different properties and ordering only gives you the first. What you can do is make starvation unlikely and then measure it. Fair locks (new ReentrantLock(true)) hand a fork to the longest waiter instead of whoever happens to be running, and the arbitrator's semaphore is fair too, so the queue for a seat is in order. The measurement is an observer: it timestamps HUNGRY and EATING for each philosopher and reports meals, worst wait and total wait per seat, plus the min/max ratio of meals. The failure test runs the bounded version of the claim -- five philosophers, four hundred meals each, fair forks, all of them finished -- and the extension prints the spread over five hundred meals each with a one-millisecond meal.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: fairness, measured rather than asserted\n/**\n * &quot;Prove nobody starves.&quot; You cannot prove it from the code, so measure it: this observer records\n * when each philosopher became hungry and how long it stayed that way, and reports the spread.\n * It is an observer, so it runs after the forks are back and can never slow a meal down.\n */\nfinal class FairnessMetrics implements DiningObserver {\n    private final long[] hungrySince, worstWaitMs, totalWaitMs, meals;\n\n    /** One row per philosopher. */\n    FairnessMetrics(int n) {\n        hungrySince = new long[n]; worstWaitMs = new long[n]; totalWaitMs = new long[n]; meals = new long[n];\n        Arrays.fill(hungrySince, -1);\n    }\n\n    /** Start the stopwatch on HUNGRY, stop it on EATING, and count the meal. */\n    @Override public synchronized void onState(int id, PhilosopherState state, long atMs) {\n        if (state == PhilosopherState.HUNGRY) hungrySince[id] = atMs;\n        else if (state == PhilosopherState.EATING &amp;&amp; hungrySince[id] &gt;= 0) {\n            long waited = atMs - hungrySince[id];\n            totalWaitMs[id] += waited;\n            worstWaitMs[id] = Math.max(worstWaitMs[id], waited);\n            meals[id]++;\n            hungrySince[id] = -1;\n        }\n    }\n\n    /** meals, worst wait and total wait per philosopher, plus the fairness ratio min/max meals. */\n    synchronized String report() {\n        long min = Long.MAX_VALUE, max = 0;\n        StringBuilder sb = new StringBuilder();\n        for (int i = 0; i &lt; meals.length; i++) {\n            min = Math.min(min, meals[i]); max = Math.max(max, meals[i]);\n            sb.append(String.format(&quot;p%d meals=%d worst wait=%dms total=%dms; &quot;, i, meals[i], worstWaitMs[i], totalWaitMs[i]));\n        }\n        sb.append(String.format(&quot;fairness min/max = %.2f&quot;, max == 0 ? 1.0 : (double) min / max));\n        return sb.toString();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>9 &middot; A philosopher throws up in the middle of a meal. What is the state of the table?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was, minus one meal. The meal happens inside a try whose finally returns both forks through the policy, so an exception, an interrupt or a timeout all leave the forks on the table and the neighbours free to eat. The counter is incremented after the meal returns normally, never before, so a failed meal is not counted as eaten -- it is counted as an error on that philosopher. The test makes p2 throw on all two hundred of its rounds and then checks three things: every fork is free at the end, p2 has two hundred errors and zero meals, and its two neighbours still ate two hundred times each, which is the part that proves one broken philosopher cannot poison the table.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Think, get both forks, eat, put both back -- and the try/finally is the load-bearing part:\n     * whatever happens while eating, both forks go back to the table in the same breath.\n     */\n    @Override public void run() {\n        try { table.awaitStart(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }\n        for (int r = 0; r &lt; rounds &amp;&amp; !Thread.currentThread().isInterrupted(); r++) {\n            try {\n                table.think().perform(id);\n                set(PhilosopherState.HUNGRY);\n                long t0 = System.nanoTime();\n                policy.acquireBoth(this);                     // nothing is &quot;half held&quot;: either both, or none\n                waitNanos += System.nanoTime() - t0;\n                try {\n                    set(PhilosopherState.EATING);\n                    table.enterMeal();\n                    table.eat().perform(id);\n                    meals++;                                  // counted only after a whole meal, never before\n                } finally {\n                    table.exitMeal();\n                    policy.releaseBoth(this);                 // the forks go back even if eating threw\n                    set(PhilosopherState.THINKING);\n                }\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();           // a supervisor is stopping us: leave, forks already returned\n                break;\n            } catch (WouldDeadlock e) {\n                abandoned++;                                  // the naive policy gave up rather than sit in the ring\n            } catch (RuntimeException e) {\n                errors++;                                     // eating threw; the finally above already returned both forks\n            }\n        }\n        set(PhilosopherState.DONE);\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Stop the dinner cleanly. Interrupting everybody is not a shutdown protocol.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The philosopher's loop checks a flag once per round, and because thinking is already handed in, the flag lives in the work rather than in the actor: stoppable(work) wraps any Work and throws when the flag is cleared, which ends that philosopher's loop between meals instead of in the middle of one. Stop then waits for everybody with a deadline and only escalates to interruptAll if somebody has not come back, which is the difference between a protocol and a hammer. Nothing in Philosopher or DiningTable changes; the wrapper is a Decorator, and it is the same trick as the timeout policy -- add behaviour to a rule that was already an interface.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a graceful stop instead of an interrupt\n/**\n * &quot;Interrupting is how you break a wedged run; how do you stop a healthy one?&quot; With a flag the\n * philosopher checks once per round -- and because thinking is handed in, the flag lives in the\n * work, not in the actor. Stopping ends the round in progress, never a meal half way through, and\n * only escalates to interrupt if somebody does not come back in time.\n */\nfinal class GracefulShutdown {\n    private final DiningTable table;\n    private volatile boolean running = true;\n    private final AtomicLong roundsSeen = new AtomicLong();\n\n    /** Wrap a table; hand table.configure() the work returned by stoppable(). */\n    GracefulShutdown(DiningTable table) { this.table = table; }\n\n    /** Wrap any work so that it ends the philosopher&#x27;s loop once stop() has been called. */\n    Work stoppable(Work base) {\n        return id -&gt; {\n            roundsSeen.incrementAndGet();\n            if (!running) throw new InterruptedException(&quot;dinner is over&quot;);   // a clean exit, between meals\n            base.perform(id);\n        };\n    }\n\n    /** Ask everybody to stop after the round they are in; then wait, and only then escalate. */\n    boolean stop(long graceMs) throws InterruptedException {\n        running = false;\n        if (table.awaitFinish(graceMs)) return true;\n        table.interruptAll();                                // the escalation, not the plan\n        return table.awaitFinish(graceMs);\n    }\n\n    /** How many rounds started in total: what the flag was checked against. */\n    long roundsSeen() { return roundsSeen.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; Give up instead of blocking: try for the forks and come back later.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>tryLock with a timeout on each fork, and if the second one does not come, put the first back and retry after a pause. It cannot deadlock, because nobody ever holds a fork while waiting for ever -- but it can livelock: five philosophers dropping and grabbing in perfect step, busy and making no progress, which is why the pause is random rather than fixed. The price is real and worth quoting: the same ten thousand meals took around four hundred milliseconds and threw away about a hundred and eighty half-acquisitions, against about fifteen milliseconds for ordering. Use it when you cannot order the resources and cannot afford a central waiter.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The fix for when there is no order and no waiter: try for both forks, and if the second does not\n * come, put the first one back and retry after a RANDOM pause. It cannot deadlock, because nobody\n * ever holds a fork while waiting forever -- but without the randomness it can livelock, with\n * everybody dropping and grabbing in step, busy and making no progress.\n */\nfinal class TimeoutBackoffPolicy implements ForkPolicy {\n    private final long tryMs;\n    private final int maxBackoffMicros;\n    private final AtomicLong retries = new AtomicLong();\n\n    /** tryMs = how long to wait for each fork; maxBackoffMicros = the upper end of the random pause. */\n    TimeoutBackoffPolicy(long tryMs, int maxBackoffMicros) { this.tryMs = tryMs; this.maxBackoffMicros = maxBackoffMicros; }\n\n    /** Drop and retry until both forks are in hand; an interrupt is the only way out. */\n    @Override public void acquireBoth(Philosopher p) throws InterruptedException {\n        while (true) {\n            if (Thread.interrupted()) throw new InterruptedException();\n            p.markWaiting(p.left().id());\n            if (p.left().tryPickUp(p.id(), tryMs)) {\n                p.markWaiting(p.right().id());\n                if (p.right().tryPickUp(p.id(), tryMs)) { p.markWaiting(-1); return; }\n                p.left().putDown(p.id());\n            }\n            p.markWaiting(-1);\n            retries.incrementAndGet();\n            LockSupport.parkNanos(1_000L * (1 + ThreadLocalRandom.current().nextInt(maxBackoffMicros)));\n        }\n    }\n\n    /** Both forks go back. */\n    @Override public void releaseBoth(Philosopher p) { p.right().putDown(p.id()); p.left().putDown(p.id()); }\n\n    /** How many times somebody dropped a fork and tried again: the price of this policy. */\n    long retries() { return retries.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; This is a toy. Where does this actually bite in production code?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Anywhere a thread takes two locks. The classic is a transfer between two accounts: lock the payer, lock the payee, move the money -- and two opposite transfers at the same instant are the philosophers' ring with n = 2. The fix is the same move: take the locks in a global order, here the account id, with a tie-break lock for the rare case of equal ids (which happens for real when the order is System.identityHashCode). The demo runs a hundred thousand opposing transfers and never wedges. The same helper generalises to k resources: sort them by id, take them in that order, release in reverse -- that is the answer when a philosopher needs a fork, a knife and a plate.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the same trick anywhere two locks are taken -- bank transfers\n/**\n * Dining philosophers is not a puzzle about cutlery: it is every place where a thread takes two\n * locks. A transfer takes the payer&#x27;s lock and the payee&#x27;s lock, and two opposite transfers at the\n * same instant are exactly the circular wait. The cure is the same: a global order, here the\n * account number, with a tie-break lock for the case where two ids are equal.\n */\nfinal class Account {\n    private final int id;\n    private long balance;\n    final ReentrantLock lock = new ReentrantLock();\n\n    /** An account with an opening balance. */\n    Account(int id, long balance) { this.id = id; this.balance = balance; }\n\n    /** The global order the locks are taken in. */\n    int id() { return id; }\n\n    /** The balance; read under the account&#x27;s lock. */\n    long balance() { return balance; }\n\n    /** Move money; only ever called with this account&#x27;s lock held. */\n    void add(long amount) { balance += amount; }\n}\n\n/**\n * Ordered locking for any two resources, and the worked example everybody meets in production.\n */\nfinal class LockOrdering {\n    private static final ReentrantLock TIE_BREAK = new ReentrantLock();\n\n    private LockOrdering() { }\n\n    /** Transfer, taking the two account locks in id order so two opposite transfers cannot deadlock. */\n    static boolean transfer(Account from, Account to, long amount) {\n        if (from == to) return false;\n        Account first = from.id() &lt; to.id() ? from : to;\n        Account second = first == from ? to : from;\n        if (from.id() == to.id()) {                          // equal ids (or identity hashes): one global tie-break lock\n            TIE_BREAK.lock();\n            try { return move(from, to, amount); } finally { TIE_BREAK.unlock(); }\n        }\n        first.lock.lock();\n        try {\n            second.lock.lock();\n            try { return move(from, to, amount); } finally { second.lock.unlock(); }\n        } finally { first.lock.unlock(); }\n    }\n\n    /** The money move itself, with both locks already held. */\n    private static boolean move(Account from, Account to, long amount) {\n        if (from.balance() &lt; amount) return false;\n        from.add(-amount);\n        to.add(amount);\n        return true;\n    }\n\n    /** The general form: take any number of locks in id order, run the body, release in reverse. */\n    static void withAll(List&lt;Fork&gt; forks, int by, Runnable body) throws InterruptedException {\n        List&lt;Fork&gt; order = new ArrayList&lt;&gt;(forks);\n        order.sort((a, b) -&gt; Integer.compare(a.id(), b.id()));\n        int taken = 0;\n        try {\n            for (Fork f : order) { f.pickUp(by); taken++; }\n            body.run();\n        } finally {\n            for (int i = taken - 1; i &gt;= 0; i--) order.get(i).putDown(by);\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Now the forks live in Redis and the philosophers are on different machines.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The protocol survives the move and the guarantee does not. A fork becomes a key with a lease: SET key owner NX PX leaseMs, released with a compare-and-delete so you can only free your own. Philosopher and the policies take an interface with pickUp and putDown, so neither changes. What breaks is the assumption underneath everything on this page: a ReentrantLock is held until you release it, but a lease expires on its own -- the demo shows p2 taking a fork that p1 still believes it is holding. That is why a distributed lock is only safe when every write it guards carries a fencing token that the storage rejects if a newer holder has appeared.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: forks in another process -- the same protocol, one level up\n/**\n * A stand-in for Redis: a key-value store whose SET-if-absent is atomic and whose keys expire.\n * It is here to make one point honestly -- the protocol survives the move off one JVM, but the\n * guarantee weakens, because a lease can expire while its holder still believes it holds the fork.\n */\nfinal class FakeRedis {\n    private final ConcurrentHashMap&lt;String, long[]&gt; keys = new ConcurrentHashMap&lt;&gt;();   // key -&gt; [owner, expiresAtMs]\n    private final Clock clock;\n\n    /** Injected clock, so a test can expire a lease without sleeping. */\n    FakeRedis(Clock clock) { this.clock = clock; }\n\n    /** SET key owner NX PX lease: true only if the key was free or its lease had expired. */\n    boolean setIfAbsent(String key, int owner, long leaseMs) {\n        long now = clock.nowMs();\n        long[] prev = keys.compute(key, (k, v) -&gt; (v == null || v[1] &lt;= now) ? new long[]{ owner, now + leaseMs } : v);\n        return prev[0] == owner &amp;&amp; prev[1] &gt; now;\n    }\n\n    /** Release only if you still hold it (the Redis Lua compare-and-delete, not a bare DEL). */\n    boolean release(String key, int owner) {\n        long[] v = keys.get(key);\n        if (v == null || v[0] != owner) return false;\n        return keys.remove(key, v);\n    }\n\n    /** Who the store thinks holds the key right now, or -1. */\n    int owner(String key) {\n        long[] v = keys.get(key);\n        return v == null || v[1] &lt;= clock.nowMs() ? -1 : (int) v[0];\n    }\n}\n\n/**\n * A fork that lives in the store instead of in this JVM. Same two methods as Fork, which is the\n * point: Philosopher and the policies would take an interface with pickUp/putDown and neither\n * would change. What DOES change is the failure model: a lease that expires hands the fork to\n * somebody else while the first holder is still eating, so a real system needs a fencing token.\n */\nfinal class LeasedFork {\n    private final String key;\n    private final FakeRedis store;\n    private final long leaseMs;\n\n    /** A fork identified by a key in the shared store. */\n    LeasedFork(int id, FakeRedis store, long leaseMs) { this.key = &quot;fork:&quot; + id; this.store = store; this.leaseMs = leaseMs; }\n\n    /** Poll for the key until the deadline; true means this philosopher holds the lease now. */\n    boolean pickUp(int by, long waitMs) throws InterruptedException {\n        long end = System.currentTimeMillis() + waitMs;\n        do {\n            if (store.setIfAbsent(key, by, leaseMs)) return true;\n            Thread.sleep(2);\n        } while (System.currentTimeMillis() &lt; end);\n        return false;\n    }\n\n    /** Give the lease back if it is still ours. */\n    void putDown(int by) { if (store.owner(key) == by) store.release(key, by); }\n\n    /** Who the store says holds it. */\n    int owner() { return store.owner(key); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>14 &middot; Show me who is eating and how many meals each has had, without slowing anybody down.</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Every number is already a field: the philosopher's state and meal count are volatile, written by its own thread, and the fork's owner is volatile too. So the monitor is a read of n fields, takes no lock, blocks nobody and cannot take a fork; a snapshot is an O(n) copy. That is the whole reason the state lives in a field rather than in a map the table would have to guard: a supervisor asking \"who is hungry?\" a thousand times a second must not be able to slow a meal down by even a microsecond.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the read-only view a supervisor wants\n/**\n * Metrics without touching the run: who is hungry, how many meals each has had, how many are\n * eating right now. Every number is an O(1) read of a volatile field, so asking costs nothing and\n * cannot slow a philosopher down or take a fork.\n */\nfinal class TableMonitor {\n    private final DiningTable table;\n\n    /** Watch a table without being part of it. */\n    TableMonitor(DiningTable table) { this.table = table; }\n\n    /** One line: states, meals, and the peak parallelism so far. */\n    String line() {\n        Snapshot s = table.snapshot();\n        StringBuilder sb = new StringBuilder();\n        int hungry = 0, eating = 0;\n        for (int i = 0; i &lt; table.size(); i++) {\n            if (s.states()[i] == PhilosopherState.HUNGRY) hungry++;\n            if (s.states()[i] == PhilosopherState.EATING) eating++;\n            sb.append(String.format(&quot;p%d=%s(%d) &quot;, i, s.states()[i], s.meals()[i]));\n        }\n        Cycle c = table.findCycle();\n        return sb + String.format(&quot;| hungry=%d eating=%d total=%d peak=%d ring=%s&quot;,\n                hungry, eating, s.totalMeals(), s.peakEating(), c == null ? &quot;none&quot; : c.size() + &quot; deep&quot;);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Where does time come from, and how do you test a five-second meal inside a three-second test suite?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing in the system reads the wall clock by itself. Observers are stamped with an injected Clock, so a test can hand in a counter and control every timestamp -- that is how the leased-fork demo expires a lease without sleeping for a hundred milliseconds. Meals and thinking are injected too, as Work, so a test picks instant meals when it wants raw lock traffic, a three-millisecond meal when it wants to measure parallelism, and a five-second meal when it wants somebody stuck. The five-second test finishes in milliseconds because it does not wait for the meal: it interrupts the table and asserts that everybody unwound and every fork went back.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Where time comes from. Injected, so a test can stamp events with any instant it likes. */\ninterface Clock { long nowMs(); }\n\n// on the table: handed in, defaulted, never read from the wall clock inside a method\nprivate Clock clock = System::currentTimeMillis;\nDiningTable setClock(Clock c) { clock = c; return this; }\n\n// in a test: pick the instant, then move it -- no sleeping\nlong[] now = { 1_700_000_000_000L };\nFakeRedis redis = new FakeRedis(() -&gt; now[0]);\nLeasedFork remote = new LeasedFork(2, redis, 100);\nremote.pickUp(1, 50);                                  // p1 holds the lease\nnow[0] += 101;                                         // the lease expires, without waiting for it\nremote.pickUp(2, 30);                                  // p2 takes a fork p1 still thinks it holds\n\n// and a five-second meal, tested in milliseconds\nDiningTable slow = new DiningTable(5, new OrderedPolicy(), 50).configure(Work.none(), Work.sleepMs(5_000));\nslow.start(); Thread.sleep(50); slow.interruptAll();\ncheck(slow.awaitFinish(3_000) &amp;&amp; slow.allForksFree(), &quot;interrupt unwound it and every fork went back&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Which pattern is where, and what did NOT earn a place?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Moves 10 and 11 have the full tables; what matters in the room is that you can say none of it was chosen up front. Strategy came out of move 3 and is the spine: seven deadlock answers, seven files, no edits to Philosopher or DiningTable. Fork is the textbook monitor object -- the data and the lock that guards it in one class -- and that is the reason \"a boolean plus a lock\" is the wrong shape rather than merely a clumsy one. The interesting half is the refusals: Singleton earned nothing, because the table is handed to its caller and a test builds four of them in four lines; Factory earns its name the day policies arrive from configuration and not before; and Builder never does, because a table is three required fields. Saying \"not yet\" and \"never\" about a pattern is what separates somebody who has used them from somebody who has read the book.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: the one rule that decides whether this program deadlocks, behind an interface\ninterface ForkPolicy { void acquireBoth(Philosopher p) throws InterruptedException; void releaseBoth(Philosopher p); }\nnew DiningTable(5, new ArbitratorPolicy(5), 1_000).configure(Work.none(), Work.sleepMs(3));\n\n// Monitor object: the fork IS its lock, so nothing can touch it without holding it\nfinal class Fork { private final ReentrantLock lock; private volatile int owner = -1; }\n\n// Observer: announced after the forks are back, and a broken listener cannot break dinner\nfor (DiningObserver o : observers) { try { o.onState(id, s, at); } catch (RuntimeException ignored) { } }\n\n// Decorator: add the stop check to any Work without touching the philosopher&#x27;s loop\nWork stoppable(Work base) { return id -&gt; { if (!running) throw new InterruptedException(&quot;dinner is over&quot;); base.perform(id); }; }\n\n// Singleton: nothing. Factory: not yet -- one line at the call site is the whole construction.\n// Builder: never -- a table is three required fields.\nForkPolicy p = new OrderedPolicy();\nDiningTable t = new DiningTable(5, p, 2_000);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.List;\nimport java.util.concurrent.CopyOnWriteArrayList;\nimport java.util.concurrent.CountDownLatch;\nimport java.util.concurrent.Semaphore;\nimport java.util.concurrent.ThreadLocalRandom;\nimport java.util.concurrent.TimeUnit;\nimport java.util.concurrent.atomic.AtomicInteger;\nimport java.util.concurrent.atomic.AtomicLong;\nimport java.util.concurrent.locks.LockSupport;\nimport java.util.concurrent.locks.ReentrantLock;\n\n/**\n * Where time comes from. Injected, so a test can stamp events with any instant it likes\n * and nothing in the system reads the wall clock by itself.\n */\ninterface Clock {\n    /** The current instant in milliseconds. */\n    long nowMs();\n}\n\n/**\n * The life of one philosopher. THINKING is the only state in which it holds nothing;\n * HUNGRY means it is reaching (and may be blocked); EATING means it holds BOTH forks.\n */\nenum PhilosopherState { THINKING, HUNGRY, EATING, DONE }\n\n/**\n * A bounded piece of work standing in for thinking or eating. Handed in, so a test can make\n * a meal instant, slow, or a meal that throws half way through.\n */\ninterface Work {\n    /** Do the work for one philosopher; may be interrupted while it waits. */\n    void perform(int philosopherId) throws InterruptedException;\n\n    /** Work that sleeps for a fixed number of milliseconds. */\n    static Work sleepMs(long ms) { return id -> { if (ms > 0) Thread.sleep(ms); }; }\n\n    /** Work that returns immediately: used by the tests that want raw lock traffic. */\n    static Work none() { return id -> { }; }\n}\n\n/**\n * Thrown by a policy that refuses to wait any longer for the second fork. It is how the naive\n * protocol is demonstrated without hanging a JVM: the philosopher gives the fork it holds back\n * and reports the circular wait instead of sitting in it forever.\n */\nfinal class WouldDeadlock extends RuntimeException {\n    private final int philosopherId, forkId;\n\n    /** Records which philosopher gave up and which fork it was reaching for. */\n    WouldDeadlock(int philosopherId, int forkId) {\n        super(\"philosopher \" + philosopherId + \" gave up waiting for fork \" + forkId);\n        this.philosopherId = philosopherId;\n        this.forkId = forkId;\n    }\n\n    /** The philosopher that gave up. */\n    int philosopherId() { return philosopherId; }\n\n    /** The fork it could not get. */\n    int forkId() { return forkId; }\n}\n\n/**\n * A fork: one thing that exactly one philosopher may hold at a time, which is the definition of\n * a mutual-exclusion lock, so it IS a lock and not a boolean that would then need its own lock.\n * The lock is taken interruptibly so a supervisor can rescue a wedged run; the owner id is\n * published so a detector can see who holds what; and \"hands\" counts holders so the tests can\n * prove the invariant (never more than one) instead of trusting it.\n */\nfinal class Fork {\n    private final int id;\n    private final ReentrantLock lock;\n    private volatile int owner = -1;\n    private final AtomicInteger hands = new AtomicInteger();\n    private volatile boolean violated = false;\n\n    /** A fork with an id; fair = the lock hands itself to the longest waiter (slower, starvation-free). */\n    Fork(int id, boolean fair) { this.id = id; this.lock = new ReentrantLock(fair); }\n\n    /** The fork's number, 0..n-1 around the table. This number is what resource ordering orders by. */\n    int id() { return id; }\n\n    /** Take the fork, waiting as long as it takes; throws if the thread is interrupted while waiting. */\n    void pickUp(int by) throws InterruptedException { lock.lockInterruptibly(); claim(by); }\n\n    /** Take the fork if it comes free within the timeout; false means somebody else still holds it. */\n    boolean tryPickUp(int by, long ms) throws InterruptedException {\n        if (!lock.tryLock(ms, TimeUnit.MILLISECONDS)) return false;\n        claim(by);\n        return true;\n    }\n\n    /** Record the new holder and count the hands on this fork: two hands would break the invariant. */\n    private void claim(int by) {\n        owner = by;\n        if (hands.incrementAndGet() != 1) violated = true;\n    }\n\n    /**\n     * Put the fork back. Two guards, and both matter: the lock may only be released by the thread\n     * that took it, and the caller must be the recorded owner. A putDown from anybody else is a\n     * harmless no-op rather than an IllegalMonitorStateException, so a clumsy caller -- or a\n     * finally that runs after a failed acquire -- can never free somebody else's fork.\n     */\n    void putDown(int by) {\n        if (owner != by || !lock.isHeldByCurrentThread()) return;\n        hands.decrementAndGet();\n        owner = -1;\n        lock.unlock();\n    }\n\n    /** Who holds this fork right now, or -1 if it is on the table. Read by the deadlock detector. */\n    int owner() { return owner; }\n\n    /** True when nobody holds the fork. */\n    boolean isFree() { return !lock.isLocked(); }\n\n    /** True if two philosophers were ever counted holding this fork at once: the invariant broken. */\n    boolean violated() { return violated; }\n}\n\n/**\n * The one rule that decides whether this program deadlocks: how a philosopher gets BOTH forks.\n * Everything else in the system is fixed, so every deadlock-avoidance idea is a new implementation\n * of this interface, handed to the table, with Philosopher and DiningTable untouched (Strategy).\n */\ninterface ForkPolicy {\n    /** Acquire both of the philosopher's forks, or acquire neither. Throws if interrupted while waiting. */\n    void acquireBoth(Philosopher p) throws InterruptedException;\n\n    /** Return both forks (and anything else the policy took, such as a seat). Never throws. */\n    void releaseBoth(Philosopher p);\n\n    /** The policy's name, for printing. */\n    default String name() { return getClass().getSimpleName(); }\n}\n\n/**\n * The obvious wrong protocol: left fork, then right fork. If every philosopher takes its left fork\n * in the same instant, every one of them holds one fork and waits for a neighbour's: a circular wait.\n * Two things make it safe to SHOW: an optional wedge latch that forces exactly that instant, and a\n * grace timeout on the second fork, after which the philosopher hands its first fork back and\n * reports the cycle instead of hanging. The timeouts are the evidence, not a fix.\n */\nfinal class NaivePolicy implements ForkPolicy {\n    private final long graceMs;\n    private final CountDownLatch wedge;\n    private final AtomicInteger timeouts = new AtomicInteger();\n\n    /** graceMs = how long to wait for the second fork before calling it a circular wait. */\n    NaivePolicy(long graceMs) { this(graceMs, null); }\n\n    /** With a wedge latch sized to the table: every philosopher holds its left fork before any reaches right. */\n    NaivePolicy(long graceMs, CountDownLatch wedge) { this.graceMs = graceMs; this.wedge = wedge; }\n\n    /** Left, then right -- and the gap between those two lines is where the deadlock lives. */\n    @Override public void acquireBoth(Philosopher p) throws InterruptedException {\n        p.markWaiting(p.left().id());\n        p.left().pickUp(p.id());\n        if (wedge != null) { wedge.countDown(); wedge.await(1, TimeUnit.SECONDS); }\n        p.markWaiting(p.right().id());\n        if (!p.right().tryPickUp(p.id(), graceMs)) {\n            p.left().putDown(p.id());\n            p.markWaiting(-1);\n            timeouts.incrementAndGet();\n            throw new WouldDeadlock(p.id(), p.right().id());\n        }\n        p.markWaiting(-1);\n    }\n\n    /** Both forks go back; the order of release never matters, only the order of acquisition does. */\n    @Override public void releaseBoth(Philosopher p) { p.right().putDown(p.id()); p.left().putDown(p.id()); }\n\n    /** How many times a philosopher sat in a circular wait long enough to give up. */\n    int timeouts() { return timeouts.get(); }\n}\n\n/**\n * The fix that costs one comparison: put a global order on the forks and always take the\n * lower-numbered one first. A cycle needs somebody holding a high fork and waiting for a low one\n * while somebody else does the reverse; if everybody takes low first, that pattern cannot form,\n * so the circular wait is structurally impossible. No waiter, no timeout, no retry.\n */\nfinal class OrderedPolicy implements ForkPolicy {\n    /** Lower id first, higher id second, always, for every philosopher at the table. */\n    @Override public void acquireBoth(Philosopher p) throws InterruptedException {\n        Fork first = p.left().id() < p.right().id() ? p.left() : p.right();\n        Fork second = first == p.left() ? p.right() : p.left();\n        p.markWaiting(first.id());\n        first.pickUp(p.id());\n        try {\n            p.markWaiting(second.id());\n            second.pickUp(p.id());\n        } catch (InterruptedException e) {\n            first.putDown(p.id());\n            throw e;\n        } finally {\n            p.markWaiting(-1);\n        }\n    }\n\n    /** Both forks go back. */\n    @Override public void releaseBoth(Philosopher p) { p.right().putDown(p.id()); p.left().putDown(p.id()); }\n}\n\n/**\n * The fix for when you are not allowed to renumber the resources: a waiter seats at most n-1\n * philosophers at a time. A full cycle needs all n reaching at once, so with one seat missing at\n * least one philosopher always gets both forks. The semaphore is fair, so the queue for a seat\n * is first-come-first-served and nobody is skipped forever.\n */\nfinal class ArbitratorPolicy implements ForkPolicy {\n    private final Semaphore seats;\n    private final int capacity;\n\n    /** n = the number of philosophers; the waiter hands out n-1 seats. */\n    ArbitratorPolicy(int n) { this.capacity = n - 1; this.seats = new Semaphore(capacity, true); }\n\n    /** Take a seat first, then both forks; if anything fails, the seat goes back with the forks. */\n    @Override public void acquireBoth(Philosopher p) throws InterruptedException {\n        seats.acquire();\n        boolean ok = false;\n        try {\n            p.markWaiting(p.left().id());\n            p.left().pickUp(p.id());\n            try {\n                p.markWaiting(p.right().id());\n                p.right().pickUp(p.id());\n                ok = true;\n            } catch (InterruptedException e) {\n                p.left().putDown(p.id());\n                throw e;\n            }\n        } finally {\n            p.markWaiting(-1);\n            if (!ok) seats.release();\n        }\n    }\n\n    /** Both forks, then the seat -- in that order, so a freed seat always comes with free forks. */\n    @Override public void releaseBoth(Philosopher p) {\n        p.right().putDown(p.id());\n        p.left().putDown(p.id());\n        seats.release();\n    }\n\n    /** Seats currently free; must be back to n-1 when dinner is over. */\n    int freeSeats() { return seats.availablePermits(); }\n\n    /** How many may reach for forks at once. */\n    int capacity() { return capacity; }\n}\n\n/**\n * The fix for when there is no order and no waiter: try for both forks, and if the second does not\n * come, put the first one back and retry after a RANDOM pause. It cannot deadlock, because nobody\n * ever holds a fork while waiting forever -- but without the randomness it can livelock, with\n * everybody dropping and grabbing in step, busy and making no progress.\n */\nfinal class TimeoutBackoffPolicy implements ForkPolicy {\n    private final long tryMs;\n    private final int maxBackoffMicros;\n    private final AtomicLong retries = new AtomicLong();\n\n    /** tryMs = how long to wait for each fork; maxBackoffMicros = the upper end of the random pause. */\n    TimeoutBackoffPolicy(long tryMs, int maxBackoffMicros) { this.tryMs = tryMs; this.maxBackoffMicros = maxBackoffMicros; }\n\n    /** Drop and retry until both forks are in hand; an interrupt is the only way out. */\n    @Override public void acquireBoth(Philosopher p) throws InterruptedException {\n        while (true) {\n            if (Thread.interrupted()) throw new InterruptedException();\n            p.markWaiting(p.left().id());\n            if (p.left().tryPickUp(p.id(), tryMs)) {\n                p.markWaiting(p.right().id());\n                if (p.right().tryPickUp(p.id(), tryMs)) { p.markWaiting(-1); return; }\n                p.left().putDown(p.id());\n            }\n            p.markWaiting(-1);\n            retries.incrementAndGet();\n            LockSupport.parkNanos(1_000L * (1 + ThreadLocalRandom.current().nextInt(maxBackoffMicros)));\n        }\n    }\n\n    /** Both forks go back. */\n    @Override public void releaseBoth(Philosopher p) { p.right().putDown(p.id()); p.left().putDown(p.id()); }\n\n    /** How many times somebody dropped a fork and tried again: the price of this policy. */\n    long retries() { return retries.get(); }\n}\n\n/**\n * The junior \"fix\": one big lock around the whole meal. It cannot deadlock, because there is only\n * one lock -- and it cannot run two philosophers at once either, which is the point of the problem.\n * It is here so a test can measure the difference instead of arguing about it.\n */\nfinal class GlobalLockPolicy implements ForkPolicy {\n    private final ReentrantLock table = new ReentrantLock();\n\n    /** One lock for the whole table: correct, and completely serial. */\n    @Override public void acquireBoth(Philosopher p) throws InterruptedException {\n        table.lockInterruptibly();\n        p.left().pickUp(p.id());\n        p.right().pickUp(p.id());\n    }\n\n    /** Forks back, then the table lock. */\n    @Override public void releaseBoth(Philosopher p) {\n        p.right().putDown(p.id());\n        p.left().putDown(p.id());\n        if (table.isHeldByCurrentThread()) table.unlock();\n    }\n}\n\n/**\n * Somebody who wants

                     // one edge per philosopher: i waits for the holder of the fork it wants\n            int want = seats[i].waitingFor();\n            if (want < 0) continue;\n            int holder = forks[want].owner();\n            if (holder >= 0 && holder != i) { next[i] = holder; via[i] = want; }\n        }\n        for (int start = 0; start < n; start++) {           // walk forward from each philosopher; coming back to the start is a ring\n            boolean[] seen = new boolean[n];\n            List<Integer> path = new ArrayList<>(), waited = new ArrayList<>();\n            int at = start;\n            while (at >= 0 && !seen[at]) { seen[at] = true; path.add(at); waited.add(via[at]); at = next[at]; }\n            if (at == start && path.size() >= 2) return new Cycle(List.copyOf(path), List.copyOf(waited));\n        }\n        return null;\n    }\n}\n\n/**\n * One philosopher: a thread that thinks, gets both forks, eats, puts both back, for a fixed number\n * of rounds. It knows nothing about ordering, waiters or timeouts -- it delegates \"get both forks\"\n * to the policy it was handed, which is why a new avoidance rule never touches this class.\n */\nfinal class Philosopher implements Runnable {\n    private final int id;\n    private final Fork left, right;\n    private final ForkPolicy policy;\n    private final DiningTable table;\n    private final int rounds;\n    private volatile PhilosopherState state = PhilosopherState.THINKING;\n    private volatile int waitingFor = -1;\n    private volatile long meals, abandoned, errors, waitNanos;\n\n    /** Seated by the table with its two neighbouring forks and the one shared policy. */\n    Philosopher(int id, Fork left, Fork right, ForkPolicy policy, DiningTable table, int rounds) {\n        this.id = id; this.left = left; this.right = right; this.policy = policy; this.table = table; this.rounds = rounds;\n    }\n\n    /** The philosopher's seat number. */\n    int id() { return id; }\n\n    /** The fork on its left (fork i for philosopher i). */\n    Fork left() { return left; }\n\n    /** The fork on its right (fork (i+1) mod n). */\n    Fork right() { return right; }\n\n    /** What it is doing right now. */\n    PhilosopherState state() { return state; }\n\n    /** The fork it is reaching for right now, or -1: the detector's only input from this thread. */\n    int waitingFor() { return waitingFor; }\n\n    /** Published by the policy before it blocks, so the detector can see the reach. */\n    void markWaiting(int forkId) { waitingFor = forkId; }\n\n    /** Meals finished. Written only by this thread; read after a join, which makes it visible. */\n    long meals() { return meals; }\n\n    /** Rounds abandoned because the policy refused to wait any longer (the naive demonstration). */\n    long abandoned() { return abandoned; }\n\n    /** Rounds where eating itself threw; the forks still went back. */\n    long errors() { return errors; }\n\n    /** Total time spent hungry, in milliseconds. */\n    long waitMs() { return waitNanos / 1_000_000L; }\n\n    /**\n     * Think, get both forks, eat, put both back -- and the try/finally is the load-bearing part:\n     * whatever happens while eating, both forks go back to the table in the same breath.\n     */\n    @Override public void run() {\n        try { table.awaitStart(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }\n        for (int r = 0; r < rounds && !Thread.currentThread().isInterrupted(); r++) {\n            try {\n                table.think().perform(id);\n                set(PhilosopherState.HUNGRY);\n                long t0 = System.nanoTime();\n                policy.acquireBoth(this);                     // nothing is \"half held\": either both, or none\n                waitNanos += System.nanoTime() - t0;\n                try {\n                    set(PhilosopherState.EATING);\n                    table.enterMeal();\n                    table.eat().perform(id);\n                    meals++;                                  // counted only after a whole meal, never before\n                } finally {\n                    table.exitMeal();\n                    policy.releaseBoth(this);                 // the forks go back even if eating threw\n                    set(PhilosopherState.THINKING);\n                }\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();           // a supervisor is stopping us: leave, forks already returned\n                break;\n            } catch (WouldDeadlock e) {\n                abandoned++;                                  // the naive policy gave up rather than sit in the ring\n            } catch (RuntimeException e) {\n                errors++;                                     // eating threw; the finally above already returned both forks\n            }\n        }\n        set(PhilosopherState.DONE);\n    }\n\n    /** Change state and tell the observers -- always with no fork in hand. */\n    private void set(PhilosopherState s) { state = s; table.publish(id, s); }\n}\n\n/**\n * A read-only picture of the table for a supervisor or a test: meals per philosopher, what each is\n * doing, the most that ever ate at once, and whether every fork is back on the table.\n */\nrecord Snapshot(long[] meals, PhilosopherState[] states, long totalMeals, int peakEating, boolean allForksFree) {\n    /** One line per philosopher plus the totals. */\n    String format() {\n        StringBuilder sb = new StringBuilder();\n        for (int i = 0; i < meals.length; i++)\n            sb.append(String.format(\"   p%d %-8s meals=%d%n\", i, states[i], meals[i]));\n        sb.append(String.format(\"   total=%d  peak eating at once=%d  every fork back on the table=%b%n\",\n                totalMeals, peakEating, allForksFree));\n        return sb.toString();\n    }\n}\n\n/**\n * The table: it builds the ring of n forks and n philosophers, hands every philosopher the SAME\n * policy, starts them together on one latch and can stop them. It owns the forks and the\n * philosophers; it owns no lock of its own, because the forks are the locks.\n */\nfinal class DiningTable {\n    private final int n;\n    private final Fork[] forks;\n    private final Philosopher[] seats;\n    private final Thread[] threads;\n    private final ForkPolicy policy;\n    private final CountDownLatch gate = new CountDownLatch(1);\n    private final List<DiningObserver> observers = new CopyOnWriteArrayList<>();\n    private final AtomicInteger eating = new AtomicInteger();\n    private final AtomicInteger peakEating = new AtomicInteger();\n    private Clock clock = System::currentTimeMillis;\n    private Work think = Work.none(), eat = Work.none();\n    private boolean started = false;\n\n    /** n philosophers, one shared policy, a fixed number of meals each, plain (unfair) fork locks. */\n    DiningTable(int n, ForkPolicy policy, int rounds) { this(n, policy, rounds, false); }\n\n    /** fairForks = every fork hands itself to the longest waiter: slower, but nobody is skipped. */\n    DiningTable(int n, ForkPolicy policy, int rounds, boolean fairForks) {\n        if (n < 2) throw new IllegalArgumentException(\"a table needs at least two philosophers\");\n        this.n = n; this.policy = policy;\n        this.forks = new Fork[n];\n        this.seats = new Philosopher[n];\n        this.threads = new Thread[n];\n        for (int i = 0; i < n; i++) forks[i] = new Fork(i, fairForks);\n        for (int i = 0; i < n; i++) seats[i] = new Philosopher(i, forks[i], forks[(i + 1) % n], policy, this, rounds);\n    }\n\n    /** Hand in what thinking and eating mean. The table never decides that itself. */\n    DiningTable configure(Work think, Work eat) { this.think = think; this.eat = eat; return this; }\n\n    /** Hand in where time comes from. */\n    DiningTable setClock(Clock c) { this.clock = c; return this; }\n\n    /** Add somebody who wants to be told about state changes. */\n    DiningTable addObserver(DiningObserver o) { observers.add(o); return this; }\n\n    /** What thinking means for this run. */\n    Work think() { return think; }\n\n    /** What eating means for this run. */\n    Work eat() { return eat; }\n\n    /** How many philosophers are at this table. */\n    int size() { return n; }\n\n    /** The forks, in ring order. */\n    Fork[] forks() { return forks; }\n\n    /** One seat. */\n    Philosopher seat(int i) { return seats[i]; }\n\n    /** The policy every philosopher at this table was handed. */\n    ForkPolicy policy() { return policy; }\n\n    /** Start every philosopher and release them in the same instant: that latch IS the race. */\n    void start() {\n        if (started) throw new IllegalStateException(\"this table has already eaten\");\n        started = true;\n        for (int i = 0; i < n; i++) {\n            threads[i] = new Thread(seats[i], \"philosopher-\" + i);\n            threads[i].setDaemon(true);                        // a stuck run can never keep the JVM alive\n            threads[i].start();\n        }\n        gate.countDown();\n    }\n\n    /** Called by each philosopher thread: wait at the gate until every one of them is ready. */\n    void awaitStart() throws InterruptedException { gate.await(); }\n\n    /** Wait for dinner to end; false means somebody is still at the table when the budget ran out. */\n    boolean awaitFinish(long ms) throws InterruptedException {\n        long deadline = System.nanoTime() + ms * 1_000_000L;\n        for (Thread t : threads) {\n            long left = deadline - System.nanoTime();\n            if (left <= 0) return false;\n            t.join(Math.max(1, left / 1_000_000L));\n            if (t.isAlive()) return false;\n        }\n        return true;\n    }\n\n    /** The rescue: interrupt everyone, so anybody blocked on a fork throws and unwinds. */\n    void interruptAll() { for (Thread t : threads) if (t != null) t.interrupt(); }\n\n    /** Counted when a philosopher starts eating; remembers the most that ever ate at once. */\n    void enterMeal() { peakEating.accumulateAndGet(eating.incrementAndGet(), Math::max); }\n\n    /** Counted when a philosopher stops eating. */\n    void exitMeal() { eating.decrementAndGet(); }\n\n    /** The most philosophers that ever ate at the same instant: the parallelism the design keeps. */\n    int peakEating() { return peakEating.get(); }\n\n    /** Tell the observers, outside every fork, and never let a broken one break dinner. */\n    void publish(int philosopherId, PhilosopherState s) {\n        if (observers.isEmpty()) return;\n        long at = clock.nowMs();\n        for (DiningObserver o : observers) {\n            try { o.onState(philosopherId, s, at); } catch (RuntimeException ignored) { /* log it, do not rethrow */ }\n        }\n    }\n\n    /** Look for a circular wait right now. Null means nobody is in a ring at this instant. */\n    Cycle findCycle() { return WaitGraph.find(forks, seats); }\n\n    /** True when every fork is back on the table. */\n    boolean allForksFree() { for (Fork f : forks) if (!f.isFree()) return false; return true; }\n\n    /** True if any fork was ever held by two philosophers at once: the invariant, measured. */\n    boolean anyForkViolated() { for (Fork f : forks) if (f.violated()) return true; return false; }\n\n    /** Meals eaten at this table. */\n    long totalMeals() { long t = 0; for (Philosopher p : seats) t += p.meals(); return t; }\n\n    /** A read-only picture for a supervisor or a test. */\n    Snapshot snapshot() {\n        long[] meals = new long[n];\n        PhilosopherState[] states = new PhilosopherState[n];\n        for (int i = 0; i < n; i++) { meals[i] = seats[i].meals(); states[i] = seats[i].state(); }\n        return new Snapshot(meals, states, totalMeals(), peakEating(), allForksFree());\n    }\n}\n\n/**\n * Runs the whole thing: one ordinary dinner, then the naive protocol demonstrated safely (a real\n * circular wait, named by the detector, and nobody hangs), then the race -- five threads released\n * by one latch, ten thousand meals, with the invariants checked and counted.\n */\npublic class Main {\n\n    /** Prints the demo, the safe deadlock demonstration and the race. */\n    public static void main(String[] args) throws Exception {\n        System.out.println(\"== 1. dinner: 5 philosophers, resource ordering, 20 meals each, think 1ms / eat 1ms ==\");\n        DiningTable dinner = new DiningTable(5, new OrderedPolicy(), 20)\n                .configure(Work.sleepMs(1), Work.sleepMs(1))\n                .addObserver((id, state, at) -> { });\n        long t0 = System.currentTimeMillis();\n        dinner.start();\n        boolean done = dinner.awaitFinish(20_000);\n        System.out.printf(\"   finished=%b in %d ms%n\", done, System.currentTimeMillis() - t0);\n        System.out.print(dinner.snapshot().format());\n        System.out.printf(\"   longest anyone stayed hungry: p%d, %d ms total%n%n\", slowest(dinner), dinner.seat(slowest(dinner)).waitMs());\n\n        System.out.println(\"== 2. the naive protocol (left then right), demonstrated safely ==\");\n        CountDownLatch wedge = new CountDownLatch(5);                 // nobody reaches right until all five hold a left fork\n        NaivePolicy naive = new NaivePolicy(400, wedge);\n        DiningTable bad = new DiningTable(5, naive, 1).configure(Work.none(), Work.sleepMs(1));\n        Cycle[] seen = new Cycle[1];\n        Thread detector = new Thread(() -> {                           // the watchdog: samples the wait-for graph\n            long end = System.currentTimeMillis() + 1_000;\n            while (System.currentTimeMillis() < end && seen[0] == null) {\n                seen[0] = bad.findCycle();\n                LockSupport.parkNanos(10_000_000L);\n            }\n        });\n        detector.setDaemon(true);\n        long naiveStart = System.currentTimeMillis();\n        bad.start();\n        detector.start();\n        boolean unwound = bad.awaitFinish(5_000);\n        long naiveMs = System.currentTimeMillis() - naiveStart;\n        detector.join(1_500);\n        System.out.printf(\"   everyone finished without hanging: %b, after %d ms%n\", unwound, naiveMs);\n        System.out.printf(\"   circular wait found by the detector: %s%n\", seen[0] == null ? \"none\" : seen[0].size() + \" philosophers\");\n        if (seen[0] != null) System.out.printf(\"   %s%n\", seen[0]);\n        System.out.printf(\"   nobody ate during the whole 400 ms grace: %b%n\", naiveMs >= 400);\n        System.out.printf(\"   gave up on the second fork: %d of 5; meals eaten only after a fork came back: %d%n%n\",\n                naive.timeouts(), bad.totalMeals());\n\n        System.out.println(\"== 3. the race: 5 threads on one latch, 2000 rounds each, no sleeps ==\");\n        for (ForkPolicy p : new ForkPolicy[]{ new OrderedPolicy(), new ArbitratorPolicy(5), new TimeoutBackoffPolicy(5, 50) }) {\n            DiningTable t = new DiningTable(5, p, 2_000).configure(Work.none(), Work.none());\n            long start = System.currentTimeMillis();\n            t.start();\n            boolean ok = t.awaitFinish(30_000);\n            long ms = System.currentTimeMillis() - start;\n            String extra = p instanceof TimeoutBackoffPolicy b ? \"  drops+retries=\" + b.retries() : \"\";\n            System.out.printf(\"   %-22s finished=%b in %4d ms  meals=%d  fork held twice=%b  all forks back=%b%s%n\",\n                    p.name(), ok, ms, t.totalMeals(), t.anyForkViolated(), t.allForksFree(), extra);\n        }\n\n        System.out.println(\"\\n== 4. the same five, with a 2 ms meal: how many eat at once ==\");\n        for (ForkPolicy p : new ForkPolicy[]{ new OrderedPolicy(), new GlobalLockPolicy() }) {\n            DiningTable t = new DiningTable(5, p, 20).configure(Work.sleepMs(1), Work.sleepMs(2));\n            long start = System.currentTimeMillis();\n            t.start();\n = wedge; }\n\n    /** Left, then right, with no timeout: the circular wait, for real. */\n    @Override public void acquireBoth(Philosopher p) throws InterruptedException {\n        p.markWaiting(p.left().id());\n        p.left().pickUp(p.id());\n        if (wedge != null) { wedge.countDown(); wedge.await(1, TimeUnit.SECONDS); }\n        p.markWaiting(p.right().id());\n        try { p.right().pickUp(p.id()); }\n        catch (InterruptedException e) { p.left().putDown(p.id()); throw e; }   // the rescue path\n        finally { p.markWaiting(-1); }\n    }\n\n    /** Both forks go back. */\n    @Override public void releaseBoth(Philosopher p) { p.right().putDown(p.id()); p.left().putDown(p.id()); }\n}\n\n/**\n * The production answer to \"how would you know?\": the JVM already tracks who owns which\n * ReentrantLock, so ThreadMXBean.findDeadlockedThreads() reports a real cycle rather than guessing\n * from a timeout. This watchdog polls it, prints the threads in the ring, and breaks them out.\n * It is a monitor, not a fix -- the fix is the acquisition policy on page 02, move 4.\n */\nfinal class DeadlockWatchdog implements Runnable {\n    private final DiningTable table;\n    private final long budgetMs, everyMs;\n    private volatile String report = \"no deadlock seen\";\n    private volatile boolean fired = false;\n\n    /** Watch this table for budgetMs, sampling every everyMs. */\n    DeadlockWatchdog(DiningTable table, long budgetMs, long everyMs) {\n        this.table = table; this.budgetMs = budgetMs; this.everyMs = everyMs;\n    }\n\n    /** Poll the JVM; on a real cycle, name the threads and interrupt everybody so they unwind. */\n    @Override public void run() {\n        ThreadMXBean jvm = ManagementFactory.getThreadMXBean();\n        long end = System.currentTimeMillis() + budgetMs;\n        while (System.currentTimeMillis() < end) {\n            long[] ids = jvm.findDeadlockedThreads();\n            if (ids != null && ids.length > 0) {\n                List<String> names = new ArrayList<>();\n                for (ThreadInfo ti : jvm.getThreadInfo(ids, true, true))\n                    names.add(ti.getThreadName() + \" blocked on \" + ti.getLockName()\n                              + \" owned by \" + ti.getLockOwnerName());\n                report = \"DEADLOCK: \" + names;\n                fired = true;\n                table.interruptAll();                        // the rescue: interruptible locks make this possible\n                return;\n            }\n            LockSupport.parkNanos(everyMs * 1_000_000L);\n        }\n        table.interruptAll();                                // backstop: never leave a run wedged, even undetected\n    }\n\n    /** True if the JVM reported a genuine cycle. */\n    boolean fired() { return fired; }\n\n    /** What it saw, in one line. */\n    String report() { return report; }\n}\n\n// ---- ext: fairness, measured rather than asserted\n/**\n * \"Prove nobody starves.\" You cannot prove it from the code, so measure it: this observer records\n * when each philosopher became hungry and how long it stayed that way, and reports the spread.\n * It is an observer, so it runs after the forks are back and can never slow a meal down.\n */\nfinal class FairnessMetrics implements DiningObserver {\n    private final long[] hungrySince, worstWaitMs, totalWaitMs, meals;\n\n    /** One row per philosopher. */\n    FairnessMetrics(int n) {\n        hungrySince = new long[n]; worstWaitMs = new long[n]; totalWaitMs = new long[n]; meals = new long[n];\n        Arrays.fill(hungrySince, -1);\n    }\n\n    /** Start the stopwatch on HUNGRY, stop it on EATING, and count the meal. */\n    @Override public synchronized void onState(int id, PhilosopherState state, long atMs) {\n        if (state == PhilosopherState.HUNGRY) hungrySince[id] = atMs;\n        else if (state == PhilosopherState.EATING && hungrySince[id] >= 0) {\n            long waited = atMs - hungrySince[id];\n            totalWaitMs[id] += waited;\n            worstWaitMs[id] = Math.max(worstWaitMs[id], waited);\n            meals[id]++;\n            hungrySince[id] = -1;\n        }\n    }\n\n    /** meals, worst wait and total wait per philosopher, plus the fairness ratio min/max meals. */\n    synchronized String report() {\n        long min = Long.MAX_VALUE, max = 0;\n        StringBuilder sb = new StringBuilder();\n        for (int i = 0; i < meals.length; i++) {\n            min = Math.min(min, meals[i]); max = Math.max(max, meals[i]);\n            sb.append(String.format(\"p%d meals=%d worst wait=%dms total=%dms; \", i, meals[i], worstWaitMs[i], totalWaitMs[i]));\n        }\n        sb.append(String.format(\"fairness min/max = %.2f\", max == 0 ? 1.0 : (double) min / max));\n        return sb.toString();\n    }\n}\n\n// ---- ext: the asymmetric fix -- one philosopher reaches the other way\n/**\n * The fix when you may not renumber the forks but may treat one seat differently: even-numbered\n * philosophers take their left fork first, odd-numbered ones take their right. That single\n * asymmetry means two neighbours always reach for the SAME fork first, so at least one of them\n * loses at once instead of both holding one and waiting -- and a full ring can never close.\n */\nfinal class AsymmetricPolicy implements ForkPolicy {\n    /** Even seats: left then right. Odd seats: right then left. */\n    @Override public void acquireBoth(Philosopher p) throws InterruptedException {\n        Fork first = p.id() % 2 == 0 ? p.left() : p.right();\n        Fork second = first == p.left() ? p.right() : p.left();\n        p.markWaiting(first.id());\n        first.pickUp(p.id());\n        try {\n            p.markWaiting(second.id());\n            second.pickUp(p.id());\n        } catch (InterruptedException e) {\n            first.putDown(p.id());\n            throw e;\n        } finally { p.markWaiting(-1); }\n    }\n\n    /** Both forks go back. */\n    @Override public void releaseBoth(Philosopher p) { p.right().putDown(p.id()); p.left().putDown(p.id()); }\n}\n\n// ---- ext: the wait protocol -- one lock for the table, one condition per seat\n/**\n * The other shape of this problem, and the one an interviewer means when they say \"do it with\n * wait/notify\". Instead of locking two forks one after the other, there is ONE lock over a small\n * array of who-is-eating, and one Condition per philosopher. A hungry philosopher looks at its two\n * neighbours under that lock: if neither is eating it takes both forks in the same breath, and if\n * either is, it waits on its own condition until a neighbour finishes and wakes it. Nobody ever\n * holds one fork while waiting for another, so no ring can form: this deletes HOLD-AND-WAIT, the\n * second Coffman condition, where ordering and the waiter both delete the fourth one, the cycle.\n *\n * Read this class for the three rules of the wait protocol, which is the same in every language:\n *   1. CHECK THE CONDITION UNDER THE LOCK. eating[] and hungry[] are only ever read or written\n *      while `mutex` is held, so nobody can see half of a change.\n *   2. WAIT IN A LOOP, never an if. await() may return with nobody having signalled (a spurious\n *      wakeup), and even a real signal only means \"go and look again\" -- by the time the woken\n *      thread gets the lock back, a third thread may have taken what it was woken for.\n *   3. CHANGE THE STATE FIRST, THEN SIGNAL. Signal before the change and the woken thread\n *      re-checks, sees nothing, and goes back to sleep for ever: that is a lost wakeup.\n *\n * Two honest caveats. The table lock is held for a handful of array reads -- microseconds -- and\n * is released before the meal, so this is nothing like GlobalLockPolicy's one-lock-per-meal. And\n * it is deadlock-free but not starvation-free: two neighbours taking turns can keep a philosopher\n * hungry forever, and the fix is one more array (the instant each went hungry) plus \"and no hungry\n * neighbour has waited longer than me\" in the test below.\n */\nfinal class MonitorPolicy implements ForkPolicy {\n    private final int n;\n    private final ReentrantLock mutex = new ReentrantLock();\n    private final Condition[] mayEat;\n    private final boolean[] eating, hungry;\n\n    /** n philosophers around the ring; every one of them gets its own condition to wait on. */\n    MonitorPolicy(int n) {\n        this.n = n;\n        this.mayEat = new Condition[n];\n        this.eating = new boolean[n];\n        this.hungry = new boolean[n];\n        for (int i = 0; i < n; i++) mayEat[i] = mutex.newCondition();\n    }\n\n    /** Say hungry under the lock, take both forks if the neighbours are idle, else wait in a loop. */\n    @Override public void acquireBoth(Philosopher p) throws InterruptedException {\n        int i = p.id();\n        mutex.lockInterruptibly();\n        try {\n            hungry[i] = true;\n            grantIfPossible(i);\n            while (!eating[i]) mayEat[i].await();        // WHILE, not if: a wakeup is a hint, not a promise\n        } catch (InterruptedException e) {\n            hungry[i] = false;                           // interrupted while waiting: leave no claim behind\n            if (eating[i]) {                             // signalled AND interrupted in the same breath:\n                eating[i] = false;                       // the grant is real, so hand it on rather than drop it\n                grantIfPossible((i + n - 1) % n);\n                grantIfPossible((i + 1) % n);\n            }\n            throw e;\n        } finally {\n            mutex.unlock();\n        }\n        // Granted means the table lock has already reserved both forks, so neither call below can block.\n        // That is the whole claim of this design, so check it rather than believe it: if either fork is in\n        // a hand at this instant the grant was not atomic, and the test would rather see that than a hang.\n        if (!p.left().isFree() || !p.right().isFree())\n            throw new IllegalStateException(\"p\" + i + \" was granted a meal while a neighbour still held a fork\");\n        try {\n            p.left().pickUp(p.id());\n            p.right().pickUp(p.id());\n        } catch (InterruptedException e) {\n            // The gap nobody thinks about, and a real bug until it is handled: the grant is already made\n            // and the table lock is already released, and only NOW does the supervisor interrupt us.\n            // lockInterruptibly throws the moment the flag is set even though the fork is sitting free,\n            // so without this the seat stays marked EATING for ever and both neighbours wait on a\n            // philosopher that has gone home. Give back whatever was taken, then give back the grant.\n            p.right().putDown(p.id());\n            p.left().putDown(p.id());\n            releaseGrant(i);\n            throw e;\n        }\n    }\n\n    /** Forks back first, then the seat state, then wake whichever neighbour can now eat. */\n    @Override public void releaseBoth(Philosopher p) {\n        p.right().putDown(p.id());\n        p.left().putDown(p.id());                        // the forks are on the table BEFORE anybody is woken for them\n        releaseGrant(p.id());\n    }\n\n    /** Clear the seat under the table lock and offer the meal to each neighbour. Forks must already be back. */\n    private void releaseGrant(int i) {\n        mutex.lock();\n        try {\n            eating[i] = false;\n            grantIfPossible((i + n - 1) % n);\n            grantIfPossible((i + 1) % n);\n        } finally {\n            mutex.unlock();\n        }\n    }\n\n    /** The state change and the signal, in that order, with the lock held by the caller. */\n    private void grantIfPossible(int i) {\n        int left = (i + n - 1) % n, right = (i + 1) % n;\n        if (hungry[i] && !eating[left] && !eating[right]) {\n            hungry[i] = false;\n            eating[i] = true; h(1);\n        Thread first = w.waiter(2, never);                // head of the queue, waiting for a 2 that never comes\n        w.awaitParked(1);\n        Thread second = w.waiter(1, through);             // behind it, waiting for the 1 we are about to set\n        w.awaitParked(2);\n        w.lock.lock();\n        try {\n            w.token = 1;                                  // the state changes first...\n            if (signalAll) w.ready.signalAll(); else w.ready.signal();   // ...and only then is anybody told\n        } finally {\n            w.lock.unlock();\n        }\n        boolean got = through.await(300, TimeUnit.MILLISECONDS);\n        first.interrupt(); second.interrupt();            // nothing here is left parked, either way\n        first.join(1_000); second.join(1_000);\n        return got;\n    }\n}\n\n// ---- ext: the same trick anywhere two locks are taken -- bank transfers\n/**\n * Dining philosophers is not a puzzle about cutlery: it is every place where a thread takes two\n * locks. A transfer takes the payer's lock and the payee's lock, and two opposite transfers at the\n * same instant are exactly the circular wait. The cure is the same: a global order, here the\n * account number, with a tie-break lock for the case where two ids are equal.\n */\nfinal class Account {\n    private final int id;\n    private long balance;\n    final ReentrantLock lock = new ReentrantLock();\n\n    /** An account with an opening balance. */\n    Account(int id, long balance) { this.id = id; this.balance = balance; }\n\n    /** The global order the locks are taken in. */\n    int id() { return id; }\n\n    /** The balance; read under the account's lock. */\n    long balance() { return balance; }\n\n    /** Move money; only ever called with this account's lock held. */\n    void add(long amount) { balance += amount; }\n}\n\n/**\n * Ordered locking for any two resources, and the worked example everybody meets in production.\n */\nfinal class LockOrdering {\n    private static final ReentrantLock TIE_BREAK = new ReentrantLock();\n\n    private LockOrdering() { }\n\n    /** Transfer, taking the two account locks in id order so two opposite transfers cannot deadlock. */\n    static boolean transfer(Account from, Account to, long amount) {\n        if (from == to) return false;\n        Account first = from.id() < to.id() ? from : to;\n        Account second = first == from ? to : from;\n        if (from.id() == to.id()) {                          // equal ids (or identity hashes): one global tie-break lock\n            TIE_BREAK.lock();\n            try { return move(from, to, amount); } finally { TIE_BREAK.unlock(); }\n        }\n        first.lock.lock();\n        try {\n            second.lock.lock();\n            try { return move(from, to, amount); } finally { second.lock.unlock(); }\n        } finally { first.lock.unlock(); }\n    }\n\n    /** The money move itself, with both locks already held. */\n    private static boolean move(Account from, Account to, long amount) {\n        if (from.balance() < amount) return false;\n        from.add(-amount);\n        to.add(amount);\n        return true;\n    }\n\n    /** The general form: take any number of locks in id order, run the body, release in reverse. */\n    static void withAll(List<Fork> forks, int by, Runnable body) throws InterruptedException {\n        List<Fork> order = new ArrayList<>(forks);\n        order.sort((a, b) -> Integer.compare(a.id(), b.id()));\n        int taken = 0;\n        try {\n            for (Fork f : order) { f.pickUp(by); taken++; }\n            body.run();\n        } finally {\n            for (int i = taken - 1; i >= 0; i--) order.get(i).putDown(by);\n        }\n    }\n}\n\n// ---- ext: a graceful stop instead of an interrupt\n/**\n * \"Interrupting is how you break a wedged run; how do you stop a healthy one?\" With a flag the\n * philosopher checks once per round -- and because thinking is handed in, the flag lives in the\n * work, not in the actor. Stopping ends the round in progress, never a meal half way through, and\n * only escalates to interrupt if somebody does not come back in time.\n */\nfinal class GracefulShutdown {\n    private final DiningTable table;\n    private volatile boolean running = true;\n    private final AtomicLong roundsSeen = new AtomicLong();\n\n    /** Wrap a table; hand table.configure() the work returned by stoppable(). */\n    GracefulShutdown(DiningTable table) { this.table = table; }\n\n    /** Wrap any work so that it ends the philosopher's loop once stop() has been called. */\n    Work stoppable(Work base) {\n        return id -> {\n            roundsSeen.incrementAndGet();\n            if (!running) throw new InterruptedException(\"dinner is over\");   // a clean exit, between meals\n            base.perform(id);\n        };\n    }\n\n    /** Ask everybody to stop after the round they are in; then wait, and only then escalate. */\n    boolean stop(long graceMs) throws InterruptedException {\n        running = false;\n        if (table.awaitFinish(graceMs)) return true;\n        table.interruptAll();                                // the escalation, not the plan\n        return table.awaitFinish(graceMs);\n    }\n\n    /** How many rounds started in total: what the flag was checked against. */\n    long roundsSeen() { return roundsSeen.get(); }\n}\n\n// ---- ext: forks in another process -- the same protocol, one level up\n/**\n * A stand-in for Redis: a key-value store whose SET-if-absent is atomic and whose keys expire.\n * It is here to make one point honestly -- the protocol survives the move off one JVM, but the\n * guarantee weakens, because a lease can expire while its holder still believes it holds the fork.\n */\nfinal class FakeRedis {\n    private final ConcurrentHashMap<String, long[]> keys = new ConcurrentHashMap<>();   // key -> [owner, expiresAtMs]\n    private final Clock clock;\n\n    /** Injected clock, so a test can expire a lease without sleeping. */\n    FakeRedis(Clock clock) { this.clock = clock; }\n\n    /** SET key owner NX PX lease: true only if the key was free or its lease had expired. */\n    boolean setIfAbsent(String key, int owner, long leaseMs) {\n        long now = clock.nowMs();\n        long[] prev = keys.compute(key, (k, v) -> (v == null || v[1] <= now) ? new long[]{ owner, now + leaseMs } : v);\n        return prev[0] == owner && prev[1] > now;\n    }\n\n    /** Release only if you still hold it (the Redis Lua compare-and-delete, not a bare DEL). */\n    boolean release(String key, int owner) {\n        long[] v = keys.get(key);\n        if (v == null || v[0] != owner) return false;\n        return keys.remove(key, v);\n    }\n\n    /** Who the store thinks holds the key right now, or -1. */\n    int owner(String key) {\n        long[] v = keys.get(key);\n        return v == null || v[1] <= clock.nowMs() ? -1 : (int) v[0];\n    }\n}\n\n/**\n * A fork that lives in the store instead of in this JVM. Same two methods as Fork, which is the\n * point: Philosopher and the policies would take an interface with pickUp/putDown and neither\n * would change. What DOES change is the failure model: a lease that expires hands the fork to\n * somebody else while the first holder is still eating, so a real system needs a fencing token.\n */\nfinal class LeasedFork {\n    private final String key;\n    private final FakeRedis store;\n    private final long leaseMs;\n\n    /** A fork identified by a key in the shared store. */\n    LeasedFork(int id, FakeRedis store, long leaseMs) { this.key = \"fork:\" + id; this.store = store; this.leaseMs = leaseMs; }\n\n    /** Poll for the key until the deadline; true means this philosopher holds the lease now. */\n    boolean pickUp(int by, long waitMs) throws InterruptedException {\n        long end = System.currentTimeMillis() + waitMs;\n        do {\n            if (store.setIfAbsent(key, by, leaseMs)) return true;\n            Thread.sleep(2);\n        } while (System.currentTimeMillis() < end);\n        return false;\n    }\n\n    /** Give the lease back if it is still ours. */\n    void putDown(int by) { if (store.owner(key) == by) store.release(key, by); }\n\n    /** Who the store says holds it. */\n    int owner() { return store.owner(key); }\n}\n\n// ---- ext: the read-only view a supervisor wants\n/**\n * Metrics without touching the run: who is hungry, how many meals each has had, how many are\n * eating right now. Every number is an O(1) read of a volatile field, so asking costs nothing and\n * cannot slow a philosopher down or take a fork.\n */\nfinal class TableMonitor {\n    private final DiningTable table;\n\n    /** Watch a table without being part of it. */\n    TableMonitor(DiningTable table) { this.table = table; }\n\n    /** One line: states, meals, and the peak parallelism so far. */\n    String line() {\n        Snapshot s = table.snapshot();\n        StringBuilder sb = new StringBuilder();\n        int hungry = 0, eating = 0;\n        for (int i = 0; i < table.size(); i++) {\n            if (s.states()[i] == PhilosopherState.HUNGRY) hungry++;\n            if (s.states()[i] == PhilosopherState.EATING) eating++;\n            sb.append(String.format(\"p%d=%s(%d) \", i, s.states()[i], s.meals()[i]));\n        }\n        Cycle c = table.findCycle();\n        return sb + String.format(\"| hungry=%d eating=%d total=%d peak=%d ring=%s\",\n                hungry, eating, s.totalMeals(), s.peakEating(), c == null ? \"none\" : c.size() + \" deep\");\n    }\n}\n\n/**\n * Runs every extension above, in the order the follow-ups ask for them. Nothing here can hang:\n * the philosopher threads are daemons, the watchdog has a budget, and every join has a timeout.\n */\nclass ExtDemo {\n\n    /** Prints one section per follow-up. */\n    public static void main(String[] args) throws Exception {\n        System.out.println(\"== a real deadlock, found by the JVM and broken by an interrupt ==\");\n        CountDownLatch wedge = new CountDownLatch(5);\n        DiningTable wedged = new DiningTable(5, new TrueNaivePolicy(wedge), 1).configure(Work.none(), Work.none());\n        DeadlockWatchdog dog = new DeadlockWatchdog(wedged, 3_000, 20);\n        Thread watcher = new Thread(dog, \"watchdog\");\n        watcher.setDaemon(true);\n        wedged.start();\n        watcher.start();\n        boolean unwound = wedged.awaitFinish(5_000);\n        watcher.join(4_000);\n        System.out.println(\"   watchdog fired=\" + dog.fired());\n        System.out.println(\"   \" + dog.report());\n        System.out.println(\"   the table unwound after the interrupt: \" + unwound + \", every fork back: \" + wedged.allForksFree());\n\n        System.out.println(\"\\n== fairness, measured over 500 meals each ==\");\n        DiningTable fairRun = new DiningTable(5, new OrderedPolicy(), 500, true).configure(Work.none(), Work.sleepMs(1));\n        FairnessMetrics metrics = new FairnessMetrics(5);\n        fairRun.addObserver(metrics);\n        fairRun.start();\n        fairRun.awaitFinish(30_000);\n        System.out.println(\"   \" + metrics.report());\n\n        System.out.println(\"\\n== the asymmetric fix: odd philosophers reach the other way ==\");\n        DiningTable asym = new DiningTable(5, new AsymmetricPolicy(), 2_000).configure(Work.none(), Work.none());\n        asym.start();\n        System.out.println(\"   finished=\" + asym.awaitFinish(20_000) + \" meals=\" + asym.totalMeals()\n            + \" fork held twice=\" + asym.anyForkViolated() + \" peak eating=\" + asym.peakEating());\n\n        System.out.println(\"\\n== the wait protocol: one table lock, one condition per seat ==\");\n        MonitorPolicy monitorPolicy = new MonitorPolicy(5);\n        DiningTable waiting = new DiningTable(5, monitorPolicy, 2_000).configure(Work.none(), Work.none());\n        waiting.start();\n        System.out.println(\"   finished=\" + waiting.awaitFinish(20_000) + \" meals=\" + waiting.totalMeals()\n            + \" fork held twice=\" + waiting.anyForkViolated() + \" peak eating=\" + waiting.peakEating()\n            + \" state arrays clean=\" + monitorPolicy.quiescent());\n        System.out.println(\"   note: everybody here waits on a Condition, not on a fork, so\"\n            + \" ThreadMXBean.findDeadlockedThreads() would see nothing even if it did wedge\");\n\n        System.out.println(\"\\n== why one condition per seat, and not one condition plus signal() ==\");\n        System.out.println(\"   one shared condition, signal():    the thread the change was for got through = \"\n            + WakeupRules.woken(false) + \"   <- the wakeup went to a thread whose own test was still false\");\n        System.out.println(\"   one shared condition, signalAll(): the thread the change was for got through = \"\n            + WakeupRules.woken(true) + \"   <- everybody re-tests, so the right one gets through\");\n        System.out.println(\"   MonitorPolicy avoids the choice: one condition per philosopher, so signal()\"\n            + \" wakes exactly the seat the grant was made for\");\n\n        System.out.println(\"\\n== the same trick in production: two-account transfers ==\");\n        Account a = new Account(1, 1_000), b = new Account(2, 1_000);\n        AtomicLong moved = new AtomicLong(), refused = new AtomicLong();\n        Runnable aToB = () -> { for (int i = 0; i < 50_000; i++) { if (LockOrdering.transfer(a, b, 1)) moved.incrementAndGet(); else refused.incrementAndGet(); } };\n        Runnable bToA = () -> { for (int i = 0; i < 50_000; i++) { if (LockOrdering.transfer(b, a, 1)) moved.incrementAndGet(); else refused.incrementAndGet(); } };\n        Thread t1 = new Thread(aToB), t2 = new Thread(bToA);\n        t1.setDaemon(true); t2.setDaemon(true);\n        t1.start(); t2.start();\n        t1.join(10_000); t2.join(10_000);\n        System.out.println(\"   100000 opposing transfers, no deadlock: moved=\" + moved.get()\n            + \" refused for want of balance=\" + refused.get());\n        System.out.println(\"   a=\" + a.balance() + \" b=\" + b.balance() + \" total=\" + (a.balance() + b.balance())\n            + \" (conserved; the ONLY reason this does not hang is the id order)\");\n\n        System.out.println(\"\\n== three resources, not two: the order generalises ==\");\n        Fork[] three = { new Fork(7, false), new Fork(2, false), new Fork(5, false) };\n        LockOrdering.withAll(Arrays.asList(three), 0, () -> System.out.println(\"   holding forks 2, 5 and 7, taken in that order\"));\n        System.out.println(\"   all three back on the table: \" + (three[0].isFree() && three[1].isFree() && three[2].isFree()));\n\n        System.out.println(\"\\n== a graceful stop, with interrupt only as the escalation ==\");\n        DiningTable longRun = new DiningTable(5, new OrderedPolicy(), 1_000_000);\n        GracefulShutdown stopper = new GracefulShutdown(longRun);\n        longRun.configure(stopper.stoppable(Work.none()), Work.sleepMs(1));\n        longRun.start();\n        Thread.sleep(60);\n        long before = longRun.totalMeals();\n        boolean stopped = stopper.stop(3_000);\n        System.out.println(\"   stopped cleanly=\" + stopped + \" meals at the stop=\" + before\n            + \" final=\" + longRun.totalMeals() + \" forks back=\" + longRun.allForksFree());\n\n        System.out.println(\"\\n== forks in another process: the same protocol, a weaker guarantee ==\");\n        long[] now = { 1_700_000_000_000L };\n        FakeRedis redis = new FakeRedis(() -> now[0]);\n        LeasedFork remote = new LeasedFork(2, redis, 100);\n        System.out.println(\"   p1 takes the remote fork: \" + remote.pickUp(1, 50) + \", owner=\" + remote.owner());\n        System.out.println(\"   p2 tries while p1 holds it: \" + remote.pickUp(2, 30) + \" (refused)\");\n        now[0] += 101;                                        // the lease expires while p1 still believes it is eating\n        System.out.println(\"   after the lease expires, p2 takes it: \" + remote.pickUp(2, 30) + \", owner=\" + remote.owner());\n        System.out.println(\"   that is the danger: two holders at once unless every write carries a fencing token\");\n\n        System.out.println(\"\\n== the supervisor's read-only view ==\");\n        DiningTable watched = new DiningTable(5, new OrderedPolicy(), 200).configure(Work.sleepMs(1), Work.sleepMs(1));\n        TableMonitor monitor = new TableMonitor(watched);\n        watched.start();\n        Thread.sleep(40);\n        System.out.println(\"   mid-dinner: \" + monitor.line());\n        watched.awaitFinish(30_000);\n        System.out.println(\"   at rest:    \" + monitor.line());\n    }\n}\n", "f2": "import java.lang.management.ManagementFactory;\nimport java.lang.management.ThreadMXBean;\nimport java.util.concurrent.CountDownLatch;\nimport java.util.concurrent.locks.LockSupport;\n\n// Targeted failure tests: each one proves a claim the design makes on page 02, move 9.\n// Nothing in this file can hang. The naive protocol is demonstrated with a grace timeout and a\n// detector, every philosopher thread is a daemon, and every wait has a deadline, so a broken\n// design FAILS a check instead of wedging the run.\npublic class FailureTests {\n    static int failures = 0;\n\n    /** Print one claim and remember whether it held. */\n    static void check(boolean ok, String what) { System.out.println((ok ? \"PASS \" : \"FAIL \") + what); if (!ok) failures++; }\n\n    /**\n     * Sample the table's wait-for graph until the SAME ring shows up twice in a row, or the budget\n     * runs out. Twice, not once: the graph is built from fields that are moving while it is read, so\n     * one sample can compose a ring out of stale values even on a perfectly healthy table. A real\n     * deadlock is frozen, so it confirms on every sample; a false alarm almost never repeats itself.\n     */\n    static Cycle watchFor(DiningTable t, long ms) {\n        long end = System.currentTimeMillis() + ms;\n        while (System.currentTimeMillis() < end) {\n            Cycle c = t.findCycle();\n            if (c != null && c.equals(t.findCycle())) return c;\n            LockSupport.parkNanos(5_000_000L);\n        }\n        return null;\n    }\n\n    public static void main(String[] args) throws Exception {\n        long started = System.currentTimeMillis();\n\n        // 1. the naive protocol really does form a circular wait -- shown with timeouts, never a hang.\n        //    A latch holds every philosopher until all five have their LEFT fork; then every one of them\n        //    reaches right, and the detector reads the ring off the table while they are all stuck in it.\n        CountDownLatch wedge = new CountDownLatch(5);\n        NaivePolicy naive = new NaivePolicy(400, wedge);\n        DiningTable bad = new DiningTable(5, naive, 1).configure(Work.none(), Work.none());\n        long t1 = System.currentTimeMillis();\n        bad.start();\n        Cycle ring = watchFor(bad, 1_000);\n        boolean unwound = bad.awaitFinish(3_000);\n        long naiveMs = System.currentTimeMillis() - t1;\n        check(ring != null && ring.size() == 5, \"the naive protocol forms a ring of 5: \" + ring);\n        check(naive.timeouts() >= 1, \"at least one philosopher had to give up to break it: \" + naive.timeouts() + \" of 5 did\");\n        check(naiveMs >= 400, \"nobody could eat during the whole 400 ms grace window (run took \" + naiveMs + \" ms)\");\n        check(unwound && bad.allForksFree(), \"every philosopher returned and every fork went back on the table\");\n        long abandoned = 0;\n        for (int i = 0; i < 5; i++) abandoned += bad.seat(i).abandoned();\n        check(abandoned + bad.totalMeals() == 5, \"all 5 rounds ended as a meal or a named give-up, none still holding a fork: \"\n            + bad.totalMeals() + \" ate, \" + abandoned + \" gave up\");\n\n        // 2. resource ordering: the same five, released by one latch, ten thousand meals, no deadlock.\n        DiningTable ordered = new DiningTable(5, new OrderedPolicy(), 2_000).configure(Work.none(), Work.none());\n        long t2 = System.currentTimeMillis();\n        ordered.start();\n        boolean done2 = ordered.awaitFinish(20_000);\n        check(done2, \"ordered locking: 10000 meals finished in \" + (System.currentTimeMillis() - t2) + \" ms, no deadlock\");\n        boolean each2000 = true;\n        for (int i = 0; i < 5; i++) each2000 &= ordered.seat(i).meals() == 2_000;\n        check(each2000 && ordered.totalMeals() == 10_000, \"every philosopher ate exactly 2000 times: total \" + ordered.totalMeals());\n        check(!ordered.anyForkViolated(), \"no fork was ever in two hands at once (20000 pick-ups)\");\n        check(ordered.allForksFree() && ordered.findCycle() == null, \"all forks back, and no ring left behind\");\n\n        // 3. the arbitrator: at most n-1 may reach, so a full cycle cannot form, and every seat comes back.\n        ArbitratorPolicy waiter = new ArbitratorPolicy(5);\n        DiningTable seated = new DiningTable(5, waiter, 1_000).configure(Work.none(), Work.none());\n        seated.start();\n        boolean done3 = seated.awaitFinish(20_000);\n        check(done3 && seated.totalMeals() == 5_000, \"the waiter (4 seats for 5 philosophers): 5000 meals, no deadlock\");\n        check(waiter.freeSeats() == 4, \"every seat was handed back: free seats = \" + waiter.freeSeats() + \" of 4\");\n        check(seated.allForksFree() && !seated.anyForkViolated(), \"all forks back, and never two hands on one\");\n\n        // 4. mutual exclusion under a bigger table: 7 philosophers, 21000 meals, 42000 pick-ups.\n        DiningTable seven = new DiningTable(7, new OrderedPolicy(), 3_000).configure(Work.none(), Work.none());\n        seven.start();\n        boolean done4 = seven.awaitFinish(20_000);\n        check(done4 && seven.totalMeals() == 21_000 && !seven.anyForkViolated(),\n            \"7 philosophers, 21000 meals, 42000 pick-ups: a fork was never held twice\");\n\n        // 5. the fix must keep the parallelism: ordering lets two eat at once, one big lock lets one.\n        DiningTable par = new DiningTable(5, new OrderedPolicy(), 30).configure(Work.sleepMs(1), Work.sleepMs(3));\n        long t5 = System.currentTimeMillis();\n        par.start();\n        par.awaitFinish(20_000);\n        long parMs = System.currentTimeMillis() - t5;\n        DiningTable serial = new DiningTable(5, new GlobalLockPolicy(), 30).configure(Work.sleepMs(1), Work.sleepMs(3));\n        long t5b = System.currentTimeMillis();\n        serial.start();\n        serial.awaitFinish(20_000);\n        long serialMs = System.currentTimeMillis() - t5b;\n        check(par.peakEating() >= 2, \"resource ordering still runs \" + par.peakEating() + \" philosophers at once (\" + parMs + \" ms)\");\n        check(serial.peakEating() == 1, \"one big lock 'fixes' the deadlock by serialising everybody: peak 1 (\" + serialMs + \" ms)\");\n        check(serialMs > parMs, \"and it costs real time: \" + serialMs + \" ms against \" + parMs + \" ms for the same 150 meals\");\n\n        // 6. a meal that throws must still return both forks -- that is what the finally is for.\n        DiningTable choke = new DiningTable(5, new OrderedPolicy(), 200)\n            .configure(Work.none(), id -> { if (id == 2) throw new IllegalStateException(\"choked on the soup\"); });\n        choke.start();\n        boolean done6 = choke.awaitFinish(20_000);\n        check(done6 && choke.allForksFree(), \"eating threw on every round of p2: dinner still ended with every fork on the table\");\n        check(choke.seat(2).errors() == 200 && choke.seat(2).meals() == 0, \"p2 counted 200 failures and zero meals\");\n        check(choke.seat(1).meals() == 200 && choke.seat(3).meals() == 200, \"its neighbours were never blocked by it: 200 meals each\");\n\n        // 7. a supervisor can break a run: interruptible locks mean a wedged philosopher throws and lets go.\n        DiningTable slow = new DiningTable(5, new OrderedPolicy(), 50).configure(Work.none(), Work.sleepMs(5_000));\n        slow.start();\n        Thread.sleep(50);                                   // two are eating a five-second meal, three are blocked on a fork\n        long t7 = System.currentTimeMillis();\n        slow.interruptAll();\n        boolean rescued = slow.awaitFinish(3_000);\n        check(rescued, \"interrupt unwound a table stuck in 5-second meals in \" + (System.currentTimeMillis() - t7) + \" ms\");\n        check(slow.allForksFree(), \"every interrupted philosopher dropped the fork it was holding\");\n\n        // 8. putting down a fork you do not hold is a no-op, not a way to free somebody else's fork.\n        Fork f = new Fork(3, false);\n        f.pickUp(1);\n        Thread thief = new Thread(() -> f.putDown(1));\n        thief.start();\n        thief.join(1_000);\n        check(!f.isFree() && f.owner() == 1, \"a stray putDown from another thread did not free fork 3\");\n        f.putDown(1);\n        check(f.isFree() && f.owner() == -1, \"the philosopher that holds it can put it down\");\n\n        // 9. nobody starves in a bounded run: fair forks, four hundred meals each, everybody finishes.\n        DiningTable fair = new DiningTable(5, new OrderedPolicy(), 400, true).configure(Work.none(), Work.none());\n        long t9 = System.currentTimeMillis();\n        fair.start();\n        boolean done9 = fair.awaitFinish(20_000);\n        long min = Long.MAX_VALUE, max = 0;\n        for (int i = 0; i < 5; i++) { min = Math.min(min, fair.seat(i).meals()); max = Math.max(max, fair.seat(i).meals()); }\n        check(done9 && min == 400 && max == 400, \"fair forks: all five finished their 400 meals in \"\n            + (System.currentTimeMillis() - t9) + \" ms, min=\" + min + \" max=\" + max);\n\n        // 10. drop-and-retry never deadlocks either -- it pays in retries instead of in a ring.\n        TimeoutBackoffPolicy backoff = new TimeoutBackoffPolicy(5, 50);\n        DiningTable retrying = new DiningTable(5, backoff, 1_000).configure(Work.none(), Work.none());\n        long t10 = System.currentTimeMillis();\n        retrying.start();\n        boolean done10 = retrying.awaitFinish(20_000);\n        check(done10 && retrying.totalMeals() == 5_000, \"tryLock with random backoff: 5000 meals in \"\n            + (System.currentTimeMillis() - t10) + \" ms, no deadlock\");\n        check(backoff.retries() > 0, \"and it really did drop a fork and try again: \" + backoff.retries() + \" retries\");\n\n        // 11. no false alarms: while a healthy ordered table runs, neither detector reports a deadlock.\n        //     Note what is measured. The JVM's detector reads real lock ownership and is never wrong.\n        //     Ours reads two volatile ints that are moving while it reads them, so a SINGLE sample can\n        //     compose a ring out of stale values on a table that is perfectly healthy -- and it does,\n        //     about once in forty runs. That is not a bug to fix, it is the nature of sampling a live\n        //     graph, and it is why the rule is \"confirm before you cry wolf\": the same ring, twice.\n        DiningTable healthy = new DiningTable(5, new OrderedPolicy(), 4_000).configure(Work.none(), Work.none());\n        ThreadMXBean jvm = ManagementFactory.getThreadMXBean();\n        healthy.start();\n        boolean jvmClean = true, graphClean = true;\n        for (int i = 0; i < 40; i++) {\n            if (jvm.findDeadlockedThreads() != null) jvmClean = false;\n            Cycle once = healthy.findCycle();\n            if (once != null && once.equals(healthy.findCycle())) graphClean = false;   // confirmed twice = believe it\n            LockSupport.parkNanos(2_000_000L);\n        }\n        healthy.awaitFinish(20_000);\n        check(jvmClean, \"ThreadMXBean.findDeadlockedThreads() reported nothing during a healthy run (40 samples)\");\n        check(graphClean, \"and the wait-for graph never confirmed a ring either: one sample is a suspicion, \"\n            + \"the same ring twice is a deadlock, and a detector that cries wolf gets switched off\");\n\n        // 12. the wait protocol: one table lock, one condition per seat, both forks taken atomically.\n        MonitorPolicy monitor = new MonitorPolicy(5);\n        DiningTable waited = new DiningTable(5, monitor, 1_000).configure(Work.none(), Work.none());\n        long t12 = System.currentTimeMillis();\n        waited.start();\n        boolean done12 = waited.awaitFinish(20_000);\n        check(done12 && waited.totalMeals() == 5_000, \"the monitor version (wait in a while loop, signal after the change): \"\n            + \"5000 meals in \" + (System.currentTimeMillis() - t12) + \" ms, no deadlock\");\n        check(!waited.anyForkViolated(), \"no fork was ever in two hands: the grant made under the table lock is atomic\");\n        check(waited.allForksFree() && monitor.quiescent(), \"every fork back and the hungry/eating arrays ended clean\");\n        // and it keeps the parallelism: peak is measured with a real meal, because an instant meal\n        // is over before anybody else can overlap it and would measure the clock, not the design.\n        DiningTable mPar = new DiningTable(5, new MonitorPolicy(5), 40).configure(Work.sleepMs(1), Work.sleepMs(3));\n        mPar.start();\n        mPar.awaitFinish(20_000);\n        check(mPar.peakEating() == 2, \"waiting on a condition costs no parallelism either: peak \"\n            + mPar.peakEating() + \", which is the floor(5/2) ceiling of the problem\");\n\n        // 13. interrupting a philosopher that is waiting on a Condition, not on a fork. Run it ten times,\n        //     because the interesting interleavings are rare: a philosopher can be signalled and\n        //     interrupted in the same breath, or be interrupted in the gap between being granted a meal\n        //     and actually picking the forks up -- and both have to end with the grant handed back.\n        boolean rescued13 = true, clean13 = true, forksBack13 = true;\n        for (int round = 0; round < 10; round++) {\n            MonitorPolicy monitorSlow = new MonitorPolicy(5);\n            DiningTable mSlow = new DiningTable(5, monitorSlow, 50).configure(Work.none(), Work.sleepMs(5_000));\n            mSlow.start();\n            Thread.sleep(20);                               // two are eating, three are parked in await()\n            mSlow.interruptAll();\n            rescued13 &= mSlow.awaitFinish(3_000);\n            forksBack13 &= mSlow.allForksFree();\n            clean13 &= monitorSlow.quiescent();\n        }\n        check(rescued13 && forksBack13, \"an interrupt wakes a thread parked in await() and every fork went back (10 runs)\");\n        check(clean13, \"a philosopher signalled and interrupted at once handed its grant on: the arrays \"\n            + \"ended clean in all 10 runs, so no seat is left marked EATING by a thread that has gone home\");\n\n        // 14. the asymmetric fix: odd seats reach the other way, and that alone breaks the ring.\n        DiningTable asym = new DiningTable(5, new AsymmetricPolicy(), 1_000).configure(Work.none(), Work.none());\n        boolean done14 = false;\n        asym.start();\n        done14 = asym.awaitFinish(20_000);\n        check(done14 && asym.totalMeals() == 5_000 && !asym.anyForkViolated(),\n            \"asymmetric seating: 5000 meals, no deadlock, no fork in two hands -- with no global order at all\");\n\n        // 15. the other half of the wait protocol: who gets told. One condition for several different\n        //     conditions loses wakeups, which is the whole reason \"notifyAll, not notify\" is advice.\n        check(!WakeupRules.woken(false), \"one shared condition + signal(): the wakeup went to a thread whose own \"\n            + \"test was still false, and the thread the change was for was never told\");\n        check(WakeupRules.woken(true), \"signalAll(): everybody wakes, everybody re-tests in its while loop, \"\n            + \"and the one the change was for gets through\");\n\n        System.out.println(\"elapsed \" + (System.currentTimeMillis() - started) + \" ms\");\n        System.out.println(failures == 0 ? \"ALL PASS\" : failures + \" FAILED\");\n        if (failures != 0) System.exit(1);\n    }\n}\n"};
function wireCopy(root){root.querySelectorAll('button.copy').forEach(b=>{b.onclick=()=>{const key=b.dataset.key;const txt=key?RAW[key]:b.closest('.ed').querySelector('code').textContent;navigator.clipboard.writeText(txt).then(()=>{b.textContent='copied';setTimeout(()=>b.textContent='copy',1500);});};});}
const KW=/\b(abstract|boolean|break|case|catch|class|continue|default|do|double|else|enum|extends|final|finally|for|if|implements|import|int|interface|long|new|null|package|private|protected|public|return|static|super|switch|synchronized|this|throw|throws|try|void|while|var|record|true|false)\b/g;
const TY=/\b([A-Z][A-Za-z0-9]*)\b/g;
function hl(src){let inDoc=false;return src.split('\n').map((l,i)=>{let e=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const t=e.trim();let out;if(inDoc||t.startsWith('/**')){out='<span class="d">'+e+'</span>';if(t.startsWith('/**'))inDoc=!t.endsWith('*/');else if(t.endsWith('*/'))inDoc=false;}else{const parts=e.split(/(\/\/.*$|"(?:[^"\\]|\\.)*")/);out=parts.map((p,j)=>j%2?(p.startsWith('//')?'<span class="c">'+p+'</span>':'<span class="s">'+p+'</span>'):p.replace(KW,'<span class="k">$1</span>').replace(TY,'<span class="t">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>')).join('');}return '<span class="ln">'+(i+1)+'</span>'+out;}).join('\n');}
let cur=parseInt(localStorage.getItem('mt-dining.step')||'1',10);
const side=document.getElementById('side'),study=document.getElementById('study');
function classesSoFar_unused(n){const out=[];STEPS.filter(s=>s.id<=n&&s.code).forEach(s=>{(s.code.match(/(?:class|interface|enum)\s+([A-Z]\w*)/g)||[]).forEach(m=>out.push({name:m.split(/\s+/)[1],step:s.id}));});return out;}
function render(){
  side.innerHTML='';let g='';STEPS.forEach(s=>{if(s.stage!==g){g=s.stage;side.insertAdjacentHTML('beforeend','<div class="grp">'+g+'</div>');}side.insertAdjacentHTML('beforeend','<div class="st'+(s.id===cur?' on':s.id<cur?' done':'')+'" data-id="'+s.id+'"><span class="n">'+String(s.id).padStart(2,'0')+'</span><span>'+s.title+'</span></div>');});
  const s=STEPS[cur-1];
  study.innerHTML='<div class="hdr"><span class="stage">'+s.stage+'</span><h2>'+String(s.id).padStart(2,'0')+' &middot; '+s.title+'</h2></div>'+(s.think?'<div class="think">'+s.think+'</div>':'')+(s.body||'')+(s.code?'<div class="ed"><div class="tab"><b>'+(s.file||'Main.java')+'</b><button class="copy" data-src="ed">copy</button></div><pre><code class="java">'+hl(s.code)+'</code></pre></div>':'')+'<div class="nav"><button id="prev">&larr; prev</button><button id="next" class="pri">next &rarr;</button></div>';
  study.querySelectorAll('pre code.java').forEach(el=>{el.innerHTML=hl(el.textContent);});wireCopy(study);wireTimers(study);const miss=document.getElementById('miss');if(miss){try{miss.value=localStorage.getItem('mt-dining.miss')||'';}catch(e){}miss.addEventListener('input',()=>{try{localStorage.setItem('mt-dining.miss',miss.value);}catch(e){}});}
  document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
  document.querySelector('.wrap').classList.toggle('wide',!!s.wide);document.querySelector('.wrap').classList.toggle('code',!!s.code);localStorage.setItem('mt-dining.step',cur);study.scrollIntoView();
}
function go(n){if(n<1||n>STEPS.length)return;cur=n;setMode('study');render();}
side.addEventListener('click',e=>{const t=e.target.closest('.st');if(t)go(+t.dataset.id);});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
const main=document.getElementById('main');
function setMode(m){}
function wireTimers(root){root.querySelectorAll('button.timer[data-min]').forEach(b=>{const total=+b.dataset.min*60;let left=total,id=null;const show=()=>{b.textContent=(id?'':'start ')+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');};b.onclick=()=>{if(id){clearInterval(id);id=null;b.classList.remove('run');show();return;}if(left<=0)left=total;b.classList.remove('done');b.classList.add('run');id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;b.classList.remove('run');b.classList.add('done');b.textContent='time -- open the fold';}},1000);show();};show();});}
render();
</script></body></html>

 money and never answers: no order, and the sweep refunds the orphan once\n        TimeoutGateway g8 = new TimeoutGateway();\n        ChargeBook book = new ChargeBook();\n        OrderService s8 = service(g8, List.of(new ItemTotal()), &quot;0.00&quot;);\n        s8.setChargeLog(book);\n        Restaurant tiff = new Restaurant(&quot;r8&quot;, &quot;Tiffins&quot;, SHOP, 10);\n        tiff.put(new MenuItem(&quot;vada&quot;, &quot;Medu Vada&quot;, Money.rupees(&quot;90.00&quot;)), 6);\n        s8.register(tiff);\n        try {\n            place(s8, &quot;j1&quot;, &quot;r8&quot;, &quot;vada&quot;, 2, &quot;j1k&quot;, List.of());\n            check(false, &quot;an unknown payment outcome must not place an order&quot;);\n        } catch (IllegalStateException e) {\n            check(true, &quot;a gateway that never answered leaves no order: &quot; + e.getMessage());\n        }\n        check(tiff.stockOf(&quot;vada&quot;) == 6, &quot;the vadas went straight back on the shelf&quot;);\n        check(book.having(ChargeOutcome.UNKNOWN).size() == 1, &quot;the attempt is on record as UNKNOWN: the only trace of the money&quot;);\n        Reconciler reconciler = new Reconciler(book, g8.settlement(), g8);\n        check(reconciler.sweep() == 1 &amp;&amp; g8.refundCount() == 1, &quot;the sweep asks the gateway and refunds the orphan&quot;);\n        check(reconciler.sweep() == 0 &amp;&amp; g8.refundCount() == 1, &quot;a second sweep refunds nothing: it is idempotent&quot;);\n        g8.recover();\n        place(s8, &quot;j1&quot;, &quot;r8&quot;, &quot;vada&quot;, 2, &quot;j1k&quot;, List.of());\n        check(tiff.stockOf(&quot;vada&quot;) == 4, &quot;and the customer&#x27;s retry, on the same key, places one real order&quot;);\n\n        // 11. a rider coming free races an order becoming ready: nobody waits while a rider stands idle\n        FakeGateway g9 = new FakeGateway();\n        OrderService s9 = service(g9, List.of(new ItemTotal()), &quot;0.00&quot;);\n        Restaurant track = new Restaurant(&quot;r9&quot;, &quot;Race Kitchen&quot;, SHOP, 5);\n        track.put(new MenuItem(&quot;bun&quot;, &quot;Bun&quot;, Money.rupees(&quot;100.00&quot;)), 2000);\n        s9.register(track);\n        s9.register(new DeliveryPartner(&quot;solo&quot;, new Geo(12.9353, 77.6246)));\n        int stranded = 0;\n        for (int round = 0; round &lt; 150; round++) {\n            Order carried = place(s9, &quot;x&quot; + round, &quot;r9&quot;, &quot;bun&quot;, 1, &quot;xa&quot; + round, List.of());\n            Order next = place(s9, &quot;y&quot; + round, &quot;r9&quot;, &quot;bun&quot;, 1, &quot;xb&quot; + round, List.of());\n            for (Order o : List.of(carried, next)) { s9.accept(o.id()); s9.startPreparing(o.id()); }\n            s9.markReady(carried.id());                                   // takes the only rider\n            CountDownLatch gate = new CountDownLatch(1);\n            Future&lt;?&gt; dropping = pool.submit(() -&gt; { gate.await(); s9.pickUp(carried.id()); s9.deliver(carried.id()); return null; });\n            Future&lt;?&gt; readying = pool.submit(() -&gt; { gate.await(); return s9.markReady(next.id()); });\n            gate.countDown();\n            dropping.get(); readying.get();\n            if (next.partnerId() == null) stranded++;                     // a free rider and a waiting order\n            s9.pickUp(next.id()); s9.deliver(next.id());                  // reset for the next round\n        }\n        check(stranded == 0, &quot;150 rounds of deliver-races-ready: never once did an order wait for an idle rider&quot;);\n\n        // and two riders coming free at the same instant must not both be given to the same waiting order\n        OrderService s10 = service(new FakeGateway(), List.of(new ItemTotal()), &quot;0.00&quot;);\n        Restaurant two = new Restaurant(&quot;r10&quot;, &quot;Two Riders&quot;, SHOP, 5);\n        two.put(new MenuItem(&quot;bun&quot;, &quot;Bun&quot;, Money.rupees(&quot;100.00&quot;)), 2000);\n        s10.register(two);\n        DeliveryPartner ra = new DeliveryPartner(&quot;ra&quot;, new Geo(12.9353, 77.6246));\n        DeliveryPartner rb = new DeliveryPartner(&quot;rb&quot;, new Geo(12.9354, 77.6247));\n        s10.register(ra); s10.register(rb);\n        int doubled = 0;\n        for (int round = 0; round &lt; 150; round++) {\n            Order a1 = place(s10, &quot;p&quot; + round, &quot;r10&quot;, &quot;bun&quot;, 1, &quot;pa&quot; + round, List.of());\n            Order a2 = place(s10, &quot;q&quot; + round, &quot;r10&quot;, &quot;bun&quot;, 1, &quot;qa&quot; + round, List.of());\n            Order waits = place(s10, &quot;w&quot; + round, &quot;r10&quot;, &quot;bun&quot;, 1, &quot;wa&quot; + round, List.of());\n            for (Order o : List.of(a1, a2, waits)) { s10.accept(o.id()); s10.startPreparing(o.id()); s10.markReady(o.id()); }\n            CountDownLatch gate = new CountDownLatch(1);\n            Future&lt;?&gt; d1 = pool.submit(() -&gt; { gate.await(); s10.pickUp(a1.id()); s10.deliver(a1.id()); return null; });\n            Future&lt;?&gt; d2 = pool.submit(() -&gt; { gate.await(); s10.pickUp(a2.id()); s10.deliver(a2.id()); return null; });\n            gate.countDown();\n            d1.get(); d2.get();\n            int idle = (ra.isAvailable() ? 1 : 0) + (rb.isAvailable() ? 1 : 0);\n            if (waits.partnerId() == null || idle != 1) doubled++;        // one carries it, one is free\n            s10.pickUp(waits.id()); s10.deliver(waits.id());\n        }\n        check(doubled == 0, &quot;150 rounds of two hand-backs at once: one rider took the waiting order, one stayed free&quot;);\n\n        // 12. the customer cancels at the instant a rider is being found: the rider must not stay with a dead order\n        CountDownLatch ranking = new CountDownLatch(1), carryOn = new CountDownLatch(1);\n        AssignmentRule slow = (free, pickup) -&gt; {                      // a ranking that pauses mid-dispatch\n            ranking.countDown();\n            try { carryOn.await(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            return new NearestFree().rank(free, pickup);\n        };\n        OrderService s12 = new OrderService();\n        s12.configure(List.of(new ItemTotal()), slow, new StandardCancellation(0), new FakeGateway());\n        kitchen(s12, &quot;r12&quot;, &quot;bun&quot;, &quot;100.00&quot;, 10);\n        DeliveryPartner lone = new DeliveryPartner(&quot;lone&quot;, SHOP);\n        s12.register(lone);\n        Order gone = place(s12, &quot;z1&quot;, &quot;r12&quot;, &quot;bun&quot;, 1, &quot;z1k&quot;, List.of());\n        s12.accept(gone.id()); s12.startPreparing(gone.id());\n        Future&lt;Boolean&gt; dispatching = pool.submit(() -&gt; s12.markReady(gone.id()));\n        ranking.await();                                               // the dispatcher is mid-ranking...\n        s12.cancel(gone.id());                                         // ...and the customer cancels right now\n        carryOn.countDown();\n        dispatching.get();\n        check(lone.isAvailable() &amp;&amp; gone.partnerId() == null,\n              &quot;a cancel that lands mid-dispatch leaves the rider free, not stuck with a cancelled order&quot;);\n\n        // 13. two riders come free at the same instant while two orders wait: both orders get one\n        AtomicBoolean armed = new AtomicBoolean();\n        AtomicInteger calls = new AtomicInteger();\n        CyclicBarrier together = new CyclicBarrier(2);\n        AssignmentRule inStep = (free, pickup) -&gt; {                    // once armed, the first two rankings meet\n            if (armed.get() &amp;&amp; calls.incrementAndGet() &lt;= 2)\n                try { together.await(2, TimeUnit.SECONDS); } catch (Exception e) { }\n            return new NearestFree().rank(free, pickup);\n        };\n        OrderService s13 = new OrderService();\n        s13.configure(List.of(new ItemTotal()), inStep, new StandardCancellation(0), new FakeGateway());\n        kitchen(s13, &quot;r13&quot;, &quot;bun&quot;, &quot;100.00&quot;, 10);\n        s13.register(new DeliveryPartner(&quot;rc&quot;, SHOP));\n        s13.register(new DeliveryPartner(&quot;rd&quot;, SHOP));\n        List&lt;Order&gt; four = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 4; i++) {                                  // the first two ride, the last two wait\n            Order o = place(s13, &quot;t&quot; + i, &quot;r13&quot;, &quot;bun&quot;, 1, &quot;tk&quot; + i, List.of());\n            s13.accept(o.id()); s13.startPreparing(o.id()); s13.markReady(o.id());\n            four.add(o);\n        }\n        s13.pickUp(four.get(0).id()); s13.pickUp(four.get(1).id());\n        armed.set(true);\n        Future&lt;?&gt; drop1 = pool.submit(() -&gt; { s13.deliver(four.get(0).id()); return null; });\n        Future&lt;?&gt; drop2 = pool.submit(() -&gt; { s13.deliver(four.get(1).id()); return null; });\n        drop1.get(); drop2.get();\n        check(four.get(2).partnerId() != null &amp;&amp; four.get(3).partnerId() != null &amp;&amp; s13.waitingCount() == 0,\n              &quot;two riders freed at the same instant: both waiting orders got one, and nobody idles&quot;);\n\n        // 14. nobody picks up an order that has no rider, and a rider who logs in takes a waiting order at once\n        OrderService s14 = service(new FakeGateway(), List.of(new ItemTotal()), &quot;0.00&quot;);\n        kitchen(s14, &quot;r14&quot;, &quot;bun&quot;, &quot;100.00&quot;, 10);\n        Order lonely = place(s14, &quot;l1&quot;, &quot;r14&quot;, &quot;bun&quot;, 1, &quot;l1k&quot;, List.of());\n        s14.accept(lonely.id()); s14.startPreparing(lonely.id()); s14.markReady(lonely.id());   // no riders yet\n        try { s14.pickUp(lonely.id()); check(false, &quot;an order with no rider must not be picked up&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;no rider, no pickup: &quot; + e.getMessage()); }\n        s14.register(new DeliveryPartner(&quot;late&quot;, SHOP));\n        check(&quot;late&quot;.equals(lonely.partnerId()) &amp;&amp; s14.waitingCount() == 0,\n              &quot;a rider who logs in while an order waits is given it at once&quot;);\n\n        // 15. the refund fails during a cancel: the rider and the food still go back, and the refund is owed\n        RefundsDown g15 = new RefundsDown();\n        ChargeBook book15 = new ChargeBook();\n        OrderService s15 = service(g15, List.of(new ItemTotal()), &quot;0.00&quot;);\n        s15.setChargeLog(book15);\n        kitchen(s15, &quot;r15&quot;, &quot;bun&quot;, &quot;100.00&quot;, 10);\n        DeliveryPartner rr = new DeliveryPartner(&quot;rr&quot;, SHOP);\n        s15.register(rr);\n        Order owed = place(s15, &quot;u1&quot;, &quot;r15&quot;, &quot;bun&quot;, 1, &quot;u1k&quot;, List.of());\n        s15.accept(owed.id()); s15.startPreparing(owed.id()); s15.markReady(owed.id());   // rr carries it\n        try { s15.cancel(owed.id()); } catch (RuntimeException e) { check(false, &quot;the cancel threw: &quot; + e.getMessage()); }\n        check(rr.isAvailable() &amp;&amp; owed.state() == OrderState.CANCELLED, &quot;a refund that fails does not strand the rider&quot;);\n        check(book15.having(ChargeOutcome.REFUND_OWED).size() == 1, &quot;the refund is on record as owed, not lost&quot;);\n        g15.recover();\n        Reconciler sweeper = new Reconciler(book15, chargeId -&gt; true, g15);\n        check(sweeper.sweep() == 1 &amp;&amp; sweeper.sweep() == 0 &amp;&amp; g15.refunds.get() == 1,\n              &quot;the sweep sends the owed refund once, and a second sweep sends nothing&quot;);\n\n        // 16. a rider who says yes to an offer is the order&#x27;s rider, and is handed back after the drop\n        OrderService s16 = new OrderService();\n        s16.configure(List.of(new ItemTotal()), (free, pickup) -&gt; List.of(), new StandardCancellation(0), new FakeGateway());\n        kitchen(s16, &quot;r16&quot;, &quot;bun&quot;, &quot;100.00&quot;, 10);\n        DeliveryPartner ro = new DeliveryPartner(&quot;ro&quot;, SHOP);\n        s16.register(ro);\n        Order offered = place(s16, &quot;v1&quot;, &quot;r16&quot;, &quot;bun&quot;, 1, &quot;v1k&quot;, List.of());\n        s16.accept(offered.id()); s16.startPreparing(offered.id()); s16.markReady(offered.id());   // it waits\n        boolean took = new OfferDesk().offer(ro, offered, (id, deadline) -&gt; true, 0);\n        check(took &amp;&amp; &quot;ro&quot;.equals(offered.partnerId()), &quot;a rider who accepts an offer is attached to the order&quot;);\n        s16.pickUp(offered.id()); s16.deliver(offered.id());\n        check(ro.isAvailable(), &quot;and he is back in the pool after the drop&quot;);\n\n        // 17. a booking for 20:00 is released early enough to ARRIVE at 20:00, through its own cart\n        OrderService s17 = service(new FakeGateway(), List.of(new ItemTotal()), &quot;0.00&quot;);\n        Restaurant dinner = new Restaurant(&quot;r17&quot;, &quot;Dinner&quot;, SHOP, 18);         // 18 minutes of cooking\n        dinner.put(new MenuItem(&quot;bun&quot;, &quot;Bun&quot;, Money.rupees(&quot;100.00&quot;)), 50);\n        s17.register(dinner);\n        Restaurant shutK = new Restaurant(&quot;r17x&quot;, &quot;Shut&quot;, SHOP, 30);\n        shutK.put(new MenuItem(&quot;bun&quot;, &quot;Bun&quot;, Money.rupees(&quot;100.00&quot;)), 5);\n        shutK.setOpen(false);\n        s17.register(shutK);\n        Scheduler sch = new Scheduler(22);                                     // HOME is a 7.4 minute ride away\n        long eight = 1_700_000_000_000L;\n        sch.book(new Scheduler.Booking(&quot;bad&quot;, &quot;w1&quot;, &quot;r17x&quot;, HOME, Map.of(&quot;bun&quot;, 1), eight));\n        sch.book(new Scheduler.Booking(&quot;b1&quot;, &quot;w1&quot;, &quot;r17&quot;, HOME, Map.of(&quot;bun&quot;, 2), eight));\n        s17.openCart(&quot;w1&quot;, &quot;r17&quot;, HOME);                                       // meanwhile she is browsing\n        s17.addToCart(&quot;w1&quot;, &quot;r17&quot;, &quot;bun&quot;, 1);\n        check(sch.tick(s17, eight - 26 * 60_000L).isEmpty() &amp;&amp; sch.failed().size() == 1,\n              &quot;26 minutes before, nothing is due; the closed kitchen&#x27;s booking fails on its own&quot;);\n        check(sch.tick(s17, eight - 25 * 60_000L).size() == 1,\n              &quot;25 minutes before, it is released: 18 minutes of cooking plus 7 of riding, so it lands at 20:00&quot;);\n        check(s17.placeOrder(&quot;w1-own&quot;, &quot;w1&quot;, List.of()).lines().get(0).qty() == 1,\n              &quot;and the customer&#x27;s own cart was left alone: it still checks out with her one bun&quot;);\n\n        // 18. Flipkart&#x27;s FoodKart: a rating is the average of delivered orders, once each; the listing is sorted\n        OrderService s18 = service(new FakeGateway(), List.of(new ItemTotal()), &quot;0.00&quot;);\n        Restaurant fc1 = kitchen(s18, &quot;fc1&quot;, &quot;thali&quot;, &quot;100.00&quot;, 5), fc2 = kitchen(s18, &quot;fc2&quot;, &quot;thali&quot;, &quot;120.00&quot;, 3);\n        s18.register(new DeliveryPartner(&quot;d18&quot;, SHOP));\n        Catalog cat = new Catalog();\n        cat.onboard(fc1, Set.of(&quot;560102&quot;, &quot;560076&quot;));\n        cat.onboard(fc2, Set.of(&quot;560076&quot;));\n        Order ate1 = delivered(s18, &quot;e1&quot;, &quot;fc1&quot;, &quot;thali&quot;, &quot;k1&quot;), ate2 = delivered(s18, &quot;e2&quot;, &quot;fc1&quot;, &quot;thali&quot;, &quot;k2&quot;);\n        cat.rate(ate1, 3, &quot;ok&quot;);\n        cat.rate(ate2, 4, &quot;&quot;);\n        cat.rate(delivered(s18, &quot;e3&quot;, &quot;fc2&quot;, &quot;thali&quot;, &quot;k3&quot;), 5, &quot;Nice Food&quot;);\n        check(cat.ratingTenths(&quot;fc1&quot;) == 35 &amp;&amp; cat.ratingTenths(&quot;fc2&quot;) == 50, &quot;fc1 is (3 + 4) / 2 = 3.5 and fc2 is 5.0, in integer tenths&quot;);\n        try { cat.rate(ate1, 1, &quot;again&quot;); check(false, &quot;an order must not be rated twice&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;an order is rated once: &quot; + e.getMessage()); }\n        List&lt;Catalog.Listing&gt; best = cat.find(&quot;560076&quot;, &quot;thali&quot;, Catalog.BEST_RATED);\n        List&lt;Catalog.Listing&gt; cheap = cat.find(&quot;560076&quot;, &quot;thali&quot;, Catalog.CHEAPEST);\n        check(best.get(0).restaurantId().equals(&quot;fc2&quot;) &amp;&amp; cheap.get(0).restaurantId().equals(&quot;fc1&quot;)\n              &amp;&amp; cat.find(&quot;560102&quot;, &quot;thali&quot;, Catalog.CHEAPEST).size() == 1,\n              &quot;560076 best rated: fc2 first; cheapest: fc1 first; 560102 sees only fc1&quot;);\n        KitchenPicker byStars = new KitchenPicker();\n        byStars.capacity(&quot;fc1&quot;, 10);\n        byStars.capacity(&quot;fc2&quot;, 10);\n        Order starred = byStars.place(s18, &quot;st&quot;, &quot;e5&quot;, HOME, Map.of(&quot;thali&quot;, 1), List.of(fc1, fc2), KitchenPicker.bestRated(cat));\n        check(starred.restaurantId().equals(&quot;fc2&quot;), &quot;the best-rated strategy sends an order to fc2, though fc1 is cheaper&quot;);\n        fc2.setStock(&quot;thali&quot;, 0);\n        check(cat.find(&quot;560076&quot;, &quot;thali&quot;, Catalog.BEST_RATED).size() == 1, &quot;a kitchen with none left drops out of the list&quot;);\n\n        // 19. Intuit&#x27;s version: the system picks the kitchen, and 12 customers at once never overfill one\n        OrderService s19 = service(new FakeGateway(), List.of(new ItemTotal()), &quot;0.00&quot;);\n        Restaurant cheapK = kitchen(s19, &quot;ka&quot;, &quot;thali&quot;, &quot;100.00&quot;, 100), dearK = kitchen(s19, &quot;kb&quot;, &quot;thali&quot;, &quot;150.00&quot;, 100);\n        KitchenPicker picker = new KitchenPicker();\n        s19.addObserver(picker);\n        picker.capacity(&quot;ka&quot;, 4);                                      // items it can cook at once\n        picker.capacity(&quot;kb&quot;, 6);\n        Map&lt;String, Integer&gt; twoThalis = Map.of(&quot;thali&quot;, 2);\n        CountDownLatch go19 = new CountDownLatch(1);\n        List&lt;Future&lt;Order&gt;&gt; picks = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 12; i++) {\n            final String who = &quot;m&quot; + i;\n            picks.add(pool.submit(() -&gt; {\n                go19.await();\n                try { return picker.place(s19, &quot;mk&quot;, who, HOME, twoThalis, List.of(cheapK, dearK), KitchenPicker.cheapest(twoThalis)); }\n                catch (IllegalStateException full) { return null; }\n            }));\n        }\n        go19.countDown();\n        List&lt;Order&gt; atCheap = new ArrayList&lt;&gt;();\n        int atDear = 0, turnedAway = 0;\n        for (Future&lt;Order&gt; f : picks) {\n            Order o = f.get();\n            if (o == null) turnedAway++; else if (o.restaurantId().equals(&quot;ka&quot;)) atCheap.add(o); else atDear++;\n        }\n        check(atCheap.size() == 2 &amp;&amp; atDear == 3 &amp;&amp; turnedAway == 7,\n              &quot;12 at once, 2 thalis each: the cheap kitchen takes 2 orders (4 items), the dear one 3 (6), 7 are told all are full&quot;);\n        s19.cancel(atCheap.get(0).id());\n        Order next19 = picker.place(s19, &quot;mk&quot;, &quot;m99&quot;, HOME, twoThalis, List.of(cheapK, dearK), KitchenPicker.cheapest(twoThalis));\n        check(next19.restaurantId().equals(&quot;ka&quot;), &quot;a cancel gives the cheap kitchen its room back, so the next order goes there&quot;);\n        CommandReplay replay = new CommandReplay();                   // the same round&#x27;s input arrives shuffled\n        s19.setClock(replay.clock());\n        Order[] fed = new Order[1];\n        replay.submit(300, &quot;start cooking&quot;, () -&gt; s19.startPreparing(fed[0].id()));\n        replay.submit(100, &quot;place&quot;, () -&gt; fed[0] = place(s19, &quot;n1&quot;, &quot;ka&quot;, &quot;thali&quot;, 1, &quot;n1k&quot;, List.of()));\n        replay.submit(200, &quot;accept&quot;, () -&gt; s19.accept(fed[0].id()));\n        List&lt;String&gt; ran = replay.runAll();\n        check(fed[0].state() == OrderState.PREPARING &amp;&amp; fed[0].stamps().get(OrderState.PLACED) == 100\n              &amp;&amp; fed[0].stamps().get(OrderState.PREPARING) == 300 &amp;&amp; ran.get(0).startsWith(&quot;100 place&quot;),\n              &quot;commands fed as 300, 100, 200 run as 100, 200, 300, and each stamp is its command&#x27;s time&quot;);\n\n        pool.shutdown();\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design the ordering side of Swiggy. A customer fills a cart from one restaurant and checks out; the restaurant accepts it, cooks it and marks it ready; a delivery partner picks it up and drops it. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (one restaurant per cart, and whether payment is in scope, first); then type in the order of Main.java: OrderState with its transition table, PartnerState, Money, the records (Geo, MenuItem, OrderLine, Bill, PriceCtx, Refund), the seven one-method interfaces, the pricing rules with the two decorators, NearestFree and StandardCancellation, Restaurant with its lock and <code>reserve()</code>, Cart, Order with its own lock (it guards the state and the rider field), DeliveryPartner with its compare-and-set, then OrderService with placeOrder in its numbered steps, then a main with thirty threads racing for ten portions. The must-write core is the state table, <code>reserve()</code>, <code>placeOrder</code> and the rider claim. The charge log, the sweep and the extra rules can be named and left for the follow-ups if the hour runs short.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Marketing wants 40% off, capped at 120 rupees, on a bill that already has a distance fee and a surge multiplier on it.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The price is a list of one-method rules applied in order, so this is two new classes and two lines. <code>PercentCoupon</code> takes its percentage off the food only. <code>CappedDiscount</code> wraps it and trims whatever it took off down to the cap, so &ldquo;40% off, up to 120&rdquo; is a wrapper rather than a clause inside every coupon written from now on. The order of the list is the order of the maths: food, distance fee, surge on the fee only, then the coupons. Here that is 558.00 of food, 44.00 of fee (20 plus 8 a kilometre, rounded up to 3 km), 22.00 of surge, and 223.20 of coupon trimmed to 120.00, for 504.00. Every rule is wrapped in <code>CheckedRule</code> before it is used, so one that leaves the parts and the total out of step throws before the card is touched.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** A flat pickup fee plus a per-kilometre fee, rounded up to the next whole kilometre. */\nfinal class DistanceFee implements PricingRule {\n    private final long basePaise, perKmPaise;\n    DistanceFee(long basePaise, long perKmPaise) { this.basePaise = basePaise; this.perKmPaise = perKmPaise; }\n    public Bill apply(Bill running, PriceCtx ctx) {\n        return running.addDelivery(basePaise + perKmPaise * (long) Math.ceil(ctx.km()));\n    }\n}\n\n/** Rain, a cricket final, a Friday night: a multiplier on the delivery fee only, never on the food. */\nfinal class SurgeFee implements PricingRule {\n    private final long multBps;                                   // 15000 = 1.5x\n    SurgeFee(long multBps) { this.multBps = multBps; }\n    public Bill apply(Bill running, PriceCtx ctx) {\n        if (!ctx.busy()) return running;\n        return running.addSurge(running.delivery() * (multBps - 10_000) / 10_000);\n    }\n}\n\n/** A percentage off the food (not the fees), in basis points: 4000 = 40%. Fires only if its code was used. */\nfinal class PercentCoupon implements PricingRule {\n    private final String code; private final long offBps;\n    PercentCoupon(String code, long offBps) { this.code = code; this.offBps = offBps; }\n    public Bill apply(Bill running, PriceCtx ctx) {\n        if (!ctx.coupons().contains(code)) return running;\n        return running.addDiscount(running.items() * offBps / 10_000);\n    }\n}\n\n/** A flat amount off, never more than what is still owed, so a coupon can take the bill to zero but not below. */\nfinal class FlatCoupon implements PricingRule {\n    private final String code; private final long offPaise;\n    FlatCoupon(String code, long offPaise) { this.code = code; this.offPaise = offPaise; }\n    public Bill apply(Bill running, PriceCtx ctx) {\n        if (!ctx.coupons().contains(code)) return running;\n        return running.addDiscount(Math.min(offPaise, running.total()));\n    }\n}\n\n/**\n * DECORATOR. Wraps any discount rule and caps what it took off: &quot;40% off, up to 120 rupees&quot;. The inner rule\n * does not know it is capped, so one cap class serves every coupon written this year and next.\n */\nfinal class CappedDiscount implements PricingRule {\n    private final PricingRule inner; private final long capPaise;\n    CappedDiscount(PricingRule inner, long capPaise) { this.inner = inner; this.capPaise = capPaise; }\n    public Bill apply(Bill running, PriceCtx ctx) {\n        Bill after = inner.apply(running, ctx);\n        long took = after.discount() - running.discount();\n        return took &lt;= capPaise ? after : running.addDiscount(capPaise);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two customers tap for the last two portions at the same instant. Prove one of them loses, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading a stock count and writing it back. <code>Restaurant.reserve</code> does the whole read-modify-write inside the restaurant's lock, in two phases. It checks <i>every</i> line against the live menu and the live stock first, and only then decrements them all, so an order is all of its lines or none of them. The proof is a count, not a hope. Thirty threads wait on one latch, each wants two of the ten portions, and afterwards exactly five orders exist, the stock is exactly zero and the card was touched exactly five times. The last number is the one worth pointing at: it proves the twenty-five losers never reached the gateway at all.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. thirty phones, ten portions, two each: the stock decides, exactly five orders exist,\n        //    and the card is touched exactly five times.\n        FakeGateway g1 = new FakeGateway();\n        OrderService s1 = service(g1, List.of(new ItemTotal()), &quot;0.00&quot;);\n        Restaurant rush = new Restaurant(&quot;r1&quot;, &quot;Meghana&quot;, SHOP, 15);\n        rush.put(new MenuItem(&quot;thali&quot;, &quot;Andhra Thali&quot;, Money.rupees(&quot;300.00&quot;)), 10);\n        s1.register(rush);\n        ExecutorService pool = Executors.newFixedThreadPool(12);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;Boolean&gt;&gt; tries = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 30; i++) {\n            final String who = &quot;c&quot; + i;\n            s1.openCart(who, &quot;r1&quot;, HOME);\n            s1.addToCart(who, &quot;r1&quot;, &quot;thali&quot;, 2);\n            tries.add(pool.submit(() -&gt; {\n                go.await();\n                try { s1.placeOrder(&quot;k&quot; + who, who, List.of()); return true; }\n                catch (RuntimeException e) { return false; }\n            }));\n        }\n        go.countDown();\n        int won = 0;\n        for (Future&lt;Boolean&gt; f : tries) if (f.get()) won++;\n        check(won == 5, &quot;30 phones raced for 10 portions at 2 each: exactly 5 orders exist (&quot; + won + &quot;)&quot;);\n        check(rush.stockOf(&quot;thali&quot;) == 0, &quot;the stock landed on exactly zero, never below&quot;);\n        check(g1.chargeCount() == 5, &quot;the card was touched exactly 5 times, once per winner&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock per restaurant. Does that scale, or have you serialised Swiggy?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It scales, and the answer is arithmetic rather than opinion: about ten hash operations under the lock, roughly two microseconds, against four orders a minute in a busy kitchen. Even a fictional fifty checkouts a second into one restaurant is a hundred microseconds of lock in every second. And the lock is per restaurant, so the city's eight thousand kitchens never meet. The sentence to say next shows you know what you are defending. What would ruin it is not the number of customers; it is putting the card gateway inside the lock. Four hundred milliseconds is two hundred thousand times longer than the critical section (the code that runs while the lock is held). You would never see it in testing at four orders a minute, and you would see it every lunchtime in production. Read <code>reserve()</code> and notice what is <i>not</i> in it: no pricing, no payment, no notification.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * THE RACE. Check every line against the live menu and stock, and only then take the stock down --\n     * all of the lines or none of them, inside one lock, so two customers can never both get the last portion.\n     * Returns the lines priced at today&#x27;s menu prices: the order is never priced by the client.\n     */\n    List&lt;OrderLine&gt; reserve(Map&lt;String, Integer&gt; want) {\n        lock.lock();\n        try {\n            if (!open) throw new IllegalStateException(name + &quot; is closed right now&quot;);\n            if (want.isEmpty()) throw new IllegalArgumentException(&quot;an empty cart cannot be checked out&quot;);\n            List&lt;OrderLine&gt; lines = new ArrayList&lt;&gt;(want.size());\n            for (Map.Entry&lt;String, Integer&gt; e : want.entrySet()) {          // 1. check everything first\n                MenuItem item = menu.get(e.getKey());\n                if (item == null) throw new IllegalArgumentException(e.getKey() + &quot; is not on this menu&quot;);\n                int have = stock.getOrDefault(e.getKey(), 0);\n                if (e.getValue() &lt;= 0) throw new IllegalArgumentException(&quot;quantity must be positive&quot;);\n                if (have &lt; e.getValue())\n                    throw new IllegalStateException(item.name() + &quot;: only &quot; + have + &quot; left, &quot; + e.getValue() + &quot; wanted&quot;);\n                lines.add(new OrderLine(item.id(), item.name(), item.pricePaise(), e.getValue()));\n            }\n            for (OrderLine l : lines) stock.merge(l.itemId(), -l.qty(), Integer::sum);   // 2. only now, write\n            return List.copyOf(lines);\n        } finally { lock.unlock(); }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; The card is declined at checkout. What is the state of the system?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was. The order is built <i>after</i> the charge returns, so a decline leaves no order in the map, nothing on the restaurant's screen and no refund to issue. What it does leave is a reservation, so the catch hands the stock straight back under the restaurant's lock and rethrows. The customer sees one clean error and can try another card. The same exit covers a sold-out line and a pricing rule that throws. One thing to defend out loud: the card is charged with no lock held, because four hundred milliseconds inside a lock would stall every other customer of that restaurant. And read step 3 carefully: a decline and a gateway that never answers are not the same event, and the next question is about the second one.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** The critical step itself, numbered below. Nothing is committed until the money has moved. */\n    private Order doPlace(Cart cart, List&lt;String&gt; coupons) {\n        if (cart.isEmpty()) throw new IllegalStateException(&quot;nothing in the cart&quot;);\n        String customerId = cart.customerId();\n        Restaurant r = restaurants.get(cart.restaurantId());\n        if (r == null) throw new IllegalArgumentException(&quot;no such restaurant&quot;);\n\n        // 1. under the restaurant&#x27;s lock: validate against the live menu and take the stock down, all or none.\n        List&lt;OrderLine&gt; lines = r.reserve(cart.snapshot());\n        Order o;\n        try {\n            // 2. price it with no lock held. Rules can throw; nothing outside the reservation has moved yet.\n            PriceCtx ctx = new PriceCtx(r.id(), customerId, r.at().kmTo(cart.dropAt()),\n                                        demand.busy(r.id(), clock.nowMs()), List.copyOf(coupons), lines);\n            Bill bill = Bill.EMPTY;\n            for (PricingRule rule : pricing) bill = rule.apply(bill, ctx);\n\n            // 3. the irreversible external action, outside every lock. Nothing has been committed yet.\n            //    Write the attempt down BEFORE the call: if the answer never comes back, this row is the only\n            //    proof we tried, and the reconciler uses it to ask the gateway later.\n            String chargeId = &quot;ch-&quot; + chargeSeq.incrementAndGet();\n            chargeLog.record(chargeId, customerId, bill.total(), ChargeOutcome.ATTEMPTED);\n            boolean paid;\n            try { paid = payments.charge(chargeId, bill.total()); }\n            catch (RuntimeException gatewayDied) {                      // a timeout: we do NOT know\n                chargeLog.record(chargeId, customerId, bill.total(), ChargeOutcome.UNKNOWN);\n                throw new IllegalStateException(&quot;payment outcome unknown for &quot; + chargeId\n                                              + &quot;; no order was created and the charge will be reconciled&quot;);\n            }\n            chargeLog.record(chargeId, customerId, bill.total(),\n                             paid ? ChargeOutcome.CHARGED : ChargeOutcome.DECLINED);\n            if (!paid) throw new IllegalStateException(&quot;payment declined for &quot; + Money.fmt(bill.total()));\n\n            // 4. the money moved, so now -- and only now -- an order exists.\n            o = new Order(&quot;o-&quot; + orderSeq.incrementAndGet(), customerId, r.id(), chargeId,\n                          lines, bill, cart.dropAt(), clock.nowMs());\n            orders.put(o.id(), o);\n            r.enqueue(o.id());\n            cart.clear();\n        } catch (RuntimeException e) {\n            r.giveBack(lines);                                 // a decline or a bad rule returns the food\n            throw e;\n        }\n        publish(o, null);                                      // 5. after everything is committed\n        return o;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; The gateway times out. You do not know whether the customer was charged. Now what?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>This is the one case &ldquo;pay, then commit&rdquo; cannot rule out, and the wrong answer is to treat it as a decline: the money may have left, and nothing points at it. So the attempt is written down <i>before</i> the gateway is called and marked UNKNOWN when the call dies. That row is the only thing left pointing at the customer's money. No order is created and the food goes back, exactly as for a decline. A sweep (a job that runs every few minutes) then asks the gateway what really happened. If the money moved, it is an orphan (money taken with no order to show for it). An UNKNOWN charge can never belong to an order, because an order is only built after a charge that answered. So it goes back, and the answer is written into the log, which is what makes running the sweep twice refund once. The same sweep sends any refund still owed: a refund is written down as REFUND_OWED before the gateway is called, and marked REFUNDED only once it went through.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * What we know about one charge. UNKNOWN is the dangerous one: the money may or may not have left the\n * customer. REFUND_OWED is written before a refund is sent and stays until the gateway confirms it, so a\n * refund that fails is retried by the sweep instead of lost. REFUNDED means the money went back.\n */\nenum ChargeOutcome { ATTEMPTED, CHARGED, DECLINED, UNKNOWN, REFUND_OWED, REFUNDED }\n\n/**\n * Where a charge is written down BEFORE the gateway is called, and again after, with what we learned. Without\n * this line a timed-out charge is money nobody can find: no order to look up, and no record that we ever tried.\n */\ninterface ChargeLog {\n    /** Record one step of one charge attempt. Must not throw: it is on the checkout path. */\n    void record(String chargeId, String customerId, long paise, ChargeOutcome outcome);\n}\n\n// ---- ext: unknown payment -- the charge that timed out, and the sweep that finds the money again\n/**\n * The one outcome &quot;pay, then commit&quot; cannot rule out: the gateway takes the money and the answer never comes\n * back. Refusing to create the order is right -- but the customer has been charged and nothing points at his\n * money. The fix is a line of bookkeeping and a sweep: write the attempt down BEFORE the call, mark it\n * UNKNOWN when the call dies, and ask the gateway later what really happened.\n */\nfinal class ChargeBook implements ChargeLog {\n    /** One charge attempt, as the log knows it right now. */\n    record Attempt(String chargeId, String customerId, long paise, ChargeOutcome outcome) {}\n\n    private final Map&lt;String, Attempt&gt; byCharge = new ConcurrentHashMap&lt;&gt;();\n\n    public void record(String chargeId, String customerId, long paise, ChargeOutcome outcome) {\n        byCharge.put(chargeId, new Attempt(chargeId, customerId, paise, outcome));\n    }\n    /** The rows in one state: UNKNOWN charges and owed refunds are the only ones the reconciler looks at. */\n    List&lt;Attempt&gt; having(ChargeOutcome outcome) {\n        List&lt;Attempt&gt; out = new ArrayList&lt;&gt;();\n        for (Attempt a : byCharge.values()) if (a.outcome() == outcome) out.add(a);\n        return out;\n    }\n    /** What the log says about one charge, or null if it never heard of it. */\n    ChargeOutcome outcomeOf(String chargeId) {\n        Attempt a = byCharge.get(chargeId);\n        return a == null ? null : a.outcome();\n    }\n}\n\n/** What the gateway tells us, minutes later, when we ask what really happened to a charge. */\ninterface Settlement {\n    /** True if the money really did leave the customer. */\n    boolean wasCharged(String chargeId);\n}\n\n/**\n * The sweep. An UNKNOWN charge can never belong to an order -- the order is only built after a charge that\n * answered -- so if the money moved, it is an orphan and goes back. A refund still owed (the gateway failed\n * when the order was cancelled) is sent again. Writing the answer into the log is what makes the sweep\n * idempotent: run it twice and the customer is refunded once.\n */\nfinal class Reconciler {\n    private final ChargeBook book;\n    private final Settlement settlement;\n    private final PaymentProcessor payments;\n\n    Reconciler(ChargeBook book, Settlement settlement, PaymentProcessor payments) {\n        this.book = book; this.settlement = settlement; this.payments = payments;\n    }\n    /** Refund every orphan charge and every owed refund. Returns how many went out on this pass. Run on a timer. */\n    int sweep() {\n        int refunded = 0;\n        for (ChargeBook.Attempt a : book.having(ChargeOutcome.UNKNOWN)) {\n            if (settlement.wasCharged(a.chargeId())) {\n                payments.refund(a.chargeId(), a.paise());\n                book.record(a.chargeId(), a.customerId(), a.paise(), ChargeOutcome.REFUNDED);\n                refunded++;\n            } else {\n                book.record(a.chargeId(), a.customerId(), a.paise(), ChargeOutcome.DECLINED);\n            }\n        }\n        for (ChargeBook.Attempt a : book.having(ChargeOutcome.REFUND_OWED)) {\n            try { payments.refund(a.chargeId(), a.paise()); }\n            catch (RuntimeException stillDown) { continue; }             // still owed: the next pass tries again\n            book.record(a.chargeId(), a.customerId(), a.paise(), ChargeOutcome.REFUNDED);\n            refunded++;\n        }\n        return refunded;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; The restaurant refuses the order after the customer has already paid.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A separate path from a cancellation, because a different person is refusing and the money has already moved. REJECTED is a legal successor of PLACED and of nothing else, so a restaurant can only refuse an order it has not accepted yet. The method moves the state through the same guarded transition, gives the food back to the shelf, takes the order off the tablet's queue and hands back any rider. Only then does it refund the whole bill (there is no fee; the customer did nothing wrong), because the refund is the one step that can fail. Afterwards REJECTED is terminal (nothing may follow it), so a second tap on the restaurant's tablet throws instead of refunding twice, which is the part worth pointing at.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** The restaurant refuses the order: the food goes back on the shelf, then the whole bill is refunded. */\n    Refund reject(String orderId) {\n        Order o = need(orderId);\n        transition(o, OrderState.REJECTED);\n        restaurants.get(o.restaurantId()).giveBack(o.lines());\n        restaurants.get(o.restaurantId()).dequeue(orderId);\n        handBack(o);                                           // our own state first: none of it can fail\n        refund(o, o.bill().total());                           // then the money, which can\n        return new Refund(o.bill().total(), 0);\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; The app asks &#x27;where is my order?&#x27; a thousand times a second. Make it O(1), with no lock.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No new structure. The order is one hash lookup by id, and its state and its rider are <code>volatile</code> fields, so the hot read (the one done a thousand times a second) takes no lock at all. A reader sees either the old value or the new one, never half of one, which is all a status screen needs. Be precise about which reads those are: <code>stamps()</code> takes the order's lock to copy the timestamp map, and the menu, the stock and the tablet's queue are copied under the restaurant's lock. That is deliberate. Those are opened a few times per order; the status poll is a thousand times a second, and it is the only one that had to be free.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    private final Map&lt;String, Restaurant&gt; restaurants = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, DeliveryPartner&gt; partners = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Order&gt; orders = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Cart&gt; carts = new ConcurrentHashMap&lt;&gt;();          // one open cart per customer\n    private final Map&lt;String, InFlight&gt; byKey = new ConcurrentHashMap&lt;&gt;();      // idempotency key -&gt; the attempt\n    private final ConcurrentLinkedDeque&lt;String&gt; waitingForRider = new ConcurrentLinkedDeque&lt;&gt;();\n    private final List&lt;OrderObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n    private final AtomicInteger orderSeq = new AtomicInteger(), chargeSeq = new AtomicInteger();\n\n/** An order by id: O(1), and the read path for &quot;where is my order?&quot;. */\n    Order order(String id) { return orders.get(id); }\n    /** How many READY orders are waiting for a rider right now. */\n    int waitingCount() { return waitingForRider.size(); }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>8 &middot; His network drops on the Pay screen and the app sends the checkout again. Do not charge him twice.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The app sends a key with the tap &mdash; the same key on every retry of the same tap &mdash; and the service claims it with one <code>putIfAbsent</code> before doing anything else. The second arrival finds an attempt already there and <i>waits on it</i> rather than starting a second checkout: it gets the first attempt's order back, or the first attempt's exception. That waiting is the part people get wrong; returning &ldquo;already in progress&rdquo; pushes the problem back to an app that will simply retry again. A failed attempt removes its key, so a genuine retry after a declined card is allowed to charge. The key is scoped to the customer, so two apps that happen to send the same key never see each other's order. The test is a count: same key twice, one order, and the gateway touched once.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** One attempt at placing an order, so a retried tap waits for the first instead of paying twice. */\n    private static final class InFlight {\n        private final CountDownLatch done = new CountDownLatch(1);\n        private volatile Order order;\n        private volatile RuntimeException failure;\n        Order await() {\n            try { done.await(); } catch (InterruptedException e) {\n                Thread.currentThread().interrupt(); throw new IllegalStateException(&quot;interrupted while retrying&quot;);\n            }\n            if (failure != null) throw failure;\n            return order;\n        }\n        void succeed(Order o) { order = o; done.countDown(); }\n        void fail(RuntimeException e) { failure = e; done.countDown(); }\n    }\n\n    /**\n     * THE CRITICAL STEP, in this order and no other: claim the idempotency key; reserve the stock under the\n     * restaurant&#x27;s lock (all lines or none); price it outside every lock; charge the card, which is the slow\n     * irreversible bit; and only if the money moved does an order exist. A decline hands the stock back and\n     * leaves the system exactly as it was, so the customer can try another card.\n     */\n    Order placeOrder(String idempotencyKey, String customerId, List&lt;String&gt; coupons) {\n        Cart cart = carts.get(customerId);\n        if (cart == null) throw new IllegalStateException(&quot;nothing in the cart&quot;);\n        return placeOrder(idempotencyKey, cart, coupons);\n    }\n\n    /**\n     * The same checkout for a cart that is not the customer&#x27;s open one: a booking, or one leg of a split basket.\n     * The key is scoped to the customer, so two apps that happen to send the same key never share an order.\n     */\n    Order placeOrder(String idempotencyKey, Cart cart, List&lt;String&gt; coupons) {\n        String key = cart.customerId() + &quot;/&quot; + idempotencyKey;\n        InFlight mine = new InFlight();\n        InFlight running = byKey.putIfAbsent(key, mine);\n        if (running != null) return running.await();          // the same tap twice: one order, one charge\n        try {\n            Order placed = doPlace(cart, coupons);\n            mine.succeed(placed);\n            return placed;\n        } catch (RuntimeException e) {\n            byKey.remove(key, mine);                          // a failed attempt frees the key for a real retry\n            mine.fail(e);\n            throw e;\n        }\n    }\n\n        int before = g6.chargeCount();\n        Order retry = s6.placeOrder(&quot;g3&quot;, &quot;f3&quot;, List.of());\n        check(retry == survived &amp;&amp; g6.chargeCount() == before,\n              &quot;the same idempotency key returns the first order and charges nothing more&quot;);\n        Order other = place(s6, &quot;f4&quot;, &quot;r6&quot;, &quot;wrap&quot;, 1, &quot;g3&quot;, List.of());   // another customer, the same key\n        check(other != survived &amp;&amp; other.customerId().equals(&quot;f4&quot;) &amp;&amp; g6.chargeCount() == before + 1,\n              &quot;another customer who sends the same key gets his own order, never the first customer&#x27;s&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; The customer cancels. Sometimes it is free, sometimes there is a fee, and sometimes it is too late.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two rules, each where it belongs. <i>Whether</i> a cancel is allowed is the transition table: CANCELLED follows everything up to READY but not PICKED_UP, so once the rider has the food the attempt throws. <i>How much comes back</i> is an injected policy, asked inside the order's lock with the state it is cancelling out of, so a racing state change cannot fool it. The standard one is free before the kitchen starts and keeps a flat fee after; the food goes back on the shelf only if it was never cooked. Flipkart's 2025 round is stricter (an accepted order cannot be cancelled at all): that is another policy, which throws past PLACED before anything is written. Outside the lock, the food, the tablet's queue and the rider go back first, because none of that can fail. The refund goes last and is written down as owed first, so a gateway error leaves it for the sweep.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The customer (or the restaurant) cancels. The refund is decided by the injected policy, inside the lock,\n     * from the state it is cancelling out of. Then the food, the queue and the rider are handed back, and the\n     * refund goes last, because it is the only step that can fail.\n     */\n    Refund cancel(String orderId) {\n        Order o = need(orderId);\n        OrderState from;\n        long refund;\n        o.lock();\n        try {\n            from = o.state();\n            if (!from.canGoTo(OrderState.CANCELLED))\n                throw new IllegalStateException(orderId + &quot; is &quot; + from + &quot;: too late to cancel&quot;);\n            refund = cancellation.refundPaise(o, from, clock.nowMs());\n            o.moveTo(OrderState.CANCELLED, clock.nowMs());\n        } finally { o.unlock(); }\n\n        if (from == OrderState.PLACED || from == OrderState.ACCEPTED)\n            restaurants.get(o.restaurantId()).giveBack(o.lines());      // not cooked yet: the food goes back\n        restaurants.get(o.restaurantId()).dequeue(orderId);\n        handBack(o);\n        refund(o, refund);\n        publish(o, from);\n        return new Refund(refund, o.bill().total() - refund);\n    }\n\n    /**\n     * Send money back, written down first exactly like a charge: REFUND_OWED before the call, REFUNDED after.\n     * If the gateway throws, the row stays owed and the sweep sends it later; the cancel has already happened.\n     */\n    private void refund(Order o, long paise) {\n        if (paise &lt;= 0) return;                                          // a zero refund is not a gateway call\n        chargeLog.record(o.chargeId(), o.customerId(), paise, ChargeOutcome.REFUND_OWED);\n        try {\n            payments.refund(o.chargeId(), paise);\n            chargeLog.record(o.chargeId(), o.customerId(), paise, ChargeOutcome.REFUNDED);\n        } catch (RuntimeException gatewayDown) {\n            System.out.println(&quot;   [warn] refund for &quot; + o.id() + &quot; is owed; the sweep will send it&quot;);\n        }\n    }\n\n/** Free until the kitchen starts cooking; after that the food exists, so a flat fee is kept and the rest returns. */\nfinal class StandardCancellation implements CancellationPolicy {\n    private final long feePaise;\n    StandardCancellation(long feePaise) { this.feePaise = feePaise; }\n    public long refundPaise(Order order, OrderState from, long nowMs) {\n        long total = order.bill().total();\n        if (from == OrderState.PLACED || from == OrderState.ACCEPTED) return total;   // nothing has been cooked\n        return Math.max(0, total - feePaise);                                         // PREPARING or READY\n    }\n}\n\n        // 5b. a stricter rule handed in (Flipkart 2025: an accepted order cannot be cancelled): the policy says no\n        OrderService strict = new OrderService();\n        strict.configure(List.of(new ItemTotal()), new NearestFree(), (order, from, now) -&gt; {\n            if (from != OrderState.PLACED) throw new IllegalStateException(&quot;an accepted order cannot be cancelled&quot;);\n            return order.bill().total();\n        }, new FakeGateway());\n        kitchen(strict, &quot;r5s&quot;, &quot;dosa&quot;, &quot;120.00&quot;, 10);\n        Order taken = place(strict, &quot;d4&quot;, &quot;r5s&quot;, &quot;dosa&quot;, 1, &quot;e4&quot;, List.of());\n        strict.accept(taken.id());\n        try { strict.cancel(taken.id()); check(false, &quot;the stricter policy must refuse&quot;); }\n        catch (IllegalStateException e) { check(taken.state() == OrderState.ACCEPTED, &quot;a policy that refuses leaves the order untouched: &quot; + e.getMessage()); }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>10 &middot; Two orders become ready in the same millisecond and one rider is nearest to both. And what if nobody is free at all?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Ranking and claiming are deliberately separate. The rule ranks a <i>snapshot</i> (a copy taken at one instant) of the free riders, which may already be stale when it returns. That is fine, because the winner is decided by <code>claim()</code>, one compare-and-set on the rider's flag, and the loser walks to the next candidate. There is a second claim most people miss: two dispatchers can look at the same waiting order and win two <i>different</i> riders, and the customer can cancel at that instant. So the order's rider field is filled under the order's own lock, only while it is READY with no rider; whoever loses hands his rider straight back and tries the next waiting order. Nobody free is a normal outcome, not an exception: the order joins a waiting deque (a double-ended queue). Three rules then decide whether the fleet works at all. Queue the order <i>before</i> looking again, so a rider freed in the gap is not missed. Hand the rider back on every terminal path, or the fleet does one delivery each and dies. And every event that frees a rider (a delivery, a cancel, a lost claim, a login) drains the queue until riders or orders run out.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Take this rider for an order. One indivisible step: whoever wins the compare-and-set has him, and the\n     * loser simply tries the next candidate. This is the whole of &quot;a rider is never double-booked&quot;.\n     */\n    boolean claim(String forOrderId) {\n        if (!state.compareAndSet(PartnerState.AVAILABLE, PartnerState.ASSIGNED)) return false;\n        orderId = forOrderId;\n        return true;\n    }\n\n/**\n     * THE SECOND CLAIM. The rider was claimed with a compare-and-set on the rider; this claims the ORDER, under\n     * its lock, and only while it is READY with no rider. Two dispatchers can each win a different rider for\n     * one waiting order, and the customer can cancel at that instant: the loser hands his rider straight back.\n     */\n    boolean takePartner(String id) {\n        lock.lock();\n        try {\n            if (state != OrderState.READY || partner != null) return false;\n            partner = id;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n/**\n     * The food is ready: commit the state, then look for a rider, outside the order&#x27;s lock. If nobody is free\n     * the order joins the queue FIRST and only then looks again -- a rider freed in the gap between a failed\n     * claim and the enqueue would otherwise be missed, and the order would sit there with a rider idle.\n     */\n    boolean markReady(String orderId) {\n        Order o = need(orderId);\n        transition(o, OrderState.READY);\n        if (!tryAssign(o)) waitingForRider.addLast(o.id());   // nobody free is a normal outcome, not an exception\n        drainWaiting();                       // ...and look again: a rider may have come free in the gap\n        return o.partnerId() != null;\n    }\n\n/**\n     * Ask the rule for candidates, then take the first one the compare-and-set gives us. Losing the CAS is\n     * expected: the ranking was a snapshot, and the winner is decided by claim(), not by the ranking. Then the\n     * second claim, on the order. Returns false only if no rider could be claimed; true means the order is\n     * settled: it has this rider, or it had another or was cancelled, and this one went straight back.\n     */\n    private boolean tryAssign(Order o) {\n        Restaurant r = restaurants.get(o.restaurantId());\n        for (int attempt = 0; attempt &lt; 3; attempt++) {\n            List&lt;DeliveryPartner&gt; free = new ArrayList&lt;&gt;();\n            for (DeliveryPartner p : partners.values()) if (p.isAvailable()) free.add(p);\n            List&lt;String&gt; ranked = assignment.rank(free, r.at());\n            if (ranked.isEmpty()) return false;\n            for (String id : ranked) {\n                DeliveryPartner p = partners.get(id);\n                if (p != null &amp;&amp; p.claim(o.id())) {\n                    if (!o.takePartner(id)) { p.release(); return true; }   // the caller drains: he is free again\n                    publish(o, o.state());\n                    return true;\n                }\n            }\n        }\n        return false;\n    }\n\n/** Give the rider back and give the next waiting order a chance. Missing this leaks one rider per delivery. */\n    private void handBack(Order o) {\n        String pid = o.partnerId();\n        if (pid == null) return;\n        DeliveryPartner p = partners.get(pid);\n        if (p != null) p.release();\n        o.clearPartner();\n        drainWaiting();\n    }\n\n    /**\n     * Match waiting orders with free riders, oldest first, until riders or orders run out. Every event that\n     * adds to either side -- an order becomes ready, a rider is handed back or logs in -- ends here. A waiting\n     * order is NOT taken out of the queue while we try: if it were, a hand-back running at the same instant\n     * would look at an empty queue and walk away, and the order would wait for a rider who is standing there.\n     */\n    private void drainWaiting() {\n        for (String id; (id = waitingForRider.peekFirst()) != null; ) {\n            Order w = orders.get(id);\n            if (w != null &amp;&amp; w.state() == OrderState.READY &amp;&amp; w.partnerId() == null &amp;&amp; !tryAssign(w))\n                return;                                      // nobody free: everyone behind him waits too\n            waitingForRider.remove(id);                      // he has a rider, or no longer needs one: next\n        }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>11 &middot; When will it arrive? And where does the time come from, and where does live GPS go?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The ETA is a pure function of state: what the kitchen still owes, plus the ride at a speed handed in. What the kitchen owes is measured from the <code>PREPARING</code> stamp, not from when the customer paid. An order sitting unaccepted for ten minutes still owes the full eighteen, and the order's stamp map is what makes that possible. Time comes from one injected interface, so a test picks the instant, starts the cooking, moves the clock ten minutes and asserts the exact number of minutes left. Nothing else in the system reads the wall clock. Live GPS is deliberately <i>not</i> an observer. State changes happen six times an hour and positions arrive a few times a second, so the location stream keeps its own list of listeners per order and touches no lock.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: eta -- how long until it arrives, from the state the order already has\n/**\n * &quot;Where is my order?&quot; answered as a number of minutes: what the kitchen still owes, plus the ride. It reads\n * the order&#x27;s own timestamps and an injected clock, so it is a pure function of state and testable to the minute.\n */\nfinal class Eta {\n    private final Clock clock;\n    private final double kmPerHour;\n\n    Eta(Clock clock, double kmPerHour) { this.clock = clock; this.kmPerHour = kmPerHour; }\n\n    /** Minutes from now until this order lands. rider may be null (nobody assigned yet). */\n    long minutesFor(Order o, Restaurant r, DeliveryPartner rider) {\n        // the kitchen&#x27;s clock starts when the kitchen starts, not when the customer paid: until then the\n        // whole prep time is still owed. That is what the PREPARING stamp on the order is for.\n        long startedAt = o.stamps().getOrDefault(OrderState.PREPARING, clock.nowMs());\n        long cooked = Math.max(0, (clock.nowMs() - startedAt) / 60_000);\n        long kitchen = switch (o.state()) {\n            case PLACED, ACCEPTED, PREPARING -&gt; Math.max(0, r.prepMinutes() - cooked);\n            default -&gt; 0;                                   // READY or later: the food exists\n        };\n        double km = o.state() == OrderState.PICKED_UP &amp;&amp; rider != null\n                  ? rider.at().kmTo(o.dropAt())                              // already on the way\n                  : (rider == null ? 0 : rider.at().kmTo(r.at())) + r.at().kmTo(o.dropAt());\n        return kitchen + Math.round(km / kmPerHour * 60);\n    }\n}\n\n// where time comes from: one interface, handed in, defaulted, never read from the wall clock inside a method\ninterface Clock { long nowMs(); }\nprivate Clock clock = System::currentTimeMillis;\nvoid setClock(Clock c) { clock = c; }\n\n// in a test: pick the instant, start the kitchen, then move it\nlong[] now = { 1_700_000_000_000L };\nsvc.setClock(() -&gt; now[0]);\nsvc.accept(id); svc.startPreparing(id);                // stamps PREPARING at now[0]\nnow[0] += 10 * 60_000;                                 // ten minutes on the tawa: eight left of eighteen\n\n// ---- ext: live tracking -- high-frequency GPS, deliberately off the state path\n/**\n * The rider&#x27;s position arrives a few times a second; an order changes state six times in an hour. Putting the\n * first through the state observers would drown them, so location gets its own topic per order. Nothing here\n * touches an order lock, which is why a slow map client cannot stall a transition.\n */\nfinal class LocationStream {\n    private final Map&lt;String, List&lt;Consumer&lt;Geo&gt;&gt;&gt; byOrder = new ConcurrentHashMap&lt;&gt;();\n\n    /** The customer&#x27;s map subscribes to one order. */\n    void subscribe(String orderId, Consumer&lt;Geo&gt; sink) {\n        byOrder.computeIfAbsent(orderId, k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(sink);\n    }\n    /** The rider app pushes a fix. A broken subscriber is skipped, exactly as on the state path. */\n    void push(String orderId, Geo where) {\n        for (Consumer&lt;Geo&gt; sink : byOrder.getOrDefault(orderId, List.of())) {\n            try { sink.accept(where); } catch (RuntimeException ignored) { }\n        }\n    }\n    /** Drop the topic once the order is terminal, so a finished order costs no memory. */\n    void close(String orderId) { byOrder.remove(orderId); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; One tap, two restaurants: biryani from one and dessert from another.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It splits into one order per restaurant, because stock, prep time and the rider all belong to a restaurant. A single order spanning two kitchens would have two prep times, two pickups and no honest state machine. So the basket places each order in turn, from its own cart, with a key derived from the one tap. The interesting part is the failure. There is no distributed transaction here (one commit across two places), so if the second restaurant is out of stock, the first order is cancelled and refunded through the ordinary path. Say that out loud rather than hiding it: this compensating action (undoing the first order) is the answer. The alternative is a two-phase commit (reserve everywhere, then commit everywhere at once), which you do not want in an hour.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: multi-restaurant basket -- one tap, two kitchens, and the honest answer about the payment\n/**\n * One basket spanning two restaurants fans out into one order per restaurant, because stock, prep and the\n * rider all belong to a restaurant. There is no distributed transaction here: if the second order fails, the\n * first is cancelled, which refunds it. That compensation IS the answer -- say it rather than hiding it.\n */\nfinal class MultiRestaurantBasket {\n    private final Map&lt;String, Map&lt;String, Integer&gt;&gt; byRestaurant = new LinkedHashMap&lt;&gt;();\n\n    /** Add an item, tagged with the restaurant it came from. */\n    void add(String restaurantId, String itemId, int qty) {\n        byRestaurant.computeIfAbsent(restaurantId, k -&gt; new LinkedHashMap&lt;&gt;()).merge(itemId, qty, Integer::sum);\n    }\n\n    /** Place one order per restaurant. Each key is derived from the tap, so a retry of the tap is still safe. */\n    List&lt;Order&gt; checkout(OrderService svc, String customerId, Geo dropAt, String tapKey, List&lt;String&gt; coupons) {\n        List&lt;Order&gt; placed = new ArrayList&lt;&gt;();\n        try {\n            for (Map.Entry&lt;String, Map&lt;String, Integer&gt;&gt; e : byRestaurant.entrySet()) {\n                Cart leg = new Cart(customerId, e.getKey(), dropAt);          // one cart per kitchen\n                e.getValue().forEach(leg::add);\n                placed.add(svc.placeOrder(tapKey + &quot;#&quot; + e.getKey(), leg, coupons));\n            }\n            return placed;\n        } catch (RuntimeException fail) {\n            for (Order done : placed) svc.cancel(done.id());      // compensate; each order refunds itself\n            throw fail;\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; A rider accepts and then does not show. And can one rider carry two drops on the same trip?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Push assignment lies a little, so an offer holds the rider, asks him with a deadline, and hands him straight back on a no or on silence. The release happens before the method returns, so the pool never leaks. A yes attaches him through the order's own guarded claim, so an order cancelled while he was deciding does not keep him. The refusal is recorded, and the ranking rule pushes a flaky rider down the list by charging him half a kilometre per miss, which is a new <code>AssignmentRule</code> and nothing else. Batching is the smaller change of the two: the rider's state was a flag with two values, so a compare-and-set fitted. With capacity it becomes a counter, so the same single claim becomes <code>Semaphore.tryAcquire</code> (a Semaphore is a counter of permits: take one if any are left). The queue, the ranking and the terminal release do not move at all.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the rider says no -- an offer with a deadline, and a ranking that remembers\n/**\n * Push assignment lies a little: a reserved rider can still refuse or go silent. An offer holds him, asks, and\n * hands him straight back on a no or a timeout, then the search continues with the next candidate. The refusal\n * is recorded, and the ranking rule below pushes a flaky rider down the list instead of banning him.\n */\nfinal class OfferDesk {\n    /** How a rider answers an offer. In production this is a push notification and a reply with a deadline. */\n    interface Rider { boolean accepts(String orderId, long deadlineMs); }\n\n    private final Map&lt;String, Integer&gt; misses = new ConcurrentHashMap&lt;&gt;();\n\n    /**\n     * True if he took it. A yes attaches him with the order&#x27;s own guarded claim, so an order cancelled or\n     * dispatched while he was deciding does not keep him. Otherwise he is released before this returns.\n     */\n    boolean offer(DeliveryPartner p, Order o, Rider rider, long deadlineMs) {\n        if (!p.claim(o.id())) return false;                     // somebody else got him first\n        boolean yes;\n        try { yes = rider.accepts(o.id(), deadlineMs); }\n        catch (RuntimeException e) { yes = false; }             // silence counts as a refusal\n        if (yes &amp;&amp; o.takePartner(p.id())) return true;          // the same second claim the dispatcher uses\n        p.release();\n        if (!yes) misses.merge(p.id(), 1, Integer::sum);\n        return false;\n    }\n\n    /** How many offers this rider has turned down. */\n    int missesOf(String partnerId) { return misses.getOrDefault(partnerId, 0); }\n\n    /** Nearest first, but each refusal costs a rider half a kilometre of rank. A new class; nothing else moves. */\n    AssignmentRule ranking(double penaltyKmPerMiss) {\n        return (free, pickup) -&gt; {\n            List&lt;DeliveryPartner&gt; sorted = new ArrayList&lt;&gt;(free);\n            sorted.sort(Comparator.comparingDouble(\n                p -&gt; p.at().kmTo(pickup) + penaltyKmPerMiss * missesOf(p.id())));\n            List&lt;String&gt; ids = new ArrayList&lt;&gt;();\n            for (DeliveryPartner p : sorted) ids.add(p.id());\n            return ids;\n        };\n    }\n}\n\n// ---- ext: pooling -- one rider, two drops: the boolean flip becomes a permit\n/**\n * Batching changes exactly one thing: a rider&#x27;s free/busy flag was a single boolean, so a compare-and-set\n * fitted; with capacity it becomes a counter, so the same &quot;one indivisible claim&quot; is a Semaphore permit.\n * Everything else -- the ranking, the queue, the terminal release -- is untouched.\n */\nfinal class PooledPartner {\n    private final String id;\n    private final Semaphore seats;\n    private final Set&lt;String&gt; carrying = ConcurrentHashMap.newKeySet();\n\n    PooledPartner(String id, int capacity) { this.id = id; this.seats = new Semaphore(capacity); }\n\n    String id() { return id; }\n    /** Take one seat for this order, or fail. The atomic step, same role as DeliveryPartner.claim(). */\n    boolean claim(String orderId) {\n        if (!seats.tryAcquire()) return false;\n        carrying.add(orderId);\n        return true;\n    }\n    /** Give the seat back when that drop is done. */\n    void release(String orderId) {\n        if (carrying.remove(orderId)) seats.release();\n    }\n    /** Seats still free. A ranking rule prefers a rider already going your way with a seat left. */\n    int freeSeats() { return seats.availablePermits(); }\n    /** The orders on this trip. */\n    Set&lt;String&gt; carrying() { return Set.copyOf(carrying); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>14 &middot; Scheduled orders: &#x27;deliver at eight&#x27;, booked at four in the afternoon.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Not a new state. A booking sits outside the order model until the kitchen has to start: the requested time, minus that restaurant's prep time, minus the ride, so the food lands at eight and not ten past. At that point the scheduler places an ordinary order through its own cart (the customer may be browsing another restaurant at that moment) and everything downstream is unchanged. The part worth pointing at is the id: it is derived from the booking, so a tick that runs twice places it once. That is the same idempotency that makes a retried tap safe; two servers need the keys in the database (card 15). A booking that fails is set aside and reported, so it never blocks the ones behind it. What you should <i>not</i> do is reserve the stock at booking time. The kitchen will restock before then, and holding a portion for four hours is how a restaurant goes sold out at six.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: scheduled orders -- a booking released at &quot;serve at&quot; minus the prep time and the ride\n/**\n * A pre-order is not a new state: it is a booking that becomes an ordinary order later. The scheduler releases\n * it when the kitchen must start (serve time, minus the prep time, minus the ride), and the id it uses is\n * derived from the booking, so a tick that runs twice places it exactly once.\n */\nfinal class Scheduler {\n    /** What the customer booked and when they want to eat. */\n    record Booking(String id, String customerId, String restaurantId, Geo dropAt,\n                   Map&lt;String, Integer&gt; items, long serveAtMs) {}\n\n    private final List&lt;Booking&gt; pending = new ArrayList&lt;&gt;();\n    private final List&lt;String&gt; failed = new ArrayList&lt;&gt;();\n    private final double kmPerHour;\n\n    Scheduler(double kmPerHour) { this.kmPerHour = kmPerHour; }\n\n    synchronized void book(Booking b) { pending.add(b); }\n\n    /** Place every booking whose kitchen must start by now. Safe to call as often as you like. */\n    synchronized List&lt;Order&gt; tick(OrderService svc, long nowMs) {\n        List&lt;Order&gt; released = new ArrayList&lt;&gt;();\n        for (Iterator&lt;Booking&gt; it = pending.iterator(); it.hasNext(); ) {\n            Booking b = it.next();\n            Restaurant r = svc.restaurant(b.restaurantId());\n            long rideMs = Math.round(r.at().kmTo(b.dropAt()) / kmPerHour * 3_600_000);\n            long startBy = b.serveAtMs() - r.prepMinutes() * 60_000L - rideMs;\n            if (nowMs &lt; startBy) continue;\n            Cart cart = new Cart(b.customerId(), b.restaurantId(), b.dropAt());   // its own cart, not hers\n            b.items().forEach(cart::add);\n            try { released.add(svc.placeOrder(&quot;booking:&quot; + b.id(), cart, List.of())); }\n            catch (RuntimeException e) { failed.add(b.id() + &quot;: &quot; + e.getMessage()); }   // one bad booking\n            it.remove();                                                            // never blocks the rest\n        }\n        return released;\n    }\n\n    /** Bookings that could not be placed (sold out, card declined), for the customer to be told. */\n    synchronized List&lt;String&gt; failed() { return List.copyOf(failed); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>15 &middot; Persist it. And now there are two servers.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The order's lock only guards one process, so it becomes a conditional UPDATE and the database performs the same atomic step: <code>UPDATE orders SET state = ? WHERE id = ? AND state = ?</code>, where zero rows updated means another server moved it first &mdash; exactly the error the in-memory guard throws. The insert carries the idempotency key with ON CONFLICT DO NOTHING, so a retried tap

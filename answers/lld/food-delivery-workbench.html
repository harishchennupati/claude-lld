e\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 7</text><text x=\"44.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 12 us</text></g><g transform=\"translate(718 212)\"><rect width=\"88\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"44.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 8</text><text x=\"44.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 14 us</text></g><g transform=\"translate(817 212)\"><rect width=\"88\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"44.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 9</text><text x=\"44.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 16 us</text></g><g transform=\"translate(916 212)\"><rect width=\"88\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"44.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 10</text><text x=\"44.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 18 us</text></g><g transform=\"translate(1015 212)\"><rect width=\"88\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"44.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 11</text><text x=\"44.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 20 us</text></g><g transform=\"translate(1114 212)\"><rect width=\"88\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"44.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 12</text><text x=\"44.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 22 us</text></g><text x=\"615\" y=\"280\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the twelfth waits about twenty-two microseconds for the lock and then four hundred milliseconds for its own card payment:</text><text x=\"615\" y=\"299\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">yes, one restaurant's checkouts are serialised (made to go one at a time): that 22 us wait is about twenty thousand times shorter than the payment</text></svg></div><div class=\"move\"><p>Answer it with the contents of the lock, not with an opinion. About ten hash operations are inside the restaurant's lock, roughly two microseconds. An order's own lock holds one read, one <code>EnumMap</code> lookup and two writes. The rider's own flag is not even a lock. Everything slow is outside all three: the pricing chain, the gateway at four hundred milliseconds, the push at forty, the kitchen at eighteen minutes. That separation is the design, not a detail. Charging a card while holding a restaurant's lock would stop everyone else ordering from that restaurant for four hundred milliseconds. At four orders a minute you would never see it in testing, and you would see it every lunchtime in production. So yes, one restaurant's checkouts are serialised: the twelfth phone waits about twenty-two microseconds, and then four hundred milliseconds for its own payment.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 254\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"18\" width=\"560\" height=\"205\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"40\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per restaurant: is it a bottleneck? do the arithmetic</text><text x=\"34\" y=\"64\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the locked part of a checkout: ~10 map operations, about 2 us</text><text x=\"34\" y=\"87\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a busy Koramangala kitchen at lunch: 4 orders a minute</text><text x=\"34\" y=\"110\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">that is one every 15 seconds against a 2 us lock</text><text x=\"34\" y=\"133\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">even at a fictional 50 checkouts a second into ONE restaurant:</text><text x=\"34\" y=\"156\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">100 us of lock in every second = 0.01% busy</text><text x=\"34\" y=\"179\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">and the card gateway, at 400 ms, is 200,000x longer than the lock</text><text x=\"34\" y=\"202\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the lock is per restaurant: 8,000 of them in the city never meet</text><text x=\"890\" y=\"40\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1  pay and notify outside the lock</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: nothing slow is inside it</text></g><g transform=\"translate(600 112)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2  one atomic counter per item</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">AtomicInteger stock, CAS-decremented: two different dishes never wait</text></g><g transform=\"translate(600 166)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3  a row per item in the database</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE menu SET left = left - ? WHERE id = ? AND left &gt;= ?  -- 0 rows = sold out</text></g><text x=\"615\" y=\"240\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">say the arithmetic before you climb: splitting a lock that is busy one ten-thousandth of the time, even at 50 a second, is complexity nobody asked for</text></svg></div><div class=\"move\"><p>The numbers are in the picture; what matters is that you say them before you offer to shard anything (split one lock or one table into several). Four orders a minute against a lock held two microseconds is a lock busy about one ten-millionth of the time. Even a fictional fifty checkouts a second into one restaurant is only one ten-thousandth. And it is per restaurant, so the city's eight thousand kitchens are eight thousand locks that never meet. The ladder is worth knowing in order because the first rung is the only one you have already climbed: nothing slow is inside the lock. The second rung, an atomic counter per <i>item</i> (one that changes in a single indivisible step), only pays off when one restaurant is genuinely the whole business. The third leaves this process altogether: stock becomes a row and the reservation becomes <code>UPDATE menu SET left = left - ? WHERE id = ? AND left &gt;= ?</code>, where zero rows updated means sold out &mdash; the database performing exactly the atomic step the lock was performing.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 568\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 14)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two phones want =\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a skipped step, or no rider at pickup</text></g><path d=\"M335 352 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 334)\"><rect width=\"825\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"412.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the transition table and one guard refuse it; tests 6 and 14: READY -&gt; DELIVERED throws</text></g><g transform=\"translate(25 374)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two ready orders, one free rider</text></g><path d=\"M335 392 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 374)\"><rect width=\"825\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"412.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one compareAndSet wins; test 7: the loser queues, then takes him back</text></g><g transform=\"translate(25 414)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a rider comes free in the gap</text></g><path d=\"M335 432 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 414)\"><rect width=\"825\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"412.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">queue first, then drain until riders or orders run out; tests 11, 13, 14</text></g><g transform=\"translate(25 454)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a cancel lands mid-dispatch</text></g><path d=\"M335 472 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 454)\"><rect width=\"825\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"412.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the order's claim needs READY, under its lock; test 12: the rider goes straight back</text></g><g transform=\"translate(25 494)\"><rect width=\"310\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the push is down; the tap is retried</text></g><path d=\"M335 512 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 494)\"><rect width=\"825\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"412.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish after the unlock in try/catch; dedupe by key, per customer; test 8</text></g><text x=\"615\" y=\"554\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a test: FailureTests.java runs sixty checks and must print ALL PASS before this page will build</text></svg></div><div class=\"move\"><p>The table is the list; each row is a few lines in FailureTests.java. Four of them are worth saying out loud because they are the ones that separate a design from a claim. The last-portion race is proved by a <i>count</i>, not a hope: thirty threads, ten portions, exactly five orders, stock exactly zero and the card touched exactly five times. The declined card is proved by what is <i>absent</i> afterwards: no order, no refund to make, the stock where it started. The gateway that never answers is proved by the sweep: the money is found, refunded once, and a second sweep refunds nothing. The dispatch races are either run a hundred and fifty times or forced into their worst order with a latch (a gate the test holds shut until every thread is in place). A race that passes once has proved nothing, and a design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 316\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"18\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"37.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"210\" y=\"37.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"300\" y=\"37.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"750\" y=\"37.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"48\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"67.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"210\" y=\"67.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"67.0\" font-size=\"11\" fill=\"var(--text)\">interface PricingRule / AssignmentRule / CancellationPolicy</text><text x=\"750\" y=\"67.0\" font-size=\"11\" fill=\"var(--text)\">a new fee or dispatcher is a class, not an edit</text><rect x=\"20\" y=\"78\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"97.0\" font-size=\"11\" fill=\"var(--text)\">Chain</text><text x=\"210\" y=\"97.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"97.0\" font-size=\"11\" fill=\"var(--text)\">for (PricingRule r : pricing) bill = r.apply(bill, ctx);</text><text x=\"750\" y=\"97.0\" font-size=\"11\" fill=\"var(--text)\">the bill grows one rule at a time, in a list you can reorder</text><rect x=\"20\" y=\"108\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"127.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"210\" y=\"127.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"127.0\" font-size=\"11\" fill=\"var(--text)\">new CappedDiscount(coupon, 120.00);  new CheckedRule(everyRule)</text><text x=\"750\" y=\"127.0\" font-size=\"11\" fill=\"var(--text)\">a cap and an invariant that police rules nobody has written yet</text><rect x=\"20\" y=\"138\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"157.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"210\" y=\"157.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"157.0\" font-size=\"11\" fill=\"var(--text)\">publish(o, from) after the unlock, inside a try/catch</text><text x=\"750\" y=\"157.0\" font-size=\"11\" fill=\"var(--text)\">the phone hears; the order never waits for a push</text><rect x=\"20\" y=\"168\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"187.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"210\" y=\"187.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"300\" y=\"187.0\" font-size=\"11\" fill=\"var(--text)\">EnumMap&lt;OrderState, EnumSet&lt;OrderState&gt;&gt; NEXT</text><text x=\"750\" y=\"187.0\" font-size=\"11\" fill=\"var(--text)\">&ldquo;deliver what was never picked up&rdquo; cannot be written</text><rect x=\"20\" y=\"198\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"217.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"210\" y=\"217.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"300\" y=\"217.0\" font-size=\"11\" fill=\"var(--muted)\">the service is handed to its callers, never getInstance()</text><text x=\"750\" y=\"217.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh OrderService</text><rect x=\"20\" y=\"228\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"247.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"210\" y=\"247.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"300\" y=\"247.0\" font-size=\"11\" fill=\"var(--muted)\">the pricing list IS the registry, one line per rule</text><text x=\"750\" y=\"247.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when coupons come from a config table</text><rect x=\"20\" y=\"258\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"277.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"210\" y=\"277.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"300\" y=\"277.0\" font-size=\"11\" fill=\"var(--muted)\">an order has eight fields and every one is required</text><text x=\"750\" y=\"277.0\" font-size=\"11\" fill=\"var(--muted)\">it earns a place when tips, notes and packaging arrive</text><text x=\"615\" y=\"303\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence, and nothing is decoration</text></svg></div><div class=\"move\"><p>Read the table as a defence, not a list: each name has a move behind it, and a name with no move behind it is decoration. The two rows worth arguing are the bottom ones. Factory has not earned its place, because the list of pricing rules <i>is</i> the registry today. It earns the name the day coupons arrive as rows in a config table and somebody has to turn a row into a rule. Builder is the tempting one, and the honest answer is &ldquo;not yet&rdquo;. An order has eight fields and every single one is required, so a constructor says more than a builder would. Builder earns its place the day tips, cooking notes, packaging and gift wrapping arrive and most orders leave them empty.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 262\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"18\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"52\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"73.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"73.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"73.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"73.0\" font-size=\"11\" fill=\"var(--text)\">Restaurant: stock. Order: its state. Service: the flow. A rule: the arithmetic.</text><rect x=\"20\" y=\"86\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"107.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"107.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"107.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"107.0\" font-size=\"11\" fill=\"var(--text)\">MembershipWaiver is a new file plus one line in the pricing list</text><rect x=\"20\" y=\"120\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"141.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"141.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"141.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"141.0\" font-size=\"11\" fill=\"var(--text)\">rule.apply(bill, ctx);  never \"is this the surge one?\"</text><rect x=\"20\" y=\"154\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"175.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"175.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"460\" y=\"175.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"175.0\" font-size=\"11\" fill=\"var(--text)\">PricingRule, AssignmentRule, CancellationPolicy, OrderObserver, Demand, Clock, ChargeLog</text><rect x=\"20\" y=\"188\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"209.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"209.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"209.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"580\" y=\"209.0\" font-size=\"11\" fill=\"var(--text)\">configure(pricing, dispatch, policy, gateway);  setClock(() -&gt; t)</text><text x=\"615\" y=\"248\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>The table is the answer; the point of it is that not one row was designed for. Each letter is something moves 2 and 3 already did. If a row had come up empty, that would have been the signal to go back, not to bolt on an interface. The proof of the last two rows is the test file. <b>I</b> is seven interfaces with one method each, so a fake is a lambda: the demand signal really is <code>(r, t) -&gt; true</code>. <b>D</b> is why a test can hand the service a gateway that declines every card, a gateway that never answers, a clock that says last Tuesday and a deliberately broken pricing rule, without touching a line of the service.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 322\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 20)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a membership that waives the fee</text></g><path d=\"M345 42 H405\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(405 20)\"><rect width=\"690\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"345.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind PricingRule plus one line in the list</text></g><text x=\"1160\" y=\"47\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(25 74)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a lateness alarm, fraud, analytics</text></g><path d=\"M345 96 H405\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(405 74)\"><rect width=\"690\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"345.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer; the order, the locks and the tests do not change</text></g><text x=\"1160\" y=\"101\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(25 128)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">awaiting pickup, disputed, returned</text></g><path d=\"M345 150 H405\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(405 128)\"><rect width=\"690\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"345.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more constant and one more row in the transition table</text></g><text x=\"1160\" y=\"155\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(25 182)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across items</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one rider carries two drops</text></g><path d=\"M345 204 H405\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(405 182)\"><rect width=\"690\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"345.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same single claim, but a Semaphore permit instead of a boolean CAS</text></g><text x=\"1160\" y=\"209\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(25 236)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">persist it; two servers</text></g><path d=\"M345 258 H405\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(405 236)\"><rect width=\"690\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"345.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a repository, and the guarded transition becomes</text><text x=\"345.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE orders SET state = ? WHERE id = ? AND state = ?   -- 0 rows means somebody else moved it first</text></g><text x=\"1160\" y=\"263\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"308\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five, the checkout order and the races do not change; that is the test that the derivation was right, and page 05 has the code for each</text></svg></div><div class=\"move\"><p>Name the move out loud before you type, because the naming is the answer and the code is bookkeeping. Two of the five are worth a sentence more. &ldquo;One rider carries two drops&rdquo; sounds like a redesign and is not. The rider's flag had two values, so a compare-and-set fitted; capacity makes it a counter, so the same single claim becomes <code>Semaphore.tryAcquire</code> (a Semaphore is a counter of permits: take one if any are left). The ranking, the queue and the terminal release do not move. &ldquo;It has to survive a restart&rdquo; is the same trick one level down: the order's lock only guards one process, so the guarded transition becomes <code>UPDATE orders SET state = ? WHERE id = ? AND state = ?</code>, where zero rows updated means another server moved it first. For all five, the checkout order and the races do not change &mdash; which is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 906\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M467.5 350L467.5 372\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(# ll=\"var(--text)\">onState(order, from)</text></g><g transform=\"translate(680 620)\"><rect width=\"235\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"117.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"117.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Clock</text><line x1=\"0\" y1=\"34\" x2=\"235\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">nowMs(): long</text></g><g transform=\"translate(680 696)\"><rect width=\"235\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"117.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"117.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Demand</text><line x1=\"0\" y1=\"34\" x2=\"235\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">busy(restaurantId, now)</text></g><g transform=\"translate(680 766)\"><rect width=\"235\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"117.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"117.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ChargeLog</text><line x1=\"0\" y1=\"34\" x2=\"235\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">ATTEMPTED, CHARGED, DECLINED,</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">UNKNOWN, REFUND_OWED, REFUNDED</text><line x1=\"0\" y1=\"72\" x2=\"235\" y2=\"72\" stroke=\"var(--line)\"/><text x=\"8\" y=\"85\" font-size=\"11.5\" fill=\"var(--text)\">record(charge, paise, outcome)</text></g><g transform=\"translate(955 20)\"><rect width=\"265\" height=\"98\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PriceCtx</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">restaurantId, customerId</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">km: double,   busy: boolean</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">coupons: List&lt;String&gt;</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">lines: List&lt;OrderLine&gt;</text></g><g transform=\"translate(955 138)\"><rect width=\"265\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"132.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"132.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PricingRule</text><line x1=\"0\" y1=\"34\" x2=\"265\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">apply(running, ctx): Bill</text></g><g transform=\"translate(955 218)\"><rect width=\"265\" height=\"122\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">the concrete rules</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">ItemTotal -- the food itself</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">DistanceFee -- 20.00 + 8.00 a km</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">SurgeFee -- 1.5x on the fee only</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">PercentCoupon / FlatCoupon</text><line x1=\"0\" y1=\"96\" x2=\"265\" y2=\"96\" stroke=\"var(--line)\"/><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">each adds one line to the bill</text></g><g transform=\"translate(955 360)\"><rect width=\"265\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CappedDiscount</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">inner: PricingRule (wrapped)</text><line x1=\"0\" y1=\"48\" x2=\"265\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">caps what the inner took off</text></g><g transform=\"translate(955 454)\"><rect width=\"265\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CheckedRule</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">inner: PricingRule (wrapped)</text><line x1=\"0\" y1=\"48\" x2=\"265\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">the parts must add to the total</text></g><g transform=\"translate(955 548)\"><rect width=\"265\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"132.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"132.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">AssignmentRule</text><line x1=\"0\" y1=\"34\" x2=\"265\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">rank(free, pickup): List&lt;id&gt;</text></g><g transform=\"translate(955 622)\"><rect width=\"265\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">NearestFree</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">the free riders, sorted by km</text></g><g transform=\"translate(955 696)\"><rect width=\"265\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"132.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"132.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CancellationPolicy</text><line x1=\"0\" y1=\"34\" x2=\"265\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">refundPaise(order, from, now)</text></g><g transform=\"translate(955 770)\"><rect width=\"265\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">StandardCancellation</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">feePaise: long</text><line x1=\"0\" y1=\"48\" x2=\"265\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">free until the kitchen starts</text></g><g><path d=\"M20 886L64 886\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"890\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 886L284 886\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"890\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 886L504 886\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"890\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 886L684 886\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"890\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 886L904 886\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"890\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns, and there are five: the service owns every order, every restaurant and every open cart; an order owns its lines; a restaurant owns its menu. Plain arrow = references: an order points at its rider <i>by id</i>, because the rider outlives the order and belongs to the fleet, and at its bill, a frozen value. Dashed green = handed in through <code>configure()</code> or a setter: the pricing chain, the dispatcher, the gateway, the clock and the charge log. The cancellation policy and the demand signal arrive the same way. Dotted blue = notifies. <b>Where the state lives, and where the locks are.</b> The restaurant has the menu, the stock counts and one <code>ReentrantLock</code>. Each order has its own lock for its state and its rider field, because a rider may only be attached while the order is READY. A rider has a single <code>AtomicReference</code> flag and no lock at all. The service itself holds no lock, only maps and the rules it was handed. Notice what is <i>not</i> here: no Payment class (the gateway is an interface, and an order keeps only the charge id), no Notification class, and no separate Menu class. A menu is two maps inside the restaurant that owns them. Two classes in Main.java are deliberately not drawn: <code>FakeGateway</code> and <code>CustomerApp</code> are the stand-ins the demo and the tests hand in, not part of the design.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (sixty checks proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * An order&#x27;s life. The legal moves are DATA -- one table, right here -- and not if-chains scattered over the\n * service, which is what makes &quot;you cannot cancel once the rider has it&quot; a readable rule instead of a bug\n * somebody finds in production. A state with no successors is terminal.\n */\nenum OrderState {\n    PLACED, ACCEPTED, PREPARING, READY, PICKED_UP, DELIVERED, CANCELLED, REJECTED;\n\n    private static final Map&lt;OrderState, Set&lt;OrderState&gt;&gt; NEXT = new EnumMap&lt;&gt;(OrderState.class);\n    static {\n        NEXT.put(PLACED,    EnumSet.of(ACCEPTED, REJECTED, CANCELLED));\n        NEXT.put(ACCEPTED,  EnumSet.of(PREPARING, CANCELLED));\n        NEXT.put(PREPARING, EnumSet.of(READY, CANCELLED));\n        NEXT.put(READY,     EnumSet.of(PICKED_UP, CANCELLED));\n        NEXT.put(PICKED_UP, EnumSet.of(DELIVERED));            // on the road: no going back\n        NEXT.put(DELIVERED, EnumSet.noneOf(OrderState.class));\n        NEXT.put(CANCELLED, EnumSet.noneOf(OrderState.class));\n        NEXT.put(REJECTED,  EnumSet.noneOf(OrderState.class));\n    }\n    /** True if this order may legally move to target. Every mutation in the service asks this first. */\n    boolean canGoTo(OrderState target) { return NEXT.get(this).contains(target); }\n    /** True if nothing may follow this state: DELIVERED, CANCELLED, REJECTED. */\n    boolean isTerminal() { return NEXT.get(this).isEmpty(); }\n    /** The legal successors, for a diagram or an error message. */\n    Set&lt;OrderState&gt; next() { return NEXT.get(this); }\n}\n\n/** A rider is free, carrying an order, or logged out. The AVAILABLE to ASSIGNED flip is the contended one. */\nenum PartnerState { OFFLINE, AVAILABLE, ASSIGNED }\n\n/** Exact money, in paise. There is no double anywhere near a rupee in this file; these two are the boundary. */\nfinal class Money {\n    /** Parse &quot;249.00&quot; into 24900 paise, exactly. Used at the edge (a form, a menu upload), never in the maths. */\n    static long rupees(String amount) { return new java.math.BigDecimal(amount).movePointRight(2).longValueExact(); }\n    /** Print 24900 paise as &quot;249.00&quot;. Presentation only. */\n    static String fmt(long paise) {\n        String sign = paise &lt; 0 ? &quot;-&quot; : &quot;&quot;; long a = Math.abs(paise);\n        return sign + (a / 100) + &quot;.&quot; + String.format(&quot;%02d&quot;, a % 100);\n    }\n}\n\n/** A point on the map. Distance is the only place a double is allowed, and it never touches a price directly. */\nrecord Geo(double lat, double lng) {\n    /** Kilometres, flat-earth approximation -- good to a few metres over a city, and swappable for haversine. */\n    double kmTo(Geo o) {\n        double dy = (lat - o.lat) * 110.574;\n        double dx = (lng - o.lng) * 111.320 * Math.cos(Math.toRadians((lat + o.lat) / 2));\n        return Math.sqrt(dx * dx + dy * dy);\n    }\n}\n\n/** One line on a restaurant&#x27;s menu. Immutable: the price here is authoritative and is copied at checkout. */\nrecord MenuItem(String id, String name, long pricePaise) {}\n\n/** One line of a placed order: the name and the price as they were when the customer paid. */\nrecord OrderLine(String itemId, String name, long unitPaise, int qty) {\n    /** What this line costs: unit price times quantity, in paise. */\n    long amountPaise() { return unitPaise * qty; }\n}\n\n/**\n * A priced basket. The four parts and the total are stored separately on purpose, so a pricing rule can get\n * them out of step -- and CheckedRule catches it before the card is charged.\n */\nrecord Bill(long items, long delivery, long surge, long discount, long total) {\n    static final Bill EMPTY = new Bill(0, 0, 0, 0, 0);\n    /** Set the item subtotal (the first rule in the chain). */\n    Bill withItems(long p)   { return new Bill(p, delivery, surge, discount, p + delivery + surge - discount); }\n    /** Add a delivery fee. */\n    Bill addDelivery(long p) { return new Bill(items, delivery + p, surge, discount, total + p); }\n    /** Add a surge amount on top of the delivery fee. */\n    Bill addSurge(long p)    { return new Bill(items, delivery, surge + p, discount, total + p); }\n    /** Take money off: a coupon, a refund of a fee, a loyalty credit. */\n    Bill addDiscount(long p) { return new Bill(items, delivery, surge, discount + p, total - p); }\n    @Override public String toString() {\n        return &quot;items &quot; + Money.fmt(items) + &quot; + delivery &quot; + Money.fmt(delivery) + &quot; + surge &quot; + Money.fmt(surge)\n             + &quot; - discount &quot; + Money.fmt(discount) + &quot; = &quot; + Money.fmt(total);\n    }\n}\n\n/** Everything a pricing rule is allowed to look at. A rule reads this and the running bill, and nothing else. */\nrecord PriceCtx(String restaurantId, String customerId, double km, boolean busy,\n                List&lt;String&gt; coupons, List&lt;OrderLine&gt; lines) {}\n\n/** What a cancellation gave back and what it kept. Returned to the caller so the app can show both numbers. */\nrecord Refund(long refundedPaise, long keptPaise) {}\n\n/** Where time comes from. Injected, so a test can stamp an order with any instant it likes. */\ninterface Clock { long nowMs(); }\n\n// &quot;marketing will change the fee and the coupons during the round&quot; -&gt; hide each behind an interface -&gt; Strategy\n/**\n * One step of the price. Each rule takes the running bill and returns a richer one; the service applies the\n * list in order. A rule must keep the parts and the total in step -- CheckedRule enforces that for every rule.\n */\ninterface PricingRule {\n    /** The bill after this rule has had its say. Never mutates the bill it was given. */\n    Bill apply(Bill running, PriceCtx ctx);\n}\n\n/** Who should carry this order. Returns a RANKED list, because the top choice may be taken in the gap. */\ninterface AssignmentRule {\n    /** Candidate rider ids, best first, from a snapshot of the free riders. May be empty. */\n    List&lt;String&gt; rank(List&lt;DeliveryPartner&gt; free, Geo pickup);\n}\n\n/** How much money goes back when an order is cancelled. Changes with the season; injected, never hard-coded. */\ninterface CancellationPolicy {\n    /** Paise to refund for this order cancelled out of state `from` at nowMs. Never more than the total. */\n    long refundPaise(Order order, OrderState from, long nowMs);\n}\n\n/** The card gateway. The slow, irreversible step: it is called outside every lock, and only once per order. */\ninterface PaymentProcessor {\n    /** True if the money moved, false if the bank said no. Throwing means &quot;I do not know&quot; -- see ChargeLog. */\n    boolean charge(String chargeId, long paise);\n    /** Give money back for a charge that succeeded. Called on cancel, on a rejection, and by the reconciler. */\n    void refund(String chargeId, long paise);\n}\n\n/**\n * What we know about one charge. UNKNOWN is the dangerous one: the money may or may not have left the\n * customer. REFUND_OWED is written before a refund is sent and stays until the gateway confirms it, so a\n * refund that fails is retried by the sweep instead of lost. REFUNDED means the money went back.\n */\nenum ChargeOutcome { ATTEMPTED, CHARGED, DECLINED, UNKNOWN, REFUND_OWED, REFUNDED }\n\n/**\n * Where a charge is written down BEFORE the gateway is called, and again after, with what we learned. Without\n * this line a timed-out charge is money nobody can find: no order to look up, and no record that we ever tried.\n */\ninterface ChargeLog {\n    /** Record one step of one charge attempt. Must not throw: it is on the checkout path. */\n    void record(String chargeId, String customerId, long paise, ChargeOutcome outcome);\n}\n\n/** Anybody who wants to hear that an order moved: the customer app, the restaurant tablet, analytics. */\ninterface OrderObserver {\n    /**\n     * Called AFTER the state is committed and the lock is released. `from` is null when the order was just\n     * placed, and equal to the current state when the event is &quot;a rider was assigned&quot; rather than a move.\n     * Must not throw; if it does, the service logs it and carries on.\n     */\n    void onState(Order order, OrderState from);\n}\n\n/** Is this restaurant&#x27;s area busy right now? The input to surge, injected so a test can turn the rain on. */\ninterface Demand {\n    /** True if delivery is scarce around this restaurant at this instant. */\n    boolean busy(String restaurantId, long nowMs);\n}\n\n/** The first rule in every chain: what the food costs, at the prices snapshotted at checkout. */\nfinal class ItemTotal implements PricingRule {\n    public Bill apply(Bill running, PriceCtx ctx) {\n        long items = 0;\n        for (OrderLine l : ctx.lines()) items += l.amountPaise();\n        return running.withItems(items);\n    }\n}\n\n/** A flat pickup fee plus a per-kilometre fee, rounded up to the next whole kilometre. */\nfinal class DistanceFee implements PricingRule {\n    private final long basePaise, perKmPaise;\n    DistanceFee(long basePaise, long perKmPaise) { this.basePaise = basePaise; this.perKmPaise = perKmPaise; }\n    public Bill apply(Bill running, PriceCtx ctx) {\n        return running.addDelivery(basePaise + perKmPaise * (long) Math.ceil(ctx.km()));\n    }\n}\n\n/** Rain, a cricket final, a Friday night: a multiplier on the delivery fee only, never on the food. */\nfinal class SurgeFee implements PricingRule {\n    private final long multBps;                                   // 15000 = 1.5x\n    SurgeFee(long multBps) { this.multBps = multBps; }\n    public Bill apply(Bill running, PriceCtx ctx) {\n        if (!ctx.busy()) return running;\n        return running.addSurge(running.delivery() * (multBps - 10_000) / 10_000);\n    }\n}\n\n/** A percentage off the food (not the fees), in basis points: 4000 = 40%. Fires only if its code was used. */\nfinal class PercentCoupon implements PricingRule {\n    private final String code; private final long offBps;\n    PercentCoupon(String code, long offBps) { this.code = code; this.offBps = offBps; }\n    public Bill apply(Bill running, PriceCtx ctx) {\n        if (!ctx.coupons().contains(code)) return running;\n        return running.addDiscount(running.items() * offBps / 10_000);\n    }\n}\n\n/** A flat amount off, never more than what is still owed, so a coupon can take the bill to zero but not below. */\nfinal class FlatCoupon implements PricingRule {\n    private final String code; private final long offPaise;\n    FlatCoupon(String code, long offPaise) { this.code = code; this.offPaise = offPaise; }\n    public Bill apply(Bill running, PriceCtx ctx) {\n        if (!ctx.coupons().contains(code)) return running;\n        return running.addDiscount(Math.min(offPaise, running.total()));\n    }\n}\n\n/**\n * DECORATOR. Wraps any discount rule and caps what it took off: &quot;40% off, up to 120 rupees&quot;. The inner rule\n * does not know it is capped, so one cap class serves every coupon written this year and next.\n */\nfinal class CappedDiscount implements PricingRule {\n    private final PricingRule inner; private final long capPaise;\n    CappedDiscount(PricingRule inner, long capPaise) { this.inner = inner; this.capPaise = capPaise; }\n    public Bill apply(Bill running, PriceCtx ctx) {\n        Bill after = inner.apply(running, ctx);\n        long took = after.discount() - running.discount();\n        return took &lt;= capPaise ? after : running.addDiscount(capPaise);\n    }\n}\n\n/**\n * DECORATOR. Wraps EVERY rule the service is handed and refuses a bill whose parts do not add up to its total,\n * or that went negative. A rule written next year cannot charge a customer a number nobody can explain.\n */\nfinal class CheckedRule implements PricingRule {\n    private final PricingRule inner;\n    CheckedRule(PricingRule inner) { this.inner = inner; }\n    public Bill apply(Bill running, PriceCtx ctx) {\n        Bill out = inner.apply(running, ctx);\n        String who = inner.getClass().getSimpleName();\n        if (out.items() &lt; 0 || out.delivery() &lt; 0 || out.surge() &lt; 0 || out.discount() &lt; 0)\n            throw new IllegalStateException(who + &quot; produced a negative line: &quot; + out);\n        if (out.items() + out.delivery() + out.surge() - out.discount() != out.total())\n            throw new IllegalStateException(who + &quot; left the parts and the total out of step: &quot; + out);\n        if (out.total() &lt; 0) throw new IllegalStateException(who + &quot; made the total negative: &quot; + out);\n        return out;\n    }\n}\n\n/** The default assignment rule: whoever is free and closest to the restaurant, nearest first. */\nfinal class NearestFree implements AssignmentRule {\n    public List&lt;String&gt; rank(List&lt;DeliveryPartner&gt; free, Geo pickup) {\n        List&lt;DeliveryPartner&gt; sorted = new ArrayList&lt;&gt;(free);\n        sorted.sort(Comparator.comparingDouble(p -&gt; p.at().kmTo(pickup)));\n        List&lt;String&gt; ids = new ArrayList&lt;&gt;(sorted.size());\n        for (DeliveryPartner p : sorted) ids.add(p.id());\n        return ids;\n    }\n}\n\n/** Free until the kitchen starts cooking; after that the food exists, so a flat fee is kept and the rest returns. */\nfinal class StandardCancellation implements CancellationPolicy {\n    private final long feePaise;\n    StandardCancellation(long feePaise) { this.feePaise = feePaise; }\n    public long refundPaise(Order order, OrderState from, long nowMs) {\n        long total = order.bill().total();\n        if (from == OrderState.PLACED || from == OrderState.ACCEPTED) return total;   // nothing has been cooked\n        return Math.max(0, total - feePaise);                                         // PREPARING or READY\n    }\n}\n\n/** A stand-in for the card gateway: counts calls, and declines any card on its blocked list. */\nfinal class FakeGateway implements PaymentProcessor {\n    private final Set&lt;String&gt; declineFor = ConcurrentHashMap.newKeySet();\n    private final AtomicInteger charges = new AtomicInteger(), refunds = new AtomicInteger();\n    /** Make every charge whose id contains this marker fail, so a test can force a decline. */\n    void declineContaining(String marker) { declineFor.add(marker); }\n    public boolean charge(String chargeId, long paise) {\n        charges.incrementAndGet();\n        for (String m : declineFor) if (chargeId.contains(m)) return false;\n        return true;\n    }\n    public void refund(String chargeId, long paise) { refunds.incrementAndGet(); }\n    /** How many times the card was touched -- the number the &quot;no order, no charge&quot; tests assert on. */\n    int chargeCount() { return charges.get(); }\n    /** How many refunds were issued. */\n    int refundCount() { return refunds.get(); }\n}\n\n/** The customer&#x27;s phone: prints every state change. A deliberately dumb observer, to show the seam. */\nfinal class CustomerApp implements OrderObserver {\n    private final boolean quiet;\n    CustomerApp(boolean quiet) { this.quiet = quiet; }\n    public void onState(Order o, OrderState from) {\n        if (quiet) return;\n        if (from == null)               System.out.println(&quot;   [app] &quot; + o.id() + &quot;: placed&quot;);\n        else if (from == o.state())     System.out.println(&quot;   [app] &quot; + o.id() + &quot;: rider &quot; + o.partnerId() + &quot; assigned&quot;);\n        else                            System.out.println(&quot;   [app] &quot; + o.id() + &quot;: &quot; + from + &quot; -&gt; &quot; + o.state());\n    }\n}\n\n/**\n * A restaurant: its menu, how much of each item is left, whether it is open, and its own lock. The lock is\n * per restaurant because the stock is per restaurant: two restaurants never wait for each other.\n */\nfinal class Restaurant {\n    private final String id, name;\n    private final Geo at;\n    private final int prepMinutes;\n    private final Map&lt;String, MenuItem&gt; menu = new LinkedHashMap&lt;&gt;();\n    private final Map&lt;String, Integer&gt; stock = new HashMap&lt;&gt;();\n    private final Set&lt;String&gt; liveOrders = new LinkedHashSet&lt;&gt;();      // O(1) in, O(1) out, arrival order\n    private final ReentrantLock lock = new ReentrantLock();\n    private volatile boolean open = true;\n\n    Restaurant(String id, String name, Geo at, int prepMinutes) {\n        this.id = id; this.name = name; this.at = at; this.prepMinutes = prepMinutes;\n    }\n    String id() { return id; }\n    String name() { return name; }\n    Geo at() { return at; }\n    /** How long the kitchen takes, in minutes. Used by the ETA extension, never by the state machine. */\n    int prepMinutes() { return prepMinutes; }\n    /** Open or shut. A closed restaurant rejects at reserve time, inside the lock. */\n    void setOpen(boolean o) { open = o; }\n\n    /** Put an item on the menu with a starting stock count. */\n    void put(MenuItem item, int units) {\n        lock.lock();\n        try { menu.put(item.id(), item); stock.put(item.id(), units); } finally { lock.unlock(); }\n    }\n    /** Set how many of an item are left (the kitchen ran out, or the evening batch arrived). */\n    void setStock(String itemId, int units) {\n        lock.lock();\n        try { stock.put(itemId, units); } finally { lock.unlock(); }\n    }\n    /** How many are left. A read, for tests and for the menu screen. */\n    int stockOf(String itemId) {\n        lock.lock();\n        try { return stock.getOrDefault(itemId, 0); } finally { lock.unlock(); }\n    }\n    /** The menu as the customer sees it. */\n    List&lt;MenuItem&gt; menu() {\n        lock.lock();\n        try { return List.copyOf(menu.values()); } finally { lock.unlock(); }\n    }\n\n    /**\n     * THE RACE. Check every line against the live menu and stock, and only then take the stock down --\n     * all of the lines or none of them, inside one lock, so two customers can never both get the last portion.\n     * Returns the lines priced at today&#x27;s menu prices: the order is never priced by the client.\n     */\n    List&lt;OrderLine&gt; reserve(Map&lt;String, Integer&gt; want) {\n        lock.lock();\n        try {\n            if (!open) throw new IllegalStateException(name + &quot; is closed right now&quot;);\n            if (want.isEmpty()) throw new IllegalArgumentException(&quot;an empty cart cannot be checked out&quot;);\n            List&lt;OrderLine&gt; lines = new ArrayList&lt;&gt;(want.size());\n            for (Map.Entry&lt;String, Integer&gt; e : want.entrySet()) {          // 1. check everything first\n                MenuItem item = menu.get(e.getKey());\n                if (item == null) throw new IllegalArgumentException(e.getKey() + &quot; is not on this menu&quot;);\n                int have = stock.getOrDefault(e.getKey(), 0);\n                if (e.getValue() &lt;= 0) throw new IllegalArgumentException(&quot;quantity must be positive&quot;);\n                if (have &lt; e.getValue())\n                    throw new IllegalStateException(item.name() + &quot;: only &quot; + have + &quot; left, &quot; + e.getValue() + &quot; wanted&quot;);\n                lines.add(new OrderLine(item.id(), item.name(), item.pricePaise(), e.getValue()));\n            }\n            for (OrderLine l : lines) stock.merge(l.itemId(), -l.qty(), Integer::sum);   // 2. only now, write\n            return List.copyOf(lines);\n        } finally { lock.unlock(); }\n    }\n\n    /** Put reserved stock back: the card was declined, the restaurant rejected, or the customer cancelled early. */\n    void giveBack(List&lt;OrderLine&gt; lines) {\n        lock.lock();\n        try { for (OrderLine l : lines) stock.merge(l.itemId(), l.qty(), Integer::sum); } finally { lock.unlock(); }\n    }\n    /** Add an order to this restaurant&#x27;s live queue (the tablet&#x27;s screen). */\n    void enqueue(String orderId) { lock.lock(); try { liveOrders.add(orderId); } finally { lock.unlock(); } }\n    /** Take an order off the live queue: it reached a terminal state. */\n    void dequeue(String orderId) { lock.lock(); try { liveOrders.remove(orderId); } finally { lock.unlock(); } }\n    /** The tablet&#x27;s queue, in arrival order. O(1) to add and remove; this copy is O(n) and is a read. */\n    List&lt;String&gt; liveQueue() { lock.lock(); try { return List.copyOf(liveOrders); } finally { lock.unlock(); } }\n}\n\n/**\n * A customer&#x27;s basket, bound to one restaurant at the moment it is opened. The single-restaurant rule is\n * enforced here, at add time, rather than hoped for at checkout.\n */\nfinal class Cart {\n    private final String customerId, restaurantId;\n    private final Geo dropAt;\n    private final LinkedHashMap&lt;String, Integer&gt; lines = new LinkedHashMap&lt;&gt;();\n\n    Cart(String customerId, String restaurantId, Geo dropAt) {\n        this.customerId = customerId; this.restaurantId = restaurantId; this.dropAt = dropAt;\n    }\n    String customerId() { return customerId; }\n    String restaurantId() { return restaurantId; }\n    /** Where the food is going. Fixed when the cart is opened, so the fee cannot change under the customer. */\n    Geo dropAt() { return dropAt; }\n    /** Add or increase a line. Synchronized because the customer may be tapping on a phone and a tablet. */\n    synchronized void add(String itemId, int qty) { lines.merge(itemId, qty, Integer::sum); }\n    /** Drop a line entirely. */\n    synchronized void remove(String itemId) { lines.remove(itemId); }\n    /** A frozen copy in the order the customer added things, so checkout prices a basket that cannot move. */\n    synchronized Map&lt;String, Integer&gt; snapshot() {\n        return Collections.unmodifiableMap(new LinkedHashMap&lt;&gt;(lines));\n    }\n    /** Empty it, once its order exists. */\n    synchronized void clear() { lines.clear(); }\n    /** True if there is nothing to check out. */\n    synchronized boolean isEmpty() { return lines.isEmpty(); }\n}\n\n/**\n * A placed order. Its lines and its bill never change after checkout -- they are the receipt. Its state and\n * its rider do, and both change only under this order&#x27;s own lock.\n */\nfinal class Order {\n    private final String id, customerId, restaurantId, chargeId;\n    private final List&lt;OrderLine&gt; lines;\n    private final Bill bill;\n    private final Geo dropAt;\n    private final long placedAtMs;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final EnumMap&lt;OrderState, Long&gt; stamps = new EnumMap&lt;&gt;(OrderState.class);\n    private volatile String partner;                        // written under the lock, read without it\n    private volatile OrderState state = OrderState.PLACED;\n\n    Order(String id, String customerId, String restaurantId, String chargeId,\n          List&lt;OrderLine&gt; lines, Bill bill, Geo dropAt, long placedAtMs) {\n        this.id = id; this.customerId = customerId; this.restaurantId = restaurantId; this.chargeId = chargeId;\n        this.lines = lines; this.bill = bill; this.dropAt = dropAt; this.placedAtMs = placedAtMs;\n        stamps.put(OrderState.PLACED, placedAtMs);\n    }\n    String id() { return id; }\n    String customerId() { return customerId; }\n    String restaurantId() { return restaurantId; }\n    /** The gateway&#x27;s id for the one charge this order made. Refunds quote it. */\n    String chargeId() { return chargeId; }\n    List&lt;OrderLine&gt; lines() { return lines; }\n    /** The receipt: what was charged and why, frozen at checkout. */\n    Bill bill() { return bill; }\n    /** Where the food is going. Fixed at checkout, so a moved pin cannot reprice a paid order. */\n    Geo dropAt() { return dropAt; }\n    long placedAtMs() { return placedAtMs; }\n    /** The current state. Volatile, so &quot;where is my order?&quot; is a lock-free read. */\n    OrderState state() { return state; }\n    /** The rider carrying it, or null. Volatile, so the read takes no lock. */\n    String partnerId() { return partner; }\n    /**\n     * THE SECOND CLAIM. The rider was claimed with a compare-and-set on the rider; this claims the ORDER, under\n     * its lock, and only while it is READY with no rider. Two dispatchers can each win a different rider for\n     * one waiting order, and the customer can cancel at that instant: the loser hands his rider straight back.\n     */\n    boolean takePartner(String id) {\n        lock.lock();\n        try {\n            if (state != OrderState.READY || partner != null) return false;\n            partner = id;\n            return true;\n        } finally { lock.unlock(); }\n    }\n    /** Let the rider go. Only called on a terminal path, when takePartner can no longer succeed. */\n    void clearPartner() { partner = null; }\n    void lock() { lock.lock(); }\n    void unlock() { lock.unlock(); }\n    /** Commit a state, with the instant it happened. Only ever called with this order&#x27;s lock held. */\n    void moveTo(OrderState to, long atMs) { state = to; stamps.put(to, atMs); }\n    /** When each state was reached. A copy, taken under the lock, so a reader never sees a half-written map. */\n    Map&lt;OrderState, Long&gt; stamps() {\n        lock.lock();\n        try { return new EnumMap&lt;&gt;(stamps); } finally { lock.unlock(); }\n    }\n}\n\n/**\n * A rider. The only contended state is the free/busy flag, and it is a single field, so a compare-and-set\n * fits and no lock is needed: the winner of the CAS is the one who gets him.\n */\nfinal class DeliveryPartner {\n    private final String id;\n    private final AtomicReference&lt;PartnerState&gt; state = new AtomicReference&lt;&gt;(PartnerState.AVAILABLE);\n    private volatile Geo at;\n    private volatile String orderId;\n\n    DeliveryPartner(String id, Geo at) { this.id = id; this.at = at; }\n    String id() { return id; }\n    /** Last known position. Written by the rider app&#x27;s GPS stream, read by the assignment rule. */\n    Geo at() { return at; }\n    void moveTo(Geo g) { at = g; }\n    PartnerState state() { return state.get(); }\n    boolean isAvailable() { return state.get() == PartnerState.AVAILABLE; }\n    /** The order he is carrying, or null. */\n    String orderId() { return orderId; }\n    /**\n     * Take this rider for an order. One indivisible step: whoever wins the compare-and-set has him, and the\n     * loser simply tries the next candidate. This is the whole of &quot;a rider is never double-booked&quot;.\n     */\n    boolean claim(String forOrderId) {\n        if (!state.compareAndSet(PartnerState.AVAILABLE, PartnerState.ASSIGNED)) return false;\n        orderId = forOrderId;\n        return true;\n    }\n    /** Hand him back to the pool. Called on every terminal path, which is what stops the fleet leaking riders. */\n    void release() {\n        orderId = null;\n        state.compareAndSet(PartnerState.ASSIGNED, PartnerState.AVAILABLE);\n    }\n    /** Log out (end of shift). Only allowed while free. */\n    boolean goOffline() { return state.compareAndSet(PartnerState.AVAILABLE, PartnerState.OFFLINE); }\n    /** Log back in. OrderService.register calls it, then lets the waiting orders see him. */\n    void goOnline() { state.compareAndSet(PartnerState.OFFLINE, PartnerState.AVAILABLE); }\n}\n\n/**\n * The orchestrator: it owns the registries, is handed the rules, and is the only place the order of operations\n * at checkout is written down. It holds no lock of its own -- the locks live where the state lives: the\n * restaurant&#x27;s lock guards stock, each order&#x27;s lock guards its state and its rider, and the rider&#x27;s own\n * free/busy flag is a compare-and-set.\n */\nfinal class OrderService {\n    private final Map&lt;String, Restaurant&gt; restaurants = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, DeliveryPartner&gt; partners = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Order&gt; orders = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Cart&gt; carts = new ConcurrentHashMap&lt;&gt;();          // one open cart per customer\n    private final Map&lt;String, InFlight&gt; byKey = new ConcurrentHashMap&lt;&gt;();      // idempotency key -&gt; the attempt\n    private final ConcurrentLinkedDeque&lt;String&gt; waitingForRider = new ConcurrentLinkedDeque&lt;&gt;();\n    private final List&lt;OrderObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n    private final AtomicInteger orderSeq = new AtomicInteger(), chargeSeq = new AtomicInteger();\n\n    private List&lt;PricingRule&gt; pricing = List.of();\n    private AssignmentRule assignment = new NearestFree();\n    private CancellationPolicy cancellation = new StandardCancellation(0);\n    private PaymentProcessor payments;\n    private Demand demand = (r, t) -&gt; false;\n    private Clock clock = System::currentTimeMillis;\n    private ChargeLog chargeLog = (id, who, paise, outcome) -&gt; { };     // no-op until somebody hands one in\n\n    /** Hand in every rule that can change. The service builds none of them; that is the whole point. */\n    void configure(List&lt;PricingRule&gt; pricing, AssignmentRule assignment,\n                   CancellationPolicy cancellation, PaymentProcessor payments) {\n        List&lt;PricingRule&gt; checked = new ArrayList&lt;&gt;(pricing.size());\n        for (PricingRule r : pricing) checked.add(new CheckedRule(r));     // Decorator: police every rule\n        this.pricing = List.copyOf(checked);\n        this.assignment = assignment; this.cancellation = cancellation; this.payments = payments;\n    }\n    /** Where &quot;is it busy?&quot; comes from. A test flips it on to make surge fire. */\n    void setDemand(Demand d) { demand = d; }\n    /** Where time comes from. A test hands in a fixed instant. */\n    void setClock(Clock c) { clock = c; }\n    /** Where charge attempts are written down, so a charge whose answer never came back can be found again. */\n    void setChargeLog(ChargeLog l) { chargeLog = l; }\n    /** Add a listener. Called after the state is committed and the lock released, never inside it. */\n    void addObserver(OrderObserver o) { observers.add(o); }\n\n    void register(Restaurant r) { restaurants.put(r.id(), r); }\n    /** A rider logs in (new, or back from a break). He is one more free rider, so the waiting orders get a look. */\n    void register(DeliveryPartner p) { partners.put(p.id(), p); p.goOnline(); drainWaiting(); }\n    Restaurant restaurant(String id) { return restaurants.get(id); }\n    DeliveryPartner partner(String id) { return partners.get(id); }\n    /** An order by id: O(1), and the read path for &quot;where is my order?&quot;. */\n    Order order(String id) { return orders.get(id); }\n    /** How many READY orders are waiting for a rider right now. */\n    int waitingCount() { return waitingForRider.size(); }\n\n    /** Open a basket for this customer at this restaurant. Opening a second one replaces the first. */\n    Cart openCart(String customerId, String restaurantId, Geo dropAt) {\n        if (!restaurants.containsKey(restaurantId)) throw new IllegalArgumentException(&quot;no such restaurant&quot;);\n        Cart c = new Cart(customerId, restaurantId, dropAt);\n        carts.put(customerId, c);\n        return c;\n    }\n    /**\n     * Add to the customer&#x27;s open cart. The single-restaurant invariant is enforced here: an item from another\n     * restaurant is refused, rather than discovered at checkout when the customer has already committed.\n     */\n    void addToCart(String customerId, String restaurantId, String itemId, int qty) {\n        Cart c = carts.get(customerId);\n        if (c == null) throw new IllegalStateException(&quot;no open cart for &quot; + customerId);\n        if (!c.restaurantId().equals(restaurantId))\n            throw new IllegalStateException(&quot;this cart belongs to &quot; + c.restaurantId() + &quot;; clear it first&quot;);\n        c.add(itemId, qty);\n    }\n\n    /** One attempt at placing an order, so a retried tap waits for the first instead of paying twice. */\n    private static final class InFlight {\n        private final CountDownLatch done = new CountDownLatch(1);\n        private volatile Order order;\n        private volatile RuntimeException failure;\n        Order await() {\n            try { done.await(); } catch (InterruptedException e) {\n                Thread.currentThread().interrupt(); throw new IllegalStateException(&quot;interrupted while retrying&quot;);\n            }\n            if (failure != null) throw failure;\n            return order;\n        }\n        void succeed(Order o) { order = o; done.countDown(); }\n        void fail(RuntimeException e) { failure = e; done.countDown(); }\n    }\n\n    /**\n     * THE CRITICAL STEP, in this order and no other: claim the idempotency key; reserve the stock under the\n     * restaurant&#x27;s lock (all lines or none); price it outside every lock; charge the card, which is the slow\n     * irreversible bit; and only if the money moved does an order exist. A decline hands the stock back and\n     * leaves the system exactly as it was, so the customer can try another card.\n     */\n    Order placeOrder(String idempotencyKey, String customerId, List&lt;String&gt; coupons) {\n        Cart cart = carts.get(customerId);\n        if (cart == null) throw new IllegalStateException(&quot;nothing in the cart&quot;);\n        return placeOrder(idempotencyKey, cart, coupons);\n    }\n\n    /**\n     * The same checkout for a cart that is not the customer&#x27;s open one: a booking, or one leg of a split basket.\n     * The key is scoped to the customer, so two apps that happen to send the same key never share an order.\n     */\n    Order placeOrder(String idempotencyKey, Cart cart, List&lt;String&gt; coupons) {\n        String key = cart.customerId() + &quot;/&quot; + idempotencyKey;\n        InFlight mine = new InFlight();\n        InFlight running = byKey.putIfAbsent(key, mine);\n        if (running != null) return running.await();          // the same tap twice: one order, one charge\n        try {\n            Order placed = doPlace(cart, coupons);\n            mine.succeed(placed);\n            return placed;\n        } catch (RuntimeException e) {\n            byKey.remove(key, mine);                          // a failed attempt frees the key for a real retry\n            mine.fail

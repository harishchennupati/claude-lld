still creates one order. Stock moves the same way: <code>SET left = left - ? WHERE left &gt;= ?</code>. The one genuinely new piece is the outbox. The notification is written as a row in the <i>same transaction</i> as the state change, and a separate sender drains it. A process that commits a state and then dies before the push is the one failure the in-memory try/catch cannot cover.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- the repository, the conditional UPDATE, and the outbox\n/**\n * Beyond one process the order&#x27;s lock cannot help, so the guarded transition becomes a conditional UPDATE and\n * the database performs the same atomic step:\n *\n *   INSERT INTO orders (id, key, state, total) VALUES (?, ?, &#x27;PLACED&#x27;, ?) ON CONFLICT (key) DO NOTHING;\n *   UPDATE orders SET state = ? WHERE id = ? AND state = ?;    -- 0 rows = somebody else moved it first\n *   INSERT INTO outbox (order_id, event) VALUES (?, ?);        -- same transaction as the UPDATE\n *\n * The outbox is why the notification is exactly-once-ish: the event is committed with the state change, and a\n * separate sender drains it, so a crash between the two is impossible.\n */\ninterface OrderRepository {\n    /** Insert unless this idempotency key is already there. False means the retry found the first order. */\n    boolean insertIfAbsent(String orderId, String idempotencyKey, OrderState state);\n    /** The conditional UPDATE. False means the row was not in `expected` any more: somebody else won. */\n    boolean compareAndSetState(String orderId, OrderState expected, OrderState next);\n    /** Append an event in the same transaction as the state change. */\n    void appendOutbox(String orderId, String event);\n    /** Take everything the sender has not sent yet. */\n    List&lt;String&gt; drainOutbox();\n}\n\n/** A map-backed stand-in, so the seam can be demonstrated without a database. */\nfinal class InMemoryOrderRepository implements OrderRepository {\n    private final Map&lt;String, OrderState&gt; states = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, String&gt; byKey = new ConcurrentHashMap&lt;&gt;();\n    private final Queue&lt;String&gt; outbox = new ConcurrentLinkedQueue&lt;&gt;();\n\n    public boolean insertIfAbsent(String orderId, String key, OrderState state) {\n        if (byKey.putIfAbsent(key, orderId) != null) return false;\n        states.put(orderId, state);\n        return true;\n    }\n    public boolean compareAndSetState(String orderId, OrderState expected, OrderState next) {\n        return states.replace(orderId, expected, next);\n    }\n    public void appendOutbox(String orderId, String event) { outbox.add(orderId + &quot;:&quot; + event); }\n    public List&lt;String&gt; drainOutbox() {\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (String e = outbox.poll(); e != null; e = outbox.poll()) out.add(e);\n        return out;\n    }\n    /** The stored state, for the demo. */\n    OrderState stateOf(String orderId) { return states.get(orderId); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Which pattern is where, why is the state an enum and not eight classes, and where would a Factory or a Builder earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Not one of them was chosen up front; each is what a move produced, and moves 10 and 11 have the full table with the line of code for each. What that table does not answer is the enum question, which interviewers ask because the textbook State pattern is a class per state. Eight classes would buy nothing here. A state in this system has no behaviour of its own (no <code>PreparingState.handle()</code>), only a list of legal successors. So it is data, and data belongs in an <code>EnumMap</code> you can read in one screen and print in an error message. Same test for the other two. Factory earns its place when coupons arrive as config rows and somebody must turn a row into a rule. Builder earns its place when an order gains optional fields; today all eight are required, and a builder would only let you forget one.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: a rule behind an interface, handed in, never built by the service\ninterface PricingRule { Bill apply(Bill running, PriceCtx ctx); }\n\n// Chain: the bill grows one rule at a time, in an order you can read off the list\nfor (PricingRule rule : pricing) bill = rule.apply(bill, ctx);\n\n// Decorator, twice: one caps any coupon, one polices every rule including the ones written next year\nnew CappedDiscount(new PercentCoupon(&quot;TASTY40&quot;, 4000), Money.rupees(&quot;120.00&quot;));\nfor (PricingRule r : pricing) checked.add(new CheckedRule(r));\n\n// State as DATA, not eight classes: the legal moves are a table, so an illegal move cannot be written\nNEXT.put(PICKED_UP, EnumSet.of(DELIVERED));            // on the road: no going back\nif (!from.canGoTo(to)) throw new IllegalStateException(o.id() + &quot;: &quot; + from + &quot; -&gt; &quot; + to\n                                                     + &quot; (legal: &quot; + from.next() + &quot;)&quot;);\n\n// Factory: not yet. The list IS the registry; it earns the name when coupons come from config rows\nList&lt;PricingRule&gt; fromConfig = rows.stream().map(PricingRules::of).toList();\n\n// Builder: not yet. Eight required fields is a constructor; a tip, a note and packaging would change that\nnew Order(id, customerId, restaurantId, chargeId, lines, bill, dropAt, placedAtMs);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>17 &middot; Flipkart&#x27;s version (FoodKart): each restaurant delivers to a list of pincodes. Show the ones that deliver to me and still have the dish, best rated or cheapest first, and let customers rate them from 1 to 5.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A catalog, beside the order service rather than inside it. Onboarding lists a restaurant under every pincode it delivers to. So &ldquo;who delivers here&rdquo; is one map lookup, then a stock check per restaurant, then a sort: O(k log k) for the k restaurants of that pincode. The sort order is a <code>Comparator</code> handed in (best rated, cheapest, or any new one), the same Strategy move as pricing; FoodKart's sample lists price high to low, which is <code>CHEAPEST.reversed()</code>. A rating is accepted only for a DELIVERED order, once per order, which is the answer to &ldquo;what stops fake ratings?&rdquo;. The average is a running sum and count kept in tenths of a star (43 means 4.3), so reading it never re-reads old ratings and integer maths never prints 4.2999. FoodKart's <code>update_quantity</code> is the restaurant's <code>setStock</code>, and a new delivery area is <code>onboard</code> again.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: ratings and search -- Flipkart&#x27;s FoodKart: who delivers to my pincode, best rated or cheapest first\n/**\n * Restaurants are onboarded with the pincodes they deliver to. A customer rates a DELIVERED order from 1 to 5,\n * once, and a restaurant&#x27;s rating is a running average kept as a sum and a count, so reading it is O(1).\n * &quot;What can I order here?&quot; lists the restaurants for that pincode that still have the dish, in the order asked.\n */\nfinal class Catalog {\n    /** One line of the answer: the restaurant, the dish at today&#x27;s price, and the rating in tenths. */\n    record Listing(String restaurantId, String restaurant, MenuItem dish, int ratingTenths) {}\n\n    /** The sort orders are rules handed in, like pricing: add one without touching find(). */\n    static final Comparator&lt;Listing&gt; BEST_RATED = Comparator.comparingInt(Listing::ratingTenths).reversed();\n    static final Comparator&lt;Listing&gt; CHEAPEST = Comparator.comparingLong(l -&gt; l.dish().pricePaise());\n\n    private final Map&lt;String, Set&lt;Restaurant&gt;&gt; byPincode = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, long[]&gt; stars = new ConcurrentHashMap&lt;&gt;();       // restaurant id -&gt; {sum, count}\n    private final Set&lt;String&gt; rated = ConcurrentHashMap.newKeySet();          // order ids already rated\n\n    /** List a restaurant under every pincode it delivers to. Calling it again moves its area. */\n    void onboard(Restaurant r, Set&lt;String&gt; pincodes) {\n        for (Set&lt;Restaurant&gt; listed : byPincode.values()) listed.remove(r);\n        for (String pin : pincodes) byPincode.computeIfAbsent(pin, k -&gt; ConcurrentHashMap.newKeySet()).add(r);\n    }\n\n    /** Rate a delivered order, 1 to 5, once. The comment is stored beside it; the average needs only stars. */\n    void rate(Order o, int stars, String comment) {\n        if (o.state() != OrderState.DELIVERED) throw new IllegalStateException(&quot;only a delivered order can be rated&quot;);\n        if (stars &lt; 1 || stars &gt; 5) throw new IllegalArgumentException(&quot;stars go from 1 to 5&quot;);\n        if (!rated.add(o.id())) throw new IllegalStateException(o.id() + &quot; is already rated&quot;);\n        this.stars.merge(o.restaurantId(), new long[] { stars, 1 }, (a, b) -&gt; new long[] { a[0] + b[0], a[1] + b[1] });\n    }\n\n    /** The average in tenths of a star, rounded: 43 means 4.3. Integer maths, so no 4.2999. 0 = not rated yet. */\n    int ratingTenths(String restaurantId) {\n        long[] s = stars.get(restaurantId);\n        return s == null ? 0 : (int) ((s[0] * 10 + s[1] / 2) / s[1]);\n    }\n\n    /** Who delivers to this pincode and has this dish in stock right now, sorted. O(k log k) for k restaurants. */\n    List&lt;Listing&gt; find(String pincode, String itemId, Comparator&lt;Listing&gt; order) {\n        List&lt;Listing&gt; out = new ArrayList&lt;&gt;();\n        for (Restaurant r : byPincode.getOrDefault(pincode, Set.of())) {\n            if (r.stockOf(itemId) &lt;= 0) continue;                  // it must deliver here AND have the dish\n            for (MenuItem m : r.menu())\n                if (m.id().equals(itemId)) out.add(new Listing(r.id(), r.name(), m, ratingTenths(r.id())));\n        }\n        out.sort(order);\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>18 &middot; Flipkart&#x27;s 2025 version (Intuit asks the first half): the customer names the dishes and a strategy, cheapest or best rated. Each kitchen can cook only so many items at once. The input commands arrive shuffled and must be applied in timestamp order.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two small classes beside the service, and the service does not change. The picker keeps the kitchens that have every dish and sorts them with the strategy it is handed (<code>cheapest</code>, or <code>bestRated</code> from the catalog). Then it walks the list: rank a snapshot, then let an atomic claim decide, as in dispatch. A kitchen's room is a Semaphore with one permit per item: <code>tryAcquire</code> takes the room or fails at once, and a full kitchen sends the order on to the next one. The permits go back once, when the food leaves or the order dies, because the picker is one more observer. The shuffled input becomes Command objects in a heap (a PriorityQueue: it always hands back the earliest first), with ties kept in arrival order. The injected clock is moved to each command's time before it runs, so every stamp follows the timeline. The tests: twelve customers at once against room for 4 and 6 items give exactly 2 and 3 orders and 7 refusals, and commands fed as 300, 100, 200 run as 100, 200, 300.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the system picks the kitchen -- Intuit&#x27;s round: cheapest (or best rated) that has it all, never over capacity\n/**\n * The customer names dishes, not a restaurant. Rank a snapshot of the kitchens that have every dish (the\n * strategy is a Comparator: cheapest basket, or best rated), then try them in that order. A kitchen may cook\n * only so many items at once: a Semaphore of that many permits per kitchen, taken before the order is placed\n * and given back when the food leaves (PICKED_UP) or the order dies. The ranking guesses; the permit decides.\n */\nfinal class KitchenPicker implements OrderObserver {\n    private final Map&lt;String, Semaphore&gt; permits = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Integer&gt; cooking = new ConcurrentHashMap&lt;&gt;();   // order id -&gt; permits it holds\n\n    /** How many items this kitchen can have cooking at once. */\n    void capacity(String restaurantId, int items) { permits.put(restaurantId, new Semaphore(items)); }\n\n    /** The default strategy: the cheapest basket first, at today&#x27;s menu prices. */\n    static Comparator&lt;Restaurant&gt; cheapest(Map&lt;String, Integer&gt; dishes) {\n        return Comparator.comparingLong(r -&gt; basketPaise(r, dishes));\n    }\n    /** The other strategy the round asks for: the best-rated kitchen first, from the catalog&#x27;s running averages. */\n    static Comparator&lt;Restaurant&gt; bestRated(Catalog catalog) {\n        return Comparator.comparingInt((Restaurant r) -&gt; catalog.ratingTenths(r.id())).reversed();\n    }\n\n    /** Place the order at the best kitchen that has room. Throws if every kitchen with all the dishes is full. */\n    Order place(OrderService svc, String tapKey, String customerId, Geo dropAt, Map&lt;String, Integer&gt; dishes,\n                List&lt;Restaurant&gt; kitchens, Comparator&lt;Restaurant&gt; strategy) {\n        int items = 0;\n        for (int q : dishes.values()) items += q;\n        List&lt;Restaurant&gt; ranked = new ArrayList&lt;&gt;();\n        for (Restaurant r : kitchens) if (hasAll(r, dishes)) ranked.add(r);\n        ranked.sort(strategy);\n        for (Restaurant r : ranked) {\n            Semaphore kitchen = permits.get(r.id());\n            if (kitchen == null || !kitchen.tryAcquire(items)) continue;     // full right now: the next one\n            Cart cart = new Cart(customerId, r.id(), dropAt);\n            dishes.forEach(cart::add);\n            try {\n                Order o = svc.placeOrder(tapKey + &quot;@&quot; + r.id(), cart, List.of());\n                cooking.put(o.id(), items);\n                if (o.state() == OrderState.PICKED_UP || o.state().isTerminal()) giveBack(o);   // died already\n                return o;\n            } catch (RuntimeException e) {\n                kitchen.release(items);                                        // nothing half-done\n                if (hasAll(r, dishes)) throw e;           // it still has the food: the card failed, so stop here\n            }                                             // it sold out in the gap: try the next kitchen\n        }\n        throw new IllegalStateException(&quot;every kitchen that has all of it is full right now&quot;);\n    }\n\n    /** The food left the kitchen, or the order died: its permits go back, exactly once. */\n    public void onState(Order o, OrderState from) {\n        if (o.state() == OrderState.PICKED_UP || o.state().isTerminal()) giveBack(o);\n    }\n    private void giveBack(Order o) {\n        Integer n = cooking.remove(o.id());\n        if (n != null) permits.get(o.restaurantId()).release(n);\n    }\n\n    private static boolean hasAll(Restaurant r, Map&lt;String, Integer&gt; dishes) {\n        for (Map.Entry&lt;String, Integer&gt; d : dishes.entrySet()) if (r.stockOf(d.getKey()) &lt; d.getValue()) return false;\n        return basketPaise(r, dishes) &lt; Long.MAX_VALUE;\n    }\n    private static long basketPaise(Restaurant r, Map&lt;String, Integer&gt; dishes) {\n        long total = 0;\n        for (Map.Entry&lt;String, Integer&gt; d : dishes.entrySet()) {\n            MenuItem m = null;\n            for (MenuItem x : r.menu()) if (x.id().equals(d.getKey())) m = x;\n            if (m == null) return Long.MAX_VALUE;                              // not on this menu\n            total += m.pricePaise() * d.getValue();\n        }\n        return total;\n    }\n}\n\n// ---- ext: commands out of order -- Flipkart 2025: the input is shuffled; apply it in timestamp order\n/**\n * The round&#x27;s input is a list of timestamped commands that arrive shuffled. Each line becomes a Command object\n * with its time; a heap (PriorityQueue) hands them back oldest first, ties in arrival order, and the clock the\n * service reads is moved to each command&#x27;s time before it runs, so the order&#x27;s stamps follow the timeline.\n */\nfinal class CommandReplay {\n    /** One line of input: when it happened, what it says, and what to run. seq breaks ties in arrival order. */\n    record Command(long atMs, long seq, String text, Runnable action) {}\n\n    /** A clock the replay moves. Hand it to the service with setClock, so every stamp is the command&#x27;s time. */\n    static final class ManualClock implements Clock {\n        private volatile long now;\n        public long nowMs() { return now; }\n        void set(long atMs) { now = atMs; }\n    }\n\n    private final PriorityQueue&lt;Command&gt; pending =\n        new PriorityQueue&lt;&gt;(Comparator.comparingLong(Command::atMs).thenComparingLong(Command::seq));\n    private final ManualClock clock = new ManualClock();\n    private long arrived;\n\n    Clock clock() { return clock; }\n\n    /** Queue one command, in whatever order the input gives it. O(log n). */\n    void submit(long atMs, String text, Runnable action) { pending.add(new Command(atMs, arrived++, text, action)); }\n\n    /** Run everything oldest first. A command that fails is logged and the rest still run. */\n    List&lt;String&gt; runAll() {\n        List&lt;String&gt; log = new ArrayList&lt;&gt;();\n        for (Command c; (c = pending.poll()) != null; ) {\n            clock.set(c.atMs());\n            try { c.action().run(); log.add(c.atMs() + &quot; &quot; + c.text() + &quot;: ok&quot;); }\n            catch (RuntimeException e) { log.add(c.atMs() + &quot; &quot; + c.text() + &quot;: &quot; + e.getMessage()); }\n        }\n        return log;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * An order's life. The legal moves are DATA -- one table, right here -- and not if-chains scattered over the\n * service, which is what makes \"you cannot cancel once the rider has it\" a readable rule instead of a bug\n * somebody finds in production. A state with no successors is terminal.\n */\nenum OrderState {\n    PLACED, ACCEPTED, PREPARING, READY, PICKED_UP, DELIVERED, CANCELLED, REJECTED;\n\n    private static final Map<OrderState, Set<OrderState>> NEXT = new EnumMap<>(OrderState.class);\n    static {\n        NEXT.put(PLACED,    EnumSet.of(ACCEPTED, REJECTED, CANCELLED));\n        NEXT.put(ACCEPTED,  EnumSet.of(PREPARING, CANCELLED));\n        NEXT.put(PREPARING, EnumSet.of(READY, CANCELLED));\n        NEXT.put(READY,     EnumSet.of(PICKED_UP, CANCELLED));\n        NEXT.put(PICKED_UP, EnumSet.of(DELIVERED));            // on the road: no going back\n        NEXT.put(DELIVERED, EnumSet.noneOf(OrderState.class));\n        NEXT.put(CANCELLED, EnumSet.noneOf(OrderState.class));\n        NEXT.put(REJECTED,  EnumSet.noneOf(OrderState.class));\n    }\n    /** True if this order may legally move to target. Every mutation in the service asks this first. */\n    boolean canGoTo(OrderState target) { return NEXT.get(this).contains(target); }\n    /** True if nothing may follow this state: DELIVERED, CANCELLED, REJECTED. */\n    boolean isTerminal() { return NEXT.get(this).isEmpty(); }\n    /** The legal successors, for a diagram or an error message. */\n    Set<OrderState> next() { return NEXT.get(this); }\n}\n\n/** A rider is free, carrying an order, or logged out. The AVAILABLE to ASSIGNED flip is the contended one. */\nenum PartnerState { OFFLINE, AVAILABLE, ASSIGNED }\n\n/** Exact money, in paise. There is no double anywhere near a rupee in this file; these two are the boundary. */\nfinal class Money {\n    /** e() { lock.lock(); try { return List.copyOf(liveOrders); } finally { lock.unlock(); } }\n}\n\n/**\n * A customer's basket, bound to one restaurant at the moment it is opened. The single-restaurant rule is\n * enforced here, at add time, rather than hoped for at checkout.\n */\nfinal class Cart {\n    private final String customerId, restaurantId;\n    private final Geo dropAt;\n    private final LinkedHashMap<String, Integer> lines = new LinkedHashMap<>();\n\n    Cart(String customerId, String restaurantId, Geo dropAt) {\n        this.customerId = customerId; this.restaurantId = restaurantId; this.dropAt = dropAt;\n    }\n    String customerId() { return customerId; }\n    String restaurantId() { return restaurantId; }\n    /** Where the food is going. Fixed when the cart is opened, so the fee cannot change under the customer. */\n    Geo dropAt() { return dropAt; }\n    /** Add or increase a line. Synchronized because the customer may be tapping on a phone and a tablet. */\n    synchronized void add(String itemId, int qty) { lines.merge(itemId, qty, Integer::sum); }\n    /** Drop a line entirely. */\n    synchronized void remove(String itemId) { lines.remove(itemId); }\n    /** A frozen copy in the order the customer added things, so checkout prices a basket that cannot move. */\n    synchronized Map<String, Integer> snapshot() {\n        return Collections.unmodifiableMap(new LinkedHashMap<>(lines));\n    }\n    /** Empty it, once its order exists. */\n    synchronized void clear() { lines.clear(); }\n    /** True if there is nothing to check out. */\n    synchronized boolean isEmpty() { return lines.isEmpty(); }\n}\n\n/**\n * A placed order. Its lines and its bill never change after checkout -- they are the receipt. Its state and\n * its rider do, and both change only under this order's own lock.\n */\nfinal class Order {\n    private final String id, customerId, restaurantId, chargeId;\n    private final List<OrderLine> lines;\n    private final Bill bill;\n    private final Geo dropAt;\n    private final long placedAtMs;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final EnumMap<OrderState, Long> stamps = new EnumMap<>(OrderState.class);\n    private volatile String partner;                        // written under the lock, read without it\n    private volatile OrderState state = OrderState.PLACED;\n\n    Order(String id, String customerId, String restaurantId, String chargeId,\n          List<OrderLine> lines, Bill bill, Geo dropAt, long placedAtMs) {\n        this.id = id; this.customerId = customerId; this.restaurantId = restaurantId; this.chargeId = chargeId;\n        this.lines = lines; this.bill = bill; this.dropAt = dropAt; this.placedAtMs = placedAtMs;\n        stamps.put(OrderState.PLACED, placedAtMs);\n    }\n    String id() { return id; }\n    String customerId() { return customerId; }\n    String restaurantId() { return restaurantId; }\n    /** The gateway's id for the one charge this order made. Refunds quote it. */\n    String chargeId() { return chargeId; }\n    List<OrderLine> lines() { return lines; }\n    /** The receipt: what was charged and why, frozen at checkout. */\n    Bill bill() { return bill; }\n    /** Where the food is going. Fixed at checkout, so a moved pin cannot reprice a paid order. */\n    Geo dropAt() { return dropAt; }\n    long placedAtMs() { return placedAtMs; }\n    /** The current state. Volatile, so \"where is my order?\" is a lock-free read. */\n    OrderState state() { return state; }\n    /** The rider carrying it, or null. Volatile, so the read takes no lock. */\n    String partnerId() { return partner; }\n    /**\n     * THE SECOND CLAIM. The rider was claimed with a compare-and-set on the rider; this claims the ORDER, under\n     * its lock, and only while it is READY with no rider. Two dispatchers can each win a different rider for\n     * one waiting order, and the customer can cancel at that instant: the loser hands his rider straight back.\n     */\n    boolean takePartner(String id) {\n        lock.lock();\n        try {\n            if (state != OrderState.READY || partner != null) return false;\n            partner = id;\n            return true;\n        } finally { lock.unlock(); }\n    }\n    /** Let the rider go. Only called on a terminal path, when takePartner can no longer succeed. */\n    void clearPartner() { partner = null; }\n    void lock() { lock.lock(); }\n    void unlock() { lock.unlock(); }\n    /** Commit a state, with the instant it happened. Only ever called with this order's lock held. */\n    void moveTo(OrderState to, long atMs) { state = to; stamps.put(to, atMs); }\n    /** When each state was reached. A copy, taken under the lock, so a reader never sees a half-written map. */\n    Map<OrderState, Long> stamps() {\n        lock.lock();\n        try { return new EnumMap<>(stamps); } finally { lock.unlock(); }\n    }\n}\n\n/**\n * A rider. The only contended state is the free/busy flag, and it is a single field, so a compare-and-set\n * fits and no lock is needed: the winner of the CAS is the one who gets him.\n */\nfinal class DeliveryPartner {\n    private final String id;\n    private final AtomicReference<PartnerState> state = new AtomicReference<>(PartnerState.AVAILABLE);\n    private volatile Geo at;\n    private volatile String orderId;\n\n    DeliveryPartner(String id, Geo at) { this.id = id; this.at = at; }\n    String id() { return id; }\n    /** Last known position. Written by the rider app's GPS stream, read by the assignment rule. */\n    Geo at() { return at; }\n    void moveTo(Geo g) { at = g; }\n    PartnerState state() { return state.get(); }\n    boolean isAvailable() { return state.get() == PartnerState.AVAILABLE; }\n    /** The order he is carrying, or null. */\n    String orderId() { return orderId; }\n    /**\n     * Take this rider for an order. One indivisible step: whoever wins the compare-and-set has him, and the\n     * loser simply tries the next candidate. This is the whole of \"a rider is never double-booked\".\n     */\n    boolean claim(String forOrderId) {\n        if (!state.compareAndSet(PartnerState.AVAILABLE, PartnerState.ASSIGNED)) return false;\n        orderId = forOrderId;\n        return true;\n    }\n    /** Hand him back to the pool. Called on every terminal path, which is what stops the fleet leaking riders. */\n    void release() {\n        orderId = null;\n        state.compareAndSet(PartnerState.ASSIGNED, PartnerState.AVAILABLE);\n    }\n    /** Log out (end of shift). Only allowed while free. */\n    boolean goOffline() { return state.compareAndSet(PartnerState.AVAILABLE, PartnerState.OFFLINE); }\n    /** Log back in. OrderService.register calls it, then lets the waiting orders see him. */\n    void goOnline() { state.compareAndSet(PartnerState.OFFLINE, PartnerState.AVAILABLE); }\n}\n\n/**\n * The orchestrator: it owns the registries, is handed the rules, and is the only place the order of operations\n * at checkout is written down. It holds no lock of its own -- the locks live where the state lives: the\n * restaurant's lock guards stock, each order's lock guards its state and its rider, and the rider's own\n * free/busy flag is a compare-and-set.\n */\nfinal class OrderService {\n    private final Map<String, Restaurant> restaurants = new ConcurrentHashMap<>();\n    private final Map<String, DeliveryPartner> partners = new ConcurrentHashMap<>();\n    private final Map<String, Order> orders = new ConcurrentHashMap<>();\n    private final Map<String, Cart> carts = new ConcurrentHashMap<>();          // one open cart per customer\n    private final Map<String, InFlight> byKey = new ConcurrentHashMap<>();      // idempotency key -> the attempt\n    private final ConcurrentLinkedDeque<String> waitingForRider = new ConcurrentLinkedDeque<>();\n    private final List<OrderObserver> observers = new CopyOnWriteArrayList<>();\n    private final AtomicInteger orderSeq = new AtomicInteger(), chargeSeq = new AtomicInteger();\n\n    private List<PricingRule> pricing = List.of();\n    private AssignmentRule assignment = new NearestFree();\n    private CancellationPolicy cancellation = new StandardCancellation(0);\n    private PaymentProcessor payments;\n    private Demand demand = (r, t) -> false;\n    private Clock clock = System::currentTimeMillis;\n    private ChargeLog chargeLog = (id, who, paise, outcome) -> { };     // no-op until somebody hands one in\n\n    /** Hand in every rule that can change. The service builds none of them; that is the whole point. */\n    void configure(List<PricingRule> pricing, AssignmentRule assignment,\n                   CancellationPolicy cancellation, PaymentProcessor payments) {\n        List<PricingRule> checked = new ArrayList<>(pricing.size());\n        for (PricingRule r : pricing) checked.add(new CheckedRule(r));     // Decorator: police every rule\n        this.pricing = List.copyOf(checked);\n        this.assignment = assignment; this.cancellation = cancellation; this.payments = payments;\n    }\n    /** Where \"is it busy?\" comes from. A test flips it on to make surge fire. */\n    void setDemand(Demand d) { demand = d; }\n    /** Where time comes from. A test hands in a fixed instant. */\n    void setClock(Clock c) { clock = c; }\n    /** Where charge attempts are written down, so a charge whose answer never came back can be found again. */\n    void setChargeLog(ChargeLog l) { chargeLog = l; }\n    /** Add a listener. Called after the state is committed and the lock released, never inside it. */\n    void addObserver(OrderObserver o) { observers.add(o); }\n\n    void register(Restaurant r) { restaurants.put(r.id(), r); }\n    /** A rider logs in (new, or back from a break). He is one more free rider, so the waiting orders get a look. */\n    void register(DeliveryPartner p) { partners.put(p.id(), p); p.goOnline(); drainWaiting(); }\n    Restaurant restaurant(String id) { return restaurants.get(id); }\n    DeliveryPartner partner(String id) { return partners.get(id); }\n    /** An order by id: O(1), and the read path for \"where is my order?\". */\n    Order order(String id) { return orders.get(id); }\n    /** How many READY orders are waiting for a rider right now. */\n    int waitingCount() { return waitingForRider.size(); }\n\n    /** Open a basket for this customer at this restaurant. Opening a second one replaces the first. */\n    Cart openCart(String customerId, String restaurantId, Geo dropAt) {\n        if (!restaurants.containsKey(restaurantId)) throw new IllegalArgumentException(\"no such restaurant\");\n        Cart c = new Cart(customerId, restaurantId, dropAt);\n        carts.put(customerId, c);\n        return c;\n    }\n    /**\n     * Add to the customer's open cart. The single-restaurant invariant is enforced here: an item from another\n     * restaurant is refused, rather than discovered at checkout when the customer has already committed.\n     */\n    void addToCart(String customerId, String restaurantId, String itemId, int qty) {\n        Cart c = carts.get(customerId);\n        if (c == null) throw new IllegalStateException(\"no open cart for \" + customerId);\n        if (!c.restaurantId().equals(restaurantId))\n            throw new IllegalStateException(\"this cart belongs to \" + c.restaurantId() + \"; clear it first\");\n        c.add(itemId, qty);\n    }\n\n    /** One attempt at placing an order, so a retried tap waits for the first instead of paying twice. */\n    private static final class InFlight {\n        private final CountDownLatch done = new CountDownLatch(1);\n        private volatile Order order;\n        private volatile RuntimeException failure;\n        Order await() {\n            try { done.await(); } catch (InterruptedException e) {\n                Thread.currentThread().interrupt(); throw new IllegalStateException(\"interrupted while retrying\");\n            }\n            if (failure != null) throw failure;\n            return order;\n        }\n        void succeed(Order o) { order = o; done.countDown(); }\n        void fail(RuntimeException e) { failure = e; done.countDown(); }\n    }\n\n    /**\n     * THE CRITICAL STEP, in this order and no other: claim the idempotency key; reserve the stock under the\n     * restaurant's lock (all lines or none); price it outside every lock; charge the card, which is the slow\n     * irreversible bit; and only if the money moved does an order exist. A decline hands the stock back and\n     * leaves the system exactly as it was, so the customer can try another card.\n     */\n    Order placeOrder(String idempotencyKey, String customerId, List<String> coupons) {\n        Cart cart = carts.get(customerId);\n        if (cart == null) throw new IllegalStateException(\"nothing in the cart\");\n        return placeOrder(idempotencyKey, cart, coupons);\n    }\n\n    /**\n     * The same checkout for a cart that is not the customer's open one: a booking, or one leg of a split basket.\n     * The key is scoped to the customer, so two apps that happen to send the same key never share an order.\n     */\n    Order placeOrder(String idempotencyKey, Cart cart, List<String> coupons) {\n        String key = cart.customerId() + \"/\" + idempotencyKey;\n        InFlight mine = new InFlight();\n        InFlight running = byKey.putIfAbsent(key, mine);\n        if (running != null) return running.await();          // the same tap twice: one order, one charge\n        try {\n            Order placed = doPlace(cart, coupons);\n            mine.succeed(placed);\n            return placed;\n        } catch (RuntimeException e) {\n            byKey.remove(key, mine);                          // a failed attempt frees the key for a real retry\n            mine.fail(e);\n            throw e;\n        }\n    }\n\n    /** The critical step itself, numbered below. Nothing is committed until the money has moved. */\n    private Order doPlace(Cart cart, List<String> coupons) {\n        if (cart.isEmpty()) throw new IllegalStateException(\"nothing in the cart\");\n        String customerId = cart.customerId();\n        Restaurant r = restaurants.get(cart.restaurantId());\n        if (r == null) throw new IllegalArgumentException(\"no such restaurant\");\n\n        // 1. under the restaurant's lock: validate against the live menu and take the stock down, all or none.\n        List<OrderLine> lines = r.reserve(cart.snapshot());\n        Order o;\n        try {\n            // 2. price it with no lock held. Rules can throw; nothing outside the reservation has moved yet.\n            PriceCtx ctx = new PriceCtx(r.id(), customerId, r.at().kmTo(cart.dropAt()),\n                                        demand.busy(r.id(), clock.nowMs()), List.copyOf(coupons), lines);\n            Bill bill = Bill.EMPTY;\n            for (PricingRule rule : pricing) bill = rule.apply(bill, ctx);\n\n            // 3. the irreversible external action, outside every lock. Nothing has been committed yet.\n            //    Write the attempt down BEFORE the call: if the answer never comes back, this row is the only\n            //    proof we tried, and the reconciler uses it to ask the gateway later.\n            String chargeId = \"ch-\" + chargeSeq.incrementAndGet();\n            chargeLog.record(chargeId, customerId, bill.total(), ChargeOutcome.ATTEMPTED);\n            boolean paid;\n            try { paid = payments.charge(chargeId, bill.total()); }\n            catch (RuntimeException gatewayDied) {                      // a timeout: we do NOT know\n                chargeLog.record(chargeId, customerId, bill.total(), ChargeOutcome.UNKNOWN);\n                throw new IllegalStateException(\"payment outcome unknown for \" + chargeId\n                                              + \"; no order was created and the charge will be reconciled\");\n            }\n            chargeLog.record(chargeId, customerId, bill.total(),\n                             paid ? ChargeOutcome.CHARGED : ChargeOutcome.DECLINED);\n            if (!paid) throw new IllegalStateException(\"payment declined for \" + Money.fmt(bill.total()));\n\n            // 4. the money moved, so now -- and only now -- an order exists.\n            o = new Order(\"o-\" + orderSeq.incrementAndGet(), customerId, r.id(), chargeId,\n                          lines, bill, cart.dropAt(), clock.nowMs());\n            orders.put(o.id(), o);\n            r.enqueue(o.id());\n            cart.clear();\n        } catch (RuntimeException e) {\n            r.giveBack(lines);                                 // a decline or a bad rule returns the food\n            throw e;\n        }\n        publish(o, null);                                      // 5. after everything is committed\n        return o;\n    }\n\n    /** The restaurant accepts. PLACED to ACCEPTED, and nothing else may follow from PLACED except reject/cancel. */\n    void accept(String orderId) { transition(need(orderId), OrderState.ACCEPTED); }\n    /** The kitchen starts. After this, a cancellation costs the customer the cancellation fee. */\n    void startPreparing(String orderId) { transition(need(orderId), OrderState.PREPARING); }\n    /** The rider has it. Only an order that has a rider can be picked up. */\n    void pickUp(String orderId) {\n        Order o = need(orderId);\n        if (o.partnerId() == null) throw new IllegalStateException(orderId + \" has no rider yet, so nobody can pick it up\");\n        transition(o, OrderState.PICKED_UP);\n    }\n\n    /**\n     * The food is ready: commit the state, then look for a rider, outside the order's lock. If nobody is free\n     * the order joins the queue FIRST and only then looks again -- a rider freed in the gap between a failed\n     * claim and the enqueue would otherwise be missed, and the order would sit there with a rider idle.\n     */\n    boolean markReady(String orderId) {\n        Order o = need(orderId);\n        transition(o, OrderState.READY);\n        if (!tryAssign(o)) waitingForRider.addLast(o.id());   // nobody free is a normal outcome, not an exception\n        drainWaiting();                       // ...and look again: a rider may have come free in the gap\n        return o.partnerId() != null;\n    }\n\n    /**\n     * Ask the rule for candidates, then take the first one the compare-and-set gives us. Losing the CAS is\n     * expected: the ranking was a snapshot, and the winner is decided by claim(), not by the ranking. Then the\n     * second claim, on the order. Returns false only if no rider could be claimed; true means the order is\n     * settled: it has this rider, or it had another or was cancelled, and this one went straight back.\n     */\n    private boolean tryAssign(Order o) {\n        Restaurant r = restaurants.get(o.restaurantId());\n        for (int attempt = 0; attempt < 3; attempt++) {\n            List<DeliveryPartner> free = new ArrayList<>();\n            for (DeliveryPartner p : partners.values()) if (p.isAvailable()) free.add(p);\n            List<String> ranked = assignment.rank(free, r.at());\n            if (ranked.isEmpty()) return false;\n            for (String id : ranked) {\n                DeliveryPartner p = partners.get(id);\n                if (p != null && p.claim(o.id())) {\n                    if (!o.takePartner(id)) { p.release(); return true; }   // the caller drains: he is free again\n                    publish(o, o.state());\n                    return true;\n                }\n            }\n        }\n        return false;\n    }\n\n    /** Delivered: the terminal happy path. The rider is handed back and the waiting queue is drained. */\n    void deliver(String orderId) {\n        Order o = need(orderId);\n        transition(o, OrderState.DELIVERED);\n        restaurants.get(o.restaurantId()).dequeue(orderId);\n        handBack(o);\n    }\n\n    /** The restaurant refuses the order: the food goes back on the shelf, then the whole bill is refunded. */\n    Refund reject(String orderId) {\n        Order o = need(orderId);\n        transition(o, OrderState.REJECTED);\n        restaurants.get(o.restaurantId()).giveBack(o.lines());\n        restaurants.get(o.restaurantId()).dequeue(orderId);\n        handBack(o);                                           // our own state first: none of it can fail\n        refund(o, o.bill().total());                           // then the money, which can\n        return new Refund(o.bill().total(), 0);\n    }\n\n    /**\n     * The customer (or the restaurant) cancels. The refund is decided by the injected policy, inside the lock,\n     * from the state it is cancelling out of. Then the food, the queue and the rider are handed back, and the\n     * refund goes last, because it is the only step that can fail.\n     */\n    Refund cancel(String orderId) {\n        Order o = need(orderId);\n        OrderState from;\n        long refund;\n        o.lock();\n        try {\n            from = o.state();\n            if (!from.canGoTo(OrderState.CANCELLED))\n                throw new IllegalStateException(orderId + \" is \" + from + \": too late to cancel\");\n            refund = cancellation.refundPaise(o, from, clock.nowMs());\n            o.moveTo(OrderState.CANCELLED, clock.nowMs());\n        } finally { o.unlock(); }\n\n        if (from == OrderState.PLACED || from == OrderState.ACCEPTED)\n            restaurants.get(o.restaurantId()).giveBack(o.lines());      // not cooked yet: the food goes back\n        restaurants.get(o.restaurantId()).dequeue(orderId);\n        handBack(o);\n        refund(o, refund);\n        publish(o, from);\n        return new Refund(refund, o.bill().total() - refund);\n    }\n\n    /**\n     * Send money back, written down first exactly like a charge: REFUND_OWED before the call, REFUNDED after.\n     * If the gateway throws, the row stays owed and the sweep sends it later; the cancel has already happened.\n     */\n    private void refund(Order o, long paise) {\n        if (paise <= 0) return;                                          // a zero refund is not a gateway call\n        chargeLog.record(o.chargeId(), o.customerId(), paise, ChargeOutcome.REFUND_OWED);\n        try {\n            payments.refund(o.chargeId(), paise);\n            chargeLog.record(o.chargeId(), o.customerId(), paise, ChargeOutcome.REFUNDED);\n        } catch (RuntimeException gatewayDown) {\n            System.out.println(\"   [warn] refund for \" + o.id() + \" is owed; the sweep will send it\");\n        }\n    }\n\n    /** The guarded read-check-write. The only way an order's state ever changes. */\n    private OrderState transition(Order o, OrderState to) {\n        OrderState from;\n        o.lock();\n        try {\n            from = o.state();\n            if (!from.canGoTo(to))\n                throw new IllegalStateException(o.id() + \": \" + from + \" -> \" + to + \" is not a legal move\"\n                                             + \" (legal: \" + from.next() + \")\");\n            o.moveTo(to, clock.nowMs());\n        } finally { o.unlock(); }\n        publish(o, from);                                   // AFTER the unlock\n        return from;\n    }\n\n    /** Give the rider back and give the next waiting order a chance. Missing this leaks one rider per delivery. */\n    private void handBack(Order o) {\n        String pid = o.partnerId();\n        if (pid == null) return;\n        DeliveryPartner p = partners.get(pid);\n        if (p != null) p.release();\n        o.clearPartner();\n        drainWaiting();\n    }\n\n    /**\n     * Match waiting orders with free riders, oldest first, until riders or orders run out. Every event that\n     * adds to either side -- an order becomes ready, a rider is handed back or logs in -- ends here. A waiting\n     * order is NOT taken out of the queue while we try: if it were, a hand-back running at the same instant\n     * would look at an empty queue and walk away, and the order would wait for a rider who is standing there.\n     */\n    private void drainWaiting() {\n        for (String id; (id = waitingForRider.peekFirst()) != null; ) {\n            Order w = orders.get(id);\n            if (w != null && w.state() == OrderState.READY && w.partnerId() == null && !tryAssign(w))\n                return;                                      // nobody free: everyone behind him waits too\n            waitingForRider.remove(id);                      // he has a rider, or no longer needs one: next\n        }\n    }\n\n    /** Tell everyone who is listening. A listener that throws is logged and skipped; the order is already safe. */\n    private void publish(Order o, OrderState from) {\n        for (OrderObserver ob : observers) {\n            try { ob.onState(o, from); }\n            catch (RuntimeException e) { System.out.println(\"   [warn] observer failed: \" + e.getMessage()); }\n        }\n    }\n\n    private Order need(String orderId) {\n        Order o = orders.get(orderId);\n        if (o == null) throw new IllegalArgumentException(\"no such order: \" + orderId);\n        return o;\n    }\n}\n\n/** A demo of one lunch order end to end, then the two races this design exists to survive. */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        FakeGateway gateway = new FakeGateway();\n        OrderService svc = new OrderService();\n        svc.configure(\n            List.of(new ItemTotal(),\n                    new DistanceFee(Money.rupees(\"20.00\"), Money.rupees(\"8.00\")),\n                    new SurgeFee(15_000),                                        // 1.5x on the fee when busy\n                    new CappedDiscount(new PercentCoupon(\"TASTY40\", 4000), Money.rupees(\"120.00\")),\n                    new FlatCoupon(\"NEWUSER\", Money.rupees(\"50.00\"))),\n            new NearestFree(), new StandardCancellation(Money.rupees(\"50.00\")), gateway);\n        svc.setDemand((r, t) -> true);                                           // it is raining\n        svc.addObserver(new CustomerApp(false));\n\n        Restaurant truffles = new Restaurant(\"r-kora\", \"Truffles Koramangala\", new Geo(12.9352, 77.6245), 18);\n        truffles.put(new MenuItem(\"paneer\", \"Paneer Tikka\", Money.rupees(\"249.00\")), 3);\n        truffles.put(new MenuItem(\"naan\",   \"Butter Naan\",  Money.rupees(\"60.00\")), 40);\n        truffles.put(new MenuItem(\"biryani\",\"Chicken Biryani\", Money.rupees(\"320.00\")), 25);\n        svc.register(truffles);\n        for (int i = 0; i < 4; i++) svc.register(new DeliveryPartner(\"p-\" + (10 + i), new Geo(12.9352 + i * 0.004, 77.6260)));\n\n        // ---------------- one order, end to end\n        Geo home = new Geo(12.9352, 77.6495);                                    // 2.7 km away, billed as 3\n        svc.openCart(\"anita\", \"r-kora\", home);\n        svc.addToCart(\"anita\", \"r-kora\", \"paneer\", 2);\n        svc.addToCart(\"anita\", \"r-kora\", \"naan\", 1);\n        Order o = svc.placeOrder(\"tap-1\", \"anita\", List.of(\"TASTY40\"));\n        System.out.println(\"placed \" + o.id() + \"  \" + o.bill());\n        System.out.println(\"   paneer left after the reservation: \" + truffles.stockOf(\"paneer\"));\n        svc.accept(o.id());\n        svc.startPreparing(o.id());\n        svc.markReady(o.id());\n        System.out.println(\"   rider \" + o.partnerId() + \" has it\");\n        svc.pickUp(o.id());\n        svc.deliver(o.id());\n        System.out.println(\"   final state \" + o.state() + \", rider back in the pool: \"\n            + (svc.partner(\"p-10\").isAvailable() || svc.partner(\"p-11\").isAvailable()));\n\n        // ---------------- a retried tap is the same order and one charge\n        int before = gateway.chargeCount();\n        Order again = svc.placeOrder(\"tap-1\", \"anita\", List.of(\"TASTY40\"));\n        System.out.println(\"retried tap-1 -> \" + again.id() + \" (same order: \" + (again == o)\n            + \", extra charges: \" + (gateway.chargeCount() - before) + \")\");\n\n        // ---------------- a declined card leaves nothing behind\n        gateway.declineContaining(\"ch-\");                                        // every card fails now\n        svc.openCart(\"bala\", \"r-kora\", home);\n        svc.addToCart(\"bala\", \"r-kora\", \"biryani\", 1);\n        int biryaniBefore = truffles.stockOf(\"biryani\");\n        try { svc.placeOrder(\"tap-2\", \"bala\", List.of()); }\n        catch (IllegalStateException e) { System.out.println(\"expected: \" + e.getMessage()); }\n        System.out.println(\"   biryani stock after the decline: \" + truffles.stockOf(\"biryani\")\n            + \" (was \" + biryaniBefore + \")\");\n\n        // ---------------- the last portions: thirty phones, ten portions, two each\n        Restaurant rush = new Restaurant(\"r-rush\", \"Meghana Lunch\", new Geo(12.9352, 77.6245), 15);\n        rush.put(new MenuItem(\"thali\", \"Andhra Thali\", Money.rupees(\"300.00\")), 10);\n        svc.register(rush);\n        FakeGateway clean = new FakeGateway();\n        svc.configure(List.of(new ItemTotal(), new DistanceFee(Money.rupees(\"20.00\"), Money.rupees(\"8.00\"))),\n                      new NearestFree(), new StandardCancellation(Money.rupees(\"50.00\")), clean);\n        int phones = 30;\n        ExecutorService pool = Executors.newFixedThreadPool(12);\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<Boolean>> tries = new ArrayList<>();\n        for (int i = 0; i < phones; i++) {\n            final String who = \"c\" + i;\n            svc.openCart(who, \"r-rush\", home);\n            svc.addToCart(who, \"r-rush\", \"thali\", 2);\n            tries.add(pool.submit(() -> {\n                go.await();\n                try { svc.placeOrder(\"k-\" + who, who, List.of()); return true; }\n                catch (RuntimeException e) { return false; }\n            }));\n        }\n        go.countDown();\n        int won = 0;\n        for (Future<Boolean> f : tries) if (f.get()) won++;\n        System.out.println(phones + \" phones raced for 10 thalis at 2 each: winners=\" + won\n            + \" stock left=\" + rush.stockOf(\"thali\") + \" charges=\" + clean.chargeCount() + \" (must be 5, 0, 5)\");\n        if (won != 5 || rush.stockOf(\"thali\") != 0 || clean.chargeCount() != 5)\n            throw new AssertionError(\"the last-portion race lost or double-sold an item\");\n\n        // ---------------- forty ready orders, twelve riders: nobody is double-booked\n        OrderService fleet = new OrderService();\n        FakeGateway fg = new FakeGateway();\n        fleet.configure(List.of(new ItemTotal()), new NearestFree(), new StandardCancellation(0), fg);\n        Restaurant big = new Restaurant(\"r-big\", \"Empire\", new Geo(12.93, 77.62), 12);\n        big.put(new MenuItem(\"roll\", \"Kathi Roll\", Money.rupees(\"150.00\")), 500);\n        fleet.register(big);\n        for (int i = 0; i < 12; i++) fleet.register(new DeliveryPartner(\"f-\" + i, new Geo(12.93 + i * 0.001, 77.62)));\n        List<Order> ready = new ArrayList<>();\n        for (int i = 0; i < 40; i++) {\n            fleet.openCart(\"d\" + i, \"r-big\", home);\n            fleet.addToCart(\"d\" + i, \"r-big\", \"roll\", 1);\n            Order x = fleet.placeOrder(\"f-\" + i, \"d\" + i, List.of());\n            fleet.accept(x.id()); fleet.startPreparing(x.id());\n            ready.add(x);\n        }\n        CountDownLatch go2 = new CountDownLatch(1);\n        List<Future<?>> readied = new ArrayList<>();\n        for (Order x : ready) readied.add(pool.submit(() -> { go2.await(); return fleet.markReady(x.id()); }));\n        go2.countDown();\n        for (Future<?> f : readied) f.get();\n        pool.shutdown();\n        Map<String, String> heldBy = new HashMap<>();\n        int assigned = 0, clashes = 0;\n        for (Order x : ready) {\n            if (x.partnerId() == null) continue;\n            assigned++;\n            String prev = heldBy.put(x.partnerId(), x.id());\n            if (prev != null) clashes++;\n        }\n        System.out.println(\"40 orders ready at once, 12 riders: assigned=\" + assigned + \" double-booked=\" + clashes\n            + \" waiting=\" + fleet.waitingCount() + \" (must be 12, 0, 28)\");\n        if (assigned != 12 || clashes != 0 || fleet.waitingCount() != 28)\n            throw new AssertionError(\"a rider was double-booked or an order was lost\");\n        String carried = heldBy.values().iterator().next();\n        fleet.pickUp(carried);\n        fleet.deliver(carried);\n        System.out.println(\"one delivery hands a rider back, and a waiting order takes him: waiting=\"\n            + fleet.waitingCount());\n    }\n}\n", "f1": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.function.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: eta -- how long until it arrives, from the state the order already has\n/**\n * \"Where is my order?\" answered as a number of minutes: what the kitchen still owes, plus the ride. It reads\n * the order's own timestamps and an injected clock, so it is a pure function of state and testable to the minute.\n */\nfinal class Eta {\n    private final Clock clock;\n    private final double kmPerHour;\n\n    Eta(Clock clock, double kmPerHour) { this.clock = clock; this.kmPerHour = kmPerHour; }\n\n    /** Minutes from now until this order lands. rider may be null (nobody assigned yet). */\n    long minutesFor(Order o, Restaurant r, DeliveryPartner rider) {\n        // the kitchen's clock starts when the kitchen starts, not when the customer paid: until then the\n        // whole prep time is still owed. That is what the PREPARING stamp on the order is for.\n        long startedAt = o.stamps().getOrDefault(OrderState.PREPARING, clock.nowMs());\n        long cooked = Math.max(0, (clock.nowMs() - startedAt) / 60_000);\n        long kitchen = switch (o.state()) {\n            case PLACED, ACCEPTED, PREPARING -> Math.max(0, r.prepMinutes() - cooked);\n            default -> 0;                                   // READY or later: the food exists\n        };\n        double km = o.state() == OrderState.PICKED_UP && rider != null\n                  ? rider.at().kmTo(o.dropAt())                              // already on the way\n                  : (rider == null ? 0 : rider.at().kmTo(r.at())) + r.at().kmTo(o.dropAt());\n        return kitchen + Math.round(km / kmPerHour * 60);\n    }\n}\n\n// ---- ext: multi-restaurant basket -- one tap, two kitchens, and the honest answer about the payment\n/**\n * One basket spanning two restaurants fans out into one order per restaurant, because stock, prep and the\n * rider all belong to a restaurant. There is no distributed transaction here: if the second order fails, the\n * first is cancelled, which refunds it. That compensation IS the answer -- say it rather than hiding it.\n */\nfinal class MultiRestaurantBasket {\n    private final Map<String, Map<String, Integer>> byRestaurant = new LinkedHashMap<>();\n\n    /** Add an item, tagged with the restaurant it came from. */\n    void add(String restaurantId, String itemId, int qty) {\n        byRestaurant.computeIfAbsent(restaurantId, k -> new LinkedHashMap<>()).merge(itemId, qty, Integer::sum);\n    }\n\n    /** Place one order per restaurant. Each key is derived from the tap, so a retry of the tap is still safe. */\n    List<Order> checkout(OrderService svc, String customerId, Geo dropAt, String tapKey, List<String> coupons) {\n        List<Order> placed = new ArrayList<>();\n        try {\n            for (Map.Entry<String, Map<String, Integer>> e : byRestaurant.entrySet()) {\n                Cart leg = new Cart(customerId, e.getKey(), dropAt);          // one cart per kitchen\n                e.getValue().forEach(leg::add);\n                placed.add(svc.placeOrder(tapKey + \"#\" + e.getKey(), leg, coupons));\n            }\n            return placed;\n        } catch (RuntimeException fail) {\n            for (Order done : placed) svc.cancel(done.id());      // compensate; each order refunds itself\n            throw fail;\n        }\n    }\n}\n\n// ---- ext: scheduled orders -- a booking released at \"serve at\" minus the prep time and the ride\n/**\n * A pre-order is not a new state: it is a booking that becomes an ordinary order later. The scheduler releases\n * it when the kitchen must start (serve time, minus the prep time, minus the ride), and the id it uses is\n * derived from the booking, so a tick that runs twice places it exactly once.\n */\nfinal class Scheduler {\n    /** What the customer booked and when they want to eat. */\n    record Booking(String id, String customerId, String restaurantId, Geo dropAt,\n                   Map<String, Integer> items, long serveAtMs) {}\n\n    private final List<Booking> pending = new ArrayList<>();\n    private final List<String> failed = new ArrayList<>();\n    private final double kmPerHour;\n\n    Scheduler(double kmPerHour) { this.kmPerHour = kmPerHour; }\n\n    synchronized void book(Booking b) { pending.add(b); }\n\n    /** Place every booking whose kitchen must start by now. Safe to call as often as you like. */\n    synchronized List<Order> tick(OrderService svc, long nowMs) {\n        List<Order> released = new ArrayList<>();\n        for (Iterator<Booking> it = pending.iterator(); it.hasNext(); ) {\n            Booking b = it.next();\n            Restaurant r = svc.restaurant(b.restaurantId());\n            long rideMs = Math.round(r.at().kmTo(b.dropAt()) / kmPerHour * 3_600_000);\n            long startBy = b.serveAtMs() - r.prepMinutes() * 60_000L - rideMs;\n            if (nowMs < startBy) continue;\n            Cart cart = new Cart(b.customerId(), b.restaurantId(), b.dropAt());   // its own cart, not hers\n            b.items().forEach(cart::add);\n            try { released.add(svc.placeOrder(\"booking:\" + b.id(), cart, List.of())); }\n            catch (RuntimeException e) { failed.add(b.id() + \": \" + e.getMessage()); }   // one bad booking\n            it.remove();                                                            // never blocks the rest\n        }\n        return released;\n    }\n\n    /** Bookings that could not be placed (sold out, card declined), for the customer to be told. */\n    synchronized List<String> failed() { return List.copyOf(failed); }\n}\n\n// ---- ext: pooling -- one rider, two drops: the boolean flip becomes a permit\n/**\n * Batching changes exactly one thing: a rider's free/busy flag was a single boolean, so a compare-and-set\n * fitted; with capacity it becomes a counter, so the same \"one indivisible claim\" is a Semaphore permit.\n * Everything else -- the ranking, the queue, the terminal release -- is untouched.\n */\nfinal class PooledPartner {\n    private final String id;\n    private final Semaphore seats;\n    private final Set<String> carrying = ConcurrentHashMap.newKeySet();\n\n    PooledPartner(String id, int capacity) { this.id = id; this.seats = new Semaphore(capacity); }\n\n    String id() { return id; }\n    /** Take one seat for this order, or fail. The atomic step, same role as DeliveryPartner.claim(). */\n    boolean claim(String orderId) {\n        if (!seats.tryAcquire()) return false;\n        carrying.add(orderId);\n        return true;\n    }\n    /** Give the seat back when that drop is done. */\n    void release(String orderId) {\n        if (carrying.remove(orderId)) seats.release();\n    }\n    /** Seats still free. A ranking rule prefers a rider already going your way with a seat left. */\n    int freeSeats() { return seats.availablePermits(); }\n    /** The orders on this trip. */\n    Set<String> carrying() { return Set.copyOf(carrying); }\n}\n\n// ---- ext: the rider says no -- an offer with a deadline, and a ranking that remembers\n/**\n * Push assignment lies a little: a reserved rider can still refuse or go silent. An offer holds him, asks, and\n * hands him straight back on a no or a timeout, then the search continues with the next candidate. The refusal\n * is recorded, and the ranking rule below pushes a flaky rider down the list instead of banning him.\n */\nfinal class OfferDesk {\n    /** How a rider answers an offer. In production this is a push notification and a reply with a deadline. */\n    interface Rider { boolean accepts(String orderId, long deadlineMs); }\n\n    private final Map<String, Integer> misses = new ConcurrentHashMap<>();\n\n    /**\n     * True if he took it. A yes attaches him with the order's own guarded claim, so an order cancelled or\n     * dispatched while he was deciding does not keep him. Otherwise he is released before this returns.\n     */\n    boolean offer(DeliveryPartner p, Order o, Rider rider, long deadlineMs) {\n        if (!p.claim(o.id())) return false;                     // somebody else got him first\n        boolean yes;\n        try { yes = rider.accepts(o.id(), deadlineMs); }\n        catch (RuntimeException e) { yes = false; }             // silence counts as a refusal\n        if (yes && o.takePartner(p.id())) return true;          // the same second claim the dispatcher uses\n        p.release();\n        if (!yes) misses.merge(p.id(), 1, Integer::sum);\n        return false;\n    }\n\n    /** How many offers this rider has turned down. */\n    int missesOf(String partnerId) { return misses.getOrDefault(partnerId, 0); }\n\n    /** Nearest first, but each refusal costs a rider half a kilometre of rank. A new class; nothing else moves. */\n    AssignmentRule ranking(double penaltyKmPerMiss) {\n        return (free, pickup) -> {\n            List<DeliveryPartner> sorted = new ArrayList<>(free);\n            sorted.sort(Comparator.comparingDouble(\n                p -> p.at().kmTo(pickup) + penaltyKmPerMiss * missesOf(p.id())));\n            List<String> ids = new ArrayList<>();\n            for (DeliveryPartner p : sorted) ids.add(p.id());\n            return ids;\n        };\n    }\n}\n\n// ---- ext: a new pricing rule -- membership, which waives the fee and the surge\n/**\n * The whole point of the pricing chain: a new commercial rule is a new class and one line in the list. It must\n * sit after the fee rules, because it discounts what they added.\n */\nfinal class MembershipWaiver implements PricingRule {\n    private final Set<String> members;\n    MembershipWaiver(Set<String> members) { this.members = members; }\n    public Bill apply(Bill running, PriceCtx ctx) {\n        if (!members.contains(ctx.customerId())) return running;\n        return running.addDiscount(running.delivery() + running.surge());\n    }\n}\n\n// ---- ext: ratings and search -- Flipkart's FoodKart: who delivers to my pincode, best rated or cheapest first\n/**\n * Restaurants are onboarded with the pincodes they deliver to. A customer rates a DELIVERED order from 1 to 5,\n * once, and a restaurant's rating is a running average kept as a sum and a count, so reading it is O(1).\n * \"What can I order here?\" lists the restaurants for that pincode that still have the dish, in the order asked.\n */\nfinal class Catalog {\n    /** One line of the answer: the restaurant, the dish at today's price, and the rating in tenths. */\n    record Listing(String restaurantId, String restaurant, MenuItem dish, int ratingTenths) {}\n\n    /** The sort orders are rules handed in, like pricing: add one without touching find(). */\n    static final Comparator<Listing> BEST_RATED = Comparator.comparingInt(Listing::ratingTenths).reversed();\n    static final Comparator<Listing> CHEAPEST = Comparator.comparingLong(l -> l.dish().pricePaise());\n\n    private final Map<String, Set<Restaurant>> byPincode = new ConcurrentHashMap<>();\n    private final Map<String, long[]> stars = new ConcurrentHashMap<>();       // restaurant id -> {sum, count}\n    private final Set<String> rated = ConcurrentHashMap.newKeySet();          // order ids already rated\n\n    /** List a restaurant under every pincode it delivers to. Calling it again moves its area. */\n    void onboard(Restaurant r, Set<String> pincodes) {\n        for (Set<Restaurant> listed : byPincode.values()) listed.remove(r);\n        for (String pin : pincodes) byPincode.computeIfAbsent(pin, k -> ConcurrentHashMap.newKeySet()).add(r);\n    }\n\n    /** Rate a delivered order, 1 to 5, once. The comment is stored beside it; the average needs only stars. */\n    void rate(Order o, int stars, String comment) {\n        if (o.state() != OrderState.DELIVERED) throw new IllegalStateException(\"only a delivered order can be rated\");\n        if (stars < 1 || stars > 5) throw new IllegalArgumentException(\"stars go from 1 to 5\");\n        if (!rated.add(o.id())) throw new IllegalStateException(o.id() + \" is already rated\");\n        this.stars.merge(o.restaurantId(), new long[] { stars, 1 }, (a, b) -> new long[] { a[0] + b[0], a[1] + b[1] });\n    }\n\n    /** The average in tenths of a star, rounded: 43 means 4.3. Integer maths, so no 4.2999. 0 = not rated yet. */\n    int ratingTenths(String restaurantId) {\n        long[] s = stars.get(restaurantId);\n        return s == null ? 0 : (int) ((s[0] * 10 + s[1] / 2) / s[1]);\n    }\n\n    /** Who delivers to this pincode and has this dish in stock right now, sorted. O(k log k) for k restaurants. */\n    List<Listing> find(String pincode, String itemId, Comparator<Listing> order) {\n        List<Listing> out = new ArrayList<>();\n        for (Restaurant r : byPincode.getOrDefault(pincode, Set.of())) {\n            if (r.stockOf(itemId) <= 0) continue;                  // it must deliver here AND have the dish\n            for (MenuItem m : r.menu())\n                if (m.id().equals(itemId)) out.add(new Listing(r.id(), r.name(), m, ratingTenths(r.id())));\n        }\n        out.sort(order);\n        return out;\n    }\n}\n\n// ---- ext: the system picks the kitchen -- Intuit's round: cheapest (or best rated) that has it all, never over capacity\n/**\n * The customer names dishes, not a restaurant. Rank a snapshot of the kitchens that have every dish (the\n * strategy is a Comparator: cheapest basket, or best rated), then try them in that order. A kitchen may cook\n * only so many items at once: a Semaphore of that many permits per kitchen, taken before the order is placed\n * and given back when the food leaves (PICKED_UP) or the order dies. The ranking guesses; the permit decides.\n */\nfinal class KitchenPicker implements OrderObserver {\n    private final Map<String, Semaphore> permits = new ConcurrentHashMap<>();\n    private final Map<String, Integer> cooking = new ConcurrentHashMap<>();   // order id -> permits it holds\n\n    /** How many items this kitchen can have cooking at once. */\n    void capacity(String restaurantId, int items) { permits.put(restaurantId, new Semaphore(items)); }\n\n    /** The default strategy: the cheapest basket first, at today's menu prices. */\n    static Comparator<Restaurant> cheapest(Map<String, Integer> dishes) {\n        return Comparator.comparingLong(r -> basketPaise(r, dishes));\n    }\n    /** The other strategy the round asks for: the best-rated kitchen first, from the catalog's running averages. */\n    static Comparator<Restaurant> bestRated(Catalog catalog) {\n        return Comparator.comparingInt((Restaurant r) -> catalog.ratingTenths(r.id())).reversed();\n    }\n\n    /** Place the order at the best kitchen that has room. Throws if every kitchen with all the dishes is full. */\n    Order place(OrderService svc, String tapKey, String customerId, Geo dropAt, Map<String, Integer> dishes,\n                List<Restaurant> kitchens, Comparator<Restaurant> strategy) {\n        int items = 0;\n        for (int q : dishes.values()) items += q;\n        List<Restaurant> ranked = new ArrayList<>();\n        for (Restaurant r : kitchens) if (hasAll(r, dishes)) ranked.add(r);\n        ranked.sort(strategy);\n        for (Restaurant r : ranked) {\n            Semaphore kitchen = permits.get(r.id());\n            if (kitchen == null || !kitchen.tryAcquire(items)) continue;     // full right now: the next one\n            Cart cart = new Cart(customerId, r.id(), dropAt);\n            dishes.forEach(cart::add);\n            try {\n                Order o = svc.placeOrder(tapKey + \"@\" + r.id(), cart, List.of());\n                cooking.put(o.id(), items);\n                if (o.state() == OrderState.PICKED_UP || o.state().isTerminal()) giveBack(o);   // died already\n                return o;\n            } catch (RuntimeException e) {\n                kitchen.release(items);                                        // nothing half-done\n                if (hasAll(r, dishes)) throw e;           // it still has the food: the card failed, so stop here\n            }                                             // it sold out in the gap: try the next kitchen\n        }\n        throw new IllegalStateException(\"every kitchen that has all of it is full right now\");\n    }\n\n    /** The food left the kitchen, or the order died: its permits go back, exactly once. */\n    public void onState(Order o, OrderState from) {\n        if (o.state() == OrderState.PICKED_UP || o.state().isTerminal()) giveBack(o);\n    }\n    private void giveBack(Order o) {\n        Integer n = cooking.remove(o.id());\n        if (n != null) permits.get(o.restaurantId()).release(n);\n    }\n\n    private static boolean hasAll(Restaurant r, Map<String, Integer> dishes) {\n        for (Map.Entry<String, Integer> d : dishes.entrySet()) if (r.stockOf(d.getKey()) < d.getValue()) return false;\n        return basketPaise(r, dishes) < Long.MAX_VALUE;\n    }\n    private static long basketPaise(Restaurant r, Map<String, Integer> dishes) {\n        long total = 0;\n        for (Map.Entry<String, Integer> d : dishes.entrySet()) {\n            MenuItem m = null;\n            for (MenuItem x : r.menu()) if (x.id().equals(d.getKey())) m = x;\n            if (m == null) return Long.MAX_VALUE;                              // not on this menu\n            total += m.pricePaise() * d.getValue();\n        }\n        return total;\n    }\n}\n\n// ---- ext: commands out of order -- Flipkart 2025: the input is shuffled; apply it in timestamp order\n/**\n * The round's input is a list of timestamped commands that arrive shuffled. Each line becomes a Command object\n * with its time; a heap (PriorityQueue) hands them back oldest first, ties in arrival order, and the clock the\n * service reads is moved to each command's time before it runs, so the order's stamps follow the timeline.\n */\nfinal class CommandReplay {\n    /** One line of input: when it happened, what it says, and what to run. seq breaks ties in arrival order. */\n    record Command(long atMs, long seq, String text, Runnable action) {}\n\n    /** A clock the replay moves. Hand it to the service with setClock, so every stamp is the command's time. */\n    static final class ManualClock implements Clock {\n        private volatile long now;\n        public long nowMs() { return now; }\n        void set(long atMs) { now = atMs; }\n    }\n\n    private final PriorityQueue<Command> pending =\n        new PriorityQueue<>(Comparator.comparingLong(Command::atMs).thenComparingLong(Command::seq));\n    private final ManualClock clock = new ManualClock();\n    private long arrived;\n\n    Clock clock() { return clock; }\n\n    /** Queue one command, in whatever order the input gives it. O(log n). */\n    void submit(long atMs, String text, Runnable action) { pending.add(new Command(atMs, arrived++, text, action)); }\n\n    /** Run everything oldest first. A command that fails is logged and the rest still run. */\n    List<String> runAll() {\n        List<String> log = new ArrayList<>();\n        for (Command c; (c = pending.poll()) != null; ) {\n            clock.set(c.atMs());\n            try { c.action().run(); log.add(c.atMs() + \" \" + c.text() + \": ok\"); }\n            catch (RuntimeException e) { log.add(c.atMs() + \" \" + c.text() + \": \" + e.getMessage()); }\n        }\n        return log;\n    }\n}\n\n// ---- ext: unknown payment -- the charge that timed out, and the sweep that finds the money again\n/**\n * The one outcome \"pay, then commit\" cannot rule out: the gateway takes the money and the answer never comes\n * back. Refusing to create the order is right -- but the customer has been charged and nothing points at his\n * money. The fix is a line of bookkeeping and a sweep: write the attempt down BEFORE the call, mark it\n * UNKNOWN when the call dies, and ask the gateway later what really happened.\n */\nfinal class ChargeBook implements ChargeLog {\n    /** One charge attempt, as the log knows it right now. */\n    record Attempt(String chargeId, String customerId, long paise, ChargeOutcome outcome) {}\n\n    private final Map<String, Attempt> byCharge = new ConcurrentHashMap<>();\n\n    public void record(String chargeId, String customerId, long paise, ChargeOutcome outcome) {\n        byCharge.put(chargeId, new Attempt(chargeId, customerId, paise, outcome));\n    }\n    /** The rows in one state: UNKNOWN charges and owed refunds are the only ones the reconciler looks at. */\n    List<Attempt> having(ChargeOutcome outcome) {\n        List<Attempt> out = new ArrayList<>();\n        for (Attempt a : byCharge.values()) if (a.outcome() == outcome) out.add(a);\n        return out;\n    }\n    /** What the log says about one charge, or null if it never heard of it. */\n    ChargeOutcome outcomeOf(String chargeId) {\n        Attempt a = byCharge.get(chargeId);\n        return a == null ? null : a.outcome();\n    }\n}\n\n/** What the gateway tells us, minutes later, when we ask what really happened to a charge. */\ninterface Settlement {\n    /** True if the money really did leave the customer. */\n    boolean wasCharged(String chargeId);\n}\n\n/**\n * The sweep. An UNKNOWN charge can never belong to an order -- the order is only built after a charge that\n * answered -- so if the money moved, it is an orphan and goes back. A refund still owed (the gateway failed\n * when the order was cancelled) is sent again. Writing the answer into the log is what makes the sweep\n * idempotent: run it twice and the customer is refunded once.\n */\nfinal class Reconciler {\n    private final ChargeBook book;\n    private final Settlement settlement;\n    private final PaymentProcessor payments;\n\n    Reconciler(ChargeBook book, Settlement settlement, PaymentProcessor payments) {\n        this.book = book; this.settlement = settlement; this.payments = payments;\n    }\n    /** Refund every orphan charge and every owed refund. Returns how many went out on this pass. Run on a timer. */\n    int sweep() {\n        int refunded = 0;\n        for (ChargeBook.Attempt a : book.having(ChargeOutcome.UNKNOWN)) {\n            if (settlement.wasCharged(a.chargeId())) {\n                payments.refund(a.chargeId(), a.paise());\n                book.record(a.chargeId(), a.customerId(), a.paise(), ChargeOutcome.REFUNDED);\n                refunded++;\n            } else {\n                book.record(a.chargeId(), a.customerId(), a.paise(), ChargeOutcome.DECLINED);\n            }\n        }\n        for (ChargeBook.Attempt a : book.having(ChargeOutcome.REFUND_OWED)) {\n            try { payments.refund(a.chargeId(), a.paise()); }\n            catch (RuntimeException stillDown) { continue; }             // still owed: the next pass tries again\n            book.record(a.chargeId(), a.customerId(), a.paise(), ChargeOutcome.REFUNDED);\n            refunded++;\n        }\n        return refunded;\n    }\n}\n\n// ---- ext: a gateway that dies -- the stand-in that makes the unknown outcome testable\n/** A gateway that captures the money and then dies before it can answer: the case UNKNOWN exists for. */\nfinal class TimeoutGateway implements PaymentProcessor {\n    private final Set<String> captured = ConcurrentHashMap.newKeySet();\n    private final AtomicInteger refunds = new AtomicInteger();\n    private volatile boolean dying = true;\n\n    /** Stop timing out and behave like an ordinary gateway again. */\n    void recover() { dying = false; }\n    public boolean charge(String chargeId, long paise) {\n        captured.add(chargeId);                                  // the money HAS moved...\n        if (dying) throw new RuntimeException(\"gateway timed out after capturing \" + chargeId);\n        return true;                                             // ...and this time we got to say so\n    }\n    public void refund(String chargeId, long paise) { captured.remove(chargeId); refunds.incrementAndGet(); }\n    /** The view a reconciler asks, minutes later. */\n    Settlement settlement() { return captured::contains; }\n    /** How many refunds it has issued, so a test can prove one orphan is refunded exactly once. */\n    int refundCount() { return refunds.get(); }\n}\n\n// ---- ext: live tracking -- high-frequency GPS, deliberately off the state path\n/**\n * The rider's position arrives a few times a second; an order changes state six times in an hour. Putting the\n * first through the state observers would drown them, so location gets its own topic per order. Nothing here\n * touches an order lock, which is why a slow map client cannot stall a transition.\n */\nfinal class LocationStream {\n    private final Map<String, List<Consumer<Geo>>> byOrder = new ConcurrentHashMap<>();\n\n    /** The customer's map subscribes to one order. */\n    void subscribe(String orderId, Consumer<Geo> sink) {\n        byOrder.computeIfAbsent(orderId, k -> new CopyOnWriteArrayList<>()).add(sink);\n    }\n    /** The rider app pushes a fix. A broken subscriber is skipped, exactly as on the state path. */\n    void push(String orderId, Geo w

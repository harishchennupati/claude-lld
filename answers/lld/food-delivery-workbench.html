<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design the ordering side of Swiggy. A customer fills a cart from one restaurant and checks out; the restaurant accepts it, cooks it and marks it ready; a delivery partner picks it up and drops it. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>A customer opens one restaurant, taps items into a cart and pays. The restaurant sees the order on a tablet, accepts it, cooks it and says it is ready. The platform then finds a free delivery partner, who picks it up and drops it at the customer&rsquo;s door, and the phone shows every step as it happens. Three different apps drive the same order: the customer&rsquo;s, the restaurant&rsquo;s and the rider&rsquo;s. None of them can be trusted to send a sensible step, so the order&rsquo;s life is written down as a set of legal moves. Two things are genuinely contended (wanted by two callers at the same instant): the last portion of a dish, and a free rider. Two customers can tap for the last portion in the same millisecond, and two ready orders can want the same rider. Everything else in this problem is bookkeeping &mdash; except the money, which has one case the others do not: a card charge can fail, and it can also simply not answer. The invariant (the rule that must hold at every instant, whatever the timing) to say out loud: a portion of food is sold once, and a rider carries one order. A payment that fails leaves the system exactly as it was; a payment that never answers leaves a written record instead of a guess.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that places an order, walks it to delivered and prints the bill. The interviewer is watching for, in this order: the questions you ask before typing (one restaurant per cart, and whether payment is in scope, are the first two); which classes exist and which one owns the stock, the state and the rider; checkout end to end; what happens when two phones want the last portion; where the rules that will change (the fee, the coupon, who gets dispatched) live, so a new one is a class and not an edit; and what the system looks like the instant the card is declined &mdash; and the instant the bank does not answer at all. Then the twists: surge, ETA, cancellations and refunds, a rider who says no, two drops on one trip, scheduled orders, ratings and search, the system choosing the restaurant, persistence.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 358\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"86\" y=\"55\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">place an order</text><g transform=\"translate(172 26)\"><rect width=\"242\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a cart, one restaurant</text><text x=\"121.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the items the customer tapped</text></g><path d=\"M414 52 H434\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(434 26)\"><rect width=\"242\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reserve under the lock</text><text x=\"121.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">live menu + stock, all or none</text></g><path d=\"M676 52 H696\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(696 26)\"><rect width=\"242\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">charge the card</text><text x=\"121.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">outside every lock, ~400 ms</text></g><path d=\"M938 52 H958\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(958 26)\"><rect width=\"242\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">only now, the order exists</text><text x=\"121.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">PLACED, and the kitchen is told</text></g><text x=\"86\" y=\"197\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">cook it, carry it</text><g transform=\"translate(172 168)\"><rect width=\"242\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ACCEPTED &rarr; PREPARING</text><text x=\"121.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the restaurant tablet drives it</text></g><path d=\"M414 194 H434\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(434 168)\"><rect width=\"242\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">READY: claim a rider</text><text x=\"121.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one compare-and-set, one winner</text></g><path d=\"M676 194 H696\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(696 168)\"><rect width=\"242\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PICKED_UP</text><text x=\"121.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">past this point, no cancelling</text></g><path d=\"M938 194 H958\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(958 168)\"><rect width=\"242\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"121.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DELIVERED</text><text x=\"121.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the rider goes back in the pool</text></g><path d=\"M555 78 V92\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M817 78 V92\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(295 92)\"><rect width=\"640\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"320.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refused: sold out, declined, or no answer from the bank at all</text><text x=\"320.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the food goes straight back, no order is created, and a charge nobody answered for is written down</text></g><path d=\"M293 226 V240\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M817 226 V240\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(175 240)\"><rect width=\"470\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"235.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the restaurant refuses it</text><text x=\"235.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the whole bill is refunded and the food goes back on the shelf</text></g><g transform=\"translate(675 240)\"><rect width=\"530\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"265.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the customer cancels</text><text x=\"265.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">free before the kitchen starts, a fee after that, never once the rider has it</text></g><text x=\"86\" y=\"310\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"172\" y=\"310\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment: where is my order?   what is on the restaurant&rsquo;s screen?   how many portions are left?</text><text x=\"615\" y=\"344\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">many phones check out of the same restaurant at the same instant: two of them must never get the same last portion, and money that moved must always be findable</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Does the customer pick the restaurant? One per cart, or a basket that spans several?</td><td>The customer picks; one restaurant per cart</td><td>The cart is bound when it is opened; a basket over several restaurants splits into one order each (moves 1, 12)</td></tr><tr><td>Is payment in scope, and what does the gateway say when it does not know?</td><td>In scope; the order exists after it; a timeout means &ldquo;unknown&rdquo;</td><td>The order of operations at checkout &mdash; reserve, pay, then commit &mdash; and the charge log that makes an unanswered charge findable (moves 6, 9)</td></tr><tr><td>Do items run out, or is the menu just on/off?</td><td>They run out: a stock count</td><td>The one real race, and where the lock goes (moves 4, 7)</td></tr><tr><td>Push assignment (we reserve a rider) or pull (riders accept offers)?</td><td>Push, one rider per order</td><td>A compare-and-set on the rider (CAS: one hardware step that changes it only if it is still what I read) instead of a pool lock (move 4); offers are a follow-up</td></tr><tr><td>Until when can a customer cancel, and who pays?</td><td>Free until cooking starts, then a flat fee</td><td>The transition table plus an injected refund policy (moves 3, 6)</td></tr><tr><td>How is money represented, and who decides the price?</td><td>Integer paise; the server, from the live menu</td><td><code>long</code> everywhere, prices copied into the order at checkout (moves 1, 5)</td></tr><tr><td>Live GPS on a map, or just the milestones?</td><td>Milestones now; GPS is a separate stream</td><td>Observers (listeners told after each change) for six events an hour, not for three fixes a second (moves 3, 12)</td></tr><tr><td>One process and in memory, or a database and many servers?</td><td>One process, in memory</td><td>No repository (the one class that talks to the database) yet; a follow-up adds one with a conditional UPDATE, which writes only if the row is still as it was read (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Browse one restaurant&rsquo;s menu; add items to a cart bound to that one restaurant (the menu and the stock are checked for real at checkout).</li>\n<li>Check out: price the basket at today&rsquo;s menu prices, take payment, place the order.</li>\n<li>Price = food + a distance fee + surge - coupons, with a cap on the coupon.</li>\n<li>The restaurant accepts or refuses it &mdash; a refusal refunds in full &mdash; then cooks it and marks it ready.</li>\n<li>A free rider is claimed for a ready order; if none is free the order waits its turn.</li>\n<li>Pick up and deliver, with every step pushed to the customer&rsquo;s phone.</li>\n<li>Cancel: free before the kitchen starts, a fee after that, impossible once the rider has it.</li>\n<li>Read at any time: the order&rsquo;s state, the restaurant&rsquo;s live queue, what is left in stock.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Many phones checking out at once: the last portion is sold exactly once, never twice.</li>\n<li>One rider per order and one order per rider, and the rider is handed back on every terminal path (delivered,\ncancelled or rejected: the end of the order&rsquo;s life).</li>\n<li>An order only ever takes a legal step; an illegal one throws rather than being written.</li>\n<li>Nothing half-done: a declined card leaves no order and the stock as it was. A charge the bank never answered\nfor, and a refund that failed, are written down and swept later, never guessed and never lost.</li>\n<li>Money is integer paise, never a double; the price is the server&rsquo;s, never the client&rsquo;s.</li>\n<li>Pricing, assignment and the cancellation policy are swappable without touching the flow.</li>\n<li>&ldquo;Where is my order?&rdquo; is one map lookup and a volatile read (a field every thread sees the latest\nvalue of, with no lock); in memory, one process (say it; a follow-up adds a database).</li></ul></div></div>\n<div class=\"move\"><h3>One lunch hour at Truffles Koramangala, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"268\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"134.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">12:31:02  Anita checks out</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">2 paneer + 1 naan = 558.00</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">44.00 fee + 22.00 surge - 120.00</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">card charged 504.00, then the order</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">paneer stock 3 &rarr; 1</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"268\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"134.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">12:31:03  Bala taps for 2 paneer</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">only 1 left: Anita reserved two</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">refused inside the restaurant&rsquo;s lock</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">his card is never touched at all</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"268\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"134.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">12:52:00  Anita cancels</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the paneer is already on the tawa</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">policy keeps 50.00, refunds 454.00</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">this stock does NOT go back</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"268\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"134.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">12:58:30  two orders go READY</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one rider is nearest to both</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one compare-and-set wins, one loses</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the loser waits 40 s and gets p-23</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> one restaurant per cart; money is integer paise and the price comes from the live menu, never from the client; the order is created only after the card is charged, and a declined card puts the food back; an item&rsquo;s stock is the thing two customers race for; a rider is claimed with one compare-and-set, then attached to the order under the order&rsquo;s own lock while it is still READY; every state change is checked against a table. Named as out of scope: live GPS, multi-restaurant baskets, scheduled orders, ratings and search, and persistence &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, BookMyShow, ride sharing) and the class diagram, the locks, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On this problem the moves earn their keep at move 4, because three different things are fought over (a dish's stock, an order, a rider) and each one needs a different tool.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 218\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"18\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"45\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a CUSTOMER fills a CART from one RESTAURANT; checkout makes an ORDER with LINES and a BILL; a RIDER carries it; PRICING and DISPATCH are rules</text><g transform=\"translate(15 108)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Restaurant</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">menu, stock, queue</text></g><path d=\"M107.5 62 V108\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(215 108)\"><rect width=\"170\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Cart</text><text x=\"85.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">lines, one restaurant</text></g><path d=\"M300.0 62 V108\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 108)\"><rect width=\"190\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Order</text><text x=\"95.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">lines, bill, state</text></g><path d=\"M495.0 62 V108\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(605 108)\"><rect width=\"205\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"102.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DeliveryPartner</text><text x=\"102.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one free/busy flag</text></g><path d=\"M707.5 62 V108\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(825 108)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Bill / OrderLine</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">frozen at checkout</text></g><path d=\"M917.5 62 V108\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1025 108)\"><rect width=\"190\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"95.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Pricing rule</text><text x=\"95.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M1120.0 62 V108\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"186\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own that changes, so it becomes a class.   dashed = a value frozen once, or a rule with no state at all</text><text x=\"615\" y=\"205\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a CUSTOMER is just an id: nothing about him moves, so storing the id means a change of name can never move money or food</text></svg></div><div class=\"move\"><p>The nouns are in the picture; the test that sorts them is whether the thing has state of its own that changes. A restaurant does (menu, stock, a queue of live orders) and so do a cart, an order and a rider. A bill and an order line do not: they are frozen the moment the card is charged. So they are records (Java's short form for a value that never changes), not classes with setters. That is what makes an order a receipt rather than a live document the restaurant can reprice. A pricing rule has no state at all, so it is an interface. And a customer, in this hour, is an id: nothing about him moves, so the order stores the id and a change of name can never move money.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 286\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 20)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check out a cart</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M325 42 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 20)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">OrderService  (owns the ORDER of operations)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M790 42 H850\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(850 20)\"><rect width=\"355\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">svc.placeOrder(key, customer, coupons)</text><text x=\"177.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(25 74)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take the last portion</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M325 96 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 74)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Restaurant  (owns menu, stock and its lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M790 96 H850\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(850 74)\"><rect width=\"355\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">restaurant.reserve(want)</text><text x=\"177.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(25 128)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">move the order on</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M325 150 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 128)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Order  (owns its state and its own lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M790 150 H850\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(850 128)\"><rect width=\"355\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">svc.accept / markReady / deliver</text><text x=\"177.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(25 182)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take a rider</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M325 204 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 182)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DeliveryPartner  (owns one free/busy flag)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M790 204 H850\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(850 182)\"><rect width=\"355\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">partner.claim(orderId)</text><text x=\"177.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"254\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb whose state is spread over several classes goes to the one that can see them all: that class becomes the orchestrator</text><text x=\"615\" y=\"273\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">notice there is no OrderManager doing pricing and dispatch and notification: each of those verbs found an owner of its own</text></svg></div><div class=\"move\"><p>Each verb goes to whoever owns the state it touches, and three of the four rows are mechanical. The top row is not: &ldquo;check out a cart&rdquo; touches the stock, the order, the rider <i>and</i> the card gateway. So it belongs to the only object that can see them all, <code>svc.placeOrder(...)</code>: the orchestrator (the class that decides the order of the steps and does none of them itself). Doing the other rows first is what stops it becoming a God class (one class that does everything). By the time you write it, pricing, dispatch and notification have each found an owner, and all that is left for the service is the <i>order</i> of operations.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 78)\"><rect width=\"250\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">OrderService</text><text x=\"125.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(...): handed all four</text></g><path d=\"M275 123 H320 V40 H360\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(360 18)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PricingRule</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">food, fee, surge, coupons</text></g><g transform=\"translate(720 18)\"><rect width=\"485\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"242.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ItemTotal / DistanceFee / SurgeFee / PercentCoupon</text><text x=\"242.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">classes that can be handed in</text></g><path d=\"M720 40 H650\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M275 123 H320 V96 H360\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(360 74)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AssignmentRule</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who should carry this</text></g><g transform=\"translate(720 74)\"><rect width=\"485\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"242.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">NearestFree, least-busy, pooled, penalise-refusers</text><text x=\"242.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">classes that can be handed in</text></g><path d=\"M720 96 H650\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M275 123 H320 V152 H360\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(360 130)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CancellationPolicy</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what comes back, by state</text></g><g transform=\"translate(720 130)\"><rect width=\"485\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"242.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">free until PREPARING, then a flat fee</text><text x=\"242.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">classes that can be handed in</text></g><path d=\"M720 152 H650\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M275 123 H320 V208 H360\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(360 186)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">OrderObserver</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the phone, the tablet, analytics</text></g><g transform=\"translate(720 186)\"><rect width=\"485\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"242.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CustomerApp, a dashboard, a lateness alarm, a lambda</text><text x=\"242.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">classes that can be handed in</text></g><path d=\"M720 208 H650\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"258\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed = handed in. The service never builds a rule, so a new fee or a new dispatcher is a new class plus one line in a list</text><text x=\"615\" y=\"277\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and two rules WRAP other rules: CappedDiscount(coupon, 120.00) caps whatever the coupon took off, and CheckedRule wraps every rule to refuse a bill whose parts do not add up</text></svg></div><div class=\"move\"><p>The fee will change, the surge will change, the coupon will change twice before the round is over, and who gets dispatched will change from nearest to least-busy to whoever is already going that way. Each becomes a one-method interface the service is <i>given</i> in <code>configure()</code> and never builds. This is where the patterns come from, not the other way round. A swappable rule behind an interface is <b>Strategy</b>. A list of them applied in order, each handed the bill the last one left, is a <b>Chain</b>. A rule that wraps another rule is <b>Decorator</b>, which here does two jobs worth naming. <code>CappedDiscount(coupon, 120.00)</code> caps whatever the coupon took off, so &ldquo;40% off, up to 120&rdquo; is a wrapper rather than a clause inside every coupon ever written. <code>CheckedRule</code> wraps <i>every</i> rule the service is handed and refuses a bill whose parts do not add up to its total. So a rule written next year cannot charge a customer a number nobody can explain. The phone, the tablet and analytics only want to hear that an order moved: each is an <b>Observer</b>, told after the lock is released. I do the patterns; I do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner, and the tool follows the shape of the state.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 288\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 26)\"><rect width=\"185\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Anita's phone</text><text x=\"92.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads paneer: 3 left</text></g><g transform=\"translate(25 104)\"><rect width=\"185\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Bala's phone</text><text x=\"92.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads paneer: 3 left</text></g><g transform=\"translate(320 66)\"><rect width=\"175\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">paneer stock</text><text x=\"87.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">3</text></g><path d=\"M210 48 H320 V66\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M210 126 H320 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"265\" y=\"36\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"265\" y=\"156\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"530\" y=\"18\" width=\"290\" height=\"140\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"675\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"675\" y=\"66\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both see 3, both take 2</text><text x=\"675\" y=\"86\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">four portions sold from three</text><text x=\"675\" y=\"128\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: check and decrement as ONE step</text><g transform=\"translate(855 40)\"><rect width=\"350\" height=\"96\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"42.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Restaurant.lock</text><text x=\"175.0\" y=\"58.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">check every line, then take the stock down</text></g><text x=\"1030\" y=\"156\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one lock per RESTAURANT, because the stock is per restaurant</text><rect x=\"25\" y=\"182\" width=\"1180\" height=\"92\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"204\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the same question for the rest of the shared state, and the tool follows the shape of the state</text><text x=\"615\" y=\"226\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">an ORDER&rsquo;s state and its rider field: checked against each other, so both sit under one small lock per order</text><text x=\"615\" y=\"246\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">a RIDER&rsquo;s free/busy flag: ONE field with two values, so a single compareAndSet and no lock at all</text><text x=\"615\" y=\"266\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">four pieces of contended state, three owners; nothing is guarded by a global lock that everybody in the city has to queue behind</text></svg></div><div class=\"move\"><p>Two phones check out the last three portions of paneer, two each. Both read three, both decide there is enough, both write: four portions sold from three, and nobody notices until the kitchen does. So reading the stock and writing it must be one step, in the class that owns it: the restaurant, with its own lock. The lock is per <i>restaurant</i>, not per application, so eight thousand kitchens check out in parallel and never wait for each other. Then ask the same question of the other contended state, and notice the answer is not automatically a lock. An order's state is a read-check-write of one field against a table, so it gets its own small lock, one per order. A rider's free/busy flag is a <i>single field</i> with two values, and for that a compare-and-set is enough. The winner of the compare-and-set has him, the loser tries the next candidate, and no lock is taken at all. One more field is contended and it is easy to miss: the order's own <code>partnerId</code>. Two dispatchers can look at the same waiting order at the same instant (two riders finished two deliveries in the same millisecond), and each can win a <i>different</i> rider. The customer can also cancel at that instant. So taking a rider is two indivisible claims: a compare-and-set on the rider, then a check-and-write under the order's own lock, which succeeds only while the order is READY and has no rider. Whoever loses the second claim hands his rider straight back and moves on to the next waiting order. Four pieces of shared state, three owners, and nothing guarded by a global lock the whole city queues behind.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 332\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 16)\"><rect width=\"380\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is this dish on the menu, and how many are left?</text></g><path d=\"M405 34 H455\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(455 16)\"><rect width=\"555\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"277.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;itemId, MenuItem&gt; + Map&lt;itemId, Integer&gt;</text></g><path d=\"M1010 34 H1055\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1055 16)\"><rect width=\"150\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(25 60)\"><rect width=\"380\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">where is my order?</text></g><path d=\"M405 78 H455\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(455 60)\"><rect width=\"555\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"277.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;orderId, Order&gt;, state is volatile</text></g><path d=\"M1010 78 H1055\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1055 60)\"><rect width=\"150\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), no lock</text></g><g transform=\"translate(25 104)\"><rect width=\"380\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is on the restaurant's screen?</text></g><path d=\"M405 122 H455\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(455 104)\"><rect width=\"555\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"277.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LinkedHashSet&lt;orderId&gt;, arrival order</text></g><path d=\"M1010 122 H1055\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1055 104)\"><rect width=\"150\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) in and out</text></g><g transform=\"translate(25 148)\"><rect width=\"380\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">have I already placed this tap?</text></g><path d=\"M405 166 H455\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(455 148)\"><rect width=\"555\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"277.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;idempotencyKey, InFlight&gt;</text></g><path d=\"M1010 166 H1055\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1055 148)\"><rect width=\"150\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(25 192)\"><rect width=\"380\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which READY orders have no rider?</text></g><path d=\"M405 210 H455\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(455 192)\"><rect width=\"555\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"277.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ConcurrentLinkedDeque&lt;orderId&gt;</text></g><path d=\"M1010 210 H1055\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1055 192)\"><rect width=\"150\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(25 236)\"><rect width=\"380\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is this move legal?</text></g><path d=\"M405 254 H455\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(455 236)\"><rect width=\"555\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"277.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EnumMap&lt;OrderState, EnumSet&lt;OrderState&gt;&gt;</text></g><path d=\"M1010 254 H1055\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1055 236)\"><rect width=\"150\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><text x=\"615\" y=\"300\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the only scan left is &ldquo;who is free to ride?&rdquo;: every rider is looked at, O(n), and the free ones sorted by distance; a geo-index removes it</text><text x=\"615\" y=\"319\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">nothing here re-reads the order history to answer a question, which is the mistake that makes a real system slow exactly at lunchtime</text></svg></div><div class=\"move\"><p>Every row of the table is a question somebody actually asks, and the shape is chosen to answer <i>that</i> question in one step. Two are worth saying out loud. &ldquo;Where is my order?&rdquo; is asked far more often than anything is written, so it is a map lookup plus a volatile field and takes no lock at all. &ldquo;Is this move legal?&rdquo; is an <code>EnumMap</code> of <code>EnumSet</code>s, which is an array index and a bitmask. The transition table costs nothing, which is why there is no excuse for if-chains. The one scan left is &ldquo;who is free to ride?&rdquo;: it looks at every rider, O(n), and sorts the free ones by distance. At this scale that is honestly the right answer. The day the city has forty thousand riders, say that a geo-index removes the scan: it cuts the city into small cells (a quadtree, or Uber's H3), so only riders in nearby cells are looked at.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 424\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 22)\"><rect width=\"165\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PLACED</text></g><path d=\"M190 42 H215\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(215 22)\"><rect width=\"165\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ACCEPTED</text></g><path d=\"M380 42 H405\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(405 22)\"><rect width=\"165\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PREPARING</text></g><path d=\"M570 42 H595\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(595 22)\"><rect width=\"165\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">READY</text></g><path d=\"M760 42 H785\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(785 22)\"><rect width=\"165\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PICKED_UP</text></g><path d=\"M950 42 H985\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(985 22)\"><rect width=\"195\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DELIVERED</text></g><text x=\"690\" y=\"16\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">a rider is claimed here</text><g transform=\"translate(215 96)\"><rect width=\"165\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"82.5\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">REJECTED</text></g><g transform=\"translate(455 96)\"><rect width=\"230\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"115.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CANCELLED</text></g><path d=\"M107 62 V96 H215\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M297 62 V80 H470 V96\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M520 62 V96\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M677 62 V96 H685\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"945\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">PICKED_UP has exactly one successor: once it is on the road, nobody cancels</text><rect x=\"25\" y=\"166\" width=\"1180\" height=\"244\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"192\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order of operations at checkout, and why it is this order and no other</text><text x=\"40\" y=\"218\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1  claim the idempotency key -- a retried tap waits for the first attempt instead of paying twice</text><text x=\"40\" y=\"240\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2  take the RESTAURANT's lock: check every line against the live menu and stock, then take the stock down. All the lines or none</text><text x=\"40\" y=\"262\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3  release the lock and price it: the chain runs with no lock held, and a rule that throws has still committed nothing</text><text x=\"40\" y=\"284\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4  write the charge down as ATTEMPTED, then charge the card, outside every lock. Slow, irreversible, and until it answers there is no order</text><text x=\"40\" y=\"306\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5  no answer at all is not the same as 'no': mark that charge UNKNOWN, create nothing, and let a sweep ask the gateway later</text><text x=\"40\" y=\"328\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">6  the money moved, so only now build the Order, put it in the map and on the restaurant's screen, and clear the cart</text><text x=\"40\" y=\"350\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">7  and only then tell everybody: the observers run after the commit, never inside a lock</text><text x=\"40\" y=\"372\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a decline, a sold-out line or a broken pricing rule all take the same exit: the reservation is handed back and no order was ever created,</text><text x=\"40\" y=\"394\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">so the customer sees one clean error and can try another card. Note what is NOT here: the card is never charged while a lock is held.</text></svg></div><div class=\"move\"><p>Write the legal moves down as a table and two things become impossible to write: delivering something nobody picked up, and cancelling something already on the road. Three untrusted apps drive this object, so every mutation is a guarded read-check-write and never a setter. Then the harder half, which is the order of operations at checkout, and every line of it is there to make one failure harmless. Claim the idempotency key: an id the app sends with the tap, the same on every retry of that tap. A retried tap then waits for the first attempt instead of paying twice. Reserve the stock under the restaurant's lock, all the lines or none. Release the lock and price it. Charge the card, outside every lock, because it is slow and irreversible. And only when the money has moved does an <code>Order</code> object exist. A decline, a sold-out line or a broken pricing rule all take the same exit: the reservation is handed straight back and no order was ever created. The customer sees one clean error and can try another card. One answer is not like the others, and it is the one candidates forget: <i>no</i> answer. A gateway that times out may or may not have taken the money. So the attempt is written down <i>before</i> the call and marked UNKNOWN when the call dies. That row is the only thing left pointing at the customer's money, and a sweep (a job that runs every few minutes) asks the gateway about it later. A refund follows the same rule: it is written down as owed before it is sent, so a failed one is retried, never lost.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one restaurant's checkouts happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 312\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 18)\"><rect width=\"385\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"192.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the restaurant's lock: ~2 us</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">is the restaurant open? one read</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">k lines checked against two maps</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">k stock counters decremented</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">one insert into the live-order set</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">about ten hash operations in all</text></g><g transform=\"translate(430 18)\"><rect width=\"360\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the order's own lock: ~0.3 us</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">read the current state</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one EnumMap lookup: is the move legal?</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">write the state and one timestamp</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">or attach a rider: one check, one write</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">not in here: the rider's flag, a CAS (~20 ns)</text></g><g transform=\"translate(810 18)\"><rect width=\"395\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"197.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside every lock: ms to minutes</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the pricing chain: ~1 us, but still outside</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the card gateway: about 400 ms</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the push notification: about 40 ms</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the kitchen cooking: 18 minutes</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">the customer deciding: as long as he likes</text></g><text x=\"615\" y=\"196\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">twelve phones check out of the same restaurant in the same millisecond</text><g transform=\"translate(25 212)\"><rect width=\"88\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"44.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 1</text><text x=\"44.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(124 212)\"><rect width=\"88\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"44.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 2</text><text x=\

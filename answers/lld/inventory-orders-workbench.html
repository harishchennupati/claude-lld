00 times each, no deadlock, nothing lost&quot;);\n        StripedStock ten = new StripedStock();\n        ten.add(&quot;PEN&quot;, 10);\n        AtomicInteger stripedWins = new AtomicInteger();\n        race(100, k -&gt; { if (ten.reserveAll(List.of(new Line(&quot;PEN&quot;, 1, 0)))) stripedWins.incrementAndGet(); });\n        check(stripedWins.get() == 10 &amp;&amp; ten.available(&quot;PEN&quot;) == 0, &quot;per-SKU locks: a hundred buyers, ten pens, ten wins&quot;);\n        StripedStock one = new StripedStock();\n        one.add(&quot;PEN&quot;, 1);\n        check(!one.reserveAll(List.of(new Line(&quot;PEN&quot;, 1, 0), new Line(&quot;PEN&quot;, 1, 0))) &amp;&amp; one.available(&quot;PEN&quot;) == 1,\n              &quot;the same SKU on two lines is checked in total: one pen cannot fill 1 + 1&quot;);\n\n        StockTable table = new StockTable();\n        table.insert(&quot;PEN&quot;, 10); table.insert(&quot;MUG&quot;, 1);\n        AtomicInteger rows = new AtomicInteger();\n        race(50, k -&gt; { if (table.reserveRow(&quot;PEN&quot;, 1)) rows.incrementAndGet(); });\n        check(rows.get() == 10 &amp;&amp; table.available(&quot;PEN&quot;) == 0 &amp;&amp; table.reserved(&quot;PEN&quot;) == 10, &quot;conditional UPDATE: fifty callers, ten rows updated&quot;);\n        table.insert(&quot;PEN&quot;, 10);\n        check(!table.reserveAll(Map.of(&quot;PEN&quot;, 2, &quot;MUG&quot;, 2)) &amp;&amp; table.available(&quot;PEN&quot;) == 10, &quot;a short line rolls the earlier lines back&quot;);\n\n        SoldOutGate gate = new SoldOutGate(&quot;PEN&quot;, 10);\n        AtomicInteger entered = new AtomicInteger();\n        race(200, k -&gt; { if (gate.tryEnter()) entered.incrementAndGet(); });\n        gate.onEvent(new StoreEvent(&quot;EXPIRED&quot;, &quot;O1&quot;, &quot;u&quot;, List.of(new Line(&quot;PEN&quot;, 1, 20_00)), 20_00, 1));\n        check(entered.get() == 10 &amp;&amp; gate.left() == 1, &quot;the sold-out gate lets exactly ten in, and an expired order hands one ticket back&quot;);\n\n        List&lt;Line&gt; pens = List.of(new Line(&quot;PEN&quot;, 6, 20_00));\n        check(new BuyXGetY(new ListPrice(), &quot;PEN&quot;, 2, 1).price(pens).totalPaise() == 80_00, &quot;buy 2 get 1: six pens cost four&quot;);\n        PricingRule twice = new BestOf(List.of(new PercentOff(new ListPrice(), &quot;P20&quot;, 20, 1_000_00), new PercentOff(new ListPrice(), &quot;P20&quot;, 20, 1_000_00)));\n        check(twice.price(pens).totalPaise() == 96_00, &quot;the same code applied twice does not stack: 20% once&quot;);\n\n        SiteStock sites = new SiteStock();\n        sites.addSite(new Site(&quot;BLR-1&quot;, Set.of(&quot;560034&quot;), 1), Map.of(&quot;PEN&quot;, 2));\n        sites.addSite(new Site(&quot;BLR-2&quot;, Set.of(&quot;560034&quot;), 2), Map.of(&quot;PEN&quot;, 5, &quot;MUG&quot;, 1));\n        AllocationRule rule = new OneSiteElseSplit();\n        check(sites.reserve(Map.of(&quot;PEN&quot;, 1, &quot;MUG&quot;, 1), &quot;560034&quot;, rule).plan().equals(Map.of(&quot;BLR-2&quot;, Map.of(&quot;MUG&quot;, 1, &quot;PEN&quot;, 1))),\n              &quot;one parcel from the one site that has everything&quot;);\n        check(sites.reserve(Map.of(&quot;PEN&quot;, 5), &quot;560034&quot;, rule).plan().equals(Map.of(&quot;BLR-1&quot;, Map.of(&quot;PEN&quot;, 2), &quot;BLR-2&quot;, Map.of(&quot;PEN&quot;, 3))),\n              &quot;no site has five pens: split, nearest first&quot;);\n        check(&quot;insufficient product inventory&quot;.equals(sites.reserve(Map.of(&quot;PEN&quot;, 2), &quot;560034&quot;, rule).refusal())\n              &amp;&amp; &quot;pincode unserviceable&quot;.equals(sites.reserve(Map.of(&quot;PEN&quot;, 1), &quot;110001&quot;, rule).refusal()), &quot;short, and unserviceable, are refused by name&quot;);\n\n        FakeSeller seller = new FakeSeller(Map.of(&quot;SAREE&quot;, 2));\n        ExternalSellerStock external = new ExternalSellerStock(seller);\n        seller.timeoutAfterBlockOnce = true;\n        check(!external.reserve(&quot;O7&quot;, Map.of(&quot;SAREE&quot;, 1)) &amp;&amp; seller.available(&quot;SAREE&quot;) == 2, &quot;the seller blocked, then timed out: we release by order id&quot;);\n        check(external.reserve(&quot;O8&quot;, Map.of(&quot;SAREE&quot;, 2)) &amp;&amp; external.reserve(&quot;O8&quot;, Map.of(&quot;SAREE&quot;, 2)) &amp;&amp; seller.available(&quot;SAREE&quot;) == 0,\n              &quot;a retried reserve with the same order id blocks once&quot;);\n\n        long[] tb = { Main.at(10, 0) };\n        Store bs = store(tb, new FakeGateway());\n        Order lastKurtis = bs.createOrder(&quot;ravi&quot;, &quot;r&quot;, Map.of(&quot;KURTI&quot;, 3), null);\n        BackInStockAlerts alerts = new BackInStockAlerts(bs);\n        bs.addObserver(alerts);\n        alerts.watch(&quot;meera&quot;, &quot;KURTI&quot;);\n        tb[0] = Main.at(10, 5);\n        bs.getInventory(&quot;KURTI&quot;);\n        bs.updateInventory(&quot;KURTI&quot;, 1);\n        check(lastKurtis.status() == OrderStatus.EXPIRED &amp;&amp; alerts.sent.equals(List.of(&quot;meera: KURTI is back&quot;)), &quot;back in stock: told once, not again on the restock&quot;);\n\n        Store shop = Main.stocked();\n        LossyLink link = new LossyLink(shop, 2);\n        List&lt;Long&gt; waits = new ArrayList&lt;&gt;();\n        Order viaRetry = new RetryingClient(waits::add, new Random(1), 4, 100, 2_000)\n                .call(() -&gt; link.createOrder(&quot;asha&quot;, &quot;tap-9&quot;, Map.of(&quot;MUG&quot;, 2), null));\n        check(shop.orderHistory(&quot;asha&quot;).size() == 1 &amp;&amp; shop.stockOf(&quot;MUG&quot;).reserved() == 2 &amp;&amp; waits.size() == 2 &amp;&amp; viaRetry != null,\n              &quot;two lost replies, three calls, one order, two mugs blocked&quot;);\n        AtomicInteger calls = new AtomicInteger();\n        try {\n            new RetryingClient(waits::add, new Random(1), 4, 100, 2_000).call(() -&gt; { calls.incrementAndGet(); return shop.createOrder(&quot;ravi&quot;, &quot;x&quot;, Map.of(&quot;KURTI&quot;, 9), null); });\n            check(false, &quot;nine kurtis were ordered&quot;);\n        } catch (OrderRefused e) { check(calls.get() == 1, &quot;a refusal is not retried: out of stock will not fix itself&quot;); }\n\n        Coupon parsed = CouponFactory.fromConfig(&quot;SAVE10|PERCENT|10|10000|1|1000&quot;);\n        check(parsed.code().equals(&quot;SAVE10&quot;) &amp;&amp; parsed.discount().apply(new ListPrice()).price(List.of(new Line(&quot;KURTI&quot;, 1, 499_00))).totalPaise() == 449_10,\n              &quot;a coupon built from a config line prices like the hand-written one&quot;);\n\n        Platform platform = new Platform();\n        platform.store(&quot;acme&quot;).addProduct(&quot;PEN&quot;, &quot;Blue pen&quot;, 20_00, 1);\n        platform.store(&quot;zeta&quot;).addProduct(&quot;PEN&quot;, &quot;Red pen&quot;, 25_00, 5);\n        platform.store(&quot;acme&quot;).createOrder(&quot;u&quot;, &quot;k&quot;, Map.of(&quot;PEN&quot;, 1), null);\n        check(platform.store(&quot;acme&quot;).getInventory(&quot;PEN&quot;) == 0 &amp;&amp; platform.store(&quot;zeta&quot;).getInventory(&quot;PEN&quot;) == 5, &quot;two stores on one platform share nothing&quot;);\n\n        long[] ts = { Main.at(10, 0) };\n        Store quiet = store(ts, new FakeGateway());\n        quiet.createOrder(&quot;ravi&quot;, &quot;r&quot;, Map.of(&quot;KURTI&quot;, 1), null);\n        ts[0] = Main.at(10, 5);\n        try (HoldSweeper sweeper = new HoldSweeper(quiet, 10)) {\n            for (int i = 0; i &lt; 300 &amp;&amp; sweeper.ended.get() == 0; i++) Thread.sleep(10);\n            check(sweeper.ended.get() == 1, &quot;the background job ended the hold with no buyer calling&quot;);\n        }\n\n        System.out.println(failed == 0 ? &quot;ALL PASS&quot; : failed + &quot; FAILED&quot;);\n        if (failed &gt; 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design the inventory and order service for an e-commerce site like Meesho: sellers add stock, buyers fill a cart and check out with a coupon, and placing an order blocks the stock for five minutes until the payment confirms it or the block runs out. Thousands of buyers at once, and it must never oversell. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions; then type in the order of Main.java: the records (Product, Line, Quote), Stock with its three counts, Inventory with the all-or-nothing methods, Cart, the pricing rules (ListPrice and one wrapper), Coupon and CouponBook, OrderStatus with its table, Order, the gateway interface with a fake, and the store with its lock: <code>place</code> (check all, then write all), <code>confirmOrder</code> (lock, charge with no lock, lock and re-check), the sweep, <code>cancelOrder</code>; then a main with the race. If the clock runs out, the one thing that must exist is <code>createOrder</code> and <code>confirmOrder</code> under one lock, with every line checked before any is blocked and the payment before the commit.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Swiggy wants discounts: 10% off up to Rs 100, Rs 100 off above Rs 999, buy 2 get 1 free. Where does each go, and in what order?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Pricing is already an interface, so each discount is one small class that wraps the rule before it, and the store never opens. <code>BuyXGetY</code> takes the free units off one SKU. <code>PercentOff</code> takes a percentage of what is left, up to a cap. <code>FlatOff</code> takes a flat amount when the cart's subtotal reaches the minimum. The wrapping order is the applying order: item offers first, then the percentage, then flat amounts, and the total never goes below zero. A coupon's two limits are counted in the same locked step that blocks the stock, so fifty buyers racing for a ten-use code get exactly ten (test 8). If only the best of several codes may count (Flipkart's billing task), <code>BestOf</code> keeps the cheapest, so a code applied twice never stacks.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** A percentage off whatever the wrapped rule charges, with a cap: &quot;10% off, up to Rs 100&quot;. Rounded down to a paise. */\nfinal class PercentOff implements PricingRule {\n    private final PricingRule inner;\n    private final String label;\n    private final int percent;\n    private final long capPaise;\n\n    PercentOff(PricingRule inner, String label, int percent, long capPaise) {\n        if (percent &lt; 0 || percent &gt; 100) throw new IllegalArgumentException(percent + &quot;% off&quot;);\n        this.inner = inner; this.label = label; this.percent = percent; this.capPaise = capPaise;\n    }\n    /** The wrapped price, less percent of its total, never more than the cap. */\n    public Quote price(List&lt;Line&gt; lines) {\n        Quote q = inner.price(lines);\n        long off = Math.min(capPaise, q.totalPaise() * percent / 100);\n        return off &gt; 0 ? q.less(label, off) : q;\n    }\n}\n\n/**\n * A flat amount off when the cart&#x27;s value before any discount (the subtotal) reaches a minimum: &quot;Rs 100 off on\n * orders above Rs 999&quot;, the way Flipkart&#x27;s billing task states it.\n */\nfinal class FlatOff implements PricingRule {\n    private final PricingRule inner;\n    private final String label;\n    private final long offPaise, minCartPaise;\n\n    FlatOff(PricingRule inner, String label, long offPaise, long minCartPaise) {\n        this.inner = inner; this.label = label; this.offPaise = offPaise; this.minCartPaise = minCartPaise;\n    }\n    /** The wrapped price, less the flat amount when the subtotal is at least the minimum. */\n    public Quote price(List&lt;Line&gt; lines) {\n        Quote q = inner.price(lines);\n        return q.subtotalPaise() &gt;= minCartPaise ? q.less(label, offPaise) : q;\n    }\n}\n\n// ---- ext: buy X get Y --------------------------------------------------------------------------------\n/**\n * &quot;Buy two pens, get one free&quot;: for every x + y units of one SKU, y of them cost nothing. One more rule that\n * wraps the rule before it (Decorator), so the store and every other rule stay as they are.\n */\nfinal class BuyXGetY implements PricingRule {\n    private final PricingRule inner;\n    private final String sku;\n    private final int buy, free;\n\n    BuyXGetY(PricingRule inner, String sku, int buy, int free) {\n        if (buy &lt; 1 || free &lt; 1) throw new IllegalArgumentException(&quot;buy &quot; + buy + &quot; get &quot; + free);\n        this.inner = inner; this.sku = sku; this.buy = buy; this.free = free;\n    }\n    /** The wrapped price, less the free units: (qty / (buy + free)) x free x unit price. */\n    public Quote price(List&lt;Line&gt; lines) {\n        Quote q = inner.price(lines);\n        for (Line l : lines)\n            if (l.sku().equals(sku)) {\n                long off = (long) (l.qty() / (buy + free)) * free * l.unitPaise();\n                if (off &gt; 0) q = q.less(&quot;BUY&quot; + buy + &quot;GET&quot; + free + &quot; &quot; + sku, off);\n            }\n        return q;\n    }\n}\n\n/**\n * Several codes on one order, but only the best one counts (Flipkart&#x27;s billing task: &quot;if P10 and P20 are both\n * applied, only the highest is used&quot;). It prices the order with each candidate and keeps the cheapest, so\n * applying the same code twice can never stack.\n */\nfinal class BestOf implements PricingRule {\n    private final List&lt;PricingRule&gt; candidates;\n\n    BestOf(List&lt;PricingRule&gt; candidates) { this.candidates = List.copyOf(candidates); }\n    /** The candidate quote with the lowest total; the first one wins a tie. */\n    public Quote price(List&lt;Line&gt; lines) {\n        Quote best = null;\n        for (PricingRule r : candidates) {\n            Quote q = r.price(lines);\n            if (best == null || q.totalPaise() &lt; best.totalPaise()) best = q;\n        }\n        return best;\n    }\n}\n\n// the store&#x27;s offers, wrapped in the order they apply (innermost first):\nstore.configure(new FlatOff(new PercentOff(new BuyXGetY(new ListPrice(), &quot;PEN&quot;, 2, 1),\n        &quot;FESTIVE10&quot;, 10, 100_00), &quot;BIG100&quot;, 100_00, 999_00), bank, Store.HOLD_MS);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; A hundred buyers press Buy for the last ten pens at the same instant. Prove it cannot oversell, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading \"PEN has 1 left\" and writing \"PEN has 0\". <code>createOrder</code> does the check, the block and the new order inside one lock, so no other buyer can run in that gap. The proof is a test: a hundred threads wait on one latch, the latch opens, and every thread orders one pen. The test counts ten orders and ninety OUT_OF_STOCK refusals. PEN must end at available 0 and reserved 10: no unit lost, none sold twice. Then all ten winners pay at the same instant, and the bank must hold exactly ten pens' money.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. the race: a hundred buyers, ten pens\n        System.out.println(&quot;1. a hundred buyers press Buy for ten pens at the same instant&quot;);\n        long[] now = { Main.at(10, 0) };\n        FakeGateway bank = new FakeGateway();\n        Store sale = store(now, bank);\n        List&lt;Order&gt; won = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        AtomicInteger soldOut = new AtomicInteger(), other = new AtomicInteger();\n        race(100, k -&gt; {\n            try { won.add(sale.createOrder(&quot;buyer&quot; + k, &quot;k&quot;, Map.of(&quot;PEN&quot;, 1), null)); }\n            catch (OrderRefused e) { if (e.reason == Reason.OUT_OF_STOCK) soldOut.incrementAndGet(); else other.incrementAndGet(); }\n        });\n        StockView pen = sale.stockOf(&quot;PEN&quot;);\n        check(won.size() == 10, &quot;exactly ten orders were placed&quot;);\n        check(soldOut.get() == 90 &amp;&amp; other.get() == 0, &quot;the other ninety were told OUT_OF_STOCK, and nothing else went wrong&quot;);\n        check(pen.available() == 0 &amp;&amp; pen.reserved() == 10 &amp;&amp; pen.sold() == 0, &quot;PEN: available 0, reserved 10; never below zero&quot;);\n        check(won.stream().map(o -&gt; o.id).distinct().count() == 10, &quot;ten different order ids&quot;);\n        List&lt;PayResult&gt; results = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        List&lt;Order&gt; winners = List.copyOf(won);\n        race(winners.size(), k -&gt; results.add(sale.confirmOrder(winners.get(k).id)));\n        check(results.size() == 10 &amp;&amp; results.stream().allMatch(r -&gt; r == PayResult.CONFIRMED), &quot;all ten pay at the same instant: all confirmed&quot;);\n        check(sale.stockOf(&quot;PEN&quot;).equals(new StockView(0, 0, 10)), &quot;PEN: sold 10, reserved 0&quot;);\n        check(bank.heldPaise() == 10 * 20_00, &quot;the bank holds exactly ten pens&#x27; money, Rs 200&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; Meesho: 5 million products, 10 million users, a million orders a day. One lock for all of it?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>In one process, one lock is fine: an order holds it for about twelve microseconds, so even 1,200 orders a second keep it 1.4% busy. The real limit is elsewhere: ten million users need many machines, which is follow-up 13. Still, Meesho's interviewers expect the first rung: a lock per SKU, so buyers of different products never wait for each other. An order of several lines takes its SKUs' locks in SKU order, always the same order. Then {PEN, MUG} and {MUG, PEN} can never each hold one lock and wait for the other (a deadlock); the test runs both twenty thousand times. The price: orders, idempotency keys and coupon counts now need their own thread safety. Splitting by store (Harness's many shops) is free, because stores never share stock.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a lock per SKU -----------------------------------------------------------------------------\n/**\n * Rung one of the ladder: a lock per SKU instead of one lock for the store, so buyers of different products\n * never wait for each other (Meesho&#x27;s per-product locks). An order with several lines takes its SKUs&#x27; locks in\n * SKU order, always the same order, so two orders for {PEN, MUG} and {MUG, PEN} can never each hold one lock\n * and wait for the other (a deadlock). All or nothing still holds: check every line, then write every line,\n * while holding all of that order&#x27;s locks.\n */\nfinal class StripedStock {\n    private final Map&lt;String, Stock&gt; stock = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, ReentrantLock&gt; locks = new ConcurrentHashMap&lt;&gt;();\n\n    /** Add a SKU with its count. Setup only. */\n    void add(String sku, int qty) { stock.put(sku, new Stock(qty)); locks.put(sku, new ReentrantLock()); }\n    /** Available units of one SKU, under that SKU&#x27;s lock only. */\n    int available(String sku) {\n        ReentrantLock l = locks.get(sku);\n        l.lock();\n        try { return stock.get(sku).available(); } finally { l.unlock(); }\n    }\n    /** Block every line or none. The locks are taken in SKU order and given back in reverse. */\n    boolean reserveAll(List&lt;Line&gt; lines) {\n        Map&lt;String, Integer&gt; need = totals(lines);                   // a SKU named twice is checked once, in total\n        List&lt;ReentrantLock&gt; held = lockInOrder(need.keySet());\n        try {\n            for (Map.Entry&lt;String, Integer&gt; n : need.entrySet())       // check all, touch nothing\n                if (stock.get(n.getKey()).available() &lt; n.getValue()) return false;\n            need.forEach((sku, n) -&gt; stock.get(sku).reserve(n));       // then write all\n            return true;\n        } finally { unlock(held); }\n    }\n    /** Give every line&#x27;s block back. */\n    void releaseAll(List&lt;Line&gt; lines) {\n        Map&lt;String, Integer&gt; need = totals(lines);\n        List&lt;ReentrantLock&gt; held = lockInOrder(need.keySet());\n        try { need.forEach((sku, n) -&gt; stock.get(sku).release(n)); } finally { unlock(held); }\n    }\n    /** The three counts of a SKU. */\n    StockView view(String sku) {\n        ReentrantLock l = locks.get(sku);\n        l.lock();\n        try { return stock.get(sku).view(); } finally { l.unlock(); }\n    }\n    /** The quantity per SKU, sorted by SKU. */\n    private static Map&lt;String, Integer&gt; totals(List&lt;Line&gt; lines) {\n        Map&lt;String, Integer&gt; t = new TreeMap&lt;&gt;();\n        for (Line l : lines) t.merge(l.sku(), l.qty(), Integer::sum);\n        return t;\n    }\n    /** Take these SKUs&#x27; locks in sorted order: the one rule that makes a deadlock impossible. */\n    private List&lt;ReentrantLock&gt; lockInOrder(Set&lt;String&gt; sortedSkus) {\n        List&lt;ReentrantLock&gt; held = new ArrayList&lt;&gt;();\n        for (String sku : sortedSkus) { ReentrantLock l = locks.get(sku); l.lock(); held.add(l); }\n        return held;\n    }\n    /** Give the locks back, last taken first. */\n    private static void unlock(List&lt;ReentrantLock&gt; held) {\n        for (int i = held.size() - 1; i &gt;= 0; i--) held.get(i).unlock();\n    }\n}\n\n/**\n * Many stores on one platform (Harness&#x27;s &quot;design Shopify&quot;): each store has its own catalogue, stock and lock,\n * so two stores never wait for each other. Splitting by store is free, because stores never share stock.\n */\nfinal class Platform {\n    private final Map&lt;String, Store&gt; stores = new ConcurrentHashMap&lt;&gt;();\n\n    /** The store of one tenant, created on first use. */\n    Store store(String storeId) { return stores.computeIfAbsent(storeId, id -&gt; new Store()); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; The buyer never pays. The five-minute block must end on its own. Who ends it, and exactly when?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Every order goes into a priority queue ordered by the moment its hold ends. Every store method that reads stock, orders or coupons first runs <code>sweep</code>, which ends holds from the top of the queue until it meets one still running. Ending a hold gives the units and the coupon use back and marks the order EXPIRED. It also refunds by order id if a charge was sent, and tells the listeners after the unlock. A hold ends AT its end time: at 10:04:59.999 the kurtis are still held, at 10:05:00.000 they are for sale (test 3). No thread is needed for correct counts, because every read sweeps first. For a quiet store, <code>HoldSweeper</code> runs the same sweep every second and catches every exception, because a scheduled task that throws is never run again.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * End every hold whose time is up: pop the queue while its head has ended. An entry whose order was paid or\n     * cancelled meanwhile is simply skipped. A hold ends AT holdUntilMs: at 4:59.999 it is still held. O(log n)\n     * per order over its whole life, never a scan.\n     */\n    private int sweep(List&lt;Runnable&gt; after) {\n        long now = clock.nowMs();\n        int ended = 0;\n        while (!holds.isEmpty() &amp;&amp; holds.peek().holdUntilMs &lt;= now) {\n            Order o = holds.poll();\n            if (o.status() != OrderStatus.PENDING_PAYMENT) continue;\n            endUnpaid(o, OrderStatus.EXPIRED, after);\n            ended++;\n        }\n        return ended;\n    }\n\n    /**\n     * An unpaid order ends (EXPIRED or CANCELLED): its block and its coupon use are given back. If a charge was\n     * ever sent, a refund by order id is queued to that bank, which gives back money that might have moved and\n     * does nothing otherwise.\n     */\n    private void endUnpaid(Order o, OrderStatus end, List&lt;Runnable&gt; after) {\n        inventory.releaseAll(o.lines);\n        if (o.couponCode != null) coupons.giveBack(o.couponCode, o.userId);\n        o.moveTo(end);\n        if (o.chargedVia != null) refundLater(o, after);\n        announce(end.name(), o, after);\n    }\n\n// ---- ext: background sweeper -------------------------------------------------------------------------\n/**\n * Every store method already ends the holds that are due before it runs, so a busy store needs no thread for\n * it. A quiet store might go ten minutes without a call; this job calls sweepExpired every second so the stock\n * and the &quot;your order expired&quot; messages never wait for the next buyer. One daemon thread.\n */\nfinal class HoldSweeper implements AutoCloseable {\n    private final ScheduledExecutorService timer = Executors.newSingleThreadScheduledExecutor(r -&gt; {\n        Thread t = new Thread(r, &quot;hold-sweeper&quot;);\n        t.setDaemon(true);\n        return t;\n    });\n    final AtomicInteger ended = new AtomicInteger();\n\n    /** Start sweeping this store every periodMs. */\n    HoldSweeper(Store store, long periodMs) {\n        timer.scheduleWithFixedDelay(() -&gt; {\n            try { ended.addAndGet(store.sweepExpired()); }\n            catch (RuntimeException e) { System.err.println(&quot;[sweeper] &quot; + e.getMessage()); }   // a task that throws is never run again\n        }, periodMs, periodMs, TimeUnit.MILLISECONDS);\n    }\n    /** Stop the job. */\n    public void close() { timer.shutdownNow(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; The bank says yes after the hold has ended, or never answers. What happens to the stock and the money? Show me the code.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p><code>confirmOrder</code> sells nothing before the money moved, and re-checks after it moved. It charges with no lock held and the order id as the key, then takes the lock again. If the order is still pending and in time, reserved becomes sold; if the hold ran out or the buyer cancelled meanwhile, the money goes back (REFUNDED). A decline changes nothing, and the hold keeps running for another card. A timeout means nobody knows whether money moved, so the answer is UNKNOWN, and a retry is safe: the bank charges an order id at most once. If nobody retries, the expired order asks the bank it charged for a refund by order id, which does nothing if no money moved. A refund call that fails waits on a retry list; anything still unclear is settled by reconciliation (comparing the bank's daily settlement file with the orders).</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Pay for an order and, when the money arrives in time, sell its blocked stock (Meesho&#x27;s confirmOrder, which\n     * runs once payment succeeds). In three steps: under the lock, check there is something to pay for; with NO\n     * lock held, charge the bank, using the order id as the idempotency key; under the lock again, commit only if\n     * the order is still pending and its hold has not ended, and otherwise send the money back.\n     */\n    PayResult confirmOrder(String orderId) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        Order o;\n        PaymentGateway bank;\n        lock.lock();\n        try {\n            sweep(after);\n            o = find(orderId);\n            if (o.status() == OrderStatus.CONFIRMED || o.status() == OrderStatus.FULFILLED) return PayResult.CONFIRMED;\n            if (o.status() != OrderStatus.PENDING_PAYMENT) return PayResult.REFUSED;   // expired or cancelled: charge nothing\n            bank = gateway;\n            o.chargedVia = bank;                      // from now on, if this order dies unpaid, this bank refunds it by id\n        } finally { lock.unlock(); runAfter(after); }\n\n        boolean paid;\n        try { paid = bank.charge(o.id, o.totalPaise()); }            // OUTSIDE the lock: a bank takes a second or two\n        catch (RuntimeException timeout) { return PayResult.UNKNOWN; }   // did money move? unknown: stays pending\n        if (!paid) return PayResult.DECLINED;                         // nothing moved; the hold keeps running\n\n        lock.lock();\n        try {\n            if (o.status() == OrderStatus.PENDING_PAYMENT &amp;&amp; clock.nowMs() &lt; o.holdUntilMs) {\n                inventory.commitAll(o.lines);                         // still ours and still in time: reserved -&gt; sold\n                o.moveTo(OrderStatus.CONFIRMED);\n                announce(&quot;CONFIRMED&quot;, o, after);\n                return PayResult.CONFIRMED;\n            }\n            if (o.status() == OrderStatus.CONFIRMED || o.status() == OrderStatus.FULFILLED)\n                return PayResult.CONFIRMED;                           // a racing call committed this same charge\n            if (o.status() == OrderStatus.PENDING_PAYMENT) endUnpaid(o, OrderStatus.EXPIRED, after);   // ran out meanwhile; queues the refund\n            else refundLater(o, after);                               // expired or cancelled by someone else meanwhile\n            return PayResult.REFUNDED;\n        } finally { lock.unlock(); runAfter(after); }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; The app times out and sends createOrder again, or he taps twice. Show the stock is blocked once. How should it retry?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The app makes an idempotency key when the buyer taps Place Order, and sends the same key with every retry. <code>createOrder</code> first looks up that buyer's key under the lock; if an order exists, it is returned as it is, and nothing is blocked again. Twenty copies of one request at the same instant make one order (test 7). Keys are kept per buyer, so two buyers can never collide on one. The client retries only what can succeed later: a timeout, never OUT_OF_STOCK. It waits a random time up to a ceiling that doubles each attempt (exponential backoff with full jitter), so a thousand phones do not retry in step. A real service keeps keys for a day or so, and Stripe rejects a key reused with a different request; this code returns the first order.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Place an order for these SKUs and quantities (Meesho&#x27;s createOrder, PhonePe&#x27;s createOrder): every line is\n     * blocked for the hold time, all or none. A retry with the same idempotency key returns the same order.\n     */\n    Order createOrder(String userId, String idempotencyKey, Map&lt;String, Integer&gt; wanted, String couponCode) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            sweep(after);\n            Order earlier = replay(userId, idempotencyKey);\n            if (earlier != null) return earlier;\n            return place(userId, idempotencyKey, wanted, couponCode, after);\n        } finally { lock.unlock(); runAfter(after); }\n    }\n\n/** The order an earlier call with this buyer&#x27;s idempotency key created, or null. */\n    private Order replay(String userId, String key) {\n        String id = byKey.getOrDefault(userId, Map.of()).get(key);\n        return id == null ? null : orders.get(id);\n    }\n\n// ---- ext: client retry -------------------------------------------------------------------------------\n/** The network lost the reply: the call may or may not have reached the store. The one error worth retrying. */\nfinal class NetworkTimeout extends RuntimeException {\n    NetworkTimeout(String message) { super(message); }\n}\n\n/** How a retry waits. Handed in, so a test does not sleep. */\ninterface Sleeper { void sleep(long ms) throws InterruptedException; }\n\n/**\n * The client side of &quot;the same order arrives twice&quot;: it retries only a timeout, never a refusal (out of\n * stock will not fix itself), waits longer each time with random jitter (full jitter: a random wait between 0\n * and base x 2^attempt, capped), so a thousand phones do not retry in step, and sends the SAME idempotency key\n * every time, so a retry of a call that did reach the store returns the order it already made.\n */\nfinal class RetryingClient {\n    private final Sleeper sleeper;\n    private final Random random;\n    private final int attempts;\n    private final long baseMs, capMs;\n\n    RetryingClient(Sleeper sleeper, Random random, int attempts, long baseMs, long capMs) {\n        this.sleeper = sleeper; this.random = random; this.attempts = attempts; this.baseMs = baseMs; this.capMs = capMs;\n    }\n    /** Call until it answers, a timeout at a time; a refusal or the last timeout goes to the caller. */\n    &lt;T&gt; T call(Supplier&lt;T&gt; request) throws InterruptedException {\n        for (int attempt = 0; ; attempt++) {\n            try { return request.get(); }\n            catch (NetworkTimeout t) {\n                if (attempt + 1 &gt;= attempts) throw t;\n                long ceiling = attempt &gt;= 30 ? capMs : Math.min(capMs, baseMs &lt;&lt; attempt);   // no overflow on a long run\n                sleeper.sleep((long) (random.nextDouble() * ceiling));\n            }\n        }\n    }\n}\n\n/** A network that loses the store&#x27;s reply the first n times: the call REACHES the store, the answer does not come back. */\nfinal class LossyLink {\n    private final Store store;\n    private int losses;\n\n    LossyLink(Store store, int losses) { this.store = store; this.losses = losses; }\n    /** createOrder through the link. */\n    synchronized Order createOrder(String userId, String key, Map&lt;String, Integer&gt; wanted, String coupon) {\n        Order o = store.createOrder(userId, key, wanted, coupon);\n        if (losses-- &gt; 0) throw new NetworkTimeout(&quot;reply lost for &quot; + o.id);\n        return o;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>7 &middot; Cancel an order before payment and after it. And only a confirmed order may be marked delivered.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The life cycle is a table in <code>OrderStatus</code>, so every rule in the question is a row, not an if. Cancelling a pending order releases its block and gives the coupon use back. Cancelling a confirmed order puts the sold units back on sale, gives the coupon use back, and refunds after the unlock. Cancelling twice changes nothing the second time, because a cancelled order has nothing left to undo. A delivered order cannot be cancelled: it comes back as a return, a different flow with a warehouse check. <code>fulfilOrder</code> on an unpaid order throws, because PENDING_PAYMENT to FULFILLED is not in the table (PhonePe's \"only confirmed orders can be fulfilled\").</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The life of an order. Which move is legal from which state is a table, not an if-chain: a new state is one\n * more row, and any move not in the table throws.\n */\nenum OrderStatus {\n    PENDING_PAYMENT, CONFIRMED, FULFILLED, CANCELLED, EXPIRED;\n\n    private static final Map&lt;OrderStatus, Set&lt;OrderStatus&gt;&gt; NEXT = new EnumMap&lt;&gt;(OrderStatus.class);\n    static {\n        NEXT.put(PENDING_PAYMENT, EnumSet.of(CONFIRMED, CANCELLED, EXPIRED));\n        NEXT.put(CONFIRMED, EnumSet.of(FULFILLED, CANCELLED));\n        NEXT.put(FULFILLED, EnumSet.noneOf(OrderStatus.class));     // delivered: a return is a different flow\n        NEXT.put(CANCELLED, EnumSet.noneOf(OrderStatus.class));\n        NEXT.put(EXPIRED, EnumSet.noneOf(OrderStatus.class));\n    }\n    /** True when the table allows this move. */\n    boolean canMoveTo(OrderStatus next) { return NEXT.get(this).contains(next); }\n}\n\n/**\n     * Cancel an order. Unpaid: its block is released. Paid but not delivered: its units go back on sale and the\n     * money is refunded after the unlock. Already cancelled or expired: nothing more happens. Delivered: refused,\n     * because goods that have reached the buyer come back as a return, not a cancel.\n     */\n    OrderStatus cancelOrder(String orderId) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            sweep(after);\n            Order o = find(orderId);\n            switch (o.status()) {\n                case PENDING_PAYMENT -&gt; endUnpaid(o, OrderStatus.CANCELLED, after);\n                case CONFIRMED -&gt; {\n                    inventory.putBackAll(o.lines);                    // sold -&gt; available\n                    if (o.couponCode != null) coupons.giveBack(o.couponCode, o.userId);\n                    o.moveTo(OrderStatus.CANCELLED);\n                    refundLater(o, after);\n                    announce(&quot;CANCELLED&quot;, o, after);\n                }\n                case FULFILLED -&gt; throw new IllegalStateException(orderId + &quot; was delivered: that is a return, not a cancel&quot;);\n                default -&gt; { }                                        // CANCELLED or EXPIRED: nothing left to undo\n            }\n            return o.status();\n        } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /** Mark a paid order delivered (PhonePe&#x27;s FULFILLED). Only a CONFIRMED order may move here. */\n    void fulfilOrder(String orderId) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            sweep(after);\n            Order o = find(orderId);\n            o.moveTo(OrderStatus.FULFILLED);\n            announce(&quot;FULFILLED&quot;, o, after);\n        } finally { lock.unlock(); runAfter(after); }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>8 &middot; getInventory is called 10,000 times a second, and the app shows order history. Are both O(1), and do they slow orders?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both are lookups. <code>getInventory</code> sweeps (usually one look at the top of the queue) and reads one count from a map: well under a microsecond of lock. Ten thousand reads a second therefore add about a millisecond of lock per second. It reads under the lock on purpose, so the three counts are never seen halfway through an order's writes. <code>orderHistory</code> is one map lookup plus a copy of that buyer's list. If reads ever crowded the lock, keep the available count where it can be read without the lock (a volatile field or an atomic), as the Meesho candidate did. A product page may then be a millisecond stale, but the order still decides under the lock, so it can never oversell.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** How many units of a SKU anyone may buy right now (Meesho&#x27;s getInventory). One lookup, after the sweep. */\n    int getInventory(String sku) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try { sweep(after); return inventory.stock(sku).available(); } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /** The three counts of a SKU, read together so they always add up. */\n    StockView stockOf(String sku) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try { sweep(after); return inventory.stock(sku).view(); } finally { lock.unlock(); runAfter(after); }\n    }\n\n/** A buyer&#x27;s orders, oldest first (the order history). O(1) to find, O(k) to copy k orders. */\n    List&lt;Order&gt; orderHistory(String userId) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try { sweep(after); return List.copyOf(history.getOrDefault(userId, List.of())); } finally { lock.unlock(); runAfter(after); }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>9 &middot; Should adding to the cart block the stock? And what if the price changes while it sits in the cart?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No: the cart is a wish list, and only placing the order blocks. If carts blocked stock, abandoned carts would hold units for hours, and the shop would look sold out. <code>addToCart</code> still checks that the product exists and is available right now, but that check is only advice. Two carts can hold the same last kurti, and checkout decides who gets it (test 14). The price is copied into each order line when the order is placed, so a later price change never alters an order. <code>cartTotal</code> runs the same pricing code as checkout, so the total he saw is the total he pays. A flash sale that blocks at add-to-cart for a few minutes is simply a shorter hold, the same code.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Put qty of a SKU in the buyer&#x27;s cart. It checks the product exists and that the cart would not ask for\n     * more than is available right now, but it blocks nothing: that check is advice, and checkout decides.\n     */\n    void addToCart(String userId, String sku, int qty) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            sweep(after);\n            if (qty &lt; 1) throw new OrderRefused(Reason.BAD_QUANTITY, qty + &quot; x &quot; + sku);\n            Stock s = inventory.stock(sku);\n            Cart cart = carts.computeIfAbsent(userId, u -&gt; new Cart());\n            if ((long) cart.qty(sku) + qty &gt; s.available())\n                throw new OrderRefused(Reason.OUT_OF_STOCK, sku + &quot;: only &quot; + s.available() + &quot; left&quot;);\n            cart.add(sku, qty);\n        } finally { lock.unlock(); runAfter(after); }\n    }\n\n/**\n * One line of an order: how many of which SKU, at the price it had when the order was placed. The price is\n * copied in, so a later price change never alters an order that already exists.\n */\nrecord Line(String sku, int qty, long unitPaise) {\n    /** What this line costs before any discount. */\n    long paise() { return qty * unitPaise; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Text the buyer on every order event, and tell buyers who are waiting for a sold-out kurti when it is back.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The store announces every order event and every restock after the unlock, with a try/catch per listener, so a broken SMS provider cannot break an order (test 10). An SMS is one listener, <code>BuyerSms</code>. The back-in-stock alert is another: buyers watch a SKU, and an event that gives units back makes it ask the store whether that SKU is available now. That call is safe because listeners run after the unlock, and the watch list is removed in one atomic step, so nobody is told twice. One catch: two threads can deliver one order's events in the wrong order. Every event carries a number taken under the lock, and <code>LatestOnly</code> drops an event older than the last one it passed for that order. So she is never told \"confirmed\" after \"cancelled\", and the store did not change for any of it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Tell every listener, catching anything they throw, so a broken listener cannot break an order. */\n    private void publish(StoreEvent e) {\n        for (StoreObserver o : observers) {\n            try { o.onEvent(e); } catch (RuntimeException ex) { System.err.println(&quot;[listener failed] &quot; + ex.getMessage()); }\n        }\n    }\n\n// ---- ext: back in stock ------------------------------------------------------------------------------\n/**\n * &quot;Notify me when it is back&quot;: buyers who watch a sold-out SKU are told once, when units come back, whether\n * from a restock, an expired hold or a cancelled order. A listener, so the store does not change. It reads the\n * store again (listeners run after the unlock, so that is safe), and remove() on the watch list is atomic, so\n * two events racing each other tell a buyer once, not twice.\n */\nfinal class BackInStockAlerts implements StoreObserver {\n    private final Store store;\n    private final Map&lt;String, Set&lt;String&gt;&gt; watchers = new ConcurrentHashMap&lt;&gt;();   // SKU -&gt; buyers waiting\n    final List&lt;String&gt; sent = new CopyOnWriteArrayList&lt;&gt;();\n\n    BackInStockAlerts(Store store) { this.store = store; }\n    /** A buyer asks to be told when this SKU is back. */\n    void watch(String userId, String sku) { watchers.computeIfAbsent(sku, k -&gt; ConcurrentHashMap.newKeySet()).add(userId); }\n    /** Units came back to some SKUs: tell their watchers once, and forget them. */\n    public void onEvent(StoreEvent e) {\n        if (!Set.of(&quot;RESTOCKED&quot;, &quot;EXPIRED&quot;, &quot;CANCELLED&quot;).contains(e.kind())) return;\n        for (Line l : e.lines()) {\n            if (!watchers.containsKey(l.sku()) || store.getInventory(l.sku()) == 0) continue;\n            Set&lt;String&gt; waiting = watchers.remove(l.sku());          // atomic: only one event gets the list\n            if (waiting != null) for (String u : waiting) sent.add(u + &quot;: &quot; + l.sku() + &quot; is back&quot;);\n        }\n    }\n}\n\n/**\n * Listeners run after the unlock, so two threads can deliver one order&#x27;s events in the wrong order: the SMS\n * would say &quot;cancelled&quot;, then &quot;confirmed&quot;. Every event carries a number taken under the lock; this wrapper\n * passes an order&#x27;s event on only when it is newer than the last one it passed for that order. compute() runs\n * one order&#x27;s check-and-send as one step, so two events of the same order can never cross inside it.\n */\nfinal class LatestOnly implements StoreObserver {\n    private final StoreObserver inner;\n    private final Map&lt;String, Long&gt; lastSeen = new ConcurrentHashMap&lt;&gt;();   // order id -&gt; newest event number passed on\n\n    LatestOnly(StoreObserver inner) { this.inner = inner; }\n    /** Pass on a newer event; drop an older one. Restocks have no order and always pass. */\n    public void onEvent(StoreEvent e) {\n        if (e.orderId() == null) { inner.onEvent(e); return; }\n        lastSeen.compute(e.orderId(), (id, last) -&gt; {\n            if (last != null &amp;&amp; last &gt; e.seq()) return last;                  // older than what was sent: drop it\n            inner.onEvent(e);\n            return e.seq();\n        });\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; The product sits in several warehouses, each delivering to some pincodes. Ship from one, or split the order.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Which site ships which units is a rule that will change, so it goes behind <code>AllocationRule</code>. <code>OneSiteElseSplit</code> first looks, nearest first, for one site that delivers to the pincode and has every line: one parcel. Only when no site has it all does it split the order across the sites that deliver there. <code>SiteStock</code> keeps the counts per site under one lock and plans and reserves in the same locked step, so two buyers are never promised the same last unit. An unserved pincode, and an order no set of sites can fill, are refused by name: \"pincode unserviceable\" and \"insufficient product inventory\". In the store this replaces <code>inventory.reserveAll</code>, and each order line remembers its site.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: warehouses ---------------------------------------------------------------------------------\n/** A warehouse or a seller&#x27;s site: an id, the pincodes it delivers to, and a rank (lower = nearer, preferred). */\nrecord Site(String id, Set&lt;String&gt; pincodes, int rank) {}\n\n/** The answer to &quot;who ships this?&quot;: a plan (site -&gt; SKU -&gt; units), or the reason nothing can ship. */\nrecord Allocation(Map&lt;String, Map&lt;String, Integer&gt;&gt; plan, String refusal) {\n    /** True when there is a plan. */\n    boolean ok() { return plan != null; }\n    /** Printed as the plan, or the refusal. */\n    public String toString() { return ok() ? plan.toString() : refusal; }\n}\n\n/**\n * Which site ships which units. Behind an interface because it changes: nearest first, cheapest shipping,\n * one parcel whenever possible. Returns site -&gt; (SKU -&gt; qty), or null when the order cannot be filled.\n */\ninterface AllocationRule {\n    Map&lt;String, Map&lt;String, Integer&gt;&gt; plan(Map&lt;String, Integer&gt; wanted, String pincode, List&lt;Site&gt; sites, SiteStock stock);\n}\n\n/**\n * The stock of every SKU at every site, under one lock, so &quot;plan and reserve&quot; is one step: two buyers can\n * never both be promised the last unit at the Pune warehouse.\n */\nfinal class SiteStock {\n    private final Map&lt;String, Map&lt;String, Integer&gt;&gt; counts = new HashMap&lt;&gt;();   // site -&gt; SKU -&gt; units\n    private final List&lt;Site&gt; sites = new ArrayList&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n\n    /** Add a site with its starting counts. Setup only. */\n    void addSite(Site s, Map&lt;String, Integer&gt; skus) { sites.add(s); counts.put(s.id(), new HashMap&lt;&gt;(skus)); }\n    /** Units of a SKU at a site; the caller holds the lock, or it is setup. */\n    int at(String siteId, String sku) { return counts.get(siteId).getOrDefault(sku, 0); }\n    /**\n     * Plan with the rule and reserve the plan, under one lock. The refusals are the answers the multi-seller\n     * version of the task expects: &quot;pincode unserviceable&quot; and &quot;insufficient product inventory&quot;.\n     */\n    Allocation reserve(Map&lt;String, Integer&gt; wanted, String pincode, AllocationRule rule) {\n        lock.lock();\n        try {\n            if (sites.stream().noneMatch(s -&gt; s.pincodes().contains(pincode))) return new Allocation(null, &quot;pincode unserviceable&quot;);\n            Map&lt;String, Map&lt;String, Integer&gt;&gt; plan = rule.plan(wanted, pincode, sites, this);\n            if (plan == null) return new Allocation(null, &quot;insufficient product inventory&quot;);\n            plan.forEach((site, skus) -&gt; skus.forEach((sku, n) -&gt; counts.get(site).merge(sku, -n, Integer::sum)));\n            return new Allocation(plan, null);\n        } finally { lock.unlock(); }\n    }\n}\n\n/**\n * One parcel when a single site can send everything, nearest site first; otherwise split the order across the\n * sites that deliver to that pincode, nearest first. null when even all of them together are short.\n */\nfinal class OneSiteElseSplit implements AllocationRule {\n    /** The plan, or null. Reads only; SiteStock.reserve applies it. */\n    public Map&lt;String, Map&lt;String, Integer&gt;&gt; plan(Map&lt;String, Integer&gt; wanted, String pincode, List&lt;Site&gt; sites, SiteStock stock) {\n        List&lt;Site&gt; serving = new ArrayList&lt;&gt;();\n        for (Site s : sites) if (s.pincodes().contains(pincode)) serving.add(s);\n        serving.sort(Comparator.comparingInt(Site::rank));\n        for (Site s : serving) {                                          // 1. one parcel, from the nearest site that has it all\n            boolean all = true;\n            for (Map.Entry&lt;String, Integer&gt; w : wanted.entrySet()) all &amp;= stock.at(s.id(), w.getKey()) &gt;= w.getValue();\n            if (all) return Map.of(s.id(), new TreeMap&lt;&gt;(wanted));\n        }\n        Map&lt;String, Map&lt;String, Integer&gt;&gt; plan = new TreeMap&lt;&gt;();         // 2. split, nearest first\n        for (Map.Entry&lt;String, Integer&gt; w : new TreeMap&lt;&gt;(wanted).entrySet()) {\n            int need = w.getValue();\n            for (Site s : serving) {\n                int take = Math.min(need, stock.at(s.id(), w.getKey()));\n                if (take &gt; 0) { plan.computeIfAbsent(s.id(), k -&gt; new TreeMap&lt;&gt;()).put(w.getKey(), take); need -= take; }\n                if (need == 0) break;\n            }\n            if (need &gt; 0) return null;\n        }\n        return plan;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; PhonePe: some items belong to an external seller, and his stock can be reached only through his API.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Where an order's stock comes from becomes an interface, <code>StockSource</code>: our warehouse behind one implementation, the seller's API behind another. PhonePe's prompt puts every item of an order with one seller, so no order needs all or nothing across two sources. The seller's reserve is a network call, so it gets the bank's treatment. It runs outside the store's lock, before the order is written, and carries our order id, so a retry is applied once. A timeout means we do not know whether he blocked the units, so the adapter releases by order id (safe either way) and refuses the order (test 15). Paid means confirm; expired or cancelled means release, and a failed release waits on a retry list.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: external seller ----------------------------------------------------------------------------\n/**\n * PhonePe&#x27;s twist: some items belong to an external seller, and his stock is reached only through his API.\n * Every call carries our order id, so a retried call is applied once, and release is safe to repeat.\n */\ninterface SellerApi {\n    /** Units he says are available. */\n    int available(String sku);\n    /** Block these lines for our order id; true = blocked. May time out. */\n    boolean reserve(String orderId, Map&lt;String, Integer&gt; lines);\n    /** Our order was paid: his blocked units are sold. */\n    void confirm(String orderId);\n    /** Our order died: give his block back. Does nothing when there is no block. */\n    void release(String orderId);\n}\n\n/**\n * Where an order&#x27;s stock comes from: our own warehouse or a seller&#x27;s API. The store would pick the source by\n * the order&#x27;s seller; every line of one order comes from one seller (PhonePe&#x27;s rule), so no order ever needs\n * all-or-nothing across two sources.\n */\ninterface StockSource {\n    /** Block the lines for this order id, all or none. */\n    boolean reserve(String orderId, Map&lt;String, Integer&gt; lines);\n    /** The order was paid. */\n    void confirm(String orderId);\n    /** The order died unpaid. */\n    void release(String orderId);\n}\n\n/**\n * The external seller behind our StockSource. His reserve is a network call, so it must never run under the\n * store&#x27;s lock; it runs before the order is written, like the bank&#x27;s charge. A timeout means we do not know\n * whether he blocked anything, so we release by order id, which is safe either way, and refuse the order.\n */\nfinal class ExternalSellerStock implements StockSource {\n    private final SellerApi api;\n    final List&lt;String&gt; releasesToRetry = new CopyOnWriteArrayList&lt;&gt;();\n\n    ExternalSellerStock(SellerApi api) { this.api = api; }\n    /** Ask the seller; a timeout is treated as &quot;no&quot; and undone by order id. */\n    public boolean reserve(String orderId, Map&lt;String, Integer&gt; lines) {\n        try { return api.reserve(orderId, lines); }\n        catch (RuntimeException timeout) { release(orderId); return false; }\n    }\n    /** Tell the seller the order was paid. */\n    public void confirm(String orderId) { api.confirm(orderId); }\n    /** Give the seller&#x27;s block back; a failed call is kept for a retry. */\n    public void release(String orderId) {\n        try { api.release(orderId); } catch (RuntimeException e) { releasesToRetry.add(orderId); }\n    }\n}\n\n/** A seller&#x27;s API in memory, keyed by our order id, that can be told to time out AFTER blocking, once. */\nfinal class FakeSeller implements SellerApi {\n    private final Map&lt;String, Integer&gt; stock = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Map&lt;String, Integer&gt;&gt; blocks = new ConcurrentHashMap&lt;&gt;();\n    volatile boolean timeoutAfterBlockOnce;\n\n    FakeSeller(Map&lt;String, Integer&gt; start) { stock.putAll(start); }\n    /** Units free at the seller. */\n    public int available(String sku) { return stock.getOrDefault(sku, 0); }\n    /** Block once per order id; a repeat is a no-op that answers true. */\n    public synchronized boolean reserve(String orderId, Map&lt;String, Integer&gt; lines) {\n        if (blocks.containsKey(orderId)) return true;\n        for (Map.Entry&lt;String, Integer&gt; l : lines.entrySet()) if (available(l.getKey()) &lt; l.getValue()) return false;\n        lines.forEach((sku, n) -&gt; stock.merge(sku, -n, Integer::sum));\n        blocks.put(orderId, Map.copyOf(lines));\n        if (timeoutAfterBlockOnce) { timeoutAfterBlockOnce = false; throw new RuntimeException(&quot;seller API timed out&quot;); }\n        return true;\n    }\n    /** The block becomes a sale. */\n    public synchronized void confirm(String orderId) { blocks.remove(orderId); }\n    /** Give a block back; nothing when there is none. */\n    public synchronized void release(String orderId) {\n        Map&lt;String, Integer&gt; b = blocks.remove(orderId);\n        if (b != null) b.forEach((sku, n) -&gt; stock.merge(sku, n, Integer::sum));\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Many machines now. PhonePe asked: how do you lock ten pens in a distributed environment? And a flash sale on one product?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The lock moves into the database, and each line becomes one conditional UPDATE: <code>UPDATE stock SET available = available - 2, reserved = reserved + 2 WHERE sku = 'PEN' AND available &gt;= 2</code>. One row updated means you got the pens; zero means somebody else did. A multi-line order runs its updates in one transaction, in SKU order, and rolls back on the first zero. The hold becomes the order row's status and <code>hold_until</code>. The idempotency key becomes a UNIQUE index, so a retried INSERT fails and the retry reads the order it made. Redis answers the same question with a script that checks and takes in one step, plus a key that expires after five minutes. A flash sale puts a million requests on one row, so a sold-out gate in memory turns away everyone after the last unit, and only that many buyers ever reach the database.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence --------------------------------------------------------------------------------\n/**\n * The same design on a database, for many machines. The lock becomes the row: a reserve is ONE conditional\n * UPDATE that succeeds only while enough units are available, so the database decides the winner. The hold is\n * the order row&#x27;s status plus hold_until, and the idempotency key is a UNIQUE index, so a retried INSERT fails\n * and the retry reads the order it already made. Redis does the same with a script that checks and takes in\n * one step, plus a key that expires, for &quot;lock 10 pens for five minutes&quot;.\n */\nfinal class Sql {\n    static final String SCHEMA = &quot;&quot;&quot;\n        CREATE TABLE stock  (sku TEXT PRIMARY KEY, available INT NOT NULL CHECK (available &gt;= 0),\n                             reserved INT NOT NULL CHECK (reserved &gt;= 0), sold INT NOT NULL);\n        CREATE TABLE orders (id TEXT PRIMARY KEY, user_id TEXT NOT NULL, idem_key TEXT NOT NULL,\n                             status TEXT NOT NULL, total_paise BIGINT NOT NULL, hold_until TIMESTAMP NOT NULL,\n                             UNIQUE (user_id, idem_key));\n        CREATE TABLE order_lines (order_id TEXT, sku TEXT, qty INT, unit_paise BIGINT, PRIMARY KEY (order_id, sku));\n        CREATE INDEX pending_by_hold ON orders (hold_until) WHERE status = &#x27;PENDING_PAYMENT&#x27;;&quot;&quot;&quot;;\n    /** One line of a reserve: 1 row updated = blocked; 0 rows = not enough left (another buyer got there). */\n    static final String RESERVE = &quot;UPDATE stock SET available = available - ?, reserved = reserved + ? WHERE sku = ? AND available &gt;= ?&quot;;\n    /** The sweeper: end holds that are due, and learn which ones, so their lines can be released in the same transaction. */\n    static final String EXPIRE = &quot;UPDATE orders SET status = &#x27;EXPIRED&#x27; WHERE status = &#x27;PENDING_PAYMENT&#x27; AND hold_until &lt;= now() RETURNING id&quot;;\n    /** Redis: check and take in one step; the hold key disappears by itself after five minutes. */\n    static final String REDIS_LUA = &quot;&quot;&quot;\n        if tonumber(redis.call(&#x27;GET&#x27;, KEYS[1])) &gt;= tonumber(ARGV[1]) then\n          redis.call(&#x27;DECRBY&#x27;, KEYS[1], ARGV[1]); redis.call(&#x27;SET&#x27;, KEYS[2], ARGV[1], &#x27;PX&#x27;, 300000); return 1\n        end\n        return 0&quot;&quot;&quot;;\n    private Sql() {}\n}\n\n/**\n * The stock table in memory, with the database&#x27;s guarantee: each row update is atomic\n * (ConcurrentHashMap.compute runs it as one step for that key). A multi-line reserve takes the rows in SKU\n * order, as a transaction would lock them, and undoes the lines already taken if a later one gets 0 rows,\n * which is what ROLLBACK does for you in a real database. One difference: here another caller can see those\n * lines in between and be refused; a database keeps the rows locked until COMMIT, so that caller waits instead.\n */\nfinal class StockTable {\n    private final Map&lt;String, int[]&gt; rows = new ConcurrentHashMap&lt;&gt;();   // sku -&gt; {available, reserved, sold}\n\n    /** INSERT one row. */\n    void insert(String sku, int available) { rows.put(sku, new int[] { available, 0, 0 }); }\n    /** The RESERVE statement for one line: true when exactly one row was updated. */\n    boolean reserveRow(String sku, int qty) {\n        boolean[] updated = { false };\n        rows.computeIfPresent(sku, (k, r) -&gt; {\n            if (r[0] &lt; qty) return r;                         // WHERE available &gt;= ? failed: 0 rows\n            updated[0] = true;\n            return new int[] { r[0] - qty, r[1] + qty, r[2] };\n        });\n        return updated[0];\n    }\n    /** Give one line&#x27;s block back. */\n    void releaseRow(String sku, int qty) { rows.computeIfPresent(sku, (k, r) -&gt; new int[] { r[0] + qty, r[1] - qty, r[2] }); }\n    /** Every line or none: rows in SKU order; on a 0-row line, undo the earlier ones (the ROLLBACK). */\n    boolean reserveAll(Map&lt;String, Integer&gt; lines) {\n        List&lt;Map.Entry&lt;String, Integer&gt;&gt; done = new ArrayList&lt;&gt;();\n        for (Map.Entry&lt;String, Integer&gt; l : new TreeMap&lt;&gt;(lines).entrySet()) {\n            if (!reserveRow(l.getKey(), l.getValue())) {\n                for (Map.Entry&lt;String, Integer&gt; d : done) releaseRow(d.getKey(), d.getValue());\n                return false;\n            }\n            done.add(l);\n        }\n        return true;\n    }\n    /** available of one row. */\n    int available(String sku) { return rows.get(sku)[0]; }\n    /** reserved of one row. */\n    int reserved(String sku) { return rows.get(sku)[1]; }\n}\n\n// ---- ext: sold-out gate ------------------------------------------------------------------------------\n/**\n * A flash sale: a million buyers want the same 1,000 units. A counter in front of the store lets at most as\n * many buyers in as there are units, with a compare-and-set (write the new count only if it still holds the\n * value just read, as one hardware step). Everyone else hears &quot;sold out&quot; in about 50 ns and never touches the\n * lock. A buyer who got in but whose order dies unpaid gives the ticket back through the listener.\n */\nfinal class SoldOutGate implements StoreObserver {\n    private final String sku;\n    private final AtomicInteger tickets;\n\n    SoldOutGate(String sku, int units) { this.sku = sku; this.tickets = new AtomicInteger(units); }\n    /** Take one ticket if any is left. Never goes below zero, with no lock. */\n    boolean tryEnter() { return tickets.getAndUpdate(n -&gt; n &gt; 0 ? n - 1 : n) &gt; 0; }\n    /** Hand a ticket back: this buyer&#x27;s checkout failed, or his order died unpaid. */\n    void giveBack(int n) { tickets.addAndGet(n); }\n    /** Tickets left. */\n    int left() { return tickets.get(); }\n    /** An order holding this SKU expired or was cancelled: its units are for sale again, so are its tickets. */\n    public void onEvent(StoreEvent e) {\n        if (!e.kind().equals(&quot;EXPIRED&quot;) &amp;&amp; !e.kind().equals(&quot;CANCELLED&quot;)) return;\n        for (Line l : e.lines()) if (l.sku().equals(sku)) giveBack(l.qty());\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Where does time come from, and how do you test a five-minute hold without waiting five minutes?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The store is handed a <code>Clock</code>, a one-method interface, and reads the time nowhere else: the hold's end, the sweep and the late-payment check all ask that clock. A test keeps the time in a variable and moves it. It places the order at 10:00, sets 10:04:59.999 and sees the kurtis still held, then sets 10:05:00.000 and sees them for sale. The late-payment test goes further: its fake bank moves the clock to 10:06 inside the charge. So \"the bank answered after the hold ended\" happens on every run. Nothing sleeps, so nothing is flaky; only the background sweeper, which is about real time, waits for real.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 3. the hold ends at exactly five minutes, with no thread\n        System.out.println(&quot;3. the hold ends at exactly five minutes, and nobody has to run a thread for it&quot;);\n        long[] t3 = { Main.at(10, 0) };\n        Store hold = store(t3, new FakeGateway());\n        Order held = hold.createOrder(&quot;ravi&quot;, &quot;r&quot;, Map.of(&quot;KURTI&quot;, 3), &quot;FLAT100&quot;);\n        t3[0] = Main.at(10, 5) - 1;\n        check(hold.getInventory(&quot;KURTI&quot;) == 0 &amp;&amp; hold.order(held.id).status() == OrderStatus.PENDING_PAYMENT,\n              &quot;at 10:04:59.999 all three kurtis are still held&quot;);\n        t3[0] = Main.at(10, 5);\n        check(hold.getInventory(&quot;KURTI&quot;) == 3, &quot;at 10:05:00.000 exactly, all three are back on sale&quot;);\n        check(held.status() == OrderStatus.EXPIRED, &quot;the order is EXPIRED&quot;);\n        check(hold.couponUses(&quot;FLAT100&quot;) == 0, &quot;its coupon use was given back&quot;);\n        check(hold.confirmOrder(held.id) == PayResult.REFUSED, &quot;paying an expired order is refused, and nothing is charged&quot;);\n\n        // 4. the money arrives after the hold ended, or after a cancel\n        System.out.println(&quot;4. the bank answers after the hold ended: refund, and the stock is not sold&quot;);\n        long[] t4 = { Main.at(10, 0) };\n        FakeGateway bank4 = new FakeGateway();\n        Store late = store(t4, bank4);\n        Order lo = late.createOrder(&quot;meera&quot;, &quot;m&quot;, Map.of(&quot;KURTI&quot;, 1), null);\n        late.configure(new ListPrice(), new PaymentGateway() {\n            public boolean charge(String id, long paise) { t4[0] = Main.at(10, 6); return bank4.charge(id, paise); }   // answers at 10:06\n            public void refund(String id) { bank4.refund(id); }\n        }, Store.HOLD_MS);\n        check(late.confirmOrder(lo.id) == PayResult.REFUNDED, &quot;the money arrived at 10:06, after the 10:05 end: REFUNDED&quot;);\n        check(bank4.charges.get() == 1 &amp;&amp; bank4.heldPaise() == 0, &quot;charged once and given back: the bank holds nothing&quot;);\n        check(late.stockOf(&quot;KURTI&quot;).equals(new StockView(3, 0, 0)) &amp;&amp; lo.status() == OrderStatus.EXPIRED,\n              &quot;the kurti was never sold; the order ended EXPIRED&quot;);\n        long[] t4b = { Main.at(12, 0) };\n        FakeGateway bank4b = new FakeGateway();\n        Store both = store(t4b, bank4b);\n        Order co = both.createOrder(&quot;asha&quot;, &quot;a&quot;, Map.of(&quot;MUG&quot;, 2), null);\n        both.configure(new ListPrice(), new PaymentGateway() {\n            public boolean charge(String id, long paise) { both.cancelOrder(id); return bank4b.charge(id, paise); }   // she cancels while the bank works\n            public void refund(String id) { bank4b.refund(id); }\n        }, Store.HOLD_MS);\n        check(both.confirmOrder(co.id) == PayResult.REFUNDED &amp;&amp; co.status() == OrderStatus.CANCELLED,\n              &quot;cancelled while the bank was working: the late money is refunded&quot;);\n        check(bank4b.heldPaise() == 0 &amp;&amp; both.stockOf(&quot;MUG&quot;).equals(new StockView(5, 0, 0)), &quot;no money kept, both mugs back on sale&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Which pattern is where, and why did each one earn its place?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Each one is what a move produced, so name the move, then the line. Strategy is move 3: pricing and the bank will change, so each sits behind an interface the store is handed. Decorator is how discounts combine: each wraps the rule before it, so a new offer needs no new interface. Observer is move 4's rule that nothing slow runs inside the lock: the store publishes its events after the unlock. State is move 6: the order's life as a table. The idempotency key is not a Gang of Four pattern, but it is the one an order-system interviewer is listening for. Say the absences too: no Singleton, no Factory until coupons come from config, no Builder.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: a rule behind an interface, handed in\ninterface PricingRule { Quote price(List&lt;Line&gt; lines); }\nstore.configure(pricing, bank, Store.HOLD_MS);\n\n// Decorator: a rule that wraps the rule before it\nnew FlatOff(new PercentOff(new ListPrice(), &quot;SAVE10&quot;, 10, 100_00), &quot;FLAT100&quot;, 100_00, 999_00)\n\n// Observer: the store announces after the unlock; it never learns who listens\ninterface StoreObserver { void onEvent(StoreEvent e); }\n} finally { lock.unlock(); runAfter(after); }      // runAfter calls publish(e)\n\n// State: the life cycle as a table; a move not in it throws\nNEXT.put(PENDING_PAYMENT, EnumSet.of(CONFIRMED, CANCELLED, EXPIRED));\n\n// Idempotency key: the same request is the same order; the same payment is the same charge\nbyKey.computeIfAbsent(userId, u -&gt; new HashMap&lt;&gt;()).put(key, o.id);      bank.charge(o.id, o.totalPaise());\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Which SOLID letter is where in this code?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>S: each class has one reason to change. Stock changes only with the rules for its counts, Cart with the cart, CouponBook with the coupon limits, Order with the life cycle, and the store with the flow. O: buy-two-get-one, the best-of rule and the per-SKU locks were new classes, and the store was never opened. L: any PricingRule drops in, and the store never asks which one it got. I: the interfaces are small, one job each, so a test's fake is a lambda or a few lines. PaymentGateway's one job, moving money, has two methods, because a refund exists only for a charge. D: the store depends on the interfaces it is handed, which is why a test can hand it a bank that answers six minutes late.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// S: one reason to change each\nfinal class Stock { /* its three counts */ }   final class Cart { /* its items */ }   final class Store { /* the flow + the lock */ }\n// O: a new offer is a new class and one changed line; Store is never opened\nstore.configure(new BuyXGetY(new ListPrice(), &quot;PEN&quot;, 2, 1), bank, Store.HOLD_MS);\n// L: any rule drops in; the store never asks which one it got\nQuote plain = pricing.price(lines);\n// I: small interfaces, one job each\ninterface Clock { long nowMs(); }   interface StoreObserver { void onEvent(StoreEvent e); }\n// D: depend on interfaces; a test hands in a late bank and a clock it moves\nstore.configure(new ListPrice(), lateBank, Store.HOLD_MS);   store.setClock(() -&gt; now[0]);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>17 &middot; An enum of order states, or a class per state? And where would a Factory pay?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>An enum plus a table, until a state grows behaviour of its own. Five states whose whole job is \"which move is legal next\" are data: one row each, and a new state (SHIPPED) is one more row with nothing edited. A state earns a class the day it must do something of its own. Cash on delivery is the example: the order is confirmed with no payment, and the money is collected at the door. That state would be a class with its own confirm step. A Factory pays when coupons arrive as lines from an admin screen instead of being typed in code. Then one parser maps a kind to a rule, instead of a switch that grows in every caller.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: coupons from config ------------------------------------------------------------------------\n/**\n * Where a Factory finally pays: coupons that arrive as lines from an admin screen or a config file, so a new\n * campaign is data, not code. &quot;SAVE10|PERCENT|10|10000|1|1000&quot; = 10% off, up to Rs 100, once per buyer, 1,000\n * uses; &quot;FLAT100|FLAT|10000|99900|1|500&quot; = Rs 100 off above Rs 999.\n */\nfinal class CouponFactory {\n    /** One config line -&gt; one Coupon, or a clear error naming the line. */\n    static Coupon fromConfig(String line) {\n        String[] p = line.split(&quot;\\\\|&quot;);\n        if (p.length != 6) throw new IllegalArgumentException(&quot;bad coupon line: &quot; + line);\n        String code = p[0];\n        long a = Long.parseLong(p[2]), b = Long.parseLong(p[3]);\n        int perUser = Integer.parseInt(p[4]), total = Integer.parseInt(p[5]);\n        return switch (p[1]) {\n            case &quot;PERCENT&quot; -&gt; new Coupon(code, perUser, total, base -&gt; new PercentOff(base, code, (int) a, b));\n            case &quot;FLAT&quot; -&gt; new Coupon(code, perUser, total, base -&gt; new FlatOff(base, code, a, b));\n            default -&gt; throw new IllegalArgumentException(&quot;unknown coupon kind &quot; + p[1] + &quot; in &quot; + line);\n        };\n    }\n    private CouponFactory() {}\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what

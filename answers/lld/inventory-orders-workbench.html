e (!holds.isEmpty() &amp;&amp; holds.peek().holdUntilMs &lt;= now) {\n            Order o = holds.poll();\n            if (o.status() != OrderStatus.PENDING_PAYMENT) continue;\n            endUnpaid(o, OrderStatus.EXPIRED, after);\n            ended++;\n        }\n        return ended;\n    }\n\n    /**\n     * An unpaid order ends (EXPIRED or CANCELLED): its block and its coupon use are given back. If a charge was\n     * ever sent, a refund by order id is queued to that bank, which gives back money that might have moved and\n     * does nothing otherwise.\n     */\n    private void endUnpaid(Order o, OrderStatus end, List&lt;Runnable&gt; after) {\n        inventory.releaseAll(o.lines);\n        if (o.couponCode != null) coupons.giveBack(o.couponCode, o.userId);\n        o.moveTo(end);\n        if (o.chargedVia != null) refundLater(o, after);\n        announce(end.name(), o, after);\n    }\n\n    /**\n     * Queue a refund for after the unlock, through the bank that took the money (not whichever bank is configured\n     * now). A refund that fails is kept for a retry, never forgotten.\n     */\n    private void refundLater(Order o, List&lt;Runnable&gt; after) {\n        PaymentGateway bank = o.chargedVia != null ? o.chargedVia : gateway;\n        after.add(() -&gt; {\n            try { bank.refund(o.id); } catch (RuntimeException e) { refundsToRetry.add(o.id); }\n        });\n    }\n\n    /** The order behind an id, or a clear failure. */\n    private Order find(String orderId) {\n        Order o = orders.get(orderId);\n        if (o == null) throw new NoSuchElementException(&quot;no order &quot; + orderId);\n        return o;\n    }\n\n    /** Build the event now, under the lock, with the next number, and queue its publishing for after the unlock. */\n    private void announce(String kind, Order o, List&lt;Runnable&gt; after) {\n        StoreEvent e = StoreEvent.of(kind, o, ++eventSeq);\n        after.add(() -&gt; publish(e));\n    }\n\n    /** Run what a locked section queued: refunds and listeners. Called only after the unlock. */\n    private void runAfter(List&lt;Runnable&gt; after) { for (Runnable r : after) r.run(); }\n\n    /** Tell every listener, catching anything they throw, so a broken listener cannot break an order. */\n    private void publish(StoreEvent e) {\n        for (StoreObserver o : observers) {\n            try { o.onEvent(e); } catch (RuntimeException ex) { System.err.println(&quot;[listener failed] &quot; + ex.getMessage()); }\n        }\n    }\n}\n\n/** Runs a demo of one afternoon at the store, then a hundred buyers racing for the last ten pens. */\npublic class Main {\n    /** Paise printed as rupees. */\n    static String rs(long paise) { return String.format(&quot;Rs %d.%02d&quot;, paise / 100, paise % 100); }\n\n    /** A store stocked the way the page describes it: ten pens, five mugs, three kurtis, and two coupons. */\n    static Store stocked() {\n        Store s = new Store();\n        s.addProduct(&quot;PEN&quot;, &quot;Blue pen&quot;, 20_00, 10);\n        s.addProduct(&quot;MUG&quot;, &quot;Coffee mug&quot;, 299_00, 5);\n        s.addProduct(&quot;KURTI&quot;, &quot;Cotton kurti&quot;, 499_00, 3);\n        s.addCoupon(new Coupon(&quot;SAVE10&quot;, 1, 1000, base -&gt; new PercentOff(base, &quot;SAVE10&quot;, 10, 100_00)));\n        s.addCoupon(new Coupon(&quot;FLAT100&quot;, 1, 1000, base -&gt; new FlatOff(base, &quot;FLAT100&quot;, 100_00, 999_00)));\n        return s;\n    }\n\n    /** A moment on 15 September 2026 in Kolkata, so the demo prints the same every time. */\n    static long at(int hour, int minute) {\n        return java.time.LocalDateTime.of(2026, 9, 15, hour, minute)\n                 .atZone(java.time.ZoneId.of(&quot;Asia/Kolkata&quot;)).toInstant().toEpochMilli();\n    }\n\n    public static void main(String[] args) throws Exception {\n        long[] now = { at(10, 0) };\n        Store store = stocked();\n        FakeGateway bank = new FakeGateway();\n        store.configure(new ListPrice(), bank, Store.HOLD_MS);\n        store.setClock(() -&gt; now[0]);\n        store.addObserver(new BuyerSms());\n\n        System.out.println(&quot;-- 10:00 Asha fills her cart and checks out with SAVE10&quot;);\n        store.addToCart(&quot;asha&quot;, &quot;KURTI&quot;, 2);\n        store.addToCart(&quot;asha&quot;, &quot;MUG&quot;, 1);\n        System.out.println(&quot;   cart &quot; + store.viewCart(&quot;asha&quot;) + &quot;; total with SAVE10 &quot;\n                           + rs(store.cartTotal(&quot;asha&quot;, &quot;SAVE10&quot;).totalPaise()));\n        Order o1 = store.checkout(&quot;asha&quot;, &quot;tap-1&quot;, &quot;SAVE10&quot;);\n        System.out.println(&quot;   &quot; + o1.id + &quot; &quot; + o1.status() + &quot;, &quot; + rs(o1.totalPaise()) + &quot; &quot; + o1.quote.discounts()\n                           + &quot;; KURTI &quot; + store.stockOf(&quot;KURTI&quot;));\n        Order again = store.checkout(&quot;asha&quot;, &quot;tap-1&quot;, &quot;SAVE10&quot;);\n        System.out.println(&quot;   the app retries with the same key: &quot; + again.id + &quot;, the same order; KURTI &quot;\n                           + store.stockOf(&quot;KURTI&quot;));\n\n        System.out.println(&quot;-- 10:01 she pays, and her app sends it twice&quot;);\n        now[0] = at(10, 1);\n        System.out.println(&quot;   &quot; + store.confirmOrder(o1.id) + &quot;, then &quot; + store.confirmOrder(o1.id) + &quot;; charged &quot;\n                           + bank.charges.get() + &quot; time; the bank holds &quot; + rs(bank.heldPaise()) + &quot;; KURTI &quot; + store.stockOf(&quot;KURTI&quot;));\n\n        System.out.println(&quot;-- 10:02 Ravi blocks the last kurti and never pays&quot;);\n        now[0] = at(10, 2);\n        Order o2 = store.createOrder(&quot;ravi&quot;, &quot;r-1&quot;, Map.of(&quot;KURTI&quot;, 1), null);\n        System.out.println(&quot;   &quot; + o2.id + &quot; holds it until 10:07; KURTI available &quot; + store.getInventory(&quot;KURTI&quot;));\n        now[0] = at(10, 7);\n        System.out.println(&quot;   10:07: KURTI available &quot; + store.getInventory(&quot;KURTI&quot;) + &quot;; &quot; + o2.id + &quot; is &quot; + o2.status());\n\n        System.out.println(&quot;-- 10:08 Meera&#x27;s bank answers after her hold has ended: the money goes back&quot;);\n        now[0] = at(10, 8);\n        Order o3 = store.createOrder(&quot;meera&quot;, &quot;m-1&quot;, Map.of(&quot;KURTI&quot;, 1), null);\n        store.configure(new ListPrice(), new PaymentGateway() {     // a slow bank: six minutes pass during the charge\n            public boolean charge(String id, long paise) { now[0] = at(10, 14); return bank.charge(id, paise); }\n            public void refund(String id) { bank.refund(id); }\n        }, Store.HOLD_MS);\n        PayResult late = store.confirmOrder(o3.id);\n        System.out.println(&quot;   &quot; + late + &quot;; &quot; + o3.id + &quot; is &quot; + o3.status() + &quot;; the bank holds &quot; + rs(bank.heldPaise())\n                           + &quot;; KURTI &quot; + store.stockOf(&quot;KURTI&quot;));\n        store.configure(new ListPrice(), bank, Store.HOLD_MS);\n\n        System.out.println(&quot;-- one order, one line short: nothing is blocked&quot;);\n        try { store.createOrder(&quot;zoya&quot;, &quot;z-1&quot;, Map.of(&quot;PEN&quot;, 2, &quot;KURTI&quot;, 5), null); }\n        catch (OrderRefused e) { System.out.println(&quot;   refused &quot; + e.reason + &quot; (&quot; + e.getMessage() + &quot;); PEN &quot; + store.stockOf(&quot;PEN&quot;)); }\n\n        System.out.println(&quot;-- Asha cancels before it ships: stock back on sale, money back&quot;);\n        System.out.println(&quot;   &quot; + store.cancelOrder(o1.id) + &quot;; KURTI &quot; + store.stockOf(&quot;KURTI&quot;) + &quot;; the bank holds &quot;\n                           + rs(bank.heldPaise()) + &quot;; SAVE10 uses &quot; + store.couponUses(&quot;SAVE10&quot;));\n\n        // the race: a hundred buyers press Buy for the last ten pens at the same instant\n        Store sale = stocked();\n        FakeGateway saleBank = new FakeGateway();\n        sale.configure(new ListPrice(), saleBank, Store.HOLD_MS);\n        System.out.println(&quot;-- a hundred buyers, ten pens, the same instant&quot;);\n        int buyers = 100;\n        CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(buyers);\n        List&lt;Order&gt; won = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        AtomicInteger soldOut = new AtomicInteger();\n        for (int i = 0; i &lt; buyers; i++) {\n            final String user = &quot;buyer&quot; + i;\n            new Thread(() -&gt; {\n                try { go.await(); won.add(sale.createOrder(user, &quot;key-&quot; + user, Map.of(&quot;PEN&quot;, 1), null)); }\n                catch (OrderRefused e) { if (e.reason == Reason.OUT_OF_STOCK) soldOut.incrementAndGet(); }\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n                finally { done.countDown(); }\n            }).start();\n        }\n        go.countDown();\n        done.await();\n        System.out.println(&quot;   orders &quot; + won.size() + &quot; (must be 10); out of stock &quot; + soldOut.get() + &quot;; PEN &quot; + sale.stockOf(&quot;PEN&quot;));\n\n        CountDownLatch pay = new CountDownLatch(1), paid = new CountDownLatch(won.size());\n        for (Order o : List.copyOf(won))\n            new Thread(() -&gt; {\n                try { pay.await(); sale.confirmOrder(o.id); }\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n                finally { paid.countDown(); }\n            }).start();\n        pay.countDown();\n        paid.await();\n        System.out.println(&quot;   all ten pay at once: PEN &quot; + sale.stockOf(&quot;PEN&quot;) + &quot;; the bank holds &quot; + rs(saleBank.heldPaise())\n                           + &quot; (10 x Rs 20)&quot;);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist; nothing here edits Main.java.\n\n// ---- ext: buy X get Y --------------------------------------------------------------------------------\n/**\n * &quot;Buy two pens, get one free&quot;: for every x + y units of one SKU, y of them cost nothing. One more rule that\n * wraps the rule before it (Decorator), so the store and every other rule stay as they are.\n */\nfinal class BuyXGetY implements PricingRule {\n    private final PricingRule inner;\n    private final String sku;\n    private final int buy, free;\n\n    BuyXGetY(PricingRule inner, String sku, int buy, int free) {\n        if (buy &lt; 1 || free &lt; 1) throw new IllegalArgumentException(&quot;buy &quot; + buy + &quot; get &quot; + free);\n        this.inner = inner; this.sku = sku; this.buy = buy; this.free = free;\n    }\n    /** The wrapped price, less the free units: (qty / (buy + free)) x free x unit price. */\n    public Quote price(List&lt;Line&gt; lines) {\n        Quote q = inner.price(lines);\n        for (Line l : lines)\n            if (l.sku().equals(sku)) {\n                long off = (long) (l.qty() / (buy + free)) * free * l.unitPaise();\n                if (off &gt; 0) q = q.less(&quot;BUY&quot; + buy + &quot;GET&quot; + free + &quot; &quot; + sku, off);\n            }\n        return q;\n    }\n}\n\n/**\n * Several codes on one order, but only the best one counts (Flipkart&#x27;s billing task: &quot;if P10 and P20 are both\n * applied, only the highest is used&quot;). It prices the order with each candidate and keeps the cheapest, so\n * applying the same code twice can never stack.\n */\nfinal class BestOf implements PricingRule {\n    private final List&lt;PricingRule&gt; candidates;\n\n    BestOf(List&lt;PricingRule&gt; candidates) { this.candidates = List.copyOf(candidates); }\n    /** The candidate quote with the lowest total; the first one wins a tie. */\n    public Quote price(List&lt;Line&gt; lines) {\n        Quote best = null;\n        for (PricingRule r : candidates) {\n            Quote q = r.price(lines);\n            if (best == null || q.totalPaise() &lt; best.totalPaise()) best = q;\n        }\n        return best;\n    }\n}\n\n// ---- ext: a lock per SKU -----------------------------------------------------------------------------\n/**\n * Rung one of the ladder: a lock per SKU instead of one lock for the store, so buyers of different products\n * never wait for each other (Meesho&#x27;s per-product locks). An order with several lines takes its SKUs&#x27; locks in\n * SKU order, always the same order, so two orders for {PEN, MUG} and {MUG, PEN} can never each hold one lock\n * and wait for the other (a deadlock). All or nothing still holds: check every line, then write every line,\n * while holding all of that order&#x27;s locks.\n */\nfinal class StripedStock {\n    private final Map&lt;String, Stock&gt; stock = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, ReentrantLock&gt; locks = new ConcurrentHashMap&lt;&gt;();\n\n    /** Add a SKU with its count. Setup only. */\n    void add(String sku, int qty) { stock.put(sku, new Stock(qty)); locks.put(sku, new ReentrantLock()); }\n    /** Available units of one SKU, under that SKU&#x27;s lock only. */\n    int available(String sku) {\n        ReentrantLock l = locks.get(sku);\n        l.lock();\n        try { return stock.get(sku).available(); } finally { l.unlock(); }\n    }\n    /** Block every line or none. The locks are taken in SKU order and given back in reverse. */\n    boolean reserveAll(List&lt;Line&gt; lines) {\n        Map&lt;String, Integer&gt; need = totals(lines);                   // a SKU named twice is checked once, in total\n        List&lt;ReentrantLock&gt; held = lockInOrder(need.keySet());\n        try {\n            for (Map.Entry&lt;String, Integer&gt; n : need.entrySet())       // check all, touch nothing\n                if (stock.get(n.getKey()).available() &lt; n.getValue()) return false;\n            need.forEach((sku, n) -&gt; stock.get(sku).reserve(n));       // then write all\n            return true;\n        } finally { unlock(held); }\n    }\n    /** Give every line&#x27;s block back. */\n    void releaseAll(List&lt;Line&gt; lines) {\n        Map&lt;String, Integer&gt; need = totals(lines);\n        List&lt;ReentrantLock&gt; held = lockInOrder(need.keySet());\n        try { need.forEach((sku, n) -&gt; stock.get(sku).release(n)); } finally { unlock(held); }\n    }\n    /** The three counts of a SKU. */\n    StockView view(String sku) {\n        ReentrantLock l = locks.get(sku);\n        l.lock();\n        try { return stock.get(sku).view(); } finally { l.unlock(); }\n    }\n    /** The quantity per SKU, sorted by SKU. */\n    private static Map&lt;String, Integer&gt; totals(List&lt;Line&gt; lines) {\n        Map&lt;String, Integer&gt; t = new TreeMap&lt;&gt;();\n        for (Line l : lines) t.merge(l.sku(), l.qty(), Integer::sum);\n        return t;\n    }\n    /** Take these SKUs&#x27; locks in sorted order: the one rule that makes a deadlock impossible. */\n    private List&lt;ReentrantLock&gt; lockInOrder(Set&lt;String&gt; sortedSkus) {\n        List&lt;ReentrantLock&gt; held = new ArrayList&lt;&gt;();\n        for (String sku : sortedSkus) { ReentrantLock l = locks.get(sku); l.lock(); held.add(l); }\n        return held;\n    }\n    /** Give the locks back, last taken first. */\n    private static void unlock(List&lt;ReentrantLock&gt; held) {\n        for (int i = held.size() - 1; i &gt;= 0; i--) held.get(i).unlock();\n    }\n}\n\n/**\n * Many stores on one platform (Harness&#x27;s &quot;design Shopify&quot;): each store has its own catalogue, stock and lock,\n * so two stores never wait for each other. Splitting by store is free, because stores never share stock.\n */\nfinal class Platform {\n    private final Map&lt;String, Store&gt; stores = new ConcurrentHashMap&lt;&gt;();\n\n    /** The store of one tenant, created on first use. */\n    Store store(String storeId) { return stores.computeIfAbsent(storeId, id -&gt; new Store()); }\n}\n\n// ---- ext: sold-out gate ------------------------------------------------------------------------------\n/**\n * A flash sale: a million buyers want the same 1,000 units. A counter in front of the store lets at most as\n * many buyers in as there are units, with a compare-and-set (write the new count only if it still holds the\n * value just read, as one hardware step). Everyone else hears &quot;sold out&quot; in about 50 ns and never touches the\n * lock. A buyer who got in but whose order dies unpaid gives the ticket back through the listener.\n */\nfinal class SoldOutGate implements StoreObserver {\n    private final String sku;\n    private final AtomicInteger tickets;\n\n    SoldOutGate(String sku, int units) { this.sku = sku; this.tickets = new AtomicInteger(units); }\n    /** Take one ticket if any is left. Never goes below zero, with no lock. */\n    boolean tryEnter() { return tickets.getAndUpdate(n -&gt; n &gt; 0 ? n - 1 : n) &gt; 0; }\n    /** Hand a ticket back: this buyer&#x27;s checkout failed, or his order died unpaid. */\n    void giveBack(int n) { tickets.addAndGet(n); }\n    /** Tickets left. */\n    int left() { return tickets.get(); }\n    /** An order holding this SKU expired or was cancelled: its units are for sale again, so are its tickets. */\n    public void onEvent(StoreEvent e) {\n        if (!e.kind().equals(&quot;EXPIRED&quot;) &amp;&amp; !e.kind().equals(&quot;CANCELLED&quot;)) return;\n        for (Line l : e.lines()) if (l.sku().equals(sku)) giveBack(l.qty());\n    }\n}\n\n// ---- ext: background sweeper -------------------------------------------------------------------------\n/**\n * Every store method already ends the holds that are due before it runs, so a busy store needs no thread for\n * it. A quiet store might go ten minutes without a call; this job calls sweepExpired every second so the stock\n * and the &quot;your order expired&quot; messages never wait for the next buyer. One daemon thread.\n */\nfinal class HoldSweeper implements AutoCloseable {\n    private final ScheduledExecutorService timer = Executors.newSingleThreadScheduledExecutor(r -&gt; {\n        Thread t = new Thread(r, &quot;hold-sweeper&quot;);\n        t.setDaemon(true);\n        return t;\n    });\n    final AtomicInteger ended = new AtomicInteger();\n\n    /** Start sweeping this store every periodMs. */\n    HoldSweeper(Store store, long periodMs) {\n        timer.scheduleWithFixedDelay(() -&gt; {\n            try { ended.addAndGet(store.sweepExpired()); }\n            catch (RuntimeException e) { System.err.println(&quot;[sweeper] &quot; + e.getMessage()); }   // a task that throws is never run again\n        }, periodMs, periodMs, TimeUnit.MILLISECONDS);\n    }\n    /** Stop the job. */\n    public void close() { timer.shutdownNow(); }\n}\n\n// ---- ext: back in stock ------------------------------------------------------------------------------\n/**\n * &quot;Notify me when it is back&quot;: buyers who watch a sold-out SKU are told once, when units come back, whether\n * from a restock, an expired hold or a cancelled order. A listener, so the store does not change. It reads the\n * store again (listeners run after the unlock, so that is safe), and remove() on the watch list is atomic, so\n * two events racing each other tell a buyer once, not twice.\n */\nfinal class BackInStockAlerts implements StoreObserver {\n    private final Store store;\n    private final Map&lt;String, Set&lt;String&gt;&gt; watchers = new ConcurrentHashMap&lt;&gt;();   // SKU -&gt; buyers waiting\n    final List&lt;String&gt; sent = new CopyOnWriteArrayList&lt;&gt;();\n\n    BackInStockAlerts(Store store) { this.store = store; }\n    /** A buyer asks to be told when this SKU is back. */\n    void watch(String userId, String sku) { watchers.computeIfAbsent(sku, k -&gt; ConcurrentHashMap.newKeySet()).add(userId); }\n    /** Units came back to some SKUs: tell their watchers once, and forget them. */\n    public void onEvent(StoreEvent e) {\n        if (!Set.of(&quot;RESTOCKED&quot;, &quot;EXPIRED&quot;, &quot;CANCELLED&quot;).contains(e.kind())) return;\n        for (Line l : e.lines()) {\n            if (!watchers.containsKey(l.sku()) || store.getInventory(l.sku()) == 0) continue;\n            Set&lt;String&gt; waiting = watchers.remove(l.sku());          // atomic: only one event gets the list\n            if (waiting != null) for (String u : waiting) sent.add(u + &quot;: &quot; + l.sku() + &quot; is back&quot;);\n        }\n    }\n}\n\n/**\n * Listeners run after the unlock, so two threads can deliver one order&#x27;s events in the wrong order: the SMS\n * would say &quot;cancelled&quot;, then &quot;confirmed&quot;. Every event carries a number taken under the lock; this wrapper\n * passes an order&#x27;s event on only when it is newer than the last one it passed for that order. compute() runs\n * one order&#x27;s check-and-send as one step, so two events of the same order can never cross inside it.\n */\nfinal class LatestOnly implements StoreObserver {\n    private final StoreObserver inner;\n    private final Map&lt;String, Long&gt; lastSeen = new ConcurrentHashMap&lt;&gt;();   // order id -&gt; newest event number passed on\n\n    LatestOnly(StoreObserver inner) { this.inner = inner; }\n    /** Pass on a newer event; drop an older one. Restocks have no order and always pass. */\n    public void onEvent(StoreEvent e) {\n        if (e.orderId() == null) { inner.onEvent(e); return; }\n        lastSeen.compute(e.orderId(), (id, last) -&gt; {\n            if (last != null &amp;&amp; last &gt; e.seq()) return last;                  // older than what was sent: drop it\n            inner.onEvent(e);\n            return e.seq();\n        });\n    }\n}\n\n// ---- ext: warehouses ---------------------------------------------------------------------------------\n/** A warehouse or a seller&#x27;s site: an id, the pincodes it delivers to, and a rank (lower = nearer, preferred). */\nrecord Site(String id, Set&lt;String&gt; pincodes, int rank) {}\n\n/** The answer to &quot;who ships this?&quot;: a plan (site -&gt; SKU -&gt; units), or the reason nothing can ship. */\nrecord Allocation(Map&lt;String, Map&lt;String, Integer&gt;&gt; plan, String refusal) {\n    /** True when there is a plan. */\n    boolean ok() { return plan != null; }\n    /** Printed as the plan, or the refusal. */\n    public String toString() { return ok() ? plan.toString() : refusal; }\n}\n\n/**\n * Which site ships which units. Behind an interface because it changes: nearest first, cheapest shipping,\n * one parcel whenever possible. Returns site -&gt; (SKU -&gt; qty), or null when the order cannot be filled.\n */\ninterface AllocationRule {\n    Map&lt;String, Map&lt;String, Integer&gt;&gt; plan(Map&lt;String, Integer&gt; wanted, String pincode, List&lt;Site&gt; sites, SiteStock stock);\n}\n\n/**\n * The stock of every SKU at every site, under one lock, so &quot;plan and reserve&quot; is one step: two buyers can\n * never both be promised the last unit at the Pune warehouse.\n */\nfinal class SiteStock {\n    private final Map&lt;String, Map&lt;String, Integer&gt;&gt; counts = new HashMap&lt;&gt;();   // site -&gt; SKU -&gt; units\n    private final List&lt;Site&gt; sites = new ArrayList&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n\n    /** Add a site with its starting counts. Setup only. */\n    void addSite(Site s, Map&lt;String, Integer&gt; skus) { sites.add(s); counts.put(s.id(), new HashMap&lt;&gt;(skus)); }\n    /** Units of a SKU at a site; the caller holds the lock, or it is setup. */\n    int at(String siteId, String sku) { return counts.get(siteId).getOrDefault(sku, 0); }\n    /**\n     * Plan with the rule and reserve the plan, under one lock. The refusals are the answers the multi-seller\n     * version of the task expects: &quot;pincode unserviceable&quot; and &quot;insufficient product inventory&quot;.\n     */\n    Allocation reserve(Map&lt;String, Integer&gt; wanted, String pincode, AllocationRule rule) {\n        lock.lock();\n        try {\n            if (sites.stream().noneMatch(s -&gt; s.pincodes().contains(pincode))) return new Allocation(null, &quot;pincode unserviceable&quot;);\n            Map&lt;String, Map&lt;String, Integer&gt;&gt; plan = rule.plan(wanted, pincode, sites, this);\n            if (plan == null) return new Allocation(null, &quot;insufficient product inventory&quot;);\n            plan.forEach((site, skus) -&gt; skus.forEach((sku, n) -&gt; counts.get(site).merge(sku, -n, Integer::sum)));\n            return new Allocation(plan, null);\n        } finally { lock.unlock(); }\n    }\n}\n\n/**\n * One parcel when a single site can send everything, nearest site first; otherwise split the order across the\n * sites that deliver to that pincode, nearest first. null when even all of them together are short.\n */\nfinal class OneSiteElseSplit implements AllocationRule {\n    /** The plan, or null. Reads only; SiteStock.reserve applies it. */\n    public Map&lt;String, Map&lt;String, Integer&gt;&gt; plan(Map&lt;String, Integer&gt; wanted, String pincode, List&lt;Site&gt; sites, SiteStock stock) {\n        List&lt;Site&gt; serving = new ArrayList&lt;&gt;();\n        for (Site s : sites) if (s.pincodes().contains(pincode)) serving.add(s);\n        serving.sort(Comparator.comparingInt(Site::rank));\n        for (Site s : serving) {                                          // 1. one parcel, from the nearest site that has it all\n            boolean all = true;\n            for (Map.Entry&lt;String, Integer&gt; w : wanted.entrySet()) all &amp;= stock.at(s.id(), w.getKey()) &gt;= w.getValue();\n            if (all) return Map.of(s.id(), new TreeMap&lt;&gt;(wanted));\n        }\n        Map&lt;String, Map&lt;String, Integer&gt;&gt; plan = new TreeMap&lt;&gt;();         // 2. split, nearest first\n        for (Map.Entry&lt;String, Integer&gt; w : new TreeMap&lt;&gt;(wanted).entrySet()) {\n            int need = w.getValue();\n            for (Site s : serving) {\n                int take = Math.min(need, stock.at(s.id(), w.getKey()));\n                if (take &gt; 0) { plan.computeIfAbsent(s.id(), k -&gt; new TreeMap&lt;&gt;()).put(w.getKey(), take); need -= take; }\n                if (need == 0) break;\n            }\n            if (need &gt; 0) return null;\n        }\n        return plan;\n    }\n}\n\n// ---- ext: external seller ----------------------------------------------------------------------------\n/**\n * PhonePe&#x27;s twist: some items belong to an external seller, and his stock is reached only through his API.\n * Every call carries our order id, so a retried call is applied once, and release is safe to repeat.\n */\ninterface SellerApi {\n    /** Units he says are available. */\n    int available(String sku);\n    /** Block these lines for our order id; true = blocked. May time out. */\n    boolean reserve(String orderId, Map&lt;String, Integer&gt; lines);\n    /** Our order was paid: his blocked units are sold. */\n    void confirm(String orderId);\n    /** Our order died: give his block back. Does nothing when there is no block. */\n    void release(String orderId);\n}\n\n/**\n * Where an order&#x27;s stock comes from: our own warehouse or a seller&#x27;s API. The store would pick the source by\n * the order&#x27;s seller; every line of one order comes from one seller (PhonePe&#x27;s rule), so no order ever needs\n * all-or-nothing across two sources.\n */\ninterface StockSource {\n    /** Block the lines for this order id, all or none. */\n    boolean reserve(String orderId, Map&lt;String, Integer&gt; lines);\n    /** The order was paid. */\n    void confirm(String orderId);\n    /** The order died unpaid. */\n    void release(String orderId);\n}\n\n/**\n * The external seller behind our StockSource. His reserve is a network call, so it must never run under the\n * store&#x27;s lock; it runs before the order is written, like the bank&#x27;s charge. A timeout means we do not know\n * whether he blocked anything, so we release by order id, which is safe either way, and refuse the order.\n */\nfinal class ExternalSellerStock implements StockSource {\n    private final SellerApi api;\n    final List&lt;String&gt; releasesToRetry = new CopyOnWriteArrayList&lt;&gt;();\n\n    ExternalSellerStock(SellerApi api) { this.api = api; }\n    /** Ask the seller; a timeout is treated as &quot;no&quot; and undone by order id. */\n    public boolean reserve(String orderId, Map&lt;String, Integer&gt; lines) {\n        try { return api.reserve(orderId, lines); }\n        catch (RuntimeException timeout) { release(orderId); return false; }\n    }\n    /** Tell the seller the order was paid. */\n    public void confirm(String orderId) { api.confirm(orderId); }\n    /** Give the seller&#x27;s block back; a failed call is kept for a retry. */\n    public void release(String orderId) {\n        try { api.release(orderId); } catch (RuntimeException e) { releasesToRetry.add(orderId); }\n    }\n}\n\n/** A seller&#x27;s API in memory, keyed by our order id, that can be told to time out AFTER blocking, once. */\nfinal class FakeSeller implements SellerApi {\n    private final Map&lt;String, Integer&gt; stock = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Map&lt;String, Integer&gt;&gt; blocks = new ConcurrentHashMap&lt;&gt;();\n    volatile boolean timeoutAfterBlockOnce;\n\n    FakeSeller(Map&lt;String, Integer&gt; start) { stock.putAll(start); }\n    /** Units free at the seller. */\n    public int available(String sku) { return stock.getOrDefault(sku, 0); }\n    /** Block once per order id; a repeat is a no-op that answers true. */\n    public synchronized boolean reserve(String orderId, Map&lt;String, Integer&gt; lines) {\n        if (blocks.containsKey(orderId)) return true;\n        for (Map.Entry&lt;String, Integer&gt; l : lines.entrySet()) if (available(l.getKey()) &lt; l.getValue()) return false;\n        lines.forEach((sku, n) -&gt; stock.merge(sku, -n, Integer::sum));\n        blocks.put(orderId, Map.copyOf(lines));\n        if (timeoutAfterBlockOnce) { timeoutAfterBlockOnce = false; throw new RuntimeException(&quot;seller API timed out&quot;); }\n        return true;\n    }\n    /** The block becomes a sale. */\n    public synchronized void confirm(String orderId) { blocks.remove(orderId); }\n    /** Give a block back; nothing when there is none. */\n    public synchronized void release(String orderId) {\n        Map&lt;String, Integer&gt; b = blocks.remove(orderId);\n        if (b != null) b.forEach((sku, n) -&gt; stock.merge(sku, n, Integer::sum));\n    }\n}\n\n// ---- ext: persistence --------------------------------------------------------------------------------\n/**\n * The same design on a database, for many machines. The lock becomes the row: a reserve is ONE conditional\n * UPDATE that succeeds only while enough units are available, so the database decides the winner. The hold is\n * the order row&#x27;s status plus hold_until, and the idempotency key is a UNIQUE index, so a retried INSERT fails\n * and the retry reads the order it already made. Redis does the same with a script that checks and takes in\n * one step, plus a key that expires, for &quot;lock 10 pens for five minutes&quot;.\n */\nfinal class Sql {\n    static final String SCHEMA = &quot;&quot;&quot;\n        CREATE TABLE stock  (sku TEXT PRIMARY KEY, available INT NOT NULL CHECK (available &gt;= 0),\n                             reserved INT NOT NULL CHECK (reserved &gt;= 0), sold INT NOT NULL);\n        CREATE TABLE orders (id TEXT PRIMARY KEY, user_id TEXT NOT NULL, idem_key TEXT NOT NULL,\n                             status TEXT NOT NULL, total_paise BIGINT NOT NULL, hold_until TIMESTAMP NOT NULL,\n                             UNIQUE (user_id, idem_key));\n        CREATE TABLE order_lines (order_id TEXT, sku TEXT, qty INT, unit_paise BIGINT, PRIMARY KEY (order_id, sku));\n        CREATE INDEX pending_by_hold ON orders (hold_until) WHERE status = &#x27;PENDING_PAYMENT&#x27;;&quot;&quot;&quot;;\n    /** One line of a reserve: 1 row updated = blocked; 0 rows = not enough left (another buyer got there). */\n    static final String RESERVE = &quot;UPDATE stock SET available = available - ?, reserved = reserved + ? WHERE sku = ? AND available &gt;= ?&quot;;\n    /** The sweeper: end holds that are due, and learn which ones, so their lines can be released in the same transaction. */\n    static final String EXPIRE = &quot;UPDATE orders SET status = &#x27;EXPIRED&#x27; WHERE status = &#x27;PENDING_PAYMENT&#x27; AND hold_until &lt;= now() RETURNING id&quot;;\n    /** Redis: check and take in one step; the hold key disappears by itself after five minutes. */\n    static final String REDIS_LUA = &quot;&quot;&quot;\n        if tonumber(redis.call(&#x27;GET&#x27;, KEYS[1])) &gt;= tonumber(ARGV[1]) then\n          redis.call(&#x27;DECRBY&#x27;, KEYS[1], ARGV[1]); redis.call(&#x27;SET&#x27;, KEYS[2], ARGV[1], &#x27;PX&#x27;, 300000); return 1\n        end\n        return 0&quot;&quot;&quot;;\n    private Sql() {}\n}\n\n/**\n * The stock table in memory, with the database&#x27;s guarantee: each row update is atomic\n * (ConcurrentHashMap.compute runs it as one step for that key). A multi-line reserve takes the rows in SKU\n * order, as a transaction would lock them, and undoes the lines already taken if a later one gets 0 rows,\n * which is what ROLLBACK does for you in a real database. One difference: here another caller can see those\n * lines in between and be refused; a database keeps the rows locked until COMMIT, so that caller waits instead.\n */\nfinal class StockTable {\n    private final Map&lt;String, int[]&gt; rows = new ConcurrentHashMap&lt;&gt;();   // sku -&gt; {available, reserved, sold}\n\n    /** INSERT one row. */\n    void insert(String sku, int available) { rows.put(sku, new int[] { available, 0, 0 }); }\n    /** The RESERVE statement for one line: true when exactly one row was updated. */\n    boolean reserveRow(String sku, int qty) {\n        boolean[] updated = { false };\n        rows.computeIfPresent(sku, (k, r) -&gt; {\n            if (r[0] &lt; qty) return r;                         // WHERE available &gt;= ? failed: 0 rows\n            updated[0] = true;\n            return new int[] { r[0] - qty, r[1] + qty, r[2] };\n        });\n        return updated[0];\n    }\n    /** Give one line&#x27;s block back. */\n    void releaseRow(String sku, int qty) { rows.computeIfPresent(sku, (k, r) -&gt; new int[] { r[0] + qty, r[1] - qty, r[2] }); }\n    /** Every line or none: rows in SKU order; on a 0-row line, undo the earlier ones (the ROLLBACK). */\n    boolean reserveAll(Map&lt;String, Integer&gt; lines) {\n        List&lt;Map.Entry&lt;String, Integer&gt;&gt; done = new ArrayList&lt;&gt;();\n        for (Map.Entry&lt;String, Integer&gt; l : new TreeMap&lt;&gt;(lines).entrySet()) {\n            if (!reserveRow(l.getKey(), l.getValue())) {\n                for (Map.Entry&lt;String, Integer&gt; d : done) releaseRow(d.getKey(), d.getValue());\n                return false;\n            }\n            done.add(l);\n        }\n        return true;\n    }\n    /** available of one row. */\n    int available(String sku) { return rows.get(sku)[0]; }\n    /** reserved of one row. */\n    int reserved(String sku) { return rows.get(sku)[1]; }\n}\n\n// ---- ext: client retry -------------------------------------------------------------------------------\n/** The network lost the reply: the call may or may not have reached the store. The one error worth retrying. */\nfinal class NetworkTimeout extends RuntimeException {\n    NetworkTimeout(String message) { super(message); }\n}\n\n/** How a retry waits. Handed in, so a test does not sleep. */\ninterface Sleeper { void sleep(long ms) throws InterruptedException; }\n\n/**\n * The client side of &quot;the same order arrives twice&quot;: it retries only a timeout, never a refusal (out of\n * stock will not fix itself), waits longer each time with random jitter (full jitter: a random wait between 0\n * and base x 2^attempt, capped), so a thousand phones do not retry in step, and sends the SAME idempotency key\n * every time, so a retry of a call that did reach the store returns the order it already made.\n */\nfinal class RetryingClient {\n    private final Sleeper sleeper;\n    private final Random random;\n    private final int attempts;\n    private final long baseMs, capMs;\n\n    RetryingClient(Sleeper sleeper, Random random, int attempts, long baseMs, long capMs) {\n        this.sleeper = sleeper; this.random = random; this.attempts = attempts; this.baseMs = baseMs; this.capMs = capMs;\n    }\n    /** Call until it answers, a timeout at a time; a refusal or the last timeout goes to the caller. */\n    &lt;T&gt; T call(Supplier&lt;T&gt; request) throws InterruptedException {\n        for (int attempt = 0; ; attempt++) {\n            try { return request.get(); }\n            catch (NetworkTimeout t) {\n                if (attempt + 1 &gt;= attempts) throw t;\n                long ceiling = attempt &gt;= 30 ? capMs : Math.min(capMs, baseMs &lt;&lt; attempt);   // no overflow on a long run\n                sleeper.sleep((long) (random.nextDouble() * ceiling));\n            }\n        }\n    }\n}\n\n/** A network that loses the store&#x27;s reply the first n times: the call REACHES the store, the answer does not come back. */\nfinal class LossyLink {\n    private final Store store;\n    private int losses;\n\n    LossyLink(Store store, int losses) { this.store = store; this.losses = losses; }\n    /** createOrder through the link. */\n    synchronized Order createOrder(String userId, String key, Map&lt;String, Integer&gt; wanted, String coupon) {\n        Order o = store.createOrder(userId, key, wanted, coupon);\n        if (losses-- &gt; 0) throw new NetworkTimeout(&quot;reply lost for &quot; + o.id);\n        return o;\n    }\n}\n\n// ---- ext: coupons from config ------------------------------------------------------------------------\n/**\n * Where a Factory finally pays: coupons that arrive as lines from an admin screen or a config file, so a new\n * campaign is data, not code. &quot;SAVE10|PERCENT|10|10000|1|1000&quot; = 10% off, up to Rs 100, once per buyer, 1,000\n * uses; &quot;FLAT100|FLAT|10000|99900|1|500&quot; = Rs 100 off above Rs 999.\n */\nfinal class CouponFactory {\n    /** One config line -&gt; one Coupon, or a clear error naming the line. */\n    static Coupon fromConfig(String line) {\n        String[] p = line.split(&quot;\\\\|&quot;);\n        if (p.length != 6) throw new IllegalArgumentException(&quot;bad coupon line: &quot; + line);\n        String code = p[0];\n        long a = Long.parseLong(p[2]), b = Long.parseLong(p[3]);\n        int perUser = Integer.parseInt(p[4]), total = Integer.parseInt(p[5]);\n        return switch (p[1]) {\n            case &quot;PERCENT&quot; -&gt; new Coupon(code, perUser, total, base -&gt; new PercentOff(base, code, (int) a, b));\n            case &quot;FLAT&quot; -&gt; new Coupon(code, perUser, total, base -&gt; new FlatOff(base, code, a, b));\n            default -&gt; throw new IllegalArgumentException(&quot;unknown coupon kind &quot; + p[1] + &quot; in &quot; + line);\n        };\n    }\n    private CouponFactory() {}\n}\n\n/** Runs every extension once, so the page&#x27;s follow-up code is code that has actually run. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        List&lt;Line&gt; cart = List.of(new Line(&quot;KURTI&quot;, 2, 499_00), new Line(&quot;PEN&quot;, 3, 20_00));\n\n        System.out.println(&quot;-- stacked rules: buy 2 get 1 on pens, then 10% (cap Rs 100), then Rs 100 off above Rs 999&quot;);\n        PricingRule stack = new FlatOff(new PercentOff(new BuyXGetY(new ListPrice(), &quot;PEN&quot;, 2, 1), &quot;SAVE10&quot;, 10, 100_00), &quot;FLAT100&quot;, 100_00, 999_00);\n        System.out.println(&quot;   &quot; + stack.price(cart));\n        PricingRule best = new BestOf(List.of(new PercentOff(new ListPrice(), &quot;P10&quot;, 10, 1_000_00), new PercentOff(new ListPrice(), &quot;P20&quot;, 20, 1_000_00)));\n        System.out.println(&quot;   P10 and P20 on one order, best only: &quot; + best.price(cart));\n\n        System.out.println(&quot;-- a lock per SKU, taken in SKU order&quot;);\n        StripedStock striped = new StripedStock();\n        striped.add(&quot;PEN&quot;, 10); striped.add(&quot;MUG&quot;, 5);\n        System.out.println(&quot;   {MUG:5, PEN:11} -&gt; &quot; + striped.reserveAll(List.of(new Line(&quot;MUG&quot;, 5, 0), new Line(&quot;PEN&quot;, 11, 0)))\n                           + &quot;, PEN &quot; + striped.view(&quot;PEN&quot;) + &quot;; {MUG:1, PEN:1} -&gt; &quot; + striped.reserveAll(List.of(new Line(&quot;PEN&quot;, 1, 0), new Line(&quot;MUG&quot;, 1, 0))));\n        Platform shopify = new Platform();\n        shopify.store(&quot;acme&quot;).addProduct(&quot;PEN&quot;, &quot;Blue pen&quot;, 20_00, 10);\n        shopify.store(&quot;zeta&quot;).addProduct(&quot;PEN&quot;, &quot;Red pen&quot;, 25_00, 2);\n        System.out.println(&quot;   two tenants, two locks: acme PEN &quot; + shopify.store(&quot;acme&quot;).getInventory(&quot;PEN&quot;) + &quot;, zeta PEN &quot; + shopify.store(&quot;zeta&quot;).getInventory(&quot;PEN&quot;));\n\n        System.out.println(&quot;-- the sold-out gate in front of a flash sale&quot;);\n        Store sale = Main.stocked();\n        SoldOutGate gate = new SoldOutGate(&quot;PEN&quot;, sale.getInventory(&quot;PEN&quot;));\n        sale.addObserver(gate);\n        int in = 0, turnedAway = 0;\n        for (int i = 0; i &lt; 1000; i++) {\n            if (!gate.tryEnter()) { turnedAway++; continue; }\n            sale.createOrder(&quot;fan&quot; + i, &quot;k&quot;, Map.of(&quot;PEN&quot;, 1), null);\n            in++;\n        }\n        System.out.println(&quot;   1000 buyers: &quot; + in + &quot; reached the store, &quot; + turnedAway + &quot; heard &#x27;sold out&#x27; without the lock; PEN &quot; + sale.stockOf(&quot;PEN&quot;));\n\n        System.out.println(&quot;-- the background sweeper ends holds even when nobody calls&quot;);\n        long[] now = { Main.at(10, 0) };\n        Store quiet = Main.stocked();\n        quiet.setClock(() -&gt; now[0]);\n        quiet.createOrder(&quot;ravi&quot;, &quot;r-1&quot;, Map.of(&quot;KURTI&quot;, 3), null);\n        now[0] = Main.at(10, 5);\n        try (HoldSweeper sweeper = new HoldSweeper(quiet, 20)) {\n            for (int i = 0; i &lt; 100 &amp;&amp; sweeper.ended.get() == 0; i++) Thread.sleep(10);\n            System.out.println(&quot;   holds ended by the job: &quot; + sweeper.ended.get() + &quot;; KURTI &quot; + quiet.stockOf(&quot;KURTI&quot;));\n        }\n\n        System.out.println(&quot;-- back in stock: told once, when a hold expires&quot;);\n        now[0] = Main.at(11, 0);\n        Order last = quiet.createOrder(&quot;ravi&quot;, &quot;r-2&quot;, Map.of(&quot;KURTI&quot;, 3), null);\n        BackInStockAlerts alerts = new BackInStockAlerts(quiet);\n        quiet.addObserver(alerts);\n        alerts.watch(&quot;meera&quot;, &quot;KURTI&quot;);\n        now[0] = Main.at(11, 6);\n        quiet.getInventory(&quot;KURTI&quot;);                       // any call sweeps; the listener hears EXPIRED\n        quiet.updateInventory(&quot;KURTI&quot;, 2);                 // a restock later does not tell her again\n        System.out.println(&quot;   &quot; + last.id + &quot; &quot; + last.status() + &quot;; alerts sent &quot; + alerts.sent);\n        List&lt;String&gt; texted = new ArrayList&lt;&gt;();\n        LatestOnly sms = new LatestOnly(e -&gt; texted.add(e.kind()));\n        sms.onEvent(new StoreEvent(&quot;CANCELLED&quot;, &quot;O9&quot;, &quot;asha&quot;, List.of(), 0, 7));   // event 7 is delivered first\n        sms.onEvent(new StoreEvent(&quot;CONFIRMED&quot;, &quot;O9&quot;, &quot;asha&quot;, List.of(), 0, 6));   // the older event 6 arrives late\n        System.out.println(&quot;   events 7 (CANCELLED) and then 6 (CONFIRMED) arrive; the SMS sends only &quot; + texted);\n\n        System.out.println(&quot;-- warehouses: one parcel when a site has it all, else split, nearest first&quot;);\n        SiteStock sites = new SiteStock();\n        sites.addSite(new Site(&quot;BLR-1&quot;, Set.of(&quot;560001&quot;, &quot;560034&quot;), 1), Map.of(&quot;PEN&quot;, 2, &quot;MUG&quot;, 1));\n        sites.addSite(new Site(&quot;BLR-2&quot;, Set.of(&quot;560034&quot;), 2), Map.of(&quot;PEN&quot;, 5, &quot;MUG&quot;, 5));\n        AllocationRule rule = new OneSiteElseSplit();\n        System.out.println(&quot;   560034 wants {PEN:1, MUG:1}: &quot; + sites.reserve(Map.of(&quot;PEN&quot;, 1, &quot;MUG&quot;, 1), &quot;560034&quot;, rule));\n        System.out.println(&quot;   560034 wants {PEN:6}: &quot; + sites.reserve(Map.of(&quot;PEN&quot;, 6), &quot;560034&quot;, rule) + &quot;  (split: no site has six)&quot;);\n        System.out.println(&quot;   560034 wants {PEN:1}: &quot; + sites.reserve(Map.of(&quot;PEN&quot;, 1), &quot;560034&quot;, rule));\n        System.out.println(&quot;   110001 wants {PEN:1}: &quot; + sites.reserve(Map.of(&quot;PEN&quot;, 1), &quot;110001&quot;, rule));\n\n        System.out.println(&quot;-- an external seller&#x27;s stock, reached through his API&quot;);\n        FakeSeller seller = new FakeSeller(Map.of(&quot;SAREE&quot;, 2));\n        ExternalSellerStock external = new ExternalSellerStock(seller);\n        System.out.println(&quot;   reserve O1: &quot; + external.reserve(&quot;O1&quot;, Map.of(&quot;SAREE&quot;, 1)) + &quot;, seller has &quot; + seller.available(&quot;SAREE&quot;) + &quot; left&quot;);\n        seller.timeoutAfterBlockOnce = true;\n        System.out.println(&quot;   reserve O2 times out: &quot; + external.reserve(&quot;O2&quot;, Map.of(&quot;SAREE&quot;, 1)) + &quot;, seller has &quot; + seller.available(&quot;SAREE&quot;) + &quot; left (the block was undone by order id)&quot;);\n\n        System.out.println(&quot;-- the database decides: a conditional UPDATE per line&quot;);\n        StockTable table = new StockTable();\n        table.insert(&quot;MUG&quot;, 1); table.insert(&quot;PEN&quot;, 10);\n        System.out.println(&quot;   {PEN:2, MUG:2}: &quot; + table.reserveAll(Map.of(&quot;PEN&quot;, 2, &quot;MUG&quot;, 2)) + &quot;; PEN available &quot; + table.available(&quot;PEN&quot;) + &quot; (rolled back)&quot;);\n        System.out.println(&quot;   {PEN:2, MUG:1}: &quot; + table.reserveAll(Map.of(&quot;PEN&quot;, 2, &quot;MUG&quot;, 1)) + &quot;; PEN available &quot; + table.available(&quot;PEN&quot;));\n        System.out.println(&quot;   &quot; + Sql.RESERVE);\n\n        System.out.println(&quot;-- the reply is lost twice; the client retries with the same key&quot;);\n        Store shop = Main.stocked();\n        LossyLink link = new LossyLink(shop, 2);\n        List&lt;Long&gt; waits = new ArrayList&lt;&gt;();\n        RetryingClient client = new RetryingClient(waits::add, new Random(7), 4, 100, 2_000);\n        Order o = client.call(() -&gt; link.createOrder(&quot;asha&quot;, &quot;tap-9&quot;, Map.of(&quot;MUG&quot;, 2), null));\n        System.out.println(&quot;   &quot; + o.id + &quot; after waits &quot; + waits + &quot; ms; MUG &quot; + shop.stockOf(&quot;MUG&quot;) + &quot; (blocked once); orders &quot; + shop.orderHistory(&quot;asha&quot;).size());\n\n        System.out.println(&quot;-- coupons from config lines&quot;);\n        Coupon save = CouponFactory.fromConfig(&quot;SAVE10|PERCENT|10|10000|1|1000&quot;);\n        Coupon flat = CouponFactory.fromConfig(&quot;FLAT100|FLAT|10000|99900|1|500&quot;);\n        List&lt;Line&gt; small = List.of(new Line(&quot;PEN&quot;, 3, 20_00));\n        System.out.println(&quot;   &quot; + save.code() + &quot;: &quot; + save.discount().apply(new ListPrice()).price(cart));\n        System.out.println(&quot;   &quot; + flat.code() + &quot; on a Rs 60 cart (below Rs 999, nothing off): &quot; + flat.discount().apply(new ListPrice()).price(small));\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n/**\n * Fifteen groups of claims the design makes, each proven by a few lines. Run it with\n * javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests\n * It prints ALL PASS, or every failure and a non-zero exit code.\n */\npublic class FailureTests {\n    static int failed = 0;\n\n    /** Record one claim. Prints ok or FAIL with the claim&#x27;s name. */\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? &quot;  ok   &quot; : &quot;  FAIL &quot;) + what);\n        if (!ok) failed++;\n    }\n\n    /** The page&#x27;s store (10 pens, 5 mugs, 3 kurtis, SAVE10 and FLAT100) on a clock the test moves, with this bank. */\n    static Store store(long[] now, PaymentGateway bank) {\n        Store s = Main.stocked();\n        s.configure(new ListPrice(), bank, Store.HOLD_MS);\n        s.setClock(() -&gt; now[0]);\n        return s;\n    }\n\n    /** Run n threads that all start at the same instant (one latch), and wait for all of them. */\n    static void race(int n, IntConsumerX body) throws InterruptedException {\n        CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(n);\n        for (int i = 0; i &lt; n; i++) {\n            final int k = i;\n            new Thread(() -&gt; {\n                try { go.await(); body.accept(k); }\n                catch (Exception e) { /* the body records its own outcome */ }\n                finally { done.countDown(); }\n            }).start();\n        }\n        go.countDown();\n        if (!done.await(30, TimeUnit.SECONDS)) check(false, &quot;a race did not finish in 30 s&quot;);\n    }\n    /** A thread body that may throw. */\n    interface IntConsumerX { void accept(int k) throws Exception; }\n\n    public static void main(String[] args) throws Exception {\n        // 1. the race: a hundred buyers, ten pens\n        System.out.println(&quot;1. a hundred buyers press Buy for ten pens at the same instant&quot;);\n        long[] now = { Main.at(10, 0) };\n        FakeGateway bank = new FakeGateway();\n        Store sale = store(now, bank);\n        List&lt;Order&gt; won = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        AtomicInteger soldOut = new AtomicInteger(), other = new AtomicInteger();\n        race(100, k -&gt; {\n            try { won.add(sale.createOrder(&quot;buyer&quot; + k, &quot;k&quot;, Map.of(&quot;PEN&quot;, 1), null)); }\n            catch (OrderRefused e) { if (e.reason == Reason.OUT_OF_STOCK) soldOut.incrementAndGet(); else other.incrementAndGet(); }\n        });\n        StockView pen = sale.stockOf(&quot;PEN&quot;);\n        check(won.size() == 10, &quot;exactly ten orders were placed&quot;);\n        check(soldOut.get() == 90 &amp;&amp; other.get() == 0, &quot;the other ninety were told OUT_OF_STOCK, and nothing else went wrong&quot;);\n        check(pen.available() == 0 &amp;&amp; pen.reserved() == 10 &amp;&amp; pen.sold() == 0, &quot;PEN: available 0, reserved 10; never below zero&quot;);\n        check(won.stream().map(o -&gt; o.id).distinct().count() == 10, &quot;ten different order ids&quot;);\n        List&lt;PayResult&gt; results = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        List&lt;Order&gt; winners = List.copyOf(won);\n        race(winners.size(), k -&gt; results.add(sale.confirmOrder(winners.get(k).id)));\n        check(results.size() == 10 &amp;&amp; results.stream().allMatch(r -&gt; r == PayResult.CONFIRMED), &quot;all ten pay at the same instant: all confirmed&quot;);\n        check(sale.stockOf(&quot;PEN&quot;).equals(new StockView(0, 0, 10)), &quot;PEN: sold 10, reserved 0&quot;);\n        check(bank.heldPaise() == 10 * 20_00, &quot;the bank holds exactly ten pens&#x27; money, Rs 200&quot;);\n\n        // 2. all or nothing\n        System.out.println(&quot;2. one order, one line short: nothing is blocked&quot;);\n        Store aon = store(now, new FakeGateway());\n        try { aon.createOrder(&quot;zoya&quot;, &quot;z1&quot;, Map.of(&quot;PEN&quot;, 2, &quot;MUG&quot;, 1, &quot;KURTI&quot;, 5), null); check(false, &quot;a short order was placed&quot;); }\n        catch (OrderRefused e) { check(e.reason == Reason.OUT_OF_STOCK &amp;&amp; e.getMessage().startsWith(&quot;KURTI&quot;), &quot;refused OUT_OF_STOCK, naming KURTI&quot;); }\n        check(aon.stockOf(&quot;PEN&quot;).equals(new StockView(10, 0, 0)) &amp;&amp; aon.stockOf(&quot;MUG&quot;).equals(new StockView(5, 0, 0)),\n              &quot;PEN and MUG are untouched, although they came before KURTI&quot;);\n        try { aon.createOrder(&quot;zoya&quot;, &quot;z2&quot;, Map.of(&quot;PEN&quot;, 1, &quot;SOCK&quot;, 1), null); check(false, &quot;an unknown product was ordered&quot;); }\n        catch (OrderRefused e) { check(e.reason == Reason.UNKNOWN_PRODUCT, &quot;an unknown SKU refuses the whole order&quot;); }\n        try { aon.createOrder(&quot;zoya&quot;, &quot;z3&quot;, Map.of(&quot;PEN&quot;, 0), null); check(false, &quot;zero pens were ordered&quot;); }\n        catch (OrderRefused e) { check(e.reason == Reason.BAD_QUANTITY, &quot;a quantity of 0 is refused&quot;); }\n        check(aon.orderHistory(&quot;zoya&quot;).isEmpty() &amp;&amp; aon.getInventory(&quot;PEN&quot;) == 10, &quot;a refusal leaves no order and no block behind&quot;);\n\n        // 3. the hold ends at exactly five minutes, with no thread\n        System.out.println(&quot;3. the hold ends at exactly five minutes, and nobody has to run a thread for it&quot;);\n        long[] t3 = { Main.at(10, 0) };\n        Store hold = store(t3, new FakeGateway());\n        Order held = hold.createOrder(&quot;ravi&quot;, &quot;r&quot;, Map.of(&quot;KURTI&quot;, 3), &quot;FLAT100&quot;);\n        t3[0] = Main.at(10, 5) - 1;\n        check(hold.getInventory(&quot;KURTI&quot;) == 0 &amp;&amp; hold.order(held.id).status() == OrderStatus.PENDING_PAYMENT,\n              &quot;at 10:04:59.999 all three kurtis are still held&quot;);\n        t3[0] = Main.at(10, 5);\n        check(hold.getInventory(&quot;KURTI&quot;) == 3, &quot;at 10:05:00.000 exactly, all three are back on sale&quot;);\n        check(held.status() == OrderStatus.EXPIRED, &quot;the order is EXPIRED&quot;);\n        check(hold.couponUses(&quot;FLAT100&quot;) == 0, &quot;its coupon use was given back&quot;);\n        check(hold.confirmOrder(held.id) == PayResult.REFUSED, &quot;paying an expired order is refused, and nothing is charged&quot;);\n\n        // 4. the money arrives after the hold ended, or after a cancel\n        System.out.println(&quot;4. the bank answers after the hold ended: refund, and the stock is not sold&quot;);\n        long[] t4 = { Main.at(10, 0) };\n        FakeGateway bank4 = new FakeGateway();\n        Store late = store(t4, bank4);\n        Order lo = late.createOrder(&quot;meera&quot;, &quot;m&quot;, Map.of(&quot;KURTI&quot;, 1), null);\n        late.configure(new ListPrice(), new PaymentGateway() {\n            public boolean charge(String id, long paise) { t4[0] = Main.at(10, 6); return bank4.charge(id, paise); }   // answers at 10:06\n            public void refund(String id) { bank4.refund(id); }\n        }, Store.HOLD_MS);\n        check(late.confirmOrder(lo.id) == PayResult.REFUNDED, &quot;the money arrived at 10:06, after the 10:05 end: REFUNDED&quot;);\n        check(bank4.charges.get() == 1 &amp;&amp; bank4.heldPaise() == 0, &quot;charged once and given back: the bank holds nothing&quot;);\n        check(late.stockOf(&quot;KURTI&quot;).equals(new StockView(3, 0, 0)) &amp;&amp; lo.status() == OrderStatus.EXPIRED,\n              &quot;the kurti was never sold; the order ended EXPIRED&quot;);\n        long[] t4b = { Main.at(12, 0) };\n        FakeGateway bank4b = new FakeGateway();\n        Store both = store(t4b, bank4b);\n        Order co = both.createOrder(&quot;asha&quot;, &quot;a&quot;, Map.of(&quot;MUG&quot;, 2), null);\n        both.configure(new ListPrice(), new PaymentGateway() {\n            public boolean charge(String id, long paise) { both.cancelOrder(id); return bank4b.charge(id, paise); }   // she cancels while the bank works\n            public void refund(String id) { bank4b.refund(id); }\n        }, Store.HOLD_MS);\n        check(both.confirmOrder(co.id) == PayResult.REFUNDED &amp;&amp; co.status() == OrderStatus.CANCELLED,\n              &quot;cancelled while the bank was working: the late money is refunded&quot;);\n        check(bank4b.heldPaise() == 0 &amp;&amp; both.stockOf(&quot;MUG&quot;).equals(new StockView(5, 0, 0)), &quot;no money kept, both mugs back on sale&quot;);\n\n        // 5. a declined card keeps the hold\n        System.out.println(&quot;5. a declined card: nothing moves, the hold keeps running, another card works&quot;);\n        long[] t5 = { Main.at(10, 0) };\n        FakeGateway bank5 = new FakeGateway();\n        AtomicInteger tries = new AtomicInteger();\n        Store dec = store(t5, new PaymentGateway() {\n            public boolean charge(String id, long paise) { return tries.incrementAndGet() &gt; 1 &amp;&amp; bank5.charge(id, paise); }   // first card declined\n            public void refund(String id) { bank5.refund(id); }\n        });\n        Order dO = dec.createOrder(&quot;asha&quot;, &quot;a&quot;, Map.of(&quot;MUG&quot;, 2), null);\n        check(dec.confirmOrder(dO.id) == PayResult.DECLINED &amp;&amp; dO.status() == OrderStatus.PENDING_PAYMENT, &quot;declined: still PENDING_PAYMENT&quot;);\n        check(dec.stockOf(&quot;MUG&quot;).equals(new StockView(3, 2, 0)) &amp;&amp; bank5.heldPaise() == 0, &quot;the two mugs stay blocked for her, no money moved&quot;);\n        t5[0] = Main.at(10, 4);\n        check(dec.confirmOrder(dO.id) == PayResult.CONFIRMED &amp;&amp; dec.stockOf(&quot;MUG&quot;).equals(new StockView(3, 0, 2)),\n              &quot;a second card at 10:04 confirms: two mugs sold&quot;);\n\n        // 6. twenty taps on Pay\n        System.out.println(&quot;6. twenty taps on Pay at once: one charge, one sale&quot;);\n        FakeGateway bank6 = new FakeGateway();\n        Store tap = store(new long[] { Main.at(10, 0) }, new PaymentGateway() {\n            public boolean charge(String id, long paise) {\n                try { Thread.sleep(5); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }   // a slow bank, so the taps overlap\n                return bank6.charge(id, paise);\n            }\n            public void refund(String id) { bank6.refund(id); }\n        });\n        Order tapped = tap.createOrder(&quot;asha&quot;, &quot;t&quot;, Map.of(&quot;MUG&quot;, 2), null);\n        List&lt;PayResult&gt; taps = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        race(20, k -&gt; taps.add(tap.confirmOrder(tapped.id)));\n        check(taps.size() == 20 &amp;&amp; taps.stream().allMatch(r -&gt; r == PayResult.CONFIRMED), &quot;all twenty taps answer CONFIRMED&quot;);\n        check(bank6.charges.get() == 1 &amp;&amp; bank6.heldPaise() == 2 * 299_00, &quot;the money moved once: the order id is the bank&#x27;s idempotency key&quot;);\n        check(tap.stockOf(&quot;MUG&quot;).equals(new StockView(3, 0, 2)), &quot;two mugs sold, not four&quot;);\n\n        // 7. the same request twice\n        System.out.println(&quot;7. the same createOrder twice, and twenty at once: one order, blocked once&quot;);\n        Store idem = store(new long[] { Main.at(10, 0) }, new FakeGateway());\n        Order first = idem.createOrder(&quot;asha&quot;, &quot;tap-1&quot;, Map.of(&quot;MUG&quot;, 2), null);\n        Order second = idem.createOrder(&quot;asha&quot;, &quot;tap-1&quot;, Map.of(&quot;MUG&quot;, 2), null);\n        check(first == second &amp;&amp; idem.stockOf(&quot;MUG&quot;).reserved() == 2, &quot;a retry with the same key returns the same order; two mugs blocked, not four&quot;);\n        List&lt;String&gt; ids = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        race(20, k -&gt; ids.add(idem.createOrder(&quot;ravi&quot;, &quot;tap-2&quot;, Map.of(&quot;MUG&quot;, 1), null).id));\n        check(ids.size() == 20 &amp;&amp; new HashSet&lt;&gt;(ids).size() == 1 &amp;&amp; idem.stockOf(&quot;MUG&quot;).reserved() == 3,\n              &quot;twenty copies of Ravi&#x27;s request at once: one order, one mug blocked&quot;);\n        check(!idem.createOrder(&quot;meera&quot;, &quot;tap-1&quot;, Map.of(&quot;MUG&quot;, 1), null).id.equals(first.id), &quot;a key belongs to one buyer: Meera&#x27;s tap-1 is a new order&quot;);\n        Order slash1 = idem.createOrder(&quot;a/b&quot;, &quot;c&quot;, Map.of(&quot;PEN&quot;, 1), null);\n        Order slash2 = idem.createOrder(&quot;a&quot;, &quot;b/c&quot;, Map.of(&quot;PEN&quot;, 1), null);\n        check(slash1 != slash2, &quot;buyer &#x27;a/b&#x27; with key &#x27;c&#x27; and buyer &#x27;a&#x27; with key &#x27;b/c&#x27; are two orders, not one&quot;);\n        idem.addToCart(&quot;zoya&quot;, &quot;PEN&quot;, 2);\n        Order zc = idem.checkout(&quot;zoya&quot;, &quot;c-1&quot;, null);\n        idem.addToCart(&quot;zoya&quot;, &quot;PEN&quot;, 1);                                   // she adds a pen after her first checkout went through\n        check(idem.checkout(&quot;zoya&quot;, &quot;c-1&quot;, null) == zc &amp;&amp; idem.viewCart(&quot;zoya&quot;).equals(Map.of(&quot;PEN&quot;, 1)),\n              &quot;a checkout retried after its cart was emptied returns the same order and leaves the new cart alone&quot;);\n\n        // 8. coupon limits under a race\n        System.out.println(&quot;8. a coupon for ten buyers, once each: exact under a race, given back by dead orders&quot;);\n        long[] t8 = { Main.at(10, 0) };\n        Store cp = store(t8, new FakeGateway());\n        cp.addProduct(&quot;SOAP&quot;, &quot;Soap&quot;, 100_00, 1000);\n        cp.addCoupon(new Coupon(&quot;FIRST10&quot;, 1, 10, base -&gt; new PercentOff(base, &quot;FIRST10&quot;, 50, 1_000_00)));\n        List&lt;Order&gt; withCoupon = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        AtomicInteger usedUp = new AtomicInteger();\n        race(50, k -&gt; {\n            try { withCoupon.add(cp.createOrder(&quot;u&quot; + k, &quot;k&quot;, Map.of(&quot;SOAP&quot;, 1), &quot;FIRST10&quot;)); }\n            catch (OrderRefused e) { if (e.reason == Reason.COUPON_USED_UP) usedUp.incrementAndGet(); }\n        });\n        check(withCoupon.size() == 10 &amp;&amp; usedUp.get() == 40 &amp;&amp; cp.couponUses(&quot;FIRST10&quot;) == 10, &quot;fifty buyers: exactly ten got it, forty were told COUPON_USED_UP&quot;);\n        check(cp.stockOf(&quot;SOAP&quot;).reserved() == 10, &quot;and the forty refusals blocked no soap&quot;);\n        Order winner = withCoupon.get(0);\n        for (Order o : withCoupon) if (o != winner) cp.confirmOrder(o.id);\n        try { cp.createOrder(winner.userId, &quot;again&quot;, Map.of(&quot;SOAP&quot;, 1), &quot;FIRST10&quot;); check(false, &quot;a buyer used FIRST10 twice&quot;); }\n        catch (OrderRefused e) { check(e.reason == Reason.COUPON_USED_UP, &quot;a winner cannot use it a second time&quot;); }\n        t8[0] = Main.at(10, 5);                                             // the one unpaid winner&#x27;s hold ends\n        check(cp.couponUses(&quot;FIRST10&quot;) == 9, &quot;the unpaid order expired and gave its use back: 9 claimed&quot;);\n        check(cp.createOrder(&quot;late-comer&quot;, &quot;k&quot;, Map.of(&quot;SOAP&quot;, 1), &quot;FIRST10&quot;).totalPaise() == 50_00, &quot;so one more buyer gets it, at half price&quot;);\n        try { cp.createOrder(&quot;tiny&quot;, &quot;k&quot;, Map.of(&quot;PEN&quot;, 1), &quot;FLAT100&quot;); check(false, &quot;FLAT100 applied to Rs 20&quot;); }\n        catch (OrderRefused e) { check(e.reason == Reason.COUPON_NOT_APPLICABLE &amp;&amp; cp.couponUses(&quot;FLAT100&quot;) == 0, &quot;FLAT100 on a Rs 20 order: refused, and no use spent&quot;); }\n        try { cp.createOrder(&quot;tiny&quot;, &quot;k2&quot;, Map.of(&quot;PEN&quot;, 1), &quot;NOPE&quot;); check(false, &quot;an unknown coupon applied&quot;); }\n        catch (OrderRefused e) { check(e.reason == Reason.UNKNOWN_COUPON, &quot;an unknown code is refused&quot;); }\n\n        // 9. cancel and fulfil\n        System.out.println(&quot;9. cancel before and after payment, twice, and after delivery&quot;);\n        FakeGateway bank9 = new FakeGateway();\n        Store cn = store(new long[] { Main.at(10, 0) }, bank9);\n        Order unpaid = cn.createOrder(&quot;asha&quot;, &quot;a1&quot;, Map.of(&quot;MUG&quot;, 2), null);\n        check(cn.cancelOrder(unpaid.id) == OrderStatus.CANCELLED &amp;&amp; cn.stockOf(&quot;MUG&quot;).equals(new StockView(5, 0, 0)), &quot;unpaid: the block is released&quot;);\n        check(cn.confirmOrder(unpaid.id) == PayResult.REFUSED &amp;&amp; bank9.charges.get() == 0, &quot;a cancelled order cannot be paid&quot;);\n        Order paid = cn.createOrder(&quot;asha&quot;, &quot;a2&quot;, Map.of(&quot;KURTI&quot;, 2), &quot;SAVE10&quot;);\n        cn.confirmOrder(paid.id);\n        check(cn.cancelOrder(paid.id) == OrderStatus.CANCELLED &amp;&amp; cn.stockOf(&quot;KURTI&quot;).equals(new StockView(3, 0, 0)), &quot;paid: both kurtis go back on sale&quot;);\n        check(bank9.heldPaise() == 0 &amp;&amp; cn.couponUses(&quot;SAVE10&quot;) == 0, &quot;the money and the coupon use come back&quot;);\n        check(cn.cancelOrder(paid.id) == OrderStatus.CANCELLED &amp;&amp; cn.stockOf(&quot;KURTI&quot;).equals(new StockView(3, 0, 0)), &quot;a second cancel changes nothing&quot;);\n        FakeGateway oldBank = new FakeGateway();\n        cn.configure(new ListPrice(), oldBank, Store.HOLD_MS);\n        Order switched = cn.createOrder(&quot;meera&quot;, &quot;m1&quot;, Map.of(&quot;MUG&quot;, 1), null);\n        cn.confirmOrder(switched.id);\n        cn.configure(new ListPrice(), bank9, Store.HOLD_MS);                // the shop moves to another bank\n        cn.cancelOrder(switched.id);\n        check(oldBank.heldPaise() == 0, &quot;the refund goes through the bank that took the money, not the one configured now&quot;);\n        Order delivered = cn.createOrder(&quot;ravi&quot;, &quot;r1&quot;, Map.of(&quot;PEN&quot;, 1), null);\n        try { cn.fulfilOrder(delivered.id); check(false, &quot;an unpaid order was delivered&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;an unpaid order cannot be marked fulfilled&quot;); }\n        cn.confirmOrder(delivered.id);\n        cn.fulfilOrder(delivered.id);\n        try { cn.cancelOrder(delivered.id); check(false, &quot;a delivered order was cancelled&quot;); }\n        catch (IllegalStateException e) { check(delivered.status() == OrderStatus.FULFILLED, &quot;a delivered order cannot be cancelled: that is a return&quot;); }\n\n        // 10. listeners\n        System.out.println(&quot;10. listeners run after the unlock, and a broken one cannot break an order&quot;);\n        Store ls = store(new long[] { Main.at(10, 0) }, new FakeGateway());\n        List&lt;String&gt; heard = new CopyOnWriteArrayList&lt;&gt;();\n        AtomicBoolean readWhileListening = new AtomicBoolean(false);\n        ls.addObserver(e -&gt; { throw new RuntimeException(&quot;the SMS provider is down&quot;); });\n        ls.addObserver(e -&gt; heard.add(e.kind()));\n        ls.addObserver(e -&gt; {                      // ask the store from ANOTHER thread: it would wait for ever if the lock were held\n            if (!e.kind().equals(&quot;CONFIRMED&quot;)) return;\n            FutureTask&lt;Integer&gt; read = new FutureTask&lt;&gt;(() -&gt; ls.getInventory(&quot;MUG&quot;));\n            new Thread(read).start();\n            try { read.get(2, TimeUnit.SECONDS); readWhileListening.set(true); } catch (Exception ex) { readWhileListening.set(false); }\n        });\n        Order lso = ls.createOrder(&quot;asha&quot;, &quot;a&quot;, Map.of(&quot;MUG&quot;, 1), null);\n        check(ls.confirmOrder(lso.id) == PayResult.CONFIRMED, &quot;a throwing listener did not stop the order&quot;);\n        check(heard.equals(List.of(&quot;CREATED&quot;, &quot;CONFIRMED&quot;)), &quot;the next listener heard both events, in order&quot;);\n        check(readWhileListening.get(), &quot;another thread read the stock while the listeners ran: the lock was free&quot;);\n        List&lt;Long&gt; seqs = new CopyOnWriteArrayList&lt;&gt;();\n        Store numbered = store(new long[] { Main.at(10, 0) }, new FakeGateway());\n        numbered.addObserver(e -&gt; seqs.add(e.seq()));\n        Order no = numbered.createOrder(&quot;asha&quot;, &quot;a&quot;, Map.of(&quot;MUG&quot;, 1), null);\n        numbered.confirmOrder(no.id);\n        numbered.cancelOrder(no.id);\n        check(seqs.size() == 3 &amp;&amp; seqs.get(0) &lt; seqs.get(1) &amp;&amp; seqs.get(1) &lt; seqs.get(2), &quot;events are numbered under the lock, in the order they happened&quot;);\n        List&lt;String&gt; texted = new ArrayList&lt;&gt;();\n        LatestOnly sms = new LatestOnly(e -&gt; texted.add(e.kind()));\n        sms.onEvent(new StoreEvent(&quot;CANCELLED&quot;, &quot;O9&quot;, &quot;asha&quot;, List.of(), 0, 7));   // the newer event arrives first\n        sms.onEvent(new StoreEvent(&quot;CONFIRMED&quot;, &quot;O9&quot;, &quot;asha&quot;, List.of(), 0, 6));\n        check(texted.equals(List.of(&quot;CANCELLED&quot;)), &quot;an older event that arrives late is dropped: she is never told &#x27;confirmed&#x27; after &#x27;cancelled&#x27;&quot;);\n\n        // 11. the bank times out\n        System.out.println(&quot;11. the bank times out: unknown, still pending; a retry charges once; no retry means a refund&quot;);\n        long[] t11 = { Main.at(10, 0) };\n        FakeGateway bank11 = new FakeGateway();\n        Set&lt;String&gt; timedOutOnce = ConcurrentHashMap.newKeySet();\n        Store to = store(t11, new PaymentGateway() {\n            public boolean charge(String id, long paise) {\n                bank11.charge(id, paise);                                  // the money moves...\n                if (timedOutOnce.add(id)) throw new RuntimeException(&quot;gateway timeout&quot;);   // ...but the first reply is lost\n                return true;\n            }\n            public void refund(String id) { bank11.refund(id); }\n        });\n        Order u1 = to.createOrder(&quot;asha&quot;, &quot;a&quot;, Map.of(&quot;MUG&quot;, 1), null);\n        check(to.confirmOrder(u1.id) == PayResult.UNKNOWN &amp;&amp; u1.status() == OrderStatus.PENDING_PAYMENT, &quot;first reply lost: UNKNOWN, still pending&quot;);\n        check(to.confirmOrder(u1.id) == PayResult.CONFIRMED &amp;&amp; bank11.charges.get() == 1, &quot;the retry confirms, and the money moved once&quot;);\n        Order u2 = to.createOrder(&quot;ravi&quot;, &quot;r&quot;, Map.of(&quot;MUG&quot;, 1), null);\n        check(to.confirmOrder(u2.id) == PayResult.UNKNOWN &amp;&amp; bank11.holds(u2.id), &quot;Ravi&#x27;s reply is lost too; the bank does hold his money&quot;);\n        t11[0] = Main.at(10, 5);\n        to.getInventory(&quot;MUG&quot;);                                            // any call sweeps\n        check(u2.status() == OrderStatus.EXPIRED &amp;&amp; !bank11.holds(u2.id), &quot;nobody retried: when his hold ended, the store refunded by order id&quot;);\n        check(to.stockOf(&quot;MUG&quot;).equals(new StockView(4, 0, 1)), &quot;one mug sold (Asha&#x27;s), Ravi&#x27;s back on sale&quot;);\n\n        // 12. a refund that fails is kept\n        System.out.println(&quot;12. a refund call that fails is kept for a retry, never forgotten&quot;);\n        FakeGateway bank12 = new FakeGateway();\n        Store rf = store(new long[] { Main.at(10, 0) }, new PaymentGateway() {\n            public boolean charge(String id, long paise) { return bank12.charge(id, paise); }\n            public void refund(String id) { throw new RuntimeException(&quot;the bank is down&quot;); }\n        });\n        Order ro = rf.createOrder(&quot;asha&quot;, &quot;a&quot;, Map.of(&quot;MUG&quot;, 1), null);\n        rf.confirmOrder(ro.id);\n        check(rf.cancelOrder(ro.id) == OrderStatus.CANCELLED &amp;&amp; rf.getInventory(&quot;MUG&quot;) == 5, &quot;the cancel still happens: the mug is back on sale&quot;);\n        check(rf.refundsToRetry().equals(List.of(ro.id)), &quot;and the order id waits on the retry list&quot;);\n\n        // 13. money and units add up, after a random mix on eight threads\n        System.out.println(&quot;13. a random mix on eight threads: every unit is in one bucket, and the money matches the orders&quot;);\n        AtomicLong clock = new AtomicLong(Main.at(10, 0));\n        FakeGateway bank13 = new FakeGateway();\n        Store mix = Main.stocked();\n        mix.configure(new ListPrice(), bank13, Store.HOLD_MS);\n        mix.setClock(clock::get);\n        Map&lt;String, Integer&gt; received = new ConcurrentHashMap&lt;&gt;(Map.of(&quot;PEN&quot;, 10, &quot;MUG&quot;, 5, &quot;KURTI&quot;, 3));\n        String[] skus = { &quot;PEN&quot;, &quot;MUG&quot;, &quot;KURTI&quot; };\n        race(8, k -&gt; {\n            Random rnd = new Random(k);\n            for (int i = 0; i &lt; 400; i++) {\n                clock.addAndGet(700);                                      // time moves, so some holds end mid-run\n                String user = &quot;t&quot; + k + &quot;u&quot; + (i % 7);\n                try {\n                    Map&lt;String, Integer&gt; want = new HashMap&lt;&gt;();\n                    want.put(skus[rnd.nextInt(3)], 1 + rnd.nextInt(2));\n                    if (rnd.nextBoolean()) want.put(skus[rnd.nextInt(3)], 1);\n                    Order o = mix.createOrder(user, &quot;k&quot; + i, want, null);\n                    int roll = rnd.nextInt(10);\n                    if (roll &lt; 6) mix.confirmOrder(o.id);\n                    if (roll == 6) mix.cancelOrder(o.id);\n                    if (roll == 7) { mix.confirmOrder(o.id); mix.cancelOrder(o.id); }\n                    if (roll == 8 &amp;&amp; mix.confirmOrder(o.id) == PayResult.CONFIRMED) mix.fulfilOrder(o.id);\n                } catch (OrderRefused e) { /* out of stock is a normal answer */ }\n                if (rnd.nextInt(20) == 0) { String s = skus[rnd.nextInt(3)]; mix.updateInventory(s, 2); received.merge(s, 2, Integer::sum); }\n            }\n        });\n        clock.addAndGet(Store.HOLD_MS);\n        mix.sweepExpired();\n        long owed = 0;\n        Map&lt;String, Integer&gt; soldBy = new HashMap&lt;&gt;();\n        for (int k = 0; k &lt; 8; k++)\n            for (int u = 0; u &lt; 7; u++)\n                for (Order o : mix.orderHistory(&quot;t&quot; + k + &quot;u&quot; + u))\n                    if (o.status() == OrderStatus.CONFIRMED || o.status() == OrderStatus.FULFILLED) {\n                        owed += o.totalPaise();\n                        for (Line l : o.lines) soldBy.merge(l.sku(), l.qty(), Integer::sum);\n                    }\n        boolean units = true, sold = true;\n        for (String s : skus) {\n            StockView v = mix.stockOf(s);\n            units &amp;= v.available() + v.reserved() + v.sold() == received.get(s) &amp;&amp; v.reserved() == 0 &amp;&amp; v.available() &gt;= 0;\n            sold &amp;= v.sold() == soldBy.getOrDefault(s, 0);\n        }\n        check(units, &quot;for every SKU: available + reserved + sold = units received, and nothing is left reserved&quot;);\n        check(sold, &quot;sold units = the units of confirmed and delivered orders&quot;);\n        check(bank13.heldPaise() == owed, &quot;the bank holds exactly the totals of confirmed and delivered orders (&quot; + Main.rs(owed) + &quot;)&quot;);\n\n        // 14. the cart blocks nothing; the seller cannot take back promised units\n        System.out.println(&quot;14. the cart blocks nothing; checkout decides; a seller cannot take back blocked units&quot;);\n        Store cs = store(new long[] { Main.at(10, 0) }, new FakeGateway());\n        cs.addToCart(&quot;asha&quot;, &quot;KURTI&quot;, 3);\n        cs.addToCart(&quot;ravi&quot;, &quot;KURTI&quot;, 3);\n        check(cs.getInventory(&quot;KURTI&quot;) == 3, &quot;two carts hold all three kurtis, and nothing is blocked&quot;);\n        check(cs.cartTotal(&quot;asha&quot;, &quot;SAVE10&quot;).totalPaise() == 1397_00, &quot;the cart total with SAVE10: Rs 1497 less the Rs 100 cap&quot;);\n        Order ac = cs.checkout(&quot;asha&quot;, &quot;a&quot;, &quot;SAVE10&quot;);\n        check(ac.totalPaise() == 1397_00, &quot;checkout charges what the cart showed&quot;);\n        try { cs.checkout(&quot;ravi&quot;, &quot;r&quot;, null); check(false, &quot;the kurtis were sold twice&quot;); }\n        catch (OrderRefused e) { check(e.reason == Reason.OUT_OF_STOCK, &quot;checkout decides: Ravi is told OUT_OF_STOCK&quot;); }\n        check(cs.viewCart(&quot;asha&quot;).isEmpty() &amp;&amp; cs.viewCart(&quot;ravi&quot;).equals(Map.of(&quot;KURTI&quot;, 3)), &quot;Asha&#x27;s cart is empty; Ravi&#x27;s refusal left his cart as it was&quot;);\n        try { cs.addToCart(&quot;zoya&quot;, &quot;KURTI&quot;, 1); check(false, &quot;a kurti went into a cart with none available&quot;); }\n        catch (OrderRefused e) { check(e.reason == Reason.OUT_OF_STOCK, &quot;adding what is not available is refused, as advice&quot;); }\n        try { cs.updateInventory(&quot;KURTI&quot;, -1); check(false, &quot;a blocked kurti was taken back&quot;); }\n        catch (IllegalStateException e) { check(cs.stockOf(&quot;KURTI&quot;).equals(new StockView(0, 3, 0)), &quot;the seller cannot take back units a buyer has blocked&quot;); }\n        check(cs.updateInventory(&quot;PEN&quot;, -4) == 6, &quot;but can take back pens nobody has blocked&quot;);\n        try { new Stock(5).reserve(-1); check(false, &quot;a negative reserve was accepted&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;Stock refuses a move of -1 units instead of growing&quot;); }\n        cs.addToCart(&quot;zoya&quot;, &quot;PEN&quot;, 3);\n        try { cs.addToCart(&quot;zoya&quot;, &quot;PEN&quot;, Integer.MAX_VALUE); check(false, &quot;a cart overflowed&quot;); }\n        catch (OrderRefused e) { check(e.reason == Reason.OUT_OF_STOCK &amp;&amp; cs.viewCart(&quot;zoya&quot;).equals(Map.of(&quot;PEN&quot;, 3)), &quot;3 + a huge quantity cannot overflow the cart&#x27;s check&quot;); }\n\n        // 15. the follow-ups keep their own promises\n        System.out.println(&quot;15. the follow-ups keep their promises&quot;);\n        StripedStock striped = new StripedStock();\n        striped.add(&quot;PEN&quot;, 1_000); striped.add(&quot;MUG&quot;, 1_000);\n        AtomicInteger rounds = new AtomicInteger();\n        race(2, k -&gt; {\n            List&lt;Line&gt; order = k == 0 ? List.of(new Line(&quot;PEN&quot;, 1, 0), new Line(&quot;MUG&quot;, 1, 0)) : List.of(new Line(&quot;MUG&quot;, 1, 0), new Line(&quot;PEN&quot;, 1, 0));\n            for (int i = 0; i &lt; 20_000; i++) { if (striped.reserveAll(order)) striped.releaseAll(order); rounds.incrementAndGet(); }\n        });\n        check(rounds.get() == 40_000 &amp;&amp; striped.view(&quot;PEN&quot;).equals(new StockView(1_000, 0, 0)),\n              &quot;per-SKU locks: {PEN, MUG} and {MUG, PEN} 20,0

"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 20 us</text></g><g transform=\"translate(620 214)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">buyer 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 25 us</text></g><g transform=\"translate(738 214)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">buyer 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 30 us</text></g><g transform=\"translate(856 214)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">buyer 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 35 us</text></g><g transform=\"translate(974 214)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">buyer 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 40 us</text></g><g transform=\"translate(1092 214)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">buyer 100</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 495 us</text></g><text x=\"615\" y=\"282\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the hundredth buyer waits half a millisecond for the lock, then seconds for his bank: one by one is true, and nobody can tell</text></svg></div><div class=\"move\"><p>Inside the lock, an order of three lines does about twenty small things: three catalogue lookups, three count checks, six counter writes, two coupon counts, four map writes and one heap push. That is a few microseconds; measured on a busy laptop, allocation included, about five. Everything slow is outside: the bank (a second or two, between two short locked steps), the SMS (after the unlock), the buyer typing his OTP. So when a hundred buyers press Buy for the last ten pens in the same instant, they do go through one at a time. The hundredth waits about half a millisecond for the lock, then seconds for his bank like everybody else. One by one is true, and nobody can tell, as long as nothing slow gets inside.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock for the store: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">one order: checkout ~5 us + two pay sections ~3 us</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">+ a few stock reads and cart edits: ~12 us of lock</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">Meesho: 1M orders a day = 12 a second; a sale day 100x</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">1,200 orders a second x 12 us = 1.4% busy</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">the real limit: one process will not serve 10M users</text><text x=\"900\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 a lock per SKU</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">taken in SKU order: buyers of different products never wait</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 a sold-out gate for a hot SKU</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a compare-and-set counter says 'sold out' without the lock</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 the database decides</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE stock ... WHERE sku = ? AND available &gt;= ?   1 row = yours</text></g></svg></div><div class=\"move\"><p>Take Meesho's own numbers. A million orders a day is about twelve a second, and a sale day at a hundred times that is 1,200 a second. One order costs about twelve microseconds of lock: the order itself, the two short steps of the payment, a few stock reads and cart edits. 1,200 orders a second is then about fifteen milliseconds of lock in every second: 1.4% busy. The lock is not the limit. The limit is that ten million users will never be served by one process. Then name the ladder, in the order you would climb it. Rung one: a lock per SKU, always taken in SKU order, so buyers of different products never wait for each other. Rung two is for one product everybody wants in a flash sale (a sale that opens at a set minute with few units). A counter in front of the store says \"sold out\" with a compare-and-set, without touching the lock. A compare-and-set writes the new count only if it still holds the value just read, as one hardware step. Rung three: the database decides, with one conditional UPDATE per line, which is how many machines share one stock. Say the arithmetic first: climbing the ladder without it is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 385\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">100 buyers, 10 pens, one instant</text></g><path d=\"M350 36 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 18)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lock round check + write; test 1: 10 orders, 90 OUT_OF_STOCK, never below 0</text></g><g transform=\"translate(30 58)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one line of three is short</text></g><path d=\"M350 76 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 58)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check every line before writing any; test 2: PEN and MUG untouched</text></g><g transform=\"translate(30 98)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the buyer never pays</text></g><path d=\"M350 116 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 98)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a queue by hold end, swept on every call; test 3: held at 4:59.999, free at 5:00.000</text></g><g transform=\"translate(30 138)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the bank answers after the hold</text></g><path d=\"M350 156 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 138)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">re-check under the lock after the charge, refund; test 4: money back, nothing sold</text></g><g transform=\"translate(30 178)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the app retries; Pay tapped twice</text></g><path d=\"M350 196 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 178)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a key per request, the order id at the bank; tests 6, 7: one order, one charge</text></g><g transform=\"translate(30 218)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">50 buyers race for a 10-use coupon</text></g><path d=\"M350 236 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 218)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the use is claimed in the same step as the stock; test 8: exactly 10</text></g><g transform=\"translate(30 258)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the bank times out, nobody retries</text></g><path d=\"M350 276 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 258)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the order remembers the bank it charged: refund by id at its end; test 11</text></g><g transform=\"translate(30 298)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the SMS provider throws</text></g><path d=\"M350 316 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 298)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">listeners after the unlock, in a try/catch; test 10: the order completes</text></g><text x=\"615\" y=\"352\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim on this page has a test: FailureTests.java runs fifteen groups of checks and must print ALL PASS</text><text x=\"615\" y=\"370\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">test 13 runs orders, payments, cancels and restocks on eight threads, then checks every unit and every paise</text></svg></div><div class=\"move\"><p>Each row of the table is a numbered group in FailureTests.java, which prints ALL PASS or exits non-zero. The race is the one worth writing in front of the interviewer. A hundred threads wait on one latch (a gate that opens for all of them at once). The test counts ten orders and ninety OUT_OF_STOCK, and checks the count never went below zero. Then all ten winners pay at once, and the bank holds exactly ten pens' money. The rows candidates forget are the money rows: a payment that lands after the hold ended, a reply that never came back, a refund call that fails. Test 13 then runs a random mix of orders, payments, cancels and restocks on eight threads with the clock moving. At the end it checks the two things that matter: every unit is available, reserved or sold, and the bank holds exactly what the confirmed orders cost.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"210\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"300\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"860\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"210\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface PricingRule { Quote price(List&lt;Line&gt; lines); }  handed in</text><text x=\"860\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a new offer is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"210\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">new PercentOff(new ListPrice(), \"SAVE10\", 10, 100_00)</text><text x=\"860\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">add a discount without copying one</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"210\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"300\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">StoreObserver.onEvent(e), called after the unlock</text><text x=\"860\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">the SMS hears; checkout never waits</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"210\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"300\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">NEXT: PENDING_PAYMENT -&gt; CONFIRMED | CANCELLED | EXPIRED</text><text x=\"860\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">an illegal move throws</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Idempotency key</text><text x=\"210\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 5</text><text x=\"300\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">byKey: user -&gt; key -&gt; order id;   bank.charge(orderId, paise)</text><text x=\"860\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">a retry is the same order and charge</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"210\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"300\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">a store per tenant; every test builds a fresh one</text><text x=\"860\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">no global to reset between tests</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"210\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"300\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">CouponFactory.fromConfig(\"SAVE10|PERCENT|10|10000|1|1000\")</text><text x=\"860\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">when coupons come from an admin screen</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"210\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"300\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">an order's fields are all required, set in one place</text><text x=\"860\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">a pattern without a move is decoration</text><text x=\"615\" y=\"310\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>The table is the answer; each name has one sentence behind it because a move produced it. Two rows need a word. The idempotency key is not in the Gang of Four book, but in an order system it is the most important pattern on the page. The key per request makes a retried order the same order, and the order id at the bank makes a retried payment the same charge. And the bottom three rows are the absences, worth saying out loud. There is no Singleton, because a store is handed to its callers and every test builds a fresh one. There is no Factory until coupons arrive as lines of config from an admin screen (that is <code>CouponFactory</code> in Extensions.java). There is no Builder, because an order's fields are all required and set in one place.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"560\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"560\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Stock: its counts. Cart: its items. CouponBook: its uses. Store: the flow + the lock.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">BuyXGetY and BestOf are new classes; Store was never opened</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">Quote plain = pricing.price(lines);   never \"is it the coupon one?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces, one job each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">PricingRule, Clock, StoreObserver: one method; PaymentGateway: charge + refund</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"560\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">store.configure(rule, lateBank, Store.HOLD_MS);   store.setClock(() -&gt; now[0])</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>SOLID is not a list to recite; it is the check that the moves did their job. Every letter is a line that already exists because a move produced it. So the honest answer to \"which SOLID principles did you apply?\" is \"move 2 gave me S, move 3 gave me O, L, I and D\". The one worth showing instead of claiming is D. Because the store depends on interfaces it is handed, a test hands it a bank that answers six minutes late and a clock it can move. The late-payment refund is then tested in ten lines, without sleeping.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">buy 2 get 1, nearest warehouse, longer hold</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind the existing interface + one configure line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">SMS, back in stock, a seller dashboard</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more listener; checkout does not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">SHIPPED, RETURN_REQUESTED, cash on delivery</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more state and a row in the table</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across items</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a combo: both SKUs or neither; 2 per buyer</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every check inside the SAME lock: all or nothing</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a restart; many machines</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the stock behind a repository; the check-and-block becomes</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE stock SET available = available - ? WHERE sku = ? AND available &gt;= ?</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"310\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five, Stock, Cart and the tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (buy two get one, which warehouse ships, a longer hold on sale days) is a new class behind an existing interface and one configure line. Several discounts at once are those classes wrapped round each other, and the order of wrapping is the answer. Someone new who wants to know (an SMS, a back-in-stock alert, a seller's dashboard) is one more listener; checkout does not change. A new step in a life (SHIPPED, RETURN_REQUESTED, cash on delivery) is a new state and a row in the table. A new invariant across items (a combo: both products or neither; at most two per buyer in a flash sale) is every check inside the same lock, all or nothing. And state that must outlive the process, or be shared by many machines, is the stock behind a repository (an interface with load and save). There the locked check-and-block becomes one conditional UPDATE: <code>UPDATE stock SET available = available - 2, reserved = reserved + 2 WHERE sku = 'PEN' AND available &gt;= 2</code>. One row updated means you got them; zero means someone else did. That is the database's compare-and-set, the same idea as the lock, one layer down. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 890\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M230 55.0L290 55.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"260.0\" y=\"50.0\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">calls</text><path d=\"M290 165L230 165.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"260.0\" y=\"160.0\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">per user</text><path d=\"M290 293L230 293.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M290 407L230 407.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"260.0\" y=\"402.0\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">notifies</text><path d=\"M120.0 460L120.0 434\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M120.0 770L120.0 744\" fill=\"none\" stroke-width=\"1.3\" stro "12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"135.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PaymentGateway</text><line x1=\"0\" y1=\"34\" x2=\"270\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">charge(orderId, paise): boolean</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">refund(orderId)</text></g><g transform=\"translate(940 520)\"><rect width=\"270\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"135.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FakeGateway</text><line x1=\"0\" y1=\"26\" x2=\"270\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">held: Map&lt;orderId, paise&gt;</text><line x1=\"0\" y1=\"48\" x2=\"270\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">charge: once per order id</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">refund: gives back what it holds</text></g><g transform=\"translate(940 640)\"><rect width=\"270\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"135.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"135.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Clock</text><line x1=\"0\" y1=\"34\" x2=\"270\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">nowMs(): long</text></g><g><path d=\"M20 862L64 862\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"866\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 862L284 862\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"866\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 862L504 862\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"866\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 862L684 862\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"866\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 862L904 862\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"866\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the store owns the carts, the coupon book, the inventory and the orders, and the inventory owns the catalogue and one Stock per SKU. Plain arrow = references or returns: an order points at its status, a line names a product, the store returns a PayResult. Dashed green = handed in through <code>configure()</code> and <code>setClock()</code>: the pricing rule, the bank and the clock. Dotted blue = notifies: the one call the store makes after it has released the lock. The arrows on the far right, from PercentOff and FlatOff back to PricingRule, are one rule wrapping another (Decorator). The boxes with no arrow are small values passed around: every listener gets a StoreEvent, a pricing rule returns a Quote, a Coupon lives in the coupon book, and a refusal carries a Reason. <b>Where state lives:</b> a Stock has its three counts; a cart its items; the coupon book its use counts; an order its status and the bank a charge was sent to. The store has all of them plus the idempotency keys, the order history, the queue of running holds, the event counter and the one lock. It is the only class that writes to more than one of them. On the next page this diagram is worth keeping in a second tab.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does and what it guarantees; read only those first for the shape, then the bodies. Start with <code>Store.place</code> and <code>Store.confirmOrder</code>, the two critical steps. Each copy button copies that whole file. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (fifteen groups, 92 checks, one group per claim; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n/**\n * A product in the catalogue: its SKU (stock keeping unit: the product&#x27;s id), its name, and its price in\n * paise (100 paise = one rupee), so money is always a whole number and never a double.\n */\nrecord Product(String sku, String name, long pricePaise) {}\n\n/**\n * One line of an order: how many of which SKU, at the price it had when the order was placed. The price is\n * copied in, so a later price change never alters an order that already exists.\n */\nrecord Line(String sku, int qty, long unitPaise) {\n    /** What this line costs before any discount. */\n    long paise() { return qty * unitPaise; }\n}\n\n/** A copy of one product&#x27;s three counts, for a screen or a test. */\nrecord StockView(int available, int reserved, int sold) {\n    /** Printed the way the page talks about it. */\n    public String toString() { return &quot;available &quot; + available + &quot;, reserved &quot; + reserved + &quot;, sold &quot; + sold; }\n}\n\n/**\n * The count of one product, split three ways: available (anyone may buy it), reserved (blocked for an order\n * that is waiting to be paid; Meesho calls this &quot;blocked&quot;) and sold. Every unit is in exactly one of the three,\n * so the sum changes only when a seller adds or removes units. Guarded by the store&#x27;s lock; every move that\n * would take a count below zero throws.\n */\nfinal class Stock {\n    private int available, reserved, sold;\n\n    Stock(int available) {\n        if (available &lt; 0) throw new IllegalArgumentException(&quot;stock of &quot; + available);\n        this.available = available;\n    }\n    /** Units anyone may buy right now. */\n    int available() { return available; }\n    /** The three counts, copied. */\n    StockView view() { return new StockView(available, reserved, sold); }\n    /** Block n units for an order: available -&gt; reserved. */\n    void reserve(int n) { need(n, available, &quot;reserve&quot;); available -= n; reserved += n; }\n    /** Give a block back (the order expired or was cancelled before payment): reserved -&gt; available. */\n    void release(int n) { need(n, reserved, &quot;release&quot;); reserved -= n; available += n; }\n    /** The order was paid: reserved -&gt; sold. */\n    void commit(int n) { need(n, reserved, &quot;commit&quot;); reserved -= n; sold += n; }\n    /** A paid order was cancelled before it shipped: sold -&gt; available. */\n    void putBack(int n) { need(n, sold, &quot;put back&quot;); sold -= n; available += n; }\n    /** A seller adds n units, or with a negative n takes back units that nobody has blocked or bought. */\n    void restock(int n) {\n        if (n &lt; 0) need(-n, available, &quot;take back&quot;);\n        else if ((long) available + n &gt; Integer.MAX_VALUE) throw new IllegalArgumentException(&quot;restock of &quot; + n + &quot; overflows&quot;);\n        available += n;\n    }\n    /** Refuse a move of n units out of a count that holds only have (n below zero is refused too). */\n    private static void need(int n, int have, String move) {\n        if (n &lt; 0 || n &gt; have) throw new IllegalStateException(&quot;stock would go negative: &quot; + move + &quot; &quot; + n + &quot; of &quot; + have);\n    }\n}\n\n/**\n * The catalogue and the stock of every product, keyed by SKU, so &quot;how many PEN are free?&quot; is one map lookup.\n * It knows the all-or-nothing rule for a list of lines. It has no lock of its own: the store&#x27;s lock guards it.\n */\nfinal class Inventory {\n    private final Map&lt;String, Product&gt; catalog = new HashMap&lt;&gt;();\n    private final Map&lt;String, Stock&gt; stock = new HashMap&lt;&gt;();\n\n    /** Add a new product with its starting count. A SKU that already exists is refused: restock it instead. */\n    void add(Product p, int qty) {\n        if (catalog.containsKey(p.sku())) throw new IllegalArgumentException(p.sku() + &quot; exists; use updateInventory&quot;);\n        catalog.put(p.sku(), p);\n        stock.put(p.sku(), new Stock(qty));\n    }\n    /** The product behind a SKU, or null. O(1). */\n    Product product(String sku) { return catalog.get(sku); }\n    /** The stock of a SKU. O(1). An unknown SKU is refused with the reason a caller can show. */\n    Stock stock(String sku) {\n        Stock s = stock.get(sku);\n        if (s == null) throw new OrderRefused(Reason.UNKNOWN_PRODUCT, &quot;no product &quot; + sku);\n        return s;\n    }\n    /**\n     * Turn &quot;these SKUs, these quantities&quot; into priced lines, in SKU order. An unknown SKU or a quantity below\n     * one is refused here, before anything is touched.\n     */\n    List&lt;Line&gt; price(Map&lt;String, Integer&gt; wanted) {\n        List&lt;Line&gt; lines = new ArrayList&lt;&gt;();\n        for (Map.Entry&lt;String, Integer&gt; w : new TreeMap&lt;&gt;(wanted).entrySet()) {\n            Product p = catalog.get(w.getKey());\n            if (p == null) throw new OrderRefused(Reason.UNKNOWN_PRODUCT, &quot;no product &quot; + w.getKey());\n            if (w.getValue() == null || w.getValue() &lt; 1) throw new OrderRefused(Reason.BAD_QUANTITY, w.getValue() + &quot; x &quot; + w.getKey());\n            lines.add(new Line(p.sku(), w.getValue(), p.pricePaise()));\n        }\n        return List.copyOf(lines);\n    }\n    /** The first line that cannot be blocked right now, or null when every line can. Reads only. */\n    Line firstShort(List&lt;Line&gt; lines) {\n        for (Line l : lines) if (stock(l.sku()).available() &lt; l.qty()) return l;\n        return null;\n    }\n    /** Block every line. The caller checked firstShort under the same lock, so none of these can fail. */\n    void reserveAll(List&lt;Line&gt; lines) { for (Line l : lines) stock(l.sku()).reserve(l.qty()); }\n    /** Give every line&#x27;s block back. */\n    void releaseAll(List&lt;Line&gt; lines) { for (Line l : lines) stock(l.sku()).release(l.qty()); }\n    /** Every line was paid for: reserved -&gt; sold. */\n    void commitAll(List&lt;Line&gt; lines) { for (Line l : lines) stock(l.sku()).commit(l.qty()); }\n    /** Every line of a paid order that was cancelled goes back on sale: sold -&gt; available. */\n    void putBackAll(List&lt;Line&gt; lines) { for (Line l : lines) stock(l.sku()).putBack(l.qty()); }\n}\n\n/**\n * A buyer&#x27;s cart: which SKUs and how many of each, kept in SKU order. It is only a wish list and blocks no\n * stock, so ten carts can hold the last unit; checkout decides who gets it. Guarded by the store&#x27;s lock.\n */\nfinal class Cart {\n    private final TreeMap&lt;String, Integer&gt; items = new TreeMap&lt;&gt;();\n\n    /** Add qty of a SKU; a SKU already in the cart just gets more. */\n    void add(String sku, int qty) { items.merge(sku, qty, Integer::sum); }\n    /** Take qty of a SKU out; going down to zero removes the line. */\n    void remove(String sku, int qty) {\n        Integer have = items.get(sku);\n        if (have == null) return;\n        if (qty &gt;= have) items.remove(sku); else items.put(sku, have - qty);\n    }\n    /** How many of a SKU are in the cart, 0 when none. */\n    int qty(String sku) { return items.getOrDefault(sku, 0); }\n    /** A copy of the items, in SKU order. */\n    Map&lt;String, Integer&gt; items() { return new TreeMap&lt;&gt;(items); }\n    /** True when there is nothing in it. */\n    boolean isEmpty() { return items.isEmpty(); }\n}\n\n/**\n * A price: the subtotal of the lines, the discounts taken off (one label each, like &quot;SAVE10 -Rs 100.00&quot;),\n * and the total to pay, all in paise. Immutable: each discount makes a new quote.\n */\nrecord Quote(long subtotalPaise, List&lt;String&gt; discounts, long totalPaise) {\n    /** This quote with one more discount taken off. The total never goes below zero. */\n    Quote less(String label, long offPaise) {\n        long off = Math.max(0, Math.min(offPaise, totalPaise));\n        List&lt;String&gt; d = new ArrayList&lt;&gt;(discounts);\n        d.add(label + &quot; -&quot; + Main.rs(off));\n        return new Quote(subtotalPaise, List.copyOf(d), totalPaise - off);\n    }\n    /** Printed in rupees, the way a bill shows it. */\n    public String toString() { return &quot;subtotal &quot; + Main.rs(subtotalPaise) + &quot;, &quot; + discounts + &quot;, total &quot; + Main.rs(totalPaise); }\n}\n\n/**\n * How a list of lines is priced. Behind an interface because it WILL change mid-round: offers, coupons,\n * buy-two-get-one. Rules wrap each other (the Decorator pattern), and the wrapping order is the order in which\n * the discounts apply.\n */\ninterface PricingRule { Quote price(List&lt;Line&gt; lines); }\n\n/** The plain rule: the sum of unit price times quantity, no discount. */\nfinal class ListPrice implements PricingRule {\n    /** The subtotal, and the same number as the total. */\n    public Quote price(List&lt;Line&gt; lines) {\n        long sum = 0;\n        for (Line l : lines) sum += l.paise();\n        return new Quote(sum, List.of(), sum);\n    }\n}\n\n/** A percentage off whatever the wrapped rule charges, with a cap: &quot;10% off, up to Rs 100&quot;. Rounded down to a paise. */\nfinal class PercentOff implements PricingRule {\n    private final PricingRule inner;\n    private final String label;\n    private final int percent;\n    private final long capPaise;\n\n    PercentOff(PricingRule inner, String label, int percent, long capPaise) {\n        if (percent &lt; 0 || percent &gt; 100) throw new IllegalArgumentException(percent + &quot;% off&quot;);\n        this.inner = inner; this.label = label; this.percent = percent; this.capPaise = capPaise;\n    }\n    /** The wrapped price, less percent of its total, never more than the cap. */\n    public Quote price(List&lt;Line&gt; lines) {\n        Quote q = inner.price(lines);\n        long off = Math.min(capPaise, q.totalPaise() * percent / 100);\n        return off &gt; 0 ? q.less(label, off) : q;\n    }\n}\n\n/**\n * A flat amount off when the cart&#x27;s value before any discount (the subtotal) reaches a minimum: &quot;Rs 100 off on\n * orders above Rs 999&quot;, the way Flipkart&#x27;s billing task states it.\n */\nfinal class FlatOff implements PricingRule {\n    private final PricingRule inner;\n    private final String label;\n    private final long offPaise, minCartPaise;\n\n    FlatOff(PricingRule inner, String label, long offPaise, long minCartPaise) {\n        this.inner = inner; this.label = label; this.offPaise = offPaise; this.minCartPaise = minCartPaise;\n    }\n    /** The wrapped price, less the flat amount when the subtotal is at least the minimum. */\n    public Quote price(List&lt;Line&gt; lines) {\n        Quote q = inner.price(lines);\n        return q.subtotalPaise() &gt;= minCartPaise ? q.less(label, offPaise) : q;\n    }\n}\n\n/**\n * A code a buyer types at checkout: the discount it adds, and two limits, uses per buyer and uses in total.\n * discount wraps the store&#x27;s pricing in this coupon&#x27;s rule, e.g. base -&gt; new PercentOff(base, &quot;SAVE10&quot;, 10, 100_00).\n */\nrecord Coupon(String code, int perUserLimit, int totalLimit, UnaryOperator&lt;PricingRule&gt; discount) {}\n\n/**\n * Every coupon and how many times it has been used, in total and by each buyer. A use is claimed in the same\n * locked step that blocks the stock, and given back when that order dies unpaid or is cancelled, exactly like\n * a unit of stock. Guarded by the store&#x27;s lock.\n */\nfinal class CouponBook {\n    private final Map&lt;String, Coupon&gt; byCode = new HashMap&lt;&gt;();\n    private final Map&lt;String, Integer&gt; used = new HashMap&lt;&gt;();                   // code -&gt; uses by everybody\n    private final Map&lt;String, Map&lt;String, Integer&gt;&gt; usedBy = new HashMap&lt;&gt;();    // code -&gt; buyer -&gt; that buyer&#x27;s uses\n\n    /** Register a coupon. */\n    void add(Coupon c) { byCode.put(c.code(), c); }\n    /**\n     * The store&#x27;s pricing with this coupon wrapped round it, or a refusal: an unknown code, a coupon used up\n     * for everybody, or used up for this buyer. Reads only; claim() is what counts a use.\n     */\n    PricingRule ruleFor(String code, String userId, PricingRule base) {\n        Coupon c = byCode.get(code);\n        if (c == null) throw new OrderRefused(Reason.UNKNOWN_COUPON, &quot;no coupon &quot; + code);\n        if (used.getOrDefault(code, 0) &gt;= c.totalLimit())\n            throw new OrderRefused(Reason.COUPON_USED_UP, code + &quot; has been used &quot; + c.totalLimit() + &quot; times&quot;);\n        if (usedBy.getOrDefault(code, Map.of()).getOrDefault(userId, 0) &gt;= c.perUserLimit())\n            throw new OrderRefused(Reason.COUPON_USED_UP, userId + &quot; has already used &quot; + code);\n        return c.discount().apply(base);\n    }\n    /** Count one use, by this buyer. Called only after ruleFor passed, under the same lock. */\n    void claim(String code, String userId) {\n        used.merge(code, 1, Integer::sum);\n        usedBy.computeIfAbsent(code, k -&gt; new HashMap&lt;&gt;()).merge(userId, 1, Integer::sum);\n    }\n    /** Give one use back: the order that used it expired or was cancelled. */\n    void giveBack(String code, String userId) {\n        used.merge(code, -1, Integer::sum);\n        usedBy.get(code).merge(userId, -1, Integer::sum);\n    }\n    /** How many uses are claimed right now. */\n    int used(String code) { return used.getOrDefault(code, 0); }\n}\n\n/**\n * The life of an order. Which move is legal from which state is a table, not an if-chain: a new state is one\n * more row, and any move not in the table throws.\n */\nenum OrderStatus {\n    PENDING_PAYMENT, CONFIRMED, FULFILLED, CANCELLED, EXPIRED;\n\n    private static final Map&lt;OrderStatus, Set&lt;OrderStatus&gt;&gt; NEXT = new EnumMap&lt;&gt;(OrderStatus.class);\n    static {\n        NEXT.put(PENDING_PAYMENT, EnumSet.of(CONFIRMED, CANCELLED, EXPIRED));\n        NEXT.put(CONFIRMED, EnumSet.of(FULFILLED, CANCELLED));\n        NEXT.put(FULFILLED, EnumSet.noneOf(OrderStatus.class));     // delivered: a return is a different flow\n        NEXT.put(CANCELLED, EnumSet.noneOf(OrderStatus.class));\n        NEXT.put(EXPIRED, EnumSet.noneOf(OrderStatus.class));\n    }\n    /** True when the table allows this move. */\n    boolean canMoveTo(OrderStatus next) { return NEXT.get(this).contains(next); }\n}\n\n/**\n * One order: who placed it, its priced lines, the quote it will be charged, the coupon it used, and the moment\n * its hold ends. Its status changes only under the store&#x27;s lock, through moveTo.\n */\nfinal class Order {\n    final String id, userId, couponCode;\n    final List&lt;Line&gt; lines;\n    final Quote quote;\n    final long holdUntilMs;\n    private volatile OrderStatus status = OrderStatus.PENDING_PAYMENT;   // volatile: a reader outside the lock sees the latest\n    PaymentGateway chargedVia;               // guarded by the store&#x27;s lock: the bank a charge was sent to, null = none yet\n\n    Order(String id, String userId, List&lt;Line&gt; lines, Quote quote, String couponCode, long holdUntilMs) {\n        this.id = id; this.userId = userId; this.lines = lines; this.quote = quote;\n        this.couponCode = couponCode; this.holdUntilMs = holdUntilMs;\n    }\n    /** The status right now. */\n    OrderStatus status() { return status; }\n    /** What the buyer pays, in paise. */\n    long totalPaise() { return quote.totalPaise(); }\n    /** The moment the hold ends: from then on, an unpaid order&#x27;s stock is back on sale. */\n    long holdUntilMs() { return holdUntilMs; }\n    /** Move along the life cycle; a move the table does not allow throws and names both states. */\n    void moveTo(OrderStatus next) {\n        if (!status.canMoveTo(next)) throw new IllegalStateException(id + &quot;: &quot; + status + &quot; -&gt; &quot; + next + &quot; is not allowed&quot;);\n        status = next;\n    }\n}\n\n/** Why an order, a cart change or a coupon was refused. The caller shows it; nothing changed. */\nenum Reason { UNKNOWN_PRODUCT, BAD_QUANTITY, EMPTY_ORDER, OUT_OF_STOCK, UNKNOWN_COUPON, COUPON_USED_UP, COUPON_NOT_APPLICABLE }\n\n/** A refusal with its error code (PhonePe&#x27;s prompt asks for one). Thrown before anything is changed. */\nfinal class OrderRefused extends RuntimeException {\n    final Reason reason;\n\n    OrderRefused(Reason reason, String message) { super(message); this.reason = reason; }\n}\n\n/**\n * How confirmOrder ended. CONFIRMED: paid and the stock is sold (also the answer to a second, duplicate\n * call). DECLINED: nothing moved, and the hold keeps running, so another card may be tried. UNKNOWN: the bank\n * did not answer in time, so the order stays pending; a retry is charged at most once. REFUNDED: the money\n * arrived after the hold ended or the order was cancelled, so it was sent back. REFUSED: the order was already\n * over, and nothing was charged.\n */\nenum PayResult { CONFIRMED, DECLINED, UNKNOWN, REFUNDED, REFUSED }\n\n/**\n * How money moves. The order id is the idempotency key (a unique id per payment, so a request that arrives\n * twice is charged once): at most one charge per order id, and charging again while that id holds money takes\n * nothing more. false = declined; a timeout throws, and then nobody knows whether money moved. refund gives back\n * whatever that order id holds, and does nothing when it holds nothing, so it is always safe to call.\n */\ninterface PaymentGateway {\n    /** Take the order&#x27;s total. true = paid, false = declined; an exception means the outcome is unknown. */\n    boolean charge(String orderId, long paise);\n    /** Give back whatever this order id holds, if anything. */\n    void refund(String orderId);\n}\n\n/**\n * An in-memory bank that keeps the gateway&#x27;s promise: at most one charge per order id, and a refund gives back\n * what that id holds. heldPaise() is the money the shop really holds, so a test can compare it with the orders.\n */\nfinal class FakeGateway implements PaymentGateway {\n    private final Map&lt;String, Long&gt; held = new ConcurrentHashMap&lt;&gt;();   // order id -&gt; paise taken and not given back\n    final AtomicInteger charges = new AtomicInteger();                  // how many times money actually moved in\n\n    /** Take the money once per order id; asking again while it is held takes nothing more. */\n    public boolean charge(String orderId, long paise) {\n        if (held.putIfAbsent(orderId, paise) == null) charges.incrementAndGet();\n        return true;\n    }\n    /** Give back what this order id holds, if anything. */\n    public void refund(String orderId) { held.remove(orderId); }\n    /** All the money the shop holds right now. */\n    long heldPaise() {\n        long sum = 0;\n        for (long p : held.values()) sum += p;\n        return sum;\n    }\n    /** True while this order id holds money. */\n    boolean holds(String orderId) { return held.containsKey(orderId); }\n}\n\n/** Where time comes from. Handed in, so a test can say &quot;five minutes later&quot; without sleeping. */\ninterface Clock { long nowMs(); }\n\n/**\n * Something that happened, for listeners: an order event (CREATED, CONFIRMED, EXPIRED, CANCELLED, FULFILLED)\n * with the order&#x27;s lines, or RESTOCKED with one line for the SKU and the units added. seq is taken under the\n * lock, so it gives the true order of events even when two threads deliver them in the other order.\n */\nrecord StoreEvent(String kind, String orderId, String userId, List&lt;Line&gt; lines, long paise, long seq) {\n    /** The event for an order that just changed state. */\n    static StoreEvent of(String kind, Order o, long seq) { return new StoreEvent(kind, o.id, o.userId, o.lines, o.totalPaise(), seq); }\n}\n\n/**\n * Anyone who wants to hear what the store did: an SMS sender, a back-in-stock alert, a seller dashboard.\n * Called after the lock is released, on the thread that did the work, so two calls can overlap.\n */\ninterface StoreObserver { void onEvent(StoreEvent e); }\n\n/** Texts the buyer on every order event. It prints here; a real one calls an SMS provider, which is slow. */\nfinal class BuyerSms implements StoreObserver {\n    /** One line per order event; restocks are not the buyer&#x27;s business. */\n    public void onEvent(StoreEvent e) {\n        if (e.orderId() != null)\n            System.out.println(&quot;   [sms to &quot; + e.userId() + &quot;] order &quot; + e.orderId() + &quot; &quot; + e.kind() + &quot;, &quot; + Main.rs(e.paise()));\n    }\n}\n\n/**\n * The store: the only owner of the stock, the carts, the orders, the coupon counts and the queue of running\n * holds, and the only holder of the lock that guards them. Every public method is one short locked section,\n * and every one that reads stock, orders or coupons first sweeps the holds whose time is up. Nothing slow runs\n * under the lock: the bank is called between two short sections, and listeners and refunds run after the unlock.\n */\nfinal class Store {\n    /** How long an unpaid order blocks its stock: Meesho&#x27;s five minutes. */\n    static final long HOLD_MS = 5 * 60_000;\n\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Inventory inventory = new Inventory();\n    private final CouponBook coupons = new CouponBook();\n    private final Map&lt;String, Cart&gt; carts = new HashMap&lt;&gt;();                  // user -&gt; cart\n    private final Map&lt;String, Order&gt; orders = new HashMap&lt;&gt;();                // order id -&gt; order\n    private final Map&lt;String, Map&lt;String, String&gt;&gt; byKey = new HashMap&lt;&gt;();   // user -&gt; idempotency key -&gt; order id\n    private final Map&lt;String, List&lt;Order&gt;&gt; history = new HashMap&lt;&gt;();         // user -&gt; orders, oldest first\n    private final PriorityQueue&lt;Order&gt; holds =                                // running holds, the soonest end first\n            new PriorityQueue&lt;&gt;(Comparator.comparingLong(Order::holdUntilMs));\n    private final List&lt;StoreObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n    private final Queue&lt;String&gt; refundsToRetry = new ConcurrentLinkedQueue&lt;&gt;();   // order ids whose refund call failed\n    private final AtomicLong nextId = new AtomicLong(1000);\n    private long eventSeq;                                                    // guarded by the lock: numbers the events\n    private PricingRule pricing = new ListPrice();\n    private PaymentGateway gateway = new FakeGateway();\n    private long holdMs = HOLD_MS;\n    private Clock clock = System::currentTimeMillis;\n\n    /** Hand in the rules: pricing, the payment gateway and the hold time. The store never builds one itself. */\n    void configure(PricingRule pricing, PaymentGateway gateway, long holdMs) {\n        if (holdMs &lt;= 0) throw new IllegalArgumentException(&quot;a hold of &quot; + holdMs + &quot; ms&quot;);\n        lock.lock();\n        try { this.pricing = pricing; this.gateway = gateway; this.holdMs = holdMs; } finally { lock.unlock(); }\n    }\n    /** Tests hand in their own clock. */\n    void setClock(Clock c) { lock.lock(); try { clock = c; } finally { lock.unlock(); } }\n    /** Subscribe a listener. */\n    void addObserver(StoreObserver o) { observers.add(o); }\n    /** Register a coupon. */\n    void addCoupon(Coupon c) { lock.lock(); try { coupons.add(c); } finally { lock.unlock(); } }\n\n    // ---------------- the seller&#x27;s side ----------------\n\n    /** A new product with its price and its starting count (Meesho&#x27;s addProduct). */\n    void addProduct(String sku, String name, long pricePaise, int qty) {\n        lock.lock();\n        try { inventory.add(new Product(sku, name, pricePaise), qty); } finally { lock.unlock(); }\n    }\n\n    /**\n     * A seller restocks (delta above zero) or takes back units nobody has blocked or bought (delta below zero):\n     * Meesho&#x27;s updateInventory. Returns the new available count; a restock is announced after the unlock.\n     */\n    int updateInventory(String sku, int delta) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            sweep(after);\n            Stock s = inventory.stock(sku);\n            s.restock(delta);\n            if (delta &gt; 0) {\n                StoreEvent e = new StoreEvent(&quot;RESTOCKED&quot;, null, null,\n                        List.of(new Line(sku, delta, inventory.product(sku).pricePaise())), 0, ++eventSeq);\n                after.add(() -&gt; publish(e));\n            }\n            return s.available();\n        } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /** How many units of a SKU anyone may buy right now (Meesho&#x27;s getInventory). One lookup, after the sweep. */\n    int getInventory(String sku) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try { sweep(after); return inventory.stock(sku).available(); } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /** The three counts of a SKU, read together so they always add up. */\n    StockView stockOf(String sku) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try { sweep(after); return inventory.stock(sku).view(); } finally { lock.unlock(); runAfter(after); }\n    }\n\n    // ---------------- the buyer&#x27;s cart ----------------\n\n    /**\n     * Put qty of a SKU in the buyer&#x27;s cart. It checks the product exists and that the cart would not ask for\n     * more than is available right now, but it blocks nothing: that check is advice, and checkout decides.\n     */\n    void addToCart(String userId, String sku, int qty) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            sweep(after);\n            if (qty &lt; 1) throw new OrderRefused(Reason.BAD_QUANTITY, qty + &quot; x &quot; + sku);\n            Stock s = inventory.stock(sku);\n            Cart cart = carts.computeIfAbsent(userId, u -&gt; new Cart());\n            if ((long) cart.qty(sku) + qty &gt; s.available())\n                throw new OrderRefused(Reason.OUT_OF_STOCK, sku + &quot;: only &quot; + s.available() + &quot; left&quot;);\n            cart.add(sku, qty);\n        } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /** Take qty of a SKU out of the buyer&#x27;s cart. */\n    void removeFromCart(String userId, String sku, int qty) {\n        lock.lock();\n        try { Cart cart = carts.get(userId); if (cart != null) cart.remove(sku, qty); } finally { lock.unlock(); }\n    }\n\n    /** The buyer&#x27;s cart, in SKU order. */\n    Map&lt;String, Integer&gt; viewCart(String userId) {\n        lock.lock();\n        try { Cart cart = carts.get(userId); return cart == null ? Map.of() : cart.items(); } finally { lock.unlock(); }\n    }\n\n    /** What the cart would cost now, with the coupon if one is given: the same code checkout uses, claiming nothing. */\n    Quote cartTotal(String userId, String couponCode) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            sweep(after);\n            Cart cart = carts.get(userId);\n            if (cart == null || cart.isEmpty()) throw new OrderRefused(Reason.EMPTY_ORDER, userId + &quot;&#x27;s cart is empty&quot;);\n            return quote(userId, inventory.price(cart.items()), couponCode);\n        } finally { lock.unlock(); runAfter(after); }\n    }\n\n    // ---------------- orders ----------------\n\n    /**\n     * Check out the buyer&#x27;s whole cart: every line is blocked for the hold time, all or none, and the cart is\n     * emptied. A retry with the same idempotency key returns the same order and touches nothing.\n     */\n    Order checkout(String userId, String idempotencyKey, String couponCode) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            sweep(after);\n            Order earlier = replay(userId, idempotencyKey);\n            if (earlier != null) return earlier;                      // the retry of a checkout that already worked\n            Cart cart = carts.get(userId);\n            if (cart == null || cart.isEmpty()) throw new OrderRefused(Reason.EMPTY_ORDER, userId + &quot;&#x27;s cart is empty&quot;);\n            Order o = place(userId, idempotencyKey, cart.items(), couponCode, after);\n            carts.remove(userId);                                     // everything in it is now in the order\n            return o;\n        } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /**\n     * Place an order for these SKUs and quantities (Meesho&#x27;s createOrder, PhonePe&#x27;s createOrder): every line is\n     * blocked for the hold time, all or none. A retry with the same idempotency key returns the same order.\n     */\n    Order createOrder(String userId, String idempotencyKey, Map&lt;String, Integer&gt; wanted, String couponCode) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            sweep(after);\n            Order earlier = replay(userId, idempotencyKey);\n            if (earlier != null) return earlier;\n            return place(userId, idempotencyKey, wanted, couponCode, after);\n        } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /**\n     * Pay for an order and, when the money arrives in time, sell its blocked stock (Meesho&#x27;s confirmOrder, which\n     * runs once payment succeeds). In three steps: under the lock, check there is something to pay for; with NO\n     * lock held, charge the bank, using the order id as the idempotency key; under the lock again, commit only if\n     * the order is still pending and its hold has not ended, and otherwise send the money back.\n     */\n    PayResult confirmOrder(String orderId) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        Order o;\n        PaymentGateway bank;\n        lock.lock();\n        try {\n            sweep(after);\n            o = find(orderId);\n            if (o.status() == OrderStatus.CONFIRMED || o.status() == OrderStatus.FULFILLED) return PayResult.CONFIRMED;\n            if (o.status() != OrderStatus.PENDING_PAYMENT) return PayResult.REFUSED;   // expired or cancelled: charge nothing\n            bank = gateway;\n            o.chargedVia = bank;                      // from now on, if this order dies unpaid, this bank refunds it by id\n        } finally { lock.unlock(); runAfter(after); }\n\n        boolean paid;\n        try { paid = bank.charge(o.id, o.totalPaise()); }            // OUTSIDE the lock: a bank takes a second or two\n        catch (RuntimeException timeout) { return PayResult.UNKNOWN; }   // did money move? unknown: stays pending\n        if (!paid) return PayResult.DECLINED;                         // nothing moved; the hold keeps running\n\n        lock.lock();\n        try {\n            if (o.status() == OrderStatus.PENDING_PAYMENT &amp;&amp; clock.nowMs() &lt; o.holdUntilMs) {\n                inventory.commitAll(o.lines);                         // still ours and still in time: reserved -&gt; sold\n                o.moveTo(OrderStatus.CONFIRMED);\n                announce(&quot;CONFIRMED&quot;, o, after);\n                return PayResult.CONFIRMED;\n            }\n            if (o.status() == OrderStatus.CONFIRMED || o.status() == OrderStatus.FULFILLED)\n                return PayResult.CONFIRMED;                           // a racing call committed this same charge\n            if (o.status() == OrderStatus.PENDING_PAYMENT) endUnpaid(o, OrderStatus.EXPIRED, after);   // ran out meanwhile; queues the refund\n            else refundLater(o, after);                               // expired or cancelled by someone else meanwhile\n            return PayResult.REFUNDED;\n        } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /**\n     * Cancel an order. Unpaid: its block is released. Paid but not delivered: its units go back on sale and the\n     * money is refunded after the unlock. Already cancelled or expired: nothing more happens. Delivered: refused,\n     * because goods that have reached the buyer come back as a return, not a cancel.\n     */\n    OrderStatus cancelOrder(String orderId) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            sweep(after);\n            Order o = find(orderId);\n            switch (o.status()) {\n                case PENDING_PAYMENT -&gt; endUnpaid(o, OrderStatus.CANCELLED, after);\n                case CONFIRMED -&gt; {\n                    inventory.putBackAll(o.lines);                    // sold -&gt; available\n                    if (o.couponCode != null) coupons.giveBack(o.couponCode, o.userId);\n                    o.moveTo(OrderStatus.CANCELLED);\n                    refundLater(o, after);\n                    announce(&quot;CANCELLED&quot;, o, after);\n                }\n                case FULFILLED -&gt; throw new IllegalStateException(orderId + &quot; was delivered: that is a return, not a cancel&quot;);\n                default -&gt; { }                                        // CANCELLED or EXPIRED: nothing left to undo\n            }\n            return o.status();\n        } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /** Mark a paid order delivered (PhonePe&#x27;s FULFILLED). Only a CONFIRMED order may move here. */\n    void fulfilOrder(String orderId) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            sweep(after);\n            Order o = find(orderId);\n            o.moveTo(OrderStatus.FULFILLED);\n            announce(&quot;FULFILLED&quot;, o, after);\n        } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /** End every hold whose time is up. Every method already does this first; a background job may call it too. */\n    int sweepExpired() {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try { return sweep(after); } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /** One order by id, after the sweep, so its status is never a stale PENDING_PAYMENT. O(1). */\n    Order order(String orderId) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try { sweep(after); return find(orderId); } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /** A buyer&#x27;s orders, oldest first (the order history). O(1) to find, O(k) to copy k orders. */\n    List&lt;Order&gt; orderHistory(String userId) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try { sweep(after); return List.copyOf(history.getOrDefault(userId, List.of())); } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /** How many uses of a coupon are claimed right now, after the sweep has given back those of dead orders. */\n    int couponUses(String code) {\n        List&lt;Runnable&gt; after = new ArrayList&lt;&gt;();\n        lock.lock();\n        try { sweep(after); return coupons.used(code); } finally { lock.unlock(); runAfter(after); }\n    }\n\n    /** Order ids whose refund call failed; a retry job calls refund again, which is safe. */\n    List&lt;String&gt; refundsToRetry() { return List.copyOf(refundsToRetry); }\n\n    // ---------------- the private steps; the caller holds the lock ----------------\n\n    /** The order an earlier call with this buyer&#x27;s idempotency key created, or null. */\n    private Order replay(String userId, String key) {\n        String id = byKey.getOrDefault(userId, Map.of()).get(key);\n        return id == null ? null : orders.get(id);\n    }\n\n    /**\n     * THE critical step of checkout. In this order: price every line and check every line and the coupon,\n     * touching nothing, so a refusal changes nothing; then write: block every line, count the coupon use, and\n     * create the order with its hold. Under one lock, so nobody can take the stock between the check and the\n     * write.\n     */\n    private Order place(String userId, String key, Map&lt;String, Integer&gt; wanted, String couponCode, List&lt;Runnable&gt; after) {\n        if (wanted.isEmpty()) throw new OrderRefused(Reason.EMPTY_ORDER, &quot;nothing to order&quot;);\n        List&lt;Line&gt; lines = inventory.price(wanted);\n        Line short_ = inventory.firstShort(lines);\n        if (short_ != null)\n            throw new OrderRefused(Reason.OUT_OF_STOCK, short_.sku() + &quot;: wanted &quot; + short_.qty()\n                                   + &quot;, only &quot; + inventory.stock(short_.sku()).available() + &quot; left&quot;);\n        Quote q = quote(userId, lines, couponCode);\n        // every check passed and nothing has been touched: now write all of it\n        inventory.reserveAll(lines);\n        if (couponCode != null) coupons.claim(couponCode, userId);\n        Order o = new Order(&quot;O&quot; + nextId.incrementAndGet(), userId, lines, q, couponCode, clock.nowMs() + holdMs);\n        orders.put(o.id, o);\n        byKey.computeIfAbsent(userId, u -&gt; new HashMap&lt;&gt;()).put(key, o.id);\n        history.computeIfAbsent(userId, u -&gt; new ArrayList&lt;&gt;()).add(o);\n        holds.add(o);\n        announce(&quot;CREATED&quot;, o, after);\n        return o;\n    }\n\n    /** The price of these lines for this buyer, with the coupon when there is one; a coupon that takes nothing off is refused. */\n    private Quote quote(String userId, List&lt;Line&gt; lines, String couponCode) {\n        Quote plain = pricing.price(lines);\n        if (couponCode == null) return plain;\n        Quote q = coupons.ruleFor(couponCode, userId, pricing).price(lines);\n        if (q.totalPaise() &gt;= plain.totalPaise())\n            throw new OrderRefused(Reason.COUPON_NOT_APPLICABLE, couponCode + &quot; takes nothing off this order&quot;);\n        return q;\n    }\n\n    /**\n     * End every hold whose time is up: pop the queue while its head has ended. An entry whose order was paid or\n     * cancelled meanwhile is simply skipped. A hold ends AT holdUntilMs: at 4:59.999 it is still held. O(log n)\n     * per order over its whole life, never a scan.\n     */\n    private int sweep(List&lt;Runnable&gt; after) {\n        long now = clock.nowMs();\n        int ended = 0;\n        whil

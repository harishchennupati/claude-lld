 \"Which floor is this ticket on\": store the floor on the ticket at entry so exit never searches. \"How many compact spots are free on floor two\": that floor's queue size, which is why the lot keeps its floors by id as well as in a list. \"Does a car fit a compact spot\": a small table, vehicle type to sizes, smallest first. Every scan avoided here is a question not fumbled in the concurrency round, because the scan would have been inside the lock.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 236\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(20 40)\"><rect width=\"140\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ISSUED</text><text x=\"70.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">at entry</text></g><g transform=\"translate(230 40)\"><rect width=\"150\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PAYING</text><text x=\"75.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">payment in flight</text></g><g transform=\"translate(450 40)\"><rect width=\"130\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"65.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PAID</text><text x=\"65.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">money moved</text></g><g transform=\"translate(620 40)\"><rect width=\"120\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"60.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CLOSED</text><text x=\"60.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">spot freed</text></g><g transform=\"translate(230 150)\"><rect width=\"150\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"75.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PENDING</text><text x=\"75.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">timeout: key kept</text></g><g transform=\"translate(450 150)\"><rect width=\"130\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"65.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LOST</text><text x=\"65.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the cap was paid</text></g><path d=\"M160 54 H230\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"195\" y=\"34\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">checkout</text><path d=\"M230 74 H160\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"195\" y=\"100\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">declined</text><path d=\"M380 62 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"415\" y=\"56\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">OK</text><path d=\"M580 62 H620\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M255 150 V84\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"248\" y=\"122\" text-anchor=\"end\" font-size=\"10.5\" fill=\"var(--muted)\">retry: same key</text><path d=\"M335 84 V150\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"342\" y=\"122\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">timeout</text><path d=\"M380 78 H420 V172 H450\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M580 172 H680 V84\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><rect x=\"760\" y=\"20\" width=\"450\" height=\"174\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"985\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order at exit, and why it is this order</text><text x=\"775\" y=\"68\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 locked: ISSUED -&gt; PAYING, stamp the exit time, price it</text><text x=\"775\" y=\"89\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 no lock: pay(key = ticket id, paise), the slow ~500 ms</text><text x=\"775\" y=\"110\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 locked: OK -&gt; PAID, remove, release, vacate, CLOSED</text><text x=\"775\" y=\"131\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">declined -&gt; back to ISSUED: the driver retries</text><text x=\"775\" y=\"152\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">timeout -&gt; PENDING: the retry re-sends the same key</text><text x=\"775\" y=\"173\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a second checkout while PAYING is refused</text><text x=\"615\" y=\"222\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a status enum plus one rule: nothing is committed before the money moved, and no lock is held while it moves. Lost ticket = the same order with the cap as the fee.</text></svg></div><div class=\"move\"><p>A ticket is ISSUED at entry, PAYING while its exit payment is in flight, PAID when the money moved, CLOSED when the spot is freed, LOST if reported lost. Writing the states down forces the question the interviewer will ask: what if payment fails? The answer is an order of three steps. Under the lock: find the ticket, refuse it if a payment is already in flight, mark it PAYING, stamp the exit time and price it. With no lock held: take the payment. Under the lock again: commit (PAID, remove, release, vacate, CLOSED). A declined card puts the ticket back to ISSUED, and the driver retries. A second checkout while it is PAYING is refused; one after it is CLOSED finds no ticket. A timeout is the third answer: nobody knows whether the money moved. So the ticket waits as PENDING, and the retry sends the same amount with the same idempotency key. That key is the ticket id: a unique id for this payment, so a retry that arrives twice is charged once. Lost ticket is the same order with the daily cap as the fee.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes parks happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 305\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"540\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about 1.5 microseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">look up the plate in a map</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">walk the floors until one has a fitting spot (a few)</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">poll the head of one queue</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">set the spot's occupant; put the ticket in a map</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">take a snapshot of the counts</text></g><path d=\"M570 95 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"605\" y=\"85\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: milliseconds to seconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">print the ticket, lift the barrier: ~2,000,000 us</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the display board: it hears after unlock</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the driver: seconds</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the card payment at exit: ~500 ms, between two short locked steps</text></g><text x=\"615\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">ten gates press at the same instant</text><g transform=\"translate(30 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gate 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(148 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gate 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 1.5 us</text></g><g transform=\"translate(266 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gate 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 3.0 us</text></g><g transform=\"translate(384 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gate 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 4.5 us</text></g><g transform=\"translate(502 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gate 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 6.0 us</text></g><g transform=\"translate(620 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gate 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 7.5 us</text></g><g transform=\"translate(738 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gate 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 9.0 us</text></g><g transform=\"translate(856 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gate 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 10.5 us</text></g><g transform=\"translate(974 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gate 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 12.0 us</text></g><g transform=\"translate(1092 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gate 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 13.5 us</text></g><text x=\"615\" y=\"290\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tenth gate waits 13.5 microseconds for the lock, then spends two seconds lifting its barrier arm: one by one is true, and nobody can tell</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself: if every park takes the same lock, is the whole car park now a queue? It is, for about a microsecond and a half. Inside the lock there is a map lookup, a walk over a handful of floors, one queue poll, two field writes and a map put. Everything slow is outside it: printing the ticket, lifting the barrier, the display board, the driver. So when ten gates press at the same instant, the tenth waits about fourteen microseconds for the lock and then spends two seconds lifting its own barrier arm. One by one is true and nobody can tell, as long as nothing slow gets inside. The slowest thing a gate does, the half-second card payment at exit, is kept out as well: <code>unpark</code> marks the ticket PAYING in one short locked step, takes the payment with no lock held, and commits in a second short locked step.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"64\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">locked part of a park: a lookup, a queue poll, two field writes: ~1.5 us</text><text x=\"35\" y=\"87\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">an exit: two short locked steps, ~1.5 us; the card call holds no lock</text><text x=\"35\" y=\"110\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">~3 parks and ~3 exits a second: ~10 us of lock in every 1,000,000 us</text><text x=\"35\" y=\"133\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">two gates meet at the lock about ten times a day, for a microsecond</text><text x=\"35\" y=\"156\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the barrier arm serialises cars far more than the lock does</text><text x=\"35\" y=\"179\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">card call inside the lock: 3 x 500 ms = 1.5 s of lock every second</text><text x=\"880\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">done: payment outside the lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already in the code: PAYING, pay with no lock, commit in a second short step</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 a lock per floor</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">gates on different floors never wait for each other</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 compare-and-set per spot</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">claim occupant null -> vehicle in one hardware step; losers try the next</text></g></svg></div><div class=\"move\"><p>Ten gates admitting a car every three seconds is about three parks a second, and about three exits leave in the same second. A park holds the lock for about a microsecond and a half. An exit takes it twice, about as long in total, with the card payment in between and no lock held. That is about ten microseconds of lock in every second: two gates meet at the lock about ten times a day, and the one that waits loses a microsecond or two. The payment had to come out: at half a second inside the lock, three exits a second would need a second and a half of lock every second, and the queue at the lock would grow without end. The barrier arm serialises cars far more than the lock does. Then the ladder from here, in the order you would climb it: a lock per floor, so gates on different floors never wait for each other; compare-and-set per spot, which claims occupant null to vehicle in one hardware step and sends the loser to the next spot. Say the arithmetic first: climbing the ladder without it is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 376\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">payment fails or times out</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the spot leaks, or a retry charges twice</text></g><path d=\"M320 44 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 24)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">commit only after OK, keyed by ticket id; test: decline, retry; time out, retry: one charge</text></g><g transform=\"translate(30 70)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the display board throws</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a spot is lost from the queue</text></g><path d=\"M320 90 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 70)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish after unlock, catch; test: a throwing observer</text></g><g transform=\"translate(30 116)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two gates, one spot</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two cars, one space</text></g><path d=\"M320 136 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 116)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lock; test: 50 threads, one latch, one winner</text></g><g transform=\"translate(30 162)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same plate at two gates</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one car holds two spots</text></g><path d=\"M320 182 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 162)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refuse a parked plate under the lock; test: park &quot;SAME&quot; twice</text></g><g transform=\"translate(30 208)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">60 min + 1 ms</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">billed one hour, not two</text></g><path d=\"M320 228 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 208)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">round any started hour up; test: an injected clock</text></g><g transform=\"translate(30 254)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a thousand board updates a second</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">gates queue behind a screen</text></g><path d=\"M320 274 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 254)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">coalesce to the newest count; test: 1000 updates, 1 render</text></g><g transform=\"translate(30 300)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a slow card at one exit</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">every other gate waits for it</text></g><path d=\"M320 320 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 300)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">pay with no lock held; PAYING refuses a second checkout; test: park while the card hangs</text></g><text x=\"615\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim on this page has a failure test: FailureTests.java runs eighty-four of them and must print ALL PASS</text></svg></div><div class=\"move\"><p>Payment fails at exit (the spot must not leak, and the driver must be able to retry), or times out (the retry must not charge twice). A slow card at one exit (no other gate may wait for it, and a second checkout of that ticket is refused). Money kept as a double drifts: two hours of parking plus 14 kWh of charging at Rs 7.10 is Rs 139.40, and a double says 139.39999999999998. So every fee is a long count of paise. The display board throws (the queue must not lose a spot). Two gates, one spot (exactly one winner out of fifty). The same plate at two gates (one car gets one spot; the second gate is refused). Sixty minutes and one millisecond is two hours, and exactly sixty minutes is one. The board asking a thousand times a second (nobody at a gate waits for a screen). Time comes from an injected clock, so a test can say 'Saturday 10:00' and mean it. Each of these is a few lines in FailureTests.java, which runs eighty-four checks and prints ALL PASS or exits non-zero; a design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"850\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface PricingStrategy { long price(Ticket t); }  via configure()</text><text x=\"850\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">swap a rule without opening the lot</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">WeekendSurgePricing(PricingStrategy base): base.price(t) x 1.5</text><text x=\"850\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">add to a rule instead of copying it</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"310\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">floor.publish(counts) after unlock; DisplayBoard implements the observer</text><text x=\"850\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">the board hears; the lot never knows what a screen is</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"220\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">enum TicketStatus + the exit order (PAYING, pay with no lock, commit)</text><text x=\"850\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">an illegal move cannot happen</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Singleton</text><text x=\"220\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">the edge</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">ParkingLot.getInstance(); gates are HANDED the lot, they never call it</text><text x=\"850\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">one lot per process, nothing hidden</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"220\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">arrive typed; earns a place when built from strings: Vehicle.of(\"CAR\", p)</text><text x=\"850\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">say 'not yet, and here is what would make me'</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Builder, Template, Command</text><text x=\"220\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">no move produced them</text><text x=\"850\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">a pattern without a move is decoration</text><text x=\"615\" y=\"275\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>Every pattern on this page came out of a move, which is why each can be defended in one sentence: a rule that changes went behind an interface (Strategy); a rule that adds to another wraps it (Decorator); the floor announces and the board listens (Observer); the ticket's life is a fixed set of moves (State); one lot per process, at the edge only (Singleton: the gates are handed the lot, they never call <code>getInstance</code>). Factory did not earn a place: vehicles arrive already typed; it earns one the moment a vehicle is built from a string in a config file. When asked 'where would you use Builder?', the right answer is 'nowhere yet, and here is what would make me'. A pattern without a move behind it is decoration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class (each owns one state)</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Spot: its occupant. Floor: its free queues. Lot: the flow and the lock</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">surge = one new class + one changed configure() line</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">long fee = pricing.price(t);  never 'is it the surge one?'</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">PricingStrategy, SpotAssignmentStrategy, PaymentProcessor: one method</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">lot.setClock(() -> saturdayMs);  lot.unpark(plate, (key, paise) -> DECLINED)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>SOLID is not a list to recite; it is the check that the moves did their job. S: a class has one reason to change, which move 2 gave you (a spot changes only when its occupant does, a floor only when its free queues do, the lot only when the flow does). O: a new behaviour is a new class and one changed line, never an opened one (surge). L: any implementation drops in and nothing asks which one it got (the lot calls <code>pricing.price(t)</code>, never 'is it the surge one?'). I: the three interfaces have one method each, so a fake for a test is one line. D: the lot depends on interfaces and is handed the implementations, which is exactly why a test can hand it a clock that says Saturday and a card that declines.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nearest exit, a pass, a charging fee, a cap</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind the existing interface + one configure line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">SMS, analytics, a board that must not fall behind</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer; the floor does not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reserved, paying, towed</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new state + one row in the transition table</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across spots</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two adjacent spots for a truck; a held booking</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\"  several at once is those classes wrapped round each other, and the order of wrapping is the answer. Someone new who wants to know (SMS, analytics, a board that must not fall behind) is one more observer; the floor does not change. A new step in a life (reserved, paying, towed) is a new state and one row in the transition table. A new invariant across spots (a truck needs two adjacent spots; a booking holds one until six o'clock) is every claim inside the same lock, all or nothing. State that must outlive the process (persist it; many branches) is the two maps behind a repository interface, and the spot claim becomes a conditional UPDATE where the vehicle is still null: the database's compare-and-set, the same idea as the lock, one atomic step decides the winner. For all five the services do not change; that is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 840\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M120.0 680L120.0 626\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M120.0 420L120.0 354\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" " font-weight=\"600\" fill=\"var(--text)\">PricingStrategy</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">price(t: Ticket): long paise</text></g><g transform=\"translate(930 110)\"><rect width=\"250\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FlatHourlyPricing</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">RATE: Map&lt;SpotType,long&gt;</text><line x1=\"0\" y1=\"48\" x2=\"250\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">price(t): hours x RATE[size]</text></g><g transform=\"translate(930 215)\"><rect width=\"250\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">WeekendSurgePricing</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">base: PricingStrategy</text><line x1=\"0\" y1=\"48\" x2=\"250\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">price(t): base.price(t) x 1.5</text></g><g transform=\"translate(930 330)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SpotAssignmentStrategy</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">find(floor, vehicle): ParkingSpot</text></g><g transform=\"translate(930 420)\"><rect width=\"250\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SmallestFitStrategy</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">find: for size in Fit.ORDER[v.type]:</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">  floor.peekFree(size)</text></g><g transform=\"translate(930 530)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PaymentProcessor</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">pay(key, paise): PaymentStatus</text></g><g transform=\"translate(930 620)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CardPayment | CashPayment</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">pay(key, paise) &rarr; OK</text></g><g transform=\"translate(640 745)\"><rect width=\"240\" height=\"50\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"120.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PaymentStatus</text><line x1=\"0\" y1=\"34\" x2=\"240\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">OK, DECLINED, UNKNOWN</text></g><g transform=\"translate(930 730)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Clock</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">nowMs(): long</text></g><g><path d=\"M20 815L64 815\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"819\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 815L284 815\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"819\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 815L504 815\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"819\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 815L684 815\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"819\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 815L904 815\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"819\" font-size=\"11\" fill=\"var(--muted)\">notifies</text><rect x=\"1040\" y=\"806\" width=\"30\" height=\"18\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-dasharray=\"5 3\"/><text x=\"1078\" y=\"819\" font-size=\"11\" fill=\"var(--muted)\">interface</text><text x=\"1150\" y=\"819\" font-size=\"11\" font-style=\"italic\" fill=\"var(--muted)\">abstract</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (<i>italic</i> = abstract, never <code>new</code>-ed; dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = extends or implements. Filled diamond = owns: the lot owns floors, a floor owns spots, the lot owns the active tickets. Plain arrow = references: a ticket points at its spot, floor and vehicle. Dashed green = handed in through <code>configure()</code>. Dotted blue = notifies. <b>Where state lives:</b> the floor has the free queues and the observers; the lot has the floors, the active tickets, the handed-in rules and the one lock; a spot has its occupant; a ticket has its spot, floor, vehicle, times, fee and status. On the next step this diagram stays on the right while you read the code.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (the reference code for every follow-up on page 05, written against these same interfaces) and FailureTests.java (eighty-four checks, one per claim this page makes; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"main\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\nimport java.time.*;\n\n/** The kinds of vehicle that can enter. Used only to look up which spot sizes fit. */\nenum VehicleType { MOTORCYCLE, CAR, TRUCK }\n\n/**\n * The thing that drives in: a plate and a type, nothing else. Subclasses exist so one kind can be special-\n * cased later.\n */\nabstract class Vehicle {                       // the first noun: what drives in\n    final String plate;\n    final VehicleType type;\n    Vehicle(String plate, VehicleType type) { this.plate = plate; this.type = type; }\n}\nclass Car        extends Vehicle { Car(String p)        { super(p, VehicleType.CAR); } }\nclass Motorcycle extends Vehicle { Motorcycle(String p) { super(p, VehicleType.MOTORCYCLE); } }\nclass Truck      extends Vehicle { Truck(String p)      { super(p, VehicleType.TRUCK); } }\n\n/** Spot sizes. A bigger spot can hold a smaller vehicle; the Fit table says which. */\nenum SpotType { SMALL, COMPACT, LARGE }        // a bigger spot fits smaller vehicles\n\n/**\n * One physical spot. Deliberately dumb: it knows its size and who is in it. Two questions, two answers:\n * &quot;which free spot of this size is next?&quot; is the head of the floor&#x27;s queue; &quot;is THIS spot free?&quot; is\n * occupant() == null. The queue and the field are always changed together, under the lot&#x27;s one lock.\n */\nclass ParkingSpot {                            // where the vehicle goes\n    final String id;\n    final SpotType type;\n    private Vehicle vehicle;                    // who is in it, for the ticket and for display; null == nobody\n    ParkingSpot(String id, SpotType type) { this.id = id; this.type = type; }\n    /** Who is parked here, or null. For the ticket and the display only. */\n    Vehicle occupant()        { return vehicle; }\n    /**\n     * Record the vehicle now in this spot. Called by the lot, inside its lock, after the floor handed the\n     * spot out.\n     */\n    void    assign(Vehicle v) { this.vehicle = v; }\n    /** Forget the vehicle. Called at exit, after payment succeeded. */\n    void    release()         { this.vehicle = null; }\n}\n\n// hand out the SMALLEST fitting spot first, so large spots stay free for trucks.\n// Rule: the FIRST floor that has any fitting spot wins, then the smallest size on that floor.\n/**\n * The fit table: for each vehicle type, the spot sizes it may use, SMALLEST FIRST, so large spots stay\n * free for trucks. A table, not an if-chain, so adding a size is one row.\n */\nfinal class Fit {\n    static final Map&lt;VehicleType, List&lt;SpotType&gt;&gt; ORDER = Map.of(\n        VehicleType.MOTORCYCLE, List.of(SpotType.SMALL, SpotType.COMPACT, SpotType.LARGE),\n        VehicleType.CAR,        List.of(SpotType.COMPACT, SpotType.LARGE),\n        VehicleType.TRUCK,      List.of(SpotType.LARGE));\n}\n\n/**\n * A ticket&#x27;s life: ISSUED at entry; PAYING while its exit payment is in flight (a second checkout is\n * refused); PENDING when the gateway could not say whether the money moved (the retry re-sends the same key\n * and amount); PAID once money moved; LOST if reported lost (billed the cap); CLOSED when the spot is freed.\n */\nenum TicketStatus { ISSUED, PAYING, PENDING, PAID, LOST, CLOSED }\n\n/**\n * Issued at entry, priced at exit. Remembers its floor so exit never searches, and its entry time so the\n * fee is computable. Time is handed in, never read here.\n */\nclass Ticket {                                 // issued at entry, priced at exit\n    private static final AtomicInteger SEQ = new AtomicInteger();\n    final int id;\n    final ParkingSpot spot;\n    final ParkingFloor floor;                  // remembered -&gt; unpark is O(1)\n    final Vehicle vehicle;\n    final long entryMs;\n    long exitMs;\n    long feePaise;                             // priced when a payment starts; a retry after a timeout re-sends this exact amount\n    TicketStatus status = TicketStatus.ISSUED;\n    int attempt;                               // bumped after a decline: a NEW try needs a NEW key\n    PaymentProcessor pendingOn;                // the gateway holding an unconfirmed payment; a retry must go back there\n    Ticket(ParkingSpot spot, ParkingFloor floor, Vehicle vehicle, long entryMs) {\n        this.id = SEQ.incrementAndGet(); this.spot = spot; this.floor = floor; this.vehicle = vehicle;\n        this.entryMs = entryMs;                // time is handed in, never read here (testable, replayable)\n    }\n    /**\n     * The idempotency key: ticket id plus attempt number. A retry after a timeout reuses it, so the gateway\n     * charges it at most once; a decline bumps the attempt, because a gateway keeps its first answer per key,\n     * and the same key would answer &quot;declined&quot; to the driver&#x27;s next card too.\n     */\n    String payKey() { return &quot;ticket-&quot; + id + &quot;-&quot; + attempt; }\n}\n\n// &quot;they&#x27;ll want to change pricing&quot; -&gt; hide it behind an interface -&gt; Strategy\n/**\n * The pricing rule, behind an interface because it WILL change mid-round (surge, caps). Reads only the\n * ticket. Returns paise (100 paise = one rupee) in a long: a double cannot even hold 0.1 exactly.\n */\ninterface PricingStrategy { long price(Ticket t); }\n\n/** Hourly by spot size, any started hour billed. 60 minutes and 1 millisecond is two hours. */\nclass FlatHourlyPricing implements PricingStrategy {\n    private static final Map&lt;SpotType, Long&gt; RATE =                    // paise an hour: Rs 10, Rs 20, Rs 40\n        Map.of(SpotType.SMALL, 1_000L, SpotType.COMPACT, 2_000L, SpotType.LARGE, 4_000L);\n    /** Fee for a finished ticket, in paise: started hours times the size&#x27;s rate. */\n    public long price(Ticket t) {\n        long ms = t.exitMs - t.entryMs;\n        long hours = Math.max(1, (long) Math.ceil(ms / 3600000.0));   // any started hour is billed: 60 min + 1 ms = 2 hours\n        return hours * RATE.get(t.spot.type);\n    }\n}\n\n// &quot;smallest fit today, nearest-to-exit tomorrow&quot; -&gt; same shape -&gt; Strategy again\n/**\n * Which spot to hand out on a floor for this vehicle, or null if none fits. It is given the whole vehicle,\n * not just its type, so a rule may look at the plate (a monthly pass) or the subclass (an electric car).\n * Behind an interface because &#x27;nearest to exit&#x27; is the follow-up that always comes.\n */\ninterface SpotAssignmentStrategy { ParkingSpot find(ParkingFloor floor, Vehicle v); }\n\n/**\n * Walk the fit table smallest-first and return the first size that has a free spot. O(sizes), never a scan\n * of spots.\n */\nclass SmallestFitStrategy implements SpotAssignmentStrategy {\n    /**\n     * The head of the first non-empty fitting queue, or null. Peeks only; the lot decides whether to take\n     * it.\n     */\n    public ParkingSpot find(ParkingFloor floor, Vehicle v) {\n        for (SpotType st : Fit.ORDER.get(v.type)) {   // smallest fitting size first\n            ParkingSpot s = floor.peekFree(st);\n            if (s != null) return s;\n        }\n        return null;\n    }\n}\n\n// &quot;a board should update but not be wired into parking logic&quot; -&gt; publish/subscribe -&gt; Observer\n/**\n * Anyone who wants to hear &#x27;free counts on floor X changed&#x27;: a display board, a metrics exporter. The\n * floor does not know what they are.\n */\ninterface ParkingObserver { void onChange(String floorId, Map&lt;SpotType, Integer&gt; free); }\n\n/** A screen at the floor entrance. Prints the counts; a real one would drive an LED panel. */\nclass DisplayBoard implements ParkingObserver {\n    public void onChange(String floorId, Map&lt;SpotType, Integer&gt; free) {\n        System.out.println(&quot;[board] &quot; + floorId + &quot; free=&quot; + free);\n    }\n}\n\n/**\n * One floor: its spots, and per size a queue of the FREE ones. The ORDER of that queue is the rule for\n * which free spot of a size is handed out next, so it is handed in: a plain ArrayDeque means &quot;any of\n * them&quot;, O(1); a PriorityQueue ordered by metres from the exit means &quot;the nearest&quot;, O(log n). Nothing\n * else in the design changes. All mutation happens under the lot&#x27;s lock; observers are told after the\n * lock is released.\n */\nclass ParkingFloor {\n    final String id;\n    private final Map&lt;SpotType, Queue&lt;ParkingSpot&gt;&gt; free = new EnumMap&lt;&gt;(SpotType.class);   // the free spots of each size, in policy order\n    private final Map&lt;String, ParkingSpot&gt; all = new HashMap&lt;&gt;();\n    private final List&lt;ParkingObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n\n    /** A floor that hands out any free spot of the right size: ArrayDeque, O(1) at both ends. */\n    ParkingFloor(String id) { this(id, ArrayDeque::new); }\n    /**\n     * A floor whose free spots of each size are kept in the order this queue imposes; the head is\n     * whatever the order calls best. Hand in a PriorityQueue by distance and you have nearest-to-exit.\n     */\n    ParkingFloor(String id, Supplier&lt;Queue&lt;ParkingSpot&gt;&gt; order) {\n        this.id = id;\n        for (SpotType st : SpotType.values()) free.put(st, order.get());\n    }\n    /** Subscribe a listener; setup only. */\n    void addObserver(ParkingObserver o) { observers.add(o); }\n    /** Register a spot; it starts free. Setup only. */\n    void addSpot(ParkingSpot s)         { all.put(s.id, s); free.get(s.type).offer(s); }\n    /** One spot by its id, free or not; for rules that need a named spot (adjacency, a reservation). */\n    ParkingSpot spot(String id)         { return all.get(id); }\n    /** Every spot on this floor, free or not. Only rules that must look at pairs of spots use it. */\n    Collection&lt;ParkingSpot&gt; spots()     { return all.values(); }\n    /** The next free spot of a size without taking it, or null. O(1). */\n    ParkingSpot peekFree(SpotType st)   { return free.get(st).peek(); }   // O(1)\n    /** How many spots of a size are free. O(1): the queue&#x27;s size. */\n    int freeCount(SpotType st)          { return free.get(st).size(); }   // O(1)\n\n    /**\n     * Take a free spot out of its queue. The head costs O(1), which is what the default rule always asks\n     * for; a rule that picks some other free spot pays one O(n) removal on that floor. Taking a spot that\n     * is not free is a caller bug and throws.\n     */\n    void take(ParkingSpot s) {\n        Queue&lt;ParkingSpot&gt; q = free.get(s.type);\n        if (q.peek() == s) { q.poll(); return; }                       // the common case: O(1)\n        if (!q.remove(s)) throw new IllegalStateException(&quot;not free: &quot; + s.id);\n    }\n    /** Give a spot back; it re-enters its queue in policy order. O(1) for a deque, O(log n) for a heap. */\n    void vacate(ParkingSpot s) { free.get(s.type).offer(s); }\n\n    /** Copy of the free counts, taken INSIDE the lock so it is consistent. */\n    Map&lt;SpotType, Integer&gt; snapshot() {\n        Map&lt;SpotType, Integer&gt; counts = new EnumMap&lt;&gt;(SpotType.class);\n        for (SpotType st : SpotType.values()) counts.put(st, free.get(st).size());\n        return counts;\n    }\n    /**\n     * Tell every observer, OUTSIDE the lock, from a snapshot. A slow or throwing observer can stall no\n     * gate and corrupt nothing.\n     */\n    void publish(Map&lt;SpotType, Integer&gt; counts) {     // called after the lock is released; a broken listener cannot break parking\n        for (ParkingObserver o : observers) {\n            try { o.onChange(id, counts); } catch (RuntimeException e) { System.err.println(&quot;[observer failed] &quot; + e.getMessage()); }\n        }\n    }\n}\n\n/** What the gateway answered: the money moved, it was refused, or nobody knows (a timeout). */\nenum PaymentStatus { OK, DECLINED, UNKNOWN }\n\n/**\n * How money is taken at exit; card, cash, UPI. The amount is in paise. The key is an idempotency key (the\n * ticket id: a unique id for this payment, so a retry that arrives twice is charged once): the gateway\n * charges one key at most once, and a retry with a key it already charged gets OK back, with no new charge.\n */\ninterface PaymentProcessor { PaymentStatus pay(String idempotencyKey, long paise); }   // Strategy #3\nclass CardPayment implements PaymentProcessor { public PaymentStatus pay(String key, long paise) { /* gateway, keyed */ return PaymentStatus.OK; } }\nclass CashPayment implements PaymentProcessor { public PaymentStatus pay(String key, long paise) { return PaymentStatus.OK; } }\n\n/** Where time comes from. Injected so tests can pick &#x27;Saturday 10:00&#x27; and billing is replayable. */\ninterface Clock { long nowMs(); }                                       // time is injected: tests and replays choose it\n\n/**\n * The orchestrator and the only writer of shared state: the floors, the active tickets, and ONE lock.\n * park is one short critical section. unpark is two, with the card payment between them and no lock held;\n * nothing is committed before the payment succeeded.\n */\nclass ParkingLot {                                   // one source of truth (Singleton)\n    private static ParkingLot instance;\n    private final List&lt;ParkingFloor&gt; floors = new ArrayList&lt;&gt;();\n    private final Map&lt;String, ParkingFloor&gt; byId = new HashMap&lt;&gt;();  // for &quot;how many free on F2?&quot;\n    private final Map&lt;String, Ticket&gt; active = new HashMap&lt;&gt;();     // guarded by lock\n    private final ReentrantLock lock = new ReentrantLock();\n    private PricingStrategy pricing;\n    private SpotAssignmentStrategy assignment;\n    private Clock clock = System::currentTimeMillis;\n\n    /** Package-private on purpose: application code goes through getInstance(), tests build their own. */\n    ParkingLot() {}\n    static synchronized ParkingLot getInstance() {\n        if (instance == null) instance = new ParkingLot();\n        return instance;\n    }\n    /**\n     * Hand in the rules. The lot never builds a strategy itself, so swapping one is a new class and this\n     * one line.\n     */\n    void configure(PricingStrategy p, SpotAssignmentStrategy a) { pricing = p; assignment = a; }\n    /** Tests hand in a fixed clock. */\n    void setClock(Clock c) { clock = c; }\n    void addFloor(ParkingFloor f) { floors.add(f); byId.put(f.id, f); }\n\n    /**\n     * Entry. Under the lock: reject a duplicate plate, ask the strategy floor by floor for a spot, take it, record the vehicle, issue the ticket.\n     * After the lock: tell the floor&#x27;s observers. Throws if the lot is full for this vehicle.\n     */\n    Ticket park(Vehicle v) {\n        Ticket t; ParkingFloor changed; Map&lt;SpotType, Integer&gt; counts;\n        lock.lock();                                  // critical section: find + take + assign, nothing else\n        try {\n            if (active.containsKey(v.plate)) throw new IllegalStateException(&quot;Already parked: &quot; + v.plate);\n            ParkingSpot spot = null; changed = null;\n            for (ParkingFloor floor : floors) {       // first floor with a fitting spot wins\n                spot = assignment.find(floor, v);\n                if (spot != null) { changed = floor; break; }\n            }\n            if (spot == null) throw new IllegalStateException(&quot;Lot full for &quot; + v.type);\n            changed.take(spot);\n            spot.assign(v);\n            t = new Ticket(spot, changed, v, clock.nowMs());\n            active.put(v.plate, t);\n            counts = changed.snapshot();\n        } finally { lock.unlock(); }\n        changed.publish(counts);                      // the board hears AFTER the lock; a slow or broken board stalls nobody\n        return t;\n    }\n\n    /**\n     * Exit, in three steps, so the slow card payment never runs inside the lock.\n     * 1, locked: find the ticket, refuse it unless it is ISSUED (or PENDING: a retry), mark it PAYING, stamp\n     *    the exit time and price it. A second checkout while it is PAYING is refused.\n     * 2, no lock: take the payment, keyed by the ticket id, so this ticket is charged at most once.\n     * 3, locked: settle() commits on OK, goes back to ISSUED on a decline, and waits as PENDING on a timeout.\n     * Returns the fee in paise.\n     */\n    long unpark(String plate, PaymentProcessor payment) {\n        Ticket t; PaymentProcessor via;\n        lock.lock();                                  // step 1: short, nothing slow inside\n        try {\n            t = active.get(plate);                    // peek: commit nothing until the money has moved\n            if (t == null) throw new NoSuchElementException(&quot;No active ticket: &quot; + plate);\n            if (t.status != TicketStatus.ISSUED &amp;&amp; t.status != TicketStatus.PENDING)\n                throw new IllegalStateException(&quot;Payment already in progress: &quot; + plate);   // a second checkout while PAYING\n            if (t.status == TicketStatus.ISSUED) { t.exitMs = clock.nowMs(); t.feePaise = pricing.price(t); }\n            via = t.status == TicketStatus.PENDING ? t.pendingOn : payment;   // an unconfirmed payment is retried where it started, never in cash on top\n            t.status = TicketStatus.PAYING;           // a PENDING retry keeps its amount: same key, same paise\n        } finally { lock.unlock(); }\n        PaymentStatus answer;\n        try { answer = via.pay(t.payKey(), t.feePaise); }                // step 2: ~500 ms at a card gateway, NO lock held\n        catch (RuntimeException e) { answer = PaymentStatus.UNKNOWN; }    // a gateway that throws: nobody knows if money moved\n        return settle(t, answer, TicketStatus.PAID, via);  // step 3\n    }\n\n    /**\n     * Step 3 of an exit, under the lock again, with the gateway&#x27;s answer. OK: commit (PAID or LOST, remove,\n     * free the spot, CLOSED) and tell the board after the lock. DECLINED: back to ISSUED, nothing else\n     * changed; the driver retries. UNKNOWN (a timeout): PENDING, the spot still held; the retry sends the\n     * same key and amount, and the gateway returns its first answer instead of charging again.\n     */\n    private long settle(Ticket t, PaymentStatus answer, TicketStatus paidAs, PaymentProcessor via) {\n        Map&lt;SpotType, Integer&gt; counts;\n        lock.lock();\n        try {\n            if (answer == PaymentStatus.DECLINED) { t.status = TicketStatus.ISSUED; t.attempt++; t.pendingOn = null; throw new IllegalStateException(&quot;Payment declined&quot;); }   // next try: a new key\n            if (answer == PaymentStatus.UNKNOWN) { t.status = TicketStatus.PENDING; t.pendingOn = via; throw new IllegalStateException(&quot;Payment not confirmed: retry; the same key cannot charge twice&quot;); }\n            t.pendingOn = null;\n            t.status = paidAs;                        // money moved: now commit\n            active.remove(t.vehicle.plate);\n            t.spot.release();\n            t.floor.vacate(t.spot);                   // O(1): ticket knew its floor\n            t.status = TicketStatus.CLOSED;\n            counts = t.floor.snapshot();\n        } finally { lock.unlock(); }\n        t.floor.publish(counts);                      // the board hears AFTER the lock, same as park()\n        return t.feePaise;\n    }\n\n    /**\n     * Free spots per size across the lot. O(floors x sizes), under the lock so a count is never torn by a\n     * concurrent park.\n     */\n    Map&lt;SpotType, Integer&gt; availability() {\n        lock.lock();\n        try {\n            Map&lt;SpotType, Integer&gt; total = new EnumMap&lt;&gt;(SpotType.class);\n            for (SpotType st : SpotType.values()) total.put(st, 0);\n            for (ParkingFloor f : floors)\n                for (SpotType st : SpotType.values())\n                    total.merge(st, f.freeCount(st), Integer::sum);\n            return total;\n        } finally { lock.unlock(); }\n    }\n    /**\n     * Free spots of one size on ONE floor: what the display board and the app ask for. O(1), the size of\n     * that queue, read under the lock so a count is never torn by a park happening at the same moment.\n     */\n    int freeCount(String floorId, SpotType st) {\n        lock.lock();\n        try {\n            ParkingFloor f = byId.get(floorId);\n            if (f == null) throw new NoSuchElementException(&quot;No floor: &quot; + floorId);\n            return f.freeCount(st);\n        } finally { lock.unlock(); }\n    }\n    /** True when no floor has any spot this vehicle type may use. */\n    boolean isFullFor(VehicleType v) {\n        lock.lock();\n        try {\n            for (ParkingFloor f : floors)\n                for (SpotType st : Fit.ORDER.get(v))\n                    if (f.freeCount(st) &gt; 0) return false;\n            return true;\n        } finally { lock.unlock(); }\n    }\n    /**\n     * Lost ticket: duration is unknown, so bill the daily cap. The same three steps as unpark: PAYING under\n     * the lock, pay with no lock held, then LOST, remove, free, CLOSED under the lock.\n     */\n    long reportLost(String plate, PaymentProcessor payment, long dailyCapPaise) {\n        Ticket t; PaymentProcessor via;\n        lock.lock();                                  // step 1\n        try {\n            t = active.get(plate);\n            if (t == null) throw new NoSuchElementException(&quot;No active ticket: &quot; + plate);\n            if (t.status != TicketStatus.ISSUED &amp;&amp; t.status != TicketStatus.PENDING)\n                throw new IllegalStateException(&quot;Payment already in progress: &quot; + plate);\n            if (t.status == TicketStatus.ISSUED) { t.exitMs = clock.nowMs(); t.feePaise = dailyCapPaise; }\n            via = t.status == TicketStatus.PENDING ? t.pendingOn : payment;   // same rule as unpark\n            t.status = TicketStatus.PAYING;\n        } finally { lock.unlock(); }\n        PaymentStatus answer;\n        try { answer = via.pay(t.payKey(), t.feePaise); }                // step 2: no lock held\n        catch (RuntimeException e) { answer = PaymentStatus.UNKNOWN; }\n        return settle(t, answer, TicketStatus.LOST, via);  // step 3, shared with unpark: LOST, remove, free, CLOSED\n    }\n}\n\n// new rule live: 1.5x on weekends. A NEW class + one line \u2014 nothing else changes.\n/**\n * 1.5x on weekends: a NEW class that wraps the existing rule (Decorator). The lot did not change; only the\n * configure() line did.\n */\nclass WeekendSurgePricing implements PricingStrategy {\n    private final PricingStrategy base;                    // wrap the existing rule (Decorator)\n    private final ZoneId zone;\n    WeekendSurgePricing(PricingStrategy base, ZoneId zone) { this.base = base; this.zone = zone; }\n    public long price(Ticket t) {\n        long p = base.price(t);\n        DayOfWeek d = Instant.ofEpochMilli(t.exitMs).atZone(zone).getDayOfWeek();   // the ticket&#x27;s exit time, which the lot&#x27;s clock stamped\n        boolean weekend = (d == DayOfWeek.SATURDAY || d == DayOfWeek.SUNDAY);\n        return weekend ? (p * 3 + 1) / 2 : p;               // x1.5 in whole paise; a half paisa rounds up\n    }\n}\n// the only change at the call site \u2014 swap the injected strategy:\n// lot.configure(new WeekendSurgePricing(new FlatHourlyPricing(), ZoneId.of(&quot;Asia/Kolkata&quot;)), new SmallestFitStrategy());\n\n// entry / exit gates: thin actors. Real logic + the lock live in the lot,\n// which is exactly why concurrent gates are safe.\n/**\n * A thin actor at the barrier. No logic, no lock: it calls the lot, which is exactly why many gates at\n * once are safe.\n */\nclass EntryGate {\n    private final ParkingLot lot;\n    EntryGate(ParkingLot lot) { this.lot = lot; }\n    Ticket admit(Vehicle v) { return lot.park(v); }        // print ticket, open barrier\n}\n/** The exit barrier: charges via the lot, then opens. */\nclass ExitGate {\n    private final ParkingLot lot;\n    ExitGate(ParkingLot lot) { this.lot = lot; }\n    long checkout(String plate, PaymentProcessor pay) {    // charge, then open barrier\n        return lot.unpark(plate, pay);\n    }\n    /** The driver lost the ticket: charge the daily cap through the lot, then open the barrier. */\n    long lostTicket(String plate, PaymentProcessor pay, long dailyCapPaise) {\n        return lot.reportLost(plate, pay, dailyCapPaise);\n    }\n}\n\n\n\n/**\n * Proof it works: park, fill, reject, unpark, a fee, a lost ticket, and fifty gates racing for one spot\n * with exactly one winner.\n */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        ParkingLot lot = ParkingLot.getInstance();\n        lot.configure(new FlatHourlyPricing(), new SmallestFitStrategy());\n\n        ParkingFloor f1 = new ParkingFloor(&quot;F1&quot;);\n        f1.addObserver(new DisplayBoard());\n        f1.addSpot(new ParkingSpot(&quot;F1-S1&quot;, SpotType.SMALL));\n        f1.addSpot(new ParkingSpot(&quot;F1-C1&quot;, SpotType.COMPACT));\n        f1.addSpot(new ParkingSpot(&quot;F1-L1&quot;, SpotType.LARGE));\n        lot.addFloor(f1);\n\n        Ticket t = lot.park(new Car(&quot;KA01AB1234&quot;));       // -&gt; COMPACT\n        System.out.println(&quot;parked at &quot; + t.spot.id);\n        lot.park(new Truck(&quot;KA02CD9999&quot;));                // -&gt; LARGE\n        try { lot.park(new Car(&quot;KA03EF0001&quot;)); }          // compact+large gone, small can&#x27;t fit\n        catch (Exception e) { System.out.println(&quot;expected: &quot; + e.getMessage()); }\n        System.out.println(&quot;availability &quot; + lot.availability() + &quot; fullForCar=&quot; + lot.isFullFor(VehicleType.CAR));\n        System.out.println(&quot;F1 small free = &quot; + lot.freeCount(&quot;F1&quot;, SpotType.SMALL));   // what the board asks, O(1)\n        lon

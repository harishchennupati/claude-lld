p; assignment = a; }\n    /** Tests hand in a fixed clock. */\n    void setClock(Clock c) { clock = c; }\n    void addFloor(ParkingFloor f) { floors.add(f); byId.put(f.id, f); }\n\n    /**\n     * Entry. Under the lock: reject a duplicate plate, ask the strategy floor by floor for a spot, take it, record the vehicle, issue the ticket.\n     * After the lock: tell the floor's observers. Throws if the lot is full for this vehicle.\n     */\n    Ticket park(Vehicle v) {\n        Ticket t; ParkingFloor changed; Map<SpotType, Integer> counts;\n        lock.lock();                                  // critical section: find + take + assign, nothing else\n        try {\n            if (active.containsKey(v.plate)) throw new IllegalStateException(\"Already parked: \" + v.plate);\n            ParkingSpot spot = null; changed = null;\n            for (ParkingFloor floor : floors) {       // first floor with a fitting spot wins\n                spot = assignment.find(floor, v);\n                if (spot != null) { changed = floor; break; }\n            }\n            if (spot == null) throw new IllegalStateException(\"Lot full for \" + v.type);\n            changed.take(spot);\n            spot.assign(v);\n            t = new Ticket(spot, changed, v, clock.nowMs());\n            active.put(v.plate, t);\n            counts = changed.snapshot();\n        } finally { lock.unlock(); }\n        changed.publish(counts);                      // the board hears AFTER the lock; a slow or broken board stalls nobody\n        return t;\n    }\n\n    /**\n     * Exit, in three steps, so the slow card payment never runs inside the lock.\n     * 1, locked: find the ticket, refuse it unless it is ISSUED (or PENDING: a retry), mark it PAYING, stamp\n     *    the exit time and price it. A second checkout while it is PAYING is refused.\n     * 2, no lock: take the payment, keyed by the ticket id, so this ticket is charged at most once.\n     * 3, locked: settle() commits on OK, goes back to ISSUED on a decline, and waits as PENDING on a timeout.\n     * Returns the fee in paise.\n     */\n    long unpark(String plate, PaymentProcessor payment) {\n        Ticket t; PaymentProcessor via;\n        lock.lock();                                  // step 1: short, nothing slow inside\n        try {\n            t = active.get(plate);                    // peek: commit nothing until the money has moved\n            if (t == null) throw new NoSuchElementException(\"No active ticket: \" + plate);\n            if (t.status != TicketStatus.ISSUED && t.status != TicketStatus.PENDING)\n                throw new IllegalStateException(\"Payment already in progress: \" + plate);   // a second checkout while PAYING\n            if (t.status == TicketStatus.ISSUED) { t.exitMs = clock.nowMs(); t.feePaise = pricing.price(t); }\n            via = t.status == TicketStatus.PENDING ? t.pendingOn : payment;   // an unconfirmed payment is retried where it started, never in cash on top\n            t.status = TicketStatus.PAYING;           // a PENDING retry keeps its amount: same key, same paise\n        } finally { lock.unlock(); }\n        PaymentStatus answer;\n        try { answer = via.pay(t.payKey(), t.feePaise); }                // step 2: ~500 ms at a card gateway, NO lock held\n        catch (RuntimeException e) { answer = PaymentStatus.UNKNOWN; }    // a gateway that throws: nobody knows if money moved\n        return settle(t, answer, TicketStatus.PAID, via);  // step 3\n    }\n\n    /**\n     * Step 3 of an exit, under the lock again, with the gateway's answer. OK: commit (PAID or LOST, remove,\n     * free the spot, CLOSED) and tell the board after the lock. DECLINED: back to ISSUED, nothing else\n     * changed; the driver retries. UNKNOWN (a timeout): PENDING, the spot still held; the retry sends the\n     * same key and amount, and the gateway returns its first answer instead of charging again.\n     */\n    private long settle(Ticket t, PaymentStatus answer, TicketStatus paidAs, PaymentProcessor via) {\n        Map<SpotType, Integer> counts;\n        lock.lock();\n        try {\n            if (answer == PaymentStatus.DECLINED) { t.status = TicketStatus.ISSUED; t.attempt++; t.pendingOn = null; throw new IllegalStateException(\"Payment declined\"); }   // next try: a new key\n            if (answer == PaymentStatus.UNKNOWN) { t.status = TicketStatus.PENDING; t.pendingOn = via; throw new IllegalStateException(\"Payment not confirmed: retry; the same key cannot charge twice\"); }\n            t.pendingOn = null;\n            t.status = paidAs;                        // money moved: now commit\n            active.remove(t.vehicle.plate);\n            t.spot.release();\n            t.floor.vacate(t.spot);                   // O(1): ticket knew its floor\n            t.status = TicketStatus.CLOSED;\n            counts = t.floor.snapshot();\n        } finally { lock.unlock(); }\n        t.floor.publish(counts);                      // the board hears AFTER the lock, same as park()\n        return t.feePaise;\n    }\n\n    /**\n     * Free spots per size across the lot. O(floors x sizes), under the lock so a count is never torn by a\n     * concurrent park.\n     */\n    Map<SpotType, Integer> availability() {\n        lock.lock();\n        try {\n            Map<SpotType, Integer> total = new EnumMap<>(SpotType.class);\n            for (SpotType st : SpotType.values()) total.put(st, 0);\n            for (ParkingFloor f : floors)\n                for (SpotType st : SpotType.values())\n                    total.merge(st, f.freeCount(st), Integer::sum);\n            return total;\n        } finally { lock.unlock(); }\n    }\n    /**\n     * Free spots of one size on ONE floor: what the display board and the app ask for. O(1), the size of\n     * that queue, read under the lock so a count is never torn by a park happening at the same moment.\n     */\n    int freeCount(String floorId, SpotType st) {\n        lock.lock();\n        try {\n            ParkingFloor f = byId.get(floorId);\n            if (f == null) throw new NoSuchElementException(\"No floor: \" + floorId);\n            return f.freeCount(st);\n        } finally { lock.unlock(); }\n    }\n    /** True when no floor has any spot this vehicle type may use. */\n    boolean isFullFor(VehicleType v) {\n        lock.lock();\n        try {\n            for (ParkingFloor f : floors)\n                for (SpotType st : Fit.ORDER.get(v))\n                    if (f.freeCount(st) > 0) return false;\n            return true;\n        } finally { lock.unlock(); }\n    }\n    /**\n     * Lost ticket: duration is unknown, so bill the daily cap. The same three steps as unpark: PAYING under\n     * the lock, pay with no lock held, then LOST, remove, free, CLOSED under the lock.\n     */\n    long reportLost(String plate, PaymentProcessor payment, long dailyCapPaise) {\n        Ticket t; PaymentProcessor via;\n        lock.lock();                                  // step 1\n        try {\n            t = active.get(plate);\n            if (t == null) throw new NoSuchElementException(\"No active ticket: \" + plate);\n            if (t.status != TicketStatus.ISSUED && t.status != TicketStatus.PENDING)\n                throw new IllegalStateException(\"Payment already in progress: \" + plate);\n            if (t.status == TicketStatus.ISSUED) { t.exitMs = clock.nowMs(); t.feePaise = dailyCapPaise; }\n            via = t.status == TicketStatus.PENDING ? t.pendingOn : payment;   // same rule as unpark\n            t.status = TicketStatus.PAYING;\n        } finally { lock.unlock(); }\n        PaymentStatus answer;\n        try { answer = via.pay(t.payKey(), t.feePaise); }                // step 2: no lock held\n        catch (RuntimeException e) { answer = PaymentStatus.UNKNOWN; }\n        return settle(t, answer, TicketStatus.LOST, via);  // step 3, shared with unpark: LOST, remove, free, CLOSED\n    }\n}\n\n// new rule live: 1.5x on weekends. A NEW class + one line \u2014 nothing else changes.\n/**\n * 1.5x on weekends: a NEW class that wraps the existing rule (Decorator). The lot did not change; only the\n * configure() line did.\n */\nclass WeekendSurgePricing implements PricingStrategy {\n    private final PricingStrategy base;                    // wrap the existing rule (Decorator)\n    private final ZoneId zone;\n    WeekendSurgePricing(PricingStrategy base, ZoneId zone) { this.base = base; this.zone = zone; }\n    public long price(Ticket t) {\n        long p = base.price(t);\n        DayOfWeek d = Instant.ofEpochMilli(t.exitMs).atZone(zone).getDayOfWeek();   // the ticket's exit time, which the lot's clock stamped\n        boolean weekend = (d == DayOfWeek.SATURDAY || d == DayOfWeek.SUNDAY);\n        return weekend ? (p * 3 + 1) / 2 : p;               // x1.5 in whole paise; a half paisa rounds up\n    }\n}\n// the only change at the call site \u2014 swap the injected strategy:\n// lot.configure(new WeekendSurgePricing(new FlatHourlyPricing(), ZoneId.of(\"Asia/Kolkata\")), new SmallestFitStrategy());\n\n// entry / exit gates: thin actors. Real logic + the lock live in the lot,\n// which is exactly why concurrent gates are safe.\n/**\n * A thin actor at the barrier. No logic, no lock: it calls the lot, which is exactly why many gates at\n * once are safe.\n */\nclass EntryGate {\n    private final ParkingLot lot;\n    EntryGate(ParkingLot lot) { this.lot = lot; }\n    Ticket admit(Vehicle v) { return lot.park(v); }        // print ticket, open barrier\n}\n/** The exit barrier: charges via the lot, then opens. */\nclass ExitGate {\n    private final ParkingLot lot;\n    ExitGate(ParkingLot lot) { this.lot = lot; }\n    long checkout(String plate, PaymentProcessor pay) {    // charge, then open barrier\n        return lot.unpark(plate, pay);\n    }\n    /** The driver lost the ticket: charge the daily cap through the lot, then open the barrier. */\n    long lostTicket(String plate, PaymentProcessor pay, long dailyCapPaise) {\n        return lot.reportLost(plate, pay, dailyCapPaise);\n    }\n}\n\n\n\n/**\n * Proof it works: park, fill, reject, unpark, a fee, a lost ticket, and fifty gates racing for one spot\n * with exactly one winner.\n */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        ParkingLot lot = ParkingLot.getInstance();\n        lot.configure(new FlatHourlyPricing(), new SmallestFitStrategy());\n\n        ParkingFloor f1 = new ParkingFloor(\"F1\");\n        f1.addObserver(new DisplayBoard());\n        f1.addSpot(new ParkingSpot(\"F1-S1\", SpotType.SMALL));\n        f1.addSpot(new ParkingSpot(\"F1-C1\", SpotType.COMPACT));\n        f1.addSpot(new ParkingSpot(\"F1-L1\", SpotType.LARGE));\n        lot.addFloor(f1);\n\n        Ticket t = lot.park(new Car(\"KA01AB1234\"));       // -> COMPACT\n        System.out.println(\"parked at \" + t.spot.id);\n        lot.park(new Truck(\"KA02CD9999\"));                // -> LARGE\n        try { lot.park(new Car(\"KA03EF0001\")); }          // compact+large gone, small can't fit\n        catch (Exception e) { System.out.println(\"expected: \" + e.getMessage()); }\n        System.out.println(\"availability \" + lot.availability() + \" fullForCar=\" + lot.isFullFor(VehicleType.CAR));\n        System.out.println(\"F1 small free = \" + lot.freeCount(\"F1\", SpotType.SMALL));   // what the board asks, O(1)\n        long fee = lot.unpark(\"KA01AB1234\", new CardPayment());\n        System.out.println(\"fee for car: \" + fee + \" paise\");   // 1 hour x Rs 20 = 2000 paise (100 paise = one rupee)\n\n        // the race: fifty gates, one compact spot, released by one latch; exactly one must win\n        EntryGate gate = new EntryGate(lot);\n        ExecutorService pool = Executors.newFixedThreadPool(50);   // one thread per gate: all fifty really wait at the latch\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<Ticket>> tries = new ArrayList<>();\n        for (int i = 0; i < 50; i++) { String plate = \"RACE-\" + i; tries.add(pool.submit(() -> { go.await(); return gate.admit(new Car(plate)); })); }\n        go.countDown();\n        int wins = 0; String winner = null;\n        for (Future<Ticket> f : tries) { try { winner = f.get().vehicle.plate; wins++; } catch (ExecutionException e) { /* \"Lot full for CAR\" for the 49 losers */ } }\n        pool.shutdown();\n        System.out.println(\"race winners = \" + wins + \" (must be 1)\");\n        if (wins != 1) throw new AssertionError(\"double-booking!\");\n        System.out.println(\"lost ticket fee: \" + new ExitGate(lot).lostTicket(winner, new CashPayment(), 20_000) + \" paise\");   // the daily cap, Rs 200\n    }\n}\n", "ext": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\nimport java.util.stream.*;\nimport java.time.*;\nimport java.io.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, written against the SAME\n// interfaces Main.java declares, so \"it is a new class and one changed line\" is literally true here.\n\n// ---- ext: time is injected, so pricing and expiry are testable and replayable\n/** A clock a test owns: it says exactly what you set, and only moves when you move it. */\nclass FixedClock implements Clock {\n    private long t;\n    FixedClock(long t) { this.t = t; }\n    FixedClock(String iso) { this.t = Instant.parse(iso).toEpochMilli(); }\n    public long nowMs() { return t; }\n    /** Move time forward by this many milliseconds. */\n    void advance(long ms) { t += ms; }\n}\n\n// ---- ext: pricing rules stack, because each one is the same interface wrapping the last (Decorator)\n/**\n * The first free minutes: below the grace period the fee is zero, above it the wrapped rule decides.\n * Wrapped INSIDE everything else, because free is free whatever the surge is.\n */\nclass FreeGracePricing implements PricingStrategy {\n    private final PricingStrategy base;\n    private final long graceMs;\n    FreeGracePricing(PricingStrategy base, long graceMinutes) { this.base = base; this.graceMs = graceMinutes * 60_000L; }\n    public long price(Ticket t) { return (t.exitMs - t.entryMs) <= graceMs ? 0 : base.price(t); }\n}\n\n/**\n * Never more than the cap for one ticket, whatever the wrapped rule says. Wrapped OUTSIDE the surge, or\n * the surge would multiply the cap: order of wrapping is the answer to \"and a cap too?\".\n */\nclass DailyCapPricing implements PricingStrategy {\n    private final PricingStrategy base;\n    private final long capPaise;\n    DailyCapPricing(PricingStrategy base, long capPaise) { this.base = base; this.capPaise = capPaise; }\n    public long price(Ticket t) { return Math.min(capPaise, base.price(t)); }\n}\n\n/**\n * Monthly pass holders park free. A set of plates, checked first; everyone else falls through to the\n * wrapped rule. The lot never learns what a pass is.\n */\nclass MonthlyPassPricing implements PricingStrategy {\n    private final PricingStrategy base;\n    private final Set<String> passHolders;\n    MonthlyPassPricing(PricingStrategy base, Set<String> passHolders) { this.base = base; this.passHolders = passHolders; }\n    public long price(Ticket t) { return passHolders.contains(t.vehicle.plate) ? 0 : base.price(t); }\n}\n\n// ---- ext: electric spots -- a spot that gained BEHAVIOUR, so it earned a subclass\n/** A car that wants a charger. A plain Car to the fit table; the assignment rule looks for the subclass. */\nclass ElectricCar extends Car {\n    ElectricCar(String plate) { super(plate); }\n}\n\n/**\n * A compact spot with a charger. The charger starts when the car is assigned and stops when it is\n * released, which is why this is a subclass and not a flag: it has behaviour of its own.\n */\nclass EvSpot extends ParkingSpot {\n    private final double kW;              // how fast this charger delivers\n    private final Clock clock;\n    private long startedMs = -1;\n    EvSpot(String id, SpotType type, double kW, Clock clock) { super(id, type); this.kW = kW; this.clock = clock; }\n    @Override void assign(Vehicle v) { super.assign(v); startedMs = clock.nowMs(); }     // plug in\n    @Override void release()         { startedMs = -1; super.release(); }                // unplug\n    /** Units delivered so far, read off the meter. Pricing reads this BEFORE the spot is released. */\n    double kWhDelivered() { return startedMs < 0 ? 0 : (clock.nowMs() - startedMs) / 3_600_000.0 * kW; }\n}\n\n/**\n * Parking plus electricity: the wrapped rule's fee, plus the meter reading times the unit price. The reading\n * is a measurement, not money, so it becomes paise exactly once, rounded to the nearest paisa.\n */\nclass ChargingPricing implements PricingStrategy {\n    private final PricingStrategy base;\n    private final long paisePerKWh;\n    ChargingPricing(PricingStrategy base, long paisePerKWh) { this.base = base; this.paisePerKWh = paisePerKWh; }\n    public long price(Ticket t) {\n        long p = base.price(t);\n        return t.spot instanceof EvSpot ev ? p + Math.round(ev.kWhDelivered() * paisePerKWh) : p;\n    }\n}\n\n/**\n * An electric car gets a charger if one is free; a petrol car does not take a charger while an ordinary\n * spot is free, and takes one only as a last resort. Both answers are a scan of this floor's spots, which\n * is the price of adding a kind of spot from outside: give EV its own SpotType and both are O(1) again.\n */\nclass EvAwareAssignment implements SpotAssignmentStrategy {\n    private final SpotAssignmentStrategy base;\n    EvAwareAssignment(SpotAssignmentStrategy base) { this.base = base; }\n    public ParkingSpot find(ParkingFloor floor, Vehicle v) {\n        boolean wantsCharger = v instanceof ElectricCar;\n        for (SpotType st : Fit.ORDER.get(v.type)) {                 // smallest fitting size first, as before\n            ParkingSpot match = null;\n            for (ParkingSpot s : floor.spots())\n                if (s.type == st && s.occupant() == null && (s instanceof EvSpot) == wantsCharger) { match = s; break; }\n            if (match != null) return match;\n        }\n        return wantsCharger ? base.find(floor, v) : lastResort(floor, v);   // no charger free / only chargers left\n    }\n    private ParkingSpot lastResort(ParkingFloor floor, Vehicle v) {\n        for (SpotType st : Fit.ORDER.get(v.type)) { ParkingSpot s = floor.peekFree(st); if (s != null) return s; }\n        return null;\n    }\n}\n\n// ---- ext: nearest to the exit -- half of it is the floor's queue order, half is the choice of size\n/**\n * The queue order that makes a floor hand out its nearest free spot first: a heap keyed by metres from\n * the exit. Pass it to new ParkingFloor(id, nearestFirst(distance)) and peekFree() is now the nearest.\n */\nclass Nearest {\n    static Supplier<Queue<ParkingSpot>> nearestFirst(Map<String, Integer> distance) {\n        return () -> new PriorityQueue<>(Comparator.comparingInt(s -> distance.getOrDefault(s.id, Integer.MAX_VALUE)));\n    }\n}\n\n/**\n * On a distance-ordered floor each size's head is already the nearest of that size, so the nearest\n * overall is the best of the three heads: O(sizes), no scan. On an ordinary floor it is only the nearest\n * of whatever the plain queues happen to hold, which is why the floor's order is the other half of it.\n */\nclass NearestToExit implements SpotAssignmentStrategy {\n    private final Map<String, Integer> distance;                   // spotId -> metres from the exit, from config\n    NearestToExit(Map<String, Integer> distance) { this.distance = distance; }\n    public ParkingSpot find(ParkingFloor floor, Vehicle v) {\n        ParkingSpot best = null;\n        for (SpotType st : Fit.ORDER.get(v.type)) {\n            ParkingSpot s = floor.peekFree(st);\n            if (s != null && (best == null || d(s) < d(best))) best = s;\n        }\n        return best;\n    }\n    private int d(ParkingSpot s) { return distance.getOrDefault(s.id, Integer.MAX_VALUE); }\n}\n\n// ---- ext: the ticket's life as an explicit transition table (illegal transitions throw, never silently pass)\n/** The same six states as TicketStatus, plus the table of which move is legal from which state. */\nenum TicketState {\n    ISSUED, PAYING, PENDING, PAID, LOST, CLOSED;\n    private static final Map<TicketState, Set<TicketState>> ALLOWED = Map.of(\n        ISSUED,  EnumSet.of(PAYING),                        // checkout starts; a second one is now refused\n        PAYING,  EnumSet.of(PAID, LOST, ISSUED, PENDING),   // paid / paid the lost-ticket cap / declined / timed out\n        PENDING, EnumSet.of(PAYING),                        // the retry: same key, same amount\n        PAID,    EnumSet.of(CLOSED),\n        LOST,    EnumSet.of(CLOSED),\n        CLOSED,  EnumSet.noneOf(TicketState.class));\n    /** The next state, or an exception naming the move that is not in the table. */\n    TicketState to(TicketState next) {\n        if (!ALLOWED.get(this).contains(next)) throw new IllegalStateException(this + \" -> \" + next + \" not allowed\");\n        return next;\n    }\n}\n\n// ---- ext: reservations -- a spot booked ahead is held by the booking until it expires\n/**\n * The placeholder that sits in a reserved spot. A reservation is not an empty spot with a note on it: it\n * IS an occupant, in the name of the plate that booked it, so \"is this spot free?\" stays one question.\n */\nclass Reserved extends Vehicle {\n    Reserved(String plate, VehicleType type) { super(plate, type); }\n}\n\n/**\n * Book a spot ahead of time. reserve() takes the spot out of the floor's free queue now and holds it for\n * the plate; claim() turns the hold into a real ticket when the car arrives; sweep() gives back every\n * hold whose deadline has passed. Shown with its own lock; inside ParkingLot it would be three more\n * methods under the lot's one lock, in the same order: take the spot, then record the hold.\n */\nclass ReservationDesk {\n    /** One hold: the spot, who booked it, and when it stops being theirs. */\n    record Hold(ParkingSpot spot, ParkingFloor floor, String plate, VehicleType type, long expiresMs) {}\n    private final Map<String, Hold> holds = new HashMap<>();\n    private final ReentrantLock lock = new ReentrantLock();\n    private final List<ParkingFloor> floors;\n    private final SpotAssignmentStrategy assignment;\n    private final Clock clock;\n    ReservationDesk(List<ParkingFloor> floors, SpotAssignmentStrategy assignment, Clock clock) {\n        this.floors = floors; this.assignment = assignment; this.clock = clock;\n    }\n    /** Hold a fitting spot for this plate until expiresMs, or null if nothing fits. */\n    Hold reserve(String plate, VehicleType type, long expiresMs) {\n        Vehicle placeholder = new Reserved(plate, type);\n        lock.lock();\n        try {\n            if (holds.containsKey(plate)) throw new IllegalStateException(\"Already reserved: \" + plate);\n            for (ParkingFloor f : floors) {\n                ParkingSpot s = assignment.find(f, placeholder);\n                if (s == null) continue;\n                f.take(s);                                   // out of the free queue: no walk-in can be given it\n                s.assign(placeholder);                       // held in the name of the booking\n                Hold h = new Hold(s, f, plate, type, expiresMs);\n                holds.put(plate, h);\n                return h;\n            }\n            return null;\n        } finally { lock.unlock(); }\n    }\n    /** The car turned up: swap the placeholder for the real vehicle and issue the ticket. */\n    Ticket claim(Vehicle v) {\n        lock.lock();\n        try {\n            Hold h = holds.remove(v.plate);\n            if (h == null) throw new NoSuchElementException(\"No reservation: \" + v.plate);\n            if (clock.nowMs() > h.expiresMs()) { giveBack(h); throw new IllegalStateException(\"Reservation expired: \" + v.plate); }\n            h.spot().assign(v);\n            return new Ticket(h.spot(), h.floor(), v, clock.nowMs());\n        } finally { lock.unlock(); }\n    }\n    /** Return every hold whose deadline has passed. How many spots came back. */\n    int sweep() {\n        lock.lock();\n        try {\n            int n = 0;\n            for (Iterator<Map.Entry<String, Hold>> it = holds.entrySet().iterator(); it.hasNext(); ) {\n                Hold h = it.next().getValue();\n                if (clock.nowMs() > h.expiresMs()) { giveBack(h); it.remove(); n++; }\n            }\n            return n;\n        } finally { lock.unlock(); }\n    }\n    private void giveBack(Hold h) { h.spot().release(); h.floor().vacate(h.spot()); }\n}\n\n// ---- ext: the display board at a thousand updates a second -- coalesce, never block a gate\n/**\n * A board that cannot fall behind. onChange only stores the newest counts per floor, which is one map\n * write and never blocks the gate that called it; the board's own thread renders whatever is newest when\n * it gets round to it, so a thousand updates a second become one render per refresh and intermediate\n * snapshots are dropped, not queued. Losing them is correct: a board only ever shows the latest number.\n */\nclass CoalescingBoard implements ParkingObserver {\n    private final Map<String, Map<SpotType, Integer>> latest = new ConcurrentHashMap<>();\n    private final AtomicInteger renders = new AtomicInteger();\n    private volatile Map<SpotType, Integer> lastRendered;\n    public void onChange(String floorId, Map<SpotType, Integer> free) { latest.put(floorId, free); }   // O(1), never blocks\n    /** What the board's own thread does on each refresh tick: render only what is newest. */\n    void render() {\n        for (Map.Entry<String, Map<SpotType, Integer>> e : latest.entrySet()) {\n            lastRendered = e.getValue();\n            renders.incrementAndGet();\n        }\n        latest.clear();\n    }\n    int renderCount() { return renders.get(); }\n    Map<SpotType, Integer> lastRendered() { return lastRendered; }\n}\n\n// ---- ext: ladder rung 1 -- a lock per floor, so gates on different floors never wait for each other\n/** The same park(), with the one lot lock replaced by one lock per floor. */\nclass FloorLocked {\n    private final List<ParkingFloor> floors;\n    private final Map<ParkingFloor, ReentrantLock> locks = new HashMap<>();\n    private final SpotAssignmentStrategy assignment;\n    private final Map<String, Ticket> active = new ConcurrentHashMap<>();\n    FloorLocked(List<ParkingFloor> floors, SpotAssignmentStrategy a) {\n        this.floors = floors; this.assignment = a;\n        for (ParkingFloor f : floors) locks.put(f, new ReentrantLock());\n    }\n    /** Find and take a spot holding only the lock of the floor being looked at. */\n    Ticket park(Vehicle v) {\n        if (active.containsKey(v.plate)) throw new IllegalStateException(\"Already parked: \" + v.plate);\n        for (ParkingFloor floor : floors) {\n            ReentrantLock l = locks.get(floor);\n            l.lock();                                              // only this floor is serialised\n            try {\n                ParkingSpot spot = assignment.find(floor, v);\n                if (spot != null) {\n                    floor.take(spot); spot.assign(v);\n                    Ticket t = new Ticket(spot, floor, v, System.currentTimeMillis());\n                    active.put(v.plate, t);\n                    return t;\n                }\n            } finally { l.unlock(); }\n        }\n        throw new IllegalStateException(\"Lot full for \" + v.type);\n    }\n}\n// Note what the second lock cost: the duplicate-plate check is no longer inside the lock that hands out\n// the spot, so the same plate arriving at two floors at once can now get two spots. The fix is a second\n// atomic step -- putIfAbsent a PENDING marker into `active` before the floor loop, removed if no floor\n// had room. That is what buying floor-level concurrency actually costs, and why you climb the ladder\n// only after the arithmetic in move 8 says you must.\n\n// ---- ext: ladder rung 2 -- no lock at all: claim a spot with one compare-and-set\n/** A spot whose occupant is claimed with a single atomic instruction; exactly one caller can win. */\nclass CasSpot {\n    final String id; final SpotType type;\n    private final AtomicReference<Vehicle> occupant = new AtomicReference<>();\n    CasSpot(String id, SpotType type) { this.id = id; this.type = type; }\n    /** null -> v in one hardware step. True means you got it. */\n    boolean tryClaim(Vehicle v) { return occupant.compareAndSet(null, v); }\n    void release() { occupant.set(null); }\n    boolean isFree() { return occupant.get() == null; }\n}\n/** The lock-free floor: walk the fitting sizes and claim the first spot that lets you. */\nclass CasFloor {\n    private final Map<SpotType, List<CasSpot>> spots = new EnumMap<>(SpotType.class);\n    CasFloor() { for (SpotType st : SpotType.values()) spots.put(st, new ArrayList<>()); }\n    void add(CasSpot s) { spots.get(s.type).add(s); }\n    /** The spot this vehicle got, or null. A loser simply keeps scanning; nobody ever waits. */\n    CasSpot claim(Vehicle v) {\n        for (SpotType st : Fit.ORDER.get(v.type))\n            for (CasSpot s : spots.get(st))\n                if (s.tryClaim(v)) return s;\n        return null;\n    }\n}\n\n// ---- ext: a truck needs two adjacent spots -- one invariant across two spots, so both under one lock\n/** Which spot is physically beside which. A spot with no neighbour mapped can never be part of a pair. */\nclass AdjacentAssignment {\n    private final Map<String, String> next;\n    AdjacentAssignment(Map<String, String> next) { this.next = next; }\n    /** Two free neighbouring LARGE spots, or an empty list. Deterministic: ids in order. */\n    List<ParkingSpot> findRun(ParkingFloor floor) {\n        List<ParkingSpot> all = new ArrayList<>(floor.spots());\n        all.sort(Comparator.comparing(s -> s.id));\n        for (ParkingSpot a : all) {\n            String nid = next.get(a.id);\n            ParkingSpot b = nid == null ? null : floor.spot(nid);\n            if (a.type == SpotType.LARGE && a.occupant() == null\n                && b != null && b.type == SpotType.LARGE && b.occupant() == null) return List.of(a, b);\n        }\n        return List.of();\n    }\n}\n/** A ticket for a vehicle that took more than one spot. Reserved all or none. */\nclass MultiSpotTicket {\n    final List<ParkingSpot> spots; final Vehicle vehicle;\n    MultiSpotTicket(List<ParkingSpot> spots, Vehicle vehicle) { this.spots = spots; this.vehicle = vehicle; }\n}\n/**\n * The whole reservation under ONE lock: find the pair, take both out of the floor's free queues and\n * assign both, or touch nothing. A second truck arriving in the middle can never be handed half a pair;\n * that is the word atomic, and it is exactly why the lock is easier here than compare-and-set.\n */\nclass TruckParking {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final AdjacentAssignment adjacent;\n    TruckParking(AdjacentAssignment adjacent) { this.adjacent = adjacent; }\n    /** A pair for this truck, or null when no free pair exists. Nothing is half-taken either way. */\n    MultiSpotTicket park(Truck t, ParkingFloor floor) {\n        lock.lock();\n        try {\n            List<ParkingSpot> run = adjacent.findRun(floor);\n            if (run.isEmpty()) return null;                        // no pair: nothing was touched\n            for (ParkingSpot s : run) { floor.take(s); s.assign(t); }   // both, inside the same lock\n            return new MultiSpotTicket(run, t);\n        } finally { lock.unlock(); }\n    }\n    /** Give a pair back, both together. */\n    void release(MultiSpotTicket mt, ParkingFloor floor) {\n        lock.lock();\n        try { for (ParkingSpot s : mt.spots) { s.release(); floor.vacate(s); } } finally { lock.unlock(); }\n    }\n}\n\n// ---- ext: persistence -- the maps become a repository, and the lock becomes a conditional UPDATE\n/** The two maps in the lot, behind an interface. The services above it do not change. */\ninterface TicketRepository {\n    Optional<Ticket> byPlate(String plate);\n    /** Store a ticket, refusing a plate that is already parked. */\n    void save(Ticket t);\n    Ticket remove(String plate);\n}\n/** The in-memory implementation: the same HashMap, now behind the seam. */\nclass InMemoryTicketRepository implements TicketRepository {\n    private final Map<String, Ticket> m = new ConcurrentHashMap<>();\n    public Optional<Ticket> byPlate(String p) { return Optional.ofNullable(m.get(p)); }\n    public void save(Ticket t) { if (m.putIfAbsent(t.vehicle.plate, t) != null) throw new IllegalStateException(\"Already parked: \" + t.vehicle.plate); }\n    public Ticket remove(String p) { return m.remove(p); }\n}\n/**\n * What the spot claim becomes once the lot is two processes and a database:\n *   UPDATE spot SET plate = ? WHERE id = ? AND plate IS NULL\n * One row updated means you got it; zero means someone else did. No lock is held across the network,\n * and the database decides the winner with the same one-atomic-step idea the ReentrantLock used.\n * computeIfPresent here plays the part of the row lock the database takes for the duration of the UPDATE.\n */\nclass SpotTable {\n    private final Map<String, String> plateOf = new ConcurrentHashMap<>();   // spotId -> plate, \"\" == NULL\n    void insert(String spotId) { plateOf.put(spotId, \"\"); }\n    /** Rows updated: 1 if this caller claimed the spot, 0 if it was already taken. */\n    int claim(String spotId, String plate) {\n        int[] rows = { 0 };\n        plateOf.computeIfPresent(spotId, (id, cur) -> { if (cur.isEmpty()) { rows[0] = 1; return plate; } return cur; });\n        return rows[0];\n    }\n    /** Rows updated by: UPDATE spot SET plate = NULL WHERE id = ? AND plate = ? */\n    int release(String spotId, String plate) {\n        int[] rows = { 0 };\n        plateOf.computeIfPresent(spotId, (id, cur) -> { if (cur.equals(plate)) { rows[0] = 1; return \"\"; } return cur; });\n        return rows[0];\n    }\n    String plateOf(String spotId) { return plateOf.get(spotId); }\n}\n\n// ---- ext: the exit order, written against the transition table so an illegal move cannot pass\n/** The same three steps unpark() uses, with the state table doing the checking out loud. */\nclass ExitFlow {\n    /**\n     * PAYING, then the payment, and only then commit: PAID, free the spot, CLOSED. Returns the fee in paise,\n     * or -1 when the payment was declined (back to ISSUED) or not confirmed (PENDING: retry with the same key).\n     */\n    static long checkout(Ticket t, PricingStrategy pricing, PaymentProcessor pay, Clock clock, Runnable freeSpot) {\n        TicketState from = TicketState.valueOf(t.status.name());\n        t.status = TicketStatus.valueOf(from.to(TicketState.PAYING).name());   // a second checkout while PAYING throws here\n        if (from == TicketState.ISSUED) { t.exitMs = clock.nowMs(); t.feePaise = pricing.price(t); }   // PENDING keeps its amount\n        PaymentProcessor via = (from == TicketState.PENDING && t.pendingOn != null) ? t.pendingOn : pay;   // retry where it started\n        TicketState next = switch (via.pay(t.payKey(), t.feePaise)) {  // the gateway's answer picks the next state\n            case OK       -> TicketState.PAID;\n            case DECLINED -> TicketState.ISSUED;                       // the driver tries another card\n            case UNKNOWN  -> TicketState.PENDING;                      // the retry re-sends the same key and amount\n        };\n        t.status = TicketStatus.valueOf(TicketState.PAYING.to(next).name());\n        if (next == TicketState.ISSUED) { t.attempt++; t.pendingOn = null; }   // declined: the next try is a new payment, a new key\n        if (next == TicketState.PENDING) t.pendingOn = via;\n        if (next != TicketState.PAID) return -1;                       // nothing committed; the driver retries\n        freeSpot.run();                                                // only after the money moved\n        t.status = TicketStatus.valueOf(TicketState.PAID.to(TicketState.CLOSED).name());\n        return t.feePaise;\n    }\n}\n\n// ---- ext: a gateway that honours the key -- one key, at most one charge; a retry gets the first answer\n/**\n * What a card gateway does with the idempotency key, as a fake a test can drive. It remembers every key it\n * charged; a retry with that key gets OK back and nothing is charged again. timeoutFirst makes the first\n * charge go through but answer UNKNOWN, the way a network timeout does after the bank already took the money.\n */\nclass IdempotentGateway implements PaymentProcessor {\n    private final Map<String, Long> charged = new ConcurrentHashMap<>();    // key -> paise taken under it\n    private final AtomicBoolean timeoutFirst;\n    IdempotentGateway(boolean timeoutFirst) { this.timeoutFirst = new AtomicBoolean(timeoutFirst); }\n    public PaymentStatus pay(String key, long paise) {\n        if (charged.putIfAbsent(key, paise) != null) return PaymentStatus.OK;   // seen this key: the first answer, no second charge\n        return timeoutFirst.getAndSet(false) ? PaymentStatus.UNKNOWN : PaymentStatus.OK;   // charged; did the answer get back?\n    }\n    /** How many charges were made: one per key, however many times a key was sent. */\n    int charges() { return charged.size(); }\n}\n\n// ---- ext: the Gojek / GoTo version -- numbered slots, driven by text commands from a file or a shell\n/**\n * The lot of the Gojek statement: one row of slots numbered 1..n, and the nearest slot is the LOWEST free\n * number. The free numbers live in a TreeSet (a set kept in sorted order), so the nearest is pollFirst()\n * and leave() puts a number back, O(log n) each. Two maps are kept in step with park and leave, so no\n * lookup scans the slots.\n */\nclass SlotLot {\n    private final String[] reg, colour;                                   // reg[s] == null means slot s is free\n    private final TreeSet<Integer> free = new TreeSet<>();                // free slot numbers, lowest first\n    private final Map<String, Integer> slotOfReg = new HashMap<>();       // registration number -> its slot\n    private final Map<String, TreeSet<Integer>> slotsOfColour = new HashMap<>();   // colour -> its slots, lowest first\n    SlotLot(int n) { reg = new String[n + 1]; colour = new String[n + 1]; for (int s = 1; s <= n; s++) free.add(s); }\n    /** The slot this car got, the lowest free number, or -1 when the lot is full. */\n    int park(String r, String c) {\n        if (slotOfReg.containsKey(r)) throw new IllegalStateException(\"Already parked: \" + r);\n        Integer s = free.pollFirst();\n        if (s == null) return -1;\n        reg[s] = r; colour[s] = c;\n        slotOfReg.put(r, s);\n        slotsOfColour.computeIfAbsent(c, k -> new TreeSet<>()).add(s);\n        return s;\n    }\n    /** Free a slot; false if it was already free. Both maps change in the same step. */\n    boolean leave(int s) {\n        if (s < 1 || s >= reg.length) throw new IllegalArgumentException(\"No slot \" + s);\n        if (reg[s] == null) return false;\n        slotOfReg.remove(reg[s]);\n        slotsOfColour.get(colour[s]).remove(s);\n        reg[s] = null; colour[s] = null;\n        free.add(s);\n        return true;\n    }\n    int size()               { return reg.length - 1; }\n    String regAt(int s)      { return reg[s]; }\n    String colourAt(int s)   { return colour[s]; }\n    Integer slotOf(String r) { return slotOfReg.get(r); }\n    /** The slots holding cars of this colour, lowest first; empty if there are none. */\n    Set<Integer> slotsOf(String c) { return slotsOfColour.getOrDefault(c, new TreeSet<>()); }\n}\n\n/**\n * The shell, as the Command pattern kept small: each command word maps to one handler that runs it and\n * returns the text to print, so a missing command is one more entry, never a longer if-chain. run() reads\n * lines from any reader: a file, or System.in for the interactive shell.\n */\nclass CommandShell {\n    private SlotLot lot;\n    private final Map<String, Function<String[], String>> handlers = Map.of(\n        \"create_parking_lot\", a -> { lot = new SlotLot(Integer.parseInt(a[1])); return \"Created a parking lot with \" + a[1] + \" slots\"; },\n        \"park\", a -> { int s = lot.park(a[1], a[2]); return s < 0 ? \"Sorry, parking lot is full\" : \"Allocated slot number: \" + s; },\n        \"leave\", a -> lot.leave(Integer.parseInt(a[1])) ? \"Slot number \" + a[1] + \" is free\" : \"Slot number \" + a[1] + \" is already free\",\n        \"status\", a -> status(),\n        \"registration_numbers_for_cars_with_colour\", a -> list(lot.slotsOf(a[1]).stream().map(lot::regAt)),\n        \"slot_numbers_for_cars_with_colour\", a -> list(lot.slotsOf(a[1]).stream().map(String::valueOf)),\n        \"slot_number_for_registration_number\", a -> { Integer s = lot.slotOf(a[1]); return s == null ? \"Not found\" : s.toString(); });\n\n    /** One line in, the text to print out. An unknown word or bad input is a message, never a crash. */\n    String execute(String line) {\n        String[] a = line.trim().split(\"\\\\s+\");\n        Function<String[], String> h = handlers.get(a[0]);\n        if (h == null) return \"Unknown command: \" + a[0];\n        if (lot == null && !a[0].equals(\"create_parking_lot\")) return \"Create a parking lot first\";\n        try { return h.apply(a); } catch (RuntimeException e) { return \"Error: \" + e.getMessage(); }\n    }\n    /** Every line from a file or the keyboard, one answer printed per command. */\n    void run(BufferedReader in, PrintStream out) throws IOException {\n        for (String line = in.readLine(); line != null; line = in.readLine())\n            if (!line.isBlank()) out.println(execute(line));\n    }\n    private String status() {\n        StringBuilder b = new StringBuilder(String.format(\"%-12s%-19s%s\", \"Slot No.\", \"Registration No\", \"Colour\"));\n        for (int s = 1; s <= lot.size(); s++)                            // status must print every car: the one scan\n            if (lot.regAt(s) != null) b.append('\\n').append(String.format(\"%-12s%-19s%s\", s, lot.regAt(s), lot.colourAt(s)));\n        return b.toString();\n    }\n    private static String list(Stream<String> items) {\n        String s = items.collect(Collectors.joining(\", \"));\n        return s.isEmpty() ? \"Not found\" : s;\n    }\n    /** java CommandShell commands.txt runs a file; java CommandShell alone is the interactive shell. */\n    public static void main(String[] args) throws IOException {\n        Reader source = args.length > 0 ? new FileReader(args[0]) : new InputStreamReader(System.in);\n        try (BufferedReader in = new BufferedReader(source)) { new CommandShell().run(in, System.out); }\n    }\n}\n\n/** Runs every block above once, so the reference code on page 05 is code you have seen execute. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        FixedClock clock = new FixedClock(\"2026-09-05T10:00:00Z\");           // a Saturday\n        ParkingLot lot = new ParkingLot();                                    // tests and demos build their own\n        lot.setClock(clock);\n\n        // 1. the pricing stack: grace inside, then flat, then surge, then the cap outside\n        PricingStrategy stack = new MonthlyPassPricing(\n            new DailyCapPricing(new WeekendSurgePricing(new FreeGracePricing(new FlatHourlyPricing(), 15), ZoneId.of(\"UTC\")), 50_000),\n            Set.of(\"PASS-1\"));                                                // cap: Rs 500 = 50,000 paise\n        lot.configure(stack, new SmallestFitStrategy());\n        ParkingFloor f1 = new ParkingFloor(\"F1\");\n        f1.addSpot(new ParkingSpot(\"F1-C1\", SpotType.COMPACT));\n        f1.addSpot(new ParkingSpot(\"F1-C2\", SpotType.COMPACT));\n        lot.addFloor(f1);\n        lot.park(new Car(\"G-1\")); clock.advance(10 * 60_000L);\n        System.out.println(\"10 minutes on a Saturday = \" + lot.unpark(\"G-1\", new CashPayment()) + \" paise (inside the 15-minute grace)\");\n        lot.park(new Car(\"G-2\")); clock.advance(90 * 60_000L);\n        System.out.println(\"90 minutes on a Saturday = \" + lot.unpark(\"G-2\", new CashPayment()) + \" paise (2 h x Rs 20 x 1.5)\");\n        lot.park(new Car(\"PASS-1\")); clock.advance(5 * 3_600_000L);\n        System.out.println(\"a pass holder, five hours = \" + lot.unpark(\"PASS-1\", new CashPayment()) + \" paise\");\n\n        // 2. electric: the charger starts with the car, and the meter is on the bill\n        ParkingLot ev = new ParkingLot(); ev.setClock(clock);\n        ev.configure(new ChargingPricing(new FlatHourlyPricing(), 1_200), new EvAwareAssignment(new SmallestFitStrategy()));   // Rs 12 a kWh\n        ParkingFloor f2 = new ParkingFloor(\"F2\");\n        f2.addSpot(new ParkingSpot(\"F2-C1\", SpotType.COMPACT));\n        f2.addSpot(new EvSpot(\"F2-EV1\", SpotType.COMPACT, 7.0, clock));\n        ev.addFloor(f2);\n        Ticket petrol = ev.park(new Car(\"PETROL\"));\n        Ticket electric = ev.park(new ElectricCar(\"TESLA\"));\n        System.out.println(\"petrol got \" + petrol.spot.id + \", electric got \" + electric.spot.id);\n        clock.advance(2 * 3_600_000L);\n        System.out.println(\"electric bill = \" + ev.unpark(\"TESLA\", new CardPayment()) + \" paise (2 h x Rs 20 + 14 kWh x Rs 12)\");\n        ev.unpark(\"PETROL\", new CardPayment());\n\n        // 3. nearest to the exit: the floor's queue order, then the best of the heads\n        Map<String, Integer> metres = Map.of(\"F3-C1\", 90, \"F3-C2\", 10, \"F3-L1\", 30);\n        ParkingFloor f3 = new ParkingFloor(\"F3\", Nearest.nearestFirst(metres));\n        f3.addSpot(new ParkingSpot(\"F3-C1\", SpotType.COMPACT));\n        f3.addSpot(new ParkingSpot(\"F3-C2\", SpotType.COMPACT));\n        f3.addSpot(new ParkingSpot(\"F3-L1\", SpotType.LARGE));\n        ParkingLot near = new ParkingLot(); near.setClock(clock);\n        near.configure(new FlatHourlyPricing(), new NearestToExit(metres)); near.addFloor(f3);\n        System.out.println(\"nearest first: \" + near.park(new Car(\"N1\")).spot.id + \", then \" + near.park(new Car(\"N2\")).spot.id\n            + \", then \" + near.park(new Car(\"N3\")).spot.id);\n\n        // 4. a reservation is held, expires, and is swept back\n        ParkingFloor f4 = new ParkingFloor(\"F4\");\n        f4.addSpot(new ParkingSpot(\"F4-C1\", SpotType.COMPACT));\n        ReservationDesk desk = new ReservationDesk(List.of(f4), new SmallestFitStrategy(), clock);\n        desk.reserve(\"BOOK-1\", VehicleType.CAR, clock.nowMs() + 30 * 60_000L);\n        System.out.println(\"after a reservation, compact free on F4 = \" + f4.freeCount(SpotType.COMPACT));\n        System.out.println(\"claimed on time: ticket for \" + desk.claim(new Car(\"BOOK-1\")).vehicle.plate);\n\n        // 5. the board at a thousand updates a second\n        CoalescingBoard board = new CoalescingBoard();\n        for (int i = 0; i < 1000; i++) board.onChange(\"F1\", Map.of(SpotType.COMPACT, i));\n        board.render();\n        System.out.println(\"1000 updates -> \" + board.renderCount() + \" render(s), showing \" + board.lastRendered());\n\n        // 6. no lock at all: fifty cars, one spot, one winner\n        CasFloor cf = new CasFloor(); cf.add(new CasSpot(\"C1\", SpotType.COMPACT));\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        AtomicInteger wins = new AtomicInteger();\n        for (int i = 0; i < 50; i++) { String pl = \"P\" + i; pool.submit(() -> { go.await(); if (cf.claim(new Car(pl)) != null) wins.incrementAndGet(); return null; }); }\n        go.countDown(); pool.shutdown(); pool.awaitTermination(5, TimeUnit.SECONDS);\n        System.out.println(\"CAS race: 50 cars, 1 spot, winners = \" + wins.get());\n        if (wins.get() != 1) throw new AssertionError();\n\n        // 7. a truck needs two adjacent spots: both or nothing\n        ParkingFloor f5 = new ParkingFloor(\"F5\");\n        f5.addSpot(new ParkingSpot(\"L1\", SpotType.LARGE));\n        f5.addSpot(new ParkingSpot(\"L2\", SpotType.LARGE));\n        f5.addSpot(new ParkingSpot(\"L3\", SpotType.LARGE));\n        TruckParking tp = new TruckParking(new AdjacentAssignment(Map.of(\"L1\", \"L2\", \"L2\", \"L3\")));\n        MultiSpotTicket mt = tp.park(new Truck(\"TR1\"), f5);\n        System.out.println(\"truck 1 got \" + (mt == null ? \"nothing\" : mt.spots.size() + \" spots\") + \"; truck 2 got \"\n            + (tp.park(new Truck(\"TR2\"), f5) == null ? \"nothing (no free pair left)\" : \"a pair?!\"));\n\n        // 8. the same claim, in a database\n        SpotTable table = new SpotTable(); table.insert(\"F1-C1\");\n        System.out.println(\"conditional UPDATE: first claim rows=\" + table.claim(\"F1-C1\", \"KA01\") + \", second rows=\" + table.claim(\"F1-C1\", \"KA02\"));\n\n        // 9. the state table refuses an illegal move\n        System.out.println(\"ISSUED -> CLOSED: \" + tryIt(() -> TicketState.ISSUED.to(TicketState.CLOSED)));\n        InMemoryTicketRepository repo = new InMemoryTicketRepository();\n        ParkingSpot rs = new ParkingSpot(\"R1\", SpotType.LARGE);\n        repo.save(new Ticket(rs, f5, new Truck(\"T1\"), clock.nowMs()));\n        System.out.println(\"repo refuses a second ticket for the same plate: \" + tryIt(() -> repo.save(new Ticket(rs, f5, new Truck(\"T1\"), clock.nowMs()))));\n\n        // 10. a timeout, then a retry with the same key: charged once, by the lot and by the table-checked flow\n        ParkingLot keyed = new ParkingLot(); keyed.setClock(clock);\n        keyed.configure(new FlatHourlyPricing(), new SmallestFitStrategy());\n        ParkingFloor f6 = new ParkingFloor(\"F6\"); f6.addSpot(new ParkingSpot(\"F6-C1\", SpotType.COMPACT)); keyed.addFloor(f6);\n        keyed.park(new Car(\"KEY-1\"));\n        IdempotentGateway gw = new IdempotentGateway(true);\n        System.out.println(\"timeout: \" + tryIt(() -> keyed.unpark(\"KEY-1\", gw)) + \"; retry = \" + keyed.unpark(\"KEY-1\", gw)\n            + \" paise; charges = \" + gw.charges());\n        Ticket flow = new Ticket(new ParkingSpot(\"F7-C1\", SpotType.COMPACT), f6, new Car(\"KEY-2\"), clock.nowMs());\n        IdempotentGateway gw2 = new IdempotentGateway(true);\n        long first = ExitFlow.checkout(flow, new FlatHourlyPricing(), gw2, clock, () -> {});\n        System.out.println(\"ExitFlow: first \" + first + \" (\" + flow.status + \"), retry \" + ExitFlow.checkout(flow, new FlatHourlyPricing(), gw2, clock, () -> {})\n            + \" (\" + flow.status + \"), charges = \" + gw2.charges());\n\n        // 11. the Gojek version: the statement's commands, one handler per command word\n        CommandShell shell = new CommandShell();\n        for (String cmd : List.of(\"create_parking_lot 2\", \"park KA-01-HH-1234 White\", \"park KA-01-HH-9999 Black\", \"leave 1\",\n                                  \"park KA-01-P-333 White\", \"slot_numbers_for_cars_with_colour White\"))\n            System.out.println(\"$ \" + cmd + \" -> \" + shell.execute(cmd));\n    }\n    static String tryIt(Runnable r) { try { r.run(); return \"allowed\"; } catch (RuntimeException e) { return \"rejected: \" + e.getMessage(); } }\n}\n", "tests": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.time.*;\nimport java.io.*;\n\n/**\n * Every claim this design makes, proved. Each block is one row of move 9: a way the parking lot can go\n * wrong, and the few lines that show it does not. Run: javac Main.java Extensions.java FailureTests.java\n * && java FailureTests\n */\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? \"PASS \" : \"FAIL \") + what); if (!ok) failures++; }\n    static final long SAT_10AM = Instant.parse(\"2026-09-05T10:00:00Z\").toEpochMilli();   // a Saturday\n    static final long TUE_10AM = Instant.parse(\"2026-09-08T10:00:00Z\").toEpochMilli();   // a Tuesday\n\n    /** A lot with one floor of the given spots, a fixed clock, flat pricing and smallest fit. */\n    static ParkingLot lot(long[] now, ParkingFloor floor) {\n        ParkingLot lot = new ParkingLot();\n        lot.configure(new FlatHourlyPricing(), new SmallestFitStrategy());\n        lot.setClock(() -> now[0]);\n        lot.addFloor(floor);\n        return lot;\n    }\n    static ParkingFloor floor(String id, Object... idsAndTypes) {\n        ParkingFloor f = new ParkingFloor(id);\n        for (int i = 0; i < idsAndTypes.length; i += 2) f.addSpot(new ParkingSpot((String) idsAndTypes[i], (SpotType) idsAndTypes[i + 1]));\n        return f;\n    }\n\n    public static void main(String[] args) throws Exception {\n        long[] now = { SAT_10AM };\n\n        // 1. the fit table: smallest fitting size first, so large spots stay free for trucks\n        ParkingLot fit = lot(now, floor(\"F1\", \"S1\", SpotType.SMALL, \"C1\", SpotType.COMPACT, \"L1\", SpotType.LARGE));\n        check(fit.park(new Motorcycle(\"M1\")).spot.id.equals(\"S1\"), \"a motorcycle takes the SMALL spot, not the compact one\");\n        check(fit.park(new Car(\"C-1\")).spot.id.equals(\"C1\"), \"a car takes the COMPACT spot, not the large one\");\n        check(fit.park(new Truck(\"T-1\")).spot.id.equals(\"L1\"), \"a truck takes the LARGE spot, the only size that fits it\");\n        check(fit.isFullFor(VehicleType.TRUCK) && fit.isFullFor(VehicleType.CAR), \"now full for trucks and cars\");\n        try { fit.park(new Truck(\"T-2\")); check(false, \"a second truck must be rejected\"); }\n        catch (IllegalStateException e) { check(true, \"a second truck is rejected: \" + e.getMessage()); }\n\n        // 2. payment fails at exit: nothing changes, the driver retries and succeeds\n        ParkingLot pay = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT));\n        pay.park(new Car(\"AAA\"));\n        check(pay.isFullFor(VehicleType.CAR), \"spot taken after park\");\n        try { pay.unpark(\"AAA\", (key, paise) -> PaymentStatus.DECLINED); check(false, \"failed payment must throw\"); }\n        catch (IllegalStateException e) { check(true, \"failed payment throws: \" + e.getMessage()); }\n        check(pay.isFullFor(VehicleType.CAR), \"after a failed payment the spot is still held\");\n        check(pay.unpark(\"AAA\", new CashPayment()) == 2_000L, \"the driver retries with cash and pays Rs 20 (2000 paise)\");\n        check(!pay.isFullFor(VehicleType.CAR), \"spot recovered after the successful retry\");\n\n        // 3. an observer that throws must not corrupt parking\n        ParkingFloor noisy = floor(\"F1\", \"C1\", SpotType.COMPACT);\n        ParkingLot obs = lot(now, noisy);\n        noisy.addObserver((id, free) -> { throw new RuntimeException(\"board is down\"); });\n        check(obs.park(new Car(\"BBB\")) != null && obs.isFullFor(VehicleType.CAR), \"park succeeds although the board threw\");\n        obs.unpark(\"BBB\", new CashPayment());\n        check(!obs.isFullFor(VehicleType.CAR), \"unpark succeeds although the board threw; the spot is back\");\n\n        // 4. lost ticket: the cap is charged, and a failed payment changes nothing\n        ParkingLot lost = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT));\n        ExitGate exit = new ExitGate(lost);\n        lost.park(new Car(\"CCC\"));\n        try { exit.lostTicket(\"CCC\", (key, paise) -> PaymentStatus.DECLINED, 20_000); check(false, \"failed cap payment must throw\"); }\n        catch (IllegalStateException e) { check(true, \"a failed cap payment throws\"); }\n        check(lost.isFullFor(VehicleType.CAR), \"after the failed cap payment the spot is still held\");\n        check(exit.lostTicket(\"CCC\", new CashPayment(), 20_000) == 20_000L, \"the retry pays the daily cap (Rs 200) through the exit gate\");\n        check(lost.availability().get(SpotType.COMPACT) == 1, \"the spot is freed exactly once\");\n\n        // 5. a second checkout must be rejected, not free the spot twice\n        ParkingLot twice = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT));\n        twice.park(new Car(\"DDD\"));\n        twice.unpark(\"DDD\", new CashPayment());\n        try { twice.unpark(\"DDD\", new CashPayment()); check(false, \"a second checkout must throw\"); }\n        catch (NoSuchElementException e) { check(true, \"a second checkout is rejected\"); }\n        check(twice.availability().get(SpotType.COMPACT) == 1, \"one physical spot, one free entry (not two)\");\n\n        // 6. the same plate at two gates: the second is refused, one spot is used\n        ParkingLot dup = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT, \"C2\", SpotType.COMPACT));\n        dup.park(new Car(\"SAME\"));\n        try { dup.park(new Car(\"SAME\")); check(false, \"a duplicate plate must be refused\"); }\n        catch (IllegalStateException e) { check(true, \"the same plate at a second gate is refused\"); }\n        check(dup.availability().get(SpotType.COMPACT) == 1, \"the duplicate consumed no second spot\");\n\n        // 7. billing: any started hour is billed, and a minute is never free\n        ParkingLot bill = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT));\n        bill.park(new Car(\"E1\")); now[0] += 3_600_000L;\n        check(bill.unpark(\"E1\", new CashPayment()) == 2_000L, \"exactly 60 minutes on compact bills 1 hour = 2000 paise\");\n        bill.park(new Car(\"E2\")); now[0] += 3_600_000L + 1;\n        check(bill.unpark(\"E2\", new CashPayment()) == 4_000L, \"60 minutes and 1 millisecond bills 2 hours = 4000 paise\");\n        bill.park(new Car(\"E3\")); now[0] += 1;\n        check(bill.unpark(\"E3\", new CashPayment()) == 2_000L, \"1 millisecond still bills the first hour = 2000 paise\");\n\n        // 8. the weekend rule reads the injected clock, not the wall clock\n        now[0] = SAT_10AM;\n        ParkingLot sat = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT));\n        sat.configure(new WeekendSurgePricing(new FlatHourlyPricing(), ZoneId.of(\"UTC\")), new SmallestFitStrategy());\n        sat.park(new Car(\"FFF\")); now[0] += 3_600_000L;                    // Saturday 10:00 to 11:00\n        check(sat.unpark(\"FFF\", new CashPayment()) == 3_000L, \"Saturday by the injected clock: 2000 x 1.5 = 3000 paise\");\n        now[0] = TUE_10AM;\n        sat.park(new Car(\"GGG\"));\n        check(sat.unpark(\"GGG\", new CashPayment()) == 2_000L, \"the same code on a Tuesday: no surge, 2000 paise\");\n        now[0] = SAT_10AM;\n\n        // 9. taking a spot that is not free is a programming error, not a slow path\n        ParkingFloor guard = floor(\"F1\", \"C1\", SpotType.COMPACT);\n        try { guard.take(new ParkingSpot(\"ghost\", SpotType.COMPACT)); check(false, \"must throw\"); }\n        catch (IllegalStateException e) { check(true, \"take() refuses a spot that is not in the free queue\"); }\n\n        // 10. the count the board asks for, per floor, O(1) and under the lock\n        ParkingLot counts = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT, \"C2\", SpotType.COMPACT));\n        counts.addFloor(floor(\"F2\", \"C3\", SpotType.COMPACT, \"L2\", SpotType.LARGE));\n        check(counts.freeCount(\"F2\", SpotType.COMPACT) == 1, \"F2 has one free compact, counted without scanning spots\");\n        counts.park(new Car(\"H1\"));                                        // goes to F1: the first floor that fits\n        check(counts.freeCount(\"F1\", SpotType.COMPACT) == 1 && counts.freeCount(\"F2\", SpotType.COMPACT) == 1, \"the park moved only F1's count\");\n        check(counts.availability().get(SpotType.COMPACT) == 2, \"lot-wide availability is the sum of the floors\");\n        try { counts.freeCount(\"F9\", SpotType.COMPACT); check(false, \"an unknown floor must throw\"); }\n        catch (NoSuchElementException e) { check(true, \"an unknown floor is an error, not a zero\"); }\n\n        // 11. the race: fifty gates, one compact spot, one latch, exactly one winner\n        ParkingLot race = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT));\n        EntryGate gate = new EntryGate(race);\n        ExecutorService pool = Executors.newFixedThreadPool(50);          // one thread per gate: all fifty wait at the latch together\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<Ticket>> tries = new ArrayList<>();\n        for (int i = 0; i < 50; i++) { String plate = \"R\" + i; tries.add(pool.submit(() -> { go.await(); return gate.admit(new Car(plate)); })); }\n        go.countDown();\n        int wins = 0;\n        for (Future<Ticket> f : tries) { try { f.get(); wins++; } catch (ExecutionException e) { /* \"Lot full for CAR\" */ } }\n        pool.shutdown();\n        check(wins == 1, \"50 gates raced for the last spot; winners = \" + wins);\n        check(race.isFullFor(VehicleType.CAR), \"the lot is full afterwards: one spot, one car\");\n        check(race.availability().get(SpotType.COMPACT) == 0, \"no spot was handed out twice and none was lost\");\n\n        // 12. nearest to the exit: the floor's queue order decides, and vacating puts it back in order\n        Map<String, Integer> metres = Map.of(\"C1\", 50, \"C2\", 10, \"C3\", 30);\n        ParkingFloor near = new ParkingFloor(\"F1\", Nearest.nearestFirst(metres));\n        for (String id : List.of(\"C1\", \"C2\", \"C3\")) near.addSpot(new ParkingSpot(id, SpotType.COMPACT));\n        ParkingLot nearLot = new ParkingLot();\n        nearLot.setClock(() -> now[0]);\n        nearLot.configure(new FlatHourlyPricing(), new NearestToExit(metres));\n        nearLot.addFloor(near);\n        check(nearLot.park(new Car(\"N1\")).spot.id.equals(\"C2\"), \"the first car gets C2, ten metres from the exit\");\n        check(nearLot.park(new Car(\"N2\")).spot.id.equals(\"C3\"), \"the second gets C3 at thirty metres, not C1 at fifty\");\n        nearLot.unpark(\"N1\", new CashPayment());                            // C2 goes back into the heap\n        check(nearLot.park(new Car(\"N3\")).spot.id.equals(\"C2\"), \"a vacated spot re-enters in distance order, so C2 is handed out again\");\n\n        // 13. pricing rules stack, and the order of wrapping is the answer\n        ParkingLot stackLot = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT));\n        PricingStrategy stack = new MonthlyPassPricing(\n            new DailyCapPricing(new WeekendSurgePricing(new FreeGracePricing(new FlatHourlyPricing(), 15), ZoneId.of(\"UTC\")), 10_000),\n            Set.of(\"PASS-1\"));\n        stackLot.configure(stack, new SmallestFitStrategy());\n        stackLot.park(new Car(\"S1\")); now[0] += 10 * 60_000L;\n        check(stackLot.unpark(\"S1\", new CashPayment()) == 0L, \"ten minutes is inside the fifteen-minute grace: free\");\n        stackLot.park(new Car(\"S2\")); now[0] += 90 * 60_000L;\n        check(stackLot.unpark(\"S2\", new CashPayment()) == 6_000L, \"ninety minutes on a Saturday: 2h x 2000 x 1.5 = 6000 paise\");\n        stackLot.park(new Car(\"S3\")); now[0] += 20 * 3_600_000L;\n        check(stackLot.unpark(\"S3\", new CashPayment()) == 10_000L, \"twenty hours hits the cap of 10000 paise, because the cap wraps the surge\");\n        stackLot.park(new Car(\"PASS-1\")); now[0] += 5 * 3_600_000L;\n        check(stackLot.unpark(\"PASS-1\", new CashPayment()) == 0L, \"a monthly pass holder pays nothing and still frees the spot\");\n        check(stackLot.availability().get(SpotType.COMPACT) == 1, \"every one of those exits freed its spot\");\n\n        // 14. electric spots: a charger is behaviour, so it is a subclass, and the meter is on the bill\n        now[0] = SAT_10AM;\n        ParkingFloor evFloor = new ParkingFloor(\"F1\");\n        evFloor.addSpot(new ParkingSpot(\"C1\", SpotType.COMPACT));\n        evFloor.addSpot(new EvSpot(\"EV1\", SpotType.COMPACT, 7.0, () -> now[0]));\n        ParkingLot evLot = new ParkingLot();\n        evLot.setClock(() -> now[0]);\n        evLot.configure(new ChargingPricing(new FlatHourlyPricing(), 1_200), new EvAwareAssignment(new SmallestFitStrategy()));\n        evLot.addFloor(evFloor);\n        check(evLot.park(new Car(\"PETROL\")).spot.id.equals(\"C1\"), \"a petrol car does not take the charger while an ordinary spot is free\");\n        check(evLot.park(new ElectricCar(\"TESLA\")).spot.id.equals(\"EV1\"), \"the electric car gets the charging spot\");\n        now[0] += 2 * 3_600_000L;\n        check(evLot.unpark(\"TESLA\", new CardPayment()) == 20_800L, \"the bill is 2h x 2000 parking + 14 kWh x 1200 = 20800 paise\");\n        check(evLot.unpark(\"PETROL\", new CardPayment()) == 4_000L, \"the petrol car's bill has no charge on it\");\n        check(evLot.park(new Car(\"LATE1\")).spot.id.equals(\"C1\"), \"with both free again, the petrol car still avoids the charger\");\n        check(evLot.park(new Car(\"LATE2\")).spot.id.equals(\"EV1\"), \"but it does take the charger when that is the last spot left\");\n\n        // 15. reservations: a booked spot is held, expires, and comes back\n        now[0] = SAT_10AM;\n        ParkingFloor resFloor = floor(\"F1\", \"C1\", SpotType.COMPACT, \"C2\", SpotType.COMPACT);\n        ParkingLot resLot = lot(now, resFloor);\n        ReservationDesk desk = new ReservationDesk(List.of(resFloor), new SmallestFitStrategy(), () -> now[0]);\n        check(desk.reserve(\"BOOK\", VehicleType.CAR, now[0] + 30 * 60_000L) != null, \"the booking holds a fitting spot\");\n        check(resFloor.freeCount(SpotType.COMPACT) == 1, \"the held spot has left the free queue: one is left for walk-ins\");\n        desk.reserve(\"LATE\", VehicleType.CAR, now[0] + 10 * 60_000L);\n        check(resFloor.freeCount(SpotType.COMPACT) == 0, \"two bookings hold two spots\");\n        try { resLot.park(new Car(\"WALKIN\")); check(false, \"a walk-in must be rejected while both spots are held\"); }\n        catch (IllegalStateException e) { check(true, \"the walk-in is rejected: both spots are booked\"); }\n        check(desk.claim(new Car(\"BOOK\")) != null, \"the car that turns up in time gets its ticket\");\n        now[0] += 11 * 60_000L;\n        check(desk.sweep() == 1, \"the booking nobody claimed is swept back once its deadline passes\");\n        check(resFloor.freeCount(SpotType.COMPACT) == 1, \"and its spot is free again for whoever turns up\");\n        try { desk.claim(new Car(\"LATE\")); check(false, \"a swept reservation must not be claimable\"); }\n        catch (NoSuchElementException e) { check(true, \"the late car finds no reservation and must park as a walk-in\"); }\n        check(resLot.park(new Car(\"WALKIN\")) != null, \"the walk-in turned away a minute ago now parks in the swept spot\");\n\n        // 16. the display board at a thousand updates a second: coalesce, never queue\n        CoalescingBoard board = new CoalescingBoard();\n        ParkingFloor boardFloor = floor(\"F1\", \"C1\", SpotType.COMPACT);\n        boardFloor.addObserver(board);\n        ParkingLot boardLot = lot(now, boardFloor);\n        for (int i = 0; i < 1000; i++) board.onChange(\"F1\", Map.of(SpotType.COMPACT, i));\n        board.render();\n        check(board.renderCount() == 1, \"1000 updates became 1 render: intermediate snapshots are dropped, not queued\");\n        check(board.lastRendered().get(SpotType.COMPACT) == 999, \"and what it shows is the newest count, not the oldest\");\n        check(boardLot.park(new Car(\"BRD\")) != null, \"a gate is never slowed by the board: onChange is one map write\");\n\n        // 17. the same claim in a database: a conditional UPDATE, fifty callers, one row\n        SpotTable table = new SpotTable();\n        table.insert(\"C1\");\n        ExecutorService dbPool = Executors.newFixedThreadPool(8);\n        CountDownLatch dbGo = new CountDownLatch(1);\n        AtomicInteger rows = new AtomicInteger();\n        List<Future<?>> dbTries = new ArrayList<>();\n        for (int i = 0; i < 50; i++) { String plate = \"D\" + i; dbTries.add(dbPool.submit(() -> { dbGo.await(); rows.addAndGet(table.claim(\"C1\", plate)); return null; })); }\n        dbGo.countDown();\n        for (Future<?> f : dbTries) f.get();\n        dbPool.shutdown();\n        check(rows.get() == 1, \"UPDATE ... WHERE plate IS NULL: 50 callers, 1 row updated\");\n        check(table.release(\"C1\", \"nobody\") == 0, \"releasing someone else's spot updates no rows\");\n        check(table.release(\"C1\", table.plateOf(\"C1\")) == 1, \"the owner's release updates exactly one row\");\n\n        // 18. a truck needs two adjacent spots: both, or nothing at all\n        ParkingFloor truckFloor = floor(\"F1\", \"L1\", SpotType.LARGE, \"L2\", SpotType.LARGE, \"L3\", SpotType.LARGE);\n        TruckParking trucks = new TruckParking(new AdjacentAssignment(Map.of(\"L1\", \"L2\", \"L2\", \"L3\")));\n        MultiSpotTicket first = trucks.park(new Truck(\"TR1\"), truckFloor);\n        check(first != null && first.spots.size() == 2, \"the first truck gets a pair of neighbours\");\n        check(trucks.park(new Truck(\"TR2\"), truckFloor) == null, \"the second truck gets nothing: one lone spot is not a pair\");\n        check(truckFloor.freeCount(SpotType.LARGE) == 1, \"and nothing was half-taken: exactly one large spot is still free\");\n        trucks.release(first, truckFloor);\n        check(truckFloor.freeCount(SpotType.LARGE) == 3, \"releasing gives both spots back together\");\n\n        // 19. the ticket's life as a table: an illegal move throws instead of quietly passing\n        try { TicketState.ISSUED.to(TicketState.CLOSED); check(false, \"closing before paying must throw\"); }\n        catch (IllegalStateException e) { check(true, \"ISSUED -> CLOSED is refused by the transition table\"); }\n        check(TicketState.ISSUED.to(TicketState.PAYING).to(TicketState.PAID).to(TicketState.CLOSED) == TicketState.CLOSED, \"ISSUED -> PAYING -> PAID -> CLOSED is the legal path\");\n\n        // 20. the ladder rungs still hold the invariant\n        CasFloor cas = new CasFloor();\n        cas.add(new CasSpot(\"C1\", SpotType.COMPACT));\n        ExecutorService casPool = Executors.newFixedThreadPool(8);\n        CountDownLatch casGo = new CountDownLatch(1);\n        AtomicInteger casWins = new AtomicInteger();\n        for (int i = 0; i < 50; i++) { String plate = \"X\" + i; casPool.submit(() -> { casGo.await(); if (cas.claim(new Car(plate)) != null) casWins.incrementAndGet(); return null; }); }\n        casGo.countDown(); casPool.shutdown(); casPool.awaitTermination(5, TimeUnit.SECONDS);\n        check(casWins.get() == 1, \"rung 2, no lock at all: 50 compare-and-set claims, 1 winner\");\n        ParkingFloor fa = floor(\"F1\", \"C1\", SpotType.COMPACT), fb = floor(\"F2\", \"C2\", SpotType.COMPACT);\n        FloorLocked perFloor = new FloorLocked(List.of(fa, fb), new SmallestFitStrategy());\n        perFloor.park(new Car(\"P1\"));\n        check(perFloor.park(new Car(\"P2\")).floor.id.equals(\"F2\"), \"rung 1, a lock per floor: the second car spills onto F2\");\n\n        // 21. money is a long count of paise (100 paise = one rupee), so every fee is exact\n        now[0] = SAT_10AM;\n        ParkingFloor tariffFloor = new ParkingFloor(\"F1\");\n        tariffFloor.addSpot(new EvSpot(\"EV1\", SpotType.COMPACT, 7.0, () -> now[0]));\n        ParkingLot tariff = new ParkingLot();\n        tariff.setClock(() -> now[0]);\n        tariff.configure(new ChargingPricing(new FlatHourlyPricing(), 710), new SmallestFitStrategy());   // Rs 7.10 a kWh\n        tariff.addFloor(tariffFloor);\n        tariff.park(new ElectricCar(\"EV-7\")); now[0] += 2 * 3_600_000L;\n        check(tariff.unpark(\"EV-7\", new CardPayment()) == 13_940L, \"2 h x Rs 20 + 14 kWh x Rs 7.10 = 13940 paise exactly (in double rupees: 139.39999999999998)\");\n        Ticket odd = new Ticket(new ParkingSpot(\"X1\", SpotType.COMPACT), tariffFloor, new Car(\"ODD\"), SAT_10AM);\n        odd.exitMs = SAT_10AM;\n        check(new WeekendSurgePricing(t -> 1_001L, ZoneId.of(\"UTC\")).price(odd) == 1_502L, \"1.5x in whole paise: 1001 x 1.5 = 1501.5, and the half paisa rounds up to 1502\");\n\n        // 22. a timeout, then a retry: the same key, so the driver is charged once\n        ParkingLot flaky = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT));\n        flaky.park(new Car(\"TMO\"));\n        IdempotentGateway gateway = new IdempotentGateway(true);        // the first charge goes through, but its answer times out\n        try { flaky.unpark(\"TMO\", gateway); check(false, \"a timeout must not look like a success\"); }\n        catch (IllegalStateException e) { check(true, \"the timeout is reported as not confirmed: \" + e.getMessage()); }\n        check(flaky.isFullFor(VehicleType.CAR), \"while the outcome is unknown the ticket is PENDING and the spot is still held\");\n        check(flaky.unpark(\"TMO\", gateway) == 2_000L && gateway.charges() == 1, \"the retry sends the same key: the gateway returns its first answer, one charge of 2000 paise\");\n        check(!flaky.isFullFor(VehicleType.CAR), \"and the retry committed: the spot is free again\");\n\n        // 23. a slow card at one exit holds no lock: a park at another gate goes straight through,\n        //     and a second checkout of the same ticket is refused while the first is PAYING\n        ParkingLot slow = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT, \"C2\", SpotType.COMPACT));\n        slow.park(new Car(\"SLOW\"));\n        CountDownLatch inCall = new CountDownLatch(1), cardAnswers = new CountDownLatch(1);\n        PaymentProcessor slowCard = (key, paise) -> {\n            inCall.countDown();                                            // the card call has started\n            try { cardAnswers.await(); } catch (InterruptedException e) { return PaymentStatus.UNKNOWN; }\n            return PaymentStatus.OK;\n        };\n        ExecutorService gates = Executors.newFixedThreadPool(3);\n        Future<Long> exiting = gates.submit(() -> slow.unpark(\"SLOW\", slowCard));\n        inCall.await();                                                    // exit gate 1 is now waiting on the card\n        check(finishesWithin(gates.submit(() -> slow.park(new Car(\"FAST\"))), 2), \"a park at another gate completes while a card payment is in flight: no lock is held during the call\");\n        check(refusedWithin(gates.submit(() -> slow.unpark(\"SLOW\", new CashPayment())), 2), \"a second checkout of the same ticket while it is PAYING is refused at once, not queued and not charged\");\n        cardAnswers.countDown();                                           // the card says OK\n        check(exiting.get() == 2_000L, \"the first checkout completes once the card answers: 2000 paise\");\n        gates.shutdown();\n\n        // 24. the Gojek / GoTo version: the statement's own command script, output compared exactly\n        String script = String.join(\"\\n\",\n            \"create_parking_lot 6\", \"park KA-01-HH-1234 White\", \"park KA-01-HH-9999 White\", \"park KA-01-BB-0001 Black\",\n            \"park KA-01-HH-7777 Red\", \"park KA-01-HH-2701 Blue\", \"park KA-01-HH-3141 Black\", \"leave 4\", \"status\",\n            \"park KA-01-P-333 White\", \"park DL-12-AA-9999 White\", \"registration_numbers_for_cars_with_colour White\",\n            \"slot_numbers_for_cars_with_colour White\", \"slot_number_for_registration_number KA-01-HH-3141\",\n            \"slot_number_for_registration_number MH-04-AY-1111\");\n        String expected = String.join(\"\\n\",\n            \"Created a parking lot with 6 slots\", \"Allocated slot number: 1\", \"Allocated slot number: 2\", \"Allocated slot number: 3\",\n            \"Allocated slot number: 4\", \"Allocated slot number: 5\", \"Allocated slot number: 6\", \"Slot number 4 is free\",\n            \"Slot No.    Registration No    Colour\",\n            \"1           KA-01-HH-1234      White\",\n            \"2           KA-01-HH-9999      White\",\n            \"3           KA-01-BB-0001      Black\",\n            \"5           KA-01-HH-2701      Blue\",\n            \"6           KA-01-HH-3141      Black\",\n            \"Allocated slot number: 4\", \"Sorry, parking lot is full\", \"KA-01-HH-1234, KA-01-HH-9999, KA-01-P-333\", \"1, 2, 4\",\n            \"6\", \"Not found\") + \"\\n\";\n        ByteArrayOutputStream printed = new ByteArrayOutputStream();\n        new CommandShell().run(new BufferedReader(new StringReader(script)), new PrintStream(printed, true));\n        check(printed.toString().replace(\"\\r\\n\", \"\\n\").equals(expected), \"the Gojek command script prints exactly the expected output: the freed slot 4 is the next one given\");\n\n        // 25. a declined card, then another card: a gateway keeps its FIRST answer per key, so the second try\n        //     must carry a new key, or it would be told \"declined\" again whatever card is used\n        ParkingLot declined = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT));\n        declined.park(new Car(\"DEC\"));\n        Map<String, PaymentStatus> firstAnswer = new ConcurrentHashMap<>();\n        int[] gatewayCalls = {0};\n        PaymentProcessor strictGateway = (key, paise) -> firstAnswer.computeIfAbsent(key, k -> ++gatewayCalls[0] == 1 ? PaymentStatus.DECLINED : PaymentStatus.OK);\n        try { declined.unpark(\"DEC\", strictGateway); check(false, \"the first card must be declined\"); }\n        catch (IllegalStateException ex) { check(true, \"the first card is declined and nothing is committed\"); }\n        long secondTry;\n        try { secondTry = declined.unpark(\"DEC\", strictGateway); } catch (IllegalStateException ex) { secondTry = -1; }\n        check(secondTry == 2_000L && firstAnswer.size() == 2, \"the second card goes out under a new key (attempt 1) and is charged: 2000 paise\");\n\n        // 26. a timeout, then the driver offers cash: the unconfirmed card payment is retried where it\n        //     started, so the driver is never charged by card AND in cash\n        ParkingLot mixed = lot(now, floor(\"F1\", \"C1\", SpotType.COMPACT));\n        mixed.park(new Car(\"MIX\"));\n        IdempotentGateway card = new IdempotentGateway(true);            // the card was charged, but the answer timed out\n        int[] cashTaken = {0};\n        PaymentProcessor cash = (key, paise) -> { cashTaken[0]++; return PaymentStatus.OK; };\n        try { mixed.unpark(\"MIX\", card); check(false, \"a timeout must not look like a success\"); }\n        catch (IllegalStateException ex) { check(true, \"the card timed out: the ticket waits as PENDING\"); }\n        check(mixed.unpark(\"MIX\", cash) == 2_000L && card.charges() == 1 && cashTaken[0] == 0, \"the retry goes back to the card gateway, which confirms its one charge; no cash is taken on top\");\n\n        System.out.println(failures == 0 ? \"ALL PASS\" : failures + \" FAILED\");\n        if (failures != 0) System.exit(1);\n    }\n\n    /** True if the task finished within the given seconds; a task stuck behind a lock times out instead. */\n    static boolean finishesWithin(Future<?> f, int seconds) throws InterruptedException {\n        try { f.get(seconds, TimeUnit.SECONDS); return true; } catch (TimeoutException | ExecutionException e) { return false; }\n    }\n    /** True if the task was refused (IllegalStateException) within the given seconds, not run and not stuck. */\n    static boolean refusedWithin(Future<?> f, int seconds) throws InterruptedException {\n        try { f.get(seconds, TimeUnit.SECONDS); return false; }\n        catch (ExecutionException e) { return e.getCause() instanceof IllegalStateException; }\n        catch (TimeoutException e) { return false; }\n    }\n}\n"};

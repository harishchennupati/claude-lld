wer, after the timer</summary><div class=\"ans\"><p>The race lives in the gap between reading 'C1 is free' and writing 'C1 is taken'. <code>park</code> does find, take and assign inside one lock, so no other gate can run in that gap. The proof is a test, not a paragraph: fifty gates wait on one latch, the latch opens, all fifty call park for the last compact spot, and the test counts the tickets that came back. Exactly one; the other forty-nine get 'Lot full for CAR'. It then checks that the lot is full and that the free count is zero, because 'one winner' would also be true if the spot had simply been lost.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 11. the race: fifty gates, one compact spot, one latch, exactly one winner\n        ParkingLot race = lot(now, floor(&quot;F1&quot;, &quot;C1&quot;, SpotType.COMPACT));\n        EntryGate gate = new EntryGate(race);\n        ExecutorService pool = Executors.newFixedThreadPool(50);          // one thread per gate: all fifty wait at the latch together\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;Ticket&gt;&gt; tries = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) { String plate = &quot;R&quot; + i; tries.add(pool.submit(() -&gt; { go.await(); return gate.admit(new Car(plate)); })); }\n        go.countDown();\n        int wins = 0;\n        for (Future&lt;Ticket&gt; f : tries) { try { f.get(); wins++; } catch (ExecutionException e) { /* &quot;Lot full for CAR&quot; */ } }\n        pool.shutdown();\n        check(wins == 1, &quot;50 gates raced for the last spot; winners = &quot; + wins);\n        check(race.isFullFor(VehicleType.CAR), &quot;the lot is full afterwards: one spot, one car&quot;);\n        check(race.availability().get(SpotType.COMPACT) == 0, &quot;no spot was handed out twice and none was lost&quot;);\n\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; Ten gates on one lock. Does that scale, or are you serialising the whole car park?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It serialises them, for about a microsecond and a half each. Inside the lock there is a map lookup, a walk over a handful of floors, one queue poll and two field writes; everything slow is outside it: printing the ticket, lifting the barrier, the board, the driver. The card payment at exit, about half a second, is outside too: the ticket is marked PAYING in one short locked step, the card is charged with no lock held, and a second short locked step commits. Ten gates admitting a car every three seconds is three parks a second and about as many exits, so the lock is busy about ten microseconds in every million: the barrier arm serialises cars far more than the lock does. Had the card call stayed inside, three exits a second would need a second and a half of lock every second, and the lock would never catch up. The ladder from here, cheapest first: a lock per floor; then compare-and-set on each spot. Climb it only when the arithmetic says to, and know what each rung costs: the per-floor lock below no longer holds the duplicate-plate check and the spot claim together.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: ladder rung 1 -- a lock per floor, so gates on different floors never wait for each other\n/** The same park(), with the one lot lock replaced by one lock per floor. */\nclass FloorLocked {\n    private final List&lt;ParkingFloor&gt; floors;\n    private final Map&lt;ParkingFloor, ReentrantLock&gt; locks = new HashMap&lt;&gt;();\n    private final SpotAssignmentStrategy assignment;\n    private final Map&lt;String, Ticket&gt; active = new ConcurrentHashMap&lt;&gt;();\n    FloorLocked(List&lt;ParkingFloor&gt; floors, SpotAssignmentStrategy a) {\n        this.floors = floors; this.assignment = a;\n        for (ParkingFloor f : floors) locks.put(f, new ReentrantLock());\n    }\n    /** Find and take a spot holding only the lock of the floor being looked at. */\n    Ticket park(Vehicle v) {\n        if (active.containsKey(v.plate)) throw new IllegalStateException(&quot;Already parked: &quot; + v.plate);\n        for (ParkingFloor floor : floors) {\n            ReentrantLock l = locks.get(floor);\n            l.lock();                                              // only this floor is serialised\n            try {\n                ParkingSpot spot = assignment.find(floor, v);\n                if (spot != null) {\n                    floor.take(spot); spot.assign(v);\n                    Ticket t = new Ticket(spot, floor, v, System.currentTimeMillis());\n                    active.put(v.plate, t);\n                    return t;\n                }\n            } finally { l.unlock(); }\n        }\n        throw new IllegalStateException(&quot;Lot full for &quot; + v.type);\n    }\n}\n// Note what the second lock cost: the duplicate-plate check is no longer inside the lock that hands out\n// the spot, so the same plate arriving at two floors at once can now get two spots. The fix is a second\n// atomic step -- putIfAbsent a PENDING marker into `active` before the floor loop, removed if no floor\n// had room. That is what buying floor-level concurrency actually costs, and why you climb the ladder\n// only after the arithmetic in move 8 says you must.\n\n// ---- ext: ladder rung 2 -- no lock at all: claim a spot with one compare-and-set\n/** A spot whose occupant is claimed with a single atomic instruction; exactly one caller can win. */\nclass CasSpot {\n    final String id; final SpotType type;\n    private final AtomicReference&lt;Vehicle&gt; occupant = new AtomicReference&lt;&gt;();\n    CasSpot(String id, SpotType type) { this.id = id; this.type = type; }\n    /** null -&gt; v in one hardware step. True means you got it. */\n    boolean tryClaim(Vehicle v) { return occupant.compareAndSet(null, v); }\n    void release() { occupant.set(null); }\n    boolean isFree() { return occupant.get() == null; }\n}\n/** The lock-free floor: walk the fitting sizes and claim the first spot that lets you. */\nclass CasFloor {\n    private final Map&lt;SpotType, List&lt;CasSpot&gt;&gt; spots = new EnumMap&lt;&gt;(SpotType.class);\n    CasFloor() { for (SpotType st : SpotType.values()) spots.put(st, new ArrayList&lt;&gt;()); }\n    void add(CasSpot s) { spots.get(s.type).add(s); }\n    /** The spot this vehicle got, or null. A loser simply keeps scanning; nobody ever waits. */\n    CasSpot claim(Vehicle v) {\n        for (SpotType st : Fit.ORDER.get(v.type))\n            for (CasSpot s : spots.get(st))\n                if (s.tryClaim(v)) return s;\n        return null;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; A driver lost the ticket. Implement it.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The duration is unknown, so the fee is a flat daily cap. <code>reportLost</code> runs the same three steps as <code>unpark</code>, with the cap as the fee. Under the lock it finds the ticket without removing it and marks it PAYING. It takes the cap with no lock held. Then, under the lock again, it marks the ticket LOST, removes it, releases the spot, gives the spot back to the floor and marks it CLOSED; that last step is <code>settle</code>, shared with <code>unpark</code>. If the payment is declined the ticket goes back to ISSUED and the driver can try another card. The exit gate has a <code>lostTicket</code> method so the barrier flow is the same as a normal exit. The transition table in the second block is the explicit version of the rule: every move that is not in the table throws, so a close before a pay is refused rather than quietly done.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    long reportLost(String plate, PaymentProcessor payment, long dailyCapPaise) {\n        Ticket t; PaymentProcessor via;\n        lock.lock();                                  // step 1\n        try {\n            t = active.get(plate);\n            if (t == null) throw new NoSuchElementException(&quot;No active ticket: &quot; + plate);\n            if (t.status != TicketStatus.ISSUED &amp;&amp; t.status != TicketStatus.PENDING)\n                throw new IllegalStateException(&quot;Payment already in progress: &quot; + plate);\n            if (t.status == TicketStatus.ISSUED) { t.exitMs = clock.nowMs(); t.feePaise = dailyCapPaise; }\n            via = t.status == TicketStatus.PENDING ? t.pendingOn : payment;   // same rule as unpark\n            t.status = TicketStatus.PAYING;\n        } finally { lock.unlock(); }\n        PaymentStatus answer;\n        try { answer = via.pay(t.payKey(), t.feePaise); }                // step 2: no lock held\n        catch (RuntimeException e) { answer = PaymentStatus.UNKNOWN; }\n        return settle(t, answer, TicketStatus.LOST, via);  // step 3, shared with unpark: LOST, remove, free, CLOSED\n    }\n\n// ---- ext: the ticket&#x27;s life as an explicit transition table (illegal transitions throw, never silently pass)\n/** The same six states as TicketStatus, plus the table of which move is legal from which state. */\nenum TicketState {\n    ISSUED, PAYING, PENDING, PAID, LOST, CLOSED;\n    private static final Map&lt;TicketState, Set&lt;TicketState&gt;&gt; ALLOWED = Map.of(\n        ISSUED,  EnumSet.of(PAYING),                        // checkout starts; a second one is now refused\n        PAYING,  EnumSet.of(PAID, LOST, ISSUED, PENDING),   // paid / paid the lost-ticket cap / declined / timed out\n        PENDING, EnumSet.of(PAYING),                        // the retry: same key, same amount\n        PAID,    EnumSet.of(CLOSED),\n        LOST,    EnumSet.of(CLOSED),\n        CLOSED,  EnumSet.noneOf(TicketState.class));\n    /** The next state, or an exception naming the move that is not in the table. */\n    TicketState to(TicketState next) {\n        if (!ALLOWED.get(this).contains(next)) throw new IllegalStateException(this + &quot; -&gt; &quot; + next + &quot; not allowed&quot;);\n        return next;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; Payment fails at the exit gate. What is the state of the system, and show me the code handling it.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing is half done, and nothing waits on the card. In a short locked step, <code>unpark</code> finds the ticket (it does not remove it), refuses it if a payment is already in flight, marks it PAYING, stamps the exit time and prices it. The payment then runs with no lock held, and the ticket id goes with it as the idempotency key. If the card is declined, a second short locked step puts the ticket back to ISSUED: the spot is still held, and the driver tries another card or pays cash. That next try goes out under a new key (the ticket id plus an attempt number), because a gateway keeps its first answer for each key and would say 'declined' again to any card. Only after a successful payment does that step mark PAID, remove the ticket from the active map, release the spot, give it back to the floor's queue, and mark CLOSED. A timeout answers UNKNOWN: the money may have moved, so the ticket waits as PENDING with the same amount. The retry sends the same key and amount to the same gateway, which keeps one result per key and hands back its first answer instead of charging again. If the driver offers cash at that point, the lot still asks the card gateway first, so nobody pays by card and in cash. A second checkout while the ticket is PAYING is refused, and one after it is CLOSED finds no ticket, so nobody is charged twice and no spot is freed twice. The second block is the same order written against the transition table, where an illegal move cannot pass even by accident. The third is the gateway's side: it remembers each key it charged and answers a repeat with OK.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    long unpark(String plate, PaymentProcessor payment) {\n        Ticket t; PaymentProcessor via;\n        lock.lock();                                  // step 1: short, nothing slow inside\n        try {\n            t = active.get(plate);                    // peek: commit nothing until the money has moved\n            if (t == null) throw new NoSuchElementException(&quot;No active ticket: &quot; + plate);\n            if (t.status != TicketStatus.ISSUED &amp;&amp; t.status != TicketStatus.PENDING)\n                throw new IllegalStateException(&quot;Payment already in progress: &quot; + plate);   // a second checkout while PAYING\n            if (t.status == TicketStatus.ISSUED) { t.exitMs = clock.nowMs(); t.feePaise = pricing.price(t); }\n            via = t.status == TicketStatus.PENDING ? t.pendingOn : payment;   // an unconfirmed payment is retried where it started, never in cash on top\n            t.status = TicketStatus.PAYING;           // a PENDING retry keeps its amount: same key, same paise\n        } finally { lock.unlock(); }\n        PaymentStatus answer;\n        try { answer = via.pay(t.payKey(), t.feePaise); }                // step 2: ~500 ms at a card gateway, NO lock held\n        catch (RuntimeException e) { answer = PaymentStatus.UNKNOWN; }    // a gateway that throws: nobody knows if money moved\n        return settle(t, answer, TicketStatus.PAID, via);  // step 3\n    }\n\n    /**\n     * Step 3 of an exit, under the lock again, with the gateway&#x27;s answer. OK: commit (PAID or LOST, remove,\n     * free the spot, CLOSED) and tell the board after the lock. DECLINED: back to ISSUED, nothing else\n     * changed; the driver retries. UNKNOWN (a timeout): PENDING, the spot still held; the retry sends the\n     * same key and amount, and the gateway returns its first answer instead of charging again.\n     */\n    private long settle(Ticket t, PaymentStatus answer, TicketStatus paidAs, PaymentProcessor via) {\n        Map&lt;SpotType, Integer&gt; counts;\n        lock.lock();\n        try {\n            if (answer == PaymentStatus.DECLINED) { t.status = TicketStatus.ISSUED; t.attempt++; t.pendingOn = null; throw new IllegalStateException(&quot;Payment declined&quot;); }   // next try: a new key\n            if (answer == PaymentStatus.UNKNOWN) { t.status = TicketStatus.PENDING; t.pendingOn = via; throw new IllegalStateException(&quot;Payment not confirmed: retry; the same key cannot charge twice&quot;); }\n            t.pendingOn = null;\n            t.status = paidAs;                        // money moved: now commit\n            active.remove(t.vehicle.plate);\n            t.spot.release();\n            t.floor.vacate(t.spot);                   // O(1): ticket knew its floor\n            t.status = TicketStatus.CLOSED;\n            counts = t.floor.snapshot();\n        } finally { lock.unlock(); }\n        t.floor.publish(counts);                      // the board hears AFTER the lock, same as park()\n        return t.feePaise;\n    }\n\n/** The same three steps unpark() uses, with the state table doing the checking out loud. */\nclass ExitFlow {\n    /**\n     * PAYING, then the payment, and only then commit: PAID, free the spot, CLOSED. Returns the fee in paise,\n     * or -1 when the payment was declined (back to ISSUED) or not confirmed (PENDING: retry with the same key).\n     */\n    static long checkout(Ticket t, PricingStrategy pricing, PaymentProcessor pay, Clock clock, Runnable freeSpot) {\n        TicketState from = TicketState.valueOf(t.status.name());\n        t.status = TicketStatus.valueOf(from.to(TicketState.PAYING).name());   // a second checkout while PAYING throws here\n        if (from == TicketState.ISSUED) { t.exitMs = clock.nowMs(); t.feePaise = pricing.price(t); }   // PENDING keeps its amount\n        PaymentProcessor via = (from == TicketState.PENDING &amp;&amp; t.pendingOn != null) ? t.pendingOn : pay;   // retry where it started\n        TicketState next = switch (via.pay(t.payKey(), t.feePaise)) {  // the gateway&#x27;s answer picks the next state\n            case OK       -&gt; TicketState.PAID;\n            case DECLINED -&gt; TicketState.ISSUED;                       // the driver tries another card\n            case UNKNOWN  -&gt; TicketState.PENDING;                      // the retry re-sends the same key and amount\n        };\n        t.status = TicketStatus.valueOf(TicketState.PAYING.to(next).name());\n        if (next == TicketState.ISSUED) { t.attempt++; t.pendingOn = null; }   // declined: the next try is a new payment, a new key\n        if (next == TicketState.PENDING) t.pendingOn = via;\n        if (next != TicketState.PAID) return -1;                       // nothing committed; the driver retries\n        freeSpot.run();                                                // only after the money moved\n        t.status = TicketStatus.valueOf(TicketState.PAID.to(TicketState.CLOSED).name());\n        return t.feePaise;\n    }\n}\n\n/**\n * What a card gateway does with the idempotency key, as a fake a test can drive. It remembers every key it\n * charged; a retry with that key gets OK back and nothing is charged again. timeoutFirst makes the first\n * charge go through but answer UNKNOWN, the way a network timeout does after the bank already took the money.\n */\nclass IdempotentGateway implements PaymentProcessor {\n    private final Map&lt;String, Long&gt; charged = new ConcurrentHashMap&lt;&gt;();    // key -&gt; paise taken under it\n    private final AtomicBoolean timeoutFirst;\n    IdempotentGateway(boolean timeoutFirst) { this.timeoutFirst = new AtomicBoolean(timeoutFirst); }\n    public PaymentStatus pay(String key, long paise) {\n        if (charged.putIfAbsent(key, paise) != null) return PaymentStatus.OK;   // seen this key: the first answer, no second charge\n        return timeoutFirst.getAndSet(false) ? PaymentStatus.UNKNOWN : PaymentStatus.OK;   // charged; did the answer get back?\n    }\n    /** How many charges were made: one per key, however many times a key was sent. */\n    int charges() { return charged.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>6 &middot; The app asks &#x27;how many compact spots are free on floor 2?&#x27; a thousand times a second. Make it O(1).</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No new structure is needed. Each floor already keeps a queue of free spots per size, so the answer is the size of floor 2's compact queue. The lot keeps its floors in a map by id as well as in a list, so finding floor 2 is O(1) too, and <code>freeCount(floorId, size)</code> reads it under the lock so a count is never torn by a park happening at that instant; that costs tens of nanoseconds, not milliseconds. Lot-wide <code>availability()</code> sums the same numbers over floors and sizes, never a scan of spots. An unknown floor id is an error, not a zero. At a million spots and a hundred floors, keep a running count per floor and size updated under the same lock and the sum is O(1) as well.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    Map&lt;SpotType, Integer&gt; availability() {\n        lock.lock();\n        try {\n            Map&lt;SpotType, Integer&gt; total = new EnumMap&lt;&gt;(SpotType.class);\n            for (SpotType st : SpotType.values()) total.put(st, 0);\n            for (ParkingFloor f : floors)\n                for (SpotType st : SpotType.values())\n                    total.merge(st, f.freeCount(st), Integer::sum);\n            return total;\n        } finally { lock.unlock(); }\n    }\n    /**\n     * Free spots of one size on ONE floor: what the display board and the app ask for. O(1), the size of\n     * that queue, read under the lock so a count is never torn by a park happening at the same moment.\n     */\n    int freeCount(String floorId, SpotType st) {\n        lock.lock();\n        try {\n            ParkingFloor f = byId.get(floorId);\n            if (f == null) throw new NoSuchElementException(&quot;No floor: &quot; + floorId);\n            return f.freeCount(st);\n        } finally { lock.unlock(); }\n    }\n    /** True when no floor has any spot this vehicle type may use. */\n    boolean isFullFor(VehicleType v) {\n        lock.lock();\n        try {\n            for (ParkingFloor f : floors)\n                for (SpotType st : Fit.ORDER.get(v))\n                    if (f.freeCount(st) &gt; 0) return false;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n// on the floor, the number itself:\nint freeCount(SpotType st) { return free.get(st).size(); }   // O(1)\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; The display board refreshes a thousand times a second and the renderer is slow. What happens to the gates?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing, and that is the point of publishing after the lock. <code>park</code> takes a snapshot of the counts inside the lock, releases the lock, and only then calls the observers, each in a try/catch, so a board that throws or takes a second delays nobody's spot and corrupts nothing. What is still wrong at a thousand updates a second is queueing them: a board only ever shows the newest number, so the ones in between are worth nothing. The coalescing board stores the newest counts per floor in one map write, which is all the calling gate ever does, and the board's own thread renders whatever is newest when it gets round to it. A thousand updates become one render, and the number shown is the last one, not the first.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    void publish(Map&lt;SpotType, Integer&gt; counts) {     // called after the lock is released; a broken listener cannot break parking\n        for (ParkingObserver o : observers) {\n            try { o.onChange(id, counts); } catch (RuntimeException e) { System.err.println(&quot;[observer failed] &quot; + e.getMessage()); }\n        }\n    }\n\n// ---- ext: the display board at a thousand updates a second -- coalesce, never block a gate\n/**\n * A board that cannot fall behind. onChange only stores the newest counts per floor, which is one map\n * write and never blocks the gate that called it; the board&#x27;s own thread renders whatever is newest when\n * it gets round to it, so a thousand updates a second become one render per refresh and intermediate\n * snapshots are dropped, not queued. Losing them is correct: a board only ever shows the latest number.\n */\nclass CoalescingBoard implements ParkingObserver {\n    private final Map&lt;String, Map&lt;SpotType, Integer&gt;&gt; latest = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicInteger renders = new AtomicInteger();\n    private volatile Map&lt;SpotType, Integer&gt; lastRendered;\n    public void onChange(String floorId, Map&lt;SpotType, Integer&gt; free) { latest.put(floorId, free); }   // O(1), never blocks\n    /** What the board&#x27;s own thread does on each refresh tick: render only what is newest. */\n    void render() {\n        for (Map.Entry&lt;String, Map&lt;SpotType, Integer&gt;&gt; e : latest.entrySet()) {\n            lastRendered = e.getValue();\n            renders.incrementAndGet();\n        }\n        latest.clear();\n    }\n    int renderCount() { return renders.get(); }\n    Map&lt;SpotType, Integer&gt; lastRendered() { return lastRendered; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Now a truck needs two adjacent large spots.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Spots gain a neighbour link: a map from a spot id to the spot beside it, from configuration. The search looks for two free neighbouring large spots and returns them as a pair, deterministically (ids in order), and a spot with no neighbour mapped simply has no run. The ticket holds a list of spots instead of one. The reservation is the whole point: the pair is found, both spots are taken out of the floor's queues and both are assigned, all inside one locked section, so a second truck arriving in the middle can never be handed half a pair. Either both moved or nothing was touched. Say the word atomic. Note which way this cuts: it is easy under a lock and hard with compare-and-set per spot, which is a reason not to climb that rung.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a truck needs two adjacent spots -- one invariant across two spots, so both under one lock\n/** Which spot is physically beside which. A spot with no neighbour mapped can never be part of a pair. */\nclass AdjacentAssignment {\n    private final Map&lt;String, String&gt; next;\n    AdjacentAssignment(Map&lt;String, String&gt; next) { this.next = next; }\n    /** Two free neighbouring LARGE spots, or an empty list. Deterministic: ids in order. */\n    List&lt;ParkingSpot&gt; findRun(ParkingFloor floor) {\n        List&lt;ParkingSpot&gt; all = new ArrayList&lt;&gt;(floor.spots());\n        all.sort(Comparator.comparing(s -&gt; s.id));\n        for (ParkingSpot a : all) {\n            String nid = next.get(a.id);\n            ParkingSpot b = nid == null ? null : floor.spot(nid);\n            if (a.type == SpotType.LARGE &amp;&amp; a.occupant() == null\n                &amp;&amp; b != null &amp;&amp; b.type == SpotType.LARGE &amp;&amp; b.occupant() == null) return List.of(a, b);\n        }\n        return List.of();\n    }\n}\n/** A ticket for a vehicle that took more than one spot. Reserved all or none. */\nclass MultiSpotTicket {\n    final List&lt;ParkingSpot&gt; spots; final Vehicle vehicle;\n    MultiSpotTicket(List&lt;ParkingSpot&gt; spots, Vehicle vehicle) { this.spots = spots; this.vehicle = vehicle; }\n}\n/**\n * The whole reservation under ONE lock: find the pair, take both out of the floor&#x27;s free queues and\n * assign both, or touch nothing. A second truck arriving in the middle can never be handed half a pair;\n * that is the word atomic, and it is exactly why the lock is easier here than compare-and-set.\n */\nclass TruckParking {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final AdjacentAssignment adjacent;\n    TruckParking(AdjacentAssignment adjacent) { this.adjacent = adjacent; }\n    /** A pair for this truck, or null when no free pair exists. Nothing is half-taken either way. */\n    MultiSpotTicket park(Truck t, ParkingFloor floor) {\n        lock.lock();\n        try {\n            List&lt;ParkingSpot&gt; run = adjacent.findRun(floor);\n            if (run.isEmpty()) return null;                        // no pair: nothing was touched\n            for (ParkingSpot s : run) { floor.take(s); s.assign(t); }   // both, inside the same lock\n            return new MultiSpotTicket(run, t);\n        } finally { lock.unlock(); }\n    }\n    /** Give a pair back, both together. */\n    void release(MultiSpotTicket mt, ParkingFloor floor) {\n        lock.lock();\n        try { for (ParkingSpot s : mt.spots) { s.release(); floor.vacate(s); } } finally { lock.unlock(); }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; Nearest spot to the exit instead of smallest fit.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The question has two halves and the interviewer wants both. Which free spot of a given size comes next is the ORDER of that size's queue, so the floor is built with a heap keyed by metres from the exit instead of a deque: the head is now the nearest, <code>peekFree</code> is unchanged, and taking or returning a spot costs O(log n) instead of O(1). Which size to prefer is still the strategy, so <code>NearestToExit</code> compares the heads of the fitting sizes and returns the closest of them. Both are handed in; the lot does not change. Be honest about the trade: this rule will give a car a large spot ten metres away over a compact spot fifty metres away, which is exactly what smallest-fit existed to prevent, so a real lot weights distance against wasted size.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: nearest to the exit -- half of it is the floor&#x27;s queue order, half is the choice of size\n/**\n * The queue order that makes a floor hand out its nearest free spot first: a heap keyed by metres from\n * the exit. Pass it to new ParkingFloor(id, nearestFirst(distance)) and peekFree() is now the nearest.\n */\nclass Nearest {\n    static Supplier&lt;Queue&lt;ParkingSpot&gt;&gt; nearestFirst(Map&lt;String, Integer&gt; distance) {\n        return () -&gt; new PriorityQueue&lt;&gt;(Comparator.comparingInt(s -&gt; distance.getOrDefault(s.id, Integer.MAX_VALUE)));\n    }\n}\n\n/**\n * On a distance-ordered floor each size&#x27;s head is already the nearest of that size, so the nearest\n * overall is the best of the three heads: O(sizes), no scan. On an ordinary floor it is only the nearest\n * of whatever the plain queues happen to hold, which is why the floor&#x27;s order is the other half of it.\n */\nclass NearestToExit implements SpotAssignmentStrategy {\n    private final Map&lt;String, Integer&gt; distance;                   // spotId -&gt; metres from the exit, from config\n    NearestToExit(Map&lt;String, Integer&gt; distance) { this.distance = distance; }\n    public ParkingSpot find(ParkingFloor floor, Vehicle v) {\n        ParkingSpot best = null;\n        for (SpotType st : Fit.ORDER.get(v.type)) {\n            ParkingSpot s = floor.peekFree(st);\n            if (s != null &amp;&amp; (best == null || d(s) &lt; d(best))) best = s;\n        }\n        return best;\n    }\n    private int d(ParkingSpot s) { return distance.getOrDefault(s.id, Integer.MAX_VALUE); }\n}\n\n    /** A floor that hands out any free spot of the right size: ArrayDeque, O(1) at both ends. */\n    ParkingFloor(String id) { this(id, ArrayDeque::new); }\n    /**\n     * A floor whose free spots of each size are kept in the order this queue imposes; the head is\n     * whatever the order calls best. Hand in a PriorityQueue by distance and you have nearest-to-exit.\n     */\n    ParkingFloor(String id, Supplier&lt;Queue&lt;ParkingSpot&gt;&gt; order) {\n        this.id = id;\n        for (SpotType st : SpotType.values()) free.put(st, order.get());\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Half the spots have chargers. An electric car should get one, and pay for the electricity.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A charger is behaviour, not a label, so the spot earns a subclass: <code>EvSpot</code> starts the meter when a vehicle is assigned and stops it when the spot is released, which is why it overrides those two methods rather than carrying a boolean. The fee is one more pricing wrapper: the wrapped rule's parking fee plus the meter reading times the price per unit, and only when the ticket's spot is an <code>EvSpot</code>. Which car gets which spot is the assignment rule, which is handed the whole vehicle: an electric car takes a free charger first, and a petrol car leaves the chargers alone while any ordinary spot of its size is free, taking one only as a last resort. Both of those are a scan of the floor here, which is the price of adding a kind of spot from outside the enum; give EV its own SpotType and both are O(1) again.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: electric spots -- a spot that gained BEHAVIOUR, so it earned a subclass\n/** A car that wants a charger. A plain Car to the fit table; the assignment rule looks for the subclass. */\nclass ElectricCar extends Car {\n    ElectricCar(String plate) { super(plate); }\n}\n\n/**\n * A compact spot with a charger. The charger starts when the car is assigned and stops when it is\n * released, which is why this is a subclass and not a flag: it has behaviour of its own.\n */\nclass EvSpot extends ParkingSpot {\n    private final double kW;              // how fast this charger delivers\n    private final Clock clock;\n    private long startedMs = -1;\n    EvSpot(String id, SpotType type, double kW, Clock clock) { super(id, type); this.kW = kW; this.clock = clock; }\n    @Override void assign(Vehicle v) { super.assign(v); startedMs = clock.nowMs(); }     // plug in\n    @Override void release()         { startedMs = -1; super.release(); }                // unplug\n    /** Units delivered so far, read off the meter. Pricing reads this BEFORE the spot is released. */\n    double kWhDelivered() { return startedMs &lt; 0 ? 0 : (clock.nowMs() - startedMs) / 3_600_000.0 * kW; }\n}\n\n/**\n * Parking plus electricity: the wrapped rule&#x27;s fee, plus the meter reading times the unit price. The reading\n * is a measurement, not money, so it becomes paise exactly once, rounded to the nearest paisa.\n */\nclass ChargingPricing implements PricingStrategy {\n    private final PricingStrategy base;\n    private final long paisePerKWh;\n    ChargingPricing(PricingStrategy base, long paisePerKWh) { this.base = base; this.paisePerKWh = paisePerKWh; }\n    public long price(Ticket t) {\n        long p = base.price(t);\n        return t.spot instanceof EvSpot ev ? p + Math.round(ev.kWhDelivered() * paisePerKWh) : p;\n    }\n}\n\n/**\n * An electric car gets a charger if one is free; a petrol car does not take a charger while an ordinary\n * spot is free, and takes one only as a last resort. Both answers are a scan of this floor&#x27;s spots, which\n * is the price of adding a kind of spot from outside: give EV its own SpotType and both are O(1) again.\n */\nclass EvAwareAssignment implements SpotAssignmentStrategy {\n    private final SpotAssignmentStrategy base;\n    EvAwareAssignment(SpotAssignmentStrategy base) { this.base = base; }\n    public ParkingSpot find(ParkingFloor floor, Vehicle v) {\n        boolean wantsCharger = v instanceof ElectricCar;\n        for (SpotType st : Fit.ORDER.get(v.type)) {                 // smallest fitting size first, as before\n            ParkingSpot match = null;\n            for (ParkingSpot s : floor.spots())\n                if (s.type == st &amp;&amp; s.occupant() == null &amp;&amp; (s instanceof EvSpot) == wantsCharger) { match = s; break; }\n            if (match != null) return match;\n        }\n        return wantsCharger ? base.find(floor, v) : lastResort(floor, v);   // no charger free / only chargers left\n    }\n    private ParkingSpot lastResort(ParkingFloor floor, Vehicle v) {\n        for (SpotType st : Fit.ORDER.get(v.type)) { ParkingSpot s = floor.peekFree(st); if (s != null) return s; }\n        return null;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; Let people book a spot for six o&#x27;clock. What if they never turn up?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A booking is not a note on an empty spot, it is an occupant: the desk takes a fitting spot out of the floor's queue and assigns a placeholder vehicle in the name of the plate that booked it, so 'is this spot free?' stays one question with one answer and no walk-in can be given it. Claiming swaps the placeholder for the real vehicle and issues the ticket. The never-turned-up case is a deadline on the hold plus a sweep: anything past its deadline is released and put back in the queue, and a claim that arrives after the deadline is refused and returns the spot too. It is shown as its own class with its own lock so <code>Main.java</code> stays the sixty-minute core; inside the lot it is three more methods under the one lock, in the same order: take the spot, then record the hold.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: reservations -- a spot booked ahead is held by the booking until it expires\n/**\n * The placeholder that sits in a reserved spot. A reservation is not an empty spot with a note on it: it\n * IS an occupant, in the name of the plate that booked it, so &quot;is this spot free?&quot; stays one question.\n */\nclass Reserved extends Vehicle {\n    Reserved(String plate, VehicleType type) { super(plate, type); }\n}\n\n/**\n * Book a spot ahead of time. reserve() takes the spot out of the floor&#x27;s free queue now and holds it for\n * the plate; claim() turns the hold into a real ticket when the car arrives; sweep() gives back every\n * hold whose deadline has passed. Shown with its own lock; inside ParkingLot it would be three more\n * methods under the lot&#x27;s one lock, in the same order: take the spot, then record the hold.\n */\nclass ReservationDesk {\n    /** One hold: the spot, who booked it, and when it stops being theirs. */\n    record Hold(ParkingSpot spot, ParkingFloor floor, String plate, VehicleType type, long expiresMs) {}\n    private final Map&lt;String, Hold&gt; holds = new HashMap&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n    private final List&lt;ParkingFloor&gt; floors;\n    private final SpotAssignmentStrategy assignment;\n    private final Clock clock;\n    ReservationDesk(List&lt;ParkingFloor&gt; floors, SpotAssignmentStrategy assignment, Clock clock) {\n        this.floors = floors; this.assignment = assignment; this.clock = clock;\n    }\n    /** Hold a fitting spot for this plate until expiresMs, or null if nothing fits. */\n    Hold reserve(String plate, VehicleType type, long expiresMs) {\n        Vehicle placeholder = new Reserved(plate, type);\n        lock.lock();\n        try {\n            if (holds.containsKey(plate)) throw new IllegalStateException(&quot;Already reserved: &quot; + plate);\n            for (ParkingFloor f : floors) {\n                ParkingSpot s = assignment.find(f, placeholder);\n                if (s == null) continue;\n                f.take(s);                                   // out of the free queue: no walk-in can be given it\n                s.assign(placeholder);                       // held in the name of the booking\n                Hold h = new Hold(s, f, plate, type, expiresMs);\n                holds.put(plate, h);\n                return h;\n            }\n            return null;\n        } finally { lock.unlock(); }\n    }\n    /** The car turned up: swap the placeholder for the real vehicle and issue the ticket. */\n    Ticket claim(Vehicle v) {\n        lock.lock();\n        try {\n            Hold h = holds.remove(v.plate);\n            if (h == null) throw new NoSuchElementException(&quot;No reservation: &quot; + v.plate);\n            if (clock.nowMs() &gt; h.expiresMs()) { giveBack(h); throw new IllegalStateException(&quot;Reservation expired: &quot; + v.plate); }\n            h.spot().assign(v);\n            return new Ticket(h.spot(), h.floor(), v, clock.nowMs());\n        } finally { lock.unlock(); }\n    }\n    /** Return every hold whose deadline has passed. How many spots came back. */\n    int sweep() {\n        lock.lock();\n        try {\n            int n = 0;\n            for (Iterator&lt;Map.Entry&lt;String, Hold&gt;&gt; it = holds.entrySet().iterator(); it.hasNext(); ) {\n                Hold h = it.next().getValue();\n                if (clock.nowMs() &gt; h.expiresMs()) { giveBack(h); it.remove(); n++; }\n            }\n            return n;\n        } finally { lock.unlock(); }\n    }\n    private void giveBack(Hold h) { h.spot().release(); h.floor().vacate(h.spot()); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Persist it. Or: now there are many branches, in different processes.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The two maps in the lot go behind a repository interface (find a ticket by plate, save, remove) and the in-memory version becomes one implementation; the services above do not change. The spot claim is the interesting half. In one process it is a queue poll under a lock; across processes it becomes one conditional update, <code>UPDATE spot SET plate = ? WHERE id = ? AND plate IS NULL</code>. One row updated means you got it, zero means someone else did, and no lock is held across the network while a gateway is slow. That is the database's compare-and-set, the same idea the <code>ReentrantLock</code> was buying: one atomic step decides the winner. The test runs fifty callers at one row and counts one update.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- the maps become a repository, and the lock becomes a conditional UPDATE\n/** The two maps in the lot, behind an interface. The services above it do not change. */\ninterface TicketRepository {\n    Optional&lt;Ticket&gt; byPlate(String plate);\n    /** Store a ticket, refusing a plate that is already parked. */\n    void save(Ticket t);\n    Ticket remove(String plate);\n}\n/** The in-memory implementation: the same HashMap, now behind the seam. */\nclass InMemoryTicketRepository implements TicketRepository {\n    private final Map&lt;String, Ticket&gt; m = new ConcurrentHashMap&lt;&gt;();\n    public Optional&lt;Ticket&gt; byPlate(String p) { return Optional.ofNullable(m.get(p)); }\n    public void save(Ticket t) { if (m.putIfAbsent(t.vehicle.plate, t) != null) throw new IllegalStateException(&quot;Already parked: &quot; + t.vehicle.plate); }\n    public Ticket remove(String p) { return m.remove(p); }\n}\n/**\n * What the spot claim becomes once the lot is two processes and a database:\n *   UPDATE spot SET plate = ? WHERE id = ? AND plate IS NULL\n * One row updated means you got it; zero means someone else did. No lock is held across the network,\n * and the database decides the winner with the same one-atomic-step idea the ReentrantLock used.\n * computeIfPresent here plays the part of the row lock the database takes for the duration of the UPDATE.\n */\nclass SpotTable {\n    private final Map&lt;String, String&gt; plateOf = new ConcurrentHashMap&lt;&gt;();   // spotId -&gt; plate, &quot;&quot; == NULL\n    void insert(String spotId) { plateOf.put(spotId, &quot;&quot;); }\n    /** Rows updated: 1 if this caller claimed the spot, 0 if it was already taken. */\n    int claim(String spotId, String plate) {\n        int[] rows = { 0 };\n        plateOf.computeIfPresent(spotId, (id, cur) -&gt; { if (cur.isEmpty()) { rows[0] = 1; return plate; } return cur; });\n        return rows[0];\n    }\n    /** Rows updated by: UPDATE spot SET plate = NULL WHERE id = ? AND plate = ? */\n    int release(String spotId, String plate) {\n        int[] rows = { 0 };\n        plateOf.computeIfPresent(spotId, (id, cur) -&gt; { if (cur.equals(plate)) { rows[0] = 1; return &quot;&quot;; } return cur; });\n        return rows[0];\n    }\n    String plateOf(String spotId) { return plateOf.get(spotId); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">variant</span><h3>13 &middot; The Gojek / GoTo version: one row of numbered slots, driven by commands from a file or an interactive shell: create_parking_lot 6, park KA-01-HH-1234 White, leave 4, status, registration_numbers_for_cars_with_colour White, slot_numbers_for_cars_with_colour White, slot_number_for_registration_number KA-01-HH-3141. The nearest slot is the lowest free number. Build it.</h3><button class=\"timer\" data-min=\"25\">start 25:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>This is the version Indian companies copy most. Gojek / GoTo in Bangalore hand it out as a codebase with commands missing and tests to pass (2025 reports <a href=\"https://leetcode.com/discuss/post/6371415/\">6371415</a> and <a href=\"https://leetcode.com/discuss/post/6491846/\">6491846</a>, in research/landscape-india-sea.md). <code>SlotLot</code> keeps the free slot numbers in a TreeSet (a set kept in sorted order), so the nearest slot is its first number and <code>leave</code> puts the number back, O(log n) each. Two maps change in the same step as every park and leave: registration number to slot, and colour to that colour's slots in order, so each lookup is one map read; only <code>status</code>, which must print every car, walks the slots. The commands arrive as text, which is exactly when the Command pattern earns its place: a map from each command word to a handler that runs it and returns the text to print, so a missing command is one more entry in the map, never a longer if-chain. <code>run</code> reads lines from a file or the keyboard and prints one answer per line, and the test feeds it the statement's own sample and compares the output exactly.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The lot of the Gojek statement: one row of slots numbered 1..n, and the nearest slot is the LOWEST free\n * number. The free numbers live in a TreeSet (a set kept in sorted order), so the nearest is pollFirst()\n * and leave() puts a number back, O(log n) each. Two maps are kept in step with park and leave, so no\n * lookup scans the slots.\n */\nclass SlotLot {\n    private final String[] reg, colour;                                   // reg[s] == null means slot s is free\n    private final TreeSet&lt;Integer&gt; free = new TreeSet&lt;&gt;();                // free slot numbers, lowest first\n    private final Map&lt;String, Integer&gt; slotOfReg = new HashMap&lt;&gt;();       // registration number -&gt; its slot\n    private final Map&lt;String, TreeSet&lt;Integer&gt;&gt; slotsOfColour = new HashMap&lt;&gt;();   // colour -&gt; its slots, lowest first\n    SlotLot(int n) { reg = new String[n + 1]; colour = new String[n + 1]; for (int s = 1; s &lt;= n; s++) free.add(s); }\n    /** The slot this car got, the lowest free number, or -1 when the lot is full. */\n    int park(String r, String c) {\n        if (slotOfReg.containsKey(r)) throw new IllegalStateException(&quot;Already parked: &quot; + r);\n        Integer s = free.pollFirst();\n        if (s == null) return -1;\n        reg[s] = r; colour[s] = c;\n        slotOfReg.put(r, s);\n        slotsOfColour.computeIfAbsent(c, k -&gt; new TreeSet&lt;&gt;()).add(s);\n        return s;\n    }\n    /** Free a slot; false if it was already free. Both maps change in the same step. */\n    boolean leave(int s) {\n        if (s &lt; 1 || s &gt;= reg.length) throw new IllegalArgumentException(&quot;No slot &quot; + s);\n        if (reg[s] == null) return false;\n        slotOfReg.remove(reg[s]);\n        slotsOfColour.get(colour[s]).remove(s);\n        reg[s] = null; colour[s] = null;\n        free.add(s);\n        return true;\n    }\n    int size()               { return reg.length - 1; }\n    String regAt(int s)      { return reg[s]; }\n    String colourAt(int s)   { return colour[s]; }\n    Integer slotOf(String r) { return slotOfReg.get(r); }\n    /** The slots holding cars of this colour, lowest first; empty if there are none. */\n    Set&lt;Integer&gt; slotsOf(String c) { return slotsOfColour.getOrDefault(c, new TreeSet&lt;&gt;()); }\n}\n\n/**\n * The shell, as the Command pattern kept small: each command word maps to one handler that runs it and\n * returns the text to print, so a missing command is one more entry, never a longer if-chain. run() reads\n * lines from any reader: a file, or System.in for the interactive shell.\n */\nclass CommandShell {\n    private SlotLot lot;\n    private final Map&lt;String, Function&lt;String[], String&gt;&gt; handlers = Map.of(\n        &quot;create_parking_lot&quot;, a -&gt; { lot = new SlotLot(Integer.parseInt(a[1])); return &quot;Created a parking lot with &quot; + a[1] + &quot; slots&quot;; },\n        &quot;park&quot;, a -&gt; { int s = lot.park(a[1], a[2]); return s &lt; 0 ? &quot;Sorry, parking lot is full&quot; : &quot;Allocated slot number: &quot; + s; },\n        &quot;leave&quot;, a -&gt; lot.leave(Integer.parseInt(a[1])) ? &quot;Slot number &quot; + a[1] + &quot; is free&quot; : &quot;Slot number &quot; + a[1] + &quot; is already free&quot;,\n        &quot;status&quot;, a -&gt; status(),\n        &quot;registration_numbers_for_cars_with_colour&quot;, a -&gt; list(lot.slotsOf(a[1]).stream().map(lot::regAt)),\n        &quot;slot_numbers_for_cars_with_colour&quot;, a -&gt; list(lot.slotsOf(a[1]).stream().map(String::valueOf)),\n        &quot;slot_number_for_registration_number&quot;, a -&gt; { Integer s = lot.slotOf(a[1]); return s == null ? &quot;Not found&quot; : s.toString(); });\n\n    /** One line in, the text to print out. An unknown word or bad input is a message, never a crash. */\n    String execute(String line) {\n        String[] a = line.trim().split(&quot;\\\\s+&quot;);\n        Function&lt;String[], String&gt; h = handlers.get(a[0]);\n        if (h == null) return &quot;Unknown command: &quot; + a[0];\n        if (lot == null &amp;&amp; !a[0].equals(&quot;create_parking_lot&quot;)) return &quot;Create a parking lot first&quot;;\n        try { return h.apply(a); } catch (RuntimeException e) { return &quot;Error: &quot; + e.getMessage(); }\n    }\n    /** Every line from a file or the keyboard, one answer printed per command. */\n    void run(BufferedReader in, PrintStream out) throws IOException {\n        for (String line = in.readLine(); line != null; line = in.readLine())\n            if (!line.isBlank()) out.println(execute(line));\n    }\n    private String status() {\n        StringBuilder b = new StringBuilder(String.format(&quot;%-12s%-19s%s&quot;, &quot;Slot No.&quot;, &quot;Registration No&quot;, &quot;Colour&quot;));\n        for (int s = 1; s &lt;= lot.size(); s++)                            // status must print every car: the one scan\n            if (lot.regAt(s) != null) b.append(&#x27;\\n&#x27;).append(String.format(&quot;%-12s%-19s%s&quot;, s, lot.regAt(s), lot.colourAt(s)));\n        return b.toString();\n    }\n    private static String list(Stream&lt;String&gt; items) {\n        String s = items.collect(Collectors.joining(&quot;, &quot;));\n        return s.isEmpty() ? &quot;Not found&quot; : s;\n    }\n    /** java CommandShell commands.txt runs a file; java CommandShell alone is the interactive shell. */\n    public static void main(String[] args) throws IOException {\n        Reader source = args.length &gt; 0 ? new FileReader(args[0]) : new InputStreamReader(System.in);\n        try (BufferedReader in = new BufferedReader(source)) { new CommandShell().run(in, System.out); }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Where does time come from, and how do you test the weekend rule on a Tuesday?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The lot is handed a <code>Clock</code>, a one-method interface. It stamps the entry and exit times on the ticket, and every pricing rule reads the ticket, never the wall clock; the charging meter reads the same clock. So a test hands in a clock that says Saturday 10:00, parks, moves the clock forward an hour, unparks, and checks the fee is Rs 20 times 1.5 (3000 paise in the code); then it sets the same clock to a Tuesday and checks the same code charges Rs 20. Nothing sleeps, nothing is flaky, and the same trick tests the billing edge (sixty minutes and one millisecond is two hours) and a reservation expiring.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 7. billing: any started hour is billed, and a minute is never free\n        ParkingLot bill = lot(now, floor(&quot;F1&quot;, &quot;C1&quot;, SpotType.COMPACT));\n        bill.park(new Car(&quot;E1&quot;)); now[0] += 3_600_000L;\n        check(bill.unpark(&quot;E1&quot;, new CashPayment()) == 2_000L, &quot;exactly 60 minutes on compact bills 1 hour = 2000 paise&quot;);\n        bill.park(new Car(&quot;E2&quot;)); now[0] += 3_600_000L + 1;\n        check(bill.unpark(&quot;E2&quot;, new CashPayment()) == 4_000L, &quot;60 minutes and 1 millisecond bills 2 hours = 4000 paise&quot;);\n        bill.park(new Car(&quot;E3&quot;)); now[0] += 1;\n        check(bill.unpark(&quot;E3&quot;, new CashPayment()) == 2_000L, &quot;1 millisecond still bills the first hour = 2000 paise&quot;);\n\n        // 8. the weekend rule reads the injected clock, not the wall clock\n        now[0] = SAT_10AM;\n        ParkingLot sat = lot(now, floor(&quot;F1&quot;, &quot;C1&quot;, SpotType.COMPACT));\n        sat.configure(new WeekendSurgePricing(new FlatHourlyPricing(), ZoneId.of(&quot;UTC&quot;)), new SmallestFitStrategy());\n        sat.park(new Car(&quot;FFF&quot;)); now[0] += 3_600_000L;                    // Saturday 10:00 to 11:00\n        check(sat.unpark(&quot;FFF&quot;, new CashPayment()) == 3_000L, &quot;Saturday by the injected clock: 2000 x 1.5 = 3000 paise&quot;);\n        now[0] = TUE_10AM;\n        sat.park(new Car(&quot;GGG&quot;));\n        check(sat.unpark(&quot;GGG&quot;, new CashPayment()) == 2_000L, &quot;the same code on a Tuesday: no surge, 2000 paise&quot;);\n        now[0] = SAT_10AM;\n\n\n// ---- ext: time is injected, so pricing and expiry are testable and replayable\n/** A clock a test owns: it says exactly what you set, and only moves when you move it. */\nclass FixedClock implements Clock {\n    private long t;\n    FixedClock(long t) { this.t = t; }\n    FixedClock(String iso) { this.t = Instant.parse(iso).toEpochMilli(); }\n    public long nowMs() { return t; }\n    /** Move time forward by this many milliseconds. */\n    void advance(long ms) { t += ms; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Which pattern is where, and why did each one earn its place?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None of them was chosen up front; each is what a move produced, which is why each can be defended in one sentence. Strategy is move 3: pricing, assignment and payment are rules that will change, so each sits behind a one-method interface the lot is handed. Decorator is the pricing stack: surge, cap, grace and pass each wrap the rule before them instead of replacing it, which is why four rules need no new interface. Observer is move 4's rule that the board must not be inside the lock: the floor announces 'counts changed' to whoever subscribed. State is move 6: the ticket's life written down so an illegal move throws. Singleton is only <code>getInstance()</code> at the edge; gates are handed the lot and tests build their own. Two you should NOT claim: there is no Factory yet, because vehicles arrive already typed, and no Builder, because nothing here has a long optional constructor.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: a rule behind an interface, handed in\ninterface PricingStrategy { long price(Ticket t); }   // paise\nvoid configure(PricingStrategy p, SpotAssignmentStrategy a) { pricing = p; assignment = a; }\n\n// Decorator: wrap the rule before you, add to it; four rules, no new interface\nnew MonthlyPassPricing(new DailyCapPricing(new WeekendSurgePricing(new FreeGracePricing(flat, 15), zone), 50_000), passes)\n\n// Observer: the floor announces; it does not know what a screen is\ninterface ParkingObserver { void onChange(String floorId, Map&lt;SpotType, Integer&gt; free); }\nchanged.publish(counts);   // AFTER lock.unlock()\n\n// State: the ticket&#x27;s life as a table; an illegal move throws\nenum TicketState { ISSUED, PAYING, PENDING, PAID, LOST, CLOSED;\n    /* ALLOWED = {ISSUED-&gt;PAYING, PAYING-&gt;PAID|LOST|ISSUED|PENDING, PENDING-&gt;PAYING, PAID-&gt;CLOSED, LOST-&gt;CLOSED} */ }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Which SOLID letter is where in this code?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>S: each class has one reason to change. The spot tracks its occupant, the floor its free queues, the lot the flow and the lock, a pricing class the money; nobody does two of those. O: weekend surge, the cap, the grace and the pass were four new classes and one changed line, and the lot never opened. L: any PricingStrategy drops in and the lot never asks which one it got. I: the interfaces have one method each, so a fake for a test is one lambda; a payment class is never asked to price. D: the lot depends on the interfaces it is handed in <code>configure()</code> and <code>setClock()</code>, not on FlatHourlyPricing, which is exactly why a test can hand it a clock that says Saturday and a card that declines.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// S: one reason to change each\nclass ParkingSpot { /* its occupant */ }   class ParkingFloor { /* its free queues */ }   class ParkingLot { /* the flow + the lock */ }\n// O: new behaviour = new classes, one changed line, nothing opened\nlot.configure(new DailyCapPricing(new WeekendSurgePricing(new FlatHourlyPricing(), zone), 50_000), new SmallestFitStrategy());\n// L: any implementation drops in; the lot never checks the concrete type\nlong fee = pricing.price(t);\n// I: one method per interface\ninterface PaymentProcessor { PaymentStatus pay(String idempotencyKey, long paise); }\n// D: depend on the interface, hand in the implementation; tests hand in fakes\nlot.setClock(() -&gt; fixedSaturdayMs);   lot.unpark(&quot;AAA&quot;, (key, paise) -&gt; PaymentStatus.DECLINED);   // a declining card\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>17 &middot; Enum sizes or Spot subclasses? And where would you use a Factory?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Enum, until a size gains behaviour of its own. Three sizes that differ only in what fits and what they cost are data: a row in the fit table and a rate in a map. A charging spot is the counter-example, and it is in the code above: it has a meter that must start and stop with the car, so it overrides <code>assign</code> and <code>release</code> and earns a subclass. Note the cost of that choice here: because the sizes are a closed enum, an EV spot added from outside cannot get its own queue and the rule has to scan; if kinds of spot must be open, the enum becomes a registry of spot kinds loaded from configuration. That is also when Factory earns its place: a map from a name to a constructor turns adding a kind into one registration instead of a growing switch.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// data, not classes: a size is a row\nstatic final Map&lt;VehicleType, List&lt;SpotType&gt;&gt; ORDER = Map.of(VehicleType.CAR, List.of(SpotType.COMPACT, SpotType.LARGE), /* ... */);\nstatic final Map&lt;SpotType, Long&gt; RATE = Map.of(SpotType.SMALL, 1_000L, SpotType.COMPACT, 2_000L, SpotType.LARGE, 4_000L);   // paise an hour\n\n/** A car that wants a charger. A plain Car to the fit table; the assignment rule looks for the subclass. */\nclass ElectricCar extends Car {\n    ElectricCar(String plate) { super(plate); }\n}\n\n/**\n * A compact spot with a charger. The charger starts when the car is assigned and stops when it is\n * released, which is why this is a subclass and not a flag: it has behaviour of its own.\n */\nclass EvSpot extends ParkingSpot {\n    private final double kW;              // how fast this charger delivers\n    private final Clock clock;\n    private long startedMs = -1;\n    EvSpot(String id, SpotType type, double kW, Clock clock) { super(id, type); this.kW = kW; this.clock = clock; }\n    @Override void assign(Vehicle v) { super.assign(v); startedMs = clock.nowMs(); }     // plug in\n    @Override void release()         { startedMs = -1; super.release(); }                // unplug\n    /** Units delivered so far, read off the meter. Pricing reads this BEFORE the spot is released. */\n    double kWhDelivered() { return startedMs &lt; 0 ? 0 : (clock.nowMs() - startedMs) / 3_600_000.0 * kW; }\n}\n\n/**\n * Parking plus electricity: the wrapped rule&#x27;s fee, plus the meter reading times the unit price. The reading\n * is a measurement, not money, so it becomes paise exactly once, rounded to the nearest paisa.\n */\nclass ChargingPricing implements PricingStrategy {\n    private final PricingStrategy base;\n    private final long paisePerKWh;\n    ChargingPricing(PricingStrategy base, long paisePerKWh) { this.base = base; this.paisePerKWh = paisePerKWh; }\n    public long price(Ticket t) {\n        long p = base.price(t);\n        return t.spot instanceof EvSpot ev ? p + Math.round(ev.kWhDelivered() * paisePerKWh) : p;\n    }\n}\n\n// a factory only once creation logic grows: a registry, so a new kind is one registration\nMap&lt;String, BiFunction&lt;String, SpotType, ParkingSpot&gt;&gt; registry = Map.of(&quot;EV&quot;, (id, t) -&gt; new EvSpot(id, t, 7.0, clock));\nParkingSpot s = registry.get(kind).apply(id, size);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"main": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\nimport java.time.*;\n\n/** The kinds of vehicle that can enter. Used only to look up which spot sizes fit. */\nenum VehicleType { MOTORCYCLE, CAR, TRUCK }\n\n/**\n * The thing that drives in: a plate and a type, nothing else. Subclasses exist so one kind can be special-\n * cased later.\n */\nabstract class Vehicle {                       // the first noun: what drives in\n    final String plate;\n    final VehicleType type;\n    Vehicle(String plate, VehicleType type) { this.plate = plate; this.type = type; }\n}\nclass Car        extends Vehicle { Car(String p)        { super(p, VehicleType.CAR); } }\nclass Motorcycle extends Vehicle { Motorcycle(String p) { super(p, VehicleType.MOTORCYCLE); } }\nclass Truck      extends Vehicle { Truck(String p)      { super(p, VehicleType.TRUCK); } }\n\n/** Spot sizes. A bigger spot can hold a smaller vehicle; the Fit table says which. */\nenum SpotType { SMALL, COMPACT, LARGE }        // a bigger spot fits smaller vehicles\n\n/**\n * One physical spot. Deliberately dumb: it knows its size and who is in it. Two questions, two answers:\n * \"which free spot of this size is next?\" is the head of the floor's queue; \"is THIS spot free?\" is\n * occupant() == null. The queue and the field are always changed together, under the lot's one lock.\n */\nclass ParkingSpot {                            // where the vehicle goes\n    final String id;\n    final SpotType type;\n    private Vehicle vehicle;                    // who is in it, for the ticket and for display; null == nobody\n    ParkingSpot(String id, SpotType type) { this.id = id; this.type = type; }\n    /** Who is parked here, or null. For the ticket and the display only. */\n    Vehicle occupant()        { return vehicle; }\n    /**\n     * Record the vehicle now in this spot. Called by the lot, inside its lock, after the floor handed the\n     * spot out.\n     */\n    void    assign(Vehicle v) { this.vehicle = v; }\n    /** Forget the vehicle. Called at exit, after payment succeeded. */\n    void    release()         { this.vehicle = null; }\n}\n\n// hand out the SMALLEST fitting spot first, so large spots stay free for trucks.\n// Rule: the FIRST floor that has any fitting spot wins, then the smallest size on that floor.\n/**\n * The fit table: for each vehicle type, the spot sizes it may use, SMALLEST FIRST, so large spots stay\n * free for trucks. A table, not an if-chain, so adding a size is one row.\n */\nfinal class Fit {\n    static final Map<VehicleType, List<SpotType>> ORDER = Map.of(\n        VehicleType.MOTORCYCLE, List.of(SpotType.SMALL, SpotType.COMPACT, SpotType.LARGE),\n        VehicleType.CAR,        List.of(SpotType.COMPACT, SpotType.LARGE),\n        VehicleType.TRUCK,      List.of(SpotType.LARGE));\n}\n\n/**\n * A ticket's life: ISSUED at entry; PAYING while its exit payment is in flight (a second checkout is\n * refused); PENDING when the gateway could not say whether the money moved (the retry re-sends the same key\n * and amount); PAID once money moved; LOST if reported lost (billed the cap); CLOSED when the spot is freed.\n */\nenum TicketStatus { ISSUED, PAYING, PENDING, PAID, LOST, CLOSED }\n\n/**\n * Issued at entry, priced at exit. Remembers its floor so exit never searches, and its entry time so the\n * fee is computable. Time is handed in, never read here.\n */\nclass Ticket {                                 // issued at entry, priced at exit\n    private static final AtomicInteger SEQ = new AtomicInteger();\n    final int id;\n    final ParkingSpot spot;\n    final ParkingFloor floor;                  // remembered -> unpark is O(1)\n    final Vehicle vehicle;\n    final long entryMs;\n    long exitMs;\n    long feePaise;                             // priced when a payment starts; a retry after a timeout re-sends this exact amount\n    TicketStatus status = TicketStatus.ISSUED;\n    int attempt;                               // bumped after a decline: a NEW try needs a NEW key\n    PaymentProcessor pendingOn;                // the gateway holding an unconfirmed payment; a retry must go back there\n    Ticket(ParkingSpot spot, ParkingFloor floor, Vehicle vehicle, long entryMs) {\n        this.id = SEQ.incrementAndGet(); this.spot = spot; this.floor = floor; this.vehicle = vehicle;\n        this.entryMs = entryMs;                // time is handed in, never read here (testable, replayable)\n    }\n    /**\n     * The idempotency key: ticket id plus attempt number. A retry after a timeout reuses it, so the gateway\n     * charges it at most once; a decline bumps the attempt, because a gateway keeps its first answer per key,\n     * and the same key would answer \"declined\" to the driver's next card too.\n     */\n    String payKey() { return \"ticket-\" + id + \"-\" + attempt; }\n}\n\n// \"they'll want to change pricing\" -> hide it behind an interface -> Strategy\n/**\n * The pricing rule, behind an interface because it WILL change mid-round (surge, caps). Reads only the\n * ticket. Returns paise (100 paise = one rupee) in a long: a double cannot even hold 0.1 exactly.\n */\ninterface PricingStrategy { long price(Ticket t); }\n\n/** Hourly by spot size, any started hour billed. 60 minutes and 1 millisecond is two hours. */\nclass FlatHourlyPricing implements PricingStrategy {\n    private static final Map<SpotType, Long> RATE =                    // paise an hour: Rs 10, Rs 20, Rs 40\n        Map.of(SpotType.SMALL, 1_000L, SpotType.COMPACT, 2_000L, SpotType.LARGE, 4_000L);\n    /** Fee for a finished ticket, in paise: started hours times the size's rate. */\n    public long price(Ticket t) {\n        long ms = t.exitMs - t.entryMs;\n        long hours = Math.max(1, (long) Math.ceil(ms / 3600000.0));   // any started hour is billed: 60 min + 1 ms = 2 hours\n        return hours * RATE.get(t.spot.type);\n    }\n}\n\n// \"smallest fit today, nearest-to-exit tomorrow\" -> same shape -> Strategy again\n/**\n * Which spot to hand out on a floor for this vehicle, or null if none fits. It is given the whole vehicle,\n * not just its type, so a rule may look at the plate (a monthly pass) or the subclass (an electric car).\n * Behind an interface because 'nearest to exit' is the follow-up that always comes.\n */\ninterface SpotAssignmentStrategy { ParkingSpot find(ParkingFloor floor, Vehicle v); }\n\n/**\n * Walk the fit table smallest-first and return the first size that has a free spot. O(sizes), never a scan\n * of spots.\n */\nclass SmallestFitStrategy implements SpotAssignmentStrategy {\n    /**\n     * The head of the first non-empty fitting queue, or null. Peeks only; the lot decides whether to take\n     * it.\n     */\n    public ParkingSpot find(ParkingFloor floor, Vehicle v) {\n        for (SpotType st : Fit.ORDER.get(v.type)) {   // smallest fitting size first\n            ParkingSpot s = floor.peekFree(st);\n            if (s != null) return s;\n        }\n        return null;\n    }\n}\n\n// \"a board should update but not be wired into parking logic\" -> publish/subscribe -> Observer\n/**\n * Anyone who wants to hear 'free counts on floor X changed': a display board, a metrics exporter. The\n * floor does not know what they are.\n */\ninterface ParkingObserver { void onChange(String floorId, Map<SpotType, Integer> free); }\n\n/** A screen at the floor entrance. Prints the counts; a real one would drive an LED panel. */\nclass DisplayBoard implements ParkingObserver {\n    public void onChange(String floorId, Map<SpotType, Integer> free) {\n        System.out.println(\"[board] \" + floorId + \" free=\" + free);\n    }\n}\n\n/**\n * One floor: its spots, and per size a queue of the FREE ones. The ORDER of that queue is the rule for\n * which free spot of a size is handed out next, so it is handed in: a plain ArrayDeque means \"any of\n * them\", O(1); a PriorityQueue ordered by metres from the exit means \"the nearest\", O(log n). Nothing\n * else in the design changes. All mutation happens under the lot's lock; observers are told after the\n * lock is released.\n */\nclass ParkingFloor {\n    final String id;\n    private final Map<SpotType, Queue<ParkingSpot>> free = new EnumMap<>(SpotType.class);   // the free spots of each size, in policy order\n    private final Map<String, ParkingSpot> all = new HashMap<>();\n    private final List<ParkingObserver> observers = new CopyOnWriteArrayList<>();\n\n    /** A floor that hands out any free spot of the right size: ArrayDeque, O(1) at both ends. */\n    ParkingFloor(String id) { this(id, ArrayDeque::new); }\n    /**\n     * A floor whose free spots of each size are kept in the order this queue imposes; the head is\n     * whatever the order calls best. Hand in a PriorityQueue by distance and you have nearest-to-exit.\n     */\n    ParkingFloor(String id, Supplier<Queue<ParkingSpot>> order) {\n        this.id = id;\n        for (SpotType st : SpotType.values()) free.put(st, order.get());\n    }\n    /** Subscribe a listener; setup only. */\n    void addObserver(ParkingObserver o) { observers.add(o); }\n    /** Register a spot; it starts free. Setup only. */\n    void addSpot(ParkingSpot s)         { all.put(s.id, s); free.get(s.type).offer(s); }\n    /** One spot by its id, free or not; for rules that need a named spot (adjacency, a reservation). */\n    ParkingSpot spot(String id)         { return all.get(id); }\n    /** Every spot on this floor, free or not. Only rules that must look at pairs of spots use it. */\n    Collection<ParkingSpot> spots()     { return all.values(); }\n    /** The next free spot of a size without taking it, or null. O(1). */\n    ParkingSpot peekFree(SpotType st)   { return free.get(st).peek(); }   // O(1)\n    /** How many spots of a size are free. O(1): the queue's size. */\n    int freeCount(SpotType st)          { return free.get(st).size(); }   // O(1)\n\n    /**\n     * Take a free spot out of its queue. The head costs O(1), which is what the default rule always asks\n     * for; a rule that picks some other free spot pays one O(n) removal on that floor. Taking a spot that\n     * is not free is a caller bug and throws.\n     */\n    void take(ParkingSpot s) {\n        Queue<ParkingSpot> q = free.get(s.type);\n        if (q.peek() == s) { q.poll(); return; }                       // the common case: O(1)\n        if (!q.remove(s)) throw new IllegalStateException(\"not free: \" + s.id);\n    }\n    /** Give a spot back; it re-enters its queue in policy order. O(1) for a deque, O(log n) for a heap. */\n    void vacate(ParkingSpot s) { free.get(s.type).offer(s); }\n\n    /** Copy of the free counts, taken INSIDE the lock so it is consistent. */\n    Map<SpotType, Integer> snapshot() {\n        Map<SpotType, Integer> counts = new EnumMap<>(SpotType.class);\n        for (SpotType st : SpotType.values()) counts.put(st, free.get(st).size());\n        return counts;\n    }\n    /**\n     * Tell every observer, OUTSIDE the lock, from a snapshot. A slow or throwing observer can stall no\n     * gate and corrupt nothing.\n     */\n    void publish(Map<SpotType, Integer> counts) {     // called after the lock is released; a broken listener cannot break parking\n        for (ParkingObserver o : observers) {\n            try { o.onChange(id, counts); } catch (RuntimeException e) { System.err.println(\"[observer failed] \" + e.getMessage()); }\n        }\n    }\n}\n\n/** What the gateway answered: the money moved, it was refused, or nobody knows (a timeout). */\nenum PaymentStatus { OK, DECLINED, UNKNOWN }\n\n/**\n * How money is taken at exit; card, cash, UPI. The amount is in paise. The key is an idempotency key (the\n * ticket id: a unique id for this payment, so a retry that arrives twice is charged once): the gateway\n * charges one key at most once, and a retry with a key it already charged gets OK back, with no new charge.\n */\ninterface PaymentProcessor { PaymentStatus pay(String idempotencyKey, long paise); }   // Strategy #3\nclass CardPayment implements PaymentProcessor { public PaymentStatus pay(String key, long paise) { /* gateway, keyed */ return PaymentStatus.OK; } }\nclass CashPayment implements PaymentProcessor { public PaymentStatus pay(String key, long paise) { return PaymentStatus.OK; } }\n\n/** Where time comes from. Injected so tests can pick 'Saturday 10:00' and billing is replayable. */\ninterface Clock { long nowMs(); }                                       // time is injected: tests and replays choose it\n\n/**\n * The orchestrator and the only writer of shared state: the floors, the active tickets, and ONE lock.\n * park is one short critical section. unpark is two, with the card payment between them and no lock held;\n * nothing is committed before the payment succeeded.\n */\nclass ParkingLot {                                   // one source of truth (Singleton)\n    private static ParkingLot instance;\n    private final List<ParkingFloor> floors = new ArrayList<>();\n    private final Map<String, ParkingFloor> byId = new HashMap<>();  // for \"how many free on F2?\"\n    private final Map<String, Ticket> active = new HashMap<>();     // guarded by lock\n    private final ReentrantLock lock = new ReentrantLock();\n    private PricingStrategy pricing;\n    private SpotAssignmentStrategy assignment;\n    private Clock clock = System::currentTimeMillis;\n\n    /** Package-private on purpose: application code goes through getInstance(), tests build their own. */\n    ParkingLot() {}\n    static synchronized ParkingLot getInstance() {\n        if (instance == null) instance = new ParkingLot();\n        return instance;\n    }\n    /**\n     * Hand in the rules. The lot never builds a strategy itself, so swapping one is a new class and this\n     * one line.\n     */\n    void configure(PricingStrategy p, SpotAssignmentStrategy a) { pricing =

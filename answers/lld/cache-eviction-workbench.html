ROTECTED, which holds the\n * working set. Victims come from probation first, so a one-pass scan of a million cold keys walks in and\n * straight back out without touching what is protected. This is the shape TinyLFU and Caffeine build on.\n */\nfinal class SegmentedLruPolicy&lt;K&gt; implements EvictionPolicy&lt;K&gt; {\n    private final KeyList&lt;K&gt; probation = new KeyList&lt;&gt;();\n    private final KeyList&lt;K&gt; protectedSeg = new KeyList&lt;&gt;();\n    private final int protectedCapacity;\n\n    /** protectedCapacity is usually about 80% of the cache: the part a scan must not be able to evict. */\n    SegmentedLruPolicy(int protectedCapacity) { this.protectedCapacity = Math.max(1, protectedCapacity); }\n\n    /** A new or rewritten key sits in probation until somebody reads it a second time. */\n    public void onPut(K key, long nowMs, long expiresAtMs) {\n        if (protectedSeg.contains(key)) protectedSeg.touchFirst(key);\n        else probation.touchFirst(key);\n    }\n    /** The promotion: one read moves a key out of probation, and the coldest protected key is demoted. */\n    public void onGet(K key, long nowMs) {\n        if (probation.contains(key)) {\n            probation.remove(key);\n            protectedSeg.touchFirst(key);\n            while (protectedSeg.size() &gt; protectedCapacity) {\n                K cold = protectedSeg.last();\n                protectedSeg.remove(cold);\n                probation.touchFirst(cold);                    // demoted, not evicted: it gets another chance\n            }\n        } else if (protectedSeg.contains(key)) {\n            protectedSeg.touchFirst(key);\n        }\n    }\n    /** Both lists must drop the key. */\n    public void onRemove(K key) { probation.remove(key); protectedSeg.remove(key); }\n    /** Probation goes first; only an empty probation reaches into the protected working set. */\n    public K selectVictim(long nowMs) {\n        K v = probation.last();\n        return v != null ? v : protectedSeg.last();\n    }\n    /** Keys across both segments. */\n    public int trackedKeys() { return probation.size() + protectedSeg.size(); }\n    public String name() { return &quot;SegmentedLRU&quot;; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Now there are two servers, and a write on one must not leave a stale copy on the other.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Publish invalidations, not values. A write updates the local copy and tells every other node to drop that key, so the next read there reloads it; two nodes can then never disagree about which value is newest, because at most one of them has a value at all. A cache fill after a read publishes nothing &mdash; nobody else's copy became wrong &mdash; and a node that broadcasts every time it warms itself turns a cache into a message storm. Which node owns which key is consistent hashing, so adding a node moves one Nth of the keys rather than all of them; name it and leave it out of scope. In production this deserves a fifth cause, INVALIDATED, because today the drop is reported as EXPLICIT.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: two servers -- a write on one must not leave a stale copy on the other\n/**\n * A stand-in for a message bus: in a real system this is Redis pub/sub, Kafka or a gossip channel, and which\n * node owns which key is decided by consistent hashing so that adding a node moves 1/N of the keys, not all\n * of them. The rule that matters is the same either way: publish INVALIDATIONS, not values, so two nodes can\n * never disagree about what the newest value is -- they simply both go and read it again.\n */\nfinal class InvalidationBus {\n    private final Map&lt;String, Consumer&lt;String&gt;&gt; nodes = new ConcurrentHashMap&lt;&gt;();\n    /** A node subscribes with its own id and a handler that drops a key locally. */\n    void join(String nodeId, Consumer&lt;String&gt; onInvalidate) { nodes.put(nodeId, onInvalidate); }\n    /** Tells every OTHER node that this key changed. The writer keeps its own fresh copy. */\n    void publish(String fromNodeId, String key) {\n        nodes.forEach((id, handler) -&gt; { if (!id.equals(fromNodeId)) handler.accept(key); });\n    }\n}\n\n/**\n * One node&#x27;s cache, wired to the bus. A local write publishes an invalidation; an invalidation from another\n * node drops the local copy so the next read reloads it. A fifth removal cause, INVALIDATED, would be worth\n * adding in production: today the drop is reported as EXPLICIT, which is close enough to be a lie.\n */\nfinal class ReplicatedCache&lt;V&gt; implements Cache&lt;String, V&gt; {\n    private final String nodeId;\n    private final Cache&lt;String, V&gt; local;\n    private final InvalidationBus bus;\n\n    /** Joins the bus on construction, so the node starts hearing about other nodes&#x27; writes immediately. */\n    ReplicatedCache(String nodeId, Cache&lt;String, V&gt; local, InvalidationBus bus) {\n        this.nodeId = nodeId; this.local = local; this.bus = bus;\n        bus.join(nodeId, local::remove);                       // never re-publishes: that would loop forever\n    }\n\n    /** Reads the local copy. */\n    public V getIfPresent(String key) { return local.getIfPresent(key); }\n    /**\n     * Fills the local copy after a read from the database, and publishes NOTHING. The distinction matters:\n     * a cache fill is not news -- nobody else&#x27;s copy became wrong -- and a node that invalidates the cluster\n     * every time it warms itself up turns a cache into a broadcast storm.\n     */\n    void fill(String key, V value) { local.put(key, value); }\n    /** Writes locally, then tells the other nodes to forget what they have. */\n    public void put(String key, V value) { local.put(key, value); bus.publish(nodeId, key); }\n    /** Writes locally with a deadline, then invalidates elsewhere. */\n    public void put(String key, V value, long ttlMs) { local.put(key, value, ttlMs); bus.publish(nodeId, key); }\n    /** Removes locally, then invalidates elsewhere. */\n    public V remove(String key) { V v = local.remove(key); bus.publish(nodeId, key); return v; }\n    /** Delegates. */\n    public int size() { return local.size(); }\n    /** Delegates. */\n    public int capacity() { return local.capacity(); }\n    /** Delegates. */\n    public void cleanUp() { local.cleanUp(); }\n    /** Delegates. */\n    public CacheStats stats() { return local.stats(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>13 &middot; Where does time come from, and how do you test a twenty-four-hour TTL?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The cache is handed a Clock and nothing in it ever reads the wall directly. A test hands in a clock it drives by hand: write an entry with a day-long TTL, advance twenty-three hours and it still reads; advance two more and the read is a miss, the entry is dropped by the read that found it, and the listener is told EXPIRED. That test takes a microsecond and cannot flake. The alternative &mdash; Thread.sleep(1100) &mdash; is slow, flaky, and cannot test a day-long TTL at all, which is why the injected clock is worth the one interface.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 4. a twenty-four-hour TTL, tested in zero milliseconds. The clock is injected, so nothing sleeps\n        //    and nothing is flaky; a wall-clock test of this would take a day.\n        clock.setTo(1_700_000_000_000L);\n        List&lt;RemovalCause&gt; causes = new ArrayList&lt;&gt;();\n        PolicyCache&lt;String, String&gt; sessions = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(10).policy(new LruPolicy&lt;&gt;()).clock(clock)\n                .listener((k, v, cause) -&gt; causes.add(cause)).build();\n        sessions.put(&quot;sid&quot;, &quot;harish&quot;, 24 * 3600_000L);\n        clock.advance(23 * 3600_000L);\n        check(&quot;harish&quot;.equals(sessions.getIfPresent(&quot;sid&quot;)), &quot;after 23 hours the entry is still served&quot;);\n        clock.advance(2 * 3600_000L);\n        check(sessions.getIfPresent(&quot;sid&quot;) == null, &quot;after 25 hours the read is a miss, not a stale value&quot;);\n        check(sessions.size() == 0, &quot;the dead entry was dropped by the read that found it&quot;);\n        check(causes.equals(List.of(RemovalCause.EXPIRED)), &quot;and it was reported as EXPIRED&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Which pattern is where, which SOLID letter is where, and where would a Factory earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None was chosen up front; each is what a move produced. Strategy is move 3 and it is the point of the problem: the rule is an object handed in, so LFU is a new file. Decorator is the same move twice &mdash; ExpiryFirst wraps a policy, and LoadingCache, StripedCache, WriteThroughCache and the byte-bounded cache wrap a Cache. Observer is move 4's rule that caller code never runs inside the lock. State is move 6, the entry's life, which is why the cause has four values. Builder earns its place because six of seven knobs are optional, exactly as in Guava and Caffeine. For SOLID: S is move 2 (the cache stores, a policy ranks, stats count); O is SegmentedLruPolicy, a new file with PolicyCache untouched; L is that sampled LRU substitutes even though it is approximate, because the contract is \"name a victim\"; I is a row of one-method interfaces &mdash; clock, listener, loader, weigher, store &mdash; with EvictionPolicy's four methods named as the honest blemish; D is the constructor taking a policy and a clock. Factory earns its name the day policies arrive as strings from configuration &mdash; the builder's single default is already the registry. Template Method did not earn a place at all: Strategy did that job first.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: the rule is an OBJECT the cache is handed, never a flag and never an if-chain\ninterface EvictionPolicy&lt;K&gt; { void onPut(K k, long now, long exp); void onGet(K k, long now);\n                              void onRemove(K k); K selectVictim(long now); int trackedKeys(); }\nCacheBuilder.&lt;String,String&gt;newBuilder().capacity(4).policy(new LfuPolicy&lt;&gt;()).build();\n\n// Decorator, twice: one wraps a POLICY (adds &quot;the dead go first&quot;), one wraps a CACHE (adds loading)\nnew ExpiryFirst&lt;&gt;(new LruPolicy&lt;&gt;());                  // works over LRU, LFU, FIFO, anything\nnew LoadingCache&lt;&gt;(new StripedCache&lt;&gt;(16, 1600, LruPolicy::new, clock), loader, true);\n\n// Observer: the cache announces a departure and does not know what a metrics counter is\ninterface RemovalListener&lt;K, V&gt; { void onRemoval(K key, V value, RemovalCause cause); }\nfor (Removal&lt;K, V&gt; r : pending) for (RemovalListener&lt;K, V&gt; l : listeners)\n    try { l.onRemoval(r.key(), r.value(), r.cause()); } catch (RuntimeException ignored) { }\n\n// State: four ways out, four causes -- a boolean here would hide two different bugs\nenum RemovalCause { EXPLICIT, REPLACED, EXPIRED, CAPACITY }\n\n// Factory: not yet. The builder&#x27;s one default IS the registry; config strings would earn the name\nMap&lt;String, Supplier&lt;EvictionPolicy&lt;String&gt;&gt;&gt; byName =\n    Map.of(&quot;lru&quot;, LruPolicy::new, &quot;lfu&quot;, LfuPolicy::new, &quot;fifo&quot;, FifoPolicy::new);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.AtomicLong;\nimport java.util.concurrent.locks.ReentrantLock;\n\n// A bounded in-memory cache whose eviction rule is a separate object. One cache class stores the entries,\n// bounds the size and enforces expiry; an EvictionPolicy answers exactly one question -- who leaves next --\n// and LRU, LFU, FIFO and shortest-fuse-first are four answers to it. \"May I still return this?\" is a\n// different question, decided by the clock alone, and it lives in the cache where it always applies.\n\n/**\n * Why an entry left the cache. Four causes are four different bugs when somebody asks \"where did my session\n * go?\", which is the whole reason the listener is told the cause and not just the key.\n */\nenum RemovalCause {\n    /** A caller called remove(key). */\n    EXPLICIT,\n    /** A caller put a new value over the same key; the old value is gone. */\n    REPLACED,\n    /** The clock passed the entry's deadline. Can happen in a cache that is 2% full. */\n    EXPIRED,\n    /** The cache was full and the policy named this key. Can happen to a perfectly fresh entry. */\n    CAPACITY\n}\n\n/** Where time comes from. Injected, so a test can prove a 24-hour TTL in zero milliseconds. */\ninterface Clock {\n    /** The current time in milliseconds. */\n    long nowMs();\n}\n\n/** The real clock: the only place in this design that reads the wall. */\nfinal class SystemClock implements Clock {\n    /** Reads the wall clock. */\n    public long nowMs() { return System.currentTimeMillis(); }\n}\n\n/** A clock a test drives by hand: no sleeping, no flakiness, and a 24-hour TTL takes a microsecond. */\nfinal class ManualClock implements Clock {\n    private long now;\n    /** Starts the clock at a chosen instant. */\n    ManualClock(long startMs) { this.now = startMs; }\n    /** The instant this clock was last set or advanced to. */\n    public long nowMs() { return now; }\n    /** Moves time forward by the given number of milliseconds. */\n    void advance(long ms) { now += ms; }\n    /** Jumps to an absolute instant, so the same trace can be replayed from t = 0. */\n    void setTo(long ms) { now = ms; }\n}\n\n/** Somebody who wants to be told when an entry leaves, and why. Always called after the lock is released. */\ninterface RemovalListener<K, V> {\n    /** Told once per departed entry, with the value it held and the reason it went. */\n    void onRemoval(K key, V value, RemovalCause cause);\n}\n\n/** One departure, recorded inside the lock and delivered after it. */\nrecord Removal<K, V>(K key, V value, RemovalCause cause) { }\n\n/** Counters for the four things anybody ever asks a cache. Approximate under load, deliberately. */\nrecord CacheStats(long hits, long misses, long evictions, long expirations) {\n    /** Hits as a fraction of all lookups; zero when nothing has been asked for yet. */\n    double hitRate() { long n = hits + misses; return n == 0 ? 0.0 : (double) hits / n; }\n    /** A one-line summary for a log or a demo. */\n    public String toString() {\n        return String.format(\"hits=%d misses=%d evictions=%d expirations=%d hitRate=%.2f\",\n                             hits, misses, evictions, expirations, hitRate());\n    }\n}\n\n/** One stored value with its deadline. The cache owns these; they are never handed to a caller. */\nfinal class CacheEntry<V> {\n    final V value;\n    final long writtenAtMs;\n    /** The instant from which this entry may not be returned; Long.MAX_VALUE means \"never dies\". */\n    final long expiresAtMs;\n    long lastAccessMs;\n    /** Built by the cache on every write. */\n    CacheEntry(V value, long writtenAtMs, long expiresAtMs) {\n        this.value = value; this.writtenAtMs = writtenAtMs;\n        this.expiresAtMs = expiresAtMs; this.lastAccessMs = writtenAtMs;\n    }\n    /** True once the clock has reached the deadline. Checked on every read and by cleanUp(). */\n    boolean expired(long nowMs) { return nowMs >= expiresAtMs; }\n}\n\n/** What a cache can do. A striped cache, a byte-bounded cache and a read-through cache are all this. */\ninterface Cache<K, V> {\n    /** The value for this key, or null if it is absent or past its deadline. */\n    V getIfPresent(K key);\n    /** Stores a value with the cache's default time-to-live. */\n    void put(K key, V value);\n    /** Stores a value that dies ttlMs from now; a ttlMs of zero or less means it never dies. */\n    void put(K key, V value, long ttlMs);\n    /** Removes a key and returns the value it held, or null. */\n    V remove(K key);\n    /** How many entries are resident right now, dead-but-unread ones included. */\n    int size();\n    /** The hard bound on size(). */\n    int capacity();\n    /** Drops every entry whose deadline has passed. O(n), so it is on demand, never on the hot path. */\n    void cleanUp();\n    /** Hits, misses, evictions and expirations since the cache was built. */\n    CacheStats stats();\n}\n\n/**\n * The rule for who leaves next. The cache tells the policy what happened; the policy names a victim. The\n * policy never touches the table -- it advises, the cache executes, so exactly one object mutates state.\n *\n * <p>Four methods rather than one, which is the honest cost of this seam: a rule that ranks keys has to see\n * every event that changes the ranking. Every method is called with the cache's lock already held, so no\n * implementation needs any synchronisation of its own.\n */\ninterface EvictionPolicy<K> {\n    /** This key was just written (a fresh insert or a rewrite). expiresAtMs is for deadline-ordered rules. */\n    void onPut(K key, long nowMs, long expiresAtMs);\n    /** This key was just read and found. LRU moves it; FIFO ignores it -- that is the whole difference. */\n    void onGet(K key, long nowMs);\n    /** This key has left the table, for any reason. Miss this call and the policy leaks keys forever. */\n    void onRemove(K key);\n    /** The key to give up if room is needed now, or null when the policy is holding nothing. */\n    K selectVictim(long nowMs);\n    /** How many keys this policy is tracking; the cache's consistency check compares it with the table. */\n    int trackedKeys();\n    /** A readable name, for demos and logs. */\n    default String name() { return getClass().getSimpleName(); }\n}\n\n/**\n * A doubly-linked list of keys with a map from key to node, so \"move this key to the front\" and \"who is at\n * the back\" are both a fixed number of pointer writes. Two sentinels remove every null check. LRU and FIFO\n * are the same list; they differ only in whether a read moves a key.\n */\nfinal class KeyList<K> {\n    private final class Node { K key; Node prev, next; }\n    private final Node head = new Node(), tail = new Node();\n    private final Map<K, Node> index = new HashMap<>();\n\n    /** Builds an empty list: head and tail are sentinels that hold no key. */\n    KeyList() { head.next = tail; tail.prev = head; }\n\n    /** Puts the key at the front, moving it if it is already in the list. O(1). */\n    void touchFirst(K key) {\n        Node n = index.get(key);\n        if (n == null) { n = new Node(); n.key = key; index.put(key, n); }\n        else unlink(n);\n        n.next = head.next; n.prev = head; head.next.prev = n; head.next = n;\n    }\n    /** Drops the key from the list if it is there. O(1). */\n    void remove(K key) { Node n = index.remove(key); if (n != null) unlink(n); }\n    /** True if this list is tracking the key. */\n    boolean contains(K key) { return index.containsKey(key); }\n    /** The key at the back -- the oldest by whatever \"old\" means here -- or null if the list is empty. */\n    K last() { return tail.prev == head ? null : tail.prev.key; }\n    /** How many keys are in the list. */\n    int size() { return index.size(); }\n    /** Back to front: the order in which these keys would be given up. */\n    List<K> oldestFirst() {\n        List<K> out = new ArrayList<>(index.size());\n        for (Node n = tail.prev; n != head; n = n.prev) out.add(n.key);\n        return out;\n    }\n    private void unlink(Node n) {\n        if (n.prev != null) n.prev.next = n.next;\n        if (n.next != null) n.next.prev = n.prev;\n        n.prev = null; n.next = null;\n    }\n}\n\n/** One key's deadline, with a sequence number so two keys that die in the same millisecond still order. */\nrecord Fuse<K>(long deadlineMs, long seq, K key) { }\n\n/**\n * Keys ordered by when they die. One index, two questions: \"who dies soonest?\" (an eviction order) and \"is\n * anybody already dead?\" (an expiry check). A TreeSet, so every operation is O(log n) -- the one structure\n * here that is not O(1), and worth saying out loud.\n */\nfinal class DeadlineIndex<K> {\n    private final TreeSet<Fuse<K>> fuses = new TreeSet<>(\n            Comparator.<Fuse<K>>comparingLong(Fuse::deadlineMs).thenComparingLong(Fuse::seq));\n    private final Map<K, Fuse<K>> byKey = new HashMap<>();\n    private final boolean trackImmortal;\n    private long seq;\n\n    /** trackImmortal = true also indexes entries with no deadline, so this index can rank every key. */\n    DeadlineIndex(boolean trackImmortal) { this.trackImmortal = trackImmortal; }\n\n    /** Records (or re-records) this key's deadline. O(log n). */\n    void put(K key, long deadlineMs) {\n        remove(key);\n        if (!trackImmortal && deadlineMs == Long.MAX_VALUE) return;    // no fuse, nothing to watch\n        Fuse<K> f = new Fuse<>(deadlineMs, ++seq, key);\n        fuses.add(f); byKey.put(key, f);\n    }\n    /** Forgets this key. O(log n). */\n    void remove(K key) { Fuse<K> f = byKey.remove(key); if (f != null) fuses.remove(f); }\n    /** The key with the soonest deadline, or null. Ties break by insertion order. */\n    K earliest() { return fuses.isEmpty() ? null : fuses.first().key(); }\n    /** That same key, but only if its deadline has already passed. */\n    K earliestIfDue(long nowMs) {\n        if (fuses.isEmpty()) return null;\n        Fuse<K> f = fuses.first();\n        return nowMs >= f.deadlineMs() ? f.key() : null;\n    }\n    /** How many keys are indexed. */\n    int size() { return byKey.size(); }\n}\n\n/**\n * Least recently used: a read moves the key to the front, and the victim is whatever is at the back.\n * O(1) everywhere -- a hash lookup and six pointer writes.\n */\nfinal class LruPolicy<K> implements EvictionPolicy<K> {\n    private final KeyList<K> order = new KeyList<>();\n    /** A write counts as a use, so the key goes to the front. */\n    public void onPut(K key, long nowMs, long expiresAtMs) { order.touchFirst(key); }\n    /** A read counts as a use: this one line is what makes it LRU and not FIFO. */\n    public void onGet(K key, long nowMs) { order.touchFirst(key); }\n    /** Drops the key from the order. */\n    public void onRemove(K key) { order.remove(key); }\n    /** The key at the back: nobody has touched it for longer. */\n    public K selectVictim(long nowMs) { return order.last(); }\n    /** Keys currently in the order. */\n    public int trackedKeys() { return order.size(); }\n    /** Coldest first: the order in which keys would be given up. */\n    List<K> victimOrder() { return order.oldestFirst(); }\n    public String name() { return \"LRU\"; }\n}\n\n/**\n * First in, first out: arrival order only. The same list as LRU with one method emptied out, which is the\n * clearest possible demonstration that the policy, not the cache, is what changes between rules.\n */\nfinal class FifoPolicy<K> implements EvictionPolicy<K> {\n    private final KeyList<K> arrival = new KeyList<>();\n    /** A brand-new key joins the queue; rewriting a value does not move it back. */\n    public void onPut(K key, long nowMs, long expiresAtMs) { if (!arrival.contains(key)) arrival.touchFirst(key); }\n    /** A read is not a use here. One empty method is the entire difference from LRU. */\n    public void onGet(K key, long nowMs) { }\n    /** Drops the key from the queue. */\n    public void onRemove(K key) { arrival.remove(key); }\n    /** The key that arrived first. */\n    public K selectVictim(long nowMs) { return arrival.last(); }\n    /** Keys currently queued. */\n    public int trackedKeys() { return arrival.size(); }\n    public String name() { return \"FIFO\"; }\n}\n\n/**\n * Least frequently used, in O(1): keys are bucketed by use count and the coldest non-empty bucket is\n * remembered, so nothing is ever sorted or scanned. Inside a bucket a LinkedHashSet keeps equally cold keys\n * in arrival order, so the oldest of the coldest goes first.\n */\nfinal class LfuPolicy<K> implements EvictionPolicy<K> {\n    private final Map<K, Integer> useCount = new HashMap<>();\n    private final Map<Integer, LinkedHashSet<K>> buckets = new HashMap<>();\n    private int minCount = 1;\n\n    /** A new key starts at one use; a rewrite counts as another use. */\n    public void onPut(K key, long nowMs, long expiresAtMs) {\n        if (useCount.containsKey(key)) { bump(key); return; }\n        useCount.put(key, 1);\n        buckets.computeIfAbsent(1, c -> new LinkedHashSet<>()).add(key);\n        minCount = 1;                                          // a newcomer is always in the coldest bucket\n    }\n    /** A read moves the key one bucket up: two set operations, never a sort. */\n    public void onGet(K key, long nowMs) { bump(key); }\n    /** Drops the key and, if that emptied the coldest bucket, finds the new coldest. */\n    public void onRemove(K key) {\n        Integer c = useCount.remove(key);\n        if (c == null) return;\n        LinkedHashSet<K> b = buckets.get(c);\n        if (b == null) return;\n        b.remove(key);\n        if (b.isEmpty()) { buckets.remove(c); if (c == minCount) recomputeMin(); }\n    }\n    /** The first key of the coldest bucket: fewest uses, and among those, the one that arrived first. */\n    public K selectVictim(long nowMs) {\n        LinkedHashSet<K> b = buckets.get(minCount);\n        if (b == null || b.isEmpty()) { recomputeMin(); b = buckets.get(minCount); }\n        return (b == null || b.isEmpty()) ? null : b.iterator().next();\n    }\n    /** Keys currently counted. */\n    public int trackedKeys() { return useCount.size(); }\n    /** How many times this key has been used; -1 if the policy has never seen it. */\n    int useCountOf(K key) { return useCount.getOrDefault(key, -1); }\n    public String name() { return \"LFU\"; }\n\n    private void bump(K key) {\n        Integer c = useCount.get(key);\n        if (c == null) return;\n        LinkedHashSet<K> from = buckets.get(c);\n        if (from != null) {\n            from.remove(key);\n            if (from.isEmpty()) { buckets.remove(c); if (c == minCount) minCount = c + 1; }\n        }\n        useCount.put(key, c + 1);\n        buckets.computeIfAbsent(c + 1, x -> new LinkedHashSet<>()).add(key);\n    }\n    // Only reached when an explicit remove emptied the coldest bucket. Bounded by the number of DISTINCT use\n    // counts present, not by the number of keys, and never touched on the eviction path.\n    private void recomputeMin() { minCount = buckets.isEmpty() ? 1 : Collections.min(buckets.keySet()); }\n}\n\n/**\n * Shortest fuse first: when the cache is full, give up whatever dies soonest. This is an eviction ORDER, not\n * expiry -- expiry always applies and lives in the cache. O(log n) per operation, the one policy here that is\n * not O(1); keys with no deadline sort last, so an immortal key goes only when nothing else is left.\n */\nfinal class TtlPolicy<K> implements EvictionPolicy<K> {\n    private final DeadlineIndex<K> deadlines = new DeadlineIndex<>(true);\n    /** Records this key's deadline. */\n    public void onPut(K key, long nowMs, long expiresAtMs) { deadlines.put(key, expiresAtMs); }\n    /** A read does not extend a time-to-live, so there is nothing to do. */\n    public void onGet(K key, long nowMs) { }\n    /** Forgets the key's deadline. */\n    public void onRemove(K key) { deadlines.remove(key); }\n    /** The key whose deadline is soonest. */\n    public K selectVictim(long nowMs) { return deadlines.earliest(); }\n    /** Keys currently indexed. */\n    public int trackedKeys() { return deadlines.size(); }\n    public String name() { return \"TTL\"; }\n}\n\n/**\n * TTL as a wrapper over any other rule: if something in the cache is already dead, that goes first;\n * otherwise the wrapped rule decides. Decorator, and the reason TTL is not a fifth policy you must choose\n * instead of LRU -- ExpiryFirst(LRU), ExpiryFirst(LFU) and ExpiryFirst(FIFO) all exist. Entries with no\n * deadline are not indexed at all, so wrapping a cache that uses no TTLs costs nothing.\n */\nfinal class ExpiryFirst<K> implements EvictionPolicy<K> {\n    private final EvictionPolicy<K> inner;\n    private final DeadlineIndex<K> deadlines = new DeadlineIndex<>(false);\n    /** Wraps any policy; the wrapped object is handed in, never built here. */\n    ExpiryFirst(EvictionPolicy<K> inner) { this.inner = Objects.requireNonNull(inner); }\n    /** Records the deadline, then lets the wrapped rule do its own bookkeeping. */\n    public void onPut(K key, long nowMs, long expiresAtMs) { deadlines.put(key, expiresAtMs); inner.onPut(key, nowMs, expiresAtMs); }\n    /** A read does not extend a deadline, but it may still matter to the wrapped rule. */\n    public void onGet(K key, long nowMs) { inner.onGet(key, nowMs); }\n    /** Both indexes must drop the key, or one of them leaks. */\n    public void onRemove(K key) { deadlines.remove(key); inner.onRemove(key); }\n    /** A corpse if there is one, otherwise whoever the wrapped rule names. */\n    public K selectVictim(long nowMs) {\n        K dead = deadlines.earliestIfDue(nowMs);\n        return dead != null ? dead : inner.selectVictim(nowMs);\n    }\n    /** The wrapped rule is the one holding every key. */\n    public int trackedKeys() { return inner.trackedKeys(); }\n    public String name() { return \"ExpiryFirst(\" + inner.name() + \")\"; }\n}\n\n/**\n * The cache. It owns the table, the lock, the clock and the listeners, and it is handed an eviction policy.\n * The invariant it defends: the table and the policy always name exactly the same set of keys, and the number\n * of entries never exceeds the capacity -- not even for an instant in the middle of a put.\n */\nfinal class PolicyCache<K, V> implements Cache<K, V> {\n    private final int capacity;\n    /** Insertion-ordered only so that re-indexing on a policy swap is deterministic and testable. */\n    private final Map<K, CacheEntry<V>> table = new LinkedHashMap<>();\n    private final ReentrantLock lock = new ReentrantLock();\n    private final List<RemovalListener<K, V>> listeners = new CopyOnWriteArrayList<>();\n    private final AtomicLong hits = new AtomicLong(), misses = new AtomicLong();\n    private final AtomicLong evictions = new AtomicLong(), expirations = new AtomicLong();\n    private EvictionPolicy<K> policy;\n    private Clock clock;\n    private final long defaultTtlMs;\n\n    /** Built by CacheBuilder, which is the only place the pieces are assembled. */\n    PolicyCache(int capacity, EvictionPolicy<K> policy, Clock clock, long defaultTtlMs) {\n        if (capacity < 1) throw new IllegalArgumentException(\"capacity must be at least 1\");\n        this.capacity = capacity;\n        this.policy = Objects.requireNonNull(policy, \"policy\");\n        this.clock = Objects.requireNonNull(clock, \"clock\");\n        this.defaultTtlMs = defaultTtlMs;\n    }\n\n    /** Adds somebody who wants to hear about departures. Listeners are called after the lock is released. */\n    void addListener(RemovalListener<K, V> l) { listeners.add(Objects.requireNonNull(l)); }\n\n    /**\n     * The value for this key, or null. A read past the deadline is a miss: the dead entry is dropped here and\n     * reported as EXPIRED, so a stale value can never be handed back.\n     */\n    public V getIfPresent(K key) {\n        Objects.requireNonNull(key, \"key\");\n        long now = clock.nowMs();\n        List<Removal<K, V>> pending = new ArrayList<>(1);\n        V out = null;\n        boolean hit = false, dead = false;\n        lock.lock();\n        try {\n            CacheEntry<V> e = table.get(key);\n            if (e != null && e.expired(now)) {\n                table.remove(key);\n                policy.onRemove(key);\n                pending.add(new Removal<>(key, e.value, RemovalCause.EXPIRED));\n                dead = true;\n            } else if (e != null) {\n                e.lastAccessMs = now;\n                policy.onGet(key, now);                        // a read is a write to the ranking\n                out = e.value;\n                hit = true;\n            }\n        } finally {\n            lock.unlock();\n        }\n        if (hit) hits.incrementAndGet(); else misses.incrementAndGet();\n        if (dead) expirations.incrementAndGet();\n        fire(pending);\n        return out;\n    }\n\n    /** Stores a value with the cache's default time-to-live. */\n    public void put(K key, V value) { put(key, value, defaultTtlMs); }\n\n    /**\n     * Stores a value that dies ttlMs from now (a ttlMs of zero or less means never). The order IS the design: work\n     * the deadline outside the lock; take the lock; evict BEFORE admitting, because under LFU a newcomer\n     * arrives at one use, is instantly the coldest key, and would otherwise evict itself; write the entry;\n     * unlock; only then tell the listeners.\n     */\n    public void put(K key, V value, long ttlMs) {\n        Objects.requireNonNull(key, \"key\");\n        Objects.requireNonNull(value, \"null value: null is how this cache reports a miss\");\n        long now = clock.nowMs();\n        long expiresAt = ttlMs <= 0 ? Long.MAX_VALUE : now + ttlMs;\n        List<Removal<K, V>> pending = new ArrayList<>(2);\n        int evicted = 0, expired = 0;\n        lock.lock();\n        try {\n            CacheEntry<V> old = table.get(key);\n            if (old != null) {                                  // a rewrite: the count does not grow\n                table.put(key, new CacheEntry<>(value, now, expiresAt));\n                policy.onPut(key, now, expiresAt);\n                pending.add(new Removal<>(key, old.value, RemovalCause.REPLACED));\n            } else {\n                while (table.size() >= capacity) {              // evict first, admit second\n                    K victim = policy.selectVictim(now);\n                    if (victim == null) break;                  // a policy holding nothing has nothing to give\n                    CacheEntry<V> gone = table.remove(victim);\n                    policy.onRemove(victim);                    // both indexes drop it, or the policy leaks\n                    if (gone == null) continue;                 // the policy named a key the table never had\n                    boolean wasDead = gone.expired(now);\n                    pending.add(new Removal<>(victim, gone.value,\n                            wasDead ? RemovalCause.EXPIRED : RemovalCause.CAPACITY));\n                    if (wasDead) expired++; else evicted++;\n                }\n                table.put(key, new CacheEntry<>(value, now, expiresAt));\n                policy.onPut(key, now, expiresAt);\n            }\n        } finally {\n            lock.unlock();\n        }\n        if (evicted > 0) evictions.addAndGet(evicted);\n        if (expired > 0) expirations.addAndGet(expired);\n        fire(pending);\n    }\n\n    /** Removes a key and returns what it held. The cause is EXPLICIT: the caller asked, whatever the clock says. */\n    public V remove(K key) {\n        Objects.requireNonNull(key, \"key\");\n        List<Removal<K, V>> pending = new ArrayList<>(1);\n        V out = null;\n        lock.lock();\n        try {\n            CacheEntry<V> e = table.remove(key);\n            if (e != null) {\n                policy.onRemove(key);\n                pending.add(new Removal<>(key, e.value, RemovalCause.EXPLICIT));\n                out = e.value;\n            }\n        } finally {\n            lock.unlock();\n        }\n        fire(pending);\n        return out;\n    }\n\n    /** Entries resident right now, including ones past their deadline that nobody has read yet. */\n    public int size() { lock.lock(); try { return table.size(); } finally { lock.unlock(); } }\n\n    /** The hard bound. */\n    public int capacity() { return capacity; }\n\n    /** Drops every dead entry in one pass. O(n), which is why it is on demand and not on the read path. */\n    public void cleanUp() {\n        long now = clock.nowMs();\n        List<Removal<K, V>> pending = new ArrayList<>();\n        lock.lock();\n        try {\n            for (Iterator<Map.Entry<K, CacheEntry<V>>> it = table.entrySet().iterator(); it.hasNext(); ) {\n                Map.Entry<K, CacheEntry<V>> en = it.next();\n                if (en.getValue().expired(now)) {\n                    it.remove();\n                    policy.onRemove(en.getKey());\n                    pending.add(new Removal<>(en.getKey(), en.getValue().value, RemovalCause.EXPIRED));\n                }\n            }\n        } finally {\n            lock.unlock();\n        }\n        if (!pending.isEmpty()) expirations.addAndGet(pending.size());\n        fire(pending);\n    }\n\n    /** Hits, misses, evictions and expirations. Counted outside the lock, so they are approximate under load. */\n    public CacheStats stats() {\n        return new CacheStats(hits.get(), misses.get(), evictions.get(), expirations.get());\n    }\n\n    /**\n     * Swaps the rule at runtime and returns the old one. Every live key is handed to the new policy as a\n     * fresh insert under the same lock, so no entry is lost and no reader ever sees a cache without a rule.\n     * What does not survive is the ranking: the new policy starts with no history. That is the honest trade,\n     * and it is better said out loud than papered over by pretending recency counts carry across.\n     */\n    EvictionPolicy<K> setPolicy(EvictionPolicy<K> next) {\n        Objects.requireNonNull(next, \"policy\");\n        long now = clock.nowMs();\n        lock.lock();\n        try {\n            EvictionPolicy<K> old = policy;\n            for (Map.Entry<K, CacheEntry<V>> en : table.entrySet())\n                next.onPut(en.getKey(), now, en.getValue().expiresAtMs);\n            policy = next;\n            return old;\n        } finally {\n            lock.unlock();\n        }\n    }\n\n    /** The rule in force right now. */\n    EvictionPolicy<K> policy() { lock.lock(); try { return policy; } finally { lock.unlock(); } }\n\n    /** Replaces the clock. Tests use this; production hands one in through the builder. */\n    void setClock(Clock c) { lock.lock(); try { this.clock = Objects.requireNonNull(c); } finally { lock.unlock(); } }\n\n    /** The invariant, checkable: the policy tracks exactly as many keys as the table holds. */\n    boolean consistent() {\n        lock.lock();\n        try { return policy.trackedKeys() == table.size(); } finally { lock.unlock(); }\n    }\n\n    /** A snapshot of the resident keys in insertion order, for demos and tests. */\n    Set<K> keys() { lock.lock(); try { return new LinkedHashSet<>(table.keySet()); } finally { lock.unlock(); } }\n\n    // A listener is caller code: it may do I/O, throw, or call straight back into this cache. All three are\n    // safe out here and none of them are safe inside the lock, so departures are collected under the lock and\n    // delivered once it is gone.\n    private void fire(List<Removal<K, V>> pending) {\n        if (pending.isEmpty() || listeners.isEmpty()) return;\n        for (Removal<K, V> r : pending)\n            for (RemovalListener<K, V> l : listeners)\n                try { l.onRemoval(r.key(), r.value(), r.cause()); }\n                catch (RuntimeException ignored) { /* a broken listener is the listener's problem */ }\n    }\n}\n\n/**\n * The one place the pieces are assembled: capacity, policy, clock, default TTL, listeners. Six optional knobs\n * is exactly when a builder earns its place -- which is why Guava ships CacheBuilder and Caffeine ships\n * Caffeine.newBuilder().\n */\nfinal class CacheBuilder<K, V> {\n    private int capacity = 128;\n    private EvictionPolicy<K> policy;\n    private Clock clock = new SystemClock();\n    private long ttlMs = 0;\n    private final List<RemovalListener<K, V>> listeners = new ArrayList<>();\n\n    /** Starts a builder; the type arguments are given at the call site. */\n    static <K, V> CacheBuilder<K, V> newBuilder() { return new CacheBuilder<>(); }\n    /** The hard bound on the number of entries. */\n    CacheBuilder<K, V> capacity(int n) { this.capacity = n; return this; }\n    /** The eviction rule. Defaults to LRU when nothing is said. */\n    CacheBuilder<K, V> policy(EvictionPolicy<K> p) { this.policy = p; return this; }\n    /** Where time comes from. Defaults to the wall clock. */\n    CacheBuilder<K, V> clock(Clock c) { this.clock = c; return this; }\n    /** A default time-to-live for entries written without one. */\n    CacheBuilder<K, V> ttlMs(long ms) { this.ttlMs = ms; return this; }\n    /** Somebody to tell when an entry leaves. */\n    CacheBuilder<K, V> listener(RemovalListener<K, V> l) { this.listeners.add(l); return this; }\n    /** Assembles the cache. The cache itself never names a policy class. */\n    PolicyCache<K, V> build() {\n        EvictionPolicy<K> p = policy != null ? policy : new LruPolicy<>();\n        PolicyCache<K, V> c = new PolicyCache<>(capacity, p, clock, ttlMs);\n        for (RemovalListener<K, V> l : listeners) c.addListener(l);\n        return c;\n    }\n}\n\n/** The demo: one access trace through four rules, expiry, a runtime policy swap, and a fifty-thread race. */\npublic class Main {\n\n    /**\n     * One fixed access trace, replayed through whichever policy is handed in, with a listener that records\n     * what left. Identical calls, identical timing; the only difference is the rule.\n     *\n     * <p>t=0 put A(ttl 60s), t=1s put B(ttl 50s), t=2s get B, t=3s put C(ttl 40s), t=4s put D(ttl 5s),\n     * t=5s get A, then (after extraWaitMs) put E into a cache of four.\n     */\n    static String replay(EvictionPolicy<String> policy, ManualClock clock, long extraWaitMs) {\n        List<String> gone = new ArrayList<>();\n        PolicyCache<String, String> c = CacheBuilder.<String, String>newBuilder()\n                .capacity(4).policy(policy).clock(clock)\n                .listener((k, v, cause) -> gone.add(k + \" (\" + cause + \")\"))\n                .build();\n        clock.setTo(0);\n        c.put(\"A\", \"alpha\", 60_000);\n        clock.advance(1_000); c.put(\"B\", \"bravo\", 50_000);\n        clock.advance(1_000); c.getIfPresent(\"B\");\n        clock.advance(1_000); c.put(\"C\", \"charlie\", 40_000);\n        clock.advance(1_000); c.put(\"D\", \"delta\", 5_000);\n        clock.advance(1_000); c.getIfPresent(\"A\");\n        clock.advance(1_000 + extraWaitMs);\n        c.put(\"E\", \"echo\");                                    // the cache is full: the policy decides\n        return gone.isEmpty() ? \"nobody\" : gone.get(0);\n    }\n\n    /** Runs the demo and then a many-thread race that proves the size bound and the table/policy agreement. */\n    public static void main(String[] args) throws Exception {\n        ManualClock clock = new ManualClock(0);\n\n        System.out.println(\"== the same access trace, four rules, four victims ==\");\n        System.out.println(\"   put A,B; get B; put C,D; get A; then put E into a cache of four\");\n        System.out.printf(\"   %-20s evicts %s%n\", \"FIFO\", replay(new FifoPolicy<>(), clock, 0));\n        System.out.printf(\"   %-20s evicts %s%n\", \"LRU\", replay(new LruPolicy<>(), clock, 0));\n        System.out.printf(\" overflow.get());\n        System.out.println(\"   table and policy agree: \" + hot.consistent());\n        System.out.println(\"   \" + hot.stats());\n    }\n}\n", "f1": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.AtomicLong;\nimport java.util.concurrent.locks.ReentrantLock;\nimport java.util.function.Consumer;\nimport java.util.function.Supplier;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong. Nothing here opens PolicyCache.\n\n// ---- ext: a new rule -- sampled LRU, which is what Redis actually does. ONE class, one builder line.\n/**\n * Approximate LRU: instead of a linked list, keep a dense array of keys and a monotonic tick per key, then\n * sample a handful at random and evict the coldest one you saw. Cheaper than exact LRU and sometimes wrong --\n * Redis's deliberate trade. Removal swaps the last key into the hole, so it stays O(1).\n */\nfinal class SampledLruPolicy<K> implements EvictionPolicy<K> {\n    private final int sampleSize;\n    private final Random rnd;\n    private final Map<K, Long> lastUsedTick = new HashMap<>();\n    private final List<K> keys = new ArrayList<>();\n    private final Map<K, Integer> slotOf = new HashMap<>();\n    private long tick;\n\n    /** sampleSize is how many random keys are looked at per eviction; Redis defaults to five. */\n    SampledLruPolicy(int sampleSize, long seed) { this.sampleSize = Math.max(1, sampleSize); this.rnd = new Random(seed); }\n\n    /** Adds the key to the dense array if it is new, and stamps it with the current tick. */\n    public void onPut(K key, long nowMs, long expiresAtMs) {\n        if (!slotOf.containsKey(key)) { slotOf.put(key, keys.size()); keys.add(key); }\n        lastUsedTick.put(key, ++tick);\n    }\n    /** A read is a use: one map write, no pointer surgery at all. */\n    public void onGet(K key, long nowMs) { if (slotOf.containsKey(key)) lastUsedTick.put(key, ++tick); }\n    /** Swap-with-last keeps removal O(1) and the array dense enough to sample by index. */\n    public void onRemove(K key) {\n        Integer i = slotOf.remove(key);\n        lastUsedTick.remove(key);\n        if (i == null) return;\n        K moved = keys.remove(keys.size() - 1);\n        if (!moved.equals(key)) { keys.set(i, moved); slotOf.put(moved, i); }\n    }\n    /** The coldest of a few random keys. O(sample), and occasionally not the coldest key in the cache. */\n    public K selectVictim(long nowMs) {\n        if (keys.isEmpty()) return null;\n        K coldest = null;\n        long coldestTick = Long.MAX_VALUE;\n        for (int s = 0, n = Math.min(sampleSize, keys.size()); s < n; s++) {\n            K cand = keys.get(rnd.nextInt(keys.size()));\n            long t = lastUsedTick.getOrDefault(cand, Long.MAX_VALUE);\n            if (t < coldestTick) { coldestTick = t; coldest = cand; }\n        }\n        return coldest;\n    }\n    /** Keys in the dense array. */\n    public int trackedKeys() { return slotOf.size(); }\n    public String name() { return \"SampledLRU(\" + sampleSize + \")\"; }\n}\n\n// ---- ext: scan resistance -- a nightly report reads every row and destroys the hit rate. A NEW class.\n/**\n * Segmented LRU: two lists. A key enters PROBATION; a second read promotes it to PROTECTED, which holds the\n * working set. Victims come from probation first, so a one-pass scan of a million cold keys walks in and\n * straight back out without touching what is protected. This is the shape TinyLFU and Caffeine build on.\n */\nfinal class SegmentedLruPolicy<K> implements EvictionPolicy<K> {\n    private final KeyList<K> probation = new KeyList<>();\n    private final KeyList<K> protectedSeg = new KeyList<>();\n    private final int protectedCapacity;\n\n    /** protectedCapacity is usually about 80% of the cache: the part a scan must not be able to evict. */\n    SegmentedLruPolicy  \"is it\n * full?\" check becomes a LOOP, because one heavy value can push out several small ones, and an entry heavier\n * than the whole budget is refused outright -- otherwise it empties the cache and still does not fit.\n * The policies are untouched: weight is a bound, not a ranking.\n */\nfinal class ByteBoundedCache<K, V> implements Cache<K, V> {\n    private final long maxWeight;\n    private final Weigher<K, V> weigher;\n    private final Map<K, CacheEntry<V>> table = new LinkedHashMap<>();\n    private final Map<K, Integer> weightOf = new HashMap<>();\n    private final EvictionPolicy<K> policy;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Clock clock;\n    private final AtomicLong hits = new AtomicLong(), misses = new AtomicLong(), evictions = new AtomicLong();\n    private long totalWeight;\n\n    /** maxWeight is the budget, in the weigher's unit; the policy still decides who goes. */\n    ByteBoundedCache(long maxWeight, Weigher<K, V> weigher, EvictionPolicy<K> policy, Clock clock) {\n        this.maxWeight = maxWeight; this.weigher = weigher; this.policy = policy; this.clock = clock;\n    }\n\n    /** The value, or null. Same read path as PolicyCache, minus the expiry branch for brevity. */\n    public V getIfPresent(K key) {\n        lock.lock();\n        try {\n            CacheEntry<V> e = table.get(key);\n            if (e == null || e.expired(clock.nowMs())) { misses.incrementAndGet(); return null; }\n            policy.onGet(key, clock.nowMs());\n            hits.incrementAndGet();\n            return e.value;\n        } finally { lock.unlock(); }\n    }\n    /** Stores a value with no deadline. */\n    public void put(K key, V value) { put(key, value, 0); }\n    /** Stores a value, evicting as many entries as it takes to fit the new one inside the budget. */\n    public void put(K key, V value, long ttlMs) {\n        int w = weigher.weigh(key, value);\n        if (w > maxWeight) return;                             // refuse: it would empty the cache and still not fit\n        long now = clock.nowMs();\n        lock.lock();\n        try {\n            if (table.containsKey(key)) { totalWeight -= weightOf.remove(key); table.remove(key); policy.onRemove(key); }\n            while (totalWeight + w > maxWeight) {               // a LOOP, not an if\n                K victim = policy.selectVictim(now);\n                if (victim == null) break;\n                table.remove(victim);\n                policy.onRemove(victim);\n                Integer vw = weightOf.remove(victim);\n                if (vw != null) totalWeight -= vw;\n                evictions.incrementAndGet();\n            }\n            table.put(key, new CacheEntry<>(value, now, ttlMs <= 0 ? Long.MAX_VALUE : now + ttlMs));\n            weightOf.put(key, w);\n            totalWeight += w;\n            policy.onPut(key, now, ttlMs <= 0 ? Long.MAX_VALUE : now + ttlMs);\n        } finally { lock.unlock(); }\n    }\n    /** Removes a key and gives back its weight. */\n    public V remove(K key) {\n        lock.lock();\n        try {\n            CacheEntry<V> e = table.remove(key);\n            if (e == null) return null;\n            policy.onRemove(key);\n            Integer w = weightOf.remove(key);\n            if (w != null) totalWeight -= w;\n            return e.value;\n        } finally { lock.unlock(); }\n    }\n    /** Entries resident. */\n    public int size() { lock.lock(); try { return table.size(); } finally { lock.unlock(); } }\n    /** This cache is bounded by weight, not by entry count, so there is no entry bound to report. */\n    public int capacity() { return Integer.MAX_VALUE; }\n    /** Bytes held right now: the number the bound is actually about. */\n    long weight() { lock.lock(); try { return totalWeight; } finally { lock.unlock(); } }\n    /** Drops dead entries. */\n    public void cleanUp() {\n        lock.lock();\n        try {\n            long now = clock.nowMs();\n            for ( der; this.singleFlight = singleFlight;\n    }\n\n    /** The value, loading it on a miss. At most one loader call per key is in flight at a time. */\n    V get(K key) throws Exception {\n        V cached = inner.getIfPresent(key);\n        if (cached != null) return cached;\n        if (!singleFlight) {                                   // the version that takes down the database\n            V loaded = loader.load(key);\n            if (loaded != null) inner.put(key, loaded);\n            return loaded;\n        }\n        CompletableFuture<V> mine = new CompletableFuture<>();\n        CompletableFuture<V> winner = inFlight.putIfAbsent(key, mine);\n        if (winner != null) return winner.get();               // a loser: wait for the winner's result\n        try {\n            V again = inner.getIfPresent(key);                 // double-check inside the flight\n            V loaded = again != null ? again : loader.load(key);\n            if (loaded != null) inner.put(key, loaded);\n            mine.complete(loaded);\n            return loaded;\n        } catch (Exception e) {\n            mine.completeExceptionally(e);                     // or every waiter parks forever\n            throw e;\n        } finally {\n            inFlight.remove(key, mine);                        // in a finally, so a throw cannot poison the key\n        }\n    }\n\n    /** Delegates: a read that does not load. */\n    public V getIfPresent(K key) { return inner.getIfPresent(key); }\n    /** Delegates. */\n    public void put(K key, V value) { inner.put(key, value); }\n    /** Delegates. */\n    public void put(K key, V value, long ttlMs) { inner.put(key, value, ttlMs); }\n    /** Delegates. */\n    public V remove(K key) { return inner.remove(key); }\n    /** Delegates. */\n    public int size() { return inner.size(); }\n    /** Delegates. */\n    public int capacity() { return inner.capacity(); }\n    /** Delegates. */\n    public void cleanUp() { inner.cleanUp(); }\n    /** Delegates. */\n    public CacheStats stats() { return inner.stats(); }\n}\n\n// ---- ext: writes -- does a put reach the database, and when?\n/** The durable side of a write: where a value lives once the cache lets go of it. One method, handed in. */\ninterface WriteStore<K, V> {\n    /** Persists one key. Called with NO cache lock held, so it may take a millisecond of database. */\n    void write(K key, V value);\n}\n\n/**\n * Write-through: the store is written BEFORE the cache, so a failed write never becomes a cached lie and the\n * store is never behind the cache. The price is that every put pays the store's latency on the caller's\n * thread, so a write-through cache speeds up reads only. This is the same ordering rule as move 6 -- commit\n * nothing until the irreversible thing has succeeded -- and it is a wrapper, so PolicyCache still has no idea\n * what a database is.\n */\nfinal class WriteThroughCache<K, V> implements Cache<K, V> {\n    private final Cache<K, V> inner;\n    private final WriteStore<K, V> store;\n\n    /** Wraps any cache, including a striped one. */\n    WriteThroughCache(Cache<K, V> inner, WriteStore<K, V> store) { this.inner = inner; this.store = store; }\n\n    /** Store first, cache second: if the store throws, nothing was cached and the caller can retry. */\n    public void put(K key, V value) { store.write(key, value); inner.put(key, value); }\n    /** Store first, cache second, with a deadline. */\n    public void put(K key, V value, long ttlMs) { store.write(key, value); inner.put(key, value, ttlMs); }\n    /** Delegates: reads never touch the store. */\n    public V getIfPresent(K key) { return inner.getIfPresent(key); }\n    /** Delegates. */\n    public V remove(K key) { return inner.remove(key); }\n    /** Delegates. */\n    public int size() { return inner.size(); }\n    /** Delegates. */\n    public int capacity() { return inner.capacity(); }\n    /** Delegates. */\n    public void cleanUp() { inner.cleanUp(); }\n    /** Delegates. */\n    public CacheStats stats() { return inner.stats(); }\n}\n\n/**\n * Write-back (write-behind): a put touches only the cache, and the value reaches the store when the entry\n * leaves. That is a RemovalListener and nothing else -- no new field on the cache, no new lock. The CAUSE is\n * the whole logic, which is the clearest payoff of having four causes instead of a boolean:\n * CAPACITY and EXPIRED carry the newest value out of memory, so not writing it loses the write;\n * REPLACED hands back a value that a newer one has already superseded, and writing it is pure waste;\n * EXPLICIT is the caller saying forget this, which is not a request to persist it.\n * The honest cost: the flush happens after the unlock, so a crash in that window loses the write. Real\n * write-back caches pair this with a periodic flush of everything still dirty.\n */\nfinal class WriteBackListener<K, V> implements RemovalListener<K, V> {\n    private final WriteStore<K, V> store;\n    private final AtomicLong flushes = new AtomicLong();\n\n    /** Hand it the store; hand it to the cache with builder.listener(...). */\n    WriteBackListener(WriteStore<K, V> store) { this.store = store; }\n\n    /** Writes back only the two causes that carry a live value out of memory. */\n    public void onRemoval(K key, V value, RemovalCause cause) {\n        if (cause == RemovalCause.CAPACITY || cause == RemovalCause.EXPIRED) {\n            store.write(key, value);\n            flushes.incrementAndGet();\n        }\n    }\n\n    /** How many entries have been written back so far. */\n    long flushes() { return flushes.get(); }\n}\n\n// ---- ext: striping -- the profiler says threads are queueing on your one lock\n/**\n * N independent caches behind one Cache, chosen by a spread hash of the key. Callers change nothing;\n * throughput goes up roughly N times because unrelated keys no longer share a lock. The price: eviction is\n * now per stripe, so the bound is per stripe too and the recency order is approximate across the whole cache.\n */\nfinal class StripedCache<K, V> implements Cache<K, V> {\n    private final List<PolicyCache<K, V>> segments = new ArrayList<>();\n\n    /** Splits the capacity evenly; each stripe gets its OWN policy instance, never a shared one. */\n    StripedCache(int stripes, int totalCapacity, Supplier<EvictionPolicy<K>> policyPerStripe, Clock clock) {\n        int per = Math.max(1, totalCapacity / stripes);\n        for (int i = 0; i < stripes; i++)\n            segments.add(new PolicyCache<>(per, policyPerStripe.get(), clock, 0));\n    }\n\n    // The same bit-spreading HashMap uses: raw hashCodes clump, and a clumped hash means one hot stripe.\n    private PolicyCache<K, V> segmentFor(K key) {\n        int h = key.hashCode();\n        h ^= (h >>> 16);\n        return segments.get((h & 0x7fffffff) % segments.size());\n    }\n\n    /** Reads from the one stripe that could hold this key. */\n    public V getIfPresent(K key) { return segmentFor(key).getIfPresent(key); }\n    /** Writes into the one stripe that owns this key. */\n    public void put(K key, V value) { segmentFor(key).put(key, value); }\n    /** Writes into the one stripe that owns this key. */\n    public void put(K key, V value, long ttlMs) { segmentFor(key).put(key, value, ttlMs); }\n    /** Removes from the one stripe that owns this key. */\n    public V remove(K key) { return segmentFor(key).remove(key); }\n    /** The total across stripes; no lock spans them, so it is a sum of snapshots. */\n    public int size() { int n = 0; for (PolicyCache<K, V> s : segments) n += s.size(); return n; }\n    /** The sum of the per-stripe bounds. */\n    public int capacity() { int n = 0; for (PolicyCache<K, V> s : segments) n += s.capacity(); return n; }\n    /** Sweeps every stripe. */\n    public void cleanUp() { for (PolicyCache<K, V> s : segments) s.cleanUp(); }\n    /** Adds the stripes' counters together. */\n    public CacheStats stats() {\n        long h = 0, m = 0, e = 0, x = 0;\n        for (PolicyCache<K, V> s : segments) {\n            CacheStats t = s.stats();\n            h += t.hits(); m += t.misses(); e += t.evictions(); x += t.expirations();\n        }\n        return new CacheStats(h, m, e, x);\n    }\n}\n\n// ---- ext: two servers -- a write on one must not leave a stale copy on the other\n/**\n * A stand-in for a message bus: in a real system this is Redis pub/sub, Kafka or a gossip channel, and which\n * node owns which key is decided by consistent hashing so that adding a node moves 1/N of the keys, not all\n * of them. The rule that matters is the same either way: publish INVALIDATIONS, not values, so two nodes can\n * never disagree about what the newest value is -- they simply both go and read it again.\n */\nfinal class InvalidationBus {\n    private final Map<String, Consumer<String>> nodes = new ConcurrentHashMap<>();\n    /** A node subscribes with its own id and a handler that drops a key locally. */\n    void join(String nodeId, Consumer<String> onInvalidate) { nodes.put(nodeId, onInvalidate); }\n    /** Tells every OTHER node that this key changed. The writer keeps its own fresh copy. */\n    void publish(String fromNodeId, String key) {\n        nodes.forEach((id, handler) -> { if (!id.equals(fromNodeId)) handler.accept(key); });\n    }\n}\n\n/**\n * One node's cache, wired to the bus. A local write publishes an invalidation; an invalidation from another\n * node drops the local copy so the next read reloads it. A fifth removal cause, INVALIDATED, would be worth\n * adding in production: today the drop is reported as EXPLICIT, which is close enough to be a lie.\n */\nfinal class ReplicatedCache<V> implements Cache<String, V> {\n    private final String nodeId;\n    private final Cache<String, V> local;\n    private final InvalidationBus bus;\n\n    /** Joins the bus on construction, so the node starts hearing about other nodes' writes immediately. */\n    ReplicatedCache(String nodeId, Cache<String, V> local, InvalidationBus bus) {\n        this.nodeId = nodeId; this.local = local; this.bus = bus;\n        bus.join(nodeId, local::remove);                       // never re-publishes: that would loop forever\n    }\n\n    /** Reads the local copy. */\n    public V getIfPresent(String key) { return local.getIfPresent(key); }\n    /**\n     * Fills the local copy after a read from the database, and publishes NOTHING. The distinction matters:\n     * a cache fill is not news -- nobody else's copy became wrong -- and a node that invalidates the cluster\n     * every time it warms itself up turns a cache into a broadcast storm.\n     */\n    void fill(String key, V value) { local.put(key, value); }\n    /** Writes locally, then tells the other nodes to forget what they have. */\n    public void put(String key, V value) { local.put(key, value); bus.publish(nodeId, key); }\n    /** Writes locally with a deadline, then invalidates elsewhere. */\n    public void put(String key, V value, long ttlMs) { local.put(key, value, ttlMs); bus.publish(nodeId, key); }\n    /** Removes locally, then invalidates elsewhere. */\n    public V remove(String key) { V v = local.remove(key); bus.publish(nodeId, key); return v; }\n    /** Delegates. */\n    public int size() { return local.size(); }\n    /** Delegates. */\n    public int capacity() { return local.capacity(); }\n    /** Delegates. */\n    public void cleanUp() { local.cleanUp(); }\n    /** Delegates. */\n    public CacheStats stats() { return local.stats(); }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        ManualClock clock = new ManualClock(0);\n\n        System.out.println(\"== sampled LRU: Redis's trade, one class and one builder line ==\");\n        PolicyCache<Integer, Integer> sampled = CacheBuilder.<Integer, Integer>newBuilder()\n                .capacity(50).policy(new SampledLruPolicy<>(5, 42)).clock(clock).build();\n        for (int i = 0; i < 500; i++) { sampled.put(i, i); if (i % 3 == 0) sampled.getIfPresent(i); }\n        System.out.println(\"   500 keys into a cache of 50 -> size \" + sampled.size()\n                           + \", consistent \" + sampled.consistent() + \", \" + sampled.stats());\n\n        System.out.println();\n        System.out.println(\"== scan resistance: a report reads a million cold rows; the working set survives ==\");\n        for (EvictionPolicy<String> p : List.of(new LruPolicy<String>(), new SegmentedLruPolicy<String>(8))) {\n            PolicyCache<String, String> seg = CacheBuilder.<String, String>newBuilder()\n                    .capacity(10).policy(p).clock(clock).build();\n            for (int i = 0; i < 8; i++) { seg.put(\"hot\" + i, \"v\"); seg.getIfPresent(\"hot\" + i); }  // the working set\n            for (int i = 0; i < 200; i++) seg.put(\"scan\" + i, \"v\");                                 // the report\n            int survived = 0;\n            for (int i = 0; i < 8; i++) if (seg.getIfPresent(\"hot\" + i) != null) survived++;\n            System.out.printf(\"   %-14s hot keys still resident after a 200-key scan: %d/8%n\", p.name(), survived);\n        }\n\n        System.out.println();\n        System.out.println(\"== capacity in bytes: one 750-byte value pushes out several small ones ==\");\n        ByteBoundedCache<String, byte[]> bytes = new ByteBoundedCache<>(\n                1000, (k, v) -> v.length, new LruPolicy<>(), clock);\n        for (int i = 0; i < 5; i++) bytes.put(\"small\" + i, new byte[100]);\n        System.out.println(\"   after 5 x 100 bytes: entries \" + bytes.size() + \", weight \" + bytes.weight());\n        bytes.put(\"big\", new byte[750]);\n        System.out.println(\"   after one 750-byte value: entries \" + bytes.size() + \", weight \" + bytes.weight()\n                           + \"   (three small ones had to go, so the check is a loop)\");\n        bytes.put(\"enormous\", new byte[2000]);\n        System.out.println(\"   a 2000-byte value into a 1000-byte budget is refused: entries \"\n                           + bytes.size() + \", weight \" + bytes.weight());\n\n        System.out.println();\n        System.out.println(\"== the stampede: six threads miss the same hot key at the same instant ==\");\n        for (boolean single : new boolean[]{false, true}) {\n            AtomicLong dbCalls = new AtomicLong();\n            PolicyCache<String, String> backing = CacheBuilder.<String, String>newBuilder()\n                    .capacity(16).policy(new LruPolicy<>()).clock(clock).build();\n            LoadingCache<String, String> through = new LoadingCache<>(backing, key -> {\n                dbCalls.incrementAndGet();\n                Thread.sleep(30);                              // the database, being slow\n                return \"row:\" + key;\n            }, single);\n            ExecutorService pool = Executors.newFixedThreadPool(6);\n            CountDownLatch go = new CountDownLatch(1);\n            List<Future<String>> fs = new ArrayList<>();\n            for (int i = 0; i < 6; i++) fs.add(pool.submit(() -> { go.await(); return through.get(\"user:42\"); }));\n            go.countDown();\n            for (Future<String> f : fs) f.get();\n            pool.shutdown();\n            System.out.println(\"   singleFlight=\" + single + \" -> loader called \" + dbCalls.get() + \" time(s)\");\n        }\n\n        System.out.println();\n        System.out.println(\"== writes: through to the store now, or back when the entry leaves ==\");\n        Map<String, String> throughStore = new LinkedHashMap<>();\n        WriteThroughCache<String, String> wt = new WriteThroughCache<>(\n                CacheBuilder.<String, String>newBuilder().capacity(4).clock(clock).build(), throughStore::put);\n        wt.put(\"order:1\", \"paid\");\n        System.out.println(\"   write-through: one put, and the store already holds \" + throughStore);\n\n        Map<String, String> backStore = new LinkedHashMap<>();\n        WriteBackListener<String, String> back = new WriteBackListener<>(backStore::put);\n        PolicyCache<String, String> behind = CacheBuilder.<String, String>newBuilder()\n                .capacity(2).policy(new LruPolicy<>()).clock(clock).listener(back).build();\n        behind.put(\"order:1\", \"pending\");\n        behind.put(\"order:1\", \"paid\");                         // REPLACED: the old value is not news\n        System.out.println(\"   write-back:    two puts to one key, store \" + backStore + \", flushes \" + back.flushes());\n        behind.put(\"order:2\", \"paid\"); behind.put(\"order:3\", \"paid\");   // full: one entry leaves by CAPACITY\n        System.out.println(\"   after the cache overflows: store \" + backStore + \", flushes \" + back.flushes()\n                           + \"   (the cause is the whole logic)\");\n\n        System.out.println();\n        System.out.println(\"== striping: sixteen locks instead of one, callers unchanged ==\");\n        StripedCache<Integer, Integer> striped = new StripedCache<>(16, 1600, LruPolicy::new, clock);\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<?>> all = new ArrayList<>();\n        for (int t = 0; t < 8; t++) {\n            final int seed = t;\n            all.add(pool.submit(() -> {\n                go.await();\n                Random rnd = new Random(seed);\n                for (int i = 0; i < 5000; i++) { int k = rnd.nextInt(4000); if (striped.getIfPresent(k) == null) striped.put(k, k); }\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future<?> f : all) f.get();\n        pool.shutdown();\n        System.out.println(\"   40000 operations across 16 stripes -> size \" + striped.size()\n                           + \"/\" + striped.capacity() + \", \" + striped.stats());\n\n        System.out.println();\n        System.out.println(\"== two servers: a write on node A invalidates node B ==\");\n        InvalidationBus bus = new InvalidationBus();\n        ReplicatedCache<String> a = new ReplicatedCache<>(\"A\",\n                CacheBuilder.<String, String>newBuilder().capacity(8).clock(clock).build(), bus);\n        ReplicatedCache<String> b = new ReplicatedCache<>(\"B\",\n                CacheBuilder.<String, String>newBuilder().capacity(8).clock(clock).build(), bus);\n        a.fill(\"price:AAPL\", \"230\"); b.fill(\"price:AAPL\", \"230\");     // both warmed from the database\n        System.out.println(\"   both nodes hold: A=\" + a.getIfPresent(\"price:AAPL\") + \" B=\" + b.getIfPresent(\"price:AAPL\"));\n        a.put(\"price:AAPL\", \"231\");\n        System.out.println(\"   after A writes 231: A=\" + a.getIfPresent(\"price:AAPL\")\n                           + \" B=\" + b.getIfPresent(\"price:AAPL\") + \"  (B reloads instead of serving 230)\");\n    }\n}\n", "f2": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.AtomicBoolean;\nimport java.util.concurrent.atomic.AtomicLong;\n\n// Targeted failure tests: each block proves a claim the design makes on page 02, move 9.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? \"PASS \" : \"FAIL \") + what); if (!ok) failures++; }\n\n    public static void main(String[] args) throws Exception {\n        ManualClock clock = new ManualClock(0);\n\n        // 1. the seam is real: ONE access trace, four rules, four different victims. If a policy were\n        //    hard-coded, or if the cache quietly ignored it, these four answers would not differ.\n        String fifo = Main.replay(new FifoPolicy<>(), clock, 0);\n        String lru = Main.replay(new LruPolicy<>(), clock, 0);\n        String lfu = Main.replay(new LfuPolicy<>(), clock, 0);\n        String ttl = Main.replay(new TtlPolicy<>(), clock, 0);\n        check(fifo.startsWith(\"A\"), \"FIFO gives up the key that arrived first (A), however hot it is\");\n        check(lru.startsWith(\"B\"), \"LRU gives up the key nobody has touched for longest (B)\");\n        check(lfu.startsWith(\"C\"), \"LFU gives up the key with the fewest uses (C)\");\n        check(ttl.startsWith(\"D\"), \"shortest-fuse-first gives up the key that dies soonest (D)\");\n        check(new HashSet<>(List.of(fifo, lru, lfu, ttl)).size() == 4, \"four rules, four different victims\");\n\n        // 2. evict BEFORE admitting. Under LRU both orders look identical; under LFU a newcomer arrives at one\n        //    use, is instantly the coldest key, and an insert-then-evict cache would have it evict itself.\n        PolicyCache<String, String> lfuCache = CacheBuilder.<String, String>newBuilder()\n                .capacity(3).policy(new LfuPolicy<>()).clock(clock).build();\n        lfuCache.put(\"a\", \"1\"); lfuCache.put(\"b\", \"2\"); lfuCache.put(\"c\", \"3\");\n        lfuCache.getIfPresent(\"a\"); lfuCache.getIfPresent(\"b\");        // a and b are at two uses, c at one\n        lfuCache.put(\"d\", \"4\");\n        check(lfuCache.keys().contains(\"d\"), \"the newcomer is in the cache: it did not evict itself\");\n        check(!lfuCache.keys().contains(\"c\"), \"the coldest existing key (c) is the one that went\");\n        check(lfuCache.size() == 3, \"size is still exactly the capacity\");\n\n        // 3. fifty threads on one cache: the size bound must hold at every instant, and the table and the\n        //    policy must still name the same keys afterwards. Drift here means evicting a key that is not\n        //    there (so nothing goes and the cache grows forever) or one that is (so the policy leaks).\n        PolicyCache<Integer, Integer> hot = CacheBuilder.<Integer, Integer>newBuilder()\n                .capacity(100).policy(new LruPolicy<>()).build();\n        AtomicLong overflow = new AtomicLong();\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<?>> all = new ArrayList<>();\n        for (int t = 0; t < 50; t++) {\n            final int seed = t;\n            all.add(pool.submit(() -> {\n                go.await();\n                Random rnd = new Random(seed);\n                for (int i = 0; i < 400; i++) {\n                    int k = rnd.nextInt(500);\n                    if ((i & 3) == 0) hot.put(k, k); else hot.getIfPresent(k);\n                    if (hot.size() > hot.capacity()) overflow.incrementAndGet();\n                }\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future<?> f : all) f.get();\n        pool.shutdown();\n        check(overflow.get() == 0, \"20000 concurrent operations: the cache was never over capacity\");\n        check(hot.size() == 100, \"the cache is exactly full afterwards, not 99 and not 101\");\n        check(hot.consistent(), \"the table and the policy track exactly the same number of keys\");\n\n        // 4. a twenty-four-hour TTL, tested in zero milliseconds. The clock is injected, so nothing sleeps\n        //    and nothing is flaky; a wall-clock test of this would take a day.\n        clock.setTo(1_700_000_000_000L);\n        List<RemovalCause> causes = new ArrayList<>();\n        PolicyCache<String, String> sessions = CacheBuilder.<String, String>newBuilder()\n                .capacity(10).policy(new LruPolicy<>()).clock(clock)\n                .listener((k, v, cause) -> causes.add(cause)).build();\n        sessions.put(\"sid\", \"harish\", 24 * 3600_000L);\n        clock.advance(23 * 3600_000L);\n        check(\"harish\".equals(sessions.getIfPresent(\"sid\")), \"after 23 hours the entry is still served\");\n        clock.advance(2 * 3600_000L);\n        check(sessions.getIfPresent(\"sid\") == null, \"after 25 hours the read is a miss, not a stale value\");\n        check(sessions.size() == 0, \"the dead entry was dropped by the read

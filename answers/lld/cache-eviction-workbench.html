his cache is bounded by weight, not by entry count, so there is no entry bound to report. */\n    public int capacity() { return Integer.MAX_VALUE; }\n    /** Bytes held right now: the number the bound is actually about. */\n    long weight() { lock.lock(); try { return totalWeight; } finally { lock.unlock(); } }\n    /** Drops dead entries. */\n    public void cleanUp() {\n        lock.lock();\n        try {\n            long now = clock.nowMs();\n            for (Iterator&lt;Map.Entry&lt;K, CacheEntry&lt;V&gt;&gt;&gt; it = table.entrySet().iterator(); it.hasNext(); ) {\n                Map.Entry&lt;K, CacheEntry&lt;V&gt;&gt; en = it.next();\n                if (en.getValue().expired(now)) {\n                    it.remove(); policy.onRemove(en.getKey());\n                    Integer w = weightOf.remove(en.getKey());\n                    if (w != null) totalWeight -= w;\n                }\n            }\n        } finally { lock.unlock(); }\n    }\n    /** Hits, misses and evictions. */\n    public CacheStats stats() { return new CacheStats(hits.get(), misses.get(), evictions.get(), 0); }\n}\n\n// ---- ext: read-through without a stampede -- six threads miss the same hot key at the same instant\n/** Where a value comes from on a miss: a database, an API, a computation. One method, handed in. */\ninterface CacheLoader&lt;K, V&gt; {\n    /** Fetches the value for this key. Called with NO cache lock held. */\n    V load(K key) throws Exception;\n}\n\n/**\n * Read-through with single flight. The naive version of &quot;load on a miss&quot; is an incident: six threads miss\n * the same hot key, all six pass the &quot;is it cached?&quot; check before any of them finishes, and all six hit the\n * database at exactly the moment it can least take it. The fix is a per-key election -- putIfAbsent on a\n * future is one compare-and-set that names a winner, and the losers wait on the winner&#x27;s future.\n * A wrapper, not an edit: it composes over any Cache, including a striped one.\n */\nfinal class LoadingCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final Cache&lt;K, V&gt; inner;\n    private final CacheLoader&lt;K, V&gt; loader;\n    private final ConcurrentHashMap&lt;K, CompletableFuture&lt;V&gt;&gt; inFlight = new ConcurrentHashMap&lt;&gt;();\n    private final boolean singleFlight;\n\n    /** singleFlight = false reproduces the stampede, which is what the demo contrasts against. */\n    LoadingCache(Cache&lt;K, V&gt; inner, CacheLoader&lt;K, V&gt; loader, boolean singleFlight) {\n        this.inner = inner; this.loader = loader; this.singleFlight = singleFlight;\n    }\n\n    /** The value, loading it on a miss. At most one loader call per key is in flight at a time. */\n    V get(K key) throws Exception {\n        V cached = inner.getIfPresent(key);\n        if (cached != null) return cached;\n        if (!singleFlight) {                                   // the version that takes down the database\n            V loaded = loader.load(key);\n            if (loaded != null) inner.put(key, loaded);\n            return loaded;\n        }\n        CompletableFuture&lt;V&gt; mine = new CompletableFuture&lt;&gt;();\n        CompletableFuture&lt;V&gt; winner = inFlight.putIfAbsent(key, mine);\n        if (winner != null) return winner.get();               // a loser: wait for the winner&#x27;s result\n        try {\n            V again = inner.getIfPresent(key);                 // double-check inside the flight\n            V loaded = again != null ? again : loader.load(key);\n            if (loaded != null) inner.put(key, loaded);\n            mine.complete(loaded);\n            return loaded;\n        } catch (Exception e) {\n            mine.completeExceptionally(e);                     // or every waiter parks forever\n            throw e;\n        } finally {\n            inFlight.remove(key, mine);                        // in a finally, so a throw cannot poison the key\n        }\n    }\n\n    /** Delegates: a read that does not load. */\n    public V getIfPresent(K key) { return inner.getIfPresent(key); }\n    /** Delegates. */\n    public void put(K key, V value) { inner.put(key, value); }\n    /** Delegates. */\n    public void put(K key, V value, long ttlMs) { inner.put(key, value, ttlMs); }\n    /** Delegates. */\n    public V remove(K key) { return inner.remove(key); }\n    /** Delegates. */\n    public int size() { return inner.size(); }\n    /** Delegates. */\n    public int capacity() { return inner.capacity(); }\n    /** Delegates. */\n    public void cleanUp() { inner.cleanUp(); }\n    /** Delegates. */\n    public CacheStats stats() { return inner.stats(); }\n}\n\n// ---- ext: writes -- does a put reach the database, and when?\n/** The durable side of a write: where a value lives once the cache lets go of it. One method, handed in. */\ninterface WriteStore&lt;K, V&gt; {\n    /** Persists one key. Called with NO cache lock held, so it may take a millisecond of database. */\n    void write(K key, V value);\n}\n\n/**\n * Write-through: the store is written BEFORE the cache, so a failed write never becomes a cached lie and the\n * store is never behind the cache. The price is that every put pays the store&#x27;s latency on the caller&#x27;s\n * thread, so a write-through cache speeds up reads only. This is the same ordering rule as move 6 -- commit\n * nothing until the irreversible thing has succeeded -- and it is a wrapper, so PolicyCache still has no idea\n * what a database is.\n */\nfinal class WriteThroughCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final Cache&lt;K, V&gt; inner;\n    private final WriteStore&lt;K, V&gt; store;\n\n    /** Wraps any cache, including a striped one. */\n    WriteThroughCache(Cache&lt;K, V&gt; inner, WriteStore&lt;K, V&gt; store) { this.inner = inner; this.store = store; }\n\n    /** Store first, cache second: if the store throws, nothing was cached and the caller can retry. */\n    public void put(K key, V value) { store.write(key, value); inner.put(key, value); }\n    /** Store first, cache second, with a deadline. */\n    public void put(K key, V value, long ttlMs) { store.write(key, value); inner.put(key, value, ttlMs); }\n    /** Delegates: reads never touch the store. */\n    public V getIfPresent(K key) { return inner.getIfPresent(key); }\n    /** Delegates. */\n    public V remove(K key) { return inner.remove(key); }\n    /** Delegates. */\n    public int size() { return inner.size(); }\n    /** Delegates. */\n    public int capacity() { return inner.capacity(); }\n    /** Delegates. */\n    public void cleanUp() { inner.cleanUp(); }\n    /** Delegates. */\n    public CacheStats stats() { return inner.stats(); }\n}\n\n/**\n * Write-back (write-behind): a put touches only the cache, and the value reaches the store when the entry\n * leaves. That is a RemovalListener and nothing else -- no new field on the cache, no new lock. The CAUSE is\n * the whole logic, which is the clearest payoff of having four causes instead of a boolean:\n * CAPACITY and EXPIRED carry the newest value out of memory, so not writing it loses the write;\n * REPLACED hands back a value that a newer one has already superseded, and writing it is pure waste;\n * EXPLICIT is the caller saying forget this, which is not a request to persist it.\n * The honest cost: the flush happens after the unlock, so a crash in that window loses the write. Real\n * write-back caches pair this with a periodic flush of everything still dirty.\n */\nfinal class WriteBackListener&lt;K, V&gt; implements RemovalListener&lt;K, V&gt; {\n    private final WriteStore&lt;K, V&gt; store;\n    private final AtomicLong flushes = new AtomicLong();\n\n    /** Hand it the store; hand it to the cache with builder.listener(...). */\n    WriteBackListener(WriteStore&lt;K, V&gt; store) { this.store = store; }\n\n    /** Writes back only the two causes that carry a live value out of memory. */\n    public void onRemoval(K key, V value, RemovalCause cause) {\n        if (cause == RemovalCause.CAPACITY || cause == RemovalCause.EXPIRED) {\n            store.write(key, value);\n            flushes.incrementAndGet();\n        }\n    }\n\n    /** How many entries have been written back so far. */\n    long flushes() { return flushes.get(); }\n}\n\n// ---- ext: striping -- the profiler says threads are queueing on your one lock\n/**\n * N independent caches behind one Cache, chosen by a spread hash of the key. Callers change nothing;\n * throughput goes up roughly N times because unrelated keys no longer share a lock. The price: eviction is\n * now per stripe, so the bound is per stripe too and the recency order is approximate across the whole cache.\n */\nfinal class StripedCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final List&lt;PolicyCache&lt;K, V&gt;&gt; segments = new ArrayList&lt;&gt;();\n\n    /** Splits the capacity evenly; each stripe gets its OWN policy instance, never a shared one. */\n    StripedCache(int stripes, int totalCapacity, Supplier&lt;EvictionPolicy&lt;K&gt;&gt; policyPerStripe, Clock clock) {\n        int per = Math.max(1, totalCapacity / stripes);\n        for (int i = 0; i &lt; stripes; i++)\n            segments.add(new PolicyCache&lt;&gt;(per, policyPerStripe.get(), clock, 0));\n    }\n\n    // The same bit-spreading HashMap uses: raw hashCodes clump, and a clumped hash means one hot stripe.\n    private PolicyCache&lt;K, V&gt; segmentFor(K key) {\n        int h = key.hashCode();\n        h ^= (h &gt;&gt;&gt; 16);\n        return segments.get((h &amp; 0x7fffffff) % segments.size());\n    }\n\n    /** Reads from the one stripe that could hold this key. */\n    public V getIfPresent(K key) { return segmentFor(key).getIfPresent(key); }\n    /** Writes into the one stripe that owns this key. */\n    public void put(K key, V value) { segmentFor(key).put(key, value); }\n    /** Writes into the one stripe that owns this key. */\n    public void put(K key, V value, long ttlMs) { segmentFor(key).put(key, value, ttlMs); }\n    /** Removes from the one stripe that owns this key. */\n    public V remove(K key) { return segmentFor(key).remove(key); }\n    /** The total across stripes; no lock spans them, so it is a sum of snapshots. */\n    public int size() { int n = 0; for (PolicyCache&lt;K, V&gt; s : segments) n += s.size(); return n; }\n    /** The sum of the per-stripe bounds. */\n    public int capacity() { int n = 0; for (PolicyCache&lt;K, V&gt; s : segments) n += s.capacity(); return n; }\n    /** Sweeps every stripe. */\n    public void cleanUp() { for (PolicyCache&lt;K, V&gt; s : segments) s.cleanUp(); }\n    /** Adds the stripes&#x27; counters together. */\n    public CacheStats stats() {\n        long h = 0, m = 0, e = 0, x = 0;\n        for (PolicyCache&lt;K, V&gt; s : segments) {\n            CacheStats t = s.stats();\n            h += t.hits(); m += t.misses(); e += t.evictions(); x += t.expirations();\n        }\n        return new CacheStats(h, m, e, x);\n    }\n}\n\n// ---- ext: two servers -- a write on one must not leave a stale copy on the other\n/**\n * A stand-in for a message bus: in a real system this is Redis pub/sub, Kafka or a gossip channel, and which\n * node owns which key is decided by consistent hashing so that adding a node moves 1/N of the keys, not all\n * of them. The rule that matters is the same either way: publish INVALIDATIONS, not values, so two nodes can\n * never disagree about what the newest value is -- they simply both go and read it again.\n */\nfinal class InvalidationBus {\n    private final Map&lt;String, Consumer&lt;String&gt;&gt; nodes = new ConcurrentHashMap&lt;&gt;();\n    /** A node subscribes with its own id and a handler that drops a key locally. */\n    void join(String nodeId, Consumer&lt;String&gt; onInvalidate) { nodes.put(nodeId, onInvalidate); }\n    /** Tells every OTHER node that this key changed. The writer keeps its own fresh copy. */\n    void publish(String fromNodeId, String key) {\n        nodes.forEach((id, handler) -&gt; { if (!id.equals(fromNodeId)) handler.accept(key); });\n    }\n}\n\n/**\n * One node&#x27;s cache, wired to the bus. A local write publishes an invalidation; an invalidation from another\n * node drops the local copy so the next read reloads it. A fifth removal cause, INVALIDATED, would be worth\n * adding in production: today the drop is reported as EXPLICIT, which is close enough to be a lie.\n */\nfinal class ReplicatedCache&lt;V&gt; implements Cache&lt;String, V&gt; {\n    private final String nodeId;\n    private final Cache&lt;String, V&gt; local;\n    private final InvalidationBus bus;\n\n    /** Joins the bus on construction, so the node starts hearing about other nodes&#x27; writes immediately. */\n    ReplicatedCache(String nodeId, Cache&lt;String, V&gt; local, InvalidationBus bus) {\n        this.nodeId = nodeId; this.local = local; this.bus = bus;\n        bus.join(nodeId, local::remove);                       // never re-publishes: that would loop forever\n    }\n\n    /** Reads the local copy. */\n    public V getIfPresent(String key) { return local.getIfPresent(key); }\n    /**\n     * Fills the local copy after a read from the database, and publishes NOTHING. The distinction matters:\n     * a cache fill is not news -- nobody else&#x27;s copy became wrong -- and a node that invalidates the cluster\n     * every time it warms itself up turns a cache into a broadcast storm.\n     */\n    void fill(String key, V value) { local.put(key, value); }\n    /** Writes locally, then tells the other nodes to forget what they have. */\n    public void put(String key, V value) { local.put(key, value); bus.publish(nodeId, key); }\n    /** Writes locally with a deadline, then invalidates elsewhere. */\n    public void put(String key, V value, long ttlMs) { local.put(key, value, ttlMs); bus.publish(nodeId, key); }\n    /** Removes locally, then invalidates elsewhere. */\n    public V remove(String key) { V v = local.remove(key); bus.publish(nodeId, key); return v; }\n    /** Delegates. */\n    public int size() { return local.size(); }\n    /** Delegates. */\n    public int capacity() { return local.capacity(); }\n    /** Delegates. */\n    public void cleanUp() { local.cleanUp(); }\n    /** Delegates. */\n    public CacheStats stats() { return local.stats(); }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        ManualClock clock = new ManualClock(0);\n\n        System.out.println(&quot;== sampled LRU: Redis&#x27;s trade, one class and one builder line ==&quot;);\n        PolicyCache&lt;Integer, Integer&gt; sampled = CacheBuilder.&lt;Integer, Integer&gt;newBuilder()\n                .capacity(50).policy(new SampledLruPolicy&lt;&gt;(5, 42)).clock(clock).build();\n        for (int i = 0; i &lt; 500; i++) { sampled.put(i, i); if (i % 3 == 0) sampled.getIfPresent(i); }\n        System.out.println(&quot;   500 keys into a cache of 50 -&gt; size &quot; + sampled.size()\n                           + &quot;, consistent &quot; + sampled.consistent() + &quot;, &quot; + sampled.stats());\n\n        System.out.println();\n        System.out.println(&quot;== scan resistance: a report reads a million cold rows; the working set survives ==&quot;);\n        for (EvictionPolicy&lt;String&gt; p : List.of(new LruPolicy&lt;String&gt;(), new SegmentedLruPolicy&lt;String&gt;(8))) {\n            PolicyCache&lt;String, String&gt; seg = CacheBuilder.&lt;String, String&gt;newBuilder()\n                    .capacity(10).policy(p).clock(clock).build();\n            for (int i = 0; i &lt; 8; i++) { seg.put(&quot;hot&quot; + i, &quot;v&quot;); seg.getIfPresent(&quot;hot&quot; + i); }  // the working set\n            for (int i = 0; i &lt; 200; i++) seg.put(&quot;scan&quot; + i, &quot;v&quot;);                                 // the report\n            int survived = 0;\n            for (int i = 0; i &lt; 8; i++) if (seg.getIfPresent(&quot;hot&quot; + i) != null) survived++;\n            System.out.printf(&quot;   %-14s hot keys still resident after a 200-key scan: %d/8%n&quot;, p.name(), survived);\n        }\n\n        System.out.println();\n        System.out.println(&quot;== capacity in bytes: one 750-byte value pushes out several small ones ==&quot;);\n        ByteBoundedCache&lt;String, byte[]&gt; bytes = new ByteBoundedCache&lt;&gt;(\n                1000, (k, v) -&gt; v.length, new LruPolicy&lt;&gt;(), clock);\n        for (int i = 0; i &lt; 5; i++) bytes.put(&quot;small&quot; + i, new byte[100]);\n        System.out.println(&quot;   after 5 x 100 bytes: entries &quot; + bytes.size() + &quot;, weight &quot; + bytes.weight());\n        bytes.put(&quot;big&quot;, new byte[750]);\n        System.out.println(&quot;   after one 750-byte value: entries &quot; + bytes.size() + &quot;, weight &quot; + bytes.weight()\n                           + &quot;   (three small ones had to go, so the check is a loop)&quot;);\n        bytes.put(&quot;enormous&quot;, new byte[2000]);\n        System.out.println(&quot;   a 2000-byte value into a 1000-byte budget is refused: entries &quot;\n                           + bytes.size() + &quot;, weight &quot; + bytes.weight());\n\n        System.out.println();\n        System.out.println(&quot;== the stampede: six threads miss the same hot key at the same instant ==&quot;);\n        for (boolean single : new boolean[]{false, true}) {\n            AtomicLong dbCalls = new AtomicLong();\n            PolicyCache&lt;String, String&gt; backing = CacheBuilder.&lt;String, String&gt;newBuilder()\n                    .capacity(16).policy(new LruPolicy&lt;&gt;()).clock(clock).build();\n            LoadingCache&lt;String, String&gt; through = new LoadingCache&lt;&gt;(backing, key -&gt; {\n                dbCalls.incrementAndGet();\n                Thread.sleep(30);                              // the database, being slow\n                return &quot;row:&quot; + key;\n            }, single);\n            ExecutorService pool = Executors.newFixedThreadPool(6);\n            CountDownLatch go = new CountDownLatch(1);\n            List&lt;Future&lt;String&gt;&gt; fs = new ArrayList&lt;&gt;();\n            for (int i = 0; i &lt; 6; i++) fs.add(pool.submit(() -&gt; { go.await(); return through.get(&quot;user:42&quot;); }));\n            go.countDown();\n            for (Future&lt;String&gt; f : fs) f.get();\n            pool.shutdown();\n            System.out.println(&quot;   singleFlight=&quot; + single + &quot; -&gt; loader called &quot; + dbCalls.get() + &quot; time(s)&quot;);\n        }\n\n        System.out.println();\n        System.out.println(&quot;== writes: through to the store now, or back when the entry leaves ==&quot;);\n        Map&lt;String, String&gt; throughStore = new LinkedHashMap&lt;&gt;();\n        WriteThroughCache&lt;String, String&gt; wt = new WriteThroughCache&lt;&gt;(\n                CacheBuilder.&lt;String, String&gt;newBuilder().capacity(4).clock(clock).build(), throughStore::put);\n        wt.put(&quot;order:1&quot;, &quot;paid&quot;);\n        System.out.println(&quot;   write-through: one put, and the store already holds &quot; + throughStore);\n\n        Map&lt;String, String&gt; backStore = new LinkedHashMap&lt;&gt;();\n        WriteBackListener&lt;String, String&gt; back = new WriteBackListener&lt;&gt;(backStore::put);\n        PolicyCache&lt;String, String&gt; behind = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(2).policy(new LruPolicy&lt;&gt;()).clock(clock).listener(back).build();\n        behind.put(&quot;order:1&quot;, &quot;pending&quot;);\n        behind.put(&quot;order:1&quot;, &quot;paid&quot;);                         // REPLACED: the old value is not news\n        System.out.println(&quot;   write-back:    two puts to one key, store &quot; + backStore + &quot;, flushes &quot; + back.flushes());\n        behind.put(&quot;order:2&quot;, &quot;paid&quot;); behind.put(&quot;order:3&quot;, &quot;paid&quot;);   // full: one entry leaves by CAPACITY\n        System.out.println(&quot;   after the cache overflows: store &quot; + backStore + &quot;, flushes &quot; + back.flushes()\n                           + &quot;   (the cause is the whole logic)&quot;);\n\n        System.out.println();\n        System.out.println(&quot;== striping: sixteen locks instead of one, callers unchanged ==&quot;);\n        StripedCache&lt;Integer, Integer&gt; striped = new StripedCache&lt;&gt;(16, 1600, LruPolicy::new, clock);\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; all = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; 8; t++) {\n            final int seed = t;\n            all.add(pool.submit(() -&gt; {\n                go.await();\n                Random rnd = new Random(seed);\n                for (int i = 0; i &lt; 5000; i++) { int k = rnd.nextInt(4000); if (striped.getIfPresent(k) == null) striped.put(k, k); }\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : all) f.get();\n        pool.shutdown();\n        System.out.println(&quot;   40000 operations across 16 stripes -&gt; size &quot; + striped.size()\n                           + &quot;/&quot; + striped.capacity() + &quot;, &quot; + striped.stats());\n\n        System.out.println();\n        System.out.println(&quot;== two servers: a write on node A invalidates node B ==&quot;);\n        InvalidationBus bus = new InvalidationBus();\n        ReplicatedCache&lt;String&gt; a = new ReplicatedCache&lt;&gt;(&quot;A&quot;,\n                CacheBuilder.&lt;String, String&gt;newBuilder().capacity(8).clock(clock).build(), bus);\n        ReplicatedCache&lt;String&gt; b = new ReplicatedCache&lt;&gt;(&quot;B&quot;,\n                CacheBuilder.&lt;String, String&gt;newBuilder().capacity(8).clock(clock).build(), bus);\n        a.fill(&quot;price:AAPL&quot;, &quot;230&quot;); b.fill(&quot;price:AAPL&quot;, &quot;230&quot;);     // both warmed from the database\n        System.out.println(&quot;   both nodes hold: A=&quot; + a.getIfPresent(&quot;price:AAPL&quot;) + &quot; B=&quot; + b.getIfPresent(&quot;price:AAPL&quot;));\n        a.put(&quot;price:AAPL&quot;, &quot;231&quot;);\n        System.out.println(&quot;   after A writes 231: A=&quot; + a.getIfPresent(&quot;price:AAPL&quot;)\n                           + &quot; B=&quot; + b.getIfPresent(&quot;price:AAPL&quot;) + &quot;  (B reloads instead of serving 230)&quot;);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.AtomicBoolean;\nimport java.util.concurrent.atomic.AtomicLong;\n\n// Targeted failure tests: each block proves a claim the design makes on page 02, move 9.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n\n    public static void main(String[] args) throws Exception {\n        ManualClock clock = new ManualClock(0);\n\n        // 1. the seam is real: ONE access trace, four rules, four different victims. If a policy were\n        //    hard-coded, or if the cache quietly ignored it, these four answers would not differ.\n        String fifo = Main.replay(new FifoPolicy&lt;&gt;(), clock, 0);\n        String lru = Main.replay(new LruPolicy&lt;&gt;(), clock, 0);\n        String lfu = Main.replay(new LfuPolicy&lt;&gt;(), clock, 0);\n        String ttl = Main.replay(new TtlPolicy&lt;&gt;(), clock, 0);\n        check(fifo.startsWith(&quot;A&quot;), &quot;FIFO gives up the key that arrived first (A), however hot it is&quot;);\n        check(lru.startsWith(&quot;B&quot;), &quot;LRU gives up the key nobody has touched for longest (B)&quot;);\n        check(lfu.startsWith(&quot;C&quot;), &quot;LFU gives up the key with the fewest uses (C)&quot;);\n        check(ttl.startsWith(&quot;D&quot;), &quot;shortest-fuse-first gives up the key that dies soonest (D)&quot;);\n        check(new HashSet&lt;&gt;(List.of(fifo, lru, lfu, ttl)).size() == 4, &quot;four rules, four different victims&quot;);\n\n        // 2. evict BEFORE admitting. Under LRU both orders look identical; under LFU a newcomer arrives at one\n        //    use, is instantly the coldest key, and an insert-then-evict cache would have it evict itself.\n        PolicyCache&lt;String, String&gt; lfuCache = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(3).policy(new LfuPolicy&lt;&gt;()).clock(clock).build();\n        lfuCache.put(&quot;a&quot;, &quot;1&quot;); lfuCache.put(&quot;b&quot;, &quot;2&quot;); lfuCache.put(&quot;c&quot;, &quot;3&quot;);\n        lfuCache.getIfPresent(&quot;a&quot;); lfuCache.getIfPresent(&quot;b&quot;);        // a and b are at two uses, c at one\n        lfuCache.put(&quot;d&quot;, &quot;4&quot;);\n        check(lfuCache.keys().contains(&quot;d&quot;), &quot;the newcomer is in the cache: it did not evict itself&quot;);\n        check(!lfuCache.keys().contains(&quot;c&quot;), &quot;the coldest existing key (c) is the one that went&quot;);\n        check(lfuCache.size() == 3, &quot;size is still exactly the capacity&quot;);\n\n        // 3. fifty threads on one cache: the size bound must hold at every instant, and the table and the\n        //    policy must still name the same keys afterwards. Drift here means evicting a key that is not\n        //    there (so nothing goes and the cache grows forever) or one that is (so the policy leaks).\n        PolicyCache&lt;Integer, Integer&gt; hot = CacheBuilder.&lt;Integer, Integer&gt;newBuilder()\n                .capacity(100).policy(new LruPolicy&lt;&gt;()).build();\n        AtomicLong overflow = new AtomicLong();\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; all = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; 50; t++) {\n            final int seed = t;\n            all.add(pool.submit(() -&gt; {\n                go.await();\n                Random rnd = new Random(seed);\n                for (int i = 0; i &lt; 400; i++) {\n                    int k = rnd.nextInt(500);\n                    if ((i &amp; 3) == 0) hot.put(k, k); else hot.getIfPresent(k);\n                    if (hot.size() &gt; hot.capacity()) overflow.incrementAndGet();\n                }\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : all) f.get();\n        pool.shutdown();\n        check(overflow.get() == 0, &quot;20000 concurrent operations: the cache was never over capacity&quot;);\n        check(hot.size() == 100, &quot;the cache is exactly full afterwards, not 99 and not 101&quot;);\n        check(hot.consistent(), &quot;the table and the policy track exactly the same number of keys&quot;);\n\n        // 4. a twenty-four-hour TTL, tested in zero milliseconds. The clock is injected, so nothing sleeps\n        //    and nothing is flaky; a wall-clock test of this would take a day.\n        clock.setTo(1_700_000_000_000L);\n        List&lt;RemovalCause&gt; causes = new ArrayList&lt;&gt;();\n        PolicyCache&lt;String, String&gt; sessions = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(10).policy(new LruPolicy&lt;&gt;()).clock(clock)\n                .listener((k, v, cause) -&gt; causes.add(cause)).build();\n        sessions.put(&quot;sid&quot;, &quot;harish&quot;, 24 * 3600_000L);\n        clock.advance(23 * 3600_000L);\n        check(&quot;harish&quot;.equals(sessions.getIfPresent(&quot;sid&quot;)), &quot;after 23 hours the entry is still served&quot;);\n        clock.advance(2 * 3600_000L);\n        check(sessions.getIfPresent(&quot;sid&quot;) == null, &quot;after 25 hours the read is a miss, not a stale value&quot;);\n        check(sessions.size() == 0, &quot;the dead entry was dropped by the read that found it&quot;);\n        check(causes.equals(List.of(RemovalCause.EXPIRED)), &quot;and it was reported as EXPIRED&quot;);\n\n        // 5. &quot;why did my session disappear?&quot; -- four ways out, four causes. A listener that is only told the\n        //    key cannot tell a capacity bug from an expiry bug, and those are different bugs.\n        Map&lt;String, RemovalCause&gt; why = new LinkedHashMap&lt;&gt;();\n        clock.setTo(0);\n        PolicyCache&lt;String, String&gt; causeCache = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(2).policy(new FifoPolicy&lt;&gt;()).clock(clock)\n                .listener((k, v, cause) -&gt; why.put(k + &quot;=&quot; + v, cause)).build();\n        causeCache.put(&quot;explicit&quot;, &quot;v1&quot;);\n        causeCache.remove(&quot;explicit&quot;);\n        causeCache.put(&quot;replaced&quot;, &quot;old&quot;);\n        causeCache.put(&quot;replaced&quot;, &quot;new&quot;);\n        causeCache.put(&quot;dies&quot;, &quot;v2&quot;, 1_000);\n        clock.advance(2_000);\n        causeCache.getIfPresent(&quot;dies&quot;);\n        causeCache.put(&quot;x&quot;, &quot;v3&quot;); causeCache.put(&quot;y&quot;, &quot;v4&quot;); causeCache.put(&quot;z&quot;, &quot;v5&quot;);   // pushes one out\n        check(why.get(&quot;explicit=v1&quot;) == RemovalCause.EXPLICIT, &quot;remove(key) reports EXPLICIT&quot;);\n        check(why.get(&quot;replaced=old&quot;) == RemovalCause.REPLACED, &quot;a rewrite reports REPLACED, with the OLD value&quot;);\n        check(why.get(&quot;dies=v2&quot;) == RemovalCause.EXPIRED, &quot;a read past the deadline reports EXPIRED&quot;);\n        check(why.containsValue(RemovalCause.CAPACITY), &quot;the policy&#x27;s victim reports CAPACITY&quot;);\n\n        // 6. TTL as a DECORATOR over any policy: when something is already dead, that goes first; when\n        //    nothing is dead, the wrapped rule decides and the wrapper is invisible.\n        String plain = Main.replay(new LruPolicy&lt;&gt;(), clock, 4_000);\n        String wrapped = Main.replay(new ExpiryFirst&lt;&gt;(new LruPolicy&lt;&gt;()), clock, 4_000);\n        String wrappedLfu = Main.replay(new ExpiryFirst&lt;&gt;(new LfuPolicy&lt;&gt;()), clock, 4_000);\n        String noneDead = Main.replay(new ExpiryFirst&lt;&gt;(new LruPolicy&lt;&gt;()), clock, 0);\n        check(plain.startsWith(&quot;B&quot;) &amp;&amp; plain.contains(&quot;CAPACITY&quot;), &quot;plain LRU gives up a live key while a dead one sits there&quot;);\n        check(wrapped.startsWith(&quot;D&quot;) &amp;&amp; wrapped.contains(&quot;EXPIRED&quot;), &quot;ExpiryFirst(LRU) takes the corpse instead, and says EXPIRED&quot;);\n        check(wrappedLfu.startsWith(&quot;D&quot;), &quot;the same wrapper works over LFU: it is a decorator, not a fifth policy&quot;);\n        check(noneDead.startsWith(&quot;B&quot;), &quot;with nobody dead the wrapper delegates and behaves exactly like LRU&quot;);\n\n        // 7. swapping the rule at runtime. Every entry must survive; what does not survive is the ranking,\n        //    because the new policy starts with no history -- and the test says so rather than hiding it.\n        clock.setTo(0);\n        List&lt;String&gt; lost = new ArrayList&lt;&gt;();\n        PolicyCache&lt;String, String&gt; live = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(3).policy(new LruPolicy&lt;&gt;()).clock(clock)\n                .listener((k, v, cause) -&gt; lost.add(k)).build();\n        live.put(&quot;x&quot;, &quot;1&quot;); live.put(&quot;y&quot;, &quot;2&quot;); live.put(&quot;z&quot;, &quot;3&quot;);\n        live.getIfPresent(&quot;x&quot;); live.getIfPresent(&quot;x&quot;); live.getIfPresent(&quot;y&quot;);     // LRU would now give up z\n        EvictionPolicy&lt;String&gt; was = live.setPolicy(new LfuPolicy&lt;&gt;());\n        check(was.name().equals(&quot;LRU&quot;) &amp;&amp; live.policy().name().equals(&quot;LFU&quot;), &quot;the rule really changed, and the old one is returned&quot;);\n        check(live.size() == 3 &amp;&amp; live.keys().containsAll(List.of(&quot;x&quot;, &quot;y&quot;, &quot;z&quot;)), &quot;every entry survived the swap&quot;);\n        check(lost.isEmpty(), &quot;nothing was evicted to make the swap happen&quot;);\n        live.put(&quot;w&quot;, &quot;4&quot;);\n        check(lost.equals(List.of(&quot;x&quot;)), &quot;the fresh LFU has no history, so x goes, not the z the old LRU had lined up&quot;);\n\n        // 8. a listener is caller code. One that throws must not break a put; one that calls straight back\n        //    into the cache must not deadlock. Both are safe only because listeners run after the unlock.\n        clock.setTo(0);\n        AtomicBoolean reentered = new AtomicBoolean(false);\n        PolicyCache&lt;String, String&gt; guarded = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(2).policy(new LruPolicy&lt;&gt;()).clock(clock).build();\n        guarded.addListener((k, v, cause) -&gt; { throw new IllegalStateException(&quot;this listener is broken&quot;); });\n        guarded.addListener((k, v, cause) -&gt; {\n            if (cause == RemovalCause.CAPACITY) { reentered.set(true); guarded.remove(&quot;canary&quot;); }\n        });\n        guarded.put(&quot;canary&quot;, &quot;alive&quot;);\n        guarded.put(&quot;p&quot;, &quot;1&quot;);\n        guarded.put(&quot;q&quot;, &quot;2&quot;);                                     // full: something is evicted, both listeners run\n        check(true, &quot;a listener that throws did not stop the put from completing&quot;);\n        check(reentered.get(), &quot;the second listener still ran after the first one threw&quot;);\n        check(guarded.size() &lt;= guarded.capacity() &amp;&amp; guarded.consistent(),\n              &quot;a listener that called back into the cache neither deadlocked nor left it inconsistent&quot;);\n\n        // 9. the counters. A dead read is a miss and an expiration, never a hit; an eviction is counted once.\n        clock.setTo(0);\n        PolicyCache&lt;String, String&gt; counted = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(2).policy(new LruPolicy&lt;&gt;()).clock(clock).build();\n        counted.getIfPresent(&quot;a&quot;);                                 // miss 1\n        counted.put(&quot;a&quot;, &quot;1&quot;);\n        counted.getIfPresent(&quot;a&quot;);                                 // hit 1\n        counted.put(&quot;b&quot;, &quot;2&quot;);\n        counted.put(&quot;c&quot;, &quot;3&quot;);                                     // full: a is evicted\n        counted.getIfPresent(&quot;a&quot;);                                 // miss 2\n        CacheStats s = counted.stats();\n        check(s.hits() == 1 &amp;&amp; s.misses() == 2, &quot;one hit and two misses, counted outside the lock&quot;);\n        check(s.evictions() == 1, &quot;exactly one eviction, not one per key touched&quot;);\n        check(Math.abs(s.hitRate() - 1.0 / 3) &lt; 1e-9, &quot;the hit rate is hits / (hits + misses)&quot;);\n\n        // 10. writes. Write-through must not cache a value the store refused; write-back is a listener whose\n        //     whole logic is the CAUSE -- CAPACITY and EXPIRED carry the newest value out of memory and must be\n        //     flushed, while REPLACED and EXPLICIT must not be.\n        clock.setTo(0);\n        PolicyCache&lt;String, String&gt; wtInner = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(4).policy(new LruPolicy&lt;&gt;()).clock(clock).build();\n        WriteThroughCache&lt;String, String&gt; wt = new WriteThroughCache&lt;&gt;(\n                wtInner, (k, v) -&gt; { throw new IllegalStateException(&quot;the database is down&quot;); });\n        try { wt.put(&quot;x&quot;, &quot;1&quot;); check(false, &quot;a store that throws must reach the caller, not be swallowed&quot;); }\n        catch (IllegalStateException expected) { check(true, &quot;a store that throws reaches the caller&quot;); }\n        check(wtInner.getIfPresent(&quot;x&quot;) == null, &quot;a value the store refused was never cached: no lie to read back&quot;);\n\n        Map&lt;String, String&gt; store = new LinkedHashMap&lt;&gt;();\n        WriteBackListener&lt;String, String&gt; back = new WriteBackListener&lt;&gt;(store::put);\n        PolicyCache&lt;String, String&gt; behind = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(2).policy(new LruPolicy&lt;&gt;()).clock(clock).listener(back).build();\n        behind.put(&quot;a&quot;, &quot;old&quot;);\n        behind.put(&quot;a&quot;, &quot;new&quot;);                                    // REPLACED: superseded, so not news\n        check(store.isEmpty(), &quot;an overwritten value is not written back: the newer one is still in the cache&quot;);\n        behind.put(&quot;b&quot;, &quot;1&quot;);\n        behind.put(&quot;c&quot;, &quot;1&quot;);                                      // full: a leaves by CAPACITY\n        check(&quot;new&quot;.equals(store.get(&quot;a&quot;)) &amp;&amp; back.flushes() == 1,\n              &quot;the value the policy carried out of memory reached the store, exactly once&quot;);\n        behind.remove(&quot;c&quot;);\n        check(back.flushes() == 1, &quot;an explicit remove is the caller forgetting, not a flush&quot;);\n\n        PolicyCache&lt;String, String&gt; dirty = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(4).policy(new LruPolicy&lt;&gt;()).clock(clock).listener(back).build();\n        dirty.put(&quot;d&quot;, &quot;unsaved&quot;, 1_000);\n        clock.advance(2_000);\n        check(dirty.getIfPresent(&quot;d&quot;) == null, &quot;past its deadline the entry is gone from the cache&quot;);\n        check(&quot;unsaved&quot;.equals(store.get(&quot;d&quot;)), &quot;a value the clock carried out of memory still reached the store&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILURES&quot;);\n        if (failures &gt; 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design a cache with a fixed capacity and a pluggable eviction policy. Least-recently-used to start, but I am going to ask for least-frequently-used and FIFO before we are done, some entries carry a time-to-live, and something has to be told when an entry is dropped and why. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (entries or bytes, and whether TTL is a rule or a validity check, come first); then type in the order of Main.java: the RemovalCause enum, Clock with its two implementations, RemovalListener and CacheEntry, the Cache interface, then the EvictionPolicy interface &mdash; write that one before any rule, because it is the decision being graded &mdash; then KeyList, then LruPolicy and FifoPolicy off the same list, then LfuPolicy, then PolicyCache with its lock and the order inside put, then the builder, then a main that pushes one trace through two rules and prints two different victims. TtlPolicy, ExpiryFirst and the DeadlineIndex are the second pass, or the moment they say \"and some entries have a TTL\".</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Now make it least-frequently-used. How much of your code changes?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One new class and one builder line; <code>PolicyCache</code> is never opened. The class keeps a use count per key and a bucket of keys per count, remembers the smallest non-empty count, and hands back the first key of that bucket, so an eviction is a lookup and never a scan for a minimum; the bucket bookkeeping is taken apart line by line on <a href=\"lru-workbench.html\">the LRU cache page</a>. What to say out loud here is the seam rather than the buckets. The same access trace through <code>FifoPolicy</code>, <code>LruPolicy</code>, <code>LfuPolicy</code> and <code>TtlPolicy</code> gives up A, B, C and D &mdash; four rules, four victims, identical calls &mdash; and <code>Main</code> prints exactly that. Test 1 asserts that all four answers differ, which is the only way to prove the rule is really pluggable and not decoration.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Least frequently used, in O(1): keys are bucketed by use count and the coldest non-empty bucket is\n * remembered, so nothing is ever sorted or scanned. Inside a bucket a LinkedHashSet keeps equally cold keys\n * in arrival order, so the oldest of the coldest goes first.\n */\nfinal class LfuPolicy&lt;K&gt; implements EvictionPolicy&lt;K&gt; {\n    private final Map&lt;K, Integer&gt; useCount = new HashMap&lt;&gt;();\n    private final Map&lt;Integer, LinkedHashSet&lt;K&gt;&gt; buckets = new HashMap&lt;&gt;();\n    private int minCount = 1;\n\n    /** A new key starts at one use; a rewrite counts as another use. */\n    public void onPut(K key, long nowMs, long expiresAtMs) {\n        if (useCount.containsKey(key)) { bump(key); return; }\n        useCount.put(key, 1);\n        buckets.computeIfAbsent(1, c -&gt; new LinkedHashSet&lt;&gt;()).add(key);\n        minCount = 1;                                          // a newcomer is always in the coldest bucket\n    }\n    /** A read moves the key one bucket up: two set operations, never a sort. */\n    public void onGet(K key, long nowMs) { bump(key); }\n    /** Drops the key and, if that emptied the coldest bucket, finds the new coldest. */\n    public void onRemove(K key) {\n        Integer c = useCount.remove(key);\n        if (c == null) return;\n        LinkedHashSet&lt;K&gt; b = buckets.get(c);\n        if (b == null) return;\n        b.remove(key);\n        if (b.isEmpty()) { buckets.remove(c); if (c == minCount) recomputeMin(); }\n    }\n    /** The first key of the coldest bucket: fewest uses, and among those, the one that arrived first. */\n    public K selectVictim(long nowMs) {\n        LinkedHashSet&lt;K&gt; b = buckets.get(minCount);\n        if (b == null || b.isEmpty()) { recomputeMin(); b = buckets.get(minCount); }\n        return (b == null || b.isEmpty()) ? null : b.iterator().next();\n    }\n    /** Keys currently counted. */\n    public int trackedKeys() { return useCount.size(); }\n    /** How many times this key has been used; -1 if the policy has never seen it. */\n    int useCountOf(K key) { return useCount.getOrDefault(key, -1); }\n    public String name() { return &quot;LFU&quot;; }\n\n    private void bump(K key) {\n        Integer c = useCount.get(key);\n        if (c == null) return;\n        LinkedHashSet&lt;K&gt; from = buckets.get(c);\n        if (from != null) {\n            from.remove(key);\n            if (from.isEmpty()) { buckets.remove(c); if (c == minCount) minCount = c + 1; }\n        }\n        useCount.put(key, c + 1);\n        buckets.computeIfAbsent(c + 1, x -&gt; new LinkedHashSet&lt;&gt;()).add(key);\n    }\n    // Only reached when an explicit remove emptied the coldest bucket. Bounded by the number of DISTINCT use\n    // counts present, not by the number of keys, and never touched on the eviction path.\n    private void recomputeMin() { minCount = buckets.isEmpty() ? 1 : Collections.min(buckets.keySet()); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>2 &middot; I want a TTL, but on top of whatever policy I already chose, not instead of it.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>That is a Decorator over the policy, not a fifth policy. ExpiryFirst wraps any rule and keeps its own index of deadlines; when it is asked for a victim it hands back a key that is already dead if there is one, and otherwise delegates to the wrapped rule, so ExpiryFirst(LRU), ExpiryFirst(LFU) and ExpiryFirst(FIFO) all exist and behave exactly like the rule they wrap while everything is alive. Entries with no deadline are not indexed at all, so wrapping a cache that uses no TTLs costs nothing. Keep this separate from expiry itself: expiry is the question \"may I return this?\", it is never optional, and it lives in the cache on the read path.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * TTL as a wrapper over any other rule: if something in the cache is already dead, that goes first;\n * otherwise the wrapped rule decides. Decorator, and the reason TTL is not a fifth policy you must choose\n * instead of LRU -- ExpiryFirst(LRU), ExpiryFirst(LFU) and ExpiryFirst(FIFO) all exist. Entries with no\n * deadline are not indexed at all, so wrapping a cache that uses no TTLs costs nothing.\n */\nfinal class ExpiryFirst&lt;K&gt; implements EvictionPolicy&lt;K&gt; {\n    private final EvictionPolicy&lt;K&gt; inner;\n    private final DeadlineIndex&lt;K&gt; deadlines = new DeadlineIndex&lt;&gt;(false);\n    /** Wraps any policy; the wrapped object is handed in, never built here. */\n    ExpiryFirst(EvictionPolicy&lt;K&gt; inner) { this.inner = Objects.requireNonNull(inner); }\n    /** Records the deadline, then lets the wrapped rule do its own bookkeeping. */\n    public void onPut(K key, long nowMs, long expiresAtMs) { deadlines.put(key, expiresAtMs); inner.onPut(key, nowMs, expiresAtMs); }\n    /** A read does not extend a deadline, but it may still matter to the wrapped rule. */\n    public void onGet(K key, long nowMs) { inner.onGet(key, nowMs); }\n    /** Both indexes must drop the key, or one of them leaks. */\n    public void onRemove(K key) { deadlines.remove(key); inner.onRemove(key); }\n    /** A corpse if there is one, otherwise whoever the wrapped rule names. */\n    public K selectVictim(long nowMs) {\n        K dead = deadlines.earliestIfDue(nowMs);\n        return dead != null ? dead : inner.selectVictim(nowMs);\n    }\n    /** The wrapped rule is the one holding every key. */\n    public int trackedKeys() { return inner.trackedKeys(); }\n    public String name() { return &quot;ExpiryFirst(&quot; + inner.name() + &quot;)&quot;; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>3 &middot; Swap the eviction policy while the cache is serving traffic.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Under the same lock, every live key is handed to the new policy as a fresh insert, then the field is swapped. No entry is lost and no reader ever sees a cache without a rule. What does not survive is the ranking: the new policy starts with no history, so recency counts and use counts are gone and the first eviction after a swap follows the order the keys were re-indexed in. That is why the table is a LinkedHashMap &mdash; not to make it an LRU cache, but so the re-index order is deterministic and the behaviour is testable. Say the trade out loud rather than pretending the history carries across; the test asserts exactly this.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Swaps the rule at runtime and returns the old one. Every live key is handed to the new policy as a\n     * fresh insert under the same lock, so no entry is lost and no reader ever sees a cache without a rule.\n     * What does not survive is the ranking: the new policy starts with no history. That is the honest trade,\n     * and it is better said out loud than papered over by pretending recency counts carry across.\n     */\n    EvictionPolicy&lt;K&gt; setPolicy(EvictionPolicy&lt;K&gt; next) {\n        Objects.requireNonNull(next, &quot;policy&quot;);\n        long now = clock.nowMs();\n        lock.lock();\n        try {\n            EvictionPolicy&lt;K&gt; old = policy;\n            for (Map.Entry&lt;K, CacheEntry&lt;V&gt;&gt; en : table.entrySet())\n                next.onPut(en.getKey(), now, en.getValue().expiresAtMs);\n            policy = next;\n            return old;\n        } finally {\n            lock.unlock();\n        }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>4 &middot; Under LRU I cannot see any difference between evicting first and inserting first. Why is the order a decision?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Under LRU there is no difference, which is exactly why this bug ships. Under LFU there is: a newcomer arrives at a use count of one, which makes it the coldest key in the cache the instant it is written, so an insert-then-evict cache picks the key it has just inserted and takes it straight back out. The put silently does nothing, the cache never fills, and nobody finds out until the second policy is plugged in. So the order is: evict while the table is at capacity, and only then write &mdash; which also means the count never goes one over the bound, not even for an instant in the middle of a put. It is a <code>while</code> and not an <code>if</code> for two reasons: one heavy value in a byte-bounded cache has to push out several small ones, and a policy that names a key the table never had has that key dropped from the policy as well and the loop tries again, so drift can never wedge a put. Test 2 is the proof under LFU: three keys, two of them read twice, a fourth put in, and d is resident while c is gone.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Stores a value that dies ttlMs from now (a ttlMs of zero or less means never). The order IS the design: work\n     * the deadline outside the lock; take the lock; evict BEFORE admitting, because under LFU a newcomer\n     * arrives at one use, is instantly the coldest key, and would otherwise evict itself; write the entry;\n     * unlock; only then tell the listeners.\n     */\n    public void put(K key, V value, long ttlMs) {\n        Objects.requireNonNull(key, &quot;key&quot;);\n        Objects.requireNonNull(value, &quot;null value: null is how this cache reports a miss&quot;);\n        long now = clock.nowMs();\n        long expiresAt = ttlMs &lt;= 0 ? Long.MAX_VALUE : now + ttlMs;\n        List&lt;Removal&lt;K, V&gt;&gt; pending = new ArrayList&lt;&gt;(2);\n        int evicted = 0, expired = 0;\n        lock.lock();\n        try {\n            CacheEntry&lt;V&gt; old = table.get(key);\n            if (old != null) {                                  // a rewrite: the count does not grow\n                table.put(key, new CacheEntry&lt;&gt;(value, now, expiresAt));\n                policy.onPut(key, now, expiresAt);\n                pending.add(new Removal&lt;&gt;(key, old.value, RemovalCause.REPLACED));\n            } else {\n                while (table.size() &gt;= capacity) {              // evict first, admit second\n                    K victim = policy.selectVictim(now);\n                    if (victim == null) break;                  // a policy holding nothing has nothing to give\n                    CacheEntry&lt;V&gt; gone = table.remove(victim);\n                    policy.onRemove(victim);                    // both indexes drop it, or the policy leaks\n                    if (gone == null) continue;                 // the policy named a key the table never had\n                    boolean wasDead = gone.expired(now);\n                    pending.add(new Removal&lt;&gt;(victim, gone.value,\n                            wasDead ? RemovalCause.EXPIRED : RemovalCause.CAPACITY));\n                    if (wasDead) expired++; else evicted++;\n                }\n                table.put(key, new CacheEntry&lt;&gt;(value, now, expiresAt));\n                policy.onPut(key, now, expiresAt);\n            }\n        } finally {\n            lock.unlock();\n        }\n        if (evicted &gt; 0) evictions.addAndGet(evicted);\n        if (expired &gt; 0) expirations.addAndGet(expired);\n        fire(pending);\n    }\n\n        // 2. evict BEFORE admitting. Under LRU both orders look identical; under LFU a newcomer arrives at one\n        //    use, is instantly the coldest key, and an insert-then-evict cache would have it evict itself.\n        PolicyCache&lt;String, String&gt; lfuCache = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(3).policy(new LfuPolicy&lt;&gt;()).clock(clock).build();\n        lfuCache.put(&quot;a&quot;, &quot;1&quot;); lfuCache.put(&quot;b&quot;, &quot;2&quot;); lfuCache.put(&quot;c&quot;, &quot;3&quot;);\n        lfuCache.getIfPresent(&quot;a&quot;); lfuCache.getIfPresent(&quot;b&quot;);        // a and b are at two uses, c at one\n        lfuCache.put(&quot;d&quot;, &quot;4&quot;);\n        check(lfuCache.keys().contains(&quot;d&quot;), &quot;the newcomer is in the cache: it did not evict itself&quot;);\n        check(!lfuCache.keys().contains(&quot;c&quot;), &quot;the coldest existing key (c) is the one that went&quot;);\n        check(lfuCache.size() == 3, &quot;size is still exactly the capacity&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>5 &middot; Fifty threads put into a full cache at the same instant. Prove the bound holds, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives in the gap between asking the policy who should go and actually removing that key. The sequence in the card above &mdash; the rewrite check, the eviction loop, the write and the policy update &mdash; runs inside one lock, so no other writer can ever be in that gap. The proof is two assertions rather than a count: fifty threads wait on one latch, run twenty thousand mixed operations against a cache of a hundred, and the test checks the size was never observed above the capacity and that afterwards the policy is tracking exactly as many keys as the table holds. That second check is the one that catches the real bug, because a policy that leaks keys still looks fine from outside until the day it names a key that is not there and nothing gets evicted at all.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 3. fifty threads on one cache: the size bound must hold at every instant, and the table and the\n        //    policy must still name the same keys afterwards. Drift here means evicting a key that is not\n        //    there (so nothing goes and the cache grows forever) or one that is (so the policy leaks).\n        PolicyCache&lt;Integer, Integer&gt; hot = CacheBuilder.&lt;Integer, Integer&gt;newBuilder()\n                .capacity(100).policy(new LruPolicy&lt;&gt;()).build();\n        AtomicLong overflow = new AtomicLong();\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; all = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; 50; t++) {\n            final int seed = t;\n            all.add(pool.submit(() -&gt; {\n                go.await();\n                Random rnd = new Random(seed);\n                for (int i = 0; i &lt; 400; i++) {\n                    int k = rnd.nextInt(500);\n                    if ((i &amp; 3) == 0) hot.put(k, k); else hot.getIfPresent(k);\n                    if (hot.size() &gt; hot.capacity()) overflow.incrementAndGet();\n                }\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : all) f.get();\n        pool.shutdown();\n        check(overflow.get() == 0, &quot;20000 concurrent operations: the cache was never over capacity&quot;);\n        check(hot.size() == 100, &quot;the cache is exactly full afterwards, not 99 and not 101&quot;);\n        check(hot.consistent(), &quot;the table and the policy track exactly the same number of keys&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>6 &middot; One lock over the table AND the policy. Have you just serialised the cache?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>For a while, yes, and this is the one design here where the honest answer is arithmetic rather than reassurance. The critical section is a hash lookup plus the policy's bookkeeping, about a hundred nanoseconds. A permissions cache at a hundred thousand gets a second spends one per cent of each second inside it; at a million a second it is ten per cent; at ten million a second one lock is the bottleneck, and the deadline-ordered policy at about a microsecond an operation gets there ten times sooner. A read-write lock buys nothing, because a read mutates the ranking. The ladder: keep the loader and the listener outside the lock, which this code already does; stripe into sixteen segments by spread hash for roughly sixteen times the throughput, at the price of a per-stripe bound and an approximate order; then buffer read events in a ring and replay them under tryLock, which is what Caffeine ships; then leave the process.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: striping -- the profiler says threads are queueing on your one lock\n/**\n * N independent caches behind one Cache, chosen by a spread hash of the key. Callers change nothing;\n * throughput goes up roughly N times because unrelated keys no longer share a lock. The price: eviction is\n * now per stripe, so the bound is per stripe too and the recency order is approximate across the whole cache.\n */\nfinal class StripedCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final List&lt;PolicyCache&lt;K, V&gt;&gt; segments = new ArrayList&lt;&gt;();\n\n    /** Splits the capacity evenly; each stripe gets its OWN policy instance, never a shared one. */\n    StripedCache(int stripes, int totalCapacity, Supplier&lt;EvictionPolicy&lt;K&gt;&gt; policyPerStripe, Clock clock) {\n        int per = Math.max(1, totalCapacity / stripes);\n        for (int i = 0; i &lt; stripes; i++)\n            segments.add(new PolicyCache&lt;&gt;(per, policyPerStripe.get(), clock, 0));\n    }\n\n    // The same bit-spreading HashMap uses: raw hashCodes clump, and a clumped hash means one hot stripe.\n    private PolicyCache&lt;K, V&gt; segmentFor(K key) {\n        int h = key.hashCode();\n        h ^= (h &gt;&gt;&gt; 16);\n        return segments.get((h &amp; 0x7fffffff) % segments.size());\n    }\n\n    /** Reads from the one stripe that could hold this key. */\n    public V getIfPresent(K key) { return segmentFor(key).getIfPresent(key); }\n    /** Writes into the one stripe that owns this key. */\n    public void put(K key, V value) { segmentFor(key).put(key, value); }\n    /** Writes into the one stripe that owns this key. */\n    public void put(K key, V value, long ttlMs) { segmentFor(key).put(key, value, ttlMs); }\n    /** Removes from the one stripe that owns this key. */\n    public V remove(K key) { return segmentFor(key).remove(key); }\n    /** The total across stripes; no lock spans them, so it is a sum of snapshots. */\n    public int size() { int n = 0; for (PolicyCache&lt;K, V&gt; s : segments) n += s.size(); return n; }\n    /** The sum of the per-stripe bounds. */\n    public int capacity() { int n = 0; for (PolicyCache&lt;K, V&gt; s : segments) n += s.capacity(); return n; }\n    /** Sweeps every stripe. */\n    public void cleanUp() { for (PolicyCache&lt;K, V&gt; s : segments) s.cleanUp(); }\n    /** Adds the stripes&#x27; counters together. */\n    public CacheStats stats() {\n        long h = 0, m = 0, e = 0, x = 0;\n        for (PolicyCache&lt;K, V&gt; s : segments) {\n            CacheStats t = s.stats();\n            h += t.hits(); m += t.misses(); e += t.evictions(); x += t.expirations();\n        }\n        return new CacheStats(h, m, e, x);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; Somebody&#x27;s removal listener throws. Another one calls straight back into the cache.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Neither can hurt the cache, because no listener runs while the lock is held. Departures are collected into a small local list inside the critical section and delivered after the unlock, each call wrapped in its own try/catch, so a listener that throws does not stop the put that caused it and does not stop the next listener either. A listener that calls back into the cache simply takes the lock again on its own, with no risk of mutating the table midway through an eviction. The same rule is why a listener may do I/O: closing a pooled connection on evict is the normal use of this hook, and it would freeze every other thread from inside the lock.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    // A listener is caller code: it may do I/O, throw, or call straight back into this cache. All three are\n    // safe out here and none of them are safe inside the lock, so departures are collected under the lock and\n    // delivered once it is gone.\n    private void fire(List&lt;Removal&lt;K, V&gt;&gt; pending) {\n        if (pending.isEmpty() || listeners.isEmpty()) return;\n        for (Removal&lt;K, V&gt; r : pending)\n            for (RemovalListener&lt;K, V&gt; l : listeners)\n                try { l.onRemoval(r.key(), r.value(), r.cause()); }\n                catch (RuntimeException ignored) { /* a broken listener is the listener&#x27;s problem */ }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>8 &middot; A user asks why their session disappeared. What can you tell them?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly which of four things happened, because every removal carries a cause. EXPLICIT means somebody called remove. REPLACED means a new value was written over the same key, and the listener gets the old value, which is what a write-back store needs. EXPIRED means the clock passed the deadline, and that can happen in a cache that is two per cent full. CAPACITY means the cache was full and the policy chose this key, which can happen to an entry written a second ago. Those are four different bugs: a flood of CAPACITY says the cache is too small, a flood of EXPIRED says the TTL is too short, and a listener told only the key cannot tell them apart.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 5. &quot;why did my session disappear?&quot; -- four ways out, four causes. A listener that is only told the\n        //    key cannot tell a capacity bug from an expiry bug, and those are different bugs.\n        Map&lt;String, RemovalCause&gt; why = new LinkedHashMap&lt;&gt;();\n        clock.setTo(0);\n        PolicyCache&lt;String, String&gt; causeCache = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(2).policy(new FifoPolicy&lt;&gt;()).clock(clock)\n                .listener((k, v, cause) -&gt; why.put(k + &quot;=&quot; + v, cause)).build();\n        causeCache.put(&quot;explicit&quot;, &quot;v1&quot;);\n        causeCache.remove(&quot;explicit&quot;);\n        causeCache.put(&quot;replaced&quot;, &quot;old&quot;);\n        causeCache.put(&quot;replaced&quot;, &quot;new&quot;);\n        causeCache.put(&quot;dies&quot;, &quot;v2&quot;, 1_000);\n        clock.advance(2_000);\n        causeCache.getIfPresent(&quot;dies&quot;);\n        causeCache.put(&quot;x&quot;, &quot;v3&quot;); causeCache.put(&quot;y&quot;, &quot;v4&quot;); causeCache.put(&quot;z&quot;, &quot;v5&quot;);   // pushes one out\n        check(why.get(&quot;explicit=v1&quot;) == RemovalCause.EXPLICIT, &quot;remove(key) reports EXPLICIT&quot;);\n        check(why.get(&quot;replaced=old&quot;) == RemovalCause.REPLACED, &quot;a rewrite reports REPLACED, with the OLD value&quot;);\n        check(why.get(&quot;dies=v2&quot;) == RemovalCause.EXPIRED, &quot;a read past the deadline reports EXPIRED&quot;);\n        check(why.containsValue(RemovalCause.CAPACITY), &quot;the policy&#x27;s victim reports CAPACITY&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; Reads come out of the cache. Do writes go through it to the database?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two answers, and <code>PolicyCache</code> changes in neither. Write-through is a wrapper that writes the store first and the cache second, so a store that throws never leaves behind a cached value nobody persisted &mdash; the same ordering rule as move 6 &mdash; and the price is that every put pays the database's millisecond on the caller's thread. Write-back is a <code>RemovalListener</code> and nothing else: no new field, no new lock, and the <i>cause</i> is the whole logic. CAPACITY and EXPIRED carry the newest value out of memory, so not writing it loses the write; REPLACED hands back a value that a newer one has already superseded, so writing it is pure waste; EXPLICIT is the caller saying forget this. Name the cost before they do: the flush runs after the unlock, so a crash in that window loses the write, which is why real write-back caches also flush everything still dirty on a timer. On the read side <code>LoadingCache</code> in Extensions.java loads on a miss and elects one loader per key, so six threads missing the same key do not become six queries; that stampede is derived in full on <a href=\"mt-ttl-cache-workbench.html\">the TTL cache page</a>.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: writes -- does a put reach the database, and when?\n/** The durable side of a write: where a value lives once the cache lets go of it. One method, handed in. */\ninterface WriteStore&lt;K, V&gt; {\n    /** Persists one key. Called with NO cache lock held, so it may take a millisecond of database. */\n    void write(K key, V value);\n}\n\n/**\n * Write-through: the store is written BEFORE the cache, so a failed write never becomes a cached lie and the\n * store is never behind the cache. The price is that every put pays the store&#x27;s latency on the caller&#x27;s\n * thread, so a write-through cache speeds up reads only. This is the same ordering rule as move 6 -- commit\n * nothing until the irreversible thing has succeeded -- and it is a wrapper, so PolicyCache still has no idea\n * what a database is.\n */\nfinal class WriteThroughCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final Cache&lt;K, V&gt; inner;\n    private final WriteStore&lt;K, V&gt; store;\n\n    /** Wraps any cache, including a striped one. */\n    WriteThroughCache(Cache&lt;K, V&gt; inner, WriteStore&lt;K, V&gt; store) { this.inner = inner; this.store = store; }\n\n    /** Store first, cache second: if the store throws, nothing was cached and the caller can retry. */\n    public void put(K key, V value) { store.write(key, value); inner.put(key, value); }\n    /** Store first, cache second, with a deadline. */\n    public void put(K key, V value, long ttlMs) { store.write(key, value); inner.put(key, value, ttlMs); }\n    /** Delegates: reads never touch the store. */\n    public V getIfPresent(K key) { return inner.getIfPresent(key); }\n    /** Delegates. */\n    public V remove(K key) { return inner.remove(key); }\n    /** Delegates. */\n    public int size() { return inner.size(); }\n    /** Delegates. */\n    public int capacity() { return inner.capacity(); }\n    /** Delegates. */\n    public void cleanUp() { inner.cleanUp(); }\n    /** Delegates. */\n    public CacheStats stats() { return inner.stats(); }\n}\n\n/**\n * Write-back (write-behind): a put touches only the cache, and the value reaches the store when the entry\n * leaves. That is a RemovalListener and nothing else -- no new field on the cache, no new lock. The CAUSE is\n * the whole logic, which is the clearest payoff of having four causes instead of a boolean:\n * CAPACITY and EXPIRED carry the newest value out of memory, so not writing it loses the write;\n * REPLACED hands back a value that a newer one has already superseded, and writing it is pure waste;\n * EXPLICIT is the caller saying forget this, which is not a request to persist it.\n * The honest cost: the flush happens after the unlock, so a crash in that window loses the write. Real\n * write-back caches pair this with a periodic flush of everything still dirty.\n */\nfinal class WriteBackListener&lt;K, V&gt; implements RemovalListener&lt;K, V&gt; {\n    private final WriteStore&lt;K, V&gt; store;\n    private final AtomicLong flushes = new AtomicLong();\n\n    /** Hand it the store; hand it to the cache with builder.listener(...). */\n    WriteBackListener(WriteStore&lt;K, V&gt; store) { this.store = store; }\n\n    /** Writes back only the two causes that carry a live value out of memory. */\n    public void onRemoval(K key, V value, RemovalCause cause) {\n        if (cause == RemovalCause.CAPACITY || cause == RemovalCause.EXPIRED) {\n            store.write(key, value);\n            flushes.incrementAndGet();\n        }\n    }\n\n    /** How many entries have been written back so far. */\n    long flushes() { return flushes.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Capacity in bytes, not entries. A 2 MB value and a 2 KB value are not the same thing.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A one-method Weigher is handed in, the cache tracks a running total, and the single \"is it full?\" check becomes a loop, because one heavy value can push out several small ones. The policies are untouched: weight is a bound, not a ranking, and nothing about who-goes-next changes. The trap worth naming is the entry heavier than the whole budget: without an explicit refusal the loop evicts everything, still does not fit, and the cache ends up empty and useless. In production the weigher is where the bugs live, because measuring a Java object's real size is guesswork and an under-count means the budget quietly does not hold.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: capacity in bytes -- a 2 MB value and a 2 KB value are not the same thing\n/** How heavy an entry is. One method, handed in, so the cache never guesses at sizes. */\ninterface Weigher&lt;K, V&gt; {\n    /** The cost of holding this entry, in whatever unit the budget is written in. */\n    int weigh(K key, V value);\n}\n\n/**\n * The same cache bounded by total weight instead of entry count. Two changes, both small: the single &quot;is it\n * full?&quot; check becomes a LOOP, because one heavy value can push out several small ones, and an entry heavier\n * than the whole budget is refused outright -- otherwise it empties the cache and still does not fit.\n * The policies are untouched: weight is a bound, not a ranking.\n */\nfinal class ByteBoundedCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final long maxWeight;\n    private final Weigher&lt;K, V&gt; weigher;\n    private final Map&lt;K, CacheEntry&lt;V&gt;&gt; table = new LinkedHashMap&lt;&gt;();\n    private final Map&lt;K, Integer&gt; weightOf = new HashMap&lt;&gt;();\n    private final EvictionPolicy&lt;K&gt; policy;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Clock clock;\n    private final AtomicLong hits = new AtomicLong(), misses = new AtomicLong(), evictions = new AtomicLong();\n    private long totalWeight;\n\n    /** maxWeight is the budget, in the weigher&#x27;s unit; the policy still decides who goes. */\n    ByteBoundedCache(long maxWeight, Weigher&lt;K, V&gt; weigher, EvictionPolicy&lt;K&gt; policy, Clock clock) {\n        this.maxWeight = maxWeight; this.weigher = weigher; this.policy = policy; this.clock = clock;\n    }\n\n    /** The value, or null. Same read path as PolicyCache, minus the expiry branch for brevity. */\n    public V getIfPresent(K key) {\n        lock.lock();\n        try {\n            CacheEntry&lt;V&gt; e = table.get(key);\n            if (e == null || e.expired(clock.nowMs())) { misses.incrementAndGet(); return null; }\n            policy.onGet(key, clock.nowMs());\n            hits.incrementAndGet();\n            return e.value;\n        } finally { lock.unlock(); }\n    }\n    /** Stores a value with no deadline. */\n    public void put(K key, V value) { put(key, value, 0); }\n    /** Stores a value, evicting as many entries as it takes to fit the new one inside the budget. */\n    public void put(K key, V value, long ttlMs) {\n        int w = weigher.weigh(key, value);\n        if (w &gt; maxWeight) return;                             // refuse: it would empty the cache and still not fit\n        long now = clock.nowMs();\n        lock.lock();\n        try {\n            if (table.containsKey(key)) { totalWeight -= weightOf.remove(key); table.remove(key); policy.onRemove(key); }\n            while (totalWeight + w &gt; maxWeight) {               // a LOOP, not an if\n                K victim = policy.selectVictim(now);\n                if (victim == null) break;\n                table.remove(victim);\n                policy.onRemove(victim);\n                Integer vw = weightOf.remove(victim);\n                if (vw != null) totalWeight -= vw;\n                evictions.incrementAndGet();\n            }\n            table.put(key, new CacheEntry&lt;&gt;(value, now, ttlMs &lt;= 0 ? Long.MAX_VALUE : now + ttlMs));\n            weightOf.put(key, w);\n            totalWeight += w;\n            policy.onPut(key, now, ttlMs &lt;= 0 ? Long.MAX_VALUE : now + ttlMs);\n        } finally { lock.unlock(); }\n    }\n    /** Removes a key and gives back its weight. */\n    public V remove(K key) {\n        lock.lock();\n        try {\n            CacheEntry&lt;V&gt; e = table.remove(key);\n            if (e == null) return null;\n            policy.onRemove(key);\n            Integer w = weightOf.remove(key);\n            if (w != null) totalWeight -= w;\n            return e.value;\n        } finally { lock.unlock(); }\n    }\n    /** Entries resident. */\n    public int size() { lock.lock(); try { return table.size(); } finally { lock.unlock(); } }\n    /** This cache is bounded by weight, not by entry count, so there is no entry bound to report. */\n    public int capacity() { return Integer.MAX_VALUE; }\n    /** Bytes held right now: the number the bound is actually about. */\n    long weight() { lock.lock(); try { return totalWeight; } finally { lock.unlock(); } }\n    /** Drops dead entries. */\n    public void cleanUp() {\n        lock.lock();\n        try {\n            long now = clock.nowMs();\n            for (Iterator&lt;Map.Entry&lt;K, CacheEntry&lt;V&gt;&gt;&gt; it = table.entrySet().iterator(); it.hasNext(); ) {\n                Map.Entry&lt;K, CacheEntry&lt;V&gt;&gt; en = it.next();\n                if (en.getValue().expired(now)) {\n                    it.remove(); policy.onRemove(en.getKey());\n                    Integer w = weightOf.remove(en.getKey());\n                    if (w != null) totalWeight -= w;\n                }\n            }\n        } finally { lock.unlock(); }\n    }\n    /** Hits, misses and evictions. */\n    public CacheStats stats() { return new CacheStats(hits.get(), misses.get(), evictions.get(), 0); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; A nightly report scans every row and wrecks your hit rate. And Redis keeps no linked list at all, it samples.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both answers are the same shape, which is the whole point: a new policy class, and nothing in the cache moves. Scan resistance is <code>SegmentedLruPolicy</code> &mdash; a probation list and a protected list, a second read promotes a key into protected, and victims come from probation first, so a one-pass scan walks in and straight back out. The demo replays the identical trace through both rules: plain LRU loses all eight hot keys to a two-hundred-key scan, segmented LRU keeps all eight. Sampling is the other class, <code>SampledLruPolicy</code>: a dense array of keys and a tick per key, look at five at random and evict the coldest you saw, with removal swapping the last key into the hole so it stays O(1). It is deliberately wrong some of the time &mdash; Redis's trade &mdash; and how often is worked out on <a href=\"lru-workbench.html\">the LRU cache page</a>. TinyLFU puts an admission filter in front of the same idea, a count-min sketch that refuses one-hit wonders; that is what Caffeine ships, and naming it is the senior answer here.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: scan resistance -- a nightly report reads every row and destroys the hit rate. A NEW class.\n/**\n * Segmented LRU: two lists. A key enters PROBATION; a second read promotes it to P

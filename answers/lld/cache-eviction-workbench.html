anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every removal path calls onRemove; test 3: both track the same count</text></g><g transform=\"translate(30 102)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an expired entry is still handed back</text></g><path d=\"M370 121 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 102)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check the deadline on every read, and inject the clock; test 4: 24 hours in zero ms</text></g><g transform=\"translate(30 144)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a listener throws, or calls back in</text></g><path d=\"M370 163 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 144)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">drain after the unlock in a try/catch; test 8: both are harmless</text></g><g transform=\"translate(30 186)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the listener is told only the key</text></g><path d=\"M370 205 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 186)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a cause on every removal; tests 5 and 10: four causes, and write-back flushes two</text></g><g transform=\"translate(30 228)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">swapping the rule empties the cache</text></g><path d=\"M370 247 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 228)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">re-index the live keys under the same lock; test 7: all three survive</text></g><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a failure test: FailureTests.java runs ten of them, forty checks, and must print ALL PASS</text></svg></div><div class=\"move\"><p>Inserting before evicting (invisible under LRU, and under LFU the newcomer evicts itself). A removal that drops a key from the table but not from the policy (the policy then names a ghost, nothing is evicted, and the bound fails silently). An expired entry handed back because only a sweeper ever checked the deadline, so the read path must check it too and drop it there &mdash; and that test is written against an injected clock, because <code>Thread.sleep(1100)</code> is slow, flaky, and cannot test a twenty-four-hour TTL at all. A listener that throws, does I/O, or calls straight back into the cache (all three are safe only because listeners run after the unlock). A listener told only the key, so nobody can tell a capacity bug from an expiry bug &mdash; and a write-back store hung on that same hook would then flush the wrong things. And swapping the policy at runtime throwing away the entries, when it should only throw away the ranking. Each of these is a few lines in FailureTests.java: ten numbered blocks, forty checks, and it must print ALL PASS.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"830\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface EvictionPolicy&lt;K&gt; { ... K selectVictim(long nowMs); }</text><text x=\"830\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a fifth rule is a new file, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">new ExpiryFirst&lt;&gt;(new LruPolicy&lt;&gt;())</text><text x=\"830\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">TTL on top of ANY rule, present or future</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"310\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">fire(pending) after the unlock, each call in a try/catch</text><text x=\"830\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">a metric hears; the cache never waits for it</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"220\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">RemovalCause: EXPLICIT / REPLACED / EXPIRED / CAPACITY</text><text x=\"830\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">\"why did my session go?\" has an answer</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Builder</text><text x=\"220\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">newBuilder().capacity(4).policy(p).clock(c).listener(l)</text><text x=\"830\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">six optional knobs, no constructor full of nulls</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Template Method</text><text x=\"220\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">the cache calls four policy methods; it owns none of their bodies</text><text x=\"830\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Strategy already did that job</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"220\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">a cache is handed to its callers; nothing calls getInstance()</text><text x=\"830\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh one per check</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"220\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">the builder's single default (LRU) IS the whole registry</text><text x=\"830\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when rules arrive as config strings</text><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>Strategy is move 3, and on this problem it is the whole point rather than a flourish: the rule is not a flag on the cache, it is an object the cache is handed, so \"now make it LFU\" is a new file and one builder line. Decorator is the same move twice over &mdash; <code>ExpiryFirst</code> wraps a policy and adds \"the dead go first\" to any rule at all, and <code>LoadingCache</code>, <code>StripedCache</code> and the byte-bounded cache all wrap a <code>Cache</code> rather than editing one. Observer is move 4's rule that caller code must not run inside the lock. State is move 6: an entry's life written down, which is what makes the cause on the callback four values instead of a boolean. Builder earns its place here for the same reason it does in Guava and Caffeine &mdash; capacity, policy, clock, TTL and listeners are six optional knobs, and a six-argument constructor full of nulls is worse than a chain of named calls. Template Method did not earn one: the cache calls four policy methods but owns none of their bodies, and Strategy already did that job. Singleton earned nothing: a cache is handed to its callers, so every test builds a fresh one. Factory is \"not yet\": the builder's single default is the entire registry today, and it grows a name the day policies arrive as strings from configuration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 266\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"435\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"545\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"435\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"545\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">PolicyCache stores and bounds; a policy ranks; CacheStats counts; a listener notifies</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"435\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"545\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">SegmentedLruPolicy is a new file; PolicyCache was never opened to add it</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"435\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"545\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">policy.selectVictim(now);  never \"is this the LFU one?\" -- even the approximate one substitutes</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces, so a fake is a lambda</text><text x=\"435\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"545\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">Clock, RemovalListener, CacheLoader: one method each; EvictionPolicy has four, the one blemish</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"435\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"545\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">new PolicyCache&lt;&gt;(cap, policy, clock, ttl) -- the string \"LruPolicy\" appears nowhere inside it</text><text x=\"615\" y=\"252\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>S: a class has one reason to change, which move 2 gave you &mdash; the cache stores and bounds, a policy ranks, <code>CacheStats</code> counts, a listener notifies, and nobody does two of those. O: a new behaviour is a new class and one changed line; <code>SegmentedLruPolicy</code> exists and <code>PolicyCache</code> was never opened to add it. L: any implementation drops in and nothing asks which one it got, and the interesting case is the approximate one &mdash; sampled LRU is substitutable because the contract is \"name a victim\", not \"name the mathematically coldest key\". I: <code>Clock</code>, <code>RemovalListener</code>, <code>CacheLoader</code> and <code>Weigher</code> have one method each, so a fake is a lambda; <code>EvictionPolicy</code> has four, and it carries a deadline that LRU and LFU throw away, which is the one honest blemish on this design &mdash; cheaper than splitting the interface, and worth naming before the interviewer does. D: the cache depends on interfaces it is handed, which is exactly why a test can give it a clock that says last Tuesday and a listener that throws.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">LFU, FIFO, segmented, sampled</text></g><path d=\"M370 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind EvictionPolicy plus one builder line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a metric, a write-back store</text></g><path d=\"M370 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more removal listener; the lock and the table do not move</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 132)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in an entry's life</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">loading, refreshing, invalidated</text></g><path d=\"M370 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more cause and one more checked transition</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across entries</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a budget in bytes, not a count</text></g><path d=\"M370 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the check AND the evictions inside the SAME lock, all or nothing</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">and the single if becomes a loop: one big value pushes out several small ones</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">Redis, or a second server</text></g><path d=\"M370 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the far store becomes the loader; a write publishes an invalidation</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">which node owns which key is consistent hashing, named and left out of scope</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 3 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five, PolicyCache, KeyList and the failure tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (LFU, FIFO, segmented, sampled, TinyLFU) is a new class behind <code>EvictionPolicy</code> plus one builder line. Someone new who wants to know (a metric, a write-back store that flushes on evict) is one more listener; the table and the lock do not move. A new step in an entry's life (loading, refreshing, invalidated) is one more cause and one more checked transition. A new invariant across entries (a budget in bytes rather than a count) is the check <i>and</i> the evictions inside the same lock, all or nothing, with the single <code>if</code> becoming a loop because one heavy value can push out several small ones. And state that must outlive the process (Redis in front of the database, or simply a second server) is the far store becoming the loader, and every write publishing an invalidation rather than a value, so two nodes can never disagree about which value is newest &mdash; they both go and read it again. For all five, <code>PolicyCache</code>, <code>KeyList</code> and the failure tests do not change; that is the test that the derivation was right. Page 05 has the code and the traps for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 1020\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M465.0 180L465.0 154\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M290 901.0L276 901L276 87L290 87.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M290 645 L276 645\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M290 769 L276 769\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M1215 785.0L1224 785L1224 79L1215 79.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1215 203 L1224 203\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M1215 313 L1224 313\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M1215 439 L1224 439\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M1215 565 L1224 565\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M1215 675 L1224 675\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><pat 1=\"48\" x2=\"250\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">coldest of five at random</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">Redis's trade</text></g><g transform=\"translate(965 740)\"><rect width=\"250\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SegmentedLruPolicy</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">probation / protected</text><line x1=\"0\" y1=\"48\" x2=\"250\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">a second read promotes</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">scans die in probation</text></g><g><path d=\"M20 990L64 990\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"994\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 990L284 990\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"994\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 990L504 990\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"994\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 990L684 990\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"994\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 990L904 990\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"994\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g><text x=\"1090\" y=\"152\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">handed in, never built here</text><text x=\"1090\" y=\"621\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">TtlPolicy owns one of these too</text><text x=\"800\" y=\"654\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">ExpiryFirst IS a policy, and WRAPS one</text><text x=\"800\" y=\"776\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">filled inside the lock, emptied after it</text><text x=\"1000\" y=\"994\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--acc2)\">ext = in Extensions.java</text><text x=\"243\" y=\"545\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--acc2)\">ext</text><text x=\"243\" y=\"619\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--acc2)\">ext</text><text x=\"633\" y=\"613\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--acc2)\">ext</text><text x=\"633\" y=\"729\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--acc2)\">ext</text><text x=\"633\" y=\"861\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--acc2)\">ext</text><text x=\"1208\" y=\"643\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--acc2)\">ext</text><text x=\"1208\" y=\"753\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--acc2)\">ext</text></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements &mdash; note the two buses, one down the left where three wrappers implement <code>Cache</code>, and one round the right where five rules implement <code>EvictionPolicy</code>. Filled diamond = owns: the cache owns every entry, and each rule owns whatever index it ranks with. Plain arrow = references. Dashed green = handed in. Dotted blue = notifies. <b>Where state lives:</b> the cache has the table, the lock, the clock, the listeners and the counters, and it is the only object that removes an entry; a policy has an index of keys and no values at all, which is why one lock covers both and why a policy needs no synchronisation of its own. Notice the two things that are <i>not</i> here. There is no LruCache and no LfuCache class &mdash; there is one cache and five rules, which is the whole difference between this page and <a href=\"lru-workbench.html\">the LRU cache page</a>. And there is no TtlCache: expiry lives on <code>CacheEntry</code> and is checked by the cache on every read, while <code>ExpiryFirst</code> is a rule that wraps another rule, which is why the same wrapper works over LRU, LFU and FIFO alike. <code>Removal</code>, the small record on the right, is what makes the listener safe: the cache fills a list of them <i>inside</i> the lock and empties it after, so a listener may be slow, may throw, or may call back in. Boxes tagged <code>ext</code> live in Extensions.java rather than Main.java; they are drawn because they are the proof that the two seams hold &mdash; each one is a new file and nothing else moved. Extensions.java holds a few more that are not drawn, for the same reason: the loader, the write-through wrapper, the invalidation bus.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does and what it guarantees; read only those first for the shape, then the bodies. Main.java is the whole system and its <code>main</code> runs one access trace through four rules, then the decorator, then a runtime policy swap, then a fifty-thread race. Each copy button copies that whole file for your IDE. Below it: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (ten claims, forty checks; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.AtomicLong;\nimport java.util.concurrent.locks.ReentrantLock;\n\n// A bounded in-memory cache whose eviction rule is a separate object. One cache class stores the entries,\n// bounds the size and enforces expiry; an EvictionPolicy answers exactly one question -- who leaves next --\n// and LRU, LFU, FIFO and shortest-fuse-first are four answers to it. &quot;May I still return this?&quot; is a\n// different question, decided by the clock alone, and it lives in the cache where it always applies.\n\n/**\n * Why an entry left the cache. Four causes are four different bugs when somebody asks &quot;where did my session\n * go?&quot;, which is the whole reason the listener is told the cause and not just the key.\n */\nenum RemovalCause {\n    /** A caller called remove(key). */\n    EXPLICIT,\n    /** A caller put a new value over the same key; the old value is gone. */\n    REPLACED,\n    /** The clock passed the entry&#x27;s deadline. Can happen in a cache that is 2% full. */\n    EXPIRED,\n    /** The cache was full and the policy named this key. Can happen to a perfectly fresh entry. */\n    CAPACITY\n}\n\n/** Where time comes from. Injected, so a test can prove a 24-hour TTL in zero milliseconds. */\ninterface Clock {\n    /** The current time in milliseconds. */\n    long nowMs();\n}\n\n/** The real clock: the only place in this design that reads the wall. */\nfinal class SystemClock implements Clock {\n    /** Reads the wall clock. */\n    public long nowMs() { return System.currentTimeMillis(); }\n}\n\n/** A clock a test drives by hand: no sleeping, no flakiness, and a 24-hour TTL takes a microsecond. */\nfinal class ManualClock implements Clock {\n    private long now;\n    /** Starts the clock at a chosen instant. */\n    ManualClock(long startMs) { this.now = startMs; }\n    /** The instant this clock was last set or advanced to. */\n    public long nowMs() { return now; }\n    /** Moves time forward by the given number of milliseconds. */\n    void advance(long ms) { now += ms; }\n    /** Jumps to an absolute instant, so the same trace can be replayed from t = 0. */\n    void setTo(long ms) { now = ms; }\n}\n\n/** Somebody who wants to be told when an entry leaves, and why. Always called after the lock is released. */\ninterface RemovalListener&lt;K, V&gt; {\n    /** Told once per departed entry, with the value it held and the reason it went. */\n    void onRemoval(K key, V value, RemovalCause cause);\n}\n\n/** One departure, recorded inside the lock and delivered after it. */\nrecord Removal&lt;K, V&gt;(K key, V value, RemovalCause cause) { }\n\n/** Counters for the four things anybody ever asks a cache. Approximate under load, deliberately. */\nrecord CacheStats(long hits, long misses, long evictions, long expirations) {\n    /** Hits as a fraction of all lookups; zero when nothing has been asked for yet. */\n    double hitRate() { long n = hits + misses; return n == 0 ? 0.0 : (double) hits / n; }\n    /** A one-line summary for a log or a demo. */\n    public String toString() {\n        return String.format(&quot;hits=%d misses=%d evictions=%d expirations=%d hitRate=%.2f&quot;,\n                             hits, misses, evictions, expirations, hitRate());\n    }\n}\n\n/** One stored value with its deadline. The cache owns these; they are never handed to a caller. */\nfinal class CacheEntry&lt;V&gt; {\n    final V value;\n    final long writtenAtMs;\n    /** The instant from which this entry may not be returned; Long.MAX_VALUE means &quot;never dies&quot;. */\n    final long expiresAtMs;\n    long lastAccessMs;\n    /** Built by the cache on every write. */\n    CacheEntry(V value, long writtenAtMs, long expiresAtMs) {\n        this.value = value; this.writtenAtMs = writtenAtMs;\n        this.expiresAtMs = expiresAtMs; this.lastAccessMs = writtenAtMs;\n    }\n    /** True once the clock has reached the deadline. Checked on every read and by cleanUp(). */\n    boolean expired(long nowMs) { return nowMs &gt;= expiresAtMs; }\n}\n\n/** What a cache can do. A striped cache, a byte-bounded cache and a read-through cache are all this. */\ninterface Cache&lt;K, V&gt; {\n    /** The value for this key, or null if it is absent or past its deadline. */\n    V getIfPresent(K key);\n    /** Stores a value with the cache&#x27;s default time-to-live. */\n    void put(K key, V value);\n    /** Stores a value that dies ttlMs from now; a ttlMs of zero or less means it never dies. */\n    void put(K key, V value, long ttlMs);\n    /** Removes a key and returns the value it held, or null. */\n    V remove(K key);\n    /** How many entries are resident right now, dead-but-unread ones included. */\n    int size();\n    /** The hard bound on size(). */\n    int capacity();\n    /** Drops every entry whose deadline has passed. O(n), so it is on demand, never on the hot path. */\n    void cleanUp();\n    /** Hits, misses, evictions and expirations since the cache was built. */\n    CacheStats stats();\n}\n\n/**\n * The rule for who leaves next. The cache tells the policy what happened; the policy names a victim. The\n * policy never touches the table -- it advises, the cache executes, so exactly one object mutates state.\n *\n * &lt;p&gt;Four methods rather than one, which is the honest cost of this seam: a rule that ranks keys has to see\n * every event that changes the ranking. Every method is called with the cache&#x27;s lock already held, so no\n * implementation needs any synchronisation of its own.\n */\ninterface EvictionPolicy&lt;K&gt; {\n    /** This key was just written (a fresh insert or a rewrite). expiresAtMs is for deadline-ordered rules. */\n    void onPut(K key, long nowMs, long expiresAtMs);\n    /** This key was just read and found. LRU moves it; FIFO ignores it -- that is the whole difference. */\n    void onGet(K key, long nowMs);\n    /** This key has left the table, for any reason. Miss this call and the policy leaks keys forever. */\n    void onRemove(K key);\n    /** The key to give up if room is needed now, or null when the policy is holding nothing. */\n    K selectVictim(long nowMs);\n    /** How many keys this policy is tracking; the cache&#x27;s consistency check compares it with the table. */\n    int trackedKeys();\n    /** A readable name, for demos and logs. */\n    default String name() { return getClass().getSimpleName(); }\n}\n\n/**\n * A doubly-linked list of keys with a map from key to node, so &quot;move this key to the front&quot; and &quot;who is at\n * the back&quot; are both a fixed number of pointer writes. Two sentinels remove every null check. LRU and FIFO\n * are the same list; they differ only in whether a read moves a key.\n */\nfinal class KeyList&lt;K&gt; {\n    private final class Node { K key; Node prev, next; }\n    private final Node head = new Node(), tail = new Node();\n    private final Map&lt;K, Node&gt; index = new HashMap&lt;&gt;();\n\n    /** Builds an empty list: head and tail are sentinels that hold no key. */\n    KeyList() { head.next = tail; tail.prev = head; }\n\n    /** Puts the key at the front, moving it if it is already in the list. O(1). */\n    void touchFirst(K key) {\n        Node n = index.get(key);\n        if (n == null) { n = new Node(); n.key = key; index.put(key, n); }\n        else unlink(n);\n        n.next = head.next; n.prev = head; head.next.prev = n; head.next = n;\n    }\n    /** Drops the key from the list if it is there. O(1). */\n    void remove(K key) { Node n = index.remove(key); if (n != null) unlink(n); }\n    /** True if this list is tracking the key. */\n    boolean contains(K key) { return index.containsKey(key); }\n    /** The key at the back -- the oldest by whatever &quot;old&quot; means here -- or null if the list is empty. */\n    K last() { return tail.prev == head ? null : tail.prev.key; }\n    /** How many keys are in the list. */\n    int size() { return index.size(); }\n    /** Back to front: the order in which these keys would be given up. */\n    List&lt;K&gt; oldestFirst() {\n        List&lt;K&gt; out = new ArrayList&lt;&gt;(index.size());\n        for (Node n = tail.prev; n != head; n = n.prev) out.add(n.key);\n        return out;\n    }\n    private void unlink(Node n) {\n        if (n.prev != null) n.prev.next = n.next;\n        if (n.next != null) n.next.prev = n.prev;\n        n.prev = null; n.next = null;\n    }\n}\n\n/** One key&#x27;s deadline, with a sequence number so two keys that die in the same millisecond still order. */\nrecord Fuse&lt;K&gt;(long deadlineMs, long seq, K key) { }\n\n/**\n * Keys ordered by when they die. One index, two questions: &quot;who dies soonest?&quot; (an eviction order) and &quot;is\n * anybody already dead?&quot; (an expiry check). A TreeSet, so every operation is O(log n) -- the one structure\n * here that is not O(1), and worth saying out loud.\n */\nfinal class DeadlineIndex&lt;K&gt; {\n    private final TreeSet&lt;Fuse&lt;K&gt;&gt; fuses = new TreeSet&lt;&gt;(\n            Comparator.&lt;Fuse&lt;K&gt;&gt;comparingLong(Fuse::deadlineMs).thenComparingLong(Fuse::seq));\n    private final Map&lt;K, Fuse&lt;K&gt;&gt; byKey = new HashMap&lt;&gt;();\n    private final boolean trackImmortal;\n    private long seq;\n\n    /** trackImmortal = true also indexes entries with no deadline, so this index can rank every key. */\n    DeadlineIndex(boolean trackImmortal) { this.trackImmortal = trackImmortal; }\n\n    /** Records (or re-records) this key&#x27;s deadline. O(log n). */\n    void put(K key, long deadlineMs) {\n        remove(key);\n        if (!trackImmortal &amp;&amp; deadlineMs == Long.MAX_VALUE) return;    // no fuse, nothing to watch\n        Fuse&lt;K&gt; f = new Fuse&lt;&gt;(deadlineMs, ++seq, key);\n        fuses.add(f); byKey.put(key, f);\n    }\n    /** Forgets this key. O(log n). */\n    void remove(K key) { Fuse&lt;K&gt; f = byKey.remove(key); if (f != null) fuses.remove(f); }\n    /** The key with the soonest deadline, or null. Ties break by insertion order. */\n    K earliest() { return fuses.isEmpty() ? null : fuses.first().key(); }\n    /** That same key, but only if its deadline has already passed. */\n    K earliestIfDue(long nowMs) {\n        if (fuses.isEmpty()) return null;\n        Fuse&lt;K&gt; f = fuses.first();\n        return nowMs &gt;= f.deadlineMs() ? f.key() : null;\n    }\n    /** How many keys are indexed. */\n    int size() { return byKey.size(); }\n}\n\n/**\n * Least recently used: a read moves the key to the front, and the victim is whatever is at the back.\n * O(1) everywhere -- a hash lookup and six pointer writes.\n */\nfinal class LruPolicy&lt;K&gt; implements EvictionPolicy&lt;K&gt; {\n    private final KeyList&lt;K&gt; order = new KeyList&lt;&gt;();\n    /** A write counts as a use, so the key goes to the front. */\n    public void onPut(K key, long nowMs, long expiresAtMs) { order.touchFirst(key); }\n    /** A read counts as a use: this one line is what makes it LRU and not FIFO. */\n    public void onGet(K key, long nowMs) { order.touchFirst(key); }\n    /** Drops the key from the order. */\n    public void onRemove(K key) { order.remove(key); }\n    /** The key at the back: nobody has touched it for longer. */\n    public K selectVictim(long nowMs) { return order.last(); }\n    /** Keys currently in the order. */\n    public int trackedKeys() { return order.size(); }\n    /** Coldest first: the order in which keys would be given up. */\n    List&lt;K&gt; victimOrder() { return order.oldestFirst(); }\n    public String name() { return &quot;LRU&quot;; }\n}\n\n/**\n * First in, first out: arrival order only. The same list as LRU with one method emptied out, which is the\n * clearest possible demonstration that the policy, not the cache, is what changes between rules.\n */\nfinal class FifoPolicy&lt;K&gt; implements EvictionPolicy&lt;K&gt; {\n    private final KeyList&lt;K&gt; arrival = new KeyList&lt;&gt;();\n    /** A brand-new key joins the queue; rewriting a value does not move it back. */\n    public void onPut(K key, long nowMs, long expiresAtMs) { if (!arrival.contains(key)) arrival.touchFirst(key); }\n    /** A read is not a use here. One empty method is the entire difference from LRU. */\n    public void onGet(K key, long nowMs) { }\n    /** Drops the key from the queue. */\n    public void onRemove(K key) { arrival.remove(key); }\n    /** The key that arrived first. */\n    public K selectVictim(long nowMs) { return arrival.last(); }\n    /** Keys currently queued. */\n    public int trackedKeys() { return arrival.size(); }\n    public String name() { return &quot;FIFO&quot;; }\n}\n\n/**\n * Least frequently used, in O(1): keys are bucketed by use count and the coldest non-empty bucket is\n * remembered, so nothing is ever sorted or scanned. Inside a bucket a LinkedHashSet keeps equally cold keys\n * in arrival order, so the oldest of the coldest goes first.\n */\nfinal class LfuPolicy&lt;K&gt; implements EvictionPolicy&lt;K&gt; {\n    private final Map&lt;K, Integer&gt; useCount = new HashMap&lt;&gt;();\n    private final Map&lt;Integer, LinkedHashSet&lt;K&gt;&gt; buckets = new HashMap&lt;&gt;();\n    private int minCount = 1;\n\n    /** A new key starts at one use; a rewrite counts as another use. */\n    public void onPut(K key, long nowMs, long expiresAtMs) {\n        if (useCount.containsKey(key)) { bump(key); return; }\n        useCount.put(key, 1);\n        buckets.computeIfAbsent(1, c -&gt; new LinkedHashSet&lt;&gt;()).add(key);\n        minCount = 1;                                          // a newcomer is always in the coldest bucket\n    }\n    /** A read moves the key one bucket up: two set operations, never a sort. */\n    public void onGet(K key, long nowMs) { bump(key); }\n    /** Drops the key and, if that emptied the coldest bucket, finds the new coldest. */\n    public void onRemove(K key) {\n        Integer c = useCount.remove(key);\n        if (c == null) return;\n        LinkedHashSet&lt;K&gt; b = buckets.get(c);\n        if (b == null) return;\n        b.remove(key);\n        if (b.isEmpty()) { buckets.remove(c); if (c == minCount) recomputeMin(); }\n    }\n    /** The first key of the coldest bucket: fewest uses, and among those, the one that arrived first. */\n    public K selectVictim(long nowMs) {\n        LinkedHashSet&lt;K&gt; b = buckets.get(minCount);\n        if (b == null || b.isEmpty()) { recomputeMin(); b = buckets.get(minCount); }\n        return (b == null || b.isEmpty()) ? null : b.iterator().next();\n    }\n    /** Keys currently counted. */\n    public int trackedKeys() { return useCount.size(); }\n    /** How many times this key has been used; -1 if the policy has never seen it. */\n    int useCountOf(K key) { return useCount.getOrDefault(key, -1); }\n    public String name() { return &quot;LFU&quot;; }\n\n    private void bump(K key) {\n        Integer c = useCount.get(key);\n        if (c == null) return;\n        LinkedHashSet&lt;K&gt; from = buckets.get(c);\n        if (from != null) {\n            from.remove(key);\n            if (from.isEmpty()) { buckets.remove(c); if (c == minCount) minCount = c + 1; }\n        }\n        useCount.put(key, c + 1);\n        buckets.computeIfAbsent(c + 1, x -&gt; new LinkedHashSet&lt;&gt;()).add(key);\n    }\n    // Only reached when an explicit remove emptied the coldest bucket. Bounded by the number of DISTINCT use\n    // counts present, not by the number of keys, and never touched on the eviction path.\n    private void recomputeMin() { minCount = buckets.isEmpty() ? 1 : Collections.min(buckets.keySet()); }\n}\n\n/**\n * Shortest fuse first: when the cache is full, give up whatever dies soonest. This is an eviction ORDER, not\n * expiry -- expiry always applies and lives in the cache. O(log n) per operation, the one policy here that is\n * not O(1); keys with no deadline sort last, so an immortal key goes only when nothing else is left.\n */\nfinal class TtlPolicy&lt;K&gt; implements EvictionPolicy&lt;K&gt; {\n    private final DeadlineIndex&lt;K&gt; deadlines = new DeadlineIndex&lt;&gt;(true);\n    /** Records this key&#x27;s deadline. */\n    public void onPut(K key, long nowMs, long expiresAtMs) { deadlines.put(key, expiresAtMs); }\n    /** A read does not extend a time-to-live, so there is nothing to do. */\n    public void onGet(K key, long nowMs) { }\n    /** Forgets the key&#x27;s deadline. */\n    public void onRemove(K key) { deadlines.remove(key); }\n    /** The key whose deadline is soonest. */\n    public K selectVictim(long nowMs) { return deadlines.earliest(); }\n    /** Keys currently indexed. */\n    public int trackedKeys() { return deadlines.size(); }\n    public String name() { return &quot;TTL&quot;; }\n}\n\n/**\n * TTL as a wrapper over any other rule: if something in the cache is already dead, that goes first;\n * otherwise the wrapped rule decides. Decorator, and the reason TTL is not a fifth policy you must choose\n * instead of LRU -- ExpiryFirst(LRU), ExpiryFirst(LFU) and ExpiryFirst(FIFO) all exist. Entries with no\n * deadline are not indexed at all, so wrapping a cache that uses no TTLs costs nothing.\n */\nfinal class ExpiryFirst&lt;K&gt; implements EvictionPolicy&lt;K&gt; {\n    private final EvictionPolicy&lt;K&gt; inner;\n    private final DeadlineIndex&lt;K&gt; deadlines = new DeadlineIndex&lt;&gt;(false);\n    /** Wraps any policy; the wrapped object is handed in, never built here. */\n    ExpiryFirst(EvictionPolicy&lt;K&gt; inner) { this.inner = Objects.requireNonNull(inner); }\n    /** Records the deadline, then lets the wrapped rule do its own bookkeeping. */\n    public void onPut(K key, long nowMs, long expiresAtMs) { deadlines.put(key, expiresAtMs); inner.onPut(key, nowMs, expiresAtMs); }\n    /** A read does not extend a deadline, but it may still matter to the wrapped rule. */\n    public void onGet(K key, long nowMs) { inner.onGet(key, nowMs); }\n    /** Both indexes must drop the key, or one of them leaks. */\n    public void onRemove(K key) { deadlines.remove(key); inner.onRemove(key); }\n    /** A corpse if there is one, otherwise whoever the wrapped rule names. */\n    public K selectVictim(long nowMs) {\n        K dead = deadlines.earliestIfDue(nowMs);\n        return dead != null ? dead : inner.selectVictim(nowMs);\n    }\n    /** The wrapped rule is the one holding every key. */\n    public int trackedKeys() { return inner.trackedKeys(); }\n    public String name() { return &quot;ExpiryFirst(&quot; + inner.name() + &quot;)&quot;; }\n}\n\n/**\n * The cache. It owns the table, the lock, the clock and the listeners, and it is handed an eviction policy.\n * The invariant it defends: the table and the policy always name exactly the same set of keys, and the number\n * of entries never exceeds the capacity -- not even for an instant in the middle of a put.\n */\nfinal class PolicyCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final int capacity;\n    /** Insertion-ordered only so that re-indexing on a policy swap is deterministic and testable. */\n    private final Map&lt;K, CacheEntry&lt;V&gt;&gt; table = new LinkedHashMap&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n    private final List&lt;RemovalListener&lt;K, V&gt;&gt; listeners = new CopyOnWriteArrayList&lt;&gt;();\n    private final AtomicLong hits = new AtomicLong(), misses = new AtomicLong();\n    private final AtomicLong evictions = new AtomicLong(), expirations = new AtomicLong();\n    private EvictionPolicy&lt;K&gt; policy;\n    private Clock clock;\n    private final long defaultTtlMs;\n\n    /** Built by CacheBuilder, which is the only place the pieces are assembled. */\n    PolicyCache(int capacity, EvictionPolicy&lt;K&gt; policy, Clock clock, long defaultTtlMs) {\n        if (capacity &lt; 1) throw new IllegalArgumentException(&quot;capacity must be at least 1&quot;);\n        this.capacity = capacity;\n        this.policy = Objects.requireNonNull(policy, &quot;policy&quot;);\n        this.clock = Objects.requireNonNull(clock, &quot;clock&quot;);\n        this.defaultTtlMs = defaultTtlMs;\n    }\n\n    /** Adds somebody who wants to hear about departures. Listeners are called after the lock is released. */\n    void addListener(RemovalListener&lt;K, V&gt; l) { listeners.add(Objects.requireNonNull(l)); }\n\n    /**\n     * The value for this key, or null. A read past the deadline is a miss: the dead entry is dropped here and\n     * reported as EXPIRED, so a stale value can never be handed back.\n     */\n    public V getIfPresent(K key) {\n        Objects.requireNonNull(key, &quot;key&quot;);\n        long now = clock.nowMs();\n        List&lt;Removal&lt;K, V&gt;&gt; pending = new ArrayList&lt;&gt;(1);\n        V out = null;\n        boolean hit = false, dead = false;\n        lock.lock();\n        try {\n            CacheEntry&lt;V&gt; e = table.get(key);\n            if (e != null &amp;&amp; e.expired(now)) {\n                table.remove(key);\n                policy.onRemove(key);\n                pending.add(new Removal&lt;&gt;(key, e.value, RemovalCause.EXPIRED));\n                dead = true;\n            } else if (e != null) {\n                e.lastAccessMs = now;\n                policy.onGet(key, now);                        // a read is a write to the ranking\n                out = e.value;\n                hit = true;\n            }\n        } finally {\n            lock.unlock();\n        }\n        if (hit) hits.incrementAndGet(); else misses.incrementAndGet();\n        if (dead) expirations.incrementAndGet();\n        fire(pending);\n        return out;\n    }\n\n    /** Stores a value with the cache&#x27;s default time-to-live. */\n    public void put(K key, V value) { put(key, value, defaultTtlMs); }\n\n    /**\n     * Stores a value that dies ttlMs from now (a ttlMs of zero or less means never). The order IS the design: work\n     * the deadline outside the lock; take the lock; evict BEFORE admitting, because under LFU a newcomer\n     * arrives at one use, is instantly the coldest key, and would otherwise evict itself; write the entry;\n     * unlock; only then tell the listeners.\n     */\n    public void put(K key, V value, long ttlMs) {\n        Objects.requireNonNull(key, &quot;key&quot;);\n        Objects.requireNonNull(value, &quot;null value: null is how this cache reports a miss&quot;);\n        long now = clock.nowMs();\n        long expiresAt = ttlMs &lt;= 0 ? Long.MAX_VALUE : now + ttlMs;\n        List&lt;Removal&lt;K, V&gt;&gt; pending = new ArrayList&lt;&gt;(2);\n        int evicted = 0, expired = 0;\n        lock.lock();\n        try {\n            CacheEntry&lt;V&gt; old = table.get(key);\n            if (old != null) {                                  // a rewrite: the count does not grow\n                table.put(key, new CacheEntry&lt;&gt;(value, now, expiresAt));\n                policy.onPut(key, now, expiresAt);\n                pending.add(new Removal&lt;&gt;(key, old.value, RemovalCause.REPLACED));\n            } else {\n                while (table.size() &gt;= capacity) {              // evict first, admit second\n                    K victim = policy.selectVictim(now);\n                    if (victim == null) break;                  // a policy holding nothing has nothing to give\n                    CacheEntry&lt;V&gt; gone = table.remove(victim);\n                    policy.onRemove(victim);                    // both indexes drop it, or the policy leaks\n                    if (gone == null) continue;                 // the policy named a key the table never had\n                    boolean wasDead = gone.expired(now);\n                    pending.add(new Removal&lt;&gt;(victim, gone.value,\n                            wasDead ? RemovalCause.EXPIRED : RemovalCause.CAPACITY));\n                    if (wasDead) expired++; else evicted++;\n                }\n                table.put(key, new CacheEntry&lt;&gt;(value, now, expiresAt));\n                policy.onPut(key, now, expiresAt);\n            }\n        } finally {\n            lock.unlock();\n        }\n        if (evicted &gt; 0) evictions.addAndGet(evicted);\n        if (expired &gt; 0) expirations.addAndGet(expired);\n        fire(pending);\n    }\n\n    /** Removes a key and returns what it held. The cause is EXPLICIT: the caller asked, whatever the clock says. */\n    public V remove(K key) {\n        Objects.requireNonNull(key, &quot;key&quot;);\n        List&lt;Removal&lt;K, V&gt;&gt; pending = new ArrayList&lt;&gt;(1);\n        V out = null;\n        lock.lock();\n        try {\n            CacheEntry&lt;V&gt; e = table.remove(key);\n            if (e != null) {\n                policy.onRemove(key);\n                pending.add(new Removal&lt;&gt;(key, e.value, RemovalCause.EXPLICIT));\n                out = e.value;\n            }\n        } finally {\n            lock.unlock();\n        }\n        fire(pending);\n        return out;\n    }\n\n    /** Entries resident right now, including ones past their deadline that nobody has read yet. */\n    public int size() { lock.lock(); try { return table.size(); } finally { lock.unlock(); } }\n\n    /** The hard bound. */\n    public int capacity() { return capacity; }\n\n    /** Drops every dead entry in one pass. O(n), which is why it is on demand and not on the read path. */\n    public void cleanUp() {\n        long now = clock.nowMs();\n        List&lt;Removal&lt;K, V&gt;&gt; pending = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            for (Iterator&lt;Map.Entry&lt;K, CacheEntry&lt;V&gt;&gt;&gt; it = table.entrySet().iterator(); it.hasNext(); ) {\n                Map.Entry&lt;K, CacheEntry&lt;V&gt;&gt; en = it.next();\n                if (en.getValue().expired(now)) {\n                    it.remove();\n                    policy.onRemove(en.getKey());\n                    pending.add(new Removal&lt;&gt;(en.getKey(), en.getValue().value, RemovalCause.EXPIRED));\n                }\n            }\n        } finally {\n            lock.unlock();\n        }\n        if (!pending.isEmpty()) expirations.addAndGet(pending.size());\n        fire(pending);\n    }\n\n    /** Hits, misses, evictions and expirations. Counted outside the lock, so they are approximate under load. */\n    public CacheStats stats() {\n        return new CacheStats(hits.get(), misses.get(), evictions.get(), expirations.get());\n    }\n\n    /**\n     * Swaps the rule at runtime and returns the old one. Every live key is handed to the new policy as a\n     * fresh insert under the same lock, so no entry is lost and no reader ever sees a cache without a rule.\n     * What does not survive is the ranking: the new policy starts with no history. That is the honest trade,\n     * and it is better said out loud than papered over by pretending recency counts carry across.\n     */\n    EvictionPolicy&lt;K&gt; setPolicy(EvictionPolicy&lt;K&gt; next) {\n        Objects.requireNonNull(next, &quot;policy&quot;);\n        long now = clock.nowMs();\n        lock.lock();\n        try {\n            EvictionPolicy&lt;K&gt; old = policy;\n            for (Map.Entry&lt;K, CacheEntry&lt;V&gt;&gt; en : table.entrySet())\n                next.onPut(en.getKey(), now, en.getValue().expiresAtMs);\n            policy = next;\n            return old;\n        } finally {\n            lock.unlock();\n        }\n    }\n\n    /** The rule in force right now. */\n    EvictionPolicy&lt;K&gt; policy() { lock.lock(); try { return policy; } finally { lock.unlock(); } }\n\n    /** Replaces the clock. Tests use this; production hands one in through the builder. */\n    void setClock(Clock c) { lock.lock(); try { this.clock = Objects.requireNonNull(c); } finally { lock.unlock(); } }\n\n    /** The invariant, checkable: the policy tracks exactly as many keys as the table holds. */\n    boolean consistent() {\n        lock.lock();\n        try { return policy.trackedKeys() == table.size(); } finally { lock.unlock(); }\n    }\n\n    /** A snapshot of the resident keys in insertion order, for demos and tests. */\n    Set&lt;K&gt; keys() { lock.lock(); try { return new LinkedHashSet&lt;&gt;(table.keySet()); } finally { lock.unlock(); } }\n\n    // A listener is caller code: it may do I/O, throw, or call straight back into this cache. All three are\n    // safe out here and none of them are safe inside the lock, so departures are collected under the lock and\n    // delivered once it is gone.\n    private void fire(List&lt;Removal&lt;K, V&gt;&gt; pending) {\n        if (pending.isEmpty() || listeners.isEmpty()) return;\n        for (Removal&lt;K, V&gt; r : pending)\n            for (RemovalListener&lt;K, V&gt; l : listeners)\n                try { l.onRemoval(r.key(), r.value(), r.cause()); }\n                catch (RuntimeException ignored) { /* a broken listener is the listener&#x27;s problem */ }\n    }\n}\n\n/**\n * The one place the pieces are assembled: capacity, policy, clock, default TTL, listeners. Six optional knobs\n * is exactly when a builder earns its place -- which is why Guava ships CacheBuilder and Caffeine ships\n * Caffeine.newBuilder().\n */\nfinal class CacheBuilder&lt;K, V&gt; {\n    private int capacity = 128;\n    private EvictionPolicy&lt;K&gt; policy;\n    private Clock clock = new SystemClock();\n    private long ttlMs = 0;\n    private final List&lt;RemovalListener&lt;K, V&gt;&gt; listeners = new ArrayList&lt;&gt;();\n\n    /** Starts a builder; the type arguments are given at the call site. */\n    static &lt;K, V&gt; CacheBuilder&lt;K, V&gt; newBuilder() { return new CacheBuilder&lt;&gt;(); }\n    /** The hard bound on the number of entries. */\n    CacheBuilder&lt;K, V&gt; capacity(int n) { this.capacity = n; return this; }\n    /** The eviction rule. Defaults to LRU when nothing is said. */\n    CacheBuilder&lt;K, V&gt; policy(EvictionPolicy&lt;K&gt; p) { this.policy = p; return this; }\n    /** Where time comes from. Defaults to the wall clock. */\n    CacheBuilder&lt;K, V&gt; clock(Clock c) { this.clock = c; return this; }\n    /** A default time-to-live for entries written without one. */\n    CacheBuilder&lt;K, V&gt; ttlMs(long ms) { this.ttlMs = ms; return this; }\n    /** Somebody to tell when an entry leaves. */\n    CacheBuilder&lt;K, V&gt; listener(RemovalListener&lt;K, V&gt; l) { this.listeners.add(l); return this; }\n    /** Assembles the cache. The cache itself never names a policy class. */\n    PolicyCache&lt;K, V&gt; build() {\n        EvictionPolicy&lt;K&gt; p = policy != null ? policy : new LruPolicy&lt;&gt;();\n        PolicyCache&lt;K, V&gt; c = new PolicyCache&lt;&gt;(capacity, p, clock, ttlMs);\n        for (RemovalListener&lt;K, V&gt; l : listeners) c.addListener(l);\n        return c;\n    }\n}\n\n/** The demo: one access trace through four rules, expiry, a runtime policy swap, and a fifty-thread race. */\npublic class Main {\n\n    /**\n     * One fixed access trace, replayed through whichever policy is handed in, with a listener that records\n     * what left. Identical calls, identical timing; the only difference is the rule.\n     *\n     * &lt;p&gt;t=0 put A(ttl 60s), t=1s put B(ttl 50s), t=2s get B, t=3s put C(ttl 40s), t=4s put D(ttl 5s),\n     * t=5s get A, then (after extraWaitMs) put E into a cache of four.\n     */\n    static String replay(EvictionPolicy&lt;String&gt; policy, ManualClock clock, long extraWaitMs) {\n        List&lt;String&gt; gone = new ArrayList&lt;&gt;();\n        PolicyCache&lt;String, String&gt; c = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(4).policy(policy).clock(clock)\n                .listener((k, v, cause) -&gt; gone.add(k + &quot; (&quot; + cause + &quot;)&quot;))\n                .build();\n        clock.setTo(0);\n        c.put(&quot;A&quot;, &quot;alpha&quot;, 60_000);\n        clock.advance(1_000); c.put(&quot;B&quot;, &quot;bravo&quot;, 50_000);\n        clock.advance(1_000); c.getIfPresent(&quot;B&quot;);\n        clock.advance(1_000); c.put(&quot;C&quot;, &quot;charlie&quot;, 40_000);\n        clock.advance(1_000); c.put(&quot;D&quot;, &quot;delta&quot;, 5_000);\n        clock.advance(1_000); c.getIfPresent(&quot;A&quot;);\n        clock.advance(1_000 + extraWaitMs);\n        c.put(&quot;E&quot;, &quot;echo&quot;);                                    // the cache is full: the policy decides\n        return gone.isEmpty() ? &quot;nobody&quot; : gone.get(0);\n    }\n\n    /** Runs the demo and then a many-thread race that proves the size bound and the table/policy agreement. */\n    public static void main(String[] args) throws Exception {\n        ManualClock clock = new ManualClock(0);\n\n        System.out.println(&quot;== the same access trace, four rules, four victims ==&quot;);\n        System.out.println(&quot;   put A,B; get B; put C,D; get A; then put E into a cache of four&quot;);\n        System.out.printf(&quot;   %-20s evicts %s%n&quot;, &quot;FIFO&quot;, replay(new FifoPolicy&lt;&gt;(), clock, 0));\n        System.out.printf(&quot;   %-20s evicts %s%n&quot;, &quot;LRU&quot;, replay(new LruPolicy&lt;&gt;(), clock, 0));\n        System.out.printf(&quot;   %-20s evicts %s%n&quot;, &quot;LFU&quot;, replay(new LfuPolicy&lt;&gt;(), clock, 0));\n        System.out.printf(&quot;   %-20s evicts %s%n&quot;, &quot;TTL (shortest fuse)&quot;, replay(new TtlPolicy&lt;&gt;(), clock, 0));\n\n        System.out.println();\n        System.out.println(&quot;== TTL as a decorator: the same trace, but put E four seconds later, when D is dead ==&quot;);\n        System.out.printf(&quot;   %-22s evicts %s%n&quot;, &quot;LRU&quot;, replay(new LruPolicy&lt;&gt;(), clock, 4_000));\n        System.out.printf(&quot;   %-22s evicts %s%n&quot;, &quot;ExpiryFirst(LRU)&quot;,\n                          replay(new ExpiryFirst&lt;&gt;(new LruPolicy&lt;&gt;()), clock, 4_000));\n        System.out.printf(&quot;   %-22s evicts %s%n&quot;, &quot;ExpiryFirst(LFU)&quot;,\n                          replay(new ExpiryFirst&lt;&gt;(new LfuPolicy&lt;&gt;()), clock, 4_000));\n\n        System.out.println();\n        System.out.println(&quot;== expiry is not eviction: a dead entry is a miss in a cache that is 25% full ==&quot;);\n        clock.setTo(0);\n        PolicyCache&lt;String, String&gt; ttl = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(4).policy(new LruPolicy&lt;&gt;()).clock(clock)\n                .listener((k, v, cause) -&gt; System.out.println(&quot;   listener: &quot; + k + &quot; left because &quot; + cause))\n                .build();\n        ttl.put(&quot;session&quot;, &quot;harish&quot;, 30 * 60_000L);            // a thirty-minute session\n        System.out.println(&quot;   at  0 min    get session -&gt; &quot; + ttl.getIfPresent(&quot;session&quot;));\n        clock.advance(29 * 60_000L);\n        System.out.println(&quot;   at 29 min    get session -&gt; &quot; + ttl.getIfPresent(&quot;session&quot;));\n        clock.advance(2 * 60_000L);\n        System.out.println(&quot;   at 31 min    get session -&gt; &quot; + ttl.getIfPresent(&quot;session&quot;)\n                           + &quot;   (size now &quot; + ttl.size() + &quot;)&quot;);\n\n        System.out.println();\n        System.out.println(&quot;== swapping the rule at runtime keeps every entry ==&quot;);\n        clock.setTo(0);\n        PolicyCache&lt;String, String&gt; live = CacheBuilder.&lt;String, String&gt;newBuilder()\n                .capacity(3).policy(new LruPolicy&lt;&gt;()).clock(clock).build();\n        live.put(&quot;x&quot;, &quot;1&quot;); live.put(&quot;y&quot;, &quot;2&quot;); live.put(&quot;z&quot;, &quot;3&quot;);\n        live.getIfPresent(&quot;x&quot;); live.getIfPresent(&quot;x&quot;); live.getIfPresent(&quot;y&quot;);\n        System.out.println(&quot;   before swap: &quot; + live.policy().name() + &quot;, keys &quot; + live.keys());\n        EvictionPolicy&lt;String&gt; was = live.setPolicy(new LfuPolicy&lt;&gt;());\n        System.out.println(&quot;   after swap:  &quot; + live.policy().name() + &quot;, keys &quot; + live.keys()\n                           + &quot;  (was &quot; + was.name() + &quot;; x still reads &quot; + live.getIfPresent(&quot;x&quot;) + &quot;)&quot;);\n\n        System.out.println();\n        System.out.println(&quot;== the race: 50 threads, capacity 100, 500 distinct keys ==&quot;);\n        PolicyCache&lt;Integer, Integer&gt; hot = CacheBuilder.&lt;Integer, Integer&gt;newBuilder()\n                .capacity(100).policy(new LruPolicy&lt;&gt;()).build();\n        AtomicLong overflow = new AtomicLong();\n        int threads = 50, opsEach = 400;\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; all = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; threads; t++) {\n            final int seed = t;\n            all.add(pool.submit(() -&gt; {\n                go.await();\n                Random rnd = new Random(seed);\n                for (int i = 0; i &lt; opsEach; i++) {\n                    int k = rnd.nextInt(500);\n                    if ((i &amp; 3) == 0) hot.put(k, k * 7); else hot.getIfPresent(k);\n                    if (hot.size() &gt; hot.capacity()) overflow.incrementAndGet();\n                }\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : all) f.get();\n        pool.shutdown();\n        System.out.println(&quot;   &quot; + (threads * opsEach) + &quot; operations, size &quot; + hot.size() + &quot;/&quot; + hot.capacity()\n                           + &quot;, times seen over capacity: &quot; + overflow.get());\n        System.out.println(&quot;   table and policy agree: &quot; + hot.consistent());\n        System.out.println(&quot;   &quot; + hot.stats());\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.AtomicLong;\nimport java.util.concurrent.locks.ReentrantLock;\nimport java.util.function.Consumer;\nimport java.util.function.Supplier;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong. Nothing here opens PolicyCache.\n\n// ---- ext: a new rule -- sampled LRU, which is what Redis actually does. ONE class, one builder line.\n/**\n * Approximate LRU: instead of a linked list, keep a dense array of keys and a monotonic tick per key, then\n * sample a handful at random and evict the coldest one you saw. Cheaper than exact LRU and sometimes wrong --\n * Redis&#x27;s deliberate trade. Removal swaps the last key into the hole, so it stays O(1).\n */\nfinal class SampledLruPolicy&lt;K&gt; implements EvictionPolicy&lt;K&gt; {\n    private final int sampleSize;\n    private final Random rnd;\n    private final Map&lt;K, Long&gt; lastUsedTick = new HashMap&lt;&gt;();\n    private final List&lt;K&gt; keys = new ArrayList&lt;&gt;();\n    private final Map&lt;K, Integer&gt; slotOf = new HashMap&lt;&gt;();\n    private long tick;\n\n    /** sampleSize is how many random keys are looked at per eviction; Redis defaults to five. */\n    SampledLruPolicy(int sampleSize, long seed) { this.sampleSize = Math.max(1, sampleSize); this.rnd = new Random(seed); }\n\n    /** Adds the key to the dense array if it is new, and stamps it with the current tick. */\n    public void onPut(K key, long nowMs, long expiresAtMs) {\n        if (!slotOf.containsKey(key)) { slotOf.put(key, keys.size()); keys.add(key); }\n        lastUsedTick.put(key, ++tick);\n    }\n    /** A read is a use: one map write, no pointer surgery at all. */\n    public void onGet(K key, long nowMs) { if (slotOf.containsKey(key)) lastUsedTick.put(key, ++tick); }\n    /** Swap-with-last keeps removal O(1) and the array dense enough to sample by index. */\n    public void onRemove(K key) {\n        Integer i = slotOf.remove(key);\n        lastUsedTick.remove(key);\n        if (i == null) return;\n        K moved = keys.remove(keys.size() - 1);\n        if (!moved.equals(key)) { keys.set(i, moved); slotOf.put(moved, i); }\n    }\n    /** The coldest of a few random keys. O(sample), and occasionally not the coldest key in the cache. */\n    public K selectVictim(long nowMs) {\n        if (keys.isEmpty()) return null;\n        K coldest = null;\n        long coldestTick = Long.MAX_VALUE;\n        for (int s = 0, n = Math.min(sampleSize, keys.size()); s &lt; n; s++) {\n            K cand = keys.get(rnd.nextInt(keys.size()));\n            long t = lastUsedTick.getOrDefault(cand, Long.MAX_VALUE);\n            if (t &lt; coldestTick) { coldestTick = t; coldest = cand; }\n        }\n        return coldest;\n    }\n    /** Keys in the dense array. */\n    public int trackedKeys() { return slotOf.size(); }\n    public String name() { return &quot;SampledLRU(&quot; + sampleSize + &quot;)&quot;; }\n}\n\n// ---- ext: scan resistance -- a nightly report reads every row and destroys the hit rate. A NEW class.\n/**\n * Segmented LRU: two lists. A key enters PROBATION; a second read promotes it to PROTECTED, which holds the\n * working set. Victims come from probation first, so a one-pass scan of a million cold keys walks in and\n * straight back out without touching what is protected. This is the shape TinyLFU and Caffeine build on.\n */\nfinal class SegmentedLruPolicy&lt;K&gt; implements EvictionPolicy&lt;K&gt; {\n    private final KeyList&lt;K&gt; probation = new KeyList&lt;&gt;();\n    private final KeyList&lt;K&gt; protectedSeg = new KeyList&lt;&gt;();\n    private final int protectedCapacity;\n\n    /** protectedCapacity is usually about 80% of the cache: the part a scan must not be able to evict. */\n    SegmentedLruPolicy(int protectedCapacity) { this.protectedCapacity = Math.max(1, protectedCapacity); }\n\n    /** A new or rewritten key sits in probation until somebody reads it a second time. */\n    public void onPut(K key, long nowMs, long expiresAtMs) {\n        if (protectedSeg.contains(key)) protectedSeg.touchFirst(key);\n        else probation.touchFirst(key);\n    }\n    /** The promotion: one read moves a key out of probation, and the coldest protected key is demoted. */\n    public void onGet(K key, long nowMs) {\n        if (probation.contains(key)) {\n            probation.remove(key);\n            protectedSeg.touchFirst(key);\n            while (protectedSeg.size() &gt; protectedCapacity) {\n                K cold = protectedSeg.last();\n                protectedSeg.remove(cold);\n                probation.touchFirst(cold);                    // demoted, not evicted: it gets another chance\n            }\n        } else if (protectedSeg.contains(key)) {\n            protectedSeg.touchFirst(key);\n        }\n    }\n    /** Both lists must drop the key. */\n    public void onRemove(K key) { probation.remove(key); protectedSeg.remove(key); }\n    /** Probation goes first; only an empty probation reaches into the protected working set. */\n    public K selectVictim(long nowMs) {\n        K v = probation.last();\n        return v != null ? v : protectedSeg.last();\n    }\n    /** Keys across both segments. */\n    public int trackedKeys() { return probation.size() + protectedSeg.size(); }\n    public String name() { return &quot;SegmentedLRU&quot;; }\n}\n\n// ---- ext: capacity in bytes -- a 2 MB value and a 2 KB value are not the same thing\n/** How heavy an entry is. One method, handed in, so the cache never guesses at sizes. */\ninterface Weigher&lt;K, V&gt; {\n    /** The cost of holding this entry, in whatever unit the budget is written in. */\n    int weigh(K key, V value);\n}\n\n/**\n * The same cache bounded by total weight instead of entry count. Two changes, both small: the single &quot;is it\n * full?&quot; check becomes a LOOP, because one heavy value can push out several small ones, and an entry heavier\n * than the whole budget is refused outright -- otherwise it empties the cache and still does not fit.\n * The policies are untouched: weight is a bound, not a ranking.\n */\nfinal class ByteBoundedCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final long maxWeight;\n    private final Weigher&lt;K, V&gt; weigher;\n    private final Map&lt;K, CacheEntry&lt;V&gt;&gt; table = new LinkedHashMap&lt;&gt;();\n    private final Map&lt;K, Integer&gt; weightOf = new HashMap&lt;&gt;();\n    private final EvictionPolicy&lt;K&gt; policy;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Clock clock;\n    private final AtomicLong hits = new AtomicLong(), misses = new AtomicLong(), evictions = new AtomicLong();\n    private long totalWeight;\n\n    /** maxWeight is the budget, in the weigher&#x27;s unit; the policy still decides who goes. */\n    ByteBoundedCache(long maxWeight, Weigher&lt;K, V&gt; weigher, EvictionPolicy&lt;K&gt; policy, Clock clock) {\n        this.maxWeight = maxWeight; this.weigher = weigher; this.policy = policy; this.clock = clock;\n    }\n\n    /** The value, or null. Same read path as PolicyCache, minus the expiry branch for brevity. */\n    public V getIfPresent(K key) {\n        lock.lock();\n        try {\n            CacheEntry&lt;V&gt; e = table.get(key);\n            if (e == null || e.expired(clock.nowMs())) { misses.incrementAndGet(); return null; }\n            policy.onGet(key, clock.nowMs());\n            hits.incrementAndGet();\n            return e.value;\n        } finally { lock.unlock(); }\n    }\n    /** Stores a value with no deadline. */\n    public void put(K key, V value) { put(key, value, 0); }\n    /** Stores a value, evicting as many entries as it takes to fit the new one inside the budget. */\n    public void put(K key, V value, long ttlMs) {\n        int w = weigher.weigh(key, value);\n        if (w &gt; maxWeight) return;                             // refuse: it would empty the cache and still not fit\n        long now = clock.nowMs();\n        lock.lock();\n        try {\n            if (table.containsKey(key)) { totalWeight -= weightOf.remove(key); table.remove(key); policy.onRemove(key); }\n            while (totalWeight + w &gt; maxWeight) {               // a LOOP, not an if\n                K victim = policy.selectVictim(now);\n                if (victim == null) break;\n                table.remove(victim);\n                policy.onRemove(victim);\n                Integer vw = weightOf.remove(victim);\n                if (vw != null) totalWeight -= vw;\n                evictions.incrementAndGet();\n            }\n            table.put(key, new CacheEntry&lt;&gt;(value, now, ttlMs &lt;= 0 ? Long.MAX_VALUE : now + ttlMs));\n            weightOf.put(key, w);\n            totalWeight += w;\n            policy.onPut(key, now, ttlMs &lt;= 0 ? Long.MAX_VALUE : now + ttlMs);\n        } finally { lock.unlock(); }\n    }\n    /** Removes a key and gives back its weight. */\n    public V remove(K key) {\n        lock.lock();\n        try {\n            CacheEntry&lt;V&gt; e = table.remove(key);\n            if (e == null) return null;\n            policy.onRemove(key);\n            Integer w = weightOf.remove(key);\n            if (w != null) totalWeight -= w;\n            return e.value;\n        } finally { lock.unlock(); }\n    }\n    /** Entries resident. */\n    public int size() { lock.lock(); try { return table.size(); } finally { lock.unlock(); } }\n    /** T

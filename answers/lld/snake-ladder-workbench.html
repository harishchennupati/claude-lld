          to = extrasInARow == 0 ? from : log.get(log.size() - extrasInARow).from();\n                } else {\n                    landedOn = moveRule.landingCell(from, roll, board.size());\n                    if (landedOn &lt; 0 || landedOn &gt; board.size())\n                        throw new IllegalStateException(&quot;the move rule returned an off-board cell: &quot; + landedOn);\n                    to = landedOn;\n                    for (Jump j = board.jumpAt(to); j != null; j = board.jumpAt(to)) {   // jumps chain to a plain cell\n                        path.add(j);\n                        to = j.end();\n                        if (to &lt; 0 || to &gt; board.size() || path.size() &gt; board.size())\n                            throw new IllegalStateException(&quot;the jumps left the board or looped at &quot; + to);\n                    }\n                }\n                boolean won = played &amp;&amp; to == board.size();           // the win is checked on the RESTING cell\n                int hold = played &amp;&amp; !won ? board.holdAt(to) : 0;     // a mine: sit out the next `hold` turns\n                String sentHome = capture &amp;&amp; played &amp;&amp; !won ? tokenOn(to, playerId) : null;\n                boolean again = played &amp;&amp; !won &amp;&amp; hold == 0 &amp;&amp; next == Next.AGAIN;\n\n                positions.put(playerId, to);                          // the first write of the whole method\n                if (sentHome != null) positions.put(sentHome, startOf(sentHome));\n                if (hold &gt; 0) sittingOut.put(playerId, hold);\n                for (Jump j : path) jumpsTaken.merge(j.kind(), 1, Integer::sum);\n                t = new Turn(++turnNo, playerId, played ? TurnKind.PLAYED : TurnKind.CANCELLED, roll, from, landedOn, to,\n                             List.copyOf(path), sentHome, again, won, now);\n                log.add(t);\n                if (won) finish(playerId);\n                else if (again) extrasInARow++;\n                else passTurn();                                      // rotate last, so a reader is never half-updated\n            }\n        } finally { lock.unlock(); }\n        publish(t);                                                   // the screens hear outside the lock\n        return t;\n    }\n\n    /**\n     * Give up the turn without moving: the clock ran out. Same lock, same log, no die thrown. A player held by a\n     * mine loses that held turn the same way, so the timer and the mine can never disagree about who is due.\n     */\n    Turn forfeitTurn(String playerId) {\n        Turn t;\n        lock.lock();\n        try {\n            if (status != GameStatus.IN_PROGRESS) throw new IllegalStateException(&quot;the game is &quot; + status);\n            String due = turns.peek();\n            if (!playerId.equals(due)) throw new OutOfTurnException(playerId + &quot; cannot forfeit &quot; + due + &quot;&#x27;s turn&quot;);\n            long now = clock.nowMs();\n            t = passWithoutMoving(playerId, sittingOut.containsKey(playerId) ? TurnKind.HELD : TurnKind.TIMED_OUT, now);\n        } finally { lock.unlock(); }\n        publish(t);\n        return t;\n    }\n\n    /** A turn that passes with no throw (HELD or TIMED_OUT): logged like any other, then the turn moves on. */\n    private Turn passWithoutMoving(String playerId, TurnKind kind, long now) {\n        int at = positions.get(playerId);\n        if (kind == TurnKind.HELD) sittingOut.computeIfPresent(playerId, (k, v) -&gt; v == 1 ? null : v - 1);\n        Turn t = new Turn(++turnNo, playerId, kind, 0, at, at, at, List.of(), null, false, false, now);\n        log.add(t);\n        passTurn();\n        return t;\n    }\n\n    /** The head of the queue goes to the back, and the next player starts a fresh streak. */\n    private void passTurn() { extrasInARow = 0; turns.addLast(turns.poll()); }\n\n    /**\n     * The player on turn rested on the last cell: they take the next place and leave the rotation. The game ends\n     * at the first finisher, or -- when the table plays on to the last -- once only one player is still playing.\n     */\n    private void finish(String playerId) {\n        finishOrder.add(playerId);\n        turns.poll();                                                 // the finisher was the head of the queue\n        extrasInARow = 0;\n        if (!playToLast || turns.size() &lt; 2) status = GameStatus.FINISHED;\n    }\n\n    /** Where this player&#x27;s token starts, and goes back to when it is captured: 0 (off the board) unless set. */\n    private int startOf(String playerId) { return starts.getOrDefault(playerId, 0); }\n\n    /** Another token still in play on this cell, or null. O(players) -- a table has fewer than ten. */\n    private String tokenOn(int cell, String mover) {\n        if (cell == 0) return null;                                   // everyone may wait off the board\n        for (String p : turns) if (!p.equals(mover) &amp;&amp; positions.get(p) == cell) return p;\n        return null;\n    }\n\n    /**\n     * Take the last turn back: a misclick, a phone that fired twice, a referee at a tournament. It is a walk\n     * backwards through the writes roll() made, under the same lock: the position goes back to `from`, a token\n     * it knocked home comes back, the jump counters come down, a mine&#x27;s hold is taken off (or a held turn is\n     * owed again), the log row is dropped, a finish is unmade, and the queue is rotated backwards if that turn\n     * rotated it. Because the Turn record kept `from`, there is no separate undo stack.\n     * The observers are NOT told: onTurn means &quot;a turn happened&quot;. Telling them would need a second method on\n     * GameObserver, and a two-method interface is a real cost -- name it rather than pretend it is free.\n     *\n     * @return the turn that was undone\n     * @throws IllegalStateException if no turn has been played, or the game was ended by players leaving\n     */\n    Turn undoLastTurn() {\n        lock.lock();\n        try {\n            if (log.isEmpty()) throw new IllegalStateException(&quot;there is no turn to undo&quot;);\n            Turn t = log.get(log.size() - 1);\n            if (status == GameStatus.FINISHED &amp;&amp; !t.won())\n                throw new IllegalStateException(&quot;the game ended because players left; there is no move to take back&quot;);\n            log.remove(log.size() - 1);\n            turnNo--;\n            positions.put(t.playerId(), t.from());\n            if (t.sentHome() != null) positions.put(t.sentHome(), t.to());   // the knocked-home token comes back\n            for (Jump j : t.jumps()) jumpsTaken.merge(j.kind(), -1, Integer::sum);\n            if (t.kind() == TurnKind.HELD) sittingOut.merge(t.playerId(), 1, Integer::sum);   // that held turn is owed again\n            else if (t.kind() == TurnKind.PLAYED &amp;&amp; !t.won() &amp;&amp; board.holdAt(t.to()) &gt; 0) sittingOut.remove(t.playerId());\n            if (t.won()) {                                           // un-finish: back to the head of the queue\n                finishOrder.remove(finishOrder.size() - 1);\n                turns.addFirst(t.playerId());\n                status = GameStatus.IN_PROGRESS;\n            } else if (!t.extraTurn() &amp;&amp; t.playerId().equals(turns.peekLast())) {\n                turns.addFirst(turns.pollLast());                    // un-rotate, unless somebody has left since\n            }\n            extrasInARow = extrasBehind(turns.peek());               // read the counter back off the log\n            return t;\n        } finally { lock.unlock(); }\n    }\n\n    /** How many extra throws in a row this player had already had, counted backwards off the log. */\n    private int extrasBehind(String playerId) {\n        int n = 0;\n        for (int i = log.size() - 1; i &gt;= 0; i--) {\n            Turn x = log.get(i);\n            if (!x.playerId().equals(playerId) || !x.extraTurn()) break;\n            n++;\n        }\n        return n;\n    }\n\n    /**\n     * A player quits or drops off the network. They come out of the turn queue, so the turn passes on at once\n     * if it was theirs; their token and their rows in the log stay, because history must keep telling the\n     * truth. When one player is left standing, the game is FINISHED -- and if nobody has finished yet, that\n     * player wins by default. Removing from the middle of the deque is O(n) in the number of PLAYERS, under ten.\n     *\n     * @throws NoSuchElementException if that player is not at this table\n     */\n    void leave(String playerId) {\n        lock.lock();\n        try {\n            if (status == GameStatus.FINISHED) throw new IllegalStateException(&quot;the game is &quot; + status);\n            boolean wasDue = playerId.equals(turns.peek());\n            if (!turns.remove(playerId)) throw new NoSuchElementException(&quot;not at this table: &quot; + playerId);\n            if (wasDue) extrasInARow = 0;                            // only the player on turn has a streak going\n            sittingOut.remove(playerId);\n            if (turns.size() == 1) {\n                if (finishOrder.isEmpty()) finishOrder.add(turns.peek());\n                status = GameStatus.FINISHED;\n            }\n        } finally { lock.unlock(); }\n    }\n\n    /** Play the whole game by itself, for a demo or a simulation. Stops at the win or at maxTurns. */\n    Player playOut(int maxTurns) {\n        for (int i = 0; i &lt; maxTurns; i++) {\n            String due = whoseTurn();\n            if (due == null) break;\n            roll(due);\n        }\n        return winner();\n    }\n\n    /** Where this token is: 0 means it has not entered the board yet. O(1). */\n    int positionOf(String playerId) {\n        lock.lock();\n        try {\n            Integer p = positions.get(playerId);\n            if (p == null) throw new NoSuchElementException(&quot;no such player: &quot; + playerId);\n            return p;\n        } finally { lock.unlock(); }\n    }\n    /** Whose turn it is, or null once the game is finished. O(1): the head of the queue. */\n    String whoseTurn() { lock.lock(); try { return status == GameStatus.FINISHED ? null : turns.peek(); } finally { lock.unlock(); } }\n    /** WAITING, IN_PROGRESS or FINISHED. */\n    GameStatus status() { lock.lock(); try { return status; } finally { lock.unlock(); } }\n    /** First place, or null while nobody has finished. */\n    Player winner() {\n        lock.lock();\n        try {\n            if (finishOrder.isEmpty()) return null;\n            for (Player p : roster) if (p.id().equals(finishOrder.get(0))) return p;\n            return null;\n        } finally { lock.unlock(); }\n    }\n    /** The places so far, first place first. When a table plays on, whoever is still playing at the end comes last. */\n    List&lt;String&gt; finishOrder() { lock.lock(); try { return List.copyOf(finishOrder); } finally { lock.unlock(); } }\n    /** Every token&#x27;s cell, in join order, from one instant. */\n    Map&lt;String, Integer&gt; positions() { lock.lock(); try { return new LinkedHashMap&lt;&gt;(positions); } finally { lock.unlock(); } }\n    /** The turn order as it stands now, the next player first. */\n    List&lt;String&gt; turnOrder() { lock.lock(); try { return new ArrayList&lt;&gt;(turns); } finally { lock.unlock(); } }\n    /** Everyone at the table. */\n    List&lt;Player&gt; roster() { return roster; }\n    /** Every turn that has been played, oldest first: the audit log, and the input to a replay. */\n    List&lt;Turn&gt; history() { lock.lock(); try { return List.copyOf(log); } finally { lock.unlock(); } }\n    /** How many turns have been played. */\n    int turnNumber() { lock.lock(); try { return turnNo; } finally { lock.unlock(); } }\n    /** How many snakes were bitten and how many ladders climbed, for the scoreboard. */\n    Map&lt;JumpKind, Integer&gt; jumpsTaken() { lock.lock(); try { return new EnumMap&lt;&gt;(jumpsTaken); } finally { lock.unlock(); } }\n\n    /** Tell every observer, outside the lock, and survive one that throws. */\n    private void publish(Turn t) {\n        for (GameObserver o : observers) {\n            try { o.onTurn(id, t); } catch (RuntimeException ex) { System.err.println(&quot;[observer failed] &quot; + ex.getMessage()); }\n        }\n    }\n}\n\n/**\n * The only way to build a Game. There are a dozen knobs and four rules that must always hold (two or more\n * players, unique ids, a legal layout, no loop), so a constructor with a dozen parameters would be unreadable\n * and would check nothing: build() is the single choke point that constructs the board, replays every jump\n * and mine through the board&#x27;s checks (which fail fast on a bad layout), freezes it, and hands Game a world\n * that is already valid. Game&#x27;s constructor is package-private, so an invalid Game cannot be made at all.\n */\nfinal class GameBuilder {\n    private String id = &quot;g1&quot;;\n    private int boardSize = 100, diceCount = 1, faces = 6;\n    private Random rng = new Random();\n    private Dice dice;                                            // set this to override the fair dice\n    private Board board;                                          // set this to override the plain board\n    private MoveStrategy moveRule = new OvershootStays();\n    private ExtraTurnRule extraRule = new NoExtraTurn();\n    private Clock clock = System::currentTimeMillis;\n    private boolean playToLast = false, capture = false;\n    private final List&lt;Jump&gt; jumps = new ArrayList&lt;&gt;();\n    private final Map&lt;Integer, Integer&gt; mines = new LinkedHashMap&lt;&gt;();\n    private final Map&lt;String, Integer&gt; starts = new HashMap&lt;&gt;();\n    private final List&lt;Player&gt; players = new ArrayList&lt;&gt;();\n\n    /** The game id: the key it is stored under, and what decides which server holds it when there are millions. */\n    GameBuilder id(String v) { id = v; return this; }\n    /** How many cells; the last one is the one you must rest on to win. */\n    GameBuilder boardSize(int v) { boardSize = v; return this; }\n    /** How many fair dice, and how many faces each. Ignored if dice(...) is handed in. */\n    GameBuilder dice(int count, int facesPerDie) { diceCount = count; faces = facesPerDie; return this; }\n    /** Seed the randomness so the same game plays out every run. */\n    GameBuilder seed(long seed) { rng = new Random(seed); return this; }\n    /** Hand in the dice yourself: scripted for a test, weighted for a house rule. */\n    GameBuilder dice(Dice d) { dice = d; return this; }\n    /** Hand in a board yourself: a subclass with special cells, for instance. */\n    GameBuilder board(Board b) { board = b; return this; }\n    /** The overshoot rule: stay put (default) or bounce back. */\n    GameBuilder moveRule(MoveStrategy m) { moveRule = m; return this; }\n    /** The extra-turn rule: none (default), on a six, or a capped version of either. */\n    GameBuilder extraTurn(ExtraTurnRule r) { extraRule = r; return this; }\n    /** Where time comes from. A test hands in a fixed instant. */\n    GameBuilder clock(Clock c) { clock = c; return this; }\n    /** One snake or ladder. Validated in build(), not here, so the error names the whole layout. */\n    GameBuilder jump(int from, int to) { jumps.add(new Jump(from, to)); return this; }\n    /** A crocodile takes you exactly five cells back: it is a snake of length five, so it IS a jump. */\n    GameBuilder crocodile(int cell) { return jump(cell, cell - 5); }\n    /** A mine: a token that rests here sits out its next `turns` turns. */\n    GameBuilder mine(int cell, int turns) { mines.put(cell, turns); return this; }\n    /** Landing on a cell another token is on sends that token back to its start (off: tokens may share a cell). */\n    GameBuilder capture() { capture = true; return this; }\n    /** Where one player&#x27;s token starts (default 0, off the board): PhonePe&#x27;s input gives each player a start cell. */\n    GameBuilder startAt(String playerId, int cell) { starts.put(playerId, cell); return this; }\n    /** Play on after the first finisher, for second and third place, until one player is left. */\n    GameBuilder playToLast() { playToLast = true; return this; }\n    /** One player, in turn order. */\n    GameBuilder player(String playerId, String name) { players.add(new Player(playerId, name)); return this; }\n\n    /**\n     * Build a valid game or throw. Checks: at least two players, no duplicate ids, every start cell on the board,\n     * and every jump and mine legal on this board (on the board, one thing per cell, nothing starting on the\n     * winning cell, no loop).\n     */\n    Game build() {\n        if (players.size() &lt; 2) throw new IllegalArgumentException(&quot;a game needs at least two players: &quot; + players.size());\n        Set&lt;String&gt; ids = new HashSet&lt;&gt;();\n        for (Player p : players) if (!ids.add(p.id())) throw new IllegalArgumentException(&quot;duplicate player id: &quot; + p.id());\n        Board b = board != null ? board : new Board(boardSize);\n        for (Map.Entry&lt;String, Integer&gt; st : starts.entrySet())\n            if (!ids.contains(st.getKey()) || st.getValue() &lt; 0 || st.getValue() &gt;= b.size())\n                throw new IllegalArgumentException(&quot;a start must be a player&#x27;s, on the board, before the last cell: &quot; + st);\n        for (Jump j : jumps) b.addJump(j);                        // fails fast, before a Game exists\n        for (Map.Entry&lt;Integer, Integer&gt; m : mines.entrySet()) b.addMine(m.getKey(), m.getValue());\n        b.freeze();                                               // from here on the layout cannot change\n        Dice d = dice != null ? dice : new StandardDice(diceCount, faces, rng);\n        return new Game(id, b, d, moveRule, extraRule, clock, playToLast, capture, players, starts);\n    }\n}\n\n/**\n * The thin caller: it finds the game and calls it. It owns no game state and takes no lock of its own, which\n * is exactly why a million tables can play at the same time -- each game&#x27;s own lock is the only place anyone waits.\n */\nfinal class GameServer {\n    private final Map&lt;String, Game&gt; games = new ConcurrentHashMap&lt;&gt;();\n    /** Put a built game on the server. Refused if the id is taken: a second table must never replace the first. */\n    Game host(Game g) {\n        if (games.putIfAbsent(g.id(), g) != null) throw new IllegalArgumentException(&quot;a game with id &quot; + g.id() + &quot; is already hosted&quot;);\n        return g;\n    }\n    /** The game, or an error. O(1). */\n    Game game(String gameId) {\n        Game g = games.get(gameId);\n        if (g == null) throw new NoSuchElementException(&quot;no such game: &quot; + gameId);\n        return g;\n    }\n    /** One roll from one phone. The server does nothing but route: the game decides whether it is allowed. */\n    Turn roll(String gameId, String playerId) { return game(gameId).roll(playerId); }\n    /** How many tables are live. */\n    int size() { return games.size(); }\n}\n\n/**\n * Proof it works: the two tricky rules checked by hand, a seeded game played to a win, a ladder that lands on a\n * snake head (the jumps chain), three sixes that cancel, and four phones hammering roll at the same instant with\n * the log coming out exactly consistent.\n */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        // the two rules that are always asked about are pure functions: check them without a game at all\n        MoveStrategy stay = new OvershootStays(), bounce = new BounceBack();\n        System.out.println(&quot;at 98, roll 5, board 100 -&gt; stays at &quot; + stay.landingCell(98, 5, 100)\n            + &quot; (the roll is wasted); bounce-back goes to &quot; + bounce.landingCell(98, 5, 100));\n        System.out.println(&quot;at 98, roll 2, board 100 -&gt; lands exactly on &quot; + stay.landingCell(98, 2, 100) + &quot; and wins&quot;);\n\n        // a seeded game: the same run every time, which is what makes a bug reproducible\n        Game g = new GameBuilder().id(&quot;table-1&quot;).boardSize(100).dice(1, 6).seed(7)\n            .jump(2, 38).jump(7, 14).jump(8, 31).jump(15, 26).jump(21, 42).jump(28, 84).jump(36, 44)\n            .jump(51, 67).jump(71, 91).jump(78, 98).jump(87, 94)                       // ladders\n            .jump(16, 6).jump(46, 25).jump(49, 11).jump(62, 19).jump(64, 60).jump(74, 53)\n            .jump(89, 68).jump(92, 88).jump(95, 75).jump(99, 80)                        // snakes\n            .player(&quot;alice&quot;, &quot;Alice&quot;).player(&quot;bob&quot;, &quot;Bob&quot;).player(&quot;carol&quot;, &quot;Carol&quot;)\n            .build();\n        g.addObserver(new Highlights());\n        g.start();\n        System.out.println(&quot;turn order: &quot; + g.turnOrder() + &quot;, board of &quot; + g.board().size()\n            + &quot; cells with &quot; + g.board().jumpCount() + &quot; jumps&quot;);\n        Player w = g.playOut(2000);\n        System.out.println(&quot;winner: &quot; + (w == null ? &quot;nobody yet&quot; : w.name()) + &quot; in &quot; + g.turnNumber()\n            + &quot; turns; positions &quot; + g.positions());\n        System.out.println(&quot;snakes and ladders taken: &quot; + g.jumpsTaken());\n        try { g.roll(&quot;alice&quot;); } catch (IllegalStateException e) { System.out.println(&quot;after the win: &quot; + e.getMessage()); }\n\n        // the jumps chain: a ladder whose top is a snake head takes the snake too -- and a loop is refused at build()\n        Game chain = new GameBuilder().id(&quot;chain&quot;).boardSize(50).dice(new ScriptedDice(4))\n            .jump(4, 20).jump(20, 3).player(&quot;p1&quot;, &quot;P1&quot;).player(&quot;p2&quot;, &quot;P2&quot;).build();\n        chain.start();\n        Turn t = chain.roll(&quot;p1&quot;);\n        System.out.println(&quot;ladder 4-&gt;20 whose top is snake 20-&gt;3: token rests on &quot; + t.to() + &quot; after &quot; + t.jumps().size() + &quot; jumps&quot;);\n        try { new GameBuilder().jump(10, 30).jump(30, 10).player(&quot;p1&quot;, &quot;P1&quot;).player(&quot;p2&quot;, &quot;P2&quot;).build(); }\n        catch (IllegalArgumentException e) { System.out.println(&quot;a layout whose jumps loop is refused: &quot; + e.getMessage()); }\n\n        // a six rolls again, but three in a row cancel all three and the turn passes: a rule wrapped in a rule\n        Game sixes = new GameBuilder().id(&quot;sixes&quot;).boardSize(60).dice(new ScriptedDice(6, 6, 6, 2))\n            .extraTurn(new CappedExtraTurn(new ExtraTurnOnMax(6), 3))\n            .player(&quot;p1&quot;, &quot;P1&quot;).player(&quot;p2&quot;, &quot;P2&quot;).build();\n        sixes.addObserver(new Commentary());\n        sixes.start();\n        sixes.roll(&quot;p1&quot;); sixes.roll(&quot;p1&quot;); sixes.roll(&quot;p1&quot;);\n        System.out.println(&quot;three sixes: p1 is back on &quot; + sixes.positionOf(&quot;p1&quot;)\n            + &quot; and the turn has passed to &quot; + sixes.whoseTurn());\n\n        // four phones press roll at the same instant, over and over: only the player on turn may move\n        Game race = new GameBuilder().id(&quot;race&quot;).boardSize(400).dice(new ScriptedDice(true, 3, 5, 2, 6, 1, 4))\n            .jump(12, 40).jump(60, 22).jump(120, 180).jump(200, 90)\n            .player(&quot;p0&quot;, &quot;P0&quot;).player(&quot;p1&quot;, &quot;P1&quot;).player(&quot;p2&quot;, &quot;P2&quot;).player(&quot;p3&quot;, &quot;P3&quot;).build();\n        race.start();\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;int[]&gt;&gt; fs = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 8; i++) {\n            final int seed = i;\n            fs.add(pool.submit(() -&gt; {\n                go.await();\n                int ok = 0, refused = 0;\n                Random r = new Random(seed);\n                for (int k = 0; k &lt; 50; k++) {\n                    try { race.roll(&quot;p&quot; + r.nextInt(4)); ok++; }\n                    catch (OutOfTurnException e) { refused++; }\n                    catch (IllegalStateException e) { refused++; }\n                }\n                return new int[] { ok, refused };\n            }));\n        }\n        go.countDown();\n        int ok = 0, refused = 0;\n        for (Future&lt;int[]&gt; f : fs) { int[] r = f.get(); ok += r[0]; refused += r[1]; }\n        pool.shutdown();\n        List&lt;Turn&gt; log = race.history();\n        Map&lt;String, Integer&gt; replay = new LinkedHashMap&lt;&gt;();\n        for (Player p : race.roster()) replay.put(p.id(), 0);\n        boolean sane = log.size() == ok;\n        for (int i = 0; i &lt; log.size(); i++) {\n            Turn x = log.get(i);\n            if (x.number() != i + 1) sane = false;                                  // turn numbers with no gaps\n            if (replay.get(x.playerId()) != x.from()) sane = false;                 // each token continues where it was\n            replay.put(x.playerId(), x.to());\n        }\n        System.out.println(&quot;400 roll attempts from 8 threads: accepted=&quot; + ok + &quot; refused=&quot; + refused\n            + &quot;, log rows=&quot; + log.size() + &quot;, replay matches live positions: &quot; + replay.equals(race.positions())\n            + &quot;, log consistent: &quot; + sane);\n        if (!sane || !replay.equals(race.positions())) throw new AssertionError(&quot;the game lost or doubled a turn&quot;);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: the two house rules they change mid-round -- both are one small MoveStrategy, and Game is untouched\n/**\n * &quot;You win by reaching OR passing the last cell.&quot; One line: clamp the landing to the last cell. The game&#x27;s\n * win check is still `to == boardSize`, so nothing in the turn loop is edited -- that is the whole point of\n * having pulled the rule out in move 3.\n */\nfinal class ReachOrPass implements MoveStrategy {\n    @Override public int landingCell(int from, int roll, int boardSize) { return Math.min(from + roll, boardSize); }\n}\n\n/**\n * A common house rule: a token sits off the board on cell 0 and only a six brings it on. It is a WRAPPER, not a\n * copy -- it adds the entry gate to whatever rule you already had for the far end of the board, so &quot;must throw a\n * six to start&quot; and &quot;bounce back off 100&quot; compose for free. This is the Decorator of move 3 again, on a different\n * interface.\n */\nfinal class MustRollSixToEnter implements MoveStrategy {\n    private final MoveStrategy inner;\n    private final int entryRoll;\n    /** @param inner the rule for a token already on the board, @param entryRoll the throw that lets you on (6). */\n    MustRollSixToEnter(MoveStrategy inner, int entryRoll) { this.inner = inner; this.entryRoll = entryRoll; }\n    MustRollSixToEnter(MoveStrategy inner) { this(inner, 6); }\n    @Override public int landingCell(int from, int roll, int boardSize) {\n        if (from == 0 &amp;&amp; roll != entryRoll) return 0;                  // still off the board: the throw is wasted\n        return inner.landingCell(from, roll, boardSize);\n    }\n}\n\n// ---- ext: several dice -- move by the sum, the highest face or the lowest\n/** How several dice become one number of steps. */\nenum Combine { SUM, MAX, MIN }\n\n/**\n * n dice thrown together and turned into steps by a rule: the sum (two dice give 2 to 12), the highest face or\n * the lowest. Each die is thrown by the one-die Dice it was handed -- a seeded StandardDice in play, a\n * ScriptedDice in a test -- and the result is just another Dice, so the game does not change.\n */\nfinal class CombinedDice implements Dice {\n    private final int count;\n    private final Dice oneDie;\n    private final Combine how;\n    /** @param count how many dice, @param oneDie throws a single die, @param how SUM, MAX or MIN of the faces. */\n    CombinedDice(int count, Dice oneDie, Combine how) {\n        if (count &lt; 1) throw new IllegalArgumentException(&quot;at least one die: &quot; + count);\n        this.count = count; this.oneDie = oneDie; this.how = how;\n    }\n    @Override public int roll() {\n        int sum = 0, max = Integer.MIN_VALUE, min = Integer.MAX_VALUE;\n        for (int i = 0; i &lt; count; i++) {\n            int face = oneDie.roll();\n            sum += face; max = Math.max(max, face); min = Math.min(min, face);\n        }\n        return how == Combine.SUM ? sum : how == Combine.MAX ? max : min;\n    }\n}\n\n// ---- ext: the board from input -- the machine-coding format, and a random board that is valid and can be won\n/**\n * Reads the classic machine-coding input: the number of snakes, then one &quot;head tail&quot; pair each; the number of\n * ladders, then one &quot;start end&quot; pair each; the number of players, then one name each. Every pair goes into the\n * same builder, so a bad board is refused by the same checks in build(), with the same messages.\n */\nfinal class BoardInput {\n    /** Parse the input into a builder; the caller still chooses the dice and the rules, then calls build(). */\n    static GameBuilder read(Scanner in) {\n        GameBuilder b = new GameBuilder();\n        for (int s = in.nextInt(); s &gt; 0; s--) {\n            int head = in.nextInt(), tail = in.nextInt();\n            if (tail &gt;= head) throw new IllegalArgumentException(&quot;a snake must go down: &quot; + head + &quot; &quot; + tail);\n            b.jump(head, tail);\n        }\n        for (int l = in.nextInt(); l &gt; 0; l--) {\n            int start = in.nextInt(), end = in.nextInt();\n            if (end &lt;= start) throw new IllegalArgumentException(&quot;a ladder must go up: &quot; + start + &quot; &quot; + end);\n            b.jump(start, end);\n        }\n        for (int p = in.nextInt(); p &gt; 0; p--) { String name = in.next(); b.player(name, name); }\n        return b;\n    }\n}\n\n/**\n * PhonePe&#x27;s version reads a configuration (YAML or JSON there; a Java Properties file here, the same map of keys):\n * N players, a BS x BS board, S snakes, L ladders, D dice. It holds counts, not positions, so the board comes from\n * RandomBoard. The &quot;manual override&quot; the interviewer uses to test edge cases is the builder&#x27;s own seams: a\n * ScriptedDice for the throws and startAt for each token&#x27;s starting cell.\n */\nfinal class GameConfig {\n    /** keys: players=Gaurav,Sagar  boardSize=10 (a 10 x 10 board)  snakes=9  ladders=8  dice=2 */\n    static GameBuilder from(Properties c, Random rng) {\n        int cells = Integer.parseInt(c.getProperty(&quot;boardSize&quot;, &quot;10&quot;));\n        cells *= cells;\n        GameBuilder b = new GameBuilder().boardSize(cells)\n            .board(RandomBoard.generate(cells, Integer.parseInt(c.getProperty(&quot;snakes&quot;, &quot;0&quot;)),\n                                        Integer.parseInt(c.getProperty(&quot;ladders&quot;, &quot;0&quot;)), rng))\n            .dice(Integer.parseInt(c.getProperty(&quot;dice&quot;, &quot;1&quot;)), 6).seed(rng.nextLong());   // D dice, added up\n        for (String name : c.getProperty(&quot;players&quot;).split(&quot;,&quot;)) b.player(name.trim(), name.trim());\n        return b;\n    }\n}\n\n/**\n * A random board, valid by construction: propose a random pair of cells and keep it only if the board accepts\n * it, so every placing rule (on the board, one thing per cell, nothing on the last cell, no loop) lives in ONE\n * place, Board.addJump. Then check the board can be won at all, with a breadth-first search over the cells:\n * start at 0, try every throw, follow the jumps, and see whether the last cell is ever reached.\n */\nfinal class RandomBoard {\n    /** A board of `size` cells with exactly this many snakes and ladders, from a seeded Random. */\n    static Board generate(int size, int snakes, int ladders, Random rng) {\n        for (int attempt = 0; attempt &lt; 100; attempt++) {\n            Board b = new Board(size);\n            int s = snakes, l = ladders;\n            for (int tries = 0; s + l &gt; 0 &amp;&amp; tries &lt; 100 * size; tries++) {\n                int a = 2 + rng.nextInt(size - 2), c = 2 + rng.nextInt(size - 2);   // cells 2..size-1\n                if (a == c || (a &gt; c ? s == 0 : l == 0)) continue;                 // a &gt; c is a snake\n                try { b.addJump(new Jump(a, c)); } catch (IllegalArgumentException refused) { continue; }\n                if (a &gt; c) s--; else l--;\n            }\n            if (s + l == 0 &amp;&amp; winnable(b, 6)) return b;\n        }\n        throw new IllegalArgumentException(&quot;cannot place &quot; + snakes + &quot; snakes and &quot; + ladders + &quot; ladders on &quot; + size + &quot; cells&quot;);\n    }\n\n    /** Can a token starting on 0 ever rest on the last cell? Breadth-first over the cells: O(cells x faces). */\n    static boolean winnable(Board b, int maxRoll) {\n        boolean[] seen = new boolean[b.size() + 1];\n        ArrayDeque&lt;Integer&gt; queue = new ArrayDeque&lt;&gt;(List.of(0));\n        seen[0] = true;\n        while (!queue.isEmpty()) {\n            int cell = queue.poll();\n            if (cell == b.size()) return true;\n            for (int r = 1; r &lt;= maxRoll &amp;&amp; cell + r &lt;= b.size(); r++) {         // an overshoot is wasted\n                int to = cell + r;\n                for (Jump j = b.jumpAt(to); j != null; j = b.jumpAt(to)) to = j.end();\n                if (!seen[to]) { seen[to] = true; queue.add(to); }\n            }\n        }\n        return false;\n    }\n}\n\n// ---- ext: turn timers -- a player who does not roll in time forfeits, and the game is never blocked\n/**\n * Thirty seconds to roll. It is wired in as an observer, so every turn tells it who is on the clock now,\n * and a sweeper thread (or the next request, which is cheaper) calls forfeitIfLate. It reads the injected\n * Clock and never the wall clock, so a test can make thirty seconds pass instantly. Who is on the clock and\n * since when are ONE value written in one step: a sweeper can never pair the new player with the old start time.\n */\nfinal class TurnTimer {\n    /** Who is on the clock, and since when. Immutable, so it is always a matching pair. */\n    private record Deadline(String playerId, long sinceMs) {}\n    private final Clock clock;\n    private final long limitMs;\n    private volatile Deadline current;                                 // one write swaps both halves at once\n    TurnTimer(Clock clock, long limitMs) { this.clock = clock; this.limitMs = limitMs; }\n    /** Start the clock for whoever is now due. Wire it as an observer: game.addObserver((id, t) -&gt; timer.watch(game.whoseTurn())). */\n    void watch(String playerId) { current = new Deadline(playerId, clock.nowMs()); }\n    /** Forfeit the turn if the clock has run out. Returns true if it did. Safe to call from anywhere. */\n    boolean forfeitIfLate(Game g) {\n        Deadline d = current;                                          // read once: a pair that belongs together\n        if (d == null || clock.nowMs() - d.sinceMs() &lt; limitMs) return false;\n        try { g.forfeitTurn(d.playerId()); return true; }\n        catch (IllegalStateException e) { return false; }              // somebody already moved: nothing to do\n    }\n}\n\n// ---- ext: many servers -- every roll for one game goes to the one server that holds it\n/**\n * Scaling out without touching Game: the game id picks the server, so every request for one table lands in the\n * same process, and that game&#x27;s own lock is still the whole concurrency answer. floorMod, because a hashCode can\n * be negative. Adding a server here moves most games; consistent hashing (servers placed on a ring, so a new one\n * takes games only from its neighbour) moves few -- name it if they ask about growing the fleet.\n */\nfinal class GameRouter {\n    private final List&lt;GameServer&gt; servers;\n    GameRouter(List&lt;GameServer&gt; servers) { this.servers = List.copyOf(servers); }\n    /** The one server that owns this game: the same id always gives the same server. */\n    GameServer serverFor(String gameId) { return servers.get(Math.floorMod(gameId.hashCode(), servers.size())); }\n}\n\n// ---- ext: online play -- a retried request must move the token once\n/**\n * The same phone pressing roll twice, or a network retry, must move the token once. The request id is the key:\n * the first call claims it with ONE atomic putIfAbsent, then plays the turn OUTSIDE the map&#x27;s lock; every later\n * copy finds the claim and waits for the same Turn. Playing the turn inside computeIfAbsent would hold a lock\n * of the map while the game told its screens, so one slow screen could stall another table&#x27;s roll.\n * A failed turn removes its claim, so the client can simply retry. The honest caveat: in one process a crash\n * loses the record; the real fix is the database version below, where the turn row and the request id are\n * written in one transaction.\n */\nfinal class IdempotentRolls {\n    private final ConcurrentHashMap&lt;String, CompletableFuture&lt;Turn&gt;&gt; byRequest = new ConcurrentHashMap&lt;&gt;();\n    /** Play this turn once, however many times the request arrives; every copy gets the first one&#x27;s Turn. */\n    Turn roll(Game g, String playerId, String requestId) {\n        CompletableFuture&lt;Turn&gt; mine = new CompletableFuture&lt;&gt;();\n        CompletableFuture&lt;Turn&gt; first = byRequest.putIfAbsent(requestId, mine);   // the claim: one atomic step\n        if (first != null) return first.join();                                 // a copy: wait for the first answer\n        try {\n            Turn t = g.roll(playerId);                                          // no lock of the map is held here\n            mine.complete(t);\n            return t;\n        } catch (RuntimeException e) {\n            byRequest.remove(requestId, mine);                                  // nothing happened: a retry may play\n            mine.completeExceptionally(e);\n            throw e;\n        }\n    }\n}\n\n// ---- ext: persistence -- the game becomes a row, and the lock becomes a conditional UPDATE\n/**\n * Beyond one process the turn number is the version: a turn is accepted only if the stored game is still on\n * the turn the caller thinks it is on. Two servers applying the same turn means one of them updates zero\n * rows and retries with fresh state -- the database doing exactly what the ReentrantLock did in one process.\n *\n *   UPDATE game SET turn_no = turn_no + 1, current_player = ?, positions = ?\n *    WHERE game_id = ? AND turn_no = ?           -- 0 rows updated = somebody else moved first\n *   INSERT INTO turn (game_id, turn_no, request_id, player, roll, from_cell, to_cell) VALUES (...)\n *                                                -- UNIQUE (game_id, request_id) makes the retry safe\n */\ninterface GameRepository {\n    /** Append a turn only if the game is still at expectedTurnNo. False means: re-read and try again. */\n    boolean applyTurn(String gameId, int expectedTurnNo, Turn t);\n    /** The stored turn number, which is the version a writer must match. */\n    int turnNoOf(String gameId);\n}\n\n/** A map standing in for the table, with the same compare-and-set semantics so the seam can be tested. */\nfinal class InMemoryGameRepository implements GameRepository {\n    private final Map&lt;String, List&lt;Turn&gt;&gt; rows = new ConcurrentHashMap&lt;&gt;();\n    @Override public synchronized boolean applyTurn(String gameId, int expectedTurnNo, Turn t) {\n        List&lt;Turn&gt; ts = rows.computeIfAbsent(gameId, k -&gt; new ArrayList&lt;&gt;());\n        if (ts.size() != expectedTurnNo) return false;                 // the WHERE clause failed: 0 rows\n        ts.add(t);\n        return true;\n    }\n    @Override public synchronized int turnNoOf(String gameId) { return rows.getOrDefault(gameId, List.of()).size(); }\n}\n\n/** Runs every extension above, and the follow-ups that live in Main.java, so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        // reach-or-pass: 97 plus a 5 wins instead of being wasted\n        Game rp = new GameBuilder().id(&quot;rp&quot;).boardSize(100).moveRule(new ReachOrPass())\n            .dice(new ScriptedDice(true, 6))                       // a six, over and over\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        rp.start();\n        for (int i = 0; i &lt; 34 &amp;&amp; rp.status() != GameStatus.FINISHED; i++) rp.roll(rp.whoseTurn());\n        System.out.println(&quot;reach-or-pass: winner &quot; + rp.winner().id() + &quot; resting on &quot; + rp.positionOf(rp.winner().id()));\n\n        // &quot;you must throw a six to get on the board&quot;, wrapped around the ordinary rule\n        Game six = new GameBuilder().id(&quot;six&quot;).boardSize(50)\n            .moveRule(new MustRollSixToEnter(new OvershootStays()))\n            .dice(new ScriptedDice(3, 4, 6, 2))\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        six.start();\n        System.out.println(&quot;a throws a 3 while off the board: still on &quot; + six.roll(&quot;a&quot;).to()\n            + &quot;; b throws a 4: still on &quot; + six.roll(&quot;b&quot;).to());\n        System.out.println(&quot;a throws a six: on the board at &quot; + six.roll(&quot;a&quot;).to()\n            + &quot;; next turn b&#x27;s 2 still leaves b on &quot; + six.roll(&quot;b&quot;).to());\n\n        // several dice: the same three faces, combined three ways\n        for (Combine how : Combine.values())\n            System.out.println(&quot;three dice showing 3, 5, 2 with &quot; + how + &quot;: move &quot; + new CombinedDice(3, new ScriptedDice(3, 5, 2), how).roll());\n\n        // the board from the classic input, and a random board that is valid and can be won\n        Game fromInput = BoardInput.read(new Scanner(&quot;2  62 5  33 6   2  2 37  27 46   2 Gaurav Sagar&quot;))\n            .dice(new ScriptedDice(true, 2)).build();\n        fromInput.start();\n        System.out.println(&quot;from input: &quot; + fromInput.board().jumpCount() + &quot; jumps, players &quot; + fromInput.turnOrder()\n            + &quot;; Gaurav throws a 2 and rests on &quot; + fromInput.roll(&quot;Gaurav&quot;).to());\n        Board rb = RandomBoard.generate(100, 8, 8, new Random(42));\n        System.out.println(&quot;random board: &quot; + rb.jumpCount() + &quot; jumps, winnable &quot; + RandomBoard.winnable(rb, 6));\n        Properties cfg = new Properties();\n        cfg.load(new java.io.StringReader(&quot;players=Gaurav,Sagar\\nboardSize=10\\nsnakes=9\\nladders=8\\ndice=2\\n&quot;));\n        Game fromConfig = GameConfig.from(cfg, new Random(3)).dice(new ScriptedDice(3)).startAt(&quot;Gaurav&quot;, 97).build();\n        fromConfig.start();\n        System.out.println(&quot;from config: &quot; + fromConfig.board().size() + &quot; cells, &quot; + fromConfig.board().jumpCount()\n            + &quot; jumps; the override starts Gaurav on 97 and throws a 3: &quot; + fromConfig.roll(&quot;Gaurav&quot;).describe());\n\n        // PhonePe&#x27;s board: a crocodile (five back), a mine (sit out two turns), and landing on a token sends it home\n        ScriptedDice ppDice = new ScriptedDice(9, 3, 9, 3, 1);       // five throws for seven turns: held turns throw nothing\n        Game pp = new GameBuilder().id(&quot;pp&quot;).boardSize(50).crocodile(12).mine(9, 2).capture()\n            .dice(ppDice).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        pp.start();\n        System.out.println(&quot;PhonePe&#x27;s board: a crocodile on 12, a mine on 9 (two turns), capture on&quot;);\n        for (int i = 0; i &lt; 7; i++) System.out.println(&quot;  &quot; + pp.roll(pp.whoseTurn()).describe());\n        System.out.println(&quot;  seven turns took &quot; + ppDice.used() + &quot; throws; positions &quot; + pp.positions());\n\n        // play on for second place\n        Game last = new GameBuilder().id(&quot;last&quot;).boardSize(10).playToLast().dice(new ScriptedDice(true, 5))\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).player(&quot;c&quot;, &quot;C&quot;).build();\n        last.start();\n        last.playOut(20);\n        System.out.println(&quot;play to the last: places &quot; + last.finishOrder() + &quot;, still playing at the end: &quot;\n            + last.turnOrder() + &quot;, status &quot; + last.status());\n\n        // turn timers: thirty seconds on an injected clock, moved by hand\n        long[] now = { 1_700_000_000_000L };\n        Game tt = new GameBuilder().id(&quot;tt&quot;).boardSize(50).clock(() -&gt; now[0]).dice(new ScriptedDice(true, 3))\n            .player(&quot;slow&quot;, &quot;Slow&quot;).player(&quot;quick&quot;, &quot;Quick&quot;).build();\n        TurnTimer timer = new TurnTimer(() -&gt; now[0], 30_000);\n        tt.addObserver((gid, turn) -&gt; timer.watch(tt.whoseTurn()));      // re-arm after every turn\n        tt.start();\n        timer.watch(tt.whoseTurn());\n        now[0] += 10_000;\n        System.out.println(&quot;timer after 10s: forfeited=&quot; + timer.forfeitIfLate(tt) + &quot;, still &quot; + tt.whoseTurn() + &quot;&#x27;s turn&quot;);\n        now[0] += 25_000;\n        System.out.println(&quot;timer after 35s: forfeited=&quot; + timer.forfeitIfLate(tt) + &quot;, now &quot; + tt.whoseTurn() + &quot;&#x27;s turn&quot;);\n\n        // many servers: the game id picks the server, the same one every time\n        GameRouter router = new GameRouter(List.of(new GameServer(), new GameServer(), new GameServer()));\n        GameServer home = router.serverFor(&quot;table-42&quot;);\n        home.host(new GameBuilder().id(&quot;table-42&quot;).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build());\n        System.out.println(&quot;router: table-42 lives on the same server every time: &quot; + (router.serverFor(&quot;table-42&quot;) == home)\n            + &quot;, and that server finds it: &quot; + home.game(&quot;table-42&quot;).id());\n\n        // online play: a retried request must move the token once\n        Game idem = new GameBuilder().id(&quot;idem&quot;).boardSize(50).dice(new ScriptedDice(true, 4))\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        idem.start();\n        IdempotentRolls once = new IdempotentRolls();\n        Turn first = once.roll(idem, &quot;a&quot;, &quot;req-1&quot;);\n        Turn again = once.roll(idem, &quot;a&quot;, &quot;req-1&quot;);\n        System.out.println(&quot;the same request id twice: same turn=&quot; + (first == again)\n            + &quot;, a is on &quot; + idem.positionOf(&quot;a&quot;) + &quot; and the log has &quot; + idem.turnNumber() + &quot; row&quot;);\n\n        // persistence: the conditional update refuses the second writer\n        GameRepository repo = new InMemoryGameRepository();\n        Turn t1 = idem.history().get(0);\n        System.out.println(&quot;repository: first write=&quot; + repo.applyTurn(&quot;idem&quot;, 0, t1)\n            + &quot;, the same write again=&quot; + repo.applyTurn(&quot;idem&quot;, 0, t1)\n            + &quot;, stored turns=&quot; + repo.turnNoOf(&quot;idem&quot;));\n\n        // undo, and a player who quits: the last one standing wins by default\n        Game q = new GameBuilder().id(&quot;quit&quot;).boardSize(30).dice(new ScriptedDice(true, 3))\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).player(&quot;c&quot;, &quot;C&quot;).build();\n        q.start();\n        q.roll(&quot;a&quot;);\n        String after = &quot;a on &quot; + q.positionOf(&quot;a&quot;) + &quot;, &quot; + q.whoseTurn() + &quot; due&quot;;\n        q.undoLastTurn();\n        System.out.println(&quot;after a&#x27;s turn: &quot; + after + &quot;   after undo: a on &quot; + q.positionOf(&quot;a&quot;)\n            + &quot;, &quot; + q.whoseTurn() + &quot; due, log rows &quot; + q.turnNumber());\n        q.roll(&quot;a&quot;);\n        q.leave(&quot;b&quot;);\n        System.out.println(&quot;b quits while due: the turn goes straight to &quot; + q.whoseTurn() + &quot;, queue &quot; + q.turnOrder());\n        q.leave(&quot;a&quot;);\n        System.out.println(&quot;a quits too: &quot; + q.status() + &quot;, winner by default &quot; + q.winner().name());\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// Targeted failure tests: each one proves a claim the design makes on page 02, move 9, or on a follow-up.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n\n    /** The classic hundred-cell layout, so several tests can share one board. */\n    static GameBuilder classic(String id) {\n        return new GameBuilder().id(id).boardSize(100)\n            .jump(2, 38).jump(7, 14).jump(28, 84).jump(51, 67).jump(78, 98)\n            .jump(16, 6).jump(46, 25).jump(62, 19).jump(95, 75).jump(99, 80);\n    }\n\n    public static void main(String[] args) throws Exception {\n        // 1. four phones press roll over and over at the same instant. Only the player on turn may move,\n        //    the log must have no gap and no double, and a refused request must not even cost a die roll.\n        ScriptedDice shared = new ScriptedDice(true, 3, 5, 2, 6, 1, 4);\n        Game race = new GameBuilder().id(&quot;race&quot;).boardSize(400).dice(shared)\n            .jump(12, 40).jump(60, 22).jump(120, 180).jump(200, 90)\n            .player(&quot;p0&quot;, &quot;P0&quot;).player(&quot;p1&quot;, &quot;P1&quot;).player(&quot;p2&quot;, &quot;P2&quot;).player(&quot;p3&quot;, &quot;P3&quot;).build();\n        race.start();\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;int[]&gt;&gt; fs = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 8; i++) {\n            final int seed = i;\n            fs.add(pool.submit(() -&gt; {\n                go.await();\n                int ok = 0, refused = 0;\n                Random r = new Random(seed);\n                for (int k = 0; k &lt; 50; k++) {\n                    try { race.roll(&quot;p&quot; + r.nextInt(4)); ok++; }\n                    catch (OutOfTurnException e) { refused++; }\n                }\n                return new int[] { ok, refused };\n            }));\n        }\n        go.countDown();\n        int accepted = 0, refused = 0;\n        for (Future&lt;int[]&gt; f : fs) { int[] r = f.get(); accepted += r[0]; refused += r[1]; }\n        pool.shutdown();\n        List&lt;Turn&gt; log = race.history();\n        check(accepted + refused == 400, &quot;all 400 attempts finished: &quot; + accepted + &quot; accepted, &quot; + refused + &quot; refused&quot;);\n        check(log.size() == accepted, &quot;the log has exactly one row per accepted roll: &quot; + log.size());\n        check(shared.used() == accepted, &quot;a refused roll consumed no dice: &quot; + shared.used() + &quot; rolls for &quot; + accepted + &quot; turns&quot;);\n        Map&lt;String, Integer&gt; replay = new LinkedHashMap&lt;&gt;();\n        for (Player p : race.roster()) replay.put(p.id(), 0);\n        boolean noGap = true, continuous = true;\n        for (int i = 0; i &lt; log.size(); i++) {\n            Turn t = log.get(i);\n            if (t.number() != i + 1) noGap = false;\n            if (replay.get(t.playerId()) != t.from()) continuous = false;\n            replay.put(t.playerId(), t.to());\n        }\n        check(noGap, &quot;the turn numbers run 1..&quot; + log.size() + &quot; with no gap and no repeat&quot;);\n        check(continuous, &quot;every token starts each turn where its previous turn left it: no lost move&quot;);\n        check(replay.equals(race.positions()), &quot;replaying the log gives exactly the live board&quot;);\n        check(race.status() == GameStatus.IN_PROGRESS, &quot;the race did not accidentally finish the game&quot;);\n\n        // 2. eight threads roll for the SAME, correct player at the same instant: exactly one turn happens\n        Game one = classic(&quot;one&quot;).dice(new ScriptedDice(true, 4)).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        one.start();\n        String due = one.whoseTurn();\n        ExecutorService p2 = Executors.newFixedThreadPool(8);\n        CountDownLatch go2 = new CountDownLatch(1);\n        List&lt;Future&lt;Boolean&gt;&gt; gs = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 8; i++)\n            gs.add(p2.submit(() -&gt; { go2.await(); try { one.roll(due); return true; } catch (OutOfTurnException e) { return false; } }));\n        go2.countDown();\n        int moved = 0;\n        for (Future&lt;Boolean&gt; f : gs) if (f.get()) moved++;\n        p2.shutdown();\n        check(moved == 1, &quot;exactly one of eight simultaneous rolls for the same player was accepted&quot;);\n        check(one.positionOf(&quot;a&quot;) == 4 &amp;&amp; one.turnNumber() == 1, &quot;the token moved exactly once, to cell 4&quot;);\n        check(&quot;b&quot;.equals(one.whoseTurn()), &quot;and the turn passed to b exactly once&quot;);\n\n        // 3. a ladder lifts, a snake drags, the jumps CHAIN to a plain cell, and a layout that loops is refused\n        Game j = new GameBuilder().id(&quot;jump&quot;).boardSize(50).dice(new ScriptedDice(4, 9, 16))\n            .jump(4, 20).jump(20, 3).jump(9, 2)\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        j.start();\n        Turn chained = j.roll(&quot;a&quot;);\n        check(chained.jumps().size() == 2 &amp;&amp; chained.jumps().get(0).kind() == JumpKind.LADDER\n              &amp;&amp; chained.jumps().get(1).kind() == JumpKind.SNAKE, &quot;the ladder 4-&gt;20 landed on the snake 20-&gt;3, and both were taken&quot;);\n        check(chained.to() == 3 &amp;&amp; j.positionOf(&quot;a&quot;) == 3, &quot;so the token rests on 3, the first plain cell&quot;);\n        Turn down = j.roll(&quot;b&quot;);\n        check(down.to() == 2 &amp;&amp; down.jumps().size() == 1 &amp;&amp; down.jumps().get(0).kind() == JumpKind.SNAKE, &quot;the snake 9-&gt;2 dragged the token back to 2&quot;);\n        Turn plain = j.roll(&quot;a&quot;);\n        check(plain.to() == 19 &amp;&amp; plain.jumps().isEmpty(), &quot;a plain cell is left alone: 3 + 16 = 19&quot;);\n        try { new GameBuilder().jump(10, 30).jump(30, 20).jump(20, 10).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n              check(false, &quot;a layout whose jumps loop must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;a three-jump loop 10-&gt;30-&gt;20-&gt;10 is refused at build(): &quot; + e.getMessage()); }\n\n        // 4. the overshoot rule: the classic one wastes the roll, bounce-back bounces, and you must rest exactly\n        MoveStrategy stays = new OvershootStays(), bounce = new BounceBack();\n        check(stays.landingCell(98, 5, 100) == 98, &quot;at 98 a roll of 5 is wasted under the classic rule&quot;);\n        check(stays.landingCell(98, 2, 100) == 100, &quot;at 98 a roll of 2 lands exactly on 100&quot;);\n        check(bounce.landingCell(98, 5, 100) == 97, &quot;at 98 a roll of 5 bounces back to 97&quot;);\n        Game over = new GameBuilder().id(&quot;over&quot;).boardSize(20).dice(new ScriptedDice(6, 6, 6, 6, 6, 6, 5))\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        over.start();\n        over.roll(&quot;a&quot;); over.roll(&quot;b&quot;); over.roll(&quot;a&quot;); over.roll(&quot;b&quot;); over.roll(&quot;a&quot;); over.roll(&quot;b&quot;);\n        check(over.positionOf(&quot;a&quot;) == 18, &quot;a is on 18 after three sixes&quot;);\n        Turn wasted = over.roll(&quot;a&quot;);\n        check(wasted.to() == 18 &amp;&amp; over.status() == GameStatus.IN_PROGRESS, &quot;18 + 5 overshoots 20: the token stays and nobody wins&quot;);\n\n        // 5. the win ends the game: it is checked on the RESTING cell, and every later roll is refused\n        Game win = new GameBuilder().id(&quot;win&quot;).boardSize(30).dice(new ScriptedDice(6, 6, 6, 6, 6, 6, 6, 6, 6))\n            .jump(24, 30).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        win.start();\n        Turn t = null;\n        for (int i = 0; i &lt; 9 &amp;&amp; win.status() != GameStatus.FINISHED; i++) t = win.roll(win.whoseTurn());\n        check(win.status() == GameStatus.FINISHED, &quot;the game is FINISHED&quot;);\n        check(t != null &amp;&amp; t.won() &amp;&amp; !t.jumps().isEmpty(), &quot;it was won by a ladder onto the last cell, not by landing on it&quot;);\n        check(win.winner().id().equals(&quot;a&quot;) &amp;&amp; win.positionOf(&quot;a&quot;) == 30, &quot;the winner is a, resting on 30&quot;);\n        check(win.whoseTurn() == null, &quot;nobody is on turn any more&quot;);\n        int turnsAtWin = win.turnNumber();\n        try { win.roll(&quot;b&quot;); check(false, &quot;a roll after the win must be refused&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;a roll after the win is refused: &quot; + e.getMessage()); }\n        check(win.turnNumber() == turnsAtWin, &quot;and the refused roll added nothing to the log&quot;);\n\n        // 6. the turn rotates fairly, a six rolls again, and three sixes in a row cancel all three\n        Game six = new GameBuilder().id(&quot;six&quot;).boardSize(100).dice(new ScriptedDice(6, 6, 6, 2, 1))\n            .extraTurn(new CappedExtraTurn(new ExtraTurnOnMax(6), 3))\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).player(&quot;c&quot;, &quot;C&quot;).build();\n        six.start();\n        check(six.turnOrder().equals(List.of(&quot;a&quot;, &quot;b&quot;, &quot;c&quot;)), &quot;the queue starts in join order&quot;);\n        check(six.roll(&quot;a&quot;).extraTurn(), &quot;a threw a six and rolls again&quot;);\n        check(&quot;a&quot;.equals(six.whoseTurn()), &quot;so it is still a&#x27;s turn&quot;);\n        check(six.roll(&quot;a&quot;).extraTurn() &amp;&amp; six.positionOf(&quot;a&quot;) == 12, &quot;a threw a second six, is on 12, and rolls again&quot;);\n        Turn third = six.roll(&quot;a&quot;);\n        check(third.kind() == TurnKind.CANCELLED &amp;&amp; !third.extraTurn(), &quot;the third six cancels the streak&quot;);\n        check(&quot;b&quot;.equals(six.whoseTurn()) &amp;&amp; six.positionOf(&quot;a&quot;) == 0, &quot;all three are void: a is back on 0, and b is up&quot;);\n        six.roll(&quot;b&quot;);\n        check(&quot;c&quot;.equals(six.whoseTurn()), &quot;after b, the queue rotates to c&quot;);\n\n        // 7. a board that would make the game wrong is refused at build time, before a Game exists\n        try { new Jump(5, 5); check(false, &quot;a jump to its own cell must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;start == end refused: &quot; + e.getMessage()); }\n        try { new GameBuilder().boardSize(100).jump(30, 80).jump(30, 12).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n              check(false, &quot;a cell with two jumps must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;a snake head cannot also be a ladder foot: &quot; + e.getMessage()); }\n        try { new GameBuilder().boardSize(100).jump(100, 40).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n              check(false, &quot;a snake on the winning cell must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;nothing may start on cell 100: &quot; + e.getMessage()); }\n        try { new GameBuilder().boardSize(100).jump(40, 140).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n              check(false, &quot;a jump off the board must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;an endpoint off the board is refused: &quot; + e.getMessage()); }\n        try { new GameBuilder().boardSize(100).player(&quot;a&quot;, &quot;A&quot;).build(); check(false, &quot;one player is not a game&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;fewer than two players refused: &quot; + e.getMessage()); }\n        try { new GameBuilder().boardSize(100).player(&quot;a&quot;, &quot;A&quot;).player(&quot;a&quot;, &quot;Again&quot;).build();\n              check(false, &quot;two players with the same id must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;duplicate player id refused: &quot; + e.getMessage()); }\n        Game fixed = new GameBuilder().boardSize(50).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        try { fixed.board().addJump(new Jump(5, 45)); check(false, &quot;a built game&#x27;s board must not change&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;the board is frozen once a game is built on it: &quot; + e.getMessage()); }\n\n        // 8. a rule that misbehaves must leave the game exactly as it was, with the same player still to move\n        Game bad = new GameBuilder().id(&quot;bad&quot;).boardSize(50).dice(new ScriptedDice(true, 3))\n            .moveRule((from, roll, size) -&gt; size + 99)                       // deliberately off the board\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        bad.start();\n        try { bad.roll(&quot;a&quot;); check(false, &quot;an off-board landing must be refused&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;the off-board move rule was caught: &quot; + e.getMessage()); }\n        check(bad.positionOf(&quot;a&quot;) == 0, &quot;the token did not move&quot;);\n        check(bad.turnNumber() == 0 &amp;&amp; bad.history().isEmpty(), &quot;nothing was written to the log&quot;);\n        check(&quot;a&quot;.equals(bad.whoseTurn()), &quot;and it is still a&#x27;s turn, so the client can retry&quot;);\n\n        // 9. a broken screen must not break the game, and the same seed must replay the same game\n        Game noisy = classic(&quot;noisy&quot;).seed(5).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        noisy.addObserver((gid, turn) -&gt; { throw new RuntimeException(&quot;the display is down&quot;); });\n        noisy.start();\n        Turn landed = noisy.roll(&quot;a&quot;);\n        check(landed != null &amp;&amp; noisy.turnNumber() == 1, &quot;the turn was played although the observer threw&quot;);\n        check(noisy.positionOf(&quot;a&quot;) == landed.to(), &quot;and the board matches what the turn said&quot;);\n        Game r1 = classic(&quot;r1&quot;).seed(42).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).player(&quot;c&quot;, &quot;C&quot;).build();\n        Game r2 = classic(&quot;r2&quot;).seed(42).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).player(&quot;c&quot;, &quot;C&quot;).build();\n        r1.start(); r2.start();\n        r1.playOut(2000); r2.playOut(2000);\n        List&lt;Integer&gt; rolls1 = new ArrayList&lt;&gt;(), rolls2 = new ArrayList&lt;&gt;();\n        for (Turn x : r1.history()) rolls1.add(x.roll());\n        for (Turn x : r2.history()) rolls2.add(x.roll());\n        check(rolls1.equals(rolls2) &amp;&amp; !rolls1.isEmpty(), &quot;the same seed threw the same &quot; + rolls1.size() + &quot; rolls&quot;);\n        check(r1.positions().equals(r2.positions()), &quot;and finished on exactly the same board&quot;);\n        check(r1.winner().equals(r2.winner()), &quot;with the same winner: &quot; + r1.winner().name());\n\n        // 10. undo really undoes; a player who quits leaves the queue; and the entry rule wraps the old rule\n        Game notYet = classic(&quot;notyet&quot;).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        try { notYet.roll(&quot;a&quot;); check(false, &quot;a roll before start() must be refused&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;a roll before start() is refused: &quot; + e.getMessage()); }\n\n        Game u = new GameBuilder().id(&quot;undo&quot;).boardSize(10).dice(new ScriptedDice(4, 4))\n            .jump(4, 10).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        u.start();\n        try { u.undoLastTurn(); check(false, &quot;undo with nothing played must be refused&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;undo on an empty log is refused: &quot; + e.getMessage()); }\n        Turn winning = u.roll(&quot;a&quot;);\n        check(winning.won() &amp;&amp; u.status() == GameStatus.FINISHED, &quot;a climbs the ladder 4-&gt;10 and wins&quot;);\n        Turn back = u.undoLastTurn();\n        check(back.equals(winning), &quot;undo gave back exactly the turn that was played&quot;);\n        check(u.status() == GameStatus.IN_PROGRESS &amp;&amp; u.winner() == null, &quot;the win is unmade: the game is live again&quot;);\n        check(u.positionOf(&quot;a&quot;) == 0 &amp;&amp; u.turnNumber() == 0, &quot;the token is back on 0 and the log row is gone&quot;);\n        check(u.jumpsTaken().get(JumpKind.LADDER) == 0, &quot;and the ladder counter came back down&quot;);\n        check(&quot;a&quot;.equals(u.whoseTurn()), &quot;a is due again&quot;);\n        u.roll(&quot;a&quot;);\n        check(u.status() == GameStatus.FINISHED &amp;&amp; u.turnNumber() == 1,\n              &quot;a throws the same 4 and wins again: undo rewinds the game, not the dice&quot;);\n\n        Game q = new GameBuilder().id(&quot;quit&quot;).boardSize(30).dice(new ScriptedDice(true, 3))\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).player(&quot;c&quot;, &quot;C&quot;).build();\n        q.start();\n        q.roll(&quot;a&quot;);\n        q.leave(&quot;b&quot;);\n        check(&quot;c&quot;.equals(q.whoseTurn()), &quot;the player who quit while due hands the turn straight on to c&quot;);\n        check(q.turnOrder().equals(List.of(&quot;c&quot;, &quot;a&quot;)), &quot;and the queue closed up: &quot; + q.turnOrder());\n        q.leave(&quot;a&quot;);\n        check(q.status() == GameStatus.FINISHED &amp;&amp; q.winner().id().equals(&quot;c&quot;), &quot;one player left standing wins by default&quot;);\n\n        MoveStrategy entry = new MustRollSixToEnter(new OvershootStays());\n        check(entry.landingCell(0, 3, 100) == 0, &quot;off the board, a 3 does nothing: you must throw a six to start&quot;);\n        check(entry.landingCell(0, 6, 100) == 6, &quot;a six puts the token on the board, at cell 6&quot;);\n        check(entry.landingCell(6, 3, 100) == 9, &quot;and on the board it is the wrapped rule again: 6 + 3 = 9&quot;);\n\n        // 11. three bugs found in review: each of these checks failed on the code before the fix\n        boolean[] clockDown = { false };\n        Game clk = new GameBuilder().id(&quot;clk&quot;).boardSize(50).dice(new ScriptedDice(true, 3))\n            .clock(() -&gt; { if (clockDown[0]) throw new IllegalStateException(&quot;the clock is down&quot;); return 1L; })\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        clk.start();\n        clockDown[0] = true;\n        try { clk.roll(&quot;a&quot;); check(false, &quot;a clock that throws must fail the roll&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;a clock that throws fails the roll: &quot; + e.getMessage()); }\n        check(clk.positionOf(&quot;a&quot;) == 0 &amp;&amp; clk.turnNumber() == 0 &amp;&amp; clk.history().isEmpty() &amp;&amp; &quot;a&quot;.equals(clk.whoseTurn()),\n              &quot;and nothing was written: the clock is read before the first write, so a is still on 0 and still due&quot;);\n        Game streak = new GameBuilder().id(&quot;streak&quot;).boardSize(100).dice(new ScriptedDice(6, 6, 6))\n            .extraTurn(new CappedExtraTurn(new ExtraTurnOnMax(6), 3))\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).player(&quot;c&quot;, &quot;C&quot;).build();\n        streak.start();\n        streak.roll(&quot;a&quot;); streak.roll(&quot;a&quot;);                              // two sixes: a is on a streak\n        streak.leave(&quot;c&quot;);                                              // somebody ELSE walks away\n        Turn t3 = streak.roll(&quot;a&quot;);\n        check(!t3.extraTurn() &amp;&amp; &quot;b&quot;.equals(streak.whoseTurn()), &quot;another player leaving does not reset a&#x27;s streak: the third six still ends it&quot;);\n        GameServer server = new GameServer();\n        server.host(new GameBuilder().id(&quot;dup&quot;).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build());\n        try { server.host(new GameBuilder().id(&quot;dup&quot;).player(&quot;x&quot;, &quot;X&quot;).player(&quot;y&quot;, &quot;Y&quot;).build());\n              check(false, &quot;a second game with the same id must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;a second game with a taken id is refused, not swapped in: &quot; + e.getMessage()); }\n\n        // 12. the variants companies ask: play on for second place; PhonePe&#x27;s crocodile, mine and capture; the board from input or a config\n        Game pl = new GameBuilder().id(&quot;pl&quot;).boardSize(10).playToLast().dice(new ScriptedDice(true, 5))\n            .player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).player(&quot;c&quot;, &quot;C&quot;).build();\n        pl.start();\n        pl.roll(&quot;a&quot;); pl.roll(&quot;b&quot;); pl.roll(&quot;c&quot;);\n        Turn firstHome = pl.roll(&quot;a&quot;);\n        check(firstHome.won() &amp;&amp; pl.status() == GameStatus.IN_PROGRESS &amp;&amp; &quot;b&quot;.equals(pl.whoseTurn()),\n              &quot;a finishes first and the game plays on: b is due&quot;);\n        check(pl.turnOrder().equals(List.of(&quot;b&quot;, &quot;c&quot;)), &quot;a has left the rotation: &quot; + pl.turnOrder());\n        pl.roll(&quot;b&quot;);\n        check(pl.status() == GameStatus.FINISHED &amp;&amp; pl.finishOrder().equals(List.of(&quot;a&quot;, &quot;b&quot;)) &amp;&amp; pl.winner().id().equals(&quot;a&quot;),\n              &quot;b finishes second, one player is left, the game is over: places &quot; + pl.finishOrder());\n        pl.undoLastTurn();\n        check(pl.status() == GameStatus.IN_PROGRESS &amp;&amp; pl.finishOrder().equals(List.of(&quot;a&quot;)) &amp;&amp; &quot;b&quot;.equals(pl.whoseTurn()),\n              &quot;undo un-finishes b: the game is live again with b due&quot;);\n\n        ScriptedDice pd = new ScriptedDice(9, 3, 9, 3, 1);\n        Game pp = new GameBuilder().id(&quot;pp&quot;).boardSize(50).crocodile(12).mine(9, 2).capture()\n            .dice(pd).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        pp.start();\n        pp.roll(&quot;a&quot;);                                                    // 0 + 9: the mine on 9\n        pp.roll(&quot;b&quot;);                                                    // 0 + 3\n        Turn held = pp.roll(&quot;a&quot;);\n        check(held.kind() == TurnKind.HELD &amp;&amp; pd.used() == 2, &quot;a rested on the mine: a&#x27;s next turn is sat out, and no die is thrown&quot;);\n        check(pp.roll(&quot;b&quot;).to() == 7, &quot;the crocodile on 12 takes b exactly five back, to 7&quot;);\n        check(pp.roll(&quot;a&quot;).kind() == TurnKind.HELD, &quot;the mine holds a for a second turn&quot;);\n        pp.roll(&quot;b&quot;);                                                    // 7 + 3 = 10\n        Turn hit = pp.roll(&quot;a&quot;);                                         // 9 + 1 = 10, where b is\n        check(&quot;b&quot;.equals(hit.sentHome()) &amp;&amp; pp.positionOf(&quot;b&quot;) == 0 &amp;&amp; pp.positionOf(&quot;a&quot;) == 10,\n              &quot;a lands on b&#x27;s cell and b goes back to the start&quot;);\n        pp.undoLastTurn();\n        check(pp.positionOf(&quot;b&quot;) == 10 &amp;&amp; pp.positionOf(&quot;a&quot;) == 9 &amp;&amp; &quot;a&quot;.equals(pp.whoseTurn()),\n              &quot;undo puts b back on 10 and a back on the mine, due again&quot;);\n        pp.undoLastTurn(); pp.undoLastTurn();                            // b&#x27;s 7 -&gt; 10, then a&#x27;s second held turn\n        check(pp.roll(&quot;a&quot;).kind() == TurnKind.HELD, &quot;undoing a held turn owes it again: a sits out once more&quot;);\n\n        Game in = BoardInput.read(new Scanner(&quot;2  62 5  33 6   2  2 37  27 46   2 Gaurav Sagar&quot;)).dice(new ScriptedDice(2)).build();\n        in.start();\n        check(in.board().jumpCount() == 4 &amp;&amp; in.turnOrder().equals(List.of(&quot;Gaurav&quot;, &quot;Sagar&quot;)) &amp;&amp; in.roll(&quot;Gaurav&quot;).to() == 37,\n              &quot;the classic input builds the board and the players; Gaurav&#x27;s 2 takes the ladder 2-&gt;37&quot;);\n        try { BoardInput.read(new Scanner(&quot;1  5 50  0  2 A B&quot;)); check(false, &quot;a snake that goes up must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;a snake that goes up is refused while reading: &quot; + e.getMessage()); }\n        Properties cfg = new Properties();\n        cfg.load(new java.io.StringReader(&quot;players=Gaurav,Sagar\\nboardSize=10\\nsnakes=9\\nladders=8\\ndice=2\\n&quot;));\n        Game fromCfg = GameConfig.from(cfg, new Random(3)).build();\n        check(fromCfg.board().size() == 100 &amp;&amp; fromCfg.board().jumpCount() == 17 &amp;&amp; fromCfg.roster().size() == 2,\n              &quot;PhonePe&#x27;s config (a 10 x 10 board, 9 snakes, 8 ladders, 2 players) builds a random valid board&quot;);\n        Game ov = GameConfig.from(cfg, new Random(3)).dice(new ScriptedDice(3)).startAt(&quot;Gaurav&quot;, 97).build();\n        ov.start();\n        check(ov.roll(&quot;Gaurav&quot;).won(), &quot;the manual override starts Gaurav on 97 and throws a 3: he reaches 100&quot;);\n        Game home = new GameBuilder().id(&quot;home&quot;).boardSize(30).capture().startAt(&quot;a&quot;, 1).startAt(&quot;b&quot;, 1)\n            .dice(new ScriptedDice(2, 2)).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        home.start(); home.roll(&quot;a&quot;); home.roll(&quot;b&quot;);\n        check(home.positionOf(&quot;a&quot;) == 1 &amp;&amp; home.positionOf(&quot;b&quot;) == 3, &quot;PhonePe&#x27;s rule: a captured token starts again from its start cell, here 1&quot;);\n        Board rnd = RandomBoard.generate(100, 10, 10, new Random(7));\n        check(rnd.jumpCount() == 20 &amp;&amp; RandomBoard.winnable(rnd, 6), &quot;a random board gets exactly 10 snakes and 10 ladders, and can be won&quot;);\n        Board blocked = new Board(20);\n        for (int c = 14; c &lt;= 19; c++) blocked.addJump(new Jump(c, 2));  // every cell a six can reach 20 from is a snake head\n        check(!RandomBoard.winnable(blocked, 6), &quot;a board whose last six cells are all snake heads cannot be won, and the check says so&quot;);\n        check(new CombinedDice(3, new ScriptedDice(3, 5, 2), Combine.MAX).roll() == 5\n              &amp;&amp; new CombinedDice(3, new ScriptedDice(3, 5, 2), Combine.MIN).roll() == 2\n              &amp;&amp; new CombinedDice(2, new ScriptedDice(6, 6), Combine.SUM).roll() == 12, &quot;several dice move by the highest face, the lowest, or the sum&quot;);\n\n        // 13. two races in the extensions: the timer re-armed while a sweeper runs; a slow screen behind the retry-safe door\n        long[] now = { 0 };\n        Game tg = new GameBuilder().id(&quot;tg&quot;).boardSize(50).dice(new ScriptedDice(true, 3)).clock(() -&gt; now[0])\n            .player(&quot;alice&quot;, &quot;Alice&quot;).player(&quot;bob&quot;, &quot;Bob&quot;).build();\n        tg.start();\n        TurnTimer[] timer = new TurnTimer[1];\n        boolean[] sweepNow = { false };\n        timer[0] = new TurnTimer(() -&gt; { if (sweepNow[0]) { sweepNow[0] = false; timer[0].forfeitIfLate(tg); } return now[0]; }, 30_000);\n        timer[0].watch(&quot;alice&quot;);                                         // alice on the clock at 0 s\n        now[0] = 40_000;\n        tg.roll(&quot;alice&quot;);                                                // alice rolls late, at 40 s\n        sweepNow[0] = true;                                              // the sweeper fires while the timer is re-armed for bob\n        timer[0].watch(&quot;bob&quot;);\n        check(tg.history().size() == 1 &amp;&amp; &quot;bob&quot;.equals(tg.whoseTurn()),\n              &quot;a sweeper that runs while the timer is re-armed never forfeits the player whose turn just began&quot;);\n        IdempotentRolls front = new IdempotentRolls();\n        CountDownLatch inScreen = new CountDownLatch(1), release = new CountDownLatch(1);\n        Game slow = new GameBuilder().id(&quot;slow&quot;).boardSize(50).dice(new ScriptedDice(true, 2)).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        Game other = new GameBuilder().id(&quot;other&quot;).boardSize(50).dice(new ScriptedDice(true, 2)).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        slow.addObserver((gid, x) -&gt; { inScreen.countDown(); try { release.await(); } catch (InterruptedException e) { } });\n        slow.start(); other.start();\n        ExecutorService p3 = Executors.newFixedThreadPool(2);\n        p3.submit(() -&gt; front.roll(slow, &quot;a&quot;, &quot;Aa&quot;));                    // &quot;Aa&quot; and &quot;BB&quot; have the same hashCode\n        inScreen.await();\n        Future&lt;Turn&gt; meanwhile = p3.submit(() -&gt; front.roll(other, &quot;a&quot;, &quot;BB&quot;));\n        boolean done;\n        try { meanwhile.get(2, TimeUnit.SECONDS); done = true; } catch (TimeoutException e) { done = false; }\n        release.countDown();\n        p3.shutdown();\n        check(done, &quot;a slow screen on one table does not hold up a retry-safe roll on another table&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First im

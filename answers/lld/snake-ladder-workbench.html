th d=\"M410 90 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 70)\"><rect width=\"540\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ArrayDeque&lt;playerId&gt;:  peek, poll, addLast</text><text x=\"270.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 90 H1050\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1050 70)\"><rect width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 120)\"><rect width=\"380\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">where is this token?</text><text x=\"190.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M410 140 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 120)\"><rect width=\"540\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;playerId, cell&gt;</text><text x=\"270.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 140 H1050\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1050 120)\"><rect width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 170)\"><rect width=\"380\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many snakes and ladders were taken?</text><text x=\"190.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M410 190 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 170)\"><rect width=\"540\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EnumMap&lt;JumpKind, Integer&gt;</text><text x=\"270.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 190 H1050\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1050 170)\"><rect width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 220)\"><rect width=\"380\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how did we get here?</text><text x=\"190.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M410 240 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 220)\"><rect width=\"540\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">List&lt;Turn&gt;, append only</text><text x=\"270.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 240 H1050\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1050 220)\"><rect width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) append</text></g><text x=\"615\" y=\"290\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">no array of a hundred Cell objects: the interesting cells are a handful, so a map stores only what exists and answers in one hop</text></svg></div><div class=\"move\"><p>\"What is on the cell I landed on?\" is a map from cell to jump. That is the shape worth defending. A hundred-cell board has about twenty interesting cells, so an array of a hundred <code>Cell</code> objects stores eighty empty ones to answer a question a map answers in one hop. If the jump lands on another jump, that is one more hop, and <code>build()</code> refused every loop, so the chain always ends. (The honest counter-argument: if a UI arrives and every cell needs a picture and a colour, a dense array becomes the better home. Say that and move on.) \"Whose turn is it?\" is a deque (a double-ended queue: add or remove at either end), not a list with an index somebody has to keep. <code>peek</code> to see, <code>poll</code> then <code>addLast</code> to rotate, all O(1). Two things are not O(1): taking a player out of the middle when they quit, and, when captures are on (landing on a token sends it back to its start), finding the token on that cell. Both walk the players, fewer than ten, so it does not matter, and saying that is better than pretending it is a hash map.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 275\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WAITING</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">built and valid, nobody rolls</text></g><g transform=\"translate(30 110)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">IN_PROGRESS</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">rolls are accepted</text></g><g transform=\"translate(30 190)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FINISHED</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">every roll refused</text></g><path d=\"M125 74 V110\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M125 154 V190\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"145\" y=\"96\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">start()</text><text x=\"145\" y=\"176\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">rests on the last cell</text><rect x=\"290\" y=\"20\" width=\"920\" height=\"220\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"750\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside one turn, and why it is this order</text><text x=\"305\" y=\"68\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 the game must be IN_PROGRESS and it must be this player's turn -- before the die is touched</text><text x=\"305\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 read the clock; roll; ask the extra-turn rule; ask the move rule for the landing cell; check it</text><text x=\"305\" y=\"112\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 follow the jumps from that cell until a plain cell; check each end is on the board</text><text x=\"305\" y=\"134\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4 decide the win on the RESTING cell, a mine, a capture, and whether this player rolls again</text><text x=\"305\" y=\"156\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5 only now write: the positions, the counters, the log row, the places</text><text x=\"305\" y=\"178\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">6 rotate the queue LAST, so nobody can read a moved token that is still due to roll</text><text x=\"305\" y=\"200\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">anything that throws in steps 2-4 leaves the game exactly as it was and the same player still to move;</text><text x=\"305\" y=\"222\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a roll out of turn is refused in step 1, so it costs nothing at all -- not even a random number</text><text x=\"615\" y=\"262\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">three states and one rule: nothing is written until the whole turn has been worked out and checked</text></svg></div><div class=\"move\"><p>The three states are in the picture. The six numbered steps beside them are the part to defend out loud, and two rules produce that order. <i>Check before you spend</i>: the state and the turn are checked before the die is touched, so a phone that rolls out of turn costs the game nothing, not a log row and not even a random number. That is what keeps a seeded game (one whose random numbers start from a fixed seed, so it replays exactly) reproducible, however many stray requests arrive. <i>Compute, then write</i>: the time stamp, the throw, the landing cell, the jumps and the win all go into local variables and are checked before the first <code>put</code>. So anything that throws half way, even the clock, which is handed in and can fail too, leaves the game exactly as it was, with the same player still due. The queue rotates last, or a reader could catch a token that has moved while its owner is still shown as due. Undo is that same list read upwards, which works only because every write went through one method in one order. And the board is validated once in <code>build()</code> and then frozen, so the turn loop never checks a layout it was handed.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one table's turns happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"560\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about half a microsecond</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">peek the queue, compare one string</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one map get, one arithmetic rule, a map get per jump</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one map put, one deque rotate, one list append</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the die itself: an arithmetic step on a seed</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">about ten operations, none of which can block</text></g><path d=\"M590 95 H660\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"625\" y=\"85\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(660 20)\"><rect width=\"540\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: milliseconds to seconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the commentary and the screens: after the unlock, in a try/catch</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the push to four phones: about 30 ms</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the database write: about 5 ms (a follow-up)</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the person deciding to press roll: seconds</text></g><text x=\"615\" y=\"200\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">four phones press roll in the same millisecond</text><g transform=\"translate(30 215)\"><rect width=\"280\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"140.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">p0's phone</text><text x=\"140.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">it is p0's turn: 0.5 us</text></g><g transform=\"translate(330 215)\"><rect width=\"280\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"140.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">p1's phone</text><text x=\"140.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">refused after 2 compares</text></g><g transform=\"translate(630 215)\"><rect width=\"280\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"140.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">p2's phone</text><text x=\"140.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">refused after 2 compares</text></g><g transform=\"translate(930 215)\"><rect width=\"280\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"140.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">p3's phone</text><text x=\"140.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">refused after 2 compares</text></g><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">only one of them is going to do any work, and the other three find that out inside the lock in about a tenth of a microsecond:</text><text x=\"615\" y=\"306\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">\"is everything now one by one?\" -- yes, per table, for half a microsecond, and no human being can tell</text></svg></div><div class=\"move\"><p>Inside the lock: a queue peek and one string comparison, the throw itself (arithmetic on a seed), a map get for the position, and the move rule (three numbers in, one out). Then a map get for each jump (usually none or one), one map put, one deque rotation and one list append. That is about ten operations, roughly half a microsecond, and not one of them can block. Everything slow is outside. The commentary and the push to four phones over their live connections (tens of milliseconds) happen after the unlock, inside a try/catch, so a screen that has crashed cannot stop the game. When four phones press roll in the same millisecond, only one of them does any work. The other three find out they are not on turn after two comparisons, in about a tenth of a microsecond, and go away. So the answer to \"is everything now one by one?\" is: per table, for half a microsecond, and no human being can tell.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per game: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the locked part of a turn: ~10 operations, about 0.5 us</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a real table: 4 people, a roll every 3 seconds = 0.33 rolls/s</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">that is 0.17 microseconds of lock in every second: 0.00002% busy</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a million live tables at 300,000 rolls a second across them all</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">= 0.15 core-seconds a second, spread over a million SEPARATE locks</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 screens and persistence outside the lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: the phones hear after the unlock</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 one game, one server</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the game id picks the server: each lock stays in one process</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 the game becomes a row in a database</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE ... WHERE turn_no = ?  -- only if nobody moved first</text></g></svg></div><div class=\"move\"><p>Four people at a table throw a die every three seconds or so: a third of a roll per second against a lock held for half a microsecond. The lock is busy about 0.00002% of the time, one second in every ten weeks. Scale it the other way and it is still fine, because the lock is per game. A million live tables doing three hundred thousand rolls a second between them is 0.15 of one CPU core of locked work, spread over a million locks that never meet. Then the ladder, cheapest first. Screens and persistence stay outside the lock, which this code already does. When one machine is not enough, send every request for a game to the one server that holds it: the game id picks the server, so each game's lock still lives in one process. Only if any server must be able to serve any game does the game become a database row, and the turn a conditional UPDATE (it changes the row only if <code>turn_no</code> still has the value you read). Say the arithmetic first: climbing this ladder without it is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 365\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"340\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two phones roll for the same player at once</text></g><path d=\"M370 36 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 18)\"><rect width=\"780\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lock, the turn checked inside it; tests 1-2: 8 threads, exactly one move, one log row</text></g><g transform=\"translate(30 58)\"><rect width=\"340\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a phone rolls out of turn and costs a die</text></g><path d=\"M370 76 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 58)\"><rect width=\"780\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every check before the die; test 1: rolls taken out of the dice == turns played</text></g><g transform=\"translate(30 98)\"><rect width=\"340\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a ladder ends on a snake; jumps loop</text></g><path d=\"M370 116 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 98)\"><rect width=\"780\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">follow the chain; build() refuses a loop; test 3: rests on the first plain cell</text></g><g transform=\"translate(30 138)\"><rect width=\"340\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a throw that would pass the last cell</text></g><path d=\"M370 156 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 138)\"><rect width=\"780\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the rule wastes it; test 4: the token stays and nobody wins</text></g><g transform=\"translate(30 178)\"><rect width=\"340\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a rule or the clock fails half way</text></g><path d=\"M370 196 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 178)\"><rect width=\"780\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">all of it runs before the first write; tests 8, 11: nothing moved, same player due</text></g><g transform=\"translate(30 218)\"><rect width=\"340\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a bad board layout (two jumps on a cell)</text></g><path d=\"M370 236 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 218)\"><rect width=\"780\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refused in build(), then frozen; test 7: no Game is ever created</text></g><g transform=\"translate(30 258)\"><rect width=\"340\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the screen throws while being told</text></g><path d=\"M370 276 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 258)\"><rect width=\"780\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish after the unlock, in a try/catch; test 9: the turn still landed</text></g><g transform=\"translate(30 298)\"><rect width=\"340\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a misclick on the winning roll</text></g><path d=\"M370 316 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 298)\"><rect width=\"780\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">undo walks the writes backwards; test 10: the win is unmade, a is due again</text></g><text x=\"615\" y=\"352\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a failure test: FailureTests.java runs 88 of them in thirteen blocks and must print ALL PASS</text></svg></div><div class=\"move\"><p>Every row in that table is a claim the design makes, and a claim with no test is an opinion. You will not have time for all eight in an hour, so write them in this order. The race first, because it is the only one that can be wrong in a way reading cannot catch. Eight threads wait on a latch (a <code>CountDownLatch</code>: a gate that lets every waiting thread go at once). Then assert three things: the log has one row per accepted roll, the turn numbers run 1..n with no gap, and every token starts each turn where its own previous turn left it. Then the one that proves the <i>order</i> inside the turn: hand in a move rule that returns a cell off the board, or a clock that throws, and assert the position, the log and the turn order are untouched. Then the two rules everybody argues about, the overshoot and the chain. The rest (the bad layout, the broken screen, the undo) are three lines each once those three exist. Say the test out loud while you type it: \"this asserts a refused roll does not even spend a die.\"</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"230\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"320\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"850\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"230\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface Dice / MoveStrategy / ExtraTurnRule -- one method each</text><text x=\"850\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a new rule is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"230\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">CappedExtraTurn(rule, 3) and MustRollSixToEnter(rule): a rule wrapping a rule</text><text x=\"850\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">a cap or an entry gate added to any rule</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"230\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"320\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">publish(t) after the unlock, inside a try/catch</text><text x=\"850\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">screens hear; the table never waits</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"230\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">WAITING &rarr; IN_PROGRESS &rarr; FINISHED, checked first in roll()</text><text x=\"850\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">a roll after the win cannot happen</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Command</text><text x=\"230\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">the Turn record keeps from as well as to; undoLastTurn() walks it backwards</text><text x=\"850\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">undo, replay and audit, no extra state</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--acc)\">Builder</text><text x=\"230\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">GameBuilder.build(); Game's constructor is package-private</text><text x=\"850\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">an invalid game cannot be constructed at all</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"230\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">the builder's dice(count, faces) already picks the class</text><text x=\"850\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when rules arrive as config strings</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"230\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"320\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">GameServer is handed to its callers; nothing calls getInstance()</text><text x=\"850\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh server per game</text><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>Read the table as a defence, one sentence each. Strategy, because move 3 found three rules that change. Decorator, because two of those rules are better wrapped than copied. Observer, because move 4 said a screen must never be inside the lock. State, because move 6 gave the game a life, which is why a roll after the win is refused rather than quietly appended. Command (an action stored as data, so it can be replayed or undone) is the one candidates miss. The <code>Turn</code> record keeps <code>from</code> as well as <code>to</code>, so the log is an audit trail, a replay script and the undo stack at once, and <code>undoLastTurn()</code> needs no state of its own. Builder is the one worth arguing. On most LLDs it is extra code with no job, and you should say so. Here there are a dozen optional knobs and four invariants (rules that must always hold: two or more players, unique ids, a legal layout, no loop). <code>build()</code> is the single place they are checked, and Game's constructor is package-private, so an invalid game cannot be constructed at all. Factory has not earned its name yet, and Singleton never does. A pattern without a move behind it is decoration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"470\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"470\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Board resolves a landing. Dice makes a number. Game drives the turn. Nobody does two.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"470\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">ReachOrPass is a new file and one builder line; the turn loop is untouched</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"470\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">dice.roll();  never \"is this the scripted one?\" -- which is what makes tests exact</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"470\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">Dice, MoveStrategy, ExtraTurnRule, GameObserver, Clock: one method each</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"470\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">new GameBuilder().dice(new ScriptedDice(6, 6, 2)).clock(() -&gt; now)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>SOLID is not a speech; it is the check that the moves did their job, and every letter here points at a line you already wrote. The one to say out loud is L, because on this problem it is what makes the tests exist. The game calls <code>dice.roll()</code> and never asks which dice it got, so a test can hand it a script of 6, 6, 2 and assert an exact board. If any letter has no line behind it, the honest answer is \"not here\": a letter you cannot point at is a letter you did not earn.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">bounce back, two dice, three sixes cancel</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind the interface plus one builder line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a scoreboard, analytics, a tournament</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer; the game and the lock do not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a mine, take a move back, a player quits</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more checked transition, written under the SAME lock</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across players</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">capture: land on a token, it goes home</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the check and the writes inside the SAME lock: all or nothing</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">persist it; two servers</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">positions and log behind a repository; the turn becomes</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE ... SET turn_no = turn_no + 1 WHERE turn_no = ?, request id as the key</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the first two leave Game untouched; the next two are a few lines inside it, under the same lock; no existing test changes</text></svg></div><div class=\"move\"><p>A new rule (bounce back, reach-or-pass, two dice or the highest of three, a six to get on the board, three sixes cancel) is a new class behind an interface that already exists, plus one line in the builder. Someone new who wants to know (a scoreboard, analytics, a tournament table) is one more observer. A new step in a life is a checked transition written under the same lock: a mine that holds you for two turns, taking a move back, a player who quits, playing on for second place. The mine is the one special cell that is <i>not</i> free, because it changes whose turn it is rather than where a token is; a crocodile is free, because it is a snake of length five. A new invariant across players (PhonePe's rule: land on a token and it goes back to its start) is the check and the writes inside the <i>same</i> lock. State that must outlive the process is a repository behind the positions and the log. The first two kinds leave <code>Game</code> untouched; the next two are a few lines inside it, under the same lock. None of them changes an existing test, and that is the test that the derivation was right.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 905\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><p bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"117.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"117.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Next</text><line x1=\"0\" y1=\"34\" x2=\"235\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">PASS, AGAIN, CANCEL_STREAK</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\"></text></g><g transform=\"translate(960 20)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Dice</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">roll(): int</text></g><g transform=\"translate(960 94)\"><rect width=\"260\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">StandardDice</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">count / faces: int</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">rng: Random (injected)</text><line x1=\"0\" y1=\"64\" x2=\"260\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">roll(): sums n dice</text></g><g transform=\"translate(960 204)\"><rect width=\"260\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ScriptedDice</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">script: int[]</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">used: int</text><line x1=\"0\" y1=\"64\" x2=\"260\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">roll(): the next in the script</text></g><g transform=\"translate(960 324)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">MoveStrategy</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">landingCell(from, roll, size)</text></g><g transform=\"translate(960 398)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">OvershootStays</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">past the end = stay put</text></g><g transform=\"translate(960 472)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">BounceBack</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">past the end = bounce back</text></g><g transform=\"translate(960 556)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ExtraTurnRule</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">after(roll, extrasSoFar): Next</text></g><g transform=\"translate(960 630)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">NoExtraTurn</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">always PASS</text></g><g transform=\"translate(960 704)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ExtraTurnOnMax</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">a six: AGAIN</text></g><g transform=\"translate(960 778)\"><rect width=\"260\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CappedExtraTurn</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">base: ExtraTurnRule (wrapped)</text><line x1=\"0\" y1=\"48\" x2=\"260\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">3 in a row: CANCEL_STREAK</text></g><g><path d=\"M20 880L64 880\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"884\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 880L284 880\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"884\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 880L504 880\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"884\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 880L684 880\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"884\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 880L904 880\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"884\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the game owns the board and every turn, and the board owns its jumps. Plain arrow = references: a turn points at the jumps that carried it. Dashed green = handed in by the builder, which is the box that hands the game its rules and its clock. Dotted blue = notifies. <b>Where state lives:</b> everything that moves is on the <code>Game</code> (every token's position, the turn queue, the log, the places, who is sitting out a mine, the counters, the status). All of it is behind one <code>ReentrantLock</code>, which is the whole concurrency answer in one sentence. The board is checked by <code>build()</code> and then frozen. A player is an id and a name; a jump is two cells; a turn is what happened. Notice what is <i>not</i> here. There is no Snake, Ladder or Crocodile class, because they are one shape with a sign, and no Cell class, because a cell with nothing on it is just a number. There is no position field on Player either: the moment two phones can roll, shared state belongs to whoever holds the lock.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics &mdash; and read <code>Game.roll</code> twice, because the order of its lines is the design. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (88 checks in thirteen blocks; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\n\n/** Which way a jump goes. It is derived from the two cells, never stored: a snake goes down, a ladder goes up. */\nenum JumpKind { SNAKE, LADDER }\n\n/**\n * The game&#x27;s life. WAITING = built and valid but nobody may roll yet; IN_PROGRESS = rolls are accepted;\n * FINISHED = the places are decided (the first to rest on the last cell, or everyone but one when the table plays\n * on to the last) and every further roll is refused.\n */\nenum GameStatus { WAITING, IN_PROGRESS, FINISHED }\n\n/**\n * How a turn went. PLAYED = a throw and a move; CANCELLED = the throw that broke the extra-turn rule (a third six):\n * the token goes back to where the streak began; HELD = sat out on a mine, no die thrown; TIMED_OUT = the clock ran\n * out, no die thrown. Every kind is a row in the log, so undo and replay treat them all the same way.\n */\nenum TurnKind { PLAYED, CANCELLED, HELD, TIMED_OUT }\n\n/**\n * A one-way teleport from one cell to another. A snake and a ladder are the SAME object: only the sign of\n * end - start differs, and a sign is data, not a reason for two classes. Immutable, and it validates the one\n * thing that is always true of a jump.\n */\nrecord Jump(int start, int end) {\n    Jump {\n        if (start == end) throw new IllegalArgumentException(&quot;a jump cannot start and end on the same cell: &quot; + start);\n    }\n    /** SNAKE if it drags you back, LADDER if it lifts you. Computed, so the two can never disagree. */\n    JumpKind kind() { return end &lt; start ? JumpKind.SNAKE : JumpKind.LADDER; }\n    @Override public String toString() { return (kind() == JumpKind.SNAKE ? &quot;snake &quot; : &quot;ladder &quot;) + start + &quot;-&gt;&quot; + end; }\n}\n\n/**\n * A person at the table. Deliberately immutable: the one thing that moves during a game is the token&#x27;s\n * position, and the GAME owns that, so no two callers can ever write it at once -- and the same player can sit\n * at several tables at the same time.\n */\nrecord Player(String id, String name) {}\n\n/** Where time comes from. Injected, so a test can stamp a turn with any instant it likes. */\ninterface Clock { long nowMs(); }\n\n// &quot;how would you test a game of random rolls?&quot; -&gt; hide the randomness behind an interface -&gt; Strategy\n/** The source of a roll. One method, because &quot;how many dice, with what faces&quot; is the thing that changes. */\ninterface Dice {\n    /** The total of this throw. Must be at least 1. */\n    int roll();\n}\n\n/** n fair dice of f faces each, driven by a Random that is handed in so a game can be seeded and replayed. */\nfinal class StandardDice implements Dice {\n    private final int count, faces;\n    private final Random rng;\n    /** @param count how many dice, @param faces faces per die, @param rng injected: seed it to reproduce a game. */\n    StandardDice(int count, int faces, Random rng) {\n        if (count &lt; 1) throw new IllegalArgumentException(&quot;at least one die: &quot; + count);\n        if (faces &lt; 2) throw new IllegalArgumentException(&quot;at least two faces: &quot; + faces);\n        this.count = count; this.faces = faces; this.rng = rng;\n    }\n    @Override public int roll() {\n        int sum = 0;\n        for (int i = 0; i &lt; count; i++) sum += rng.nextInt(faces) + 1;\n        return sum;\n    }\n}\n\n/**\n * Loaded dice: a scripted sequence, so a test can say &quot;now roll a 6, then a 3&quot; and assert an exact board.\n * It also counts how many rolls were taken, which is how the race test proves a refused request rolls nothing.\n */\nfinal class ScriptedDice implements Dice {\n    private final int[] script;\n    private final boolean cycle;\n    private int used = 0;\n    /** A fixed script that runs out: the test that asks for one roll too many gets an error, not a surprise. */\n    ScriptedDice(int... script) { this(false, script); }\n    /** @param cycle true = start the script again from the top when it runs out. */\n    ScriptedDice(boolean cycle, int... script) {\n        if (script.length == 0) throw new IllegalArgumentException(&quot;an empty script&quot;);\n        this.script = script.clone(); this.cycle = cycle;\n    }\n    /** How many rolls have actually been taken out of this dice. */\n    int used() { return used; }\n    @Override public int roll() {\n        if (used &gt;= script.length &amp;&amp; !cycle) throw new IllegalStateException(&quot;the dice script ran out after &quot; + used + &quot; rolls&quot;);\n        return script[used++ % script.length];\n    }\n}\n\n// &quot;what happens when a roll overshoots the last cell?&quot; has more than one right answer -&gt; Strategy\n/** The rule that turns a roll into the cell the token lands on, BEFORE any snake or ladder is applied. */\ninterface MoveStrategy {\n    /** The landing cell. Must be between 0 and boardSize; the game refuses anything else rather than trusting it. */\n    int landingCell(int from, int roll, int boardSize);\n}\n\n/** The classic rule: a roll that would go past the last cell is wasted and the token stays where it is. */\nfinal class OvershootStays implements MoveStrategy {\n    @Override public int landingCell(int from, int roll, int boardSize) {\n        int target = from + roll;\n        return target &gt; boardSize ? from : target;\n    }\n}\n\n/** The other common rule: you must land exactly, and the extra steps bounce back off the last cell. */\nfinal class BounceBack implements MoveStrategy {\n    @Override public int landingCell(int from, int roll, int boardSize) {\n        int target = from + roll;\n        if (target &lt;= boardSize) return target;\n        int bounced = boardSize - (target - boardSize);\n        return bounced &lt; 0 ? from : bounced;                      // a roll bigger than the whole board: stay\n    }\n}\n\n/**\n * What a throw means for the thrower: the turn passes, they throw again, or the whole streak (the throws they\n * have made in a row this go) is cancelled and the token goes back to where the streak began.\n */\nenum Next { PASS, AGAIN, CANCEL_STREAK }\n\n// &quot;a six rolls again -- and three sixes in a row cancel all three&quot; -&gt; a rule that wraps a rule -&gt; Decorator\n/** Whether the same player throws again. Pure: the game hands in the throw and how many extras this player has had. */\ninterface ExtraTurnRule {\n    /** @param roll what they just threw, @param extrasSoFar how many extra throws in a row they have already had. */\n    Next after(int roll, int extrasSoFar);\n}\n\n/** The plain rule: one throw, one turn. */\nfinal class NoExtraTurn implements ExtraTurnRule {\n    @Override public Next after(int roll, int extrasSoFar) { return Next.PASS; }\n}\n\n/** Throw the maximum (a six on one die) and go again. */\nfinal class ExtraTurnOnMax implements ExtraTurnRule {\n    private final int max;\n    /** @param max the highest total the dice can throw, usually 6. */\n    ExtraTurnOnMax(int max) { this.max = max; }\n    @Override public Next after(int roll, int extrasSoFar) { return roll == max ? Next.AGAIN : Next.PASS; }\n}\n\n/**\n * The house rule, as a wrapper rather than a copy: whatever the inner rule says, the throw that would be the\n * cap-th &quot;again&quot; in a row cancels the whole streak instead -- three sixes and all three are void. It adds that\n * limit to any extra-turn rule, including ones written next year.\n */\nfinal class CappedExtraTurn implements ExtraTurnRule {\n    private final ExtraTurnRule base;\n    private final int cap;\n    /** @param cap the throw that would make `cap` in a row cancels them all: 3 = three sixes cancel. */\n    CappedExtraTurn(ExtraTurnRule base, int cap) { this.base = base; this.cap = cap; }\n    @Override public Next after(int roll, int extrasSoFar) {\n        Next n = base.after(roll, extrasSoFar);\n        return n == Next.AGAIN &amp;&amp; extrasSoFar + 1 &gt;= cap ? Next.CANCEL_STREAK : n;\n    }\n}\n\n/**\n * One completed turn: everything that happened, as data. It is the audit log, it is what the observers are\n * handed, it is what a replay reads, and because it records `from` and `to` it is its own undo.\n * `jumps` lists every snake and ladder taken, in order (a ladder can land on a snake); `sentHome` is the token\n * this move knocked back to the start, or null; `won` means the token rested on the last cell.\n */\nrecord Turn(int number, String playerId, TurnKind kind, int roll, int from, int landedOn, int to,\n            List&lt;Jump&gt; jumps, String sentHome, boolean extraTurn, boolean won, long atMs) {\n    /** One line of commentary, the way a person would say it. */\n    String describe() {\n        String who = &quot;#&quot; + number + &quot; &quot; + playerId;\n        if (kind == TurnKind.HELD) return who + &quot; sits out a turn on the mine at &quot; + from;\n        if (kind == TurnKind.TIMED_OUT) return who + &quot; ran out of time at &quot; + from;\n        if (kind == TurnKind.CANCELLED) return who + &quot; rolled &quot; + roll + &quot;: one too many in a row, the streak is cancelled, back to &quot; + to;\n        StringBuilder s = new StringBuilder(who + &quot; rolled &quot; + roll + &quot;: &quot; + from + &quot; -&gt; &quot; + landedOn);\n        for (Jump j : jumps) s.append(j.kind() == JumpKind.SNAKE ? &quot; then a snake down to &quot; : &quot; then a ladder up to &quot;).append(j.end());\n        if (sentHome != null) s.append(&quot;, and &quot;).append(sentHome).append(&quot; goes back to the start&quot;);\n        if (extraTurn) s.append(&quot; (rolls again)&quot;);\n        if (won) s.append(&quot;  *** reaches &quot;).append(to).append(&quot; ***&quot;);\n        return s.toString();\n    }\n}\n\n/**\n * The board: a number line from 1 to size, plus the handful of cells that do something. The jumps are kept in\n * a map keyed by their start cell because they are sparse -- about twenty interesting cells on a hundred -- so\n * a landing is one hash lookup instead of a scan. Every board rule is enforced here, while the board is built,\n * and build() then freezes it, so the turn loop never has to check a layout it was given.\n */\nclass Board {\n    private final int size;\n    private final Map&lt;Integer, Jump&gt; jumps = new HashMap&lt;&gt;();\n    private final Map&lt;Integer, Integer&gt; mines = new HashMap&lt;&gt;();      // cell -&gt; how many turns it holds you\n    private boolean frozen;                                            // set once by build(); published with the game\n    /** @param size the last cell, and the cell you must rest on to win. */\n    Board(int size) {\n        if (size &lt; 2) throw new IllegalArgumentException(&quot;a board needs at least two cells: &quot; + size);\n        this.size = size;\n    }\n    /** The last cell. */\n    int size() { return size; }\n    /**\n     * Add a snake or a ladder, refusing a layout that would make the game wrong: endpoints must be on the\n     * board, one cell does at most one thing (so a snake head cannot also be a ladder foot), nothing may start\n     * on the winning cell, and no chain of jumps may come back to where it started -- jumps chain (a ladder\n     * may end on a snake&#x27;s head), so a loop would move a token for ever.\n     */\n    void addJump(Jump j) {\n        requireOpen();\n        if (j.start() &lt; 1 || j.start() &gt; size) throw new IllegalArgumentException(&quot;jump starts off the board: &quot; + j);\n        if (j.end() &lt; 1 || j.end() &gt; size) throw new IllegalArgumentException(&quot;jump ends off the board: &quot; + j);\n        if (j.start() == size) throw new IllegalArgumentException(&quot;nothing may start on the winning cell: &quot; + j);\n        Jump other = jumps.get(j.start());\n        if (other != null) throw new IllegalArgumentException(&quot;cell &quot; + j.start() + &quot; already has &quot; + other + &quot;, cannot also have &quot; + j);\n        if (mines.containsKey(j.start())) throw new IllegalArgumentException(&quot;cell &quot; + j.start() + &quot; already has a mine&quot;);\n        for (int c = j.end(); jumps.containsKey(c); ) {              // walk the chain this jump would land on\n            c = jumps.get(c).end();\n            if (c == j.start()) throw new IllegalArgumentException(j + &quot; would close a loop: its chain comes back to &quot; + c);\n        }\n        jumps.put(j.start(), j);\n    }\n    /** Add a mine: a token that rests here sits out its next `turns` turns. Same rules: one thing per cell. */\n    void addMine(int cell, int turns) {\n        requireOpen();\n        if (cell &lt; 1 || cell &gt;= size) throw new IllegalArgumentException(&quot;a mine must be on the board, not on the last cell: &quot; + cell);\n        if (turns &lt; 1) throw new IllegalArgumentException(&quot;a mine holds you for at least one turn: &quot; + turns);\n        if (jumps.containsKey(cell) || mines.containsKey(cell)) throw new IllegalArgumentException(&quot;cell &quot; + cell + &quot; already does something&quot;);\n        mines.put(cell, turns);\n    }\n    /** The jump that starts on this cell, or null for a plain cell. O(1). */\n    Jump jumpAt(int cell) { return jumps.get(cell); }\n    /** How many turns a token resting here must sit out: 0 on every cell but a mine. O(1). */\n    int holdAt(int cell) { return mines.getOrDefault(cell, 0); }\n    /** How many snakes and ladders there are, for a display. */\n    int jumpCount() { return jumps.size(); }\n    /** Called by build(): from now on the layout cannot change, so what build() checked stays true. */\n    void freeze() { frozen = true; }\n    private void requireOpen() {\n        if (frozen) throw new IllegalStateException(&quot;the board is fixed once a game is built on it&quot;);\n    }\n}\n\n/** Raised when somebody rolls out of turn. Its own type so a caller can tell it apart from a real failure. */\nclass OutOfTurnException extends IllegalStateException {\n    OutOfTurnException(String message) { super(message); }\n}\n\n// &quot;the phones both pressed roll&quot; -&gt; whoever hears about a turn must not be inside the lock -&gt; Observer\n/** Anybody who wants to know that a turn happened: a screen, a commentator, an analytics sink. One method. */\ninterface GameObserver {\n    /** Called AFTER the game&#x27;s lock is released, so a slow or broken listener cannot stall the table. */\n    void onTurn(String gameId, Turn t);\n}\n\n/** The commentary line under the board. An observer that only prints: it holds no game state at all. */\nfinal class Commentary implements GameObserver {\n    @Override public void onTurn(String gameId, Turn t) { System.out.println(&quot;  &quot; + t.describe()); }\n}\n\n/** A quieter screen: it shows only the turns that changed something interesting -- a jump, or the win. */\nfinal class Highlights implements GameObserver {\n    @Override public void onTurn(String gameId, Turn t) {\n        if (!t.jumps().isEmpty() || t.won()) System.out.println(&quot;  &quot; + t.describe());\n    }\n}\n\n/**\n * The game: the single owner of everything that moves -- every token&#x27;s position, whose turn it is, the log,\n * the status -- behind one lock. Every rule it obeys was handed to it by the builder, so this class never\n * changes when a rule does. The critical method is roll(): all the checks happen before a die is touched,\n * the whole move is computed into local variables, and only then is anything written.\n */\nclass Game {\n    private final String id;\n    private final Board board;\n    private final Dice dice;\n    private final MoveStrategy moveRule;\n    private final ExtraTurnRule extraRule;\n    private final Clock clock;\n    private final boolean playToLast, capture;\n    private final List&lt;Player&gt; roster;\n    private final Map&lt;String, Integer&gt; starts;                        // where each token starts; 0 = off the board\n    private final Map&lt;String, Integer&gt; positions = new LinkedHashMap&lt;&gt;();\n    private final ArrayDeque&lt;String&gt; turns = new ArrayDeque&lt;&gt;();      // FIFO: the head is whose turn it is\n    private final List&lt;Turn&gt; log = new ArrayList&lt;&gt;();\n    private final List&lt;String&gt; finishOrder = new ArrayList&lt;&gt;();       // first place first\n    private final Map&lt;String, Integer&gt; sittingOut = new HashMap&lt;&gt;();  // player -&gt; turns still to sit out on a mine\n    private final EnumMap&lt;JumpKind, Integer&gt; jumpsTaken = new EnumMap&lt;&gt;(JumpKind.class);\n    private final List&lt;GameObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n    private GameStatus status = GameStatus.WAITING;\n    private int turnNo = 0;\n    private int extrasInARow = 0;\n\n    /** Package-private on purpose: the only way to get a Game is GameBuilder.build(), which validates. */\n    Game(String id, Board board, Dice dice, MoveStrategy moveRule, ExtraTurnRule extraRule, Clock clock,\n         boolean playToLast, boolean capture, List&lt;Player&gt; roster, Map&lt;String, Integer&gt; starts) {\n        this.id = id; this.board = board; this.dice = dice; this.moveRule = moveRule; this.extraRule = extraRule;\n        this.clock = clock; this.playToLast = playToLast; this.capture = capture; this.roster = List.copyOf(roster);\n        this.starts = Map.copyOf(starts);\n        for (Player p : this.roster) { positions.put(p.id(), startOf(p.id())); turns.addLast(p.id()); }\n        for (JumpKind k : JumpKind.values()) jumpsTaken.put(k, 0);\n    }\n\n    /** The game&#x27;s id. One lock per game, so this id also decides which server holds the game when there are millions. */\n    String id() { return id; }\n    /** The board, for a display or for a bot that wants to see what is ahead of it. */\n    Board board() { return board; }\n    /** Register a listener. It is called after the unlock, and a listener that throws is logged and ignored. */\n    void addObserver(GameObserver o) { observers.add(o); }\n\n    /** Open the table. Refused unless there are at least two players and the game has not started already. */\n    void start() {\n        lock.lock();\n        try {\n            if (status != GameStatus.WAITING) throw new IllegalStateException(&quot;the game is already &quot; + status);\n            if (roster.size() &lt; 2) throw new IllegalStateException(&quot;a game needs at least two players&quot;);\n            status = GameStatus.IN_PROGRESS;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * One turn, and the method that holds the design. The order is the design:\n     *   1 the game must be in progress and it must be this player&#x27;s turn -- checked BEFORE a die is touched,\n     *     so a phone that presses roll out of turn costs the game nothing, not even a random number;\n     *   2 read the clock, roll, ask the extra-turn rule, ask the move rule for the landing cell, follow the\n     *     jumps to a plain cell, decide the win, a mine, a capture and the extra turn -- all into local variables;\n     *   3 only now write: the positions, the counters, the log, the places, and the rotation LAST.\n     * Anything that throws in step 2 leaves the game exactly as it was and the same player still to move.\n     *\n     * @throws OutOfTurnException if it is not this player&#x27;s turn\n     * @throws IllegalStateException if the game has not started or is already finished\n     */\n    Turn roll(String playerId) {\n        Turn t;\n        lock.lock();\n        try {\n            if (status != GameStatus.IN_PROGRESS) throw new IllegalStateException(&quot;the game is &quot; + status);\n            String due = turns.peek();\n            if (!playerId.equals(due)) throw new OutOfTurnException(playerId + &quot; rolled, but it is &quot; + due + &quot;&#x27;s turn&quot;);\n            long now = clock.nowMs();                                 // an injected call can fail: before any write\n            if (sittingOut.containsKey(playerId)) {\n                t = passWithoutMoving(playerId, TurnKind.HELD, now);  // a mine holds them: no die, the turn passes\n            } else {\n                int roll = dice.roll();                               // every check passed: now the die is spent\n                int from = positions.get(playerId);\n                Next next = extraRule.after(roll, extrasInARow);\n                boolean played = next != Next.CANCEL_STREAK;\n                int landedOn = from, to;\n                List&lt;Jump&gt; path = new ArrayList&lt;&gt;(2);\n                if (!played) {                                        // e.g. a third six: back to where the streak began\n

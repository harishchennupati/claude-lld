plement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design Snake and Ladder. A board of a hundred cells with snakes and ladders on it, two or more players taking turns, dice, and a winner. Make it so I can change the rules on you halfway through. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (exact landing, whether jumps chain, and what three sixes do come first). Then type in the order of Main.java: the enums, Jump and Player, the Clock, the Dice interface with a standard and a scripted one, the MoveStrategy interface with its two rules, the ExtraTurnRule with its wrapper, the Turn record, Board with its checks (the loop check included), then Game with its lock and the order inside <code>roll()</code>, then GameBuilder, then the thin GameServer, then a main that plays a seeded game and runs the race. Leave mines, capture, playing on for second place, undo and leaving to their follow-ups. If the clock runs out, the one thing that must exist is <code>roll()</code> under one lock, with every check and every computation before the first write.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>1 &middot; Every roll is a random number. How do you test that, replay a game, and let the interviewer force the dice? And what if they want two or three dice?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The randomness never comes from inside the game. <code>Dice</code> is an interface and the <code>Random</code> is handed in, so production passes a seeded one (the same seed gives the same rolls) and a test passes <code>ScriptedDice</code>, which plays a fixed list of throws. That is PhonePe's \"manual override\": the interviewer types the throws and checks an exact board. The scripted dice also counts what it handed out, which is how the race test proves a refused request does not even spend a die. A bug report is then two lines, the seed and the layout, and failure test 9 plays a seeded game twice and asserts the same rolls, board and winner. Several dice are one more <code>Dice</code>: <code>CombinedDice</code> throws one die n times and moves by the sum (two dice give 2 to 12), the highest face or the lowest. The game cannot tell, because all it ever calls is <code>dice.roll()</code>.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Loaded dice: a scripted sequence, so a test can say &quot;now roll a 6, then a 3&quot; and assert an exact board.\n * It also counts how many rolls were taken, which is how the race test proves a refused request rolls nothing.\n */\nfinal class ScriptedDice implements Dice {\n    private final int[] script;\n    private final boolean cycle;\n    private int used = 0;\n    /** A fixed script that runs out: the test that asks for one roll too many gets an error, not a surprise. */\n    ScriptedDice(int... script) { this(false, script); }\n    /** @param cycle true = start the script again from the top when it runs out. */\n    ScriptedDice(boolean cycle, int... script) {\n        if (script.length == 0) throw new IllegalArgumentException(&quot;an empty script&quot;);\n        this.script = script.clone(); this.cycle = cycle;\n    }\n    /** How many rolls have actually been taken out of this dice. */\n    int used() { return used; }\n    @Override public int roll() {\n        if (used &gt;= script.length &amp;&amp; !cycle) throw new IllegalStateException(&quot;the dice script ran out after &quot; + used + &quot; rolls&quot;);\n        return script[used++ % script.length];\n    }\n}\n\n// ---- ext: several dice -- move by the sum, the highest face or the lowest\n/** How several dice become one number of steps. */\nenum Combine { SUM, MAX, MIN }\n\n/**\n * n dice thrown together and turned into steps by a rule: the sum (two dice give 2 to 12), the highest face or\n * the lowest. Each die is thrown by the one-die Dice it was handed -- a seeded StandardDice in play, a\n * ScriptedDice in a test -- and the result is just another Dice, so the game does not change.\n */\nfinal class CombinedDice implements Dice {\n    private final int count;\n    private final Dice oneDie;\n    private final Combine how;\n    /** @param count how many dice, @param oneDie throws a single die, @param how SUM, MAX or MIN of the faces. */\n    CombinedDice(int count, Dice oneDie, Combine how) {\n        if (count &lt; 1) throw new IllegalArgumentException(&quot;at least one die: &quot; + count);\n        this.count = count; this.oneDie = oneDie; this.how = how;\n    }\n    @Override public int roll() {\n        int sum = 0, max = Integer.MIN_VALUE, min = Integer.MAX_VALUE;\n        for (int i = 0; i &lt; count; i++) {\n            int face = oneDie.roll();\n            sum += face; max = Math.max(max, face); min = Math.min(min, face);\n        }\n        return how == Combine.SUM ? sum : how == Combine.MAX ? max : min;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two phones press roll at the same instant. Prove a token cannot move twice, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between \"it is Bob's turn\" and \"Bob has moved\". <code>roll()</code> does the whole thing (the state check, the turn check, the throw, the move and the rotation) inside one lock held by the game, so no second caller can get into that gap. The proof is two tests. Eight threads wait on a latch (a gate that lets them all go at once) and all roll for the same, correct player: exactly one is accepted, the token moved exactly once, the turn passed exactly once. Then four hundred attempts from eight threads roll for random players, and the log has to hold up. It has one row per accepted roll, turn numbers 1..n with no gap, and every token starting each turn where its own previous turn left it; replaying it reproduces the live board.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. four phones press roll over and over at the same instant. Only the player on turn may move,\n        //    the log must have no gap and no double, and a refused request must not even cost a die roll.\n        ScriptedDice shared = new ScriptedDice(true, 3, 5, 2, 6, 1, 4);\n        Game race = new GameBuilder().id(&quot;race&quot;).boardSize(400).dice(shared)\n            .jump(12, 40).jump(60, 22).jump(120, 180).jump(200, 90)\n            .player(&quot;p0&quot;, &quot;P0&quot;).player(&quot;p1&quot;, &quot;P1&quot;).player(&quot;p2&quot;, &quot;P2&quot;).player(&quot;p3&quot;, &quot;P3&quot;).build();\n        race.start();\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;int[]&gt;&gt; fs = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 8; i++) {\n            final int seed = i;\n            fs.add(pool.submit(() -&gt; {\n                go.await();\n                int ok = 0, refused = 0;\n                Random r = new Random(seed);\n                for (int k = 0; k &lt; 50; k++) {\n                    try { race.roll(&quot;p&quot; + r.nextInt(4)); ok++; }\n                    catch (OutOfTurnException e) { refused++; }\n                }\n                return new int[] { ok, refused };\n            }));\n        }\n        go.countDown();\n        int accepted = 0, refused = 0;\n        for (Future&lt;int[]&gt; f : fs) { int[] r = f.get(); accepted += r[0]; refused += r[1]; }\n        pool.shutdown();\n        List&lt;Turn&gt; log = race.history();\n        check(accepted + refused == 400, &quot;all 400 attempts finished: &quot; + accepted + &quot; accepted, &quot; + refused + &quot; refused&quot;);\n        check(log.size() == accepted, &quot;the log has exactly one row per accepted roll: &quot; + log.size());\n        check(shared.used() == accepted, &quot;a refused roll consumed no dice: &quot; + shared.used() + &quot; rolls for &quot; + accepted + &quot; turns&quot;);\n        Map&lt;String, Integer&gt; replay = new LinkedHashMap&lt;&gt;();\n        for (Player p : race.roster()) replay.put(p.id(), 0);\n        boolean noGap = true, continuous = true;\n        for (int i = 0; i &lt; log.size(); i++) {\n            Turn t = log.get(i);\n            if (t.number() != i + 1) noGap = false;\n            if (replay.get(t.playerId()) != t.from()) continuous = false;\n            replay.put(t.playerId(), t.to());\n        }\n        check(noGap, &quot;the turn numbers run 1..&quot; + log.size() + &quot; with no gap and no repeat&quot;);\n        check(continuous, &quot;every token starts each turn where its previous turn left it: no lost move&quot;);\n        check(replay.equals(race.positions()), &quot;replaying the log gives exactly the live board&quot;);\n        check(race.status() == GameStatus.IN_PROGRESS, &quot;the race did not accidentally finish the game&quot;);\n\n        // 2. eight threads roll for the SAME, correct player at the same instant: exactly one turn happens\n        Game one = classic(&quot;one&quot;).dice(new ScriptedDice(true, 4)).player(&quot;a&quot;, &quot;A&quot;).player(&quot;b&quot;, &quot;B&quot;).build();\n        one.start();\n        String due = one.whoseTurn();\n        ExecutorService p2 = Executors.newFixedThreadPool(8);\n        CountDownLatch go2 = new CountDownLatch(1);\n        List&lt;Future&lt;Boolean&gt;&gt; gs = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 8; i++)\n            gs.add(p2.submit(() -&gt; { go2.await(); try { one.roll(due); return true; } catch (OutOfTurnException e) { return false; } }));\n        go2.countDown();\n        int moved = 0;\n        for (Future&lt;Boolean&gt; f : gs) if (f.get()) moved++;\n        p2.shutdown();\n        check(moved == 1, &quot;exactly one of eight simultaneous rolls for the same player was accepted&quot;);\n        check(one.positionOf(&quot;a&quot;) == 4 &amp;&amp; one.turnNumber() == 1, &quot;the token moved exactly once, to cell 4&quot;);\n        check(&quot;b&quot;.equals(one.whoseTurn()), &quot;and the turn passed to b exactly once&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock per game. Does that scale, or have you serialised the server?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It scales, and the answer is arithmetic, not an opinion. Serialised means made to go one at a time. Per table that is true, for about half a microsecond: a queue peek, a string compare, the throw, two map gets, a map put, a rotation and a list append, none of which can block. A table rolls about once every three seconds, so its lock is busy about 0.00002% of the time. And the lock is per game: a million tables doing three hundred thousand rolls a second is 0.15 of one CPU core of locked work, spread over a million separate locks that never meet. When one machine is not enough, <code>GameRouter</code> sends every request for a game to the one server that holds it, picked by the game id. Each game's lock still lives in one process, and <code>Game</code> does not change.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: many servers -- every roll for one game goes to the one server that holds it\n/**\n * Scaling out without touching Game: the game id picks the server, so every request for one table lands in the\n * same process, and that game&#x27;s own lock is still the whole concurrency answer. floorMod, because a hashCode can\n * be negative. Adding a server here moves most games; consistent hashing (servers placed on a ring, so a new one\n * takes games only from its neighbour) moves few -- name it if they ask about growing the fleet.\n */\nfinal class GameRouter {\n    private final List&lt;GameServer&gt; servers;\n    GameRouter(List&lt;GameServer&gt; servers) { this.servers = List.copyOf(servers); }\n    /** The one server that owns this game: the same id always gives the same server. */\n    GameServer serverFor(String gameId) { return servers.get(Math.floorMod(gameId.hashCode(), servers.size())); }\n}\n\n/**\n * The thin caller: it finds the game and calls it. It owns no game state and takes no lock of its own, which\n * is exactly why a million tables can play at the same time -- each game&#x27;s own lock is the only place anyone waits.\n */\nfinal class GameServer {\n    private final Map&lt;String, Game&gt; games = new ConcurrentHashMap&lt;&gt;();\n    /** Put a built game on the server. Refused if the id is taken: a second table must never replace the first. */\n    Game host(Game g) {\n        if (games.putIfAbsent(g.id(), g) != null) throw new IllegalArgumentException(&quot;a game with id &quot; + g.id() + &quot; is already hosted&quot;);\n        return g;\n    }\n    /** The game, or an error. O(1). */\n    Game game(String gameId) {\n        Game g = games.get(gameId);\n        if (g == null) throw new NoSuchElementException(&quot;no such game: &quot; + gameId);\n        return g;\n    }\n    /** One roll from one phone. The server does nothing but route: the game decides whether it is allowed. */\n    Turn roll(String gameId, String playerId) { return game(gameId).roll(playerId); }\n    /** How many tables are live. */\n    int size() { return games.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>4 &middot; A six rolls again, and three sixes in a row cancel all three. Where does each part go?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The extra-turn rule is an interface, and it is pure. The game hands it the throw and how many extra throws this player has had in a row; it answers <code>PASS</code>, <code>AGAIN</code> or <code>CANCEL_STREAK</code>. \"A six rolls again\" is <code>ExtraTurnOnMax</code>. The three-sixes rule is not a copy of it: <code>CappedExtraTurn</code> wraps any rule and turns the third <code>AGAIN</code> in a row into a cancel, which is the Decorator. The game's part is a few lines in <code>roll()</code>. On <code>AGAIN</code> it keeps the same player on turn and counts the streak (the throws they have made in a row). On <code>CANCEL_STREAK</code> it puts the token back where the streak began (the <code>from</code> of the streak's first row in the log) and passes the turn. If the house voids only the third six, the token stays where it is instead. The test throws three sixes and asserts the token is back on 0 and the next player is due.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * What a throw means for the thrower: the turn passes, they throw again, or the whole streak (the throws they\n * have made in a row this go) is cancelled and the token goes back to where the streak began.\n */\nenum Next { PASS, AGAIN, CANCEL_STREAK }\n\n// &quot;a six rolls again -- and three sixes in a row cancel all three&quot; -&gt; a rule that wraps a rule -&gt; Decorator\n/** Whether the same player throws again. Pure: the game hands in the throw and how many extras this player has had. */\ninterface ExtraTurnRule {\n    /** @param roll what they just threw, @param extrasSoFar how many extra throws in a row they have already had. */\n    Next after(int roll, int extrasSoFar);\n}\n\n/** The plain rule: one throw, one turn. */\nfinal class NoExtraTurn implements ExtraTurnRule {\n    @Override public Next after(int roll, int extrasSoFar) { return Next.PASS; }\n}\n\n/** Throw the maximum (a six on one die) and go again. */\nfinal class ExtraTurnOnMax implements ExtraTurnRule {\n    private final int max;\n    /** @param max the highest total the dice can throw, usually 6. */\n    ExtraTurnOnMax(int max) { this.max = max; }\n    @Override public Next after(int roll, int extrasSoFar) { return roll == max ? Next.AGAIN : Next.PASS; }\n}\n\n/**\n * The house rule, as a wrapper rather than a copy: whatever the inner rule says, the throw that would be the\n * cap-th &quot;again&quot; in a row cancels the whole streak instead -- three sixes and all three are void. It adds that\n * limit to any extra-turn rule, including ones written next year.\n */\nfinal class CappedExtraTurn implements ExtraTurnRule {\n    private final ExtraTurnRule base;\n    private final int cap;\n    /** @param cap the throw that would make `cap` in a row cancels them all: 3 = three sixes cancel. */\n    CappedExtraTurn(ExtraTurnRule base, int cap) { this.base = base; this.cap = cap; }\n    @Override public Next after(int roll, int extrasSoFar) {\n        Next n = base.after(roll, extrasSoFar);\n        return n == Next.AGAIN &amp;&amp; extrasSoFar + 1 &gt;= cap ? Next.CANCEL_STREAK : n;\n    }\n}\n\n// in Game.roll(), under the lock: the lines that act on the answer\nNext next = extraRule.after(roll, extrasInARow);\nboolean played = next != Next.CANCEL_STREAK;\nif (!played) {                                        // e.g. a third six: back to where the streak began\n    to = extrasInARow == 0 ? from : log.get(log.size() - extrasInARow).from();\n} else {\n    // ... the normal move: the landing cell, then the jumps\n}\nboolean again = played &amp;&amp; !won &amp;&amp; hold == 0 &amp;&amp; next == Next.AGAIN;\nif (won) finish(playerId);\nelse if (again) extrasInARow++;\nelse passTurn();                                      // rotate last, so a reader is never half-updated\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; Must you land exactly on the last cell? And what if you need a six to get on the board at all?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both are the same seam, which is why neither costs a line inside <code>Game</code>. <code>OvershootStays</code> is the classic rule: a throw that would pass the last cell is wasted and the token stays. <code>BounceBack</code> sends the extra steps back off the end, and <code>ReachOrPass</code> clamps the landing in one line. The entry rule is not a fourth copy: <code>MustRollSixToEnter</code> <i>wraps</i> whichever rule you already had and answers 0 while the token is still off the board, so \"a six to start\" and \"bounce back off 100\" compose for free. The win check never changes either: <code>to == board.size()</code> on the cell the token came to rest on, so a ladder onto the last cell wins too.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** The rule that turns a roll into the cell the token lands on, BEFORE any snake or ladder is applied. */\ninterface MoveStrategy {\n    /** The landing cell. Must be between 0 and boardSize; the game refuses anything else rather than trusting it. */\n    int landingCell(int from, int roll, int boardSize);\n}\n\n/** The classic rule: a roll that would go past the last cell is wasted and the token stays where it is. */\nfinal class OvershootStays implements MoveStrategy {\n    @Override public int landingCell(int from, int roll, int boardSize) {\n        int target = from + roll;\n        return target &gt; boardSize ? from : target;\n    }\n}\n\n/** The other common rule: you must land exactly, and the extra steps bounce back off the last cell. */\nfinal class BounceBack implements MoveStrategy {\n    @Override public int landingCell(int from, int roll, int boardSize) {\n        int target = from + roll;\n        if (target &lt;= boardSize) return target;\n        int bounced = boardSize - (target - boardSize);\n        return bounced &lt; 0 ? from : bounced;                      // a roll bigger than the whole board: stay\n    }\n}\n\n// ---- ext: the two house rules they change mid-round -- both are one small MoveStrategy, and Game is untouched\n/**\n * &quot;You win by reaching OR passing the last cell.&quot; One line: clamp the landing to the last cell. The game&#x27;s\n * win check is still `to == boardSize`, so nothing in the turn loop is edited -- that is the whole point of\n * having pulled the rule out in move 3.\n */\nfinal class ReachOrPass implements MoveStrategy {\n    @Override public int landingCell(int from, int roll, int boardSize) { return Math.min(from + roll, boardSize); }\n}\n\n/**\n * A common house rule: a token sits off the board on cell 0 and only a six brings it on. It is a WRAPPER, not a\n * copy -- it adds the entry gate to whatever rule you already had for the far end of the board, so &quot;must throw a\n * six to start&quot; and &quot;bounce back off 100&quot; compose for free. This is the Decorator of move 3 again, on a different\n * interface.\n */\nfinal class MustRollSixToEnter implements MoveStrategy {\n    private final MoveStrategy inner;\n    private final int entryRoll;\n    /** @param inner the rule for a token already on the board, @param entryRoll the throw that lets you on (6). */\n    MustRollSixToEnter(MoveStrategy inner, int entryRoll) { this.inner = inner; this.entryRoll = entryRoll; }\n    MustRollSixToEnter(MoveStrategy inner) { this(inner, 6); }\n    @Override public int landingCell(int from, int roll, int boardSize) {\n        if (from == 0 &amp;&amp; roll != entryRoll) return 0;                  // still off the board: the throw is wasted\n        return inner.landingCell(from, roll, boardSize);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; A ladder&#x27;s top is a snake&#x27;s head. Does the token take the snake too? And what if the layout makes a loop?</h3><button class=\"timer\" data-min=\"6\">start 6:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Ask, and expect \"yes\": the machine-coding statement Flipkart candidates practise (workat.tech's) says a token that ends on another snake or ladder keeps going. So <code>roll()</code> follows jumps until the token rests on a plain cell, and the <code>Turn</code> records every jump it took, in order. A layout can then loop (10 up to 30, 30 down to 20, 20 back to 10) and move a token for ever. So <code>Board.addJump</code> walks the chain the new jump would land on, and refuses the jump if the walk comes back to its start. That check runs once, in <code>build()</code>, and the board is frozen after it, so the turn loop never meets a loop; its own guard only catches a board subclass that misbehaves. If they say \"one jump per move\" (LeetCode 909's rule), the <code>for</code> in <code>roll()</code> becomes an <code>if</code>.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Add a snake or a ladder, refusing a layout that would make the game wrong: endpoints must be on the\n     * board, one cell does at most one thing (so a snake head cannot also be a ladder foot), nothing may start\n     * on the winning cell, and no chain of jumps may come back to where it started -- jumps chain (a ladder\n     * may end on a snake&#x27;s head), so a loop would move a token for ever.\n     */\n    void addJump(Jump j) {\n        requireOpen();\n        if (j.start() &lt; 1 || j.start() &gt; size) throw new IllegalArgumentException(&quot;jump starts off the board: &quot; + j);\n        if (j.end() &lt; 1 || j.end() &gt; size) throw new IllegalArgumentException(&quot;jump ends off the board: &quot; + j);\n        if (j.start() == size) throw new IllegalArgumentException(&quot;nothing may start on the winning cell: &quot; + j);\n        Jump other = jumps.get(j.start());\n        if (other != null) throw new IllegalArgumentException(&quot;cell &quot; + j.start() + &quot; already has &quot; + other + &quot;, cannot also have &quot; + j);\n        if (mines.containsKey(j.start())) throw new IllegalArgumentException(&quot;cell &quot; + j.start() + &quot; already has a mine&quot;);\n        for (int c = j.end(); jumps.containsKey(c); ) {              // walk the chain this jump would land on\n            c = jumps.get(c).end();\n            if (c == j.start()) throw new IllegalArgumentException(j + &quot; would close a loop: its chain comes back to &quot; + c);\n        }\n        jumps.put(j.start(), j);\n    }\n\n// in Game.roll(), under the lock\nfor (Jump j = board.jumpAt(to); j != null; j = board.jumpAt(to)) {   // jumps chain to a plain cell\n    path.add(j);\n    to = j.end();\n    if (to &lt; 0 || to &gt; board.size() || path.size() &gt; board.size())\n        throw new IllegalStateException(&quot;the jumps left the board or looped at &quot; + to);\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>7 &middot; They want to play on for second and third place, until one player is left.</h3><button class=\"timer\" data-min=\"6\">start 6:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It is a bonus in the common machine-coding statement, and it turns \"one winner\" into a finish order. When a token rests on the last cell, <code>finish()</code> adds the player to <code>finishOrder</code> and takes them out of the turn queue (they were its head). The game ends at that first finish unless the builder said <code>playToLast()</code>; then it ends when only one player is still playing, and that player comes last. Nothing else changes: the others keep rotating, <code>winner()</code> is first place, and undo un-finishes a player by putting them back at the head of the queue. The test plays three players on a ten-cell board: a finishes first and play goes on, b finishes second and the game ends, with c last.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * The player on turn rested on the last cell: they take the next place and leave the rotation. The game ends\n     * at the first finisher, or -- when the table plays on to the last -- once only one player is still playing.\n     */\n    private void finish(String playerId) {\n        finishOrder.add(playerId);\n        turns.poll();                                                 // the finisher was the head of the queue\n        extrasInARow = 0;\n        if (!playToLast || turns.size() &lt; 2) status = GameStatus.FINISHED;\n    }\n\n// GameBuilder\n/** Play on after the first finisher, for second and third place, until one player is left. */\nGameBuilder playToLast() { playToLast = true; return this; }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>8 &middot; A rule you were handed gives back a cell that is not on the board. What is the state of the game?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was. Nothing is written until the whole turn has been worked out. The time stamp, the throw, the landing cell, the jumps and the win go into local variables, and the landing and every jump's end are checked against the board before the first <code>put</code>. So a broken move rule throws, the token has not moved, the log has no row, the queue has not rotated and the same player is still due; the client simply rolls again. The clock is read in that first half too, because it is handed in and can fail: read after the first write, a failing clock would leave a moved token with no log row. The tests hand in a rule that returns <code>size + 99</code>, and a clock that throws, and assert all four. The one thing that is spent is the die itself, which is honest: the throw already happened.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * One turn, and the method that holds the design. The order is the design:\n     *   1 the game must be in progress and it must be this player&#x27;s turn -- checked BEFORE a die is touched,\n     *     so a phone that presses roll out of turn costs the game nothing, not even a random number;\n     *   2 read the clock, roll, ask the extra-turn rule, ask the move rule for the landing cell, follow the\n     *     jumps to a plain cell, decide the win, a mine, a capture and the extra turn -- all into local variables;\n     *   3 only now write: the positions, the counters, the log, the places, and the rotation LAST.\n     * Anything that throws in step 2 leaves the game exactly as it was and the same player still to move.\n     *\n     * @throws OutOfTurnException if it is not this player&#x27;s turn\n     * @throws IllegalStateException if the game has not started or is already finished\n     */\n    Turn roll(String playerId) {\n        Turn t;\n        lock.lock();\n        try {\n            if (status != GameStatus.IN_PROGRESS) throw new IllegalStateException(&quot;the game is &quot; + status);\n            String due = turns.peek();\n            if (!playerId.equals(due)) throw new OutOfTurnException(playerId + &quot; rolled, but it is &quot; + due + &quot;&#x27;s turn&quot;);\n            long now = clock.nowMs();                                 // an injected call can fail: before any write\n            if (sittingOut.containsKey(playerId)) {\n                t = passWithoutMoving(playerId, TurnKind.HELD, now);  // a mine holds them: no die, the turn passes\n            } else {\n                int roll = dice.roll();                               // every check passed: now the die is spent\n                int from = positions.get(playerId);\n                Next next = extraRule.after(roll, extrasInARow);\n                boolean played = next != Next.CANCEL_STREAK;\n                int landedOn = from, to;\n                List&lt;Jump&gt; path = new ArrayList&lt;&gt;(2);\n                if (!played) {                                        // e.g. a third six: back to where the streak began\n                    to = extrasInARow == 0 ? from : log.get(log.size() - extrasInARow).from();\n                } else {\n                    landedOn = moveRule.landingCell(from, roll, board.size());\n                    if (landedOn &lt; 0 || landedOn &gt; board.size())\n                        throw new IllegalStateException(&quot;the move rule returned an off-board cell: &quot; + landedOn);\n                    to = landedOn;\n                    for (Jump j = board.jumpAt(to); j != null; j = board.jumpAt(to)) {   // jumps chain to a plain cell\n                        path.add(j);\n                        to = j.end();\n                        if (to &lt; 0 || to &gt; board.size() || path.size() &gt; board.size())\n                            throw new IllegalStateException(&quot;the jumps left the board or looped at &quot; + to);\n                    }\n                }\n                boolean won = played &amp;&amp; to == board.size();           // the win is checked on the RESTING cell\n                int hold = played &amp;&amp; !won ? board.holdAt(to) : 0;     // a mine: sit out the next `hold` turns\n                String sentHome = capture &amp;&amp; played &amp;&amp; !won ? tokenOn(to, playerId) : null;\n                boolean again = played &amp;&amp; !won &amp;&amp; hold == 0 &amp;&amp; next == Next.AGAIN;\n\n                positions.put(playerId, to);                          // the first write of the whole method\n                if (sentHome != null) positions.put(sentHome, startOf(sentHome));\n                if (hold &gt; 0) sittingOut.put(playerId, hold);\n                for (Jump j : path) jumpsTaken.merge(j.kind(), 1, Integer::sum);\n                t = new Turn(++turnNo, playerId, played ? TurnKind.PLAYED : TurnKind.CANCELLED, roll, from, landedOn, to,\n                             List.copyOf(path), sentHome, again, won, now);\n                log.add(t);\n                if (won) finish(playerId);\n                else if (again) extrasInARow++;\n                else passTurn();                                      // rotate last, so a reader is never half-updated\n            }\n        } finally { lock.unlock(); }\n        publish(t);                                                   // the screens hear outside the lock\n        return t;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>9 &middot; The screen asks &quot;what is on cell 47?&quot; and &quot;whose turn is it?&quot; a thousand times a second.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both are already one hop, and no new structure is needed. A landing resolves through <code>Map&lt;Integer, Jump&gt;</code>, which stores only the twenty-odd cells that do something rather than a hundred objects of which eighty are empty; a chain of jumps is one hop per jump. Whose turn it is, is <code>peek</code> on an <code>ArrayDeque</code>; rotating is <code>poll</code> then <code>addLast</code>, both O(1), which is why the turn order is a queue and not a list with an index somebody has to maintain. A position is a map get. These reads take the game's lock, so a caller never sees a half-applied turn; that costs tens of nanoseconds. If a UI later needs a picture per cell, a dense array of cells becomes the better home and nothing else changes.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The board: a number line from 1 to size, plus the handful of cells that do something. The jumps are kept in\n * a map keyed by their start cell because they are sparse -- about twenty interesting cells on a hundred -- so\n * a landing is one hash lookup instead of a scan. Every board rule is enforced here, while the board is built,\n * and build() then freezes it, so the turn loop never has to check a layout it was given.\n */\nclass Board {\n    private final int size;\n    private final Map&lt;Integer, Jump&gt; jumps = new HashMap&lt;&gt;();\n    private final Map&lt;Integer, Integer&gt; mines = new HashMap&lt;&gt;();      // cell -&gt; how many turns it holds you\n    private boolean frozen;                                            // set once by build(); published with the game\n    /** @param size the last cell, and the cell you must rest on to win. */\n    Board(int size) {\n        if (size &lt; 2) throw new IllegalArgumentException(&quot;a board needs at least two cells: &quot; + size);\n        this.size = size;\n    }\n    /** The last cell. */\n    int size() { return size; }\n    /**\n     * Add a snake or a ladder, refusing a layout that would make the game wrong: endpoints must be on the\n     * board, one cell does at most one thing (so a snake head cannot also be a ladder foot), nothing may start\n     * on the winning cell, and no chain of jumps may come back to where it started -- jumps chain (a ladder\n     * may end on a snake&#x27;s head), so a loop would move a token for ever.\n     */\n    void addJump(Jump j) {\n        requireOpen();\n        if (j.start() &lt; 1 || j.start() &gt; size) throw new IllegalArgumentException(&quot;jump starts off the board: &quot; + j);\n        if (j.end() &lt; 1 || j.end() &gt; size) throw new IllegalArgumentException(&quot;jump ends off the board: &quot; + j);\n        if (j.start() == size) throw new IllegalArgumentException(&quot;nothing may start on the winning cell: &quot; + j);\n        Jump other = jumps.get(j.start());\n        if (other != null) throw new IllegalArgumentException(&quot;cell &quot; + j.start() + &quot; already has &quot; + other + &quot;, cannot also have &quot; + j);\n        if (mines.containsKey(j.start())) throw new IllegalArgumentException(&quot;cell &quot; + j.start() + &quot; already has a mine&quot;);\n        for (int c = j.end(); jumps.containsKey(c); ) {              // walk the chain this jump would land on\n            c = jumps.get(c).end();\n            if (c == j.start()) throw new IllegalArgumentException(j + &quot; would close a loop: its chain comes back to &quot; + c);\n        }\n        jumps.put(j.start(), j);\n    }\n    /** Add a mine: a token that rests here sits out its next `turns` turns. Same rules: one thing per cell. */\n    void addMine(int cell, int turns) {\n        requireOpen();\n        if (cell &lt; 1 || cell &gt;= size) throw new IllegalArgumentException(&quot;a mine must be on the board, not on the last cell: &quot; + cell);\n        if (turns &lt; 1) throw new IllegalArgumentException(&quot;a mine holds you for at least one turn: &quot; + turns);\n        if (jumps.containsKey(cell) || mines.containsKey(cell)) throw new IllegalArgumentException(&quot;cell &quot; + cell + &quot; already does something&quot;);\n        mines.put(cell, turns);\n    }\n    /** The jump that starts on this cell, or null for a plain cell. O(1). */\n    Jump jumpAt(int cell) { return jumps.get(cell); }\n    /** How many turns a token resting here must sit out: 0 on every cell but a mine. O(1). */\n    int holdAt(int cell) { return mines.getOrDefault(cell, 0); }\n    /** How many snakes and ladders there are, for a display. */\n    int jumpCount() { return jumps.size(); }\n    /** Called by build(): from now on the layout cannot change, so what build() checked stays true. */\n    void freeze() { frozen = true; }\n    private void requireOpen() {\n        if (frozen) throw new IllegalStateException(&quot;the board is fixed once a game is built on it&quot;);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; &quot;Take that move back&quot;: the phone fired twice and the wrong roll went in.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Undo is cheap only because of the order in move 6: every write of a turn goes through one method, in one order, so undo is that list read upwards. Under the same lock it puts the position back to the turn's <code>from</code>, brings back a token the move sent home and brings the jump counters down. Then it takes a mine's hold off (or owes a held turn again), drops the log row, un-finishes a player, and rotates the queue backwards if that turn rotated it. The extra-throw counter is not stored anywhere else either: it is read back off the log. Two things it deliberately does not do. It does not un-throw the die, because the throw really happened and pretending otherwise would break a seeded replay. And it does not tell the observers, because <code>onTurn</code> means a turn happened; telling them would mean a second method on <code>GameObserver</code>, and a two-method interface is a real cost.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Take the last turn back: a misclick, a phone that fired twice, a referee at a tournament. It is a walk\n     * backwards through the writes roll() made, under the same lock: the position goes back to `from`, a token\n     * it knocked home comes back, the jump counters come down, a mine&#x27;s hold is taken off (or a held turn is\n     * owed again), the log row is dropped, a finish is unmade, and the queue is rotated backwards if that turn\n     * rotated it. Because the Turn record kept `from`, there is no separate undo stack.\n     * The observers are NOT told: onTurn means &quot;a turn happened&quot;. Telling them would need a second method on\n     * GameObserver, and a two-method interface is a real cost -- name it rather than pretend it is free.\n     *\n     * @return the turn that was undone\n     * @throws IllegalStateException if no turn has been played, or the game was ended by players leaving\n     */\n    Turn undoLastTurn() {\n        lock.lock();\n        try {\n            if (log.isEmpty()) throw new IllegalStateException(&quot;there is no turn to undo&quot;);\n            Turn t = log.get(log.size() - 1);\n            if (status == GameStatus.FINISHED &amp;&amp; !t.won())\n                throw new IllegalStateException(&quot;the game ended because players left; there is no move to take back&quot;);\n            log.remove(log.size() - 1);\n            turnNo--;\n            positions.put(t.playerId(), t.from());\n            if (t.sentHome() != null) positions.put(t.sentHome(), t.to());   // the knocked-home token comes back\n            for (Jump j : t.jumps()) jumpsTaken.merge(j.kind(), -1, Integer::sum);\n            if (t.kind() == TurnKind.HELD) sittingOut.merge(t.playerId(), 1, Integer::sum);   // that held turn is owed again\n            else if (t.kind() == TurnKind.PLAYED &amp;&amp; !t.won() &amp;&amp; board.holdAt(t.to()) &gt; 0) sittingOut.remove(t.playerId());\n            if (t.won()) {                                           // un-finish: back to the head of the queue\n                finishOrder.remove(finishOrder.size() - 1);\n                turns.addFirst(t.playerId());\n                status = GameStatus.IN_PROGRESS;\n            } else if (!t.extraTurn() &amp;&amp; t.playerId().equals(turns.peekLast())) {\n                turns.addFirst(turns.pollLast());                    // un-rotate, unless somebody has left since\n            }\n            extrasInARow = extrasBehind(turns.peek());               // read the counter back off the log\n            return t;\n        } finally { lock.unlock(); }\n    }\n\n    /** How many extra throws in a row this player had already had, counted backwards off the log. */\n    private int extrasBehind(String playerId) {\n        int n = 0;\n        for (int i = log.size() - 1; i &gt;= 0; i--) {\n            Turn x = log.get(i);\n            if (!x.playerId().equals(playerId) || !x.extraTurn()) break;\n            n++;\n        }\n        return n;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; PhonePe&#x27;s version: a crocodile takes you five back, a mine holds you for two turns, and landing on another token sends it back to its start.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Say which are free before you type. The crocodile is free: it is a snake whose tail is five cells below its head, so <code>crocodile(12)</code> is <code>jump(12, 7)</code>, and the chain, the counters and undo already handle it. The mine is not free, because it changes whose turn it is rather than where a token is. The board keeps mines beside the jumps (<code>holdAt(cell)</code>, one map get), and the game keeps who is still sitting out. When a held player is due, <code>roll()</code> writes a HELD turn without touching the die and passes the turn. Capture is a rule across players, so it runs inside the same lock. After the move, a token still in play on that cell goes back to its start (PhonePe starts everyone on 1), and the <code>Turn</code> records whose it was, so undo can put it back. The test plays seven turns on five throws and checks each effect, then undoes them.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// GameBuilder\n/** A crocodile takes you exactly five cells back: it is a snake of length five, so it IS a jump. */\nGameBuilder crocodile(int cell) { return jump(cell, cell - 5); }\n/** A mine: a token that rests here sits out its next `turns` turns. */\nGameBuilder mine(int cell, int turns) { mines.put(cell, turns); return this; }\n/** Landing on a cell another token is on sends that token back to its start (off: tokens may share a cell). */\nGameBuilder capture() { capture = true; return this; }\n\n// Board\n/** Add a mine: a token that rests here sits out its next `turns` turns. Same rules: one thing per cell. */\nvoid addMine(int cell, int turns) {\n    requireOpen();\n    if (cell &lt; 1 || cell &gt;= size) throw new IllegalArgumentException(&quot;a mine must be on the board, not on the last cell: &quot; + cell);\n    if (turns &lt; 1) throw new IllegalArgumentException(&quot;a mine holds you for at least one turn: &quot; + turns);\n    if (jumps.containsKey(cell) || mines.containsKey(cell)) throw new IllegalArgumentException(&quot;cell &quot; + cell + &quot; already does something&quot;);\n    mines.put(cell, turns);\n}\n/** How many turns a token resting here must sit out: 0 on every cell but a mine. O(1). */\nint holdAt(int cell) { return mines.getOrDefault(cell, 0); }\n\n// Game.roll(), under the lock\nif (sittingOut.containsKey(playerId)) {\n    t = passWithoutMoving(playerId, TurnKind.HELD, now);  // a mine holds them: no die, the turn passes\n} else {\n    // ... the throw and the move, in the order of move 6\nint hold = played &amp;&amp; !won ? board.holdAt(to) : 0;     // a mine: sit out the next `hold` turns\nString sentHome = capture &amp;&amp; played &amp;&amp; !won ? tokenOn(to, playerId) : null;\n// ...\nif (sentHome != null) positions.put(sentHome, startOf(sentHome));\nif (hold &gt; 0) sittingOut.put(playerId, hold);\n\n/** A turn that passes with no throw (HELD or TIMED_OUT): logged like any other, then the turn moves on. */\nprivate Turn passWithoutMoving(String playerId, TurnKind kind, long now) {\n    int at = positions.get(playerId);\n    if (kind == TurnKind.HELD) sittingOut.computeIfPresent(playerId, (k, v) -&gt; v == 1 ? null : v - 1);\n    Turn t = new Turn(++turnNo, playerId, kind, 0, at, at, at, List.of(), null, false, false, now);\n    log.add(t);\n    passTurn();\n    return t;\n}\n/** Where this player&#x27;s token starts, and goes back to when it is captured: 0 (off the board) unless set. */\nprivate int startOf(String playerId) { return starts.getOrDefault(playerId, 0); }\n\n/** Another token still in play on this cell, or null. O(players) -- a table has fewer than ten. */\nprivate String tokenOn(int cell, String mover) {\n    if (cell == 0) return null;                                   // everyone may wait off the board\n    for (String p : turns) if (!p.equals(mover) &amp;&amp; positions.get(p) == cell) return p;\n    return null;\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>12 &middot; Build the game from input: Flipkart-style lines of snakes, ladders and players, or PhonePe&#x27;s config file of counts with a random board that is valid and can be won.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The lines are counts and pairs: snakes (head, tail), then ladders (start, end), then the players' names. <code>BoardInput.read</code> feeds every pair into the same builder, so a bad board is refused by the same checks in <code>build()</code>; it adds only \"a snake must go down, a ladder must go up\". PhonePe's config holds counts instead (players, a 10 x 10 board, 9 snakes, 8 ladders, 2 dice), so <code>GameConfig</code> asks <code>RandomBoard</code> for the layout. Its manual override is the builder's own seams: <code>ScriptedDice</code> for the throws and <code>startAt</code> for each start cell. The random board reuses the board's checks instead of copying them: propose a random pair, keep it only if <code>addJump</code> accepts it, repeat until the counts are met. One question the checks cannot answer: can the game be won at all? If the six cells before the last are all snake heads, nobody finishes. So <code>winnable</code> runs a breadth-first search (every cell one throw away, then two, and so on) from 0 and reports whether the last cell is ever reached, in O(cells x faces).</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the board from input -- the machine-coding format, and a random board that is valid and can be won\n/**\n * Reads the classic machine-coding input: the number of snakes, then one &quot;head tail&quot; pair each; the number of\n * ladders, then one &quot;start end&quot; pair each; the number of players, then one name each. Every pair goes into the\n * same builder, so a bad board is refused by the same checks in build(), with the same messages.\n */\nfinal class BoardInput {\n    /** Parse the input into a builder; the caller still chooses the dice and the rules, then calls build(). */\n    static GameBuilder read(Scanner in) {\n        GameBuilder b = new GameBuilder();\n        for (int s = in.nextInt(); s &gt; 0; s--) {\n            int head = in.nextInt(), tail = in.nextInt();\n            if (tail &gt;= head) throw new IllegalArgumentException(&quot;a snake must go down: &quot; + head + &quot; &quot; + tail);\n            b.jump(head, tail);\n        }\n        for (int l = in.nextInt(); l &gt; 0; l--) {\n            int start = in.nextInt(), end = in.nextInt();\n            if (end &lt;= start) throw new IllegalArgumentException(&quot;a ladder must go up: &quot; + start + &quot; &quot; + end);\n            b.jump(start, end);\n        }\n        for (int p = in.nextInt(); p &gt; 0; p--) { String name = in.next(); b.player(name, name); }\n        return b;\n    }\n}\n\n/**\n * PhonePe&#x27;s version reads a configuration (YAML or JSON there; a Java Properties file here, the same map of keys):\n * N players, a BS x BS board, S snakes, L ladders, D dice. It holds counts, not positions, so the board comes from\n * RandomBoard. The &quot;manual override&quot; the interviewer uses to test edge cases is the builder&#x27;s own seams: a\n * ScriptedDice for the throws and startAt for each token&#x27;s starting cell.\n */\nfinal class GameConfig {\n    /** keys: players=Gaurav,Sagar  boardSize=10 (a 10 x 10 board)  snakes=9  ladders=8  dice=2 */\n    static GameBuilder from(Properties c, Random rng) {\n        int cells = Integer.parseInt(c.getProperty(&quot;boardSize&quot;, &quot;10&quot;));\n        cells *= cells;\n        GameBuilder b = new GameBuilder().boardSize(cells)\n            .board(RandomBoard.generate(cells, Integer.parseInt(c.getProperty(&quot;snakes&quot;, &quot;0&quot;)),\n                                        Integer.parseInt(c.getProperty(&quot;ladders&quot;, &quot;0&quot;)), rng))\n            .dice(Integer.parseInt(c.getProperty(&quot;dice&quot;, &quot;1&quot;)), 6).seed(rng.nextLong());   // D dice, added up\n        for (String name : c.getProperty(&quot;players&quot;).split(&quot;,&quot;)) b.player(name.trim(), name.trim());\n        return b;\n    }\n}\n\n/**\n * A random board, valid by construction: propose a random pair of cells and keep it only if the board accepts\n * it, so every placing rule (on the board, one thing per cell, nothing on the last cell, no loop) lives in ONE\n * place, Board.addJump. Then check the board can be won at all, with a breadth-first search over the cells:\n * start at 0, try every throw, follow the jumps, and see whether the last cell is ever reached.\n */\nfinal class RandomBoard {\n    /** A board of `size` cells with exactly this many snakes and ladders, from a seeded Random. */\n    static Board generate(int size, int snakes, int ladders, Random rng) {\n        for (int attempt = 0; attempt &lt; 100; attempt++) {\n            Board b = new Board(size);\n            int s = snakes, l = ladders;\n            for (int tries = 0; s + l &gt; 0 &amp;&amp; tries &lt; 100 * size; tries++) {\n                int a = 2 + rng.nextInt(size - 2), c = 2 + rng.nextInt(size - 2);   // cells 2..size-1\n                if (a == c || (a &gt; c ? s == 0 : l == 0)) continue;                 // a &gt; c is a snake\n                try { b.addJump(new Jump(a, c)); } catch (IllegalArgumentException refused) { continue; }\n                if (a &gt; c) s--; else l--;\n            }\n            if (s + l == 0 &amp;&amp; winnable(b, 6)) return b;\n        }\n        throw new IllegalArgumentException(&quot;cannot place &quot; + snakes + &quot; snakes and &quot; + ladders + &quot; ladders on &quot; + size + &quot; cells&quot;);\n    }\n\n    /** Can a token starting on 0 ever rest on the last cell? Breadth-first over the cells: O(cells x faces). */\n    static boolean winnable(Board b, int maxRoll) {\n        boolean[] seen = new boolean[b.size() + 1];\n        ArrayDeque&lt;Integer&gt; queue = new ArrayDeque&lt;&gt;(List.of(0));\n        seen[0] = true;\n        while (!queue.isEmpty()) {\n            int cell = queue.poll();\n            if (cell == b.size()) return true;\n            for (int r = 1; r &lt;= maxRoll &amp;&amp; cell + r &lt;= b.size(); r++) {         // an overshoot is wasted\n                int to = cell + r;\n                for (Jump j = b.jumpAt(to); j != null; j = b.jumpAt(to)) to = j.end();\n                if (!seen[to]) { seen[to] = true; queue.add(to); }\n            }\n        }\n        return false;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Make it a real online game: many tables, a request that gets retried, and a phone that disconnects.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Three separate things. Many tables: <code>GameServer</code> is a map from game id to game with no lock of its own, so two tables never wait for each other. An out-of-turn roll comes back as its own exception type, so the server can answer 409 (conflict: \"not your turn\") rather than 500 (a server fault). A retried request must be idempotent (applied once, however many times it arrives). <code>IdempotentRolls</code> claims the request id with one atomic <code>putIfAbsent</code> (a single step no other thread can cut into), plays the turn outside the map's lock, and hands every later copy the same <code>Turn</code>; doing the turn inside <code>computeIfAbsent</code> instead would let one slow screen stall another table's roll. A phone that disappears for good: <code>leave</code> takes the same lock, pulls the player out of the queue so the turn passes on at once, and ends the game when one player is left. A crash still loses the request record; only the database version below survives that.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: online play -- a retried request must move the token once\n/**\n * The same phone pressing roll twice, or a network retry, must move the token once. The request id is the key:\n * the first call claims it with ONE atomic putIfAbsent, then plays the turn OUTSIDE the map&#x27;s lock; every later\n * copy finds the claim and waits for the same Turn. Playing the turn inside computeIfAbsent would hold a lock\n * of the map while the game told its screens, so one slow screen could stall another table&#x27;s roll.\n * A failed turn removes its claim, so the client can simply retry. The honest caveat: in one process a crash\n * loses the record; the real fix is the database version below, where the turn row and the request id are\n * written in one transaction.\n */\nfinal class IdempotentRolls {\n    private final ConcurrentHashMap&lt;String, CompletableFuture&lt;Turn&gt;&gt; byRequest = new ConcurrentHashMap&lt;&gt;();\n    /** Play this turn once, however many times the request arrives; every copy gets the first one&#x27;s Turn. */\n    Turn roll(Game g, String playerId, String requestId) {\n        CompletableFuture&lt;Turn&gt; mine = new CompletableFuture&lt;&gt;();\n        CompletableFuture&lt;Turn&gt; first = byRequest.putIfAbsent(requestId, mine);   // the claim: one atomic step\n        if (first != null) return first.join();                                 // a copy: wait for the first answer\n        try {\n            Turn t = g.roll(playerId);                                          // no lock of the map is held here\n            mine.complete(t);\n            return t;\n        } catch (RuntimeException e) {\n            byRequest.remove(requestId, mine);                                  // nothing happened: a retry may play\n            mine.completeExceptionally(e);\n            throw e;\n        }\n    }\n}\n\n    /**\n     * A player quits or drops off the network. They come out of the turn queue, so the turn passes on at once\n     * if it was theirs; their token and their rows in the log stay, because history must keep telling the\n     * truth. When one player is left standing, the game is FINISHED -- and if nobody has finished yet, that\n     * player wins by default. Removing from the middle of the deque is O(n) in the number of PLAYERS, under ten.\n     *\n     * @throws NoSuchElementException if that player is not at this table\n     */\n    void leave(String playerId) {\n        lock.lock();\n        try {\n            if (status == GameStatus.FINISHED) throw new IllegalStateException(&quot;the game is &quot; + status);\n            boolean wasDue = playerId.equals(turns.peek());\n            if (!turns.remove(playerId)) throw new NoSuchElementException(&quot;not at this table: &quot; + playerId);\n            if (wasDue) extrasInARow = 0;                            // only the player on turn has a streak going\n            sittingOut.remove(playerId);\n            if (turns.size() == 1) {\n                if (finishOrder.isEmpty()) finishOrder.add(turns.peek());\n                status = GameStatus.FINISHED;\n            }\n        } finally { lock.unlock(); }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>14 &middot; Persist it. And now there are two servers.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The turn log goes behind <code>GameRepository</code>, whose one write is conditional: <code>applyTurn(gameId, expectedTurnNo, turn)</code> appends only if the stored game is still on the turn the caller thinks it is on. In SQL that is <code>UPDATE game SET turn_no = turn_no + 1 ... WHERE game_id = ? AND turn_no = ?</code>, so the turn number is the version. Zero rows updated means somebody else moved first: re-read and try again. That is the database doing what the <code>ReentrantLock</code> did in one process, across as many servers as you like: each server works out the turn exactly as <code>roll()</code> does, and the conditional write picks the one that counts. The turn row carries the request id with a unique index on it, so a network that delivers the same request twice applies it once. The in-memory version keeps the same rule, so the seam is tested without a database.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- the game becomes a row, and the lock becomes a conditional UPDATE\n/**\n * Beyond one process the turn number is the version: a turn is accepted only if the stored game is still on\n * the turn the caller thinks it is on. Two servers applying the same turn means one of them updates zero\n * rows and retries with fresh state -- the database doing exactly what the ReentrantLock did in one process.\n *\n *   UPDATE game SET turn_no = turn_no + 1, current_player = ?, positions = ?\n *    WHERE game_id = ? AND turn_no = ?           -- 0 rows updated = somebody else moved first\n *   INSERT INTO turn (game_id, turn_no, request_id, player, roll, from_cell, to_cell) VALUES (...)\n *                                                -- UNIQUE (game_id, request_id) makes the retry safe\n */\ninterface GameRepository {\n    /** Append a turn only if the game is still at expectedTurnNo. False means: re-read and try again. */\n    boolean applyTurn(String gameId, int expectedTurnNo, Turn t);\n    /** The stored turn number, which is the version a writer must match. */\n    int turnNoOf(String gameId);\n}\n\n/** A map standing in for the table, with the same compare-and-set semantics so the seam can be tested. */\nfinal class InMemoryGameRepository implements GameRepository {\n    private final Map&lt;String, List&lt;Turn&gt;&gt; rows = new ConcurrentHashMap&lt;&gt;();\n    @Override public synchronized boolean applyTurn(String gameId, int expectedTurnNo, Turn t) {\n        List&lt;Turn&gt; ts = rows.computeIfAbsent(gameId, k -&gt; new ArrayList&lt;&gt;());\n        if (ts.size() != expectedTurnNo) return false;                 // the WHERE clause failed: 0 rows\n        ts.add(t);\n        return true;\n    }\n    @Override public synchronized int turnNoOf(String gameId) { return rows.getOrDefault(gameId, List.of()).size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Where does time come from, and how does a player who has not rolled in thirty seconds lose the turn?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The game has a <code>Clock</code> it was handed and stamps every turn with it; nothing else reads the wall clock. A test hands in a clock that returns a fixed instant and moves it by hand, so thirty seconds pass in no time at all. The timer itself is not in the game: it is a small object wired in as an observer, so every turn tells it who is on the clock now. Either a sweeper thread or the next request asks whether that player is late. When they are, it calls <code>forfeitTurn</code>, which takes the same lock, writes a TIMED_OUT turn and rotates the queue, so a forfeit is in the log and the replay like everything else. Who is on the clock, and since when, are one value that is never modified, swapped in one write. Kept as two fields, a sweeper could pair the new player with the old start time and forfeit a turn that had just begun; a test forces exactly that moment.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: turn timers -- a player who does not roll in time forfeits, and the game is never blocked\n/**\n * Thirty seconds to roll. It is wired in as an observer, so every turn tells it who is on the clock now,\n * and a sweeper thread (or the next request, which is cheaper) calls forfeitIfLate. It reads the injected\n * Clock and never the wall clock, so a test can make thirty seconds pass instantly. Who is on the clock and\n * since when are ONE value written in one step: a sweeper can never pair the new player with the old start time.\n */\nfinal class TurnTimer {\n    /** Who is on the clock, and since when. Immutable, so it is always a matching pair. */\n    private record Deadline(String playerId, long sinceMs) {}\n    private final Clock clock;\n    private final long limitMs;\n    private volatile Deadline current;                                 // one write swaps both halves at once\n    TurnTimer(Clock clock, long limitMs) { this.clock = clock; this.limitMs = limitMs; }\n    /** Start the clock for whoever is now due. Wire it as an observer: game.addObserver((id, t) -&gt; timer.watch(game.whoseTurn())). */\n    void watch(String playerId) { current = new Deadline(playerId, clock.nowMs()); }\n    /** Forfeit the turn if the clock has run out. Returns true if it did. Safe to call from anywhere. */\n    boolean forfeitIfLate(Game g) {\n        Deadline d = current;                                          // read once: a pair that belongs together\n        if (d == null || clock.nowMs() - d.sinceMs() &lt; limitMs) return false;\n        try { g.forfeitTurn(d.playerId()); return true; }\n        catch (IllegalStateException e) { return false; }              // somebody already moved: nothing to do\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Which pattern is where, which SOLID letter is where, and where would a Factory earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None of them was chosen up front; each is what a move produced, and that is how to say it. Strategy is move 3: the dice, the move rule and the extra-turn rule are the three things that will change. Decorator is the same move twice over: <code>CappedExtraTurn</code> wraps an extra-turn rule, <code>MustRollSixToEnter</code> wraps a move rule. Observer is move 4's rule that a screen is never inside the lock. State is move 6, which is why a roll after the win is refused. Command is move 6 again, because the <code>Turn</code> record keeps <code>from</code> as well as <code>to</code>, which is what makes <code>undoLastTurn()</code> possible with no extra state. Builder is the one to argue: on most LLDs it is extra code with no job. Here there are a dozen optional knobs and four invariants, <code>build()</code> is the one place they are checked, and Game's constructor is package-private, so an invalid game cannot exist. Factory has not earned its name: <code>dice(count, faces)</code> already picks the class. It earns the name the day the rules arrive as strings in a config file, as in PhonePe's version, which is set up from a YAML or JSON file.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// S: one reason to change each\nJump   jumpAt(int cell)                       // Board: what is on a cell\nint    roll()                                 // Dice: a number\nTurn   roll(String playerId)                  // Game: the turn loop, and the lock\n\n// O + L: a new rule is a new file; the caller never asks which one it got\nfinal class ReachOrPass implements MoveStrategy {\n    @Override public int landingCell(int from, int roll, int boardSize) { return Math.min(from + roll, boardSize); }\n}\nnew GameBuilder().moveRule(new ReachOrPass())         // the only line that changes\n\n// Decorator: a rule wrapping a rule, on both interfaces\nnew CappedExtraTurn(new ExtraTurnOnMax(6), 3)\nnew MustRollSixToEnter(new OvershootStays())\n\n// I: one method each, so a test double is a lambda\ninterface Dice          { int roll(); }\ninterface MoveStrategy  { int landingCell(int from, int roll, int boardSize); }\ninterface ExtraTurnRule { Next after(int roll, int extrasSoFar); }\ninterface GameObserver  { void onTurn(String gameId, Turn t); }\ninterface Clock         { long nowMs(); }\n\n// D: everything is handed in, which is what makes the failure tests possible\nnew GameBuilder().dice(new ScriptedDice(6, 6, 2)).clock(() -&gt; now[0])\n                 .moveRule((from, roll, size) -&gt; size + 99)   // deliberately broken, in a test\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\n\n/** Which way a jump goes. It is derived from the two cells, never stored: a snake goes down, a ladder goes up. */\nenum JumpKind { SNAKE, LADDER }\n\n/**\n * The game's life. WAITING = built and valid but nobody may roll yet; IN_PROGRESS = rolls are accepted;\n * FINISHED = the places are decided (the first to rest on the last cell, or everyone but one when the table plays\n * on to the last) and every further roll is refused.\n */\nenum GameStatus { WAITING, IN_PROGRESS, FINISHED }\n\n/**\n * How a turn went. PLAYED = a throw and a move; CANCELLED = the throw that broke the extra-turn rule (a third six):\n * the token goes back to where the streak began; HELD = sat out on a mine, no die thrown; TIMED_OUT = the clock ran\n * out, no die thrown. Every kind is a row in the log, so undo and replay treat them all the same way.\n */\nenum TurnKind { PLAYED, CANCELLED, HELD, TIMED_OUT }\n\n/**\n * A one-way teleport from one cell to another. A snake and a ladder are the SAME object: only the sign of\n * end - start differs, and a sign is data, not a reason for two classes. Immutable, and it validates the one\n * thing that is always true of a jump.\n */\nrecord Jump(int start, int end) {\n    Jump {\n        if (start == end) throw new IllegalArgumentException(\"a jump cannot start and end on the same cell: \" + start);\n    }\n    /** SNAKE if it drags you back, LADDER if it lifts you. Computed, so the two can never disagree. */\n    JumpKind kind() { return end < start ? JumpKind.SNAKE : JumpKind.LADDER; }\n    @Override public String toString() { return (kind() == JumpKind.SNAKE ? \"snake \" : \"ladder \") + start + \"->\" + end; }\n}\n\n/**\n * A person at the table. Deliberately immutable: the one thing that moves during a game is the token's\n * position, and the GAME owns that, so no two callers can ever write it at once -- and the same player can sit\n *

param factory how to build a sink for one key */\n    RoutingAppender(String name, String contextKey, java.util.function.Function&lt;String, LogAppender&gt; factory, int maxRoutes) {\n        this.name = name; this.contextKey = contextKey; this.factory = factory; this.maxRoutes = maxRoutes;\n    }\n\n    public String name() { return name; }\n\n    /** No key, or the cap reached, means the event is counted and dropped rather than opening file 100,001. */\n    public void append(LogEvent e) {\n        String key = e.context().get(contextKey);\n        if (key == null) { unrouted.incrementAndGet(); return; }\n        LogAppender target = routes.get(key);\n        if (target == null) {\n            if (routes.size() &gt;= maxRoutes) { unrouted.incrementAndGet(); return; }\n            target = routes.computeIfAbsent(key, k -&gt; { LogAppender a = factory.apply(k); a.start(); return a; });\n        }\n        target.append(e);\n    }\n\n    public void start() { started = true; }\n\n    /** Closes every sink it built. Nothing else knows those sinks exist. */\n    public void close() {\n        started = false;\n        for (LogAppender a : routes.values()) { try { a.close(); } catch (RuntimeException ex) { Status.error(name + &quot;: close&quot;, ex); } }\n    }\n\n    /** How many tenants have a file. */\n    int routeCount() { return routes.size(); }\n\n    /** Events with no key, or beyond the cap. */\n    long unroutedCount() { return unrouted.get(); }\n}\n\n// ---- ext: mask before anything hits disk -- a formatter that wraps a formatter\n/**\n * The Decorator again, one level down: it takes any layout, lets it build the line, then redacts the line.\n * Because it is a formatter it runs outside the sink&#x27;s lock, once, and every sink downstream inherits it.\n */\nfinal class MaskingFormatter implements LogFormatter {\n    private static final Pattern CARD = Pattern.compile(&quot;\\\\b\\\\d(?:[ -]?\\\\d){12,18}\\\\b&quot;);\n    private static final Pattern EMAIL = Pattern.compile(&quot;\\\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\\\.[A-Za-z]{2,}\\\\b&quot;);\n\n    private final LogFormatter inner;\n\n    /** @param inner the layout being wrapped: text, JSON, or another masker */\n    MaskingFormatter(LogFormatter inner) { this.inner = inner; }\n\n    /** Card numbers keep their last four; e-mail addresses keep their domain. */\n    public String format(LogEvent e) {\n        String line = inner.format(e);\n        Matcher m = CARD.matcher(line);\n        StringBuilder sb = new StringBuilder(line.length());\n        while (m.find()) {\n            String digits = m.group().replaceAll(&quot;\\\\D&quot;, &quot;&quot;);\n            String rep = luhn(digits) ? &quot;****-****-****-&quot; + digits.substring(digits.length() - 4) : m.group();\n            m.appendReplacement(sb, Matcher.quoteReplacement(rep));\n        }\n        m.appendTail(sb);\n        return EMAIL.matcher(sb.toString()).replaceAll(x -&gt; &quot;***@&quot; + x.group().substring(x.group().indexOf(&#x27;@&#x27;) + 1));\n    }\n\n    /** The checksum every card number satisfies. It is what keeps a long id or a timestamp from being redacted. */\n    static boolean luhn(String digits) {\n        int sum = 0;\n        boolean alt = false;\n        for (int i = digits.length() - 1; i &gt;= 0; i--) {\n            int d = digits.charAt(i) - &#x27;0&#x27;;\n            if (alt) { d *= 2; if (d &gt; 9) d -= 9; }\n            sum += d;\n            alt = !alt;\n        }\n        return sum % 10 == 0;\n    }\n}\n\n// ---- ext: log less -- sampling, and a cap on one repeated line, both behind the filter seam\n/**\n * Keeps one DEBUG event in N and leaves everything at or above the bar alone. Adding it to a subtree turns\n * that subtree&#x27;s volume down without touching a logger, a sink or a formatter.\n */\nfinal class SamplingFilter implements LogFilter {\n    private final int keepOneIn;\n    private final LogLevel untouchedFrom;\n    private final AtomicLong seen = new AtomicLong();\n\n    /** @param keepOneIn 100 keeps one per cent; @param untouchedFrom at and above this level nothing is sampled */\n    SamplingFilter(int keepOneIn, LogLevel untouchedFrom) { this.keepOneIn = keepOneIn; this.untouchedFrom = untouchedFrom; }\n\n    /** NEUTRAL means &quot;no opinion, carry on&quot;: the event survives unless something else denies it. */\n    public FilterDecision decide(LogEvent e) {\n        if (e.level().atLeast(untouchedFrom)) return FilterDecision.NEUTRAL;\n        return seen.incrementAndGet() % keepOneIn == 0 ? FilterDecision.NEUTRAL : FilterDecision.DENY;\n    }\n}\n\n/**\n * The mid-round rule change: a retry loop logged four hundred thousand identical WARNs and paged somebody.\n * This caps how often one distinct line may appear in a window. The counter is a compare-and-set over an\n * immutable window rather than a lock, because this sits on the hot path of every call.\n */\nfinal class RateLimitFilter implements LogFilter {\n    /** The count so far and when the window started, swapped as one value so it can never be half-updated. */\n    private record Window(long startMs, int used) {}\n\n    private final ConcurrentHashMap&lt;String, AtomicReference&lt;Window&gt;&gt; windows = new ConcurrentHashMap&lt;&gt;();\n    private final int maxPerWindow;\n    private final long windowMs;\n    private final Clock clock;\n    private final LogLevel untouchedFrom;\n    private final int maxKeys;\n    private final AtomicLong suppressed = new AtomicLong();\n\n    /** @param untouchedFrom ERROR and above are never throttled: you do not silence the thing that wakes you */\n    RateLimitFilter(int maxPerWindow, long windowMs, Clock clock, LogLevel untouchedFrom, int maxKeys) {\n        this.maxPerWindow = maxPerWindow; this.windowMs = windowMs; this.clock = clock;\n        this.untouchedFrom = untouchedFrom; this.maxKeys = maxKeys;\n    }\n\n    /** Keyed by logger plus message, so a thousand distinct lines are unaffected and one repeated line is capped. */\n    public FilterDecision decide(LogEvent e) {\n        if (e.level().atLeast(untouchedFrom)) return FilterDecision.NEUTRAL;\n        String key = e.loggerName() + &quot;|&quot; + e.message();\n        AtomicReference&lt;Window&gt; ref = windows.get(key);\n        if (ref == null) {\n            if (windows.size() &gt;= maxKeys) return FilterDecision.NEUTRAL;\n            ref = windows.computeIfAbsent(key, k -&gt; new AtomicReference&lt;&gt;(new Window(clock.nowMs(), 0)));\n        }\n        while (true) {\n            Window w = ref.get();\n            long now = clock.nowMs();\n            Window next = now - w.startMs() &gt;= windowMs ? new Window(now, 1) : new Window(w.startMs(), w.used() + 1);\n            if (next.used() &gt; maxPerWindow) { suppressed.incrementAndGet(); return FilterDecision.DENY; }\n            if (ref.compareAndSet(w, next)) return FilterDecision.NEUTRAL;\n        }\n    }\n\n    /** How many lines were suppressed. Export it, or the cap is a lie told to whoever reads the log. */\n    long suppressedCount() { return suppressed.get(); }\n}\n\n// ---- ext: context that cannot leak -- a scope a pooled thread cannot forget to clear\n/**\n * The MDC bug that only shows up in production: a pooled thread keeps a request id and stamps it on the next\n * tenant&#x27;s lines. try-with-resources makes forgetting impossible, because close() runs on every path out.\n */\nfinal class MdcScope implements AutoCloseable {\n    private final Map&lt;String, String&gt; saved;\n\n    /** Saves whatever this thread already had, then adds the new keys. */\n    MdcScope(Map&lt;String, String&gt; add) {\n        saved = Mdc.snapshot();\n        add.forEach(Mdc::put);\n    }\n\n    /** Two keys, the common case: MdcScope.of(&quot;rid&quot;, id). */\n    static MdcScope of(String k, String v) { return new MdcScope(Map.of(k, v)); }\n\n    /** Puts the thread&#x27;s context back exactly as it was, including &quot;empty&quot;. */\n    public void close() {\n        Mdc.clear();\n        saved.forEach(Mdc::put);\n    }\n}\n\n// ---- ext: ship the logs -- the appender as a network client, batched and at-least-once\n/** Whatever actually moves bytes off the box: HTTP, gRPC, a Kafka producer. A lambda in a test. */\ninterface LogTransport {\n    /** Send one batch under an id the far side can use to recognise a repeat. May throw; the sink catches it. */\n    void send(String batchId, List&lt;String&gt; lines);\n}\n\n/**\n * A sink that talks to a collector. It batches, and it clears the buffer only after the send returns: a\n * failed send leaves the lines exactly where they were and the next flush retries them, which is why the\n * batch carries an id -- at-least-once delivery plus an id at the far side is exactly-once storage.\n */\nfinal class HttpShipperAppender implements LogAppender {\n    private final String name;\n    private final LogFormatter formatter;\n    private final LogTransport transport;\n    private final int batchSize;\n    private final int maxPending;\n    private final List&lt;String&gt; pending = new ArrayList&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n    private final AtomicLong batches = new AtomicLong();\n    private final AtomicLong dropped = new AtomicLong();\n    private volatile boolean started;\n\n    /** @param maxPending the ceiling on the retry buffer: a collector that stays down must not eat the heap */\n    HttpShipperAppender(String name, LogFormatter formatter, LogTransport transport, int batchSize, int maxPending) {\n        this.name = name; this.formatter = formatter; this.transport = transport;\n        this.batchSize = batchSize; this.maxPending = maxPending;\n    }\n\n    public String name() { return name; }\n\n    /** Format outside the lock, as always; the lock covers only the buffer and the send. */\n    public void append(LogEvent e) {\n        if (!started) return;\n        String line;\n        try { line = formatter.format(e); } catch (RuntimeException ex) { Status.error(name + &quot;: format&quot;, ex); return; }\n        lock.lock();\n        try {\n            pending.add(line);\n            if (pending.size() &gt;= batchSize) flushLocked();\n        } finally { lock.unlock(); }\n    }\n\n    public void start() { started = true; }\n\n    /** Flush what is left, then stop. Anything that still will not send is counted, never silently binned. */\n    public void close() {\n        if (!started) return;\n        started = false;\n        lock.lock();\n        try { flushLocked(); dropped.addAndGet(pending.size()); pending.clear(); }\n        finally { lock.unlock(); }\n    }\n\n    /** Batches accepted by the collector. */\n    long batchesSent() { return batches.get(); }\n\n    /** Lines given up on: the retry buffer overflowed, or the collector was still down at close. */\n    long droppedCount() { return dropped.get(); }\n\n    /** Called with the lock held. The order is the whole point: send, and only then forget. */\n    private void flushLocked() {\n        if (pending.isEmpty()) return;\n        String batchId = name + &quot;-&quot; + (batches.get() + 1);\n        try {\n            transport.send(batchId, List.copyOf(pending));\n            batches.incrementAndGet();\n            pending.clear();\n        } catch (RuntimeException ex) {\n            Status.error(name + &quot;: send failed, will retry &quot; + pending.size() + &quot; lines&quot;, ex);\n            while (pending.size() &gt; maxPending) { pending.remove(0); dropped.incrementAndGet(); }\n        }\n    }\n}\n\n// ---- ext: configuration that outlives the process -- a repository for the level tree, and a hot reload\n/** Where the level tree is kept between runs: a file, a table, a config service. One interface, two methods. */\ninterface LevelStore {\n    /** logger name to level name, as text, because that is what a config file holds. */\n    Map&lt;String, String&gt; load();\n\n    /** Replace what is stored. In SQL: DELETE then INSERT inside one transaction, or an upsert per row. */\n    void save(Map&lt;String, String&gt; levels);\n}\n\n/** The obvious implementation, for a test and for the demo. A file or a table is the same two methods. */\nfinal class InMemoryLevelStore implements LevelStore {\n    private volatile Map&lt;String, String&gt; data = new LinkedHashMap&lt;&gt;();\n\n    public Map&lt;String, String&gt; load() { return new LinkedHashMap&lt;&gt;(data); }\n\n    public void save(Map&lt;String, String&gt; levels) { data = new LinkedHashMap&lt;&gt;(levels); }\n}\n\n/**\n * A client of the framework, not a new concept inside it: it reads the store and calls the same setLevel\n * every test calls by hand. Because level is a volatile field, a reload takes effect on the very next call.\n */\nfinal class Configurator {\n    private Configurator() {}\n\n    /** Apply a stored tree to a live context. Unknown names simply create the node, which is harmless. */\n    static void apply(LoggerContext ctx, Map&lt;String, String&gt; levels) {\n        levels.forEach((name, level) -&gt; {\n            try { ctx.getLogger(name).setLevel(LogLevel.valueOf(level)); }\n            catch (IllegalArgumentException ex) { Status.error(&quot;bad level in config: &quot; + name + &quot;=&quot; + level, ex); }\n        });\n    }\n\n    /** Read every level anybody has set, so it can be written back. */\n    static Map&lt;String, String&gt; snapshot(LoggerContext ctx) {\n        Map&lt;String, String&gt; out = new LinkedHashMap&lt;&gt;();\n        for (String n : ctx.names()) {\n            LogLevel own = ctx.getLogger(n).level();\n            if (own != null) out.put(n, own.name());\n        }\n        return out;\n    }\n\n    /** Ctrl-C must not lose the async tail. One line in main(), and shutdown() drains every queue. */\n    static void installShutdownHook(LoggerContext ctx) {\n        Runtime.getRuntime().addShutdownHook(new Thread(ctx::shutdown, &quot;log-shutdown&quot;));\n    }\n}\n\n// ---- ext: why System.out is slow -- the same lines, one flush per call against one flush per buffer\n/** Measures the cost of flushing on every line, which is what an autoflush PrintStream does for you. */\nfinal class ConsoleCost {\n    private ConsoleCost() {}\n\n    /** Writes n lines to a file through an autoflush stream and returns the milliseconds it took. */\n    static long autoflushMs(Path file, int n) throws IOException {\n        try (PrintStream out = new PrintStream(new FileOutputStream(file.toFile()), true, StandardCharsets.UTF_8)) {\n            long t0 = System.nanoTime();\n            for (int i = 0; i &lt; n; i++) out.println(&quot;12:00:00.000 INFO  [main] com.shop - line &quot; + i);\n            return (System.nanoTime() - t0) / 1_000_000;\n        }\n    }\n\n    /** The same n lines through a 64 KB buffer, flushed once. Same bytes, one system call instead of n. */\n    static long bufferedMs(Path file, int n) throws IOException {\n        try (PrintStream out = new PrintStream(new BufferedOutputStream(new FileOutputStream(file.toFile()), 65536), false, StandardCharsets.UTF_8)) {\n            long t0 = System.nanoTime();\n            for (int i = 0; i &lt; n; i++) out.println(&quot;12:00:00.000 INFO  [main] com.shop - line &quot; + i);\n            out.flush();\n            return (System.nanoTime() - t0) / 1_000_000;\n        }\n    }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        Path dir = Files.createTempDirectory(&quot;logger-ext&quot;);\n        LoggerContext ctx = new LoggerContext();\n        long[] now = { 1_789_205_400_000L };\n        ctx.setClock(() -&gt; now[0]);\n        Clock clock = () -&gt; now[0];\n\n        // roll at midnight: three days of logs, three files, in a microsecond\n        Path daily = dir.resolve(&quot;daily.log&quot;);\n        TimeRollingFileAppender timeRoll = new TimeRollingFileAppender(&quot;daily&quot;, new TextFormatter(), LogLevel.TRACE,\n            daily, clock, 86_400_000L);\n        Logger day = ctx.getLogger(&quot;com.shop.day&quot;);\n        day.addAppender(timeRoll);\n        day.setAdditive(false);\n        for (int d = 0; d &lt; 3; d++) { day.info(&quot;day &quot; + d); now[0] += 86_400_000L; }\n        timeRoll.close();\n        System.out.println(&quot;time rolling: &quot; + timeRoll.rolls() + &quot; rolls, files &quot;\n            + Files.list(dir).map(p -&gt; p.getFileName().toString()).sorted().toList());\n\n        // one file per tenant\n        RoutingAppender router = new RoutingAppender(&quot;per-tenant&quot;, &quot;tenant&quot;,\n            k -&gt; new FileAppender(&quot;tenant-&quot; + k, dir.resolve(&quot;tenant-&quot; + k + &quot;.log&quot;)), 2);\n        router.start();\n        Logger multi = ctx.getLogger(&quot;com.shop.multi&quot;);\n        multi.addAppender(router);\n        multi.setAdditive(false);\n        for (String t : List.of(&quot;acme&quot;, &quot;globex&quot;, &quot;acme&quot;, &quot;initech&quot;)) {\n            try (MdcScope s = MdcScope.of(&quot;tenant&quot;, t)) { multi.info(&quot;hello from &quot; + t); }\n        }\n        multi.info(&quot;no tenant on this one&quot;);\n        router.close();\n        System.out.println(&quot;routing: &quot; + router.routeCount() + &quot; tenant files (cap 2), &quot;\n            + router.unroutedCount() + &quot; events with no route&quot;);\n\n        // masking: the same line, redacted once, outside every sink&#x27;s lock\n        MemoryAppender masked = new MemoryAppender(&quot;masked&quot;, new MaskingFormatter(new TextFormatter()), LogLevel.TRACE);\n        Logger pay = ctx.getLogger(&quot;com.shop.pay&quot;);\n        pay.addAppender(masked);\n        pay.setAdditive(false);\n        pay.info(&quot;refund to 4111 1111 1111 1111 for ann.smith@example.com&quot;);\n        System.out.println(&quot;masking: &quot; + masked.lines().get(0));\n\n        // sampling and the rate limit, both behind the filter seam\n        MemoryAppender sampled = new MemoryAppender(&quot;sampled&quot;);\n        Logger noisy = ctx.getLogger(&quot;com.shop.noisy&quot;);\n        noisy.setLevel(LogLevel.DEBUG);\n        noisy.addAppender(sampled);\n        noisy.setAdditive(false);\n        noisy.addFilter(new SamplingFilter(10, LogLevel.WARN));\n        for (int i = 0; i &lt; 100; i++) noisy.debug(&quot;chatter &quot; + i);\n        for (int i = 0; i &lt; 5; i++) noisy.warn(&quot;this is never sampled&quot;);\n        System.out.println(&quot;sampling: 100 DEBUG + 5 WARN -&gt; &quot; + sampled.lines().size() + &quot; lines kept&quot;);\n\n        MemoryAppender capped = new MemoryAppender(&quot;capped&quot;);\n        Logger retry = ctx.getLogger(&quot;com.shop.retry&quot;);\n        retry.addAppender(capped);\n        retry.setAdditive(false);\n        RateLimitFilter limiter = new RateLimitFilter(3, 60_000L, clock, LogLevel.ERROR, 1000);\n        retry.addFilter(limiter);\n        for (int i = 0; i &lt; 400; i++) retry.warn(&quot;connection refused, retrying&quot;);\n        for (int i = 0; i &lt; 4; i++) retry.error(&quot;gave up&quot;);\n        System.out.println(&quot;rate limit: 400 identical WARNs -&gt; &quot; + capped.lines().size()\n            + &quot; lines (3 WARN + 4 ERROR), suppressed &quot; + limiter.suppressedCount());\n        now[0] += 61_000L;\n        retry.warn(&quot;connection refused, retrying&quot;);\n        System.out.println(&quot;rate limit: a minute later the window reopens -&gt; &quot; + capped.lines().size() + &quot; lines&quot;);\n\n        // shipping: a collector that fails once, then accepts; nothing is lost and the batch id repeats\n        List&lt;String&gt; received = new ArrayList&lt;&gt;();\n        List&lt;String&gt; ids = new ArrayList&lt;&gt;();\n        boolean[] down = { true };\n        LogTransport transport = (batchId, lines) -&gt; {\n            if (down[0]) { down[0] = false; throw new RuntimeException(&quot;collector 503&quot;); }\n            ids.add(batchId);\n            received.addAll(lines);\n        };\n        HttpShipperAppender shipper = new HttpShipperAppender(&quot;ship&quot;, new JsonFormatter(), transport, 2, 100);\n        Logger ship = ctx.getLogger(&quot;com.shop.ship&quot;);\n        ship.addAppender(shipper);\n        ship.setAdditive(false);\n        for (int i = 0; i &lt; 4; i++) ship.info(&quot;event &quot; + i);\n        shipper.close();\n        System.out.println(&quot;shipping: collector failed the first batch; received &quot; + received.size()\n            + &quot; of 4 lines, batch ids &quot; + ids + &quot;, dropped &quot; + shipper.droppedCount());\n\n        // configuration that outlives the process\n        LevelStore store = new InMemoryLevelStore();\n        store.save(Map.of(&quot;com.shop.db&quot;, &quot;DEBUG&quot;));\n        Configurator.apply(ctx, store.load());\n        System.out.println(&quot;config: com.shop.db is now &quot; + ctx.getLogger(&quot;com.shop.db&quot;).effectiveLevel()\n            + &quot;; saving back &quot; + Configurator.snapshot(ctx).size() + &quot; explicit levels&quot;);\n\n        // why System.out is slow\n        int n = 20_000;\n        long auto = ConsoleCost.autoflushMs(dir.resolve(&quot;auto.txt&quot;), n);\n        long buffered = ConsoleCost.bufferedMs(dir.resolve(&quot;buffered.txt&quot;), n);\n        System.out.println(&quot;console cost: &quot; + n + &quot; lines, one flush per line &quot; + auto\n            + &quot; ms vs one flush per buffer &quot; + buffered + &quot; ms&quot;);\n\n        ctx.shutdown();\n        System.out.println(&quot;extensions done; files under &quot; + dir);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.io.*;\nimport java.nio.file.*;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n// targeted failure tests: each one proves a claim the design makes on page 02, move 9.\npublic class FailureTests {\n    static int failures = 0;\n\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n\n    /** Sends the framework&#x27;s own error channel to a buffer, so a test that expects failures stays quiet. */\n    static ByteArrayOutputStream quietStatus() {\n        ByteArrayOutputStream buf = new ByteArrayOutputStream();\n        Status.sink(new PrintStream(buf, true));\n        Status.reset();\n        return buf;\n    }\n\n    public static void main(String[] args) throws Exception {\n        Path dir = Files.createTempDirectory(&quot;logger-tests&quot;);\n        ByteArrayOutputStream status = quietStatus();\n\n        // 1. fifty threads log to ONE file through a bounded queue at the same instant: every line must be\n        //    whole, every line must be there, and each thread&#x27;s own lines must be in the order it wrote them.\n        LoggerContext ctx = new LoggerContext();\n        Path file = dir.resolve(&quot;race.log&quot;);\n        FileAppender fileSink = new FileAppender(&quot;file&quot;, new TextFormatter(), LogLevel.TRACE, file, LogLevel.OFF);\n        AsyncAppender async = new AsyncAppender(&quot;async&quot;, fileSink, 8192, OverflowPolicy.BLOCK, LogLevel.ERROR);\n        Logger web = ctx.getLogger(&quot;com.shop.web&quot;);\n        web.addAppender(async);\n        web.setAdditive(false);\n        int writers = 50, lines = 20;\n        Main.runConcurrently(writers, i -&gt; { for (int k = 0; k &lt; lines; k++) web.info(&quot;t&quot; + i + &quot;-&quot; + k); });\n        async.close();\n        List&lt;String&gt; got = Files.readAllLines(file);\n        check(got.size() == writers * lines, &quot;50 threads x 20 lines all reached the file: &quot; + got.size());\n        check(async.droppedCount() == 0, &quot;a queue deep enough and a BLOCK policy dropped nothing&quot;);\n        check(got.stream().allMatch(l -&gt; l.matches(&quot;.* INFO  \\\\[.*\\\\] com\\\\.shop\\\\.web - t\\\\d+-\\\\d+&quot;)),\n              &quot;every line is whole: no two writers interleaved inside one line&quot;);\n        check(Main.perThreadOrderKept(got), &quot;each thread&#x27;s own lines are in the order that thread wrote them&quot;);\n        check(new HashSet&lt;&gt;(got).size() == got.size(), &quot;no line was written twice&quot;);\n\n        // 2. the gate is first, and it is free: a switched-off call builds nothing at all\n        LoggerContext c2 = new LoggerContext();\n        MemoryAppender mem = new MemoryAppender(&quot;mem&quot;);\n        c2.configure(LogLevel.INFO, List.of(mem), List.of());\n        Logger quiet = c2.getLogger(&quot;com.shop.hot&quot;);\n        AtomicInteger built = new AtomicInteger();\n        for (int i = 0; i &lt; 1000; i++) quiet.debug(() -&gt; { built.incrementAndGet(); return &quot;cart=&quot; + new int[7]; });\n        check(built.get() == 0, &quot;1000 disabled DEBUG calls never called the message supplier&quot;);\n        check(mem.lines().isEmpty(), &quot;and wrote nothing&quot;);\n        quiet.info(() -&gt; { built.incrementAndGet(); return &quot;enabled&quot;; });\n        check(built.get() == 1 &amp;&amp; mem.lines().size() == 1, &quot;an enabled call does call the supplier, exactly once&quot;);\n        check(!quiet.isEnabled(LogLevel.DEBUG) &amp;&amp; quiet.isEnabled(LogLevel.ERROR), &quot;the gate agrees with the level&quot;);\n\n        // 3. the tree: inherit, override, change at runtime, and stop inheriting sinks\n        LoggerContext c3 = new LoggerContext();\n        MemoryAppender shared = new MemoryAppender(&quot;shared&quot;);\n        c3.configure(LogLevel.INFO, List.of(shared), List.of());\n        Logger shop = c3.getLogger(&quot;com.shop&quot;);\n        Logger checkout = c3.getLogger(&quot;com.shop.checkout&quot;);\n        check(checkout.parent() == shop &amp;&amp; shop.parent() == c3.getLogger(&quot;com&quot;), &quot;the tree is built by chopping at the dots&quot;);\n        check(c3.getLogger(&quot;com.shop.checkout&quot;) == checkout, &quot;one name means one object, forever&quot;);\n        check(checkout.level() == null &amp;&amp; checkout.effectiveLevel() == LogLevel.INFO, &quot;a child with no level inherits ROOT&#x27;s&quot;);\n        checkout.debug(&quot;invisible&quot;);\n        check(shared.lines().isEmpty(), &quot;so its DEBUG is silent&quot;);\n        shop.setLevel(LogLevel.DEBUG);\n        checkout.debug(&quot;visible now&quot;);\n        check(shared.lines().size() == 1, &quot;turning an ancestor to DEBUG takes effect on the next call, with no restart&quot;);\n        checkout.setLevel(LogLevel.WARN);\n        checkout.info(&quot;invisible again&quot;);\n        check(shared.lines().size() == 1, &quot;a child&#x27;s own level beats its ancestor&#x27;s&quot;);\n        checkout.setLevel(null);\n        MemoryAppender own = new MemoryAppender(&quot;own&quot;);\n        checkout.addAppender(own);\n        checkout.info(&quot;two sinks&quot;);\n        check(own.lines().size() == 1 &amp;&amp; shared.lines().size() == 2, &quot;additivity on: the line reaches the child&#x27;s sink AND the shared one&quot;);\n        checkout.setAdditive(false);\n        checkout.info(&quot;one sink&quot;);\n        check(own.lines().size() == 2 &amp;&amp; shared.lines().size() == 2, &quot;additivity off: the walk to the ancestors stops&quot;);\n\n        // 4. one lock per sink: the same events into an unlocked counter and a locked one\n        LoggerContext c4 = new LoggerContext();\n        UnsafeCountingAppender unsafe = new UnsafeCountingAppender();\n        SafeCountingAppender safe = new SafeCountingAppender(&quot;safe&quot;);\n        Logger race = c4.getLogger(&quot;com.shop.race&quot;);\n        race.addAppender(unsafe);\n        race.addAppender(safe);\n        race.setAdditive(false);\n        int threads = 8, each = 2000, published = threads * each;\n        Main.runConcurrently(threads, i -&gt; { for (int k = 0; k &lt; each; k++) race.info(&quot;tick&quot;); });\n        check(safe.count() == published, &quot;the counter inside the sink&#x27;s lock is exact: &quot; + safe.count() + &quot; of &quot; + published);\n        check(unsafe.count() &lt;= published, &quot;the counter with no lock lost updates: &quot; + unsafe.count() + &quot; of &quot; + published);\n\n        // 5. a storm bigger than the queue: bounded memory, and every lost event is counted\n        LoggerContext c5 = new LoggerContext();\n        SlowAppender slow = new SlowAppender(&quot;slow&quot;, 2);\n        AsyncAppender small = new AsyncAppender(&quot;small&quot;, slow, 16, OverflowPolicy.DROP_NEWEST, LogLevel.FATAL);\n        Logger storm = c5.getLogger(&quot;com.shop.storm&quot;);\n        storm.addAppender(small);\n        storm.setAdditive(false);\n        int offered = 500, peak = 0;\n        for (int i = 0; i &lt; offered; i++) { storm.info(&quot;storm &quot; + i); peak = Math.max(peak, small.queueDepth()); }\n        small.close();\n        check(peak &lt;= 16, &quot;the queue never went past its 16-event ceiling: peak depth &quot; + peak + &quot;, bounded by the capacity&quot;);\n        check(slow.written() + small.droppedCount() == offered,\n              &quot;written &quot; + slow.written() + &quot; + dropped &quot; + small.droppedCount() + &quot; = offered &quot; + offered);\n        check(small.droppedCount() &gt; 0, &quot;under a storm a DROP_NEWEST sink really does shed load&quot;);\n        LoggerContext c5b = new LoggerContext();\n        MemoryAppender keeper = new MemoryAppender(&quot;keeper&quot;);\n        AsyncAppender blocking = new AsyncAppender(&quot;blocking&quot;, keeper, 8, OverflowPolicy.BLOCK, LogLevel.ERROR);\n        Logger audit = c5b.getLogger(&quot;com.shop.audit&quot;);\n        audit.addAppender(blocking);\n        audit.setAdditive(false);\n        for (int i = 0; i &lt; 200; i++) audit.info(&quot;audit &quot; + i);\n        blocking.close();\n        check(keeper.lines().size() == 200 &amp;&amp; blocking.droppedCount() == 0,\n              &quot;the same queue with a BLOCK policy makes the caller wait and loses nothing: &quot; + keeper.lines().size());\n\n        // 6. nothing the framework touches may throw into the application\n        LoggerContext c6 = new LoggerContext();\n        Status.reset();\n        MemoryAppender survivor = new MemoryAppender(&quot;survivor&quot;);\n        Logger risky = c6.getLogger(&quot;com.shop.risky&quot;);\n        risky.addAppender(new Main.ThrowingAppender());\n        risky.addAppender(survivor);\n        risky.addFilter(e -&gt; { throw new RuntimeException(&quot;broken filter&quot;); });\n        risky.setAdditive(false);\n        risky.error(&quot;payment declined&quot;, new IllegalStateException(&quot;gateway timeout&quot;));\n        check(survivor.lines().size() == 1, &quot;a sink that throws did not stop the next sink from getting the line&quot;);\n        check(survivor.lines().get(0).contains(&quot;IllegalStateException&quot;), &quot;and the throwable is on the line&quot;);\n        MemoryAppender bad = new MemoryAppender(&quot;bad&quot;, e -&gt; { throw new RuntimeException(&quot;broken layout&quot;); }, LogLevel.TRACE);\n        risky.addAppender(bad);\n        risky.warn(&quot;still fine&quot;);\n        check(survivor.lines().size() == 2, &quot;a formatter that throws cost only its own line&quot;);\n        risky.info(() -&gt; { throw new RuntimeException(&quot;broken supplier&quot;); });\n        check(survivor.lines().size() == 2, &quot;a message supplier that throws wrote nothing and did not propagate&quot;);\n        check(Status.errorCount() &gt;= 4, &quot;each failure was reported on the framework&#x27;s own channel: &quot; + Status.errorCount());\n\n        // 7. rotation: the file rolls at the size, and not one line is lost across the files\n        LoggerContext c7 = new LoggerContext();\n        Path rollPath = dir.resolve(&quot;rolling.log&quot;);\n        RollingFileAppender roller = new RollingFileAppender(&quot;roll&quot;, new TextFormatter(), LogLevel.TRACE, rollPath, 512);\n        Logger big = c7.getLogger(&quot;com.shop.big&quot;);\n        big.addAppender(roller);\n        big.setAdditive(false);\n        for (int i = 0; i &lt; 60; i++) big.info(&quot;line &quot; + i);\n        int rolls = roller.rolls();\n        roller.close();\n        long total = 0;\n        try (var s = Files.list(dir)) {\n            for (Path p : s.toList())\n                if (p.getFileName().toString().startsWith(&quot;rolling.log&quot;)) total += Files.readAllLines(p).size();\n        }\n        check(rolls &gt;= 3, &quot;60 lines into a 512-character file rolled &quot; + rolls + &quot; times&quot;);\n        check(total == 60, &quot;every line survived the rotation: &quot; + total + &quot; across the files&quot;);\n        check(roller.bytesWritten() &lt;= 512, &quot;the live file is under the limit: &quot; + roller.bytesWritten() + &quot; characters&quot;);\n\n        // 8. shutdown drains what was accepted, and the context on a line is the one from the call, not the write\n        LoggerContext c8 = new LoggerContext();\n        MemoryAppender late = new MemoryAppender(&quot;late&quot;);\n        AsyncAppender tail = new AsyncAppender(&quot;tail&quot;, late, 1024, OverflowPolicy.BLOCK, LogLevel.ERROR);\n        Logger job = c8.getLogger(&quot;com.shop.job&quot;);\n        job.addAppender(tail);\n        job.setAdditive(false);\n        Mdc.put(&quot;rid&quot;, &quot;req-A&quot;);\n        for (int i = 0; i &lt; 300; i++) job.info(&quot;work &quot; + i);\n        Mdc.put(&quot;rid&quot;, &quot;req-B&quot;);\n        Mdc.clear();\n        c8.shutdown();\n        check(late.lines().size() == 300, &quot;close() wrote everything that was accepted before it: &quot; + late.lines().size());\n        check(late.lines().stream().allMatch(l -&gt; l.contains(&quot;rid=req-A&quot;)),\n              &quot;every line carries the context from the moment of the call, not from the moment of the write&quot;);\n        job.info(&quot;after shutdown&quot;);\n        check(late.lines().size() == 300, &quot;an event offered after close is counted, never half-written&quot;);\n        check(tail.droppedCount() == 1, &quot;and that one is on the dropped counter: &quot; + tail.droppedCount());\n\n        // 9. a stack trace is many physical lines and still ONE record. The whole block is one write under one\n        //    lock, so eight threads throwing at the same instant can never splice their traces together.\n        LoggerContext c9 = new LoggerContext();\n        Path traces = dir.resolve(&quot;traces.log&quot;);\n        FileAppender traceSink = new FileAppender(&quot;trace&quot;, new TextFormatter(), LogLevel.TRACE, traces, LogLevel.OFF);\n        Logger boom = c9.getLogger(&quot;com.shop.boom&quot;);\n        boom.addAppender(traceSink);\n        boom.setAdditive(false);\n        int throwers = 8, throws_ = 100;\n        Main.runConcurrently(throwers, i -&gt; {\n            Throwable t = new IllegalStateException(&quot;boom from t&quot; + i, new ArithmeticException(&quot;root cause t&quot; + i));\n            for (int k = 0; k &lt; throws_; k++) boom.error(&quot;failed t&quot; + i + &quot;-&quot; + k, t);\n        });\n        traceSink.close();\n        List&lt;String&gt; phys = Files.readAllLines(traces);\n        int records = 0, spliced = 0;\n        String owner = null;\n        for (String l : phys) {\n            java.util.regex.Matcher h = java.util.regex.Pattern.compile(&quot;^\\\\d\\\\d:\\\\d\\\\d:\\\\d\\\\d\\\\.\\\\d\\\\d\\\\d .* - failed t(\\\\d+)-\\\\d+$&quot;).matcher(l);\n            if (h.matches()) { records++; owner = h.group(1); }\n            else if (owner == null) spliced++;                                   // a trace line with no header above it\n            else if (l.startsWith(&quot;java.lang.IllegalStateException&quot;) &amp;&amp; !l.endsWith(&quot;boom from t&quot; + owner)) spliced++;\n            else if (l.startsWith(&quot;Caused by: java.lang.ArithmeticException&quot;) &amp;&amp; !l.endsWith(&quot;root cause t&quot; + owner)) spliced++;\n        }\n        check(records == throwers * throws_, &quot;8 threads x 100 exceptions are &quot; + records + &quot; records&quot;);\n        check(spliced == 0, &quot;every stack-trace line sits inside the record that owns it: no two threads spliced&quot;);\n        check(phys.size() &gt; records * 3, &quot;and a record really is several physical lines: &quot; + phys.size() + &quot; lines for &quot; + records + &quot; records&quot;);\n        check(phys.stream().anyMatch(l -&gt; l.startsWith(&quot;Caused by: java.lang.ArithmeticException&quot;)), &quot;the cause chain is written too, not just the top exception&quot;);\n\n        // 10. the two rule changes an interviewer adds mid-round, both on the filter seam\n        LoggerContext c10 = new LoggerContext();\n        long[] t10 = { 1_789_205_400_000L };\n        c10.setClock(() -&gt; t10[0]);\n        MemoryAppender capped = new MemoryAppender(&quot;capped&quot;);\n        Logger retry = c10.getLogger(&quot;com.shop.retry&quot;);\n        retry.addAppender(capped);\n        retry.setAdditive(false);\n        RateLimitFilter limiter = new RateLimitFilter(3, 60_000L, () -&gt; t10[0], LogLevel.ERROR, 1000);\n        retry.addFilter(limiter);\n        for (int i = 0; i &lt; 400; i++) retry.warn(&quot;connection refused, retrying&quot;);\n        check(capped.lines().size() == 3, &quot;400 identical WARNs inside one minute reached the sink 3 times: &quot; + capped.lines().size());\n        check(limiter.suppressedCount() == 397, &quot;and the 397 it suppressed are counted, not hidden: &quot; + limiter.suppressedCount());\n        for (int i = 0; i &lt; 4; i++) retry.error(&quot;gave up&quot;);\n        check(capped.lines().size() == 7, &quot;ERROR is never throttled: you do not silence the thing that wakes you&quot;);\n        for (int i = 0; i &lt; 50; i++) retry.warn(&quot;a different line &quot; + i);\n        check(capped.lines().size() == 57, &quot;the cap is per distinct line, so 50 other WARNs went through untouched&quot;);\n        t10[0] += 61_000L;\n        retry.warn(&quot;connection refused, retrying&quot;);\n        check(capped.lines().size() == 58, &quot;and a minute later the window reopens&quot;);\n        MemoryAppender sampled = new MemoryAppender(&quot;sampled&quot;);\n        Logger noisy = c10.getLogger(&quot;com.shop.noisy&quot;);\n        noisy.setLevel(LogLevel.DEBUG);\n        noisy.addAppender(sampled);\n        noisy.setAdditive(false);\n        noisy.addFilter(new SamplingFilter(10, LogLevel.WARN));\n        for (int i = 0; i &lt; 100; i++) noisy.debug(&quot;chatter &quot; + i);\n        for (int i = 0; i &lt; 5; i++) noisy.warn(&quot;never sampled&quot;);\n        check(sampled.lines().size() == 15, &quot;one DEBUG in ten kept and every WARN kept: &quot; + sampled.lines().size());\n\n        // 11. masking runs once, in the layout, and the Luhn check is what keeps it off an ordinary long number\n        LoggerContext c11 = new LoggerContext();\n        MemoryAppender masked = new MemoryAppender(&quot;masked&quot;, new MaskingFormatter(new TextFormatter()), LogLevel.TRACE);\n        Logger pay = c11.getLogger(&quot;com.shop.pay&quot;);\n        pay.addAppender(masked);\n        pay.setAdditive(false);\n        pay.info(&quot;refund to 4111 1111 1111 1111 for ann.smith@example.com&quot;);\n        pay.info(&quot;order 1234567890123456 for request 1789205400000123456&quot;);\n        String m0 = masked.lines().get(0), m1 = masked.lines().get(1);\n        check(m0.contains(&quot;****-****-****-1111&quot;) &amp;&amp; !m0.contains(&quot;4111 1111&quot;), &quot;the card number is redacted with its last four kept&quot;);\n        check(m0.contains(&quot;***@example.com&quot;) &amp;&amp; !m0.contains(&quot;ann.smith&quot;), &quot;and the address keeps only its domain&quot;);\n        check(m1.contains(&quot;1234567890123456&quot;) &amp;&amp; m1.contains(&quot;1789205400000123456&quot;),\n              &quot;a sixteen-digit order number and a long request id are left alone: that is what the Luhn check buys&quot;);\n\n        // 12. the sink as a network client: the buffer is cleared only AFTER the send returns\n        List&lt;String&gt; shipped = new ArrayList&lt;&gt;();\n        List&lt;String&gt; batchIds = new ArrayList&lt;&gt;();\n        boolean[] down = { true };\n        LogTransport flaky = (batchId, batch) -&gt; {\n            if (down[0]) { down[0] = false; throw new RuntimeException(&quot;collector 503&quot;); }\n            batchIds.add(batchId);\n            shipped.addAll(batch);\n        };\n        LoggerContext c12 = new LoggerContext();\n        HttpShipperAppender shipper = new HttpShipperAppender(&quot;ship&quot;, new JsonFormatter(), flaky, 2, 100);\n        Logger ship = c12.getLogger(&quot;com.shop.ship&quot;);\n        ship.addAppender(shipper);\n        ship.setAdditive(false);\n        for (int i = 0; i &lt; 4; i++) ship.info(&quot;event &quot; + i);\n        shipper.close();\n        check(shipped.size() == 4 &amp;&amp; shipper.droppedCount() == 0,\n              &quot;the collector failed the first batch and not one line was lost: &quot; + shipped.size() + &quot; of 4&quot;);\n        check(batchIds.size() == 2, &quot;the failed lines went out in the next batch, under a batch id: &quot; + batchIds);\n        LoggerContext c12b = new LoggerContext();\n        HttpShipperAppender deadEnd = new HttpShipperAppender(&quot;dead&quot;, new JsonFormatter(),\n            (id, batch) -&gt; { throw new RuntimeException(&quot;collector still down&quot;); }, 2, 4);\n        Logger far = c12b.getLogger(&quot;com.shop.far&quot;);\n        far.addAppender(deadEnd);\n        far.setAdditive(false);\n        for (int i = 0; i &lt; 20; i++) far.info(&quot;event &quot; + i);\n        deadEnd.close();\n        check(deadEnd.droppedCount() == 20 &amp;&amp; deadEnd.batchesSent() == 0,\n              &quot;a collector that never comes back sheds down to its retry cap and counts every line: &quot; + deadEnd.droppedCount());\n\n        // 13. the context a pooled thread cannot forget to put back\n        Mdc.clear();\n        Mdc.put(&quot;rid&quot;, &quot;outer&quot;);\n        try (MdcScope s = MdcScope.of(&quot;rid&quot;, &quot;inner&quot;)) {\n            check(&quot;inner&quot;.equals(Mdc.snapshot().get(&quot;rid&quot;)), &quot;inside the scope the new value is the one that rides on the line&quot;);\n        }\n        check(&quot;outer&quot;.equals(Mdc.snapshot().get(&quot;rid&quot;)), &quot;and on the way out the thread&#x27;s context is exactly what it was: &quot; + Mdc.snapshot());\n        Mdc.clear();\n        try (MdcScope s = MdcScope.of(&quot;tenant&quot;, &quot;acme&quot;)) { /* the work of one request */ }\n        check(Mdc.snapshot().isEmpty(), &quot;a thread that started empty ends empty: that is what stops a pooled thread leaking a tenant&quot;);\n\n        // 14. the other two rotations: keyed on the injected clock, and one file per tenant with a cap\n        LoggerContext c14 = new LoggerContext();\n        long[] t14 = { 1_789_205_400_000L };\n        TimeRollingFileAppender byTime = new TimeRollingFileAppender(&quot;daily&quot;, new TextFormatter(), LogLevel.TRACE,\n            dir.resolve(&quot;daily.log&quot;), () -&gt; t14[0], 86_400_000L);\n        Logger day = c14.getLogger(&quot;com.shop.day&quot;);\n        day.addAppender(byTime);\n        day.setAdditive(false);\n        for (int d = 0; d &lt; 3; d++) { day.info(&quot;day &quot; + d); t14[0] += 86_400_000L; }\n        byTime.close();\n        long dayLines = 0;\n        try (var s = Files.list(dir)) {\n            for (Path p : s.toList())\n                if (p.getFileName().toString().startsWith(&quot;daily.log&quot;)) dayLines += Files.readAllLines(p).size();\n        }\n        check(byTime.rolls() == 2, &quot;three days through an injected clock started &quot; + byTime.rolls() + &quot; new files, in a microsecond&quot;);\n        check(dayLines == 3, &quot;and all three lines survived the rotation: &quot; + dayLines);\n        RoutingAppender router = new RoutingAppender(&quot;per-tenant&quot;, &quot;tenant&quot;,\n            k -&gt; new FileAppender(&quot;tenant-&quot; + k, dir.resolve(&quot;tenant-&quot; + k + &quot;.log&quot;)), 2);\n        Logger multi = c14.getLogger(&quot;com.shop.multi&quot;);\n        multi.addAppender(router);\n        multi.setAdditive(false);\n        for (String t : List.of(&quot;acme&quot;, &quot;globex&quot;, &quot;acme&quot;, &quot;initech&quot;))\n            try (MdcScope s = MdcScope.of(&quot;tenant&quot;, t)) { multi.info(&quot;hello from &quot; + t); }\n        multi.info(&quot;no tenant on this one&quot;);\n        router.close();\n        check(router.routeCount() == 2, &quot;the per-tenant cap held at 2 files: a key that comes from request data cannot leak handles&quot;);\n        check(router.unroutedCount() == 2, &quot;the tenant past the cap and the event with no key were counted, not silently binned: &quot; + router.unroutedCount());\n\n        Status.sink(System.err);\n        if (status.size() &gt; 0 &amp;&amp; failures != 0) System.out.println(&quot;status channel said: &quot; + status);\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design a logging framework &mdash; the thing behind log.info(&quot;order placed&quot;). Levels, more than one destination, configurable per package, and it must not slow down or crash the application that uses it. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (library or service, and what happens when the queue fills, first); then type in the order of Main.java: the LogLevel enum, the Clock, the Mdc, the LogEvent record, the LogFormatter interface with a text and a JSON layout, FilterDecision and LogFilter, the LogAppender interface, AbstractAppender with its final append() and the lock, the console and file sinks, OverflowPolicy and AsyncAppender, Status, then Logger with the gate and the two passes, then LoggerContext with the registry, then a main with fifty threads.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; At two in the morning: turn DEBUG on for the payments package only, without restarting anything.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Loggers are a tree built from the dotted name, so setting the level on com.shop.payments turns on every logger under it and nothing else. A node's own level is nullable and null means inherit, so effectiveLevel() walks up until somebody has an opinion, and ROOT always does. The field is volatile rather than locked: one writer at 2am, millions of readers on the hot path, and readers need visibility rather than atomicity, so the change is seen on the very next call with no restart and no lock. A child that has set its own level keeps it, which is how you turn one noisy subtree down while turning its parent up. The other half of \"configurable per package\" is <i>where</i> the lines go: a node writes to its own sinks and then walks up to its ancestors' as well, unless <code>setAdditive(false)</code> stops the walk &mdash; which is how one subtree gets its own file while everything else keeps the shared console, or leaves the shared console entirely.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** null means inherit. Volatile because one thread writes it at 2am and millions read it. */\n    private volatile LogLevel level;\n\n/** The first level anybody on the path up to ROOT has an opinion about. ROOT always has one, so this ends. */\n    LogLevel effectiveLevel() {\n        for (Logger l = this; l != null; l = l.parent) {\n            LogLevel own = l.level;\n            if (own != null) return own;\n        }\n        return LogLevel.INFO;\n    }\n\n    /** The gate. Three to five volatile reads and a compare, with nothing allocated. */\n    boolean isEnabled(LogLevel lv) { return lv.atLeast(effectiveLevel()); }\n\n/**\n     * One object per name, forever. The parent is resolved BEFORE the put, which is both why a logger is never\n     * half-built and why this does not deadlock: no recursive computeIfAbsent on the same map.\n     */\n    Logger getLogger(String name) {\n        if (name == null || name.isEmpty() || ROOT_NAME.equals(name)) return root;\n        Logger existing = registry.get(name);\n        if (existing != null) return existing;\n        int dot = name.lastIndexOf(&#x27;.&#x27;);\n        Logger parent = dot &lt; 0 ? root : getLogger(name.substring(0, dot));\n        return registry.computeIfAbsent(name, n -&gt; new Logger(n, parent, this));\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Fifty threads log to one file at the same instant. Prove no line is torn and none is lost, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The damage a race does here is not a wrong number, it is a wrong line: write() and newLine() are two calls, so two threads interleave into half-lines. One ReentrantLock per sink, taken around the write and nothing else, makes them one step. The proof is a test rather than an argument: fifty real threads (a pool of fifty, not a pool of sixteen taking turns) wait on one latch, each writes twenty lines through an async sink onto one file, and the test then reads the file back and asserts five things &mdash; a thousand lines arrived, every one matches the whole-line pattern, each thread's own sequence numbers are in increasing order, no line appears twice, and the dropped counter is zero. Say the limit of the guarantee out loud, because it is the follow-up: the lock is per sink <i>object</i>, so two FileAppenders opened on the same path are two locks and would tear each other's lines. One destination means one sink object, shared by every logger that writes there.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. fifty threads log to ONE file through a bounded queue at the same instant: every line must be\n        //    whole, every line must be there, and each thread&#x27;s own lines must be in the order it wrote them.\n        LoggerContext ctx = new LoggerContext();\n        Path file = dir.resolve(&quot;race.log&quot;);\n        FileAppender fileSink = new FileAppender(&quot;file&quot;, new TextFormatter(), LogLevel.TRACE, file, LogLevel.OFF);\n        AsyncAppender async = new AsyncAppender(&quot;async&quot;, fileSink, 8192, OverflowPolicy.BLOCK, LogLevel.ERROR);\n        Logger web = ctx.getLogger(&quot;com.shop.web&quot;);\n        web.addAppender(async);\n        web.setAdditive(false);\n        int writers = 50, lines = 20;\n        Main.runConcurrently(writers, i -&gt; { for (int k = 0; k &lt; lines; k++) web.info(&quot;t&quot; + i + &quot;-&quot; + k); });\n        async.close();\n        List&lt;String&gt; got = Files.readAllLines(file);\n        check(got.size() == writers * lines, &quot;50 threads x 20 lines all reached the file: &quot; + got.size());\n        check(async.droppedCount() == 0, &quot;a queue deep enough and a BLOCK policy dropped nothing&quot;);\n        check(got.stream().allMatch(l -&gt; l.matches(&quot;.* INFO  \\\\[.*\\\\] com\\\\.shop\\\\.web - t\\\\d+-\\\\d+&quot;)),\n              &quot;every line is whole: no two writers interleaved inside one line&quot;);\n        check(Main.perThreadOrderKept(got), &quot;each thread&#x27;s own lines are in the order that thread wrote them&quot;);\n        check(new HashSet&lt;&gt;(got).size() == got.size(), &quot;no line was written twice&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock per sink. Have you just serialised the whole application behind a log call?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No, and the answer is arithmetic rather than opinion. Everything inside the lock is on the screen below: one buffered write of about seventy-five characters, one newline, a flush only at ERROR, and one addition &mdash; about a hundred and eighty nanoseconds. A service at five thousand requests a second with four lines each is twenty thousand events a second, so three and a half milliseconds of lock in every second: about a third of one per cent. Even two hundred thousand lines a second is three and a half per cent, and the lock is per sink, so the file and the console are not the same queue. The ladder, in order: format outside the lock and flush only at ERROR, which is already done; wrap the sink in AsyncAppender, which leaves the caller paying one thirty-three nanosecond enqueue and lets one worker batch sixty-four records per lock acquisition; then a sink per hot subsystem, and past that the sink becomes a network client.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Everything that happens inside the sink&#x27;s lock, and nothing else: one write of the whole record (a stack\n     * trace and all), one newline, a flush only at ERROR and above, and then the byte count -- in that order,\n     * because a failed write must not move the counter that rotation trusts.\n     */\n    protected void write(LogEvent e, String line) throws IOException {\n        BufferedWriter w = writer;\n        if (w == null) return;\n        w.write(line);\n        w.newLine();\n        if (e.level().atLeast(flushAt)) w.flush();\n        bytesWritten += line.length() + 1;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>4 &middot; Why not just call System.out.println? Show me what the logger is buying.</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two costs, and both are measurable. The first is a lock you do not control: PrintStream synchronises on itself, so every println in the process queues behind every other one, including the ones in libraries you did not write. The second is bigger: the console stream is autoflush, so every line is its own system call. The extension writes twenty thousand identical lines both ways and the numbers on this laptop are about 110 ms with a flush per line against about 25 ms through one 64 KB buffer &mdash; roughly five times, for the same bytes. That is why the file sink buffers and flushes only at ERROR and above, where you would rather lose the throughput than the last line before a crash, and why a console sink is a sink like any other rather than the default.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: why System.out is slow -- the same lines, one flush per call against one flush per buffer\n/** Measures the cost of flushing on every line, which is what an autoflush PrintStream does for you. */\nfinal class ConsoleCost {\n    private ConsoleCost() {}\n\n    /** Writes n lines to a file through an autoflush stream and returns the milliseconds it took. */\n    static long autoflushMs(Path file, int n) throws IOException {\n        try (PrintStream out = new PrintStream(new FileOutputStream(file.toFile()), true, StandardCharsets.UTF_8)) {\n            long t0 = System.nanoTime();\n            for (int i = 0; i &lt; n; i++) out.println(&quot;12:00:00.000 INFO  [main] com.shop - line &quot; + i);\n            return (System.nanoTime() - t0) / 1_000_000;\n        }\n    }\n\n    /** The same n lines through a 64 KB buffer, flushed once. Same bytes, one system call instead of n. */\n    static long bufferedMs(Path file, int n) throws IOException {\n        try (PrintStream out = new PrintStream(new BufferedOutputStream(new FileOutputStream(file.toFile()), 65536), false, StandardCharsets.UTF_8)) {\n            long t0 = System.nanoTime();\n            for (int i = 0; i &lt; n; i++) out.println(&quot;12:00:00.000 INFO  [main] com.shop - line &quot; + i);\n            out.flush();\n            return (System.nanoTime() - t0) / 1_000_000;\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>5 &middot; The disk is full and the sink throws. What happens to the checkout that logged the line?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing. The write sits inside a try/catch in AbstractAppender.append, which is final precisely so that no sink author can remove it, and the failure is reported on the framework's own channel &mdash; a Status class that writes to stderr, because logging your own failure through yourself is a loop. The event then goes to the next sink on the path, each inside its own try/catch in the Logger, so one dead collector does not cost you the file. The same guard covers a formatter that throws and a message supplier that throws. The failure test wires a sink that always throws, a filter that always throws, a formatter that always throws and a supplier that throws, and checks that the surviving sink still got its lines and that the caller never saw an exception.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The hot path of a sink, in the order that matters: the sink&#x27;s threshold first (free), then formatting\n     * (pure CPU, outside the lock, so any number of threads run it at once), then the lock around one write.\n     */\n    public final void append(LogEvent e) {\n        if (!started.get()) { Status.error(name + &quot;: event before start()&quot;, null); return; }\n        if (!e.level().atLeast(threshold)) return;\n        String line;\n        try { line = formatter.format(e); }\n        catch (RuntimeException ex) { Status.error(name + &quot;: formatter failed&quot;, ex); return; }\n        lock.lock();\n        try { write(e, line); }\n        catch (Exception ex) { Status.error(name + &quot;: write failed&quot;, ex); }\n        finally { lock.unlock(); }\n    }\n\n/**\n * The framework&#x27;s own error channel. A logger that reports its failures through itself is a loop, so these\n * go straight to stderr and are counted.\n */\nfinal class Status {\n    private static final AtomicLong errors = new AtomicLong();\n    private static volatile PrintStream sink = System.err;\n\n    private Status() {}\n\n    /** Report a framework failure. Called from inside catch blocks that must not rethrow. */\n    static void error(String what, Throwable t) {\n        errors.incrementAndGet();\n        sink.println(&quot;[logger] &quot; + what + (t == null ? &quot;&quot; : &quot;: &quot; + t));\n    }\n\n    /** How many framework failures have been reported. A metric, and what a test asserts on. */\n    static long errorCount() { return errors.get(); }\n\n    /** Point the channel somewhere else, so a test can stay quiet. */\n    static void sink(PrintStream s) { sink = s; }\n\n    /** Zero the counter between tests. */\n    static void reset() { errors.set(0); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>6 &middot; log.debug(&quot;cart=&quot; + cart) sits in a hot loop with DEBUG switched off. What does it cost?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Written that way it costs the whole string concatenation, every time, because Java builds the argument before the call. The framework's half of the fix is that the gate is the first line of log(): one volatile read per node up to ROOT and an integer compare, about three nanoseconds for a depth of six, with no event allocated and no string built. The caller's half is the lazy form, debug(Supplier), where the supplier is only invoked after the gate passes. The test makes a thousand disabled calls with a counting supplier and asserts it ran zero times, then one enabled call and asserts it ran exactly once.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** The first level anybody on the path up to ROOT has an opinion about. ROOT always has one, so this ends. */\n    LogLevel effectiveLevel() {\n        for (Logger l = this; l != null; l = l.parent) {\n            LogLevel own = l.level;\n            if (own != null) return own;\n        }\n        return LogLevel.INFO;\n    }\n\n    /** The gate. Three to five volatile reads and a compare, with nothing allocated. */\n    boolean isEnabled(LogLevel lv) { return lv.atLeast(effectiveLevel()); }\n\n    /** TRACE with a plain message. */\n    void trace(String m) { log(LogLevel.TRACE, m, null); }\n\n    /** DEBUG with a plain message. */\n    void debug(String m) { log(LogLevel.DEBUG, m, null); }\n\n    /** INFO with a plain message. */\n    void info(String m) { log(LogLevel.INFO, m, null); }\n\n    /** WARN with a plain message. */\n    void warn(String m) { log(LogLevel.WARN, m, null); }\n\n/** INFO whose message is only built if INFO is on. */\n    void info(Supplier&lt;String&gt; m) { log(LogLevel.INFO, m, null); }\n\n    /** The gate first, then the work. A switched-off call ends on the first line. */\n    void log(LogLevel lv, String msg, Throwable err) {\n        if (!isEnabled(lv)) return;\n        emit(lv, msg, err);\n    }\n\n    /** The lazy form: the supplier is not touched unless the level is on. */\n    void log(LogLevel lv, Supplier&lt;String&gt; msg, Throwable err) {\n        if (!isEnabled(lv)) return;\n        String text;\n        try { text = msg.get(); }\n        catch (RuntimeException ex) { Status.error(name + &quot;: message supplier threw&quot;, ex); return; }\n        emit(lv, text, err);\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>7 &middot; Checkout must never wait on an fsync. Take the write off the caller&#x27;s thread \u2014 and tell me what happens when the queue fills.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>AsyncAppender is a decorator: it holds any other sink, puts events on an ArrayBlockingQueue and lets one daemon worker drain them, so the caller's whole cost is an offer at about thirty-three nanoseconds. Bounded is the point: unbounded turns a storm into an OutOfMemoryError and blocking turns a slow disk into slow checkouts. When the queue is full a named policy decides &mdash; drop the newest and count it, discard the oldest to keep the freshest picture, or block &mdash; and it is a per-sink choice, not a framework law, so an audit sink is built with BLOCK while everything else sheds. ERROR and above get one bounded wait before they are given up on. The worker drains sixty-four at a time, which turns sixty-four lock acquisitions into one. The test offers five hundred events into a sixteen-deep queue in front of a two-millisecond sink and asserts the only arithmetic that matters: written plus dropped equals offered. Shedding is fine; shedding silently is not.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** What an async sink does when its queue is full. Named, chosen per sink, and never a framework-wide law. */\nenum OverflowPolicy {\n    /** Give up on the event that arrived and count it. Bounded memory, bounded latency, visible loss. */\n    DROP_NEWEST,\n    /** Throw away the oldest queued event to make room. Keeps the freshest picture of a storm. */\n    DISCARD_OLDEST,\n    /** Make the caller wait. The right answer for an audit sink and the wrong one for checkout. */\n    BLOCK\n}\n\n/**\n * The decorator that takes the write off the caller&#x27;s thread: it holds any other sink, puts events on a\n * bounded queue and lets one daemon worker drain them. Bounded is the whole point -- unbounded turns a\n * storm into an OutOfMemoryError, and blocking turns a slow disk into slow checkouts.\n */\nfinal class AsyncAppender implements LogAppender {\n    /** The sentinel that ends the worker. It queues BEHIND the backlog, so close() drains in order. */\n    private static final LogEvent PILL = new LogEvent(0, LogLevel.OFF, &quot;&quot;, &quot;&quot;, &quot;&quot;, null, Map.of());\n\n    private final String name;\n    private final LogAppender delegate;\n    private final BlockingQueue&lt;LogEvent&gt; queue;\n    private final OverflowPolicy policy;\n    private final LogLevel neverDrop;\n    private final AtomicLong dropped = new AtomicLong();\n    private final AtomicBoolean started = new AtomicBoolean(false);\n    private volatile boolean accepting;\n    private Thread worker;\n\n    /**\n     * @param delegate the sink that really writes; @param capacity the ceiling on queued events;\n     * @param policy what happens when the queue is full; @param neverDrop at and above this level the caller waits instead\n     */\n    AsyncAppender(String name, LogAppender delegate, int capacity, OverflowPolicy policy, LogLevel neverDrop) {\n        this.name = name; this.delegate = delegate; this.queue = new ArrayBlockingQueue&lt;&gt;(capacity);\n        this.policy = policy; this.neverDrop = neverDrop;\n    }\n\n    /** A 4096-deep queue that drops the newest and never gives up on ERROR: the sane default. */\n    AsyncAppender(String name, LogAppender delegate) { this(name, delegate, 4096, OverflowPolicy.DROP_NEWEST, LogLevel.ERROR); }\n\n    public String name() { return name; }\n\n    /**\n     * The caller&#x27;s whole cost: one enqueue. If the queue is full the named policy decides, and the loss is\n     * counted rather than hidden. Nothing here can throw into the application.\n     */\n    public void append(LogEvent e) {\n        if (!accepting) { dropped.incrementAndGet(); return; }\n        if (queue.offer(e)) return;\n        try {\n            if (e.level().atLeast(neverDrop) || policy == OverflowPolicy.BLOCK) {\n                if (!queue.offer(e, 2, TimeUnit.SECONDS)) dropped.incrementAndGet();\n            } else if (policy == OverflowPolicy.DISCARD_OLDEST) {\n                if (queue.poll() != null) dropped.incrementAndGet();\n                if (!queue.offer(e)) dropped.incrementAndGet();\n            } else {\n                dropped.incrementAndGet();\n            }\n        } catch (InterruptedException ie) {\n            Thread.currentThread().interrupt();\n            dropped.incrementAndGet();\n        }\n    }\n\n    /** Spawn exactly one worker. compareAndSet is why a double-wired config cannot start two of them. */\n    public void start() {\n        if (!started.compareAndSet(false, true)) return;\n        delegate.start();\n        accepting = true;\n        worker = new Thread(this::drain, &quot;log-&quot; + name);\n        worker.setDaemon(true);\n        worker.start();\n    }\n\n    /**\n     * Stop accepting, queue the pill behind whatever is already waiting, and give the worker two seconds to\n     * finish. The honest gap: a thread already past the accepting check can still lose its event; closing that\n     * needs a lock on every append, which is right for an audit sink and wrong for this one.\n     */\n    public void close() {\n        if (!started.compareAndSet(true, false)) return;\n        accepting = false;\n        try { queue.offer(PILL, 2, TimeUnit.SECONDS); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n        try { worker.join(2000); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n        delegate.close();\n    }\n\n    /** Events given up on: queue full, or offered after close. Exported, because invisible loss is a lie. */\n    long droppedCount() { return dropped.get(); }\n\n    /** How full the queue is right now. A metric worth a dashboard. */\n    int queueDepth() { return queue.size(); }\n\n    /**\n     * The worker: take one, sweep up whatever else is waiting, hand the batch to the delegate. Batching turns\n     * sixty-four lock acquisitions into one without changing a line of the sink underneath.\n     */\n    private void drain() {\n        List&lt;LogEvent&gt; batch = new ArrayList&lt;&gt;(64);\n        while (true) {\n            try {\n                LogEvent first = queue.take();\n                if (first == PILL) return;\n                batch.add(first);\n                queue.drainTo(batch, 63);\n                boolean pill = false;\n                for (LogEvent e : batch) {\n                    if (e == PILL) { pill = true; break; }\n                    try { delegate.append(e); } catch (RuntimeException re) { Status.error(name + &quot;: delegate threw&quot;, re); }\n                }\n                batch.clear();\n                if (pill) return;\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt();\n                return;\n            }\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>8 &middot; We deploy with Ctrl-C. What happens to the lines still in the queue?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>close() is the whole answer and it is four steps in one order. A compare-and-set makes it happen once, however many loggers share this sink. The accepting flag goes false, so nothing new joins the backlog. Then the poison pill is offered <i>behind</i> everything already queued, which is what makes the drain finish in order instead of stopping wherever it happens to be. Then join(2000): the worker is a daemon and the wait is bounded, so a wedged sink delays a deploy by two seconds and never holds the JVM open. LoggerContext.shutdown() walks the tree and closes each sink exactly once, deduped by identity because one async sink is usually on several nodes, and Configurator.installShutdownHook is the one line in main that makes Ctrl-C run all of it. The honest gap to say before they ask: a thread already past the accepting check can still lose its event, and closing that window needs a lock on every append &mdash; right for an audit sink, wrong for checkout. The test accepts three hundred lines, closes, and finds three hundred written; the line offered after close is counted on the dropped counter, never half-written.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Stop accepting, queue the pill behind whatever is already waiting, and give the worker two seconds to\n     * finish. The honest gap: a thread already past the accepting check can still lose its event; closing that\n     * needs a lock on every append, which is right for an audit sink and wrong for this one.\n     */\n    public void close() {\n        if (!started.compareAndSet(true, false)) return;\n        accepting = false;\n        try { queue.offer(PILL, 2, TimeUnit.SECONDS); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n        try { worker.join(2000); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n        delegate.close();\n    }\n\n/** Close every sink exactly once, deduped by identity because one async sink is often on several nodes. */\n    void shutdown() {\n        Set&lt;LogAppender&gt; seen = Collections.newSetFromMap(new IdentityHashMap&lt;&gt;());\n        for (Logger l : registry.values()) seen.addAll(l.appenders());\n        for (LogAppender a : seen) {\n            try { a.close(); }\n            catch (RuntimeException ex) { Status.error(a.name() + &quot;: close threw&quot;, ex); }\n        }\n    }\n\n    /** Ctrl-C must not lose the async tail. One line in main(), and shutdown() drains every queue. */\n    static void installShutdownHook(LoggerContext ctx) {\n        Runtime.getRuntime().addShutdownHook(new Thread(ctx::shutdown, &quot;log-shutdown&quot;));\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; Roll the file at 100 MB. Then at midnight. Then one file per tenant.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>All three are the same move in three places. Size rolling lives in Main: RollingFileAppender extends FileAppender and overrides write(), which already runs under the sink's lock, so the size check, the handle swap and the write are one step and a line is never split across two files; the base class already counts bytes, and it counts them after the write returns, so the number is never ahead of the disk. Time rolling is the same override keyed on clock.nowMs() / periodMs instead of a byte count, which is why a test can roll three days in a microsecond. Per-tenant is a sink that picks a sink: RoutingAppender reads a key off the event's context and forwards to a delegate built lazily for that key, with a cap, because keys that come from request data are user input and an uncapped map of sinks is a file-handle leak with a pretty name.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * A file sink that starts a new file once the current one passes a size. The check and the swap happen inside\n * write(), which already runs under the sink&#x27;s lock, so a line is never split across two files.\n */\nfinal class RollingFileAppender extends FileAppender {\n    private final long maxBytes;\n    private int rolls;\n\n    /** @param maxBytes the size at which the next line starts a new file */\n    RollingFileAppender(String name, LogFormatter formatter, LogLevel threshold, Path path, long maxBytes) {\n        super(name, formatter, threshold, path, LogLevel.ERROR); this.maxBytes = maxBytes;\n    }\n\n    /** Roll first if this line would push the file over the limit, then write it normally. */\n    protected void write(LogEvent e, String line) throws IOException {\n        if (bytesWritten &gt; 0 &amp;&amp; bytesWritten + line.length() + 1 &gt; maxBytes) roll();\n        super.write(e, line);\n    }\n\n    /** Close the handle, move the file aside under a numbered name, open a fresh one. */\n    private void roll() throws IOException {\n        closeWriter();\n        rolls++;\n        Files.move(path, path.resolveSibling(path.getFileName() + &quot;.&quot; + rolls), StandardCopyOption.REPLACE_EXISTING);\n        openWriter(false);\n    }\n\n    /** How many times this sink has started a new file. A metric, and what the failure test checks. */\n    int rolls() { lock.lock(); try { return rolls; } finally { lock.unlock(); } }\n}\n\n// ---- ext: roll at midnight -- the same rotation, keyed on a clock bucket instead of a byte count\n/**\n * Rolls when the calendar bucket changes: a new hour, a new day, whatever periodMs says. It reuses the\n * handle-swap the base class already has and asks the injected Clock what time it is, so a test can roll\n * three days in a microsecond.\n */\nfinal class TimeRollingFileAppender extends FileAppender {\n    private static final DateTimeFormatter STAMP = DateTimeFormatter.ofPattern(&quot;yyyy-MM-dd-HH&quot;).withZone(ZoneOffset.UTC);\n\n    private final Clock clock;\n    private final long periodMs;\n    private long bucket;\n    private int rolls;\n\n    /** @param periodMs the length of one file, in milliseconds: 3600_000 for hourly, 86_400_000 for daily */\n    TimeRollingFileAppender(String name, LogFormatter formatter, LogLevel threshold, Path path, Clock clock, long periodMs) {\n        super(name, formatter, threshold, path, LogLevel.ERROR);\n        this.clock = clock; this.periodMs = periodMs; this.bucket = clock.nowMs() / periodMs;\n    }\n\n    /** Runs under the sink&#x27;s lock, so the check, the swap and the write are one step. */\n    protected void write(LogEvent e, String line) throws IOException {\n        long now = clock.nowMs() / periodMs;\n        if (now != bucket &amp;&amp; bytesWritten &gt; 0) {\n            closeWriter();\n            rolls++;\n            Files.move(path, path.resolveSibling(path.getFileName() + &quot;.&quot; + STAMP.format(Instant.ofEpochMilli(bucket * periodMs))),\n                StandardCopyOption.REPLACE_EXISTING);\n            openWriter(false);\n        }\n        bucket = now;\n        super.write(e, line);\n    }\n\n    /** How many times a new period started a new file. */\n    int rolls() { lock.lock(); try { return rolls; } finally { lock.unlock(); } }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Ship structured JSON to a collector, with the request id on every line.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two seams, both already there. The layout is a Strategy, so JsonFormatter is a class the sink is handed: one flat object per line, newline-delimited, which is what every collector already parses. The request id comes from the MDC &mdash; a ThreadLocal map that is snapshot into the event at creation, not referenced, because with an async sink the thread that writes the line is not the thread that made it. The failure test proves exactly that: it logs three hundred lines with rid=req-A, changes the thread's context, then drains, and every line still says req-A. The extension adds MdcScope, an AutoCloseable so try-with-resources puts the context back on every path out; without it a pooled thread stamps the last request's id on the next tenant's lines.</p><div

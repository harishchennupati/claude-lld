<div class="top"><h1>Logger</h1><span class="sub">LLD &middot; Java &middot; OpenJDK 21: demo, 58 failure checks and a 50-thread race pass</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design a logging framework &mdash; the thing behind log.info(&quot;order placed&quot;). Levels, more than one destination, configurable per package, and it must not slow down or crash the application that uses it. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>Every class in an application wants to leave a trail: what happened, how serious it was, and enough around it to find the request later. A line of code calls <code>log.info(\"order placed\")</code> and microseconds later text appears on a console, in a file, or at a collector on another machine. The people using it are two: the engineer writing the call, who wants it to cost nothing when it is switched off, and the engineer on call at two in the morning, who wants DEBUG on one package without restarting anything and without drowning in the rest. Loggers are named after packages, so <code>com.shop.db</code> follows whatever <code>com.shop</code> was set to unless it says otherwise. Many threads write to the same file at the same instant, so the one thing that must always be true is that a <i>record</i> is whole: never half of one thread's record with half of another's spliced into it, and never lost quietly. Record, not line, because an exception brings its whole stack with it &mdash; thirty physical lines that belong to one call and must land together. And one rule above all of those: the logger may never throw into the code that called it. A failed log record must not fail a payment.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that logs through a tree of loggers into more than one sink and then runs fifty threads at once. The interviewer is watching for, in this order: the questions you ask before typing (library or service, and what happens when the queue fills, are the first two); which classes exist and which one owns the level, the sinks and the file handle; one call end to end &mdash; the gate, the event, the vote, the write; what happens when fifty threads share one file; where the rules that will change (the layout, the destination, \"log less\") live, so each is a new class and not an edit; and what happens when the disk is full. Then the twists: rotation, structured JSON with a request id, sampling, rate limiting, per-tenant files, shipping off the box, and configuration that survives a restart.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 352\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">log a line</text><g transform=\"translate(175 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a call site says log.info(...)</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">in a hot loop, a million times</text></g><path d=\"M415 57 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is this loud enough, here?</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a short walk of volatile reads, ~3 ns</text></g><path d=\"M675 57 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">freeze one event</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">level, who, when, thread, context</text></g><path d=\"M935 57 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the whole path votes</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">keep, drop, or no opinion</text></g><text x=\"88\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">write it</text><g transform=\"translate(175 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">format the whole record</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">outside the lock, all at once</text></g><path d=\"M415 192 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take THIS sink's lock</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nothing slow is allowed inside</text></g><path d=\"M675 192 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one write, count the bytes</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the count moves after the write</text></g><path d=\"M935 192 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">unlock, then the next sink</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">or a queue, if the sink is async</text></g><path d=\"M555 84 V95\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(370 95)\"><rect width=\"370\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"185.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">switched off: nothing built, nothing written</text></g><path d=\"M815 219 V232\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(570 232)\"><rect width=\"490\" height=\"30\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"245.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the sink threw: caught, and the next sink still gets it</text></g><text x=\"88\" y=\"285\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"285\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, with no restart: what level is com.shop.db at?  how deep is the queue?  how many lines have we dropped?</text><text x=\"615\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">fifty threads log at the same instant: every RECORD is whole (a stack trace is many lines and still one write), each thread's records stay in its own order,</text><text x=\"615\" y=\"339\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">and a log call can never fail a payment</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>An in-process library, or a log service over the network?</td><td>A library; shipping is just another sink</td><td>Whether an appender is a file handle or a client (moves 1, 12)</td></tr><tr><td>A tree of loggers by dotted name, or one flat map of names?</td><td>A tree, inheriting level and sinks</td><td>A parent pointer and a walk for the effective level (moves 1, 5)</td></tr><tr><td>Synchronous writes, or off the caller's thread?</td><td>Both: async is a wrapper you switch on per sink</td><td>The decorator and its bounded queue (moves 3, 6)</td></tr><tr><td>On a full queue: block, drop, or discard the oldest?</td><td>Drop the newest and count it; ERROR waits instead</td><td>A named policy per sink, and a metric (moves 6, 9)</td></tr><tr><td>Must a level change take effect without a restart?</td><td>Yes</td><td><code>level</code> is a volatile field, not a config object (moves 4, 5)</td></tr><tr><td>Which sinks for v1, and is rotation in scope?</td><td>Console and file; rotation in, shipping out</td><td>One abstract sink with the skeleton, four fillings (moves 1, 3)</td></tr><tr><td>Structured JSON, and a request id on every line?</td><td>The layout is swappable; the context is snapshot</td><td><code>LogFormatter</code>, and the MDC copied into the event (moves 3, 6)</td></tr><tr><td>One process and in memory, or shipped and stored?</td><td>One process; the file IS the persistence</td><td>No repository for events; a follow-up stores the config (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Ask a factory for a logger by name (usually the class name) and get the same object every time; the dotted name makes a tree, and a node with no level of its own follows its nearest ancestor.</li>\n<li>Six levels, and a lazy form whose message is built only if it is going to be used.</li>\n<li>An exception is logged with its whole stack, causes included, and that whole block counts as one record.</li>\n<li>A node may add its own sinks, and may stop using its ancestors' (additivity off).</li>\n<li>Filters vote on an event independently of its level: \"stop logging health checks\" needs no new concept.</li>\n<li>Sinks: console, file, rolling file, and a wrapper that makes any of them asynchronous.</li>\n<li>Two layouts: a human-readable record, and one JSON object per line for a collector.</li>\n<li>A level, a sink or a filter can change while the process is running.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>A switched-off call is a short walk of volatile reads and one compare &mdash; a few nanoseconds, and nothing allocated.</li>\n<li>Concurrent writers never interleave inside one record, and each thread's records keep its own order.</li>\n<li>Memory is bounded under a storm: a fixed queue that drops and counts, never an unbounded one.</li>\n<li>The framework never throws into application code: a log line may not fail a payment.</li>\n<li>Every lookup is O(1): a hash map for names, an integer compare for the level, copy-on-write for the sinks.</li>\n<li>Layouts, sinks, filters and the clock are swappable without touching the Logger.</li>\n<li>In memory, one process, one JVM (say it): shipping to a collector is a follow-up.</li></ul></div></div>\n<div class=\"move\"><h3>One night on call, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 175\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"262\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"131.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">20:10  a hot loop, DEBUG off</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">log.debug(\"cart=\" + cart), 5M times</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the gate stops it in about 3 ns</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the supplier is never called: 0 strings</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"262\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"131.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">02:00  payments only, please</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">com.shop.payments set to DEBUG</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">no restart: level is one volatile field</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">children are louder on the next call</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"262\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"131.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">02:05  a retry storm</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">400,000 identical WARNs in 90 seconds</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the rate-limit filter keeps 3 a minute</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">a 16-deep queue sheds 477 of 500</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"262\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"131.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">02:30  deploy, Ctrl-C</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">close() puts a pill behind the backlog</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">300 accepted, 300 written, none lost</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">join(2s): no sink can hold the JVM</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> an in-process library, not a service; loggers form a tree by dotted name and inherit level and sinks; the level gate is the first line of every call and a disabled call allocates nothing; one lock per sink, held around one write of the whole <i>record</i> &mdash; a stack trace included &mdash; with formatting outside it; a bounded queue that drops and counts rather than an unbounded one; nothing in here ever throws into the caller. Named as out of scope: rotation by time, sampling, per-tenant routing, shipping to a collector, config files &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, elevator, Splitwise) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On this problem two moves carry more weight than usual: move 4, because the shared thing is a file handle and the damage is a torn line rather than a wrong number, and move 6, because the order inside one call is the entire performance story.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a LOGGER named after a class asks if an EVENT is loud enough; a FORMATTER makes a line; APPENDERS write it; FILTERS vote; a FACTORY hands them out</text><g transform=\"translate(24 110)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Logger</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">level, sinks, parent</text></g><path d=\"M104.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(192 110)\"><rect width=\"176\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"88.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LoggerContext</text><text x=\"88.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the registry of names</text></g><path d=\"M280.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(376 110)\"><rect width=\"176\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"88.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AbstractAppender</text><text x=\"88.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a handle, a lock, a queue</text></g><path d=\"M464.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(560 110)\"><rect width=\"176\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"88.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LogEvent</text><text x=\"88.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">frozen facts: a record</text></g><path d=\"M648.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(744 110)\"><rect width=\"186\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"93.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LogFormatter</text><text x=\"93.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M837.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(938 110)\"><rect width=\"126\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"63.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LogFilter</text><text x=\"63.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a vote</text></g><path d=\"M1001.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1072 110)\"><rect width=\"138\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"69.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LogLevel</text><text x=\"69.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a fixed list</text></g><path d=\"M1141.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state that changes, so it becomes a class.   dashed = no state of its own: an interface, a value, or a fixed list</text></svg></div><div class=\"move\"><p>Reading the paragraph again: a <b>logger</b> named after a class decides whether an <b>event</b> is loud enough; a <b>formatter</b> turns it into a line; <b>appenders</b> write it somewhere; <b>filters</b> vote on it; a <b>factory</b> hands out the loggers. A logger has a level, a parent, a list of sinks and a list of filters, all of which change while the process runs: a class. An appender has a file handle, a lock, sometimes a queue and a worker thread: a class. The context has the registry of names: a class. An event is the opposite &mdash; it is born, read and thrown away, and it is read by a thread that did not create it, so it is a <i>record</i>, frozen at creation, including a copy of the thread's context map. A formatter has no state at all, so it is an interface. A filter has a counter at most. And a level is not a class per level: it is a fixed list with a number attached, which is an enum, because the only thing anybody ever does with a level is compare it.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"320\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is this loud enough, here?</text><text x=\"160.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M350 40 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 20)\"><rect width=\"420\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Logger  (owns the level and the parent)</text><text x=\"210.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 40 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 20)\"><rect width=\"310\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">logger.isEnabled(level)</text><text x=\"155.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 70)\"><rect width=\"320\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">turn an event into characters</text><text x=\"160.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M350 90 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 70)\"><rect width=\"420\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LogFormatter  (owns nothing: pure)</text><text x=\"210.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 90 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 70)\"><rect width=\"310\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">formatter.format(event)</text><text x=\"155.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 120)\"><rect width=\"320\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">keep it, or drop it?</text><text x=\"160.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M350 140 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 120)\"><rect width=\"420\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LogFilter  (a counter at most)</text><text x=\"210.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 140 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 120)\"><rect width=\"310\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">filter.decide(event)</text><text x=\"155.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 170)\"><rect width=\"320\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">move the characters to a sink</text><text x=\"160.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M350 190 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 170)\"><rect width=\"420\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AbstractAppender  (owns the handle, the lock)</text><text x=\"210.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 190 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 170)\"><rect width=\"310\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">appender.append(event)</text><text x=\"155.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 220)\"><rect width=\"320\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one logger per name, forever</text><text x=\"160.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M350 240 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 220)\"><rect width=\"420\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LoggerContext  (owns the registry)</text><text x=\"210.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 240 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 220)\"><rect width=\"310\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ctx.getLogger(name)</text><text x=\"155.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the one verb that touches the level, the parent chain AND the sink list is \"log this\": only the Logger sees all three, so it is the orchestrator</text><text x=\"615\" y=\"311\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and notice what is NOT a verb of the Logger: opening a file. A sink opens its own handle, which is why adding Kafka never edits the Logger</text></svg></div><div class=\"move\"><p>The table above is the whole move; two rows in it are worth saying out loud. The first: \"turn an event into characters\" and \"keep it or drop it\" touch <i>nothing</i> &mdash; one immutable input, one answer out &mdash; which is what makes them pure rules that can be handed in rather than methods on anybody. The second: the one verb that touches the level, the parent chain <i>and</i> the sink list at the same time is \"log this\", and only the logger sees all three, so the logger is the orchestrator and nothing else is. Then notice what is <i>not</i> a verb of the logger: opening a file. A sink opens its own handle, which is exactly why adding a Kafka sink next year does not open the Logger class.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 318\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 70)\"><rect width=\"230\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"115.0\" y=\"49.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LoggerContext</text><text x=\"115.0\" y=\"65.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(level, sinks, filters)</text></g><path d=\"M260 125 H320 V40 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 20)\"><rect width=\"280\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"140.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LogFormatter</text><text x=\"140.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">text, JSON, masked</text></g><g transform=\"translate(740 20)\"><rect width=\"460\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"230.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TextFormatter / JsonFormatter / MaskingFormatter</text><text x=\"230.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 40 H670\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 125 H320 V100 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 80)\"><rect width=\"280\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"140.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LogFilter</text><text x=\"140.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">deny, sample, rate-limit</text></g><g transform=\"translate(740 80)\"><rect width=\"460\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"230.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DenyMessageFilter / SamplingFilter / RateLimitFilter</text><text x=\"230.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 100 H670\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 125 H320 V160 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 140)\"><rect width=\"280\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"140.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LogAppender</text><text x=\"140.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">console, file, rolling, routing</text></g><g transform=\"translate(740 140)\"><rect width=\"460\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"230.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ConsoleAppender / FileAppender / RollingFileAppender</text><text x=\"230.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 160 H670\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 125 H320 V220 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 200)\"><rect width=\"280\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"140.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"140.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the wall clock, or a test's</text></g><g transform=\"translate(740 200)\"><rect width=\"460\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"230.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::currentTimeMillis, or () -&gt; t</text><text x=\"230.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 220 H670\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"285\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The Logger never builds a layout, a sink or a filter, so a JSON layout is a new class and one changed line</text><text x=\"615\" y=\"304\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one sink wraps the others: AsyncAppender(fileSink) takes ANY sink off the caller's thread without that sink being edited at all</text></svg></div><div class=\"move\"><p>What text a line becomes will change: a sentence today, JSON tomorrow, masked the day after. Where it goes will change: a console today, a rolling file in staging, a collector in production. What gets dropped will change: health checks today, one-in-a-hundred DEBUG next week, a cap on a repeated line at two in the morning. Each becomes a one-method interface the context is <i>given</i> in <code>configure()</code> and never builds. This is where the patterns come from, not the other way round: a swappable rule behind an interface is <b>Strategy</b>; the filter chain where the first opinionated vote wins is <b>Chain of Responsibility</b>; a logger that announces an event without knowing what a file is, is <b>Observer</b> &mdash; the appenders <i>are</i> the observers. And the one that matters most here is <b>Decorator</b>: <code>AsyncAppender</code> holds any other sink and takes it off the caller's thread without that sink being edited at all, which is how \"never let a slow disk stall checkout\" costs one wiring line. I do them; I do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 258\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"210\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"105.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread A</text><text x=\"105.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">w.write(\"...order\")</text></g><g transform=\"translate(30 110)\"><rect width=\"210\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"105.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread B</text><text x=\"105.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">w.write(\"...refund\")</text></g><g transform=\"translate(330 70)\"><rect width=\"230\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"115.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one BufferedWriter</text><text x=\"115.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one file, one handle</text></g><path d=\"M240 52 H300 V92 H330\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M240 132 H300 V92 H330\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><rect x=\"600\" y=\"20\" width=\"330\" height=\"145\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"765\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"765\" y=\"68\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">write() and newLine() interleave:</text><text x=\"765\" y=\"88\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">09:30 INFO ord09:30 INFO refund</text><text x=\"765\" y=\"112\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">and count++ is read-add-write:</text><text x=\"765\" y=\"132\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">16,000 published, about 13,400 counted</text><text x=\"765\" y=\"156\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: the write is ONE step</text><g transform=\"translate(960 45)\"><rect width=\"240\" height=\"95\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lock per sink</text><text x=\"120.0\" y=\"57.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">format outside, write inside</text></g><text x=\"1040\" y=\"182\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock lives where the handle lives:</text><text x=\"1040\" y=\"200\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the file and the console never wait for each other</text><text x=\"615\" y=\"226\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and the unit is a RECORD, not a line: an exception is thirty physical lines in ONE string, written by ONE w.write() inside the lock,</text><text x=\"615\" y=\"244\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">so two threads throwing at the same instant can never splice their stack traces together (test 9 proves it with 8 threads x 100 exceptions)</text></svg></div><div class=\"move\"><p>Two threads call <code>write()</code> and <code>newLine()</code> on the same <code>BufferedWriter</code>. Those are two calls, not one, so the characters interleave and the file gets half of one line spliced into another: <code>09:30 INFO ord09:30 INFO refund</code>. The same gap eats counters, because <code>count++</code> is a read, an add and a write &mdash; the demo publishes sixteen thousand events into an unlocked counting sink and it reports about thirteen thousand of them. So the write must be one step, owned by the thing that owns the handle: the appender. The lock is per <i>sink</i>, not per framework, which is the whole trick &mdash; the file and the console and the collector never wait for each other, and neither do two files. And what is inside that lock is the narrowest thing possible: not the formatting, which is pure arithmetic over an immutable event and runs before the lock is taken. Say the unit out loud, because the interviewer will push on it: the thing that must be whole is a <b>record</b>, not a line. A logged exception is its message plus thirty frames of stack, and the formatter returns all of that as <i>one string</i> so the sink writes it with one <code>write()</code> inside one lock; eight threads each throwing a hundred times produce eight hundred intact blocks and never a frame from one thread inside another's trace.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 308\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"380\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which logger is this name?</text><text x=\"190.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M410 37 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 18)\"><rect width=\"530\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"265.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ConcurrentHashMap&lt;String, Logger&gt;</text><text x=\"265.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 37 H1060\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1060 18)\"><rect width=\"140\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 66)\"><rect width=\"380\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is this level loud enough?</text><text x=\"190.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M410 85 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 66)\"><rect width=\"530\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"265.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an enum's int, one volatile read</text><text x=\"265.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 85 H1060\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1060 66)\"><rect width=\"140\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), 3 ns</text></g><g transform=\"translate(30 114)\"><rect width=\"380\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which sinks does this node have?</text><text x=\"190.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M410 133 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 114)\"><rect width=\"530\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"265.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CopyOnWriteArrayList&lt;LogAppender&gt;</text><text x=\"265.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 133 H1060\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1060 114)\"><rect width=\"140\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), no lock</text></g><g transform=\"translate(30 162)\"><rect width=\"380\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is waiting to be written?</text><text x=\"190.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M410 181 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 162)\"><rect width=\"530\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"265.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ArrayBlockingQueue&lt;LogEvent&gt;(capacity)</text><text x=\"265.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 181 H1060\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1060 162)\"><rect width=\"140\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), bounded</text></g><g transform=\"translate(30 210)\"><rect width=\"380\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many have we dropped?</text><text x=\"190.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M410 229 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 210)\"><rect width=\"530\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"265.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AtomicLong</text><text x=\"265.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 229 H1060\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1060 210)\"><rect width=\"140\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><text x=\"615\" y=\"275\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the one that is NOT O(1): the walk up the parent chain for the effective level, which is O(d) with d = 3 to 6 -- six volatile reads, about 3 ns</text><text x=\"615\" y=\"294\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">log4j caches that walk and pays an invalidation sweep on every setLevel; we do not, and say so out loud rather than pretending it is free</text></svg></div><div class=\"move\"><p>Three of those choices are worth defending out loud. <code>CopyOnWriteArrayList</code> for the sinks, because reconfiguration happens a handful of times in a process and dispatch happens millions of times a second: you pay the copy on the rare side and every log call iterates a snapshot with no lock at all. <code>ArrayBlockingQueue</code> with a capacity, because the capacity <i>is</i> the memory bound &mdash; there is no other back-pressure in the design. And the honest one: the walk up the parent chain for the effective level is <i>not</i> O(1). It is O(d) with a depth of three to six, so a handful of volatile reads, single-digit nanoseconds. Log4j caches that walk and pays an invalidation sweep on every <code>setLevel</code>; this does not, and says so rather than pretending.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">NEW</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no handle, no worker</text></g><g transform=\"translate(230 30)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">STARTED</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">accepting</text></g><g transform=\"translate(30 120)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CLOSED</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">drained, handle gone</text></g><path d=\"M190 52 H230\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"210\" y=\"24\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--acc)\">start()</text><path d=\"M310 74 V100 H110 V120\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"260\" y=\"112\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--acc)\">close()</text><text x=\"210\" y=\"190\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">start() and close() are compare-and-set,</text><text x=\"210\" y=\"208\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">so a double-wired config cannot spawn two workers</text><rect x=\"430\" y=\"20\" width=\"780\" height=\"196\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"820\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside one log call, and why it is this order</text><text x=\"445\" y=\"68\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1  the gate: one volatile read and a compare -- no event, no string, nothing allocated</text><text x=\"445\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2  build the event, with the thread's context COPIED in: the writer is not the caller</text><text x=\"445\" y=\"112\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3  the whole path votes first, so a child's sink cannot write a line ROOT was about to veto</text><text x=\"445\" y=\"134\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4  per sink: its threshold, format the WHOLE record outside the lock, then lock, ONE write, count the bytes</text><text x=\"445\" y=\"156\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5  unlock, then the next sink, each inside its own try/catch</text><text x=\"445\" y=\"178\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the byte count moves only after the write returned, so rotation is never ahead of the disk;</text><text x=\"445\" y=\"200\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a sink that throws costs its own line and nothing else; the caller never finds out</text><text x=\"615\" y=\"236\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">three states and one rule: nothing that can fail is inside the lock, and nothing irreversible happens before the write it depends on</text></svg></div><div class=\"move\"><p>An appender is NEW until <code>start()</code>, STARTED while it accepts, CLOSED after it drains. Both transitions are compare-and-set, so a config wired twice cannot spawn two worker threads on one handle. Writing the states down forces the question the interviewer will ask: what is the order inside one call? First the gate &mdash; one volatile read and a compare, with nothing allocated, which is what makes a switched-off call free. Then the event, with the thread's context <i>copied</i> into it, because with an async sink the thread that writes the line is not the thread that made it. Then the whole path votes, so a child's sink cannot write a line ROOT was about to veto. Only then, per sink: its own threshold, the formatting <i>outside</i> the lock &mdash; and rendering a stack trace is the one genuinely expensive piece of formatting, microseconds rather than nanoseconds, which is exactly why it must not be inside &mdash; the lock, one write, and the byte counter moved <i>after</i> the write returned &mdash; so a failed write leaves the count where it was and rotation is never ahead of the disk. Then unlock, then the next sink, each inside its own try/catch. And <code>close()</code> puts a poison pill <i>behind</i> the backlog, so everything already accepted is written, in order, before the process ends.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one sink's lines happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 296\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"560\" height=\"132\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about 180 nanoseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one write of ~75 characters into an 8 KB buffer</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one newLine()</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">bytesWritten += line.length() + 1, after the write</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">measured, not guessed: 176 ns on this laptop</text></g><path d=\"M590 86 H650\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"620\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(650 20)\"><rect width=\"550\" height=\"132\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"275.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: nanoseconds to milliseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the gate: 3 ns.  the event plus the format: ~250 ns</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the flush at ERROR: a real system call</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the disk, when the buffer fills: milliseconds</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the collector, for a shipping sink: tens of ms</text></g><text x=\"615\" y=\"180\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">fifty threads log into ONE file sink at the same instant</text><g transform=\"translate(30 195)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0</text></g><g transform=\"translate(148 195)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0.9 us</text></g><g transform=\"translate(266 195)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 11</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 1.8 us</text></g><g transform=\"translate(384 195)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 16</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 2.7 us</text></g><g transform=\"translate(502 195)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 21</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 3.6 us</text></g><g transform=\"translate(620 195)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 26</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 4.5 us</text></g><g transform=\"translate(738 195)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 31</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 5.4 us</text></g><g transform=\"translate(856 195)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 36</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 6.3 us</text></g><g transform=\"translate(974 195)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 41</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 7.2 us</text></g><g transform=\"translate(1092 195)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 50</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 8.8 us</text></g><text x=\"615\" y=\"263\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the fiftieth thread waits about nine microseconds for the lock, then returns; put the async wrapper in front and it waits 1.6 microseconds</text><text x=\"615\" y=\"282\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for a queue slot and returns before a single character has been written. One at a time is true, and at 180 nanoseconds nobody can tell.</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself: if every record takes the sink's lock, has logging become a queue? It has, for about a hundred and eighty nanoseconds &mdash; that is one buffered write of seventy-five characters, one newline, and one addition to the byte counter, measured rather than guessed. Everything slow is outside it: the gate at three nanoseconds, building the event and the line at about two hundred and fifty, the flush at ERROR which is a real system call, the disk when the buffer fills, and the collector at tens of milliseconds for a shipping sink. So when fifty threads log into one file at the same instant, the fiftieth waits about nine microseconds and then returns. Put the async wrapper in front and the fiftieth waits one and a half microseconds for a queue slot and returns before a single character has been written.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 224\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"570\" height=\"190\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"305\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per sink: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"68\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the locked part of one line: one buffered write, about 180 ns</text><text x=\"35\" y=\"93\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a service at 5,000 requests a second, 4 lines each: 20,000 a second</text><text x=\"35\" y=\"118\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">20,000 x 180 ns = 3.6 ms of lock in every second: 0.36% busy</text><text x=\"35\" y=\"143\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">even 200,000 lines a second is 36 ms in a second: 3.6% busy</text><text x=\"35\" y=\"168\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">and the lock is per SINK, so the file and the console never meet</text><text x=\"900\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(610 58)\"><rect width=\"590\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"295.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1  format outside the lock, flush only at ERROR</text><text x=\"295.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: the lock is 180 ns, not the 430 ns whole call</text></g><g transform=\"translate(610 110)\"><rect width=\"590\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"295.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2  wrap the sink in AsyncAppender</text><text x=\"295.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the caller pays one ~33 ns enqueue and stops paying format AND write</text></g><g transform=\"translate(610 162)\"><rect width=\"590\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"295.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3  one sink per hot subsystem, then off the box</text><text x=\"295.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the sink becomes a client: batch, ship, and a file is not your problem</text></g></svg></div><div class=\"move\"><p>A service handling five thousand requests a second with four lines each produces twenty thousand events a second. At a hundred and eighty nanoseconds of lock per line that is three and a half milliseconds of lock in every second: busy roughly a third of one per cent. Even a fictional service at two hundred thousand lines a second is only three and a half per cent, and the lock is per sink, so the file and the console are not the same queue. Then the ladder, in the order you would climb it: keep formatting outside the lock and flush only at ERROR, which this code already does and which is the difference between a hundred and eighty nanoseconds and the four hundred and thirty a whole call costs; wrap the sink in <code>AsyncAppender</code>, which leaves the caller paying a thirty-three nanosecond enqueue and nothing else &mdash; the formatting moves to the worker along with the write &mdash; and lets that one worker batch sixty-four events per lock acquisition; and beyond that, give each hot subsystem its own sink and then move off the box entirely, where the sink becomes a client that batches and ships and a file is somebody else's problem. Say the arithmetic first: climbing the ladder without it is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 305\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two threads splice a line, or a stack trace</text></g><path d=\"M370 37 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 18)\"><rect width=\"780\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=

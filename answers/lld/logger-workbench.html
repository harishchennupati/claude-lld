class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The per-thread diagnostic context: request id, user id, tenant. Held in a ThreadLocal and copied into every\n * event at creation, because with an async sink the thread that writes the line is not the thread that made it.\n */\nfinal class Mdc {\n    private static final ThreadLocal&lt;Map&lt;String, String&gt;&gt; CTX = ThreadLocal.withInitial(LinkedHashMap::new);\n\n    private Mdc() {}\n\n    /** Put one key on this thread&#x27;s context. It rides on every event this thread logs from now on. */\n    static void put(String key, String value) { CTX.get().put(key, value); }\n\n    /** Take one key off this thread&#x27;s context. */\n    static void remove(String key) { CTX.get().remove(key); }\n\n    /** Empty this thread&#x27;s context. A pooled thread that forgets this leaks its ids to the next request. */\n    static void clear() { CTX.get().clear(); }\n\n    /** An unmodifiable copy taken at call time. The live map is never handed to another thread. */\n    static Map&lt;String, String&gt; snapshot() {\n        Map&lt;String, String&gt; m = CTX.get();\n        return m.isEmpty() ? Map.of() : Collections.unmodifiableMap(new LinkedHashMap&lt;&gt;(m));\n    }\n}\n\n// ---- ext: context that cannot leak -- a scope a pooled thread cannot forget to clear\n/**\n * The MDC bug that only shows up in production: a pooled thread keeps a request id and stamps it on the next\n * tenant&#x27;s lines. try-with-resources makes forgetting impossible, because close() runs on every path out.\n */\nfinal class MdcScope implements AutoCloseable {\n    private final Map&lt;String, String&gt; saved;\n\n    /** Saves whatever this thread already had, then adds the new keys. */\n    MdcScope(Map&lt;String, String&gt; add) {\n        saved = Mdc.snapshot();\n        add.forEach(Mdc::put);\n    }\n\n    /** Two keys, the common case: MdcScope.of(&quot;rid&quot;, id). */\n    static MdcScope of(String k, String v) { return new MdcScope(Map.of(k, v)); }\n\n    /** Puts the thread&#x27;s context back exactly as it was, including &quot;empty&quot;. */\n    public void close() {\n        Mdc.clear();\n        saved.forEach(Mdc::put);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>11 &middot; I cannot debug from &quot;payment failed&quot;. Put the stack trace on the line \u2014 and tell me what that costs.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The formatter renders the throwable with printStackTrace into a StringWriter, causes and all, and appends it to the same string it was already building. That single decision is what keeps the invariant intact: the sink still receives ONE string and still writes it with one write() inside one lock, so thirty physical lines land together and a second thread throwing at the same instant cannot put a frame in the middle of yours. The unit is a record, not a line. The cost is real and worth saying out loud: walking a stack is microseconds, not the two hundred and fifty nanoseconds a plain line costs, which is precisely why formatting sits outside the lock &mdash; if it were inside, one exception would hold the file against every other thread. The JSON layout does the same thing differently: the trace becomes an escaped \"stack\" field so the record is still one physical line, which is what a collector wants. The renderer is a static method on the interface rather than a second method on it, so a formatter is still a lambda. Test 9 runs eight threads throwing a hundred exceptions each and checks all eight hundred blocks came back unspliced.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The exception, with its causes and its frames, as text. Static, so it is not a second method anybody has\n     * to implement and a layout is still a lambda. This is the expensive part of formatting -- microseconds,\n     * not nanoseconds -- which is exactly why formatting happens outside the sink&#x27;s lock.\n     */\n    static String stackOf(Throwable t) {\n        StringWriter sw = new StringWriter(512);\n        t.printStackTrace(new PrintWriter(sw));\n        return sw.toString().stripTrailing();\n    }\n\n/** Builds the whole record. Never touches shared state, so any number of threads may be inside it at once. */\n    public String format(LogEvent e) {\n        StringBuilder sb = new StringBuilder(96);\n        sb.append(TS.format(Instant.ofEpochMilli(e.tsMs()))).append(&#x27; &#x27;)\n          .append(pad(e.level().name())).append(&quot; [&quot;).append(e.threadName()).append(&quot;] &quot;)\n          .append(e.loggerName()).append(&quot; - &quot;).append(e.message());\n        if (!e.context().isEmpty()) sb.append(&#x27; &#x27;).append(e.context());\n        // the stack trace goes on its own lines INSIDE the same string, so the sink still writes it as one step\n        if (e.error() != null) sb.append(&#x27;\\n&#x27;).append(LogFormatter.stackOf(e.error()));\n        return sb.toString();\n    }\n\n        // 9. a stack trace is many physical lines and still ONE record. The whole block is one write under one\n        //    lock, so eight threads throwing at the same instant can never splice their traces together.\n        LoggerContext c9 = new LoggerContext();\n        Path traces = dir.resolve(&quot;traces.log&quot;);\n        FileAppender traceSink = new FileAppender(&quot;trace&quot;, new TextFormatter(), LogLevel.TRACE, traces, LogLevel.OFF);\n        Logger boom = c9.getLogger(&quot;com.shop.boom&quot;);\n        boom.addAppender(traceSink);\n        boom.setAdditive(false);\n        int throwers = 8, throws_ = 100;\n        Main.runConcurrently(throwers, i -&gt; {\n            Throwable t = new IllegalStateException(&quot;boom from t&quot; + i, new ArithmeticException(&quot;root cause t&quot; + i));\n            for (int k = 0; k &lt; throws_; k++) boom.error(&quot;failed t&quot; + i + &quot;-&quot; + k, t);\n        });\n        traceSink.close();\n        List&lt;String&gt; phys = Files.readAllLines(traces);\n        int records = 0, spliced = 0;\n        String owner = null;\n        for (String l : phys) {\n            java.util.regex.Matcher h = java.util.regex.Pattern.compile(&quot;^\\\\d\\\\d:\\\\d\\\\d:\\\\d\\\\d\\\\.\\\\d\\\\d\\\\d .* - failed t(\\\\d+)-\\\\d+$&quot;).matcher(l);\n            if (h.matches()) { records++; owner = h.group(1); }\n            else if (owner == null) spliced++;                                   // a trace line with no header above it\n            else if (l.startsWith(&quot;java.lang.IllegalStateException&quot;) &amp;&amp; !l.endsWith(&quot;boom from t&quot; + owner)) spliced++;\n            else if (l.startsWith(&quot;Caused by: java.lang.ArithmeticException&quot;) &amp;&amp; !l.endsWith(&quot;root cause t&quot; + owner)) spliced++;\n        }\n        check(records == throwers * throws_, &quot;8 threads x 100 exceptions are &quot; + records + &quot; records&quot;);\n        check(spliced == 0, &quot;every stack-trace line sits inside the record that owns it: no two threads spliced&quot;);\n        check(phys.size() &gt; records * 3, &quot;and a record really is several physical lines: &quot; + phys.size() + &quot; lines for &quot; + records + &quot; records&quot;);\n        check(phys.stream().anyMatch(l -&gt; l.startsWith(&quot;Caused by: java.lang.ArithmeticException&quot;)), &quot;the cause chain is written too, not just the top exception&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; A retry loop logged four hundred thousand identical WARNs and paged us. Cap it, now.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>This is neither a level question nor a sink question &mdash; a retry warning is valid WARN &mdash; so it goes on the filter seam that already exists. RateLimitFilter keys on logger plus message, keeps a window of how many of that exact line went through, and denies past the cap; a thousand distinct lines are unaffected and one repeated line is capped. The counter is a compare-and-set over an immutable window record rather than a lock, because this sits on the hot path of every call, and the map of keys has a ceiling for the same reason the queue does. ERROR and above return NEUTRAL: you do not silence the thing that wakes you. SamplingFilter is the same shape for \"keep one DEBUG in a hundred\". Logger, every appender and every formatter stay shut, which is the O in SOLID being proved rather than asserted.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: log less -- sampling, and a cap on one repeated line, both behind the filter seam\n/**\n * Keeps one DEBUG event in N and leaves everything at or above the bar alone. Adding it to a subtree turns\n * that subtree&#x27;s volume down without touching a logger, a sink or a formatter.\n */\nfinal class SamplingFilter implements LogFilter {\n    private final int keepOneIn;\n    private final LogLevel untouchedFrom;\n    private final AtomicLong seen = new AtomicLong();\n\n    /** @param keepOneIn 100 keeps one per cent; @param untouchedFrom at and above this level nothing is sampled */\n    SamplingFilter(int keepOneIn, LogLevel untouchedFrom) { this.keepOneIn = keepOneIn; this.untouchedFrom = untouchedFrom; }\n\n    /** NEUTRAL means &quot;no opinion, carry on&quot;: the event survives unless something else denies it. */\n    public FilterDecision decide(LogEvent e) {\n        if (e.level().atLeast(untouchedFrom)) return FilterDecision.NEUTRAL;\n        return seen.incrementAndGet() % keepOneIn == 0 ? FilterDecision.NEUTRAL : FilterDecision.DENY;\n    }\n}\n\n/**\n * The mid-round rule change: a retry loop logged four hundred thousand identical WARNs and paged somebody.\n * This caps how often one distinct line may appear in a window. The counter is a compare-and-set over an\n * immutable window rather than a lock, because this sits on the hot path of every call.\n */\nfinal class RateLimitFilter implements LogFilter {\n    /** The count so far and when the window started, swapped as one value so it can never be half-updated. */\n    private record Window(long startMs, int used) {}\n\n    private final ConcurrentHashMap&lt;String, AtomicReference&lt;Window&gt;&gt; windows = new ConcurrentHashMap&lt;&gt;();\n    private final int maxPerWindow;\n    private final long windowMs;\n    private final Clock clock;\n    private final LogLevel untouchedFrom;\n    private final int maxKeys;\n    private final AtomicLong suppressed = new AtomicLong();\n\n    /** @param untouchedFrom ERROR and above are never throttled: you do not silence the thing that wakes you */\n    RateLimitFilter(int maxPerWindow, long windowMs, Clock clock, LogLevel untouchedFrom, int maxKeys) {\n        this.maxPerWindow = maxPerWindow; this.windowMs = windowMs; this.clock = clock;\n        this.untouchedFrom = untouchedFrom; this.maxKeys = maxKeys;\n    }\n\n    /** Keyed by logger plus message, so a thousand distinct lines are unaffected and one repeated line is capped. */\n    public FilterDecision decide(LogEvent e) {\n        if (e.level().atLeast(untouchedFrom)) return FilterDecision.NEUTRAL;\n        String key = e.loggerName() + &quot;|&quot; + e.message();\n        AtomicReference&lt;Window&gt; ref = windows.get(key);\n        if (ref == null) {\n            if (windows.size() &gt;= maxKeys) return FilterDecision.NEUTRAL;\n            ref = windows.computeIfAbsent(key, k -&gt; new AtomicReference&lt;&gt;(new Window(clock.nowMs(), 0)));\n        }\n        while (true) {\n            Window w = ref.get();\n            long now = clock.nowMs();\n            Window next = now - w.startMs() &gt;= windowMs ? new Window(now, 1) : new Window(w.startMs(), w.used() + 1);\n            if (next.used() &gt; maxPerWindow) { suppressed.incrementAndGet(); return FilterDecision.DENY; }\n            if (ref.compareAndSet(w, next)) return FilterDecision.NEUTRAL;\n        }\n    }\n\n    /** How many lines were suppressed. Export it, or the cap is a lie told to whoever reads the log. */\n    long suppressedCount() { return suppressed.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Mask card numbers and e-mail addresses before anything hits disk.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A MaskingFormatter that implements LogFormatter and wraps another one: the inner layout builds the line and the wrapper redacts it. Because it is a formatter it runs outside every sink's lock, once, and every sink downstream of it inherits the redaction &mdash; the same Decorator move as AsyncAppender, one level down. The card pattern is backed by a Luhn check so a long request id or a timestamp is not redacted by accident, and an address keeps its domain. The honest caveat to say out loud: redacting a finished line is a backstop, not a policy &mdash; the real fix is not putting a card number in a log call, and a structured layout that knows which field is sensitive beats a regular expression over a sentence.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: mask before anything hits disk -- a formatter that wraps a formatter\n/**\n * The Decorator again, one level down: it takes any layout, lets it build the line, then redacts the line.\n * Because it is a formatter it runs outside the sink&#x27;s lock, once, and every sink downstream inherits it.\n */\nfinal class MaskingFormatter implements LogFormatter {\n    private static final Pattern CARD = Pattern.compile(&quot;\\\\b\\\\d(?:[ -]?\\\\d){12,18}\\\\b&quot;);\n    private static final Pattern EMAIL = Pattern.compile(&quot;\\\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\\\.[A-Za-z]{2,}\\\\b&quot;);\n\n    private final LogFormatter inner;\n\n    /** @param inner the layout being wrapped: text, JSON, or another masker */\n    MaskingFormatter(LogFormatter inner) { this.inner = inner; }\n\n    /** Card numbers keep their last four; e-mail addresses keep their domain. */\n    public String format(LogEvent e) {\n        String line = inner.format(e);\n        Matcher m = CARD.matcher(line);\n        StringBuilder sb = new StringBuilder(line.length());\n        while (m.find()) {\n            String digits = m.group().replaceAll(&quot;\\\\D&quot;, &quot;&quot;);\n            String rep = luhn(digits) ? &quot;****-****-****-&quot; + digits.substring(digits.length() - 4) : m.group();\n            m.appendReplacement(sb, Matcher.quoteReplacement(rep));\n        }\n        m.appendTail(sb);\n        return EMAIL.matcher(sb.toString()).replaceAll(x -&gt; &quot;***@&quot; + x.group().substring(x.group().indexOf(&#x27;@&#x27;) + 1));\n    }\n\n    /** The checksum every card number satisfies. It is what keeps a long id or a timestamp from being redacted. */\n    static boolean luhn(String digits) {\n        int sum = 0;\n        boolean alt = false;\n        for (int i = digits.length() - 1; i &gt;= 0; i--) {\n            int d = digits.charAt(i) - &#x27;0&#x27;;\n            if (alt) { d *= 2; if (d &gt; 9) d -= 9; }\n            sum += d;\n            alt = !alt;\n        }\n        return sum % 10 == 0;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>14 &middot; The level configuration must survive a restart, and change without one.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The levels go behind a two-method repository, LevelStore, that loads and saves a map from logger name to level name; in memory today, a file or a table tomorrow, with the same two methods. A Configurator reads it and calls the same setLevel every test calls by hand, so it is a client of the framework rather than a new concept inside it, and because level is a volatile field a reload takes effect on the very next call. Snapshotting the other way writes back only the nodes that have an opinion of their own, which is what keeps the file small. Say what does NOT need a repository: the events themselves, because the log file already is the persistence. The interesting one is the shipping sink, which clears its buffer only after the send returned &mdash; a failed send leaves the lines exactly where they were and the next flush retries them &mdash; and stamps each batch with an id so the far side applies a repeat once. Its retry buffer has a ceiling too: a collector that never comes back sheds down to the cap and counts every line it gave up on, which the test checks with twenty lines and a transport that always throws.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: configuration that outlives the process -- a repository for the level tree, and a hot reload\n/** Where the level tree is kept between runs: a file, a table, a config service. One interface, two methods. */\ninterface LevelStore {\n    /** logger name to level name, as text, because that is what a config file holds. */\n    Map&lt;String, String&gt; load();\n\n    /** Replace what is stored. In SQL: DELETE then INSERT inside one transaction, or an upsert per row. */\n    void save(Map&lt;String, String&gt; levels);\n}\n\n/** The obvious implementation, for a test and for the demo. A file or a table is the same two methods. */\nfinal class InMemoryLevelStore implements LevelStore {\n    private volatile Map&lt;String, String&gt; data = new LinkedHashMap&lt;&gt;();\n\n    public Map&lt;String, String&gt; load() { return new LinkedHashMap&lt;&gt;(data); }\n\n    public void save(Map&lt;String, String&gt; levels) { data = new LinkedHashMap&lt;&gt;(levels); }\n}\n\n/**\n * A client of the framework, not a new concept inside it: it reads the store and calls the same setLevel\n * every test calls by hand. Because level is a volatile field, a reload takes effect on the very next call.\n */\nfinal class Configurator {\n    private Configurator() {}\n\n    /** Apply a stored tree to a live context. Unknown names simply create the node, which is harmless. */\n    static void apply(LoggerContext ctx, Map&lt;String, String&gt; levels) {\n        levels.forEach((name, level) -&gt; {\n            try { ctx.getLogger(name).setLevel(LogLevel.valueOf(level)); }\n            catch (IllegalArgumentException ex) { Status.error(&quot;bad level in config: &quot; + name + &quot;=&quot; + level, ex); }\n        });\n    }\n\n    /** Read every level anybody has set, so it can be written back. */\n    static Map&lt;String, String&gt; snapshot(LoggerContext ctx) {\n        Map&lt;String, String&gt; out = new LinkedHashMap&lt;&gt;();\n        for (String n : ctx.names()) {\n            LogLevel own = ctx.getLogger(n).level();\n            if (own != null) out.put(n, own.name());\n        }\n        return out;\n    }\n\n    /** Ctrl-C must not lose the async tail. One line in main(), and shutdown() drains every queue. */\n    static void installShutdownHook(LoggerContext ctx) {\n        Runtime.getRuntime().addShutdownHook(new Thread(ctx::shutdown, &quot;log-shutdown&quot;));\n    }\n}\n\n// ---- ext: ship the logs -- the appender as a network client, batched and at-least-once\n/** Whatever actually moves bytes off the box: HTTP, gRPC, a Kafka producer. A lambda in a test. */\ninterface LogTransport {\n    /** Send one batch under an id the far side can use to recognise a repeat. May throw; the sink catches it. */\n    void send(String batchId, List&lt;String&gt; lines);\n}\n\n/**\n * A sink that talks to a collector. It batches, and it clears the buffer only after the send returns: a\n * failed send leaves the lines exactly where they were and the next flush retries them, which is why the\n * batch carries an id -- at-least-once delivery plus an id at the far side is exactly-once storage.\n */\nfinal class HttpShipperAppender implements LogAppender {\n    private final String name;\n    private final LogFormatter formatter;\n    private final LogTransport transport;\n    private final int batchSize;\n    private final int maxPending;\n    private final List&lt;String&gt; pending = new ArrayList&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n    private final AtomicLong batches = new AtomicLong();\n    private final AtomicLong dropped = new AtomicLong();\n    private volatile boolean started;\n\n    /** @param maxPending the ceiling on the retry buffer: a collector that stays down must not eat the heap */\n    HttpShipperAppender(String name, LogFormatter formatter, LogTransport transport, int batchSize, int maxPending) {\n        this.name = name; this.formatter = formatter; this.transport = transport;\n        this.batchSize = batchSize; this.maxPending = maxPending;\n    }\n\n    public String name() { return name; }\n\n    /** Format outside the lock, as always; the lock covers only the buffer and the send. */\n    public void append(LogEvent e) {\n        if (!started) return;\n        String line;\n        try { line = formatter.format(e); } catch (RuntimeException ex) { Status.error(name + &quot;: format&quot;, ex); return; }\n        lock.lock();\n        try {\n            pending.add(line);\n            if (pending.size() &gt;= batchSize) flushLocked();\n        } finally { lock.unlock(); }\n    }\n\n    public void start() { started = true; }\n\n    /** Flush what is left, then stop. Anything that still will not send is counted, never silently binned. */\n    public void close() {\n        if (!started) return;\n        started = false;\n        lock.lock();\n        try { flushLocked(); dropped.addAndGet(pending.size()); pending.clear(); }\n        finally { lock.unlock(); }\n    }\n\n    /** Batches accepted by the collector. */\n    long batchesSent() { return batches.get(); }\n\n    /** Lines given up on: the retry buffer overflowed, or the collector was still down at close. */\n    long droppedCount() { return dropped.get(); }\n\n    /** Called with the lock held. The order is the whole point: send, and only then forget. */\n    private void flushLocked() {\n        if (pending.isEmpty()) return;\n        String batchId = name + &quot;-&quot; + (batches.get() + 1);\n        try {\n            transport.send(batchId, List.copyOf(pending));\n            batches.incrementAndGet();\n            pending.clear();\n        } catch (RuntimeException ex) {\n            Status.error(name + &quot;: send failed, will retry &quot; + pending.size() + &quot; lines&quot;, ex);\n            while (pending.size() &gt; maxPending) { pending.remove(0); dropped.incrementAndGet(); }\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Where does time come from, and how do you test what a line was stamped with?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The context has a Clock it was handed and every event is stamped from it; nothing else in the framework reads the wall clock. A test sets an instant, logs, moves the instant and logs again, and can then assert the exact timestamps. The same seam is what makes the time-rolling sink testable: it asks the injected clock which day it is, so a test rolls three days in a microsecond instead of waiting for midnight. It is also why the rate limiter's window can be tested: move the clock past the window and the next identical line goes through.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Where time comes from. Injected, so a test can stamp an event with any instant it likes. */\ninterface Clock { long nowMs(); }\n\n// on the context: handed in, defaulted, never read from the wall clock inside a method\nprivate volatile Clock clock = System::currentTimeMillis;\nvoid setClock(Clock c) { clock = c; }\n\n// in a test or a demo: pick the instant, then move it\nlong[] now = { 1_789_205_400_000L };\nctx.setClock(() -&gt; now[0]);\nday.info(&quot;day 0&quot;);\nnow[0] += 86_400_000L;                                  // a day later: the time-rolling sink starts a new file\nday.info(&quot;day 1&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Which pattern is where, which SOLID letter is where, and why is LogLevel an enum rather than a class per level?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The tables in moves 10 and 11 are the list; what an interviewer is actually testing is whether you can defend two of them and refuse the rest. Defend Decorator: AsyncAppender holds any sink and takes it off the caller's thread, MaskingFormatter holds any layout and redacts what it produced, and neither of the things being wrapped was edited &mdash; that is what made \"never let a slow disk stall checkout\" one wiring line. Defend Factory, which most problems do not earn: getLogger must return the same object for a name forever, or a level change at two in the morning reaches one static field and not the other, so identity is the requirement rather than tidiness. Refuse Singleton (the context is handed to its callers, which is why a test builds a fresh one) and refuse Builder for now (four constructor arguments, all four required; it earns its place the day a config file has twenty knobs). And LogLevel is an enum because the only operation on a level is comparing its severity to another: a class per level would be six classes and a virtual call on the hottest line in the framework, with no way to write TRACE &lt; DEBUG as one integer compare.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: a rule behind an interface, handed in, never built by the Logger\ninterface LogFormatter { String format(LogEvent e); }\nctx.configure(LogLevel.INFO, List.of(console), List.of(new DenyMessageFilter(&quot;/healthz&quot;)));\n\n// Decorator: any sink goes off-thread without being edited; any layout gets masked the same way\nnew AsyncAppender(&quot;async&quot;, fileSink, 8192, OverflowPolicy.BLOCK, LogLevel.ERROR);\nnew MaskingFormatter(new TextFormatter());\n\n// Template Method: the skeleton is final, the hole is write(), and the lock is already held inside it\npublic final void append(LogEvent e) { /* threshold, format, lock, write, unlock, never throw */ }\nprotected abstract void write(LogEvent e, String line) throws Exception;\n\n// Observer + Chain of Responsibility: the sinks are the listeners, the filters are the voters\nlogger.addAppender(a);   logger.addFilter(e -&gt; e.message().contains(&quot;/healthz&quot;) ? DENY : NEUTRAL);\n\n// Factory: EARNED here, because identity is the requirement, not tidiness\nLogger l = registry.computeIfAbsent(name, n -&gt; new Logger(n, parent, this));\n\n// Enum, not a class per level: the only operation is one integer compare on the hottest line in the framework\nenum LogLevel { TRACE(10), DEBUG(20), INFO(30), WARN(40), ERROR(50), FATAL(60), OFF(Integer.MAX_VALUE); }\nboolean atLeast(LogLevel bar) { return severity &gt;= bar.severity; }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.io.*;\nimport java.nio.charset.StandardCharsets;\nimport java.nio.file.*;\nimport java.time.Instant;\nimport java.time.ZoneOffset;\nimport java.time.format.DateTimeFormatter;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.ReentrantLock;\nimport java.util.function.Supplier;\n\n/**\n * Severity, as an ordered ladder. The number is the whole gate: a switched-off call is one volatile read and\n * one integer compare, with no event allocated and no string built. OFF is the sentinel nothing can reach.\n */\nenum LogLevel {\n    TRACE(10), DEBUG(20), INFO(30), WARN(40), ERROR(50), FATAL(60), OFF(Integer.MAX_VALUE);\n\n    /** How loud this level is. Compared, never switched on. */\n    final int severity;\n\n    LogLevel(int severity) { this.severity = severity; }\n\n    /** True when this level is at least as loud as the bar it is being measured against. */\n    boolean atLeast(LogLevel bar) { return severity >= bar.severity; }\n}\n\n/** Where time comes from. Injected, so a test can stamp an event with any instant it likes. */\ninterface Clock { long nowMs(); }\n\n/**\n * The per-thread diagnostic context: request id, user id, tenant. Held in a ThreadLocal and copied into every\n * event at creation, because with an async sink the thread that writes the line is not the thread that made it.\n */\nfinal class Mdc {\n    private static final ThreadLocal<Map<String, String>> CTX = ThreadLocal.withInitial(LinkedHashMap::new);\n\n    private Mdc() {}\n\n    /** Put one key on this thread's context. It rides on every event this thread logs from now on. */\n    static void put(String key, String value) { CTX.get().put(key, value); }\n\n    /** Take one key off this thread's context. */\n    static void remove(String key) { CTX.get().remove(key); }\n\n    /** Empty this thread's context. A pooled thread that forgets this leaks its ids to the next request. */\n    static void clear() { CTX.get().clear(); }\n\n    /** An unmodifiable copy taken at call time. The live map is never handed to another thread. */\n    static Map<String, String> snapshot() {\n        Map<String, String> m = CTX.get();\n        return m.isEmpty() ? Map.of() : Collections.unmodifiableMap(new LinkedHashMap<>(m));\n    }\n}\n\n/**\n * One thing that happened, frozen. Immutable on purpose: an async sink writes it on a different thread, and\n * anything mutable handed to a worker tears under load. The context map is already a snapshot.\n */\nrecord LogEvent(long tsMs, LogLevel level, String loggerName, String threadName,\n                String message, Throwable error, Map<String, String> context) {}\n\n/** Turns one event into the characters a sink will write. Pure CPU, so it always runs outside the sink's lock. */\ninterface LogFormatter {\n    /**\n     * The whole record, with no trailing newline: the sink decides how records end. A record may itself contain\n     * newlines (a stack trace is many of them), and the sink writes the whole string in one call, so it is\n     * still one write under one lock and two threads can never splice their traces together.\n     */\n    String format(LogEvent e);\n\n    /**\n     * The exception, with its causes and its frames, as text. Static, so it is not a second method anybody has\n     * to implement and a layout is still a lambda. This is the expensive part of formatting -- microseconds,\n     * not nanoseconds -- which is exactly why formatting happens outside the sink's lock.\n     */\n    static String stackOf(Throwable t) {\n        StringWriter sw = new StringWriter(512);\n        t.printStackTrace(new PrintWriter(sw));\n        return sw.toString().stripTrailing();\n    }\n}\n\n/**\n * A human-readable record: time, level, thread, logger, message, context on one line, and, when there is an\n * exception, its whole stack on the lines under it -- all in one string, so the sink writes it in one step.\n */\nfinal class TextFormatter implements LogFormatter {\n    /** Immutable and thread-safe, unlike SimpleDateFormat, which corrupts timestamps under exactly the load you need them. */\n    private static final DateTimeFormatter TS = DateTimeFormatter.ofPattern(\"HH:mm:ss.SSS\").withZone(ZoneOffset.UTC);\n\n    /** Builds the whole record. Never touches shared state, so any number of threads may be inside it at once. */\n    public String format(LogEvent e) {\n        StringBuilder sb = new StringBuilder(96);\n        sb.append(TS.format(Instant.ofEpochMilli(e.tsMs()))).append(' ')\n          .append(pad(e.level().name())).append(\" [\").append(e.threadName()).append(\"] \")\n          .append(e.loggerName()).append(\" - \").append(e.message());\n        if (!e.context().isEmpty()) sb.append(' ').append(e.context());\n        // the stack trace goes on its own lines INSIDE the same string, so the sink still writes it as one step\n        if (e.error() != null) sb.append('\\n').append(LogFormatter.stackOf(e.error()));\n        return sb.toString();\n    }\n\n    /** Level names padded to five characters so the columns line up in a terminal. */\n    private static String pad(String s) { return s.length() >= 5 ? s : s + \"     \".substring(s.length()); }\n}\n\n/** The same event as one JSON object, for a shipper that wants fields rather than a sentence. */\nfinal class JsonFormatter implements LogFormatter {\n    /**\n     * One flat object per line. Newline-delimited JSON is what every collector on earth already parses, so the\n     * stack trace becomes a \"stack\" field with its newlines escaped rather than extra physical lines.\n     */\n    public String format(LogEvent e) {\n        StringBuilder sb = new StringBuilder(128);\n        sb.append(\"{\\\"ts\\\":\").append(e.tsMs())\n          .append(\",\\\"level\\\":\\\"\").append(e.level().name())\n          .append(\"\\\",\\\"logger\\\":\\\"\").append(esc(e.loggerName()))\n          .append(\"\\\",\\\"thread\\\":\\\"\").append(esc(e.threadName()))\n          .append(\"\\\",\\\"msg\\\":\\\"\").append(esc(e.message())).append('\"');\n        if (e.error() != null)\n            sb.append(\",\\\"error\\\":\\\"\").append(esc(e.error().toString())).append('\"')\n              .append(\",\\\"stack\\\":\\\"\").append(esc(LogFormatter.stackOf(e.error()))).append('\"');\n        for (Map.Entry<String, String> kv : e.context().entrySet())\n            sb.append(\",\\\"\").append(esc(kv.getKey())).append(\"\\\":\\\"\").append(esc(kv.getValue())).append('\"');\n        return sb.append('}').toString();\n    }\n\n    /** The five escapes JSON needs for the strings a log record actually contains; tabs matter once a stack trace can appear. */\n    static String esc(String s) {\n        if (s == null) return \"\";\n        return s.replace(\"\\\\\", \"\\\\\\\\\").replace(\"\\\"\", \"\\\\\\\"\").replace(\"\\n\", \"\\\\n\").replace(\"\\r\", \"\\\\r\").replace(\"\\t\", \"\\\\t\");\n    }\n}\n\n/** How one filter voted. Three values, because ACCEPT lets an allow-list short-circuit a later deny-list. */\nenum FilterDecision { ACCEPT, DENY, NEUTRAL }\n\n/** A policy that inspects an event and votes on it. Orthogonal to level: a health-check line is valid INFO. */\ninterface LogFilter {\n    /** Force-keep, force-drop, or abstain. The first opinionated vote on the path wins. */\n    FilterDecision decide(LogEvent e);\n}\n\n/** Drops any event whose message contains a phrase. The \"stop logging health checks\" filter. */\nfinal class DenyMessageFilter implements LogFilter {\n    private final String phrase;\n\n    /** @param phrase the substring that makes a line uninteresting */\n    DenyMessageFilter(String phrase) { this.phrase = phrase; }\n\n    /** DENY on a match, NEUTRAL otherwise, so it never forces anything to be kept. */\n    public FilterDecision decide(LogEvent e) {\n        return e.message() != null && e.message().contains(phrase) ? FilterDecision.DENY : FilterDecision.NEUTRAL;\n    }\n}\n\n/** Somewhere an event can go. Four methods, so a console sink is not forced to know about queues or rotation. */\ninterface LogAppender {\n    /** What this sink is called, for metrics and for the framework's own error channel. */\n    String name();\n\n    /** Take one event. Must never throw into the caller: a log line may not fail a payment. */\n    void append(LogEvent e);\n\n    /** Open the handle or spawn the worker. Idempotent: a double-wired config must not create two of anything. */\n    void start();\n\n    /** Flush and release the handle. Everything already accepted must be written first. */\n    void close();\n}\n\n/**\n * The skeleton every real sink repeats: check my own threshold, format outside the lock, take the lock, write\n * one line, never throw. append() is final so no subclass can forget the lock or the never-throw rule; the\n * only hole to fill is write(), which runs with the lock already held.\n */\nabstract class AbstractAppender implements LogAppender {\n    private final String name;\n    private volatile LogFormatter formatter;\n    private volatile LogLevel threshold;\n    /** One lock per sink, guarding the handle. Not static: two files never wait for each other. */\n    protected final ReentrantLock lock = new ReentrantLock();\n    private final AtomicBoolean started = new AtomicBoolean(false);\n\n    /** @param name the sink's id; @param formatter handed in, never built here; @param threshold what this destination can afford */\n    AbstractAppender(String name, LogFormatter formatter, LogLevel threshold) {\n        this.name = name; this.formatter = formatter; this.threshold = threshold;\n    }\n\n    public final String name() { return name; }\n\n    /** The sink's own bar, separate from the logger's level: the file keeps DEBUG, the pager only takes ERROR. */\n    final void setThreshold(LogLevel t) { threshold = t; }\n\n    /** Swap the layout at runtime; text today, JSON tomorrow, and nothing else moves. */\n    final void setFormatter(LogFormatter f) { formatter = f; }\n\n    /** True once start() has run and close() has not. */\n    final boolean isStarted() { return started.get(); }\n\n    /**\n     * The hot path of a sink, in the order that matters: the sink's threshold first (free), then formatting\n     * (pure CPU, outside the lock, so any number of threads run it at once), then the lock around one write.\n     */\n    public final void append(LogEvent e) {\n        if (!started.get()) { Status.error(name + \": event before start()\", null); return; }\n        if (!e.level().atLeast(threshold)) return;\n        String line;\n        try { line = formatter.format(e); }\n        catch (RuntimeException ex) { Status.error(name + \": formatter failed\", ex); return; }\n        lock.lock();\n        try { write(e, line); }\n        catch (Exception ex) { Status.error(name + \": write failed\", ex); }\n        finally { lock.unlock(); }\n    }\n\n    /** Move the characters. Called with the lock held, so it may touch the handle freely. */\n    protected abstract void write(LogEvent e, String line) throws Exception;\n\n    /** Open the handle. Called once, under compare-and-set. */\n    protected void onStart() throws Exception {}\n\n    /** Release the handle. Called once, with the lock held. */\n    protected void onClose() throws Exception {}\n\n    public final void start() {\n        if (!started.compareAndSet(false, true)) return;\n        try { onStart(); } catch (Exception ex) { Status.error(name + \": start failed\", ex); }\n    }\n\n    public final void close() {\n        if (!started.compareAndSet(true, false)) return;\n        lock.lock();\n        try { onClose(); } catch (Exception ex) { Status.error(name + \": close failed\", ex); }\n        finally { lock.unlock(); }\n    }\n}\n\n/** A sink that writes to a stream, normally the terminal. The lock is ours, so lines can never interleave. */\nfinal class ConsoleAppender extends AbstractAppender {\n    private final PrintStream out;\n\n    /** @param out where the characters go; injected so a test can capture them */\n    ConsoleAppender(String name, LogFormatter formatter, LogLevel threshold, PrintStream out) {\n        super(name, formatter, threshold); this.out = out;\n    }\n\n    /** One println under the lock. System.out takes a lock of its own too, which is why a busy console is slow. */\n    protected void write(LogEvent e, String line) { out.println(line); }\n}\n\n/**\n * A sink that writes to a file through a buffer. bytesWritten is incremented only after a write returns\n * without throwing, so the number rotation trusts is never ahead of the disk.\n */\nclass FileAppender extends AbstractAppender {\n    /** The file being written. Subclasses that rotate need it. */\n    protected final Path path;\n    /** The handle. Guarded by the sink's lock; null once closed. */\n    protected BufferedWriter writer;\n    /** Characters written since the file was opened. Guarded by the lock. */\n    protected long bytesWritten;\n    private final LogLevel flushAt;\n\n    /** @param flushAt at and above this level the line is pushed out of the buffer before the call returns */\n    FileAppender(String name, LogFormatter formatter, LogLevel threshold, Path path, LogLevel flushAt) {\n        super(name, formatter, threshold); this.path = path; this.flushAt = flushAt;\n    }\n\n    /** Text formatter, INFO, flush on ERROR: the wiring an application actually uses. */\n    FileAppender(String name, Path path) { this(name, new TextFormatter(), LogLevel.TRACE, path, LogLevel.ERROR); }\n\n    protected void onStart() throws IOException { openWriter(true); }\n\n    protected void onClose() throws IOException { closeWriter(); }\n\n    /** Open the handle and reset the byte count. Called with the lock held (or before the sink is visible). */\n    protected void openWriter(boolean append) throws IOException {\n        writer = Files.newBufferedWriter(path, StandardCharsets.UTF_8,\n            StandardOpenOption.CREATE, append ? StandardOpenOption.APPEND : StandardOpenOption.TRUNCATE_EXISTING);\n        bytesWritten = append && Files.exists(path) ? Files.size(path) : 0;\n    }\n\n    /** Flush and drop the handle. Nulled first, so a racing write finds null and returns instead of throwing. */\n    protected void closeWriter() throws IOException {\n        BufferedWriter w = writer;\n        writer = null;\n        if (w != null) w.close();\n    }\n\n    /**\n     * Everything that happens inside the sink's lock, and nothing else: one write of the whole record (a stack\n     * trace and all), one newline, a flush only at ERROR and above, and then the byte count -- in that order,\n     * because a failed write must not move the counter that rotation trusts.\n     */\n    protected void write(LogEvent e, String line) throws IOException {\n        BufferedWriter w = writer;\n        if (w == null) return;\n        w.write(line);\n        w.newLine();\n        if (e.level().atLeast(flushAt)) w.flush();\n        bytesWritten += line.length() + 1;\n    }\n\n    /** How many characters are in the current file. Read under the lock so it is never half-updated. */\n    long bytesWritten() { lock.lock(); try { return bytesWritten; } finally { lock.unlock(); } }\n}\n\n/**\n * A file sink that starts a new file once the current one passes a size. The check and the swap happen inside\n * write(), which already runs under the sink's lock, so a line is never split across two files.\n */\nfinal class RollingFileAppender extends FileAppender {\n    private final long maxBytes;\n    private int rolls;\n\n    /** @param maxBytes the size at which the next line starts a new file */\n    RollingFileAppender(String name, LogFormatter formatter, LogLevel threshold, Path path, long maxBytes) {\n        super(name, formatter, threshold, path, LogLevel.ERROR); this.maxBytes = maxBytes;\n    }\n\n    /** Roll first if this line would push the file over the limit, then write it normally. */\n    protected void write(LogEvent e, String line) throws IOException {\n        if (bytesWritten > 0 && bytesWritten + line.length() + 1 > maxBytes) roll();\n        super.write(e, line);\n    }\n\n    /** Close the handle, move the file aside under a numbered name, open a fresh one. */\n    private void roll() throws IOException {\n        closeWriter();\n        rolls++;\n        Files.move(path, path.resolveSibling(path.getFileName() + \".\" + rolls), StandardCopyOption.REPLACE_EXISTING);\n        openWriter(false);\n    }\n\n    /** How many times this sink has started a new file. A metric, and what the failure test checks. */\n    int rolls() { lock.lock(); try { return rolls; } finally { lock.unlock(); } }\n}\n\n/** A sink that keeps the lines in memory. The demo and the tests read it instead of a file. */\nfinal class MemoryAppender extends AbstractAppender {\n    private final List<String> lines = new ArrayList<>();\n\n    MemoryAppender(String name, LogFormatter formatter, LogLevel threshold) { super(name, formatter, threshold); }\n\n    /** Text formatter, everything through: the shape a test wants. */\n    MemoryAppender(String name) { this(name, new TextFormatter(), LogLevel.TRACE); }\n\n    /** Called with the lock held, so a plain ArrayList is safe here and nowhere else. */\n    protected void write(LogEvent e, String line) { lines.add(line); }\n\n    /** A snapshot of what has been written, taken under the lock. */\n    List<String> lines() { lock.lock(); try { return List.copyOf(lines); } finally { lock.unlock(); } }\n}\n\n/** A sink that counts events WITHOUT a lock, to show what the lock buys. Never use this for anything real. */\nfinal class UnsafeCountingAppender implements LogAppender {\n    private int count;\n\n    public String name() { return \"unsafe-counter\"; }\n\n    /** A plain read-add-write from many threads. Two threads that read the same value lose one increment. */\n    public void append(LogEvent e) { int c = count; Thread.onSpinWait(); count = c + 1; }\n\n    public void start() {}\n\n    public void close() {}\n\n    /** Whatever survived. */\n    int count() { return count; }\n}\n\n/** The same counter done through the base class, so the increment happens under the sink's lock. */\nfinal class SafeCountingAppender extends AbstractAppender {\n    private long count;\n\n    SafeCountingAppender(String name) { super(name, e -> \"\", LogLevel.TRACE); }\n\n    /** The lock is already held here, so read-add-write is one step. */\n    protected void write(LogEvent e, String line) { count++; }\n\n    /** The exact number of events this sink accepted. */\n    long count() { lock.lock(); try { return count; } finally { lock.unlock(); } }\n}\n\n/** A sink that takes its time, so a queue in front of it visibly fills instead of staying empty. */\nfinal class SlowAppender extends AbstractAppender {\n    private final long millisPerEvent;\n    private final AtomicLong written = new AtomicLong();\n\n    SlowAppender(String name, long millisPerEvent) { super(name, e -> \"\", LogLevel.TRACE); this.millisPerEvent = millisPerEvent; }\n\n    /** Sleeps with the lock held, which is exactly what a slow disk does. */\n    protected void write(LogEvent e, String line) throws InterruptedException {\n        Thread.sleep(millisPerEvent);\n        written.incrementAndGet();\n    }\n\n    /** How many events actually reached the far side. */\n    long written() { return written.get(); }\n}\n\n/** What an async sink does when its queue is full. Named, chosen per sink, and never a framework-wide law. */\nenum OverflowPolicy {\n    /** Give up on the event that arrived and count it. Bounded memory, bounded latency, visible loss. */\n    DROP_NEWEST,\n    /** Throw away the oldest queued event to make room. Keeps the freshest picture of a storm. */\n    DISCARD_OLDEST,\n    /** Make the caller wait. The right answer for an audit sink and the wrong one for checkout. */\n    BLOCK\n}\n\n/**\n * The decorator that takes the write off the caller's thread: it holds any other sink, puts events on a\n * bounded queue and lets one daemon worker drain them. Bounded is the whole point -- unbounded turns a\n * storm into an OutOfMemoryError, and blocking turns a slow disk into slow checkouts.\n */\nfinal class AsyncAppender implements LogAppender {\n    /** The sentinel that ends the worker. It queues BEHIND the backlog, so close() drains in order. */\n    private static final LogEvent PILL = new LogEvent(0, LogLevel.OFF, \"\", \"\", \"\", null, Map.of());\n\n    private final String name;\n    private final LogAppender delegate;\n    private final BlockingQueue<LogEvent> queue;\n    private final OverflowPolicy policy;\n    private final LogLevel neverDrop;\n    private final AtomicLong dropped = new AtomicLong();\n    private final AtomicBoolean started = new AtomicBoolean(false);\n    private volatile boolean accepting;\n    private Thread worker;\n\n    /**\n     * @param delegate the sink that really writes; @param capacity the ceiling on queued events;\n     * @param policy what happens when the queue is full; @param neverDrop at and above this level the caller waits instead\n     */\n    AsyncAppender(String name, LogAppender delegate, int capacity, OverflowPolicy policy, LogLevel neverDrop) {\n        this.name = name; this.delegate = delegate; this.queue = new ArrayBlockingQueue<>(capacity);\n        this.policy = policy; this.neverDrop = neverDrop;\n    }\n\n    /** A 4096-deep queue that drops the newest and never gives up on ERROR: the sane default. */\n    AsyncAppender(String name, LogAppender delegate) { this(name, delegate, 4096, OverflowPolicy.DROP_NEWEST, LogLevel.ERROR); }\n\n    public String name() { return name; }\n\n    /**\n     * The caller's whole cost: one enqueue. If the queue is full the named policy decides, and the loss is\n     * counted rather than hidden. Nothing here can throw into the application.\n     */\n    public void append(LogEvent e) {\n        if (!accepting) { dropped.incrementAndGet(); return; }\n        if (queue.offer(e)) return;\n        try {\n            if (e.level().atLeast(neverDrop) || policy == OverflowPolicy.BLOCK) {\n                if (!queue.offer(e, 2, TimeUnit.SECONDS)) dropped.incrementAndGet();\n            } else if (policy == OverflowPolicy.DISCARD_OLDEST) {\n                if (queue.poll() != null) dropped.incrementAndGet();\n                if (!queue.offer(e)) dropped.incrementAndGet();\n            } else {\n                dropped.incrementAndGet();\n            }\n        } catch (InterruptedException ie) {\n            Thread.currentThread().interrupt();\n            dropped.incrementAndGet();\n        }\n    }\n\n    /** Spawn exactly one worker. compareAndSet is why a double-wired config cannot start two of them. */\n    public void start() {\n        if (!started.compareAndSet(false, true)) return;\n        delegate.start();\n        accepting = true;\n        worker = new Thread(this::drain, \"log-\" + name);\n        worker.setDaemon(true);\n        worker.start();\n    }\n\n    /**\n     * Stop accepting, queue the pill behind whatever is already waiting, and give the worker two seconds to\n     * finish. The honest gap: a thread already past the accepting check can still lose its event; closing that\n     * needs a lock on every append, which is right for an audit sink and wrong for this one.\n     */\n    public void close() {\n        if (!started.compareAndSet(true, false)) return;\n        accepting = false;\n        try { queue.offer(PILL, 2, TimeUnit.SECONDS); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n        try { worker.join(2000); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n        delegate.close();\n    }\n\n    /** Events given up on: queue full, or offered after close. Exported, because invisible loss is a lie. */\n    long droppedCount() { return dropped.get(); }\n\n    /** How full the queue is right now. A metric worth a dashboard. */\n    int queueDepth() { return queue.size(); }\n\n    /**\n     * The worker: take one, sweep up whatever else is waiting, hand the batch to the delegate. Batching turns\n     * sixty-four lock acquisitions into one without changing a line of the sink underneath.\n     */\n    private void drain() {\n        List<LogEvent> batch = new ArrayList<>(64);\n        while (true) {\n            try {\n                LogEvent first = queue.take();\n                if (first == PILL) return;\n                batch.add(first);\n                queue.drainTo(batch, 63);\n                boolean pill = false;\n                for (LogEvent e : batch) {\n                    if (e == PILL) { pill = true; break; }\n                    try { delegate.append(e); } catch (RuntimeException re) { Status.error(name + \": delegate threw\", re); }\n                }\n                batch.clear();\n                if (pill) return;\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt();\n                return;\n            }\n        }\n    }\n}\n\n/**\n * The framework's own error channel. A logger that reports its failures through itself is a loop, so these\n * go straight to stderr and are counted.\n */\nfinal class Status {\n    private static final AtomicLong errors = new AtomicLong();\n    private static volatile PrintStream sink = System.err;\n\n    private Status() {}\n\n    /** Report a framework failure. Called from inside catch blocks that must not rethrow. */\n    static void error(String what, Throwable t) {\n        errors.incrementAndGet();\n        sink.println(\"[logger] \" + what + (t == null ? \"\" : \": \" + t));\n    }\n\n    /** How many framework failures have been reported. A metric, and what a test asserts on. */\n    static long errorCount() { return errors.get(); }\n\n    /** Point the channel somewhere else, so a test can stay quiet. */\n    static void sink(PrintStream s) { sink = s; }\n\n    /** Zero the counter between tests. */\n    static void reset() { errors.set(0); }\n}\n\n/**\n * One node in the tree, named after a package or a class. It holds its own level (null means \"ask my parent\"),\n * whether it also uses its ancestors' sinks, its own sinks and its own filters. Everything hot here is a\n * volatile field or a copy-on-write list, so a log call never takes a lock of the framework's own.\n */\nfinal class Logger {\n    private final String name;\n    private final Logger parent;\n    private final LoggerContext ctx;\n    /** null means inherit. Volatile because one thread writes it at 2am and millions read it. */\n    private volatile LogLevel level;\n    /** When false, events stop here instead of also going to the ancestors' sinks. */\n    private volatile boolean additive = true;\n    private final CopyOnWriteArrayList<LogAppender> appenders = new CopyOnWriteArrayList<>();\n    private final CopyOnWriteArrayList<LogFilter> filters = new CopyOnWriteArrayList<>();\n\n    /** Built only by the context, so the parent is resolved before anybody can see this node. */\n    Logger(String name, Logger parent, LoggerContext ctx) { this.name = name; this.parent = parent; this.ctx = ctx; }\n\n    /** The dotted name this logger was asked for. */\n    String name() { return name; }\n\n    /** The node above this one, or null for ROOT. */\n    Logger parent() { return parent; }\n\n    /** This node's own level, or null when it inherits. */\n    LogLevel level() { return level; }\n\n    /** Set or clear this node's own level. Takes effect on the very next call: no restart, no lock. */\n    void setLevel(LogLevel l) { level = l; }\n\n    /** Turn the walk to the ancestors' sinks on or off for this subtree. */\n    void setAdditive(boolean a) { additive = a; }\n\n    /** Whether events from here also reach the ancestors' sinks. */\n    boolean additive() { return additive; }\n\n    /** Hand this node a sink and start it. The logger never builds one. */\n    void addAppender(LogAppender a) { a.start(); appenders.addIfAbsent(a); }\n\n    /** Take a sink off this node. It is not closed: somebody else may still be using it. */\n    void removeAppender(LogAppender a) { appenders.remove(a); }\n\n    /** This node's own sinks, as a snapshot. */\n    List<LogAppender> appenders() { return List.copyOf(appenders); }\n\n    /** Hand this node a policy that votes on events. */\n    void addFilter(LogFilter f) { filters.add(f); }\n\n    /** The first level anybody on the path up to ROOT has an opinion about. ROOT always has one, so this ends. */\n    LogLevel effectiveLevel() {\n        for (Logger l = this; l != null; l = l.parent) {\n            LogLevel own = l.level;\n            if (own != null) return own;\n        }\n        return LogLevel.INFO;\n    }\n\n    /** The gate. Three to five volatile reads and a compare, with nothing allocated. */\n    boolean isEnabled(LogLevel lv) { return lv.atLeast(effectiveLevel()); }\n\n    /** TRACE with a plain message. */\n    void trace(String m) { log(LogLevel.TRACE, m, null); }\n\n    /** DEBUG with a plain message. */\n    void debug(String m) { log(LogLevel.DEBUG, m, null); }\n\n    /** INFO with a plain message. */\n    void info(String m) { log(LogLevel.INFO, m, null); }\n\n    /** WARN with a plain message. */\n    void warn(String m) { log(LogLevel.WARN, m, null); }\n\n    /** ERROR with a plain message. */\n    void error(String m) { log(LogLevel.ERROR, m, null); }\n\n    /** ERROR with the exception that caused it. */\n    void error(String m, Throwable t) { log(LogLevel.ERROR, m, t); }\n\n    /** FATAL with a plain message. */\n    void fatal(String m) { log(LogLevel.FATAL, m, null); }\n\n    /** DEBUG whose message is only built if DEBUG is on. The cure for \"cart=\" + cart in a hot loop. */\n    void debug(Supplier<String> m) { log(LogLevel.DEBUG, m, null); }\n\n    /** INFO whose message is only built if INFO is on. */\n    void info(Supplier<String> m) ex) { Status.error(\"filter threw\", ex); continue; }\n            if (d != null && d != FilterDecision.NEUTRAL) return d;\n        }\n        return FilterDecision.NEUTRAL;\n    }\n}\n\n/**\n * The registry, and the only thing that builds a Logger. One name means one object forever, so a level change\n * reaches every static field that asked for that name. It also owns the clock and the shutdown.\n */\nfinal class LoggerContext {\n    /** The name of the node at the top of the tree; it always has a level, which is what ends every walk. */\n    static final String ROOT_NAME = \"ROOT\";\n\n    private final ConcurrentHashMap<String, Logger> registry = new ConcurrentHashMap<>();\n    private final Logger root;\n    private volatile Clock clock = System::currentTimeMillis;\n\n    /** A fresh tree with ROOT at INFO and no sinks. A test builds one per case; an application builds one. */\n    LoggerContext() {\n        root = new Logger(ROOT_NAME, null, this);\n        root.setLevel(LogLevel.INFO);\n        registry.put(ROOT_NAME, root);\n    }\n\n    /** The node at the top. Everything inherits from it. */\n    Logger root() { return root; }\n\n    /** Where every timestamp comes from. */\n    Clock clock() { return clock; }\n\n    /** Hand the tree a clock. A test sets an instant and moves it. */\n    void setClock(Clock c) { clock = c; }\n\n    /**\n     * One object per name, forever. The parent is resolved BEFORE the put, which is both why a logger is never\n     * half-built and why this does not deadlock: no recursive computeIfAbsent on the same map.\n     */\n    Logger getLogger(String name) {\n        if (name == null || name.isEmpty() || ROOT_NAME.equals(name)) return root;\n        Logger existing = registry.get(name);\n        if (existing != null) return existing;\n        int dot = name.lastIndexOf('.');\n        Logger parent = dot < 0 ? root : getLogger(name.substring(0, dot));\n        return registry.computeIfAbsent(name, n -> new Logger(n, parent, this   /** Runs under the sink's lock, so the check, the swap and the write are one step. */\n    protected void write(LogEvent e, String line) throws IOException {\n        long now = clock.nowMs() / periodMs;\n        if (now != bucket && bytesWritten > 0) {\n            closeWriter();\n            rolls++;\n            Files.move(path, path.resolveSibling(path.getFileName() + \".\" + STAMP.format(Instant.ofEpochMilli(bucket * periodMs))),\n                StandardCopyOption.REPLACE_EXISTING);\n            openWriter(false);\n        }\n        bucket = now;\n        super.write(e, line);\n    }\n\n    /** How many times a new period started a new file. */\n    int rolls() { lock.lock(); try { return rolls; } finally { lock.unlock(); } }\n}\n\n// ---- ext: one file per tenant -- a sink that picks a sink, created lazily and capped\n/**\n * Reads a key off the event's context and forwards to the delegate for that key, building one lazily the\n * first time a tenant appears. The cap matters: keys that come from request data are user input, and an\n * uncapped map of sinks is a file-handle leak with a pretty name.\n */\nfinal class RoutingAppender implements LogAppender {\n    private final String name;\n    private final String contextKey;\n    private final java.util.function.Function<String, LogAppender> factory;\n    private final int maxRoutes;\n    private final ConcurrentHashMap<String, LogAppender> routes = new ConcurrentHashMap<>();\n    private final AtomicLong unrouted = new AtomicLong();\n    private volatile boolean started;\n\n    /** @param contextKey which MDC key decides the destination; @param factory how to build a sink for one key */\n    RoutingAppender(String name, String contextKey, java.util.function.Function<String, LogAppender> factory, int maxRoutes) {\n        this.name = name; this.contextKey = contextKey; this.factory = factory; this.maxRoutes = maxRoutes;\n    }\n\n    public String name() { return name; }\n\n    /** No key, or the cap reached, means the event is counted and dropped rather than opening file 100,001. */\n    public void append(LogEvent e) {\n        String key = e.context().get(contextKey);\n        if (key == null) { unrouted.incrementAndGet(); return; }\n        LogAppender target = routes.get(key);\n        if (target == null) {\n            if (routes.size() >= maxRoutes) { unrouted.incrementAndGet(); return; }\n            target = routes.computeIfAbsent(key, k -> { LogAppender a = factory.apply(k); a.start(); return a; });\n        }\n        target.append(e);\n    }\n\n    public void start() { started = true; }\n\n    /** Closes every sink it built. Nothing else knows those sinks exist. */\n    public void close() {\n        started = false;\n        for (LogAppender a : routes.values()) { try { a.close(); } catch (RuntimeException ex) { Status.error(name + \": close\", ex); } }\n    }\n\n    /** How many tenants have a file. */\n    int routeCount() { return routes.size(); }\n\n    /** Events with no key, or beyond the cap. */\n    long unroutedCount() { return unrouted.get(); }\n}\n\n// ---- ext: mask before anything hits disk -- a formatter that wraps a formatter\n/**\n * The Decorator again, one level down: it takes any layout, lets it build the line, then redacts the line.\n * Because it is a formatter it runs outside the sink's lock, once, and every sink downstream inherits it.\n */\nfinal class MaskingFormatter implements LogFormatter {\n    private static final Pattern CARD = Pattern.compile(\"\\\\b\\\\d(?:[ -]?\\\\d){12,18}\\\\b\");\n    private static final Pattern EMAIL = Pattern.compile(\"\\\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\\\.[A-Za-z]{2,}\\\\b\");\n\n    private final LogFormatter inner;\n\n    /** @param inner the layout being wrapped: text, JSON, or another masker */\n    MaskingFormatter(LogFormatter inner) { this.inner = inner; }\n\n    /** Card numbers keep their last four; e-mail addresses keep their domain. */\n    public String format(LogEvent e) {\n        String line = inner.format(e);\n        Matcher m = CARD.matcher(line);\n        StringBuilder sb = new StringBuilder(line.length());\n        while (m.find()) {\n            String digits = m.group().replaceAll(\"\\\\D\", \"\");\n            String rep = luhn(digits) ? \"****-****-****-\" + digits.substring(digits.length() - 4) : m.group();\n            m.appendReplacement(sb, Matcher.quoteReplacement(rep));\n        }\n        m.appendTail(sb);\n        return EMAIL.matcher(sb.toString()).replaceAll(x -> \"***@\" + x.group().substring(x.group().indexOf('@') + 1));\n    }\n\n    /** The checksum every card number satisfies. It is what keeps a long id or a timestamp from being redacted. */\n    static boolean luhn(String digits) {\n        int sum = 0;\n        boolean alt = false;\n        for (int i = digits.length() - 1; i >= 0; i--) {\n            int d = digits.charAt(i) - '0';\n            if (alt) { d *= 2; if (d > 9) d -= 9; }\n            sum += d;\n            alt = !alt;\n        }\n        return sum % 10 == 0;\n    }\n}\n\n// ---- ext: log less -- sampling, and a cap on one repeated line, both behind the filter seam\n/**\n * Keeps one DEBUG event in N and leaves everything at or above the bar alone. Adding it to a subtree turns\n * that subtree's volume down without touching a logger, a sink or a formatter.\n */\nfinal class SamplingFilter implements LogFilter {\n    private final int keepOneIn;\n    private final LogLevel untouchedFrom;\n    private final AtomicLong seen = new AtomicLong();\n\n    /** @param keepOneIn 100 keeps one per cent; @param untouchedFrom at and above this level nothing is sampled */\n    SamplingFilter(int keepOneIn, LogLevel untouchedFrom) { this.keepOneIn = keepOneIn; this.untouchedFrom = untouchedFrom; }\n\n    /** NEUTRAL means \"no opinion, carry on\": the event survives unless something else denies it. */\n    public FilterDecision decide(LogEvent e) {\n        if (e.level().atLeast(untouchedFrom)) return FilterDecision

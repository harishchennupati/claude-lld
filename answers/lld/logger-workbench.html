\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lock per sink around the whole record; tests 1 and 9: 1,000 lines, then 800 intact traces</text></g><g transform=\"translate(30 60)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">log.debug(\"cart=\" + cart) with DEBUG off</text></g><path d=\"M370 79 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 60)\"><rect width=\"780\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the gate first, plus a Supplier form; test 2: 1,000 disabled calls, the supplier ran 0 times</text></g><g transform=\"translate(30 102)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a storm fills memory and the JVM dies</text></g><path d=\"M370 121 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 102)\"><rect width=\"780\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a fixed queue that drops and counts; test 5: written + dropped = offered, peak depth 16 of 16</text></g><g transform=\"translate(30 144)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the disk is full, or the collector is down</text></g><path d=\"M370 163 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 144)\"><rect width=\"780\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">caught in the sink and reported on stderr; tests 6 and 12: a broken sink, filter and collector</text></g><g transform=\"translate(30 186)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Ctrl-C and the async tail is gone</text></g><path d=\"M370 205 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"780\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a poison pill behind the backlog, join(2s); test 8: 300 accepted, 300 written</text></g><g transform=\"translate(30 228)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a pooled thread leaks the last request's id</text></g><path d=\"M370 247 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 228)\"><rect width=\"780\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the context is COPIED into the event; tests 8 and 13: every line still says rid=req-A</text></g><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a test, the twists on page 05 included: FailureTests.java runs fifty-eight of them and must print ALL PASS</text></svg></div><div class=\"move\"><p>Two threads writing half a record each into one file (one lock per sink, and two tests: fifty threads write a thousand lines and every one comes back whole and in its own thread's order, then eight threads throw a hundred exceptions each and all eight hundred stack traces come back unspliced). A message built for a level that is switched off (the gate first, plus a <code>Supplier</code> form, and a test that makes a thousand disabled calls and asserts the supplier ran zero times). A storm that fills memory (a fixed queue, and a test that asserts written plus dropped equals offered and that the depth peaked at sixteen of sixteen). A full disk or a dead collector (caught inside the sink and reported on stderr, and a test with a broken sink, a broken filter, a broken formatter, a broken supplier and a collector that never comes back, all of which cost only their own record). Ctrl-C during a deploy (a poison pill behind the backlog, and a test that accepts three hundred lines and finds three hundred written). A pooled thread carrying the last request's id (the context copied into the event, and a test that changes the thread's context after the call and finds the old value on the line). Fifty-eight checks &mdash; the twists on page 05 have their own, because an untested twist is a claim &mdash; and they all run in about a second.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 350\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"850\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface LogFormatter { String format(LogEvent e); }</text><text x=\"850\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a JSON layout is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">new AsyncAppender(\"async\", fileSink, 8192, BLOCK, ERROR)</text><text x=\"850\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">any sink goes off-thread untouched</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Template Method</text><text x=\"220\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">AbstractAppender.append is FINAL; only write() is open</text><text x=\"850\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">no sink can skip the lock or throw</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">logger.addAppender(a) -- the sinks ARE the listeners</text><text x=\"850\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">the logger never knows what a file is</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Chain of Responsibility</text><text x=\"220\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">the filter chain: the first opinionated vote wins</text><text x=\"850\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">\"log less\" never touches the Logger</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"220\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">NEW &rarr; STARTED &rarr; CLOSED, by compareAndSet</text><text x=\"850\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">a double-wired config starts one worker</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">Factory</text><text x=\"220\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">ctx.getLogger(name): one object per name, forever</text><text x=\"850\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">a level change reaches every static field</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"220\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">the context is handed to its callers; no getInstance()</text><text x=\"850\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh LoggerContext</text><rect x=\"20\" y=\"290\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"220\" y=\"309.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">a sink has four constructor arguments and all are required</text><text x=\"850\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">it earns a place when a config file arrives</text><text x=\"615\" y=\"335\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence. Factory is the one that DID earn it here: identity is the requirement.</text></svg></div><div class=\"move\"><p>Read the second column first: every name in that table is the <i>output</i> of a move, which is why each has a one-sentence defence and why none of them was decided before the code existed. The load-bearing one is Decorator, because it is what made two hard requirements cheap: <code>AsyncAppender</code> holds any sink and takes it off the caller's thread, <code>MaskingFormatter</code> holds any layout and redacts what it produced, and neither of the things being wrapped was edited. The one that matters second is Template Method, because it is enforcement rather than style: <code>AbstractAppender.append</code> is <code>final</code>, so a sink author physically cannot forget the lock or leak an exception, and the only hole left is <code>write()</code>, which runs with the lock already held. The two that earned nothing are on the table too, greyed out, with the reason; say those out loud as well, because refusing a pattern is worth as much as naming one.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">an event carries facts, a formatter makes characters, a sink moves them, the Logger routes</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">RateLimitFilter arrived mid-round: Logger, every sink and every formatter were untouched</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">addAppender(a): console, file, rolling, async, routing; append() is final, so none can lie</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each where possible</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">LogFormatter, LogFilter, Clock: one method each; queueDepth() is on AsyncAppender only</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">ctx.configure(INFO, List.of(console), List.of(filter));  ctx.setClock(() -&gt; t)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>The table is the answer; this is only what it could not fit. O is true here as a fact rather than an intention: <code>RateLimitFilter</code> was written after everything else and cost one class and one wiring line &mdash; no appender, no formatter and not one line of <code>Logger</code> moved. L is true because <code>append()</code> is <code>final</code>: a subclass physically cannot skip the lock or leak an exception, so \"any implementation drops in\" is enforced, not hoped for. I survives even the stack trace, because the renderer is a <i>static</i> helper on <code>LogFormatter</code> rather than a second method every layout would have to implement, so a formatter is still a lambda. And D pays off in the tests more than in the design: nothing news up a collaborator, so a test can hand the tree a clock that says last Tuesday and assert the exact timestamp on the line.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">sample, rate-limit, mask, redact</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind LogFilter or LogFormatter, plus one wiring line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a collector, a pager, a metric</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more appender on the node; the Logger does not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">PAUSED while a disk recovers</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more appender state and one more checked transition</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across items</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">roll the file at 100 MB</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the check, the handle swap and the write inside the SAME lock</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the level tree; shipping off the box</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the levels behind a LevelStore; the shipper clears its buffer only</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">after the send returned, and the batch id makes a retry harmless</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the Logger, the event and the tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>Two of the five rows need a sentence the picture cannot hold. \"A new invariant across items\" is rotation, and the whole trick is that the size check, the handle swap and the write happen inside the <i>same</i> lock &mdash; that is why a record is never split across two files. \"State that must outlive the process\" is really two questions: the log file already <i>is</i> the persistence for events, so what is left is the level tree behind a <code>LevelStore</code> repository and the shipping sink, which clears its buffer only after the send returned and stamps each batch with an id so a repeat is applied once at the far side. For all five the Logger, the event and the tests do not change; that is the test that the derivation was right, and page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 875\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M137 712 H622\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M137 740 L137 712\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M377 740 L377 712\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M622 740 L622 712\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M462 712L462.5 650\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M760 777.0L735 785.0\" fill ne)\" stroke-width=\"1.2\"/><text x=\"112.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FileAppender</text><line x1=\"0\" y1=\"26\" x2=\"225\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">writer: BufferedWriter</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">bytesWritten: long</text><line x1=\"0\" y1=\"64\" x2=\"225\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">count AFTER the write</text></g><g transform=\"translate(760 740)\"><rect width=\"260\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RollingFileAppender</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">maxBytes: long</text><line x1=\"0\" y1=\"48\" x2=\"260\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">roll inside the same lock</text></g><g><path d=\"M20 855L64 855\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"859\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 855L284 855\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"859\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 855L504 855\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"859\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 855L684 855\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"859\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 855L904 855\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"859\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (italic = abstract, dashed border = interface, &laquo;enum&raquo; = a fixed list of values, &laquo;record&raquo; = frozen fields). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = extends or implements: four concrete sinks fill one skeleton, and <code>AsyncAppender</code> implements the interface directly because it formats nothing and owns no handle, which is what lets it wrap any of the others. Filled diamond = owns: the context owns one logger per name. Plain arrow = references. Dashed green = handed in, never built here. <b>Where state lives:</b> a logger has the level, the parent pointer, its own sinks and its own filters &mdash; and nothing else; an appender has the handle, the lock, and for the async one the queue, the worker and the dropped counter; an event has frozen facts including a <i>copy</i> of the thread's context, which is what makes it safe to hand to a worker thread. Notice what is <i>not</i> here: no Level class per level, because the only thing anybody does with a level is compare it; and no buffer inside the Logger, because the thing that queues is a sink, so it can be switched on for one destination and not another.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (fifty-eight checks, including one per twist; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.io.*;\nimport java.nio.charset.StandardCharsets;\nimport java.nio.file.*;\nimport java.time.Instant;\nimport java.time.ZoneOffset;\nimport java.time.format.DateTimeFormatter;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.ReentrantLock;\nimport java.util.function.Supplier;\n\n/**\n * Severity, as an ordered ladder. The number is the whole gate: a switched-off call is one volatile read and\n * one integer compare, with no event allocated and no string built. OFF is the sentinel nothing can reach.\n */\nenum LogLevel {\n    TRACE(10), DEBUG(20), INFO(30), WARN(40), ERROR(50), FATAL(60), OFF(Integer.MAX_VALUE);\n\n    /** How loud this level is. Compared, never switched on. */\n    final int severity;\n\n    LogLevel(int severity) { this.severity = severity; }\n\n    /** True when this level is at least as loud as the bar it is being measured against. */\n    boolean atLeast(LogLevel bar) { return severity &gt;= bar.severity; }\n}\n\n/** Where time comes from. Injected, so a test can stamp an event with any instant it likes. */\ninterface Clock { long nowMs(); }\n\n/**\n * The per-thread diagnostic context: request id, user id, tenant. Held in a ThreadLocal and copied into every\n * event at creation, because with an async sink the thread that writes the line is not the thread that made it.\n */\nfinal class Mdc {\n    private static final ThreadLocal&lt;Map&lt;String, String&gt;&gt; CTX = ThreadLocal.withInitial(LinkedHashMap::new);\n\n    private Mdc() {}\n\n    /** Put one key on this thread&#x27;s context. It rides on every event this thread logs from now on. */\n    static void put(String key, String value) { CTX.get().put(key, value); }\n\n    /** Take one key off this thread&#x27;s context. */\n    static void remove(String key) { CTX.get().remove(key); }\n\n    /** Empty this thread&#x27;s context. A pooled thread that forgets this leaks its ids to the next request. */\n    static void clear() { CTX.get().clear(); }\n\n    /** An unmodifiable copy taken at call time. The live map is never handed to another thread. */\n    static Map&lt;String, String&gt; snapshot() {\n        Map&lt;String, String&gt; m = CTX.get();\n        return m.isEmpty() ? Map.of() : Collections.unmodifiableMap(new LinkedHashMap&lt;&gt;(m));\n    }\n}\n\n/**\n * One thing that happened, frozen. Immutable on purpose: an async sink writes it on a different thread, and\n * anything mutable handed to a worker tears under load. The context map is already a snapshot.\n */\nrecord LogEvent(long tsMs, LogLevel level, String loggerName, String threadName,\n                String message, Throwable error, Map&lt;String, String&gt; context) {}\n\n/** Turns one event into the characters a sink will write. Pure CPU, so it always runs outside the sink&#x27;s lock. */\ninterface LogFormatter {\n    /**\n     * The whole record, with no trailing newline: the sink decides how records end. A record may itself contain\n     * newlines (a stack trace is many of them), and the sink writes the whole string in one call, so it is\n     * still one write under one lock and two threads can never splice their traces together.\n     */\n    String format(LogEvent e);\n\n    /**\n     * The exception, with its causes and its frames, as text. Static, so it is not a second method anybody has\n     * to implement and a layout is still a lambda. This is the expensive part of formatting -- microseconds,\n     * not nanoseconds -- which is exactly why formatting happens outside the sink&#x27;s lock.\n     */\n    static String stackOf(Throwable t) {\n        StringWriter sw = new StringWriter(512);\n        t.printStackTrace(new PrintWriter(sw));\n        return sw.toString().stripTrailing();\n    }\n}\n\n/**\n * A human-readable record: time, level, thread, logger, message, context on one line, and, when there is an\n * exception, its whole stack on the lines under it -- all in one string, so the sink writes it in one step.\n */\nfinal class TextFormatter implements LogFormatter {\n    /** Immutable and thread-safe, unlike SimpleDateFormat, which corrupts timestamps under exactly the load you need them. */\n    private static final DateTimeFormatter TS = DateTimeFormatter.ofPattern(&quot;HH:mm:ss.SSS&quot;).withZone(ZoneOffset.UTC);\n\n    /** Builds the whole record. Never touches shared state, so any number of threads may be inside it at once. */\n    public String format(LogEvent e) {\n        StringBuilder sb = new StringBuilder(96);\n        sb.append(TS.format(Instant.ofEpochMilli(e.tsMs()))).append(&#x27; &#x27;)\n          .append(pad(e.level().name())).append(&quot; [&quot;).append(e.threadName()).append(&quot;] &quot;)\n          .append(e.loggerName()).append(&quot; - &quot;).append(e.message());\n        if (!e.context().isEmpty()) sb.append(&#x27; &#x27;).append(e.context());\n        // the stack trace goes on its own lines INSIDE the same string, so the sink still writes it as one step\n        if (e.error() != null) sb.append(&#x27;\\n&#x27;).append(LogFormatter.stackOf(e.error()));\n        return sb.toString();\n    }\n\n    /** Level names padded to five characters so the columns line up in a terminal. */\n    private static String pad(String s) { return s.length() &gt;= 5 ? s : s + &quot;     &quot;.substring(s.length()); }\n}\n\n/** The same event as one JSON object, for a shipper that wants fields rather than a sentence. */\nfinal class JsonFormatter implements LogFormatter {\n    /**\n     * One flat object per line. Newline-delimited JSON is what every collector on earth already parses, so the\n     * stack trace becomes a &quot;stack&quot; field with its newlines escaped rather than extra physical lines.\n     */\n    public String format(LogEvent e) {\n        StringBuilder sb = new StringBuilder(128);\n        sb.append(&quot;{\\&quot;ts\\&quot;:&quot;).append(e.tsMs())\n          .append(&quot;,\\&quot;level\\&quot;:\\&quot;&quot;).append(e.level().name())\n          .append(&quot;\\&quot;,\\&quot;logger\\&quot;:\\&quot;&quot;).append(esc(e.loggerName()))\n          .append(&quot;\\&quot;,\\&quot;thread\\&quot;:\\&quot;&quot;).append(esc(e.threadName()))\n          .append(&quot;\\&quot;,\\&quot;msg\\&quot;:\\&quot;&quot;).append(esc(e.message())).append(&#x27;&quot;&#x27;);\n        if (e.error() != null)\n            sb.append(&quot;,\\&quot;error\\&quot;:\\&quot;&quot;).append(esc(e.error().toString())).append(&#x27;&quot;&#x27;)\n              .append(&quot;,\\&quot;stack\\&quot;:\\&quot;&quot;).append(esc(LogFormatter.stackOf(e.error()))).append(&#x27;&quot;&#x27;);\n        for (Map.Entry&lt;String, String&gt; kv : e.context().entrySet())\n            sb.append(&quot;,\\&quot;&quot;).append(esc(kv.getKey())).append(&quot;\\&quot;:\\&quot;&quot;).append(esc(kv.getValue())).append(&#x27;&quot;&#x27;);\n        return sb.append(&#x27;}&#x27;).toString();\n    }\n\n    /** The five escapes JSON needs for the strings a log record actually contains; tabs matter once a stack trace can appear. */\n    static String esc(String s) {\n        if (s == null) return &quot;&quot;;\n        return s.replace(&quot;\\\\&quot;, &quot;\\\\\\\\&quot;).replace(&quot;\\&quot;&quot;, &quot;\\\\\\&quot;&quot;).replace(&quot;\\n&quot;, &quot;\\\\n&quot;).replace(&quot;\\r&quot;, &quot;\\\\r&quot;).replace(&quot;\\t&quot;, &quot;\\\\t&quot;);\n    }\n}\n\n/** How one filter voted. Three values, because ACCEPT lets an allow-list short-circuit a later deny-list. */\nenum FilterDecision { ACCEPT, DENY, NEUTRAL }\n\n/** A policy that inspects an event and votes on it. Orthogonal to level: a health-check line is valid INFO. */\ninterface LogFilter {\n    /** Force-keep, force-drop, or abstain. The first opinionated vote on the path wins. */\n    FilterDecision decide(LogEvent e);\n}\n\n/** Drops any event whose message contains a phrase. The &quot;stop logging health checks&quot; filter. */\nfinal class DenyMessageFilter implements LogFilter {\n    private final String phrase;\n\n    /** @param phrase the substring that makes a line uninteresting */\n    DenyMessageFilter(String phrase) { this.phrase = phrase; }\n\n    /** DENY on a match, NEUTRAL otherwise, so it never forces anything to be kept. */\n    public FilterDecision decide(LogEvent e) {\n        return e.message() != null &amp;&amp; e.message().contains(phrase) ? FilterDecision.DENY : FilterDecision.NEUTRAL;\n    }\n}\n\n/** Somewhere an event can go. Four methods, so a console sink is not forced to know about queues or rotation. */\ninterface LogAppender {\n    /** What this sink is called, for metrics and for the framework&#x27;s own error channel. */\n    String name();\n\n    /** Take one event. Must never throw into the caller: a log line may not fail a payment. */\n    void append(LogEvent e);\n\n    /** Open the handle or spawn the worker. Idempotent: a double-wired config must not create two of anything. */\n    void start();\n\n    /** Flush and release the handle. Everything already accepted must be written first. */\n    void close();\n}\n\n/**\n * The skeleton every real sink repeats: check my own threshold, format outside the lock, take the lock, write\n * one line, never throw. append() is final so no subclass can forget the lock or the never-throw rule; the\n * only hole to fill is write(), which runs with the lock already held.\n */\nabstract class AbstractAppender implements LogAppender {\n    private final String name;\n    private volatile LogFormatter formatter;\n    private volatile LogLevel threshold;\n    /** One lock per sink, guarding the handle. Not static: two files never wait for each other. */\n    protected final ReentrantLock lock = new ReentrantLock();\n    private final AtomicBoolean started = new AtomicBoolean(false);\n\n    /** @param name the sink&#x27;s id; @param formatter handed in, never built here; @param threshold what this destination can afford */\n    AbstractAppender(String name, LogFormatter formatter, LogLevel threshold) {\n        this.name = name; this.formatter = formatter; this.threshold = threshold;\n    }\n\n    public final String name() { return name; }\n\n    /** The sink&#x27;s own bar, separate from the logger&#x27;s level: the file keeps DEBUG, the pager only takes ERROR. */\n    final void setThreshold(LogLevel t) { threshold = t; }\n\n    /** Swap the layout at runtime; text today, JSON tomorrow, and nothing else moves. */\n    final void setFormatter(LogFormatter f) { formatter = f; }\n\n    /** True once start() has run and close() has not. */\n    final boolean isStarted() { return started.get(); }\n\n    /**\n     * The hot path of a sink, in the order that matters: the sink&#x27;s threshold first (free), then formatting\n     * (pure CPU, outside the lock, so any number of threads run it at once), then the lock around one write.\n     */\n    public final void append(LogEvent e) {\n        if (!started.get()) { Status.error(name + &quot;: event before start()&quot;, null); return; }\n        if (!e.level().atLeast(threshold)) return;\n        String line;\n        try { line = formatter.format(e); }\n        catch (RuntimeException ex) { Status.error(name + &quot;: formatter failed&quot;, ex); return; }\n        lock.lock();\n        try { write(e, line); }\n        catch (Exception ex) { Status.error(name + &quot;: write failed&quot;, ex); }\n        finally { lock.unlock(); }\n    }\n\n    /** Move the characters. Called with the lock held, so it may touch the handle freely. */\n    protected abstract void write(LogEvent e, String line) throws Exception;\n\n    /** Open the handle. Called once, under compare-and-set. */\n    protected void onStart() throws Exception {}\n\n    /** Release the handle. Called once, with the lock held. */\n    protected void onClose() throws Exception {}\n\n    public final void start() {\n        if (!started.compareAndSet(false, true)) return;\n        try { onStart(); } catch (Exception ex) { Status.error(name + &quot;: start failed&quot;, ex); }\n    }\n\n    public final void close() {\n        if (!started.compareAndSet(true, false)) return;\n        lock.lock();\n        try { onClose(); } catch (Exception ex) { Status.error(name + &quot;: close failed&quot;, ex); }\n        finally { lock.unlock(); }\n    }\n}\n\n/** A sink that writes to a stream, normally the terminal. The lock is ours, so lines can never interleave. */\nfinal class ConsoleAppender extends AbstractAppender {\n    private final PrintStream out;\n\n    /** @param out where the characters go; injected so a test can capture them */\n    ConsoleAppender(String name, LogFormatter formatter, LogLevel threshold, PrintStream out) {\n        super(name, formatter, threshold); this.out = out;\n    }\n\n    /** One println under the lock. System.out takes a lock of its own too, which is why a busy console is slow. */\n    protected void write(LogEvent e, String line) { out.println(line); }\n}\n\n/**\n * A sink that writes to a file through a buffer. bytesWritten is incremented only after a write returns\n * without throwing, so the number rotation trusts is never ahead of the disk.\n */\nclass FileAppender extends AbstractAppender {\n    /** The file being written. Subclasses that rotate need it. */\n    protected final Path path;\n    /** The handle. Guarded by the sink&#x27;s lock; null once closed. */\n    protected BufferedWriter writer;\n    /** Characters written since the file was opened. Guarded by the lock. */\n    protected long bytesWritten;\n    private final LogLevel flushAt;\n\n    /** @param flushAt at and above this level the line is pushed out of the buffer before the call returns */\n    FileAppender(String name, LogFormatter formatter, LogLevel threshold, Path path, LogLevel flushAt) {\n        super(name, formatter, threshold); this.path = path; this.flushAt = flushAt;\n    }\n\n    /** Text formatter, INFO, flush on ERROR: the wiring an application actually uses. */\n    FileAppender(String name, Path path) { this(name, new TextFormatter(), LogLevel.TRACE, path, LogLevel.ERROR); }\n\n    protected void onStart() throws IOException { openWriter(true); }\n\n    protected void onClose() throws IOException { closeWriter(); }\n\n    /** Open the handle and reset the byte count. Called with the lock held (or before the sink is visible). */\n    protected void openWriter(boolean append) throws IOException {\n        writer = Files.newBufferedWriter(path, StandardCharsets.UTF_8,\n            StandardOpenOption.CREATE, append ? StandardOpenOption.APPEND : StandardOpenOption.TRUNCATE_EXISTING);\n        bytesWritten = append &amp;&amp; Files.exists(path) ? Files.size(path) : 0;\n    }\n\n    /** Flush and drop the handle. Nulled first, so a racing write finds null and returns instead of throwing. */\n    protected void closeWriter() throws IOException {\n        BufferedWriter w = writer;\n        writer = null;\n        if (w != null) w.close();\n    }\n\n    /**\n     * Everything that happens inside the sink&#x27;s lock, and nothing else: one write of the whole record (a stack\n     * trace and all), one newline, a flush only at ERROR and above, and then the byte count -- in that order,\n     * because a failed write must not move the counter that rotation trusts.\n     */\n    protected void write(LogEvent e, String line) throws IOException {\n        BufferedWriter w = writer;\n        if (w == null) return;\n        w.write(line);\n        w.newLine();\n        if (e.level().atLeast(flushAt)) w.flush();\n        bytesWritten += line.length() + 1;\n    }\n\n    /** How many characters are in the current file. Read under the lock so it is never half-updated. */\n    long bytesWritten() { lock.lock(); try { return bytesWritten; } finally { lock.unlock(); } }\n}\n\n/**\n * A file sink that starts a new file once the current one passes a size. The check and the swap happen inside\n * write(), which already runs under the sink&#x27;s lock, so a line is never split across two files.\n */\nfinal class RollingFileAppender extends FileAppender {\n    private final long maxBytes;\n    private int rolls;\n\n    /** @param maxBytes the size at which the next line starts a new file */\n    RollingFileAppender(String name, LogFormatter formatter, LogLevel threshold, Path path, long maxBytes) {\n        super(name, formatter, threshold, path, LogLevel.ERROR); this.maxBytes = maxBytes;\n    }\n\n    /** Roll first if this line would push the file over the limit, then write it normally. */\n    protected void write(LogEvent e, String line) throws IOException {\n        if (bytesWritten &gt; 0 &amp;&amp; bytesWritten + line.length() + 1 &gt; maxBytes) roll();\n        super.write(e, line);\n    }\n\n    /** Close the handle, move the file aside under a numbered name, open a fresh one. */\n    private void roll() throws IOException {\n        closeWriter();\n        rolls++;\n        Files.move(path, path.resolveSibling(path.getFileName() + &quot;.&quot; + rolls), StandardCopyOption.REPLACE_EXISTING);\n        openWriter(false);\n    }\n\n    /** How many times this sink has started a new file. A metric, and what the failure test checks. */\n    int rolls() { lock.lock(); try { return rolls; } finally { lock.unlock(); } }\n}\n\n/** A sink that keeps the lines in memory. The demo and the tests read it instead of a file. */\nfinal class MemoryAppender extends AbstractAppender {\n    private final List&lt;String&gt; lines = new ArrayList&lt;&gt;();\n\n    MemoryAppender(String name, LogFormatter formatter, LogLevel threshold) { super(name, formatter, threshold); }\n\n    /** Text formatter, everything through: the shape a test wants. */\n    MemoryAppender(String name) { this(name, new TextFormatter(), LogLevel.TRACE); }\n\n    /** Called with the lock held, so a plain ArrayList is safe here and nowhere else. */\n    protected void write(LogEvent e, String line) { lines.add(line); }\n\n    /** A snapshot of what has been written, taken under the lock. */\n    List&lt;String&gt; lines() { lock.lock(); try { return List.copyOf(lines); } finally { lock.unlock(); } }\n}\n\n/** A sink that counts events WITHOUT a lock, to show what the lock buys. Never use this for anything real. */\nfinal class UnsafeCountingAppender implements LogAppender {\n    private int count;\n\n    public String name() { return &quot;unsafe-counter&quot;; }\n\n    /** A plain read-add-write from many threads. Two threads that read the same value lose one increment. */\n    public void append(LogEvent e) { int c = count; Thread.onSpinWait(); count = c + 1; }\n\n    public void start() {}\n\n    public void close() {}\n\n    /** Whatever survived. */\n    int count() { return count; }\n}\n\n/** The same counter done through the base class, so the increment happens under the sink&#x27;s lock. */\nfinal class SafeCountingAppender extends AbstractAppender {\n    private long count;\n\n    SafeCountingAppender(String name) { super(name, e -&gt; &quot;&quot;, LogLevel.TRACE); }\n\n    /** The lock is already held here, so read-add-write is one step. */\n    protected void write(LogEvent e, String line) { count++; }\n\n    /** The exact number of events this sink accepted. */\n    long count() { lock.lock(); try { return count; } finally { lock.unlock(); } }\n}\n\n/** A sink that takes its time, so a queue in front of it visibly fills instead of staying empty. */\nfinal class SlowAppender extends AbstractAppender {\n    private final long millisPerEvent;\n    private final AtomicLong written = new AtomicLong();\n\n    SlowAppender(String name, long millisPerEvent) { super(name, e -&gt; &quot;&quot;, LogLevel.TRACE); this.millisPerEvent = millisPerEvent; }\n\n    /** Sleeps with the lock held, which is exactly what a slow disk does. */\n    protected void write(LogEvent e, String line) throws InterruptedException {\n        Thread.sleep(millisPerEvent);\n        written.incrementAndGet();\n    }\n\n    /** How many events actually reached the far side. */\n    long written() { return written.get(); }\n}\n\n/** What an async sink does when its queue is full. Named, chosen per sink, and never a framework-wide law. */\nenum OverflowPolicy {\n    /** Give up on the event that arrived and count it. Bounded memory, bounded latency, visible loss. */\n    DROP_NEWEST,\n    /** Throw away the oldest queued event to make room. Keeps the freshest picture of a storm. */\n    DISCARD_OLDEST,\n    /** Make the caller wait. The right answer for an audit sink and the wrong one for checkout. */\n    BLOCK\n}\n\n/**\n * The decorator that takes the write off the caller&#x27;s thread: it holds any other sink, puts events on a\n * bounded queue and lets one daemon worker drain them. Bounded is the whole point -- unbounded turns a\n * storm into an OutOfMemoryError, and blocking turns a slow disk into slow checkouts.\n */\nfinal class AsyncAppender implements LogAppender {\n    /** The sentinel that ends the worker. It queues BEHIND the backlog, so close() drains in order. */\n    private static final LogEvent PILL = new LogEvent(0, LogLevel.OFF, &quot;&quot;, &quot;&quot;, &quot;&quot;, null, Map.of());\n\n    private final String name;\n    private final LogAppender delegate;\n    private final BlockingQueue&lt;LogEvent&gt; queue;\n    private final OverflowPolicy policy;\n    private final LogLevel neverDrop;\n    private final AtomicLong dropped = new AtomicLong();\n    private final AtomicBoolean started = new AtomicBoolean(false);\n    private volatile boolean accepting;\n    private Thread worker;\n\n    /**\n     * @param delegate the sink that really writes; @param capacity the ceiling on queued events;\n     * @param policy what happens when the queue is full; @param neverDrop at and above this level the caller waits instead\n     */\n    AsyncAppender(String name, LogAppender delegate, int capacity, OverflowPolicy policy, LogLevel neverDrop) {\n        this.name = name; this.delegate = delegate; this.queue = new ArrayBlockingQueue&lt;&gt;(capacity);\n        this.policy = policy; this.neverDrop = neverDrop;\n    }\n\n    /** A 4096-deep queue that drops the newest and never gives up on ERROR: the sane default. */\n    AsyncAppender(String name, LogAppender delegate) { this(name, delegate, 4096, OverflowPolicy.DROP_NEWEST, LogLevel.ERROR); }\n\n    public String name() { return name; }\n\n    /**\n     * The caller&#x27;s whole cost: one enqueue. If the queue is full the named policy decides, and the loss is\n     * counted rather than hidden. Nothing here can throw into the application.\n     */\n    public void append(LogEvent e) {\n        if (!accepting) { dropped.incrementAndGet(); return; }\n        if (queue.offer(e)) return;\n        try {\n            if (e.level().atLeast(neverDrop) || policy == OverflowPolicy.BLOCK) {\n                if (!queue.offer(e, 2, TimeUnit.SECONDS)) dropped.incrementAndGet();\n            } else if (policy == OverflowPolicy.DISCARD_OLDEST) {\n                if (queue.poll() != null) dropped.incrementAndGet();\n                if (!queue.offer(e)) dropped.incrementAndGet();\n            } else {\n                dropped.incrementAndGet();\n            }\n        } catch (InterruptedException ie) {\n            Thread.currentThread().interrupt();\n            dropped.incrementAndGet();\n        }\n    }\n\n    /** Spawn exactly one worker. compareAndSet is why a double-wired config cannot start two of them. */\n    public void start() {\n        if (!started.compareAndSet(false, true)) return;\n        delegate.start();\n        accepting = true;\n        worker = new Thread(this::drain, &quot;log-&quot; + name);\n        worker.setDaemon(true);\n        worker.start();\n    }\n\n    /**\n     * Stop accepting, queue the pill behind whatever is already waiting, and give the worker two seconds to\n     * finish. The honest gap: a thread already past the accepting check can still lose its event; closing that\n     * needs a lock on every append, which is right for an audit sink and wrong for this one.\n     */\n    public void close() {\n        if (!started.compareAndSet(true, false)) return;\n        accepting = false;\n        try { queue.offer(PILL, 2, TimeUnit.SECONDS); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n        try { worker.join(2000); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n        delegate.close();\n    }\n\n    /** Events given up on: queue full, or offered after close. Exported, because invisible loss is a lie. */\n    long droppedCount() { return dropped.get(); }\n\n    /** How full the queue is right now. A metric worth a dashboard. */\n    int queueDepth() { return queue.size(); }\n\n    /**\n     * The worker: take one, sweep up whatever else is waiting, hand the batch to the delegate. Batching turns\n     * sixty-four lock acquisitions into one without changing a line of the sink underneath.\n     */\n    private void drain() {\n        List&lt;LogEvent&gt; batch = new ArrayList&lt;&gt;(64);\n        while (true) {\n            try {\n                LogEvent first = queue.take();\n                if (first == PILL) return;\n                batch.add(first);\n                queue.drainTo(batch, 63);\n                boolean pill = false;\n                for (LogEvent e : batch) {\n                    if (e == PILL) { pill = true; break; }\n                    try { delegate.append(e); } catch (RuntimeException re) { Status.error(name + &quot;: delegate threw&quot;, re); }\n                }\n                batch.clear();\n                if (pill) return;\n            } catch (InterruptedException ie) {\n                Thread.currentThread().interrupt();\n                return;\n            }\n        }\n    }\n}\n\n/**\n * The framework&#x27;s own error channel. A logger that reports its failures through itself is a loop, so these\n * go straight to stderr and are counted.\n */\nfinal class Status {\n    private static final AtomicLong errors = new AtomicLong();\n    private static volatile PrintStream sink = System.err;\n\n    private Status() {}\n\n    /** Report a framework failure. Called from inside catch blocks that must not rethrow. */\n    static void error(String what, Throwable t) {\n        errors.incrementAndGet();\n        sink.println(&quot;[logger] &quot; + what + (t == null ? &quot;&quot; : &quot;: &quot; + t));\n    }\n\n    /** How many framework failures have been reported. A metric, and what a test asserts on. */\n    static long errorCount() { return errors.get(); }\n\n    /** Point the channel somewhere else, so a test can stay quiet. */\n    static void sink(PrintStream s) { sink = s; }\n\n    /** Zero the counter between tests. */\n    static void reset() { errors.set(0); }\n}\n\n/**\n * One node in the tree, named after a package or a class. It holds its own level (null means &quot;ask my parent&quot;),\n * whether it also uses its ancestors&#x27; sinks, its own sinks and its own filters. Everything hot here is a\n * volatile field or a copy-on-write list, so a log call never takes a lock of the framework&#x27;s own.\n */\nfinal class Logger {\n    private final String name;\n    private final Logger parent;\n    private final LoggerContext ctx;\n    /** null means inherit. Volatile because one thread writes it at 2am and millions read it. */\n    private volatile LogLevel level;\n    /** When false, events stop here instead of also going to the ancestors&#x27; sinks. */\n    private volatile boolean additive = true;\n    private final CopyOnWriteArrayList&lt;LogAppender&gt; appenders = new CopyOnWriteArrayList&lt;&gt;();\n    private final CopyOnWriteArrayList&lt;LogFilter&gt; filters = new CopyOnWriteArrayList&lt;&gt;();\n\n    /** Built only by the context, so the parent is resolved before anybody can see this node. */\n    Logger(String name, Logger parent, LoggerContext ctx) { this.name = name; this.parent = parent; this.ctx = ctx; }\n\n    /** The dotted name this logger was asked for. */\n    String name() { return name; }\n\n    /** The node above this one, or null for ROOT. */\n    Logger parent() { return parent; }\n\n    /** This node&#x27;s own level, or null when it inherits. */\n    LogLevel level() { return level; }\n\n    /** Set or clear this node&#x27;s own level. Takes effect on the very next call: no restart, no lock. */\n    void setLevel(LogLevel l) { level = l; }\n\n    /** Turn the walk to the ancestors&#x27; sinks on or off for this subtree. */\n    void setAdditive(boolean a) { additive = a; }\n\n    /** Whether events from here also reach the ancestors&#x27; sinks. */\n    boolean additive() { return additive; }\n\n    /** Hand this node a sink and start it. The logger never builds one. */\n    void addAppender(LogAppender a) { a.start(); appenders.addIfAbsent(a); }\n\n    /** Take a sink off this node. It is not closed: somebody else may still be using it. */\n    void removeAppender(LogAppender a) { appenders.remove(a); }\n\n    /** This node&#x27;s own sinks, as a snapshot. */\n    List&lt;LogAppender&gt; appenders() { return List.copyOf(appenders); }\n\n    /** Hand this node a policy that votes on events. */\n    void addFilter(LogFilter f) { filters.add(f); }\n\n    /** The first level anybody on the path up to ROOT has an opinion about. ROOT always has one, so this ends. */\n    LogLevel effectiveLevel() {\n        for (Logger l = this; l != null; l = l.parent) {\n            LogLevel own = l.level;\n            if (own != null) return own;\n        }\n        return LogLevel.INFO;\n    }\n\n    /** The gate. Three to five volatile reads and a compare, with nothing allocated. */\n    boolean isEnabled(LogLevel lv) { return lv.atLeast(effectiveLevel()); }\n\n    /** TRACE with a plain message. */\n    void trace(String m) { log(LogLevel.TRACE, m, null); }\n\n    /** DEBUG with a plain message. */\n    void debug(String m) { log(LogLevel.DEBUG, m, null); }\n\n    /** INFO with a plain message. */\n    void info(String m) { log(LogLevel.INFO, m, null); }\n\n    /** WARN with a plain message. */\n    void warn(String m) { log(LogLevel.WARN, m, null); }\n\n    /** ERROR with a plain message. */\n    void error(String m) { log(LogLevel.ERROR, m, null); }\n\n    /** ERROR with the exception that caused it. */\n    void error(String m, Throwable t) { log(LogLevel.ERROR, m, t); }\n\n    /** FATAL with a plain message. */\n    void fatal(String m) { log(LogLevel.FATAL, m, null); }\n\n    /** DEBUG whose message is only built if DEBUG is on. The cure for &quot;cart=&quot; + cart in a hot loop. */\n    void debug(Supplier&lt;String&gt; m) { log(LogLevel.DEBUG, m, null); }\n\n    /** INFO whose message is only built if INFO is on. */\n    void info(Supplier&lt;String&gt; m) { log(LogLevel.INFO, m, null); }\n\n    /** The gate first, then the work. A switched-off call ends on the first line. */\n    void log(LogLevel lv, String msg, Throwable err) {\n        if (!isEnabled(lv)) return;\n        emit(lv, msg, err);\n    }\n\n    /** The lazy form: the supplier is not touched unless the level is on. */\n    void log(LogLevel lv, Supplier&lt;String&gt; msg, Throwable err) {\n        if (!isEnabled(lv)) return;\n        String text;\n        try { text = msg.get(); }\n        catch (RuntimeException ex) { Status.error(name + &quot;: message supplier threw&quot;, ex); return; }\n        emit(lv, text, err);\n    }\n\n    /**\n     * Two passes on purpose. First the whole path votes, so a child&#x27;s sink cannot write a line ROOT was about\n     * to veto. Only then does the event go to every sink on the path, each inside its own try/catch.\n     */\n    private void emit(LogLevel lv, String msg, Throwable err) {\n        LogEvent e = new LogEvent(ctx.clock().nowMs(), lv, name, Thread.currentThread().getName(),\n                                  msg, err, Mdc.snapshot());\n        for (Logger l = this; l != null; l = l.parent) {\n            FilterDecision d = vote(l.filters, e);\n            if (d == FilterDecision.DENY) return;\n            if (d == FilterDecision.ACCEPT) break;\n            if (!l.additive) break;\n        }\n        for (Logger l = this; l != null; l = l.parent) {\n            for (LogAppender a : l.appenders) {\n                try { a.append(e); }\n                catch (RuntimeException ex) { Status.error(a.name() + &quot; threw&quot;, ex); }\n            }\n            if (!l.additive) break;\n        }\n    }\n\n    /** The first opinionated vote wins; an empty chain accepts; a filter that throws is treated as abstaining. */\n    private static FilterDecision vote(List&lt;LogFilter&gt; chain, LogEvent e) {\n        for (LogFilter f : chain) {\n            FilterDecision d;\n            try { d = f.decide(e); }\n            catch (RuntimeException ex) { Status.error(&quot;filter threw&quot;, ex); continue; }\n            if (d != null &amp;&amp; d != FilterDecision.NEUTRAL) return d;\n        }\n        return FilterDecision.NEUTRAL;\n    }\n}\n\n/**\n * The registry, and the only thing that builds a Logger. One name means one object forever, so a level change\n * reaches every static field that asked for that name. It also owns the clock and the shutdown.\n */\nfinal class LoggerContext {\n    /** The name of the node at the top of the tree; it always has a level, which is what ends every walk. */\n    static final String ROOT_NAME = &quot;ROOT&quot;;\n\n    private final ConcurrentHashMap&lt;String, Logger&gt; registry = new ConcurrentHashMap&lt;&gt;();\n    private final Logger root;\n    private volatile Clock clock = System::currentTimeMillis;\n\n    /** A fresh tree with ROOT at INFO and no sinks. A test builds one per case; an application builds one. */\n    LoggerContext() {\n        root = new Logger(ROOT_NAME, null, this);\n        root.setLevel(LogLevel.INFO);\n        registry.put(ROOT_NAME, root);\n    }\n\n    /** The node at the top. Everything inherits from it. */\n    Logger root() { return root; }\n\n    /** Where every timestamp comes from. */\n    Clock clock() { return clock; }\n\n    /** Hand the tree a clock. A test sets an instant and moves it. */\n    void setClock(Clock c) { clock = c; }\n\n    /**\n     * One object per name, forever. The parent is resolved BEFORE the put, which is both why a logger is never\n     * half-built and why this does not deadlock: no recursive computeIfAbsent on the same map.\n     */\n    Logger getLogger(String name) {\n        if (name == null || name.isEmpty() || ROOT_NAME.equals(name)) return root;\n        Logger existing = registry.get(name);\n        if (existing != null) return existing;\n        int dot = name.lastIndexOf(&#x27;.&#x27;);\n        Logger parent = dot &lt; 0 ? root : getLogger(name.substring(0, dot));\n        return registry.computeIfAbsent(name, n -&gt; new Logger(n, parent, this));\n    }\n\n    /** The usual call site: getLogger(Checkout.class) in a static field. */\n    Logger getLogger(Class&lt;?&gt; c) { return getLogger(c.getName()); }\n\n    /** Every name asked for so far, sorted. Answers &quot;why is this class silent&quot;. */\n    List&lt;String&gt; names() { return registry.keySet().stream().sorted().toList(); }\n\n    /**\n     * Wire the root from outside. The context never news up a formatter, a sink or a filter: main() is the\n     * only place in the program where the concrete graph is named.\n     */\n    void configure(LogLevel rootLevel, List&lt;LogAppender&gt; appenders, List&lt;LogFilter&gt; filters) {\n        root.setLevel(rootLevel);\n        for (LogAppender a : appenders) root.addAppender(a);\n        for (LogFilter f : filters) root.addFilter(f);\n    }\n\n    /** Close every sink exactly once, deduped by identity because one async sink is often on several nodes. */\n    void shutdown() {\n        Set&lt;LogAppender&gt; seen = Collections.newSetFromMap(new IdentityHashMap&lt;&gt;());\n        for (Logger l : registry.values()) seen.addAll(l.appenders());\n        for (LogAppender a : seen) {\n            try { a.close(); }\n            catch (RuntimeException ex) { Status.error(a.name() + &quot;: close threw&quot;, ex); }\n        }\n    }\n}\n\n/** The demo: the tree, the filters, the lock that earns its keep, and fifty threads through one async sink. */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        Path dir = Files.createTempDirectory(&quot;logger-demo&quot;);\n        LoggerContext ctx = new LoggerContext();\n\n        // main() is the only place the concrete graph is named: one console sink, text layout, ROOT at INFO\n        ConsoleAppender console = new ConsoleAppender(&quot;console&quot;, new TextFormatter(), LogLevel.TRACE, System.out);\n        ctx.configure(LogLevel.INFO, List.of(console), List.of(new DenyMessageFilter(&quot;/healthz&quot;)));\n        ctx.setClock(() -&gt; 1_789_205_400_000L);                       // a fixed instant, so the demo is readable\n\n        Logger shop = ctx.getLogger(&quot;com.shop&quot;);\n        Logger checkout = ctx.getLogger(&quot;com.shop.checkout&quot;);\n        Logger db = ctx.getLogger(&quot;com.shop.db&quot;);\n\n        // 1. the tree: nobody set a level on the children, so they inherit ROOT&#x27;s INFO\n        System.out.println(&quot;-- the tree: effective levels&quot;);\n        System.out.println(&quot;  ROOT=&quot; + ctx.root().effectiveLevel() + &quot;  com.shop=&quot; + shop.effectiveLevel()\n            + &quot;  com.shop.checkout=&quot; + checkout.effectiveLevel() + &quot; (own level: &quot; + checkout.level() + &quot;)&quot;);\n        Mdc.put(&quot;rid&quot;, &quot;r-1001&quot;);\n        checkout.info(&quot;order placed id=42&quot;);\n        int[] built = { 0 };\n        checkout.debug(() -&gt; { built[0]++; return &quot;cart=&quot; + new ArrayList&lt;&gt;(List.of(&quot;a&quot;, &quot;b&quot;, &quot;c&quot;)); });\n        System.out.println(&quot;  DEBUG is off, so the message supplier ran &quot; + built[0] + &quot; times&quot;);\n\n        // 2. DEBUG for payments only, at 2am, without a restart\n        shop.setLevel(LogLevel.DEBUG);\n        checkout.debug(() -&gt; { built[0]++; return &quot;cart=[a, b, c]&quot;; });\n        System.out.println(&quot;  after com.shop -&gt; DEBUG, the supplier has run &quot; + built[0] + &quot; time(s)&quot;);\n        db.setLevel(LogLevel.WARN);\n        db.debug(&quot;this never appears: com.shop.db overrides its parent&quot;);\n\n        // 3. additivity: a JSON sink on the child, then the child stops using the shared console\n        MemoryAppender json = new MemoryAppender(&quot;json&quot;, new JsonFormatter(), LogLevel.TRACE);\n        checkout.addAppender(json);\n        checkout.info(&quot;shipped id=42&quot;);\n        System.out.println(&quot;  the JSON sink has &quot; + json.lines().size() + &quot; line(s): &quot; + json.lines().get(0));\n        checkout.setAdditive(false);\n        checkout.info(&quot;this one only reaches the child&#x27;s own sink&quot;);\n        System.out.println(&quot;  after additivity off, the JSON sink has &quot; + json.lines().size() + &quot; lines&quot;\n            + &quot; and the console printed one fewer&quot;);\n        checkout.setAdditive(true);\n\n        // 4. a ROOT filter: a health check is valid INFO, and still noise\n        checkout.info(&quot;GET /healthz 200&quot;);\n        System.out.println(&quot;  the /healthz line was vetoed by a ROOT filter, not by a level&quot;);\n        Mdc.clear();\n\n        // 5. what the sink&#x27;s lock buys: the same events into an unlocked counter and a locked one\n        UnsafeCountingAppender unsafe = new UnsafeCountingAppender();\n        SafeCountingAppender safe = new SafeCountingAppender(&quot;safe-counter&quot;);\n        Logger race = ctx.getLogger(&quot;com.shop.race&quot;);\n        race.addAppender(unsafe);\n        race.addAppender(safe);\n        race.setAdditive(false);\n        int threads = 8, each = 2000, expected = threads * each;\n        runConcurrently(threads, i -&gt; { for (int k = 0; k &lt; each; k++) race.info(&quot;tick&quot;); });\n        System.out.println(&quot;-- one lock per sink&quot;);\n        System.out.println(&quot;  published &quot; + expected + &quot; events: unlocked counter says &quot; + unsafe.count()\n            + &quot;, locked counter says &quot; + safe.count());\n        race.removeAppender(unsafe);\n        race.removeAppender(safe);\n\n        // 6. fifty threads through one async sink onto one file: every line whole, per-thread order kept\n        Path file = dir.resolve(&quot;app.log&quot;);\n        FileAppender fileSink = new FileAppender(&quot;file&quot;, new TextFormatter(), LogLevel.TRACE, file, LogLevel.ERROR);\n        AsyncAppender async = new AsyncAppender(&quot;async&quot;, fileSink, 8192, OverflowPolicy.BLOCK, LogLevel.ERROR);\n        Logger web = ctx.getLogger(&quot;com.shop.web&quot;);\n        web.addAppender(async);\n        web.setAdditive(false);\n        int writers = 50, lines = 20;\n        long t0 = System.nanoTime();\n        runConcurrently(writers, i -&gt; { for (int k = 0; k &lt; lines; k++) web.info(&quot;t&quot; + i + &quot;-&quot; + k); });\n        long callerNs = System.nanoTime() - t0;\n        async.close();\n        List&lt;String&gt; written = Files.readAllLines(file);\n        System.out.println(&quot;-- fifty threads, one file, through a bounded queue&quot;);\n        System.out.println(&quot;  &quot; + written.size() + &quot; lines on disk (expected &quot; + writers * lines + &quot;), dropped &quot;\n            + async.droppedCount() + &quot;, callers took &quot; + callerNs / 1_000_000 + &quot; ms in total&quot;);\n        System.out.println(&quot;  every line whole: &quot; + written.stream().allMatch(l -&gt; l.matches(&quot;.* INFO  \\\\[.*\\\\] com\\\\.shop\\\\.web - t\\\\d+-\\\\d+&quot;))\n            + &quot;, per-thread order kept: &quot; + perThreadOrderKept(written));\n\n        // 7. a storm into a small queue in front of a slow sink: bounded memory, and the loss is counted\n        SlowAppender slow = new SlowAppender(&quot;slow&quot;, 2);\n        AsyncAppender small = new AsyncAppender(&quot;small&quot;, slow, 16, OverflowPolicy.DROP_NEWEST, LogLevel.FATAL);\n        Logger storm = ctx.getLogger(&quot;com.shop.storm&quot;);\n        storm.addAppender(small);\n        storm.setAdditive(false);\n        for (int i = 0; i &lt; 500; i++) storm.info(&quot;storm &quot; + i);\n        small.close();\n        System.out.println(&quot;-- a storm into a 16-deep queue in front of a 2 ms sink&quot;);\n        System.out.println(&quot;  offered 500, written &quot; + slow.written() + &quot;, dropped &quot; + small.droppedCount()\n            + &quot;, sum &quot; + (slow.written() + small.droppedCount()) + &quot; -- bounded memory, visible loss&quot;);\n\n        // 8. a sink that throws must not break the caller or the other sinks\n        MemoryAppender survivor = new MemoryAppender(&quot;survivor&quot;);\n        Logger risky = ctx.getLogger(&quot;com.shop.risky&quot;);\n        risky.addAppender(new ThrowingAppender());\n        risky.addAppender(survivor);\n        risky.setAdditive(false);\n        risky.error(&quot;payment declined&quot;, new IllegalStateException(&quot;gateway timeout&quot;));\n        System.out.println(&quot;-- a broken sink, and an exception on the line&quot;);\n        System.out.println(&quot;  the caller returned normally and the other sink still has &quot; + survivor.lines().size()\n            + &quot; record -- &quot; + survivor.lines().get(0).lines().count()\n            + &quot; physical lines, because the whole stack trace rides inside one record and is written in one step&quot;);\n\n        ctx.shutdown();\n        System.out.println(&quot;-- registry: &quot; + ctx.names());\n        if (written.size() != writers * lines) throw new AssertionError(&quot;the async sink lost a line&quot;);\n        if (safe.count() != expected) throw new AssertionError(&quot;the locked counter lost an update&quot;);\n        System.out.println(&quot;demo done; files under &quot; + dir);\n    }\n\n    /** A sink that always fails, to prove the caller never finds out. */\n    static final class ThrowingAppender implements LogAppender {\n        public String name() { return &quot;broken&quot;; }\n        public void append(LogEvent e) { throw new RuntimeException(&quot;the collector is down&quot;); }\n        public void start() {}\n        public void close() {}\n    }\n\n    /**\n     * Start n REAL threads, all parked on one latch, so &quot;fifty at the same instant&quot; is fifty and not a pool of\n     * sixteen taking turns. One thread per task is the whole point: a smaller pool would hide the contention.\n     */\n    static void runConcurrently(int n, java.util.function.IntConsumer body) throws Exception {\n        ExecutorService pool = Executors.newFixedThreadPool(n);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; fs = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; n; i++) {\n            final int id = i;\n            fs.add(pool.submit(() -&gt; { go.await(); body.accept(id); return null; }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : fs) f.get();\n        pool.shutdown();\n    }\n\n    /** True when, for every thread, its own lines appear in the order it wrote them. */\n    static boolean perThreadOrderKept(List&lt;String&gt; lines) {\n        Map&lt;String, Integer&gt; last = new HashMap&lt;&gt;();\n        for (String l : lines) {\n            int dash = l.lastIndexOf(&quot; - t&quot;);\n            if (dash &lt; 0) continue;\n            String tag = l.substring(dash + 4);\n            String[] parts = tag.split(&quot;-&quot;);\n            int prev = last.getOrDefault(parts[0], -1);\n            int seq = Integer.parseInt(parts[1]);\n            if (seq != prev + 1) return false;\n            last.put(parts[0], seq);\n        }\n        return true;\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.io.*;\nimport java.nio.charset.StandardCharsets;\nimport java.nio.file.*;\nimport java.time.Instant;\nimport java.time.ZoneOffset;\nimport java.time.format.DateTimeFormatter;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.ReentrantLock;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: roll at midnight -- the same rotation, keyed on a clock bucket instead of a byte count\n/**\n * Rolls when the calendar bucket changes: a new hour, a new day, whatever periodMs says. It reuses the\n * handle-swap the base class already has and asks the injected Clock what time it is, so a test can roll\n * three days in a microsecond.\n */\nfinal class TimeRollingFileAppender extends FileAppender {\n    private static final DateTimeFormatter STAMP = DateTimeFormatter.ofPattern(&quot;yyyy-MM-dd-HH&quot;).withZone(ZoneOffset.UTC);\n\n    private final Clock clock;\n    private final long periodMs;\n    private long bucket;\n    private int rolls;\n\n    /** @param periodMs the length of one file, in milliseconds: 3600_000 for hourly, 86_400_000 for daily */\n    TimeRollingFileAppender(String name, LogFormatter formatter, LogLevel threshold, Path path, Clock clock, long periodMs) {\n        super(name, formatter, threshold, path, LogLevel.ERROR);\n        this.clock = clock; this.periodMs = periodMs; this.bucket = clock.nowMs() / periodMs;\n    }\n\n    /** Runs under the sink&#x27;s lock, so the check, the swap and the write are one step. */\n    protected void write(LogEvent e, String line) throws IOException {\n        long now = clock.nowMs() / periodMs;\n        if (now != bucket &amp;&amp; bytesWritten &gt; 0) {\n            closeWriter();\n            rolls++;\n            Files.move(path, path.resolveSibling(path.getFileName() + &quot;.&quot; + STAMP.format(Instant.ofEpochMilli(bucket * periodMs))),\n                StandardCopyOption.REPLACE_EXISTING);\n            openWriter(false);\n        }\n        bucket = now;\n        super.write(e, line);\n    }\n\n    /** How many times a new period started a new file. */\n    int rolls() { lock.lock(); try { return rolls; } finally { lock.unlock(); } }\n}\n\n// ---- ext: one file per tenant -- a sink that picks a sink, created lazily and capped\n/**\n * Reads a key off the event&#x27;s context and forwards to the delegate for that key, building one lazily the\n * first time a tenant appears. The cap matters: keys that come from request data are user input, and an\n * uncapped map of sinks is a file-handle leak with a pretty name.\n */\nfinal class RoutingAppender implements LogAppender {\n    private final String name;\n    private final String contextKey;\n    private final java.util.function.Function&lt;String, LogAppender&gt; factory;\n    private final int maxRoutes;\n    private final ConcurrentHashMap&lt;String, LogAppender&gt; routes = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicLong unrouted = new AtomicLong();\n    private volatile boolean started;\n\n    /** @param contextKey which MDC key decides the destination; @

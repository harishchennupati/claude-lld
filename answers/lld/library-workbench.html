g> who = new ArrayList<>();\n            for (BookCopy c : book(isbn).copies) { Loan l = onLoan.get(c.barcode); if (l != null) who.add(l.member.id); }\n            return who;\n        });\n    }\n    /** Loans past their due date, oldest first. O(log n + k): a range of the due index, not a scan of every loan. */\n    List<Slip> overdue() { return locked(call -> slips(byDue.headMap(call.today(), false))); }\n    /** Loans due between two days, inclusive; the nightly reminder asks for the next two days. O(log n + k). */\n    List<Slip> dueBetween(LocalDate from, LocalDate to) {\n        return locked(call -> from.isAfter(to) ? List.<Slip>of() : slips(byDue.subMap(from, true, to, true)));\n    }\n    /** What he owes, in paise. O(1). */\n    long dues(String memberId) { return locked(call -> member(memberId).duesPaise); }\n    /** Where this copy is. O(1). */\n    CopyStatus status(String barcode) { return locked(call -> copy(barcode).status); }\n\n    // ---------------- the private helpers: all run under the lock\n\n    /** One call's working set: the day it runs on, read once from the clock, and the notices to send after the unlock. */\n    private record Call(LocalDate today, List<LibraryEvent> events) {}\n\n    /**\n     * The one way in. Lock; hand on held copies whose pickup date has passed; run the body; unlock; then tell the\n     * listeners. The notices go out even when the body refused, because the sweep may already have set a copy\n     * aside for someone, and he must hear about it.\n     */\n    private <T> T locked(Function<Call, T> body) {\n        List<LibraryEvent> events = new ArrayList<>();\n        lock.lock();\n        try {\n            Call call = new Call(today(), events);\n            sweep(call);\n            return body.apply(call);\n        } finally {\n            lock.unlock();\n            publish(events);                                               // after the unlock: a slow listener holds up nobody\n        }\n    }\n\n    /**\n     * Where a free copy goes: to the first member still waiting for its title, else back on the shelf. Every path\n     * that frees a copy comes through here (a return, a new copy, an expired or cancelled hold, a member leaving),\n     * so a copy can never sit on the shelf while someone waits for it. Returns who it went to, or null.\n     */\n    private String placeCopy(BookCopy c, Call call) {\n        Hold next = c.book.nextInLine();                                   // drops cancelled holds from the front\n        if (next != null) { setAside(next, c, call); return next.member.id; }\n        c.status = CopyStatus.AVAILABLE;\n        c.book.shelve(c);\n        return null;\n    }\n\n    /** Put a copy on the hold shelf for this hold's member, with a pickup date, and queue a notice for him. */\n    private void setAside(Hold h, BookCopy c, Call call) {\n        h.status = HoldStatus.READY;\n        h.copy = c;\n        h.pickupBy = call.today().plusDays(pickupDays);\n        c.status = CopyStatus.ON_HOLD;\n        readyByDeadline.add(h);\n        call.events().add(new LibraryEvent(EventKind.HOLD_READY, h.member.id, h.book.isbn, c.barcode, h.pickupBy, 0));\n    }\n\n    /** Cancel one hold. WAITING: marked, and dropped when it reaches the front. READY: its copy goes to the next member. */\n    private void cancel(Hold h, Call call) {\n        boolean wasReady = h.status == HoldStatus.READY;\n        BookCopy c = h.copy;\n        h.status = HoldStatus.CANCELLED;\n        h.copy = null;\n        h.member.holds.remove(h.book.isbn);\n        if (wasReady) placeCopy(c, call);                                  // left in the deadline heap; dropped when it reaches the top\n    }\n\n    /**\n     * Hand on every held copy whose pickup date has passed. The heap's head is the earliest date, so when nothing\n     * has expired this is one peek. Stale entries (collected or cancelled holds) are dropped as they surface.\n     */\n    private void sweep(Call call) {\n        while (!readyByDeadline.isEmpty()) {\n            Hold h = readyByDeadline.peek();\n            if (h.status != HoldStatus.READY) { readyByDeadline.poll(); continue; }\n            if (!call.today().isAfter(h.pickupBy)) return;                  // the earliest pickup date has not passed\n            readyByDeadline.poll();\n            BookCopy c = h.copy;\n            h.status = HoldStatus.EXPIRED;\n            h.copy = null;\n            h.member.holds.remove(h.book.isbn);\n            call.events().add(new LibraryEvent(EventKind.HOLD_EXPIRED, h.member.id, h.book.isbn, c.barcode, h.pickupBy, 0));\n            placeCopy(c, call);                                            // the next member in line, else the shelf\n        }\n    }\n\n    /** Ask the handed-in fine rule, and refuse an answer below zero: a broken rule must not pay the member. */\n    private long fineFor(Loan loan, LocalDate day) {\n        long fine = fines.fine(loan, day);\n        if (fine < 0) throw new IllegalStateException(\"a fine rule returned \" + fine);\n        return fine;\n    }\n\n    /** Tell every listener about every notice, each in its own try/catch, so one broken listener cannot stop the others. */\n    private void publish(List<LibraryEvent> events) {\n        for (LibraryEvent e : events)\n            for (LibraryListener l : listeners) {\n                try { l.onEvent(e); } catch (RuntimeException ex) { System.err.println(\"   [listener failed] \" + ex.getMessage()); }\n            }\n    }\n\n    /** The member, or a refusal. */\n    private Member member(String id) {\n        Member m = members.get(id);\n        if (m == null) throw new Refused(Refusal.UNKNOWN_MEMBER, id);\n        return m;\n    }\n    /** The title, or a refusal. */\n    private Book book(String isbn) {\n        Book b = catalog.get(isbn);\n        if (b == null) throw new Refused(Refusal.UNKNOWN_BOOK, isbn);\n        return b;\n    }\n    /** The copy, or a refusal. */\n    private BookCopy copy(String barcode) {\n        BookCopy c = copies.get(barcode);\n        if (c == null) throw new Refused(Refusal.UNKNOWN_COPY, barcode);\n        return c;\n    }\n    /** The active loan behind this barcode, or a refusal: unknown copy, or a copy that is not out. */\n    private Loan activeLoan(String barcode) {\n        Loan loan = onLoan.get(barcode);\n        if (loan == null) throw new Refused(copies.containsKey(barcode) ? Refusal.NOT_ON_LOAN : Refusal.UNKNOWN_COPY, barcode);\n        return loan;\n    }\n    /** File an active loan under its due date. */\n    private void index(Loan l) {\n        byDue.computeIfAbsent(l.due, d -> new TreeSet<>(Comparator.comparingInt((Loan x) -> x.id))).add(l);\n    }\n    /** Take a loan out of the due index; drop the date when nothing else is due that day. */\n    private void unindex(Loan l) {\n        Set<Loan> day = byDue.get(l.due);\n        day.remove(l);\n        if (day.isEmpty()) byDue.remove(l.due);\n    }\n    /** The member's copy of a loan: immutable. */\n    private Slip slip(Loan l) { return new Slip(l.copy.barcode, l.copy.book.isbn, l.copy.book.title, l.member.id, l.due, l.renewals); }\n    /** The member's copy of a hold: immutable. */\n    private HoldSlip holdSlip(Hold h) {\n        return new HoldSlip(h.member.id, h.book.isbn, h.status, h.status == HoldStatus.WAITING ? h.book.position(h.member) : 0,\n                            h.copy == null ? null : h.copy.barcode, h.pickupBy);\n    }\n    /** Search hits with their shelf counts, read under the lock. */\n    private List<Found> found(List<Book> books) {\n        List<Found> out = new ArrayList<>();\n        for (Book b : books) out.add(new Found(b.isbn, b.title, b.author, b.onShelf(), b.copies.size()));\n        return out;\n    }\n    /** Every loan in a range of the due index, as slips, in date order. */\n    private List<Slip> slips(SortedMap<LocalDate, Set<Loan>> range) {\n        List<Slip> out = new ArrayList<>();\n        for (Set<Loan> day : range.values()) for (Loan l : day) out.add(slip(l));\n        return out;\n    }\n}\n\n/**\n * A thin caller at the counter, or a kiosk: no state and no lock of its own. It turns a request into library\n * calls and says what the member sees.\n */\nfinal class Desk {\n    private final Library lib;\n    /** A desk in front of one library. */\n    Desk(Library lib) { this.lib = lib; }\n\n    /**\n     * Flipkart's one request: lend a copy now if one is free for him, else put him in the FIFO queue. Two library\n     * calls, and still safe: if a copy comes back in between, placeHold sets it aside for him at once.\n     */\n    String borrow(String memberId, String isbn) {\n        try {\n            Slip s = lib.checkout(memberId, isbn);\n            return memberId + \": lent \" + s.barcode() + \", due \" + s.due();\n        } catch (Refused no) {\n            if (no.why != Refusal.NOT_AVAILABLE) return memberId + \": refused, \" + no.why;\n        }\n        try {\n            HoldSlip h = lib.placeHold(memberId, isbn);\n            return h.status() == HoldStatus.READY\n                ? memberId + \": a copy just came back; \" + h.barcode() + \" is on the hold shelf for you until \" + h.pickupBy()\n                : memberId + \": no copy free; you are number \" + h.position() + \" in the queue\";\n        } catch (Refused no) {\n            if (no.why != Refusal.ALREADY_HAS_TITLE) throw no;\n            return memberId + \": already in the queue, number \" + lib.position(memberId, isbn);\n        }\n    }\n    /** Scan a returned copy and say where it goes next. */\n    String giveBack(String barcode) {\n        Receipt r = lib.returnCopy(barcode);\n        return \"returned \" + barcode + (r.finePaise() > 0 ? \", fine \" + Main.rs(r.finePaise()) : \", no fine\")\n             + (r.heldFor() == null ? \", back on the shelf\" : \", set aside for \" + r.heldFor());\n    }\n}\n\n/**\n * Proof it runs: the afternoon from page 01, then two races. Fifty members want the last copy (exactly one gets\n * it), and three returns cross twenty requests (no copy on the shelf while anyone waits).\n */\npublic class Main {\n    static final ZoneId IST = ZoneId.of(\"Asia/Kolkata\");\n\n    public static void main(String[] args) throws Exception {\n        long[] now = { at(8, 29, 10, 0) };\n        Library lib = new Library(IST, 3);\n        lib.setClock(() -> now[0]);\n        lib.configure(new StandardTerms(), new CappedFine(new PerDayFine(2_000), 50_000));   // Rs 20 a day, at most Rs 500\n        lib.addListener(new NoticePrinter());\n        String cc = \"9780132350884\", ej = \"9780134685991\", ca = \"9780134494166\";\n        lib.addBook(cc, \"Clean Code\", \"Robert C. Martin\", 60_000);\n        lib.addBook(ej, \"Effective Java\", \"Joshua Bloch\", 55_000);\n        lib.addBook(ca, \"Clean Architecture\", \"Robert C. Martin\", 50_000);\n        lib.addCopy(cc, \"CC-1\"); lib.addCopy(cc, \"CC-2\"); lib.addCopy(ej, \"EJ-1\"); lib.addCopy(ca, \"CA-1\");\n        for (String id : List.of(\"asha\", \"ravi\", \"meera\", \"kabir\")) lib.register(id, id, Tier.REGULAR);\n        Desk desk = new Desk(lib);\n\n        System.out.println(\"29 Aug  \" + desk.borrow(\"asha\", cc));                 // CC-1, due 12 Sep\n        now[0] = at(9, 1, 10, 0);\n        System.out.println(\"1 Sep   \" + desk.borrow(\"ravi\", cc));                 // CC-2, the last one on the shelf\n        now[0] = at(9, 1, 10, 5);\n        System.out.println(\"1 Sep   \" + desk.borrow(\"meera\", cc));                // number 1 in the queue\n        System.out.println(\"1 Sep   \" + desk.borrow(\"kabir\", cc));                // number 2\n        try { lib.renew(\"CC-2\"); } catch (Refused r) { System.out.println(\"1 Sep   ravi renews CC-2: \" + r.why); }\n        System.out.println(\"        search 'clea': \" + lib.searchTitle(\"clea\", 10).stream().map(Found::title).toList()\n                           + \"; author 'bloch': \" + lib.searchAuthor(\"bloch\", 10).stream().map(Found::title).toList());\n\n        now[0] = at(9, 14, 17, 30);\n        System.out.println(\"14 Sep  \" + desk.giveBack(\"CC-1\"));                   // two days late: Rs 40; held for meera\n        now[0] = at(9, 18, 9, 0);\n        lib.expireHolds();                                                        // meera never came: kabir is next\n        System.out.println(\"18 Sep  kabir's hold: \" + lib.holdOf(\"kabir\", cc) + \"; on the shelf: \" + lib.onShelf(cc));\n        System.out.println(\"18 Sep  \" + desk.borrow(\"kabir\", cc));                // he collects CC-1\n        System.out.println(\"        overdue today: \" + lib.overdue().stream().map(s -> s.barcode() + \" (\" + s.memberId() + \")\").toList()\n                           + \"; asha owes \" + rs(lib.dues(\"asha\")));\n\n        races();\n    }\n\n    /** The two races. Each one checks its invariant and throws if it does not hold. */\n    static void races() throws Exception {\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n\n        // race 1: fifty members, one copy, released by one latch: exactly one loan\n        Library one = new Library(IST, 3);\n        String pp = \"9780135957059\";\n        one.addBook(pp, \"The Pragmatic Programmer\", \"David Thomas\", 70_000);\n        one.addCopy(pp, \"PP-1\");\n        for (int i = 0; i < 50; i++) one.register(\"m\" + i, \"member \" + i, Tier.REGULAR);\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<Slip>> tries = new ArrayList<>();\n        for (int i = 0; i < 50; i++) { String id = \"m\" + i; tries.add(pool.submit(() -> { go.await(); return one.checkout(id, pp); })); }\n        go.countDown();\n        int loans = 0;\n        for (Future<Slip> f : tries) { try { f.get(); loans++; } catch (ExecutionException e) { /* NOT_AVAILABLE for the other 49 */ } }\n        System.out.println(\"race 1: loans = \" + loans + \" (must be 1), on the shelf = \" + one.onShelf(pp));\n        if (loans != 1) throw new AssertionError(\"one copy lent twice\");\n\n        // race 2: three returns and twenty requests at the same instant\n        Library busy = new Library(IST, 3);\n        String dd = \"9781449373320\";\n        busy.addBook(dd, \"Designing Data-Intensive Applications\", \"Martin Kleppmann\", 90_000);\n        for (int i = 1; i <= 3; i++) busy.addCopy(dd, \"DD-\" + i);\n        for (int i = 0; i < 3; i++) { busy.register(\"b\" + i, \"borrower \" + i, Tier.REGULAR); busy.checkout(\"b\" + i, dd); }\n        for (int i = 0; i < 20; i++) busy.register(\"w\" + i, \"wants it \" + i, Tier.REGULAR);\n        Desk counter = new Desk(busy);\n        CountDownLatch start = new CountDownLatch(1);\n        List<Future<?>> jobs = new ArrayList<>();\n        for (int i = 1; i <= 3; i++) { String bc = \"DD-\" + i; jobs.add(pool.submit(() -> { start.await(); return busy.returnCopy(bc); })); }\n        for (int i = 0; i < 20; i++) { String id = \"w\" + i; jobs.add(pool.submit(() -> { start.await(); return counter.borrow(id, dd); })); }\n        start.countDown();\n        for (Future<?> f : jobs) f.get();\n        pool.shutdown();\n        int lent = 0, setAside = 0, waiting = 0;\n        for (int i = 0; i < 20; i++) {\n            if (!busy.loansOf(\"w\" + i).isEmpty()) lent++;\n            HoldSlip h = busy.holdOf(\"w\" + i, dd);\n            if (h != null && h.status() == HoldStatus.READY) setAside++;\n            if (h != null && h.status() == HoldStatus.WAITING) waiting++;\n        }\n        System.out.println(\"race 2: lent \" + lent + \", set aside \" + setAside + \", waiting \" + waiting\n                           + \", on the shelf \" + busy.onShelf(dd) + \" (served must be 3, waiting 17, shelf 0)\");\n        if (lent + setAside != 3 || waiting != 17 || busy.onShelf(dd) != 0) throw new AssertionError(\"a copy on the shelf while someone waits\");\n    }\n\n    /** Paise as rupees: 4000 -> \"Rs 40\". */\n    static String rs(long paise) { return paise % 100 == 0 ? \"Rs \" + paise / 100 : String.format(\"Rs %.2f\", paise / 100.0); }\n    /** A moment in 2026 in Kolkata, so the demo never depends on when it runs. */\n    static long at(int month, int day, int hour, int minute) {\n        return LocalDateTime.of(2026, month, day, hour, minute).atZone(IST).toInstant().toEpochMilli();\n    }\n}\n", "f1": "import java.time.*;\nimport java.time.temporal.ChronoUnit;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist; nothing here edits Main.java.\n\n// ---- ext: rules that change ----------------------------------------------------------------------------\n/** Terms per tier: a table from tier to terms. One new class; the library never opens. */\nfinal class TieredTerms implements LoanRules {\n    private final Map<Tier, Terms> table = new EnumMap<>(Map.of(\n        Tier.REGULAR, new Terms(3, 14, 2, 10_000),\n        Tier.STUDENT, new Terms(2, 14, 1, 5_000),\n        Tier.FACULTY, new Terms(10, 60, 3, 50_000)));\n    /** The row for his tier. */\n    public Terms termsFor(Member m) { return table.get(m.tier); }\n}\n\n/**\n * A grace period: a book back within `days` days of its due date costs nothing. Later than that, the wrapped rule\n * charges as usual, counted from the due date.\n */\nfinal class GraceDays implements FinePolicy {\n    private final FinePolicy base;\n    private final int days;\n    /** new GraceDays(new PerDayFine(2_000), 2): two free days. */\n    GraceDays(FinePolicy base, int days) { this.base = base; this.days = days; }\n    /** Zero inside the grace period, else whatever the wrapped rule says. */\n    public long fine(Loan loan, LocalDate returnedOn) {\n        long late = ChronoUnit.DAYS.between(loan.due, returnedOn);\n        return late <= days ? 0 : base.fine(loan, returnedOn);\n    }\n}\n\n/** Students pay half, rounded down to a whole rupee. It reads the member from the loan: no new interface needed. */\nfinal class StudentRate implements FinePolicy {\n    private final FinePolicy base;\n    /** Wraps the rule whose fine is halved for students. */\n    StudentRate(FinePolicy base) { this.base = base; }\n    /** Half for a student, the full fine for everyone else. */\n    public long fine(Loan loan, LocalDate returnedOn) {\n        long f = base.fine(loan, returnedOn);\n        return loan.member.tier == Tier.STUDENT ? f / 2 / 100 * 100 : f;\n    }\n}\n\n/** Never more than the price of the book itself: past that point the library would rather have a new copy. */\nfinal class CapAtPrice implements FinePolicy {\n    private final FinePolicy base;\n    /** Wraps the rule it caps. */\n    CapAtPrice(FinePolicy base) { this.base = base; }\n    /** The wrapped fine, or the book's price if that is smaller. */\n    public long fine(Loan loan, LocalDate returnedOn) { return Math.min(base.fine(loan, returnedOn), loan.copy.book.pricePaise); }\n}\n\n// ---- ext: ladder rung 1: search off the lock -----------------------------------------------------------\n/**\n * Rung 1: searches never take the library's lock. The catalogue changes a few times a day, so each change builds\n * a new index and swaps one volatile reference (copy-on-write: copy, change the copy, publish it in one write).\n * A search reads whichever index is current, with no lock at all. Word sets that did not change are shared.\n */\nfinal class SnapshotCatalog {\n    private volatile NavigableMap<String, Set<String>> words = Collections.emptyNavigableMap();\n    private final ReentrantLock writers = new ReentrantLock();       // two additions at once must not lose each other\n\n    /** Copy the map (not the sets), add this title's words, swap. O(words in the catalogue) per addition. */\n    void add(String isbn, String title) {\n        writers.lock();\n        try {\n            TreeMap<String, Set<String>> next = new TreeMap<>(words);\n            for (String w : TokenIndex.split(title)) {\n                Set<String> s = new TreeSet<>(next.getOrDefault(w, Set.of()));\n                s.add(isbn);\n                next.put(w, Collections.unmodifiableSet(s));\n            }\n            words = Collections.unmodifiableNavigableMap(next);      // one volatile write publishes it\n        } finally { writers.unlock(); }\n    }\n    /** No lock: one volatile read, then a walk over one range of a map nobody will ever change. */\n    List<String> find(String prefix, int limit) {\n        NavigableMap<String, Set<String>> snap = words;\n        LinkedHashSet<String> out = new LinkedHashSet<>();\n        for (Set<String> s : snap.subMap(prefix, true, prefix + Character.MAX_VALUE, true).values())\n            for (String isbn : s) { out.add(isbn); if (out.size() == limit) return new ArrayList<>(out); }\n        return new ArrayList<>(out);\n    }\n}\n\n// ---- ext: ladder rung 2: a lock per title --------------------------------------------------------------\n/**\n * Rung 2: a lock per title, so members borrowing different titles never wait for each other. The loan limit\n * spans titles, so it leaves the title lock and becomes an atomic counter per member: claim a slot first\n * (compare-and-set), then take a copy under the title's lock, and give the slot back if none was free. A call\n * holds one lock at a time, so there is no lock order to get wrong. The price: while a failed claim is being\n * given back, a second checkout by the same member may hear LIMIT_REACHED. Never the reverse.\n */\nfinal class TitleLocks {\n    private final Map<String, ReentrantLock> locks = new ConcurrentHashMap<>();\n    private final Map<String, Deque<String>> shelves = new ConcurrentHashMap<>();    // isbn -> barcodes on the shelf\n    private final Map<String, AtomicInteger> out = new ConcurrentHashMap<>();         // member -> books he has out\n    private final int maxLoans;\n    /** Every member may have maxLoans books out. */\n    TitleLocks(int maxLoans) { this.maxLoans = maxLoans; }\n\n    /** Setup: a copy on its title's shelf. */\n    void addCopy(String isbn, String barcode) {\n        withTitle(isbn, () -> shelves.computeIfAbsent(isbn, k -> new ArrayDeque<>()).offer(barcode));\n    }\n    /** Claim a slot, then a copy; no copy means the slot goes back. Returns the barcode lent. */\n    String checkout(String memberId, String isbn) {\n        AtomicInteger n = out.computeIfAbsent(memberId, k -> new AtomicInteger());\n        int had;\n        do {\n            had = n.get();\n            if (had >= maxLoans) throw new Refused(Refusal.LIMIT_REACHED, memberId);\n        } while (!n.compareAndSet(had, had + 1));                     // the slot is his\n        String copy = withTitle(isbn, () -> { Deque<String> s = shelves.get(isbn); return s == null ? null : s.poll(); });\n        if (copy == null) {\n            n.decrementAndGet();                                     // no copy: give the slot back\n            throw new Refused(Refusal.NOT_AVAILABLE, isbn);\n        }\n        return copy;\n    }\n    /** The copy goes back under its title's lock; then his slot is freed. */\n    void giveBack(String memberId, String isbn, String barcode) {\n        withTitle(isbn, () -> shelves.get(isbn).offer(barcode));\n        out.get(memberId).decrementAndGet();\n    }\n    /** How many books he has out right now. */\n    int loansOf(String memberId) { AtomicInteger n = out.get(memberId); return n == null ? 0 : n.get(); }\n    /** Run the body under this title's lock, and only that lock. */\n    private <T> T withTitle(String isbn, Supplier<T> body) {\n        ReentrantLock l = locks.computeIfAbsent(isbn, k -> new ReentrantLock());\n        l.lock();\n        try { return body.get(); } finally { l.unlock(); }\n    }\n}\n\n// ---- ext: several branches -----------------------------------------------------------------------------\n/**\n * Twenty branches, one catalogue, one queue per title across all of them. A hold names the branch where the\n * member will collect. A copy that comes back at another branch cannot go on that branch's hold shelf: it goes\n * IN_TRANSIT to his branch, and only when the van delivers it is it READY. One new state, one more hop; the rule\n * \"the queue before the shelf\" does not change.\n */\nfinal class BranchNetwork {\n    /** Where a returned copy ends up. */\n    enum Where { ON_SHELF, IN_TRANSIT, READY }\n    /** A copy's next place: at which branch, in what state, and for whom (null = nobody). */\n    record Placement(String barcode, String atBranch, Where where, String forMember) {}\n    /** One member in a title's queue, and the branch where he will collect. */\n    private record Waiter(String memberId, String pickupBranch) {}\n    private final Map<String, Deque<Waiter>> queues = new HashMap<>();     // isbn -> FIFO across all branches\n    private final ReentrantLock lock = new ReentrantLock();                // the queues are shared, so they have one owner\n\n    /** Join the title's queue, naming the branch where he will collect. */\n    void hold(String isbn, String memberId, String pickupBranch) {\n        lock.lock();\n        try { queues.computeIfAbsent(isbn, k -> new ArrayDeque<>()).offer(new Waiter(memberId, pickupBranch)); }\n        finally { lock.unlock(); }\n    }\n    /** A copy comes back at a branch: the first member waiting gets it, here or in transit to his branch; nobody waiting, this branch's shelf. */\n    Placement returned(String isbn, String barcode, String branch) {\n        lock.lock();\n        try {\n            Deque<Waiter> q = queues.get(isbn);\n            Waiter w = q == null ? null : q.poll();\n            if (w == null) return new Placement(barcode, branch, Where.ON_SHELF, null);\n            if (w.pickupBranch().equals(branch)) return new Placement(barcode, branch, Where.READY, w.memberId());\n            return new Placement(barcode, w.pickupBranch(), Where.IN_TRANSIT, w.memberId());\n        } finally { lock.unlock(); }\n    }\n    /** The van delivers: a copy in transit is now READY at its destination, and his pickup days start now. */\n    Placement arrived(Placement p) {\n        return p.where() == Where.IN_TRANSIT ? new Placement(p.barcode(), p.atBranch(), Where.READY, p.forMember()) : p;\n    }\n}\n\n// ---- ext: flipkart ids ---------------------------------------------------------------------------------\n/**\n * Flipkart's rule: a book's id is the first three letters of the author's last name plus a number: ROW1001,\n * ROW1002. One counter per prefix, created and advanced atomically, so two librarians adding Rowling books at\n * the same instant never get the same id.\n */\nfinal class BookIdGenerator {\n    private final ConcurrentHashMap<String, AtomicInteger> counters = new ConcurrentHashMap<>();\n    private final int first;\n    /** Numbers start after `first`: new BookIdGenerator(1000) gives ROW1001 first. */\n    BookIdGenerator(int first) { this.first = first; }\n    /** \"J. K. Rowling\" -> ROW1001. A last name shorter than three letters is padded with X (\"Li\" -> LIX1001). */\n    String next(String author) {\n        String[] parts = author.trim().split(\"\\\\s+\");\n        String last = parts[parts.length - 1].replaceAll(\"[^A-Za-z]\", \"\").toUpperCase(Locale.ROOT);\n        String prefix = (last + \"XXX\").substring(0, 3);\n        return prefix + counters.computeIfAbsent(prefix, k -> new AtomicInteger(first)).incrementAndGet();\n    }\n}\n\n// ---- ext: racks ----------------------------------------------------------------------------------------\n/**\n * The workat.tech version: racks numbered 1..n, and a rack holds at most one copy of any book. A new or returned\n * copy goes to the lowest-numbered rack with no copy of its book; \"borrow by book id\" takes the copy on the\n * lowest rack. Per book: a BitSet of racks in use (nextClearBit finds the first free one) and a TreeMap from rack\n * to copy (firstEntry is the lowest). The shelf's ORDER is a rule, like the parking lot's queue of free spots.\n */\nfinal class RackedShelf {\n    private final int racks;\n    private final Map<String, BitSet> used = new HashMap<>();                       // book id -> racks holding a copy of it\n    private final Map<String, TreeMap<Integer, String>> onRack = new HashMap<>();   // book id -> rack -> copy id\n    private final Map<String, String> bookOf = new HashMap<>();                     // copy id -> book id\n    private final Map<String, Integer> rackOf = new HashMap<>();                    // copy id -> its rack, while on one\n    private final Map<String, Integer> owned = new HashMap<>();                     // book id -> copies owned, borrowed ones too\n    /** A library with racks 1..racks. */\n    RackedShelf(int racks) { this.racks = racks; }\n\n    /**\n     * Add copies, all or nothing. A book can own at most one copy per rack, counting the copies that are out, because\n     * each of those must find a rack when it comes back. Returns their racks, or null (\"Rack not available\").\n     */\n    synchronized List<Integer> add(String bookId, List<String> copyIds) {\n        int have = owned.getOrDefault(bookId, 0);\n        if (have + copyIds.size() > racks) return null;\n        owned.put(bookId, have + copyIds.size());\n        List<Integer> placed = new ArrayList<>();\n        for (String c : copyIds) { bookOf.put(c, bookId); placed.add(place(bookId, c)); }\n        return placed;\n    }\n    /** Borrow by book id: the copy on the lowest rack, as \"copyId@rack\", or null (\"Not available\"). O(log racks). */\n    synchronized String borrowByBook(String bookId) {\n        TreeMap<Integer, String> m = onRack.get(bookId);\n        if (m == null || m.isEmpty()) return null;\n        Map.Entry<Integer, String> e = m.pollFirstEntry();\n        used.get(bookId).clear(e.getKey());\n        rackOf.remove(e.getValue());\n        return e.getValue() + \"@\" + e.getKey();\n    }\n    /** Borrow one named copy: take it off its rack. Returns the rack, or -1 when it is not on a rack. */\n    synchronized int borrowCopy(String copyId) {\n        Integer r = rackOf.remove(copyId);\n        if (r == null) return -1;\n        String book = bookOf.get(copyId);\n        onRack.get(book).remove(r);\n        used.get(book).clear(r);\n        return r;\n    }\n    /** A returned copy goes to the first free rack for its book. Returns that rack; a copy already on a rack stays put. */\n    synchronized int giveBack(String copyId) {\n        Integer r = rackOf.get(copyId);\n        return r != null ? r : place(bookOf.get(copyId), copyId);\n    }\n\n    /** The lowest rack with no copy of this book, found by nextClearBit from rack 1; -1 when every rack has one. */\n    private int place(String bookId, String copyId) {\n        BitSet u = used.computeIfAbsent(bookId, k -> new BitSet());\n        int r = u.nextClearBit(1);\n        if (r > racks) return -1;\n        u.set(r);\n        onRack.computeIfAbsent(bookId, k -> new TreeMap<>()).put(r, copyId);\n        rackOf.put(copyId, r);\n        return r;\n    }\n}\n\n// ---- ext: reminders and a slow sms gateway ------------------------------------------------------------\n/** The nightly job: a DUE_SOON notice for every loan due in the next `days` days. It reads one range of the due index. */\nfinal class DueSoonReminder {\n    private final Library lib;\n    private final LibraryListener out;\n    private final int days;\n    /** Remind members whose books are due within `days` days, through this listener. */\n    DueSoonReminder(Library lib, LibraryListener out, int days) { this.lib = lib; this.out = out; this.days = days; }\n    /** Send the notices; returns how many went out. */\n    int run() {\n        LocalDate today = lib.today();\n        List<Slip> soon = lib.dueBetween(today, today.plusDays(days));\n        for (Slip s : soon) out.onEvent(new LibraryEvent(EventKind.DUE_SOON, s.memberId(), s.isbn(), s.barcode(), s.due(), 0));\n        return soon.size();\n    }\n}\n\n/**\n * A listener that never makes a desk wait. onEvent only appends to a queue, which takes microseconds; a worker\n * sends the SMS at the gateway's pace, and a message the gateway refuses goes back in the queue, not in the bin.\n */\nfinal class SmsOutbox implements LibraryListener {\n    private final BlockingQueue<LibraryEvent> queue = new LinkedBlockingQueue<>();\n    final List<LibraryEvent> sent = new CopyOnWriteArrayList<>();\n    /** Called by the library after the unlock: enqueue and return. */\n    public void onEvent(LibraryEvent e) { queue.offer(e); }\n    /** The worker's loop body: try each queued message once; one the gateway refuses or throws on is queued again. */\n    int drain(Predicate<LibraryEvent> gateway) {\n        List<LibraryEvent> batch = new ArrayList<>();\n        queue.drainTo(batch);\n        int ok = 0;\n        for (LibraryEvent e : batch) {\n            boolean delivered;\n            try { delivered = gateway.test(e); } catch (RuntimeException down) { delivered = false; }\n            if (delivered) { sent.add(e); ok++; } else queue.offer(e);\n        }\n        return ok;\n    }\n    /** Messages still waiting to be sent. */\n    int pending() { return queue.size(); }\n}\n\n// ---- ext: persistence ----------------------------------------------------------------------------------\n/** The library's state behind an interface, so the services above do not change when it moves to a database. */\ninterface LibraryRepository {\n    /** Claim a copy for a member only if it is still on the shelf: true means he got it, false means someone else did. */\n    boolean claim(String barcode, String memberId, LocalDate due);\n    /** The copy is back on the shelf. */\n    void release(String barcode);\n    /** Barcodes of loans due before today, oldest first. */\n    List<String> overdue(LocalDate today);\n}\n\n/**\n * The in-memory version a test uses. The claim is a compare-and-set on the copy's row, exactly what the UPDATE\n * below does in a database. The overdue list is a scan here, which is fine for a test double; the database uses\n * the partial index on due_on.\n */\nfinal class InMemoryLibraryRepository implements LibraryRepository {\n    private final ConcurrentHashMap<String, String> holder = new ConcurrentHashMap<>();   // barcode -> \"\" on the shelf, else member id\n    private final ConcurrentHashMap<String, LocalDate> due = new ConcurrentHashMap<>();\n    /** Setup: a copy on the shelf. */\n    void addCopy(String barcode) { holder.put(barcode, \"\"); }\n    /** One atomic step decides the winner: replace \"\" with his id only if it is still \"\". */\n    public boolean claim(String barcode, String memberId, LocalDate dueOn) {\n        if (!holder.replace(barcode, \"\", memberId)) return false;\n        due.put(barcode, dueOn);\n        return true;\n    }\n    /** Back on the shelf, no longer due. */\n    public void release(String barcode) { due.remove(barcode); holder.put(barcode, \"\"); }\n    /** Loans due before today, oldest first. */\n    public List<String> overdue(LocalDate today) {\n        return due.entrySet().stream().filter(e -> e.getValue().isBefore(today))\n                  .sorted(Map.Entry.comparingByValue()).map(Map.Entry::getKey).toList();\n    }\n}\n\n/** The same design as PostgreSQL tables. Walmart asked for the schema; Bloomberg for the overdue query. */\nfinal class LibrarySql {\n    /** Five tables, three indexes. The unique index is Flipkart's \"one copy of a title per member\", enforced by the database. */\n    static final String SCHEMA = \"\"\"\n        CREATE TABLE book   (isbn VARCHAR(13) PRIMARY KEY, title TEXT NOT NULL, author TEXT NOT NULL,\n                             price_paise BIGINT NOT NULL);\n        CREATE TABLE copy   (barcode VARCHAR(20) PRIMARY KEY, isbn VARCHAR(13) NOT NULL REFERENCES book,\n                             status VARCHAR(10) NOT NULL);                 -- AVAILABLE, LOANED, ON_HOLD, LOST\n        CREATE TABLE member (id VARCHAR(20) PRIMARY KEY, name TEXT NOT NULL, tier VARCHAR(10) NOT NULL,\n                             dues_paise BIGINT NOT NULL DEFAULT 0);\n        CREATE TABLE loan   (id BIGINT PRIMARY KEY, barcode VARCHAR(20) NOT NULL REFERENCES copy,\n                             member_id VARCHAR(20) NOT NULL REFERENCES member, isbn VARCHAR(13) NOT NULL,\n                             borrowed_on DATE NOT NULL, due_on DATE NOT NULL, closed_on DATE,  -- returned or lost\n                             renewals INT NOT NULL DEFAULT 0, charged_paise BIGINT NOT NULL DEFAULT 0);\n        CREATE TABLE hold   (id BIGINT PRIMARY KEY, isbn VARCHAR(13) NOT NULL REFERENCES book,\n                             member_id VARCHAR(20) NOT NULL REFERENCES member, placed_at TIMESTAMP NOT NULL,\n                             status VARCHAR(10) NOT NULL, barcode VARCHAR(20), pickup_by DATE);\n        CREATE INDEX loan_open_by_due ON loan (due_on) WHERE closed_on IS NULL;             -- the overdue report\n        CREATE UNIQUE INDEX one_copy_each ON loan (member_id, isbn) WHERE closed_on IS NULL;\n        CREATE INDEX hold_queue ON hold (isbn, placed_at) WHERE status = 'WAITING';         -- the FIFO queue\n        \"\"\";\n    /** Bloomberg's question: who has an overdue book, which one, and how late. */\n    static final String OVERDUE = \"\"\"\n        SELECT m.id, m.name, b.title, l.barcode, l.due_on, CURRENT_DATE - l.due_on AS days_late\n        FROM loan l JOIN member m ON m.id = l.member_id JOIN book b ON b.isbn = l.isbn\n        WHERE l.closed_on IS NULL AND l.due_on < CURRENT_DATE\n        ORDER BY l.due_on\"\"\";\n    /** The checkout's claim: one row updated means the copy is his, zero means someone else got it first. */\n    static final String CLAIM = \"UPDATE copy SET status = 'LOANED' WHERE barcode = ? AND status = 'AVAILABLE'\";\n    /** Returns and holds for one title take this row lock first, so they are decided one at a time: move 4, in SQL. */\n    static final String LOCK_TITLE = \"SELECT isbn FROM book WHERE isbn = ? FOR UPDATE\";\n}\n\n// ---- ext: the copy's life as a table ------------------------------------------------------------------\n/** The copy's life as an explicit table: every move not listed throws, so a bug cannot lend a lost copy. */\nfinal class CopyLife {\n    static final Map<CopyStatus, Set<CopyStatus>> ALLOWED = new EnumMap<>(Map.of(\n        CopyStatus.AVAILABLE, EnumSet.of(CopyStatus.LOANED, CopyStatus.ON_HOLD),\n        CopyStatus.LOANED,    EnumSet.of(CopyStatus.AVAILABLE, CopyStatus.ON_HOLD, CopyStatus.LOST),\n        CopyStatus.ON_HOLD,   EnumSet.of(CopyStatus.LOANED, CopyStatus.ON_HOLD, CopyStatus.AVAILABLE),\n        CopyStatus.LOST,      EnumSet.noneOf(CopyStatus.class)));\n    /** Move a copy, or throw if the table does not allow the move. */\n    static void move(BookCopy c, CopyStatus to) {\n        if (!ALLOWED.get(c.status).contains(to))\n            throw new IllegalStateException(c.barcode + \": \" + c.status + \" -> \" + to + \" is not allowed\");\n        c.status = to;\n    }\n}\n\n// ---- ext: e-books --------------------------------------------------------------------------------------\n/**\n * An e-book: no barcode and no shelf, just N licences that may be out at once. A loan ends by itself on its due\n * date, so there is never a late fine, and the licence it frees goes straight to the first member waiting.\n * Different behaviour, so its own class, not a BookCopy subclass that would inherit a shelf it never uses.\n */\nfinal class EbookLending {\n    private final int loanDays;\n    private int free;\n    private final Deque<String> waiting = new ArrayDeque<>();\n    private final TreeMap<LocalDate, List<String>> endsOn = new TreeMap<>();   // the day loans end -> who is reading\n    private final Set<String> reading = new HashSet<>();\n    private final ReentrantLock lock = new ReentrantLock();\n    /** A title with this many licences, lent for loanDays days. */\n    EbookLending(int licences, int loanDays) { this.free = licences; this.loanDays = loanDays; }\n\n    /** Read now if a licence is free (true), else join the queue (false). Asking twice changes nothing. */\n    boolean borrow(String member, LocalDate today) {\n        lock.lock();\n        try {\n            if (reading.contains(member)) return true;\n            if (waiting.contains(member)) return false;              // a scan of the queue: a sketch, fine at a few dozen\n            if (free == 0) { waiting.offer(member); return false; }\n            lend(member, today);\n            return true;\n        } finally { lock.unlock(); }\n    }\n    /** The nightly tick: loans that ended free their licences, and each freed licence goes to the next reader in line. */\n    List<String> tick(LocalDate today) {\n        lock.lock();\n        try {\n            SortedMap<LocalDate, List<String>> ended = endsOn.headMap(today, true);\n            for (List<String> readers : ended.values()) { reading.removeAll(readers); free += readers.size(); }\n            ended.clear();\n            List<String> got = new ArrayList<>();\n            while (free > 0 && !waiting.isEmpty()) { String m = waiting.poll(); lend(m, today); got.add(m); }\n            return got;\n        } finally { lock.unlock(); }\n    }\n    /** Licences not in use. */\n    int free() { lock.lock(); try { return free; } finally { lock.unlock(); } }\n    /** One licence to this member, ending loanDays from today. */\n    private void lend(String member, LocalDate today) {\n        free--;\n        reading.add(member);\n        endsOn.computeIfAbsent(today.plusDays(loanDays), d -> new ArrayList<>()).add(member);\n    }\n}\n\n// ---- ext: items from a file ----------------------------------------------------------------------------\n/** Factory, earned only when items arrive as text: one row per item, its kind in the first column, one maker per kind. */\nfinal class CatalogImport {\n    private final Map<String, BiConsumer<Library, String[]>> makers = Map.of(\n        \"BOOK\", (lib, f) -> lib.addBook(f[1], f[2], f[3], Long.parseLong(f[4])),\n        \"COPY\", (lib, f) -> lib.addCopy(f[1], f[2]));\n    /** Apply one line such as BOOK|9780132350884|Clean Code|Robert C. Martin|60000. An unknown kind is refused. */\n    void apply(Library lib, String line) {\n        String[] f = line.split(\"\\\\|\");\n        BiConsumer<Library, String[]> make = makers.get(f[0]);\n        if (make == null) throw new IllegalArgumentException(\"unknown kind: \" + f[0]);\n        make.accept(lib, f);\n    }\n}\n\n/** Runs every extension once, so the page's follow-up code is code that has actually executed. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        long[] now = { Main.at(9, 1, 10, 0) };\n        Library lib = new Library(Main.IST, 3);\n        lib.setClock(() -> now[0]);\n        String cc = \"9780132350884\";\n        lib.addBook(cc, \"Clean Code\", \"Robert C. Martin\", 60_000);\n        lib.addCopy(cc, \"CC-1\");\n        lib.register(\"riya\", \"Riya\", Tier.STUDENT);\n        lib.register(\"prof\", \"Prof. Rao\", Tier.FACULTY);\n\n        System.out.println(\"-- rules that change: tiers, then a grace period, a student rate and a cap, wrapped\");\n        lib.configure(new TieredTerms(), new CapAtPrice(new StudentRate(new GraceDays(new PerDayFine(2_000), 2))));\n        Slip s = lib.checkout(\"riya\", cc);\n        System.out.println(\"   riya (student) borrows \" + s.barcode() + \", due \" + s.due());\n        now[0] = Main.at(9, 15 + 7, 10, 0);                                     // seven days late\n        System.out.println(\"   back 7 days late: fine \" + Main.rs(lib.returnCopy(\"CC-1\").finePaise()) + \" (7 x Rs 20, halved)\");\n\n        System.out.println(\"-- rung 1: search without the lock (copy-on-write)\");\n        SnapshotCatalog snap = new SnapshotCatalog();\n        snap.add(cc, \"Clean Code\");\n        snap.add(\"9780134494166\", \"Clean Architecture\");\n        System.out.println(\"   'clea' -> \" + snap.find(\"clea\", 10));\n\n        System.out.println(\"-- rung 2: a lock per title, the limit as an atomic counter\");\n        TitleLocks titles = new TitleLocks(2);\n        titles.addCopy(\"A\", \"A-1\"); titles.addCopy(\"B\", \"B-1\"); titles.addCopy(\"C\", \"C-1\");\n        System.out.println(\"   lent \" + titles.checkout(\"m1\", \"A\") + \" and \" + titles.checkout(\"m1\", \"B\"));\n        try { titles.checkout(\"m1\", \"C\"); } catch (Refused r) { System.out.println(\"   a third title: \" + r.why); }\n\n        System.out.println(\"-- several branches: a copy returned at the wrong branch travels\");\n        BranchNetwork net = new BranchNetwork();\n        net.hold(cc, \"meera\", \"Indiranagar\");\n        BranchNetwork.Placement p = net.returned(cc, \"CC-1\", \"Koramangala\");\n        System.out.println(\"   \" + p + \"  ->  \" + net.arrived(p));\n\n        System.out.println(\"-- Flipkart's ids\");\n        BookIdGenerator ids = new BookIdGenerator(1000);\n        System.out.println(\"   \" + ids.next(\"J. K. Rowling\") + \", \" + ids.next(\"J. K. Rowling\") + \", \" + ids.next(\"Yu Li\"));\n\n        System.out.println(\"-- workat.tech racks: first free rack, lowest rack first\");\n        RackedShelf racks = new RackedShelf(3);\n        System.out.println(\"   add 3 copies -> racks \" + racks.add(\"B1\", List.of(\"c1\", \"c2\", \"c3\")) + \"; a 4th -> \" + racks.add(\"B1\", List.of(\"c4\")));\n        System.out.println(\"   borrow by book -> \" + racks.borrowByBook(\"B1\") + \"; return c1 -> rack \" + racks.giveBack(\"c1\"));\n\n        System.out.println(\"-- reminders, and an outbox in front of a slow SMS gateway\");\n        lib.configure(new StandardTerms(), new CappedFine(new PerDayFine(2_000), 50_000));\n        lib.checkout(\"prof\", cc);                                              // due in 14 days\n        now[0] = Main.at(10, 4, 10, 0);                                        // due on the 6th: two days away\n        SmsOutbox outbox = new SmsOutbox();\n        System.out.println(\"   due-soon notices: \" + new DueSoonReminder(lib, outbox, 2).run() + \", queued \" + outbox.pending());\n        System.out.println(\"   gateway down: sent \" + outbox.drain(e -> { throw new RuntimeException(\"503\"); }) + \", still queued \" + outbox.pending());\n        System.out.println(\"   gateway up:   sent \" + outbox.drain(e -> true) + \", still queued \" + outbox.pending());\n\n        System.out.println(\"-- persistence: the claim is a compare-and-set on the row\");\n        InMemoryLibraryRepository repo = new InMemoryLibraryRepository();\n        repo.addCopy(\"CC-9\");\n        LocalDate d = LocalDate.of(2026, 9, 15);\n        System.out.println(\"   ravi claims \" + repo.claim(\"CC-9\", \"ravi\", d) + \", meera claims \" + repo.claim(\"CC-9\", \"meera\", d)\n                           + \"; overdue on 20 Sep: \" + repo.overdue(LocalDate.of(2026, 9, 20)));\n        System.out.println(\"   \" + LibrarySql.CLAIM);\n\n        System.out.println(\"-- the copy's life as a table\");\n        BookCopy lost = new BookCopy(\"X-1\", new Book(\"x\", \"x\", \"x\", 0));\n        CopyLife.move(lost, CopyStatus.LOANED);\n        CopyLife.move(lost, CopyStatus.LOST);\n        try { CopyLife.move(lost, CopyStatus.LOANED); } catch (IllegalStateException e) { System.out.println(\"   \" + e.getMessage()); }\n\n        System.out.println(\"-- e-books: licences, loans that end by themselves\");\n        EbookLending ebook = new EbookLending(1, 14);\n        LocalDate day1 = LocalDate.of(2026, 9, 1);\n        System.out.println(\"   asha reads now: \" + ebook.borrow(\"asha\", day1) + \"; ravi reads now: \" + ebook.borrow(\"ravi\", day1));\n        System.out.println(\"   15 Sep tick: licence passed to \" + ebook.tick(day1.plusDays(14)) + \", free \" + ebook.free());\n\n        System.out.println(\"-- items from a file (Factory)\");\n        CatalogImport importer = new CatalogImport();\n        importer.apply(lib, \"BOOK|9780134685991|Effective Java|Joshua Bloch|55000\");\n        importer.apply(lib, \"COPY|9780134685991|EJ-1\");\n        System.out.println(\"   imported: \" + lib.searchAuthor(\"bloch\", 5));\n    }\n}\n", "f2": "import java.time.*;\nimport java.util.*;\nimport java.util.concurrent.*;\n\n/**\n * Fourteen claims the design makes, each proven by a few lines. Run it with\n * javac Main.java Extensions.java FailureTests.java && java FailureTests\n * It prints ALL PASS, or the failures and a non-zero exit code.\n */\npublic class FailureTests {\n    static int failed = 0;\n    static final String CC = \"9780132350884\", EJ = \"9780134685991\", CA = \"9780134494166\", PP = \"9780135957059\";\n\n    /** Record one claim. Prints ok or FAIL with the claim's name. */\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? \"  ok   \" : \"  FAIL \") + what);\n        if (!ok) failed++;\n    }\n    /** The reason a call was refused, or null if it went through. */\n    static Refusal refusal(Runnable r) {\n        try { r.run(); return null; } catch (Refused e) { return e.why; }\n    }\n    /** 10:00 on a day of September 2026 in Kolkata; day 31 and later roll into October. */\n    static long day(int d) { return Main.at(9, 1, 10, 0) + (d - 1) * 86_400_000L; }\n    /** A library on the test's clock: four titles, no copies yet, and the members named. */\n    static Library fresh(long[] now, String... memberIds) {\n        Library lib = new Library(Main.IST, 3);\n        lib.setClock(() -> now[0]);\n        lib.configure(new StandardTerms(), new CappedFine(new PerDayFine(2_000), 50_000));\n        lib.addBook(CC, \"Clean Code\", \"Robert C. Martin\", 60_000);\n        lib.addBook(EJ, \"Effective Java\", \"Joshua Bloch\", 55_000);\n        lib.addBook(CA, \"Clean Architecture\", \"Robert C. Martin\", 50_000);\n        lib.addBook(PP, \"The Pragmatic Programmer\", \"David Thomas\", 70_000);\n        for (String id : memberIds) lib.register(id, id, Tier.REGULAR);\n        return lib;\n    }\n    /** A listener that remembers what it heard; safe to call from many threads. */\n    static final class Heard implements LibraryListener {\n        final List<LibraryEvent> events = new CopyOnWriteArrayList<>();\n        public void onEvent(LibraryEvent e) { events.add(e); }\n        /** Did this member get a notice of this kind? */\n        boolean got(EventKind k, String member) { return events.stream().anyMatch(e -> e.kind() == k && e.memberId().equals(member)); }\n    }\n\n    public static void main(String[] args) throws Exception {\n        // 1. the last copy: fifty members at one latch, exactly one loan\n        System.out.println(\"1. fifty members, one copy\");\n        long[] t1 = { day(1) };\n        List<String> fifty = new ArrayList<>();\n        for (int i = 0; i < 50; i++) fifty.add(\"m\" + i);\n        Library one = fresh(t1, fifty.toArray(new String[0]));\n        one.addCopy(PP, \"PP-1\");\n        CountDownLatch go = new CountDownLatch(1);\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        List<Future<Refusal>> tries = new ArrayList<>();\n        for (String id : fifty) tries.add(pool.submit(() -> { go.await(); return refusal(() -> one.checkout(id, PP)); }));\n        go.countDown();\n        int won = 0, notAvailable = 0;\n        for (Future<Refusal> f : tries) { Refusal r = f.get(); if (r == null) won++; else if (r == Refusal.NOT_AVAILABLE) notAvailable++; }\n        check(won == 1 && notAvailable == 49, \"exactly one loan; the other 49 were told NOT_AVAILABLE\");\n        check(one.onShelf(PP) == 0 && one.status(\"PP-1\") == CopyStatus.LOANED, \"the shelf is empty and the copy is LOANED, not lost\");\n        check(one.borrowersOf(PP).size() == 1, \"and exactly one member has it\");\n\n        // 2. three returns cross twenty requests: no copy on the shelf while anyone waits, in every round\n        System.out.println(\"2. returns racing requests, 30 rounds\");\n        boolean allHeld = true;\n        for (int round = 0; round < 30; round++) {\n            long[] t2 = { day(10) };\n            Library busy = fresh(t2);\n            for (int i = 1; i <= 3; i++) busy.addCopy(CA, \"CA-\" + i);\n            for (int i = 0; i < 3; i++) { busy.register(\"b\" + i, \"b\", Tier.REGULAR); busy.checkout(\"b\" + i, CA); }\n            for (int i = 0; i < 20; i++) busy.register(\"w\" + i, \"w\", Tier.REGULAR);\n            Desk desk = new Desk(busy);\n            CountDownLatch start = new CountDownLatch(1);\n            List<Future<?>> jobs = new ArrayList<>();\n            for (int i = 1; i <= 3; i++) { String bc = \"CA-\" + i; jobs.add(pool.submit(() -> { start.await(); return busy.returnCopy(bc); })); }\n            for (int i = 0; i < 20; i++) { String id = \"w\" + i; jobs.add(pool.submit(() -> { start.await(); return desk.borrow(id, CA); })); }\n            start.countDown();\n            for (Future<?> f : jobs) f.get();\n            int served = 0, waiting = 0, both = 0;\n            for (int i = 0; i < 20; i++) {\n                boolean lent = !busy.loansOf(\"w\" + i).isEmpty();\n                HoldSlip h = busy.holdOf(\"w\" + i, CA);\n                if (lent) served++;\n                if (h != null && h.status() == HoldStatus.READY) served++;\n                if (h != null && h.status() == HoldStatus.WAITING) waiting++;\n                if (lent && h != null) both++;\n            }\n            if (served != 3 || waiting != 17 || both != 0 || busy.onShelf(CA) != 0) allHeld = false;\n        }\n        check(allHeld, \"every round: 3 members served, 17 waiting, nobody served twice, 0 copies on the shelf\");\n\n        // 3. the limit, and one copy of a title per member\n        System.out.println(\"3. the limit\");\n        long[] t3 = { day(1) };\n        Library lim = fresh(t3, \"ravi\");\n        lim.addCopy(CC, \"CC-1\"); lim.addCopy(CC, \"CC-2\"); lim.addCopy(EJ, \"EJ-1\"); lim.addCopy(CA, \"CA-1\"); lim.addCopy(PP, \"PP-1\");\n        lim.checkout(\"ravi\", CC); lim.checkout(\"ravi\", EJ); lim.checkout(\"ravi\", CA);\n        check(refusal(() -> lim.checkout(\"ravi\", PP)) == Refusal.LIMIT_REACHED, \"a fourth book is refused: LIMIT_REACHED\");\n        check(lim.onShelf(PP) == 1, \"and the refused copy never left the shelf\");\n        lim.returnCopy(\"EJ-1\");\n        check(refusal(() -> lim.checkout(\"ravi\", CC)) == Refusal.ALREADY_HAS_TITLE, \"a second Clean Code is refused although CC-2 is on the shelf\");\n        check(refusal(() -> lim.checkout(\"ravi\", PP)) == null, \"after one return, the fourth title goes through\");\n\n        // 4. the FIFO queue: a returned copy goes to the first in line, never to the shelf or a stranger\n        System.out.println(\"4. the queue\");\n        long[] t4 = { day(1) };\n        Library q = fresh(t4, \"asha\", \"meera\", \"kabir\", \"ravi\", \"dev\");\n        q.addCopy(CC, \"CC-1\");\n        q.checkout(\"asha\", CC);\n        q.placeHold(\"meera\", CC); q.placeHold(\"kabir\", CC); q.placeHold(\"ravi\", CC);\n        check(q.position(\"meera\", CC) == 1 && q.position(\"kabir\", CC) == 2 && q.position(\"ravi\", CC) == 3, \"positions 1, 2, 3 in the order they asked\");\n        List<String> order = new ArrayList<>();\n        order.add(q.returnCopy(\"CC-1\").heldFor());\n        check(q.onShelf(CC) == 0 && q.status(\"CC-1\") == CopyStatus.ON_HOLD, \"the returned copy skips the shelf\");\n        check(refusal(() -> q.checkout(\"dev\", CC)) == Refusal.NOT_AVAILABLE, \"a walk-in cannot borrow the copy set aside for meera\");\n        check(refusal(() -> q.checkout(\"kabir\", CC)) == Refusal.NOT_AVAILABLE, \"nor can kabir, who is second\");\n        q.checkout(\"meera\", CC); order.add(q.returnCopy(\"CC-1\").heldFor());\n        q.checkout(\"kabir\", CC); order.add(q.returnCopy(\"CC-1\").heldFor());\n        q.checkout(\"ravi\", CC);  order.add(q.returnCopy(\"CC-1\").heldFor());\n        check(order.equals(Arrays.asList(\"meera\", \"kabir\", \"ravi\", null)), \"served meera, kabir, ravi, then the shelf: \" + order);\n        check(q.onShelf(CC) == 1, \"with nobody left waiting, the copy is on the shelf\");\n\n        // 5. the pickup date: the copy waits three days, then moves to the next member, then to the shelf\n        System.out.println(\"5. he never collects it\");\n        long[] t5 = { day(10) };\n        Library pick = fresh(t5, \"asha\", \"meera\", \"kabir\");\n        Heard heard5 = new Heard();\n        pick.addListener(heard5);\n        pick.addCopy(CC, \"CC-1\");\n        pick.checkout(\"asha\", CC);\n        pick.placeHold(\"meera\", CC); pick.placeHold(\"kabir\", CC);\n        t5[0] = day(14);\n        pick.returnCopy(\"CC-1\");\n        check(pick.holdOf(\"meera\", CC).pickupBy().equals(LocalDate.of(2026, 9, 17)), \"set aside for meera until the 17th\");\n        t5[0] = day(17);\n        check(pick.holdOf(\"meera\", CC).status() == HoldStatus.READY, \"on the 17th it is still hers\");\n        t5[0] = day(18);\n        check(pick.holdOf(\"meera\", CC) == null && pick.holdOf(\"kabir\", CC).status() == HoldStatus.READY,\n              \"on the 18th the first call hands it to kabir; no timer thread, no sleep\");\n        check(heard5.got(EventKind.HOLD_EXPIRED, \"meera\") && heard5.got(EventKind.HOLD_READY, \"kabir\"), \"meera hears it expired, kabir hears it is ready\");\n        t5[0] = day(22);\n        check(pick.onShelf(CC) == 1 && pick.status(\"CC-1\") == CopyStatus.AVAILABLE, \"kabir never came either and nobody waits: back on the shelf\");\n\n        // 6. renewal: refused while others wait, beyond two renewals, and when overdue\n        System.out.println(\"6. renewal\");\n        long[] t6 = { day(1) };\n        Library ren = fresh(t6, \"ravi\", \"asha\", \"meera\");\n        ren.addCopy(EJ, \"EJ-1\"); ren.addCopy(CC, \"CC-1\");\n        ren.checkout(\"ravi\", EJ);                                                  // due the 15th\n        t6[0] = day(10);\n        check(ren.renew(\"EJ-1\").due().equals(LocalDate.of(2026, 9, 29)), \"renewed on the 10th: due the 15th becomes the 29th\");\n        t6[0] = day(16);\n        check(ren.overdue().isEmpty(), \"on the 16th it is not overdue: the loan moved in the due index\");\n        check(ren.renew(\"EJ-1\").due().equals(LocalDate.of(2026, 10, 13)), \"a second renewal: the 13th of October\");\n        check(refusal(() -> ren.renew(\"EJ-1\")) == Refusal.RENEWAL_LIMIT, \"a third is refused\");\n        ren.checkout(\"asha\", CC);\n        ren.placeHold(\"meera\", CC);\n        check(refusal(() -> ren.renew(\"CC-1\")) == Refusal.OTHERS_WAITING, \"asha cannot renew while meera waits\");\n        ren.cancelHold(\"meera\", CC);\n        t6[0] = day(40);\n        check(refusal(() -> ren.renew(\"CC-1\")) == Refusal.OVERDUE, \"and an overdue book is not renewed: return it and pay\");\n\n        // 7. fines: the due date is free, then Rs 20 a day, never more than Rs 500; owing more than Rs 100 blocks borrowing\n        System.out.println(\"7. fines\");\n        long[] t7 = { day(1) };\n        Library fin = fresh(t7, \"asha\");\n        fin.addCopy(PP, \"PP-1\");\n        fin.checkout(\"asha\", PP);                                                  // due the 15th\n        t7[0] = day(15);\n        check(fin.returnCopy(\"PP-1\").finePaise() == 0, \"back on the due date: no fine\");\n        fin.checkout(\"asha\", PP);                                                  // due the 29th\n        t7[0] = day(30);\n        check(fin.returnCopy(\"PP-1\").finePaise() == 2_000, \"one day late: Rs 20\");\n        fin.checkout(\"asha\", PP);                                                  // due the 14th of October\n        t7[0] = day(44 + 40);\n        check(fin.returnCopy(\"PP-1\").finePaise() == 50_000, \"forty days late: capped at Rs 500, not Rs 800\");\n        check(fin.dues(\"asha\") == 52_000, \"both fines are on her account: Rs 520\");\n        check(refusal(() -> fin.checkout(\"asha\", PP)) == Refusal.OWES_FINES, \"owing more than Rs 100, she cannot borrow\");\n        boolean badAmount = false;\n        try { fin.payFine(\"asha\", 0); } catch (IllegalArgumentException e) { badAmount = true; }\n        fin.payFine(\"asha\", 52_000);\n        check(badAmount && fin.dues(\"asha\") == 0 && refusal(() -> fin.checkout(\"asha\", PP)) == null, \"a zero payment is refused; once she pays, she borrows\");\n\n        // 8. the fine rule throws halfway through a return: nothing changed, the retry charges once\n        System.out.println(\"8. a broken fine rule, and a double scan\");\n        long[] t8 = { day(1) };\n        Library brk = fresh(t8, \"asha\", \"meera\");\n        brk.addCopy(CC, \"CC-1\");\n        brk.checkout(\"asha\", CC);\n        brk.placeHold(\"meera\", CC);\n        brk.configure(new StandardTerms(), (loan, d) -> { throw new RuntimeException(\"holiday calendar is down\"); });\n        t8[0] = day(17);\n        boolean threw = false;\n        try { brk.returnCopy(\"CC-1\"); } catch (RuntimeException e) { threw = true; }\n        check(threw && brk.loansOf(\"asha\").size() == 1 && brk.status(\"CC-1\") == CopyStatus.LOANED, \"the return failed and the book is still on asha's card\");\n        check(brk.position(\"meera\", CC) == 1 && brk.dues(\"asha\") == 0, \"meera is still first in line; asha owes nothing yet\");\n        brk.configure(new StandardTerms(), (loan, d) -> -500);                    // a rule that would pay the member\n        boolean refusedNegative = false;\n        try { brk.returnCopy(\"CC-1\"); } catch (IllegalStateException e) { refusedNegative = true; }\n        check(refusedNegative && brk.dues(\"asha\") == 0 && brk.status(\"CC-1\") == CopyStatus.LOANED, \"a rule that returns a negative fine is refused too, and changes nothing\");\n        brk.configure(new StandardTerms(), new CappedFine(new PerDayFine(2_000), 50_000));\n        Receipt r8 = brk.returnCopy(\"CC-1\");\n        check(r8.finePaise() == 4_000 && \"meera\".equals(r8.heldFor()), \"the retry: Rs 40 for two days, and the copy goes to meera\");\n        check(refusal(() -> brk.returnCopy(\"CC-1\")) == Refusal.NOT_ON_LOAN && brk.dues(\"asha\") == 4_000, \"a second scan is refused: no second fine\");\n\n        // 9. listeners: a broken one cannot stop a return or the others; they run after the unlock\n        System.out.println(\"9. listeners\");\n        long[] t9 = { day(1) };\n        Library lis = fresh(t9, \"asha\", \"meera\");\n        lis.addListener(e -> { throw new RuntimeException(\"SMS gateway is down\"); });\n        Heard heard9 = new Heard();\n        lis.addListener(heard9);\n        final boolean[] readable = { false };\n        lis.addListener(e -> {                                                     // a listener that asks the library, from another thread\n            FutureTask<Integer> ask = new FutureTask<>(() -> lis.onShelf(CC));\n            new Thread(ask).start();\n            try { readable[0] = ask.get(1, TimeUnit.SECONDS) == 0; } catch (Exception x) { readable[0] = false; }\n        });\n        lis.addCopy(CC, \"CC-1\");\n        lis.checkout(\"asha\", CC);\n        lis.placeHold(\"meera\", CC);\n        Receipt r9 = lis.returnCopy(\"CC-1\");\n        check(\"meera\".equals(r9.heldFor()) && heard9.got(EventKind.HOLD_READY, \"meera\"), \"the SMS listener threw, the return still went through, the next listener still heard\");\n        check(readable[0], \"a listener can read the library: it is called after the unlock, not inside it\");\n\n        // 10. every path that frees a copy puts the queue before the shelf\n        System.out.println(\"10. every way a copy frees up\");\n        long[] t10 = { day(1) };\n        Library paths = fresh(t10, \"asha\", \"meera\", \"kabir\", \"ravi\", \"dev\");\n        paths.addCopy(CC, \"CC-1\");\n        paths.checkout(\"asha\", CC);\n        paths.placeHold(\"meera\", CC); paths.placeHold(\"kabir\", CC); paths.placeHold(\"ravi\", CC);\n        paths.cancelHold(\"meera\", CC);\n        check(\"kabir\".equals(paths.returnCopy(\"CC-1\").heldFor()), \"a cancelled hold is skipped: the copy goes to kabir\");\n        paths.cancelHold(\"kabir\", CC);\n        check(paths.holdOf(\"ravi\", CC).status() == HoldStatus.READY, \"kabir cancels his READY hold: the copy moves on to ravi\");\n        check(refusal(() -> paths.unregister(\"ravi\")) == null && paths.onShelf(CC) == 1, \"ravi leaves: his copy goes back on the shelf, nobody waits\");\n        paths.checkout(\"dev\", CC);\n        paths.placeHold(\"asha\", CC);\n        paths.addCopy(CC, \"CC-2\");\n        check(paths.holdOf(\"asha\", CC).status() == HoldStatus.READY && paths.onShelf(CC) == 0, \"a new copy goes to asha, who was waiting, not to the shelf\");\n        check(refusal(() -> paths.unregister(\"dev\")) == Refusal.HAS_LOANS, \"dev cannot leave with a book out\");\n\n        // 11. a lost book: the price plus the fine so far; the queue keeps its places for the next copy\n        System.out.println(\"11. a lost book\");\n        long[] t11 = { day(1) };\n        Library lost = fresh(t11, \"asha\", \"meera\");\n        lost.addCopy(PP, \"PP-1\");\n        lost.checkout(\"asha\", PP);                                                 // due the 15th\n        lost.placeHold(\"meera\", PP);\n        t11[0] = day(20);\n        check(lost.reportLost(\"PP-1\") == 70_000 + 5 * 2_000, \"lost on the 20th: Rs 700 for the book + Rs 100 for five days\");\n        check(lost.status(\"PP-1\") == CopyStatus.LOST && lost.loansOf(\"asha\").isEmpty(), \"the copy is out of circulation and her slot is free\");\n        check(lost.position(\"meera\", PP) == 1, \"meera keeps her place\");\n        lost.addCopy(PP, \"PP-2\");\n        check(lost.holdOf(\"meera\", PP).status() == HoldStatus.READY, \"and the replacement copy goes straight to her\");\n\n        // 12. search: word prefixes, both fields, the limit, any case\n        System.out.println(\"12. search\");\n        long[] t12 = { day(1) };\n        Library cat = fresh(t12);\n        cat.addCopy(CC, \"CC-1\"); cat.addCopy(CC, \"CC-2\");\n        check(cat.searchTitle(\"clea\", 10).stream().map(Found::title).toList().equals(List.of(\"Clean Code\", \"Clean Architecture\")), \"'clea' finds both Clean books\");\n        check(cat.searchTitle(\"CLEAN co\", 10).stream().map(Found::title).toList().equals(List.of(\"Clean Code\")), \"'CLEAN co' finds only Clean Code\");\n        check(cat.searchTitle(\"clean\", 1).size() == 1 && cat.searchTitle(\"\", 5).isEmpty() && cat.searchTitle(\"zzz\", 5).isEmpty(), \"the limit holds; empty and unknown queries find nothing\");\n        check(cat.searchAuthor(\"mart\", 10).size() == 2 && cat.searchAuthor(\"bloch\", 10).get(0).title().equals(\"Effective Java\"), \"author prefixes: 'mart' finds Robert C. Martin twice\");\n        check(cat.searchTitle(\"clean code\", 5).get(0).onShelf() == 2, \"a hit says how many copies are on the shelf\");\n\n        // 13. the follow-ups keep their own promises (Extensions.java)\n        System.out.println(\"13. follow-ups: rules, ids, racks, locks\");\n        long[] t13 = { day(1) };\n        Library ext = fresh(t13);\n        ext.register(\"riya\", \"Riya\", Tier.STUDENT);\n        ext.register(\"ravi\", \"Ravi\", Tier.REGULAR);\n        ext.configure(new TieredTerms(), new CapAtPrice(new StudentRate(new GraceDays(new PerDayFine(2_000), 2))));\n        ext.addCopy(CC, \"CC-1\"); ext.addCopy(EJ, \"EJ-1\"); ext.addCopy(CA, \"CA-1\"); ext.addCopy(PP, \"PP-1\");\n        ext.checkout(\"riya\", CC); ext.checkout(\"riya\", EJ);\n        check(refusal(() -> ext.checkout(\"riya\", CA)) == Refusal.LIMIT_REACHED, \"a student may have two books, not three\");\n        ext.checkout(\"ravi\", CA);\n        t13[0] = day(17);                                                          // two days late\n        check(ext.returnCopy(\"CA-1\").finePaise() == 0, \"two days late is inside the grace period: no fine\");\n        t13[0] = day(22);                                                          // seven days late\n        check(ext.returnCopy(\"CC-1\").finePaise() == 7_000, \"a student seven days late pays half of Rs 140: Rs 70\");\n        ext.checkout(\"ravi\", PP);                                                  // due the 5th of October\n        t13[0] = day(35 + 400);\n        check(ext.returnCopy(\"PP-1\").finePaise() == 70_000, \"four hundred days late: capped at the book's price, Rs 700\");\n        BookIdGenerator gen = new BookIdGenerator(1000);\n        Set<String> made = ConcurrentHashMap.newKeySet();\n        List<Future<?>> adds = new ArrayList<>();\n        for (int i = 0; i < 1_000; i++) adds.add(pool.submit(() -> made.add(gen.next(\"J. K. Rowling\"))));\n        for (Future<?> f : adds) f.get();\n        check(made.size() == 1_000 && made.contains(\"ROW1001\") && made.contains(\"ROW2000\"), \"1,000 Rowling books added at once: 1,000 different ids, ROW1001 to ROW2000\");\n        RackedShelf racks = new RackedShelf(3);\n        check(racks.add(\"B1\", List.of(\"c1\", \"c2\")).equals(List.of(1, 2)) && racks.add(\"B1\", List.of(\"c3\", \"c4\")) == null,\n              \"racks: copies go to racks 1 and 2; two more do not fit and none is placed\");\n        check(racks.borrowByBook(\"B1\").equals(\"c1@1\") && racks.giveBack(\"c1\") == 1, \"borrow by book id takes rack 1; the return goes back to rack 1\");\n        racks.borrowByBook(\"B1\");                                                  // c1 is out again: rack 1 is empty\n        check(racks.add(\"B1\", List.of(\"c3\")) != null && racks.add(\"B1\", List.of(\"c5\")) == null && racks.giveBack(\"c1\") > 0,\n              \"with c1 out, a third copy fits but a fourth is refused, so c1 still finds a rack when it comes back\");\n        TitleLocks titles = new TitleLocks(3);\n        titles.addCopy(\"T\", \"T-1\");\n        List<Future<Refusal>> grab = new ArrayList<>();\n        CountDownLatch go13 = new CountDownLatch(1);\n        for (int i = 0; i < 40; i++) { String id = \"p\" + i; grab.add(pool.submit(() -> { go13.await(); return refusal(() -> titles.checkout(id, \"T\")); })); }\n        go13.countDown();\n        int got = 0, slots = 0;\n        for (Future<Refusal> f : grab) if (f.get() == null) got++;\n        for (int i = 0; i < 40; i++) slots += titles.loansOf(\"p\" + i);\n        check(got == 1 && slots == 1, \"a lock per title: forty members, one copy, one loan, and the 39 losers gave their slots back\");\n        for (int i = 0; i < 5; i++) titles.addCopy(\"S\" + i, \"S\" + i + \"-1\");\n        List<Future<Refusal>> spree = new ArrayList<>();\n        for (int i = 0; i < 5; i++) { String isbn = \"S\" + i; spree.add(pool.submit(() -> refusal(() -> titles.checkout(\"greedy\", isbn)))); }\n        int greedyGot = 0;\n        for (Future<Refusal> f : spree) if (f.get() == null) greedyGot++;\n        check(greedyGot == 3 && titles.loansOf(\"greedy\") == 3, \"one member, five titles at once, limit three: exactly three loans\");\n\n        // 14. more follow-ups: branches, reminders, the outbox, persistence, the copy's table, e-books\n        System.out.println(\"14. follow-ups: branches, reminders, storage, e-books\");\n        BranchNetwork net = new BranchNetwork();\n        net.hold(CC, \"meera\", \"Indiranagar\");\n        BranchNetwork.Placement p = net.returned(CC, \"CC-1\", \"Koramangala\");\n        check(p.where() == BranchNetwork.Where.IN_TRANSIT && p.atBranch().equals(\"Indiranagar\") && net.arrived(p).where() == BranchNetwork.Where.READY,\n              \"returned at the wrong branch: in transit to meera's branch, READY when it arrives\");\n        check(net.returned(CC, \"CC-2\", \"Koramangala\").where() == BranchNetwork.Where.ON_SHELF, \"with nobody waiting, it stays on this branch's shelf\");\n        long[] t14 = { day(1) };\n        Library rem = fresh(t14, \"asha\", \"ravi\");\n        rem.addCopy(CC, \"CC-1\"); rem.addCopy(EJ, \"EJ-1\");\n        rem.checkout(\"asha\", CC);                                                  // due the 15th\n        t14[0] = day(3);\n        rem.checkout(\"ravi\", EJ);                                                  // due the 17th\n        t14[0] = day(13);\n        Heard due = new Heard();\n        check(new DueSoonReminder(rem, due, 2).run() == 1 && due.got(EventKind.DUE_SOON, \"asha\"), \"on the 13th only asha's book (due the 15th) is within two days\");\n        SmsOutbox outbox = new SmsOutbox();\n        outbox.onEvent(new LibraryEvent(EventKind.HOLD_READY, \"meera\", CC, \"CC-1\", LocalDate.of(2026, 9, 17), 0));\n        check(outbox.drain(e -> { throw new RuntimeException(\"503\"); }) == 0 && outbox.pending() == 1, \"the gateway is down: the message stays queued\");\n        check(outbox.drain(e -> true) == 1 && outbox.pending() == 0, \"the gateway is back: it is sent once\");\n        InMemoryLibraryRepository repo = new InMemoryLibraryRepository();\n        repo.addCopy(\"CC-9\");\n        List<Future<Boolean>> claims = new ArrayList<>();\n        CountDownLatch go14 = new CountDownLatch(1);\n        for (int i = 0; i < 50; i++) { String id = \"c\" + i; claims.add(pool.submit(() -> { go14.await(); return repo.claim(\"CC-9\", id, LocalDate.of(2026, 9, 15)); })); }\n        go14.countDown();\n        int claimed = 0;\n        for (Future<Boolean> f : claims) if (f.get()) claimed++;\n        check(claimed == 1 && repo.overdue(LocalDate.of(2026, 9, 16)).equals(List.of(\"CC-9\")), \"fifty claims on one row: one wins; the overdue list finds it\");\n        BookCopy odd = new BookCopy(\"X-1\", new Book(\"x\", \"x\", \"x\", 0));\n        CopyLife.move(odd, CopyStatus.LOANED);\n        CopyLife.move(odd, CopyStatus.LOST);\n        boolean refusedMove = false;\n        try { CopyLife.move(odd, CopyStatus.LOANED); } catch (IllegalStateException e) { refusedMove = true; }\n        check(refusedMove, \"the copy's table refuses to lend a lost copy\");\n        EbookLending ebook = new EbookLending(2, 14);\n        LocalDate d1 = LocalDate.of(2026, 9, 1);\n        boolean a = ebook.borrow(\"asha\", d1), b = ebook.borrow(\"ravi\", d1), c = ebook.borrow(\"meera\", d1);\n        check(a && b && !c && ebook.free() == 0, \"two licences: asha and ravi read, meera waits\");\n        check(ebook.tick(d1.plusDays(13)).isEmpty() && ebook.tick(d1.plusDays(14)).equals(List.of(\"meera\")) && ebook.free() == 1,\n              \"on day 14 both loans end by themselves; one licence goes to meera, one is free\");\n        pool.shutdown();\n\n        System.out.println(failed == 0 ? \"ALL PASS\" : failed + \" FAILED\");\n        if (failed > 0) System.exit(1);\n    }\n}\n"};
function wireCopy(root){root.querySelectorAll('button.copy').forEach(b=>{b.onclick=()=>{const key=b.dataset.key;const txt=key?RAW[key]:b.closest('.ed').querySelector('code').textContent;navigator.clipboard.writeText(txt).then(()=>{b.textContent='copied';setTimeout(()=>b.textContent='copy',1500);});};});}
const KW=/\b(abstract|boolean|break|case|catch|class|continue|default|do|double|else|enum|extends|final|finally|for|if|implements|import|int|interface|long|new|null|package|private|protected|public|return|static|super|switch|synchronized|this|throw|throws|try|void|while|var|record|true|false)\b/g;
const TY=/\b([A-Z][A-Za-z0-9]*)\b/g;
function hl(src){let inDoc=false;return src.split('\n').map((l,i)=>{let e=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const t=e.trim();let out;if(inDoc||t.startsWith('/**')){out='<span class="d">'+e+'</span>';if(t.startsWith('/**'))inDoc=!t.endsWith('*/');else if(t.endsWith('*/'))inDoc=false;}else{const parts=e.split(/(\/\/.*$|"(?:[^"\\]|\\.)*")/);out=parts.map((p,j)=>j%2?(p.startsWith('//')?'<span class="c">'+p+'</span>':'<span class="s">'+p+'</span>'):p.replace(KW,'<span class="k">$1</span>').replace(TY,'<span class="t">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>')).join('');}return '<span class="ln">'+(i+1)+'</span>'+out;}).join('\n');}
let cur=parseInt(localStorage.getItem('library.step')||'1',10);
const side=document.getElementById('side'),study=document.getElementById('study');
function classesSoFar_unused(n){const out=[];STEPS.filter(s=>s.id<=n&&s.code).forEach(s=>{(s.code.match(/(?:class|interface|enum)\s+([A-Z]\w*)/g)||[]).forEach(m=>out.push({name:m.split(/\s+/)[1],step:s.id}));});return out;}
function render(){
  side.innerHTML='';let g='';STEPS.forEach(s=>{if(s.stage!==g){g=s.stage;side.insertAdjacentHTML('beforeend','<div class="grp">'+g+'</div>');}side.insertAdjacentHTML('beforeend','<div class="st'+(s.id===cur?' on':s.id<cur?' done':'')+'" data-id="'+s.id+'"><span class="n">'+String(s.id).padStart(2,'0')+'</span><span>'+s.title+'</span></div>');});
  const s=STEPS[cur-1];
  study.innerHTML='<div class="hdr"><span class="stage">'+s.stage+'</span><h2>'+String(s.id).padStart(2,'0')+' &middot; '+s.title+'</h2></div>'+(s.think?'<div class="think">'+s.think+'</div>':'')+(s.body||'')+(s.code?'<div class="ed"><div class="tab"><b>'+(s.file||'Main.java')+'</b><button class="copy" data-src="ed">copy</button></div><pre><code class="java">'+hl(s.code)+'</code></pre></div>':'')+'<div class="nav"><button id="prev">&larr; prev</button><button id="next" class="pri">next &rarr;</button></div>';
  study.querySelectorAll('pre code.java').forEach(el=>{el.innerHTML=hl(el.textContent);});wireCopy(study);wireTimers(study);const miss=document.getElementById('miss');if(miss){try{miss.value=localStorage.getItem('library.miss')||'';}catch(e){}miss.addEventListener('input',()=>{try{localStorage.setItem('library.miss',miss.value);}catch(e){}});}
  document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
  document.querySelector('.wrap').classList.toggle('wide',!!s.wide);document.querySelector('.wrap').classList.toggle('code',!!s.code);localStorage.setItem('library.step',cur);study.scrollIntoView();
}
function go(n){if(n<1||n>STEPS.length)return;cur=n;setMode('study');render();}
side.addEventListener('click',e=>{const t=e.target.closest('.st');if(t)go(+t.dataset.id);});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
const main=document.getElementById('main');
function setMode(m){}
function wireTimers(root){root.querySelectorAll('button.timer[data-min]').forEach(b=>{const total=+b.dataset.min*60;let left=total,id=null;const show=()=>{b.textContent=(id?'':'start ')+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');};b.onclick=()=>{if(id){clearInterval(id);id=null;b.classList.remove('run');show();return;}if(left<=0)left=total;b.classList.remove('done');b.classList.add('run');id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;b.classList.remove('run');b.classList.add('done');b.textContent='time -- open the fold';}},1000);show();};show();});}
render();

   if (fine &gt; 0) {\n                loan.member.duesPaise += fine;\n                call.events().add(new LibraryEvent(EventKind.FINE_CHARGED, loan.member.id, loan.copy.book.isbn, barcode, call.today(), fine));\n            }\n            String heldFor = placeCopy(loan.copy, call);                      // the queue before the shelf\n            return new Receipt(barcode, fine, heldFor);\n        });\n    }\n\n    /**\n     * The one way in. Lock; hand on held copies whose pickup date has passed; run the body; unlock; then tell the\n     * listeners. The notices go out even when the body refused, because the sweep may already have set a copy\n     * aside for someone, and he must hear about it.\n     */\n    private &lt;T&gt; T locked(Function&lt;Call, T&gt; body) {\n        List&lt;LibraryEvent&gt; events = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            Call call = new Call(today(), events);\n            sweep(call);\n            return body.apply(call);\n        } finally {\n            lock.unlock();\n            publish(events);                                               // after the unlock: a slow listener holds up nobody\n        }\n    }\n\n    /** Ask the handed-in fine rule, and refuse an answer below zero: a broken rule must not pay the member. */\n    private long fineFor(Loan loan, LocalDate day) {\n        long fine = fines.fine(loan, day);\n        if (fine &lt; 0) throw new IllegalStateException(&quot;a fine rule returned &quot; + fine);\n        return fine;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; Every copy is out and three people want it. What happens when a copy comes back, and when the first never collects it?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A hold joins the back of its title's queue, a deque, and gets a position. When a copy comes back, <code>placeCopy</code> takes the first hold still WAITING and sets the copy aside for that member: status ON_HOLD, a pickup date three days away, and a HOLD_READY notice after the unlock. The copy never touches the shelf, so a walk-in cannot take it, and neither can the second person in line. If the member never comes, nothing has to wake up to notice. The READY holds sit in a heap ordered by pickup date, and every call first peeks at its head. Once that date has passed, the hold becomes EXPIRED and the copy goes through <code>placeCopy</code> again: to the next member or, with nobody waiting, back to the shelf. The test moves the injected clock from the 17th to the 18th and watches the copy pass from meera to kabir, with no timer thread and no sleep. This is Flipkart's 2025 prompt almost word for word: \"When the book is returned to the library, it will not be marked as available and will be available only to the first user under the FIFO queue.\"</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Where a free copy goes: to the first member still waiting for its title, else back on the shelf. Every path\n     * that frees a copy comes through here (a return, a new copy, an expired or cancelled hold, a member leaving),\n     * so a copy can never sit on the shelf while someone waits for it. Returns who it went to, or null.\n     */\n    private String placeCopy(BookCopy c, Call call) {\n        Hold next = c.book.nextInLine();                                   // drops cancelled holds from the front\n        if (next != null) { setAside(next, c, call); return next.member.id; }\n        c.status = CopyStatus.AVAILABLE;\n        c.book.shelve(c);\n        return null;\n    }\n\n    /** Put a copy on the hold shelf for this hold&#x27;s member, with a pickup date, and queue a notice for him. */\n    private void setAside(Hold h, BookCopy c, Call call) {\n        h.status = HoldStatus.READY;\n        h.copy = c;\n        h.pickupBy = call.today().plusDays(pickupDays);\n        c.status = CopyStatus.ON_HOLD;\n        readyByDeadline.add(h);\n        call.events().add(new LibraryEvent(EventKind.HOLD_READY, h.member.id, h.book.isbn, c.barcode, h.pickupBy, 0));\n    }\n\n    /**\n     * Hand on every held copy whose pickup date has passed. The heap&#x27;s head is the earliest date, so when nothing\n     * has expired this is one peek. Stale entries (collected or cancelled holds) are dropped as they surface.\n     */\n    private void sweep(Call call) {\n        while (!readyByDeadline.isEmpty()) {\n            Hold h = readyByDeadline.peek();\n            if (h.status != HoldStatus.READY) { readyByDeadline.poll(); continue; }\n            if (!call.today().isAfter(h.pickupBy)) return;                  // the earliest pickup date has not passed\n            readyByDeadline.poll();\n            BookCopy c = h.copy;\n            h.status = HoldStatus.EXPIRED;\n            h.copy = null;\n            h.member.holds.remove(h.book.isbn);\n            call.events().add(new LibraryEvent(EventKind.HOLD_EXPIRED, h.member.id, h.book.isbn, c.barcode, h.pickupBy, 0));\n            placeCopy(c, call);                                            // the next member in line, else the shelf\n        }\n    }\n\n    /** Ask the handed-in fine rule, and refuse an answer below zero: a broken rule must not pay the member. */\n    private long fineFor(Loan loan, LocalDate day) {\n        long fine = fines.fine(loan, day);\n        if (fine &lt; 0) throw new IllegalStateException(&quot;a fine rule returned &quot; + fine);\n        return fine;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>6 &middot; Flipkart&#x27;s version: ids like ROW1234 from the author&#x27;s name, one copy per member, unregister, and who has which book.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Three of the four are already in the core. One copy of a title per member is the first check in <code>checkout</code> and <code>placeHold</code>: his loans and holds are kept by ISBN, so it is one lookup, and the answer is ALREADY_HAS_TITLE. The two audit questions are reads: <code>borrowersOf(isbn)</code> walks that title's few copies, and <code>loansOf(memberId)</code> reads his map. Unregister is refused while he has a book out or owes money. Otherwise his holds are cancelled, and a copy set aside for him goes to the next member through <code>placeCopy</code>. The id is the new part. <code>BookIdGenerator</code> takes the first three letters of the author's last name and adds a number from a counter for that prefix. The counter is created and advanced atomically, so two librarians adding Rowling books at the same instant get ROW1001 and ROW1002, never the same id twice. The test adds a thousand at once and counts a thousand different ids.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: flipkart ids ---------------------------------------------------------------------------------\n/**\n * Flipkart&#x27;s rule: a book&#x27;s id is the first three letters of the author&#x27;s last name plus a number: ROW1001,\n * ROW1002. One counter per prefix, created and advanced atomically, so two librarians adding Rowling books at\n * the same instant never get the same id.\n */\nfinal class BookIdGenerator {\n    private final ConcurrentHashMap&lt;String, AtomicInteger&gt; counters = new ConcurrentHashMap&lt;&gt;();\n    private final int first;\n    /** Numbers start after `first`: new BookIdGenerator(1000) gives ROW1001 first. */\n    BookIdGenerator(int first) { this.first = first; }\n    /** &quot;J. K. Rowling&quot; -&gt; ROW1001. A last name shorter than three letters is padded with X (&quot;Li&quot; -&gt; LIX1001). */\n    String next(String author) {\n        String[] parts = author.trim().split(&quot;\\\\s+&quot;);\n        String last = parts[parts.length - 1].replaceAll(&quot;[^A-Za-z]&quot;, &quot;&quot;).toUpperCase(Locale.ROOT);\n        String prefix = (last + &quot;XXX&quot;).substring(0, 3);\n        return prefix + counters.computeIfAbsent(prefix, k -&gt; new AtomicInteger(first)).incrementAndGet();\n    }\n}\n\n    /**\n     * Unregister. Refused while he has a book out or owes money. His holds are cancelled, and a copy that was set\n     * aside for him goes to the next member in line.\n     */\n    void unregister(String memberId) {\n        locked(call -&gt; {\n            Member m = member(memberId);\n            if (!m.loans.isEmpty()) throw new Refused(Refusal.HAS_LOANS, memberId + &quot; has &quot; + m.loans.size() + &quot; book(s) out&quot;);\n            if (m.duesPaise &gt; 0) throw new Refused(Refusal.OWES_FINES, memberId + &quot; owes &quot; + Main.rs(m.duesPaise));\n            for (Hold h : List.copyOf(m.holds.values())) cancel(h, call);\n            members.remove(memberId);\n            return null;\n        });\n    }\n\n    /** Flipkart&#x27;s audit, one way: the books this member has out. O(his loans). */\n    List&lt;Slip&gt; loansOf(String memberId) {\n        return locked(call -&gt; member(memberId).loans.values().stream().map(this::slip).sorted(Comparator.comparing(Slip::barcode)).toList());\n    }\n    /** Flipkart&#x27;s audit, the other way: the members who have a copy of this title. O(copies of the title). */\n    List&lt;String&gt; borrowersOf(String isbn) {\n        return locked(call -&gt; {\n            List&lt;String&gt; who = new ArrayList&lt;&gt;();\n            for (BookCopy c : book(isbn).copies) { Loan l = onLoan.get(c.barcode); if (l != null) who.add(l.member.id); }\n            return who;\n        });\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; On the shelf? Who has it? What does he have? What is overdue? Titles starting &#x27;clea&#x27;? The app asks all day: make each cheap.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No new structure is needed: each question already has its own shape, and each is read under the lock, so it never sees half a loan. On the shelf: the size of the title's shelf deque, O(1). Who has it: a walk over that title's copies, a handful, each looked up in the map of active loans. What he has: his loans, kept in a map by ISBN. What is overdue: the due-date TreeMap's <code>headMap(today)</code>, which costs O(log n) to find and one step per overdue loan, never a scan of every loan. Search: the sorted word index, where \"clea\" is the range from clea up to clea followed by the largest character, walked until the limit. The one honest exception is a member's place in the queue: a walk over that title's holds. A queue is a few dozen long, so it stays a walk.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /** Titles matching a title query, with how many copies are on the shelf. O(log n + limit). */\n    List&lt;Found&gt; searchTitle(String query, int limit)  { return locked(call -&gt; found(catalog.byTitle(query, limit))); }\n    /** Titles matching an author query. O(log n + limit). */\n    List&lt;Found&gt; searchAuthor(String query, int limit) { return locked(call -&gt; found(catalog.byAuthor(query, limit))); }\n    /** Copies of this title on the shelf right now. O(1). */\n    int onShelf(String isbn) { return locked(call -&gt; book(isbn).onShelf()); }\n    /** His place in the queue for this title (1 = next), or 0. O(queue length). */\n    int position(String memberId, String isbn) { return locked(call -&gt; book(isbn).position(member(memberId))); }\n    /** His hold on this title, or null. O(1) to find, plus the queue walk for a WAITING position. */\n    HoldSlip holdOf(String memberId, String isbn) {\n        return locked(call -&gt; { Hold h = member(memberId).holds.get(isbn); return h == null ? null : holdSlip(h); });\n    }\n    /** Flipkart&#x27;s audit, one way: the books this member has out. O(his loans). */\n    List&lt;Slip&gt; loansOf(String memberId) {\n        return locked(call -&gt; member(memberId).loans.values().stream().map(this::slip).sorted(Comparator.comparing(Slip::barcode)).toList());\n    }\n    /** Flipkart&#x27;s audit, the other way: the members who have a copy of this title. O(copies of the title). */\n    List&lt;String&gt; borrowersOf(String isbn) {\n        return locked(call -&gt; {\n            List&lt;String&gt; who = new ArrayList&lt;&gt;();\n            for (BookCopy c : book(isbn).copies) { Loan l = onLoan.get(c.barcode); if (l != null) who.add(l.member.id); }\n            return who;\n        });\n    }\n    /** Loans past their due date, oldest first. O(log n + k): a range of the due index, not a scan of every loan. */\n    List&lt;Slip&gt; overdue() { return locked(call -&gt; slips(byDue.headMap(call.today(), false))); }\n    /** Loans due between two days, inclusive; the nightly reminder asks for the next two days. O(log n + k). */\n    List&lt;Slip&gt; dueBetween(LocalDate from, LocalDate to) {\n        return locked(call -&gt; from.isAfter(to) ? List.&lt;Slip&gt;of() : slips(byDue.subMap(from, true, to, true)));\n    }\n    /** What he owes, in paise. O(1). */\n    long dues(String memberId) { return locked(call -&gt; member(memberId).duesPaise); }\n    /** Where this copy is. O(1). */\n    CopyStatus status(String barcode) { return locked(call -&gt; copy(barcode).status); }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Walmart: the database schema. Bloomberg: the SQL for overdue books. And what stops two app servers lending one copy?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The tables follow the classes: book, copy, member, loan and hold. The loan keeps the ISBN too, so the database itself can enforce one copy of a title per member, as a unique index over the loans still open. The overdue report joins the open loans with the member and the book where the due date is before today, oldest first. A partial index (an index over only the rows that match a condition) on the due date of open loans makes it the same range read the TreeMap does in memory. Two servers cannot both lend one copy because the claim is one conditional update: <code>UPDATE copy SET status='LOANED' WHERE barcode=? AND status='AVAILABLE'</code>. One row changed means he got it; zero means someone else did. That is the database's compare-and-set, the same idea as the lock. Returns and holds for one title first lock that title's row with <code>SELECT ... FOR UPDATE</code>, which is move 4 one layer down. And the in-memory maps go behind a repository interface, so the services above do not change.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence ----------------------------------------------------------------------------------\n/** The library&#x27;s state behind an interface, so the services above do not change when it moves to a database. */\ninterface LibraryRepository {\n    /** Claim a copy for a member only if it is still on the shelf: true means he got it, false means someone else did. */\n    boolean claim(String barcode, String memberId, LocalDate due);\n    /** The copy is back on the shelf. */\n    void release(String barcode);\n    /** Barcodes of loans due before today, oldest first. */\n    List&lt;String&gt; overdue(LocalDate today);\n}\n\n/**\n * The in-memory version a test uses. The claim is a compare-and-set on the copy&#x27;s row, exactly what the UPDATE\n * below does in a database. The overdue list is a scan here, which is fine for a test double; the database uses\n * the partial index on due_on.\n */\nfinal class InMemoryLibraryRepository implements LibraryRepository {\n    private final ConcurrentHashMap&lt;String, String&gt; holder = new ConcurrentHashMap&lt;&gt;();   // barcode -&gt; &quot;&quot; on the shelf, else member id\n    private final ConcurrentHashMap&lt;String, LocalDate&gt; due = new ConcurrentHashMap&lt;&gt;();\n    /** Setup: a copy on the shelf. */\n    void addCopy(String barcode) { holder.put(barcode, &quot;&quot;); }\n    /** One atomic step decides the winner: replace &quot;&quot; with his id only if it is still &quot;&quot;. */\n    public boolean claim(String barcode, String memberId, LocalDate dueOn) {\n        if (!holder.replace(barcode, &quot;&quot;, memberId)) return false;\n        due.put(barcode, dueOn);\n        return true;\n    }\n    /** Back on the shelf, no longer due. */\n    public void release(String barcode) { due.remove(barcode); holder.put(barcode, &quot;&quot;); }\n    /** Loans due before today, oldest first. */\n    public List&lt;String&gt; overdue(LocalDate today) {\n        return due.entrySet().stream().filter(e -&gt; e.getValue().isBefore(today))\n                  .sorted(Map.Entry.comparingByValue()).map(Map.Entry::getKey).toList();\n    }\n}\n\n/** The same design as PostgreSQL tables. Walmart asked for the schema; Bloomberg for the overdue query. */\nfinal class LibrarySql {\n    /** Five tables, three indexes. The unique index is Flipkart&#x27;s &quot;one copy of a title per member&quot;, enforced by the database. */\n    static final String SCHEMA = &quot;&quot;&quot;\n        CREATE TABLE book   (isbn VARCHAR(13) PRIMARY KEY, title TEXT NOT NULL, author TEXT NOT NULL,\n                             price_paise BIGINT NOT NULL);\n        CREATE TABLE copy   (barcode VARCHAR(20) PRIMARY KEY, isbn VARCHAR(13) NOT NULL REFERENCES book,\n                             status VARCHAR(10) NOT NULL);                 -- AVAILABLE, LOANED, ON_HOLD, LOST\n        CREATE TABLE member (id VARCHAR(20) PRIMARY KEY, name TEXT NOT NULL, tier VARCHAR(10) NOT NULL,\n                             dues_paise BIGINT NOT NULL DEFAULT 0);\n        CREATE TABLE loan   (id BIGINT PRIMARY KEY, barcode VARCHAR(20) NOT NULL REFERENCES copy,\n                             member_id VARCHAR(20) NOT NULL REFERENCES member, isbn VARCHAR(13) NOT NULL,\n                             borrowed_on DATE NOT NULL, due_on DATE NOT NULL, closed_on DATE,  -- returned or lost\n                             renewals INT NOT NULL DEFAULT 0, charged_paise BIGINT NOT NULL DEFAULT 0);\n        CREATE TABLE hold   (id BIGINT PRIMARY KEY, isbn VARCHAR(13) NOT NULL REFERENCES book,\n                             member_id VARCHAR(20) NOT NULL REFERENCES member, placed_at TIMESTAMP NOT NULL,\n                             status VARCHAR(10) NOT NULL, barcode VARCHAR(20), pickup_by DATE);\n        CREATE INDEX loan_open_by_due ON loan (due_on) WHERE closed_on IS NULL;             -- the overdue report\n        CREATE UNIQUE INDEX one_copy_each ON loan (member_id, isbn) WHERE closed_on IS NULL;\n        CREATE INDEX hold_queue ON hold (isbn, placed_at) WHERE status = &#x27;WAITING&#x27;;         -- the FIFO queue\n        &quot;&quot;&quot;;\n    /** Bloomberg&#x27;s question: who has an overdue book, which one, and how late. */\n    static final String OVERDUE = &quot;&quot;&quot;\n        SELECT m.id, m.name, b.title, l.barcode, l.due_on, CURRENT_DATE - l.due_on AS days_late\n        FROM loan l JOIN member m ON m.id = l.member_id JOIN book b ON b.isbn = l.isbn\n        WHERE l.closed_on IS NULL AND l.due_on &lt; CURRENT_DATE\n        ORDER BY l.due_on&quot;&quot;&quot;;\n    /** The checkout&#x27;s claim: one row updated means the copy is his, zero means someone else got it first. */\n    static final String CLAIM = &quot;UPDATE copy SET status = &#x27;LOANED&#x27; WHERE barcode = ? AND status = &#x27;AVAILABLE&#x27;&quot;;\n    /** Returns and holds for one title take this row lock first, so they are decided one at a time: move 4, in SQL. */\n    static final String LOCK_TITLE = &quot;SELECT isbn FROM book WHERE isbn = ? FOR UPDATE&quot;;\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; The workat.tech version: numbered racks, one copy of a book per rack, first free rack on return, lowest rack on borrow.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>This changes one thing: the order in which the shelf hands copies out. In the core a title's shelf is a deque and any copy will do. Here the rule is \"the lowest rack\", so each book gets a TreeMap from rack number to copy, whose first entry is the lowest, and a BitSet of the racks already holding a copy of it. <code>nextClearBit(1)</code> finds the first free rack for that book in one call. Adding copies is all or nothing, and it counts the copies that are out as well as those on racks: each borrowed copy must find a rack when it comes back, so a book may own at most one copy per rack. If the new copies would break that, nothing is placed and the answer is \"Rack not available\". Borrowing a named copy takes it off its rack, and a return goes back to the first free rack, which is often the one it left. It is the parking lot's idea again: the order in which free things are handed out is a rule of its own.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: racks ----------------------------------------------------------------------------------------\n/**\n * The workat.tech version: racks numbered 1..n, and a rack holds at most one copy of any book. A new or returned\n * copy goes to the lowest-numbered rack with no copy of its book; &quot;borrow by book id&quot; takes the copy on the\n * lowest rack. Per book: a BitSet of racks in use (nextClearBit finds the first free one) and a TreeMap from rack\n * to copy (firstEntry is the lowest). The shelf&#x27;s ORDER is a rule, like the parking lot&#x27;s queue of free spots.\n */\nfinal class RackedShelf {\n    private final int racks;\n    private final Map&lt;String, BitSet&gt; used = new HashMap&lt;&gt;();                       // book id -&gt; racks holding a copy of it\n    private final Map&lt;String, TreeMap&lt;Integer, String&gt;&gt; onRack = new HashMap&lt;&gt;();   // book id -&gt; rack -&gt; copy id\n    private final Map&lt;String, String&gt; bookOf = new HashMap&lt;&gt;();                     // copy id -&gt; book id\n    private final Map&lt;String, Integer&gt; rackOf = new HashMap&lt;&gt;();                    // copy id -&gt; its rack, while on one\n    private final Map&lt;String, Integer&gt; owned = new HashMap&lt;&gt;();                     // book id -&gt; copies owned, borrowed ones too\n    /** A library with racks 1..racks. */\n    RackedShelf(int racks) { this.racks = racks; }\n\n    /**\n     * Add copies, all or nothing. A book can own at most one copy per rack, counting the copies that are out, because\n     * each of those must find a rack when it comes back. Returns their racks, or null (&quot;Rack not available&quot;).\n     */\n    synchronized List&lt;Integer&gt; add(String bookId, List&lt;String&gt; copyIds) {\n        int have = owned.getOrDefault(bookId, 0);\n        if (have + copyIds.size() &gt; racks) return null;\n        owned.put(bookId, have + copyIds.size());\n        List&lt;Integer&gt; placed = new ArrayList&lt;&gt;();\n        for (String c : copyIds) { bookOf.put(c, bookId); placed.add(place(bookId, c)); }\n        return placed;\n    }\n    /** Borrow by book id: the copy on the lowest rack, as &quot;copyId@rack&quot;, or null (&quot;Not available&quot;). O(log racks). */\n    synchronized String borrowByBook(String bookId) {\n        TreeMap&lt;Integer, String&gt; m = onRack.get(bookId);\n        if (m == null || m.isEmpty()) return null;\n        Map.Entry&lt;Integer, String&gt; e = m.pollFirstEntry();\n        used.get(bookId).clear(e.getKey());\n        rackOf.remove(e.getValue());\n        return e.getValue() + &quot;@&quot; + e.getKey();\n    }\n    /** Borrow one named copy: take it off its rack. Returns the rack, or -1 when it is not on a rack. */\n    synchronized int borrowCopy(String copyId) {\n        Integer r = rackOf.remove(copyId);\n        if (r == null) return -1;\n        String book = bookOf.get(copyId);\n        onRack.get(book).remove(r);\n        used.get(book).clear(r);\n        return r;\n    }\n    /** A returned copy goes to the first free rack for its book. Returns that rack; a copy already on a rack stays put. */\n    synchronized int giveBack(String copyId) {\n        Integer r = rackOf.get(copyId);\n        return r != null ? r : place(bookOf.get(copyId), copyId);\n    }\n\n    /** The lowest rack with no copy of this book, found by nextClearBit from rack 1; -1 when every rack has one. */\n    private int place(String bookId, String copyId) {\n        BitSet u = used.computeIfAbsent(bookId, k -&gt; new BitSet());\n        int r = u.nextClearBit(1);\n        if (r &gt; racks) return -1;\n        u.set(r);\n        onRack.computeIfAbsent(bookId, k -&gt; new TreeMap&lt;&gt;()).put(r, copyId);\n        rackOf.put(copyId, r);\n        return r;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>10 &middot; He wants two more weeks. Or he has lost the book. What happens to the due date, the queue and his account?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Renewal adds one loan period to the due date, and says no in three cases: the book is already overdue (return it and pay), he has used his two renewals, or someone is waiting for the title. That last check reads the first live hold in the queue, so a cancelled hold does not block him. There is one trap. The due date is the key the loan is filed under in the due index; change it in place and the loan stays filed under the old date, and the overdue report lists a renewed book. So the loan leaves the index, the date changes, and it goes back in. Test 6 checks the report the day after the old date. A lost book is charged its price plus the fine so far. The copy becomes LOST and leaves circulation, and his slot is free again. Members waiting for the title keep their places, and a replacement copy, added later, goes straight to the first of them.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Renew: one more loan period on the due date. Refused when the book is overdue, when he has used his renewals,\n     * and when anyone is waiting for the title. The due date is the key of the due index, so the loan leaves the\n     * index before the date changes and goes back in after.\n     */\n    Slip renew(String barcode) {\n        return locked(call -&gt; {\n            Loan loan = activeLoan(barcode);\n            Terms t = rules.termsFor(loan.member);\n            if (call.today().isAfter(loan.due)) throw new Refused(Refusal.OVERDUE, barcode + &quot; was due on &quot; + loan.due);\n            if (loan.renewals &gt;= t.maxRenewals()) throw new Refused(Refusal.RENEWAL_LIMIT, barcode + &quot; renewed &quot; + loan.renewals + &quot; times&quot;);\n            if (loan.copy.book.firstWaiting() != null) throw new Refused(Refusal.OTHERS_WAITING, loan.copy.book.title + &quot; has a queue&quot;);\n            unindex(loan);\n            loan.due = loan.due.plusDays(t.loanDays());\n            loan.renewals++;\n            index(loan);\n            return slip(loan);\n        });\n    }\n\n    /**\n     * The member lost the copy. The charge is the book&#x27;s price plus the fine so far, added to his dues. The copy\n     * leaves circulation; members waiting for the title keep their places for the next copy that frees up.\n     */\n    long reportLost(String barcode) {\n        return locked(call -&gt; {\n            Loan loan = activeLoan(barcode);\n            long charge = loan.copy.book.pricePaise + fineFor(loan, call.today());      // handed-in code first\n            onLoan.remove(barcode);\n            unindex(loan);\n            loan.status = LoanStatus.LOST;\n            loan.closedOn = call.today();\n            loan.chargedPaise = charge;\n            loan.member.loans.remove(loan.copy.book.isbn);\n            loan.member.duesPaise += charge;\n            loan.copy.status = CopyStatus.LOST;\n            call.events().add(new LibraryEvent(EventKind.FINE_CHARGED, loan.member.id, loan.copy.book.isbn, barcode, call.today(), charge));\n            return charge;\n        });\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>11 &middot; Due-date reminders and hold-ready SMS, through a gateway that takes a second per message. Nobody at a desk may wait.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The hold-ready notice already exists: the library builds it under the lock and delivers it after the unlock. The reminder is a nightly job. It asks the library for the loans due between today and two days from now, one range of the due index, and sends a DUE_SOON notice for each. One problem is left: listeners run on the caller's thread, so a gateway that takes a second per message would still slow the desk whose return triggered it. So the SMS sender becomes an outbox. Its <code>onEvent</code> only puts the notice in a queue, which takes microseconds, and a worker thread sends at the gateway's pace. A message the gateway refuses goes back in the queue, not in the bin. The test takes the gateway down, sees the message stay queued, brings it back and sees it sent once. One more thing to say: each call's notices keep their order, but two calls at the same instant may deliver theirs in either order. That is harmless here, because each notice is a separate fact about one member.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: reminders and a slow sms gateway ------------------------------------------------------------\n/** The nightly job: a DUE_SOON notice for every loan due in the next `days` days. It reads one range of the due index. */\nfinal class DueSoonReminder {\n    private final Library lib;\n    private final LibraryListener out;\n    private final int days;\n    /** Remind members whose books are due within `days` days, through this listener. */\n    DueSoonReminder(Library lib, LibraryListener out, int days) { this.lib = lib; this.out = out; this.days = days; }\n    /** Send the notices; returns how many went out. */\n    int run() {\n        LocalDate today = lib.today();\n        List&lt;Slip&gt; soon = lib.dueBetween(today, today.plusDays(days));\n        for (Slip s : soon) out.onEvent(new LibraryEvent(EventKind.DUE_SOON, s.memberId(), s.isbn(), s.barcode(), s.due(), 0));\n        return soon.size();\n    }\n}\n\n/**\n * A listener that never makes a desk wait. onEvent only appends to a queue, which takes microseconds; a worker\n * sends the SMS at the gateway&#x27;s pace, and a message the gateway refuses goes back in the queue, not in the bin.\n */\nfinal class SmsOutbox implements LibraryListener {\n    private final BlockingQueue&lt;LibraryEvent&gt; queue = new LinkedBlockingQueue&lt;&gt;();\n    final List&lt;LibraryEvent&gt; sent = new CopyOnWriteArrayList&lt;&gt;();\n    /** Called by the library after the unlock: enqueue and return. */\n    public void onEvent(LibraryEvent e) { queue.offer(e); }\n    /** The worker&#x27;s loop body: try each queued message once; one the gateway refuses or throws on is queued again. */\n    int drain(Predicate&lt;LibraryEvent&gt; gateway) {\n        List&lt;LibraryEvent&gt; batch = new ArrayList&lt;&gt;();\n        queue.drainTo(batch);\n        int ok = 0;\n        for (LibraryEvent e : batch) {\n            boolean delivered;\n            try { delivered = gateway.test(e); } catch (RuntimeException down) { delivered = false; }\n            if (delivered) { sent.add(e); ok++; } else queue.offer(e);\n        }\n        return ok;\n    }\n    /** Messages still waiting to be sent. */\n    int pending() { return queue.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; There are twenty branches now. A member can return a book at any branch and collect his hold at his own.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Each branch keeps its own shelves, but a title's queue is shared, because a member waiting for Clean Code does not care whose copy he gets. So the queue has one owner and one lock, and a returned copy follows the core's rule: the first member waiting, else the shelf. The new part is where he collects. A hold names a pickup branch, and a copy that comes back at another branch cannot go on that branch's hold shelf. It goes IN_TRANSIT to his branch, and only when the van delivers it is it READY, with his three days starting then. That is one new status and one more hop in the place that decides a free copy's next stop. With nobody waiting, the copy stays on the shelf of the branch it came back to.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: several branches -----------------------------------------------------------------------------\n/**\n * Twenty branches, one catalogue, one queue per title across all of them. A hold names the branch where the\n * member will collect. A copy that comes back at another branch cannot go on that branch&#x27;s hold shelf: it goes\n * IN_TRANSIT to his branch, and only when the van delivers it is it READY. One new state, one more hop; the rule\n * &quot;the queue before the shelf&quot; does not change.\n */\nfinal class BranchNetwork {\n    /** Where a returned copy ends up. */\n    enum Where { ON_SHELF, IN_TRANSIT, READY }\n    /** A copy&#x27;s next place: at which branch, in what state, and for whom (null = nobody). */\n    record Placement(String barcode, String atBranch, Where where, String forMember) {}\n    /** One member in a title&#x27;s queue, and the branch where he will collect. */\n    private record Waiter(String memberId, String pickupBranch) {}\n    private final Map&lt;String, Deque&lt;Waiter&gt;&gt; queues = new HashMap&lt;&gt;();     // isbn -&gt; FIFO across all branches\n    private final ReentrantLock lock = new ReentrantLock();                // the queues are shared, so they have one owner\n\n    /** Join the title&#x27;s queue, naming the branch where he will collect. */\n    void hold(String isbn, String memberId, String pickupBranch) {\n        lock.lock();\n        try { queues.computeIfAbsent(isbn, k -&gt; new ArrayDeque&lt;&gt;()).offer(new Waiter(memberId, pickupBranch)); }\n        finally { lock.unlock(); }\n    }\n    /** A copy comes back at a branch: the first member waiting gets it, here or in transit to his branch; nobody waiting, this branch&#x27;s shelf. */\n    Placement returned(String isbn, String barcode, String branch) {\n        lock.lock();\n        try {\n            Deque&lt;Waiter&gt; q = queues.get(isbn);\n            Waiter w = q == null ? null : q.poll();\n            if (w == null) return new Placement(barcode, branch, Where.ON_SHELF, null);\n            if (w.pickupBranch().equals(branch)) return new Placement(barcode, branch, Where.READY, w.memberId());\n            return new Placement(barcode, w.pickupBranch(), Where.IN_TRANSIT, w.memberId());\n        } finally { lock.unlock(); }\n    }\n    /** The van delivers: a copy in transit is now READY at its destination, and his pickup days start now. */\n    Placement arrived(Placement p) {\n        return p.where() == Where.IN_TRANSIT ? new Placement(p.barcode(), p.atBranch(), Where.READY, p.forMember()) : p;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>13 &middot; Where does &#x27;today&#x27; come from, and how do you test a fine on day fifteen, or a hold that expires in three days?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The library is handed a <code>Clock</code>, a one-method interface, and turns its milliseconds into a date in the library's time zone. Each call reads it once, at the start of <code>locked()</code>, and every part of that call uses the same day, so a return at one second to midnight cannot price the fine on one day and close the loan on the next. A test hands in a clock that reads a variable. It lends a book on the 1st, sets the variable to the 15th and expects no fine. Then it lends again, moves to the 30th (one day past the new due date) and expects Rs 20. The pickup date works the same way: the test moves the variable from the 17th to the 18th, and the next call passes the copy on. Nothing sleeps, nothing is flaky, and nothing calls the system clock except the default the library starts with.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 7. fines: the due date is free, then Rs 20 a day, never more than Rs 500; owing more than Rs 100 blocks borrowing\n        System.out.println(&quot;7. fines&quot;);\n        long[] t7 = { day(1) };\n        Library fin = fresh(t7, &quot;asha&quot;);\n        fin.addCopy(PP, &quot;PP-1&quot;);\n        fin.checkout(&quot;asha&quot;, PP);                                                  // due the 15th\n        t7[0] = day(15);\n        check(fin.returnCopy(&quot;PP-1&quot;).finePaise() == 0, &quot;back on the due date: no fine&quot;);\n        fin.checkout(&quot;asha&quot;, PP);                                                  // due the 29th\n        t7[0] = day(30);\n        check(fin.returnCopy(&quot;PP-1&quot;).finePaise() == 2_000, &quot;one day late: Rs 20&quot;);\n        fin.checkout(&quot;asha&quot;, PP);                                                  // due the 14th of October\n        t7[0] = day(44 + 40);\n        check(fin.returnCopy(&quot;PP-1&quot;).finePaise() == 50_000, &quot;forty days late: capped at Rs 500, not Rs 800&quot;);\n        check(fin.dues(&quot;asha&quot;) == 52_000, &quot;both fines are on her account: Rs 520&quot;);\n        check(refusal(() -&gt; fin.checkout(&quot;asha&quot;, PP)) == Refusal.OWES_FINES, &quot;owing more than Rs 100, she cannot borrow&quot;);\n        boolean badAmount = false;\n        try { fin.payFine(&quot;asha&quot;, 0); } catch (IllegalArgumentException e) { badAmount = true; }\n        fin.payFine(&quot;asha&quot;, 52_000);\n        check(badAmount &amp;&amp; fin.dues(&quot;asha&quot;) == 0 &amp;&amp; refusal(() -&gt; fin.checkout(&quot;asha&quot;, PP)) == null, &quot;a zero payment is refused; once she pays, she borrows&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Which pattern is where, and why did each one earn its place? Walmart&#x27;s round named Singleton, Factory, Observer and Command.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Each one is what a move produced, so name the move, then the line. Strategy is move 3: the loan terms and the fine are rules that change, so each sits behind a one-method interface the library is handed in <code>configure</code>. Decorator is the fine stack: a cap, a grace period and a student rate each wrap the rule inside them. Observer is move 4's rule that the SMS must never run inside the lock: the library announces and never learns who listens. State is move 6: the copy's and the hold's statuses, and one method, <code>placeCopy</code>, that decides where a free copy goes. The absences are worth saying without being asked. No Singleton: desks are handed the library, so every test builds its own. No Factory until the catalogue is imported from a file. No Command, because nothing queues or undoes a desk action. No Builder, because a book has four required fields.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The late fine, in paise, for a loan that comes back on a given day. Handed the whole loan, so a rule can read\n * the book (a cap at its price) or the member (a student rate) without a new interface.\n */\ninterface FinePolicy { long fine(Loan loan, LocalDate returnedOn); }\n\n/** A flat rate for every day after the due date. Back on the due date itself: no fine. */\nfinal class PerDayFine implements FinePolicy {\n    private final long perDayPaise;\n    /** Rs 20 a day is new PerDayFine(2_000). */\n    PerDayFine(long perDayPaise) { this.perDayPaise = perDayPaise; }\n    /** Days late times the rate; zero when on time or early. */\n    public long fine(Loan loan, LocalDate returnedOn) {\n        long late = ChronoUnit.DAYS.between(loan.due, returnedOn);\n        return late &lt;= 0 ? 0 : late * perDayPaise;\n    }\n}\n\n/** Wraps any fine rule and never charges more than a cap. A new class; the library did not change (Decorator). */\nfinal class CappedFine implements FinePolicy {\n    private final FinePolicy base;\n    private final long capPaise;\n    /** new CappedFine(new PerDayFine(2_000), 50_000): Rs 20 a day, never more than Rs 500. */\n    CappedFine(FinePolicy base, long capPaise) { this.base = base; this.capPaise = capPaise; }\n    /** The wrapped rule&#x27;s fine, or the cap if that is smaller. */\n    public long fine(Loan loan, LocalDate returnedOn) { return Math.min(base.fine(loan, returnedOn), capPaise); }\n}\n\n/** Anyone who wants to hear what happened: an SMS sender, an e-mail job, the hold-shelf printer. Called after the lock. */\ninterface LibraryListener { void onEvent(LibraryEvent e); }\n\n    /** Tell every listener about every notice, each in its own try/catch, so one broken listener cannot stop the others. */\n    private void publish(List&lt;LibraryEvent&gt; events) {\n        for (LibraryEvent e : events)\n            for (LibraryListener l : listeners) {\n                try { l.onEvent(e); } catch (RuntimeException ex) { System.err.println(&quot;   [listener failed] &quot; + ex.getMessage()); }\n            }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Which SOLID letter is where in this code?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Not one of them was aimed at; each is a line some move already produced, which is the only convincing way to answer. S is the class list: a book owns its shelf and its queue, a member his loans and dues, a copy its status, the library the flow and the lock. O: the grace period, the student rate and the tiers were new classes and one changed <code>configure</code> line; the library never opened. L: the library calls <code>fines.fine(loan, today)</code> and never asks which rule it got. I: every interface has one method, so a fake is a lambda, and <code>(loan, d) -&gt; { throw ... }</code> is a broken fine rule in one line. D: the library depends on the interfaces it is handed, which is exactly why a test can hand it a clock that says the 18th and a fine rule that throws.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /** Hand in the rules. The library never builds one, so a new rule costs one changed line here. */\n    void configure(LoanRules r, FinePolicy f) { rules = r; fines = f; }\n    /** Tests hand in a clock they control. */\n    void setClock(Clock c) { clock = c; }\n    /** Subscribe a listener. It hears every notice after the lock is released. */\n    void addListener(LibraryListener l) { listeners.add(l); }\n\n/** The borrowing rules. They change (tiers, a holiday season), so they are handed in, and handed the whole member. */\ninterface LoanRules { Terms termsFor(Member m); }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Enum statuses or a State class per status? Subclasses for a DVD, a magazine, an e-book? And where would a Factory pay?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Enums, until a status grows behaviour of its own. The copy's four statuses differ only in what may happen next, and that is data: a table from each status to the statuses it may move to, where every move not in the table throws. The same goes for tiers: a row of terms, not a Member subclass. A DVD lent for seven days and a reference book that is never lent are data too: one more column in the terms. An e-book is the counter-example: no barcode, no shelf, a number of licences, and loans that end by themselves on the due date, so it can never be late. That is different behaviour, so it earns its own class, not a BookCopy subclass that would inherit a shelf it never uses. A Factory pays when items stop arriving typed in code and start arriving as rows of a file: one maker registered per kind of row, instead of a growing switch.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the copy&#x27;s life as a table ------------------------------------------------------------------\n/** The copy&#x27;s life as an explicit table: every move not listed throws, so a bug cannot lend a lost copy. */\nfinal class CopyLife {\n    static final Map&lt;CopyStatus, Set&lt;CopyStatus&gt;&gt; ALLOWED = new EnumMap&lt;&gt;(Map.of(\n        CopyStatus.AVAILABLE, EnumSet.of(CopyStatus.LOANED, CopyStatus.ON_HOLD),\n        CopyStatus.LOANED,    EnumSet.of(CopyStatus.AVAILABLE, CopyStatus.ON_HOLD, CopyStatus.LOST),\n        CopyStatus.ON_HOLD,   EnumSet.of(CopyStatus.LOANED, CopyStatus.ON_HOLD, CopyStatus.AVAILABLE),\n        CopyStatus.LOST,      EnumSet.noneOf(CopyStatus.class)));\n    /** Move a copy, or throw if the table does not allow the move. */\n    static void move(BookCopy c, CopyStatus to) {\n        if (!ALLOWED.get(c.status).contains(to))\n            throw new IllegalStateException(c.barcode + &quot;: &quot; + c.status + &quot; -&gt; &quot; + to + &quot; is not allowed&quot;);\n        c.status = to;\n    }\n}\n\n// ---- ext: e-books --------------------------------------------------------------------------------------\n/**\n * An e-book: no barcode and no shelf, just N licences that may be out at once. A loan ends by itself on its due\n * date, so there is never a late fine, and the licence it frees goes straight to the first member waiting.\n * Different behaviour, so its own class, not a BookCopy subclass that would inherit a shelf it never uses.\n */\nfinal class EbookLending {\n    private final int loanDays;\n    private int free;\n    private final Deque&lt;String&gt; waiting = new ArrayDeque&lt;&gt;();\n    private final TreeMap&lt;LocalDate, List&lt;String&gt;&gt; endsOn = new TreeMap&lt;&gt;();   // the day loans end -&gt; who is reading\n    private final Set&lt;String&gt; reading = new HashSet&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n    /** A title with this many licences, lent for loanDays days. */\n    EbookLending(int licences, int loanDays) { this.free = licences; this.loanDays = loanDays; }\n\n    /** Read now if a licence is free (true), else join the queue (false). Asking twice changes nothing. */\n    boolean borrow(String member, LocalDate today) {\n        lock.lock();\n        try {\n            if (reading.contains(member)) return true;\n            if (waiting.contains(member)) return false;              // a scan of the queue: a sketch, fine at a few dozen\n            if (free == 0) { waiting.offer(member); return false; }\n            lend(member, today);\n            return true;\n        } finally { lock.unlock(); }\n    }\n    /** The nightly tick: loans that ended free their licences, and each freed licence goes to the next reader in line. */\n    List&lt;String&gt; tick(LocalDate today) {\n        lock.lock();\n        try {\n            SortedMap&lt;LocalDate, List&lt;String&gt;&gt; ended = endsOn.headMap(today, true);\n            for (List&lt;String&gt; readers : ended.values()) { reading.removeAll(readers); free += readers.size(); }\n            ended.clear();\n            List&lt;String&gt; got = new ArrayList&lt;&gt;();\n            while (free &gt; 0 &amp;&amp; !waiting.isEmpty()) { String m = waiting.poll(); lend(m, today); got.add(m); }\n            return got;\n        } finally { lock.unlock(); }\n    }\n    /** Licences not in use. */\n    int free() { lock.lock(); try { return free; } finally { lock.unlock(); } }\n    /** One licence to this member, ending loanDays from today. */\n    private void lend(String member, LocalDate today) {\n        free--;\n        reading.add(member);\n        endsOn.computeIfAbsent(today.plusDays(loanDays), d -&gt; new ArrayList&lt;&gt;()).add(member);\n    }\n}\n\n// ---- ext: items from a file ----------------------------------------------------------------------------\n/** Factory, earned only when items arrive as text: one row per item, its kind in the first column, one maker per kind. */\nfinal class CatalogImport {\n    private final Map&lt;String, BiConsumer&lt;Library, String[]&gt;&gt; makers = Map.of(\n        &quot;BOOK&quot;, (lib, f) -&gt; lib.addBook(f[1], f[2], f[3], Long.parseLong(f[4])),\n        &quot;COPY&quot;, (lib, f) -&gt; lib.addCopy(f[1], f[2]));\n    /** Apply one line such as BOOK|9780132350884|Clean Code|Robert C. Martin|60000. An unknown kind is refused. */\n    void apply(Library lib, String line) {\n        String[] f = line.split(&quot;\\\\|&quot;);\n        BiConsumer&lt;Library, String[]&gt; make = makers.get(f[0]);\n        if (make == null) throw new IllegalArgumentException(&quot;unknown kind: &quot; + f[0]);\n        make.accept(lib, f);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.time.*;\nimport java.time.temporal.ChronoUnit;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n/** Where one physical copy is right now. ON_HOLD means set aside on the hold shelf for one member, until a pickup date. */\nenum CopyStatus { AVAILABLE, LOANED, ON_HOLD, LOST }\n\n/**\n * A hold's life: WAITING in its title's queue; READY once a copy is set aside for the member; then COLLECTED\n * (he borrowed it), EXPIRED (he did not come in time) or CANCELLED.\n */\nenum HoldStatus { WAITING, READY, COLLECTED, EXPIRED, CANCELLED }\n\n/** A loan's life: ACTIVE until the copy comes back (RETURNED) or is reported LOST. */\nenum LoanStatus { ACTIVE, RETURNED, LOST }\n\n/** A member's tier. Data for the rules, not a subclass: StandardTerms ignores it, a tiered rule reads it. */\nenum Tier { REGULAR, STUDENT, FACULTY }\n\n/** What a notice is about. The library sends the first three itself; a nightly job sends DUE_SOON. */\nenum EventKind { HOLD_READY, HOLD_EXPIRED, FINE_CHARGED, DUE_SOON }\n\n/**\n * Why the library said no. A refusal is a normal answer at a desk, so it carries a reason that a desk can show\n * and a test can check.\n */\nenum Refusal {\n    UNKNOWN_MEMBER, UNKNOWN_BOOK, UNKNOWN_COPY, DUPLICATE_ID,\n    NOT_AVAILABLE, LIMIT_REACHED, OWES_FINES, ALREADY_HAS_TITLE,\n    NOT_ON_LOAN, NO_HOLD, OTHERS_WAITING, RENEWAL_LIMIT, OVERDUE, HAS_LOANS\n}\n\n/** Thrown when the library refuses. Every refusal happens before the first write, so nothing has changed. */\nfinal class Refused extends RuntimeException {\n    final Refusal why;\n    /** A refusal with its reason and the detail a desk would print. */\n    Refused(Refusal why, String detail) { super(why + \": \" + detail); this.why = why; }\n}\n\n/**\n * A title in the catalogue: one ISBN, one title, one author, and the price of a replacement copy. It owns its\n * copies, the queue of copies on the shelf, and the FIFO queue of members waiting for it. Only the library\n * changes it, and only under the library's lock.\n */\nfinal class Book {\n    final String isbn, title, author;\n    final long pricePaise;                                     // charged when a copy is lost\n    final List<BookCopy> copies = new ArrayList<>();           // every copy, for \"who has this book?\"\n    private final Deque<BookCopy> shelf = new ArrayDeque<>();  // the AVAILABLE copies; the head is lent next\n    private final Deque<Hold> waiting = new ArrayDeque<>();    // FIFO; a cancelled hold is dropped when it reaches the front\n\n    /** A title with no copies yet. */\n    Book(String isbn, String title, String author, long pricePaise) {\n        this.isbn = isbn; this.title = title; this.author = author; this.pricePaise = pricePaise;\n    }\n    /** The copy that would be lent next, without taking it; null when the shelf is empty. O(1). */\n    BookCopy peekShelf()     { return shelf.peek(); }\n    /** Take the head of the shelf. O(1). */\n    BookCopy takeFromShelf() { return shelf.poll(); }\n    /** Put a free copy on the shelf. Only placeCopy calls it, and only when nobody is waiting. O(1). */\n    void shelve(BookCopy c)  { shelf.offer(c); }\n    /** How many copies are on the shelf right now. O(1). */\n    int onShelf()            { return shelf.size(); }\n    /** Join the back of the queue. O(1). */\n    void enqueue(Hold h)     { waiting.offer(h); }\n    /**\n     * The first hold that is still WAITING, or null. A cancelled hold stays in the queue until it reaches the\n     * front and is dropped here, once. So a cancel costs O(1), and this costs O(1) on average.\n     */\n    Hold firstWaiting() {\n        while (!waiting.isEmpty() && waiting.peek().status != HoldStatus.WAITING) waiting.poll();\n        return waiting.peek();\n    }\n    /** Take the first live hold off the queue, or return null when nobody is waiting. */\n    Hold nextInLine() {\n        Hold h = firstWaiting();\n        if (h != null) waiting.poll();\n        return h;\n    }\n    /** This member's place in the queue (1 = next), or 0 if he is not waiting. O(queue length). */\n    int position(Member m) {\n        int n = 0;\n        for (Hold h : waiting)\n            if (h.status == HoldStatus.WAITING) { n++; if (h.member == m) return n; }\n        return 0;\n    }\n}\n\n/** One physical copy with its own barcode. Dumb on purpose: it knows its title and where it is. */\nfinal class BookCopy {\n    final String barcode;\n    final Book book;\n    CopyStatus status = CopyStatus.AVAILABLE;                  // written only by the library, under its lock\n    /** A copy of one title. */\n    BookCopy(String barcode, Book book) { this.barcode = barcode; this.book = book; }\n}\n\n/**\n * A registered reader. His loans are kept by ISBN, so \"has he reached his limit?\" and \"does he already have\n * this title?\" are one lookup each. His live holds are kept by ISBN too. Dues are what he owes, in paise.\n */\nfinal class Member {\n    final String id, name;\n    final Tier tier;\n    final Map<String, Loan> loans = new HashMap<>();           // isbn -> active loan: one copy of a title at a time\n    final Map<String, Hold> holds = new HashMap<>();           // isbn -> a hold that is WAITING or READY\n    long duesPaise;                                            // unpaid fines and lost-book charges\n    /** A member who owes nothing and has nothing out. */\n    Member(String id, String name, Tier tier) { this.id = id; this.name = name; this.tier = tier; }\n}\n\n/** One copy lent to one member. The due date is a key in the library's due index, so only the library changes it. */\nfinal class Loan {\n    final int id;\n    final BookCopy copy;\n    final Member member;\n    final LocalDate borrowedOn;\n    LocalDate due;\n    int renewals;\n    LoanStatus status = LoanStatus.ACTIVE;\n    LocalDate closedOn;                                        // the day it came back, or was reported lost\n    long chargedPaise;                                         // the late fine, or the lost-book charge\n    /** A loan that starts today and is due on the given day. */\n    Loan(int id, BookCopy copy, Member member, LocalDate borrowedOn, LocalDate due) {\n        this.id = id; this.copy = copy; this.member = member; this.borrowedOn = borrowedOn; this.due = due;\n    }\n}\n\n/** A member's place in a title's queue. READY means a copy is on the hold shelf for him until pickupBy, inclusive. */\nfinal class Hold {\n    final int id;\n    final Member member;\n    final Book book;\n    HoldStatus status = HoldStatus.WAITING;\n    BookCopy copy;                                             // the copy set aside for him, while READY\n    LocalDate pickupBy;                                        // set when it becomes READY\n    /** A new hold, waiting. */\n    Hold(int id, Member member, Book book) { this.id = id; this.member = member; this.book = book; }\n}\n\n/** What a member takes home: a copy, its title and the due date. An immutable copy, safe to read after the lock. */\nrecord Slip(String barcode, String isbn, String title, String memberId, LocalDate due, int renewals) {}\n\n/** A hold as the member sees it: READY with a copy and a pickup date, or WAITING at a position (1 = next). */\nrecord HoldSlip(String memberId, String isbn, HoldStatus status, int position, String barcode, LocalDate pickupBy) {}\n\n/** The result of a return: the fine charged, and who the copy is now set aside for (null = back on the shelf). */\nrecord Receipt(String barcode, long finePaise, String heldFor) {}\n\n/** One search hit: the title, and how many of its copies are on the shelf right now. */\nrecord Found(String isbn, String title, String author, int onShelf, int copies) {}\n\n/** One notice for the listeners, built under the lock and delivered after it. */\nrecord LibraryEvent(EventKind kind, String memberId, String isbn, String barcode, LocalDate date, long paise) {}\n\n/** What a member may do: books at once, days per loan, renewals, and the most he may owe and still borrow. */\nrecord Terms(int maxLoans, int loanDays, int maxRenewals, long maxDuesPaise) {}\n\n/** The borrowing rules. They change (tiers, a holiday season), so they are handed in, and handed the whole member. */\ninterface LoanRules { Terms termsFor(Member m); }\n\n/** Everyone the same: 3 books at once, 14 days each, 2 renewals, no borrowing while owing more than Rs 100. */\nfinal class StandardTerms implements LoanRules {\n    private static final Terms ALL = new Terms(3, 14, 2, 10_000);\n    /** The same terms for every member. */\n    public Terms termsFor(Member m) { return ALL; }\n}\n\n/**\n * The late fine, in paise, for a loan that comes back on a given day. Handed the whole loan, so a rule can read\n * the book (a cap at its price) or the member (a student rate) without a new interface.\n */\ninterface FinePolicy { long fine(Loan loan, LocalDate returnedOn); }\n\n/** A flat rate for every day after the due date. Back on the due date itself: no fine. */\nfinal class PerDayFine implements FinePolicy {\n    private final long perDayPaise;\n    /** Rs 20 a day is new PerDayFine(2_000). */\n    PerDayFine(long perDayPaise) { this.perDayPaise = perDayPaise; }\n    /** Days late times the rate; zero when on time or early. */\n    public long fine(Loan loan, LocalDate returnedOn) {\n        long late = ChronoUnit.DAYS.between(loan.due, returnedOn);\n        return late <= 0 ? 0 : late * perDayPaise;\n    }\n}\n\n/** Wraps any fine rule and never charges more than a cap. A new class; the library did not change (Decorator). */\nfinal class CappedFine implements FinePolicy {\n    private final FinePolicy base;\n    private final long capPaise;\n    /** new CappedFine(new PerDayFine(2_000), 50_000): Rs 20 a day, never more than Rs 500. */\n    CappedFine(FinePolicy base, long capPaise) { this.base = base; this.capPaise = capPaise; }\n    /** The wrapped rule's fine, or the cap if that is smaller. */\n    public long fine(Loan loan, LocalDate returnedOn) { return Math.min(base.fine(loan, returnedOn), capPaise); }\n}\n\n/** Anyone who wants to hear what happened: an SMS sender, an e-mail job, the hold-shelf printer. Called after the lock. */\ninterface LibraryListener { void onEvent(LibraryEvent e); }\n\n/** Prints each notice. A real one sends an SMS. */\nfinal class NoticePrinter implements LibraryListener {\n    /** One line per notice. */\n    public void onEvent(LibraryEvent e) {\n        String what = switch (e.kind()) {\n            case HOLD_READY   -> e.barcode() + \" is on the hold shelf for you; collect it by \" + e.date();\n            case HOLD_EXPIRED -> e.barcode() + \" waited for you until \" + e.date() + \" and has been passed on\";\n            case FINE_CHARGED -> \"a charge of \" + Main.rs(e.paise()) + \" was added for \" + e.barcode();\n            case DUE_SOON     -> e.barcode() + \" is due on \" + e.date();\n        };\n        System.out.println(\"   [sms to \" + e.memberId() + \"] \" + what);\n    }\n}\n\n/** Where time comes from. Handed in, so a test can say \"the 15th of September\" and mean it. */\ninterface Clock { long nowMs(); }\n\n/**\n * Words to ISBNs, kept sorted, so \"every word that starts with clea\" is one range of the map. Finding the range\n * costs O(log n); each match after that costs one step, and the caller's limit stops the walk.\n */\nfinal class TokenIndex {\n    private final TreeMap<String, Set<String>> index = new TreeMap<>();   // \"clean\" -> {isbn, isbn}\n\n    /** File every word of the text under this ISBN. */\n    void add(String text, String isbn) {\n        for (String w : split(text)) index.computeIfAbsent(w, k -> new TreeSet<>()).add(isbn);\n    }\n    /** ISBNs that have a word starting with the prefix and pass the filter, at most limit of them. */\n    List<String> find(String prefix, Predicate<String> keep, int limit) {\n        List<String> out = new ArrayList<>();\n        Set<String> seen = new HashSet<>();\n        for (Set<String> isbns : index.subMap(prefix, true, prefix + Character.MAX_VALUE, true).values())\n            for (String isbn : isbns)\n                if (seen.add(isbn) && keep.test(isbn)) {\n                    out.add(isbn);\n                    if (out.size() == limit) return out;\n                }\n        return out;\n    }\n    /** Lower-case words; anything that is not a letter or a digit separates them. */\n    static List<String> split(String text) {\n        List<String> out = new ArrayList<>();\n        for (String w : text.toLowerCase(Locale.ROOT).split(\"[^\\\\p{L}\\\\p{N}]+\")) if (!w.isEmpty()) out.add(w);\n        return out;\n    }\n}\n\n/** The titles by ISBN, plus two word indexes (title words, author words) for search. Only the library changes it. */\nfinal class Catalog {\n    private final Map<String, Book> byIsbn = new HashMap<>();\n    private final TokenIndex titleWords = new TokenIndex(), authorWords = new TokenIndex();\n\n    /** Add a title and index its words. */\n    void add(Book b) { byIsbn.put(b.isbn, b); titleWords.add(b.title, b.isbn); authorWords.add(b.author, b.isbn); }\n    /** One title by ISBN, or null. O(1). */\n    Book get(String isbn) { return byIsbn.get(isbn); }\n    /** Titles in which every word of the query starts a word of the title: \"clean co\" finds Clean Code. */\n    List<Book> byTitle(String query, int limit)  { return search(titleWords, b -> b.title, query, limit); }\n    /** The same over author names: \"bloch\" finds Joshua Bloch's books. */\n    List<Book> byAuthor(String query, int limit) { return search(authorWords, b -> b.author, query, limit); }\n\n    /** The first word walks the index; the other words filter each candidate. Stops at the limit. */\n    private List<Book> search(TokenIndex idx, Function<Book, String> field, String query, int limit) {\n        List<String> words = TokenIndex.split(query);\n        if (words.isEmpty() || limit <= 0) return List.of();\n        List<String> rest = words.subList(1, words.size());\n        Predicate<String> hasAll = isbn -> {\n            List<String> have = TokenIndex.split(field.apply(byIsbn.get(isbn)));\n            for (String w : rest) if (have.stream().noneMatch(h -> h.startsWith(w))) return false;\n            return true;\n        };\n        List<Book> out = new ArrayList<>();\n        for (String isbn : idx.find(words.get(0), hasAll, limit)) out.add(byIsbn.get(isbn));\n        return out;\n    }\n}\n\n/**\n * The aggregate root and the only writer: the catalogue, the copies, the members, the loans, the holds and ONE\n * lock. Every public call goes through locked(): take the lock, hand on any held copy whose pickup date has\n * passed, do the work, release the lock, and only then tell the listeners.\n */\nfinal class Library {\n    private final Catalog catalog = new Catalog();\n    private final Map<String, BookCopy> copies = new HashMap<>();          // barcode -> copy\n    private final Map<String, Member> members = new HashMap<>();           // id -> member\n    private final Map<String, Loan> onLoan = new HashMap<>();              // barcode -> its active loan\n    private final TreeMap<LocalDate, Set<Loan>> byDue = new TreeMap<>();   // active loans by due date\n    private final PriorityQueue<Hold> readyByDeadline =                    // READY holds, earliest pickup date first\n        new PriorityQueue<>(Comparator.comparing((Hold h) -> h.pickupBy).thenComparingInt(h -> h.id));\n    private final ReentrantLock lock = new ReentrantLock();\n    private final List<LibraryListener> listeners = new CopyOnWriteArrayList<>();\n    private final AtomicInteger ids = new AtomicInteger();\n    private final ZoneId zone;\n    private final int pickupDays;\n    private volatile LoanRules rules = new StandardTerms();\n    private volatile FinePolicy fines = new CappedFine(new PerDayFine(2_000), 50_000);\n    private volatile Clock clock = System::currentTimeMillis;\n\n    /** A library in one time zone, where a copy on the hold shelf waits pickupDays days for its member. */\n    Library(ZoneId zone, int pickupDays) { this.zone = zone; this.pickupDays = pickupDays; }\n\n    /** Hand in the rules. The library never builds one, so a new rule costs one changed line here. */\n    void configure(LoanRules r, FinePolicy f) { rules = r; fines = f; }\n    /** Tests hand in a clock they control. */\n    void setClock(Clock c) { clock = c; }\n    /** Subscribe a listener. It hears every notice after the lock is released. */\n    void addListener(LibraryListener l) { listeners.add(l); }\n    /** Today's date in the library's zone, from the handed-in clock. */\n    LocalDate today() { return Instant.ofEpochMilli(clock.nowMs()).atZone(zone).toLocalDate(); }\n\n    // ---------------- the catalogue and the members\n\n    /** Add a title. A duplicate ISBN is refused. */\n    void addBook(String isbn, String title, String author, long pricePaise) {\n        locked(call -> {\n            if (catalog.get(isbn) != null) throw new Refused(Refusal.DUPLICATE_ID, isbn);\n            catalog.add(new Book(isbn, title, author, pricePaise));\n            return null;\n        });\n    }\n    /** Add a copy. Like a returned copy, it goes to the first member waiting for its title, and only then to the shelf. */\n    void addCopy(String isbn, String barcode) {\n        locked(call -> {\n            Book b = book(isbn);\n            if (copies.containsKey(barcode)) throw new Refused(Refusal.DUPLICATE_ID, barcode);\n            BookCopy c = new BookCopy(barcode, b);\n            b.copies.add(c);\n            copies.put(barcode, c);\n            placeCopy(c, call);\n            return null;\n        });\n    }\n    /** Register a member. A duplicate id is refused. */\n    void register(String id, String name, Tier tier) {\n        locked(call -> {\n            if (members.containsKey(id)) throw new Refused(Refusal.DUPLICATE_ID, id);\n            members.put(id, new Member(id, name, tier));\n            return null;\n        });\n    }\n    /**\n     * Unregister. Refused while he has a book out or owes money. His holds are cancelled, and a copy that was set\n     * aside for him goes to the next member in line.\n     */\n    void unregister(String memberId) {\n        locked(call -> {\n            Member m = member(memberId);\n            if (!m.loans.isEmpty()) throw new Refused(Refusal.HAS_LOANS, memberId + \" has \" + m.loans.size() + \" book(s) out\");\n            if (m.duesPaise > 0) throw new Refused(Refusal.OWES_FINES, memberId + \" owes \" + Main.rs(m.duesPaise));\n            for (Hold h : List.copyOf(m.holds.values())) cancel(h, call);\n            members.remove(memberId);\n            return null;\n        });\n    }\n\n    // ---------------- lending: the four calls a desk makes\n\n    /**\n     * Lend a copy of this title. His own copy from the hold shelf if one is set aside for him, else the head of the\n     * shelf. Every rule is checked before the first write, so a refusal changes nothing.\n     */\n    Slip checkout(String memberId, String isbn) {\n        return locked(call -> {\n            Member m = member(memberId);\n            Book b = book(isbn);\n            Terms t = rules.termsFor(m);                                   // handed-in code runs before any write\n            if (m.loans.containsKey(isbn)) throw new Refused(Refusal.ALREADY_HAS_TITLE, memberId + \" already has \" + b.title);\n            if (m.loans.size() >= t.maxLoans()) throw new Refused(Refusal.LIMIT_REACHED, memberId + \" has \" + t.maxLoans() + \" books out\");\n            if (m.duesPaise > t.maxDuesPaise()) throw new Refused(Refusal.OWES_FINES, memberId + \" owes \" + Main.rs(m.duesPaise));\n            Hold mine = m.holds.get(isbn);\n            boolean fromHoldShelf = mine != null && mine.status == HoldStatus.READY;\n            BookCopy copy = fromHoldShelf ? mine.copy : b.peekShelf();     // a copy held for someone else is not on the shelf\n            if (copy == null)\n                throw new Refused(Refusal.NOT_AVAILABLE, b.title + (mine != null ? \": you are number \" + b.position(m) + \" in the queue\" : \": place a hold\"));\n            // commit: nothing below can fail\n            if (fromHoldShelf) { mine.status = HoldStatus.COLLECTED; mine.copy = null; m.holds.remove(isbn); }\n            else b.takeFromShelf();\n            copy.status = CopyStatus.LOANED;\n            Loan loan = new Loan(ids.incrementAndGet(), copy, m, call.today(), call.today().plusDays(t.loanDays()));\n            onLoan.put(copy.barcode, loan);\n            m.loans.put(isbn, loan);\n            index(loan);\n            return slip(loan);\n        });\n    }\n\n    /**\n     * Place a hold. If a copy is on the shelf it is set aside for him at once (READY); otherwise he joins the back\n     * of the FIFO queue (WAITING). Either way no copy sits on the shelf while someone waits for its title.\n     */\n    HoldSlip placeHold(String memberId, String isbn) {\n        return locked(call -> {\n            Member m = member(memberId);\n            Book b = book(isbn);\n            if (m.loans.containsKey(isbn) || m.holds.containsKey(isbn))\n                throw new Refused(Refusal.ALREADY_HAS_TITLE, memberId + \" already has or awaits \" + b.title);\n            Hold h = new Hold(ids.incrementAndGet(), m, b);\n            m.holds.put(isbn, h);\n            BookCopy free = b.takeFromShelf();\n            if (free != null) setAside(h, free, call);                       // a copy is on the shelf: it is his\n            else b.enqueue(h);                                               // none: the back of the queue\n            return holdSlip(h);\n        });\n    }\n\n    /** Cancel his hold. A WAITING hold is skipped when it reaches the front; a READY one hands its copy to the next member. */\n    void cancelHold(String memberId, String isbn) {\n        locked(call -> {\n            Member m = member(memberId);\n            Hold h = m.holds.get(isbn);\n            if (h == null) throw new Refused(Refusal.NO_HOLD, memberId + \" has no hold on \" + isbn);\n            cancel(h, call);\n            return null;\n        });\n    }\n\n    /**\n     * Check a copy back in. The order is the design: find the loan (do not remove it); ask the fine rule, which is\n     * handed-in code and may throw while nothing has changed; then commit (close the loan, free his slot, add the\n     * fine); then placeCopy gives the copy to the first member waiting, or to the shelf. Listeners hear after the\n     * unlock. A second scan of the same barcode finds no loan and is refused, so nobody is fined twice.\n     */\n    Receipt returnCopy(String barcode) {\n        return locked(call -> {\n            Loan loan = activeLoan(barcode);\n            long fine = fineFor(loan, call.today());                        // may throw: nothing has changed yet\n            // commit: nothing below can fail\n            onLoan.remove(barcode);\n            unindex(loan);\n            loan.status = LoanStatus.RETURNED;\n            loan.closedOn = call.today();\n            loan.chargedPaise = fine;\n            loan.member.loans.remove(loan.copy.book.isbn);\n            if (fine > 0) {\n                loan.member.duesPaise += fine;\n                call.events().add(new LibraryEvent(EventKind.FINE_CHARGED, loan.member.id, loan.copy.book.isbn, barcode, call.today(), fine));\n            }\n            String heldFor = placeCopy(loan.copy, call);                      // the queue before the shelf\n            return new Receipt(barcode, fine, heldFor);\n        });\n    }\n\n    /**\n     * Renew: one more loan period on the due date. Refused when the book is overdue, when he has used his renewals,\n     * and when anyone is waiting for the title. The due date is the key of the due index, so the loan leaves the\n     * index before the date changes and goes back in after.\n     */\n    Slip renew(String barcode) {\n        return locked(call -> {\n            Loan loan = activeLoan(barcode);\n            Terms t = rules.termsFor(loan.member);\n            if (call.today().isAfter(loan.due)) throw new Refused(Refusal.OVERDUE, barcode + \" was due on \" + loan.due);\n            if (loan.renewals >= t.maxRenewals()) throw new Refused(Refusal.RENEWAL_LIMIT, barcode + \" renewed \" + loan.renewals + \" times\");\n            if (loan.copy.book.firstWaiting() != null) throw new Refused(Refusal.OTHERS_WAITING, loan.copy.book.title + \" has a queue\");\n            unindex(loan);\n            loan.due = loan.due.plusDays(t.loanDays());\n            loan.renewals++;\n            index(loan);\n            return slip(loan);\n        });\n    }\n\n    /**\n     * The member lost the copy. The charge is the book's price plus the fine so far, added to his dues. The copy\n     * leaves circulation; members waiting for the title keep their places for the next copy that frees up.\n     */\n    long reportLost(String barcode) {\n        return locked(call -> {\n            Loan loan = activeLoan(barcode);\n            long charge = loan.copy.book.pricePaise + fineFor(loan, call.today());      // handed-in code first\n            onLoan.remove(barcode);\n            unindex(loan);\n            loan.status = LoanStatus.LOST;\n            loan.closedOn = call.today();\n            loan.chargedPaise = charge;\n            loan.member.loans.remove(loan.copy.book.isbn);\n            loan.member.duesPaise += charge;\n            loan.copy.status = CopyStatus.LOST;\n            call.events().add(new LibraryEvent(EventKind.FINE_CHARGED, loan.member.id, loan.copy.book.isbn, barcode, call.today(), charge));\n            return charge;\n        });\n    }\n\n    /** He pays some or all of what he owes, in cash at the desk. */\n    void payFine(String memberId, long paise) {\n        locked(call -> {\n            Member m = member(memberId);\n            if (paise <= 0 || paise > m.duesPaise) throw new IllegalArgumentException(\"pay between 1 paise and \" + Main.rs(m.duesPaise));\n            m.duesPaise -= paise;\n            return null;\n        });\n    }\n\n    /** The nightly job. It does nothing of its own: every call already hands on holds whose pickup date has passed. */\n    void expireHolds() { locked(call -> null); }\n\n    // ---------------- reads: each one a lookup, never a scan of the whole library\n\n    /** Titles matching a title query, with how many copies are on the shelf. O(log n + limit). */\n    List<Found> searchTitle(String query, int limit)  { return locked(call -> found(catalog.byTitle(query, limit))); }\n    /** Titles matching an author query. O(log n + limit). */\n    List<Found> searchAuthor(String query, int limit) { return locked(call -> found(catalog.byAuthor(query, limit))); }\n    /** Copies of this title on the shelf right now. O(1). */\n    int onShelf(String isbn) { return locked(call -> book(isbn).onShelf()); }\n    /** His place in the queue for this title (1 = next), or 0. O(queue length). */\n    int position(String memberId, String isbn) { return locked(call -> book(isbn).position(member(memberId))); }\n    /** His hold on this title, or null. O(1) to find, plus the queue walk for a WAITING position. */\n    HoldSlip holdOf(String memberId, String isbn) {\n        return locked(call -> { Hold h = member(memberId).holds.get(isbn); return h == null ? null : holdSlip(h); });\n    }\n    /** Flipkart's audit, one way: the books this member has out. O(his loans). */\n    List<Slip> loansOf(String memberId) {\n        return locked(call -> member(memberId).loans.values().stream().map(this::slip).sorted(Comparator.comparing(Slip::barcode)).toList());\n    }\n    /** Flipkart's audit, the other way: the members who have a copy of this title. O(copies of the title). */\n    List<String> borrowersOf(String isbn) {\n        return locked(call -> {\n            List<Strin

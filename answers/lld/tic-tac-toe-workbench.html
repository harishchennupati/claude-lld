ngs this game is given and never builds: the win rule and the clock. Called before the first move. */\n    void configure(WinStrategy rule, Clock clock) {\n        this.winRule = Objects.requireNonNull(rule, &quot;a game needs a win rule&quot;);\n        this.clock = Objects.requireNonNull(clock, &quot;a game needs a clock&quot;);\n        this.turnStartedMs = clock.nowMs();              // the first seat&#x27;s turn starts now\n    }\n    /** Register a listener. The list is copy-on-write (each add makes a new array), so a publish already looping is not disturbed. */\n    void addObserver(GameObserver o) { observers.add(o); }\n\n    /** This game&#x27;s id. */\n    String id() { return id; }\n    /** The side length of the board. */\n    int size() { return board.size(); }\n    /** The seats, in turn order as they were at the start. */\n    List&lt;Player&gt; players() { return players; }\n    /** Where the game is. Read from a volatile field, so a spectator never waits on the lock. */\n    GameState state() { return state; }\n    /** The winner, or null while the game is live, drawn or abandoned. */\n    Player winner() { return winner; }\n    /** Whose turn it is, or null once the game is over. */\n    Player currentPlayer() { lock.lock(); try { return state.isTerminal() ? null : turnOrder.peekFirst(); } finally { lock.unlock(); } }\n    /** Every accepted move, in order, as a copy: the caller cannot edit this game&#x27;s truth. */\n    List&lt;Move&gt; history() { lock.lock(); try { return List.copyOf(history); } finally { lock.unlock(); } }\n    /** The mark on that square, or null. Bounds-checked, so a test can ask about anywhere. */\n    Symbol at(Cell c) { lock.lock(); try { return board.at(c.row(), c.col()); } finally { lock.unlock(); } }\n    /** How many squares are stamped. */\n    int filled() { lock.lock(); try { return board.filled(); } finally { lock.unlock(); } }\n    /** The board as text. Only the copy is taken under the lock; the text is built after it is released. */\n    String render() { return snapshot().render(); }\n    /** A detached copy of the board, for a bot or a screen that wants to read at its leisure. */\n    Board snapshot() { lock.lock(); try { return board.copy(); } finally { lock.unlock(); } }\n\n    /**\n     * The critical step. Order matters: every check runs before anything at all is written, so a refused move\n     * leaves the board, the turn and the history exactly as they were and the caller can simply try again.\n     * The mark, the win bookkeeping, the outcome and the turn all move inside one lock, so no reader can see\n     * a stamped square whose game has not yet decided whether it was a win. Listeners are told after unlock.\n     *\n     * @throws InvalidMoveException with a typed reason, if the move is refused\n     */\n    Move play(Player player, Cell cell) {\n        Move made = null; GameState from = null, to = null; InvalidMoveException bad = null;\n        lock.lock();\n        try {\n            if (winRule == null) throw new IllegalStateException(&quot;configure(rule, clock) before the first move&quot;);\n            if (state.isTerminal())                    bad = new InvalidMoveException(InvalidMoveException.Reason.GAME_OVER, id + &quot; is &quot; + state);\n            else if (!board.inBounds(cell))            bad = new InvalidMoveException(InvalidMoveException.Reason.OUT_OF_BOUNDS, cell + &quot; is off a &quot; + board.size() + &quot;x&quot; + board.size() + &quot; board&quot;);\n            else if (turnOrder.peekFirst() != player)  bad = new InvalidMoveException(InvalidMoveException.Reason.NOT_YOUR_TURN, player + &quot;, it is &quot; + turnOrder.peekFirst() + &quot;&#x27;s turn&quot;);\n            else if (!board.isFree(cell))              bad = new InvalidMoveException(InvalidMoveException.Reason.CELL_TAKEN, cell + &quot; already holds &quot; + board.at(cell));\n            if (bad == null) {\n                // nothing above wrote anything. From here on, nothing can fail except the rule, which is rolled back.\n                Move m = new Move(player, cell, seq + 1, clock.nowMs());\n                board.place(cell, player.symbol());\n                boolean won;\n                try { won = winRule.isWinning(board, m); }\n                catch (RuntimeException e) { board.lift(cell); throw e; }   // the move never happened\n                seq++;\n                history.add(m);\n                turnStartedMs = m.atMs();                // the next seat&#x27;s turn starts the moment this move landed\n                from = state;\n                if (won)                 { winner = player; state = GameState.WON; }   // winner first: whoever sees WON sees the winner\n                else if (board.isFull())   state = GameState.DRAW;           // checked AFTER the win: a line on the last square wins\n                else { state = GameState.IN_PROGRESS; turnOrder.addLast(turnOrder.removeFirst()); }\n                to = state; made = m;\n            }\n        } finally { lock.unlock(); }\n        if (bad != null) { publishRejected(player, cell, bad); throw bad; }\n        publishMove(made);\n        if (from != to) publishState(from, to);\n        return made;\n    }\n\n    /**\n     * Ask the seat whose turn it is for a square, then play it. The brain thinks OUTSIDE the lock on a\n     * snapshot, and is arbitrated inside it: losing a race is a normal, retriable outcome, not a bug.\n     */\n    Move playAuto() {\n        Player p; Board snap;\n        lock.lock();\n        try {\n            if (state.isTerminal()) throw new InvalidMoveException(InvalidMoveException.Reason.GAME_OVER, id + &quot; is &quot; + state);\n            p = turnOrder.peekFirst();\n            snap = board.copy();\n        } finally { lock.unlock(); }\n        Cell c = p.decide(snap);                                   // seconds, if it likes: no lock is held\n        if (c == null) throw new InvalidMoveException(InvalidMoveException.Reason.NO_FREE_CELL, &quot;no square left for &quot; + p);\n        return play(p, c);\n    }\n\n    /**\n     * Take the last move back, rewinding all five things that moved together: the board, the win rule&#x27;s\n     * counters, the sequence, the turn and the outcome. Forgetting any one of them is the classic bug --\n     * a board that looks empty and a rule that still believes somebody has three in a row. A win or a draw\n     * can be taken back; an abandoned game cannot, because the last move is not why it ended.\n     */\n    Move undo() {\n        Move gone; GameState from, to;\n        lock.lock();\n        try {\n            if (history.isEmpty()) throw new IllegalStateException(&quot;nothing to undo in &quot; + id);\n            if (state == GameState.ABANDONED) throw new IllegalStateException(id + &quot; was abandoned; undo cannot revive it&quot;);\n            gone = history.remove(history.size() - 1);\n            winRule.undo(board, gone);\n            board.lift(gone.cell());\n            seq--;\n            from = state;\n            winner = null;\n            state = history.isEmpty() ? GameState.NOT_STARTED : GameState.IN_PROGRESS;\n            while (turnOrder.peekFirst() != gone.player()) turnOrder.addLast(turnOrder.removeFirst());\n            turnStartedMs = clock.nowMs();               // the seat back on turn gets a fresh move clock\n            to = state;\n        } finally { lock.unlock(); }\n        publishUndo(gone);                               // every undo is announced, even one that leaves the state alone\n        if (from != to) publishState(from, to);\n        return gone;\n    }\n\n    /**\n     * End the game without a winner: a disconnect, a table closed. A no-op if the game has already ended, so\n     * a late call cannot overwrite a win.\n     */\n    void abandon(String why) {\n        GameState from, to; boolean changed = false;\n        lock.lock();\n        try {\n            from = state; to = state;\n            if (!state.isTerminal()) { state = GameState.ABANDONED; to = state; changed = true; }\n        } finally { lock.unlock(); }\n        if (changed) publishState(from, to);\n    }\n\n    /**\n     * The move clock&#x27;s check: end the game if the seat on turn has had more than limitMs. Reading the time\n     * and abandoning are one step inside the lock, so a move that lands first always beats a late tick.\n     * True if this call ended the game.\n     */\n    boolean abandonIfIdle(long limitMs) {\n        GameState from; boolean changed = false;\n        lock.lock();\n        try {\n            from = state;\n            if (!state.isTerminal() &amp;&amp; clock.nowMs() - turnStartedMs &gt; limitMs) { state = GameState.ABANDONED; changed = true; }\n        } finally { lock.unlock(); }\n        if (changed) publishState(from, GameState.ABANDONED);\n        return changed;\n    }\n\n    // Listeners run after the unlock, each in its own try/catch: a broken spectator cannot break a game.\n    private void publishMove(Move m) { for (GameObserver o : observers) try { o.onMove(this, m); } catch (RuntimeException ignored) { } }\n    private void publishUndo(Move m) { for (GameObserver o : observers) try { o.onUndo(this, m); } catch (RuntimeException ignored) { } }\n    private void publishState(GameState from, GameState to) { for (GameObserver o : observers) try { o.onStateChange(this, from, to); } catch (RuntimeException ignored) { } }\n    private void publishRejected(Player p, Cell c, InvalidMoveException e) { for (GameObserver o : observers) try { o.onRejected(this, p, c, e); } catch (RuntimeException ignored) { } }\n}\n\n/**\n * The thin caller: what a web layer holds. It keeps the live games by id and hands each new one its rule,\n * its clock and the standing observers. It owns no lock of its own -- the lock lives in each Game -- so ten\n * thousand games proceed in parallel and never wait for one another.\n */\nclass GameService {\n    private final Map&lt;String, Game&gt; games = new ConcurrentHashMap&lt;&gt;();\n    private final List&lt;GameObserver&gt; standing = new CopyOnWriteArrayList&lt;&gt;();\n    private Clock clock = System::currentTimeMillis;\n\n    /** Hand in the clock every new game will be built with. */\n    void setClock(Clock c) { clock = c; }\n    /** An observer attached to every game created from now on. */\n    void addObserver(GameObserver o) { standing.add(o); }\n    /**\n     * Create a game. Pass null for the rule to get the classic full-line rule sized for this board and these\n     * seats; the Game itself never builds a rule.\n     */\n    Game newGame(String id, int size, List&lt;Player&gt; players, WinStrategy rule) {\n        Game g = new Game(id, size, players);\n        g.configure(rule != null ? rule : new FullLineWinStrategy(size, players.size()), clock);\n        for (GameObserver o : standing) g.addObserver(o);\n        if (games.putIfAbsent(id, g) != null) throw new IllegalStateException(&quot;a game already has the id &quot; + id);\n        return g;\n    }\n    /** The game with that id, or null. */\n    Game game(String id) { return games.get(id); }\n    /** Every game still in the map. */\n    Collection&lt;Game&gt; live() { return games.values(); }\n    /** Forget a finished game, so memory does not grow forever. */\n    void end(String id) { games.remove(id); }\n}\n\n/** Runs the system: a scripted win, an undo, a win on the last free square, and a fifty-thread race. */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        GameService service = new GameService();\n        ScoreBoard scores = new ScoreBoard();\n        service.addObserver(new MoveLogger());\n        service.addObserver(scores);\n\n        System.out.println(&quot;=== 1. scripted 4x4: Ann takes column 0 ===&quot;);\n        Player ann = new Player(&quot;Ann&quot;, new Symbol(&#x27;X&#x27;, 0), new ScriptedStrategy(new Cell(0, 0), new Cell(1, 0), new Cell(2, 0), new Cell(3, 0)));\n        Player bob = new Player(&quot;Bob&quot;, new Symbol(&#x27;O&#x27;, 1), new ScriptedStrategy(new Cell(0, 1), new Cell(1, 1), new Cell(2, 1)));\n        Game g1 = service.newGame(&quot;g1&quot;, 4, List.of(ann, bob), null);\n        while (!g1.state().isTerminal()) g1.playAuto();\n        System.out.print(g1.render());\n        System.out.println(&quot;     result &quot; + g1.state() + &quot; winner=&quot; + g1.winner() + &quot;  &quot; + scores);\n\n        System.out.println(&quot;=== 2. undo rewinds board, counters, turn and state together ===&quot;);\n        Move gone = g1.undo();\n        System.out.println(&quot;     took back &quot; + gone);\n        System.out.println(&quot;     state=&quot; + g1.state() + &quot; winner=&quot; + g1.winner() + &quot; turn=&quot; + g1.currentPlayer() + &quot; moves=&quot; + g1.history().size());\n        g1.play(ann, new Cell(3, 0));                              // the same square again: the counters were rewound, so it wins again\n        System.out.println(&quot;     replayed the same square -&gt; &quot; + g1.state() + &quot; winner=&quot; + g1.winner());\n\n        System.out.println(&quot;=== 3. a line completed on the LAST free square is a win, not a draw ===&quot;);\n        Cell[] xs = { new Cell(0, 0), new Cell(0, 2), new Cell(2, 0), new Cell(2, 2), new Cell(1, 1) };\n        Cell[] os = { new Cell(0, 1), new Cell(1, 0), new Cell(1, 2), new Cell(2, 1) };\n        Player cat = new Player(&quot;Cat&quot;, new Symbol(&#x27;X&#x27;, 0), new ScriptedStrategy(xs));\n        Player dan = new Player(&quot;Dan&quot;, new Symbol(&#x27;O&#x27;, 1), new ScriptedStrategy(os));\n        Game g2 = service.newGame(&quot;g2&quot;, 3, List.of(cat, dan), null);\n        while (!g2.state().isTerminal()) g2.playAuto();\n        System.out.print(g2.render());\n        System.out.println(&quot;     board full=&quot; + (g2.filled() == 9) + &quot;  result &quot; + g2.state() + &quot; winner=&quot; + g2.winner() + &quot;  &quot; + scores);\n\n        System.out.println(&quot;=== 4. race: fifty threads stamp the SAME square at the same instant ===&quot;);\n        Player eve = new Player(&quot;Eve&quot;, new Symbol(&#x27;X&#x27;, 0), new ScriptedStrategy());\n        Player fin = new Player(&quot;Fin&quot;, new Symbol(&#x27;O&#x27;, 1), new ScriptedStrategy());\n        Game g3 = new Game(&quot;g3&quot;, 3, List.of(eve, fin));          // built directly, no logger: fifty threads would drown the output\n        g3.configure(new FullLineWinStrategy(3, 2), System::currentTimeMillis);\n        Cell centre = new Cell(1, 1);\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        Map&lt;String, Integer&gt; outcome = new ConcurrentHashMap&lt;&gt;();\n        List&lt;Future&lt;?&gt;&gt; shots = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final Player who = (i % 2 == 0) ? eve : fin;\n            shots.add(pool.submit(() -&gt; {\n                go.await();\n                try { g3.play(who, centre); outcome.merge(&quot;accepted&quot;, 1, Integer::sum); }\n                catch (InvalidMoveException e) { outcome.merge(e.reason.name(), 1, Integer::sum); }\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : shots) f.get();\n        pool.shutdown();\n        System.out.println(&quot;     outcomes &quot; + new TreeMap&lt;&gt;(outcome));\n        System.out.println(&quot;     accepted=&quot; + outcome.getOrDefault(&quot;accepted&quot;, 0) + &quot;  marks on the board=&quot; + g3.filled()\n                + &quot;  moves in history=&quot; + g3.history().size() + &quot;  turn=&quot; + g3.currentPlayer());\n        System.out.print(g3.render());\n        System.out.println(&quot;done.&quot;);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: k in a row -- the payoff. A new class behind WinStrategy; Board, Game, Player and the observers never move.\n/**\n * &quot;On a 5x5, four in a row wins.&quot; The counters in FullLineWinStrategy can only answer &quot;is this whole line\n * mine&quot; and cannot see four inside a row of five, so this is a different rule, not a patched one. It walks\n * outward from the square that was just played in four directions, which is O(k) instead of O(1) -- the\n * honest cost of the change. It keeps no state at all, so the interface&#x27;s no-op undo() is already correct.\n * Call site: new Game(&quot;g&quot;, 5, seats) then configure(new KInARowWinStrategy(4), clock).\n */\nclass KInARowWinStrategy implements WinStrategy {\n    private static final int[][] DIRS = { {0, 1}, {1, 0}, {1, 1}, {1, -1} };\n    private final int k;\n    /** k marks in an unbroken line win. k must be at most the board size or nobody can ever win. */\n    KInARowWinStrategy(int k) { this.k = k; }\n\n    /** The played square plus its run in each direction and the opposite one. */\n    @Override public boolean isWinning(Board board, Move move) {\n        for (int[] d : DIRS)\n            if (1 + walk(board, move, d[0], d[1]) + walk(board, move, -d[0], -d[1]) &gt;= k) return true;\n        return false;\n    }\n    private int walk(Board board, Move move, int dr, int dc) {\n        int n = 0, r = move.cell().row() + dr, c = move.cell().col() + dc;\n        while (move.symbol().equals(board.at(r, c))) { n++; r += dr; c += dc; }   // at() returns null off the board\n        return n;\n    }\n}\n\n// ---- ext: the scan rule -- the obvious O(n) win check, kept as a rule so it can be swapped in and measured.\n/**\n * The rule most people write first: after a move, walk its row, its column and the two diagonals through it.\n * That is about 4n reads per move instead of four increments, and it keeps no state, so it inherits the\n * interface&#x27;s no-op undo(). On a fixed 3x3 it is the simpler, cheaper choice; the counters win the moment the\n * board size is a parameter. Both rules are handed to the same Game, which is Liskov with a test behind it.\n */\nclass ScanWinStrategy implements WinStrategy {\n    /** Only the four lines through the square just played can have changed, so only those are walked. */\n    @Override public boolean isWinning(Board board, Move move) {\n        int n = board.size(), r = move.cell().row(), c = move.cell().col();\n        Symbol s = move.symbol();\n        boolean row = true, col = true;\n        for (int i = 0; i &lt; n; i++) {\n            if (!s.equals(board.at(r, i))) row = false;\n            if (!s.equals(board.at(i, c))) col = false;\n        }\n        if (row || col) return true;\n        if (r == c            &amp;&amp; full(board, s, 0, 0, 1, 1))  return true;\n        if (r + c == n - 1    &amp;&amp; full(board, s, 0, n - 1, 1, -1)) return true;\n        return false;\n    }\n    /** Is that whole line one mark? */\n    private boolean full(Board b, Symbol s, int r0, int c0, int dr, int dc) {\n        for (int i = 0, r = r0, c = c0; i &lt; b.size(); i++, r += dr, c += dc) if (!s.equals(b.at(r, c))) return false;\n        return true;\n    }\n}\n\n// ---- ext: gravity -- Connect-4 is this game with one mapping: a piece falls to the lowest free row of its column.\n/** Where a piece dropped into a column comes to rest. The only new idea Connect-4 needs. */\nclass Gravity {\n    /** The lowest free square in that column. Throws the same typed rejection the engine would. */\n    static Cell drop(Board board, int col) {\n        if (col &lt; 0 || col &gt;= board.size())\n            throw new InvalidMoveException(InvalidMoveException.Reason.OUT_OF_BOUNDS, &quot;no column &quot; + col);\n        for (int r = board.size() - 1; r &gt;= 0; r--) if (board.at(r, col) == null) return new Cell(r, col);\n        throw new InvalidMoveException(InvalidMoveException.Reason.CELL_TAKEN, &quot;column &quot; + col + &quot; is full&quot;);\n    }\n}\n\n/**\n * Connect-4 as a thin front for the same Game: the rule is KInARowWinStrategy(4) and the only new code maps a\n * column to a square. The front must be the only door a client gets -- drop(column), never play(cell) or undo(),\n * because play() does not know about gravity. Then a column can only grow between the snapshot and the move:\n * if another player fills that square first, the caller gets CELL_TAKEN and drops again -- the ordinary retry.\n * Board is square here; a real 7 x 6 board is the one change to Board (rows and columns instead of one size).\n */\nclass ConnectFour {\n    private final Game game;\n    /** Wraps a game that was configured with a k-in-a-row rule. */\n    ConnectFour(Game game) { this.game = game; }\n    /** Drop a piece into a column. */\n    Move drop(Player p, int col) { return game.play(p, Gravity.drop(game.snapshot(), col)); }\n}\n\n/** A bot that thinks in columns. Proof that gravity needs no change in Game, Board or the win rule. */\nclass ColumnBot implements MoveStrategy {\n    private final Random rng;\n    /** Seeded, so a demo replays exactly. */\n    ColumnBot(long seed) { rng = new Random(seed); }\n    @Override public Cell chooseMove(Board board, Symbol symbol) {\n        List&lt;Integer&gt; open = new ArrayList&lt;&gt;();\n        for (int c = 0; c &lt; board.size(); c++) if (board.at(0, c) == null) open.add(c);\n        return open.isEmpty() ? null : Gravity.drop(board, open.get(rng.nextInt(open.size())));\n    }\n}\n\n// ---- ext: the unbeatable bot -- a new MoveStrategy and nothing else; the engine does not know bots exist.\n/**\n * Minimax with alpha-beta pruning: it plays the move that gives the opponent the worst best answer, so on a\n * 3x3 it wins or draws and never loses. It works on a COPY of the board, which is why Board.copy() exists,\n * and it judges hypothetical positions with its own full scan -- those are not the hot path, so O(n^2) there\n * costs nothing. Depth is in the score, so a win in three beats the same win in five.\n */\nclass MinimaxStrategy implements MoveStrategy {\n    private final Symbol opponent;\n    /** Needs to know who it is playing against, because it scores the opponent&#x27;s best reply. */\n    MinimaxStrategy(Symbol opponent) { this.opponent = opponent; }\n\n    /** The best square available, judged to the end of the game. */\n    @Override public Cell chooseMove(Board board, Symbol me) {\n        Board work = board.copy();\n        Cell best = null; int bestScore = Integer.MIN_VALUE;\n        for (Cell c : work.freeCells()) {\n            work.place(c, me);\n            int s = score(work, me, false, 1, Integer.MIN_VALUE, Integer.MAX_VALUE);\n            work.lift(c);\n            if (s &gt; bestScore) { bestScore = s; best = c; }\n        }\n        return best;\n    }\n    private int score(Board b, Symbol me, boolean myTurn, int depth, int alpha, int beta) {\n        if (wins(b, me))       return 10 - depth;                 // sooner is better\n        if (wins(b, opponent)) return depth - 10;\n        List&lt;Cell&gt; free = b.freeCells();\n        if (free.isEmpty()) return 0;\n        int best = myTurn ? Integer.MIN_VALUE : Integer.MAX_VALUE;\n        for (Cell c : free) {\n            b.place(c, myTurn ? me : opponent);\n            int s = score(b, me, !myTurn, depth + 1, alpha, beta);\n            b.lift(c);\n            if (myTurn) { best = Math.max(best, s); alpha = Math.max(alpha, best); }\n            else        { best = Math.min(best, s); beta  = Math.min(beta,  best); }\n            if (beta &lt;= alpha) break;                             // this branch cannot change the answer\n        }\n        return best;\n    }\n    /** A full scan, on a hypothetical board. The real game never uses this: it has the O(1) counters. */\n    private boolean wins(Board b, Symbol s) {\n        int n = b.size();\n        for (int i = 0; i &lt; n; i++) {\n            boolean row = true, col = true;\n            for (int j = 0; j &lt; n; j++) {\n                if (!s.equals(b.at(i, j))) row = false;\n                if (!s.equals(b.at(j, i))) col = false;\n            }\n            if (row || col) return true;\n        }\n        boolean diag = true, anti = true;\n        for (int i = 0; i &lt; n; i++) {\n            if (!s.equals(b.at(i, i)))         diag = false;\n            if (!s.equals(b.at(i, n - 1 - i))) anti = false;\n        }\n        return diag || anti;\n    }\n}\n\n// ---- ext: undo and redo for a whole match -- the history IS the undo log, so redo is a stack and five lines.\n/**\n * Redo on top of the engine&#x27;s undo. Every undone move is pushed on a stack; redo replays it through the\n * ordinary play(), so it passes every check again and cannot smuggle an illegal position back in. A fresh\n * move clears the stack, because the branch it belonged to no longer exists.\n */\nclass MatchHistory {\n    private final Game game;\n    private final Deque&lt;Move&gt; undone = new ArrayDeque&lt;&gt;();\n\n    /** Wraps one game. */\n    MatchHistory(Game game) { this.game = game; }\n    /** A new move ends the redo branch. */\n    Move play(Player p, Cell c) { Move m = game.play(p, c); undone.clear(); return m; }\n    /** Take one back and remember it. */\n    Move undo() { Move m = game.undo(); undone.push(m); return m; }\n    /** Put the last undone move back, through the same validation as any other move. */\n    Move redo() {\n        Move m = undone.poll();\n        if (m == null) throw new IllegalStateException(&quot;nothing to redo&quot;);\n        return game.play(m.player(), m.cell());\n    }\n    /** How many moves are waiting to be redone. */\n    int pending() { return undone.size(); }\n}\n\n// ---- ext: persistence -- save the MOVE LIST, not the board; resuming is a replay, and audit comes free.\n/**\n * The move list is the source of truth, so persistence is a text file of moves and loading is replaying them\n * through play(). Nothing serialises the board, the counters or the turn: they are rebuilt, which means a\n * saved game can never be restored into a state the rules would not allow.\n */\nclass MoveLog {\n    /**\n     * One line per move: seq,seat,row,col. The seat is the symbol index, not the name, because two seats may\n     * share a name. A real system would write these rows to a table.\n     */\n    static List&lt;String&gt; save(Game g) {\n        List&lt;String&gt; rows = new ArrayList&lt;&gt;();\n        for (Move m : g.history()) rows.add(m.seq() + &quot;,&quot; + m.symbol().index() + &quot;,&quot; + m.cell().row() + &quot;,&quot; + m.cell().col());\n        return rows;\n    }\n    /** Rebuild a game from its moves. The seats must carry the same symbol indexes as the saved game. */\n    static Game load(GameService service, String id, int size, List&lt;Player&gt; seats, WinStrategy rule, List&lt;String&gt; rows) {\n        Game g = service.newGame(id, size, seats, rule);\n        Map&lt;Integer, Player&gt; bySeat = new HashMap&lt;&gt;();\n        for (Player p : seats) bySeat.put(p.symbol().index(), p);\n        for (String row : rows) {\n            String[] f = row.split(&quot;,&quot;);\n            g.play(bySeat.get(Integer.parseInt(f[1])), new Cell(Integer.parseInt(f[2]), Integer.parseInt(f[3])));\n        }\n        return g;\n    }\n}\n\n// ---- ext: a move clock -- thirty seconds a turn; one sweeper for every game, and the check runs inside each game&#x27;s lock.\n/**\n * A move clock for a whole server: one scheduled task sweeps every live game once a second and asks each game\n * to end itself if the seat on turn has run out. The game decides inside its own lock, against the time it\n * noted when that turn began, so a move that lands a microsecond before the tick always wins. Time comes from\n * the injected Clock, so a test moves the clock forward thirty-one seconds instead of sleeping.\n */\nclass TurnTimer {\n    private final GameService service;\n    private final long limitMs;\n\n    /** The games to watch, and how long a seat may think. */\n    TurnTimer(GameService service, long limitMs) { this.service = service; this.limitMs = limitMs; }\n    /** One sweep over every live game. Returns how many games this tick ended. */\n    int tick() {\n        int ended = 0;\n        for (Game g : service.live()) if (g.abandonIfIdle(limitMs)) ended++;\n        return ended;\n    }\n    /** Sweep once a second. The try/catch matters: a periodic task that throws once is never run again. */\n    ScheduledFuture&lt;?&gt; every(ScheduledExecutorService scheduler) {\n        return scheduler.scheduleAtFixedRate(() -&gt; { try { tick(); } catch (RuntimeException ignored) { } }, 1, 1, TimeUnit.SECONDS);\n    }\n}\n\n// ---- ext: three seats on a 5x5 -- the counters are already [line][seat], so the win maths needs no edit.\n/** Three players, one table. The only guard to revisit is seats &lt;= board size, which the Game already makes. */\nclass ThreeSeats {\n    /** A 5x5 table with three seeded bots, using the ordinary full-line rule. */\n    static Game table(GameService service, String id) {\n        Player ann = new Player(&quot;Ann&quot;, new Symbol(&#x27;X&#x27;, 0), new RandomBotStrategy(7));\n        Player bob = new Player(&quot;Bob&quot;, new Symbol(&#x27;O&#x27;, 1), new RandomBotStrategy(8));\n        Player cal = new Player(&quot;Cal&quot;, new Symbol(&#x27;Z&#x27;, 2), new RandomBotStrategy(9));\n        return service.newGame(id, 5, List.of(ann, bob, cal), null);\n    }\n}\n\n// ---- ext: early draw -- spot a dead game before the board fills, as a WATCHER, with no change to the engine.\n/**\n * A line is dead once two different marks appear in it; when every row, column and diagonal is dead, nobody\n * can win and the game is already a draw. This is written as an observer precisely so the engine does not\n * move: it scans a snapshot, O(n^2) per move. Making it free would mean a second injected rule on the Game\n * that keeps a &quot;distinct marks&quot; count per line -- the one twist on this page that reopens Game.\n */\nclass DeadLineWatcher implements GameObserver {\n    private volatile Long drawnAtSeq;\n\n    @Override public void onMove(Game g, Move m) {\n        if (drawnAtSeq == null &amp;&amp; !g.state().isTerminal() &amp;&amp; allLinesDead(g.snapshot())) drawnAtSeq = m.seq();\n    }\n    /** The move number after which no player could still win, or null if the game was still alive. */\n    Long drawnAtSeq() { return drawnAtSeq; }\n\n    private boolean allLinesDead(Board b) {\n        int n = b.size();\n        for (int i = 0; i &lt; n; i++) {\n            if (!dead(b, i, 0, 0, 1) || !dead(b, 0, i, 1, 0)) return false;\n        }\n        return dead(b, 0, 0, 1, 1) &amp;&amp; dead(b, 0, n - 1, 1, -1);\n    }\n    private boolean dead(Board b, int r0, int c0, int dr, int dc) {\n        Symbol seen = null;\n        for (int i = 0, r = r0, c = c0; i &lt; b.size(); i++, r += dr, c += dc) {\n            Symbol s = b.at(r, c);\n            if (s == null) continue;\n            if (seen == null) seen = s;\n            else if (!seen.equals(s)) return true;                // two different marks: this line can never be won\n        }\n        return false;\n    }\n}\n\n// ---- ext: a game server -- thousands of games, one lock each, and a spectator feed that is never in the way.\n/**\n * What a spectator sees. Frames are appended per game, so a late joiner can be sent the whole feed. Two players&#x27;\n * threads can deliver out of order, so each move frame carries its sequence number to put it back in place.\n * Wrap this in AsyncObserver when the spectator is a socket: then a slow client drops frames instead of slowing the game.\n */\nclass SpectatorFeed implements GameObserver {\n    private final Map&lt;String, List&lt;String&gt;&gt; frames = new ConcurrentHashMap&lt;&gt;();\n    @Override public void onMove(Game g, Move m) { frame(g.id(), m.toString()); }\n    @Override public void onUndo(Game g, Move m) { frame(g.id(), &quot;undo &quot; + m); }\n    @Override public void onStateChange(Game g, GameState from, GameState to) { frame(g.id(), from + &quot; -&gt; &quot; + to); }\n    private void frame(String id, String text) { frames.computeIfAbsent(id, k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(text); }\n    /** Everything that has happened in that game, in order. */\n    List&lt;String&gt; feed(String gameId) { return frames.getOrDefault(gameId, List.of()); }\n}\n\n/** Plays a fleet of games at once, to show that the per-game lock is the whole scaling story. */\nclass Fleet {\n    /** Creates games games of 3x3 bots and plays every one of them to the end on a pool. Returns how many finished. */\n    static int playAll(GameService service, int games, int threads) throws Exception {\n        List&lt;Game&gt; all = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; games; i++) {\n            Player a = new Player(&quot;A&quot; + i, new Symbol(&#x27;X&#x27;, 0), new RandomBotStrategy(i));\n            Player b = new Player(&quot;B&quot; + i, new Symbol(&#x27;O&#x27;, 1), new RandomBotStrategy(1000 + i));\n            all.add(service.newGame(&quot;f&quot; + i, 3, List.of(a, b), null));\n        }\n        ExecutorService pool = Executors.newFixedThreadPool(threads);\n        List&lt;Future&lt;?&gt;&gt; running = new ArrayList&lt;&gt;();\n        for (Game g : all) running.add(pool.submit(() -&gt; { while (!g.state().isTerminal()) g.playAuto(); return null; }));\n        for (Future&lt;?&gt; f : running) f.get();\n        pool.shutdown();\n        int done = 0;\n        for (Game g : all) if (g.state().isTerminal()) done++;\n        return done;\n    }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        GameService service = new GameService();\n\n        // 1. k in a row: four in a row on a 5x5, a new rule class and nothing else\n        Player ann = new Player(&quot;Ann&quot;, new Symbol(&#x27;X&#x27;, 0),\n                new ScriptedStrategy(new Cell(2, 1), new Cell(2, 2), new Cell(2, 3), new Cell(2, 4)));\n        Player bob = new Player(&quot;Bob&quot;, new Symbol(&#x27;O&#x27;, 1),\n                new ScriptedStrategy(new Cell(0, 0), new Cell(0, 1), new Cell(0, 2)));\n        Game five = service.newGame(&quot;k5&quot;, 5, List.of(ann, bob), new KInARowWinStrategy(4));\n        while (!five.state().isTerminal()) five.playAuto();\n        System.out.println(&quot;k-in-a-row 5x5: &quot; + five.state() + &quot; winner=&quot; + five.winner() + &quot; after &quot; + five.history().size() + &quot; moves&quot;);\n\n        // 2. gravity: Connect-4 on a 6x6, same engine, same lock\n        Player red = new Player(&quot;Red&quot;, new Symbol(&#x27;R&#x27;, 0), new ColumnBot(3));\n        Player yel = new Player(&quot;Yel&quot;, new Symbol(&#x27;Y&#x27;, 1), new ColumnBot(4));\n        Game c4 = service.newGame(&quot;c4&quot;, 6, List.of(red, yel), new KInARowWinStrategy(4));\n        ConnectFour table = new ConnectFour(c4);\n        table.drop(red, 2); table.drop(yel, 5);\n        while (!c4.state().isTerminal()) c4.playAuto();\n        System.out.println(&quot;connect-4 6x6: &quot; + c4.state() + &quot; winner=&quot; + c4.winner() + &quot; after &quot; + c4.history().size() + &quot; moves&quot;);\n        System.out.print(c4.render());\n\n        // 3. the unbeatable bot: minimax never loses on a 3x3\n        Symbol x = new Symbol(&#x27;X&#x27;, 0), o = new Symbol(&#x27;O&#x27;, 1);\n        int losses = 0;\n        for (int seed = 0; seed &lt; 6; seed++) {\n            Player brain = new Player(&quot;Mini&quot;, x, new MinimaxStrategy(o));\n            Player dice  = new Player(&quot;Dice&quot;, o, new RandomBotStrategy(seed));\n            Game g = service.newGame(&quot;mm&quot; + seed, 3, List.of(brain, dice), null);\n            while (!g.state().isTerminal()) g.playAuto();\n            if (g.state() == GameState.WON &amp;&amp; g.winner() == dice) losses++;\n        }\n        System.out.println(&quot;minimax over 6 games: losses=&quot; + losses);\n\n        // 4. undo and redo\n        Player cat = new Player(&quot;Cat&quot;, new Symbol(&#x27;X&#x27;, 0), new ScriptedStrategy());\n        Player dan = new Player(&quot;Dan&quot;, new Symbol(&#x27;O&#x27;, 1), new ScriptedStrategy());\n        Game ur = service.newGame(&quot;ur&quot;, 3, List.of(cat, dan), null);\n        MatchHistory match = new MatchHistory(ur);\n        match.play(cat, new Cell(0, 0)); match.play(dan, new Cell(1, 1)); match.play(cat, new Cell(0, 1));\n        match.undo(); match.undo();\n        System.out.println(&quot;undo twice: moves=&quot; + ur.history().size() + &quot; turn=&quot; + ur.currentPlayer() + &quot; pending redo=&quot; + match.pending());\n        match.redo(); match.redo();\n        System.out.println(&quot;redo twice: moves=&quot; + ur.history().size() + &quot; last=&quot; + ur.history().get(ur.history().size() - 1));\n\n        // 5. persistence: save the moves, replay them into a fresh game\n        List&lt;String&gt; rows = MoveLog.save(ur);\n        Player cat2 = new Player(&quot;Cat&quot;, new Symbol(&#x27;X&#x27;, 0), new ScriptedStrategy());\n        Player dan2 = new Player(&quot;Dan&quot;, new Symbol(&#x27;O&#x27;, 1), new ScriptedStrategy());\n        Game back = MoveLog.load(service, &quot;ur-restored&quot;, 3, List.of(cat2, dan2), null, rows);\n        System.out.println(&quot;replayed &quot; + rows.size() + &quot; rows: same board=&quot; + back.render().equals(ur.render())\n                + &quot; same state=&quot; + (back.state() == ur.state()));\n\n        // 6. a move clock, on a clock the demo owns\n        long[] now = { 1_700_000_000_000L };\n        GameService clocked = new GameService();\n        clocked.setClock(() -&gt; now[0]);\n        Player eve = new Player(&quot;Eve&quot;, new Symbol(&#x27;X&#x27;, 0), new ScriptedStrategy());\n        Player fin = new Player(&quot;Fin&quot;, new Symbol(&#x27;O&#x27;, 1), new ScriptedStrategy());\n        Game timed = clocked.newGame(&quot;timed&quot;, 3, List.of(eve, fin), null);\n        TurnTimer timer = new TurnTimer(clocked, 30_000);\n        timed.play(eve, new Cell(0, 0));\n        now[0] += 29_000;\n        timed.play(fin, new Cell(1, 1));                           // Fin moves at 29 seconds: in time\n        int early = timer.tick();\n        now[0] += 31_000;                                          // Eve thinks for thirty-one seconds\n        ScheduledExecutorService sweeper = Executors.newSingleThreadScheduledExecutor();\n        timer.every(sweeper).cancel(false);                        // how a server runs it; the demo ticks by hand\n        sweeper.shutdown();\n        System.out.println(&quot;move clock: ended at 29 s=&quot; + early + &quot;, at 31 s idle=&quot; + timer.tick() + &quot; state=&quot; + timed.state());\n\n        // 7. three seats on a 5x5\n        Game three = ThreeSeats.table(service, &quot;three&quot;);\n        while (!three.state().isTerminal()) three.playAuto();\n        System.out.println(&quot;three seats 5x5: &quot; + three.state() + &quot; winner=&quot; + three.winner() + &quot; after &quot; + three.history().size() + &quot; moves&quot;);\n\n        // 8. early draw, spotted by a watcher with no change to the engine\n        DeadLineWatcher watcher = new DeadLineWatcher();\n        Player gil = new Player(&quot;Gil&quot;, new Symbol(&#x27;X&#x27;, 0),\n                new ScriptedStrategy(new Cell(0, 0), new Cell(0, 2), new Cell(1, 0), new Cell(2, 1), new Cell(2, 2)));\n        Player hal = new Player(&quot;Hal&quot;, new Symbol(&#x27;O&#x27;, 1),\n                new ScriptedStrategy(new Cell(0, 1), new Cell(1, 1), new Cell(1, 2), new Cell(2, 0)));\n        Game dead = service.newGame(&quot;dead&quot;, 3, List.of(gil, hal), null);\n        dead.addObserver(watcher);\n        while (!dead.state().isTerminal()) dead.playAuto();\n        System.out.println(&quot;early draw: result=&quot; + dead.state() + &quot; no line could still be won after move &quot; + watcher.drawnAtSeq());\n\n        // 9. a game server: a spectator feed, and two hundred games at once\n        SpectatorFeed feed = new SpectatorFeed();\n        AsyncObserver socket = new AsyncObserver(feed, 8192);\n        GameService server = new GameService();\n        server.addObserver(socket);\n        int finished = Fleet.playAll(server, 200, 8);\n        Thread.sleep(200);                                         // let the pump drain before we read the feed\n        System.out.println(&quot;fleet: &quot; + finished + &quot;/200 games finished, feed for f0 has &quot; + feed.feed(&quot;f0&quot;).size() + &quot; frames&quot;);\n        socket.close();\n\n        // 10. the same scripted 3x3, judged by the O(n) scan rule instead of the O(1) counters\n        Cell[] sx = { new Cell(0, 0), new Cell(0, 2), new Cell(2, 0), new Cell(2, 2), new Cell(1, 1) };\n        Cell[] so = { new Cell(0, 1), new Cell(1, 0), new Cell(1, 2), new Cell(2, 1) };\n        Game scanned = service.newGame(&quot;scan&quot;, 3, List.of(\n                new Player(&quot;Uma&quot;, new Symbol(&#x27;X&#x27;, 0), new ScriptedStrategy(sx)),\n                new Player(&quot;Vik&quot;, new Symbol(&#x27;O&#x27;, 1), new ScriptedStrategy(so))), new ScanWinStrategy());\n        while (!scanned.state().isTerminal()) scanned.playAuto();\n        System.out.println(&quot;scan rule: &quot; + scanned.state() + &quot; winner=&quot; + scanned.winner()\n                + &quot; on the &quot; + scanned.history().size() + &quot;th square, same as the counters&quot;);\n        System.out.println(&quot;done.&quot;);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// Targeted failure tests: each block proves one claim the design makes on page 02, move 9.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n    static Player seat(String name, char mark, int index, Cell... script) { return new Player(name, new Symbol(mark, index), new ScriptedStrategy(script)); }\n    static Game playOut(Game g) { while (!g.state().isTerminal()) g.playAuto(); return g; }\n\n    public static void main(String[] args) throws Exception {\n        GameService service = new GameService();\n\n        // 1. fifty threads stamp the SAME square in the same instant. Exactly one may be accepted: the\n        //    turn, the emptiness check and the stamp are one indivisible step inside the game&#x27;s lock.\n        Player eve = seat(&quot;Eve&quot;, &#x27;X&#x27;, 0), fin = seat(&quot;Fin&quot;, &#x27;O&#x27;, 1);\n        Game race = service.newGame(&quot;race&quot;, 3, List.of(eve, fin), null);\n        Cell centre = new Cell(1, 1);\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        Map&lt;String, Integer&gt; outcome = new ConcurrentHashMap&lt;&gt;();\n        List&lt;Future&lt;?&gt;&gt; shots = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final Player who = (i % 2 == 0) ? eve : fin;\n            shots.add(pool.submit(() -&gt; {\n                go.await();\n                try { race.play(who, centre); outcome.merge(&quot;accepted&quot;, 1, Integer::sum); }\n                catch (InvalidMoveException e) { outcome.merge(&quot;rejected&quot;, 1, Integer::sum); }\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : shots) f.get();\n        pool.shutdown();\n        check(outcome.getOrDefault(&quot;accepted&quot;, 0) == 1, &quot;exactly one of fifty concurrent moves was accepted&quot;);\n        check(outcome.getOrDefault(&quot;rejected&quot;, 0) == 49, &quot;the other forty-nine were refused with a typed reason&quot;);\n        check(race.filled() == 1 &amp;&amp; race.history().size() == 1, &quot;one mark on the board and one move in the history&quot;);\n        check(race.currentPlayer() == fin, &quot;the turn rotated exactly once&quot;);\n\n        // 2. every rejection is typed, and writes nothing at all.\n        Player ann = seat(&quot;Ann&quot;, &#x27;X&#x27;, 0), bob = seat(&quot;Bob&quot;, &#x27;O&#x27;, 1);\n        Game g = service.newGame(&quot;rejects&quot;, 3, List.of(ann, bob), null);\n        g.play(ann, new Cell(0, 0));\n        String board = g.render(); int moves = g.history().size(); Player turn = g.currentPlayer();\n        check(reasonOf(() -&gt; g.play(ann, new Cell(0, 1))) == InvalidMoveException.Reason.NOT_YOUR_TURN, &quot;the wrong seat is refused: NOT_YOUR_TURN&quot;);\n        check(reasonOf(() -&gt; g.play(bob, new Cell(0, 0))) == InvalidMoveException.Reason.CELL_TAKEN, &quot;an occupied square is refused: CELL_TAKEN&quot;);\n        check(reasonOf(() -&gt; g.play(bob, new Cell(3, 0))) == InvalidMoveException.Reason.OUT_OF_BOUNDS, &quot;a square off the board is refused: OUT_OF_BOUNDS&quot;);\n        check(g.render().equals(board) &amp;&amp; g.history().size() == moves &amp;&amp; g.currentPlayer() == turn,\n              &quot;after three rejections the board, the history and the turn are exactly as they were&quot;);\n        Game over = playOut(service.newGame(&quot;over&quot;, 3, List.of(seat(&quot;Cat&quot;, &#x27;X&#x27;, 0, new Cell(0, 0), new Cell(1, 0), new Cell(2, 0)),\n                                                              seat(&quot;Dan&quot;, &#x27;O&#x27;, 1, new Cell(0, 1), new Cell(1, 1))), null));\n        check(over.state() == GameState.WON, &quot;the scripted column win ended the game&quot;);\n        check(reasonOf(() -&gt; over.play(over.players().get(1), new Cell(2, 2))) == InvalidMoveException.Reason.GAME_OVER, &quot;a move after the end is refused: GAME_OVER&quot;);\n\n        // 3. the win rule throws halfway through a move. The mark must come back off: a failed move\n        //    leaves the board, the turn and the history exactly as they were, and the caller can retry.\n        boolean[] explode = { false };\n        WinStrategy flaky = (b, m) -&gt; { if (explode[0]) throw new IllegalStateException(&quot;the rule exploded&quot;); return false; };\n        Player gil = seat(&quot;Gil&quot;, &#x27;X&#x27;, 0), hal = seat(&quot;Hal&quot;, &#x27;O&#x27;, 1);\n        Game boom = new Game(&quot;boom&quot;, 3, List.of(gil, hal));\n        boom.configure(flaky, System::currentTimeMillis);\n        boom.play(gil, new Cell(0, 0));\n        boom.play(hal, new Cell(1, 1));\n        String beforeBoard = boom.render(); int beforeMoves = boom.history().size(); Player beforeTurn = boom.currentPlayer();\n        explode[0] = true;\n        boolean threw = false;\n        try { boom.play(gil, new Cell(0, 2)); } catch (IllegalStateException e) { threw = true; }\n        check(threw, &quot;a win rule that throws propagates to the caller&quot;);\n        check(boom.at(new Cell(0, 2)) == null, &quot;the square the failed move touched is empty again&quot;);\n        check(boom.render().equals(beforeBoard) &amp;&amp; boom.history().size() == beforeMoves &amp;&amp; boom.currentPlayer() == beforeTurn,\n              &quot;board, history and turn are untouched, so the caller simply plays again&quot;);\n        explode[0] = false;\n        boom.play(gil, new Cell(0, 2));\n        check(boom.history().size() == beforeMoves + 1, &quot;and the retry lands normally&quot;);\n\n        // 4. undo rewinds five things together: the board, the rule&#x27;s counters, the sequence, the turn\n        //    and the outcome. Replaying the same square must win again, which only works if the counters\n        //    were decremented -- the classic bug is a cleared square and a rule that still counts three.\n        Player ida = seat(&quot;Ida&quot;, &#x27;X&#x27;, 0, new Cell(0, 0), new Cell(1, 0), new Cell(2, 0), new Cell(3, 0));\n        Player jon = seat(&quot;Jon&quot;, &#x27;O&#x27;, 1, new Cell(0, 1), new Cell(1, 1), new Cell(2, 1));\n        Game col = playOut(service.newGame(&quot;undo&quot;, 4, List.of(ida, jon), null));\n        check(col.state() == GameState.WON &amp;&amp; col.winner() == ida, &quot;Ida won the column on a 4x4&quot;);\n        col.undo();\n        check(col.state() == GameState.IN_PROGRESS &amp;&amp; col.winner() == null, &quot;undo left the terminal state and cleared the winner&quot;);\n        check(col.currentPlayer() == ida &amp;&amp; col.history().size() == 6, &quot;the turn went back to Ida and the history is six moves&quot;);\n        check(col.at(new Cell(3, 0)) == null, &quot;the square is empty again&quot;);\n        col.play(ida, new Cell(3, 0));\n        check(col.state() == GameState.WON &amp;&amp; col.winner() == ida, &quot;replaying the same square wins again: the counters were rewound&quot;);\n\n        // 5. the win check runs BEFORE the full-board check, so a line completed on the last free square\n        //    is a win and not a draw. A full board with no line is a real draw.\n        Game last = playOut(service.newGame(&quot;last&quot;, 3, List.of(\n                seat(&quot;Kim&quot;, &#x27;X&#x27;, 0, new Cell(0, 0), new Cell(0, 2), new Cell(2, 0), new Cell(2, 2), new Cell(1, 1)),\n                seat(&quot;Lee&quot;, &#x27;O&#x27;, 1, new Cell(0, 1), new Cell(1, 0), new Cell(1, 2), new Cell(2, 1))), null));\n        check(last.filled() == 9 &amp;&amp; last.state() == GameState.WON, &quot;a line completed on the ninth square is a WIN, not a DRAW&quot;);\n        Game tie = playOut(service.newGame(&quot;draw&quot;, 3, List.of(\n                seat(&quot;Mia&quot;, &#x27;X&#x27;, 0, new Cell(0, 0), new Cell(0, 2), new Cell(1, 0), new Cell(2, 1), new Cell(2, 2)),\n                seat(&quot;Nik&quot;, &#x27;O&#x27;, 1, new Cell(0, 1), new Cell(1, 1), new Cell(1, 2), new Cell(2, 0))), null));\n        check(tie.filled() == 9 &amp;&amp; tie.state() == GameState.DRAW &amp;&amp; tie.winner() == null, &quot;a full board with no line is a DRAW with no winner&quot;);\n\n        // 6. the four counters see all four kinds of line, without ever scanning the board -- and the plain\n        //    O(n) scan rule, handed to the same Game, reaches exactly the same result: the rule is swappable.\n        check(winnerName(lineGame(service, &quot;row&quot;,  new Cell(0, 0), new Cell(0, 1), new Cell(0, 2), new Cell(1, 0), new Cell(1, 1))).equals(&quot;Row&quot;), &quot;a row win is found by the counters&quot;);\n        check(winnerName(lineGame(service, &quot;col&quot;,  new Cell(0, 0), new Cell(1, 0), new Cell(2, 0), new Cell(0, 1), new Cell(1, 1))).equals(&quot;Row&quot;), &quot;a column win is found by the counters&quot;);\n        check(winnerName(lineGame(service, &quot;diag&quot;, new Cell(0, 0), new Cell(1, 1), new Cell(2, 2), new Cell(0, 1), new Cell(0, 2))).equals(&quot;Row&quot;), &quot;a diagonal win is found by the counters&quot;);\n        check(winnerName(lineGame(service, &quot;anti&quot;, new Cell(0, 2), new Cell(1, 1), new Cell(2, 0), new Cell(0, 0), new Cell(0, 1))).equals(&quot;Row&quot;), &quot;an anti-diagonal win is found by the counters&quot;);\n        Cell[] sameXs = { new Cell(0, 0), new Cell(0, 2), new Cell(2, 0), new Cell(2, 2), new Cell(1, 1) };\n        Cell[] sameOs = { new Cell(0, 1), new Cell(1, 0), new Cell(1, 2), new Cell(2, 1) };\n        Game counted = playOut(service.newGame(&quot;counted&quot;, 3, List.of(seat(&quot;Uma&quot;, &#x27;X&#x27;, 0, sameXs), seat(&quot;Vik&quot;, &#x27;O&#x27;, 1, sameOs)), null));\n        Game scanned = playOut(service.newGame(&quot;scanned&quot;, 3, List.of(seat(&quot;Uma&quot;, &#x27;X&#x27;, 0, sameXs), seat(&quot;Vik&quot;, &#x27;O&#x27;, 1, sameOs)), new ScanWinStrategy()));\n        check(counted.state() == scanned.state() &amp;&amp; winnerName(counted).equals(winnerName(scanned))\n              &amp;&amp; counted.history().size() == scanned.history().size() &amp;&amp; counted.render().equals(scanned.render()),\n              &quot;the O(n) scan rule and the O(1) counters agree: same winner, same move, same board&quot;);\n        check(reasonOf(() -&gt; scanned.play(scanned.players().get(1), new Cell(0, 0))) == InvalidMoveException.Reason.GAME_OVER,\n              &quot;and swapping the rule changed nothing else in the game&quot;);\n\n        // 7. observers run after the unlock: a broken one cannot break a move, and a slow one cannot\n        //    delay it once it is wrapped in the async decorator.\n        Game watched = service.newGame(&quot;watched&quot;, 3, List.of(seat(&quot;Ola&quot;, &#x27;X&#x27;, 0), seat(&quot;Pat&quot;, &#x27;O&#x27;, 1)), null);\n        watched.addObserver(new GameObserver() {\n            @Override public void onMove(Game g2, Move m) { throw new RuntimeException(&quot;this spectator is broken&quot;); }\n            @Override public void onStateChange(Game g2, GameState f, GameState t) { throw new RuntimeException(&quot;so is this callback&quot;); }\n        });\n        watched.play(watched.players().get(0), new Cell(0, 0));\n        check(watched.history().size() == 1 &amp;&amp; watched.state() == GameState.IN_PROGRESS, &quot;a spectator that throws cannot break the move&quot;);\n        CountDownLatch hold = new CountDownLatch(1), delivered = new CountDownLatch(1);\n        AsyncObserver async = new AsyncObserver(new GameObserver() {\n            @Override public void onMove(Game g2, Move m) { try { hold.await(); } catch (InterruptedException ignored) { } delivered.countDown(); }\n        }, 16);\n        watched.addObserver(async);\n        long t0 = System.nanoTime();\n        watched.play(watched.players().get(1), new Cell(1, 1));\n        long tookMs = (System.nanoTime() - t0) / 1_000_000;\n        check(tookMs &lt; 500 &amp;&amp; delivered.getCount() == 1, &quot;the move returned in &quot; + tookMs + &quot; ms, without waiting for a blocked spectator&quot;);\n        hold.countDown();\n        check(delivered.await(3, TimeUnit.SECONDS), &quot;and the spectator is told anyway, on its own thread&quot;);\n        async.close();\n\n        // 8. the twists really are new classes: four-in-a-row on a 5x5 is one, and the unbeatable bot is\n        //    another. Neither touches Board, Game, Player or any observer.\n        Game five = playOut(service.newGame(&quot;k4&quot;, 5, List.of(\n                seat(&quot;Rae&quot;, &#x27;X&#x27;, 0, new Cell(2, 1), new Cell(2, 2), new Cell(2, 3), new Cell(2, 4)),\n                seat(&quot;Sam&quot;, &#x27;O&#x27;, 1, new Cell(0, 0), new Cell(0, 1), new Cell(0, 2))), new KInARowWinStrategy(4)));\n        check(five.state() == GameState.WON &amp;&amp; five.history().size() == 7, &quot;four in a row on a 5x5 wins, with the same Game and Board&quot;);\n        int losses = 0;\n        for (int s = 0; s &lt; 5; s++) {\n            Symbol x = new Symbol(&#x27;X&#x27;, 0), o = new Symbol(&#x27;O&#x27;, 1);\n            Player brain = new Player(&quot;Mini&quot;, x, new MinimaxStrategy(o));\n            Player dice = new Player(&quot;Dice&quot;, o, new RandomBotStrategy(s));\n            Game mm = playOut(service.newGame(&quot;mm&quot; + s, 3, List.of(brain, dice), null));\n            if (mm.winner() == dice) losses++;\n        }\n        check(losses == 0, &quot;the minimax bot did not lose a single one of five 3x3 games&quot;);\n\n        // 9. the edges: an abandoned game stays abandoned, every undo is announced, a move that lands just\n        //    before the clock&#x27;s tick beats it, and a saved game comes back even when two seats share a name.\n        Player kai = seat(&quot;Kai&quot;, &#x27;X&#x27;, 0), lia = seat(&quot;Lia&quot;, &#x27;O&#x27;, 1);\n        Game quit = service.newGame(&quot;quit&quot;, 3, List.of(kai, lia), null);\n        quit.play(kai, new Cell(0, 0));\n        quit.play(lia, new Cell(1, 1));\n        quit.abandon(&quot;Lia disconnected&quot;);\n        boolean refused = false;\n        try { quit.undo(); } catch (IllegalStateException e) { refused = true; }\n        check(refused &amp;&amp; quit.state() == GameState.ABANDONED &amp;&amp; quit.history().size() == 2,\n              &quot;undo cannot revive an abandoned game, and no move is lost&quot;);\n\n        List&lt;String&gt; heard = new CopyOnWriteArrayList&lt;&gt;();\n        Game told = service.newGame(&quot;told&quot;, 3, List.of(seat(&quot;Max&quot;, &#x27;X&#x27;, 0), seat(&quot;Noa&quot;, &#x27;O&#x27;, 1)), null);\n        told.addObserver(new GameObserver() {\n            @Override public void onUndo(Game g2, Move m) { heard.add(&quot;undo &quot; + m.cell()); }\n        });\n        told.play(told.players().get(0), new Cell(0, 0));\n        told.play(told.players().get(1), new Cell(2, 2));\n        told.undo();                                                   // mid-game: the state stays IN_PROGRESS\n        check(heard.equals(List.of(&quot;undo (2,2)&quot;)), &quot;a mid-game undo is announced, so a spectator&#x27;s board loses the mark too&quot;);\n\n        long[] now = { 1_000_000L };\n        GameService clocked = new GameService();\n        clocked.setClock(() -&gt; now[0]);\n        Player ora = seat(&quot;Ora&quot;, &#x27;X&#x27;, 0), pim = seat(&quot;Pim&quot;, &#x27;O&#x27;, 1);\n        Game timed = clocked.newGame(&quot;timed&quot;, 3, List.of(ora, pim), null);\n        TurnTimer timer = new TurnTimer(clocked, 30_000);\n        CountDownLatch held = new CountDownLatch(1), release = new CountDownLatch(1);\n        timed.addObserver(new GameObserver() {                         // holds up the watchers of Pim&#x27;s move\n            @Override public void onMove(Game g2, Move m) {\n                if (m.player() == pim) { held.countDown(); try { release.await(); } catch (InterruptedException ignored) { } }\n            }\n        });\n        timed.play(ora, new Cell(0, 0));                               // Pim&#x27;s turn starts at 0 s\n        now[0] += 29_000;\n        Thread late = new Thread(() -&gt; timed.play(pim, new Cell(1, 1)));\n        late.start();\n        held.await();                                                  // Pim&#x27;s move is in at 29 s; its watchers are not told yet\n        now[0] += 2_000;                                               // the tick lands at 31 s\n        int endedEarly = timer.tick();\n        release.countDown();\n        late.join();\n        check(endedEarly == 0 &amp;&amp; timed.state() == GameState.IN_PROGRESS, &quot;a seat that moved at 29 s is not timed out by a tick at 31 s&quot;);\n        now[0] += 30_000;                                              // Ora has now thought for 32 s\n        check(timer.tick() == 1 &amp;&amp; timed.state() == GameState.ABANDONED, &quot;a seat that really ran out is&quot;);\n\n        Game twins = service.newGame(&quot;twins&quot;, 3, List.of(seat(&quot;Sam&quot;, &#x27;X&#x27;, 0), seat(&quot;Sam&quot;, &#x27;O&#x27;, 1)), null);\n        twins.play(twins.players().get(0), new Cell(0, 0));\n        twins.play(twins.players().get(1), new Cell(1, 1));\n        twins.play(twins.players().get(0), new Cell(0, 1));\n        boolean restored;\n        try {\n            Game back = MoveLog.load(service, &quot;twins-back&quot;, 3, List.of(seat(&quot;Sam&quot;, &#x27;X&#x27;, 0), seat(&quot;Sam&quot;, &#x27;O&#x27;, 1)), null, MoveLog.save(twins));\n            restored = back.render().equals(twins.render()) &amp;&amp; back.history().size() == 3;\n        } catch (RuntimeException e) { restored = false; }\n        check(restored, &quot;a game whose two seats are both called Sam is restored square for square&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n\n    /** Runs something that should be refused, and returns the reason it was refused with. */\n    static InvalidMoveException.Reason reasonOf(Runnable r) {\n        try { r.run(); return null; } catch (InvalidMoveException e) { return e.reason; }\n    }\n    /** A 3x3 where &quot;Row&quot; plays three scripted squares and &quot;Col&quot; plays two: the fifth move is the win. */\n    static Game lineGame(GameService s, String id, Cell a, Cell b, Cell c, Cell d, Cell e) {\n        return playOut(s.newGame(id, 3, List.of(seat(&quot;Row&quot;, &#x27;X&#x27;, 0, a, b, c), seat(&quot;Col&quot;, &#x27;O&#x27;, 1, d, e)), null));\n    }\n    /** The winner&#x27;s name, or &quot;none&quot;. */\n    static String winnerName(Game g) { return g.winner() == null ? &quot;none&quot; : g.winner().name(); }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design tic-tac-toe. Two players take turns marking squares, and the first to complete a line wins. Make the board size a parameter, let a seat be a human or a bot, and assume two clients can submit a move in the same millisecond. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (full line or k in a row, and one process or a server, first). Then type in the order of Main.java: the GameState enum, the Symbol / Cell / Move records, the typed InvalidMoveException, the Clock, then Board with nothing but storage in it, then the WinStrategy interface with the counter rule, then MoveStrategy with a scripted seat and a random bot, then Player, then GameObserver with a logger and a scoreboard, then Game with its lock and the order inside play(), then the thin GameService, then a main that plays a scripted game and runs fifty threads at one square. The must-write core is the enums and records, Board, the counter rule, Game with play() and undo() under its lock, and the race in main. The async wrapper, the scoreboard and GameService are the parts to name and skip if the clock runs short.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; On a 5x5, four in a row wins. How much of your code changes?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One new class and one argument. The counters in FullLineWinStrategy only answer \"is this whole line mine\" and cannot see four inside a row of five, so this is a different rule rather than a patched one: it walks outward from the square that was just played in four directions and counts the run. That is O(k) per move instead of O(1), which is the honest cost and worth saying out loud. It keeps no state, so it inherits the interface's no-op <code>undo()</code> &mdash; which is why undo sat behind a default rather than being abstract. Board, Game, Player, Move and every observer are untouched; the only other line that moves is the one that hands the rule in. Databricks asks it on a rectangle (\"Rectangular K-in-a-Row\"), and this rule still does not change, because it only walks outward and <code>at()</code> returns null off the board; Board would take rows and columns instead of one size.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: k in a row -- the payoff. A new class behind WinStrategy; Board, Game, Player and the observers never move.\n/**\n * &quot;On a 5x5, four in a row wins.&quot; The counters in FullLineWinStrategy can only answer &quot;is this whole line\n * mine&quot; and cannot see four inside a row of five, so this is a different rule, not a patched one. It walks\n * outward from the square that was just played in four directions, which is O(k) instead of O(1) -- the\n * honest cost of the change. It keeps no state at all, so the interface&#x27;s no-op undo() is already correct.\n * Call site: new Game(&quot;g&quot;, 5, seats) then configure(new KInARowWinStrategy(4), clock).\n */\nclass KInARowWinStrategy implements WinStrategy {\n    private static final int[][] DIRS = { {0, 1}, {1, 0}, {1, 1}, {1, -1} };\n    private final int k;\n    /** k marks in an unbroken line win. k must be at most the board size or nobody can ever win. */\n    KInARowWinStrategy(int k) { this.k = k; }\n\n    /** The played square plus its run in each direction and the opposite one. */\n    @Override public boolean isWinning(Board board, Move move) {\n        for (int[] d : DIRS)\n            if (1 + walk(board, move, d[0], d[1]) + walk(board, move, -d[0], -d[1]) &gt;= k) return true;\n        return false;\n    }\n    private int walk(Board board, Move move, int dr, int dc) {\n        int n = 0, r = move.cell().row() + dr, c = move.cell().col() + dc;\n        while (move.symbol().equals(board.at(r, c))) { n++; r += dr; c += dc; }   // at() returns null off the board\n        return n;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two clients submit a move for the same game in the same millisecond. Prove you cannot get two marks on one square.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading \"that square is empty, and it is your turn\" and writing the mark. play() does the whole thing &mdash; the terminal check, the bounds check, the turn check, the emptiness check, the stamp, the win judgement and the turn rotation &mdash; inside one lock held by that game, so no other writer can run in the gap. The proof is a count rather than an eyeball: fifty threads wait on one latch and all fifty submit the same square, half as one seat and half as the other. Exactly one must be accepted, forty-nine must come back with a typed reason, the board must hold one mark, the history one row, and the turn must have rotated exactly once. Expect the second half of the question: the network drops your reply and the client sends the same move again. The turn has already passed, so the copy comes back NOT_YOUR_TURN (or GAME_OVER if that move won) and nothing doubles. The client then reads the last move in the history to see that it was its own.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. fifty threads stamp the SAME square in the same instant. Exactly one may be accepted: the\n        //    turn, the emptiness check and the stamp are one indivisible step inside the game&#x27;s lock.\n        Player eve = seat(&quot;Eve&quot;, &#x27;X&#x27;, 0), fin = seat(&quot;Fin&quot;, &#x27;O&#x27;, 1);\n        Game race = service.newGame(&quot;race&quot;, 3, List.of(eve, fin), null);\n        Cell centre = new Cell(1, 1);\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        Map&lt;String, Integer&gt; outcome = new ConcurrentHashMap&lt;&gt;();\n        List&lt;Future&lt;?&gt;&gt; shots = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final Player who = (i % 2 == 0) ? eve : fin;\n            shots.add(pool.submit(() -&gt; {\n                go.await();\n                try { race.play(who, centre); outcome.merge(&quot;accepted&quot;, 1, Integer::sum); }\n                catch (InvalidMoveException e) { outcome.merge(&quot;rejected&quot;, 1, Integer::sum); }\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : shots) f.get();\n        pool.shutdown();\n        check(outcome.getOrDefault(&quot;accepted&quot;, 0) == 1, &quot;exactly one of fifty concurrent moves was accepted&quot;);\n        check(outcome.getOrDefault(&quot;rejected&quot;, 0) == 49, &quot;the other forty-nine were refused with a typed reason&quot;);\n        check(race.filled() == 1 &amp;&amp; race.history().size() == 1, &quot;one mark on the board and one move in the history&quot;);\n        check(race.currentPlayer() == fin, &quot;the turn rotated exactly once&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock per game. Have you just serialised your game server?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No, and the answer is arithmetic. The locked part is about fifteen field touches &mdash; four checks, one array write, four counter bumps, an append and a rotate &mdash; under a tenth of a microsecond, and it does not grow with the board size. Two people make one move every five seconds, so the lock is busy about two millionths of one per cent of the time. Ten thousand live tables do not change that, because the lock is per game and they never meet. What would ruin it is slow work inside the lock, so none is allowed: the code below is the clearest case, a bot getting a board copy and thinking after the unlock. Spectators are told after the unlock too, and <code>render()</code> only copies the board under the lock and builds the text after it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Ask the seat whose turn it is for a square, then play it. The brain thinks OUTSIDE the lock on a\n     * snapshot, and is arbitrated inside it: losing a race is a normal, retriable outcome, not a bug.\n     */\n    Move playAuto() {\n        Player p; Board snap;\n        lock.lock();\n        try {\n            if (state.isTerminal()) throw new InvalidMoveException(InvalidMoveException.Reason.GAME_OVER, id + &quot; is &quot; + state);\n            p = turnOrder.peekFirst();\n            snap = board.copy();\n        } finally { lock.unlock(); }\n        Cell c = p.decide(snap);                                   // seconds, if it likes: no lock is held\n        if (c == null) throw new InvalidMoveException(InvalidMoveException.Reason.NO_FREE_CELL, &quot;no square left for &quot; + p);\n        return play(p, c);\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; Your win rule throws halfway through a move. What is the state of the board?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was. Every check &mdash; is the game live, is the square on the board, is it your turn, is it empty &mdash; runs before anything at all is written, so a refused move never reaches the grid. The one operation after the first write that can fail is the rule itself, and it is wrapped: if <code>isWinning</code> throws, the mark is lifted straight back off and the exception goes to the caller, so the sequence number, the history and the turn never moved. The rule's side of the contract is written in its Javadoc: it must be all-or-nothing about its own counters, because the referee will only undo the board. The failure test hands in a rule that explodes on demand, checks the square is empty and the game is identical, then lets the retry through.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The critical step. Order matters: every check runs before anything at all is written, so a refused move\n     * leaves the board, the turn and the history exactly as they were and the caller can simply try again.\n     * The mark, the win bookkeeping, the outcome and the turn all move inside one lock, so no reader can see\n     * a stamped square whose game has not yet decided whether it was a win. Listeners are told after unlock.\n     *\n     * @throws InvalidMoveException with a typed reason, if the move is refused\n     */\n    Move play(Player player, Cell cell) {\n        Move made = null; GameState from = null, to = null; InvalidMoveException bad = null;\n        lock.lock();\n        try {\n            if (winRule == null) throw new IllegalStateException(&quot;configure(rule, clock) before the first move&quot;);\n            if (state.isTerminal())                    bad = new InvalidMoveException(InvalidMoveException.Reason.GAME_OVER, id + &quot; is &quot; + state);\n            else if (!board.inBounds(cell))            bad = new InvalidMoveException(InvalidMoveException.Reason.OUT_OF_BOUNDS, cell + &quot; is off a &quot; + board.size() + &quot;x&quot; + board.size() + &quot; board&quot;);\n            else if (turnOrder.peekFirst() != player)  bad = new InvalidMoveException(InvalidMoveException.Reason.NOT_YOUR_TURN, player + &quot;, it is &quot; + turnOrder.peekFirst() + &quot;&#x27;s turn&quot;);\n            else if (!board.isFree(cell))              bad = new InvalidMoveException(InvalidMoveException.Reason.CELL_TAKEN, cell + &quot; already holds &quot; + board.at(cell));\n            if (bad == null) {\n                // nothing above wrote anything. From here on, nothing can fail except the rule, which is rolled back.\n                Move m = new Move(player, cell, seq + 1, clock.nowMs());\n                board.place(cell, player.symbol());\n                boolean won;\n                try { won = winRule.isWinning(board, m); }\n                catch (RuntimeException e) { board.lift(cell); throw e; }   // the move never happened\n                seq++;\n                history.add(m);\n                turnStartedMs = m.atMs();                // the next seat&#x27;s turn starts the moment this move landed\n                from = state;\n                if (won)                 { winner = player; state = GameState.WON; }   // winner first: whoever sees WON sees the winner\n                else if (board.isFull())   state = GameState.DRAW;           // checked AFTER the win: a line on the last square wins\n                else { state = GameState.IN_PROGRESS; turnOrder.addLast(turnOrder.removeFirst()); }\n                to = state; made = m;\n            }\n        } finally { lock.unlock(); }\n        if (bad != null) { publishRejected(player, cell, bad); throw bad; }\n        publishMove(made);\n        if (from != to) publishState(from, to);\n        return made;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>5 &middot; The board is 1000 x 1000. Is your win check still one operation?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Yes: four increments and four comparisons, whatever n is. A move can only touch four lines &mdash; its row, its column, and the two diagonals if it happens to sit on them &mdash; so instead of scanning anything, keep one counter per (line, seat) and compare it to the board size. The dense symbol index makes those counters plain int arrays, not hash lookups on the hot path (the code every move runs), and a third seat costs nothing. This is LeetCode 348; its two-player answer keeps one counter per line instead, +1 for X and &minus;1 for O, and a line is won at +n or &minus;n. Two honest costs go with it: the counters are mutable state, so undo has to decrement them, which is why <code>undo()</code> is in the interface from the start. And they can only answer \"is this whole line mine\", which is exactly why the rule is swappable.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The rule that judges the move that just landed: did it win? One method, because the win condition is the\n * part that changes. A rule that keeps bookkeeping must rewind it in undo(); a stateless rule inherits the\n * no-op. isWinning must be all-or-nothing: if it throws, its own bookkeeping must be untouched, because the\n * referee will only lift the mark from the board.\n */\ninterface WinStrategy {\n    /** Did this move complete a winning line? Called with the mark already stamped on the board. */\n    boolean isWinning(Board board, Move move);\n    /** Rewind whatever isWinning counted for this move. A stateless rule needs nothing. */\n    default void undo(Board board, Move move) { }\n}\n\n/**\n * The classic rule -- a full row, column or diagonal -- in four increments instead of a scan. A move touches\n * at most four lines, so one counter per (line, symbol) answers &quot;is this whole line mine&quot; in O(1) on a 3x3\n * and on a 1000x1000 alike. The price is state, which is exactly why undo() is in the contract.\n */\nclass FullLineWinStrategy implements WinStrategy {\n    private final int size;\n    private final int[][] rowCount, colCount;            // [line][symbol index]\n    private final int[] diagCount, antiCount;\n\n    /** Sized once: symbols is the number of seats, which is why a third player needs no change here. */\n    FullLineWinStrategy(int size, int symbols) {\n        this.size = size;\n        rowCount = new int[size][symbols]; colCount = new int[size][symbols];\n        diagCount = new int[symbols];      antiCount = new int[symbols];\n    }\n    /** Four increments and four comparisons, whatever the board size. */\n    @Override public boolean isWinning(Board board, Move m) {\n        int r = m.cell().row(), c = m.cell().col(), s = m.symbol().index();\n        boolean win = (++rowCount[r][s] == size);\n        win |= (++colCount[c][s] == size);               // |= never short-circuits: every counter stays honest\n        if (r == c)            win |= (++diagCount[s] == size);\n        if (r + c == size - 1) win |= (++antiCount[s] == size);\n        return win;\n    }\n    /** The same four lines, decremented. Without this, undo would leave a phantom win behind. */\n    @Override public void undo(Board board, Move m) {\n        int r = m.cell().row(), c = m.cell().col(), s = m.symbol().index();\n        rowCount[r][s]--; colCount[c][s]--;\n        if (r == c)            diagCount[s]--;\n        if (r + c == size - 1) antiCount[s]--;\n    }\n}\n\n        // 6. the four counters see all four kinds of line, without ever scanning the board -- and the plain\n        //    O(n) scan rule, handed to the same Game, reaches exactly the same result: the rule is swappable.\n        check(winnerName(lineGame(service, &quot;row&quot;,  new Cell(0, 0), new Cell(0, 1), new Cell(0, 2), new Cell(1, 0), new Cell(1, 1))).equals(&quot;Row&quot;), &quot;a row win is found by the counters&quot;);\n        check(winnerName(lineGame(service, &quot;col&quot;,  new Cell(0, 0), new Cell(1, 0), new Cell(2, 0), new Cell(0, 1), new Cell

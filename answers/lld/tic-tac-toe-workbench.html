(1, 1))).equals(&quot;Row&quot;), &quot;a column win is found by the counters&quot;);\n        check(winnerName(lineGame(service, &quot;diag&quot;, new Cell(0, 0), new Cell(1, 1), new Cell(2, 2), new Cell(0, 1), new Cell(0, 2))).equals(&quot;Row&quot;), &quot;a diagonal win is found by the counters&quot;);\n        check(winnerName(lineGame(service, &quot;anti&quot;, new Cell(0, 2), new Cell(1, 1), new Cell(2, 0), new Cell(0, 0), new Cell(0, 1))).equals(&quot;Row&quot;), &quot;an anti-diagonal win is found by the counters&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>6 &middot; It is a 3x3 board. Are the counters over-engineering, and why not just scan?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>On a 3x3 alone you would be right, and saying so is the answer they want. A scan of the four lines through the square just played is at most twelve array reads, it holds no state, and it needs no <code>undo()</code>: at that size the counters save nothing and cost you a rewind path. What buys them their place is one sentence in the prompt, <i>make the board size a parameter</i> &mdash; at 1000 x 1000 the scan is four thousand reads a move and the counters are still eight operations. So put the rule behind an interface, ship the counters as the default because the size is open, and keep the scan as the other implementation. The code below is both, and a failure test plays one scripted game through each and checks they agree on the winner, the move and the board: Liskov with a result instead of a slogan.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the scan rule -- the obvious O(n) win check, kept as a rule so it can be swapped in and measured.\n/**\n * The rule most people write first: after a move, walk its row, its column and the two diagonals through it.\n * That is about 4n reads per move instead of four increments, and it keeps no state, so it inherits the\n * interface&#x27;s no-op undo(). On a fixed 3x3 it is the simpler, cheaper choice; the counters win the moment the\n * board size is a parameter. Both rules are handed to the same Game, which is Liskov with a test behind it.\n */\nclass ScanWinStrategy implements WinStrategy {\n    /** Only the four lines through the square just played can have changed, so only those are walked. */\n    @Override public boolean isWinning(Board board, Move move) {\n        int n = board.size(), r = move.cell().row(), c = move.cell().col();\n        Symbol s = move.symbol();\n        boolean row = true, col = true;\n        for (int i = 0; i &lt; n; i++) {\n            if (!s.equals(board.at(r, i))) row = false;\n            if (!s.equals(board.at(i, c))) col = false;\n        }\n        if (row || col) return true;\n        if (r == c            &amp;&amp; full(board, s, 0, 0, 1, 1))  return true;\n        if (r + c == n - 1    &amp;&amp; full(board, s, 0, n - 1, 1, -1)) return true;\n        return false;\n    }\n    /** Is that whole line one mark? */\n    private boolean full(Board b, Symbol s, int r0, int c0, int dr, int dc) {\n        for (int i = 0, r = r0, c = c0; i &lt; b.size(); i++, r += dr, c += dc) if (!s.equals(b.at(r, c))) return false;\n        return true;\n    }\n}\n\n        Cell[] sameXs = { new Cell(0, 0), new Cell(0, 2), new Cell(2, 0), new Cell(2, 2), new Cell(1, 1) };\n        Cell[] sameOs = { new Cell(0, 1), new Cell(1, 0), new Cell(1, 2), new Cell(2, 1) };\n        Game counted = playOut(service.newGame(&quot;counted&quot;, 3, List.of(seat(&quot;Uma&quot;, &#x27;X&#x27;, 0, sameXs), seat(&quot;Vik&quot;, &#x27;O&#x27;, 1, sameOs)), null));\n        Game scanned = playOut(service.newGame(&quot;scanned&quot;, 3, List.of(seat(&quot;Uma&quot;, &#x27;X&#x27;, 0, sameXs), seat(&quot;Vik&quot;, &#x27;O&#x27;, 1, sameOs)), new ScanWinStrategy()));\n        check(counted.state() == scanned.state() &amp;&amp; winnerName(counted).equals(winnerName(scanned))\n              &amp;&amp; counted.history().size() == scanned.history().size() &amp;&amp; counted.render().equals(scanned.render()),\n              &quot;the O(n) scan rule and the O(1) counters agree: same winner, same move, same board&quot;);\n        check(reasonOf(() -&gt; scanned.play(scanned.players().get(1), new Cell(0, 0))) == InvalidMoveException.Reason.GAME_OVER,\n              &quot;and swapping the rule changed nothing else in the game&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>7 &middot; Make it Connect-4: pieces fall to the bottom of a column.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Gravity is a mapping, not a new engine: the rule is already <code>KInARowWinStrategy(4)</code>. The only new idea is that a piece dropped into column c lands on the lowest free row of c, computed before <code>play()</code>. Because <code>play()</code> knows nothing about gravity, clients get only <code>drop(column)</code>, never a raw play or an undo, and the column bot below uses the same mapping. Then a column can only grow while a player thinks, and the same lock still decides. If someone fills that square first, the move comes back CELL_TAKEN and the caller drops again, the ordinary retry that typed rejections bought in move 6. One honest gap: a real Connect-4 board is 7 wide and 6 tall, and Board here is square, so Board would need a row count and a column count.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: gravity -- Connect-4 is this game with one mapping: a piece falls to the lowest free row of its column.\n/** Where a piece dropped into a column comes to rest. The only new idea Connect-4 needs. */\nclass Gravity {\n    /** The lowest free square in that column. Throws the same typed rejection the engine would. */\n    static Cell drop(Board board, int col) {\n        if (col &lt; 0 || col &gt;= board.size())\n            throw new InvalidMoveException(InvalidMoveException.Reason.OUT_OF_BOUNDS, &quot;no column &quot; + col);\n        for (int r = board.size() - 1; r &gt;= 0; r--) if (board.at(r, col) == null) return new Cell(r, col);\n        throw new InvalidMoveException(InvalidMoveException.Reason.CELL_TAKEN, &quot;column &quot; + col + &quot; is full&quot;);\n    }\n}\n\n/**\n * Connect-4 as a thin front for the same Game: the rule is KInARowWinStrategy(4) and the only new code maps a\n * column to a square. The front must be the only door a client gets -- drop(column), never play(cell) or undo(),\n * because play() does not know about gravity. Then a column can only grow between the snapshot and the move:\n * if another player fills that square first, the caller gets CELL_TAKEN and drops again -- the ordinary retry.\n * Board is square here; a real 7 x 6 board is the one change to Board (rows and columns instead of one size).\n */\nclass ConnectFour {\n    private final Game game;\n    /** Wraps a game that was configured with a k-in-a-row rule. */\n    ConnectFour(Game game) { this.game = game; }\n    /** Drop a piece into a column. */\n    Move drop(Player p, int col) { return game.play(p, Gravity.drop(game.snapshot(), col)); }\n}\n\n/** A bot that thinks in columns. Proof that gravity needs no change in Game, Board or the win rule. */\nclass ColumnBot implements MoveStrategy {\n    private final Random rng;\n    /** Seeded, so a demo replays exactly. */\n    ColumnBot(long seed) { rng = new Random(seed); }\n    @Override public Cell chooseMove(Board board, Symbol symbol) {\n        List&lt;Integer&gt; open = new ArrayList&lt;&gt;();\n        for (int c = 0; c &lt; board.size(); c++) if (board.at(0, c) == null) open.add(c);\n        return open.isEmpty() ? null : Gravity.drop(board, open.get(rng.nextInt(open.size())));\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Write me a bot that never loses on a 3x3.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Minimax with alpha-beta pruning, and it is a new MoveStrategy and nothing else &mdash; the engine does not know bots exist. It plays every legal move on a copy of the board, assumes the opponent answers with their best, and picks the move whose worst outcome is highest; depth is folded into the score so a win in three beats the same win in five, and alpha-beta drops branches that cannot change the answer. It judges those hypothetical positions with its own full scan, which is fine: they are not the hot path, and the real game still uses the O(1) counters. <code>Board.copy()</code> exists for exactly this, and the failure test plays the bot against a random one over five seeds and asserts it never loses.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the unbeatable bot -- a new MoveStrategy and nothing else; the engine does not know bots exist.\n/**\n * Minimax with alpha-beta pruning: it plays the move that gives the opponent the worst best answer, so on a\n * 3x3 it wins or draws and never loses. It works on a COPY of the board, which is why Board.copy() exists,\n * and it judges hypothetical positions with its own full scan -- those are not the hot path, so O(n^2) there\n * costs nothing. Depth is in the score, so a win in three beats the same win in five.\n */\nclass MinimaxStrategy implements MoveStrategy {\n    private final Symbol opponent;\n    /** Needs to know who it is playing against, because it scores the opponent&#x27;s best reply. */\n    MinimaxStrategy(Symbol opponent) { this.opponent = opponent; }\n\n    /** The best square available, judged to the end of the game. */\n    @Override public Cell chooseMove(Board board, Symbol me) {\n        Board work = board.copy();\n        Cell best = null; int bestScore = Integer.MIN_VALUE;\n        for (Cell c : work.freeCells()) {\n            work.place(c, me);\n            int s = score(work, me, false, 1, Integer.MIN_VALUE, Integer.MAX_VALUE);\n            work.lift(c);\n            if (s &gt; bestScore) { bestScore = s; best = c; }\n        }\n        return best;\n    }\n    private int score(Board b, Symbol me, boolean myTurn, int depth, int alpha, int beta) {\n        if (wins(b, me))       return 10 - depth;                 // sooner is better\n        if (wins(b, opponent)) return depth - 10;\n        List&lt;Cell&gt; free = b.freeCells();\n        if (free.isEmpty()) return 0;\n        int best = myTurn ? Integer.MIN_VALUE : Integer.MAX_VALUE;\n        for (Cell c : free) {\n            b.place(c, myTurn ? me : opponent);\n            int s = score(b, me, !myTurn, depth + 1, alpha, beta);\n            b.lift(c);\n            if (myTurn) { best = Math.max(best, s); alpha = Math.max(alpha, best); }\n            else        { best = Math.min(best, s); beta  = Math.min(beta,  best); }\n            if (beta &lt;= alpha) break;                             // this branch cannot change the answer\n        }\n        return best;\n    }\n    /** A full scan, on a hypothetical board. The real game never uses this: it has the O(1) counters. */\n    private boolean wins(Board b, Symbol s) {\n        int n = b.size();\n        for (int i = 0; i &lt; n; i++) {\n            boolean row = true, col = true;\n            for (int j = 0; j &lt; n; j++) {\n                if (!s.equals(b.at(i, j))) row = false;\n                if (!s.equals(b.at(j, i))) col = false;\n            }\n            if (row || col) return true;\n        }\n        boolean diag = true, anti = true;\n        for (int i = 0; i &lt; n; i++) {\n            if (!s.equals(b.at(i, i)))         diag = false;\n            if (!s.equals(b.at(i, n - 1 - i))) anti = false;\n        }\n        return diag || anti;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>9 &middot; Undo. Then undo the undo.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Undo is the interesting method in this system, because a move changed five things and all five have to come back: the mark on the grid, the rule's counters, the sequence number, the turn and the outcome. Forgetting the counters is the classic bug &mdash; the square looks empty while the rule still believes somebody has three in a row &mdash; so the test is not \"is the square empty\" but \"replay the same square and check it wins again\". The turn comes back by rotating the deque until the seat that made the undone move is at the head. Watchers hear <code>onUndo</code>, so a spectator's board loses the mark too, and an abandoned game refuses undo, because its last move is not why it ended. Redo needs nothing from the engine: the undone moves go on a stack and are replayed through the ordinary <code>play()</code>, so they pass every check again and a new move simply clears the stack.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Take the last move back, rewinding all five things that moved together: the board, the win rule&#x27;s\n     * counters, the sequence, the turn and the outcome. Forgetting any one of them is the classic bug --\n     * a board that looks empty and a rule that still believes somebody has three in a row. A win or a draw\n     * can be taken back; an abandoned game cannot, because the last move is not why it ended.\n     */\n    Move undo() {\n        Move gone; GameState from, to;\n        lock.lock();\n        try {\n            if (history.isEmpty()) throw new IllegalStateException(&quot;nothing to undo in &quot; + id);\n            if (state == GameState.ABANDONED) throw new IllegalStateException(id + &quot; was abandoned; undo cannot revive it&quot;);\n            gone = history.remove(history.size() - 1);\n            winRule.undo(board, gone);\n            board.lift(gone.cell());\n            seq--;\n            from = state;\n            winner = null;\n            state = history.isEmpty() ? GameState.NOT_STARTED : GameState.IN_PROGRESS;\n            while (turnOrder.peekFirst() != gone.player()) turnOrder.addLast(turnOrder.removeFirst());\n            turnStartedMs = clock.nowMs();               // the seat back on turn gets a fresh move clock\n            to = state;\n        } finally { lock.unlock(); }\n        publishUndo(gone);                               // every undo is announced, even one that leaves the state alone\n        if (from != to) publishState(from, to);\n        return gone;\n    }\n\n// ---- ext: undo and redo for a whole match -- the history IS the undo log, so redo is a stack and five lines.\n/**\n * Redo on top of the engine&#x27;s undo. Every undone move is pushed on a stack; redo replays it through the\n * ordinary play(), so it passes every check again and cannot smuggle an illegal position back in. A fresh\n * move clears the stack, because the branch it belonged to no longer exists.\n */\nclass MatchHistory {\n    private final Game game;\n    private final Deque&lt;Move&gt; undone = new ArrayDeque&lt;&gt;();\n\n    /** Wraps one game. */\n    MatchHistory(Game game) { this.game = game; }\n    /** A new move ends the redo branch. */\n    Move play(Player p, Cell c) { Move m = game.play(p, c); undone.clear(); return m; }\n    /** Take one back and remember it. */\n    Move undo() { Move m = game.undo(); undone.push(m); return m; }\n    /** Put the last undone move back, through the same validation as any other move. */\n    Move redo() {\n        Move m = undone.poll();\n        if (m == null) throw new IllegalStateException(&quot;nothing to redo&quot;);\n        return game.play(m.player(), m.cell());\n    }\n    /** How many moves are waiting to be redone. */\n    int pending() { return undone.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; The process restarted mid-game. Bring the game back.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Persist the move <i>list</i>, not the board. Loading is creating a fresh game with the same seats and the same rule and replaying those moves through <code>play()</code>, which rebuilds the grid, the counters, the turn and the outcome as a side effect. Each row names its seat by symbol index, not by name, because two seats may share a name. Every restored move goes through the same four checks, so a saved game can never come back in a position the rules would not allow. The same list is the audit trail. In a database this is a moves table keyed by (game id, sequence), where undo deletes the last row and a retried insert fails harmlessly on the key.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- save the MOVE LIST, not the board; resuming is a replay, and audit comes free.\n/**\n * The move list is the source of truth, so persistence is a text file of moves and loading is replaying them\n * through play(). Nothing serialises the board, the counters or the turn: they are rebuilt, which means a\n * saved game can never be restored into a state the rules would not allow.\n */\nclass MoveLog {\n    /**\n     * One line per move: seq,seat,row,col. The seat is the symbol index, not the name, because two seats may\n     * share a name. A real system would write these rows to a table.\n     */\n    static List&lt;String&gt; save(Game g) {\n        List&lt;String&gt; rows = new ArrayList&lt;&gt;();\n        for (Move m : g.history()) rows.add(m.seq() + &quot;,&quot; + m.symbol().index() + &quot;,&quot; + m.cell().row() + &quot;,&quot; + m.cell().col());\n        return rows;\n    }\n    /** Rebuild a game from its moves. The seats must carry the same symbol indexes as the saved game. */\n    static Game load(GameService service, String id, int size, List&lt;Player&gt; seats, WinStrategy rule, List&lt;String&gt; rows) {\n        Game g = service.newGame(id, size, seats, rule);\n        Map&lt;Integer, Player&gt; bySeat = new HashMap&lt;&gt;();\n        for (Player p : seats) bySeat.put(p.symbol().index(), p);\n        for (String row : rows) {\n            String[] f = row.split(&quot;,&quot;);\n            g.play(bySeat.get(Integer.parseInt(f[1])), new Cell(Integer.parseInt(f[2]), Integer.parseInt(f[3])));\n        }\n        return g;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; Each seat gets thirty seconds a move. Where does time come from, and how do you test it?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Time comes from a one-method <code>Clock</code> handed to the game; nothing in the model reads the wall clock, and every move is stamped with it. The game notes when each turn began: when the last move landed, or when an undo gave the turn back. One scheduled task sweeps every live game once a second and calls <code>abandonIfIdle(30 s)</code>, which reads the time and abandons in one step inside that game's lock. So a move that lands a microsecond before the tick always wins, and a tick after a win does nothing. The test owns the clock. A move lands at 29 seconds with its watchers held back, a tick at 31 finds the game still live, and a seat idle past 30 seconds is timed out.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The move clock&#x27;s check: end the game if the seat on turn has had more than limitMs. Reading the time\n     * and abandoning are one step inside the lock, so a move that lands first always beats a late tick.\n     * True if this call ended the game.\n     */\n    boolean abandonIfIdle(long limitMs) {\n        GameState from; boolean changed = false;\n        lock.lock();\n        try {\n            from = state;\n            if (!state.isTerminal() &amp;&amp; clock.nowMs() - turnStartedMs &gt; limitMs) { state = GameState.ABANDONED; changed = true; }\n        } finally { lock.unlock(); }\n        if (changed) publishState(from, GameState.ABANDONED);\n        return changed;\n    }\n\n// ---- ext: a move clock -- thirty seconds a turn; one sweeper for every game, and the check runs inside each game&#x27;s lock.\n/**\n * A move clock for a whole server: one scheduled task sweeps every live game once a second and asks each game\n * to end itself if the seat on turn has run out. The game decides inside its own lock, against the time it\n * noted when that turn began, so a move that lands a microsecond before the tick always wins. Time comes from\n * the injected Clock, so a test moves the clock forward thirty-one seconds instead of sleeping.\n */\nclass TurnTimer {\n    private final GameService service;\n    private final long limitMs;\n\n    /** The games to watch, and how long a seat may think. */\n    TurnTimer(GameService service, long limitMs) { this.service = service; this.limitMs = limitMs; }\n    /** One sweep over every live game. Returns how many games this tick ended. */\n    int tick() {\n        int ended = 0;\n        for (Game g : service.live()) if (g.abandonIfIdle(limitMs)) ended++;\n        return ended;\n    }\n    /** Sweep once a second. The try/catch matters: a periodic task that throws once is never run again. */\n    ScheduledFuture&lt;?&gt; every(ScheduledExecutorService scheduler) {\n        return scheduler.scheduleAtFixedRate(() -&gt; { try { tick(); } catch (RuntimeException ignored) { } }, 1, 1, TimeUnit.SECONDS);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>12 &middot; A spectator is on a slow websocket. Prove it cannot slow the game down, or break it.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Three separate things, and each is a line of code. Watchers are told after the lock is released, so a spectator never runs inside the locked part at all. Each callback runs in its own try/catch, so a spectator that throws cannot break the move &mdash; the mark is already stamped and the game has already decided. And a spectator that is merely slow gets wrapped: <code>AsyncObserver</code> takes any observer and delivers to it on one background thread from a fixed-size queue. When the queue is full it drops the oldest event, so a client that cannot keep up loses frames rather than slowing the game. That wrapper is the Decorator on this page: same kind in, same kind out, and the feed inside never knows. The test blocks a wrapped spectator on a latch, checks the move returned in about zero milliseconds with the spectator still stuck, then releases it and checks it was told anyway.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * A spectator that cannot get in the way. It wraps any other observer and delivers on its own background\n * (daemon) thread from a fixed-size queue, so a slow websocket or a blocking log never slows a move down.\n * Decorator: the same kind in, the same kind out, one behaviour added, and the wrapped observer never knows\n * it was wrapped. It must forward EVERY callback: one left out would fall to the interface&#x27;s empty default.\n */\nclass AsyncObserver implements GameObserver, AutoCloseable {\n    private final GameObserver base;\n    private final ThreadPoolExecutor pump;\n\n    /** queueSize events may be in flight; beyond that the OLDEST is dropped -- a spectator loses frames, never the game. */\n    AsyncObserver(GameObserver base, int queueSize) {\n        this.base = base;\n        this.pump = new ThreadPoolExecutor(1, 1, 0L, TimeUnit.MILLISECONDS, new ArrayBlockingQueue&lt;&gt;(queueSize),\n                r -&gt; { Thread t = new Thread(r, &quot;observer-pump&quot;); t.setDaemon(true); return t; },\n                new ThreadPoolExecutor.DiscardOldestPolicy());\n    }\n    private void post(Runnable r) { try { pump.execute(r); } catch (RuntimeException ignored) { } }\n    @Override public void onMove(Game g, Move m) { post(() -&gt; base.onMove(g, m)); }\n    @Override public void onUndo(Game g, Move m) { post(() -&gt; base.onUndo(g, m)); }\n    @Override public void onStateChange(Game g, GameState from, GameState to) { post(() -&gt; base.onStateChange(g, from, to)); }\n    @Override public void onRejected(Game g, Player p, Cell c, InvalidMoveException e) { post(() -&gt; base.onRejected(g, p, c, e)); }\n    /** Stops the pump. Events still queued are dropped. */\n    @Override public void close() { pump.shutdownNow(); }\n}\n\n        // 7. observers run after the unlock: a broken one cannot break a move, and a slow one cannot\n        //    delay it once it is wrapped in the async decorator.\n        Game watched = service.newGame(&quot;watched&quot;, 3, List.of(seat(&quot;Ola&quot;, &#x27;X&#x27;, 0), seat(&quot;Pat&quot;, &#x27;O&#x27;, 1)), null);\n        watched.addObserver(new GameObserver() {\n            @Override public void onMove(Game g2, Move m) { throw new RuntimeException(&quot;this spectator is broken&quot;); }\n            @Override public void onStateChange(Game g2, GameState f, GameState t) { throw new RuntimeException(&quot;so is this callback&quot;); }\n        });\n        watched.play(watched.players().get(0), new Cell(0, 0));\n        check(watched.history().size() == 1 &amp;&amp; watched.state() == GameState.IN_PROGRESS, &quot;a spectator that throws cannot break the move&quot;);\n        CountDownLatch hold = new CountDownLatch(1), delivered = new CountDownLatch(1);\n        AsyncObserver async = new AsyncObserver(new GameObserver() {\n            @Override public void onMove(Game g2, Move m) { try { hold.await(); } catch (InterruptedException ignored) { } delivered.countDown(); }\n        }, 16);\n        watched.addObserver(async);\n        long t0 = System.nanoTime();\n        watched.play(watched.players().get(1), new Cell(1, 1));\n        long tookMs = (System.nanoTime() - t0) / 1_000_000;\n        check(tookMs &lt; 500 &amp;&amp; delivered.getCount() == 1, &quot;the move returned in &quot; + tookMs + &quot; ms, without waiting for a blocked spectator&quot;);\n        hold.countDown();\n        check(delivered.await(3, TimeUnit.SECONDS), &quot;and the spectator is told anyway, on its own thread&quot;);\n        async.close();\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Three players on a 5x5. And can you tell it is a draw before the board fills?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Three players cost nothing, which is the payoff of the dense symbol index: the counters are already sized [line][seat], the turn is a rotation and not an index modulo two, and the only guard to revisit is that the seats must not outnumber the board's width. Early draw is the more interesting half. A line is dead once two different marks appear in it, and when every row, column and diagonal is dead nobody can win. It is written as an observer precisely so the engine does not move: it scans a snapshot after each move, O(n&sup2;). Say the limit before you promise it &mdash; the earliest a 3x3 can be dead is after the eighth of nine squares, so it buys one move there and only pays on bigger boards. Making it free means a \"distinct marks\" count per line inside a rule, and that is the one twist on this page that reopens Game.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: three seats on a 5x5 -- the counters are already [line][seat], so the win maths needs no edit.\n/** Three players, one table. The only guard to revisit is seats &lt;= board size, which the Game already makes. */\nclass ThreeSeats {\n    /** A 5x5 table with three seeded bots, using the ordinary full-line rule. */\n    static Game table(GameService service, String id) {\n        Player ann = new Player(&quot;Ann&quot;, new Symbol(&#x27;X&#x27;, 0), new RandomBotStrategy(7));\n        Player bob = new Player(&quot;Bob&quot;, new Symbol(&#x27;O&#x27;, 1), new RandomBotStrategy(8));\n        Player cal = new Player(&quot;Cal&quot;, new Symbol(&#x27;Z&#x27;, 2), new RandomBotStrategy(9));\n        return service.newGame(id, 5, List.of(ann, bob, cal), null);\n    }\n}\n\n// ---- ext: early draw -- spot a dead game before the board fills, as a WATCHER, with no change to the engine.\n/**\n * A line is dead once two different marks appear in it; when every row, column and diagonal is dead, nobody\n * can win and the game is already a draw. This is written as an observer precisely so the engine does not\n * move: it scans a snapshot, O(n^2) per move. Making it free would mean a second injected rule on the Game\n * that keeps a &quot;distinct marks&quot; count per line -- the one twist on this page that reopens Game.\n */\nclass DeadLineWatcher implements GameObserver {\n    private volatile Long drawnAtSeq;\n\n    @Override public void onMove(Game g, Move m) {\n        if (drawnAtSeq == null &amp;&amp; !g.state().isTerminal() &amp;&amp; allLinesDead(g.snapshot())) drawnAtSeq = m.seq();\n    }\n    /** The move number after which no player could still win, or null if the game was still alive. */\n    Long drawnAtSeq() { return drawnAtSeq; }\n\n    private boolean allLinesDead(Board b) {\n        int n = b.size();\n        for (int i = 0; i &lt; n; i++) {\n            if (!dead(b, i, 0, 0, 1) || !dead(b, 0, i, 1, 0)) return false;\n        }\n        return dead(b, 0, 0, 1, 1) &amp;&amp; dead(b, 0, n - 1, 1, -1);\n    }\n    private boolean dead(Board b, int r0, int c0, int dr, int dc) {\n        Symbol seen = null;\n        for (int i = 0, r = r0, c = c0; i &lt; b.size(); i++, r += dr, c += dc) {\n            Symbol s = b.at(r, c);\n            if (s == null) continue;\n            if (seen == null) seen = s;\n            else if (!seen.equals(s)) return true;                // two different marks: this line can never be won\n        }\n        return false;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Which pattern is where, which SOLID letter is where, and where would a Factory or a Builder earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Answer it as six lines of code, not six definitions &mdash; the snippet below is the whole answer, and moves 10 and 11 are the same thing as two tables. Strategy twice (the win rule, the seat's brain), Observer plus the rule that it runs after the unlock in a try/catch, Decorator as AsyncObserver, State as the GameState enum, Command as the move list that doubles as the undo log. SOLID lands on the same lines: S is move 2's split, O and D are <code>configure()</code> taking a rule it never built, L is the default no-op <code>undo()</code> that a stateless rule can keep, I is three interfaces of one method each. The two worth saying unprompted are the refusals: Factory earns its place the day rules arrive as configuration strings, and Builder never earns one here, because a game is an id, a size and its seats and all three are required.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy, twice: the two things that change, each behind one method, each handed in\ninterface WinStrategy  { boolean isWinning(Board board, Move move); default void undo(Board b, Move m) { } }\ninterface MoveStrategy { Cell chooseMove(Board board, Symbol symbol); }\nvoid configure(WinStrategy rule, Clock clock) { this.winRule = rule; this.clock = clock; }\n\n// Observer: the game announces, after the unlock, and a broken listener cannot break a move\nprivate void publishMove(Move m) { for (GameObserver o : observers) try { o.onMove(this, m); } catch (RuntimeException ignored) { } }\n\n// Decorator: same kind in, same kind out, one behaviour added\nGameObserver socket = new AsyncObserver(new SpectatorFeed(), 8192);\n\n// State + Command: the life is a fixed set of moves, and the move list IS the undo log\nenum GameState { NOT_STARTED, IN_PROGRESS, WON, DRAW, ABANDONED }\nMove gone = history.remove(history.size() - 1);   winRule.undo(board, gone);   board.lift(gone.cell());\n\n// Factory: not yet. newGame already picks the default; it earns the name when rules come from config strings\nMap&lt;String, WinStrategy&gt; byName = Map.of(&quot;FULL_LINE&quot;, new FullLineWinStrategy(n, seats), &quot;K4&quot;, new KInARowWinStrategy(4));\n\n// Builder: never, here. Three required fields is a constructor\nnew Game(id, size, seats);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * A game's life. Every entry point asks one question -- is this state terminal -- instead of two loose\n * booleans that drift apart. ABANDONED makes a disconnect or an expired move clock a real ending rather\n * than a game that hangs forever.\n */\nenum GameState {\n    NOT_STARTED, IN_PROGRESS, WON, DRAW, ABANDONED;\n    /** True once no further move is legal. undo() can take back a WON or a DRAW; ABANDONED is final. */\n    boolean isTerminal() { return this == WON || this == DRAW || this == ABANDONED; }\n}\n\n/**\n * One player's mark. index is a dense slot (0, 1, 2 ... with no gaps) so the win bookkeeping can be plain int\n * arrays instead of a hash lookup on the code every move runs; it is also what makes a third player cost nothing.\n */\nrecord Symbol(char mark, int index) {\n    @Override public String toString() { return String.valueOf(mark); }\n}\n\n/** One square, by row and column. A record, so it compares by value and can safely be a map key. */\nrecord Cell(int row, int col) {\n    @Override public String toString() { return \"(\" + row + \",\" + col + \")\"; }\n}\n\n/**\n * One accepted move, in order. The list of these is the source of truth for this system: undo reads the\n * last one, replay reads them all, and an audit or a bug report is the same list.\n */\nrecord Move(Player player, Cell cell, long seq, long atMs) {\n    /** The mark this move stamped. Read from the player, so it can never disagree with the seat. */\n    Symbol symbol() { return player.symbol(); }\n    @Override public String toString() { return \"#\" + seq + \" \" + player.name() + \"[\" + symbol() + \"] -> \" + cell; }\n}\n\n/**\n * A refused move, carrying a machine-readable reason. The caller must be able to tell \"not your turn\"\n * (retry in a moment) from \"cell taken\" (choose another) from \"game over\" (stop); a bare false cannot.\n */\nclass InvalidMoveException extends RuntimeException {\n    /** Why the move was refused. A bot's retry loop switches on this. */\n    enum Reason { OUT_OF_BOUNDS, CELL_TAKEN, NOT_YOUR_TURN, GAME_OVER, NO_FREE_CELL }\n    final Reason reason;\n    /** Builds a typed rejection. The message is for humans, the reason is for code. */\n    InvalidMoveException(Reason reason, String message) { super(reason + \": \" + message); this.reason = reason; }\n}\n\n/** Where time comes from. Injected, so a test decides what a move was stamped with and when a clock ran out. */\ninterface Clock { long nowMs(); }\n\n/**\n * The grid, and nothing else: what is where, stamp, lift, bounds, a copy, a picture. Deliberately no win\n * logic -- if storage knew how you win, \"four in a row instead of a full line\" would reopen this class.\n * Not thread-safe on purpose: the Game owns it and every touch happens inside the Game's lock.\n */\nclass Board {\n    private final int size;\n    private final Symbol[][] grid;\n    private int filled;                                  // running count, so \"is it a draw\" is a comparison, not a scan\n\n    /** A square empty board. Below 3x3 no line can be completed, so it is refused here rather than later. */\n    Board(int size) {\n        if (size < 3) throw new IllegalArgumentException(\"a board is at least 3x3, got \" + size);\n        this.size = size;\n        this.grid = new Symbol[size][size];\n    }\n    /** The side length: the board is size x size. */\n    int size() { return size; }\n    /** How many squares are stamped. O(1), because place and lift keep it. */\n    int filled() { return filled; }\n    /** True when no square is left. The draw test, in one comparison. */\n    boolean isFull() { return filled == size * size; }\n    /** Is that square on the board at all? */\n    boolean inBounds(Cell c) { return c.row() >= 0 && c.row() < size && c.col() >= 0 && c.col() < size; }\n    /** On the board and not yet stamped. */\n    boolean isFree(Cell c) { return inBounds(c) && grid[c.row()][c.col()] == null; }\n    /** The mark at those coordinates, or null for empty or off the board. Used by rules that walk outward. */\n    Symbol at(int row, int col) {\n        return (row >= 0 && row < size && col >= 0 && col < size) ? grid[row][col] : null;\n    }\n    /** The mark on that square, or null if it is empty. The caller has already checked bounds. */\n    Symbol at(Cell c) { return grid[c.row()][c.col()]; }\n    /** Stamp a mark. The caller has already checked the square is free; this method does not re-check. */\n    void place(Cell c, Symbol s) { grid[c.row()][c.col()] = s; filled++; }\n    /** Take a mark back off, for undo and for the rollback when a rule throws. Lifting an empty square does nothing. */\n    void lift(Cell c) { if (grid[c.row()][c.col()] != null) { grid[c.row()][c.col()] = null; filled--; } }\n    /** Every empty square, in reading order. O(n^2): only bots and screens call it, never the win check. */\n    List<Cell> freeCells() {\n        List<Cell> out = new ArrayList<>();\n        for (int r = 0; r < size; r++)\n            for (int c = 0; c < size; c++) if (grid[r][c] == null) out.add(new Cell(r, c));\n        return out;\n    }\n    /** A detached copy. A bot thinks on one of these outside the lock, so the real board cannot move under it. */\n    Board copy() {\n        Board b = new Board(size);\n        for (int r = 0; r < size; r++)\n            for (int c = 0; c < size; c++) if (grid[r][c] != null) b.place(new Cell(r, c), grid[r][c]);\n        return b;\n    }\n    /** The board as text, for a console or a log. Presentation only. */\n    String render() {\n        StringBuilder sb = new StringBuilder();\n        for (Symbol[] row : grid) {\n            sb.append(\"     \");\n            for (Symbol s : row) sb.append(s == null ? \".\" : s).append(' ');\n            sb.append('\\n');\n        }\n        return sb.toString();\n    }\n}\n\n// \"on a 5x5, four in a row wins\" -> the win condition is the first thing an interviewer changes -> Strategy\n/**\n * The rule that judges the move that just landed: did it win? One method, because the win condition is the\n * part that changes. A rule that keeps bookkeeping must rewind it in undo(); a stateless rule inherits the\n * no-op. isWinning must be all-or-nothing: if it throws, its own bookkeeping must be untouched, because the\n * referee will only lift the mark from the board.\n */\ninterface WinStrategy {\n    /** Did this move complete a winning line? Called with the mark already stamped on the board. */\n    boolean isWinning(Board board, Move move);\n    /** Rewind whatever isWinning counted for this move. A stateless rule needs nothing. */\n    default void undo(Board board, Move move) { }\n}\n\n/**\n * The classic rule -- a full row, column or diagonal -- in four increments instead of a scan. A move touches\n * at most four lines, so one counter per (line, symbol) answers \"is this whole line mine\" in O(1) on a 3x3\n * and on a 1000x1000 alike. The price is state, which is exactly why undo() is in the contract.\n */\nclass FullLineWinStrategy implements WinStrategy {\n    private final int size;\n    private final int[][] rowCount, colCount;            // [line][symbol index]\n    private final int[] diagCount, antiCount;\n\n    /** Sized once: symbols is the number of seats, which is why a third player needs no change here. */\n    FullLineWinStrategy(int size, int symbols) {\n        this.size = size;\n        rowCount = new int[size][symbols]; colCount = new int[size][symbols];\n        diagCount = new int[symbols];      antiCount = new int[symbols];\n    }\n    /** Four increments and four comparisons, whatever the board size. */\n    @Override public boolean isWinning(Board board, Move m) {\n        int r = m.cell().row(), c = m.cell().col(), s = m.symbol().index();\n        boolean win = (++rowCount[r][s] == size);\n        win |= (++colCount[c][s] == size);               // |= never short-circuits: every counter stays honest\n        if (r == c)            win |= (++diagCount[s] == size);\n        if (r + c == size - 1) win |= (++antiCount[s] == size);\n        return win;\n    }\n    /** The same four lines, decremented. Without this, undo would leave a phantom win behind. */\n    @Override public void undo(Board board, Move m) {\n        int r = m.cell().row(), c = m.cell().col(), s = m.symbol().index();\n        rowCount[r][s]--; colCount[c][s]--;\n        if (r == c)            diagCount[s]--;\n        if (r + c == size - 1) antiCount[s]--;\n    }\n}\n\n// \"human, random bot, unbeatable bot\" -> how a seat picks a square is a second rule that changes -> Strategy\n/**\n * How a seat chooses its square. One method, so a human UI, a test script, a random bot and a minimax bot\n * are the same code path to the Game. Returns null when there is nothing to play.\n */\ninterface MoveStrategy {\n    /** The square this seat wants, judged from a board snapshot it may read at its leisure. */\n    Cell chooseMove(Board board, Symbol symbol);\n}\n\n/**\n * A human UI, or a test, handing cells in one at a time. When the script runs out it plays the first free\n * square, so a demo can never wedge.\n */\nclass ScriptedStrategy implements MoveStrategy {\n    private final Deque<Cell> script = new ArrayDeque<>();\n    /** The cells this seat will play, in order. */\n    ScriptedStrategy(Cell... cells) { script.addAll(Arrays.asList(cells)); }\n    /** The next scripted cell, else the first free square. */\n    @Override public Cell chooseMove(Board board, Symbol symbol) {\n        Cell c = script.poll();\n        if (c != null) return c;\n        List<Cell> free = board.freeCells();\n        return free.isEmpty() ? null : free.get(0);\n    }\n}\n\n/** A bot that plays anywhere free. Seeded, so a demo and a test replay exactly. */\nclass RandomBotStrategy implements MoveStrategy {\n    private final Random rng;\n    /** Same seed, same game, every run. */\n    RandomBotStrategy(long seed) { rng = new Random(seed); }\n    /** A uniformly chosen free square. */\n    @Override public Cell chooseMove(Board board, Symbol symbol) {\n        List<Cell> free = board.freeCells();\n        return free.isEmpty() ? null : free.get(rng.nextInt(free.size()));\n    }\n}\n\n/**\n * A seat at the table: a name, a mark, and a brain. Identity is the object, so two seats can share a name\n * and never share a turn. The brain is held, not inherited, so human and bot are one class.\n */\nfinal class Player {\n    private final String name;\n    private final Symbol symbol;\n    private final MoveStrategy strategy;\n\n    /** A seat. The strategy is handed in; Player never builds one. */\n    Player(String name, Symbol symbol, MoveStrategy strategy) {\n        this.name = name; this.symbol = symbol; this.strategy = strategy;\n    }\n    /** The display name. Not an identity: the object is. */\n    String name() { return name; }\n    /** This seat's mark, and its dense index into the win counters. */\n    Symbol symbol() { return symbol; }\n    /** Ask the brain, on a board snapshot. Called outside the game's lock. */\n    Cell decide(Board board) { return strategy.chooseMove(board, symbol); }\n    @Override public String toString() { return name + \"[\" + symbol + \"]\"; }\n}\n\n// \"a scoreboard, a live log, a websocket feed\" -> people who want to know, and must not be in the way -> Observer\n/**\n * Anyone who wants to know what happened: a log, a scoreboard, a socket. Every callback is a default, so an\n * observer implements only the event it cares about. Called after the lock is released, never inside it.\n */\ninterface GameObserver {\n    /** A move was accepted. */\n    default void onMove(Game game, Move move) { }\n    /** A move was taken back. Without this, a spectator would keep showing a mark that is gone. */\n    default void onUndo(Game game, Move undone) { }\n    /** The game changed state -- started, won, drawn, abandoned, or rewound by an undo. */\n    default void onStateChange(Game game, GameState from, GameState to) { }\n    /** A move was refused, and why. A dashboard counts these; a client shows the reason. */\n    default void onRejected(Game game, Player player, Cell cell, InvalidMoveException e) { }\n}\n\n/** Narrates a game to stdout. The engine itself prints nothing; that is the whole point of the interface. */\nclass MoveLogger implements GameObserver {\n    @Override public void onMove(Game g, Move m) { System.out.println(\"     move   \" + m); }\n    @Override public void onUndo(Game g, Move m) { System.out.println(\"     undo   \" + m); }\n    @Override public void onStateChange(Game g, GameState from, GameState to) {\n        System.out.println(\"     state  \" + from + \" -> \" + to + (to == GameState.WON ? \"  winner=\" + g.winner() : \"\"));\n    }\n    @Override public void onRejected(Game g, Player p, Cell c, InvalidMoveException e) {\n        System.out.println(\"     reject \" + p + \" at \" + c + \"  \" + e.reason);\n    }\n}\n\n/**\n * Cross-game state the Game must never own: who won which game. Keyed by game id rather than counted, so an\n * undo that takes a win back also takes the point back -- a tally of increments could not do that.\n */\nclass ScoreBoard implements GameObserver {\n    private final Map<String, String> decided = new ConcurrentHashMap<>();   // game id -> winner's name\n    @Override public void onStateChange(Game g, GameState from, GameState to) {\n        if (to == GameState.WON && g.winner() != null) decided.put(g.id(), g.winner().name());\n        else if (from == GameState.WON) decided.remove(g.id());              // an undo rewound a finished game\n    }\n    /** Games won by that name, 0 if never. */\n    int wins(String name) { int n = 0; for (String w : decided.values()) if (w.equals(name)) n++; return n; }\n    @Override public String toString() {\n        Map<String, Integer> tally = new TreeMap<>();\n        for (String w : decided.values()) tally.merge(w, 1, Integer::sum);\n        return \"wins=\" + tally;\n    }\n}\n\n/**\n * A spectator that cannot get in the way. It wraps any other observer and delivers on its own background\n * (daemon) thread from a fixed-size queue, so a slow websocket or a blocking log never slows a move down.\n * Decorator: the same kind in, the same kind out, one behaviour added, and the wrapped observer never knows\n * it was wrapped. It must forward EVERY callback: one left out would fall to the interface's empty default.\n */\nclass AsyncObserver implements GameObserver, AutoCloseable {\n    private final GameObserver base;\n    private final ThreadPoolExecutor pump;\n\n    /** queueSize events may be in flight; beyond that the OLDEST is dropped -- a spectator loses frames, never the game. */\n    AsyncObserver(GameObserver base, int queueSize) {\n        this.base = base;\n        this.pump = new ThreadPoolExecutor(1, 1, 0L, TimeUnit.MILLISECONDS, new ArrayBlockingQueue<>(queueSize),\n                r -> { Thread t = new Thread(r, \"observer-pump\"); t.setDaemon(true); return t; },\n                new ThreadPoolExecutor.DiscardOldestPolicy());\n    }\n    private void post(Runnable r) { try { pump.execute(r); } catch (RuntimeException ignored) { } }\n    @Override public void onMove(Game g, Move m) { post(() -> base.onMove(g, m)); }\n    @Override public void onUndo(Game g, Move m) { post(() -> base.onUndo(g, m)); }\n    @Override public void onStateChange(Game g, GameState from, GameState to) { post(() -> base.onStateChange(g, from, to)); }\n    @Override public void onRejected(Game g, Player p, Cell c, InvalidMoveException e) { post(() -> base.onRejected(g, p, c, e)); }\n    /** Stops the pump. Events still queued are dropped. */\n    @Override public void close() { pump.shutdownNow(); }\n}\n\n/**\n * The referee, and the only class allowed to change anything. \"The game is live\", \"it is your turn\", \"that\n * square is empty\", \"stamp it\", \"did that win\", \"next player\" are one indivisible fact, so all of them happen\n * inside one lock held by this game. The lock is per GAME, so a server runs thousands in parallel.\n */\nclass Game {\n    private final String id;\n    private final Board board;\n    private final List<Player> players;\n    private final Deque<Player> turnOrder;               // rotation, not an index: undo is a rotate-back\n    private final List<Move> history = new ArrayList<>();\n    private final List<GameObserver> observers = new CopyOnWriteArrayList<>();\n    // fair: waiting threads get the lock in arrival order, so a client that spams moves cannot starve (lock out) the other seat\n    private final ReentrantLock lock = new ReentrantLock(true);\n    private WinStrategy winRule;                         // handed in through configure(); never built here\n    private Clock clock;\n    private long seq;\n    private long turnStartedMs;                          // when the seat on turn began: what the move clock measures\n    private volatile GameState state = GameState.NOT_STARTED;     // volatile: a spectator polls without queueing\n    private volatile Player winner;\n\n    /**\n     * A game with its seats. Fewer than two seats has no opponent; more seats than the board is wide is refused,\n     * because most seats could then never fill a line. Symbol indexes must be a dense 0..n-1 (no gaps), because\n     * they index the win counters.\n     */\n    Game(String id, int size, List<Player> players) {\n        if (players.size() < 2 || players.size() > size)\n            throw new IllegalArgumentException(\"need 2..\" + size + \" seats on a \" + size + \"x\" + size + \" board, got \" + players.size());\n        TreeSet<Integer> slots = new TreeSet<>();\n        for (Player p : players) slots.add(p.symbol().index());\n        if (slots.size() != players.size() || slots.first() != 0 || slots.last() != players.size() - 1)\n            throw new IllegalArgumentException(\"symbol indexes must be a dense 0..\" + (players.size() - 1) + \", got \" + slots);\n        this.id = id;\n        this.board = new Board(size);\n        this.players = List.copyOf(players);\n        this.turnOrder = new ArrayDeque<>(this.players);\n    }\n\n    /** The two things this game is given and never builds: the win rule and the clock. Called before the first move. */\n    void configure(WinStrategy rule, Clock clock) {\n        this.winRule = Objects.requireNonNull(rule, \"a game needs a win rule\");\n        this.clock = Objects.requireNonNull(clock, \"a game needs a clock\");\n        this.turnStartedMs = clock.nowMs();              // the first seat's turn starts now\n    }\n    /** Register a listener. The list is copy-on-write (each add makes a new array), so a publish already looping is not disturbed. */\n    void addObserver(GameObserver o) { observers.add(o); }\n\n    /** This game's id. */\n    String id() { return id; }\n    /** The side length of the board. */\n    int size() { return board.size(); }\n    /** The seats, in turn order as they were at the start. */\n    List<Player> players() { return players; }\n    /** Where the game is. Read from a volatile field, so a spectator never waits on the lock. */\n    GameState state() { return state; }\n    /** The winner, or null while the game is live, drawn or abandoned. */\n    Player winner() { return winner; }\n    /** Whose turn it is, or null once the game is over. */\n    Player currentPlayer() { lock.lock(); try { return state.isTerminal() ? null : turnOrder.peekFirst(); } finally { lock.unlock(); } }\n    /** Every accepted move, in order, as a copy: the caller cannot edit this game's truth. */\n    List<Move> history() { lock.lock(); try { return List.copyOf(history); } finally { lock.unlock(); } }\n    /** The mark on that square, or null. Bounds-checked, so a test can ask about anywhere. */\n    Symbol at(Cell c) { lock.lock(); try { return board.at(c.row(), c.col()); } finally { lock.unlock(); } }\n    /** How many squares are stamped. */\n    int filled() { lock.lock(); try { return board.filled(); } finally { lock.unlock(); } }\n    /** The board as text. Only the copy is taken under the lock; the text is built after it is released. */\n    String render() { return snapshot().render(); }\n    /** A detached copy of the board, for a bot or a screen that wants to read at its leisure. */\n    Board snapshot() { lock.lock(); try { return board.copy(); } finally { lock.unlock(); } }\n\n    /**\n     * The critical step. Order matters: every check runs before anything at all is written, so a refused move\n     * leaves the board, the turn and the history exactly as they were and the caller can simply try again.\n     * The mark, the win bookkeeping, the outcome and the turn all move inside one lock, so no reader can see\n     * a stamped square whose game has not yet decided whether it was a win. Listeners are told after unlock.\n     *\n     * @throws InvalidMoveException with a typed reason, if the move is refused\n     */\n    Move play(Player player, Cell cell) {\n        Move made = null; GameState from = null, to = null; InvalidMoveException bad = null;\n        lock.lock();\n        try {\n            if (winRule == null) throw new IllegalStateException(\"configure(rule, clock) before the first move\");\n            if (state.isTerminal())                    bad = new InvalidMoveException(InvalidMoveException.Reason.GAME_OVER, id + \" is \" + state);\n            else if (!board.inBounds(cell))            bad = new InvalidMoveException(InvalidMoveException.Reason.OUT_OF_BOUNDS, cell + \" is off a \" + board.size() + \"x\" + board.size() + \" board\");\n            else if (turnOrder.peekFirst() != player)  bad = new InvalidMoveException(InvalidMoveException.Reason.NOT_YOUR_TURN, player + \", it is \" + turnOrder.peekFirst() + \"'s turn\");\n            else if (!board.isFree(cell))              bad = new InvalidMoveException(InvalidMoveException.Reason.CELL_TAKEN, cell + \" already holds \" + board.at(cell));\n            if (bad == null) {\n                // nothing above wrote anything. From here on, nothing can fail except the rule, which is rolled back.\n                Move m = new Move(player, cell, seq + 1, clock.nowMs());\n                board.place(cell, player.symbol());\n                boolean won;\n                try { won = winRule.isWinning(board, m); }\n                catch (RuntimeException e) { board.lift(cell); throw e; }   // the move never happened\n                seq++;\n                history.add(m);\n                turnStartedMs = m.atMs();                // the next seat's turn starts the moment this move landed\n                from = state;\n                if (won)                 { winner = player; state = GameState.WON; }   // winner first: whoever sees WON sees the winner\n                else if (board.isFull())   state = GameState.DRAW;           // checked AFTER the win: a line on the last square wins\n                else { state = GameState.IN_PROGRESS; turnOrder.addLast(turnOrder.removeFirst()); }\n                to = state; made = m;\n            }\n        } finally { lock.unlock(); }\n        if (bad != null) { publishRejected(player, cell, bad); throw bad; }\n        publishMove(made);\n        if (from != to) publishState(from, to);\n        return made;\n    }\n\n    /**\n     * Ask the seat whose turn it is for a square, then play it. The brain thinks OUTSIDE the lock on a\n     * snapshot, and is arbitrated inside it: losing a race is a normal, retriable outcome, not a bug.\n     */\n    Move playAuto() {\n        Player p; Board snap;\n        lock.lock();\n        try {\n            if (state.isTerminal()) throw new InvalidMoveException(InvalidMoveException.Reason.GAME_OVER, id + \" is \" + state);\n            p = turnOrder.peekFirst();\n            snap = board.copy();\n        } finally { lock.unlock(); }\n        Cell c = p.decide(snap);                                   // seconds, if it likes: no lock is held\n        if (c == null) throw new InvalidMoveException(InvalidMoveException.Reason.NO_FREE_CELL, \"no square left for \" + p);\n        return play(p, c);\n    }\n\n    /**\n     * Take the last move back, rewinding all five things that moved together: the board, the win rule's\n     * counters, the sequence, the turn and the outcome. Forgetting any one of them is the classic bug --\n     * a board that looks empty and a rule that still believes somebody has three in a row. A win or a draw\n     * can be taken back; an abandoned game cannot, because the last move is not why it ended.\n     */\n    Move undo() {\n        Move gone; GameState from, to;\n        lock.lock();\n        try {\n            if (history.isEmpty()) throw new IllegalStateException(\"nothing to undo in \" + id);\n            if (state == GameState.ABANDONED) throw new IllegalStateException(id + \" was abandoned; undo cannot revive it\");\n            gone = history.remove(history.size() - 1);\n            winRule.undo(board, gone);\n            board.lift(gone.cell());\n            seq--;\n            from = state;\n            winner = null;\n            state = history.isEmpty() ? GameState.NOT_STARTED : GameState.IN_PROGRESS;\n            while (turnOrder.peekFirst() != gone.player()) turnOrder.addLast(turnOrder.removeFirst());\n            turnStartedMs = clock.nowMs();               // the seat back on turn gets a fresh move clock\n            to = state;\n        } finally { lock.unlock(); }\n        publishUndo(gone);                               // every undo is announced, even one that leaves the state alone\n        if (from != to) publishState(from, to);\n        return gone;\n    }\n\n    /**\n     * End the game without a winner: a disconnect, a table closed. A no-op if the game has already ended, so\n     * a late call cannot overwrite a win.\n     */\n    void abandon(String why) {\n        GameState from, to; boolean changed = false;\n        lock.lock();\n        try {\n            from = state; to = state;\n            if (!state.isTerminal()) { state = GameState.ABANDONED; to = state; changed = true; }\n        } finally { lock.unlock(); }\n        if (changed) publishState(from, to);\n    }\n\n    /**\n     * The move clock's check: end the game if the seat on turn has had more than limitMs. Reading the time\n     * and abandoning are one step inside the lock, so a move that lands first always beats a late tick.\n     * True if this call ended the game.\n     */\n    boolean abandonIfIdle(long limitMs) {\n        GameState from; boolean changed = false;\n        lock.lock();\n        try {\n            from = state;\n            if (!state.isTerminal() && clock.nowMs() - turnStartedMs > limitMs) { state = GameState.ABANDONED; changed = true; }\n        } finally { lock.unlock(); }\n        if (changed) publishState(from, GameState.ABANDONED);\n        return changed;\n    }\n\n    // Listeners run after the unlock, each in its own try/catch: a broken spectator cannot break a game.\n    private void publishMove(Move m) { for (GameObserver o : observers) try { o.onMove(this, m); } catch (RuntimeException ignored) { } }\n    private void publishUndo(Move m) { for (GameObserver o : observers) try { o.onUndo(this, m); } catch (RuntimeException ignored) { } }\n    private void publishState(GameState from, GameState to) { for (GameObserver o : observers) try { o.onStateChange(this, from, to); } catch (RuntimeException ignored) { } }\n    private void publishRejected(Player p, Cell c, InvalidMoveException e) { for (GameObserver o : observers) try { o.onRejected(this, p, c, e); } catch (RuntimeException ignored) { } }\n}\n\n/**\n * The thin caller: what a web layer holds. It keeps the live games by id and hands each new one its rule,\n * its clock and the standing observers. It owns no lock of its own -- the lock lives in each Game -- so ten\n * thousand games proceed in parallel and never wait for one another.\n */\nclass GameService {\n    private final Map<String, Game> games = new ConcurrentHashMap<>();\n    private final List<GameObserver> standing = new CopyOnWriteArrayList<>();\n    private Clock clock = System::currentTimeMillis;\n\n    /** Hand in the clock every new game will be built with. */\n    void setClock(Clock c) { clock = c; }\n    /** An observer attached to every game created from now on. */\n    void addObserver(GameObserver o) { standing.add(o); }\n    /**\n     * Create a game. Pass null for the rule to get the classic full-line rule sized for this board and these\n     * seats; the Game itself never builds a rule.\n     */\n    Game newGame(String id, int size, List<Player> players, WinStrategy rule) {\n        Game g = new Game(id, size, players);\n        g.configure(rule != null ? rule : new FullLineWinStrategy(size, players.size()), clock);\n        for (GameObserver o : standing) g.addObserver(o);\n        if (games.putIfAbsent(id, g) != null) throw new IllegalStateException(\"a game already has the id \" + id);\n        return g;\n    }\n    /** The game with that id, or null. */\n    Game game(String id) { return games.get(id); }\n    /** Every game still in the map. */\n    Collection<Game> live() { return games.values(); }\n    /** Forget a finished game, so memory does not grow forever. */\n    void end(String id) { games.remove(id); }\n}\n\n/** Runs the system: a scripted win, an undo, a win on the last free square, and a fifty-thread race. */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        GameService service = new GameService();\n        ScoreBoard scores = new ScoreBoard();\n        service.addObserver(new MoveLogger());\n        service.addObserver(scores);\n\n        System.out.println(\"=== 1. scripted 4x4: Ann takes column 0 ===\");\n        Player ann = new Player(\"Ann\", new Symbol('X', 0), new ScriptedStrategy(new Cell(0, 0), new Cell(1, 0), new Cell(2, 0), new Cell(3, 0)));\n        Player bob = new Player(\"Bob\", new Symbol('O', 1), new ScriptedStrategy(new Cell(0, 1), new Cell(1, 1), new Cell(2, 1)));\n        Game g1 = service.newGame(\"g1\", 4, List.of(ann, bob), null);\n        while (!g1.state().isTerminal()) g1.playAuto();\n        System.out.print(g1.render());\n        System.out.println(\"     result \" + g1.state() + \" winner=\" + g1.winner() + \"  \" + scores);\n\n        System.out.println(\"=== 2. undo rewinds board, counters, turn and state together ===\");\n        Move gone = g1.undo();\n        System.out.println(\"     took back \" + gone);\n        System.out.println(\"     state=\" + g1.state() + \" winner=\" + g1.winner() + \" turn=\" + g1.currentPlayer() + \" moves=\" + g1.history().size());\n        g1.play(ann, new Cell(3, 0));                              // the same square again: the counters were rewound, so it wins again\n        System.out.println(\"     replayed the same square -> \" + g1.state() + \" winner=\" + g1.winner());\n\n        System.out.println(\"=== 3. a line completed on the LAST free square is a win, not a draw ===\");\n        Cell[] xs = { new Cell(0, 0), new Cell(0, 2), new Cell(2, 0), new Cell(2, 2), new Cell(1, 1) };\n        Cell[] os = { new Cell(0, 1), new Cell(1, 0), new Cell(1, 2), new Cell(2, 1) };\n        Player cat = new Player(\"Cat\", new Symbol('X', 0), new ScriptedStrategy(xs));\n        Player dan = new Player(\"Dan\", new Symbol('O', 1), new ScriptedStrategy(os));\n        Game g2 = service.newGame(\"g2\", 3, List.of(cat, dan), null);\n        while (!g2.state().isTerminal()) g2.playAuto();\n        System.out.print(g2.render());\n        System.out.println(\"     board full=\" + (g2.filled() == 9) + \"  result \" + g2.state() + \" winner=\" + g2.winner() + \"  \" + scores);\n\n        System.out.println(\"=== 4. race: fifty threads stamp the SAME square at the same instant ===\");\n        Player eve = new Player(\"Eve\", new Symbol('X', 0), new ScriptedStrategy());\n        Player fin = new Player(\"Fin\", new Symbol('O', 1), new ScriptedStrategy());\n        Game g3 = new Game(\"g3\", 3, List.of(eve, fin));          // built directly, no logger: fifty threads would drown the output\n        g3.configure(new FullLineWinStrategy(3, 2), System::currentTimeMillis);\n        Cell centre = new Cell(1, 1);\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        Map<String, Integer> outcome = new ConcurrentHashMap<>();\n        List<Future<?>> shots = new ArrayList<>();\n        for (int i = 0; i < 50; i++) {\n            final Player who = (i % 2 == 0) ? eve : fin;\n            shots.add(pool.submit(() -> {\n                go.await();\n                try { g3.play(who, centre); outcome.merge(\"accepted\", 1, Integer::sum); }\n                catch (InvalidMoveException e) { outcome.merge(e.reason.name(), 1, Integer::sum); }\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future<?> f : shots) f.get();\n        pool.shutdown();\n        System.out.println(\"     outcomes \" + new TreeMap<>(outcome));\n        System.out.println(\"     accepted=\" + outcome.getOrDefault(\"accepted\", 0) + \"  marks on the board=\" + g3.filled()\n                + \"  moves in history=\" + g3.history().size() + \"  turn=\" + g3.currentPlayer());\n        System.out.print(g3.render());\n        System.out.println(\"done.\");\n    }\n}\n", "f1": "import java.util.*;\nimport java.util.concurrent.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: k in a row -- the payoff. A new class behind WinStrategy; Board, Game, Player and the observers never move.\n/**\n * \"On a 5x5, four in a row wins.\" The counters in FullLineWinStrategy can only answer \"is this whole line\n * mine\" and cannot see four inside a row of five, so this is a different rule, not a patched one. It walks\n * outward from the square that was just played in four directions, which is O(k) instead of O(1) -- the\n * honest cost of the change. It keeps no state at all, so the interface's no-op undo() is already correct.\n * Call site: new Game(\"g\", 5, seats) then configure(new KInARowWinStrategy(4), clock).\n */\nclass KInARowWinStrategy implements WinStrategy {\n    private static final int[][] DIRS = { {0, 1}, {1, 0}, {1, 1}, {1, -1} };\n    private final int k;\n    /** k marks in an unbroken line win. k must be at most the board size or nobody can ever win. */\n    KInARowWinStrategy(int k) { this.k = k; }\n\n    /** The played square plus its run in each direction and the opposite one. */\n    @Override public boolean isWinning(Board board, Move move) {\n        for (int[] d : DIRS)\n            if (1 + walk(board, move, d[0], d[1]) + walk(board, move, -d[0], -d[1]) >= k) return true;\n        return false;\n    }\n    private int walk(Board board, Move move, int dr, int dc) {\n        int n = 0, r = move.cell().row() + dr, c = move.cell().col() + dc;\n        while (move.symbol().equals(board.at(r, c))) { n++; r += dr; c += dc; }   // at() returns null off the board\n        return n;\n    }\n}\n\n// ---- ext: the scan rule -- the obvious O(n) win check, kept as a rule so it can be swapped in and measured.\n/**\n * The rule most people write first: after a move, walk its row, its column and the two diagonals through it.\n * That is about 4n reads per move instead of four increments, and it keeps no state, so it inherits the\n * interface's no-op undo(). On a fixed 3x3 it is the simpler, cheaper choice; the counters win the moment the\n * board size is a parameter. Both rules are handed to the same Game, which is Liskov with a test behind it.\n */\nclass ScanWinStrategy implements WinStrategy {\n    /** Only the four lines through the square just played can have changed, so only those are walked. */\n    @Override public boolean isWinning(Board board, Move move) {\n        int n = board.size(), r = move.cell().row(), c = move.cell().col();\n        Symbol s = move.symbol();\n        boolean row = true, col = true;\n        for (int i = 0; i < n; i++) {\n            if (!s.equals(board.at(r, i))) row = false;\n            if (!s.equals(board.at(i, c))) col = false;\n        }\n        if (row || col) return true;\n        if (r == c            && full(board, s, 0, 0, 1, 1))  return true;\n        if (r + c == n - 1    && full(board, s, 0, n - 1, 1, -1)) return true;\n        return false;\n    }\n    /** Is that whole line one mark? */\n    private boolean full(Board b, Symbol s, int r0, int c0, int dr, int dc) {\n        for (int i = 0, r = r0, c = c0; i < b.size(); i++, r += dr, c += dc) if (!s.equals(b.at(r, c))) return false;\n        return true;\n    }\n}\n\n// ---- ext: gravity -- Connect-4 is this game with one mapping: a piece falls to the lowest free row of its column.\n/** Where a piece dropped into a column comes to rest. The only new idea Connect-4 needs. */\nclass Gravity {\n    /** The lowest free square in that column. Throws the same typed rejection the engine would. */\n    static Cell drop(Board board, int col) {\n        if (col < 0 || col >= board.size())\n            throw new InvalidMoveException(InvalidMoveException.Reason.OUT_OF_BOUNDS, \"no column \" + col);\n        for (int r = board.size() - 1; r >= 0; r--) if (board.at(r, col) == null) return new Cell(r, col);\n        throw new InvalidMoveException(InvalidMoveException.Reason.CELL_TAKEN, \"column \" + col + \" is full\");\n    }\n}\n\n/**\n * Connect-4 as a thin front for the same Game: the rule is KInARowWinStrategy(4) and the only new code maps a\n * column to a square. The front must be the only door a client gets -- drop(column), never play(cell) or undo(),\n * because play() does not know about gravity. Then a column can only grow between the snapshot and the move:\n * if another player fills that square first, the caller gets CELL_TAKEN and drops again -- the ordinary retry.\n * Board is square here; a real 7 x 6 board is the one change to Board (rows and columns instead of one size).\n */\nclass ConnectFour {\n    private final Game game;\n    /** Wraps a game that was configured with a k-in-a-row rule. */\n    ConnectFour(Game game) { this.game = game; }\n    /** Drop a piece into a column. */\n    Move drop(Player p, int col) { return game.play(p, Gravity.drop(game.snapshot(), col)); }\n}\n\n/** A bot that thinks in columns. Proof that gravity needs no change in Game, Board or the win rule. */\nclass ColumnBot implements MoveStrategy {\n    private final Random rng;\n    /** Seeded, so a demo replays exactly. */\n    ColumnBot(long seed) { rng = new Random(seed); }\n    @Override public Cell chooseMove(Board board, Symbol symbol) {\n        List<Integer> open = new ArrayList<>();\n        for (int c = 0; c < board.size(); c++) if (board.at(0, c) == null) open.add(c);\n        return open.isEmpty() ? null : Gravity.drop(board, open.get(rng.nextInt(open.size())));\n    }\n}\n\n// ---- ext: the unbeatable bot -- a new MoveStrategy and nothing else; the engine does not know bots exist.\n/**\n * Minimax with alpha-beta pruning: it plays the move that gives the opponent the worst best answer, so on a\n * 3x3 it wins or draws and never loses. It works on a COPY of the board, which is why Board.copy() exists,\n * and it judges hypothetical positions with its own full scan -- those are not the hot path, so O(n^2) there\n * costs nothing. Depth is in the score, so a win in three beats the same win in five.\n */\nclass MinimaxStrategy implements MoveStrategy {\n    private final Symbol opponent;\n    /** Needs to know who it is playing against, because it scores the opponent's best reply. */\n    MinimaxStrategy(Symbol opponent) { this.opponent = opponent; }\n\n    /** The best square available, judged to the end of the game. */\n    @Override public Cell chooseMove(Board board, Symbol me) {\n        Board work = board.copy();\n        Cell best = null; int bestScore = Integer.MIN_VALUE;\n        for (Cell c : work.freeCells()) {\n            work.place(c, me);\n            int s = score(work, me, false, 1, Integer.MIN_VALUE, Integer.MAX_VALUE);\n            work.lift(c);\n            if (s > bestScore) { bestScore = s; best = c; }\n        }\n        return best;\n    }\n    private int score(Board b, Symbol me, boolean myTurn, int depth, int alpha, int beta) {\n        if (wins(b, me))       return 10 - depth;                 // sooner is better\n        if (wins(b, opponent)) return depth - 10;\n        List<Cell> free = b.freeCells();\n        if (free.isEmpty()) return 0;\n        int best = myTurn ? Integer.MIN_VALUE : Integer.MAX_VALUE;\n        for (Cell c : free) {\n            b.place(c, myTurn ? me : opponent);\n            int s = score(b, me, !myTurn, depth + 1, alpha, beta);\n            b.lift(c);\n            if (myTurn) { best = Math.max(best, s); alpha = Math.max(alpha, best); }\n            else        { best = Math.min(best, s); beta  = Math.min(beta,  best); }\n            if (beta <= alpha) break;                             // this branch cannot change the answer\n        }\n        return best;\n    }\n    /** A full scan, on a hypothetical board. The real game never uses this: it has the O(1) counters. */\n    private boolean wins(Board b, Symbol s) {\n        int n = b.size();\n        for (int i = 0; i < n; i++) {\n            boolean row = true, col = true;\n            for (int j = 0; j < n; j++) {\n                if (!s.equals(b.at(i, j))) row = false;\n                if (!s.equals(b.at(j, i))) col = false;\n            }\n            if (row || col) return true;\n        }\n        boolean diag = true, anti = true;\n        for (int i = 0; i < n; i++) {\n            if (!s.equals(b.at(i, i)))         diag = false;\n            if (!s.equals(b.at(i, n - 1 - i))) anti = false;\n        }\n        return diag || anti;\n    }\n}\n\n// ---- ext: undo and redo for a whole match -- the history IS the undo log, so redo is a stack and five lines.\n/**\n * Redo on top of the engine's undo. Every undone move is pushed on a stack; redo replays it through the\n * ordinary play(), so it passes every check again and cannot smuggle an illegal position back in. A fresh\n * move clears the stack, because the branch it belonged to no longer exists.\n */\nclass MatchHistory {\n    private final Game game;\n    private final Deque<Move> undone = new ArrayDeque<>();\n\n    /** Wraps one game. */\n    MatchHistory(Game game) { this.game = game; }\n    /** A new move ends the redo branch. */\n    Move play(Player p, Cell c) { Move m = game.play(p, c); undone.clear(); return m; }\n    /** Take one back and remember it. */\n    Move undo() { Move m = game.undo(); undone.push(m); return m; }\n    /** Put the last undone move back, through the same validation as any other move. */\n    Move redo() {\n        Move m = undone.poll();\n        if (m == null) throw new IllegalStateException(\"nothing to redo\");\n        return game.play(m.player(), m.cell());\n    }\n    /** How many moves are waiting to be redone. */\n    int pending() { return undone.size(); }\n}\n\n// ---- ext: persistence -- save the MOVE LIST, not the board; resuming is a replay, and audit comes free.\n/**\n * The move list is the source of truth, so persistence is a text file of moves and loading is replaying them\n * through play(). Nothing serialises the board, the counters or the turn: they are rebuilt, which means a\n * saved game can never be restored into a state the rules would not allow.\n */\nclass MoveLog {\n    /**\n     * One line per move: seq,seat,row,col. The seat is the symbol index, not the name, because two seats may\n     * share a name. A real system would write these rows to a table.\n     */\n    static List<String> save(Game g) {\n

t)\">O(1)</text></g><g transform=\"translate(30 112)\"><rect width=\"380\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is the board full?</text><text x=\"190.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M410 131 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 112)\"><rect width=\"480\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a running filled count</text><text x=\"240.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 131 H1010\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1010 112)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 158)\"><rect width=\"380\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is on that square?</text><text x=\"190.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M410 177 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 158)\"><rect width=\"480\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Symbol[n][n], indexed</text><text x=\"240.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 177 H1010\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1010 158)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 204)\"><rect width=\"380\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what happened, and in what order?</text><text x=\"190.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M410 223 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 204)\"><rect width=\"480\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ArrayList&lt;Move&gt;, append only</text><text x=\"240.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 223 H1010\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1010 204)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) append</text></g><text x=\"615\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">nothing here reads a row or a column. The only O(n&sup2;) methods on the board &mdash; freeCells, render, copy &mdash; are for bots and screens, never for the win check.</text><text x=\"615\" y=\"287\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the counters are the whole trick and they have a price: they are state, so undo must decrement them, and they can only answer \"is this WHOLE line mine\".</text></svg></div><div class=\"move\"><p>\"Whose turn is it?\" is the head of an <code>ArrayDeque</code>, rotated rather than an index modulo the seat count, because rotation gives you \"give the turn back\" free on undo and a third seat free as well. \"Did that move win?\" is the interesting one. The obvious answer walks the row, the column and both diagonals after the move, which is O(n) and re-reads squares that cannot have changed. A move only touches four lines, so keep a counter per (line, seat) instead: four increments and four comparisons, the same work at 3x3 and at 1000x1000. Be honest about the crossover, because you will be asked. On a 3x3 the scan is twelve reads and the counters save nothing. They are not a speed win at the size in the prompt; they are what makes \"now do it on a 1000x1000\" a non-event. And they have a price: they are mutable state, so undo must decrement them, and they can only answer \"is this <i>whole</i> line mine\" &mdash; which is exactly why the rule sits behind an interface and not inside Board.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 270\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(20 80)\"><rect width=\"160\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">NOT_STARTED</text><text x=\"80.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">created, no moves</text></g><g transform=\"translate(210 80)\"><rect width=\"160\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">IN_PROGRESS</text><text x=\"80.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">turn = deque head</text></g><g transform=\"translate(390 20)\"><rect width=\"120\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"60.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WON</text><text x=\"60.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">winner set</text></g><g transform=\"translate(390 80)\"><rect width=\"120\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"60.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DRAW</text><text x=\"60.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">board full</text></g><g transform=\"translate(380 140)\"><rect width=\"140\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ABANDONED</text><text x=\"70.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">timeout, disconnect</text></g><path d=\"M180 100 H210\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M370 95 L390 45\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M370 100 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M370 110 L380 155\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M510 40 H545\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><path d=\"M510 100 H545\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><path d=\"M545 100 V8 H290 V80\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"400\" y=\"232\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">dashed = undo(): it takes back a WON or a DRAW; ABANDONED is final</text><rect x=\"570\" y=\"20\" width=\"640\" height=\"190\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"890\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside play(), and why it is this order</text><text x=\"585\" y=\"72\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1  take the lock; check terminal, bounds, turn, emptiness -- nothing is written</text><text x=\"585\" y=\"95\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2  stamp the mark, then ask the rule. If the rule throws, lift the mark back off</text><text x=\"585\" y=\"118\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3  ask \"did it win\" BEFORE \"is the board full\": a line on the last square WINS</text><text x=\"585\" y=\"141\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4  append the move, rotate the turn, unlock -- and only then tell the watchers</text><text x=\"585\" y=\"164\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a refused move leaves the board, the turn and the history exactly as they were;</text><text x=\"585\" y=\"187\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">undo is the same list in reverse: pop, un-count, lift, rewind turn and outcome</text><text x=\"615\" y=\"256\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">five things move together on every accepted move: the grid, the counters, the sequence, the turn and the outcome. Anything that rewinds must rewind all five.</text></svg></div><div class=\"move\"><p>A game is NOT_STARTED, then IN_PROGRESS, then WON, DRAW or ABANDONED &mdash; not \"over: true\". One enum with an <code>isTerminal()</code> means every entry point asks one question instead of three booleans drifting apart, and ABANDONED makes a disconnect or an expired move clock a real ending rather than a game that hangs forever. Writing the states down forces the order at the critical step, and three details in it are what interviewers push on. Every check runs before anything is written. If the rule throws after the mark is stamped, the mark is lifted back off, because a half-applied move is worse than a refused one. And \"did it win\" is asked <i>before</i> \"is the board full\", so a line completed on the last free square is a win and not a draw &mdash; the single ordering most people get wrong. Undo is the same list read backwards, and it must rewind all five things a move changed. It can take back a win or a draw but never an abandon, because the last move is not why that game ended.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one game's moves happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"560\" height=\"128\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: under a tenth of a microsecond</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">four checks: terminal, bounds, turn, emptiness</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one array write, and filled++</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">four counter bumps and four comparisons</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">one list append, one deque rotate</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">about fifteen field touches, whatever n is</text></g><path d=\"M590 84 H660\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"625\" y=\"74\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(660 20)\"><rect width=\"540\" height=\"128\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: milliseconds to minutes</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the brain choosing: minimax, a few milliseconds</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the spectator socket: ~50 ms, after the unlock</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">a person staring at the board: seconds</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">rendering and freeCells: O(n&sup2;), for screens</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">the board snapshot a bot reads: taken, then released</text></g><text x=\"615\" y=\"175\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">ten clients hammering the SAME game at the same instant</text><g transform=\"translate(30 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0</text></g><g transform=\"translate(148 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits ~10 us</text></g><g transform=\"translate(266 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits ~20 us</text></g><g transform=\"translate(384 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits ~30 us</text></g><g transform=\"translate(502 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits ~40 us</text></g><g transform=\"translate(620 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits ~50 us</text></g><g transform=\"translate(738 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits ~60 us</text></g><g transform=\"translate(856 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits ~70 us</text></g><g transform=\"translate(974 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits ~80 us</text></g><g transform=\"translate(1092 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits ~90 us</text></g><text x=\"615\" y=\"258\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tenth client waits about 0.1 ms: each hand-off wakes a sleeping thread (~10 us), far longer than the work inside. Nobody can tell.</text><text x=\"615\" y=\"277\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the deliberate part: a bot thinks on a COPY of the board taken under the lock and released. It may lose the race, and a lost race is a normal retry.</text></svg></div><div class=\"move\"><p>If every move takes the game's lock, is the server now a queue? It is &mdash; for under a tenth of a microsecond per move (35 to 75 nanoseconds, measured on a laptop), and only for the people at that one table. The locked part is about fifteen field touches, and it does not grow with the board size. When ten clicks collide, the wait is the hand-off: waking each sleeping thread takes about ten microseconds, so the tenth waits about a tenth of a millisecond. Everything slow is outside the lock, and the bot is the case worth saying out loud. <code>playAuto()</code> copies the board into a snapshot (a private copy of one instant) under the lock, releases it, and only then asks the brain. The copy is O(n&sup2;): nothing on a 3x3, about two milliseconds on a 1000&nbsp;&times;&nbsp;1000, and a human UI skips it by handing a cell in directly. The brain can lose the race while it was thinking: it gets CELL_TAKEN or NOT_YOUR_TURN and tries again, which is a normal outcome, not an error.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 264\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"210\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per game: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"68\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the locked part of a move: ~15 field touches, under 0.1 us</text><text x=\"35\" y=\"94\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">two people playing: one move every 5 seconds</text><text x=\"35\" y=\"120\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">that is 0.1 us of lock in every 5,000,000 us: 0.000002% busy</text><text x=\"35\" y=\"146\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">10,000 live tables on one server: one lock EACH, they never meet</text><text x=\"35\" y=\"172\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">50 bots hammering ONE table: the last waits ~0.2 ms (hand-offs)</text><text x=\"35\" y=\"198\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">the slow thing is the minimax search, and it is outside the lock</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 60)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 nothing slow inside the lock</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: brains, sockets and rendering are outside it</text></g><g transform=\"translate(600 116)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 spectators read without the lock</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">state and winner are volatile; history and board come back as copies</text></g><g transform=\"translate(600 172)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 compare-and-set instead of a lock</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">on each square and on a turn token -- and three more things to roll back</text></g><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">rung 3 is the one to say out loud and then decline: it makes the stamp race-free, but the turn, the counters and the outcome still need their own rollback.</text></svg></div><div class=\"move\"><p>One move every five seconds, against a lock held for under a tenth of a microsecond, keeps the lock busy about two millionths of one per cent of the time. Ten thousand live tables do not change that number, because each has its own lock and they never meet. Then the ladder. Rungs one and two this code already climbed: nothing slow inside the lock, and <code>state</code> and <code>winner</code> are volatile (read fresh by every thread, with no lock). So a spectator polling the score never queues behind a move. Rung three is the one to say out loud and then decline. It swaps the lock for compare-and-set (one hardware step that writes only if the value is still what you read) on each square and on a turn token. It makes the stamp race-free, but the turn, the counters and the outcome then need a rollback path of their own: more moving parts, for a game whose concurrency is two.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 305\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two clients, one square, one instant</text></g><path d=\"M360 37 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 18)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lock per game; test 1: 50 threads, exactly one accepted, one mark, one row</text></g><g transform=\"translate(30 60)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the wrong seat, or a taken square</text></g><path d=\"M360 79 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 60)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a typed reason and no write; test 2: board, turn and history identical after three rejections</text></g><g transform=\"translate(30 102)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the win rule throws halfway through</text></g><path d=\"M360 121 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 102)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lift the mark back off; test 3: the move never happened, and the retry lands</text></g><g transform=\"translate(30 144)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">undo forgets the counters</text></g><path d=\"M360 163 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 144)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rule.undo() rewinds them; test 4: replay the same square, it wins again</text></g><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the last square completes a line</text></g><path d=\"M360 205 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 186)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">win is judged before full; test 5: WIN, not DRAW</text></g><g transform=\"translate(30 228)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the spectator throws, or blocks</text></g><path d=\"M360 247 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 228)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">after the unlock, in a try/catch, on its own thread; test 7: both proven</text></g><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a failure test: FailureTests.java runs nine blocks, thirty-seven checks, and must print ALL PASS</text></svg></div><div class=\"move\"><p>The table is the list; two rows deserve a sentence. Undo clearing the square but forgetting the counters is the classic bug of this system, and it is invisible to the obvious test: the square <i>is</i> empty afterwards. So the test is not \"is the square empty\" but \"replay that same square and check it wins again\", which only passes if the counters came back down too. And the win-before-full ordering is tested by playing a line that completes on the ninth square of nine: WON, not DRAW. Each row is a few lines in FailureTests.java, which runs nine blocks and thirty-seven checks; block 9 covers the edges of the follow-ups. A design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 350\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"210\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"300\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"850\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"210\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface WinStrategy { boolean isWinning(Board, Move); }</text><text x=\"850\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">four in a row is a new file, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"210\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">interface MoveStrategy { Cell chooseMove(Board, Symbol); }</text><text x=\"850\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">human, random and minimax: one code path</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"210\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">publishMove(m) after the unlock, each in a try/catch</text><text x=\"850\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">the scoreboard hears; the game never waits</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"210\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">new AsyncObserver(feed, 8192) -- same kind in, same kind out</text><text x=\"850\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">a slow socket drops frames, never a move</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"210\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"300\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">GameState.isTerminal() guards every entry point</text><text x=\"850\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">an illegal move cannot happen</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text ame has a one-sentence defence</text></svg></div><div class=\"move\"><p>Read the table rather than a list of definitions: each row names the move that produced the pattern, so each name has a one-sentence defence. Two names need a plain gloss. State here is just the GameState enum that every entry point checks, and Command is the Move record: an action kept as data, so undo, redo and replay read one list. The bottom three rows matter as much as the top six. Saying \"Singleton, not here\" and \"Builder, never here\" out loud is what separates a design from a pattern parade, and \"Factory, not yet\" names the exact condition that would change the answer: rules arriving as strings from configuration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"450\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"560\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"450\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"560\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Board stores. WinStrategy judges. Game referees. An observer reports. Nobody does two.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"450\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">KInARowWinStrategy is a new file plus one argument to configure()</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"450\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">rule.isWinning(board, m);  a stateless rule keeps the default undo() rather than throwing</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"450\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">WinStrategy, MoveStrategy, Clock: one method. GameObserver's four are all defaults.</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"450\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"560\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">game.configure(new KInARowWinStrategy(4), () -&gt; now[0])</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>One letter is worth more than the table row gives it. L is the one people fumble: a stateless rule keeps the interface's default no-op <code>undo()</code> rather than throwing \"unsupported\", because a substitute that throws is not a substitute &mdash; that is why <code>undo()</code> is a default method and not an abstract one. And D is not decoration here: it is precisely why a test can hand the game a rule that explodes on demand and a clock that claims it is thirty-one seconds later.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 336\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">k in a row, mis&egrave;re, a bigger board</text></g><path d=\"M360 47 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"650\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"325.0\" y=\"23.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind WinStrategy plus one configure argument</text></g><text x=\"1150\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 80)\"><rect width=\"330\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a scoreboard, a socket, an early-draw watcher</text></g><path d=\"M360 103 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 80)\"><rect width=\"650\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"325.0\" y=\"23.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer; the lock and the rule do not change</text></g><text x=\"1150\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 136)\"><rect width=\"330\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a pause, a rematch offer, a forfeit</text></g><path d=\"M360 159 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 136)\"><rect width=\"650\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"325.0\" y=\"23.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more state and one more checked transition</text></g><text x=\"1150\" y=\"164\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 192)\"><rect width=\"330\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across squares</text><text x=\"165.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">Connect-4: a piece falls to the bottom</text></g><path d=\"M360 215 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 192)\"><rect width=\"650\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"325.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">map the column to the lowest free row BEFORE play()</text><text x=\"325.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">drop(column) is the only door, so a column only grows: a lost race is CELL_TAKEN</text></g><text x=\"1150\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 4 + 6</text><g transform=\"translate(30 248)\"><rect width=\"330\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">resume after a restart; two servers</text></g><path d=\"M360 271 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 248)\"><rect width=\"650\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"325.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">persist the MOVE LIST, not the board; loading is a replay</text><text x=\"325.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a board can never be restored into a position the rules would not allow</text></g><text x=\"1150\" y=\"276\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"322\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five, Board, Game, Move and the failure tests do not change. That is the test that the derivation was right.</text></svg></div><div class=\"move\"><p>The last two rows are the ones worth rehearsing. Connect-4 sounds like a new engine and is not: \"a piece lands on the lowest free row of its column\" is a mapping applied <i>before</i> <code>play()</code>. Clients get only <code>drop(column)</code>, never a raw play or an undo, so a column can only grow while they think. The same lock decides, and a lost race is the ordinary CELL_TAKEN retry. Persistence sounds like serialising a board and is not: you persist the move <i>list</i>, and loading replays it through <code>play()</code>, so a saved game can never come back in a position the rules would not allow. Page 05 has the working code for all five.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 644\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M125.0 280L125.0 261\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M240 387L254 387L254 218L240 218\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M240 485L268 485L268 218L240 218\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1095.0 110L1095.0 90\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M970 285L952 285L952 55L970 55\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1095.0 432L1095.0 412\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--mut  x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">seq: long,  atMs: long</text><line x1=\"0\" y1=\"80\" x2=\"340\" y2=\"80\" stroke=\"var(--line)\"/><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">symbol(): Symbol</text></g><g transform=\"translate(700 20)\"><rect width=\"230\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"115.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">GameState</text><line x1=\"0\" y1=\"34\" x2=\"230\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">NOT_STARTED, IN_PROGRESS</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">WON, DRAW, ABANDONED</text><line x1=\"0\" y1=\"72\" x2=\"230\" y2=\"72\" stroke=\"var(--line)\"/><text x=\"8\" y=\"85\" font-size=\"11.5\" fill=\"var(--text)\">isTerminal(): boolean</text></g><g transform=\"translate(700 120)\"><rect width=\"230\" height=\"106\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">InvalidMoveException</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">reason: Reason</text><line x1=\"0\" y1=\"48\" x2=\"230\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">OUT_OF_BOUNDS | CELL_TAKEN</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">NOT_YOUR_TURN | GAME_OVER</text><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">NO_FREE_CELL</text></g><g transform=\"translate(700 240)\"><rect width=\"230\" height=\"106\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Player</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">name: String</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">symbol: Symbol</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">strategy: MoveStrategy</text><line x1=\"0\" y1=\"80\" x2=\"230\" y2=\"80\" stroke=\"var(--line)\"/><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">decide(board): Cell</text></g><g transform=\"translate(700 368)\"><rect width=\"230\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Symbol</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">mark: char</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">index: int (dense slot)</text></g><g transform=\"translate(700 456)\"><rect width=\"230\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Cell</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">row: int</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">col: int</text></g><g transform=\"translate(970 20)\"><rect width=\"250\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">WinStrategy</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">isWinning(board, move): boolean</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">undo(board, move)  -- default</text></g><g transform=\"translate(970 110)\"><rect width=\"250\" height=\"106\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FullLineWinStrategy</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">rowCount / colCount: int[n][seats]</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">diagCount / antiCount: int[seats]</text><line x1=\"0\" y1=\"64\" x2=\"250\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">four ++ and four ==  : O(1)</text><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">undo: the same four, --</text></g><g transform=\"translate(970 240)\"><rect width=\"250\" height=\"106\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;extension&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">KInARowWinStrategy</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">k: int</text><line x1=\"0\" y1=\"56\" x2=\"250\" y2=\"56\" stroke=\"var(--line)\"/><text x=\"8\" y=\"69\" font-size=\"11.5\" fill=\"var(--text)\">walks out 4 ways: O(k)</text><text x=\"8\" y=\"85\" font-size=\"11.5\" fill=\"var(--text)\">stateless: default undo()</text><text x=\"8\" y=\"101\" font-size=\"11.5\" fill=\"var(--text)\">+ ScanWinStrategy: the O(n) one</text></g><g transform=\"translate(970 358)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">MoveStrategy</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">chooseMove(board, symbol): Cell</text></g><g transform=\"translate(970 432)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Scripted | RandomBot</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">a human UI, and a seeded bot</text></g><g transform=\"translate(970 506)\"><rect width=\"250\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;extension&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">MinimaxStrategy</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">opponent: Symbol</text><line x1=\"0\" y1=\"56\" x2=\"250\" y2=\"56\" stroke=\"var(--line)\"/><text x=\"8\" y=\"69\" font-size=\"11.5\" fill=\"var(--text)\">alpha-beta on a Board.copy()</text></g><g><path d=\"M20 620L64 620\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"624\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 620L284 620\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"624\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 620L504 620\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"624\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 620L684 620\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"624\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 620L904 620\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"624\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values; &laquo;extension&raquo; = it lives in Extensions.java, not in the core file). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the game owns its board and every move ever accepted. Plain arrow = references. Dashed green = handed in through <code>configure()</code>, which is why the game builds no rule and no clock. Dotted blue = notifies, and it happens after the lock is released. <b>Where state lives:</b> only Board (the grid, and how full it is) and Game (the turn, the history, the outcome, and the one lock over all of it) hold state that changes. The lock is fair: waiting threads get it in arrival order. FullLineWinStrategy is the third and it is deliberate: its counters are what make the win check O(1), and the price is the <code>undo()</code> in the interface. Everything else is a value or a rule with no state at all. Notice what is <i>not</i> here: no Turn class, because the turn is the head of a deque; no Winner class, because the winner is one field; and no win logic inside Board, because then \"four in a row\" would reopen the class that holds the grid.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (nine blocks, thirty-seven checks; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * A game&#x27;s life. Every entry point asks one question -- is this state terminal -- instead of two loose\n * booleans that drift apart. ABANDONED makes a disconnect or an expired move clock a real ending rather\n * than a game that hangs forever.\n */\nenum GameState {\n    NOT_STARTED, IN_PROGRESS, WON, DRAW, ABANDONED;\n    /** True once no further move is legal. undo() can take back a WON or a DRAW; ABANDONED is final. */\n    boolean isTerminal() { return this == WON || this == DRAW || this == ABANDONED; }\n}\n\n/**\n * One player&#x27;s mark. index is a dense slot (0, 1, 2 ... with no gaps) so the win bookkeeping can be plain int\n * arrays instead of a hash lookup on the code every move runs; it is also what makes a third player cost nothing.\n */\nrecord Symbol(char mark, int index) {\n    @Override public String toString() { return String.valueOf(mark); }\n}\n\n/** One square, by row and column. A record, so it compares by value and can safely be a map key. */\nrecord Cell(int row, int col) {\n    @Override public String toString() { return &quot;(&quot; + row + &quot;,&quot; + col + &quot;)&quot;; }\n}\n\n/**\n * One accepted move, in order. The list of these is the source of truth for this system: undo reads the\n * last one, replay reads them all, and an audit or a bug report is the same list.\n */\nrecord Move(Player player, Cell cell, long seq, long atMs) {\n    /** The mark this move stamped. Read from the player, so it can never disagree with the seat. */\n    Symbol symbol() { return player.symbol(); }\n    @Override public String toString() { return &quot;#&quot; + seq + &quot; &quot; + player.name() + &quot;[&quot; + symbol() + &quot;] -&gt; &quot; + cell; }\n}\n\n/**\n * A refused move, carrying a machine-readable reason. The caller must be able to tell &quot;not your turn&quot;\n * (retry in a moment) from &quot;cell taken&quot; (choose another) from &quot;game over&quot; (stop); a bare false cannot.\n */\nclass InvalidMoveException extends RuntimeException {\n    /** Why the move was refused. A bot&#x27;s retry loop switches on this. */\n    enum Reason { OUT_OF_BOUNDS, CELL_TAKEN, NOT_YOUR_TURN, GAME_OVER, NO_FREE_CELL }\n    final Reason reason;\n    /** Builds a typed rejection. The message is for humans, the reason is for code. */\n    InvalidMoveException(Reason reason, String message) { super(reason + &quot;: &quot; + message); this.reason = reason; }\n}\n\n/** Where time comes from. Injected, so a test decides what a move was stamped with and when a clock ran out. */\ninterface Clock { long nowMs(); }\n\n/**\n * The grid, and nothing else: what is where, stamp, lift, bounds, a copy, a picture. Deliberately no win\n * logic -- if storage knew how you win, &quot;four in a row instead of a full line&quot; would reopen this class.\n * Not thread-safe on purpose: the Game owns it and every touch happens inside the Game&#x27;s lock.\n */\nclass Board {\n    private final int size;\n    private final Symbol[][] grid;\n    private int filled;                                  // running count, so &quot;is it a draw&quot; is a comparison, not a scan\n\n    /** A square empty board. Below 3x3 no line can be completed, so it is refused here rather than later. */\n    Board(int size) {\n        if (size &lt; 3) throw new IllegalArgumentException(&quot;a board is at least 3x3, got &quot; + size);\n        this.size = size;\n        this.grid = new Symbol[size][size];\n    }\n    /** The side length: the board is size x size. */\n    int size() { return size; }\n    /** How many squares are stamped. O(1), because place and lift keep it. */\n    int filled() { return filled; }\n    /** True when no square is left. The draw test, in one comparison. */\n    boolean isFull() { return filled == size * size; }\n    /** Is that square on the board at all? */\n    boolean inBounds(Cell c) { return c.row() &gt;= 0 &amp;&amp; c.row() &lt; size &amp;&amp; c.col() &gt;= 0 &amp;&amp; c.col() &lt; size; }\n    /** On the board and not yet stamped. */\n    boolean isFree(Cell c) { return inBounds(c) &amp;&amp; grid[c.row()][c.col()] == null; }\n    /** The mark at those coordinates, or null for empty or off the board. Used by rules that walk outward. */\n    Symbol at(int row, int col) {\n        return (row &gt;= 0 &amp;&amp; row &lt; size &amp;&amp; col &gt;= 0 &amp;&amp; col &lt; size) ? grid[row][col] : null;\n    }\n    /** The mark on that square, or null if it is empty. The caller has already checked bounds. */\n    Symbol at(Cell c) { return grid[c.row()][c.col()]; }\n    /** Stamp a mark. The caller has already checked the square is free; this method does not re-check. */\n    void place(Cell c, Symbol s) { grid[c.row()][c.col()] = s; filled++; }\n    /** Take a mark back off, for undo and for the rollback when a rule throws. Lifting an empty square does nothing. */\n    void lift(Cell c) { if (grid[c.row()][c.col()] != null) { grid[c.row()][c.col()] = null; filled--; } }\n    /** Every empty square, in reading order. O(n^2): only bots and screens call it, never the win check. */\n    List&lt;Cell&gt; freeCells() {\n        List&lt;Cell&gt; out = new ArrayList&lt;&gt;();\n        for (int r = 0; r &lt; size; r++)\n            for (int c = 0; c &lt; size; c++) if (grid[r][c] == null) out.add(new Cell(r, c));\n        return out;\n    }\n    /** A detached copy. A bot thinks on one of these outside the lock, so the real board cannot move under it. */\n    Board copy() {\n        Board b = new Board(size);\n        for (int r = 0; r &lt; size; r++)\n            for (int c = 0; c &lt; size; c++) if (grid[r][c] != null) b.place(new Cell(r, c), grid[r][c]);\n        return b;\n    }\n    /** The board as text, for a console or a log. Presentation only. */\n    String render() {\n        StringBuilder sb = new StringBuilder();\n        for (Symbol[] row : grid) {\n            sb.append(&quot;     &quot;);\n            for (Symbol s : row) sb.append(s == null ? &quot;.&quot; : s).append(&#x27; &#x27;);\n            sb.append(&#x27;\\n&#x27;);\n        }\n        return sb.toString();\n    }\n}\n\n// &quot;on a 5x5, four in a row wins&quot; -&gt; the win condition is the first thing an interviewer changes -&gt; Strategy\n/**\n * The rule that judges the move that just landed: did it win? One method, because the win condition is the\n * part that changes. A rule that keeps bookkeeping must rewind it in undo(); a stateless rule inherits the\n * no-op. isWinning must be all-or-nothing: if it throws, its own bookkeeping must be untouched, because the\n * referee will only lift the mark from the board.\n */\ninterface WinStrategy {\n    /** Did this move complete a winning line? Called with the mark already stamped on the board. */\n    boolean isWinning(Board board, Move move);\n    /** Rewind whatever isWinning counted for this move. A stateless rule needs nothing. */\n    default void undo(Board board, Move move) { }\n}\n\n/**\n * The classic rule -- a full row, column or diagonal -- in four increments instead of a scan. A move touches\n * at most four lines, so one counter per (line, symbol) answers &quot;is this whole line mine&quot; in O(1) on a 3x3\n * and on a 1000x1000 alike. The price is state, which is exactly why undo() is in the contract.\n */\nclass FullLineWinStrategy implements WinStrategy {\n    private final int size;\n    private final int[][] rowCount, colCount;            // [line][symbol index]\n    private final int[] diagCount, antiCount;\n\n    /** Sized once: symbols is the number of seats, which is why a third player needs no change here. */\n    FullLineWinStrategy(int size, int symbols) {\n        this.size = size;\n        rowCount = new int[size][symbols]; colCount = new int[size][symbols];\n        diagCount = new int[symbols];      antiCount = new int[symbols];\n    }\n    /** Four increments and four comparisons, whatever the board size. */\n    @Override public boolean isWinning(Board board, Move m) {\n        int r = m.cell().row(), c = m.cell().col(), s = m.symbol().index();\n        boolean win = (++rowCount[r][s] == size);\n        win |= (++colCount[c][s] == size);               // |= never short-circuits: every counter stays honest\n        if (r == c)            win |= (++diagCount[s] == size);\n        if (r + c == size - 1) win |= (++antiCount[s] == size);\n        return win;\n    }\n    /** The same four lines, decremented. Without this, undo would leave a phantom win behind. */\n    @Override public void undo(Board board, Move m) {\n        int r = m.cell().row(), c = m.cell().col(), s = m.symbol().index();\n        rowCount[r][s]--; colCount[c][s]--;\n        if (r == c)            diagCount[s]--;\n        if (r + c == size - 1) antiCount[s]--;\n    }\n}\n\n// &quot;human, random bot, unbeatable bot&quot; -&gt; how a seat picks a square is a second rule that changes -&gt; Strategy\n/**\n * How a seat chooses its square. One method, so a human UI, a test script, a random bot and a minimax bot\n * are the same code path to the Game. Returns null when there is nothing to play.\n */\ninterface MoveStrategy {\n    /** The square this seat wants, judged from a board snapshot it may read at its leisure. */\n    Cell chooseMove(Board board, Symbol symbol);\n}\n\n/**\n * A human UI, or a test, handing cells in one at a time. When the script runs out it plays the first free\n * square, so a demo can never wedge.\n */\nclass ScriptedStrategy implements MoveStrategy {\n    private final Deque&lt;Cell&gt; script = new ArrayDeque&lt;&gt;();\n    /** The cells this seat will play, in order. */\n    ScriptedStrategy(Cell... cells) { script.addAll(Arrays.asList(cells)); }\n    /** The next scripted cell, else the first free square. */\n    @Override public Cell chooseMove(Board board, Symbol symbol) {\n        Cell c = script.poll();\n        if (c != null) return c;\n        List&lt;Cell&gt; free = board.freeCells();\n        return free.isEmpty() ? null : free.get(0);\n    }\n}\n\n/** A bot that plays anywhere free. Seeded, so a demo and a test replay exactly. */\nclass RandomBotStrategy implements MoveStrategy {\n    private final Random rng;\n    /** Same seed, same game, every run. */\n    RandomBotStrategy(long seed) { rng = new Random(seed); }\n    /** A uniformly chosen free square. */\n    @Override public Cell chooseMove(Board board, Symbol symbol) {\n        List&lt;Cell&gt; free = board.freeCells();\n        return free.isEmpty() ? null : free.get(rng.nextInt(free.size()));\n    }\n}\n\n/**\n * A seat at the table: a name, a mark, and a brain. Identity is the object, so two seats can share a name\n * and never share a turn. The brain is held, not inherited, so human and bot are one class.\n */\nfinal class Player {\n    private final String name;\n    private final Symbol symbol;\n    private final MoveStrategy strategy;\n\n    /** A seat. The strategy is handed in; Player never builds one. */\n    Player(String name, Symbol symbol, MoveStrategy strategy) {\n        this.name = name; this.symbol = symbol; this.strategy = strategy;\n    }\n    /** The display name. Not an identity: the object is. */\n    String name() { return name; }\n    /** This seat&#x27;s mark, and its dense index into the win counters. */\n    Symbol symbol() { return symbol; }\n    /** Ask the brain, on a board snapshot. Called outside the game&#x27;s lock. */\n    Cell decide(Board board) { return strategy.chooseMove(board, symbol); }\n    @Override public String toString() { return name + &quot;[&quot; + symbol + &quot;]&quot;; }\n}\n\n// &quot;a scoreboard, a live log, a websocket feed&quot; -&gt; people who want to know, and must not be in the way -&gt; Observer\n/**\n * Anyone who wants to know what happened: a log, a scoreboard, a socket. Every callback is a default, so an\n * observer implements only the event it cares about. Called after the lock is released, never inside it.\n */\ninterface GameObserver {\n    /** A move was accepted. */\n    default void onMove(Game game, Move move) { }\n    /** A move was taken back. Without this, a spectator would keep showing a mark that is gone. */\n    default void onUndo(Game game, Move undone) { }\n    /** The game changed state -- started, won, drawn, abandoned, or rewound by an undo. */\n    default void onStateChange(Game game, GameState from, GameState to) { }\n    /** A move was refused, and why. A dashboard counts these; a client shows the reason. */\n    default void onRejected(Game game, Player player, Cell cell, InvalidMoveException e) { }\n}\n\n/** Narrates a game to stdout. The engine itself prints nothing; that is the whole point of the interface. */\nclass MoveLogger implements GameObserver {\n    @Override public void onMove(Game g, Move m) { System.out.println(&quot;     move   &quot; + m); }\n    @Override public void onUndo(Game g, Move m) { System.out.println(&quot;     undo   &quot; + m); }\n    @Override public void onStateChange(Game g, GameState from, GameState to) {\n        System.out.println(&quot;     state  &quot; + from + &quot; -&gt; &quot; + to + (to == GameState.WON ? &quot;  winner=&quot; + g.winner() : &quot;&quot;));\n    }\n    @Override public void onRejected(Game g, Player p, Cell c, InvalidMoveException e) {\n        System.out.println(&quot;     reject &quot; + p + &quot; at &quot; + c + &quot;  &quot; + e.reason);\n    }\n}\n\n/**\n * Cross-game state the Game must never own: who won which game. Keyed by game id rather than counted, so an\n * undo that takes a win back also takes the point back -- a tally of increments could not do that.\n */\nclass ScoreBoard implements GameObserver {\n    private final Map&lt;String, String&gt; decided = new ConcurrentHashMap&lt;&gt;();   // game id -&gt; winner&#x27;s name\n    @Override public void onStateChange(Game g, GameState from, GameState to) {\n        if (to == GameState.WON &amp;&amp; g.winner() != null) decided.put(g.id(), g.winner().name());\n        else if (from == GameState.WON) decided.remove(g.id());              // an undo rewound a finished game\n    }\n    /** Games won by that name, 0 if never. */\n    int wins(String name) { int n = 0; for (String w : decided.values()) if (w.equals(name)) n++; return n; }\n    @Override public String toString() {\n        Map&lt;String, Integer&gt; tally = new TreeMap&lt;&gt;();\n        for (String w : decided.values()) tally.merge(w, 1, Integer::sum);\n        return &quot;wins=&quot; + tally;\n    }\n}\n\n/**\n * A spectator that cannot get in the way. It wraps any other observer and delivers on its own background\n * (daemon) thread from a fixed-size queue, so a slow websocket or a blocking log never slows a move down.\n * Decorator: the same kind in, the same kind out, one behaviour added, and the wrapped observer never knows\n * it was wrapped. It must forward EVERY callback: one left out would fall to the interface&#x27;s empty default.\n */\nclass AsyncObserver implements GameObserver, AutoCloseable {\n    private final GameObserver base;\n    private final ThreadPoolExecutor pump;\n\n    /** queueSize events may be in flight; beyond that the OLDEST is dropped -- a spectator loses frames, never the game. */\n    AsyncObserver(GameObserver base, int queueSize) {\n        this.base = base;\n        this.pump = new ThreadPoolExecutor(1, 1, 0L, TimeUnit.MILLISECONDS, new ArrayBlockingQueue&lt;&gt;(queueSize),\n                r -&gt; { Thread t = new Thread(r, &quot;observer-pump&quot;); t.setDaemon(true); return t; },\n                new ThreadPoolExecutor.DiscardOldestPolicy());\n    }\n    private void post(Runnable r) { try { pump.execute(r); } catch (RuntimeException ignored) { } }\n    @Override public void onMove(Game g, Move m) { post(() -&gt; base.onMove(g, m)); }\n    @Override public void onUndo(Game g, Move m) { post(() -&gt; base.onUndo(g, m)); }\n    @Override public void onStateChange(Game g, GameState from, GameState to) { post(() -&gt; base.onStateChange(g, from, to)); }\n    @Override public void onRejected(Game g, Player p, Cell c, InvalidMoveException e) { post(() -&gt; base.onRejected(g, p, c, e)); }\n    /** Stops the pump. Events still queued are dropped. */\n    @Override public void close() { pump.shutdownNow(); }\n}\n\n/**\n * The referee, and the only class allowed to change anything. &quot;The game is live&quot;, &quot;it is your turn&quot;, &quot;that\n * square is empty&quot;, &quot;stamp it&quot;, &quot;did that win&quot;, &quot;next player&quot; are one indivisible fact, so all of them happen\n * inside one lock held by this game. The lock is per GAME, so a server runs thousands in parallel.\n */\nclass Game {\n    private final String id;\n    private final Board board;\n    private final List&lt;Player&gt; players;\n    private final Deque&lt;Player&gt; turnOrder;               // rotation, not an index: undo is a rotate-back\n    private final List&lt;Move&gt; history = new ArrayList&lt;&gt;();\n    private final List&lt;GameObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n    // fair: waiting threads get the lock in arrival order, so a client that spams moves cannot starve (lock out) the other seat\n    private final ReentrantLock lock = new ReentrantLock(true);\n    private WinStrategy winRule;                         // handed in through configure(); never built here\n    private Clock clock;\n    private long seq;\n    private long turnStartedMs;                          // when the seat on turn began: what the move clock measures\n    private volatile GameState state = GameState.NOT_STARTED;     // volatile: a spectator polls without queueing\n    private volatile Player winner;\n\n    /**\n     * A game with its seats. Fewer than two seats has no opponent; more seats than the board is wide is refused,\n     * because most seats could then never fill a line. Symbol indexes must be a dense 0..n-1 (no gaps), because\n     * they index the win counters.\n     */\n    Game(String id, int size, List&lt;Player&gt; players) {\n        if (players.size() &lt; 2 || players.size() &gt; size)\n            throw new IllegalArgumentException(&quot;need 2..&quot; + size + &quot; seats on a &quot; + size + &quot;x&quot; + size + &quot; board, got &quot; + players.size());\n        TreeSet&lt;Integer&gt; slots = new TreeSet&lt;&gt;();\n        for (Player p : players) slots.add(p.symbol().index());\n        if (slots.size() != players.size() || slots.first() != 0 || slots.last() != players.size() - 1)\n            throw new IllegalArgumentException(&quot;symbol indexes must be a dense 0..&quot; + (players.size() - 1) + &quot;, got &quot; + slots);\n        this.id = id;\n        this.board = new Board(size);\n        this.players = List.copyOf(players);\n        this.turnOrder = new ArrayDeque&lt;&gt;(this.players);\n    }\n\n    /** The two thi

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#0f1419;--bg2:#161b22;--bg3:#1c2330;--line:#2a3441;--text:#d6dde6;--muted:#7d8896;--acc:#3ddbb0;--acc2:#7cc4ff;--warn:#f0a35e;--err:#ff6b6b;--mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;--ui:-apple-system,"Segoe UI",Inter,Roboto,sans-serif}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px}

.side .st .n{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:18px}

.hdr{padding:16px 22px 8px;display:flex;align-items:baseline;gap:12px} .hdr h2{margin:0;font-size:18px;font-weight:600} .hdr .stage{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);border:1px solid var(--acc);border-radius:4px;padding:2px 7px}

.say{margin:0 22px 6px;color:var(--muted);font-size:13px} .prim{margin:0 22px 12px;font-size:12px;color:var(--muted)} .prim a{color:var(--acc2);font-family:var(--mono)} .say::before{content:"say aloud: ";color:var(--warn);font-weight:600}

.ed .chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg2)} .chip{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)} .chip.new{border-color:var(--acc);color:var(--acc)}
pre{margin:0;padding:14px 0;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;tab-size:4} pre .ln{display:inline-block;width:44px;text-align:right;padding-right:14px;color:#3d4756;user-select:none}
.copy{margin-left:auto;font-family:var(--mono);font-size:11px;background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:2px 10px;cursor:pointer} .copy:hover{background:var(--acc);color:#04211a}
.d{color:#7fa66f;font-style:italic} .right-uml{margin:0} .right-uml svg{width:100%;height:auto} .move{margin:0 22px 18px} .move h3{margin:0 0 6px;font-size:14.5px} .move p{margin:6px 0 0;line-height:1.6} .fullboard{margin:0 22px 14px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px} .fullboard svg{width:100%;height:auto;display:block} .req{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 22px 18px} .req>div{background:var(--bg3);border-radius:8px;padding:16px 20px 18px} .req b{color:var(--acc)} .req ul{margin:6px 0 0;padding-left:18px} .req li{font-size:13.5px;line-height:1.55;margin:5px 0} table.ask{margin:0 0 6px} table.ask th{font-size:12px;color:var(--acc);font-weight:600;padding:8px 10px} table.ask td{font-size:13px;line-height:1.5;padding:9px 10px} table.ask td:first-child{color:var(--text)} table.ask td:not(:first-child){color:var(--muted)} .move h3{margin-top:10px} .grade{margin:0 22px 14px;background:var(--bg3);border-left:3px solid var(--acc);padding:10px 14px;border-radius:0 6px 6px 0} .grade b{color:var(--acc)} .wrap.wide .right{display:none}
.k{color:#c792ea} .s{color:#c3e88d} .c{color:#5c6773;font-style:italic} .n{color:#f78c6c} .t{color:#82aaff}
.nav{display:flex;gap:10px;padding:0 22px 24px} .nav button{background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit} .nav button.pri{background:var(--acc);color:#04211a;border-color:var(--acc);font-weight:600}
.right h3{margin:4px 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#cd{width:100%;height:auto;display:block} .nd rect{fill:var(--bg3);stroke:var(--line);stroke-width:1.2} .nd text{fill:var(--text);font-family:var(--mono)} .nd .lb{font-size:12px} .nd .sb{font-size:9.5px;fill:var(--muted)}
.nd.iface rect{stroke-dasharray:4 3} .nd.enum rect{rx:14} .nd{opacity:0;transition:opacity .3s} .nd.seen{opacity:.45} .nd.cur{opacity:1} .nd.cur rect{stroke:var(--acc);stroke-width:1.8;fill:#12302a}
.e{fill:none;stroke:var(--line);stroke-width:1.2;opacity:0;transition:opacity .3s;color:var(--line)} .e.seen{opacity:.6} .e.cur{opacity:1;stroke:var(--acc);color:var(--acc)} .e.isa{} .e.ref{stroke-dasharray:4 3} .e.use{stroke-dasharray:1.5 3}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin:8px 0 14px;flex-wrap:wrap} .legend span::before{content:"";display:inline-block;width:22px;border-top:1.5px solid var(--muted);margin-right:5px;vertical-align:middle} .legend .own::before{} .legend .ref::before{border-top-style:dashed} .legend .use::before{border-top-style:dotted}
.pat{margin-top:10px} .pat div{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px} .pat div span:last-child{color:var(--muted)} .pat div.on{color:var(--acc)} .pat div.on span:last-child{color:var(--text)}
/* practice */
.prac{padding:0 22px}
.card{border:1px solid var(--line);border-radius:8px;background:var(--bg2);margin-bottom:16px} .card .ch{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)} .card .ch h3{margin:0;font-size:15px} .card .cb{padding:14px 16px;line-height:1.6}
.timer{margin-left:auto;font-family:var(--mono);font-size:12px;background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:4px 12px;cursor:pointer} .timer.run{background:var(--acc);color:#04211a} .timer.done{border-color:var(--err);color:var(--err)}
.kind{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:2px 6px;white-space:nowrap} .ans table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0} .ans th,.ans td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} .ans th{color:var(--muted);font-weight:500} .ans .ed{margin:10px 0} .say2{margin:8px 0 0;padding:8px 12px;background:#132a24;border-left:3px solid var(--acc);border-radius:0 6px 6px 0} .say2 b{color:var(--acc)}
.prompt{background:var(--bg3);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 6px 6px 0;font-style:italic;margin-bottom:10px}
details{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:10px} summary{cursor:pointer;color:var(--acc2);font-weight:600} a{color:var(--acc)}
.right .lock{display:none;color:var(--muted);padding:40px 10px;text-align:center;border:1px dashed var(--line);border-radius:8px} .right.locked .lock{display:block} .right.locked #cd,.right.locked .legend,.right.locked .pat,.right.locked h3:nth-of-type(2){display:none} summary small{color:var(--muted);font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} th{color:var(--text);font-weight:500;white-space:nowrap} td{color:var(--muted)}
ul.chk{list-style:none;padding:0;margin:6px 0} ul.chk li::before{content:"[ ] ";font-family:var(--mono);color:var(--muted)}
.miss textarea{width:100%;min-height:80px;background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:13px var(--mono)}
@media (max-width:1100px){.wrap{grid-template-columns:200px 1fr} .right{display:none}}
</style></head><body>
<div class="top"><h1>Tic-Tac-Toe</h1><span class="sub">LLD &middot; Java &middot; OpenJDK 21: demo, 9 test blocks and a 50-thread race pass</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>
</div>
<div class="wrap">
<nav class="side" id="side"></nav>
<section class="main" id="main">

</section>
<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design tic-tac-toe. Two players take turns marking squares, and the first to complete a line wins. Make the board size a parameter, let a seat be a human or a bot, and assume two clients can submit a move in the same millisecond. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>Two or more seats take turns putting a mark on a square of an n&nbsp;&times;&nbsp;n grid. A move is legal only if the game is still live, it is that seat's turn, and the square is on the board and empty. Anything else is refused, and refused in a way that tells the caller whether to try again in a moment or stop altogether. An accepted move stamps the mark and immediately decides what happened: it completed a line, so that seat won; or it filled the last square without completing a line, so the game is drawn; or neither, and the turn passes. It must also be possible to take a move back, which is harder than it sounds, because one move changes five things at once. The invariant is the rule that must hold at every instant: one move is accepted per turn, and one mark ever lands on a square. It must hold even when the same person double-clicks from a phone and a laptop in the same millisecond.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that plays a game to the end and then proves the race. The interviewer watches, in this order, for the questions you ask before typing; which class owns which fact &mdash; storage stores, the rule judges, the referee arbitrates; one move end to end; what happens when two clients submit at the same instant; where the rule that will change lives, so \"four in a row\" is a new class and not an edit; and what the board looks like after a move is refused halfway through. The twists are the last twenty minutes, and page 05 takes them one at a time.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 345\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">play</text><g transform=\"translate(175 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a seat taps a square</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a human, or a bot that just chose</text></g><path d=\"M415 57 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">four checks, one step</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">live / on board / your turn / empty</text></g><path d=\"M675 57 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stamp it, judge the line</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">four counter bumps: O(1) at any size</text></g><path d=\"M935 57 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">win, draw, or next seat</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">then, after the unlock, the watchers</text></g><text x=\"88\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">undo</text><g transform=\"translate(175 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">somebody takes it back</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a misclick, or an agreed take-back</text></g><path d=\"M415 192 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">five things rewind together</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">board, counters, turn, winner, log</text></g><path d=\"M675 192 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the rule un-counts its line</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">or a phantom win survives the undo</text></g><path d=\"M935 192 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same seat plays again</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the game is live exactly as before</text></g><path d=\"M555 84 V95\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 95)\"><rect width=\"330\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"165.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refused, with a typed reason: nothing is written</text></g><text x=\"88\" y=\"262\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"262\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, without scanning the board: whose turn is it?  is it over, and who won?  what is on (1,1)?  what happened, in order?</text><text x=\"88\" y=\"292\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">end</text><text x=\"175\" y=\"292\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">abandon: a disconnect or a move clock that ran out ends it with no winner, for good; a move that lands first beats a late tick</text><text x=\"615\" y=\"330\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">two clients can submit for the same game in the same millisecond: exactly one move may be accepted per turn, and a refused one changes nothing</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>A full line on an n&nbsp;&times;&nbsp;n board, or k in a row on a bigger one?</td><td>A full line; k in a row is a follow-up</td><td>O(1) counters instead of a scan, and the rule behind an interface (moves 3, 5)</td></tr><tr><td>Two seats, or more?</td><td>Two, but the code must not care</td><td>A dense symbol index (seats numbered 0, 1, 2 with no gaps), and counters sized [line][seat] (moves 1, 5)</td></tr><tr><td>Human, bot, or both &mdash; and how clever must the bot be?</td><td>Both; random by default, unbeatable on request</td><td>How a seat chooses is a second one-method interface (move 3)</td></tr><tr><td>One console, or a server where two clients move in the same millisecond?</td><td>A server</td><td>One lock per game, and what is allowed inside it (moves 4, 7)</td></tr><tr><td>Undo, replay and spectators, or one game played straight through?</td><td>All three</td><td>The move list is the source of truth; watchers are told after the unlock (moves 5, 6)</td></tr><tr><td>When a move is illegal: throw, or return false?</td><td>Throw, with a machine-readable reason</td><td>The caller can tell \"retry\" from \"choose another\" from \"stop\" (move 6)</td></tr><tr><td>Is a draw only a full board, or the moment nobody can still win?</td><td>A full board; early draw is a follow-up</td><td>One comparison on a running count, not a scan (move 5)</td></tr><tr><td>One process and in memory, or does a game survive a restart?</td><td>One process</td><td>No repository yet; persistence is a replay of the move list (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Create a game: a board size, and two or more seats, each with a name, a mark and a way of choosing squares.</li>\n<li>Seats move in a fixed rotation. A move is accepted only if the game is live, it is that seat's turn, and the square is on the board and empty.</li>\n<li>An accepted move stamps the mark, appends to an ordered history, and decides the outcome: a win, a draw, or the next seat.</li>\n<li>Undo: take the last move back, rewinding the board, the win bookkeeping, the turn and the outcome together.</li>\n<li>Abandon: end a game with no winner, for a disconnect or a move clock that ran out. An abandoned game stays abandoned.</li>\n<li>Read at any time: whose turn, the state, the winner, the move history, the board as text.</li>\n<li>Watchers are told about every accepted move, every undo, every state change and every rejection.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Two clients submitting for one game in the same millisecond: exactly one move per turn, and never two marks on one square.</li>\n<li>The default win check is O(1) whatever the board size: four increments, not a scan of rows and columns.</li>\n<li>A refused move leaves the board, the turn and the history exactly as they were; the caller retries.</li>\n<li>The win rule and a seat's brain are swappable without opening Game or Board.</li>\n<li>One source of truth: the move list. Undo, replay and audit all read it.</li>\n<li>No printing, no sockets, no sleeping inside the model; watchers are told after the lock is released.</li>\n<li>In memory, one process (say it; a follow-up persists the move list).</li></ul></div></div>\n<div class=\"move\"><h3>One evening, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 180\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"270\" height=\"105\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">21:04:00  Ann taps (1,1)</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">live, Ann's turn, (1,1) is free</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">stamped; four counters bumped</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">no line yet: Bob's turn now</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"270\" height=\"105\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">21:04:03  two taps, one square</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">Bob's phone and laptop both send (0,1)</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one stamped, one NOT_YOUR_TURN</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one mark, one row in the history</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"270\" height=\"105\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">21:06:10  Ann completes column 0</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">colCount[0][X] hits 3 = board size</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">WON, winner=Ann, turn stops</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the scoreboard hears, after unlock</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"270\" height=\"105\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">21:06:14  Ann takes it back</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">colCount[0][X] back to 2, square empty</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">IN_PROGRESS, winner=null, Ann up</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the scoreboard drops the point</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> the classic rule (a full row, column or diagonal) with the board size as a parameter; O(1) counters, never a scan; a seat is a name, a mark and an injected brain; a refused move is typed and writes nothing; the move list is the source of truth; one lock per game, in memory, one process. Out of scope, named aloud: k in a row, Connect-4, an unbeatable bot, a move clock, persistence, early-draw &mdash; each a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. Tic-tac-toe looks too small for a derivation, which is exactly the trap: the interview is not about the rules of the game, it is about which class owns which fact, what happens when two clients move at once, and what an undo has to rewind.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 222\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a PLAYER puts a SYMBOL on a CELL of a BOARD; a GAME holds the turn, the history and the outcome; a WIN RULE judges the MOVE; a WATCHER is told</text><g transform=\"translate(30 110)\"><rect width=\"200\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Board</text><text x=\"100.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the grid, and how full it is</text></g><path d=\"M130.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(250 110)\"><rect width=\"230\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"115.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Game</text><text x=\"115.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">turn, history, outcome, lock</text></g><path d=\"M365.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(500 110)\"><rect width=\"170\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"85.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Move</text><text x=\"85.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a record; never edited</text></g><path d=\"M585.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(690 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Cell / Symbol</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two ints and a mark</text></g><path d=\"M777.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(885 110)\"><rect width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"75.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Player</text><text x=\"75.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a seat: fixed</text></g><path d=\"M960.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1055 110)\"><rect width=\"155\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"77.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Win rule</text><text x=\"77.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a calculation</text></g><path d=\"M1132.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = its state changes, so it becomes a class with a lock over it.   dashed = a value that never changes, or a rule with no state: a record or an interface</text><text x=\"615\" y=\"209\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">two things change: the grid and the game's bookkeeping (move 5 adds the win counters). That is the shortlist of what one lock must cover.</text></svg></div><div class=\"move\"><p>Underline the nouns in the prompt, then sort them by one question: does anything about this change during a game? The <b>board</b> changes (the grid, and how full it is) and the <b>game</b> changes (the turn, the history, the winner), so those two are classes. A <b>move</b> never changes once it has happened, so it is a record (a Java value class whose fields are fixed when it is made). A <b>cell</b> is two ints and a <b>symbol</b> is a mark plus a number, so those are records too. A <b>player</b> is a name, a mark and a way of choosing, none of which move mid-game. A <b>win rule</b> is a calculation, so it is an interface; move 5 gives the default one counters, and the game's lock covers those too. Two classes with changing state is the shortest possible list for a lock to cover, and that is the whole point of doing this sort first.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 286\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">choose a square</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M330 42 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 20)\"><rect width=\"410\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"205.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MoveStrategy  (owns no game state)</text><text x=\"205.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M800 42 H860\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(860 20)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">strategy.chooseMove(board, symbol)</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 74)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stamp or lift a mark</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M330 96 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 74)\"><rect width=\"410\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"205.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Board  (owns the grid and the count)</text><text x=\"205.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M800 96 H860\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(860 74)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">board.place(cell, symbol) / lift(cell)</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 128)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">judge the move that landed</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M330 150 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 128)\"><rect width=\"410\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"205.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WinStrategy  (owns its counters)</text><text x=\"205.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M800 150 H860\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(860 128)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rule.isWinning(board, move)</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 182)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">accept a move, take one back</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M330 204 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 182)\"><rect width=\"410\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"205.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Game  (owns all three, and the turn)</text><text x=\"205.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M800 204 H860\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(860 182)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">game.play(player, cell) / game.undo()</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"254\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb whose state is spread over three classes goes to the one that owns all three: that class is the referee, and it is the only one that changes anything</text><text x=\"615\" y=\"273\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">notice what does NOT become a class: there is no Turn and no Winner. The turn is the head of a deque and the winner is one field, both on the referee.</text></svg></div><div class=\"move\"><p>\"Choose a square\" touches no game state &mdash; it reads a board and returns a cell &mdash; so it belongs to a rule of its own. \"Stamp a mark\" and \"lift it off\" touch the grid, so they belong to the board. \"Did that move win\" touches the win counters, so it belongs to the rule that keeps them. \"Accept a move\" touches all three at once, plus the turn, and only the game sees all four. So the game is the referee, the only class that changes anything, and <code>game.play(player, cell)</code> is its main door. Notice what does <i>not</i> become a class. No Turn class: the turn is the head of a deque (a queue you can take from at the front and add to at the back). No Winner class: the winner is one field. Either one would give you two places that must agree about the same fact, which is how these implementations end up with a board that says one thing and a flag that says another.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 294\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 70)\"><rect width=\"220\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Game</text><text x=\"110.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(rule, clock)</text></g><path d=\"M250 115 H330 V42 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 20)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WinStrategy</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">how you win: it changes first</text></g><g transform=\"translate(740 20)\"><rect width=\"460\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"230.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FullLineWinStrategy  /  KInARowWinStrategy</text><text x=\"230.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 42 H680\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 115 H330 V98 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 76)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MoveStrategy</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">how a seat picks a square</text></g><g transform=\"translate(740 76)\"><rect width=\"460\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"230.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Scripted (a human UI)  /  RandomBot  /  Minimax</text><text x=\"230.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 98 H680\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 115 H330 V154 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 132)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">GameObserver</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who is told, and what they do</text></g><g transform=\"translate(740 132)\"><rect width=\"460\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"230.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MoveLogger  /  ScoreBoard  /  SpectatorFeed  /  DeadLineWatcher</text><text x=\"230.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 154 H680\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 115 H330 V210 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 188)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where now comes from</text></g><g transform=\"translate(740 188)\"><rect width=\"460\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"230.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::currentTimeMillis  /  () -&gt; now[0] in a test</text><text x=\"230.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 210 H680\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"262\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed = handed in. The Game builds none of these, which is why \"on a 5x5, four in a row wins\" is a new file and one argument.</text><text x=\"615\" y=\"281\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one observer wraps another: AsyncObserver(feed) puts a slow socket on its own thread, and the feed never knows it was wrapped. That is Decorator.</text></svg></div><div class=\"move\"><p>Four things here will change, and you know which. How you win changes first &mdash; \"on a 5x5, four in a row\" is the standard follow-up &mdash; so <code>WinStrategy</code> is a one-method interface. How a seat picks a square changes (a human UI, a test script, a random bot, an unbeatable one), so <code>MoveStrategy</code> is a second. Who is told changes (a log today, a scoreboard and a websocket later), so <code>GameObserver</code> is a third. And where \"now\" comes from changes the moment you write a test about a move clock, so <code>Clock</code> is a fourth. The game is <i>given</i> all four and builds none. The patterns fall out of that, not the other way round: a swappable rule behind an interface is <b>Strategy</b>; announcing without knowing who is listening is <b>Observer</b>; wrapping another of the same kind to add one behaviour is <b>Decorator</b>, which here is <code>AsyncObserver</code>. Do them; do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 212\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Bob's phone</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">sees (0,0) free, Bob's turn</text></g><g transform=\"translate(30 110)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Bob's laptop</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">sees (0,0) free, Bob's turn</text></g><g transform=\"translate(360 70)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">square (0,0)</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">empty</text></g><path d=\"M230 52 H360 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M230 132 H360 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"295\" y=\"40\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"295\" y=\"168\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"590\" y=\"20\" width=\"300\" height=\"150\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"740\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"740\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both stamp: one mark overwrites</text><text x=\"740\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">the other, two moves land for one</text><text x=\"740\" y=\"110\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">turn, and the history is a lie</text><text x=\"740\" y=\"145\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: check AND write as ONE step</text><g transform=\"translate(920 40)\"><rect width=\"280\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"140.0\" y=\"49.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Game.lock</text><text x=\"140.0\" y=\"65.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">check, stamp, judge, rotate = one step</text></g><text x=\"1060\" y=\"178\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock lives where the changing state lives</text><text x=\"1060\" y=\"197\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one lock per GAME: ten thousand tables never wait</text></svg></div><div class=\"move\"><p>Bob double-clicks, or his phone retries while his laptop is still trying. Two threads both read \"the game is live, it is Bob's turn, (0,0) is empty\" and both stamp: one mark overwrites the other, two moves land for one turn, and the history now says something that never happened. Worse, if the two threads are different seats, both can complete a line and you get two winners. So the four checks and the stamp are not five operations, they are one, and they live in the class that owns the board and the turn: the game. The lock is per <i>game</i>, not per server, which is the whole trick: ten thousand tables run at once and never wait for each other. The two people at one table are serialised (made to go one at a time) for well under a microsecond. Anything that only listens is called after the lock is released.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"380\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">whose turn is it, and who is next?</text><text x=\"190.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M410 39 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 20)\"><rect width=\"480\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"13.0\" text-anchor=\"middle\" dominant-bas

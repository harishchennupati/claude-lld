: ask the gateway by key, then finish the job or hand the money back. */\n    Booking settle(String bookingId, PaymentProcessor pay) {\n        Booking b = svc.find(bookingId);\n        if (b.status == BookingStatus.CONFIRMED) return b;       // a retry already finished it\n        String ref = query.refFor(b.id);                         // the key the gateway was given: the booking id\n        if (ref == null) return null;                            // it never charged: let the hold lapse by itself\n        try { if (b.show.commit(b, ref) || ref.equals(b.paymentRef)) return b; }   // commit with THAT ref: no second charge\n        catch (HoldLapsed e) { /* the hold died while the outcome was unknown */ }\n        pay.refund(ref, b.amountPaise);                          // money moved, the seat did not: give it back\n        return null;\n    }\n}\n\n// ---- ext: a refund policy -- how much money comes back depends on how close the show is\n/** How much of a cancelled booking is returned, in paise. Another rule that changes, so another interface. */\ninterface RefundPolicy { long refundPaise(Booking b, long nowMs); }\n\n/** The usual cinema rule: everything back until two hours before, half until twenty minutes, nothing after. */\nclass TieredRefund implements RefundPolicy {\n    public long refundPaise(Booking b, long nowMs) {\n        long minutesToShow = (b.show.startMs - nowMs) / 60_000L;\n        if (minutesToShow &gt;= 120) return b.amountPaise;\n        if (minutesToShow &gt;= 20) return b.amountPaise / 2;       // integer paise: half of 25,000 is 12,500 exactly\n        return 0;                                                // the seat still comes back; the money does not\n    }\n}\n\n/**\n * Cancel with a policy. The seat returns to the market whatever the money does: the amount is decided from\n * frozen fields before anything moves, the seats come back under the show&#x27;s lock, the refund is sent after.\n */\nclass CancelWithRefund {\n    private final BookingService svc;\n    private final RefundPolicy policy;\n    private final Clock clock;\n    CancelWithRefund(BookingService svc, RefundPolicy policy, Clock clock) { this.svc = svc; this.policy = policy; this.clock = clock; }\n    /** Cancel, and return the paise actually sent back. */\n    long cancel(String bookingId, PaymentProcessor pay) {\n        Booking b = svc.find(bookingId);\n        long back = policy.refundPaise(b, clock.nowMs());        // decided before the seats move\n        b.show.cancel(b);                                        // under the lock: on sale again immediately\n        if (back &gt; 0) pay.refund(b.paymentRef, back);            // outside the lock: a slow refund holds no seat\n        return back;\n    }\n}\n\n// ---- ext: a cap per user -- one script must not hold the whole house\n/**\n * At most N seats per user per show, counting only what they hold or bought RIGHT NOW: a lapsed hold, a\n * release and a cancel give the quota back by themselves. One user&#x27;s requests queue on a small per-user\n * lock, so two threads of one script can never both see &quot;one seat left&quot;. The order is always the user&#x27;s\n * lock, then the show&#x27;s lock inside svc.hold, so the two can never deadlock.\n */\nclass SeatCap {\n    private final int maxPerUser;\n    private final Clock clock;\n    private final ConcurrentHashMap&lt;String, List&lt;Booking&gt;&gt; byUser = new ConcurrentHashMap&lt;&gt;();   // &quot;show/user&quot; -&gt; bookings\n    SeatCap(int maxPerUser, Clock clock) { this.maxPerUser = maxPerUser; this.clock = clock; }\n    /** Hold through the cap. Throws SeatUnavailable when this user is already at their limit for this show. */\n    Booking hold(BookingService svc, String showId, String userId, List&lt;String&gt; seatIds) {\n        List&lt;Booking&gt; mine = byUser.computeIfAbsent(showId + &quot;/&quot; + userId, k -&gt; new ArrayList&lt;&gt;());\n        synchronized (mine) {                                     // count and hold are one step for this user\n            if (live(mine) + seatIds.size() &gt; maxPerUser)\n                throw new SeatUnavailable(userId + &quot; is at the limit of &quot; + maxPerUser + &quot; seats for &quot; + showId);\n            Booking b = svc.hold(showId, userId, seatIds);\n            mine.add(b);\n            return b;\n        }\n    }\n    /** How many seats this user holds or bought right now, for the message the app shows them. */\n    int used(String showId, String userId) {\n        List&lt;Booking&gt; mine = byUser.get(showId + &quot;/&quot; + userId);\n        if (mine == null) return 0;\n        synchronized (mine) { return live(mine); }\n    }\n    private int live(List&lt;Booking&gt; mine) {\n        long now = clock.nowMs(); int n = 0;\n        for (Booking b : mine)\n            if (b.status == BookingStatus.CONFIRMED || (b.status == BookingStatus.PENDING &amp;&amp; b.holdExpiresMs &gt; now)) n += b.seats.size();\n        return n;\n    }\n}\n\n// ---- ext: per-seat compare-and-set instead of the show lock -- more concurrency, real rollback\n/** One seat claimed without any lock: the holder is swapped from null to a booking id in one hardware step. */\nclass CasSeat {\n    final String id;\n    private final AtomicReference&lt;String&gt; holder = new AtomicReference&lt;&gt;();\n    CasSeat(String id) { this.id = id; }\n    boolean tryHold(String bookingId) { return holder.compareAndSet(null, bookingId); }   // exactly one caller wins\n    void release(String bookingId) { holder.compareAndSet(bookingId, null); }             // never drop somebody else&#x27;s hold\n    String holder() { return holder.get(); }\n}\n/**\n * The lock-free version of a group hold: take the seats one at a time, in seat-id order, and on the first\n * refusal give back everything already taken. The fixed order means two groups asking for the same seats\n * cannot each take one and both give up. More concurrency than one lock; the rollback is the price.\n */\nclass CasShow {\n    private final Map&lt;String, CasSeat&gt; seats = new LinkedHashMap&lt;&gt;();\n    void add(CasSeat s) { seats.put(s.id, s); }\n    List&lt;CasSeat&gt; hold(List&lt;String&gt; ids, String bookingId) {\n        List&lt;CasSeat&gt; got = new ArrayList&lt;&gt;();\n        for (String id : new TreeSet&lt;&gt;(ids)) {                                  // one fixed order for every caller\n            CasSeat s = seats.get(id);\n            if (s != null &amp;&amp; s.tryHold(bookingId)) { got.add(s); continue; }\n            for (CasSeat back : got) back.release(bookingId);                 // all-or-nothing, by hand\n            return List.of();\n        }\n        return got;\n    }\n}\n// Once there are four app servers, no JVM lock and no AtomicReference helps: the hold must live outside the\n// process. SET seatKey bookingId NX PX 300000 is this same compare-and-set, and releasing it is a\n// compare-and-delete so one server can never drop another server&#x27;s hold. A group needs all its keys in one\n// step: one Lua script (a small program Redis runs without interruption) checks every key, then sets them all.\n\n/** Runs every extension once so the reference code on page 05 is code that actually executed. */\nclass ExtDemo {\n    static Screen smallScreen() {\n        List&lt;Seat&gt; seats = new ArrayList&lt;&gt;();\n        for (int i = 1; i &lt;= 4; i++) seats.add(new Seat(&quot;A&quot;, i, SeatClass.SILVER));\n        for (int i = 1; i &lt;= 4; i++) seats.add(new Seat(&quot;B&quot;, i, SeatClass.GOLD));\n        return new Screen(&quot;EXT-1&quot;, seats);\n    }\n    public static void main(String[] args) throws Exception {\n        long[] now = { Instant.parse(&quot;2026-09-15T12:00:00Z&quot;).toEpochMilli() };\n        Clock clock = () -&gt; now[0];\n        long hold = 60_000L;\n        Screen sc = smallScreen();\n        Theatre forum = new Theatre(&quot;FORUM&quot;, &quot;Bengaluru&quot;, List.of(sc));\n        Show six  = new Show(&quot;X-6PM&quot;, &quot;Dune&quot;, sc, Instant.parse(&quot;2026-09-15T18:00:00Z&quot;).toEpochMilli(), clock, hold);\n        Show nine = new Show(&quot;X-9PM&quot;, &quot;Dune&quot;, sc, Instant.parse(&quot;2026-09-15T21:00:00Z&quot;).toEpochMilli(), clock, hold);\n        BookingService svc = new BookingService();\n        svc.addShow(six); svc.addShow(nine);\n\n        // search across shows: an index hop and a range read, no lock taken\n        ShowIndex index = new ShowIndex(); index.add(forum, six); index.add(forum, nine);\n        long dayStart = Instant.parse(&quot;2026-09-15T00:00:00Z&quot;).toEpochMilli();\n        System.out.println(&quot;search Bengaluru/Dune today: &quot; + index.search(&quot;Bengaluru&quot;, &quot;Dune&quot;, dayStart, dayStart + 86_400_000L).size()\n            + &quot; shows, cinemas &quot; + index.cinemas(&quot;Bengaluru&quot;, &quot;Dune&quot;, dayStart, dayStart + 86_400_000L));\n\n        // sweeper: a lapsed hold is already free, the sweep only tidies the count\n        Booking abandoned = svc.hold(&quot;X-6PM&quot;, &quot;ghost&quot;, List.of(&quot;A1&quot;));\n        now[0] += hold + 1;\n        HoldSweeper sweeper = new HoldSweeper(List.of(six, nine));\n        System.out.println(&quot;before the sweep A1 shows as &quot; + six.statusOf(&quot;A1&quot;) + &quot;; the sweep reclaimed &quot; + sweeper.sweepOnce() + &quot; hold, booking is &quot; + abandoned.status);\n\n        // dynamic pricing and a coupon stack on the flat rule\n        PricingRule demand = new CouponPricing(new DemandPricing(new ClassPricing()), 10);\n        System.out.println(&quot;gold, empty show, 10% coupon = &quot; + demand.pricePaise(six, sc.seats.get(4)) + &quot; paise&quot;);\n        svc.hold(&quot;X-6PM&quot;, &quot;a&quot;, List.of(&quot;B1&quot;, &quot;B2&quot;));\n        System.out.println(&quot;gold, half the class held, same coupon = &quot; + demand.pricePaise(six, sc.seats.get(6)) + &quot; paise&quot;);\n\n        // a waitlist hands a returned seat to whoever was first\n        Waitlist wl = new Waitlist();\n        wl.join(nine, SeatClass.GOLD, &quot;priya&quot;);\n        Booking offered = wl.offer(svc, nine, SeatClass.GOLD, &quot;B4&quot;);\n        System.out.println(&quot;waitlist: &quot; + (offered == null ? &quot;nobody waiting&quot; : offered.userId + &quot; now holds &quot; + offered.seatIds()) + &quot;; queue left = &quot; + wl.size(nine, SeatClass.GOLD));\n\n        // the database&#x27;s compare-and-set: fifty threads, one row, one winner; a group is all or nothing\n        ConditionalRowStore db = new ConditionalRowStore(); db.put(&quot;X-6PM&quot;, &quot;A9&quot;); db.put(&quot;X-6PM&quot;, &quot;A8&quot;);\n        ExecutorService pool = Executors.newFixedThreadPool(50);\n        CountDownLatch go = new CountDownLatch(1); AtomicInteger wins = new AtomicInteger();\n        for (int i = 0; i &lt; 50; i++) { String bk = &quot;BK-&quot; + i; pool.submit(() -&gt; { go.await(); if (db.claimAll(&quot;X-6PM&quot;, List.of(&quot;A9&quot;), bk, now[0] + hold, now[0])) wins.incrementAndGet(); return null; }); }\n        go.countDown(); pool.shutdown(); pool.awaitTermination(5, TimeUnit.SECONDS);\n        System.out.println(&quot;conditional UPDATE race: 50 claims on one row, winners = &quot; + wins.get() + &quot;, row = &quot; + db.status(&quot;X-6PM&quot;, &quot;A9&quot;));\n        if (wins.get() != 1) throw new AssertionError(&quot;two rows claimed&quot;);\n        System.out.println(&quot;group A8+A9 when A9 is taken: &quot; + db.claimAll(&quot;X-6PM&quot;, List.of(&quot;A8&quot;, &quot;A9&quot;), &quot;BK-g&quot;, now[0] + hold, now[0]) + &quot;, A8 = &quot; + db.status(&quot;X-6PM&quot;, &quot;A8&quot;));\n\n        // the webhook: the gateway reports one payment three times, the seat is sold once\n        Booking b = svc.hold(&quot;X-9PM&quot;, &quot;asha&quot;, List.of(&quot;A2&quot;));\n        PaymentProcessor upi = new UpiPayment();\n        String ref = upi.charge(b.id, b.amountPaise);                              // the user paid on the gateway&#x27;s page\n        PaymentWebhook hook = new PaymentWebhook(svc);\n        for (int i = 0; i &lt; 3; i++) hook.onPaymentCaptured(b.id, ref, upi);\n        System.out.println(&quot;three webhook calls: commits = &quot; + hook.commits.get() + &quot;, booking &quot; + b.id + &quot; is &quot; + b.status);\n\n        // a gateway that times out: nothing confirmed, nothing released, then reconciled from the gateway by key\n        Booking t = svc.hold(&quot;X-9PM&quot;, &quot;nikhil&quot;, List.of(&quot;A3&quot;));\n        Map&lt;String, String&gt; gatewayBook = new ConcurrentHashMap&lt;&gt;();                // what the gateway really did, by key\n        PaymentProcessor timingOut = new PaymentProcessor() {\n            public String charge(String key, long paise) { gatewayBook.put(key, &quot;REF-TIMEOUT&quot;); throw new PaymentUnknown(&quot;read timeout after 30 s&quot;); }\n            public void refund(String ref, long paise) { }\n        };\n        ReconcilingConfirm rec = new ReconcilingConfirm(svc, gatewayBook::get);\n        Booking afterTimeout = rec.confirm(t.id, timingOut);\n        System.out.println(&quot;after the timeout: booking is &quot; + t.status + &quot;, seat A3 is &quot; + nine.statusOf(&quot;A3&quot;) + &quot;, returned &quot; + afterTimeout);\n        System.out.println(&quot;after settle: booking is &quot; + (rec.settle(t.id, timingOut) == null ? &quot;not confirmed&quot; : t.status) + &quot;, seat A3 is &quot; + nine.statusOf(&quot;A3&quot;));\n\n        // a cancel an hour before the show: the seat comes back in full, the money by the policy\n        Booking c = svc.hold(&quot;X-6PM&quot;, &quot;divya&quot;, List.of(&quot;B3&quot;));\n        PaymentProcessor card = new CardPayment();\n        svc.confirm(c.id, card);\n        now[0] = six.startMs - 60 * 60_000L;                                   // one hour before the 6pm show\n        CancelWithRefund desk = new CancelWithRefund(svc, new TieredRefund(), clock);\n        System.out.println(&quot;cancel one hour before a &quot; + c.amountPaise + &quot; paise booking: &quot; + desk.cancel(c.id, card)\n            + &quot; paise back, seat B3 is &quot; + six.statusOf(&quot;B3&quot;));\n\n        // one script, one user, a cap of three: counted live, so a lapsed hold gives the quota back\n        SeatCap cap = new SeatCap(3, clock);\n        int got = 0;\n        for (String sid : List.of(&quot;A1&quot;, &quot;A2&quot;, &quot;A4&quot;, &quot;B1&quot;, &quot;B2&quot;)) {\n            try { cap.hold(svc, &quot;X-9PM&quot;, &quot;bot&quot;, List.of(sid)); got++; } catch (SeatUnavailable e) { /* at the limit */ }\n        }\n        System.out.println(&quot;a bot asking for five seats with a cap of three got &quot; + got + &quot; (quota used &quot; + cap.used(&quot;X-9PM&quot;, &quot;bot&quot;) + &quot;)&quot;);\n        now[0] += hold + 1;                                                     // its holds lapse\n        System.out.println(&quot;after its holds lapse the quota used is &quot; + cap.used(&quot;X-9PM&quot;, &quot;bot&quot;));\n\n        // the lock-free alternative, with its rollback\n        CasShow cas = new CasShow(); cas.add(new CasSeat(&quot;C1&quot;)); cas.add(new CasSeat(&quot;C2&quot;));\n        System.out.println(&quot;CAS hold of C1+C2: &quot; + cas.hold(List.of(&quot;C1&quot;, &quot;C2&quot;), &quot;BK-a&quot;).size() + &quot; seats&quot;);\n        System.out.println(&quot;a second group asking for C2+C1 gets: &quot; + cas.hold(List.of(&quot;C2&quot;, &quot;C1&quot;), &quot;BK-b&quot;).size() + &quot; seats (it tried C1 first and took nothing)&quot;);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.time.*;\n\n/**\n * One test per claim the design makes. Each one is the bug that happens if the claim is dropped, so a\n * regression shows up as a FAIL line rather than as a customer with two tickets for seat B4.\n */\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n\n    /**\n     * A gateway that keeps the idempotency contract and counts what it did, so a test can assert &quot;charged\n     * exactly once&quot;: charges counts money actually taken, refunds counts references actually given back.\n     */\n    static class CountingGateway implements PaymentProcessor {\n        final AtomicInteger charges = new AtomicInteger(), refunds = new AtomicInteger();\n        private final Map&lt;String, String&gt; byKey = new ConcurrentHashMap&lt;&gt;();\n        private final Set&lt;String&gt; refunded = ConcurrentHashMap.newKeySet();\n        private final boolean approve;\n        CountingGateway(boolean approve) { this.approve = approve; }\n        public String charge(String key, long paise) {\n            if (!approve) return null;\n            return byKey.computeIfAbsent(key, k -&gt; &quot;REF-&quot; + charges.incrementAndGet());   // one charge per key\n        }\n        public void refund(String ref, long paise) { if (refunded.add(ref)) refunds.incrementAndGet(); }\n        /** What the gateway did under a key: its answer to &quot;did that charge happen?&quot; */\n        String refFor(String key) { return byKey.get(key); }\n    }\n\n    static long[] now = { Instant.parse(&quot;2026-09-15T12:00:00Z&quot;).toEpochMilli() };\n    static final long HOLD = 5 * 60_000L;\n    static Screen screen() {\n        List&lt;Seat&gt; seats = new ArrayList&lt;&gt;();\n        for (int i = 1; i &lt;= 6; i++) seats.add(new Seat(&quot;B&quot;, i, SeatClass.GOLD));\n        for (int i = 1; i &lt;= 2; i++) seats.add(new Seat(&quot;C&quot;, i, SeatClass.PLATINUM));\n        return new Screen(&quot;T-1&quot;, seats);\n    }\n\n    public static void main(String[] args) throws Exception {\n        Clock clock = () -&gt; now[0];\n        Screen sc = screen();\n        Show six  = new Show(&quot;SIX&quot;,  &quot;Interstellar&quot;, sc, Instant.parse(&quot;2026-09-15T18:00:00Z&quot;).toEpochMilli(), clock, HOLD);\n        Show nine = new Show(&quot;NINE&quot;, &quot;Interstellar&quot;, sc, Instant.parse(&quot;2026-09-15T21:00:00Z&quot;).toEpochMilli(), clock, HOLD);\n        BookingService svc = new BookingService();\n        svc.configure(new ClassPricing(), new AdjacentSeats());\n        svc.addShow(six); svc.addShow(nine);\n\n        // 1. fifty phones, one seat, one latch: exactly one hold\n        ExecutorService pool = Executors.newFixedThreadPool(50);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;Booking&gt;&gt; tries = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            String u = &quot;fan-&quot; + i;\n            tries.add(pool.submit(() -&gt; { go.await(); return svc.hold(&quot;SIX&quot;, u, List.of(&quot;C1&quot;)); }));\n        }\n        go.countDown();\n        int wins = 0;\n        for (Future&lt;Booking&gt; f : tries) { try { f.get(); wins++; } catch (ExecutionException e) { /* SeatUnavailable */ } }\n        pool.shutdown();\n        check(wins == 1, &quot;fifty threads on one seat: exactly one hold (&quot; + wins + &quot;)&quot;);\n        check(six.statusOf(&quot;C1&quot;) == SeatStatus.HELD, &quot;the seat is HELD, not sold and not free&quot;);\n        check(six.freeCount(SeatClass.PLATINUM) == 1, &quot;one platinum seat left of two&quot;);\n\n        // 2. the card is declined: nothing is released, the seat comes back only when the hold lapses\n        Booking b2 = svc.hold(&quot;SIX&quot;, &quot;raj&quot;, List.of(&quot;B1&quot;));\n        CountingGateway no = new CountingGateway(false);\n        try { svc.confirm(b2.id, no); check(false, &quot;a declined card must throw&quot;); }\n        catch (PaymentDeclined e) { check(true, &quot;a declined card throws: &quot; + e.getMessage()); }\n        check(six.statusOf(&quot;B1&quot;) == SeatStatus.HELD &amp;&amp; b2.status == BookingStatus.PENDING,\n              &quot;after the decline the seat is still HELD and the booking still PENDING&quot;);\n        check(no.refunds.get() == 0, &quot;nothing was refunded: nothing was taken&quot;);\n        now[0] += HOLD - 1;\n        check(six.statusOf(&quot;B1&quot;) == SeatStatus.HELD, &quot;one millisecond before five minutes the hold is still alive&quot;);\n        now[0] += 1;\n        check(six.statusOf(&quot;B1&quot;) == SeatStatus.AVAILABLE, &quot;at exactly five minutes the hold is dead and the seat reads free, with no sweeper&quot;);\n        Booking b2b = svc.hold(&quot;SIX&quot;, &quot;sara&quot;, List.of(&quot;B1&quot;));\n        check(b2b.status == BookingStatus.PENDING &amp;&amp; b2.status == BookingStatus.EXPIRED,\n              &quot;the next user gets it; the dead booking is EXPIRED&quot;);\n        svc.release(b2b.id);\n\n        // 3. the gateway is slower than the hold: confirm is refused and the money is given back\n        Booking b3 = svc.hold(&quot;SIX&quot;, &quot;asha&quot;, List.of(&quot;B2&quot;));\n        CountingGateway slow = new CountingGateway(true) {\n            public String charge(String key, long paise) { now[0] += HOLD + 1; return super.charge(key, paise); }   // the round trip outlived the hold\n        };\n        try { svc.confirm(b3.id, slow); check(false, &quot;confirm after the hold expired must throw&quot;); }\n        catch (HoldLapsed e) { check(true, &quot;confirm after expiry is refused: &quot; + e.getMessage()); }\n        check(slow.charges.get() == 1 &amp;&amp; slow.refunds.get() == 1, &quot;the card was charged once and refunded once&quot;);\n        check(six.statusOf(&quot;B2&quot;) == SeatStatus.AVAILABLE &amp;&amp; b3.status == BookingStatus.EXPIRED,\n              &quot;the seat is on sale again and the booking is EXPIRED, not SOLD&quot;);\n\n        // 4. a second confirm sells nothing twice and charges nothing twice\n        Booking b4 = svc.hold(&quot;SIX&quot;, &quot;meena&quot;, List.of(&quot;B3&quot;));\n        CountingGateway once = new CountingGateway(true);\n        svc.confirm(b4.id, once);\n        check(six.statusOf(&quot;B3&quot;) == SeatStatus.SOLD &amp;&amp; b4.status == BookingStatus.CONFIRMED,\n              &quot;the first confirm sells the seat&quot;);\n        try { svc.confirm(b4.id, once); check(false, &quot;a second confirm must be refused&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;a second confirm is refused: &quot; + e.getMessage()); }\n        check(once.charges.get() == 1, &quot;the card was charged exactly once&quot;);\n        check(six.freeCount(SeatClass.GOLD) == 5, &quot;one gold seat sold, five free&quot;);\n\n        // 5. cancelling a confirmed booking gives the seat back and refunds once\n        svc.cancel(b4.id, once);\n        check(six.statusOf(&quot;B3&quot;) == SeatStatus.AVAILABLE &amp;&amp; b4.status == BookingStatus.CANCELLED,\n              &quot;cancel returns the seat to AVAILABLE&quot;);\n        check(once.refunds.get() == 1 &amp;&amp; six.freeCount(SeatClass.GOLD) == 6, &quot;refunded once and the count is back to six&quot;);\n\n        // 6. a listener that throws must not break the booking\n        svc.addObserver((event, b) -&gt; { throw new RuntimeException(&quot;sms gateway is down&quot;); });\n        Analytics analytics = new Analytics();\n        svc.addObserver(analytics);\n        Booking b6 = svc.hold(&quot;SIX&quot;, &quot;vikram&quot;, List.of(&quot;B4&quot;));\n        svc.confirm(b6.id, new CountingGateway(true));\n        check(b6.status == BookingStatus.CONFIRMED &amp;&amp; six.statusOf(&quot;B4&quot;) == SeatStatus.SOLD,\n              &quot;the booking confirms although the first listener threw&quot;);\n        check(analytics.counts.getOrDefault(&quot;CONFIRMED&quot;, 0) == 1, &quot;the listener after the broken one still heard it&quot;);\n\n        // 7. three seats together, when no three are together: nothing is held\n        Booking b7 = svc.hold(&quot;NINE&quot;, &quot;x&quot;, List.of(&quot;B2&quot;, &quot;B5&quot;));          // gold left free: B1, B3, B4, B6 -- B3+B4 is a run of two\n        svc.confirm(b7.id, new CountingGateway(true));\n        int freeBefore = nine.freeCount(SeatClass.GOLD);\n        try { svc.holdBest(&quot;NINE&quot;, &quot;family&quot;, SeatClass.GOLD, 3); check(false, &quot;an impossible adjacent request must throw&quot;); }\n        catch (SeatUnavailable e) { check(true, &quot;no run of three: &quot; + e.getMessage()); }\n        check(nine.freeCount(SeatClass.GOLD) == freeBefore, &quot;the failed request held nothing (&quot; + freeBefore + &quot; still free)&quot;);\n        for (String id : List.of(&quot;B1&quot;, &quot;B3&quot;, &quot;B4&quot;, &quot;B6&quot;)) check(nine.statusOf(id) == SeatStatus.AVAILABLE, &quot;seat &quot; + id + &quot; untouched by the failed request&quot;);\n        Booking b7b = svc.holdBest(&quot;NINE&quot;, &quot;couple&quot;, SeatClass.GOLD, 2);\n        check(b7b.seatIds().equals(List.of(&quot;B3&quot;, &quot;B4&quot;)), &quot;a run of two is found and taken together: &quot; + b7b.seatIds());\n\n        // 8. the headline: a chair sold at 6pm is still free at 9pm\n        svc.release(b7b.id);\n        check(six.statusOf(&quot;B4&quot;) == SeatStatus.SOLD &amp;&amp; nine.statusOf(&quot;B4&quot;) == SeatStatus.AVAILABLE,\n              &quot;the same chair is SOLD at 6pm and AVAILABLE at 9pm&quot;);\n\n        // 9. a cap per user: one script asking for the whole house gets exactly its quota, and gets it back\n        Show capShow = new Show(&quot;CAP&quot;, &quot;Interstellar&quot;, sc, Instant.parse(&quot;2026-09-15T15:00:00Z&quot;).toEpochMilli(), clock, HOLD);\n        svc.addShow(capShow);\n        SeatCap cap = new SeatCap(3, clock);\n        ExecutorService botPool = Executors.newFixedThreadPool(8);\n        CountDownLatch botGo = new CountDownLatch(1);\n        List&lt;Future&lt;Booking&gt;&gt; botTries = new ArrayList&lt;&gt;();\n        for (String sid : List.of(&quot;B1&quot;, &quot;B2&quot;, &quot;B3&quot;, &quot;B4&quot;, &quot;B5&quot;, &quot;B6&quot;, &quot;C1&quot;, &quot;C2&quot;))\n            botTries.add(botPool.submit(() -&gt; { botGo.await(); return cap.hold(svc, &quot;CAP&quot;, &quot;bot&quot;, List.of(sid)); }));\n        botGo.countDown();\n        int botWins = 0;\n        for (Future&lt;Booking&gt; f : botTries) { try { f.get(); botWins++; } catch (ExecutionException e) { /* at the limit */ } }\n        botPool.shutdown();\n        check(botWins == 3, &quot;eight threads for one user with a cap of three: exactly three holds (&quot; + botWins + &quot;)&quot;);\n        check(cap.used(&quot;CAP&quot;, &quot;bot&quot;) == 3, &quot;the quota counter agrees with the seats actually held&quot;);\n        now[0] += HOLD + 1;                                              // the script walks away; its holds lapse\n        boolean again;\n        try { cap.hold(svc, &quot;CAP&quot;, &quot;bot&quot;, List.of(&quot;B1&quot;)); again = true; } catch (SeatUnavailable e) { again = false; }\n        check(again &amp;&amp; cap.used(&quot;CAP&quot;, &quot;bot&quot;) == 1, &quot;when its holds lapse, the quota comes back by itself&quot;);\n\n        // 10. the gateway times out: nothing confirmed, nothing released, then settled from the gateway\n        Booking b10 = svc.hold(&quot;NINE&quot;, &quot;nikhil&quot;, List.of(&quot;C1&quot;));\n        CountingGateway timingOut = new CountingGateway(true) {\n            public String charge(String key, long paise) { super.charge(key, paise); throw new PaymentUnknown(&quot;read timeout after 30 s&quot;); }\n        };\n        ReconcilingConfirm rec = new ReconcilingConfirm(svc, timingOut::refFor);\n        check(rec.confirm(b10.id, timingOut) == null, &quot;a timeout confirms nothing and throws nothing at the caller&quot;);\n        check(b10.status == BookingStatus.PENDING &amp;&amp; nine.statusOf(&quot;C1&quot;) == SeatStatus.HELD,\n              &quot;after the timeout the booking is still PENDING and the seat still HELD&quot;);\n        check(timingOut.refunds.get() == 0, &quot;nothing was refunded while the outcome was unknown&quot;);\n        check(rec.settle(b10.id, timingOut) != null &amp;&amp; b10.status == BookingStatus.CONFIRMED,\n              &quot;settle asks the gateway by the booking id, finds the charge and finishes the booking&quot;);\n        check(timingOut.charges.get() == 1 &amp;&amp; nine.statusOf(&quot;C1&quot;) == SeatStatus.SOLD, &quot;the card was charged exactly once&quot;);\n\n        // the same timeout, but the hold dies before anybody settles: the money comes back, the seat goes on sale\n        Booking b10b = svc.hold(&quot;NINE&quot;, &quot;ira&quot;, List.of(&quot;C2&quot;));\n        CountingGateway timingOut2 = new CountingGateway(true) {\n            public String charge(String key, long paise) { super.charge(key, paise); throw new PaymentUnknown(&quot;read timeout after 30 s&quot;); }\n        };\n        ReconcilingConfirm rec2 = new ReconcilingConfirm(svc, timingOut2::refFor);\n        rec2.confirm(b10b.id, timingOut2);\n        now[0] += HOLD + 1;                                              // nobody settled in time\n        check(rec2.settle(b10b.id, timingOut2) == null, &quot;settling after the hold died confirms nothing&quot;);\n        check(timingOut2.refunds.get() == 1 &amp;&amp; nine.statusOf(&quot;C2&quot;) == SeatStatus.AVAILABLE &amp;&amp; b10b.status == BookingStatus.EXPIRED,\n              &quot;the money is refunded, the seat is back on sale and the booking is EXPIRED&quot;);\n\n        // 11. cancelling: the seat always comes back, the money follows the refund policy\n        CountingGateway desk = new CountingGateway(true);\n        CancelWithRefund cancelDesk = new CancelWithRefund(svc, new TieredRefund(), clock);\n        Booking full = svc.hold(&quot;SIX&quot;, &quot;ganesh&quot;, List.of(&quot;B5&quot;));\n        svc.confirm(full.id, desk);\n        now[0] = six.startMs - 180 * 60_000L;                            // three hours before the show\n        check(cancelDesk.cancel(full.id, desk) == full.amountPaise, &quot;three hours before the show: all &quot; + full.amountPaise + &quot; paise back&quot;);\n        Booking half = svc.hold(&quot;SIX&quot;, &quot;hema&quot;, List.of(&quot;B6&quot;));\n        svc.confirm(half.id, desk);\n        now[0] = six.startMs - 45 * 60_000L;                             // forty-five minutes before\n        check(cancelDesk.cancel(half.id, desk) == half.amountPaise / 2, &quot;forty-five minutes before: half the money back&quot;);\n        Booking late = svc.hold(&quot;SIX&quot;, &quot;ivan&quot;, List.of(&quot;B1&quot;));\n        svc.confirm(late.id, desk);\n        now[0] = six.startMs + 10 * 60_000L;                             // ten minutes after it started\n        check(cancelDesk.cancel(late.id, desk) == 0, &quot;after the show started: no money back&quot;);\n        check(six.statusOf(&quot;B1&quot;) == SeatStatus.AVAILABLE &amp;&amp; late.status == BookingStatus.CANCELLED,\n              &quot;the seat still goes back on sale even when the refund is nothing&quot;);\n        check(desk.refunds.get() == 2, &quot;two of the three cancels sent money, and each sent it once&quot;);\n\n        // 12. the booking id is the idempotency key: a retry after a timeout, or two taps at once, is charged once\n        Show pay = new Show(&quot;PAY&quot;, &quot;Interstellar&quot;, sc, Instant.parse(&quot;2026-09-16T18:00:00Z&quot;).toEpochMilli(), clock, HOLD);\n        svc.addShow(pay);\n        Booking t1 = svc.hold(&quot;PAY&quot;, &quot;tara&quot;, List.of(&quot;B1&quot;));\n        CountingGateway flaky = new CountingGateway(true) {\n            boolean first = true;\n            public String charge(String key, long paise) {\n                String r = super.charge(key, paise);\n                if (first) { first = false; throw new PaymentUnknown(&quot;timeout after the money moved&quot;); }\n                return r;\n            }\n        };\n        try { svc.confirm(t1.id, flaky); } catch (PaymentUnknown e) { /* the app says &quot;something went wrong&quot;; the user taps Pay again */ }\n        svc.confirm(t1.id, flaky);\n        check(t1.status == BookingStatus.CONFIRMED &amp;&amp; flaky.charges.get() == 1 &amp;&amp; flaky.refunds.get() == 0,\n              &quot;a timeout, then Pay again: charged once, not twice (&quot; + flaky.charges.get() + &quot;)&quot;);\n        Booking t2 = svc.hold(&quot;PAY&quot;, &quot;uma&quot;, List.of(&quot;B2&quot;));\n        CyclicBarrier bothIn = new CyclicBarrier(2);\n        CountingGateway meeting = new CountingGateway(true) {\n            public String charge(String key, long paise) {\n                try { bothIn.await(2, TimeUnit.SECONDS); } catch (Exception e) { throw new IllegalStateException(e); }   // both taps inside at once\n                return super.charge(key, paise);\n            }\n        };\n        ExecutorService taps = Executors.newFixedThreadPool(2);\n        Future&lt;Booking&gt; tapA = taps.submit(() -&gt; svc.confirm(t2.id, meeting));\n        Future&lt;Booking&gt; tapB = taps.submit(() -&gt; svc.confirm(t2.id, meeting));\n        try { tapA.get(); tapB.get(); } catch (ExecutionException e) { check(false, &quot;a tap failed: &quot; + e.getCause()); }\n        taps.shutdown();\n        check(t2.status == BookingStatus.CONFIRMED &amp;&amp; meeting.charges.get() == 1 &amp;&amp; meeting.refunds.get() == 0,\n              &quot;two taps on Pay at the same instant: one charge, nothing to refund (&quot; + meeting.charges.get() + &quot; charges)&quot;);\n\n        // 13. the webhook reports one payment three times: the seats are sold once and nothing is refunded\n        Booking w = svc.hold(&quot;PAY&quot;, &quot;wen&quot;, List.of(&quot;B3&quot;));\n        CountingGateway gw = new CountingGateway(true);\n        String paid = gw.charge(w.id, w.amountPaise);                   // the user paid on the gateway&#x27;s page\n        PaymentWebhook hook = new PaymentWebhook(svc);\n        for (int i = 0; i &lt; 3; i++) hook.onPaymentCaptured(w.id, paid, gw);\n        check(hook.commits.get() == 1 &amp;&amp; w.status == BookingStatus.CONFIRMED &amp;&amp; gw.refunds.get() == 0,\n              &quot;one payment reported three times: sold once, nothing refunded&quot;);\n\n        // 14. a late release of a CONFIRMED booking changes nothing and tells nobody it expired\n        Analytics heard = new Analytics();\n        svc.addObserver(heard);\n        Booking r = svc.hold(&quot;PAY&quot;, &quot;vera&quot;, List.of(&quot;B4&quot;));\n        svc.confirm(r.id, new CountingGateway(true));\n        svc.release(r.id);                                               // &quot;the user closed the tab&quot;, arriving after the payment\n        check(r.status == BookingStatus.CONFIRMED &amp;&amp; pay.statusOf(&quot;B4&quot;) == SeatStatus.SOLD &amp;&amp; heard.counts.getOrDefault(&quot;EXPIRED&quot;, 0) == 0,\n              &quot;a late release of a confirmed booking changes nothing and sends no EXPIRED message&quot;);\n\n        // 15. edges: an empty request, zero seats, a coupon over 100%, the weekend in the theatre&#x27;s own time zone\n        int goldBefore = pay.freeCount(SeatClass.GOLD);\n        try { svc.hold(&quot;PAY&quot;, &quot;zed&quot;, List.of()); check(false, &quot;an empty hold must throw&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;an empty hold is refused: &quot; + e.getMessage()); }\n        try { svc.holdBest(&quot;PAY&quot;, &quot;zed&quot;, SeatClass.GOLD, 0); check(false, &quot;a hold of zero seats must throw&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;a hold of zero seats is refused: &quot; + e.getMessage()); }\n        check(pay.freeCount(SeatClass.GOLD) == goldBefore, &quot;neither left a booking or moved a seat&quot;);\n        try { new CouponPricing(new ClassPricing(), 150); check(false, &quot;a coupon over 100% must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;a coupon over 100% is refused, so no price goes negative&quot;); }\n        Show lateFriday = new Show(&quot;FRI&quot;, &quot;Interstellar&quot;, sc, Instant.parse(&quot;2026-09-18T19:30:00Z&quot;).toEpochMilli(), clock, HOLD);  // Sat 01:00 in Bengaluru\n        PricingRule surge = new WeekendSurgePricing(new ClassPricing(), ZoneId.of(&quot;Asia/Kolkata&quot;), 150);\n        check(surge.pricePaise(lateFriday, sc.seats.get(0)) == 37_500 &amp;&amp; surge.pricePaise(six, sc.seats.get(0)) == 25_000,\n              &quot;1am Saturday in Bengaluru (still Friday in UTC) pays 1.5x: 37,500 paise; a Tuesday pays 25,000&quot;);\n\n        // 16. per-seat compare-and-set takes seats in one fixed order, so opposite-order groups cannot both give up\n        List&lt;String&gt; tried = new ArrayList&lt;&gt;();\n        CasShow cas = new CasShow();\n        for (String id : List.of(&quot;C1&quot;, &quot;C2&quot;)) cas.add(new CasSeat(id) { boolean tryHold(String bk) { tried.add(id); return super.tryHold(bk); } });\n        cas.hold(List.of(&quot;C2&quot;, &quot;C1&quot;), &quot;BK-x&quot;);\n        check(tried.equals(List.of(&quot;C1&quot;, &quot;C2&quot;)), &quot;a group asking for C2+C1 tries C1 first: &quot; + tried);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design the booking part of BookMyShow. A user picks a show, picks seats, gets a few minutes to pay, and the seats must not be sold to anybody else in the meantime. Two people will tap the same seat at the same moment. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions; then type in the order of Main.java: the enums (SeatClass, SeatStatus, BookingStatus), the catalog (Seat with no status, Screen, Theatre), ShowSeat and Booking, the three small exceptions, Clock, the four small interfaces with one implementation each, the Show with its map of seats, its lock and the hold / commit / release / cancel order, the BookingService that puts payment between the two locked halves, and a main with the fifty-thread race. If the clock runs out, the part that must exist is <code>Show.hold</code> and <code>Show.commit</code> under one lock, and a <code>confirm</code> that charges between them with the booking id as the key. The seat policy, cancel, the listeners and surge pricing come after.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Weekend surge, one and a half times, without touching Show or BookingService.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Price is already an interface, so surge is one new class that wraps the flat rule. It asks the flat rule for the price, looks at the day the <i>show</i> starts in the theatre's time zone, and charges 150 per cent on a Saturday or a Sunday. The percentage is an integer and the result is rounded down to the paisa, so no double ever touches money. Nothing else changes; the only edit is the <code>configure</code> line that hands the rule in. It reads the show's start time, not the wall clock, so a Tuesday booking for a Saturday show still pays the weekend price, and a test needs no clock. Demand pricing and coupons stack the same way, each wrapping the one below it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * 1.5x (150 per cent) when the SHOW starts on a Saturday or Sunday in the theatre&#x27;s time zone: a NEW rule\n * that wraps the one it is given (Decorator). Integer paise in, integer paise out: no double touches money.\n */\nclass WeekendSurgePricing implements PricingRule {\n    private final PricingRule base;\n    private final ZoneId zone;\n    private final int percent;                      // 150 = one and a half times\n    WeekendSurgePricing(PricingRule base, ZoneId zone, int percent) { this.base = base; this.zone = zone; this.percent = percent; }\n    public long pricePaise(Show show, Seat seat) {\n        DayOfWeek d = Instant.ofEpochMilli(show.startMs).atZone(zone).getDayOfWeek();\n        boolean weekend = (d == DayOfWeek.SATURDAY || d == DayOfWeek.SUNDAY);\n        long p = base.pricePaise(show, seat);\n        return weekend ? p * percent / 100 : p;     // rounds down to the paisa, in the customer&#x27;s favour\n    }\n}\n\n// ---- ext: dynamic pricing and coupons -- new rules behind the same one-method interface\n/** The price climbs as the class fills: full price when empty, up to 1.6x when sold out. Integer paise, rounded down. */\nclass DemandPricing implements PricingRule {\n    private final PricingRule base;\n    DemandPricing(PricingRule base) { this.base = base; }\n    public long pricePaise(Show show, Seat seat) {\n        int total = 0; for (Seat s : show.screen.seats) if (s.seatClass == seat.seatClass) total++;\n        if (total == 0) return base.pricePaise(show, seat);\n        long taken = total - show.freeCount(seat.seatClass);   // re-takes the show&#x27;s lock: a ReentrantLock lets its holder back in\n        return base.pricePaise(show, seat) * (100L * total + 60L * taken) / (100L * total);\n    }\n}\n/** A coupon takes a percentage off whatever the rule under it decided. Another Decorator, same interface. */\nclass CouponPricing implements PricingRule {\n    private final PricingRule base; private final int percentOff;\n    CouponPricing(PricingRule base, int percentOff) {\n        if (percentOff &lt; 0 || percentOff &gt; 100) throw new IllegalArgumentException(&quot;a coupon is 0 to 100 per cent off, not &quot; + percentOff);\n        this.base = base; this.percentOff = percentOff;\n    }\n    public long pricePaise(Show show, Seat seat) { return base.pricePaise(show, seat) * (100 - percentOff) / 100; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two phones tap seat B4 in the same millisecond. Prove only one of them gets it.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives in the gap between reading \"B4 is AVAILABLE\" and writing \"B4 is HELD\". <code>hold</code> does both inside one lock on the show, in two passes. Pass one checks every requested seat and touches nothing; pass two writes them all. No other phone can run in that gap, and a seat that fails in pass one means nothing was written. The proof: fifty threads wait behind one latch, the latch opens, all fifty ask for seat C1, and the test counts the bookings that came back. Exactly one; the other forty-nine get SeatUnavailable.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Hold named seats for a few minutes. Under the lock, in two passes: check every seat is free (a lapsed\n     * hold counts as free), then take them all. One bad seat means nothing was touched.\n     */\n    Booking hold(String userId, List&lt;String&gt; seatIds, PricingRule pricing) {\n        if (seatIds.isEmpty()) throw new IllegalArgumentException(&quot;ask for at least one seat&quot;);   // no empty, free booking\n        lock.lock();                                        // the whole check-then-take is ONE step: the race lives in the gap\n        try {\n            long now = clock.nowMs();                       // read inside the lock, so two callers cannot disagree about expiry\n            List&lt;ShowSeat&gt; want = new ArrayList&lt;&gt;(seatIds.size());\n            for (String sid : seatIds) {                    // pass one: look, do not touch\n                ShowSeat ss = seats.get(sid);\n                if (ss == null) throw new NoSuchElementException(&quot;no seat &quot; + sid + &quot; in show &quot; + id);\n                if (want.contains(ss)) throw new IllegalArgumentException(&quot;seat &quot; + sid + &quot; asked for twice&quot;);\n                if (!ss.freeAt(now)) throw new SeatUnavailable(&quot;seat &quot; + sid + &quot; is &quot; + ss.status);\n                want.add(ss);\n            }\n            for (ShowSeat ss : want) reclaimIfLapsed(ss, now);   // pass two: tidy away any dead hold, then take them all\n            return takeAll(userId, want, pricing, now);\n        } finally { lock.unlock(); }\n    }\n\n        // 1. fifty phones, one seat, one latch: exactly one hold\n        ExecutorService pool = Executors.newFixedThreadPool(50);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;Booking&gt;&gt; tries = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            String u = &quot;fan-&quot; + i;\n            tries.add(pool.submit(() -&gt; { go.await(); return svc.hold(&quot;SIX&quot;, u, List.of(&quot;C1&quot;)); }));\n        }\n        go.countDown();\n        int wins = 0;\n        for (Future&lt;Booking&gt; f : tries) { try { f.get(); wins++; } catch (ExecutionException e) { /* SeatUnavailable */ } }\n        pool.shutdown();\n        check(wins == 1, &quot;fifty threads on one seat: exactly one hold (&quot; + wins + &quot;)&quot;);\n        check(six.statusOf(&quot;C1&quot;) == SeatStatus.HELD, &quot;the seat is HELD, not sold and not free&quot;);\n        check(six.freeCount(SeatClass.PLATINUM) == 1, &quot;one platinum seat left of two&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock per show. Does that scale, or have you serialised the whole cinema?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Yes, holds on one show go one at a time; whether that matters is arithmetic, not opinion. The locked part of a three-seat hold is three map lookups, three status reads, three price lookups and nine field writes: about two microseconds. At two hundred hold attempts a second on a hot show, the lock is busy four hundred microseconds in every million, and two shows never share a lock. What would break it is the gateway: one and a half seconds inside the lock would drop the show to 0.67 bookings a second. The code below is the next rung: each seat is claimed by compare-and-set, always in seat-id order, and a refusal hands back the seats already taken. Without that fixed order, two groups asking for C1+C2 and C2+C1 can each take one seat and both give up.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: per-seat compare-and-set instead of the show lock -- more concurrency, real rollback\n/** One seat claimed without any lock: the holder is swapped from null to a booking id in one hardware step. */\nclass CasSeat {\n    final String id;\n    private final AtomicReference&lt;String&gt; holder = new AtomicReference&lt;&gt;();\n    CasSeat(String id) { this.id = id; }\n    boolean tryHold(String bookingId) { return holder.compareAndSet(null, bookingId); }   // exactly one caller wins\n    void release(String bookingId) { holder.compareAndSet(bookingId, null); }             // never drop somebody else&#x27;s hold\n    String holder() { return holder.get(); }\n}\n/**\n * The lock-free version of a group hold: take the seats one at a time, in seat-id order, and on the first\n * refusal give back everything already taken. The fixed order means two groups asking for the same seats\n * cannot each take one and both give up. More concurrency than one lock; the rollback is the price.\n */\nclass CasShow {\n    private final Map&lt;String, CasSeat&gt; seats = new LinkedHashMap&lt;&gt;();\n    void add(CasSeat s) { seats.put(s.id, s); }\n    List&lt;CasSeat&gt; hold(List&lt;String&gt; ids, String bookingId) {\n        List&lt;CasSeat&gt; got = new ArrayList&lt;&gt;();\n        for (String id : new TreeSet&lt;&gt;(ids)) {                                  // one fixed order for every caller\n            CasSeat s = seats.get(id);\n            if (s != null &amp;&amp; s.tryHold(bookingId)) { got.add(s); continue; }\n            for (CasSeat back : got) back.release(bookingId);                 // all-or-nothing, by hand\n            return List.of();\n        }\n        return got;\n    }\n}\n// Once there are four app servers, no JVM lock and no AtomicReference helps: the hold must live outside the\n// process. SET seatKey bookingId NX PX 300000 is this same compare-and-set, and releasing it is a\n// compare-and-delete so one server can never drop another server&#x27;s hold. A group needs all its keys in one\n// step: one Lua script (a small program Redis runs without interruption) checks every key, then sets them all.\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; The card is declined. What is the state of the system, and show me the code.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing is half done and nothing is released. <code>confirm</code> charges with no lock held; when the gateway returns null it throws, and the booking is still PENDING with its seats still HELD. The user can try another card against the same booking for the rest of the five minutes. If they walk away instead, nobody cleans up: the next person who asks for that seat finds a dead hold, reclaims it, marks the booking EXPIRED and takes the seat. The test declines a card and checks the seat is still HELD. Then it moves the clock: one millisecond before five minutes the seat is still held, and at five minutes exactly it is free.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Steps two and three: charge the card with NO lock held, then commit under the show&#x27;s lock, which\n     * re-checks the hold. The booking id is the idempotency key, so a retry or a double tap is charged once.\n     * A decline releases nothing; a lapsed hold refunds. Listeners hear after the lock.\n     */\n    Booking confirm(String bookingId, PaymentProcessor pay) {\n        Booking b = find(bookingId);\n        if (b.status != BookingStatus.PENDING)                                  // a confirm after the end is refused before any money moves\n            throw new IllegalStateException(&quot;booking &quot; + bookingId + &quot; is &quot; + b.status);\n        String ref = pay.charge(b.id, b.amountPaise);                           // OUTSIDE the lock: a gateway takes a second or two\n        if (ref == null) throw new PaymentDeclined(&quot;gateway declined &quot; + b.amountPaise + &quot; paise; the hold runs to its expiry&quot;);\n        boolean mine;\n        try { mine = b.show.commit(b, ref); }\n        catch (RuntimeException e) { pay.refund(ref, b.amountPaise); throw e; } // money moved, the seats did not: give it back\n        if (!mine) {                                                            // a racing confirm got there first\n            if (!ref.equals(b.paymentRef)) pay.refund(ref, b.amountPaise);      // same key = same charge; refund only a second one\n            return b;\n        }\n        publish(&quot;CONFIRMED&quot;, b);                                                // listeners AFTER the lock, never inside it\n        return b;\n    }\n\n        // 2. the card is declined: nothing is released, the seat comes back only when the hold lapses\n        Booking b2 = svc.hold(&quot;SIX&quot;, &quot;raj&quot;, List.of(&quot;B1&quot;));\n        CountingGateway no = new CountingGateway(false);\n        try { svc.confirm(b2.id, no); check(false, &quot;a declined card must throw&quot;); }\n        catch (PaymentDeclined e) { check(true, &quot;a declined card throws: &quot; + e.getMessage()); }\n        check(six.statusOf(&quot;B1&quot;) == SeatStatus.HELD &amp;&amp; b2.status == BookingStatus.PENDING,\n              &quot;after the decline the seat is still HELD and the booking still PENDING&quot;);\n        check(no.refunds.get() == 0, &quot;nothing was refunded: nothing was taken&quot;);\n        now[0] += HOLD - 1;\n        check(six.statusOf(&quot;B1&quot;) == SeatStatus.HELD, &quot;one millisecond before five minutes the hold is still alive&quot;);\n        now[0] += 1;\n        check(six.statusOf(&quot;B1&quot;) == SeatStatus.AVAILABLE, &quot;at exactly five minutes the hold is dead and the seat reads free, with no sweeper&quot;);\n        Booking b2b = svc.hold(&quot;SIX&quot;, &quot;sara&quot;, List.of(&quot;B1&quot;));\n        check(b2b.status == BookingStatus.PENDING &amp;&amp; b2.status == BookingStatus.EXPIRED,\n              &quot;the next user gets it; the dead booking is EXPIRED&quot;);\n        svc.release(b2b.id);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>5 &middot; The gateway takes four minutes and your hold is five. Then the webhook fires three times.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>These are the two ways confirm could sell a seat twice or take the money twice, and both are closed. The status check before charging only refuses a booking that is already over; it proves nothing about the hold, which can lapse while the gateway is thinking. So <code>commit</code> re-checks under the lock, just before marking anything SOLD: every seat must still be HELD, still stamped with <i>this</i> booking id, and still in time. If not, the seats are given back, the booking is EXPIRED and the caller refunds the charge; that is the most important line in the class. The webhook charges nothing: it commits with the payment reference it reports, so the second and third calls find the booking CONFIRMED with that same reference and do nothing. Two taps on Pay at the same instant send the same idempotency key, the booking id, so the gateway takes the money once.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The commit half of the critical step. Re-checks under the lock that every seat is STILL held by this\n     * booking and still in time, then marks them SOLD. true = this call confirmed it, false = it was already\n     * CONFIRMED by a racing retry (the caller refunds). Throws when the hold lapsed during payment.\n     */\n    boolean commit(Booking b, String paymentRef) {\n        lock.lock();\n        try {\n            if (b.status == BookingStatus.CONFIRMED) return false;      // a second confirm sells nothing twice\n            if (b.status != BookingStatus.PENDING) throw new HoldLapsed(&quot;booking &quot; + b.id + &quot; is &quot; + b.status);\n            long now = clock.nowMs();\n            for (ShowSeat ss : b.seats)                                 // THE check that makes double-selling impossible\n                if (ss.status != SeatStatus.HELD || !b.id.equals(ss.holdBookingId) || ss.holdExpiresMs &lt;= now) {\n                    expireLocked(b);\n                    throw new HoldLapsed(&quot;the hold on &quot; + ss.seat.id + &quot; lapsed while the card was being charged&quot;);\n                }\n            for (ShowSeat ss : b.seats) {                               // only now, and all of them\n                ss.status = SeatStatus.SOLD; ss.holdBookingId = null; ss.holdExpiresMs = 0;\n            }\n            b.paymentRef = paymentRef;\n            b.status = BookingStatus.CONFIRMED;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n// ---- ext: the payment webhook -- the gateway reports one payment three times; the seats are sold once\n/**\n * A webhook (the gateway calling our server back to report a payment) can arrive more than once, and after\n * the app&#x27;s own confirm. It charges nothing: it commits with the reference it was told. A repeat finds the\n * booking CONFIRMED with that same reference and does nothing; a payment we cannot use goes back, once.\n */\nclass PaymentWebhook {\n    private final BookingService svc;\n    final AtomicInteger commits = new AtomicInteger();\n    PaymentWebhook(BookingService svc) { this.svc = svc; }\n    /** One callback, &quot;this payment succeeded for this booking&quot;. Safe to receive any number of times. */\n    Booking onPaymentCaptured(String bookingId, String paymentRef, PaymentProcessor pay) {\n        Booking b = svc.find(bookingId);\n        try {\n            if (b.show.commit(b, paymentRef)) { commits.incrementAndGet(); return b; }   // the first report sells the seats\n            if (paymentRef.equals(b.paymentRef)) return b;                              // the same payment again: nothing to do\n        } catch (HoldLapsed e) { /* the hold died before the gateway called back */ }\n        pay.refund(paymentRef, b.amountPaise);                                          // a second payment, or a dead hold\n        return null;\n    }\n}\n\n        Booking t2 = svc.hold(&quot;PAY&quot;, &quot;uma&quot;, List.of(&quot;B2&quot;));\n        CyclicBarrier bothIn = new CyclicBarrier(2);\n        CountingGateway meeting = new CountingGateway(true) {\n            public String charge(String key, long paise) {\n                try { bothIn.await(2, TimeUnit.SECONDS); } catch (Exception e) { throw new IllegalStateException(e); }   // both taps inside at once\n                return super.charge(key, paise);\n            }\n        };\n        ExecutorService taps = Executors.newFixedThreadPool(2);\n        Future&lt;Booking&gt; tapA = taps.submit(() -&gt; svc.confirm(t2.id, meeting));\n        Future&lt;Booking&gt; tapB = taps.submit(() -&gt; svc.confirm(t2.id, meeting));\n        try { tapA.get(); tapB.get(); } catch (ExecutionException e) { check(false, &quot;a tap failed: &quot; + e.getCause()); }\n        taps.shutdown();\n        check(t2.status == BookingStatus.CONFIRMED &amp;&amp; meeting.charges.get() == 1 &amp;&amp; meeting.refunds.get() == 0,\n              &quot;two taps on Pay at the same instant: one charge, nothing to refund (&quot; + meeting.charges.get() + &quot; charges)&quot;);\n\n        // 13. the webhook reports one payment three times: the seats are sold once and nothing is refunded\n        Booking w = svc.hold(&quot;PAY&quot;, &quot;wen&quot;, List.of(&quot;B3&quot;));\n        CountingGateway gw = new CountingGateway(true);\n        String paid = gw.charge(w.id, w.amountPaise);                   // the user paid on the gateway&#x27;s page\n        PaymentWebhook hook = new PaymentWebhook(svc);\n        for (int i = 0; i &lt; 3; i++) hook.onPaymentCaptured(w.id, paid, gw);\n        check(hook.commits.get() == 1 &amp;&amp; w.status == BookingStatus.CONFIRMED &amp;&amp; gw.refunds.get() == 0,\n              &quot;one payment reported three times: sold once, nothing refunded&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>6 &middot; The gateway takes the money and then times out. You do not know whether the card was charged.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A timeout is a third answer, and the mistake is treating it as a no. The charge runs with no lock held and nothing is committed until it returns, so when it throws instead, the booking is still PENDING and its seats are still HELD. The gateway was given the booking id as the idempotency key, so the user can simply press Pay again: the same key is never charged twice. If the user has gone, <code>settle</code> asks the gateway about that key instead of charging. No reference means the charge never happened, and the hold lapses by itself. A reference means the money moved: settle commits with that same reference, or refunds it if the hold died meanwhile. The tests run all three endings.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a gateway that times out -- the third outcome, and the reconciliation that closes it\n/**\n * The gateway neither approved nor declined: the call timed out. The money may have moved and may not\n * have. Until somebody finds out which, nothing may be confirmed and nothing may be released.\n */\nclass PaymentUnknown extends RuntimeException { PaymentUnknown(String m) { super(m); } }\n\n/** Asks the gateway what happened under one idempotency key: the reference if it charged, null if it never did. */\ninterface PaymentQuery { String refFor(String idempotencyKey); }\n\n/**\n * Confirm that survives a timeout. The gateway was given the booking id as the idempotency key, so a\n * timeout leaves a booking still PENDING, its seats still HELD, and a key to ask about. If the user presses\n * Pay again, confirm simply runs again: the same key is never charged twice. If the user has gone, settle()\n * asks the gateway, then finishes the booking with the reference it already has, or gives the money back.\n */\nclass ReconcilingConfirm {\n    private final BookingService svc;\n    private final PaymentQuery query;\n    ReconcilingConfirm(BookingService svc, PaymentQuery query) { this.svc = svc; this.query = query; }\n    /** Try to confirm. A timeout is not a failure: it returns null and changes nothing at all. */\n    Booking confirm(String bookingId, PaymentProcessor pay) {\n        try { return svc.confirm(bookingId, pay); }\n        catch (PaymentUnknown e) { return null; }                // seats still HELD, booking still PENDING\n    }\n    /** Minutes later, with nobody pressing Pay: ask the gateway by key, then finish the job or hand the money back. */\n    Booking settle(String bookingId, PaymentProcessor pay) {\n        Booking b = svc.find(bookingId);\n        if (b.status == BookingStatus.CONFIRMED) return b;       // a retry already finished it\n        String ref = query.refFor(b.id);                         // the key the gateway was given: the booking id\n        if (ref == null) return null;                            // it never charged: let the hold lapse by itself\n        try { if (b.show.commit(b, ref) || ref.equals(b.paymentRef)) return b; }   // commit with THAT ref: no second charge\n        catch (HoldLapsed e) { /* the hold died while the outcome was unknown */ }\n        pay.refund(ref, b.amountPaise);                          // money moved, the seat did not: give it back\n        return null;\n    }\n}\n\n        // 10. the gateway times out: nothing confirmed, nothing released, then settled from the gateway\n        Booking b10 = svc.hold(&quot;NINE&quot;, &quot;nikhil&quot;, List.of(&quot;C1&quot;));\n        CountingGateway timingOut = new CountingGateway(true) {\n            public String charge(String key, long paise) { super.charge(key, paise); throw new PaymentUnknown(&quot;read timeout after 30 s&quot;); }\n        };\n        ReconcilingConfirm rec = new ReconcilingConfirm(svc, timingOut::refFor);\n        check(rec.confirm(b10.id, timingOut) == null, &quot;a timeout confirms nothing and throws nothing at the caller&quot;);\n        check(b10.status == BookingStatus.PENDING &amp;&amp; nine.statusOf(&quot;C1&quot;) == SeatStatus.HELD,\n              &quot;after the timeout the booking is still PENDING and the seat still HELD&quot;);\n        check(timingOut.refunds.get() == 0, &quot;nothing was refunded while the outcome was unknown&quot;);\n        check(rec.settle(b10.id, timingOut) != null &amp;&amp; b10.status == BookingStatus.CONFIRMED,\n              &quot;settle asks the gateway by the booking id, finds the charge and finishes the booking&quot;);\n        check(timingOut.charges.get() == 1 &amp;&amp; nine.statusOf(&quot;C1&quot;) == SeatStatus.SOLD, &quot;the card was charged exactly once&quot;);\n\n        // the same timeout, but the hold dies before anybody settles: the money comes back, the seat goes on sale\n        Booking b10b = svc.hold(&quot;NINE&quot;, &quot;ira&quot;, List.of(&quot;C2&quot;));\n        CountingGateway timingOut2 = new CountingGateway(true) {\n            public String charge(String key, long paise) { super.charge(key, paise); throw new PaymentUnknown(&quot;read timeout after 30 s&quot;); }\n        };\n        ReconcilingConfirm rec2 = new ReconcilingConfirm(svc, timingOut2::refFor);\n        rec2.confirm(b10b.id, timingOut2);\n        now[0] += HOLD + 1;                                              // nobody settled in time\n        check(rec2.settle(b10b.id, timingOut2) == null, &quot;settling after the hold died confirms nothing&quot;);\n        check(timingOut2.refunds.get() == 1 &amp;&amp; nine.statusOf(&quot;C2&quot;) == SeatStatus.AVAILABLE &amp;&amp; b10b.status == BookingStatus.EXPIRED,\n              &quot;the money is refunded, the seat is back on sale and the booking is EXPIRED&quot;);\n\n        // 12. the booking id is the idempotency key: a retry after a timeout, or two taps at once, is charged once\n        Show pay = new Show(&quot;PAY&quot;, &quot;Interstellar&quot;, sc, Instant.parse(&quot;2026-09-16T18:00:00Z&quot;).toEpochMilli(), clock, HOLD);\n        svc.addShow(pay);\n        Booking t1 = svc.hold(&quot;PAY&quot;, &quot;tara&quot;, List.of(&quot;B1&quot;));\n        CountingGateway flaky = new CountingGateway(true) {\n            boolean first = true;\n            public String charge(String key, long paise) {\n                String r = super.charge(key, paise);\n                if (first) { first = false; throw new PaymentUnknown(&quot;timeout after the money moved&quot;); }\n                return r;\n            }\n        };\n        try { svc.confirm(t1.id, flaky); } catch (PaymentUnknown e) { /* the app says &quot;something went wrong&quot;; the user taps Pay again */ }\n        svc.confirm(t1.id, flaky);\n        check(t1.status == BookingStatus.CONFIRMED &amp;&amp; flaky.charges.get() == 1 &amp;&amp; flaky.refunds.get() == 0,\n              &quot;a timeout, then Pay again: charged once, not twice (&quot; + flaky.charges.get() + &quot;)&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; The seat map is read ten thousand times a second. Keep it fast, and keep it off the booking lock.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No new structure. \"How many gold seats are left\" is a counter on the show, moved by one at every hold, release and cancel: one map lookup, never a count. \"Is B4 free\" is one lookup in the show's seat map, and a hold whose time has passed is drawn as free, so an abandoned cart never shows as taken. Each holds the show's lock for tens of nanoseconds. The whole map of a 300-seat screen is a walk of about three microseconds, so ten thousand reads a second keep the lock about 3% busy, which is still fine. When it stops being fine, the seat fields are already volatile, so the read path can walk the map with no lock at all and draw a snapshot. It is a snapshot, not a promise; only a hold promises.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * How many seats of a class are neither held nor sold. O(1): a counter, never a scan. A lapsed hold is\n     * counted back when something reclaims it (the next hold, or the sweeper), so this can read a little low.\n     */\n    int freeCount(SeatClass cls) { lock.lock(); try { return free.get(cls); } finally { lock.unlock(); } }\n\n    /** What one seat looks like to a user: a lapsed hold is drawn as free. O(1). */\n    SeatStatus statusOf(String seatId) {\n        lock.lock();\n        try {\n            ShowSeat ss = seats.get(seatId);\n            if (ss == null) throw new NoSuchElementException(&quot;no seat &quot; + seatId + &quot; in show &quot; + id);\n            return ss.freeAt(clock.nowMs()) ? SeatStatus.AVAILABLE : ss.status;\n        } finally { lock.unlock(); }\n    }\n\n    /** The whole seat map for the screen. A snapshot for drawing, not a promise: only a hold promises. */\n    Map&lt;String, SeatStatus&gt; seatMap() {\n        lock.lock();\n        try {\n            long now = clock.nowMs();\n            Map&lt;String, SeatStatus&gt; out = new LinkedHashMap&lt;&gt;();\n            for (ShowSeat ss : seats.values()) out.put(ss.seat.id, ss.freeAt(now) ? SeatStatus.AVAILABLE : ss.status);\n            return out;\n        } finally { lock.unlock(); }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; A city has forty theatres and three hundred shows tonight. List the cinemas showing Dune, without slowing booking down.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Browsing is a read path, and the one rule is that it never takes a booking lock. Beside the shows sits an index: city, then movie, then that movie's shows in a map sorted by start time (a ConcurrentSkipListMap, Java's thread-safe sorted map). Tonight's Dune in Bengaluru is two map hops and a range read over tonight's part of that map, so next week's shows are never touched. \"List the cinemas showing Dune\", the call a machine-coding version asks for, is the same range read collecting theatre ids. None of it touches a show's lock, so a million people browsing cannot make one hold wait. What is being checked is that you did not keep one list of all shows and scan it: three hundred shows scan fine, three hundred thousand across the country do not.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: many theatres and screens -- search is an index hop, and each show carries its own lock\n/**\n * The read path: city, then movie, then that movie&#x27;s shows sorted by start time. A time window is a range\n * read on the sorted map, so tonight&#x27;s search never walks next week&#x27;s shows. It never takes a show&#x27;s lock,\n * so browsing cannot slow booking down.\n */\nclass ShowIndex {\n    /** One show as search sees it: the theatre it is in, and the show. */\n    record Listing(String theatreId, Show show) {}\n    // city -&gt; movie -&gt; start time -&gt; listings. ConcurrentSkipListMap is Java&#x27;s thread-safe sorted map.\n    private final Map&lt;String, Map&lt;String, ConcurrentSkipListMap&lt;Long, List&lt;Listing&gt;&gt;&gt;&gt; index = new ConcurrentHashMap&lt;&gt;();\n    /** Register a show for search. Setup, or whenever a theatre publishes a new day. */\n    void add(Theatre theatre, Show show) {\n        index.computeIfAbsent(theatre.city, c -&gt; new ConcurrentHashMap&lt;&gt;())\n             .computeIfAbsent(show.movie, m -&gt; new ConcurrentSkipListMap&lt;&gt;())\n             .computeIfAbsent(show.startMs, t -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(new Listing(theatre.id, show));\n    }\n    /** Shows of one movie in one city that start inside [fromMs, toMs), earliest first. Two hops, then O(log n + k). */\n    List&lt;Listing&gt; search(String city, String movie, long fromMs, long toMs) {\n        ConcurrentSkipListMap&lt;Long, List&lt;Listing&gt;&gt; byStart = index.getOrDefault(city, Map.of()).get(movie);\n        List&lt;Listing&gt; out = new ArrayList&lt;&gt;();\n        if (byStart != null) for (List&lt;Listing&gt; same : byStart.subMap(fromMs, true, toMs, false).values()) out.addAll(same);\n        return out;\n    }\n    /** The machine-coding &quot;list cinemas&quot; call: theatres in a city showing a movie in the window, sorted by id. */\n    SortedSet&lt;String&gt; cinemas(String city, String movie, long fromMs, long toMs) {\n        SortedSet&lt;String&gt; out = new TreeSet&lt;&gt;();\n        for (Listing l : search(city, movie, fromMs, toMs)) out.add(l.theatreId());\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; Three seats together, or none at all.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The policy is handed in, so \"together\" is one new class. Given the free seats of a class in screen order, it looks for three in the same row with consecutive numbers, and returns them or nothing. The important part is not the search, it is where it runs. <code>holdBest</code> builds the candidate list, calls the policy and takes the seats <i>in the same locked section</i>, so another family cannot take the middle seat between the choosing and the taking. If no run exists, the method throws and not one seat was touched: the test checks the free count is unchanged and that all four scattered free seats are still AVAILABLE. Say the word atomic: nothing can run in the middle of it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Hold a count of seats chosen by the handed-in policy. The choosing and the taking happen in the SAME\n     * locked section, so a run of three cannot be broken between picking it and getting it.\n     */\n    Booking holdBest(String userId, SeatClass cls, int count, SeatPolicy policy, PricingRule pricing) {\n        if (count &lt; 1) throw new IllegalArgumentException(&quot;ask for at least one seat, not &quot; + count);\n        lock.lock();\n        try {\n            long now = clock.nowMs();\n            List&lt;ShowSeat&gt; candidates = new ArrayList&lt;&gt;();\n            for (ShowSeat ss : seats.values())              // screen order, so &quot;adjacent&quot; means what it says\n                if (ss.seat.seatClass == cls &amp;&amp; ss.freeAt(now)) candidates.add(ss);\n            List&lt;ShowSeat&gt; pick = policy.choose(candidates, count);\n            if (pick.size() != count) throw new SeatUnavailable(&quot;no &quot; + count + &quot; &quot; + cls + &quot; seats match the policy in &quot; + id);\n            for (ShowSeat ss : pick) reclaimIfLapsed(ss, now);\n            return takeAll(userId, pick, pricing, now);\n        } finally { lock.unlock(); }\n    }\n\n/** Take count seats side by side in one row, or nothing at all. Three free seats scattered are not a run. */\nclass AdjacentSeats implements SeatPolicy {\n    public List&lt;ShowSeat&gt; choose(List&lt;ShowSeat&gt; candidates, int count) {\n        for (int i = 0; i + count &lt;= candidates.size(); i++) {\n            boolean run = true;\n            for (int k = 1; k &lt; count &amp;&amp; run; k++) {\n                Seat prev = candidates.get(i + k - 1).seat, next = candidates.get(i + k).seat;\n                run = prev.row.equals(next.row) &amp;&amp; next.number == prev.number + 1;\n            }\n            if (run) return List.copyOf(candidates.subList(i, i + count));\n        }\n        return List.of();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>10 &middot; Do you need a background job to expire holds?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>For correctness, no. A hold is a lease: a claim that expires by itself. Every place a stale hold could block treats a lapsed one as free: the check inside <code>hold</code>, the candidate list inside <code>holdBest</code>, and the seat map. The first person who wants that seat reclaims it, marks the dead booking EXPIRED and takes it, so an abandoned cart can never keep a seat off sale. A sweeper is still worth having for the free count: until something reclaims a lapsed hold, the count reads one lower than the truth. That is the safe direction to be wrong in, but it makes the show look fuller than it is. A scheduled pass, or a DelayQueue (Java's queue that hands out each item only when its time comes) keyed on the expiry, does the job; neither is needed for correctness.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a background sweeper reclaims lapsed holds -- for the display, never for correctness\n/**\n * Walks every show every few seconds and hands lapsed holds back. Correctness never depended on it: a\n * lapsed hold is already treated as free by the next caller. This only makes the free count catch up sooner.\n */\nclass HoldSweeper {\n    private final List&lt;Show&gt; shows;\n    private final ScheduledExecutorService timer = Executors.newSingleThreadScheduledExecutor(\n        r -&gt; { Thread t = new Thread(r, &quot;sweeper&quot;); t.setDaemon(true); return t; });\n    HoldSweeper(List&lt;Show&gt; shows) { this.shows = shows; }\n    /** Start sweeping. Each pass takes each show&#x27;s lock for a few microseconds and releases it. */\n    void start(long everyMs) {\n        timer.scheduleAtFixedRate(() -&gt; {\n            for (Show s : shows) {\n                try { s.sweepExpired(); } catch (RuntimeException e) { /* one bad show must not kill the timer */ }\n            }\n        }, everyMs, everyMs, TimeUnit.MILLISECONDS);\n    }\n    void stop() { timer.shutdownNow(); }\n    /** One pass by hand, for tests: how many holds were reclaimed. */\n    int sweepOnce() { int n = 0; for (Show s : shows) n += s.sweepExpired(); return n; }\n}\n// A DelayQueue&lt;Booking&gt; (Java&#x27;s queue that hands out each item only when its time comes) keyed on holdExpiresMs\n// is the same idea without the polling. Both are optimisations of the lazy path.\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; The show is sold out. Who gets the next seat that comes back, and what stops one script holding the whole

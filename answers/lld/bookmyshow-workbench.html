 house?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two different mechanisms, and both are about seats nobody can buy. A waitlist is one queue per show and seat class. Whoever sees a seat come back calls <code>offer</code>: a listener on CANCELLED, or the sweeper for a lapsed hold. The person at the head then gets that seat HELD in their name for five minutes, not an email telling them to race for it; if somebody faster took it, they keep their place. The script is the other problem: a cap of, say, ten seats per user per show. The trap is checking the cap and then holding: two of the script's threads both read \"nine of ten used\" and both hold. So one user's requests queue on a small per-user lock. And the count is only of seats they hold or bought right now, so a lapsed hold, a release or a cancel gives the quota back by itself.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a waitlist -- when a seat comes back, the head of the queue gets it held for them\n/**\n * One queue per show and class. Whoever sees a seat come back calls offer: a listener on CANCELLED, or the\n * sweeper for a lapsed hold. The first person waiting gets that seat HELD in their name for the usual\n * window, so the offer is a real hold, not an email telling them to go and race for it.\n */\nclass Waitlist {\n    private final Map&lt;String, Deque&lt;String&gt;&gt; queues = new ConcurrentHashMap&lt;&gt;();\n    private static String key(Show s, SeatClass c) { return s.id + &quot;/&quot; + c; }\n    /** Join the back of the queue for this show and class. */\n    void join(Show show, SeatClass cls, String userId) {\n        queues.computeIfAbsent(key(show, cls), k -&gt; new ConcurrentLinkedDeque&lt;&gt;()).add(userId);\n    }\n    /** How many are waiting. */\n    int size(Show show, SeatClass cls) { Deque&lt;String&gt; q = queues.get(key(show, cls)); return q == null ? 0 : q.size(); }\n    /**\n     * A seat became free: hold it for the head of the queue and hand back their booking, or null when\n     * nobody is waiting or somebody else already took it.\n     */\n    Booking offer(BookingService svc, Show show, SeatClass cls, String seatId) {\n        Deque&lt;String&gt; q = queues.get(key(show, cls));\n        String user = q == null ? null : q.poll();\n        if (user == null) return null;\n        try { return svc.hold(show.id, user, List.of(seatId)); }\n        catch (SeatUnavailable e) { q.addFirst(user); return null; }        // somebody was faster: keep their place\n    }\n}\n\n// ---- ext: a cap per user -- one script must not hold the whole house\n/**\n * At most N seats per user per show, counting only what they hold or bought RIGHT NOW: a lapsed hold, a\n * release and a cancel give the quota back by themselves. One user&#x27;s requests queue on a small per-user\n * lock, so two threads of one script can never both see &quot;one seat left&quot;. The order is always the user&#x27;s\n * lock, then the show&#x27;s lock inside svc.hold, so the two can never deadlock.\n */\nclass SeatCap {\n    private final int maxPerUser;\n    private final Clock clock;\n    private final ConcurrentHashMap&lt;String, List&lt;Booking&gt;&gt; byUser = new ConcurrentHashMap&lt;&gt;();   // &quot;show/user&quot; -&gt; bookings\n    SeatCap(int maxPerUser, Clock clock) { this.maxPerUser = maxPerUser; this.clock = clock; }\n    /** Hold through the cap. Throws SeatUnavailable when this user is already at their limit for this show. */\n    Booking hold(BookingService svc, String showId, String userId, List&lt;String&gt; seatIds) {\n        List&lt;Booking&gt; mine = byUser.computeIfAbsent(showId + &quot;/&quot; + userId, k -&gt; new ArrayList&lt;&gt;());\n        synchronized (mine) {                                     // count and hold are one step for this user\n            if (live(mine) + seatIds.size() &gt; maxPerUser)\n                throw new SeatUnavailable(userId + &quot; is at the limit of &quot; + maxPerUser + &quot; seats for &quot; + showId);\n            Booking b = svc.hold(showId, userId, seatIds);\n            mine.add(b);\n            return b;\n        }\n    }\n    /** How many seats this user holds or bought right now, for the message the app shows them. */\n    int used(String showId, String userId) {\n        List&lt;Booking&gt; mine = byUser.get(showId + &quot;/&quot; + userId);\n        if (mine == null) return 0;\n        synchronized (mine) { return live(mine); }\n    }\n    private int live(List&lt;Booking&gt; mine) {\n        long now = clock.nowMs(); int n = 0;\n        for (Booking b : mine)\n            if (b.status == BookingStatus.CONFIRMED || (b.status == BookingStatus.PENDING &amp;&amp; b.holdExpiresMs &gt; now)) n += b.seats.size();\n        return n;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>12 &middot; The user cancels forty-five minutes before the show. How much money goes back, and what puts the seat back?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two separate decisions, and the interviewer is watching whether you notice that they are separate. The seat always comes back: <code>cancel</code> puts every seat of the booking to AVAILABLE under the show's lock and moves the free counter, whatever happens to the money. How much money goes back is a rule that will change, so it is another one-method interface: full up to two hours before, half up to twenty minutes, nothing after. It is decided from the booking's frozen amount and the show's start time, before anything moves. The refund is sent after the lock is released, so a slow refund never holds a seat hostage. Money is integer paise, so half of 25,000 is exactly 12,500. Half of an odd amount rounds down in the house's favour: say that decision out loud rather than letting a double make it for you.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a refund policy -- how much money comes back depends on how close the show is\n/** How much of a cancelled booking is returned, in paise. Another rule that changes, so another interface. */\ninterface RefundPolicy { long refundPaise(Booking b, long nowMs); }\n\n/** The usual cinema rule: everything back until two hours before, half until twenty minutes, nothing after. */\nclass TieredRefund implements RefundPolicy {\n    public long refundPaise(Booking b, long nowMs) {\n        long minutesToShow = (b.show.startMs - nowMs) / 60_000L;\n        if (minutesToShow &gt;= 120) return b.amountPaise;\n        if (minutesToShow &gt;= 20) return b.amountPaise / 2;       // integer paise: half of 25,000 is 12,500 exactly\n        return 0;                                                // the seat still comes back; the money does not\n    }\n}\n\n/**\n * Cancel with a policy. The seat returns to the market whatever the money does: the amount is decided from\n * frozen fields before anything moves, the seats come back under the show&#x27;s lock, the refund is sent after.\n */\nclass CancelWithRefund {\n    private final BookingService svc;\n    private final RefundPolicy policy;\n    private final Clock clock;\n    CancelWithRefund(BookingService svc, RefundPolicy policy, Clock clock) { this.svc = svc; this.policy = policy; this.clock = clock; }\n    /** Cancel, and return the paise actually sent back. */\n    long cancel(String bookingId, PaymentProcessor pay) {\n        Booking b = svc.find(bookingId);\n        long back = policy.refundPaise(b, clock.nowMs());        // decided before the seats move\n        b.show.cancel(b);                                        // under the lock: on sale again immediately\n        if (back &gt; 0) pay.refund(b.paymentRef, back);            // outside the lock: a slow refund holds no seat\n        return back;\n    }\n}\n\n        // 11. cancelling: the seat always comes back, the money follows the refund policy\n        CountingGateway desk = new CountingGateway(true);\n        CancelWithRefund cancelDesk = new CancelWithRefund(svc, new TieredRefund(), clock);\n        Booking full = svc.hold(&quot;SIX&quot;, &quot;ganesh&quot;, List.of(&quot;B5&quot;));\n        svc.confirm(full.id, desk);\n        now[0] = six.startMs - 180 * 60_000L;                            // three hours before the show\n        check(cancelDesk.cancel(full.id, desk) == full.amountPaise, &quot;three hours before the show: all &quot; + full.amountPaise + &quot; paise back&quot;);\n        Booking half = svc.hold(&quot;SIX&quot;, &quot;hema&quot;, List.of(&quot;B6&quot;));\n        svc.confirm(half.id, desk);\n        now[0] = six.startMs - 45 * 60_000L;                             // forty-five minutes before\n        check(cancelDesk.cancel(half.id, desk) == half.amountPaise / 2, &quot;forty-five minutes before: half the money back&quot;);\n        Booking late = svc.hold(&quot;SIX&quot;, &quot;ivan&quot;, List.of(&quot;B1&quot;));\n        svc.confirm(late.id, desk);\n        now[0] = six.startMs + 10 * 60_000L;                             // ten minutes after it started\n        check(cancelDesk.cancel(late.id, desk) == 0, &quot;after the show started: no money back&quot;);\n        check(six.statusOf(&quot;B1&quot;) == SeatStatus.AVAILABLE &amp;&amp; late.status == BookingStatus.CANCELLED,\n              &quot;the seat still goes back on sale even when the refund is nothing&quot;);\n        check(desk.refunds.get() == 2, &quot;two of the three cancels sent money, and each sent it once&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Persist it, then run it on four app servers. Which tables, and what stops two servers selling one seat?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One JVM's lock guards nothing once there are four JVMs, so the race moves into the database. The tables are the classes, and only one of them sees the race: show_seat, one row per seat per show. A group hold is one transaction with one conditional UPDATE: set the rows to HELD where they are still AVAILABLE or their hold has lapsed. If fewer rows changed than seats were asked for, roll back: somebody else won one. The transaction gives the two ACID promises that matter here: all the rows change or none do (atomic), and no other booking sees them half-changed (isolated). This is optimistic locking: write only if nothing changed, and zero rows means you lost. The pessimistic version, <code>SELECT ... FOR UPDATE</code>, locks the rows first and then writes. Never hold a database lock across the payment: the hold is a status plus an expiry time on the row, its time to live (TTL). In Redis the same hold is <code>SET seatKey bookingId NX PX 300000</code> (only if absent, gone in five minutes), released by a compare-and-delete (delete only if the value is still this booking's id).</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- the seat claim becomes a conditional UPDATE, the database&#x27;s compare-and-set\n/**\n * The tables are the classes: movie, theatre, screen, seat, show, booking, booking_seat, and show_seat with\n * one row per seat per show, the only table the race touches:\n *   show_seat(show_id, seat_id, status, hold_booking, hold_expires)   primary key (show_id, seat_id)\n * A hold is a status and an expiry time on that row (its TTL), never a database lock held across payment.\n * A group claim is ONE transaction. Optimistic: one conditional UPDATE, and the row count decides:\n *   UPDATE show_seat SET status=&#x27;HELD&#x27;, hold_booking=?, hold_expires=?\n *    WHERE show_id=? AND seat_id IN (?,?,?)\n *      AND (status=&#x27;AVAILABLE&#x27; OR (status=&#x27;HELD&#x27; AND hold_expires &lt;= ?))\n *   -- 3 rows changed: COMMIT.  Fewer: ROLLBACK, somebody else won a seat.\n * Pessimistic, same result: SELECT ... WHERE show_id=? AND seat_id IN (...) FOR UPDATE; check; UPDATE; COMMIT.\n */\ninterface ShowSeatRepository {\n    /** The group claim above: every seat HELD for this booking, or none of them. */\n    boolean claimAll(String showId, List&lt;String&gt; seatIds, String bookingId, long expiresMs, long nowMs);\n    /** UPDATE show_seat SET status=&#x27;SOLD&#x27; WHERE show_id=? AND seat_id=? AND status=&#x27;HELD&#x27; AND hold_booking=? AND hold_expires &gt; ? */\n    boolean sell(String showId, String seatId, String bookingId, long nowMs);\n    String status(String showId, String seatId);\n}\n/**\n * A stand-in for the database: one row per show and seat, and every write is a compare-and-set on the row.\n * A refused row is &quot;zero rows updated&quot;: somebody else got there first, exactly the answer the lock gave.\n * The group claim takes rows in seat-id order and puts back the ones it took if any row refuses: the ROLLBACK.\n */\nclass ConditionalRowStore implements ShowSeatRepository {\n    /** One row: the three columns that decide the race. */\n    record Row(String status, String bookingId, long expiresMs) {}\n    private final ConcurrentHashMap&lt;String, Row&gt; rows = new ConcurrentHashMap&lt;&gt;();\n    private static String k(String showId, String seatId) { return showId + &quot;#&quot; + seatId; }\n    void put(String showId, String seatId) { rows.put(k(showId, seatId), new Row(&quot;AVAILABLE&quot;, null, 0)); }\n    public boolean claimAll(String showId, List&lt;String&gt; seatIds, String bookingId, long expiresMs, long nowMs) {\n        Row mine = new Row(&quot;HELD&quot;, bookingId, expiresMs);\n        Map&lt;String, Row&gt; taken = new LinkedHashMap&lt;&gt;();                          // key -&gt; the row as it was\n        for (String seatId : new TreeSet&lt;&gt;(seatIds)) {                           // one fixed order for every caller\n            String key = k(showId, seatId);\n            Row cur = rows.get(key);\n            boolean claimable = cur != null &amp;&amp; (cur.status().equals(&quot;AVAILABLE&quot;)\n                || (cur.status().equals(&quot;HELD&quot;) &amp;&amp; cur.expiresMs() &lt;= nowMs));   // the WHERE clause, for one row\n            if (claimable &amp;&amp; rows.replace(key, cur, mine)) { taken.put(key, cur); continue; }\n            taken.forEach((kk, was) -&gt; rows.replace(kk, mine, was));             // ROLLBACK: nothing stays HELD\n            return false;\n        }\n        return true;                                                             // COMMIT\n    }\n    public boolean sell(String showId, String seatId, String bookingId, long nowMs) {\n        String key = k(showId, seatId);\n        Row cur = rows.get(key);\n        if (cur == null || !cur.status().equals(&quot;HELD&quot;)\n            || !bookingId.equals(cur.bookingId()) || cur.expiresMs() &lt;= nowMs) return false;\n        return rows.replace(key, cur, new Row(&quot;SOLD&quot;, bookingId, 0));\n    }\n    public String status(String showId, String seatId) { Row r = rows.get(k(showId, seatId)); return r == null ? null : r.status(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Where does time come from, and how do you test a hold expiring without sleeping?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The show is handed a <code>Clock</code>, a one-method interface, and it reads it inside the lock so two callers can never disagree about whether a hold has lapsed. Nothing else in the design reads the wall clock. A test hands in a lambda over a one-element array and moves it: hold a seat, move the clock to five minutes, and the seat is free; one millisecond earlier it was still held. The nastiest test in the file is the same trick in a costume: a payment processor whose <code>charge</code> pushes the clock past the hold before returning success. That is exactly a gateway that took longer than your window. Confirm must then refuse and refund, and the assertions check the card was charged once and refunded once.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Where time comes from. Injected so a test can jump past a hold&#x27;s expiry without sleeping. */\ninterface Clock { long nowMs(); }\n\n        now[0] += HOLD - 1;\n        check(six.statusOf(&quot;B1&quot;) == SeatStatus.HELD, &quot;one millisecond before five minutes the hold is still alive&quot;);\n        now[0] += 1;\n        check(six.statusOf(&quot;B1&quot;) == SeatStatus.AVAILABLE, &quot;at exactly five minutes the hold is dead and the seat reads free, with no sweeper&quot;);\n\n        // 3. the gateway is slower than the hold: confirm is refused and the money is given back\n        Booking b3 = svc.hold(&quot;SIX&quot;, &quot;asha&quot;, List.of(&quot;B2&quot;));\n        CountingGateway slow = new CountingGateway(true) {\n            public String charge(String key, long paise) { now[0] += HOLD + 1; return super.charge(key, paise); }   // the round trip outlived the hold\n        };\n        try { svc.confirm(b3.id, slow); check(false, &quot;confirm after the hold expired must throw&quot;); }\n        catch (HoldLapsed e) { check(true, &quot;confirm after expiry is refused: &quot; + e.getMessage()); }\n        check(slow.charges.get() == 1 &amp;&amp; slow.refunds.get() == 1, &quot;the card was charged once and refunded once&quot;);\n        check(six.statusOf(&quot;B2&quot;) == SeatStatus.AVAILABLE &amp;&amp; b3.status == BookingStatus.EXPIRED,\n              &quot;the seat is on sale again and the booking is EXPIRED, not SOLD&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Which pattern is where, and why did each one earn its place?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Four patterns are in the file, and each one is a line you can put your finger on. <b>Strategy</b>: <code>interface PricingRule { long pricePaise(Show, Seat); }</code> and <code>configure(pricing, policy)</code> -- the service is handed its rules and never builds one. <b>Decorator</b>: <code>WeekendSurgePricing</code> holds a <code>base</code> and multiplies whatever the base returned, so the flat rule is never opened and coupons and demand pricing stack on top of it the same way. <b>Observer</b>: <code>publish</code> runs after <code>lock.unlock()</code> and wraps each listener in a catch, which is why a dead SMS gateway cannot kill a confirmed booking. <b>State</b>: two enums plus the order at the critical step, so the illegal transitions have nowhere to live. Two are absent on purpose. No Factory, because screens and seats arrive already built. No Singleton, because <code>main</code> builds one service and hands it out, which is exactly why every test in FailureTests can build its own.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// &quot;they&#x27;ll want weekend and prime-time pricing&quot; -&gt; hide the rule behind an interface -&gt; Strategy\n/** What one seat costs for one show, in paise. Behind an interface because pricing always changes. */\ninterface PricingRule { long pricePaise(Show show, Seat seat); }\n\n/** The base rule: a flat price per seat class. A table, not an if-chain, so a new class is one row. */\nclass ClassPricing implements PricingRule {\n    private static final Map&lt;SeatClass, Long&gt; RATE = new EnumMap&lt;&gt;(Map.of(\n        SeatClass.SILVER, 15_000L, SeatClass.GOLD, 25_000L, SeatClass.PLATINUM, 40_000L));\n    /** The class rate, in paise: SILVER 150.00, GOLD 250.00, PLATINUM 400.00. */\n    public long pricePaise(Show show, Seat seat) { return RATE.get(seat.seatClass); }\n}\n\n/**\n * 1.5x (150 per cent) when the SHOW starts on a Saturday or Sunday in the theatre&#x27;s time zone: a NEW rule\n * that wraps the one it is given (Decorator). Integer paise in, integer paise out: no double touches money.\n */\nclass WeekendSurgePricing implements PricingRule {\n    private final PricingRule base;\n    private final ZoneId zone;\n    private final int percent;                      // 150 = one and a half times\n    WeekendSurgePricing(PricingRule base, ZoneId zone, int percent) { this.base = base; this.zone = zone; this.percent = percent; }\n    public long pricePaise(Show show, Seat seat) {\n        DayOfWeek d = Instant.ofEpochMilli(show.startMs).atZone(zone).getDayOfWeek();\n        boolean weekend = (d == DayOfWeek.SATURDAY || d == DayOfWeek.SUNDAY);\n        long p = base.pricePaise(show, seat);\n        return weekend ? p * percent / 100 : p;     // rounds down to the paisa, in the customer&#x27;s favour\n    }\n}\n\n    /** Tell every listener, outside the lock, and survive a broken one. */\n    private void publish(String event, Booking b) {\n        for (BookingObserver o : observers) {\n            try { o.onBooking(event, b); } catch (RuntimeException e) { System.err.println(&quot;[listener failed] &quot; + e.getMessage()); }\n        }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Enum for the seat class, or a Seat subclass? And where would a Factory pay?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Enum, until a class gains behaviour of its own. Three tiers that differ only in what they cost are data: one row in a rate table. A recliner that must be reclined, or a wheelchair space with its own booking rules, is behaviour, and that is when a subclass pays. The same answer applies to the statuses: SeatStatus and BookingStatus are enums because the transitions live in one place, in the order at the critical step, not inside each state. A Factory earns its place when a screen layout arrives as configuration. Then a registry from a string to a constructor makes a new seat kind one registration instead of one more case in a growing switch.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// data, not classes: a tier is a row\nprivate static final Map&lt;SeatClass, Long&gt; RATE = new EnumMap&lt;&gt;(Map.of(\n    SeatClass.SILVER, 15_000L, SeatClass.GOLD, 25_000L, SeatClass.PLATINUM, 40_000L));\n\n// when a tier gains behaviour, a subclass pays -- and Seat stops being final\nclass ReclinerSeat extends Seat {\n    ReclinerSeat(String row, int number) { super(row, number, SeatClass.PLATINUM); }\n    void recline() { /* talks to the seat motor */ }\n}\n\n// a factory only once creation grows: a registry, so a new kind is one registration\nMap&lt;String, BiFunction&lt;String, Integer, Seat&gt;&gt; registry = Map.of(\n    &quot;RECLINER&quot;, ReclinerSeat::new);\nSeat s = registry.get(kind).apply(row, number);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.time.*;\n\n/** The price tiers a seat can belong to. Only the pricing rule ever looks at this. */\nenum SeatClass { SILVER, GOLD, PLATINUM }\n\n/**\n * A physical chair in a screen: a row, a number, a class. Immutable, and shared by every show on that\n * screen. There is deliberately NO status field here: a chair is not free or sold, a chair-at-a-show is.\n */\nfinal class Seat {\n    final String id;                               // row + number, e.g. \"B4\"\n    final String row;\n    final int number;\n    final SeatClass seatClass;\n    Seat(String row, int number, SeatClass seatClass) {\n        this.row = row; this.number = number; this.id = row + number; this.seatClass = seatClass;\n    }\n}\n\n/** One screen (auditorium): its fixed seat layout, listed in screen order, row by row. */\nfinal class Screen {\n    final String id;\n    final List<Seat> seats;\n    Screen(String id, List<Seat> seats) { this.id = id; this.seats = List.copyOf(seats); }\n}\n\n/** A building with screens. Catalog only: nothing in here changes while somebody is booking. */\nfinal class Theatre {\n    final String id;\n    final String city;\n    final List<Screen> screens;\n    Theatre(String id, String city, List<Screen> screens) { this.id = id; this.city = city; this.screens = List.copyOf(screens); }\n}\n\n/** A seat's life inside ONE show: free, held for a few minutes by one booking, or sold for good. */\nenum SeatStatus { AVAILABLE, HELD, SOLD }\n\n/**\n * One seat, for one show: the mutable half. Every field is written under its show's lock. They are volatile\n * so a reader that skips the lock (the first rung of the ladder on page 02) still sees the latest values.\n */\nfinal class ShowSeat {\n    final Seat seat;\n    volatile SeatStatus status = SeatStatus.AVAILABLE;\n    volatile String holdBookingId;                 // who holds it right now; null unless HELD\n    volatile long holdExpiresMs;                   // when that hold dies; 0 unless HELD\n    ShowSeat(Seat seat) { this.seat = seat; }\n    /** True when nobody can stop this seat being taken at time now: free, or held by a hold that has lapsed. */\n    boolean freeAt(long now) {\n        return status == SeatStatus.AVAILABLE || (status == SeatStatus.HELD && holdExpiresMs <= now);\n    }\n}\n\n/**\n * A booking's life: PENDING while the seats are only held; CONFIRMED once the money moved and the seats\n * were committed; EXPIRED if the hold died first; CANCELLED if a confirmed booking was given back.\n */\nenum BookingStatus { PENDING, CONFIRMED, CANCELLED, EXPIRED }\n\n/**\n * One user's attempt at one show: the seats it holds, and the amount, frozen at hold time so that confirm\n * can never quietly reprice or drop a seat.\n */\nfinal class Booking {\n    final String id;\n    final Show show;\n    final String userId;\n    final List<ShowSeat> seats;\n    final long amountPaise;                        // integer paise: money is never a double\n    final long holdExpiresMs;\n    volatile BookingStatus status = BookingStatus.PENDING;\n    volatile String paymentRef;                    // what the gateway gave back; needed to refund\n    Booking(String id, Show show, String userId, List<ShowSeat> seats, long amountPaise, long holdExpiresMs) {\n        this.id = id; this.show = show; this.userId = userId; this.seats = List.copyOf(seats);\n        this.amountPaise = amountPaise; this.holdExpiresMs = holdExpiresMs;\n    }\n    /** The seat ids on this booking, for printing and for tests. */\n    List<String> seatIds() { List<String> out = new ArrayList<>(); for (ShowSeat s : seats) out.add(s.seat.id); return out; }\n}\n\n/** At least one requested seat was not free. Nothing was held: the request is all-or-nothing. */\nclass SeatUnavailable extends RuntimeException { SeatUnavailable(String m) { super(m); } }\n/** The hold died before confirm could commit it. Any money already taken is refunded by the caller. */\nclass HoldLapsed extends RuntimeException { HoldLapsed(String m) { super(m); } }\n/** The gateway said no. Nothing is released: the hold simply runs out on its own. */\nclass PaymentDeclined extends RuntimeException { PaymentDeclined(String m) { super(m); } }\n\n/** Where time comes from. Injected so a test can jump past a hold's expiry without sleeping. */\ninterface Clock { long nowMs(); }\n\n// \"they'll want weekend and prime-time pricing\" -> hide the rule behind an interface -> Strategy\n/** What one seat costs for one show, in paise. Behind an interface because pricing always changes. */\ninterface PricingRule { long pricePaise(Show show, Seat seat); }\n\n/** The base rule: a flat price per seat class. A table, not an if-chain, so a new class is one row. */\nclass ClassPricing implements PricingRule {\n    private static final Map<SeatClass, Long> RATE = new EnumMap<>(Map.of(\n        SeatClass.SILVER, 15_000L, SeatClass.GOLD, 25_000L, SeatClass.PLATINUM, 40_000L));\n    /** The class rate, in paise: SILVER 150.00, GOLD 250.00, PLATINUM 400.00. */\n    public long pricePaise(Show show, Seat seat) { return RATE.get(seat.seatClass); }\n}\n\n/**\n * 1.5x (150 per cent) when the SHOW starts on a Saturday or Sunday in the theatre's time zone: a NEW rule\n * that wraps the one it is given (Decorator). Integer paise in, integer paise out: no double touches money.\n */\nclass WeekendSurgePricing implements PricingRule {\n    private final PricingRule base;\n    private final ZoneId zone;\n    private final int percent;                      // 150 = one and a half times\n    WeekendSurgePricing(PricingRule base, ZoneId zone, int percent) { this.base = base; this.zone = zone; this.percent = percent; }\n    public long pricePaise(Show show, Seat seat) {\n        DayOfWeek d = Instant.ofEpochMilli(show.startMs).atZone(zone).getDayOfWeek();\n        boolean weekend = (d == DayOfWeek.SATURDAY || d == DayOfWeek.SUNDAY);\n        long p = base.pricePaise(show, seat);\n        return weekend ? p * percent / 100 : p;     // rounds down to the paisa, in the customer's favour\n    }\n}\n\n// \"give me the best three together\" -> a second rule that changes -> Strategy again\n/**\n * Which seats to hand out when the user asks for a count instead of naming them. Pure: it is given the\n * seats that are free right now, in screen order, and returns the ones to take, or an empty list.\n */\ninterface SeatPolicy { List<ShowSeat> choose(List<ShowSeat> candidates, int count); }\n\n/** Take the first free seats in screen order. The default when nobody cares where they sit. */\nclass AnyFreeSeats implements SeatPolicy {\n    public List<ShowSeat> choose(List<ShowSeat> candidates, int count) {\n        return candidates.size() >= count ? List.copyOf(candidates.subList(0, count)) : List.of();\n    }\n}\n\n/** Take count seats side by side in one row, or nothing at all. Three free seats scattered are not a run. */\nclass AdjacentSeats implements SeatPolicy {\n    public List<ShowSeat> choose(List<ShowSeat> candidates, int count) {\n        for (int i = 0; i + count <= candidates.size(); i++) {\n            boolean run = true;\n            for (int k = 1; k < count && run; k++) {\n                Seat prev = candidates.get(i + k - 1).seat, next = candidates.get(i + k).seat;\n                run = prev.row.equals(next.row) && next.number == prev.number + 1;\n            }\n            if (run) return List.copyOf(candidates.subList(i, i + count));\n        }\n        return List.of();\n    }\n}\n\n/**\n * How money moves. charge takes an idempotency key (a unique id for this payment, so a retry that arrives\n * twice is charged once): at most one successful charge per key, and a repeat returns that charge's\n * reference. It returns null when declined; a declined key may be tried again. refund gives one reference\n * back, at most once. Refund is here because confirm can charge and only then find the hold gone.\n */\ninterface PaymentProcessor {\n    String charge(String idempotencyKey, long paise);\n    void refund(String paymentRef, long paise);\n}\n/** A UPI gateway. Real one: a network call of a second or two, which is why it runs outside the lock. */\nclass UpiPayment implements PaymentProcessor {\n    private final AtomicInteger seq = new AtomicInteger();\n    private final Map<String, String> byKey = new ConcurrentHashMap<>();          // the gateway's memory of keys\n    private final Set<String> refunded = ConcurrentHashMap.newKeySet();\n    public String charge(String key, long paise) { return byKey.computeIfAbsent(key, k -> \"UPI-\" + seq.incrementAndGet()); }\n    public void refund(String ref, long paise) { if (refunded.add(ref)) System.out.println(\"[refund] \" + paise + \" paise against \" + ref); }\n}\n/** A card gateway. Same contract, different rails. */\nclass CardPayment implements PaymentProcessor {\n    private final AtomicInteger seq = new AtomicInteger();\n    private final Map<String, String> byKey = new ConcurrentHashMap<>();\n    private final Set<String> refunded = ConcurrentHashMap.newKeySet();\n    public String charge(String key, long paise) { return byKey.computeIfAbsent(key, k -> \"CARD-\" + seq.incrementAndGet()); }\n    public void refund(String ref, long paise) { if (refunded.add(ref)) System.out.println(\"[refund] \" + paise + \" paise against \" + ref); }\n}\n\n// \"the user should get an SMS, and analytics should count it\" -> publish/subscribe -> Observer\n/**\n * Anyone who wants to hear that a booking changed: an SMS sender, analytics, a data pipe. The service does\n * not know what they are, and calls them after its lock is released.\n */\ninterface BookingObserver { void onBooking(String event, Booking b); }\n\n/** Tells the user. A real one talks to an SMS gateway; a slow one must never be inside the lock. */\nclass SmsNotifier implements BookingObserver {\n    public void onBooking(String event, Booking b) {\n        System.out.println(\"[sms] \" + b.userId + \": booking \" + b.id + \" \" + event + \" seats=\" + b.seatIds());\n    }\n}\n/** Counts events. Proves a second listener costs the booking path nothing. */\nclass Analytics implements BookingObserver {\n    final Map<String, Integer> counts = new ConcurrentHashMap<>();\n    public void onBooking(String event, Booking b) { counts.merge(event, 1, Integer::sum); }\n}\n\n/**\n * The aggregate root (the one object every change to its seats and bookings must go through): one movie on\n * one screen at one time. It owns its per-show seats, its bookings and ONE lock. Every change to a seat\n * happens inside that lock; payment never does.\n */\nfinal class Show {\n    private static final AtomicInteger SEQ = new AtomicInteger();\n    final String id;\n    final String movie;\n    final Screen screen;\n    final long startMs;\n    private final Map<String, ShowSeat> seats = new LinkedHashMap<>();       // seatId -> ShowSeat, O(1), screen order\n    private final Map<String, Booking> bookings = new HashMap<>();           // bookingId -> booking, O(1)\n    private final Map<SeatClass, Integer> free = new EnumMap<>(SeatClass.class);   // AVAILABLE seats per class, O(1)\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Clock clock;\n    private final long holdMs;\n\n    Show(String id, String movie, Screen screen, long startMs, Clock clock, long holdMs) {\n        this.id = id; this.movie = movie; this.screen = screen; this.startMs = startMs;\n        this.clock = clock; this.holdMs = holdMs;\n        for (SeatClass c : SeatClass.values()) free.put(c, 0);\n        for (Seat s : screen.seats) {                       // one ShowSeat per chair: the 6pm and the 9pm show never share a field\n            seats.put(s.id, new ShowSeat(s));\n            free.merge(s.seatClass, 1, Integer::sum);\n        }\n    }\n\n    /**\n     * Hold named seats for a few minutes. Under the lock, in two passes: check every seat is free (a lapsed\n     * hold counts as free), then take them all. One bad seat means nothing was touched.\n     */\n    Booking hold(String userId, List<String> seatIds, PricingRule pricing) {\n        if (seatIds.isEmpty()) throw new IllegalArgumentException(\"ask for at least one seat\");   // no empty, free booking\n        lock.lock();                                        // the whole check-then-take is ONE step: the race lives in the gap\n        try {\n            long now = clock.nowMs();                       // read inside the lock, so two callers cannot disagree about expiry\n            List<ShowSeat> want = new ArrayList<>(seatIds.size());\n            for (String sid : seatIds) {                    // pass one: look, do not touch\n                ShowSeat ss = seats.get(sid);\n                if (ss == null) throw new NoSuchElementException(\"no seat \" + sid + \" in show \" + id);\n                if (want.contains(ss)) throw new IllegalArgumentException(\"seat \" + sid + \" asked for twice\");\n                if (!ss.freeAt(now)) throw new SeatUnavailable(\"seat \" + sid + \" is \" + ss.status);\n                want.add(ss);\n            }\n            for (ShowSeat ss : want) reclaimIfLapsed(ss, now);   // pass two: tidy away any dead hold, then take them all\n            return takeAll(userId, want, pricing, now);\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * Hold a count of seats chosen by the handed-in policy. The choosing and the taking happen in the SAME\n     * locked section, so a run of three cannot be broken between picking it and getting it.\n     */\n    Booking holdBest(String userId, SeatClass cls, int count, SeatPolicy policy, PricingRule pricing) {\n        if (count < 1) throw new IllegalArgumentException(\"ask for at least one seat, not \" + count);\n        lock.lock();\n        try {\n            long now = clock.nowMs();\n            List<ShowSeat> candidates = new ArrayList<>();\n            for (ShowSeat ss : seats.values())              // screen order, so \"adjacent\" means what it says\n                if (ss.seat.seatClass == cls && ss.freeAt(now)) candidates.add(ss);\n            List<ShowSeat> pick = policy.choose(candidates, count);\n            if (pick.size() != count) throw new SeatUnavailable(\"no \" + count + \" \" + cls + \" seats match the policy in \" + id);\n            for (ShowSeat ss : pick) reclaimIfLapsed(ss, now);\n            return takeAll(userId, pick, pricing, now);\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * The commit half of the critical step. Re-checks under the lock that every seat is STILL held by this\n     * booking and still in time, then marks them SOLD. true = this call confirmed it, false = it was already\n     * CONFIRMED by a racing retry (the caller refunds). Throws when the hold lapsed during payment.\n     */\n    boolean commit(Booking b, String paymentRef) {\n        lock.lock();\n        try {\n            if (b.status == BookingStatus.CONFIRMED) return false;      // a second confirm sells nothing twice\n            if (b.status != BookingStatus.PENDING) throw new HoldLapsed(\"booking \" + b.id + \" is \" + b.status);\n            long now = clock.nowMs();\n            for (ShowSeat ss : b.seats)                                 // THE check that makes double-selling impossible\n                if (ss.status != SeatStatus.HELD || !b.id.equals(ss.holdBookingId) || ss.holdExpiresMs <= now) {\n                    expireLocked(b);\n                    throw new HoldLapsed(\"the hold on \" + ss.seat.id + \" lapsed while the card was being charged\");\n                }\n            for (ShowSeat ss : b.seats) {                               // only now, and all of them\n                ss.status = SeatStatus.SOLD; ss.holdBookingId = null; ss.holdExpiresMs = 0;\n            }\n            b.paymentRef = paymentRef;\n            b.status = BookingStatus.CONFIRMED;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * Give the seats back now instead of waiting for the clock: the user closed the tab, or the caller gave up.\n     * True only if this call ended a PENDING booking; a confirmed or already-dead booking is left alone.\n     */\n    boolean release(Booking b) {\n        lock.lock();\n        try {\n            if (b.status != BookingStatus.PENDING) return false;\n            expireLocked(b);\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n    /** Undo a sale: every seat goes back to AVAILABLE, the booking to CANCELLED. Returns what must be refunded. */\n    long cancel(Booking b) {\n        lock.lock();\n        try {\n            if (b.status != BookingStatus.CONFIRMED) throw new IllegalStateException(\"booking \" + b.id + \" is \" + b.status);\n            for (ShowSeat ss : b.seats) { ss.status = SeatStatus.AVAILABLE; free.merge(ss.seat.seatClass, 1, Integer::sum); }\n            b.status = BookingStatus.CANCELLED;\n            return b.amountPaise;\n        } finally { lock.unlock(); }\n    }\n\n    /** A booking of this show by id, or null. O(1). */\n    Booking booking(String bookingId) { lock.lock(); try { return bookings.get(bookingId); } finally { lock.unlock(); } }\n\n    /**\n     * How many seats of a class are neither held nor sold. O(1): a counter, never a scan. A lapsed hold is\n     * counted back when something reclaims it (the next hold, or the sweeper), so this can read a little low.\n     */\n    int freeCount(SeatClass cls) { lock.lock(); try { return free.get(cls); } finally { lock.unlock(); } }\n\n    /** What one seat looks like to a user: a lapsed hold is drawn as free. O(1). */\n    SeatStatus statusOf(String seatId) {\n        lock.lock();\n        try {\n            ShowSeat ss = seats.get(seatId);\n            if (ss == null) throw new NoSuchElementException(\"no seat \" + seatId + \" in show \" + id);\n            return ss.freeAt(clock.nowMs()) ? SeatStatus.AVAILABLE : ss.status;\n        } finally { lock.unlock(); }\n    }\n\n    /** The whole seat map for the screen. A snapshot for drawing, not a promise: only a hold promises. */\n    Map<String, SeatStatus> seatMap() {\n        lock.lock();\n        try {\n            long now = clock.nowMs();\n            Map<String, SeatStatus> out = new LinkedHashMap<>();\n            for (ShowSeat ss : seats.values()) out.put(ss.seat.id, ss.freeAt(now) ? SeatStatus.AVAILABLE : ss.status);\n            return out;\n        } finally { lock.unlock(); }\n    }\n\n    /** Hand back every hold that has already lapsed. The display gets tidier; correctness never needed it. */\n    int sweepExpired() {\n        lock.lock();\n        try {\n            long now = clock.nowMs(); int freed = 0;\n            for (ShowSeat ss : seats.values()) if (ss.status == SeatStatus.HELD && ss.holdExpiresMs <= now) { reclaimIfLapsed(ss, now); freed++; }\n            return freed;\n        } finally { lock.unlock(); }\n    }\n\n    // ---- everything below runs with the lock already held ----\n\n    /** Price the seats, stamp the hold on each of them, and register the booking. Lock held. */\n    private Booking takeAll(String userId, List<ShowSeat> want, PricingRule pricing, long now) {\n        long total = 0;\n        for (ShowSeat ss : want) total += pricing.pricePaise(this, ss.seat);   // arithmetic on fields we already have: microseconds\n        Booking b = new Booking(\"BK\" + SEQ.incrementAndGet(), this, userId, want, total, now + holdMs);\n        for (ShowSeat ss : want) {\n            ss.status = SeatStatus.HELD; ss.holdBookingId = b.id; ss.holdExpiresMs = b.holdExpiresMs;\n            free.merge(ss.seat.seatClass, -1, Integer::sum);\n        }\n        bookings.put(b.id, b);\n        return b;\n    }\n\n    /** Lazy expiry: a hold whose time has passed is reclaimed the next time anybody looks at the seat. Lock held. */\n    private void reclaimIfLapsed(ShowSeat ss, long now) {\n        if (ss.status != SeatStatus.HELD || ss.holdExpiresMs > now) return;\n        Booking dead = bookings.get(ss.holdBookingId);\n        if (dead != null) expireLocked(dead); else freeSeat(ss);\n    }\n\n    /** Free every seat still stamped with this booking, and mark the booking EXPIRED. Lock held. */\n    private void expireLocked(Booking b) {\n        for (ShowSeat ss : b.seats)\n            if (ss.status == SeatStatus.HELD && b.id.equals(ss.holdBookingId)) freeSeat(ss);\n        if (b.status == BookingStatus.PENDING) b.status = BookingStatus.EXPIRED;\n    }\n\n    /** One seat back to AVAILABLE, and the class counter up by one. Lock held. */\n    private void freeSeat(ShowSeat ss) {\n        ss.status = SeatStatus.AVAILABLE; ss.holdBookingId = null; ss.holdExpiresMs = 0;\n        free.merge(ss.seat.seatClass, 1, Integer::sum);\n    }\n}\n\n/**\n * The orchestrator. It sequences hold, then payment OUTSIDE any lock, then commit; it owns no seat state of\n * its own, only the shows, a booking-id index, the handed-in rules and the listeners.\n */\nfinal class BookingService {\n    private final Map<String, Show> shows = new ConcurrentHashMap<>();\n    private final Map<String, Show> byBooking = new ConcurrentHashMap<>();    // bookingId -> its show: O(1) routing\n    private final List<BookingObserver> observers = new CopyOnWriteArrayList<>();\n    private volatile PricingRule pricing = new ClassPricing();                // volatile: a swap is seen by every\n    private volatile SeatPolicy policy = new AnyFreeSeats();                  // booking thread at once\n\n    /** Hand in the rules. The service never builds one, so swapping is a new class and this line. */\n    void configure(PricingRule pricing, SeatPolicy policy) { this.pricing = pricing; this.policy = policy; }\n    void addShow(Show s) { shows.put(s.id, s); }\n    void addObserver(BookingObserver o) { observers.add(o); }\n    /** A show by id, O(1). Throws if the id is unknown. */\n    Show show(String showId) {\n        Show s = shows.get(showId);\n        if (s == null) throw new NoSuchElementException(\"no show \" + showId);\n        return s;\n    }\n\n    /** Step one of the flow: hold the named seats for a few minutes. Returns a PENDING booking. */\n    Booking hold(String showId, String userId, List<String> seatIds) {\n        Show s = show(showId);\n        Booking b = s.hold(userId, seatIds, pricing);\n        byBooking.put(b.id, s);\n        return b;\n    }\n\n    /** Same, but the policy picks the seats: \"three together in gold\". All-or-nothing, inside one lock. */\n    Booking holdBest(String showId, String userId, SeatClass cls, int count) {\n        Show s = show(showId);\n        Booking b = s.holdBest(userId, cls, count, policy, pricing);\n        byBooking.put(b.id, s);\n        return b;\n    }\n\n    /**\n     * Steps two and three: charge the card with NO lock held, then commit under the show's lock, which\n     * re-checks the hold. The booking id is the idempotency key, so a retry or a double tap is charged once.\n     * A decline releases nothing; a lapsed hold refunds. Listeners hear after the lock.\n     */\n    Booking confirm(String bookingId, PaymentProcessor pay) {\n        Booking b = find(bookingId);\n        if (b.status != BookingStatus.PENDING)                                  // a confirm after the end is refused before any money moves\n            throw new IllegalStateException(\"booking \" + bookingId + \" is \" + b.status);\n        String ref = pay.charge(b.id, b.amountPaise);                           // OUTSIDE the lock: a gateway takes a second or two\n        if (ref == null) throw new PaymentDeclined(\"gateway declined \" + b.amountPaise + \" paise; the hold runs to its expiry\");\n        boolean mine;\n        try { mine = b.show.commit(b, ref); }\n        catch (RuntimeException e) { pay.refund(ref, b.amountPaise); throw e; } // money moved, the seats did not: give it back\n        if (!mine) {                                                            // a racing confirm got there first\n            if (!ref.equals(b.paymentRef)) pay.refund(ref, b.amountPaise);      // same key = same charge; refund only a second one\n            return b;\n        }\n        publish(\"CONFIRMED\", b);                                                // listeners AFTER the lock, never inside it\n        return b;\n    }\n\n    /** Give a hold back early instead of waiting for it to lapse. Listeners hear only if a hold really ended. */\n    void release(String bookingId) {\n        Booking b = find(bookingId);\n        if (b.show.release(b)) publish(\"EXPIRED\", b);\n    }\n\n    /** Undo a confirmed booking: seats back first, money back second, listeners last. */\n    void cancel(String bookingId, PaymentProcessor pay) {\n        Booking b = find(bookingId);\n        long amount = b.show.cancel(b);              // under the lock: the seats are on sale again immediately\n        pay.refund(b.paymentRef, amount);            // after the lock: a slow refund never holds a seat hostage\n        publish(\"CANCELLED\", b);\n    }\n\n    /** A booking by id, across every show. O(1). */\n    Booking find(String bookingId) {\n        Show s = byBooking.get(bookingId);\n        if (s == null) throw new NoSuchElementException(\"no booking \" + bookingId);\n        return s.booking(bookingId);\n    }\n\n    /** Tell every listener, outside the lock, and survive a broken one. */\n    private void publish(String event, Booking b) {\n        for (BookingObserver o : observers) {\n            try { o.onBooking(event, b); } catch (RuntimeException e) { System.err.println(\"[listener failed] \" + e.getMessage()); }\n        }\n    }\n}\n\n/**\n * Proof it works: two shows on one screen, a hold-pay-confirm, a decline that keeps the seat, three seats\n * together, a cancel, and fifty phones racing for one seat with exactly one winner.\n */\npublic class Main {\n    /** A small auditorium: row A silver, row B gold, row C platinum. */\n    static Screen auditorium(String id) {\n        List<Seat> seats = new ArrayList<>();\n        for (int i = 1; i <= 6; i++) seats.add(new Seat(\"A\", i, SeatClass.SILVER));\n        for (int i = 1; i <= 6; i++) seats.add(new Seat(\"B\", i, SeatClass.GOLD));\n        for (int i = 1; i <= 4; i++) seats.add(new Seat(\"C\", i, SeatClass.PLATINUM));\n        return new Screen(id, seats);\n    }\n    static String rupees(long paise) { return \"Rs \" + (paise / 100) + \".\" + String.format(\"%02d\", paise % 100); }\n\n    public static void main(String[] args) throws Exception {\n        long[] now = { Instant.parse(\"2026-09-15T12:00:00Z\").toEpochMilli() };   // a Tuesday\n        Clock clock = () -> now[0];\n        Screen audi = auditorium(\"AUDI-1\");\n        Theatre pvr = new Theatre(\"FORUM\", \"Bengaluru\", List.of(audi));\n        long fiveMinutes = 5 * 60_000L;\n        Show six  = new Show(\"SH-6PM\", \"Interstellar\", audi, Instant.parse(\"2026-09-15T18:00:00Z\").toEpochMilli(), clock, fiveMinutes);\n        Show nine = new Show(\"SH-9PM\", \"Interstellar\", audi, Instant.parse(\"2026-09-15T21:00:00Z\").toEpochMilli(), clock, fiveMinutes);\n\n        BookingService svc = new BookingService();\n        svc.configure(new ClassPricing(), new AdjacentSeats());\n        svc.addShow(six); svc.addShow(nine);\n        svc.addObserver(new SmsNotifier());\n        Analytics analytics = new Analytics();\n        svc.addObserver(analytics);\n        System.out.println(pvr.city + \" / \" + pvr.id + \" / \" + audi.id + \": \" + audi.seats.size() + \" seats, two shows\");\n\n        // hold -> pay -> confirm\n        Booking b1 = svc.hold(\"SH-6PM\", \"asha\", List.of(\"B4\"));\n        System.out.println(\"held \" + b1.seatIds() + \" for \" + b1.userId + \" at \" + rupees(b1.amountPaise) + \", booking \" + b1.id);\n        svc.confirm(b1.id, new UpiPayment());\n        System.out.println(\"6pm B4 = \" + six.statusOf(\"B4\") + \" | 9pm B4 = \" + nine.statusOf(\"B4\") + \"  (same chair, different show)\");\n\n        // the card is declined: the seat stays held, and comes back by itself when the hold lapses\n        Booking b2 = svc.hold(\"SH-6PM\", \"raj\", List.of(\"C1\"));\n        try { svc.confirm(b2.id, declining()); } catch (PaymentDeclined e) { System.out.println(\"expected: \" + e.getMessage()); }\n        System.out.println(\"after the decline C1 = \" + six.statusOf(\"C1\") + \", booking \" + b2.id + \" is \" + b2.status);\n        now[0] += fiveMinutes + 1;                       // the user walked away; five minutes pass\n        System.out.println(\"five minutes later C1 = \" + six.statusOf(\"C1\") + \" (nobody swept it; a lapsed hold simply reads as free)\");\n\n        // three seats together, or nothing\n        PaymentProcessor card = new CardPayment();\n        Booking b3 = svc.holdBest(\"SH-6PM\", \"meena\", SeatClass.GOLD, 3);\n        svc.confirm(b3.id, card);\n        System.out.println(\"three together: \" + b3.seatIds() + \" for \" + rupees(b3.amountPaise));\n        System.out.println(\"gold free now: \" + six.freeCount(SeatClass.GOLD) + \" of 6\");\n\n        // a cancel puts the seats back on sale, refunded through the gateway that took the money\n        svc.cancel(b3.id, card);\n        System.out.println(\"after cancel, gold free: \" + six.freeCount(SeatClass.GOLD) + \", B1 = \" + six.statusOf(\"B1\"));\n\n        // weekend surge is a new class and one line\n        Show sat = new Show(\"SH-SAT\", \"Interstellar\", audi, Instant.parse(\"2026-09-19T18:00:00Z\").toEpochMilli(), clock, fiveMinutes);\n        svc.addShow(sat);\n        svc.configure(new WeekendSurgePricing(new ClassPricing(), ZoneId.of(\"Asia/Kolkata\"), 150), new AdjacentSeats());\n        Booking b4 = svc.hold(\"SH-SAT\", \"vikram\", List.of(\"C2\"));\n        System.out.println(\"Saturday platinum: \" + rupees(b4.amountPaise) + \" (weekday was \" + rupees(40_000) + \")\");\n        svc.release(b4.id);\n\n        // fifty phones, one seat, one latch: exactly one hold\n        ExecutorService pool = Executors.newFixedThreadPool(50);                  // one thread per phone: all fifty wait at the latch\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<Booking>> tries = new ArrayList<>();\n        for (int i = 0; i < 50; i++) {\n            String user = \"fan-\" + i;\n            tries.add(pool.submit(() -> { go.await(); return svc.hold(\"SH-9PM\", user, List.of(\"C4\")); }));\n        }\n        go.countDown();\n        int wins = 0; String winner = null;\n        for (Future<Booking> f : tries) {\n            try { winner = f.get().userId; wins++; } catch (ExecutionException e) { /* SeatUnavailable for the 49 losers */ }\n        }\n        pool.shutdown();\n        System.out.println(\"fifty phones, one seat C4: winners = \" + wins + \" (must be 1), \" + winner + \" got it\");\n        if (wins != 1) throw new AssertionError(\"the same seat was held twice\");\n        System.out.println(\"analytics: \" + analytics.counts);\n    }\n\n    /** A gateway that always says no, for the decline path. */\n    static PaymentProcessor declining() {\n        return new PaymentProcessor() {\n            public String charge(String key, long paise) { return null; }\n            public void refund(String ref, long paise) { }\n        };\n    }\n}\n", "f1": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.time.*;\n\n// ---- ext: a background sweeper reclaims lapsed holds -- for the display, never for correctness\n/**\n * Walks every show every few seconds and hands lapsed holds back. Correctness never depended on it: a\n * lapsed hold is already treated as free by the next caller. This only makes the free count catch up sooner.\n */\nclass HoldSweeper {\n    private final List<Show> shows;\n    private final ScheduledExecutorService timer = Executors.newSingleThreadScheduledExecutor(\n        r -> { Thread t = new Thread(r, \"sweeper\"); t.setDaemon(true); return t; });\n    HoldSweeper(List<Show> shows) { this.shows = shows; }\n    /** Start sweeping. Each pass takes each show's lock for a few microseconds and releases it. */\n    void start(long everyMs) {\n        timer.scheduleAtFixedRate(() -> {\n            for (Show s : shows) {\n                try { s.sweepExpired(); } catch (RuntimeException e) { /* one bad show must not kill the timer */ }\n            }\n        }, everyMs, everyMs, TimeUnit.MILLISECONDS);\n    }\n    void stop() { timer.shutdownNow(); }\n    /** One pass by hand, for tests: how many holds were reclaimed. */\n    int sweepOnce() { int n = 0; for (Show s : shows) n += s.sweepExpired(); return n; }\n}\n// A DelayQueue<Booking> (Java's queue that hands out each item only when its time comes) keyed on holdExpiresMs\n// is the same idea without the polling. Both are optimisations of the lazy path.\n\n// ---- ext: many theatres and screens -- search is an index hop, and each show carries its own lock\n/**\n * The read path: city, then movie, then that movie's shows sorted by start time. A time window is a range\n * read on the sorted map, so tonight's search never walks next week's shows. It never takes a show's lock,\n * so browsing cannot slow booking down.\n */\nclass ShowIndex {\n    /** One show as search sees it: the theatre it is in, and the show. */\n    record Listing(String theatreId, Show show) {}\n    // city -> movie -> start time -> listings. ConcurrentSkipListMap is Java's thread-safe sorted map.\n    private final Map<String, Map<String, ConcurrentSkipListMap<Long, List<Listing>>>> index = new ConcurrentHashMap<>();\n    /** Register a show for search. Setup, or whenever a theatre publishes a new day. */\n    void add(Theatre theatre, Show show) {\n        index.computeIfAbsent(theatre.city, c -> new ConcurrentHashMap<>())\n             .computeIfAbsent(show.movie, m -> new ConcurrentSkipListMap<>())\n             .computeIfAbsent(show.startMs, t -> new CopyOnWriteArrayList<>()).add(new Listing(theatre.id, show));\n    }\n    /** Shows of one movie in one city that start inside [fromMs, toMs), earliest first. Two hops, then O(log n + k). */\n    List<Listing> search(String city, String movie, long fromMs, long toMs) {\n        ConcurrentSkipListMap<Long, List<Listing>> byStart = index.getOrDefault(city, Map.of()).get(movie);\n        List<Listing> out = new ArrayList<>();\n        if (byStart != null) for (List<Listing> same : byStart.subMap(fromMs, true, toMs, false).values()) out.addAll(same);\n        return out;\n    }\n    /** The machine-coding \"list cinemas\" call: theatres in a city showing a movie in the window, sorted by id. */\n    SortedSet<String> cinemas(String city, String movie, long fromMs, long toMs) {\n        SortedSet<String> out = new TreeSet<>();\n        for (Listing l : search(city, movie, fromMs, toMs)) out.add(l.theatreId());\n        return out;\n    }\n}\n\n// ---- ext: a waitlist -- when a seat comes back, the head of the queue gets it held for them\n/**\n * One queue per show and class. Whoever sees a seat come back calls offer: a listener on CANCELLED, or the\n * sweeper for a lapsed hold. The first person waiting gets that seat HELD in their name for the usual\n * window, so the offer is a real hold, not an email telling them to go and race for it.\n */\nclass Waitlist {\n    private final Map<String, Deque<String>> queues = new ConcurrentHashMap<>();\n    private static String key(Show s, SeatClass c) { return s.id + \"/\" + c; }\n    /** Join the back of the queue for this show and class. */\n    void join(Show show, SeatClass cls, String userId) {\n        queues.computeIfAbsent(key(show, cls), k -> new ConcurrentLinkedDeque<>()).add(userId);\n    }\n    /** How many are waiting. */\n    int size(Show show, SeatClass cls) { Deque<String> q = queues.get(key(show, cls)); return q == null ? 0 : q.size(); }\n    /**\n     * A seat became free: hold it for the head of the queue and hand back their booking, or null when\n     * nobody is waiting or somebody else already took it.\n     */\n    Booking offer(BookingService svc, Show show, SeatClass cls, String seatId) {\n        Deque<String> q = queues.get(key(show, cls));\n        String user = q == null ? null : q.poll();\n        if (user == null) return null;\n        try { return svc.hold(show.id, user, List.of(seatId)); }\n        catch (SeatUnavailable e) { q.addFirst(user); return null; }        // somebody was faster: keep their place\n    }\n}\n\n// ---- ext: dynamic pricing and coupons -- new rules behind the same one-method interface\n/** The price climbs as the class fills: full price when empty, up to 1.6x when sold out. Integer paise, rounded down. */\nclass DemandPricing implements PricingRule {\n    private final PricingRule base;\n    DemandPricing(PricingRule base) { this.base = base; }\n    public long pricePaise(Show show, Seat seat) {\n        int total = 0; for (Seat s : show.screen.seats) if (s.seatClass == seat.seatClass) total++;\n        if (total == 0) return base.pricePaise(show, seat);\n        long taken = total - show.freeCount(seat.seatClass);   // re-takes the show's lock: a ReentrantLock lets its holder back in\n        return base.pricePaise(show, seat) * (100L * total + 60L * taken) / (100L * total);\n    }\n}\n/** A coupon takes a percentage off whatever the rule under it decided. Another Decorator, same interface. */\nclass CouponPricing implements PricingRule {\n    private final PricingRule base; private final int percentOff;\n    CouponPricing(PricingRule base, int percentOff) {\n        if (percentOff < 0 || percentOff > 100) throw new IllegalArgumentException(\"a coupon is 0 to 100 per cent off, not \" + percentOff);\n        this.base = base; this.percentOff = percentOff;\n    }\n    public long pricePaise(Show show, Seat seat) { return base.pricePaise(show, seat) * (100 - percentOff) / 100; }\n}\n\n// ---- ext: persistence -- the seat claim becomes a conditional UPDATE, the database's compare-and-set\n/**\n * The tables are the classes: movie, theatre, screen, seat, show, booking, booking_seat, and show_seat with\n * one row per seat per show, the only table the race touches:\n *   show_seat(show_id, seat_id, status, hold_booking, hold_expires)   primary key (show_id, seat_id)\n * A hold is a status and an expiry time on that row (its TTL), never a database lock held across payment.\n * A group claim is ONE transaction. Optimistic: one conditional UPDATE, and the row count decides:\n *   UPDATE show_seat SET status='HELD', hold_booking=?, hold_expires=?\n *    WHERE show_id=? AND seat_id IN (?,?,?)\n *      AND (status='AVAILABLE' OR (status='HELD' AND hold_expires <= ?))\n *   -- 3 rows changed: COMMIT.  Fewer: ROLLBACK, somebody else won a seat.\n * Pessimistic, same result: SELECT ... WHERE show_id=? AND seat_id IN (...) FOR UPDATE; check; UPDATE; COMMIT.\n */\ninterface ShowSeatRepository {\n    /** The group claim above: every seat HELD for this booking, or none of them. */\n    boolean claimAll(String showId, List<String> seatIds, String bookingId, long expiresMs, long nowMs);\n    /** UPDATE show_seat SET status='SOLD' WHERE show_id=? AND seat_id=? AND status='HELD' AND hold_booking=? AND hold_expires > ? */\n    boolean sell(String showId, String seatId, String bookingId, long nowMs);\n    String status(String showId, String seatId);\n}\n/**\n * A stand-in for the database: one row per show and seat, and every write is a compare-and-set on the row.\n * A refused row is \"zero rows updated\": somebody else got there first, exactly the answer the lock gave.\n * The group claim takes rows in seat-id order and puts back the ones it took if any row refuses: the ROLLBACK.\n */\nclass ConditionalRowStore implements ShowSeatRepository {\n    /** One row: the three columns that decide the race. */\n    record Row(String status, String bookingId, long expiresMs) {}\n    private final ConcurrentHashMap<String, Row> rows = new ConcurrentHashMap<>();\n    private static String k(String showId, String seatId) { return showId + \"#\" + seatId; }\n    void put(String showId, String seatId) { rows.put(k(showId, seatId), new Row(\"AVAILABLE\", null, 0)); }\n    public boolean claimAll(String showId, List<String> seatIds, String bookingId, long expiresMs, long nowMs) {\n        Row mine = new Row(\"HELD\", bookingId, expiresMs);\n        Map<String, Row> taken = new LinkedHashMap<>();                          // key -> the row as it was\n        for (String seatId : new TreeSet<>(seatIds)) {                           // one fixed order for every caller\n            String key = k(showId, seatId);\n            Row cur = rows.get(key);\n            boolean claimable = cur != null && (cur.status().equals(\"AVAILABLE\")\n                || (cur.status().equals(\"HELD\") && cur.expiresMs() <= nowMs));   // the WHERE clause, for one row\n            if (claimable && rows.replace(key, cur, mine)) { taken.put(key, cur); continue; }\n            taken.forEach((kk, was) -> rows.replace(kk, mine, was));             // ROLLBACK: nothing stays HELD\n            return false;\n        }\n        return true;                                                             // COMMIT\n    }\n    public boolean sell(String showId, String seatId, String bookingId, long nowMs) {\n        String key = k(showId, seatId);\n        Row cur = rows.get(key);\n        if (cur == null || !cur.status().equals(\"HELD\")\n            || !bookingId.equals(cur.bookingId()) || cur.expiresMs() <= nowMs) return false;\n        return rows.replace(key, cur, new Row(\"SOLD\", bookingId, 0));\n    }\n    public String status(String showId, String seatId) { Row r = rows.get(k(showId, seatId)); return r == null ? null : r.status(); }\n}\n\n// ---- ext: the payment webhook -- the gateway reports one payment three times; the seats are sold once\n/**\n * A webhook (the gateway calling our server back to report a payment) can arrive more than once, and after\n * the app's own confirm. It charges nothing: it commits with the reference it was told. A repeat finds the\n * booking CONFIRMED with that same reference and does nothing; a payment we cannot use goes back, once.\n */\nclass PaymentWebhook {\n    private final BookingService svc;\n    final AtomicInteger commits = new AtomicInteger();\n    PaymentWebhook(BookingService svc) { this.svc = svc; }\n    /** One callback, \"this payment succeeded for this booking\". Safe to receive any number of times. */\n    Booking onPaymentCaptured(String bookingId, String paymentRef, PaymentProcessor pay) {\n        Booking b = svc.find(bookingId);\n        try {\n            if (b.show.commit(b, paymentRef)) { commits.incrementAndGet(); return b; }   // the first report sells the seats\n            if (paymentRef.equals(b.paymentRef)) return b;                              // the same payment again: nothing to do\n        } catch (HoldLapsed e) { /* the hold died before the gateway called back */ }\n        pay.refund(paymentRef, b.amountPaise);                                          // a second payment, or a dead hold\n        return null;\n    }\n}\n\n// ---- ext: a gateway that times out -- the third outcome, and the reconciliation that closes it\n/**\n * The gateway neither approved nor declined: the call timed out. The money may have moved and may not\n * have. Until somebody finds out which, nothing may be confirmed and nothing may be released.\n */\nclass PaymentUnknown extends RuntimeException { PaymentUnknown(String m) { super(m); } }\n\n/** Asks the gateway what happened under one idempotency key: the reference if it charged, null if it never did. */\ninterface PaymentQuery { String refFor(String idempotencyKey); }\n\n/**\n * Confirm that survives a timeout. The gateway was given the booking id as the idempotency key, so a\n * timeout leaves a booking still PENDING, its seats still HELD, and a key to ask about. If the user presses\n * Pay again, confirm simply runs again: the same key is never charged twice. If the user has gone, settle()\n * asks the gateway, then finishes the booking with the reference it already has, or gives the money back.\n */\nclass ReconcilingConfirm {\n    private final BookingService svc;\n    private final PaymentQuery query;\n    ReconcilingConfirm(BookingService svc, PaymentQuery query) { this.svc = svc; this.query = query; }\n    /** Try to confirm. A timeout is not a failure: it returns null and changes nothing at all. */\n    Booking confirm(String bookingId, PaymentProcessor pay) {\n        try { return svc.confirm(bookingId, pay); }\n        catch (PaymentUnknown e) { return null; }                // seats still HELD, booking still PENDING\n    }\n    /** Minutes later, with nobody pressing Pay: ask the gateway by key, then finish the job or hand the money back. */\n    Booking settle(String bookingId, PaymentProcessor pay) {\n        Booking b = svc.find(bookingId);\n        if (b.status == BookingStatus.CONFIRMED) return b;       // a retry already finished it\n        String ref = query.refFor(b.id);                         // the key the gateway was given: the booking id\n        if (ref == null) return null;                            // it never charged: let the hold lapse by itself\n        try { if (b.show.commit(b, ref) || ref.equals(b.paymentRef)) return b; }   // commit with THAT ref: no second charge\n        catch (HoldLapsed e) { /* the hold died while the outcome was unknown */ }\n        pay.refund(ref, b.amountPaise);                          // money moved, the seat did not: give it back\n        return null;\n    }\n}\n\n// ---- ext: a refund policy -- how much money comes back depends on how close the show is\n/** How much of a cancelled booking is returned, in paise. Another rule that changes, so another interface. */\ninterface RefundPolicy { long refundPaise(Booking b, long nowMs); }\n\n/** The usual cinema rule: everything back until two hours before, half until twenty minutes, nothing after. */\nclass TieredRefund implements RefundPolicy {\n    public long refundPaise(Booking b, long nowMs) {\n        long minutesToShow = (b.show.startMs - nowMs) / 60_000L;\n        if (minutesToShow >= 120) return b.amountPaise;\n        if (minutesToShow >= 20) return b.amountPaise / 2;       // integer paise: half of 25,000 is 12,500 exactly\n        return 0;                                                // the seat still comes back; the money does not\n    }\n}\n\n/**\n * Cancel with a policy. The seat returns to the market whatever the money does: the amount is decided from\n * frozen fields before anything moves, the seats come back under the show's lock, the refund is sent after.\n */\nclass CancelWithRefund {\n    private final BookingService svc;\n    private final RefundPolicy policy;\n    private final Clock clock;\n    CancelWithRefund(BookingService svc, RefundPolicy policy, Clock clock) { this.svc = svc; this.policy = policy; this.clock = clock; }\n    /** Cancel, and return the paise actually sent back. */\n    long cancel(String bookingId, PaymentProcessor pay) {\n        Booking b = svc.find(bookingId);\n        long back = policy.refundPaise(b, clock.nowMs());        // decided before the seats move\n        b.show.cancel(b);                                        // under the lock: on sale again immediately\n        if (back > 0) pay.refund(b.paymentRef, back);            // outside the lock: a slow refund holds no seat\n        return back;\n    }\n}\n\n// ---- ext: a cap per user -- one script must not hold the whole house\n/**\n * At most N seats per user per show, counting only what they hold or bought RIGHT NOW: a lapsed hold, a\n * release and a cancel give the quota back by themselves. One user's requests queue on a small per-user\n * lock, so two threads of one script can never both see \"one seat left\". The order is always the user's\n * lock, then the show's lock inside svc.hold, so the two can never deadlock.\n */\nclass SeatCap {\n    private final int maxPerUser;\n    private final Clock clock;\n    private final ConcurrentHashMap<String, List<Booking>> byUser = new ConcurrentHashMap<>();   // \"show/user\" -> bookings\n    SeatCap(int maxPerUser, Clock clock) { this.maxPerUser = maxPerUser; this.clock = clock; }\n    /** Hold through the cap. Throws SeatUnavailable when this user is already at their limit for this show. */\n    Booking hold(BookingService svc, String showId, String userId, List<String> seatIds) {\n        List<Booking> mine = byUser.computeIfAbsent(showId + \"/\" + userId, k -> new ArrayList<>());\n        synchronized (mine) {                                     // count and hold are one step for this user\n            if (live(mine) + seatIds.size() > maxPerUser)\n                throw new SeatUnavailable(userId + \" is at the limit of \" + maxPerUser + \" seats for \" + showId);\n            Booking b = svc.hold(showId, userId, seatIds);\n            mine.add(b);\n            return b;\n        }\n    }\n    /** How many seats this user holds or bought right now, for the message the app shows them. */\n    int used(String showId, String userId) {\n        List<Booking> mine = byUser.get(showId + \"/\" + userId);\n        if (mine == null) return 0;\n        synchronized (mine) { return live(mine); }\n    }\n    private int live(List<Booking> mine) {\n        long now = clock.nowMs(); int n = 0;\n        for (Booking b : mine)\n            if (b.status == BookingStatus.CONFIRMED || (b.status == BookingStatus.PENDING && b.holdExpiresMs > now)) n += b.seats.size();\n        return n;\n    }\n}\n\n// ---- ext: per-seat compare-and-set instead of the show lock -- more concurrency, real rollback\n/** One seat claimed without any lock: the holder is swapped from null to a booking id in one hardware step. */\nclass CasSeat {\n    final String id;\n    private final AtomicReference<String> holder = new AtomicReference<>();\n    CasSeat(String id) { this.id = id; }\n    boolean tryHold(String bookingId) { return holder.compareAndSet(null, bookingId); }   // exactly one caller wins\n    void release(String bookingId) { holder.compareAndSet(bookingId, null); }             // never drop somebody else's hold\n    String holder() { return holder.get(); }\n}\n/**\n * The lock-free version of a group hold: take the seats one at a time, in seat-id order, and on the first\n * refusal give back everything already taken. The fixed order means two groups asking for the same seats\n * cannot each take one and both give up. More concurrency than one lock; the rollback is the price.\n */\nclass CasShow {\n    private final Map<String, CasSeat> seats = new LinkedHashMap<>();\n    void add(CasSeat s) { seats.put(s.id, s); }\n    List<CasSeat> hold(List<String> ids, String bookingId) {\n        List<CasSeat> got = new ArrayList<>();\n        for (String id : new TreeSet<>(ids)) {                                  // one fixed order for every caller\n            CasSeat s = seats.get(id);\n            if (s != null && s.tryHold(bookingId)) { got.add(s); continue; }\n            for (CasSeat back : got) back.release(bookingId);                 // all-or-nothing, by hand\n            return List.of();\n        }\n        return got;\n    }\n}\n// Once there are four app servers, no JVM lock and no AtomicReference helps: the hold must live outside the\n// process. SET seatKey bookingId NX PX 300000 is this same compare-and-set, and releasing it is a\n// compare-and-delete so one server can never drop another server's hold. A group needs all its keys in one\n// step: one Lua script (a small program Redis runs without interruption) checks every key, then sets them all.\n\n/** Runs every extension once so the reference code on page 05 is code that actually executed. */\nclass ExtDemo {\n    static Screen smallScreen() {\n        List<Seat> seats = new ArrayList<>();\n        for (int i = 1; i <= 4; i++) seats.add(new Seat(\"A\", i, SeatClass.SILVER));\n        for (int i = 1; i <= 4; i++) seats.add(new Seat(\"B\", i, SeatClass.GOLD));\n        return new Screen(\"EXT-1\", seats);\n    }\n    public static void main(String[] args) throws Exception {\n        long[] now = { Instant.parse(\"2026-09-15T12:00:00Z\").toEpochMilli() };\n        Clock clock = () -> now[0];\n        long hold = 60_000L;\n        Screen sc = smallScreen();\n        Theatre forum = new Theatre(\"FORUM\", \"Bengaluru\", List.of(sc));\n        Show six  = new Show(\"X-6PM\", \"Dune\", sc, Instant.parse(\"2026-09-15T18:00:00Z\").toEpochMilli(), clock, hold);\n        Show nine = new Show(\"X-9PM\", \"Dune\", sc, Instant.parse(\"2026-09-15T21:00:00Z\").toEpochMilli(), clock, hold);\n        BookingService svc = new BookingService();\n        svc.addShow(six); svc.addShow(nine);\n\n        // search across shows: an index hop and a range read, no lock taken\n        ShowIndex index = new ShowIndex(); index.add(forum, six); index.add(forum, nine);\n        long dayStart = Instant.parse(\"2026-09-15T00:00:00Z\").toEpochMilli();\n        System.out.println(\"search Bengaluru/Dune today: \" + index.search(\"Bengaluru\", \"Dune\", dayStart, dayStart + 86_400_000L).size()\n            + \" shows, cinemas \" + index.cinemas(\"Bengaluru\", \"Dune\", dayStart, dayStart + 86_400_000L));\n\n        // sweeper: a lapsed hold is already free, the sweep only tidies the count\n        Booking abandoned = svc.hold(\"X-6PM\", \"ghost\", List.of(\"A1\"));\n        now[0] += hold + 1;\n        HoldSweeper sweeper = new HoldSweeper(List.of(six, nine));\n        System.out.println(\"before the sweep A1 shows as \" + six.statusOf(\"A1\") + \"; the sweep reclaimed \" + sweeper.sweepOnce() + \" hold, booking is \" + abandoned.status);\n\n        // dynamic pricing and a coupon stack on the flat rule\n        PricingRule demand = new CouponPricing(new DemandPricing(new ClassPr

rivate int waitingWriters;\n\n    /** Get in as a reader. The predicate is tested under the monitor, in a while loop, as in Main.java. */\n    synchronized void lockRead() throws InterruptedException {\n        while (writer || waitingWriters &gt; 0) wait();      // while, never if: wait() also returns on its own\n        readers++;\n    }\n\n    /** The last reader out wakes everybody, because one monitor cannot wake only the writers. */\n    synchronized void unlockRead() {\n        if (--readers == 0) notifyAll();\n    }\n\n    /** Get in as a writer, alone. It registers before parking, so readers arriving later wait behind it. */\n    synchronized void lockWrite() throws InterruptedException {\n        waitingWriters++;\n        try {\n            while (writer || readers &gt; 0) wait();\n        } catch (InterruptedException e) {\n            waitingWriters--; notifyAll(); throw e;        // our leaving can admit the readers behind us\n        }\n        waitingWriters--;\n        writer = true;\n    }\n\n    /** Give the write side back and wake every waiter: both sides share the one wait set. */\n    synchronized void unlockWrite() {\n        writer = false;\n        notifyAll();\n    }\n\n    /** A snapshot for a test, taken under the same monitor that guards the counters. */\n    synchronized String state() { return readers + &quot; readers, writer=&quot; + writer + &quot;, queued writers=&quot; + waitingWriters; }\n}\n\n// ---- ext: a guarded map, and the day ConcurrentHashMap beats any lock you can write\n/**\n * The everyday use: make a plain HashMap safe for many readers and the occasional writer. It works, and for a\n * map it is still the wrong answer -- ConcurrentHashMap locks one bin instead of the whole map, so two writers\n * to different keys never meet, and readers take no lock at all. Reach for a read-write lock when the thing\n * you guard is NOT a map: a config snapshot, a routing table, a rules object, a document.\n */\nfinal class GuardedMap&lt;K, V&gt; {\n    private final Map&lt;K, V&gt; data = new HashMap&lt;&gt;();\n    private final RwLock rw = new RwLock();\n\n    GuardedMap() { rw.configure(Policies.of(Policy.WRITER_PREFERENCE)); }\n\n    /** Many of these run at once. */\n    V get(K key) throws InterruptedException {\n        rw.readLock().lock();\n        try { return data.get(key); } finally { rw.readLock().unlock(); }\n    }\n    /** This one runs alone. */\n    void put(K key, V value) throws InterruptedException {\n        rw.writeLock().lock();\n        try { data.put(key, value); } finally { rw.writeLock().unlock(); }\n    }\n    /** A copy, so an iteration cannot blow up half way through with a concurrent modification. */\n    Map&lt;K, V&gt; snapshot() throws InterruptedException {\n        rw.readLock().lock();\n        try { return new LinkedHashMap&lt;&gt;(data); } finally { rw.readLock().unlock(); }\n    }\n    /** The map the JDK would have given you for free, for comparison in the demo. */\n    static &lt;K, V&gt; Map&lt;K, V&gt; theBoringAnswer() { return new ConcurrentHashMap&lt;&gt;(); }\n}\n\n// ---- ext: upgrading safely -- drop the read hold, take the write hold, then RE-CHECK\n/**\n * The lock refuses a read-to-write upgrade because two upgraders would wait for each other forever. The safe\n * shape is to let go first and then re-check, and the re-check is the whole point: two threads can both decide\n * &quot;it is missing&quot;, both arrive at the write lock, and only the first one may insert. This is the same\n * double-check that makes a cache loader safe.\n */\nfinal class UpgradeSafely {\n    private UpgradeSafely() {}\n\n    /** Read it under the read lock; if it is missing, let go, take the write lock, and look again. */\n    static &lt;K, V&gt; V computeIfAbsent(RwLock rw, Map&lt;K, V&gt; data, K key, Function&lt;K, V&gt; maker) throws InterruptedException {\n        rw.readLock().lock();\n        try { V found = data.get(key); if (found != null) return found; }\n        finally { rw.readLock().unlock(); }                       // let go BEFORE asking for the write side\n        rw.writeLock().lock();\n        try {\n            V again = data.get(key);                              // the gap: somebody may have inserted it\n            if (again != null) return again;\n            V made = maker.apply(key);\n            data.put(key, made);\n            return made;\n        } finally { rw.writeLock().unlock(); }\n    }\n}\n\n// ---- ext: a starvation meter -- an observer that notices the writer nobody let in\n/**\n * Answers the question the fairness rule raises: is anybody being starved? It records the longest wait on each\n * side and counts the waits over a threshold. It is told after the unlock, so measuring costs the lock nothing,\n * and it deliberately throws on demand in the tests to prove a broken listener cannot break the lock.\n */\nfinal class StarvationMeter implements LockObserver {\n    private final long slowMs;\n    private final AtomicLong worstWriterMs = new AtomicLong();\n    private final AtomicLong worstReaderMs = new AtomicLong();\n    private final AtomicInteger slowWrites = new AtomicInteger();\n    private final AtomicInteger slowReads = new AtomicInteger();\n\n    StarvationMeter(long slowMs) { this.slowMs = slowMs; }\n\n    public void onEvent(LockEvent e) {\n        switch (e.kind()) {\n            case WRITE_ACQUIRED -&gt; {\n                worstWriterMs.accumulateAndGet(e.waitedMs(), Math::max);\n                if (e.waitedMs() &gt;= slowMs) slowWrites.incrementAndGet();\n            }\n            case READ_ACQUIRED -&gt; {\n                worstReaderMs.accumulateAndGet(e.waitedMs(), Math::max);\n                if (e.waitedMs() &gt;= slowMs) slowReads.incrementAndGet();\n            }\n            default -&gt; { }                                        // releases are not waits\n        }\n    }\n\n    /** One line for a dashboard or a log. */\n    String report() {\n        return &quot;worst writer wait &quot; + worstWriterMs.get() + &quot;ms (&quot; + slowWrites.get() + &quot; over &quot; + slowMs\n               + &quot;ms), worst reader wait &quot; + worstReaderMs.get() + &quot;ms (&quot; + slowReads.get() + &quot; over &quot; + slowMs + &quot;ms)&quot;;\n    }\n    /** The longest any writer waited, for a test that wants to assert it. */\n    long worstWriterMs() { return worstWriterMs.get(); }\n}\n\n// ---- ext: a distributed read-write lock -- the same three numbers, in a store, with a lease\n/** The one operation a store must give you: replace a value only if it still equals what you last read. */\ninterface LockStore {\n    /** Returns false if somebody else changed the row first. This is the whole distributed primitive. */\n    boolean compareAndSet(String key, String expected, String next);\n    /** The current row, or null. */\n    String get(String key);\n}\n\n/** A CAS store in one process, so the demo runs. In production this row lives in Redis, etcd or a table. */\nfinal class InMemoryLockStore implements LockStore {\n    private final Map&lt;String, String&gt; rows = new ConcurrentHashMap&lt;&gt;();\n    public boolean compareAndSet(String key, String expected, String next) {\n        if (expected == null) return rows.putIfAbsent(key, next) == null;\n        return rows.replace(key, expected, next);\n    }\n    public String get(String key) { return rows.get(key); }\n}\n\n/**\n * The same three numbers, moved out of the process: one row holding &quot;readers:writer&quot;, changed with\n * compare-and-set. What you lose is the part this whole page is about -- there is no condition to park on, so\n * a waiter polls, and every acquire is a network round trip instead of forty nanoseconds. What you must add is\n * a lease (an expiry stamped on the row) so a holder that dies does not own the lock forever, and a fencing\n * token so a resurrected holder&#x27;s late write is rejected by the storage it was writing to.\n */\nfinal class DistributedRwLock {\n    private final LockStore store;\n    private final String key;\n    private final Clock clock;\n\n    DistributedRwLock(LockStore store, String key, Clock clock) {\n        this.store = store; this.key = key; this.clock = clock;\n        store.compareAndSet(key, null, &quot;0:0&quot;);\n    }\n\n    /** Poll until the row says no writer, then bump the reader count with a CAS. Gives up at the deadline. */\n    boolean acquireRead(long timeoutMs) throws InterruptedException {\n        long deadline = clock.nowMs() + timeoutMs;\n        while (clock.nowMs() &lt; deadline) {\n            String row = store.get(key);\n            String[] parts = row.split(&quot;:&quot;);\n            if (parts[1].equals(&quot;0&quot;) &amp;&amp; store.compareAndSet(key, row, (Integer.parseInt(parts[0]) + 1) + &quot;:0&quot;)) return true;\n            Thread.sleep(2);                                      // no condition to wait on: this is the cost\n        }\n        return false;\n    }\n\n    /** Drop the reader count by one, retrying the CAS if another reader moved it in between. */\n    void releaseRead() {\n        while (true) {\n            String row = store.get(key);\n            String[] parts = row.split(&quot;:&quot;);\n            if (store.compareAndSet(key, row, (Integer.parseInt(parts[0]) - 1) + &quot;:&quot; + parts[1])) return;\n        }\n    }\n\n    /** Only from a completely free row: no readers and no writer. */\n    boolean acquireWrite(long timeoutMs) throws InterruptedException {\n        long deadline = clock.nowMs() + timeoutMs;\n        while (clock.nowMs() &lt; deadline) {\n            if (store.compareAndSet(key, &quot;0:0&quot;, &quot;0:1&quot;)) return true;\n            Thread.sleep(2);\n        }\n        return false;\n    }\n\n    void releaseWrite() { store.compareAndSet(key, &quot;0:1&quot;, &quot;0:0&quot;); }\n    /** The raw row, for a demo that wants to print it. */\n    String row() { return store.get(key); }\n}\n\n// ---- ext: the JDK&#x27;s answer -- ReentrantReadWriteLock, and what AQS does that this file does not\n/**\n * What you would actually ship. ReentrantReadWriteLock is built on AbstractQueuedSynchronizer: one 32-bit int\n * holds the reader count in its top half and the write hold count in its bottom half, moved with a single\n * compare-and-set, and the waiters sit in an explicit linked queue so a release wakes exactly ONE node instead\n * of everybody. The three decisions it makes are the three this page made: reentrant on both sides, downgrade\n * allowed, upgrade forbidden -- and its fair mode is our FairOrder with a real queue behind it.\n */\nfinal class JdkComparison {\n    private JdkComparison() {}\n\n    /** Shows that the JDK lock behaves exactly as ours on the three interesting cases. */\n    static String run() throws InterruptedException {\n        ReentrantReadWriteLock jdk = new ReentrantReadWriteLock(true);      // true = fair mode\n\n        jdk.readLock().lock(); jdk.readLock().lock();                       // reentrant reads\n        int holds = jdk.getReadHoldCount();\n        jdk.readLock().unlock(); jdk.readLock().unlock();\n\n        jdk.writeLock().lock();\n        jdk.readLock().lock();                                              // downgrade: legal\n        jdk.writeLock().unlock();\n        boolean stillReading = jdk.getReadHoldCount() == 1;\n        jdk.readLock().unlock();\n\n        jdk.readLock().lock();\n        boolean upgraded = jdk.writeLock().tryLock();                       // upgrade: refused, never hangs\n        jdk.readLock().unlock();\n\n        return &quot;jdk fair lock: read holds &quot; + holds + &quot;, downgrade &quot; + stillReading + &quot;, upgrade allowed &quot; + upgraded;\n    }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        // optimistic reads: a reader that takes no lock, and the hand-rolled version of the same idea\n        OptimisticPoint p = new OptimisticPoint();\n        p.move(3, 4);\n        System.out.println(&quot;optimistic read: distance = &quot; + p.distanceFromOrigin());\n        SeqLockPair pair = new SeqLockPair();\n        pair.set(7, 9);\n        System.out.println(&quot;seqlock pair: &quot; + java.util.Arrays.toString(pair.get()));\n\n        // a condition on the write lock: a waiter drops the whole hold and gets it back\n        RwLock rw = new RwLock();\n        rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n        WriteCondition notEmpty = new WriteCondition(rw);\n        boolean[] ready = { false };\n        CountDownLatch waiting = new CountDownLatch(1);\n        Thread waiter = Main.start(&quot;condition-waiter&quot;, () -&gt; {\n            rw.writeLock().lock();\n            try {\n                waiting.countDown();\n                while (!ready[0]) notEmpty.await(2000);            // while, not if: the predicate is re-tested\n                System.out.println(&quot;condition: woke with the write lock back in hand, ready=&quot; + ready[0]);\n            } finally { rw.writeLock().unlock(); }\n        });\n        waiting.await(2, TimeUnit.SECONDS);\n        Thread.sleep(20);                                          // let it park and give the lock up\n        rw.writeLock().lock();\n        try { ready[0] = true; notEmpty.signal(); } finally { rw.writeLock().unlock(); }\n        waiter.join(3000);\n\n        // the semaphore build: one permit per reader, all permits for a writer\n        SemaphoreRwLock sem = new SemaphoreRwLock();\n        sem.lockRead(); sem.lockRead();\n        System.out.println(&quot;semaphore lock: 2 readers inside, &quot; + sem.free() + &quot; permits left&quot;);\n        sem.unlockRead(); sem.unlockRead();\n        sem.lockWrite();\n        System.out.println(&quot;semaphore lock: writer inside, &quot; + sem.free() + &quot; permits left&quot;);\n        sem.unlockWrite();\n\n        // the same lock with nothing but synchronized / wait / notifyAll\n        MonitorRwLock mon = new MonitorRwLock();\n        mon.lockRead(); mon.lockRead();\n        System.out.println(&quot;monitor lock: &quot; + mon.state());\n        mon.unlockRead(); mon.unlockRead();\n        mon.lockWrite();\n        System.out.println(&quot;monitor lock: &quot; + mon.state());\n        mon.unlockWrite();\n\n        // the everyday use, and the boring answer that beats it for maps\n        GuardedMap&lt;String, Integer&gt; guarded = new GuardedMap&lt;&gt;();\n        guarded.put(&quot;a&quot;, 1); guarded.put(&quot;b&quot;, 2);\n        System.out.println(&quot;guarded map: &quot; + guarded.snapshot() + &quot;   ConcurrentHashMap would need no lock at all: &quot;\n                           + GuardedMap.theBoringAnswer().getClass().getSimpleName());\n\n        // the upgrade, done safely, from two threads at once: the maker must run exactly once\n        RwLock cacheLock = new RwLock();\n        cacheLock.configure(Policies.of(Policy.WRITER_PREFERENCE));\n        Map&lt;String, String&gt; cache = new HashMap&lt;&gt;();\n        AtomicInteger made = new AtomicInteger();\n        CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(4);\n        for (int i = 0; i &lt; 4; i++) {\n            Main.start(&quot;loader-&quot; + i, () -&gt; {\n                go.await();\n                UpgradeSafely.computeIfAbsent(cacheLock, cache, &quot;k&quot;, k -&gt; { made.incrementAndGet(); return &quot;loaded&quot;; });\n                done.countDown();\n            });\n        }\n        go.countDown();\n        done.await(3, TimeUnit.SECONDS);\n        System.out.println(&quot;safe upgrade: 4 threads missed the same key, the loader ran &quot; + made.get() + &quot; time(s)&quot;);\n\n        // the starvation meter, on a lock a read storm is holding down\n        RwLock metered = new RwLock();\n        StarvationMeter meter = new StarvationMeter(20);\n        metered.configure(Policies.of(Policy.READER_PREFERENCE), meter);\n        long stormEnds = System.currentTimeMillis() + 120;\n        Thread[] storm = new Thread[4];\n        for (int i = 0; i &lt; storm.length; i++) {\n            storm[i] = Main.start(&quot;storm-&quot; + i, () -&gt; {\n                while (System.currentTimeMillis() &lt; stormEnds) {\n                    metered.readLock().lock();\n                    try { Thread.sleep(1); } finally { metered.readLock().unlock(); }\n                }\n            });\n        }\n        Thread.sleep(10);\n        Thread late = Main.start(&quot;late-writer&quot;, () -&gt; {\n            metered.writeLock().lock();\n            try { Thread.sleep(1); } finally { metered.writeLock().unlock(); }\n        });\n        for (Thread t : storm) t.join(3000);\n        late.join(3000);\n        System.out.println(&quot;starvation meter (READER_PREFERENCE): &quot; + meter.report());\n\n        // the distributed version: the same three numbers, in a row, with compare-and-set\n        DistributedRwLock dist = new DistributedRwLock(new InMemoryLockStore(), &quot;doc:42&quot;, System::currentTimeMillis);\n        System.out.println(&quot;distributed: read acquired &quot; + dist.acquireRead(500) + &quot;, row &quot; + dist.row());\n        System.out.println(&quot;distributed: a writer cannot get in while a reader holds it: &quot; + !dist.acquireWrite(50));\n        dist.releaseRead();\n        System.out.println(&quot;distributed: write acquired &quot; + dist.acquireWrite(500) + &quot;, row &quot; + dist.row());\n        dist.releaseWrite();\n\n        // and what you would actually ship\n        System.out.println(JdkComparison.run());\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.List;\nimport java.util.concurrent.CountDownLatch;\nimport java.util.concurrent.TimeUnit;\nimport java.util.concurrent.atomic.AtomicBoolean;\nimport java.util.concurrent.atomic.AtomicInteger;\n\n// Targeted failure tests: 36 checks, each proving a claim the design makes on page 02, move 9. Every wait in\n// this file has a timeout, so a broken lock fails the test instead of hanging the run, and the whole file\n// finishes in about a second.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what);\n        if (!ok) failures++;\n    }\n\n    public static void main(String[] args) throws Exception {\n        // a test that can hang is not a test: if anything below blocks, say so and stop\n        Thread watchdog = new Thread(() -&gt; {\n            try { Thread.sleep(45_000); } catch (InterruptedException e) { return; }\n            System.out.println(&quot;FAIL something blocked for 45 seconds&quot;);\n            Runtime.getRuntime().halt(1);\n        }, &quot;watchdog&quot;);\n        watchdog.setDaemon(true);\n        watchdog.start();\n\n        // 1. many readers really are inside at the same time -- otherwise this is an expensive mutex.\n        //    Six readers take the read lock and none of them leaves until all six are in.\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            int n = 6;\n            CountDownLatch allIn = new CountDownLatch(n), release = new CountDownLatch(1);\n            AtomicInteger peak = new AtomicInteger();\n            for (int i = 0; i &lt; n; i++) {\n                Main.start(&quot;reader-&quot; + i, () -&gt; {\n                    rw.readLock().lock();\n                    try {\n                        peak.accumulateAndGet(rw.stats().readers(), Math::max);\n                        allIn.countDown();\n                        release.await(5, TimeUnit.SECONDS);\n                    } finally { rw.readLock().unlock(); }\n                });\n            }\n            boolean together = allIn.await(5, TimeUnit.SECONDS);\n            check(together, &quot;six readers are inside the read lock at the same time&quot;);\n            check(peak.get() == n, &quot;the lock itself counted all six (peak readers = &quot; + peak.get() + &quot;)&quot;);\n            check(rw.stats().writerActive() == false, &quot;and no writer is inside while they read&quot;);\n            release.countDown();\n        }\n\n        // 2. a writer is alone: while it holds the lock no reader may enter, and they all enter after it leaves\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            CountDownLatch writing = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread writer = Main.start(&quot;writer&quot;, () -&gt; {\n                rw.writeLock().lock();\n                try { writing.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { rw.writeLock().unlock(); }\n            });\n            writing.await(2, TimeUnit.SECONDS);\n            check(!rw.readLock().tryLock(), &quot;a reader cannot enter while a writer holds the lock&quot;);\n            check(!rw.writeLock().tryLock(), &quot;and a second writer cannot either&quot;);\n            check(!rw.readLock().tryLock(200), &quot;a reader that waits 200ms still gives up, and does not hang&quot;);\n            letGo.countDown();\n            writer.join(3000);\n            check(rw.readLock().tryLock(1000), &quot;the moment the writer leaves, a reader gets in&quot;);\n            rw.readLock().unlock();\n        }\n\n        // 3. the stress: eight readers and four writers on one document. A reader must never see a half-written\n        //    document, and every write must land exactly once.\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            SharedDocument doc = new SharedDocument(16);\n            int readers = 8, writers = 4, readsEach = 3000, writesEach = 200;\n            CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(readers + writers);\n            for (int i = 0; i &lt; readers; i++) {\n                Main.start(&quot;r&quot; + i, () -&gt; {\n                    go.await();\n                    for (int k = 0; k &lt; readsEach; k++) {\n                        rw.readLock().lock();\n                        try { doc.readAll(); } finally { rw.readLock().unlock(); }\n                    }\n                    done.countDown();\n                });\n            }\n            for (int i = 0; i &lt; writers; i++) {\n                Main.start(&quot;w&quot; + i, () -&gt; {\n                    go.await();\n                    for (int k = 0; k &lt; writesEach; k++) {\n                        rw.writeLock().lock();\n                        try { doc.bumpAll(); } finally { rw.writeLock().unlock(); }\n                    }\n                    done.countDown();\n                });\n            }\n            go.countDown();\n            check(done.await(20, TimeUnit.SECONDS), &quot;24000 reads and 800 writes finish with nobody stuck&quot;);\n            check(doc.tornReads.get() == 0, &quot;no reader ever saw a half-written document (torn reads = &quot; + doc.tornReads.get() + &quot;)&quot;);\n            check(doc.overlaps.get() == 0, &quot;no reader was ever inside beside a writer, and no two writers met&quot;);\n            check(doc.value() == writers * writesEach, &quot;every write landed exactly once: &quot; + doc.value() + &quot; of &quot; + (writers * writesEach));\n        }\n\n        // 4. writer preference: a writer that is already queued is not overtaken by readers that arrive later,\n        //    which is the whole point of the rule -- a writer cannot be starved by a stream of readers.\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            List&lt;String&gt; order = Collections.synchronizedList(new ArrayList&lt;&gt;());\n            CountDownLatch holding = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread holder = Main.start(&quot;first-reader&quot;, () -&gt; {\n                rw.readLock().lock();\n                try { holding.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { rw.readLock().unlock(); }\n            });\n            holding.await(2, TimeUnit.SECONDS);\n            Thread writer = Main.start(&quot;writer&quot;, () -&gt; {\n                rw.writeLock().lock();\n                try { order.add(&quot;writer&quot;); } finally { rw.writeLock().unlock(); }\n            });\n            Main.awaitState(rw, s -&gt; s.waitingWriters() == 1, 2000);\n            check(!rw.readLock().tryLock(), &quot;a reader arriving after a queued writer is made to wait&quot;);\n            Thread late = Main.start(&quot;late-reader&quot;, () -&gt; {\n                rw.readLock().lock();\n                try { order.add(&quot;late-reader&quot;); } finally { rw.readLock().unlock(); }\n            });\n            Main.awaitState(rw, s -&gt; s.waitingReaders() == 1, 2000);\n            letGo.countDown();\n            holder.join(3000); writer.join(3000); late.join(3000);\n            check(order.equals(List.of(&quot;writer&quot;, &quot;late-reader&quot;)), &quot;the queued writer went in first, then the late reader: &quot; + order);\n        }\n\n        // 5. the rule is a real knob, not a comment: the same scenario under the other two rules behaves\n        //    differently, and that difference is one line of configuration.\n        {\n            RwLock loose = new RwLock();\n            loose.configure(Policies.of(Policy.READER_PREFERENCE));\n            CountDownLatch holding = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread holder = Main.start(&quot;first-reader&quot;, () -&gt; {\n                loose.readLock().lock();\n                try { holding.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { loose.readLock().unlock(); }\n            });\n            holding.await(2, TimeUnit.SECONDS);\n            Thread writer = Main.start(&quot;writer&quot;, () -&gt; {\n                loose.writeLock().lock();\n                try { /* nothing */ } finally { loose.writeLock().unlock(); }\n            });\n            Main.awaitState(loose, s -&gt; s.waitingWriters() == 1, 2000);\n            boolean overtook = loose.readLock().tryLock();\n            check(overtook, &quot;READER_PREFERENCE lets a new reader overtake the queued writer -- that is the starvation it buys&quot;);\n            if (overtook) loose.readLock().unlock();\n            letGo.countDown();\n            holder.join(3000); writer.join(3000);\n\n            RwLock fair = new RwLock();\n            fair.configure(Policies.of(Policy.FAIR));\n            List&lt;String&gt; order = Collections.synchronizedList(new ArrayList&lt;&gt;());\n            CountDownLatch holding2 = new CountDownLatch(1), letGo2 = new CountDownLatch(1);\n            Thread holder2 = Main.start(&quot;first-reader&quot;, () -&gt; {\n                fair.readLock().lock();\n                try { holding2.countDown(); letGo2.await(5, TimeUnit.SECONDS); } finally { fair.readLock().unlock(); }\n            });\n            holding2.await(2, TimeUnit.SECONDS);\n            Thread w2 = Main.start(&quot;writer&quot;, () -&gt; {\n                fair.writeLock().lock();\n                try { order.add(&quot;writer&quot;); } finally { fair.writeLock().unlock(); }\n            });\n            Main.awaitState(fair, s -&gt; s.waitingWriters() == 1, 2000);\n            Thread r2 = Main.start(&quot;late-reader&quot;, () -&gt; {\n                fair.readLock().lock();\n                try { order.add(&quot;late-reader&quot;); } finally { fair.readLock().unlock(); }\n            });\n            Main.awaitState(fair, s -&gt; s.waitingReaders() == 1, 2000);\n            letGo2.countDown();\n            holder2.join(3000); w2.join(3000); r2.join(3000);\n            check(order.equals(List.of(&quot;writer&quot;, &quot;late-reader&quot;)), &quot;FAIR grants in arrival order: &quot; + order);\n        }\n\n        // 6. downgrade is allowed, upgrade is refused instead of deadlocking, and both sides are reentrant\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            rw.writeLock().lock();\n            rw.writeLock().lock();                                   // reentrant write: counts, does not block\n            rw.writeLock().unlock();\n            rw.readLock().lock();                                    // downgrade: still the writer, admitted at once\n            rw.writeLock().unlock();\n            check(rw.stats().readers() == 1 &amp;&amp; !rw.stats().writerActive(), &quot;write -&gt; read downgrade leaves exactly one read hold&quot;);\n            AtomicBoolean otherGotIn = new AtomicBoolean();\n            Thread other = Main.start(&quot;other-writer&quot;, () -&gt; {\n                if (rw.writeLock().tryLock()) { otherGotIn.set(true); rw.writeLock().unlock(); }\n            });\n            other.join(2000);\n            check(!otherGotIn.get(), &quot;and another thread&#x27;s writer is kept out while that read hold is alive&quot;);\n            rw.readLock().lock();                                    // reentrant read\n            rw.readLock().unlock();\n            rw.readLock().unlock();\n            check(rw.stats().readers() == 0, &quot;both read holds released, the lock is free&quot;);\n\n            rw.readLock().lock();\n            boolean refused = false;\n            long t0 = System.currentTimeMillis();\n            try { rw.writeLock().lock(); } catch (IllegalStateException e) { refused = true; }\n            long took = System.currentTimeMillis() - t0;\n            rw.readLock().unlock();\n            check(refused &amp;&amp; took &lt; 1000, &quot;a read-to-write upgrade is refused at once (&quot; + took + &quot;ms), never a silent deadlock&quot;);\n        }\n\n        // 7. a waiter that gives up must leave no ghost behind, and a deadline must be testable without waiting\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            CountDownLatch holding = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread holder = Main.start(&quot;reader&quot;, () -&gt; {\n                rw.readLock().lock();\n                try { holding.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { rw.readLock().unlock(); }\n            });\n            holding.await(2, TimeUnit.SECONDS);\n            AtomicBoolean threw = new AtomicBoolean();\n            Thread writer = new Thread(() -&gt; {\n                try { rw.writeLock().lock(); rw.writeLock().unlock(); }\n                catch (InterruptedException e) { threw.set(true); }\n            }, &quot;doomed-writer&quot;);\n            writer.start();\n            Main.awaitState(rw, s -&gt; s.waitingWriters() == 1, 2000);\n            writer.interrupt();\n            writer.join(3000);\n            check(threw.get(), &quot;interrupting a parked writer throws InterruptedException instead of ignoring it&quot;);\n            check(rw.stats().waitingWriters() == 0, &quot;and its ticket is gone from the queue, not left behind as a ghost&quot;);\n            boolean got = rw.readLock().tryLock();\n            check(got, &quot;so readers are admitted again -- a ghost writer would have blocked them forever&quot;);\n            if (got) rw.readLock().unlock();\n            letGo.countDown();\n            holder.join(3000);\n\n            // the injected clock: a thirty-second deadline can pass in a millisecond of real time\n            RwLock timed = new RwLock();\n            timed.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            long[] fake = { 1_000_000L };\n            timed.setClock(() -&gt; { long now = fake[0]; fake[0] += 30_000; return now; });   // every look is 30s later\n            CountDownLatch writing = new CountDownLatch(1), release = new CountDownLatch(1);\n            Thread w = Main.start(&quot;writer&quot;, () -&gt; {\n                timed.writeLock().lock();\n                try { writing.countDown(); release.await(5, TimeUnit.SECONDS); } finally { timed.writeLock().unlock(); }\n            });\n            writing.await(2, TimeUnit.SECONDS);\n            long t0 = System.currentTimeMillis();\n            boolean acquired = timed.readLock().tryLock(30_000);\n            long realMs = System.currentTimeMillis() - t0;\n            check(!acquired &amp;&amp; realMs &lt; 1000, &quot;a 30s deadline expires on the injected clock in &quot; + realMs + &quot;ms of real time&quot;);\n            release.countDown();\n            w.join(3000);\n        }\n\n        // 8. the safety wrapper, a broken listener, and an unpaired unlock\n        {\n            // a fairness rule written by somebody in a hurry: &quot;nobody ever waits&quot;\n            AdmissionPolicy reckless = new AdmissionPolicy() {\n                public boolean readerMustWait(LockState s, long ticket) { return false; }\n                public boolean writerMustWait(LockState s, long ticket) { return false; }\n            };\n            RwLock rw = new RwLock();\n            rw.configure(reckless);\n            SharedDocument doc = new SharedDocument(16);\n            CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(6);\n            for (int i = 0; i &lt; 4; i++) {\n                Main.start(&quot;r&quot; + i, () -&gt; {\n                    go.await();\n                    for (int k = 0; k &lt; 2000; k++) { rw.readLock().lock(); try { doc.readAll(); } finally { rw.readLock().unlock(); } }\n                    done.countDown();\n                });\n            }\n            for (int i = 0; i &lt; 2; i++) {\n                Main.start(&quot;w&quot; + i, () -&gt; {\n                    go.await();\n                    for (int k = 0; k &lt; 300; k++) { rw.writeLock().lock(); try { doc.bumpAll(); } finally { rw.writeLock().unlock(); } }\n                    done.countDown();\n                });\n            }\n            go.countDown();\n            check(done.await(20, TimeUnit.SECONDS), &quot;the reckless rule runs to completion&quot;);\n            check(doc.overlaps.get() == 0 &amp;&amp; doc.tornReads.get() == 0,\n                  &quot;a rule that says nobody waits still cannot put a reader beside a writer: SafePolicy wraps every rule&quot;);\n            check(doc.value() == 600, &quot;and every write still landed exactly once&quot;);\n\n            // a listener that throws on every event\n            RwLock noisy = new RwLock();\n            noisy.configure(Policies.of(Policy.FAIR), e -&gt; { throw new RuntimeException(&quot;the metrics box is down&quot;); });\n            noisy.writeLock().lock();\n            noisy.writeLock().unlock();\n            noisy.readLock().lock();\n            noisy.readLock().unlock();\n            check(noisy.stats().readers() == 0, &quot;a listener that throws on every event cannot break lock or unlock&quot;);\n\n            // unlocking something this thread does not hold\n            boolean caught = false;\n            try { noisy.readLock().unlock(); } catch (IllegalMonitorStateException e) { caught = true; }\n            check(caught, &quot;unlocking a read lock this thread does not hold is refused, not silently accepted&quot;);\n            caught = false;\n            try { noisy.writeLock().unlock(); } catch (IllegalMonitorStateException e) { caught = true; }\n            check(caught, &quot;and the same for the write lock&quot;);\n        }\n\n        // 9. the wait protocol itself: a wake means &quot;look again&quot;, never &quot;it is your turn&quot;. Waking every parked\n        //    thread without changing one counter is exactly what a spurious wakeup looks like from inside await().\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            CountDownLatch holding = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread reader = Main.start(&quot;reader&quot;, () -&gt; {\n                rw.readLock().lock();\n                try { holding.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { rw.readLock().unlock(); }\n            });\n            holding.await(2, TimeUnit.SECONDS);\n            AtomicBoolean writerIn = new AtomicBoolean();\n            Thread writer = Main.start(&quot;patient-writer&quot;, () -&gt; {\n                rw.writeLock().lock();\n                try { writerIn.set(true); } finally { rw.writeLock().unlock(); }\n            });\n            Main.awaitState(rw, s -&gt; s.waitingWriters() == 1, 2000);\n            for (int i = 0; i &lt; 200; i++) rw.wakeWaitersForTest();      // 200 spurious wakeups, no state change\n            Thread.sleep(50);\n            check(!writerIn.get(), &quot;200 spurious wakeups let nobody in while a reader is still inside&quot;);\n            check(rw.stats().waitingWriters() == 1, &quot;the woken writer re-tested, parked again and kept its ticket&quot;);\n            letGo.countDown();\n            reader.join(3000); writer.join(3000);\n            check(writerIn.get(), &quot;the real change -- the last reader leaving -- is what admits it&quot;);\n            rw.wakeWaitersForTest();                                    // a signal with nobody parked\n            boolean got = rw.writeLock().tryLock();\n            check(got, &quot;a wake with nobody parked is dropped, and costs the next acquire nothing&quot;);\n            if (got) rw.writeLock().unlock();\n        }\n\n        // 10. the same lock built from synchronized / wait / notifyAll holds the same invariant, with one wait\n        //     set and a herd on every wake. If this passes, the design is the design and not the API.\n        {\n            MonitorRwLock mon = new MonitorRwLock();\n            SharedDocument doc = new SharedDocument(16);\n            int readers = 4, writers = 2, readsEach = 1500, writesEach = 200;\n            CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(readers + writers);\n            for (int i = 0; i &lt; readers; i++) {\n                Main.start(&quot;mr&quot; + i, () -&gt; {\n                    go.await();\n                    for (int k = 0; k &lt; readsEach; k++) {\n                        mon.lockRead();\n                        try { doc.readAll(); } finally { mon.unlockRead(); }\n                    }\n                    done.countDown();\n                });\n            }\n            for (int i = 0; i &lt; writers; i++) {\n                Main.start(&quot;mw&quot; + i, () -&gt; {\n                    go.await();\n                    for (int k = 0; k &lt; writesEach; k++) {\n                        mon.lockWrite();\n                        try { doc.bumpAll(); } finally { mon.unlockWrite(); }\n                    }\n                    done.countDown();\n                });\n            }\n            go.countDown();\n            check(done.await(20, TimeUnit.SECONDS), &quot;the synchronized build finishes 6000 reads and 400 writes with nobody stuck&quot;);\n            check(doc.overlaps.get() == 0 &amp;&amp; doc.tornReads.get() == 0,\n                  &quot;one monitor and notifyAll still never put a reader beside a writer&quot;);\n            check(doc.value() == writers * writesEach, &quot;and every write landed exactly once: &quot; + doc.value());\n        }\n\n        System.out.println();\n        if (failures == 0) System.out.println(&quot;ALL PASS&quot;);\n        else System.out.println(failures + &quot; CHECK(S) FAILED&quot;);\n        System.out.flush();\n        System.exit(failures == 0 ? 0 : 1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Write a read-write lock. Many threads read one document and a few change it; readers should not block each other, a writer needs it to itself. Build it from a lock and conditions &mdash; no <code>ReentrantReadWriteLock</code> &mdash; and make the fairness rule something I can change. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (reentrant, upgradable, may writers starve &mdash; in that order); then type in the order of Main.java: the <code>Clock</code> and <code>Lock</code> interfaces, the <code>Policy</code> enum, <code>LockState</code> and <code>AdmissionPolicy</code>, the three rules and the <code>SafePolicy</code> wrapper, then <code>Sync</code> &mdash; the mutex, the two conditions, the counters, and <code>acquireRead</code> with its while loop &mdash; then <code>releaseRead</code>, the two write methods, the two thin handles, <code>RwLock</code>, and a main that starts six readers and one writer and prints who was inside when.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; They change the rule mid-round: &quot;a writer must never be starved by a stream of readers.&quot; Do it without touching the lock.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One class and one line. The fairness rule is already an interface the lock is handed, so writer preference is a class whose reader test also returns true while any writer is queued, and <code>configure()</code> takes it. Nothing in the parking or waking machinery changes, and neither do the tests. The reader side now waits behind a queued writer, which is exactly the trade being asked for: fewer reads per second, and a bounded wait for the writer. Arrival order is a third class: it compares this waiter's ticket with the oldest ticket on the other side, so nobody overtakes anybody. The one seam that is not free is the <code>Policy</code> enum, so a brand-new constant is the single extra edit; key the registry by String and even that disappears.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Readers first: a reader goes in whenever no writer is inside, even if writers are queued. Highest read\n * throughput, and a writer can be starved forever by a steady stream of readers. That is the trade, said aloud.\n */\nfinal class ReaderPreference implements AdmissionPolicy {\n    public boolean readerMustWait(LockState s, long ticket) { return s.writerActive(); }\n    public boolean writerMustWait(LockState s, long ticket) { return s.writerActive() || s.readers() &gt; 0; }\n}\n\n/**\n * Writers first: a reader that arrives while a writer is queued waits behind it, so the readers already\n * inside drain and the writer gets in. Writers cannot starve; a long read storm pauses instead of continuing.\n */\nfinal class WriterPreference implements AdmissionPolicy {\n    public boolean readerMustWait(LockState s, long ticket) { return s.writerActive() || s.waitingWriters() &gt; 0; }\n    public boolean writerMustWait(LockState s, long ticket) { return s.writerActive() || s.readers() &gt; 0; }\n}\n\n/**\n * Arrival order: nobody overtakes a thread that got here first. Readers that arrived with no writer ahead of\n * them still go in together, so this is FIFO between the two sides, not one thread at a time.\n */\nfinal class FairOrder implements AdmissionPolicy {\n    public boolean readerMustWait(LockState s, long ticket) {\n        return s.writerActive() || s.earliestWaitingWriterTicket() &lt; ticket;\n    }\n    public boolean writerMustWait(LockState s, long ticket) {\n        return s.writerActive() || s.readers() &gt; 0 || s.earliestWaitingTicket() &lt; ticket;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>2 &middot; You shipped reader preference by accident. How would you find out that writers are starving?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Not from the lock: from an observer. Every acquire publishes an event after the mutex is released, carrying how long that thread waited, measured on the injected clock. A starvation meter is a dozen lines on top of that: it keeps the worst wait on each side and counts the waits over a threshold, and one line of its report goes on a dashboard or into a log. Under reader preference a read storm shows up at once &mdash; in the demo the worst writer wait is about a hundred milliseconds against a worst reader wait of one. That gap is what you alarm on, and the fix is a different <code>AdmissionPolicy</code> handed to <code>configure()</code>, not a change inside the lock. Measuring costs the lock nothing, because observers are told after the unlock, and a meter that throws is caught and ignored.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a starvation meter -- an observer that notices the writer nobody let in\n/**\n * Answers the question the fairness rule raises: is anybody being starved? It records the longest wait on each\n * side and counts the waits over a threshold. It is told after the unlock, so measuring costs the lock nothing,\n * and it deliberately throws on demand in the tests to prove a broken listener cannot break the lock.\n */\nfinal class StarvationMeter implements LockObserver {\n    private final long slowMs;\n    private final AtomicLong worstWriterMs = new AtomicLong();\n    private final AtomicLong worstReaderMs = new AtomicLong();\n    private final AtomicInteger slowWrites = new AtomicInteger();\n    private final AtomicInteger slowReads = new AtomicInteger();\n\n    StarvationMeter(long slowMs) { this.slowMs = slowMs; }\n\n    public void onEvent(LockEvent e) {\n        switch (e.kind()) {\n            case WRITE_ACQUIRED -&gt; {\n                worstWriterMs.accumulateAndGet(e.waitedMs(), Math::max);\n                if (e.waitedMs() &gt;= slowMs) slowWrites.incrementAndGet();\n            }\n            case READ_ACQUIRED -&gt; {\n                worstReaderMs.accumulateAndGet(e.waitedMs(), Math::max);\n                if (e.waitedMs() &gt;= slowMs) slowReads.incrementAndGet();\n            }\n            default -&gt; { }                                        // releases are not waits\n        }\n    }\n\n    /** One line for a dashboard or a log. */\n    String report() {\n        return &quot;worst writer wait &quot; + worstWriterMs.get() + &quot;ms (&quot; + slowWrites.get() + &quot; over &quot; + slowMs\n               + &quot;ms), worst reader wait &quot; + worstReaderMs.get() + &quot;ms (&quot; + slowReads.get() + &quot; over &quot; + slowMs + &quot;ms)&quot;;\n    }\n    /** The longest any writer waited, for a test that wants to assert it. */\n    long worstWriterMs() { return worstWriterMs.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; Prove that many readers really are inside at once, and that a writer is alone. With a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two tests, and neither of them sleeps and hopes. The first starts six readers that each take the read lock and then wait on a latch until all six are in: if the lock were an expensive mutex the latch would never reach zero and the five-second timeout would fail the test. It also asks the lock for its own count and checks it says six. The second holds the write lock in one thread and proves from another thread that a reader's <code>tryLock</code> returns false, that a second writer's does too, and that a reader willing to wait two hundred milliseconds still gives up &mdash; then that a reader gets in the moment the writer leaves. The stress test behind them does twenty-four thousand reads and eight hundred writes and counts torn reads, which is the claim in its strongest form.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. many readers really are inside at the same time -- otherwise this is an expensive mutex.\n        //    Six readers take the read lock and none of them leaves until all six are in.\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            int n = 6;\n            CountDownLatch allIn = new CountDownLatch(n), release = new CountDownLatch(1);\n            AtomicInteger peak = new AtomicInteger();\n            for (int i = 0; i &lt; n; i++) {\n                Main.start(&quot;reader-&quot; + i, () -&gt; {\n                    rw.readLock().lock();\n                    try {\n                        peak.accumulateAndGet(rw.stats().readers(), Math::max);\n                        allIn.countDown();\n                        release.await(5, TimeUnit.SECONDS);\n                    } finally { rw.readLock().unlock(); }\n                });\n            }\n            boolean together = allIn.await(5, TimeUnit.SECONDS);\n            check(together, &quot;six readers are inside the read lock at the same time&quot;);\n            check(peak.get() == n, &quot;the lock itself counted all six (peak readers = &quot; + peak.get() + &quot;)&quot;);\n            check(rw.stats().writerActive() == false, &quot;and no writer is inside while they read&quot;);\n            release.countDown();\n        }\n\n        // 2. a writer is alone: while it holds the lock no reader may enter, and they all enter after it leaves\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            CountDownLatch writing = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread writer = Main.start(&quot;writer&quot;, () -&gt; {\n                rw.writeLock().lock();\n                try { writing.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { rw.writeLock().unlock(); }\n            });\n            writing.await(2, TimeUnit.SECONDS);\n            check(!rw.readLock().tryLock(), &quot;a reader cannot enter while a writer holds the lock&quot;);\n            check(!rw.writeLock().tryLock(), &quot;and a second writer cannot either&quot;);\n            check(!rw.readLock().tryLock(200), &quot;a reader that waits 200ms still gives up, and does not hang&quot;);\n            letGo.countDown();\n            writer.join(3000);\n            check(rw.readLock().tryLock(1000), &quot;the moment the writer leaves, a reader gets in&quot;);\n            rw.readLock().unlock();\n        }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>4 &middot; One mutex for the whole lock. Have you just built a slower synchronized block?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No, and the answer is arithmetic rather than opinion: the mutex is held for about forty nanoseconds &mdash; three field reads, one call to the fairness rule, one increment &mdash; and is released before the caller's read begins, so the shared part of a read is roughly a hundred thousand times longer than the serialised part. Two costs are worth admitting before you are asked. The first: a read acquire costs sixty-five nanoseconds against a write acquire's twenty-five, because the read path looks up a <code>ThreadLocal</code> every time to spot an upgrade. The second is in the release, not the acquire &mdash; <code>signalAll()</code> wakes every parked thread at once, and they all re-take the mutex one after another, and all but the ones that can move park again. That is the thundering herd, and it makes a release cost one mutex handoff per waiter instead of one. Both are why the ladder's second rung is an explicit queue of waiter nodes: AQS wakes exactly the one node that can proceed.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Get in as a reader. Returns false only when the caller said it would not wait (NO_WAIT) or its deadline\n     * passed (TIMED). A thread that already holds either side is admitted at once: it cannot release what it\n     * holds while it waits, so parking it would be a deadlock with itself.\n     */\n    boolean acquireRead(int mode, long timeoutMs) throws InterruptedException {\n        long startedMs = clock.nowMs();\n        boolean admitted = false;\n        int readersAfter = 0;\n        mutex.lock();\n        try {\n            int[] mine = readHolds.get();\n            if (mine[0] &gt; 0 || writerOwner == Thread.currentThread()) {\n                mine[0]++; readers++; admitted = true;            // reentrant read, or a write-to-read downgrade\n            } else {\n                long ticket = nextTicket++;\n                if (!policy.readerMustWait(this, ticket)) {\n                    admitted = true;\n                } else if (mode != NO_WAIT) {\n                    readerQueue.addLast(ticket);\n                    boolean gaveUp = false;\n                    try {\n                        long deadline = startedMs + timeoutMs;\n                        while (policy.readerMustWait(this, ticket)) {   // while, never if: re-test after every wake\n                            if (mode == TIMED) {\n                                long remain = deadline - clock.nowMs();\n                                if (remain &lt;= 0) { gaveUp = true; break; }\n                                okToRead.await(remain, TimeUnit.MILLISECONDS);\n                            } else {\n                                okToRead.await();                      // the mutex is released while parked here\n                            }\n                        }\n                        admitted = !gaveUp;\n                    } catch (InterruptedException e) {\n                        gaveUp = true;\n                        throw e;\n                    } finally {\n                        readerQueue.removeFirstOccurrence(ticket);     // never leave a ghost in the queue\n                        if (gaveUp) wakeBoth();                        // our leaving can admit somebody behind us\n                    }\n                }\n                if (admitted) { mine[0] = 1; readers++; }\n            }\n            readersAfter = readers;\n        } finally { mutex.unlock(); }\n        if (admitted) publish(EventKind.READ_ACQUIRED, startedMs, readersAfter);\n        return admitted;\n    }\n\n/**\n     * Give the read side back. Only the last reader out wakes anybody, and it wakes writers only: a reader that\n     * is parked is parked because of a writer, and no writer state changed here.\n     */\n    void releaseRead() {\n        int readersAfter;\n        mutex.lock();\n        try {\n            int[] mine = readHolds.get();\n            if (mine[0] == 0) throw new IllegalMonitorStateException(&quot;this thread does not hold the read lock&quot;);\n            mine[0]--;\n            readers--;\n            if (mine[0] == 0) readHolds.remove();\n            readersAfter = readers;\n            if (readers == 0) okToWrite.signalAll();               // only now can a writer make progress\n        } finally { mutex.unlock(); }\n        publish(EventKind.READ_RELEASED, 0, readersAfter);\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; A thread waiting for the write lock is interrupted, or its timeout expires. What is the state of the lock?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was. A waiter registers a ticket before it parks, and that ticket is removed in a <code>finally</code>, so a thread that leaves by interruption, by timeout or by being admitted never leaves a ghost in the queue. That matters more than it sounds: under writer preference a ghost waiting writer makes every reader wait forever, so this one <code>finally</code> is the difference between a lock and a deadlock. A cancelled waiter also signals both conditions on its way out, because its departure can be what admits somebody else &mdash; under arrival order, a waiter behind it may now be the oldest. The interrupt itself is passed on as <code>InterruptedException</code> rather than swallowed, so a cancelled task really is cancelled, and the test proves a reader gets in again afterwards.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 7. a waiter that gives up must leave no ghost behind, and a deadline must be testable without waiting\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            CountDownLatch holding = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread holder = Main.start(&quot;reader&quot;, () -&gt; {\n                rw.readLock().lock();\n                try { holding.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { rw.readLock().unlock(); }\n            });\n            holding.await(2, TimeUnit.SECONDS);\n            AtomicBoolean threw = new AtomicBoolean();\n            Thread writer = new Thread(() -&gt; {\n                try { rw.writeLock().lock(); rw.writeLock().unlock(); }\n                catch (InterruptedException e) { threw.set(true); }\n            }, &quot;doomed-writer&quot;);\n            writer.start();\n            Main.awaitState(rw, s -&gt; s.waitingWriters() == 1, 2000);\n            writer.interrupt();\n            writer.join(3000);\n            check(threw.get(), &quot;interrupting a parked writer throws InterruptedException instead of ignoring it&quot;);\n            check(rw.stats().waitingWriters() == 0, &quot;and its ticket is gone from the queue, not left behind as a ghost&quot;);\n            boolean got = rw.readLock().tryLock();\n            check(got, &quot;so readers are admitted again -- a ghost writer would have blocked them forever&quot;);\n            if (got) rw.readLock().unlock();\n            letGo.countDown();\n            holder.join(3000);\n\n            // the injected clock: a thirty-second deadline can pass in a millisecond of real time\n            RwLock timed = new RwLock();\n            timed.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            long[] fake = { 1_000_000L };\n            timed.setClock(() -&gt; { long now = fake[0]; fake[0] += 30_000; return now; });   // every look is 30s later\n            CountDownLatch writing = new CountDownLatch(1), release = new CountDownLatch(1);\n            Thread w = Main.start(&quot;writer&quot;, () -&gt; {\n                timed.writeLock().lock();\n                try { writing.countDown(); release.await(5, TimeUnit.SECONDS); } finally { timed.writeLock().unlock(); }\n            });\n            writing.await(2, TimeUnit.SECONDS);\n            long t0 = System.currentTimeMillis();\n            boolean acquired = timed.readLock().tryLock(30_000);\n            long realMs = System.currentTimeMillis() - t0;\n            check(!acquired &amp;&amp; realMs &lt; 1000, &quot;a 30s deadline expires on the injected clock in &quot; + realMs + &quot;ms of real time&quot;);\n            release.countDown();\n            w.join(3000);\n        }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>6 &middot; Why while and not if around the wait? Define a lost wakeup and a spurious wakeup, and prove your loop survives both.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A <b>spurious wakeup</b> is <code>await</code> returning when nobody signalled at all. The JVM is allowed to do that, so a thread that treated a wake as its turn would walk straight in on a writer; the <code>while</code> loop is what makes it harmless, because the thread simply re-tests and parks again. A <b>lost wakeup</b> is the mirror image: a signal sent while the thread has decided to wait but is not yet on the condition, so the signal is thrown away and the thread sleeps forever. Testing the predicate and parking happen under the same mutex, which is what closes that gap &mdash; there is no instant when this thread is committed to waiting and not yet reachable by a signal. The third case is the common one and needs no bug at all: the wake was real, and somebody else took the lock before you looked. The test proves it instead of hoping: <code>wakeWaitersForTest()</code> signals both conditions under the mutex without changing one counter, which is exactly what a spurious wakeup looks like from inside <code>await</code>. Two hundred of them, while a reader is still inside, admit nobody and leave the parked writer's ticket exactly where it was.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 9. the wait protocol itself: a wake means &quot;look again&quot;, never &quot;it is your turn&quot;. Waking every parked\n        //    thread without changing one counter is exactly what a spurious wakeup looks like from inside await().\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            CountDownLatch holding = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread reader = Main.start(&quot;reader&quot;, () -&gt; {\n                rw.readLock().lock();\n                try { holding.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { rw.readLock().unlock(); }\n            });\n            holding.await(2, TimeUnit.SECONDS);\n            AtomicBoolean writerIn = new AtomicBoolean();\n            Thread writer = Main.start(&quot;patient-writer&quot;, () -&gt; {\n                rw.writeLock().lock();\n                try { writerIn.set(true); } finally { rw.writeLock().unlock(); }\n            });\n            Main.awaitState(rw, s -&gt; s.waitingWriters() == 1, 2000);\n            for (int i = 0; i &lt; 200; i++) rw.wakeWaitersForTest();      // 200 spurious wakeups, no state change\n            Thread.sleep(50);\n            check(!writerIn.get(), &quot;200 spurious wakeups let nobody in while a reader is still inside&quot;);\n            check(rw.stats().waitingWriters() == 1, &quot;the woken writer re-tested, parked again and kept its ticket&quot;);\n            letGo.countDown();\n            reader.join(3000); writer.join(3000);\n            check(writerIn.get(), &quot;the real change -- the last reader leaving -- is what admits it&quot;);\n            rw.wakeWaitersForTest();                                    // a signal with nobody parked\n            boolean got = rw.writeLock().tryLock();\n            check(got, &quot;a wake with nobody parked is dropped, and costs the next acquire nothing&quot;);\n            if (got) rw.writeLock().unlock();\n        }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; &quot;Who arrived first?&quot; every time somebody asks to go in. Make it O(1).</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Each waiter takes a ticket, a <code>long</code> that only goes up, and parks itself in the queue for its own side. Because tickets only go up, arrival order <i>is</i> queue order, so the oldest waiting writer is the head of the writer queue: one peek. The fairness rule is handed a read-only view with six O(1) questions on it and nothing that can change anything, so it can decide who waits and cannot corrupt who is inside. The honest caveat, which you should say before you are asked: removing a cancelled waiter from the middle of a queue is O(waiters). It happens once per timeout or interrupt, and the fix &mdash; a linked node per waiter that can unlink itself &mdash; is precisely what AbstractQueuedSynchronizer keeps.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The read-only view of the lock&#x27;s counters. This, and only this, is what a fairness rule may see: it can\n * decide who waits, and it cannot touch the state that decides who is inside.\n */\ninterface LockState {\n    /** How many threads are inside the read side right now. */\n    int readers();\n    /** Is a thread inside the write side right now. */\n    boolean writerActive();\n    /** How many readers are parked. */\n    int waitingReaders();\n    /** How many writers are parked. */\n    int waitingWriters();\n    /** The ticket of the longest-waiting writer, or Long.MAX_VALUE when no writer is parked. */\n    long earliestWaitingWriterTicket();\n    /** The ticket of the longest-waiting thread of either kind, or Long.MAX_VALUE when nobody is parked. */\n    long earliestWaitingTicket();\n}\n\n/**\n     * Give the write side back. The last release wakes both sides, because with a swappable rule the lock does\n     * not know which side may now go in; each woken thread re-tests its own predicate and parks again if not.\n     */\n    void releaseWrite() {\n        boolean fully = false;\n        int readersAfter;\n        mutex.lock();\n        try {\n            if (writerOwner != Thread.currentThread())\n                throw new IllegalMonitorStateException(&quot;this thread does not hold the write lock&quot;);\n            if (--writerHolds == 0) { writerOwner = null; fully = true; wakeBoth(); }\n            readersAfter = readers;\n        } finally { mutex.unlock(); }\n        if (fully) publish(EventKind.WRITE_RELEASED, 0, readersAfter);\n    }\n\n    // ---------------- the counters, read only while the mutex is held\n\n    public int readers() { return readers; }\n    public boolean writerActive() { return writerHolds &gt; 0; }\n    public int waitingReaders() { return readerQueue.size(); }\n    public int waitingWriters() { return writerQueue.size(); }\n    public long earliestWaitingWriterTicket() { Long t = writerQueue.peekFirst(); return t == null ? Long.MAX_VALUE : t; }\n    public long earliestWaitingTicket() {\n        Long r = readerQueue.peekFirst();\n        return Math.min(earliestWaitingWriterTicket(), r == null ? Long.MAX_VALUE : r);\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Downgrade and upgrade: a writer that wants to keep reading, and a reader that decides it needs to write.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Downgrade is legal and useful, so the lock supports it: a thread holding the write side takes the read side and is admitted immediately without consulting the fairness rule, then drops the write side. Nobody got in between, so it now reads exactly what it just wrote. That immediate admission is not a shortcut: parking a thread that already holds something would be a deadlock with itself, and the same rule is what makes a reentrant read safe under writer preference. Upgrade is the trap. Two readers that both want to write would each be waiting for the other's read hold to disappear, forever, so the lock refuses it with an exception the moment it sees the caller already holds a read hold &mdash; a loud failure in zero milliseconds instead of a silent hang. The safe shape is in Extensions.java: let go of the read hold, take the write hold, and <i>re-check</i>, because the world moved while you had nothing.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 6. downgrade is allowed, upgrade is refused instead of deadlocking, and both sides are reentrant\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            rw.writeLock().lock();\n            rw.writeLock().lock();                                   // reentrant write: counts, does not block\n            rw.writeLock().unlock();\n            rw.readLock().lock();                                    // downgrade: still the writer, admitted at once\n            rw.writeLock().unlock();\n            check(rw.stats().readers() == 1 &amp;&amp; !rw.stats().writerActive(), &quot;write -&gt; read downgrade leaves exactly one read hold&quot;);\n            AtomicBoolean otherGotIn = new AtomicBoolean();\n            Thread other = Main.start(&quot;other-writer&quot;, () -&gt; {\n                if (rw.writeLock().tryLock()) { otherGotIn.set(true); rw.writeLock().unlock(); }\n            });\n            other.join(2000);\n            check(!otherGotIn.get(), &quot;and another thread&#x27;s writer is kept out while that read hold is alive&quot;);\n            rw.readLock().lock();                                    // reentrant read\n            rw.readLock().unlock();\n            rw.readLock().unlock();\n            check(rw.stats().readers() == 0, &quot;both read holds released, the lock is free&quot;);\n\n            rw.readLock().lock();\n            boolean refused = false;\n            long t0 = System.currentTimeMillis();\n            try { rw.writeLock().lock(); } catch (IllegalStateException e) { refused = true; }\n            long took = System.currentTimeMillis() - t0;\n            rw.readLock().unlock();\n            check(refused &amp;&amp; took &lt; 1000, &quot;a read-to-write upgrade is refused at once (&quot; + took + &quot;ms), never a silent deadlock&quot;);\n        }\n\n// ---- ext: upgrading safely -- drop the read hold, take the write hold, then RE-CHECK\n/**\n * The lock refuses a read-to-write upgrade because two upgraders would wait for each other forever. The safe\n * shape is to let go first and then re-check, and the re-check is the whole point: two threads can both decide\n * &quot;it is missing&quot;, both arrive at the write lock, and only the first one may insert. This is the same\n * double-check that makes a cache loader safe.\n */\nfinal class UpgradeSafely {\n    private UpgradeSafely() {}\n\n    /** Read it under the read lock; if it is missing, let go, take the write lock, and look again. */\n    static &lt;K, V&gt; V computeIfAbsent(RwLock rw, Map&lt;K, V&gt; data, K key, Function&lt;K, V&gt; maker) throws InterruptedException {\n        rw.readLock().lock();\n        try { V found = data.get(key); if (found != null) return found; }\n        finally { rw.readLock().unlock(); }                       // let go BEFORE asking for the write side\n        rw.writeLock().lock();\n        try {\n            V again = data.get(key);                              // the gap: somebody may have inserted it\n            if (again != null) return again;\n            V made = maker.apply(key);\n            data.put(key, made);\n            return made;\n        } finally { rw.writeLock().unlock(); }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>9 &middot; Add tryLock, and tryLock with a timeout.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both fall out of one parameter instead of two more methods. The acquire methods take a mode: park until admitted, do not park at all, or park until a deadline. Non-blocking asks the fairness rule once and returns false without ever registering a ticket, so there is nothing to clean up. Timed computes its deadline from the injected clock, then on each turn of the while loop works out what is left and calls the timed <code>await</code>; when nothing is left it gives up, drops its ticket and wakes both sides. The loop shape is the important part: recomputing the remaining time on every wake is what stops a thread that is woken ten times from waiting ten timeouts.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** The read side. It owns nothing: it is a handle on the one Sync, which is why both sides see one set of counters. */\nfinal class ReadLock implements Lock {\n    private final Sync sync;\n    ReadLock(Sync sync) { this.sync = sync; }\n    public void lock() throws InterruptedException { sync.acquireRead(Sync.BLOCK, 0); }\n    public boolean tryLock() {\n        try { return sync.acquireRead(Sync.NO_WAIT, 0); }\n        catch (InterruptedException e) { Thread.currentThread().interrupt(); return false; }\n    }\n    public boolean tryLock(long timeoutMs) throws InterruptedException { return sync.acquireRead(Sync.TIMED, timeoutMs); }\n    public void unlock() { sync.releaseRead(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>10 &middot; Where does time come from, and how do you test a thirty-second deadline?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The lock is handed a <code>Clock</code> and never reads the wall clock itself. Deadlines are computed from it and so is the waited-for time on every event, which is what a starvation meter reads. So a test injects a clock whose every call is thirty seconds later than the last, holds the write lock in another thread, and asks for a read with a thirty-second timeout: the loop computes its remaining time, finds it is already past, and gives up &mdash; in under a millisecond of real time. The assertion is on the real clock, so the test proves both that the deadline was honoured and that no wall-clock time was spent.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">            // the injected clock: a thirty-second deadline can pass in a millisecond of real time\n            RwLock timed = new RwLock();\n            timed.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            long[] fake = { 1_000_000L };\n            timed.setClock(() -&gt; { long now = fake[0]; fake[0] += 30_000; return now; });   // every look is 30s later\n            CountDownLatch writing = new CountDownLatch(1), release = new CountDownLatch(1);\n            Thread w = Main.start(&quot;writer&quot;, () -&gt; {\n                timed.writeLock().lock();\n                try { writing.countDown(); release.await(5, TimeUnit.SECONDS); } finally { timed.writeLock().unlock(); }\n            });\n            writing.await(2, TimeUnit.SECONDS);\n            long t0 = System.currentTimeMillis();\n            boolean acquired = timed.readLock().tryLock(30_000);\n            long realMs = System.currentTimeMillis() - t0;\n            check(!acquired &amp;&amp; realMs &lt; 1000, &quot;a 30s deadline expires on the injected clock in &quot; + realMs + &quot;ms of real time&quot;);\n            release.countDown();\n            w.join(3000);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; Now I want a condition on top: &quot;wait until the document is not empty.&quot;</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The parking is the easy half. The hard half is that <code>await</code> has to give the write hold up &mdash; otherwise nobody can ever change the thing being waited for &mdash; and take it back before returning, or the caller comes back holding less than it had. The reference code hands each waiter a latch, drops the write lock, waits with a timeout, and re-acquires in a loop that ignores interruption and restores the interrupt flag afterwards: you may be cancelled, but you never come back without your lock. Callers still use the same <code>while</code> loop around the predicate that the lock itself uses internally, for the same reason. Worth knowing out loud: the JDK refuses this on the read side. <code>ReentrantReadWriteLock.readLock().newCondition()</code> throws <code>UnsupportedOperationException</code>, because a waiting reader would have to give up a hold it shares with other readers, and there is no way to hand exactly that back. Only the write side has conditions, which is the same restriction this code lives under.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a condition variable on the write lock -- await() must drop the WHOLE hold and take it back\n/**\n * &quot;Wait until the document is not empty&quot; needs a condition bound to the write lock. The hard part is not the\n * parking: it is that await() has to give the write hold up, or nobody can ever change the thing it is waiting\n * for, and then take it back before returning, or the caller comes back holding less than it had. The\n * re-acquire is done ignoring interruption and the flag is restored afterwards, which is what a real\n * Condition does: you may be cancelled, but you never come back without your lock.\n */\nfinal class WriteCondition {\n    private final RwLock rw;\n    private final Deque&lt;CountDownLatch&gt; waiters = new ArrayDeque&lt;&gt;();\n    private final ReentrantLock guard = new ReentrantLock();\n\n    WriteCondition(RwLock rw) { this.rw = rw; }\n\n    /**\n     * Call while holding the write lock exactly once. Returns true if signalled, false if the timeout won.\n     * A full implementation would record the hold count first and restore it; this one assumes a single hold.\n     */\n    boolean await(long timeoutMs) throws InterruptedException {\n        CountDownLatch mine = new CountDownLatch(1);\n        guard.lock();\n        try { waiters.addLast(mine); } finally { guard.unlock(); }\n        rw.writeLock().unlock();                                  // drop it, or nobody can signal us\n        try {\n            return mine.await(timeoutMs, TimeUnit.MILLISECONDS);\n        } finally {\n            boolean interrupted

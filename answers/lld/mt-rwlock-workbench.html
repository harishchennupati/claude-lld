<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Write a read-write lock. Many threads read one document and a few change it; readers should not block each other, a writer needs it to itself. Build it from a lock and conditions &mdash; no <code>ReentrantReadWriteLock</code> &mdash; and make the fairness rule something I can change. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>Two kinds of thread want the same piece of data. Some only read it; some change it. Two reads never disagree with each other, so any number of them can happen at once. A change disagrees with everything, so it has to happen alone. That one sentence is the whole specification, and it tells you exactly what state you have to keep: how many readers are inside right now, and whether a writer is inside. Everything else is deciding who waits. The invariant is small and absolute: at any instant the data has many readers and no writer, or one writer and no readers, and never anything in between. Break it once and a reader sees a half-finished change &mdash; a torn read &mdash; which is the bug the lock exists to prevent.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: a class that compiles, with a <code>main</code> that starts real threads and shows the invariant holding. The interviewer is watching for, in this order: the questions you ask before typing (reentrant? upgradable? may writers starve?); which classes exist and which one owns the counters; a read and a write end to end; the race &mdash; and notice the race here is in the lock's own bookkeeping, because <code>readers++</code> from two threads is itself a read-modify-write; the wait protocol, which is where most candidates lose the round (<code>while</code> not <code>if</code>, signal after the change, wake the side that can actually move); where the rule that will change lives; and what happens to a thread that is interrupted or times out while parked. Then the twists: fairness, reentrancy, downgrade, upgrade, timeouts, conditions, and when not to write this at all.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 345\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><g transform=\"translate(175 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a thread wants to read</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">many of them, at once</text></g><path d=\"M415 57 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">must I wait? ask the rule</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">readers, writer, who is queued</text></g><path d=\"M675 57 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">no: readers++ and go in</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">under the mutex, as one step</text></g><path d=\"M935 57 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">read; then readers--</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the last one out wakes a writer</text></g><text x=\"88\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">write</text><g transform=\"translate(175 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a thread wants to write</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one at a time, alone</text></g><path d=\"M415 192 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">must I wait? ask the rule</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">any reader inside? any writer?</text></g><path d=\"M675 192 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">no: the writer is me</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">and nobody else is inside</text></g><path d=\"M935 192 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">change it; then wake both</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">both sides re-test and decide</text></g><path d=\"M555 84 V92\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 92)\"><rect width=\"240\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"120.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">yes: park on okToRead</text><text x=\"120.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">woken when a writer releases</text></g><path d=\"M555 219 V227\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 227)\"><rect width=\"240\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"120.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">yes: park on okToWrite</text><text x=\"120.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">woken when readers hits zero</text></g><text x=\"88\" y=\"300\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">ask</text><text x=\"175\" y=\"300\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, without touching the guarded data: how many readers are inside?  is a writer inside?  who is waiting, and who arrived first?</text><text x=\"615\" y=\"330\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">many readers at the same time, OR one writer alone -- never both, whatever fairness rule is in force</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Reentrant? Can a thread that holds it take it again?</td><td>Yes on both sides; a writer may downgrade to a reader</td><td>An owner thread, a hold count, and a per-thread read count (moves 5, 6)</td></tr><tr><td>Is writer starvation acceptable?</td><td>No: a queued writer makes new readers wait</td><td>The fairness rule lives behind an interface (move 3)</td></tr><tr><td>May a reader upgrade to a writer?</td><td>No &mdash; refuse it loudly</td><td>A per-thread read count and an exception instead of a deadlock (move 6)</td></tr><tr><td>Blocking only, or also tryLock and timeouts?</td><td>Both, and the wait is interruptible</td><td>Three acquire modes and a deadline from an injected clock (moves 6, 9)</td></tr><tr><td>From scratch, or may I use <code>ReentrantReadWriteLock</code> or AQS?</td><td>From scratch: one <code>ReentrantLock</code> and two <code>Condition</code>s</td><td>The whole shape of the file; the <code>synchronized</code> build is a follow-up (moves 4, 8)</td></tr><tr><td>One JVM, or shared across processes?</td><td>One JVM, in memory</td><td>No store, no lease, no fencing token yet (move 12)</td></tr><tr><td>Read-heavy or write-heavy, and how long is a critical section?</td><td>Read-heavy; reads of about a millisecond; writes rare</td><td>Whether a read-write lock beats a plain mutex at all (move 8)</td></tr><tr><td>What is the lock actually guarding?</td><td>A document the caller owns; the lock never touches it</td><td>The lock has no opinion about the data, which is why it is reusable (move 1)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Two handles, <code>readLock()</code> and <code>writeLock()</code>, each with <code>lock()</code> and <code>unlock()</code>, paired in a <code>finally</code>.</li>\n<li>Many readers inside at the same time; a writer inside alone.</li>\n<li>The fairness rule is chosen when the lock is built: readers first, writers first, or arrival order.</li>\n<li>Both sides are reentrant, and a writer may downgrade to a reader without letting anybody in between.</li>\n<li>A read-to-write upgrade is refused with an exception, because it is a deadlock waiting to happen.</li>\n<li><code>tryLock()</code> and <code>tryLock(timeout)</code> for a caller that will not wait.</li>\n<li>A parked thread can be interrupted, and leaves the lock exactly as it found it.</li>\n<li>The counters can be read for metrics and tests without guessing.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>The invariant, whatever rule is in force: never a reader beside a writer, never two writers.</li>\n<li>Acquire and release are O(1): a few field updates and one predicate call.</li>\n<li>No busy-waiting: a thread that cannot go in parks, and costs no CPU while it waits.</li>\n<li>No lost and no spurious wakeups: the predicate is tested and the parking done under one mutex, every predicate is re-tested in a <code>while</code> loop, and every change that could admit somebody signals.</li>\n<li>The fairness rule is swappable without touching one line of the blocking machinery.</li>\n<li>One source of truth: one <code>Sync</code>; the two handles own nothing at all.</li>\n<li>Nothing half-done: a thread that gives up leaves the counters exactly as they were.</li>\n<li>In memory, one JVM, no persistence (say it; a follow-up adds it).</li></ul></div></div>\n<div class=\"move\"><h3>One second, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 175\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">0.000s  six readers arrive</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">all six are admitted, ~65 ns each</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">readers = 6, nobody is parked</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">0.002s  a writer arrives</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">six readers are inside, so it parks</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">and new readers queue behind it</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">0.004s  the last reader leaves</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">readers hits 0: now a writer wakes</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">it re-tests, then goes in alone</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">0.006s  the writer releases</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">both conditions are signalled</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the queued readers go in together</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> many readers or one writer, never both; built on one <code>ReentrantLock</code> with two conditions, not on <code>synchronized</code> and not on AQS; both sides reentrant, downgrade allowed, upgrade refused with an exception; the fairness rule handed in, with writers-first as the default; blocking waits are interruptible and there is a timed variant. Named as out of scope: strict FIFO with a real waiter queue, lock-free reads, anything across processes &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">The same twelve moves as every other LLD on this site, applied to a problem with almost no nouns. That is what makes it a good exercise: with only three numbers to design, the moves that usually get waved through &mdash; the race, the order of operations, what is inside the lock &mdash; are the entire problem, and the answer to every twist falls out of them.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 225\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">many READERS share the DATA; one WRITER has it alone; a LOCK counts who is inside; a RULE decides who waits; a TICKET says who arrived first</text><g transform=\"translate(30 110)\"><rect width=\"170\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"85.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Reader / Writer</text><text x=\"85.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">threads, not classes</text></g><path d=\"M115.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(226 110)\"><rect width=\"186\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Sync</text><text x=\"93.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">readers, writer, queues</text></g><path d=\"M319.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(438 110)\"><rect width=\"204\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"102.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ReadLock / WriteLock</text><text x=\"102.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">handles: no state</text></g><path d=\"M540.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(668 110)\"><rect width=\"156\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"78.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AdmissionPolicy</text><text x=\"78.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a rule: no state</text></g><path d=\"M746.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(850 110)\"><rect width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"75.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ticket: long</text><text x=\"75.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">just a number</text></g><path d=\"M925.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1026 110)\"><rect width=\"174\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"87.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the guarded data</text><text x=\"87.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the caller's, not ours</text></g><path d=\"M1113.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a thread, a handle, an interface, a number, or somebody else's data</text><text x=\"615\" y=\"210\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">exactly one box here is solid, and that is the point: a lock is three numbers and the discipline around them</text></svg></div><div class=\"move\"><p>Reading the paragraph again: many <b>readers</b> share the <b>data</b>; one <b>writer</b> has it alone; something <b>counts</b> who is inside; a <b>rule</b> decides who waits; a <b>ticket</b> remembers who arrived first. Readers and writers are threads, not classes &mdash; they are the callers, and a lock that had a Reader class would be a lock that owned its users. The counting thing has real state that changes: how many readers are inside, whether a writer is inside and which thread it is, and who is parked. That is the one class, and this file calls it <code>Sync</code>. The two handles callers hold, <code>ReadLock</code> and <code>WriteLock</code>, own nothing at all: each is a reference to the same <code>Sync</code>, which is exactly why the two sides see one set of counters instead of two. The rule has no state either, so it is an interface. The ticket is a <code>long</code>. And the guarded data is not in the diagram at all: the lock never touches it, which is the only reason the same lock works for a document, a routing table and a cache.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 302\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">get in as a reader</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 46 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 24)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Sync  (owns the counters)</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M850 46 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 24)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">sync.acquireRead(mode, timeoutMs)</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 80)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">get in as a writer, alone</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 102 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 80)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Sync  (owns the counters)</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M850 102 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 80)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">sync.acquireWrite(mode, timeoutMs)</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 136)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">should this thread wait?</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 158 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 136)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AdmissionPolicy  (owns nothing)</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M850 158 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 136)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">policy.readerMustWait(state, ticket)</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 192)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">let the next one in</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 214 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 192)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Sync  (owns the two conditions)</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M850 214 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 192)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">okToRead / okToWrite.signalAll()</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the rule is asked, never obeyed blindly: it returns true or false, and Sync does all the parking and all the waking</text><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">notice what has no method of its own: the data. A lock that touched the data would only work for that one document</text></svg></div><div class=\"move\"><p>\"Get in as a reader\" and \"get in as a writer\" both touch the counters, so both belong to <code>Sync</code>: <code>acquireRead</code> and <code>acquireWrite</code>. \"Should this thread wait?\" touches nothing &mdash; it reads the counters and returns true or false &mdash; so it belongs to a pure rule, <code>policy.readerMustWait(state, ticket)</code>. \"Let the next one in\" touches the two conditions, which only <code>Sync</code> has, so the signalling lives there too. Notice the shape that falls out: the rule is <i>asked</i>, never obeyed blindly, and it never parks anybody. Asking and parking are different jobs, and keeping them apart is what lets you swap the fairness rule in one line without touching a single <code>await</code>. And notice what gets no method at all: the data. A lock that read or wrote the document would only ever work for that document.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 276\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 70)\"><rect width=\"230\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"115.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RwLock</text><text x=\"115.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(rule, listeners)</text></g><path d=\"M260 115 H330 V46 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AdmissionPolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who waits when both want in</text></g><g transform=\"translate(760 24)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ReaderPreference / WriterPreference / FairOrder</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 46 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 115 H330 V112 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 90)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LockObserver</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">metrics, logs, a starvation alarm</text></g><g transform=\"translate(760 90)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Metrics, StarvationMeter, a lambda</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 112 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 115 H330 V178 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 156)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where a deadline comes from</text></g><g transform=\"translate(760 156)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::currentTimeMillis, or a test's fake</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 178 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"240\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. Sync never builds a rule, so \"make writers win\" is a different object, not an edited method</text><text x=\"615\" y=\"262\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one rule wraps every other rule: SafePolicy(rule) adds \"never a reader beside a writer\" on top of whatever fairness says</text></svg></div><div class=\"move\"><p>Three things will change. Who waits when both sides want in &mdash; readers first (fast, and a writer can starve forever), writers first (a queued writer makes new readers wait), or arrival order &mdash; and the interviewer will change it mid-round, which is the single most likely twist on this problem. Who wants to know what happened &mdash; a latency histogram today, a starvation alarm next week. And where a deadline comes from, because a test must be able to make thirty seconds pass. Each becomes a small interface the lock is <i>given</i> in <code>configure()</code> and never builds. This is where the patterns come from, not the other way round: a swappable rule behind an interface is <b>Strategy</b>; a rule that wraps another rule and adds to it is <b>Decorator</b>, and here it is the one that matters &mdash; <code>SafePolicy</code> wraps every rule the lock is handed and adds \"never a reader beside a writer\" on top, so a rule written next year can get fairness wrong and still cannot corrupt the data. A lock that announces what happened without knowing what a metrics box is, is <b>Observer</b>. I do them; I do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 258\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"615\" y=\"22\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two readers arrive at the same instant, and the counter they both change is the lock's OWN state</text><text x=\"150\" y=\"62\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--acc2)\">thread A</text><text x=\"150\" y=\"112\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--acc2)\">thread B</text><rect x=\"170\" y=\"46\" width=\"180\" height=\"26\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"260.0\" y=\"62.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">read readers = 3</text><rect x=\"560\" y=\"46\" width=\"180\" height=\"26\" rx=\"3\" fill=\"#2d2116\" stroke=\"var(--warn)\" stroke-width=\"1.2\"/><text x=\"650.0\" y=\"62.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">write readers = 4</text><rect x=\"365\" y=\"96\" width=\"180\" height=\"26\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"455.0\" y=\"112.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">read readers = 3</text><rect x=\"755\" y=\"96\" width=\"180\" height=\"26\" rx=\"3\" fill=\"#2d2116\" stroke=\"var(--warn)\" stroke-width=\"1.2\"/><text x=\"845.0\" y=\"112.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">write readers = 4</text><path d=\"M160 140 H955\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><path d=\"M260 140 V145\" stroke=\"var(--line)\"/><text x=\"260\" y=\"159\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">t1</text><path d=\"M455 140 V145\" stroke=\"var(--line)\"/><text x=\"455\" y=\"159\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">t2</text><path d=\"M650 140 V145\" stroke=\"var(--line)\"/><text x=\"650\" y=\"159\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">t3</text><path d=\"M845 140 V145\" stroke=\"var(--line)\"/><text x=\"845\" y=\"159\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">t4</text><rect x=\"552\" y=\"36\" width=\"400\" height=\"130\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"747\" y=\"182\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">two readers came in and the count says 4, not 5</text><text x=\"747\" y=\"200\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">one of them is invisible: the last one out will think the lock is free</text><text x=\"747\" y=\"218\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">and let a writer in while somebody is still reading</text><g transform=\"translate(980 46)\"><rect width=\"230\" height=\"76\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"115.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one mutex</text><text x=\"115.0\" y=\"48.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read and write as ONE step</text></g><text x=\"1095\" y=\"142\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the fix is not a volatile int:</text><text x=\"1095\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">++ is read, add, write -- three steps.</text><text x=\"1095\" y=\"178\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">volatile makes each step visible,</text><text x=\"1095\" y=\"196\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">not the three of them one step.</text><text x=\"615\" y=\"244\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">so the lock's own three numbers live behind one ReentrantLock, and every acquire and release takes it for about forty nanoseconds</text></svg></div><div class=\"move\"><p>Here is the joke at the centre of this problem: the lock's own bookkeeping has a race. Two readers arrive at the same instant, both read <code>readers</code> as 3, both write 4, and one of them has become invisible &mdash; so the last one out will see the count reach zero while somebody is still reading, and will happily let a writer in. So the three numbers live behind one <code>ReentrantLock</code>, and every acquire and release takes it for about forty nanoseconds. That internal mutex is doing a second job you should mention out loud: it is also what publishes a writer's changes to the next reader. A hand-rolled lock built on spinning and plain fields would be safe against races and still let a reader see stale data, because nothing would have established a happens-before.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 306\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many readers are inside?</text></g><path d=\"M390 39 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 20)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">int readers</text></g><path d=\"M990 39 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 20)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 66)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is a writer inside, and is it me?</text></g><path d=\"M390 85 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 66)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">int writerHolds + Thread writerOwner</text></g><path d=\"M990 85 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 66)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 112)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who is parked, and who arrived first?</text></g><path d=\"M390 131 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 112)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ArrayDeque&lt;Long&gt; per side, in arrival order</text></g><path d=\"M990 131 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 112)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) peek</text></g><g transform=\"translate(30 158)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">do I already hold the read side?</text></g><path d=\"M390 177 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 158)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ThreadLocal&lt;int[]&gt; readHolds</text></g><path d=\"M990 177 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 158)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 204)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which fairness rule is this?</text></g><path d=\"M390 223 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 204)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EnumMap&lt;Policy, AdmissionPolicy&gt;</text></g><path d=\"M990 223 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 204)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><text x=\"615\" y=\"272\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the per-thread read count is not bookkeeping for its own sake: it is how a reentrant read is let straight in, and how an upgrade is caught</text><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the one step that is not O(1): pulling a cancelled waiter out of the middle of a queue, O(waiters). AQS keeps a linked node per waiter so even that is O(1)</text></svg></div><div class=\"move\"><p>\"How many readers are inside?\" is an <code>int</code>. \"Is a writer inside, and is it me?\" is a hold count plus the owner thread &mdash; the owner is what makes reentrancy and the downgrade possible, because both are really the question \"is this thread already in?\". \"Who is parked, and who arrived first?\" is one <code>ArrayDeque</code> of tickets per side; because tickets only go up, the head of each queue is the oldest waiter, so \"is a writer ahead of me?\" is a peek. \"Do I already hold the read side?\" is a <code>ThreadLocal</code> count, and it earns its place twice over: a reentrant read is let straight in, and a read holder asking for the write lock is caught and refused instead of deadlocking. \"Which rule is this?\" is an <code>EnumMap</code>. It needs one line of hygiene an interviewer asks for if their services run on thread pools: when a thread's read count drops to zero the entry is <code>remove()</code>d, because a pooled thread lives for months and an entry left on it is a leak. One step is not O(1), and you should say so before you are asked: pulling a cancelled waiter out of the middle of a queue is O(waiters). It happens once per timeout or interrupt, and a linked node per waiter &mdash; which is what AQS keeps &mdash; makes even that constant.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 426\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"615\" y=\"22\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the wait protocol, drawn: what happens between \"I cannot go in\" and \"I am in\"</text><text x=\"150\" y=\"62\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--acc2)\">writer W</text><text x=\"150\" y=\"132\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--acc2)\">reader R</text><rect x=\"160\" y=\"46\" width=\"120\" height=\"28\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\" stroke-width=\"1.2\"/><text x=\"220.0\" y=\"63.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">take mutex</text><rect x=\"284\" y=\"46\" width=\"150\" height=\"28\" rx=\"3\" fill=\"#2d2116\" stroke=\"var(--warn)\" stroke-width=\"1.2\"/><text x=\"359.0\" y=\"63.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">readers = 2: wait</text><rect x=\"438\" y=\"46\" width=\"96\" height=\"28\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\" stroke-width=\"1.2\"/><text x=\"486.0\" y=\"63.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">register</text><rect x=\"538\" y=\"46\" width=\"300\" height=\"28\" rx=\"3\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"688.0\" y=\"63.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">await(): the MUTEX IS RELEASED</text><rect x=\"842\" y=\"46\" width=\"120\" height=\"28\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\" stroke-width=\"1.2\"/><text x=\"902.0\" y=\"63.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">woken, re-test</text><rect x=\"966\" y=\"46\" width=\"244\" height=\"28\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\" stroke-width=\"1.2\"/><text x=\"1088.0\" y=\"63.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">writer = me, unlock mutex</text><rect x=\"160\" y=\"116\" width=\"378\" height=\"28\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"349.0\" y=\"133.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">R1 and R2 are inside, reading</text><rect x=\"542\" y=\"116\" width=\"150\" height=\"28\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\" stroke-width=\"1.2\"/><text x=\"617.0\" y=\"133.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">R1 releases: 2 -> 1</text><rect x=\"696\" y=\"116\" width=\"142\" height=\"28\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\" stroke-width=\"1.2\"/><text x=\"767.0\" y=\"133.5\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text)\">R2 releases: 1 -> 0</text><path d=\"M767 144 V164\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"767\" y=\"182\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">readers hits zero -> signal okToWrite, and only okToWrite: no reader's answer changed</text><path d=\"M160 202 H1210\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><path d=\"M220 202 V207\" stroke=\"var(--line)\"/><text x=\"220\" y=\"221\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">take</text><path d=\"M613 202 V207\" stroke=\"var(--line)\"/><text x=\"613\" y=\"221\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">parked: costs nothing</text><path d=\"M900 202 V207\" stroke=\"var(--line)\"/><text x=\"900\" y=\"221\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">re-test</text><path d=\"M1088 202 V207\" stroke=\"var(--line)\"/><text x=\"1088\" y=\"221\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">inside</text><rect x=\"20\" y=\"244\" width=\"560\" height=\"168\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"266\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">three states, and the edge that is missing</text><g transform=\"translate(40 284)\"><rect width=\"140\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FREE</text><text x=\"70.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">0 readers, no writer</text></g><g transform=\"translate(240 284)\"><rect width=\"150\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">READING</text><text x=\"75.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">n >= 1, no writer</text></g><g transform=\"translate(240 352)\"><rect width=\"150\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WRITING</text><text x=\"75.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">exclusive</text></g><path d=\"M180 300 H240\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M240 318 H180\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M180 312 V374 H240\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"430\" y=\"294\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#ff6b6b\">READING -> WRITING</text><text x=\"430\" y=\"310\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#ff6b6b\">has no edge: an upgrade</text><text x=\"430\" y=\"326\" text-anchor=\"start\" font-size=\"10.5\" fill=\"#ff6b6b\">must go through FREE</text><text x=\"430\" y=\"356\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--acc)\">WRITING -> READING is</text><text x=\"430\" y=\"372\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--acc)\">legal: the downgrade,</text><text x=\"430\" y=\"388\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--acc)\">same thread, nobody</text><text x=\"430\" y=\"404\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--acc)\">gets in between</text><rect x=\"610\" y=\"244\" width=\"600\" height=\"168\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"910\" y=\"266\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside acquire, and why it is this order</text><text x=\"625\" y=\"290\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--text)\">1 take the mutex -- nothing below is safe to read without it</text><text x=\"625\" y=\"307\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--text)\">2 already holding? go straight in: a parked holder is a deadlock with itself</text><text x=\"625\" y=\"324\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--text)\">3 take a ticket, then ask the rule: must I wait?</text><text x=\"625\" y=\"341\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--text)\">4 if yes: register the ticket, then await IN A WHILE LOOP</text><text x=\"625\" y=\"358\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--text)\">5 on waking, re-test -- the state may have moved again since the signal</text><text x=\"625\" y=\"375\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--text)\">6 only now change readers / writer, and only then release the mutex</text><text x=\"625\" y=\"392\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">7 tell the observers afterwards, outside the mutex, in a try/catch</text></svg></div><div class=\"move\"><p>The lock has three states: FREE, READING (one or more readers, no writer) and WRITING (exactly one writer, no readers). The design is not in the three boxes; it is in the edge that is <i>missing</i>. There is no arrow from READING straight to WRITING, which is why a read-to-write upgrade is refused: two threads both holding a read hold and both asking to write would each be waiting for the other to let go. WRITING to READING, on the other hand, is legal and useful &mdash; the same thread keeps its place, publishes its change and goes on reading it. Then the order inside <code>acquire</code>, which is where rounds are lost. Take the mutex first, because nothing below is safe to read without it. If this thread already holds something, let it straight in, because parking a holder is a deadlock with itself. Take a ticket, ask the rule, and if the answer is wait, register the ticket and <code>await</code> <i>in a while loop</i>. Two accidents make that loop compulsory, and an interviewer will ask you to name both. A <b>spurious wakeup</b> is <code>await</code> returning when nobody signalled at all &mdash; the JVM is allowed to do that, so a thread that trusted the wake would walk in on a writer. A <b>lost wakeup</b> is the mirror image: a signal sent while the thread is not yet parked, and therefore thrown away. That is why the predicate is tested and the parking is done under the same mutex, with no gap between them for a signal to fall into. The loop covers a third and commoner case too: the wake was real, but somebody else took the lock between the signal and your turn to look. So a wake always means \"look again\", never \"it is your turn\" &mdash; and test 9 proves it, with two hundred wakes that change nothing and admit nobody. Only after the loop ends do you change the counters, and only then release the mutex. Observers are told last, outside the mutex, in a try/catch.</p></div><div class=\"move\"><h3>Move 7: yes, the bookkeeping happens one at a time. Ask for how long, and what is inside.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 462\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"615\" y=\"22\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">six readers and one writer on one document, over ten milliseconds of real time</text><text x=\"146\" y=\"52\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\">reader 1</text><rect x=\"160\" y=\"40\" width=\"300\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><rect x=\"160\" y=\"40\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"457\" y=\"40\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"626\" y=\"40\" width=\"420\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><rect x=\"626\" y=\"40\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"1043\" y=\"40\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><text x=\"146\" y=\"74\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\">reader 2</text><rect x=\"160\" y=\"62\" width=\"294\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><rect x=\"160\" y=\"62\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"451\" y=\"62\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"631\" y=\"62\" width=\"412\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><rect x=\"631\" y=\"62\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"1040\" y=\"62\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><text x=\"146\" y=\"96\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\">reader 3</text><rect x=\"160\" y=\"84\" width=\"288\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><rect x=\"160\" y=\"84\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"445\" y=\"84\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"636\" y=\"84\" width=\"404\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><rect x=\"636\" y=\"84\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"1037\" y=\"84\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><text x=\"146\" y=\"118\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\">reader 4</text><rect x=\"160\" y=\"106\" width=\"282\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><rect x=\"160\" y=\"106\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"439\" y=\"106\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"641\" y=\"106\" width=\"396\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><rect x=\"641\" y=\"106\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"1034\" y=\"106\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><text x=\"146\" y=\"140\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\">reader 5</text><rect x=\"160\" y=\"128\" width=\"276\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><rect x=\"160\" y=\"128\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"433\" y=\"128\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"646\" y=\"128\" width=\"388\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><rect x=\"646\" y=\"128\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"1031\" y=\"128\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><text x=\"146\" y=\"162\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--muted)\">reader 6</text><rect x=\"160\" y=\"150\" width=\"270\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><rect x=\"160\" y=\"150\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"427\" y=\"150\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"651\" y=\"150\" width=\"380\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><rect x=\"651\" y=\"150\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"1028\" y=\"150\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><text x=\"146\" y=\"194\" text-anchor=\"end\" font-size=\"11\" fill=\"var(--warn)\">writer</text><rect x=\"500\" y=\"182\" width=\"118\" height=\"15\" rx=\"3\" fill=\"#2d2116\" stroke=\"var(--warn)\" stroke-width=\"1.2\"/><text x=\"559.0\" y=\"193.0\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--text)\">exclusive</text><rect x=\"500\" y=\"182\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"615\" y=\"182\" width=\"3\" height=\"15\" fill=\"var(--acc)\"/><rect x=\"470\" y=\"182\" width=\"26\" height=\"15\" rx=\"3\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><path d=\"M160 214 H1200\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><path d=\"M160 214 V219\" stroke=\"var(--line)\"/><text x=\"160\" y=\"233\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">0 ms</text><path d=\"M264 214 V219\" stroke=\"var(--line)\"/><text x=\"264\" y=\"233\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">1</text><path d=\"M472 214 V219\" stroke=\"var(--line)\"/><text x=\"472\" y=\"233\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">3</text><path d=\"M576 214 V219\" stroke=\"var(--line)\"/><text x=\"576\" y=\"233\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">4</text><path d=\"M784 214 V219\" stroke=\"var(--line)\"/><text x=\"784\" y=\"233\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">6</text><path d=\"M1096 214 V219\" stroke=\"var(--line)\"/><text x=\"1096\" y=\"233\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">9</text><text x=\"300\" y=\"258\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--acc)\">the green sliver at each end of every band: the mutex, held about 40 nanoseconds</text><text x=\"300\" y=\"276\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the band itself: the caller's read, one to three milliseconds -- a hundred thousand times longer</text><text x=\"300\" y=\"294\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the six read bands overlap completely; the writer's band is alone, and every reader is out of the picture</text><g transform=\"translate(30 312)\"><rect width=\"580\" height=\"116\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"290.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the mutex: about 40 nanoseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">three field reads and one call to the rule</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one increment, or one queue peek</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">no allocation, no I/O, no user code, nothing that can block</text></g><g transform=\"translate(630 312)\"><rect width=\"580\" height=\"116\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"290.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the mutex: everything else</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the caller's read or write: microseconds to milliseconds</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the observers: told after the unlock, inside a try/catch</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">a parked thread: asleep, costing nothing at all</text></g><text x=\"615\" y=\"448\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">so \"is everything one at a time now?\" has a precise answer: the bookkeeping is, for forty nanoseconds; the reading is not, and that is the whole point of the lock</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself: if every reader takes an internal mutex, have you just built a slower <code>synchronized</code> block? No, and the picture is the answer. The mutex is held for about forty nanoseconds &mdash; three field reads, one call to the rule, one increment &mdash; and then it is gone. The caller's actual read runs with the mutex released and overlaps completely with every other reader's, for as long as the caller likes. So the serialised part is a hundred thousand times shorter than the shared part, which is the entire economic case for a read-write lock. The corollary is the rule for what may go inside the mutex: field reads, field writes and the rule's predicate. No allocation, no I/O, no user code, nothing that can block &mdash; an observer called inside the mutex would hand a stranger the power to freeze every reader in the process.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 262\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"590\" height=\"206\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"315\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">is one mutex a bottleneck? measure it (OpenJDK 21, M-series laptop)</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">one uncontended read lock + unlock: about 65 nanoseconds</text><text x=\"35\" y=\"89\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">one uncontended write lock + unlock: about 25 nanoseconds</text><text x=\"35\" y=\"112\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the read path is the slower one -- it pays for a ThreadLocal lookup</text><text x=\"35\" y=\"135\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a service reading a config object 200,000 times a second:</text><text x=\"35\" y=\"158\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">   200,000 x 40 ns = 8 ms of mutex per second = 0.8% busy</text><text x=\"35\" y=\"181\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">eight threads doing nothing but acquire: 7.6 million a second,</text><text x=\"35\" y=\"204\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">   and THAT is the ceiling where the mutex itself starts to hurt</text><text x=\"920\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(640 58)\"><rect width=\"570\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 keep everything slow outside the mutex</text><text x=\"285.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">done: only counters inside, observers after the unlock</text></g><g transform=\"translate(640 114)\"><rect width=\"570\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 one compare-and-set on a packed int</text><text x=\"285.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reader count in the top half, write holds in the bottom: that is AQS</text></g><g transform=\"translate(640 170)\"><rect width=\"570\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 stop taking a lock on the read path</text><text x=\"285.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">StampedLock optimistic reads, a per-thread counter, or ConcurrentHashMap</text></g><text x=\"615\" y=\"248\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the honest ending: the JDK's ReentrantReadWriteLock does that same read in 8 nanoseconds, and you should normally use it</text></svg></div><div class=\"move\"><p>The numbers are in the box; the one worth remembering is the surprise. The read path is the <i>slower</i> of the two, because every read acquire pays for a <code>ThreadLocal</code> lookup to spot an upgrade and a write acquire does not. The number to quote when asked whether one mutex is enough: a service reading a config object two hundred thousand times a second keeps the mutex busy for eight milliseconds out of every second, and it takes eight threads doing nothing else at all to reach the ceiling. Then the ladder, in the order you would climb it. Keep everything slow outside the mutex, which this code already does. Replace the mutex with a single compare-and-set on one packed integer &mdash; reader count in the top half, write holds in the bottom &mdash; and put the waiters in an explicit queue so a release wakes exactly one node instead of everybody: that is <code>AbstractQueuedSynchronizer</code>, and it is what <code>ReentrantReadWriteLock</code> is made of. Above that, stop taking a lock on the read path at all: <code>StampedLock</code>'s optimistic read, or a per-thread counter, or a data structure that does not need the lock. The honest ending is that the JDK's lock does that same read in eight nanoseconds, and in real code you use it.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 392\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=

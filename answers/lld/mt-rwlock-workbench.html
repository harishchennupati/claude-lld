 = Thread.interrupted();           // clear it so the re-acquire cannot fail\n            while (true) {\n                try { rw.writeLock().lock(); break; }\n                catch (InterruptedException again) { interrupted = true; }\n            }\n            if (interrupted) Thread.currentThread().interrupt();  // hand the interrupt back to the caller\n        }\n    }\n\n    /** Wake the longest waiter. Call while holding the write lock, exactly like Condition.signal(). */\n    void signal() {\n        guard.lock();\n        try { CountDownLatch w = waiters.pollFirst(); if (w != null) w.countDown(); } finally { guard.unlock(); }\n    }\n\n    /** Wake everybody; each one re-tests its own predicate in a while loop, as always. */\n    void signalAll() {\n        guard.lock();\n        try { CountDownLatch w; while ((w = waiters.pollFirst()) != null) w.countDown(); } finally { guard.unlock(); }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Two servers now share the document.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The three numbers become one row in a store, and the mutex becomes compare-and-set: read the row, work out what it should be, and replace it only if nobody changed it in between. Everything above that is the same design. What you lose is the part this page is about: there is no condition to park on, so a waiter polls, and every acquire is a network round trip instead of forty nanoseconds. What you must add is a lease &mdash; an expiry stamped on the row, so a holder that dies does not own the lock forever &mdash; and a fencing token, so a resurrected holder's late write is rejected by the storage it was writing to. That last one is what makes a distributed lock genuinely hard, and it is worth saying out loud that a lock is usually the wrong answer across machines.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a distributed read-write lock -- the same three numbers, in a store, with a lease\n/** The one operation a store must give you: replace a value only if it still equals what you last read. */\ninterface LockStore {\n    /** Returns false if somebody else changed the row first. This is the whole distributed primitive. */\n    boolean compareAndSet(String key, String expected, String next);\n    /** The current row, or null. */\n    String get(String key);\n}\n\n/** A CAS store in one process, so the demo runs. In production this row lives in Redis, etcd or a table. */\nfinal class InMemoryLockStore implements LockStore {\n    private final Map&lt;String, String&gt; rows = new ConcurrentHashMap&lt;&gt;();\n    public boolean compareAndSet(String key, String expected, String next) {\n        if (expected == null) return rows.putIfAbsent(key, next) == null;\n        return rows.replace(key, expected, next);\n    }\n    public String get(String key) { return rows.get(key); }\n}\n\n/**\n * The same three numbers, moved out of the process: one row holding &quot;readers:writer&quot;, changed with\n * compare-and-set. What you lose is the part this whole page is about -- there is no condition to park on, so\n * a waiter polls, and every acquire is a network round trip instead of forty nanoseconds. What you must add is\n * a lease (an expiry stamped on the row) so a holder that dies does not own the lock forever, and a fencing\n * token so a resurrected holder&#x27;s late write is rejected by the storage it was writing to.\n */\nfinal class DistributedRwLock {\n    private final LockStore store;\n    private final String key;\n    private final Clock clock;\n\n    DistributedRwLock(LockStore store, String key, Clock clock) {\n        this.store = store; this.key = key; this.clock = clock;\n        store.compareAndSet(key, null, &quot;0:0&quot;);\n    }\n\n    /** Poll until the row says no writer, then bump the reader count with a CAS. Gives up at the deadline. */\n    boolean acquireRead(long timeoutMs) throws InterruptedException {\n        long deadline = clock.nowMs() + timeoutMs;\n        while (clock.nowMs() &lt; deadline) {\n            String row = store.get(key);\n            String[] parts = row.split(&quot;:&quot;);\n            if (parts[1].equals(&quot;0&quot;) &amp;&amp; store.compareAndSet(key, row, (Integer.parseInt(parts[0]) + 1) + &quot;:0&quot;)) return true;\n            Thread.sleep(2);                                      // no condition to wait on: this is the cost\n        }\n        return false;\n    }\n\n    /** Drop the reader count by one, retrying the CAS if another reader moved it in between. */\n    void releaseRead() {\n        while (true) {\n            String row = store.get(key);\n            String[] parts = row.split(&quot;:&quot;);\n            if (store.compareAndSet(key, row, (Integer.parseInt(parts[0]) - 1) + &quot;:&quot; + parts[1])) return;\n        }\n    }\n\n    /** Only from a completely free row: no readers and no writer. */\n    boolean acquireWrite(long timeoutMs) throws InterruptedException {\n        long deadline = clock.nowMs() + timeoutMs;\n        while (clock.nowMs() &lt; deadline) {\n            if (store.compareAndSet(key, &quot;0:0&quot;, &quot;0:1&quot;)) return true;\n            Thread.sleep(2);\n        }\n        return false;\n    }\n\n    void releaseWrite() { store.compareAndSet(key, &quot;0:1&quot;, &quot;0:0&quot;); }\n    /** The raw row, for a demo that wants to print it. */\n    String row() { return store.get(key); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Make the read path faster than the lock itself.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Stop taking the lock on the read path. A <code>StampedLock</code> hands out a stamp instead of a hold: the reader reads the fields with no lock at all, then asks whether a writer moved in the meantime, and only a reader that lost the race pays for a real read lock. The hand-rolled version is a version counter that is odd while a writer is inside &mdash; a seqlock &mdash; and it shows why the trick has rules: the optimistic body must be short, free of side effects and safe to run twice, because it can be thrown away. Writers are still serialised by something; it is only the readers that go free.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: optimistic reads -- the fastest read is the one that never takes the lock\n/**\n * A StampedLock hands out a stamp instead of a hold. You read the fields with no lock at all, then ask whether\n * a writer moved in the meantime; if one did, you read again, this time under a real read lock. It costs a\n * reader nothing when writes are rare, which is exactly when a read-write lock is worth having. The catch: the\n * optimistic body must be short, side-effect free and safe to run twice, because it can be thrown away.\n */\nfinal class OptimisticPoint {\n    private final StampedLock sl = new StampedLock();\n    private double x, y;\n\n    /** A write, exclusive, exactly like the write side of our lock. */\n    void move(double dx, double dy) {\n        long stamp = sl.writeLock();\n        try { x += dx; y += dy; } finally { sl.unlockWrite(stamp); }\n    }\n\n    /** Read with no lock, then validate. Only a reader that lost the race pays for a real read lock. */\n    double distanceFromOrigin() {\n        long stamp = sl.tryOptimisticRead();\n        double cx = x, cy = y;                                  // may be torn; validate() is what decides\n        if (!sl.validate(stamp)) {\n            stamp = sl.readLock();\n            try { cx = x; cy = y; } finally { sl.unlockRead(stamp); }\n        }\n        return Math.sqrt(cx * cx + cy * cy);\n    }\n}\n\n/**\n * The same trick by hand, so the mechanism is not magic: a version counter that is odd while a writer is\n * inside. A reader takes the version, reads the fields, and takes the version again; if it moved, it retries.\n * Writers must still be serialised by something (hold the write lock around set); only the readers go free.\n */\nfinal class SeqLockPair {\n    private final AtomicLong version = new AtomicLong();\n    private volatile int a, b;\n\n    /** One writer at a time -- hold the write lock around this. The odd version is the &quot;do not trust me&quot; flag. */\n    void set(int na, int nb) {\n        long v = version.get();\n        version.set(v + 1);                                     // odd: a write is in progress\n        a = na; b = nb;\n        version.set(v + 2);                                     // even again: the pair is consistent\n    }\n\n    /** Never blocks. Repeats the read if a writer touched the pair while it was reading. */\n    int[] get() {\n        while (true) {\n            long before = version.get();\n            if ((before &amp; 1) != 0) { Thread.onSpinWait(); continue; }   // a writer is inside; try again\n            int ra = a, rb = b;\n            if (version.get() == before) return new int[] { ra, rb };\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Which pattern is where, which SOLID letter is where, and where would a Factory earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None of them was chosen up front; each is the residue of a move. Strategy is move 3, because who waits is a rule that will change. Decorator is the same move's <code>SafePolicy</code> wrapper. Observer is move 3's rule that a metrics box must never run inside the mutex. State is move 6, whose point is the missing edge from READING to WRITING. For SOLID, two letters carry real weight here: I is <code>LockState</code> &mdash; six counters, no mutators, so a rule can decide who waits and cannot touch who is inside &mdash; and D is <code>configure()</code> and <code>setClock()</code>, which is exactly why a test can hand in a reckless rule and a clock that jumps thirty seconds. Factory earns its place the day rules arrive as strings from configuration, because the enum-to-rule map is already the registry. Builder never does.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Decorator. Wraps any fairness rule and adds the safety rule on top: never a reader beside a writer, never\n * two writers. A rule written next year can get fairness wrong and still cannot corrupt the guarded data,\n * because this wrapper is consulted first and the lock only ever wraps what it is handed.\n */\nfinal class SafePolicy implements AdmissionPolicy {\n    private final AdmissionPolicy base;\n    SafePolicy(AdmissionPolicy base) { this.base = base; }\n    public boolean readerMustWait(LockState s, long ticket) {\n        if (s.writerActive()) return true;                       // safety: not negotiable\n        return base.readerMustWait(s, ticket);                   // fairness: the base&#x27;s business\n    }\n    public boolean writerMustWait(LockState s, long ticket) {\n        if (s.writerActive() || s.readers() &gt; 0) return true;    // safety: not negotiable\n        return base.writerMustWait(s, ticket);\n    }\n    /** What was wrapped, for a page that wants to print the rule&#x27;s name. */\n    AdmissionPolicy base() { return base; }\n}\n\n/** Anyone who wants to know: metrics, a log, a starvation alarm. A broken observer cannot break the lock. */\ninterface LockObserver { void onEvent(LockEvent e); }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>15 &middot; Now do it with synchronized, wait and notifyAll. And tell me when notify() would be safe.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The same design with a smaller toolbox. The counters move inside the object's own monitor, <code>wait()</code> replaces <code>await()</code>, <code>notifyAll()</code> replaces the two <code>signalAll()</code> calls, and the <code>while</code> loop does not change at all, because <code>wait()</code> also returns spuriously. What you lose is what the two <code>Condition</code>s bought: a monitor has exactly one wait set, so readers and writers park together and every wake is a wake for everybody. <code>notify()</code> is not the fix &mdash; it may pick a reader that still cannot move while the writer that could move stays asleep, and that is a lost wakeup you will never reproduce on your laptop. <code>notify()</code> is only safe when every waiter is waiting for the same condition and any one of them can use the wake. You also lose timeouts unless you recompute the remaining time around <code>wait(ms)</code> yourself. Test 10 pushes six thousand reads and four hundred writes through this version and gets the same invariant, which is the point: the design is the design, not the API.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the same lock from synchronized / wait / notifyAll -- one monitor, one wait set\n/**\n * The whole lock again with nothing from java.util.concurrent: the object&#x27;s own monitor, wait() and\n * notifyAll(). It keeps writer preference and the while loop, and it shows what one monitor costs. A monitor\n * has ONE wait set, so readers and writers park in the same queue and every wake is a wake for everybody --\n * that is the thundering herd. notify() would be a bug here: it may pick a reader that still cannot move, and\n * the writer that could move stays asleep. That is a lost wakeup, and it is why notify() is only safe when\n * every waiter is waiting for the same thing and any one of them can use the wake.\n */\nfinal class MonitorRwLock {\n    private int readers;\n    private boolean writer;\n    private int waitingWriters;\n\n    /** Get in as a reader. The predicate is tested under the monitor, in a while loop, as in Main.java. */\n    synchronized void lockRead() throws InterruptedException {\n        while (writer || waitingWriters &gt; 0) wait();      // while, never if: wait() also returns on its own\n        readers++;\n    }\n\n    /** The last reader out wakes everybody, because one monitor cannot wake only the writers. */\n    synchronized void unlockRead() {\n        if (--readers == 0) notifyAll();\n    }\n\n    /** Get in as a writer, alone. It registers before parking, so readers arriving later wait behind it. */\n    synchronized void lockWrite() throws InterruptedException {\n        waitingWriters++;\n        try {\n            while (writer || readers &gt; 0) wait();\n        } catch (InterruptedException e) {\n            waitingWriters--; notifyAll(); throw e;        // our leaving can admit the readers behind us\n        }\n        waitingWriters--;\n        writer = true;\n    }\n\n    /** Give the write side back and wake every waiter: both sides share the one wait set. */\n    synchronized void unlockWrite() {\n        writer = false;\n        notifyAll();\n    }\n\n    /** A snapshot for a test, taken under the same monitor that guards the counters. */\n    synchronized String state() { return readers + &quot; readers, writer=&quot; + writer + &quot;, queued writers=&quot; + waitingWriters; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; When would you not write this at all?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Most of the time. If the thing you are guarding is a map, a ConcurrentHashMap beats any lock you can write, because it locks one bin instead of the whole map and readers take nothing at all. If you do want a read-write lock, ReentrantReadWriteLock does the same read in eight nanoseconds against this file's sixty-five, because it is one compare-and-set on a packed integer with an explicit waiter queue, so a release wakes exactly one node instead of everybody &mdash; and it makes the same three decisions this page made: reentrant on both sides, downgrade allowed, upgrade forbidden. A read-write lock is also the wrong shape when writes are common: below roughly a ninety-to-ten read ratio, or when the guarded section is a few nanoseconds long, a plain mutex wins because it does less bookkeeping. Write it from scratch to show you know what is underneath; ship the JDK's.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the JDK&#x27;s answer -- ReentrantReadWriteLock, and what AQS does that this file does not\n/**\n * What you would actually ship. ReentrantReadWriteLock is built on AbstractQueuedSynchronizer: one 32-bit int\n * holds the reader count in its top half and the write hold count in its bottom half, moved with a single\n * compare-and-set, and the waiters sit in an explicit linked queue so a release wakes exactly ONE node instead\n * of everybody. The three decisions it makes are the three this page made: reentrant on both sides, downgrade\n * allowed, upgrade forbidden -- and its fair mode is our FairOrder with a real queue behind it.\n */\nfinal class JdkComparison {\n    private JdkComparison() {}\n\n    /** Shows that the JDK lock behaves exactly as ours on the three interesting cases. */\n    static String run() throws InterruptedException {\n        ReentrantReadWriteLock jdk = new ReentrantReadWriteLock(true);      // true = fair mode\n\n        jdk.readLock().lock(); jdk.readLock().lock();                       // reentrant reads\n        int holds = jdk.getReadHoldCount();\n        jdk.readLock().unlock(); jdk.readLock().unlock();\n\n        jdk.writeLock().lock();\n        jdk.readLock().lock();                                              // downgrade: legal\n        jdk.writeLock().unlock();\n        boolean stillReading = jdk.getReadHoldCount() == 1;\n        jdk.readLock().unlock();\n\n        jdk.readLock().lock();\n        boolean upgraded = jdk.writeLock().tryLock();                       // upgrade: refused, never hangs\n        jdk.readLock().unlock();\n\n        return &quot;jdk fair lock: read holds &quot; + holds + &quot;, downgrade &quot; + stillReading + &quot;, upgrade allowed &quot; + upgraded;\n    }\n}\n\n/**\n * The everyday use: make a plain HashMap safe for many readers and the occasional writer. It works, and for a\n * map it is still the wrong answer -- ConcurrentHashMap locks one bin instead of the whole map, so two writers\n * to different keys never meet, and readers take no lock at all. Reach for a read-write lock when the thing\n * you guard is NOT a map: a config snapshot, a routing table, a rules object, a document.\n */\nfinal class GuardedMap&lt;K, V&gt; {\n    private final Map&lt;K, V&gt; data = new HashMap&lt;&gt;();\n    private final RwLock rw = new RwLock();\n\n    GuardedMap() { rw.configure(Policies.of(Policy.WRITER_PREFERENCE)); }\n\n    /** Many of these run at once. */\n    V get(K key) throws InterruptedException {\n        rw.readLock().lock();\n        try { return data.get(key); } finally { rw.readLock().unlock(); }\n    }\n    /** This one runs alone. */\n    void put(K key, V value) throws InterruptedException {\n        rw.writeLock().lock();\n        try { data.put(key, value); } finally { rw.writeLock().unlock(); }\n    }\n    /** A copy, so an iteration cannot blow up half way through with a concurrent modification. */\n    Map&lt;K, V&gt; snapshot() throws InterruptedException {\n        rw.readLock().lock();\n        try { return new LinkedHashMap&lt;&gt;(data); } finally { rw.readLock().unlock(); }\n    }\n    /** The map the JDK would have given you for free, for comparison in the demo. */\n    static &lt;K, V&gt; Map&lt;K, V&gt; theBoringAnswer() { return new ConcurrentHashMap&lt;&gt;(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.ArrayDeque;\nimport java.util.Deque;\nimport java.util.EnumMap;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.concurrent.CopyOnWriteArrayList;\nimport java.util.concurrent.CountDownLatch;\nimport java.util.concurrent.TimeUnit;\nimport java.util.concurrent.atomic.AtomicInteger;\nimport java.util.concurrent.atomic.AtomicLong;\nimport java.util.concurrent.locks.Condition;\nimport java.util.concurrent.locks.ReentrantLock;\nimport java.util.function.Predicate;\n\n/** Where time comes from. Injected everywhere, so a test can move the clock instead of waiting for it. */\ninterface Clock { long nowMs(); }\n\n/**\n * Which fairness rule the lock runs. The constant is only a key into the registry of rules; the rule itself\n * is a class, so a fourth rule is a new class and one registry line.\n */\nenum Policy { READER_PREFERENCE, WRITER_PREFERENCE, FAIR }\n\n/** What just happened to the lock. Handed to observers after the mutex is released, never inside it. */\nenum EventKind { READ_ACQUIRED, READ_RELEASED, WRITE_ACQUIRED, WRITE_RELEASED }\n\n/**\n * One thing that happened, with the time the thread spent waiting for it, measured with the injected clock.\n * readersAfter is the reader count captured inside the critical section, so it is never a half-updated number.\n */\nrecord LockEvent(EventKind kind, String threadName, long waitedMs, int readersAfter) {}\n\n/** Anyone who wants to know: metrics, a log, a starvation alarm. A broken observer cannot break the lock. */\ninterface LockObserver { void onEvent(LockEvent e); }\n\n/**\n * One side of the lock as a caller sees it. Pair every successful acquire with exactly one unlock, in a\n * finally block. lock() blocks until admitted and throws if the thread is interrupted while it waits.\n */\ninterface Lock {\n    /** Wait until this side is admitted. Throws if the thread is interrupted while parked. */\n    void lock() throws InterruptedException;\n    /** Take it only if ean readerMustWait(LockState s, long ticket) { return s.writerActive(); }\n    public boolean writerMustWait(LockState s, long ticket) { return s.writerActive() || s.readers() > 0; }\n}\n\n/**\n * Writers first: a reader that arrives while a writer is queued waits behind it, so the readers already\n * inside drain and the writer gets in. Writers cannot starve; a long read storm pauses instead of continuing.\n */\nfinal class WriterPreference implements AdmissionPolicy {\n    public boolean readerMustWait(LockState s, long ticket) { return s.writerActive() || s.waitingWriters() > 0; }\n    public boolean writerMustWait(LockState s, long ticket) { return s.writerActive() || s.readers() > 0; }\n}\n\n/**\n * Arrival order: nobody overtakes a thread that got here first. Readers that arrived with no writer ahead of\n * them still go in together, so this is FIFO between the two sides, not one thread at a time.\n */\nfinal class FairOrder implements AdmissionPolicy {\n    public boolean readerMustWait(LockState s, long ticket) {\n        return s.writerActive() || s.earliestWaitingWriterTicket() < ticket;\n    }\n    public boolean writerMustWait(LockState s, long ticket) {\n        return s.writerActive() || s.readers() > 0 || s.earliestWaitingTicket() < ticket;\n    }\n}\n\n/**\n * Decorator. Wraps any fairness rule and adds the safety rule on top: never a reader beside a writer, never\n * two writers. A rule written next year can get fairness wrong and still cannot corrupt the guarded data,\n * because this wrapper is consulted first and the lock only ever wraps what it is handed.\n */\nfinal class SafePolicy implements AdmissionPolicy {\n    private final AdmissionPolicy base;\n    SafePolicy(AdmissionPolicy base) { this.base = base; }\n    public boolean readerMustWait(LockState s, long ticket) {\n        if (s.writerActive()) return true;                       // safety: not negotiable\n        return base.readerMustWait(s, ticket);                   // fairness: the base's business\n    }\n    public boolean writerMustWait(LockState s, long ticket) {\n        if (s.writerActive() || s.readers() > 0) return true;    // safety: not negotiable\n        return base.writerMustWait(s, ticket);\n    }\n    /** What was wrapped, for a page that wants to print the rule's name. */\n    AdmissionPolicy base() { return base; }\n}\n\n/** The registry of built-in rules. Every rule is stateless, so one instance serves every lock in the process. */\nfinal class Policies {\n    private Policies() {}\n    static final Map<Policy, AdmissionPolicy> REGISTRY = new EnumMap<>(Policy.class);\n    static {\n        REGISTRY.put(Policy.READER_PREFERENCE, new ReaderPreference());\n        REGISTRY.put(Policy.WRITER_PREFERENCE, new WriterPreference());\n        REGISTRY.put(Policy.FAIR, new FairOrder());\n    }\n    /** O(1) lookup, and the one line that changes when a fourth rule arrives. */\n    static AdmissionPolicy of(Policy p) { return REGISTRY.get(p); }\n}\n\n/** A consistent copy of the counters, taken under the mutex. For tests, metrics and demos -- never for a decision. */\nrecord LockStats(int readers, boolean writerActive, int waitingReaders, int waitingWriters) {}\n\n/**\n * The whole lock: three numbers, one mutex and two conditions. Everything else in this file is a view of it.\n *\n * The invariant it exists to hold: while a writer is inside, every reader inside is that same thread (the\n * downgrade case), and no second writer is inside. Every wait() in here blocks a transition that would break it.\n */\nfinal class Sync implements LockState {\n    /** Park until admitted. */\n    static final int BLOCK = 0;\n    /** Do not park at all: take it or report failure. */\n    static final int NO_WAIT = 1;\n    /** Park, but give up at the deadline. */\n    static final int TIMED = 2;\n\n    private final ReentrantLock mutex = new ReentrantLock();\n    private final Condition okToRead = mutex.newCondition();\n    private final Condition okToWrite = mutex.newCondition();\n    private final Deque<Long> readerQueue = new ArrayDeque<>();   // arrival order, so peekFirst is the oldest\n    private final Deque<Long> writerQueue = new ArrayDeque<>();\n    private final ThreadLocal<int[]> readHolds = ThreadLocal.withInitial(() -> new int[1]);\n    private final List<LockObserver> observers = new CopyOnWriteArrayList<>();\n    private int readers;\n    private int writerHolds;\n    private Thread writerOwner;\n    private long nextTicket = 1;\n    private AdmissionPolicy policy = new SafePolicy(new WriterPreference());\n    private Clock clock = System::currentTimeMillis;\n\n    /** Hand in the fairness rule and the listeners. Call it once, before the lock is handed to any thread. */\n    void configure(AdmissionPolicy rule, LockObserver... listeners) {\n        mutex.lock();\n        try {\n            if (readers > 0 || writerHolds > 0 || !readerQueue.isEmpty() || !writerQueue.isEmpty())\n                throw new IllegalStateException(\"configure the lock before anyone uses it\");\n            this.policy = new SafePolicy(rule);                   // every rule is wrapped: safety is not optional\n            for (LockObserver o : listeners) observers.add(o);\n        } finally { mutex.unlock(); }\n    }\n\n    /** Hand in the clock. A test injects one so a deadline can pass without the test waiting for it. */\n    void setClock(Clock c) { this.clock = c; }\n\n    /** The rule in force, already wrapped in SafePolicy. */\n    AdmissionPolicy policy() { return policy; }\n\n    // ---------------- the read side\n\n    /**\n     * Get in as a reader. Returns false only when the caller said it would not wait (NO_WAIT) or its deadline\n     * passed (TIMED). A thread that already holds either side is admitted at once: it cannot release what it\n     * holds while it waits, so parking it would be a deadlock with itself.\n     */\n    boolean acquireRead(int mode, long timeoutMs) throws InterruptedException {\n        lo o a torn read is visible. */\n    void bumpAll() {\n        activeWriters.incrementAndGet();\n        if (activeReaders.get() != 0 || activeWriters.get() != 1) overlaps.incrementAndGet();\n        for (int i = 0; i < cells.length; i++) { cells[i]++; Thread.onSpinWait(); }\n        activeWriters.decrementAndGet();\n    }\n\n    /** Call ONLY while holding the read lock. Returns the number every cell must agree on. */\n    int readAll() {\n        int now = activeReaders.incrementAndGet();\n        maxConcurrentReaders.accumulateAndGet(now, Math::max);\n        if (activeWriters.get() != 0) overlaps.incrementAndGet();\n        int first = cells[0];\n        boolean torn = false;\n        for (int c : cells) { if (c != first) torn = true; Thread.onSpinWait(); }\n        if (torn) tornReads.incrementAndGet();\n        activeReaders.decrementAndGet();\n        return first;\n    }\n\n    /** The value with no locking at all, for a report printed when every thread has stopped. */\n    int value() { return cells[0]; }\n}\n\n/** Counts what the lock did and the longest anybody waited. Pre-filled so no thread ever resizes the map. */\nfinal class Metrics implements LockObserver {\n    private final Map<EventKind, AtomicInteger> counts = new EnumMap<>(EventKind.class);\n    private final AtomicLong longestWaitMs = new AtomicLong();\n    Metrics() { for (EventKind k : EventKind.values()) counts.put(k, new AtomicInteger()); }\n    public void onEvent(LockEvent e) {\n        counts.get(e.kind()).incrementAndGet();\n        longestWaitMs.accumulateAndGet(e.waitedMs(), Math::max);\n    }\n    /** How many events of this kind, O(1). */\n    int count(EventKind k) { return counts.get(k).get(); }\n    /** The longest any single thread waited to be let in, in milliseconds of the injected clock. */\n    long longestWaitMs() { return longestWaitMs.get(); }\n}\n\n/** A body that may throw, so a demo thread can report the exception instead of swallowing it. */\ninterface ThrowingBody { void run() throws Exception; }\n\n/** The demo and the many-thread race. Everything it prints is a claim FailureTests proves. */\npublic class Main {\n\n    /** Start a named thread that prints and remembers any exception instead of dying quietly. */\n    static Thread start(String name, ThrowingBody body) {\n        Thread t = new Thread(() -> {\n            try { body.run(); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            catch (Exception e) { System.out.println(\"  ! \" + name + \" threw \" + e); }\n        }, name);\n        t.start();\n        return t;\n    }\n\n    /**\n     * Wait until the lock's counters satisfy a test, or give up. Used instead of sleeping a guessed number of\n     * milliseconds, and used instead of waiting forever: a test that can hang is not a test.\n     */\n    static boolean awaitState(RwLock rw, Predicate<LockStats> test, long timeoutMs) throws InterruptedException {\n        long deadline = System.currentTimeMillis() + timeoutMs;\n        while (System.currentTimeMillis() < deadline) {\n            if (test.test(rw.stats())) return true;\n            Thread.sleep(1);\n        }\n        return test.test(rw.stats());\n    }\n\n    public static void main(String[] args) throws Exception {\n        demo();\n        policyComparison();\n        race();\n    }\n\n    /** One writer and three readers on one document: the readers overlap, the writer is alone. */\n    private static void demo() throws Exception {\n        System.out.println(\"== one document, three readers and one writer ==\");\n        SharedDocument doc = new SharedDocument(8);\n        Metrics metrics = new Metrics();\n        RwLock rw = new RwLock();\n        rw.configure(Policies.of(Policy.WRITER_PREFERENCE), metrics);\n\n        CountDownLatch insideTogether = new CountDownLatch(3);\n        CountDownLatch holdUntil = new CountDownLatch(1);\n        for (int i = 1; i <= 3; i++) {\n            start(\"reader-\" + i, () nd what you would actually ship\n        System.out.println(JdkComparison.run());\n    }\n}\n", "f2": "import java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.List;\nimport java.util.concurrent.CountDownLatch;\nimport java.util.concurrent.TimeUnit;\nimport java.util.concurrent.atomic.AtomicBoolean;\nimport java.util.concurrent.atomic.AtomicInteger;\n\n// Targeted failure tests: 36 checks, each proving a claim the design makes on page 02, move 9. Every wait in\n// this file has a timeout, so a broken lock fails the test instead of hanging the run, and the whole file\n// finishes in about a second.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? \"PASS \" : \"FAIL \") + what);\n        if (!ok) failures++;\n    }\n\n    public static void main(String[] args) throws Exception {\n        // a test that can hang is not a test: if anything below blocks, say so and stop\n        Thread watchdog = new Thread(() -> {\n            try { Thread.sleep(45_000); } catch (InterruptedException e) { return; }\n            System.out.println(\"FAIL something blocked for 45 seconds\");\n            Runtime.getRuntime().halt(1);\n        }, \"watchdog\");\n        watchdog.setDaemon(true);\n        watchdog.start();\n\n        // 1. many readers really are inside at the same time -- otherwise this is an expensive mutex.\n        //    Six readers take the read lock and none of them leaves until all six are in.\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            int n = 6;\n            CountDownLatch allIn = new CountDownLatch(n), release = new CountDownLatch(1);\n            AtomicInteger peak = new AtomicInteger();\n            for (int i = 0; i < n; i++) {\n                Main.start(\"reader-\" + i, () -> {\n                    rw.readLock().lock();\n                    try {\n                        peak.accumulateAndGet(rw.stats().readers(), Math::max);\n                        allIn.countDown();\n                        release.await(5, TimeUnit.SECONDS);\n                    } finally { rw.readLock().unlock(); }\n                });\n            }\n            boolean together = allIn.await(5, TimeUnit.SECONDS);\n            check(together, \"six readers are inside the read lock at the same time\");\n            check(peak.get() == n, \"the lock itself counted all six (peak readers = \" + peak.get() + \")\");\n            check(rw.stats().writerActive() == false, \"and no writer is inside while they read\");\n            release.countDown();\n        }\n\n        // 2. a writer is alone: while it holds the lock no reader may enter, and they all enter after it leaves\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            CountDownLatch writing = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread writer = Main.start(\"writer\", () -> {\n                rw.writeLock().lock();\n                try { writing.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { rw.writeLock().unlock(); }\n            });\n            writing.await(2, TimeUnit.SECONDS);\n            check(!rw.readLock().tryLock(), \"a reader cannot enter while a writer holds the lock\");\n            check(!rw.writeLock().tryLock(), \"and a second writer cannot either\");\n            check(!rw.readLock().tryLock(200), \"a reader that waits 200ms still gives up, and does not hang\");\n            letGo.countDown();\n            writer.join(3000);\n            check(rw.readLock().tryLock(1000), \"the moment the writer leaves, a reader gets in\");\n            rw.readLock().unlock();\n        }\n\n        // 3. the stress: eight readers and four writers on one document. A reader must never see a half-written\n        //    document, and every write must land exactly once.\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            SharedDocument doc = new SharedDocument(16);\n            int readers = 8, writers = 4, readsEach = 3000, writesEach = 200;\n            CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(readers + writers);\n            for (int i = 0; i < readers; i++) {\n                Main.start(\"r\" + i, () -> {\n                    go.await();\n                    for (int k = 0; k < readsEach; k++) {\n                        rw.readLock().lock();\n                        try { doc.readAll(); } finally { rw.readLock().unlock(); }\n                    }\n                    done.countDown();\n                });\n            }\n            for (int i = 0; i < writers; i++) {\n                Main.start(\"w\" + i, () -> {\n                    go.await();\n                    for (int k = 0; k < writesEach; k++) {\n                        rw.writeLock().lock();\n                        try { doc.bumpAll(); } finally { rw.writeLock().unlock(); }\n                    }\n                    done.countDown();\n                });\n            }\n            go.countDown();\n            check(done.await(20, TimeUnit.SECONDS), \"24000 reads and 800 writes finish with nobody stuck\");\n            check(doc.tornReads.get() == 0, \"no reader ever saw a half-written document (torn reads = \" + doc.tornReads.get() + \")\");\n            check(doc.overlaps.get() == 0, \"no reader was ever inside beside a writer, and no two writers met\");\n            check(doc.value() == writers * writesEach, \"every write landed exactly once: \" + doc.value() + \" of \" + (writers * writesEach));\n        }\n\n        // 4. writer preference: a writer that is already queued is not overtaken by readers that arrive later,\n        //    which is the whole point of the rule -- a writer cannot be starved by a stream of readers.\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            List<String> order = Collections.synchronizedList(new ArrayList<>());\n            CountDownLatch holding = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread holder = Main.start(\"first-reader\", () -> {\n                rw.readLock().lock();\n                try { holding.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { rw.readLock().unlock(); }\n            });\n            holding.await(2, TimeUnit.SECONDS);\n            Thread writer = Main.start(\"writer\", () -> {\n                rw.writeLock().lock();\n                try { order.add(\"writer\"); } finally { rw.writeLock().unlock(); }\n            });\n            Main.awaitState(rw, s -> s.waitingWriters() == 1, 2000);\n            check(!rw.readLock().tryLock(), \"a reader arriving after a queued writer is made to wait\");\n            Thread late = Main.start(\"late-reader\", () -> {\n                rw.readLock().lock();\n                try { order.add(\"late-reader\"); } finally { rw.readLock().unlock(); }\n            });\n            Main.awaitState(rw, s -> s.waitingReaders() == 1, 2000);\n            letGo.countDown();\n            holder.join(3000); writer.join(3000); late.join(3000);\n            check(order.equals(List.of(\"writer\", \"late-reader\")), \"the queued writer went in first, then the late reader: \" + order);\n        }\n\n        // 5. the rule is a real knob, not a comment: the same scenario under the other two rules behaves\n        //    differently, and that difference is one line of configuration.\n        {\n            RwLock loose = new RwLock();\n            loose.configure(Policies.of(Policy.READER_PREFERENCE));\n            CountDownLatch holding = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread holder = Main.start(\"first-reader\", () -> {\n                loose.readLock().lock();\n                try { holding.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { loose.readLock().unlock(); }\n            });\n            holding.await(2, TimeUnit.SECONDS);\n            Thread writer = Main.start(\"writer\", () -> {\n                loose.writeLock().lock();\n                try { /* nothing */ } finally { loose.writeLock().unlock(); }\n            });\n            Main.awaitState(loose, s -> s.waitingWriters() == 1, 2000);\n            boolean overtook = loose.readLock().tryLock();\n            check(overtook, \"READER_PREFERENCE lets a new reader overtake the queued writer -- that is the starvation it buys\");\n            if (overtook) loose.readLock().unlock();\n            letGo.countDown();\n            holder.join(3000); writer.join(3000);\n\n            RwLock fair = new RwLock();\n            fair.configure(Policies.of(Policy.FAIR));\n            List<String> order = Collections.synchronizedList(new ArrayList<>());\n            CountDownLatch holding2 = new CountDownLatch(1), letGo2 = new CountDownLatch(1);\n            Thread holder2 = Main.start(\"first-reader\", () -> {\n                fair.readLock().lock();\n                try { holding2.countDown(); letGo2.await(5, TimeUnit.SECONDS); } finally { fair.readLock().unlock(); }\n            });\n            holding2.await(2, TimeUnit.SECONDS);\n            Thread w2 = Main.start(\"writer\", () -> {\n                fair.writeLock().lock();\n                try { order.add(\"writer\"); } finally { fair.writeLock().unlock(); }\n            });\n            Main.awaitState(fair, s -> s.waitingWriters() == 1, 2000);\n            Thread r2 = Main.start(\"late-reader\", () -> {\n                fair.readLock().lock();\n                try { order.add(\"late-reader\"); } finally { fair.readLock().unlock(); }\n            });\n            Main.awaitState(fair, s -> s.waitingReaders() == 1, 2000);\n            letGo2.countDown();\n            holder2.join(3000); w2.join(3000); r2.join(3000);\n            check(order.equals(List.of(\"writer\", \"late-reader\")), \"FAIR grants in arrival order: \" + order);\n        }\n\n        // 6. downgrade is allowed, upgrade is refused instead of deadlocking, and both sides are reentrant\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            rw.writeLock().lock();\n            rw.writeLock().lock();                                   // reentrant write: counts, does not block\n            rw.writeLock().unlock();\n            rw.readLock().lock();                                    // downgrade: still the writer, admitted at once\n            rw.writeLock().unlock();\n            check(rw.stats().readers() == 1 && !rw.stats().writerActive(), \"write -> read downgrade leaves exactly one read hold\");\n            AtomicBoolean otherGotIn = new AtomicBoolean();\n            Thread other = Main.start(\"other-writer\", () -> {\n                if (rw.writeLock().tryLock()) { otherGotIn.set(true); rw.writeLock().unlock(); }\n            });\n            other.join(2000);\n            check(!otherGotIn.get(), \"and another thread's writer is kept out while that read hold is alive\");\n            rw.readLock().lock();                                    // reentrant read\n            rw.readLock().unlock();\n            rw.readLock().unlock();\n            check(rw.stats().readers() == 0, \"both read holds released, the lock is free\");\n\n            rw.readLock().lock();\n            boolean refused = false;\n            long t0 = System.currentTimeMillis();\n            try { rw.writeLock().lock(); } catch (IllegalStateException e) { refused = true; }\n            long took = System.currentTimeMillis() - t0;\n            rw.readLock().unlock();\n            check(refused && took < 1000, \"a read-to-write upgrade is refused at once (\" + took + \"ms), never a silent deadlock\");\n        }\n\n        // 7. a waiter that gives up must leave no ghost behind, and a deadline must be testable without waiting\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            CountDownLatch holding = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread holder = Main.start(\"reader\", () -> {\n                rw.readLock().lock();\n                try { holding.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { rw.readLock().unlock(); }\n            });\n            holding.await(2, TimeUnit.SECONDS);\n            AtomicBoolean threw = new AtomicBoolean();\n            Thread writer = new Thread(() -> {\n                try { rw.writeLock().lock(); rw.writeLock().unlock(); }\n                catch (InterruptedException e) { threw.set(true); }\n            }, \"doomed-writer\");\n            writer.start();\n            Main.awaitState(rw, s -> s.waitingWriters() == 1, 2000);\n            writer.interrupt();\n            writer.join(3000);\n            check(threw.get(), \"interrupting a parked writer throws InterruptedException instead of ignoring it\");\n            check(rw.stats().waitingWriters() == 0, \"and its ticket is gone from the queue, not left behind as a ghost\");\n            boolean got = rw.readLock().tryLock();\n            check(got, \"so readers are admitted again -- a ghost writer would have blocked them forever\");\n            if (got) rw.readLock().unlock();\n            letGo.countDown();\n            holder.join(3000);\n\n            // the injected clock: a thirty-second deadline can pass in a millisecond of real time\n            RwLock timed = new RwLock();\n            timed.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            long[] fake = { 1_000_000L };\n            timed.setClock(() -> { long now = fake[0]; fake[0] += 30_000; return now; });   // every look is 30s later\n            CountDownLatch writing = new CountDownLatch(1), release = new CountDownLatch(1);\n            Thread w = Main.start(\"writer\", () -> {\n                timed.writeLock().lock();\n                try { writing.countDown(); release.await(5, TimeUnit.SECONDS); } finally { timed.writeLock().unlock(); }\n            });\n            writing.await(2, TimeUnit.SECONDS);\n            long t0 = System.currentTimeMillis();\n            boolean acquired = timed.readLock().tryLock(30_000);\n            long realMs = System.currentTimeMillis() - t0;\n            check(!acquired && realMs < 1000, \"a 30s deadline expires on the injected clock in \" + realMs + \"ms of real time\");\n            release.countDown();\n            w.join(3000);\n        }\n\n        // 8. the safety wrapper, a broken listener, and an unpaired unlock\n        {\n            // a fairness rule written by somebody in a hurry: \"nobody ever waits\"\n            AdmissionPolicy reckless = new AdmissionPolicy() {\n                public boolean readerMustWait(LockState s, long ticket) { return false; }\n                public boolean writerMustWait(LockState s, long ticket) { return false; }\n            };\n            RwLock rw = new RwLock();\n            rw.configure(reckless);\n            SharedDocument doc = new SharedDocument(16);\n            CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(6);\n            for (int i = 0; i < 4; i++) {\n                Main.start(\"r\" + i, () -> {\n                    go.await();\n                    for (int k = 0; k < 2000; k++) { rw.readLock().lock(); try { doc.readAll(); } finally { rw.readLock().unlock(); } }\n                    done.countDown();\n                });\n            }\n            for (int i = 0; i < 2; i++) {\n                Main.start(\"w\" + i, () -> {\n                    go.await();\n                    for (int k = 0; k < 300; k++) { rw.writeLock().lock(); try { doc.bumpAll(); } finally { rw.writeLock().unlock(); } }\n                    done.countDown();\n                });\n            }\n            go.countDown();\n            check(done.await(20, TimeUnit.SECONDS), \"the reckless rule runs to completion\");\n            check(doc.overlaps.get() == 0 && doc.tornReads.get() == 0,\n                  \"a rule that says nobody waits still cannot put a reader beside a writer: SafePolicy wraps every rule\");\n            check(doc.value() == 600, \"and every write still landed exactly once\");\n\n            // a listener that throws on every event\n            RwLock noisy = new RwLock();\n            noisy.configure(Policies.of(Policy.FAIR), e -> { throw new RuntimeException(\"the metrics box is down\"); });\n            noisy.writeLock().lock();\n            noisy.writeLock().unlock();\n            noisy.readLock().lock();\n            noisy.readLock().unlock();\n            check(noisy.stats().readers() == 0, \"a listener that throws on every event cannot break lock or unlock\");\n\n            // unlocking something this thread does not hold\n            boolean caught = false;\n            try { noisy.readLock().unlock(); } catch (IllegalMonitorStateException e) { caught = true; }\n            check(caught, \"unlocking a read lock this thread does not hold is refused, not silently accepted\");\n            caught = false;\n            try { noisy.writeLock().unlock(); } catch (IllegalMonitorStateException e) { caught = true; }\n            check(caught, \"and the same for the write lock\");\n        }\n\n        // 9. the wait protocol itself: a wake means \"look again\", never \"it is your turn\". Waking every parked\n        //    thread without changing one counter is exactly what a spurious wakeup looks like from inside await().\n        {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(Policy.WRITER_PREFERENCE));\n            CountDownLatch holding = new CountDownLatch(1), letGo = new CountDownLatch(1);\n            Thread reader = Main.start(\"reader\", () -> {\n                rw.readLock().lock();\n                try { holding.countDown(); letGo.await(5, TimeUnit.SECONDS); } finally { rw.readLock().unlock(); }\n            });\n            holding.await(2, TimeUnit.SECONDS);\n            AtomicBoolean writerIn = new AtomicBoolean();\n            Thread writer = Main.start(\"patient-writer\", () -> {\n                rw.writeLock().lock();\n                try { writerIn.set(true); } finally { rw.writeLock().unlock(); }\n            });\n            Main.awaitState(rw, s -> s.waitingWriters() == 1, 2000);\n            for (int i = 0; i < 200; i++) rw.wakeWaitersForTest();      // 200 spurious wakeups, no state change\n            Thread.sleep(50);\n            check(!writerIn.get(), \"200 spurious wakeups let nobody in while a reader is still inside\");\n            check(rw.stats().waitingWriters() == 1, \"the woken writer re-tested, parked again and kept its ticket\");\n            letGo.countDown();\n            reader.join(3000); writer.join(3000);\n            check(writerIn.get(), \"the real change -- the last reader leaving -- is what admits it\");\n            rw.wakeWaitersForTest();                                    // a signal with nobody parked\n            boolean got = rw.writeLock().tryLock();\n            check(got, \"a wake with nobody parked is dropped, and costs the next acquire nothing\");\n            if (got) rw.writeLock().unlock();\n        }\n\n        // 10. the same lock built from synchronized / wait / notifyAll holds the same invariant, with one wait\n        //     set and a herd on every wake. If this passes, the design is the design and not the API.\n        {\n            MonitorRwLock mon = new MonitorRwLock();\n            SharedDocument doc = new SharedDocument(16);\n            int readers = 4, writers = 2, readsEach = 1500, writesEach = 200;\n            CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(readers + writers);\n            for (int i = 0; i < readers; i++) {\n                Main.start(\"mr\" + i, () -> {\n                    go.await();\n                    for (int k = 0; k < readsEach; k++) {\n                        mon.lockRead();\n                        try { doc.readAll(); } finally { mon.unlockRead(); }\n                    }\n                    done.countDown();\n                });\n            }\n            for (int i = 0; i < writers; i++) {\n                Main.start(\"mw\" + i, () -> {\n                    go.await();\n                    for (int k = 0; k < writesEach; k++) {\n                        mon.lockWrite();\n                        try { doc.bumpAll(); } finally { mon.unlockWrite(); }\n                    }\n                    done.countDown();\n                });\n            }\n            go.countDown();\n            check(done.await(20, TimeUnit.SECONDS), \"the synchronized build finishes 6000 reads and 400 writes with nobody stuck\");\n            check(doc.overlaps.get() == 0 && doc.tornReads.get() == 0,\n                  \"one monitor and notifyAll still never put a reader beside a writer\");\n            check(doc.value() == writers * writesEach, \"and every write landed exactly once: \" + doc.value());\n        }\n\n        System.out.println();\n        if (failures == 0) System.out.println(\"ALL PASS\");\n        else System.out.println(failures + \" CHECK(S) FAILED\");\n        System.out.flush();\n        System.exit(failures == 0 ? 0 : 1);\n    }\n}\n"};
function wireCopy(root){root.querySelectorAll('button.copy').forEach(b=>{b.onclick=()=>{const key=b.dataset.key;const txt=key?RAW[key]:b.closest('.ed').querySelector('code').textContent;navigator.clipboard.writeText(txt).then(()=>{b.textContent='copied';setTimeout(()=>b.textContent='copy',1500);});};});}
const KW=/\b(abstract|boolean|break|case|catch|class|continue|default|do|double|else|enum|extends|final|finally|for|if|implements|import|int|interface|long|new|null|package|private|protected|public|return|static|super|switch|synchronized|this|throw|throws|try|void|while|var|record|true|false)\b/g;
const TY=/\b([A-Z][A-Za-z0-9]*)\b/g;
function hl(src){let inDoc=false;return src.split('\n').map((l,i)=>{let e=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const t=e.trim();let out;if(inDoc||t.startsWith('/**')){out='<span class="d">'+e+'</span>';if(t.startsWith('/**'))inDoc=!t.endsWith('*/');else if(t.endsWith('*/'))inDoc=false;}else{const parts=e.split(/(\/\/.*$|"(?:[^"\\]|\\.)*")/);out=parts.map((p,j)=>j%2?(p.startsWith('//')?'<span class="c">'+p+'</span>':'<span class="s">'+p+'</span>'):p.replace(KW,'<span class="k">$1</span>').replace(TY,'<span class="t">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>')).join('');}return '<span class="ln">'+(i+1)+'</span>'+out;}).join('\n');}
let cur=parseInt(localStorage.getItem('mt-rwlock.step')||'1',10);
const side=document.getElementById('side'),study=document.getElementById('study');
function classesSoFar_unused(n){const out=[];STEPS.filter(s=>s.id<=n&&s.code).forEach(s=>{(s.code.match(/(?:class|interface|enum)\s+([A-Z]\w*)/g)||[]).forEach(m=>out.push({name:m.split(/\s+/)[1],step:s.id}));});return out;}
function render(){
  side.innerHTML='';let g='';STEPS.forEach(s=>{if(s.stage!==g){g=s.stage;side.insertAdjacentHTML('beforeend','<div class="grp">'+g+'</div>');}side.insertAdjacentHTML('beforeend','<div class="st'+(s.id===cur?' on':s.id<cur?' done':'')+'" data-id="'+s.id+'"><span class="n">'+String(s.id).padStart(2,'0')+'</span><span>'+s.title+'</span></div>');});
  const s=STEPS[cur-1];
  study.innerHTML='<div class="hdr"><span class="stage">'+s.stage+'</span><h2>'+String(s.id).padStart(2,'0')+' &middot; '+s.title+'</h2></div>'+(s.think?'<div class="think">'+s.think+'</div>':'')+(s.body||'')+(s.code?'<div class="ed"><div class="tab"><b>'+(s.file||'Main.java')+'</b><button class="copy" data-src="ed">copy</button></div><pre><code class="java">'+hl(s.code)+'</code></pre></div>':'')+'<div class="nav"><button id="prev">&larr; prev</button><button id="next" class="pri">next &rarr;</button></div>';
  study.querySelectorAll('pre code.java').forEach(el=>{el.innerHTML=hl(el.textContent);});wireCopy(study);wireTimers(study);const miss=document.getElementById('miss');if(miss){try{miss.value=localStorage.getItem('mt-rwlock.miss')||'';}catch(e){}miss.addEventListener('input',()=>{try{localStorage.setItem('mt-rwlock.miss',miss.value);}catch(e){}});}
  document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
  document.querySelector('.wrap').classList.toggle('wide',!!s.wide);document.querySelector('.wrap').classList.toggle('code',!!s.code);localStorage.setItem('mt-rwlock.step',cur);study.scrollIntoView();
}
function go(n){if(n<1||n>STEPS.length)return;cur=n;setMode('study');render();}
side.addEventListener('click',e=>{const t=e.target.closest('.st');if(t)go(+t.dataset.id);});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
const main=document.getElementById('main');
function setMode(m){}
function wireTimers(root){root.querySelectorAll('button.timer[data-min]').forEach(b=>{const total=+b.dataset.min*60;let left=total,id=null;const show=()=>{b.textContent=(id?'':'start ')+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');};b.onclick=()=>{if(id){clearInterval(id);id=null;b.classList.remove('run');show();return;}if(left<=0)left=total;b.classList.remove('done');b.classList.add('run');id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;b.classList.remove('run');b.classList.add('done');b.textContent='time -- open the fold';}},1000);show();};show();});}

e=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a stream of readers starves the writer</text></g><path d=\"M390 314 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 296)\"><rect width=\"770\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"385.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">writer preference, and a meter that says so; tests 4 and 5: the grant order</text></g><text x=\"615\" y=\"358\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim on this page has a test: FailureTests.java runs 36 checks in under a second and must print ALL PASS</text><text x=\"615\" y=\"378\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and every one of them has a timeout, because a concurrency test that can hang is not a test -- it is a coin flip</text></svg></div><div class=\"move\"><p>The table is the list; two of its rows deserve more than a row. The first is the interrupted writer. Its ticket has to come out of the queue in a <code>finally</code>, and both conditions have to be signalled on the way out, because under writer preference a ghost ticket that nobody owns makes every reader wait forever. That is the subtlest bug on this page, it never shows up in a happy-path demo, and it has a test to itself. The second is the reckless rule: the test hands the lock a fairness rule that says nobody ever waits, pushes eight thousand reads and six hundred writes through it, and proves that no reader ever sat beside a writer &mdash; the whole job of <code>SafePolicy</code>. And the discipline that makes the file usable at all: every wait in it has a timeout, because a concurrency test that can hang is a coin flip, not a test.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"230\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"320\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"870\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"230\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface AdmissionPolicy { boolean readerMustWait(s, ticket); ... }</text><text x=\"870\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">\"make writers win\" is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"230\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">this.policy = new SafePolicy(rule) inside configure()</text><text x=\"870\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">no rule can put a reader beside a writer</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"230\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">publish(kind, ...) after the mutex is released, in a try/catch</text><text x=\"870\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">metrics that cost the lock nothing</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"230\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">FREE / READING / WRITING, and the edge that is missing</text><text x=\"870\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">the invariant IS the missing edge</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--muted)\">Facade</text><text x=\"230\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"320\" y=\"189.0\" font-size=\"11\" fill=\"var(--muted)\">ReadLock and WriteLock: two methods each, one shared Sync</text><text x=\"870\" y=\"189.0\" font-size=\"11\" fill=\"var(--muted)\">callers never see a counter</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"230\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"320\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">one lock per thing guarded; a test builds a fresh RwLock</text><text x=\"870\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">two documents never wait for each other</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"230\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">the EnumMap from Policy to rule IS the registry, one line each</text><text x=\"870\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when rules come from config</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"230\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"320\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">a lock has a rule, a clock and listeners: that is configure()</text><text x=\"870\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">three optional things is not a builder</text><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>The table is the answer. Here is what it cannot hold. Decorator is the one that matters: <code>SafePolicy</code> adds \"never a reader beside a writer\" to whatever fairness rule it is handed, instead of trusting each rule to remember the check, so a rule written next year that gets fairness wrong produces a slow lock and not a corrupted document. Say that out loud; it is the difference between a performance bug and a data bug. State is move 6, and its point is not the three boxes but the edge missing between two of them. Factory is \"not yet\" because the <code>EnumMap</code> from <code>Policy</code> to rule is already the registry; it earns the name the day rules arrive as strings from configuration. Builder is \"never\" here: a rule, a clock and some listeners is exactly what <code>configure()</code> is for. And name each one only after the move that produced it, so every name comes with a one-sentence defence instead of a label.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Sync parks and counts. A rule decides fairness. A handle exposes two methods.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">FairOrder was added without opening Sync: a class and one registry line</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">moves 2, 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">policy.readerMustWait(this, ticket);  never \"is this the writer-first one?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces; show only what is needed</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 5</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">LockState gives a rule the six counters and none of the mutators</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">configure(rule, listeners) and setClock(c): a test hands in a reckless rule and a fake clock</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>The table is the check; two of the five letters are worth saying out loud. I is <code>LockState</code>: a fairness rule is handed the six counters and none of the mutators, so it can decide who waits and cannot touch who is inside. The interface is small on purpose, and here the smallness is a safety property rather than a taste in style. D is what makes the tests possible: the rule and the clock arrive through <code>configure()</code> and <code>setClock()</code>, which is exactly how a test hands in a deliberately reckless rule, and a clock that jumps thirty seconds between two calls. The other three are the ordinary kind &mdash; one job per class, a new rule is a new class, and the lock never asks which rule it got.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">cap the readers, priority bands</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new AdmissionPolicy class plus one registry line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a latency histogram, an alarm</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer, told after the unlock</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a lock that can be drained for maintenance</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more state and one more checked transition</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across items</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two documents that must move together</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lock them in a fixed order, or put one lock over both</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two servers share the document</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the three numbers become a row changed by compare-and-set,</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">with a lease so a dead holder lets go, and a fencing token</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five, Sync's parking and waking do not change one line; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (cap the readers at sixty-four, priority bands, a read that may be a little stale) is a new <code>AdmissionPolicy</code> class plus one registry line &mdash; with one caveat worth saying out loud, because it is the only place the rule and the machinery touch: the cheap wake rule here is that the last reader out wakes only writers, which is correct for any rule whose reader-wait condition needs a writer to be active or queued. A rule that makes readers wait for something else, like a cap, must also be woken by a departing reader. Someone new who wants to know is one more observer, told after the unlock. A new step in a life (a lock that can be drained and closed for maintenance) is one more state and one more checked transition. A new invariant across items (two documents that must move together) is a fixed lock order, or one lock over both &mdash; the same move 4 answer as every other LLD. And state that must outlive the process is the three numbers becoming a row changed by compare-and-set, with a lease so a dead holder eventually lets go and a fencing token so its late write is rejected. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 800\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"296\" y=\"372\" width=\"348\" height=\"236\" rx=\"8\" fill=\"var(--bg)\" stroke=\"var(--line)\" stroke-dasharray=\"4 3\"/><text x=\"470\" y=\"394\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--acc)\">one instant: who is inside, who is parked</text><g transform=\"translate(306 404)\"><rect width=\"160\" height=\"92\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">readers = 3</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">R1  R2  R3</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">writer: none</text></g><g transform=\"translate(478 404)\"><rect width=\"156\" height=\"92\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"78.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">parked: okToWrite</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">W1, ticket 7</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">wakes when</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">readers hits 0</text></g><g transform=\"translate(306 508)\"><rect width=\"328\" height=\"80\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"164.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">parked: okToRead</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">R4 ticket 8, R5 ticket 9 -- they arrived after W1</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">woken when W1 releases the write side</text></g><path d=\"M470 350L470 372\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M135.0 285L135.0 315\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M135.0 447L135.0 417\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M135.0 174L135.0 195\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"141.0\" y=\"188.5\" font-size=\"10.5\" fill=\"var(--muted)\">owns both views</text><path d=\"M260 97L272 97L272 492L260 492\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M260 130L286 130L286 185L300 185\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M260 240L300 240\" fill=\"none\" s 2\" y=\"678\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">why the same lock works for a routing table or a cache.</text><g transform=\"translate(10 20)\"><rect width=\"250\" height=\"154\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RwLock</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">sync: Sync</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">read: Lock</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">write: Lock</text><line x1=\"0\" y1=\"80\" x2=\"250\" y2=\"80\" stroke=\"var(--line)\"/><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">configure(rule, listeners)</text><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">setClock(c)</text><text x=\"8\" y=\"125\" font-size=\"11.5\" fill=\"var(--text)\">readLock() / writeLock()</text><text x=\"8\" y=\"141\" font-size=\"11.5\" fill=\"var(--text)\">stats(): LockStats</text></g><g transform=\"translate(10 195)\"><rect width=\"250\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ReadLock</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">sync: Sync</text><line x1=\"0\" y1=\"48\" x2=\"250\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">lock() &rarr; acquireRead</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">unlock() &rarr; releaseRead</text></g><g transform=\"translate(10 315)\"><rect width=\"250\" height=\"102\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\ )\">publish(kind, started, readers)</text></g><g transform=\"translate(680 20)\"><rect width=\"250\" height=\"102\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">LockState</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">readers()</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">writerActive()</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--text)\">waitingReaders() / Writers()</text><text x=\"8\" y=\"95\" font-size=\"11.5\" fill=\"var(--text)\">earliestWaiting..Ticket()</text></g><g transform=\"translate(680 150)\"><rect width=\"250\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">AdmissionPolicy</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">readerMustWait(s, ticket)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">writerMustWait(s, ticket)</text></g><g transform=\"translate(680 250)\"><rect width=\"250\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SafePolicy</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">base: AdmissionPolicy</text><line x1=\"0\" y1=\"48\" x2=\"250\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">adds: never a reader</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">beside a writer</text></g><g transform=\"translate(680 370)\"><rect width=\"250\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ReaderPreference</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">wait only while a</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">writer is inside</text></g><g transform=\"translate(680 470)\"><rect width=\"250\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">WriterPreference</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">also wait while a</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">writer is queued</text></g><g transform=\"translate(680 570)\"><rect width=\"250\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FairOrder</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">nobody overtakes an</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">earlier ticket</text></g><g transform=\"translate(970 20)\"><rect width=\"250\" height=\"82\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Policy</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">READER_PREFERENCE</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">WRITER_PREFERENCE</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--muted)\">FAIR</text></g><g transform=\"translate(970 130)\"><rect width=\"250\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Policies</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">REGISTRY: EnumMap</text><line x1=\"0\" y1=\"48\" x2=\"250\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">of(Policy): AdmissionPolicy</text></g><g transform=\"translate(970 230)\"><rect width=\"250\" height=\"98\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">LockEvent</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">kind: EventKind</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">threadName: String</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">waitedMs: long</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">readersAfter: int</text></g><g transform=\"translate(970 350)\"><rect width=\"250\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">LockStats</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">readers, writerActive</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">waitingReaders / Writers</text></g><g transform=\"translate(970 445)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Clock</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">nowMs(): long</text></g><g transform=\"translate(970 525)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">LockObserver</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">onEvent(LockEvent)</text></g><g transform=\"translate(970 605)\"><rect width=\"250\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Metrics</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">counts: EnumMap</text><line x1=\"0\" y1=\"48\" x2=\"250\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">count(kind) / longestWaitMs()</text></g><g transform=\"translate(942 690)\"><rect width=\"278\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"139.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"139.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">EventKind</text><line x1=\"0\" y1=\"34\" x2=\"278\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">READ_ACQUIRED, READ_RELEASED</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">WRITE_ACQUIRED, WRITE_RELEASED</text></g><g><path d=\"M20 776L64 776\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"780\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 776L284 776\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"780\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 776L504 776\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"780\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 776L684 776\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"780\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 776L904 776\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"780\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: <code>RwLock</code> owns the one <code>Sync</code> and the two handles over it. Plain arrow = references: both handles point at the <i>same</i> <code>Sync</code>, which is what makes the two sides share one set of counters. Dashed green = handed in through <code>configure()</code> and <code>setClock()</code>. Dotted blue = notifies, after the unlock. <b>Where state lives:</b> one box has state and the rest do not. <code>Sync</code> holds the mutex, the two conditions, the reader count, the writer hold count and owner, the two ticket queues and the per-thread read count; every fairness rule is stateless, so one instance of each serves the whole process; <code>ReadLock</code> and <code>WriteLock</code> hold a reference and nothing else. <b>The dashed panel</b> is not a class: it is the lock at one instant, showing the two waiting parties, and it is the picture to draw on the whiteboard before you write a line. Notice what is <i>not</i> here: no Reader or Writer class, because those are threads; no queue of waiter objects, because the two conditions are the queue; and no Balance-style derived value, because \"is a writer inside\" is a field, not a calculation.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does and what it guarantees; read only those first for the shape, then the two acquire methods for the mechanics &mdash; they are the file. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (36 checks, every one with a timeout; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS in under a second).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.ArrayDeque;\nimport java.util.Deque;\nimport java.util.EnumMap;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.concurrent.CopyOnWriteArrayList;\nimport java.util.concurrent.CountDownLatch;\nimport java.util.concurrent.TimeUnit;\nimport java.util.concurrent.atomic.AtomicInteger;\nimport java.util.concurrent.atomic.AtomicLong;\nimport java.util.concurrent.locks.Condition;\nimport java.util.concurrent.locks.ReentrantLock;\nimport java.util.function.Predicate;\n\n/** Where time comes from. Injected everywhere, so a test can move the clock instead of waiting for it. */\ninterface Clock { long nowMs(); }\n\n/**\n * Which fairness rule the lock runs. The constant is only a key into the registry of rules; the rule itself\n * is a class, so a fourth rule is a new class and one registry line.\n */\nenum Policy { READER_PREFERENCE, WRITER_PREFERENCE, FAIR }\n\n/** What just happened to the lock. Handed to observers after the mutex is released, never inside it. */\nenum EventKind { READ_ACQUIRED, READ_RELEASED, WRITE_ACQUIRED, WRITE_RELEASED }\n\n/**\n * One thing that happened, with the time the thread spent waiting for it, measured with the injected clock.\n * readersAfter is the reader count captured inside the critical section, so it is never a half-updated number.\n */\nrecord LockEvent(EventKind kind, String threadName, long waitedMs, int readersAfter) {}\n\n/** Anyone who wants to know: metrics, a log, a starvation alarm. A broken observer cannot break the lock. */\ninterface LockObserver { void onEvent(LockEvent e); }\n\n/**\n * One side of the lock as a caller sees it. Pair every successful acquire with exactly one unlock, in a\n * finally block. lock() blocks until admitted and throws if the thread is interrupted while it waits.\n */\ninterface Lock {\n    /** Wait until this side is admitted. Throws if the thread is interrupted while parked. */\n    void lock() throws InterruptedException;\n    /** Take it only if it is free right now. Never parks, never throws. */\n    boolean tryLock();\n    /** Take it, giving up at the deadline. The deadline is computed from the injected clock. */\n    boolean tryLock(long timeoutMs) throws InterruptedException;\n    /** Give this side back. Throws IllegalMonitorStateException if this thread does not hold it. */\n    void unlock();\n}\n\n/**\n * The read-only view of the lock&#x27;s counters. This, and only this, is what a fairness rule may see: it can\n * decide who waits, and it cannot touch the state that decides who is inside.\n */\ninterface LockState {\n    /** How many threads are inside the read side right now. */\n    int readers();\n    /** Is a thread inside the write side right now. */\n    boolean writerActive();\n    /** How many readers are parked. */\n    int waitingReaders();\n    /** How many writers are parked. */\n    int waitingWriters();\n    /** The ticket of the longest-waiting writer, or Long.MAX_VALUE when no writer is parked. */\n    long earliestWaitingWriterTicket();\n    /** The ticket of the longest-waiting thread of either kind, or Long.MAX_VALUE when nobody is parked. */\n    long earliestWaitingTicket();\n}\n\n/**\n * The fairness rule, and nothing else: given the counters and this waiter&#x27;s arrival ticket, must it wait?\n * Two questions because the lock has two sides. It answers; the lock does the parking and the waking.\n */\ninterface AdmissionPolicy {\n    /** Must a reader holding this ticket park instead of going in? */\n    boolean readerMustWait(LockState s, long ticket);\n    /** Must a writer holding this ticket park instead of going in? */\n    boolean writerMustWait(LockState s, long ticket);\n}\n\n/**\n * Readers first: a reader goes in whenever no writer is inside, even if writers are queued. Highest read\n * throughput, and a writer can be starved forever by a steady stream of readers. That is the trade, said aloud.\n */\nfinal class ReaderPreference implements AdmissionPolicy {\n    public boolean readerMustWait(LockState s, long ticket) { return s.writerActive(); }\n    public boolean writerMustWait(LockState s, long ticket) { return s.writerActive() || s.readers() &gt; 0; }\n}\n\n/**\n * Writers first: a reader that arrives while a writer is queued waits behind it, so the readers already\n * inside drain and the writer gets in. Writers cannot starve; a long read storm pauses instead of continuing.\n */\nfinal class WriterPreference implements AdmissionPolicy {\n    public boolean readerMustWait(LockState s, long ticket) { return s.writerActive() || s.waitingWriters() &gt; 0; }\n    public boolean writerMustWait(LockState s, long ticket) { return s.writerActive() || s.readers() &gt; 0; }\n}\n\n/**\n * Arrival order: nobody overtakes a thread that got here first. Readers that arrived with no writer ahead of\n * them still go in together, so this is FIFO between the two sides, not one thread at a time.\n */\nfinal class FairOrder implements AdmissionPolicy {\n    public boolean readerMustWait(LockState s, long ticket) {\n        return s.writerActive() || s.earliestWaitingWriterTicket() &lt; ticket;\n    }\n    public boolean writerMustWait(LockState s, long ticket) {\n        return s.writerActive() || s.readers() &gt; 0 || s.earliestWaitingTicket() &lt; ticket;\n    }\n}\n\n/**\n * Decorator. Wraps any fairness rule and adds the safety rule on top: never a reader beside a writer, never\n * two writers. A rule written next year can get fairness wrong and still cannot corrupt the guarded data,\n * because this wrapper is consulted first and the lock only ever wraps what it is handed.\n */\nfinal class SafePolicy implements AdmissionPolicy {\n    private final AdmissionPolicy base;\n    SafePolicy(AdmissionPolicy base) { this.base = base; }\n    public boolean readerMustWait(LockState s, long ticket) {\n        if (s.writerActive()) return true;                       // safety: not negotiable\n        return base.readerMustWait(s, ticket);                   // fairness: the base&#x27;s business\n    }\n    public boolean writerMustWait(LockState s, long ticket) {\n        if (s.writerActive() || s.readers() &gt; 0) return true;    // safety: not negotiable\n        return base.writerMustWait(s, ticket);\n    }\n    /** What was wrapped, for a page that wants to print the rule&#x27;s name. */\n    AdmissionPolicy base() { return base; }\n}\n\n/** The registry of built-in rules. Every rule is stateless, so one instance serves every lock in the process. */\nfinal class Policies {\n    private Policies() {}\n    static final Map&lt;Policy, AdmissionPolicy&gt; REGISTRY = new EnumMap&lt;&gt;(Policy.class);\n    static {\n        REGISTRY.put(Policy.READER_PREFERENCE, new ReaderPreference());\n        REGISTRY.put(Policy.WRITER_PREFERENCE, new WriterPreference());\n        REGISTRY.put(Policy.FAIR, new FairOrder());\n    }\n    /** O(1) lookup, and the one line that changes when a fourth rule arrives. */\n    static AdmissionPolicy of(Policy p) { return REGISTRY.get(p); }\n}\n\n/** A consistent copy of the counters, taken under the mutex. For tests, metrics and demos -- never for a decision. */\nrecord LockStats(int readers, boolean writerActive, int waitingReaders, int waitingWriters) {}\n\n/**\n * The whole lock: three numbers, one mutex and two conditions. Everything else in this file is a view of it.\n *\n * The invariant it exists to hold: while a writer is inside, every reader inside is that same thread (the\n * downgrade case), and no second writer is inside. Every wait() in here blocks a transition that would break it.\n */\nfinal class Sync implements LockState {\n    /** Park until admitted. */\n    static final int BLOCK = 0;\n    /** Do not park at all: take it or report failure. */\n    static final int NO_WAIT = 1;\n    /** Park, but give up at the deadline. */\n    static final int TIMED = 2;\n\n    private final ReentrantLock mutex = new ReentrantLock();\n    private final Condition okToRead = mutex.newCondition();\n    private final Condition okToWrite = mutex.newCondition();\n    private final Deque&lt;Long&gt; readerQueue = new ArrayDeque&lt;&gt;();   // arrival order, so peekFirst is the oldest\n    private final Deque&lt;Long&gt; writerQueue = new ArrayDeque&lt;&gt;();\n    private final ThreadLocal&lt;int[]&gt; readHolds = ThreadLocal.withInitial(() -&gt; new int[1]);\n    private final List&lt;LockObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n    private int readers;\n    private int writerHolds;\n    private Thread writerOwner;\n    private long nextTicket = 1;\n    private AdmissionPolicy policy = new SafePolicy(new WriterPreference());\n    private Clock clock = System::currentTimeMillis;\n\n    /** Hand in the fairness rule and the listeners. Call it once, before the lock is handed to any thread. */\n    void configure(AdmissionPolicy rule, LockObserver... listeners) {\n        mutex.lock();\n        try {\n            if (readers &gt; 0 || writerHolds &gt; 0 || !readerQueue.isEmpty() || !writerQueue.isEmpty())\n                throw new IllegalStateException(&quot;configure the lock before anyone uses it&quot;);\n            this.policy = new SafePolicy(rule);                   // every rule is wrapped: safety is not optional\n            for (LockObserver o : listeners) observers.add(o);\n        } finally { mutex.unlock(); }\n    }\n\n    /** Hand in the clock. A test injects one so a deadline can pass without the test waiting for it. */\n    void setClock(Clock c) { this.clock = c; }\n\n    /** The rule in force, already wrapped in SafePolicy. */\n    AdmissionPolicy policy() { return policy; }\n\n    // ---------------- the read side\n\n    /**\n     * Get in as a reader. Returns false only when the caller said it would not wait (NO_WAIT) or its deadline\n     * passed (TIMED). A thread that already holds either side is admitted at once: it cannot release what it\n     * holds while it waits, so parking it would be a deadlock with itself.\n     */\n    boolean acquireRead(int mode, long timeoutMs) throws InterruptedException {\n        long startedMs = clock.nowMs();\n        boolean admitted = false;\n        int readersAfter = 0;\n        mutex.lock();\n        try {\n            int[] mine = readHolds.get();\n            if (mine[0] &gt; 0 || writerOwner == Thread.currentThread()) {\n                mine[0]++; readers++; admitted = true;            // reentrant read, or a write-to-read downgrade\n            } else {\n                long ticket = nextTicket++;\n                if (!policy.readerMustWait(this, ticket)) {\n                    admitted = true;\n                } else if (mode != NO_WAIT) {\n                    readerQueue.addLast(ticket);\n                    boolean gaveUp = false;\n                    try {\n                        long deadline = startedMs + timeoutMs;\n                        while (policy.readerMustWait(this, ticket)) {   // while, never if: re-test after every wake\n                            if (mode == TIMED) {\n                                long remain = deadline - clock.nowMs();\n                                if (remain &lt;= 0) { gaveUp = true; break; }\n                                okToRead.await(remain, TimeUnit.MILLISECONDS);\n                            } else {\n                                okToRead.await();                      // the mutex is released while parked here\n                            }\n                        }\n                        admitted = !gaveUp;\n                    } catch (InterruptedException e) {\n                        gaveUp = true;\n                        throw e;\n                    } finally {\n                        readerQueue.removeFirstOccurrence(ticket);     // never leave a ghost in the queue\n                        if (gaveUp) wakeBoth();                        // our leaving can admit somebody behind us\n                    }\n                }\n                if (admitted) { mine[0] = 1; readers++; }\n            }\n            readersAfter = readers;\n        } finally { mutex.unlock(); }\n        if (admitted) publish(EventKind.READ_ACQUIRED, startedMs, readersAfter);\n        return admitted;\n    }\n\n    /**\n     * Give the read side back. Only the last reader out wakes anybody, and it wakes writers only: a reader that\n     * is parked is parked because of a writer, and no writer state changed here.\n     */\n    void releaseRead() {\n        int readersAfter;\n        mutex.lock();\n        try {\n            int[] mine = readHolds.get();\n            if (mine[0] == 0) throw new IllegalMonitorStateException(&quot;this thread does not hold the read lock&quot;);\n            mine[0]--;\n            readers--;\n            if (mine[0] == 0) readHolds.remove();\n            readersAfter = readers;\n            if (readers == 0) okToWrite.signalAll();               // only now can a writer make progress\n        } finally { mutex.unlock(); }\n        publish(EventKind.READ_RELEASED, 0, readersAfter);\n    }\n\n    // ---------------- the write side\n\n    /**\n     * Get in as a writer, alone. A thread that already holds the write side re-enters and only counts up. A\n     * thread that holds the READ side is refused loudly: read-to-write upgrade is the classic deadlock, because\n     * two upgraders would each wait for the other&#x27;s read hold to go away.\n     */\n    boolean acquireWrite(int mode, long timeoutMs) throws InterruptedException {\n        long startedMs = clock.nowMs();\n        boolean admitted = false, reentered = false;\n        int readersAfter = 0;\n        mutex.lock();\n        try {\n            if (writerOwner == Thread.currentThread()) {\n                writerHolds++; reentered = true;                   // reentrant write\n            } else {\n                if (readHolds.get()[0] &gt; 0)\n                    throw new IllegalStateException(&quot;read-to-write upgrade would deadlock: release the read hold first&quot;);\n                long ticket = nextTicket++;\n                if (!policy.writerMustWait(this, ticket)) {\n                    admitted = true;\n                } else if (mode != NO_WAIT) {\n                    writerQueue.addLast(ticket);\n                    boolean gaveUp = false;\n                    try {\n                        long deadline = startedMs + timeoutMs;\n                        while (policy.writerMustWait(this, ticket)) {\n                            if (mode == TIMED) {\n                                long remain = deadline - clock.nowMs();\n                                if (remain &lt;= 0) { gaveUp = true; break; }\n                                okToWrite.await(remain, TimeUnit.MILLISECONDS);\n                            } else {\n                                okToWrite.await();\n                            }\n                        }\n                        admitted = !gaveUp;\n                    } catch (InterruptedException e) {\n                        gaveUp = true;\n                        throw e;\n                    } finally {\n                        writerQueue.removeFirstOccurrence(ticket);\n                        if (gaveUp) wakeBoth();                    // a cancelled writer must stop blocking readers\n                    }\n                }\n                if (admitted) { writerOwner = Thread.currentThread(); writerHolds = 1; }\n            }\n            readersAfter = readers;\n        } finally { mutex.unlock(); }\n        if (admitted) publish(EventKind.WRITE_ACQUIRED, startedMs, readersAfter);\n        return admitted || reentered;\n    }\n\n    /**\n     * Give the write side back. The last release wakes both sides, because with a swappable rule the lock does\n     * not know which side may now go in; each woken thread re-tests its own predicate and parks again if not.\n     */\n    void releaseWrite() {\n        boolean fully = false;\n        int readersAfter;\n        mutex.lock();\n        try {\n            if (writerOwner != Thread.currentThread())\n                throw new IllegalMonitorStateException(&quot;this thread does not hold the write lock&quot;);\n            if (--writerHolds == 0) { writerOwner = null; fully = true; wakeBoth(); }\n            readersAfter = readers;\n        } finally { mutex.unlock(); }\n        if (fully) publish(EventKind.WRITE_RELEASED, 0, readersAfter);\n    }\n\n    // ---------------- the counters, read only while the mutex is held\n\n    public int readers() { return readers; }\n    public boolean writerActive() { return writerHolds &gt; 0; }\n    public int waitingReaders() { return readerQueue.size(); }\n    public int waitingWriters() { return writerQueue.size(); }\n    public long earliestWaitingWriterTicket() { Long t = writerQueue.peekFirst(); return t == null ? Long.MAX_VALUE : t; }\n    public long earliestWaitingTicket() {\n        Long r = readerQueue.peekFirst();\n        return Math.min(earliestWaitingWriterTicket(), r == null ? Long.MAX_VALUE : r);\n    }\n\n    /** A copy of the counters, taken under the mutex, so another thread can look without racing. */\n    LockStats snapshot() {\n        mutex.lock();\n        try { return new LockStats(readers, writerHolds &gt; 0, readerQueue.size(), writerQueue.size()); }\n        finally { mutex.unlock(); }\n    }\n\n    /** How many read holds THIS thread has. Used to spot an upgrade, and by tests. */\n    int myReadHolds() { return readHolds.get()[0]; }\n\n    /**\n     * For tests: wake every parked thread without changing one counter. That is exactly what a spurious wakeup\n     * looks like from inside await(), so this is how the while loop gets proved instead of merely claimed.\n     */\n    void wakeWaitersForTest() {\n        mutex.lock();\n        try { wakeBoth(); } finally { mutex.unlock(); }\n    }\n\n    private void wakeBoth() { okToRead.signalAll(); okToWrite.signalAll(); }\n\n    /** Told after the mutex is released. A listener that throws is logged and ignored; the lock is already safe. */\n    private void publish(EventKind kind, long startedMs, int readersAfter) {\n        if (observers.isEmpty()) return;\n        long waited = startedMs == 0 ? 0 : clock.nowMs() - startedMs;\n        LockEvent e = new LockEvent(kind, Thread.currentThread().getName(), waited, readersAfter);\n        for (LockObserver o : observers) {\n            try { o.onEvent(e); } catch (RuntimeException ignored) { /* a broken listener is not the lock&#x27;s problem */ }\n        }\n    }\n}\n\n/** The read side. It owns nothing: it is a handle on the one Sync, which is why both sides see one set of counters. */\nfinal class ReadLock implements Lock {\n    private final Sync sync;\n    ReadLock(Sync sync) { this.sync = sync; }\n    public void lock() throws InterruptedException { sync.acquireRead(Sync.BLOCK, 0); }\n    public boolean tryLock() {\n        try { return sync.acquireRead(Sync.NO_WAIT, 0); }\n        catch (InterruptedException e) { Thread.currentThread().interrupt(); return false; }\n    }\n    public boolean tryLock(long timeoutMs) throws InterruptedException { return sync.acquireRead(Sync.TIMED, timeoutMs); }\n    public void unlock() { sync.releaseRead(); }\n}\n\n/** The write side. Same handle-over-one-Sync shape as the read side, which is what makes them interchangeable. */\nfinal class WriteLock implements Lock {\n    private final Sync sync;\n    WriteLock(Sync sync) { this.sync = sync; }\n    public void lock() throws InterruptedException { sync.acquireWrite(Sync.BLOCK, 0); }\n    public boolean tryLock() {\n        try { return sync.acquireWrite(Sync.NO_WAIT, 0); }\n        catch (InterruptedException e) { Thread.currentThread().interrupt(); return false; }\n    }\n    public boolean tryLock(long timeoutMs) throws InterruptedException { return sync.acquireWrite(Sync.TIMED, timeoutMs); }\n    public void unlock() { sync.releaseWrite(); }\n}\n\n/**\n * What a caller is given: two lock handles over one core. It builds the Sync and the two views and nothing\n * else, and it never builds a fairness rule -- that is handed in through configure().\n */\nfinal class RwLock {\n    private final Sync sync = new Sync();\n    private final Lock read = new ReadLock(sync);\n    private final Lock write = new WriteLock(sync);\n\n    /** Hand in the fairness rule and any listeners. Do it once, before any thread touches the lock. */\n    void configure(AdmissionPolicy rule, LockObserver... listeners) { sync.configure(rule, listeners); }\n    /** Hand in the clock used for deadlines and for the waited-for time in events. */\n    void setClock(Clock c) { sync.setClock(c); }\n    /** The shared read side. Many threads may hold it at once. */\n    Lock readLock() { return read; }\n    /** The exclusive write side. One thread, and no readers. */\n    Lock writeLock() { return write; }\n    /** A consistent copy of the counters, for a test or a dashboard. */\n    LockStats stats() { return sync.snapshot(); }\n    /** How many read holds the calling thread has right now. */\n    int myReadHolds() { return sync.myReadHolds(); }\n\n    /** For tests: a wake with nothing changed, which is what a spurious wakeup is. */\n    void wakeWaitersForTest() { sync.wakeWaitersForTest(); }\n}\n\n/**\n * The data the lock guards -- a row of cells that must always read the same number. A writer bumps them one at\n * a time, so a reader that sees two different numbers has caught a writer half way through: a torn read, which\n * is the exact bug the lock exists to prevent. The counters here are the proof, not part of the lock.\n */\nfinal class SharedDocument {\n    private final int[] cells;\n    private final AtomicInteger activeReaders = new AtomicInteger();\n    private final AtomicInteger activeWriters = new AtomicInteger();\n    final AtomicInteger tornReads = new AtomicInteger();\n    final AtomicInteger overlaps = new AtomicInteger();\n    final AtomicInteger maxConcurrentReaders = new AtomicInteger();\n\n    SharedDocument(int cellCount) { this.cells = new int[cellCount]; }\n\n    /** Call ONLY while holding the write lock. Bumps every cell, slowly on purpose, so a torn read is visible. */\n    void bumpAll() {\n        activeWriters.incrementAndGet();\n        if (activeReaders.get() != 0 || activeWriters.get() != 1) overlaps.incrementAndGet();\n        for (int i = 0; i &lt; cells.length; i++) { cells[i]++; Thread.onSpinWait(); }\n        activeWriters.decrementAndGet();\n    }\n\n    /** Call ONLY while holding the read lock. Returns the number every cell must agree on. */\n    int readAll() {\n        int now = activeReaders.incrementAndGet();\n        maxConcurrentReaders.accumulateAndGet(now, Math::max);\n        if (activeWriters.get() != 0) overlaps.incrementAndGet();\n        int first = cells[0];\n        boolean torn = false;\n        for (int c : cells) { if (c != first) torn = true; Thread.onSpinWait(); }\n        if (torn) tornReads.incrementAndGet();\n        activeReaders.decrementAndGet();\n        return first;\n    }\n\n    /** The value with no locking at all, for a report printed when every thread has stopped. */\n    int value() { return cells[0]; }\n}\n\n/** Counts what the lock did and the longest anybody waited. Pre-filled so no thread ever resizes the map. */\nfinal class Metrics implements LockObserver {\n    private final Map&lt;EventKind, AtomicInteger&gt; counts = new EnumMap&lt;&gt;(EventKind.class);\n    private final AtomicLong longestWaitMs = new AtomicLong();\n    Metrics() { for (EventKind k : EventKind.values()) counts.put(k, new AtomicInteger()); }\n    public void onEvent(LockEvent e) {\n        counts.get(e.kind()).incrementAndGet();\n        longestWaitMs.accumulateAndGet(e.waitedMs(), Math::max);\n    }\n    /** How many events of this kind, O(1). */\n    int count(EventKind k) { return counts.get(k).get(); }\n    /** The longest any single thread waited to be let in, in milliseconds of the injected clock. */\n    long longestWaitMs() { return longestWaitMs.get(); }\n}\n\n/** A body that may throw, so a demo thread can report the exception instead of swallowing it. */\ninterface ThrowingBody { void run() throws Exception; }\n\n/** The demo and the many-thread race. Everything it prints is a claim FailureTests proves. */\npublic class Main {\n\n    /** Start a named thread that prints and remembers any exception instead of dying quietly. */\n    static Thread start(String name, ThrowingBody body) {\n        Thread t = new Thread(() -&gt; {\n            try { body.run(); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            catch (Exception e) { System.out.println(&quot;  ! &quot; + name + &quot; threw &quot; + e); }\n        }, name);\n        t.start();\n        return t;\n    }\n\n    /**\n     * Wait until the lock&#x27;s counters satisfy a test, or give up. Used instead of sleeping a guessed number of\n     * milliseconds, and used instead of waiting forever: a test that can hang is not a test.\n     */\n    static boolean awaitState(RwLock rw, Predicate&lt;LockStats&gt; test, long timeoutMs) throws InterruptedException {\n        long deadline = System.currentTimeMillis() + timeoutMs;\n        while (System.currentTimeMillis() &lt; deadline) {\n            if (test.test(rw.stats())) return true;\n            Thread.sleep(1);\n        }\n        return test.test(rw.stats());\n    }\n\n    public static void main(String[] args) throws Exception {\n        demo();\n        policyComparison();\n        race();\n    }\n\n    /** One writer and three readers on one document: the readers overlap, the writer is alone. */\n    private static void demo() throws Exception {\n        System.out.println(&quot;== one document, three readers and one writer ==&quot;);\n        SharedDocument doc = new SharedDocument(8);\n        Metrics metrics = new Metrics();\n        RwLock rw = new RwLock();\n        rw.configure(Policies.of(Policy.WRITER_PREFERENCE), metrics);\n\n        CountDownLatch insideTogether = new CountDownLatch(3);\n        CountDownLatch holdUntil = new CountDownLatch(1);\n        for (int i = 1; i &lt;= 3; i++) {\n            start(&quot;reader-&quot; + i, () -&gt; {\n                rw.readLock().lock();\n                try {\n                    insideTogether.countDown();\n                    holdUntil.await(2, TimeUnit.SECONDS);          // hold, so the overlap is visible\n                    doc.readAll();\n                } finally { rw.readLock().unlock(); }\n            });\n        }\n        System.out.println(&quot;three readers inside at once: &quot; + insideTogether.await(2, TimeUnit.SECONDS)\n                           + &quot;  counters &quot; + rw.stats());\n\n        Thread writer = start(&quot;writer-1&quot;, () -&gt; {\n            rw.writeLock().lock();\n            try { doc.bumpAll(); } finally { rw.writeLock().unlock(); }\n        });\n        awaitState(rw, s -&gt; s.waitingWriters() == 1, 2000);\n        System.out.println(&quot;the writer is queued, and with WRITER_PREFERENCE a new reader now waits behind it: &quot;\n                           + !rw.readLock().tryLock() + &quot;  counters &quot; + rw.stats());\n        holdUntil.countDown();\n        writer.join(2000);\n        System.out.println(&quot;after the writer: value=&quot; + doc.value() + &quot; torn reads=&quot; + doc.tornReads.get()\n                           + &quot; reader-beside-writer=&quot; + doc.overlaps.get());\n\n        // downgrade: hold the write lock, take the read lock, then drop the write lock. Legal, and useful:\n        // you publish a change and keep reading it without anybody else writing in between.\n        rw.writeLock().lock();\n        doc.bumpAll();\n        rw.readLock().lock();                                       // still the writer: admitted at once\n        rw.writeLock().unlock();                                    // now only a reader\n        System.out.println(&quot;downgraded write -&gt; read, holding &quot; + rw.myReadHolds() + &quot; read hold, counters &quot; + rw.stats());\n        rw.readLock().unlock();\n\n        // upgrade: refused loudly rather than deadlocking quietly\n        rw.readLock().lock();\n        try { rw.writeLock().lock(); System.out.println(&quot;  ! upgrade should not be allowed&quot;); }\n        catch (IllegalStateException e) { System.out.println(&quot;upgrade refused: &quot; + e.getMessage()); }\n        finally { rw.readLock().unlock(); }\n\n        System.out.println(&quot;metrics: reads=&quot; + metrics.count(EventKind.READ_ACQUIRED)\n                           + &quot; writes=&quot; + metrics.count(EventKind.WRITE_ACQUIRED)\n                           + &quot; longest wait=&quot; + metrics.longestWaitMs() + &quot;ms&quot;);\n    }\n\n    /** The same lock, the same code, one line different: the rule decides who suffers. */\n    private static void policyComparison() throws Exception {\n        System.out.println();\n        System.out.println(&quot;== the same read storm under two rules ==&quot;);\n        for (Policy p : List.of(Policy.READER_PREFERENCE, Policy.WRITER_PREFERENCE)) {\n            RwLock rw = new RwLock();\n            rw.configure(Policies.of(p));\n            SharedDocument doc = new SharedDocument(8);\n            AtomicInteger reads = new AtomicInteger();\n            AtomicLong writerWaitedMs = new AtomicLong(-1);\n            long stormEnds = System.currentTimeMillis() + 300;\n\n            Thread[] storm = new Thread[6];\n            for (int i = 0; i &lt; storm.length; i++) {\n                storm[i] = start(&quot;storm-&quot; + i, () -&gt; {\n                    while (System.currentTimeMillis() &lt; stormEnds) {\n                        rw.readLock().lock();\n                        try { doc.readAll(); reads.incrementAndGet(); Thread.sleep(1); }   // a read that does real work\n                        finally { rw.readLock().unlock(); }\n                    }\n                });\n            }\n            Thread.sleep(30);                                        // let the storm get going\n            Thread writer = start(&quot;late-writer&quot;, () -&gt; {\n                long t0 = System.currentTimeMillis();\n                rw.writeLock().lock();\n                try { writerWaitedMs.set(System.currentTimeMillis() - t0); doc.bumpAll(); }\n                finally { rw.writeLock().unlock(); }\n            });\n            for (Thread t : storm) t.join(3000);\n            writer.join(3000);\n            System.out.println(p + &quot;: &quot; + reads.get() + &quot; reads during the storm, the writer waited &quot;\n                               + writerWaitedMs.get() + &quot;ms, torn reads=&quot; + doc.tornReads.get());\n        }\n    }\n\n    /** Twelve threads at one instant on one document: many readers, four writers, and the invariant must hold. */\n    private static void race() throws Exception {\n        System.out.println();\n        System.out.println(&quot;== 8 readers + 4 writers, all released at the same instant ==&quot;);\n        SharedDocument doc = new SharedDocument(16);\n        Metrics metrics = new Metrics();\n        RwLock rw = new RwLock();\n        rw.configure(Policies.of(Policy.FAIR), metrics);\n\n        int readerCount = 8, writerCount = 4, readsEach = 4000, writesEach = 50;\n        CountDownLatch go = new CountDownLatch(1);\n        CountDownLatch done = new CountDownLatch(readerCount + writerCount);\n        AtomicInteger reads = new AtomicInteger();\n\n        for (int i = 0; i &lt; readerCount; i++) {\n            start(&quot;reader-&quot; + i, () -&gt; {\n                go.await();\n                for (int k = 0; k &lt; readsEach; k++) {\n                    rw.readLock().lock();\n                    try { doc.readAll(); reads.incrementAndGet(); } finally { rw.readLock().unlock(); }\n                }\n                done.countDown();\n            });\n        }\n        for (int i = 0; i &lt; writerCount; i++) {\n            start(&quot;writer-&quot; + i, () -&gt; {\n                go.await();\n                for (int k = 0; k &lt; writesEach; k++) {\n                    rw.writeLock().lock();\n                    try { doc.bumpAll(); } finally { rw.writeLock().unlock(); }\n                    Thread.sleep(1);                                 // a real system writes now and then, not always\n                }\n                done.countDown();\n            });\n        }\n        long t0 = System.currentTimeMillis();\n        go.countDown();\n        boolean finished = done.await(30, TimeUnit.SECONDS);\n        long ms = System.currentTimeMillis() - t0;\n\n        System.out.println(&quot;rule=FAIR  finished=&quot; + finished + &quot; in &quot; + ms + &quot;ms&quot;);\n        System.out.println(&quot;writes applied: &quot; + doc.value() + &quot; (must be &quot; + (writerCount * writesEach) + &quot;)&quot;);\n        System.out.println(&quot;reads: &quot; + reads.get() + &quot;   torn reads: &quot; + doc.tornReads.get()\n                           + &quot;   reader-beside-writer: &quot; + doc.overlaps.get());\n        System.out.println(&quot;most readers inside at once: &quot; + doc.maxConcurrentReaders.get() + &quot; (1 would mean no sharing)&quot;);\n        System.out.println(&quot;lock events: &quot; + metrics.count(EventKind.READ_ACQUIRED) + &quot; read, &quot;\n                           + metrics.count(EventKind.WRITE_ACQUIRED) + &quot; write&quot;);\n        if (!finished || doc.tornReads.get() != 0 || doc.overlaps.get() != 0 || doc.value() != writerCount * writesEach)\n            throw new AssertionError(&quot;the lock let somebody in it should not have&quot;);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.ArrayDeque;\nimport java.util.Deque;\nimport java.util.HashMap;\nimport java.util.LinkedHashMap;\nimport java.util.Map;\nimport java.util.concurrent.ConcurrentHashMap;\nimport java.util.concurrent.CountDownLatch;\nimport java.util.concurrent.Semaphore;\nimport java.util.concurrent.TimeUnit;\nimport java.util.concurrent.atomic.AtomicInteger;\nimport java.util.concurrent.atomic.AtomicLong;\nimport java.util.concurrent.locks.ReentrantLock;\nimport java.util.concurrent.locks.ReentrantReadWriteLock;\nimport java.util.concurrent.locks.StampedLock;\nimport java.util.function.Function;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: optimistic reads -- the fastest read is the one that never takes the lock\n/**\n * A StampedLock hands out a stamp instead of a hold. You read the fields with no lock at all, then ask whether\n * a writer moved in the meantime; if one did, you read again, this time under a real read lock. It costs a\n * reader nothing when writes are rare, which is exactly when a read-write lock is worth having. The catch: the\n * optimistic body must be short, side-effect free and safe to run twice, because it can be thrown away.\n */\nfinal class OptimisticPoint {\n    private final StampedLock sl = new StampedLock();\n    private double x, y;\n\n    /** A write, exclusive, exactly like the write side of our lock. */\n    void move(double dx, double dy) {\n        long stamp = sl.writeLock();\n        try { x += dx; y += dy; } finally { sl.unlockWrite(stamp); }\n    }\n\n    /** Read with no lock, then validate. Only a reader that lost the race pays for a real read lock. */\n    double distanceFromOrigin() {\n        long stamp = sl.tryOptimisticRead();\n        double cx = x, cy = y;                                  // may be torn; validate() is what decides\n        if (!sl.validate(stamp)) {\n            stamp = sl.readLock();\n            try { cx = x; cy = y; } finally { sl.unlockRead(stamp); }\n        }\n        return Math.sqrt(cx * cx + cy * cy);\n    }\n}\n\n/**\n * The same trick by hand, so the mechanism is not magic: a version counter that is odd while a writer is\n * inside. A reader takes the version, reads the fields, and takes the version again; if it moved, it retries.\n * Writers must still be serialised by something (hold the write lock around set); only the readers go free.\n */\nfinal class SeqLockPair {\n    private final AtomicLong version = new AtomicLong();\n    private volatile int a, b;\n\n    /** One writer at a time -- hold the write lock around this. The odd version is the &quot;do not trust me&quot; flag. */\n    void set(int na, int nb) {\n        long v = version.get();\n        version.set(v + 1);                                     // odd: a write is in progress\n        a = na; b = nb;\n        version.set(v + 2);                                     // even again: the pair is consistent\n    }\n\n    /** Never blocks. Repeats the read if a writer touched the pair while it was reading. */\n    int[] get() {\n        while (true) {\n            long before = version.get();\n            if ((before &amp; 1) != 0) { Thread.onSpinWait(); continue; }   // a writer is inside; try again\n            int ra = a, rb = b;\n            if (version.get() == before) return new int[] { ra, rb };\n        }\n    }\n}\n\n// ---- ext: a condition variable on the write lock -- await() must drop the WHOLE hold and take it back\n/**\n * &quot;Wait until the document is not empty&quot; needs a condition bound to the write lock. The hard part is not the\n * parking: it is that await() has to give the write hold up, or nobody can ever change the thing it is waiting\n * for, and then take it back before returning, or the caller comes back holding less than it had. The\n * re-acquire is done ignoring interruption and the flag is restored afterwards, which is what a real\n * Condition does: you may be cancelled, but you never come back without your lock.\n */\nfinal class WriteCondition {\n    private final RwLock rw;\n    private final Deque&lt;CountDownLatch&gt; waiters = new ArrayDeque&lt;&gt;();\n    private final ReentrantLock guard = new ReentrantLock();\n\n    WriteCondition(RwLock rw) { this.rw = rw; }\n\n    /**\n     * Call while holding the write lock exactly once. Returns true if signalled, false if the timeout won.\n     * A full implementation would record the hold count first and restore it; this one assumes a single hold.\n     */\n    boolean await(long timeoutMs) throws InterruptedException {\n        CountDownLatch mine = new CountDownLatch(1);\n        guard.lock();\n        try { waiters.addLast(mine); } finally { guard.unlock(); }\n        rw.writeLock().unlock();                                  // drop it, or nobody can signal us\n        try {\n            return mine.await(timeoutMs, TimeUnit.MILLISECONDS);\n        } finally {\n            boolean interrupted = Thread.interrupted();           // clear it so the re-acquire cannot fail\n            while (true) {\n                try { rw.writeLock().lock(); break; }\n                catch (InterruptedException again) { interrupted = true; }\n            }\n            if (interrupted) Thread.currentThread().interrupt();  // hand the interrupt back to the caller\n        }\n    }\n\n    /** Wake the longest waiter. Call while holding the write lock, exactly like Condition.signal(). */\n    void signal() {\n        guard.lock();\n        try { CountDownLatch w = waiters.pollFirst(); if (w != null) w.countDown(); } finally { guard.unlock(); }\n    }\n\n    /** Wake everybody; each one re-tests its own predicate in a while loop, as always. */\n    void signalAll() {\n        guard.lock();\n        try { CountDownLatch w; while ((w = waiters.pollFirst()) != null) w.countDown(); } finally { guard.unlock(); }\n    }\n}\n\n// ---- ext: the same lock from a semaphore -- N permits, and a writer takes all N\n/**\n * Ten lines, no conditions, obviously correct: a reader takes one permit, a writer takes all of them at once.\n * acquire(MAX) is the trick -- taking permits one at a time would let readers keep slipping in. What you give\n * up is the knob: at most MAX readers, and the only fairness available is the semaphore&#x27;s own FIFO flag.\n */\nfinal class SemaphoreRwLock {\n    static final int MAX_READERS = 64;\n    private final Semaphore permits = new Semaphore(MAX_READERS, true);\n\n    /** One permit: many readers can hold one each. */\n    void lockRead() throws InterruptedException { permits.acquire(); }\n    void unlockRead() { permits.release(); }\n    /** All the permits, atomically, so no reader can be inside. */\n    void lockWrite() throws InterruptedException { permits.acquire(MAX_READERS); }\n    void unlockWrite() { permits.release(MAX_READERS); }\n    /** How many readers could still get in right now. */\n    int free() { return permits.availablePermits(); }\n}\n\n// ---- ext: the same lock from synchronized / wait / notifyAll -- one monitor, one wait set\n/**\n * The whole lock again with nothing from java.util.concurrent: the object&#x27;s own monitor, wait() and\n * notifyAll(). It keeps writer preference and the while loop, and it shows what one monitor costs. A monitor\n * has ONE wait set, so readers and writers park in the same queue and every wake is a wake for everybody --\n * that is the thundering herd. notify() would be a bug here: it may pick a reader that still cannot move, and\n * the writer that could move stays asleep. That is a lost wakeup, and it is why notify() is only safe when\n * every waiter is waiting for the same thing and any one of them can use the wake.\n */\nfinal class MonitorRwLock {\n    private int readers;\n    private boolean writer;\n    p

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design a digital wallet. People keep a balance with us, top it up from their bank, send money to each other and pay merchants, and every payment has to be auditable and safe to retry. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>People keep money with us. It arrives from a bank, it moves between people and to merchants, and it leaves again. Every movement has to be written down in a way that answers \"why is this account forty rupees short\" a year later, so a movement is not two numbers being edited: it is a pair of journal lines, money out of one account and into another, whose signed sum is exactly zero. The phone that asked for the payment is on a train, so the same request will arrive two or three times, and it must move the money once. Two people will pay each other at the same instant. The one thing that must always be true is that no balance goes negative and the total in the system never changes on its own: every paise in somebody's wallet is a paise out of the account it came from.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that tops up, pays, retries, refuses, reverses and then runs a race. The interviewer is watching for, in this order: the questions you ask before typing (how money is represented, and whether every write has an idempotency key, are the first two); which classes exist and which one owns the balance; a transfer end to end; what happens when two threads move money between the same two accounts in opposite directions; where the rules that will change (the fee, the daily cap, the fraud check) live, so a new one is a new class and not an edit; what the wallet looks like when a step in the middle fails. Then the twists: a card top-up that times out, holds, multi-currency, persistence, settlement.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 358\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"55\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">pay</text><g transform=\"translate(175 24)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a request with a key</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who pays whom, how much</text></g><path d=\"M415 51 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 24)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">claim the key, once</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a retry never pays twice</text></g><path d=\"M675 51 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 24)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lock every account, by id</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">sender, receiver, fee</text></g><path d=\"M935 51 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 24)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">append the legs, then balances</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">all of it, or none of it</text></g><text x=\"88\" y=\"177\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">top up</text><g transform=\"translate(175 146)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">money in from the bank rail</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">or back out to it</text></g><path d=\"M415 173 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 146)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same posting</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the bank account is the other side</text></g><path d=\"M675 173 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 146)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">same locks, same key</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">not a new verb</text></g><path d=\"M935 173 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 146)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the books still sum to zero</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">every paise came from somewhere</text></g><text x=\"88\" y=\"249\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">undo</text><g transform=\"translate(175 218)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the payment was a mistake</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a shop that never served</text></g><path d=\"M415 245 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 218)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the opposite posting</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nothing is ever edited</text></g><path d=\"M675 245 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 218)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">same locks, same key</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the amount and the fee come back</text></g><path d=\"M935 245 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 218)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the original is REVERSED</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">both lines stay in the journal</text></g><path d=\"M815 78 V90\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(660 90)\"><rect width=\"310\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"155.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refused: nothing is written</text></g><text x=\"88\" y=\"306\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"306\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, without folding the journal: what is my balance?  what did transaction T do?  my last ten lines?</text><text x=\"615\" y=\"344\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">many people pay at the same instant, and Ann pays Ben while Ben pays Ann: no balance goes negative, the total never changes, nothing deadlocks</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>How is money represented?</td><td>Integer paise, one currency in v1</td><td><code>long</code>, never <code>double</code>; FX becomes a follow-up, not a patch (moves 1, 12)</td></tr><tr><td>A real ledger, or just a balance field on each account?</td><td>A ledger; balances are a cache of it</td><td>Double-entry entries, and a reconcile job that proves the cache (moves 1, 5)</td></tr><tr><td>Does every write carry an idempotency key?</td><td>Yes, the client sends one</td><td>One <code>putIfAbsent</code> claims it; a retry can never pay twice (moves 5, 6)</td></tr><tr><td>Closed loop, or a pass-through to bank rails?</td><td>Closed loop, with a bank settlement account as the ramp</td><td>Top-up and withdrawal are ordinary transfers, not new code (move 2)</td></tr><tr><td>Can two people move money between the same accounts at once, in both directions?</td><td>Yes</td><td>A lock per account, taken in id order (moves 4, 7)</td></tr><tr><td>Fees, daily limits, fraud checks &mdash; and will they change?</td><td>A merchant fee, a daily cap, a velocity check; all will change</td><td>Each behind a one-method interface, handed in (move 3)</td></tr><tr><td>Can a payment be undone?</td><td>Yes, by an opposite posting; nothing is ever edited</td><td>REVERSED as a state, not an UPDATE on a row (move 6)</td></tr><tr><td>One process and in memory, or a database and many servers?</td><td>One process, in memory</td><td>No repository yet; a follow-up adds one (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Open accounts for people, for merchants, and for the house (the bank rail, the fee account).</li>\n<li>Top up from a bank rail and withdraw back to it.</li>\n<li>Send money to another person or to a merchant, with a fee the product can change.</li>\n<li>Every write carries an idempotency key: a retry returns the first outcome, it does not move money again.</li>\n<li>A double-entry journal: every movement is written as entries whose signed sum is exactly zero.</li>\n<li>Undo a completed payment by writing the opposite posting; never edit an entry.</li>\n<li>Read a balance, a statement, and what one transaction did.</li>\n<li>Freeze, unfreeze and close an account.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Many callers at once: no balance may go negative and no posting may be half-written.</li>\n<li>Ann pays Ben while Ben pays Ann: that must not deadlock.</li>\n<li>Money is exact: integer paise, never a double, never a lost paise.</li>\n<li>Balance and \"what did this transaction do\" are O(1); a statement is O(n) in the lines asked for.</li>\n<li>Fees, limits and fraud checks swappable without touching the money path.</li>\n<li>One source of truth: the journal. The balance is a cache the journal can prove and re-derive.</li>\n<li>Nothing half-done: a refused transfer leaves every balance and the journal exactly as they were.</li>\n<li>In memory, one process, no persistence (say it; a follow-up adds it).</li></ul></div></div>\n<div class=\"move\"><h3>One afternoon, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"270\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">13:02  Ann tops up 1,000.00</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">bank -1,000.00, ann +1,000.00</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">two legs, signed sum exactly zero</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the float we now hold is 1,000.00</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"270\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">13:14  Ann pays the chai stall</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">120.00 to the shop, 2.00 to the house</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">three legs: ann is debited 122.00</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the posting still sums to zero</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"270\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">13:14  the phone retries it</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the same idempotency key arrives again</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">putIfAbsent loses: the first txn wins</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">no second line, no second 122.00</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"270\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">13:40  9,000.00 she does not have</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">refused before a line is appended</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">Ben pays her at once: both lock by id</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">no balance moved, no deadlock</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> money is integer paise and never a double; every write carries an idempotency key and the key is claimed with one <code>putIfAbsent</code>; the journal is the source of truth and a balance is a cache the journal can prove; the lock lives on the account, and a transfer takes every account it touches sorted by id, which is why Ann-pays-Ben and Ben-pays-Ann cannot deadlock; the outside world is modelled as accounts too, so no money appears from nowhere. Named as out of scope: multi-currency and FX, holds, persistence, settlement with a bank &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On a wallet two of the moves carry more weight than usual: move 4, because a transfer needs two locks and two locks is where deadlocks live, and move 6, because the order of the steps is the difference between a refused payment and a wallet that has lost somebody's money.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a USER sends MONEY between ACCOUNTS; every movement is a pair of LEDGER ENTRIES; one TRANSFER is one TRANSACTION with an IDEMPOTENCY KEY</text><g transform=\"translate(30 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Account</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">balance, status, lock</text></g><path d=\"M117.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(225 110)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Ledger</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the journal + an index</text></g><path d=\"M307.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 110)\"><rect width=\"190\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LedgerEntry</text><text x=\"95.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">immutable: one line</text></g><path d=\"M505.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(620 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Transaction</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one request, its outcome</text></g><path d=\"M712.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(825 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Money</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: two helpers</text></g><path d=\"M912.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1020 110)\"><rect width=\"180\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"90.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Rules, fees, listeners</text><text x=\"90.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: interfaces</text></g><path d=\"M1110.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a value, an interface, or a number the journal can prove</text></svg></div><div class=\"move\"><p>Reading the paragraph again: a <b>user</b> sends <b>money</b> between <b>accounts</b>; every movement is written as <b>ledger entries</b>; one <b>transfer</b> is one <b>transaction</b> carrying an <b>idempotency key</b>; <b>rules</b> can refuse it and <b>listeners</b> are told about it. An account has a balance, a status and a lock, all of which change: a class. The ledger has a journal and an index, both of which grow: a class. A ledger entry never changes once written, which is the point of it: a record. A transaction has a status that moves and a reason it failed: a class. Money has no state at all &mdash; it is a <code>long</code> of paise plus two helpers at the edges &mdash; so it is not a thing to instantiate, and a <code>double</code> here is the single fastest way to fail this interview. And the balance is not a class either: it is a number cached on the account that the journal can prove at any time.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 245\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hold the money</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 46 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 24)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Account  (balance, status, its own lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 46 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">account.applyDelta(-paise)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 80)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">record the movement</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 102 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 80)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Ledger  (the journal and its index)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 102 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 80)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ledger.post(legs)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 136)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">move money, end to end</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 158 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 136)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WalletService  (it can see all three)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 158 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">wallet.transfer(key, a, b, paise)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb whose state is spread over two classes goes to the class that can see both: that class becomes the orchestrator</text><text x=\"615\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and top-up, withdrawal and reversal are not new verbs: the same posting, a different counterparty or the opposite sign</text></svg></div><div class=\"move\"><p>\"Hold the money\" touches a balance, a status and a lock, and all three live on one account, so it is <code>account.applyDelta(-paise)</code> and <code>account.canCover(paise)</code>. \"Record the movement\" touches the journal and its per-account index, so it is <code>ledger.post(legs)</code>. \"Move money end to end\" touches two accounts, the journal and the idempotency map at once, and only the wallet can see all of them, so <code>wallet.transfer(key, from, to, paise)</code> is the orchestrator. Then notice what are <i>not</i> new verbs. A top-up is a transfer from the bank settlement account. A withdrawal is a transfer to it. A reversal is a transfer the other way with the same amounts. Because the outside world is modelled as accounts too, money never appears from nowhere, and one code path carries all four cases.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 264\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 60)\"><rect width=\"220\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WalletService</text><text x=\"110.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(rules, feePolicy)</text></g><path d=\"M250 105 H330 V46 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FeePolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">free, flat per merchant, 0.5% capped</text></g><g transform=\"translate(760 24)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">NoFee / MerchantFlatFee / CappedPercentFee</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 46 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 105 H330 V106 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 84)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TransferRule</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">daily cap, velocity, currency, sanctions</text></g><g transform=\"translate(760 84)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DailyLimitRule / VelocityRule / SameCurrencyRule</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 106 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 105 H330 V166 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 144)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TxnListener</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">receipt, fraud desk, cashback, analytics</text></g><g transform=\"translate(760 144)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ReceiptPrinter / FraudMonitor / Cashback</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 166 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"212\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The wallet never builds a rule, so a new fee or a new limit is a new class and one changed line</text><text x=\"615\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and notice what is NOT a rule: \"he must have the money\", \"the account must be ACTIVE\", \"the legs must sum to zero\".</text><text x=\"615\" y=\"251\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">those are invariants, not policy: they are never handed in and can never be switched off</text></svg></div><div class=\"move\"><p>What it costs to send money will change: free today, two rupees to merchants tomorrow, half a percent capped at a hundred on Friday afternoon. What is allowed will change: a daily cap, a velocity check, a sanctions list, a limit on brand-new payees. Who is told will change: a receipt today, a fraud desk and a cashback engine later. Each becomes a one-method interface the wallet is <i>given</i> in <code>configure()</code> and never builds &mdash; that is <b>Strategy</b> for the fee and the rules, and <b>Observer</b> for the listeners, born here rather than announced somewhere. The line worth saying out loud is the other one: an <i>invariant</i> is not a rule. \"He must have the money\", \"the account must be ACTIVE\", \"the legs must sum to zero\" are not handed in and cannot be switched off, because they are not negotiable. Confusing the two is how a wallet ends up with a configuration flag that allows negative balances.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock &mdash; and then an order.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Ravi's phone</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads ann = 600.00</text></g><g transform=\"translate(30 110)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the shop's till</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads ann = 600.00</text></g><g transform=\"translate(350 70)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ann's balance</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">600.00</text></g><path d=\"M220 52 H350 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M220 132 H350 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"285\" y=\"40\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"285\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"580\" y=\"20\" width=\"290\" height=\"140\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"725\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"725\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both see 600, both pay 500</text><text x=\"725\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">the balance ends at minus 400</text><text x=\"725\" y=\"130\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: check and debit as ONE step</text><g transform=\"translate(900 26)\"><rect width=\"300\" height=\"132\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the lock lives on the ACCOUNT</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">not on the wallet, so two unrelated</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">payments never wait for each other</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\"></text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">and the ledger's own monitor is always</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">taken after them, never before</text></g><text x=\"615\" y=\"188\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">but one lock per account means a transfer takes TWO, and two locks is where deadlocks live</text><g transform=\"translate(20 200)\"><rect width=\"580\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"290.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#ff6b6b\">lock the sender, then the receiver</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">Ann pays Ben: lock ann, then wait for ben</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">Ben pays Ann: lock ben, then wait for ann</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">each holds what the other needs: forever</text></g><g transform=\"translate(630 200)\"><rect width=\"580\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"290.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lock every account SORTED BY ID</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">Ann pays Ben: lock ann, then ben</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">Ben pays Ann: lock ann, then ben</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one order for everybody, so there is no cycle</text></g></svg></div><div class=\"move\"><p>Ravi's phone and the shop's till both read Ann's balance as six hundred, both decide she can afford five hundred, and both debit: she ends at minus four hundred and the wallet has invented money. So the check and the debit must be one step, under a lock held by whoever owns the balance &mdash; the account, not the wallet, because Ann paying Ben must not block Carol paying Dan. But a transfer touches two accounts, and two locks is exactly where deadlocks live: if each thread locks the sender and then the receiver, Ann-pays-Ben and Ben-pays-Ann grab one each and wait for the other forever. The fix is one line and it is the whole answer: collect every account the posting touches &mdash; sender, receiver, and the fee account if there is a fee &mdash; sort them by id, and lock them in that order. One order for everybody means there is no cycle to wait in. There is a second lock hiding here and a good interviewer will find it: the ledger has a monitor of its own, because two postings must not interleave inside the journal. Two lock levels can deadlock as easily as two accounts, and the reason this pair cannot is that there is exactly one direction &mdash; accounts first, ledger second, never the other way round. Say \"two lock levels, one order\" out loud before you are asked.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 315\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 16)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline

account id\n    private final Map<String, Long> heldOn = new ConcurrentHashMap<>();     // account id -> paise on hold\n\n    Holds(WalletService wallet) { this.wallet = wallet; }\n\n    /** Spendable money: the balance minus everything already promised to somebody else. */\n    long available(String accountId) { return wallet.balanceOf(accountId) - heldOn.getOrDefault(accountId, 0L); }\n\n    /** Promise up to `paise` to a merchant. Refused if the available balance cannot cover it. */\n    void authorise(String holdId, String accountId, long paise) {\n        synchronized (this) {\n            if (available(accountId) < paise) throw new TransferRejected(\"hold \" + holdId + \": available is \" + Money.fmt(available(accountId)));\n            byHold.put(holdId, new long[] { paise }); account.put(holdId, accountId);\n            heldOn.merge(accountId, paise, Long::sum);\n        }\n    }\n    /** Take what was actually used, release the rest, and move the money as an ordinary transfer. */\n    Transaction capture(String holdId, String idemKey, String toId, long paise) {\n        long[] held = byHold.get(holdId);\n        if (held == null) throw new NoSuchElementException(\"no such hold: \" + holdId);\n        if (paise > held[0]) throw new TransferRejected(\"capture \" + Money.fmt(paise) + \" exceeds the hold \" + Money.fmt(held[0]));\n        release(holdId);                                                    // free it first, then spend it\n        return wallet.transfer(idemKey, account.get(holdId), toId, paise, \"capture of \" + holdId);\n    }\n    /** Give the money back to the available balance. The balance never moved, so nothing is posted. */\n    synchronized void release(String holdId) {\n        long[] held = byHold.remove(holdId);\n        if (held == null) return;\n        heldOn.merge(account.get(holdId), -held[0], Long::sum);\n    }\n}\n\n// ---- ext: cashback -- a new listener, zero edits to transfer(). The trap is the loop it can start\n/**\n * One    /** The conditional UPDATE. Returns false if the row moved under us, which is the signal to retry. */\n    boolean compareAndSetBalance(String accountId, long expectedVersion, long newBalance);\n    /** The idempotency insert. True the first time a key is seen, false every time after. */\n    boolean claimKey(String idemKey);\n}\n\n/** A tiny in-memory stand-in that behaves exactly like the two SQL statements above. */\nclass InMemoryAccountRepository implements AccountRepository {\n    private final Map<String, long[]> rows = new ConcurrentHashMap<>();     // id -> { balance, version }\n    private final Set<String> keys = ConcurrentHashMap.newKeySet();\n    public long[] load(String accountId) { return rows.computeIfAbsent(accountId, k -> new long[] { 0, 0 }).clone(); }\n    public synchronized boolean compareAndSetBalance(String accountId, long expectedVersion, long newBalance) {\n        long[] row = rows.computeIfAbsent(accountId, k -> new long[] { 0, 0 });\n        if (row[1] != expectedVersion) return false;                        // WHERE version = ? matched no row\n        row[0] = newBalance; row[1]++;\n        return true;\n    }\n    public boolean claimKey(String idemKey) { return keys.add(idemKey); }\n}\n\n// ---- ext: standing instructions -- rent on the first of every month, with a key that cannot double-charge\n/**\n * A scheduled payment. The interesting part is not the schedule, it is the key: it contains the period number,\n * so running the job twice, or running it on two servers, pays each period exactly once. That is the same\n * property that makes a retried HTTP request safe.\n */\nclass StandingInstruction {\n    private final String id, fromId, toId; private final long paise, startMs, periodMs;\n    StandingInstruction(String id, String fromId, String toId, long paise, long startMs, long periodMs) {\n        this.id = id; this.fromId = fromId; this.toId = toId; this.paise = paise; this.startMs = startMs; this.periodMs = periodMs;\n    }\n    /**\n     * Pay every period that is due by `nowMs`, and return how many periods this run actually paid. Safe to call\n     * again and again: a period whose key already exists is skipped, so a second run pays nothing. A period that\n     * was refused keeps its refusal; retrying it needs an attempt number in the key, which is a product decision.\n     */\n    int runUpTo(WalletService wallet, long nowMs) {\n        int paid = 0;\n        for (long p = 0; startMs + p * periodMs <= nowMs; p++) {\n            String key = id + \"#\" + p;\n            if (wallet.byKey(key) != null) continue;                    // this period has already been attempted\n            try { wallet.transfer(key, fromId, toId, paise, id + \" period \" + p); paid++; }\n            catch (TransferRejected r) { /* refused: the reason is on the transaction under this key */ }\n        }\n        return paid;\n    }\n}\n\n// ---- ext: settlement -- sweep the merchants' balances out to the bank at the end of the day\n/**\n * At the end of the day every merchant's wallet balance leaves for their real bank account. It is an ordinary\n * withdrawal per merchant, so it is auditable and reversible like everything else; the key names the day, so\n * running the batch twice settles once.\n */\nclass Settlement {\n    /** Sweep each merchant to zero. Returns the total moved, in paise. */\n    static long sweep(WalletService wallet, List<String> merchantIds, String dayKey) {\n        long moved = 0;\n        for (String m : merchantIds) {\n            long due = wallet.balanceOf(m);\n            if (due <= 0) continue;\n            wallet.withdraw(\"settle-\" + dayKey + \"-\" + m, m, due);\n            moved += due;\n        }\n        return moved;\n    }\n}\n\n// ---- ext: the audit view -- what a transaction did, straight from the journal it wrote\n/** Prints one transaction's journal lines. Nothing is computed: the journal already says everything. */\nclass AuditView {\n    /** Every entry written by one transaction, in the order they were appended. */\n    static String print(WalletService wallet, String txnId) {\n        StringBuilder sb = new StringBuilder();\n        Transaction t = wallet.txn(txnId);\n        sb.append(\"  \").append(t).append(\"\\n\");\n        for (LedgerEntry e : wallet.ledger().journal())\n            if (e.txnId().equals(txnId)) sb.append(\"    \").append(e).append(\"\\n\");\n        return sb.toString();\n    }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) {\n        WalletService wallet = new WalletService(\"bank\", \"fee\", Currency.INR);\n        long[] now = { 1_700_000_000_000L };\n        wallet.setClock(() -> now[0]);\n        wallet.configure(List.of(new SameCurrencyRule()),\n                         new CappedPercentFee(Money.rupees(\"10000.00\"), 50, Money.rupees(\"100.00\")));\n        wallet.open(\"ann\", AccountType.USER, Currency.INR);\n        wallet.open(\"ben\", AccountType.USER, Currency.INR);\n        wallet.open(\"shop\", AccountType.MERCHANT, Currency.INR);\n        wallet.topUp(\"seed-ann\", \"ann\", Money.rupees(\"100000.00\"));\n\n        // the pricing change: one new class, nothing else moved\n        wallet.transfer(\"p1\", \"ann\", \"ben\", Money.rupees(\"9000.00\"), \"under the threshold\");\n        wallet.transfer(\"p2\", \"ann\", \"ben\", Money.rupees(\"20000.00\"), \"0.5% = 100, at the cap\");\n        System.out.println(\"capped percent fee collected: \" + Money.fmt(wallet.balanceOf(\"fee\"))\n            + \" (nothing on 9000.00, the cap on 20000.00)\");\n\n        // the gateway top-up: SUCCESS, FAILED, and the UNKNOWN that a job closes later\n        Map<String, GatewayOutcome> answers = new LinkedHashMap<>();\n        PaymentGateway gw = new PaymentGateway() {\n            public GatewayOutcome charge(String key, String card, long paise) { return answers.getOrDefault(key, GatewayOutcome.SUCCESS); }\n            public GatewayOutcome statusOf(String key) { return answers.getOrDefault(key + \"!later\", GatewayOutcome.UNKNOWN); }\n        };\n        GatewayTopUp top = new GatewayTopUp(wallet, gw);\n        answers.put(\"g2\", GatewayOutcome.FAILED);\n        answers.put(\"g3\", GatewayOutcome.UNKNOWN);\n        System.out.println(\"gateway g1 -> \" + top.topUp(\"g1\", \"ben\", \"4111\", Money.rupees(\"500.00\"))\n            + \", g2 -> \" + top.topUp(\"g2\", \"ben\", \"4111\", Money.rupees(\"500.00\"))\n            + \", g3 -> \" + top.topUp(\"g3\", \"ben\", \"4111\", Money.rupees(\"500.00\")));\n        answers.put(\"g3!later\", GatewayOutcome.SUCCESS);                    // the charge did go through after all\n        System.out.println(\"reconciled \" + top.reconcile() + \" unknown charge(s); pending now \" + top.stillPending()\n            + \"; ben \" + Money.fmt(wallet.balanceOf(\"ben\")));\n\n        // multi-currency: two legs, each balanced inside its own currency\n        wallet.open(\"fx-INR\", AccountType.BANK_SETTLEMENT, Currency.INR);\n        wallet.open(\"fx-USD\", AccountType.BANK_SETTLEMENT, Currency.USD);\n        wallet.open(\"dana\", AccountType.USER, Currency.USD);\n        FxRates rates = (minor, from, to) -> from == to ? minor : from == Currency.INR ? minor / 90 : minor * 90;\n        List<Transaction> fx = new FxTransfer(wallet, rates).send(\"fx-1\", \"ann\", \"dana\", Money.rupees(\"9000.00\"));\n        System.out.println(\"fx legs \" + fx.get(0).id() + \" / \" + fx.get(1).id()\n            + \": dana \" + Money.fmt(wallet.balanceOf(\"dana\")) + \" USD, fx-INR \" + Money.fmt(wallet.balanceOf(\"fx-INR\")));\n\n        // holds: authorise 500 at the pump, capture 380\n        Holds holds = new Holds(wallet);\n        holds.authorise(\"h1\", \"ben\", Money.rupees(\"500.00\"));\n        System.out.println(\"ben balance \" + Money.fmt(wallet.balanceOf(\"ben\")) + \", available \"\n            + Money.fmt(holds.available(\"ben\")) + \" while the hold is live\");\n        holds.capture(\"h1\", \"cap-1\", \"shop\", Money.rupees(\"380.00\"));\n        System.out.println(\"after the capture: shop \" + Money.fmt(wallet.balanceOf(\"shop\"))\n            + \", ben available \" + Money.fmt(holds.available(\"ben\")));\n\n        // cashback: a listener, and the guard that stops it feeding itself\n        wallet.open(\"promo\", AccountType.BANK_SETTLEMENT, Currency.INR);\n        wallet.addListener(new Cashback(wallet, \"promo\", 100));             // 1%\n        wallet.transfer(\"cb-test\", \"ann\", \"ben\", Money.rupees(\"300.00\"), \"lunch\");\n        System.out.println(\"1% cashback on a 300.00 payment paid out \" + Money.fmt(-wallet.balanceOf(\"promo\"))\n            + \"; the promo account is now \" + Money.fmt(wallet.balanceOf(\"promo\")) + \", and it did not feed itself\");\n\n        // persistence: the conditional UPDATE, and the idempotency insert\n        AccountRepository repo = new InMemoryAccountRepository();\n        long[] row = repo.load(\"ann\");\n        System.out.println(\"optimistic update at the version we read: \" + repo.compareAndSetBalance(\"ann\", row[1], 50000)\n            + \", the same update replayed: \" + repo.compareAndSetBalance(\"ann\", row[1], 50000));\n        System.out.println(\"idempotency insert: first \" + repo.claimKey(\"pay-9\") + \", again \" + repo.claimKey(\"pay-9\"));\n\n        // standing instruction: run the job twice on purpose\n        StandingInstruction rent = new StandingInstruction(\"rent\", \"ann\", \"ben\", Money.rupees(\"15000.00\"),\n                                                           now[0], 30L * 24 * 3600 * 1000);\n        now[0] += 60L * 24 * 3600 * 1000;                                    // two months later\n        int first = rent.runUpTo(wallet, now[0]), second = rent.runUpTo(wallet, now[0]);\n        System.out.println(\"standing instruction: \" + first + \" periods paid, the job re-run paid \" + second + \" more\");\n\n        // settlement and the audit view\n        long swept = Settlement.sweep(wallet, List.of(\"shop\"), \"2026-09-13\");\n        System.out.println(\"settled \" + Money.fmt(swept) + \" to the bank; shop is now \" + Money.fmt(wallet.balanceOf(\"shop\")));\n        System.out.print(\"audit of the capture:\\n\" + AuditView.print(wallet, wallet.byKey(\"cap-1\").id()));\n        System.out.println(\"everything still reconciles: \" + wallet.reconcile());\n    }\n}\n", "f2": "import java.util.*;\nimport java.util.concurrent.*;\n\n// targeted failure tests: ten blocks, each one proving a claim the design makes on page 02, move 9.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? \"PASS \" : \"FAIL \") + what); if (!ok) failures++; }\n\n    /** A wallet with the standard rules, a generous daily cap and no fee, for the tests that do not care about policy. */\n    static WalletService plain() {\n        WalletService w = new WalletService(\"bank\", \"fee\", Currency.INR);\n        w.configure(List.of(new SameCurrencyRule()), new NoFee());\n        return w;\n    }\n\n    public static void main(String[] args) throws Exception {\n        // 1. fifty threads transfer between the SAME two accounts in BOTH directions at once. Two things must\n        //    hold: the total is conserved to the paise, and the run finishes at all (locking in id order is the\n        //    reason it cannot deadlock; without it this test hangs).\n        WalletService busy = plain();\n        busy.open(\"x\", AccountType.USER, Currency.INR);\n        busy.open(\"y\", AccountType.USER, Currency.INR);\n        busy.topUp(\"f-x\", \"x\", Money.rupees(\"500.00\"));\n        busy.topUp(\"f-y\", \"y\", Money.rupees(\"500.00\"));\n        long start = busy.balanceOf(\"x\") + busy.balanceOf(\"y\");\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<Integer>> sent = new ArrayList<>();\n        for (int i = 0; i < 50; i++) {\n            final int n = i;\n            sent.add(pool.submit(() -> {\n                go.await();\n                String from = n % 2 == 0 ? \"x\" : \"y\", to = n % 2 == 0 ? \"y\" : \"x\";\n                try { busy.transfer(\"r-\" + n, from, to, Money.rupees(\"1.00\"), \"round \" + n); return 1; }\n                catch (TransferRejected r) { return 0; }\n            }));\n        }\n        go.countDown();\n        int settled = 0;\n        for (Future<Integer> f : sent) settled += f.get(5, TimeUnit.SECONDS);   // a deadlock would time out here\n        pool.shutdown();\n        check(settled == 50, \"all 50 two-way transfers finished: no deadlock (\" + settled + \"/50)\");\n        check(busy.balanceOf(\"x\") + busy.balanceOf(\"y\") == start, \"the total is conserved to the paise after the race\");\n        check(busy.reconcile(), \"every cached balance still equals the fold of the journal\");\n\n        // 2. not enough money: the transfer is refused and NOTHING is written -- not a balance, not a journal line\n        WalletService poor = plain();\n        poor.open(\"ann\", AccountType.USER, Currency.INR);\n        poor.open(\"ben\", AccountType.USER, Currency.INR);\n        poor.topUp(\"t1\", \"ann\", Money.rupees(\"100.00\"));\n        long annBefore = poor.balanceOf(\"ann\"), benBefore = poor.balanceOf(\"ben\");\n        int linesBefore = poor.ledger().journal().size();\n        try {\n            poor.transfer(\"k1\", \"ann\", \"ben\", Money.rupees(\"100.01\"), \"one paise too far\");\n            check(false, \"a transfer larger than the balance must be refused\");\n        } catch (TransferRejected e) { check(true, \"refused: \" + e.getMessage()); }\n        check(poor.balanceOf(\"ann\") == annBefore && poor.balanceOf(\"ben\") == benBefore, \"neither balance moved\");\n        check(poor.ledger().journal().size() == linesBefore, \"the journal has no half-written posting\");\n        check(poor.byKey(\"k1\").status() == TxnStatus.FAILED, \"the attempt is recorded as FAILED, with its reason\");\n\n        // 3. a retried request applies once. The same key returns the same transaction, and a key whose attempt\n        //    failed is refused again for the same reason instead of quietly trying a second time.\n        WalletService idem = plain();\n        idem.open(\"ann\", AccountType.USER, Currency.INR);\n        idem.open(\"ben\", AccountType.USER, Currency.INR);\n        idem.topUp(\"t1\", \"ann\", Money.rupees(\"500.00\"));\n        Transaction first = idem.transfer(\"pay-42\", \"ann\", \"ben\", Money.rupees(\"200.00\"), \"rent\");\n        Transaction again = idem.transfer(\"pay-42\", \"ann\", \"ben\", Money.rupees(\"200.00\"), \"rent\");\n        check(first == again, \"the same idempotency key returned the very same transaction\");\n        check(idem.balanceOf(\"ben\") == Money.rupees(\"200.00\"), \"and the money moved exactly once\");\n        check(idem.ledger().entriesFor(\"ben\").size() == 1, \"one journal line for ben, not two\");\n        try {\n            idem.transfer(\"dud\", \"ann\", \"ben\", Money.rupees(\"9000.00\"), \"no chance\");\n            check(false, \"unreachable\");\n        } catch (TransferRejected e) { /* the first attempt */ }\n        try {\n            idem.transfer(\"dud\", \"ann\", \"ben\", Money.rupees(\"9000.00\"), \"no chance\");\n            check(false, \"a retry of a failed key must be refused too\");\n        } catch (TransferRejected e) { check(true, \"a retry of a failed key replays the refusal: \" + e.getMessage()); }\n\n        // 4. a frozen account can neither send nor receive; a closed one cannot be reopened, and cannot be\n        //    closed at all while it still holds money\n        WalletService fz = plain();\n        fz.open(\"ann\", AccountType.USER, Currency.INR);\n        fz.open(\"ben\", AccountType.USER, Currency.INR);\n        fz.topUp(\"t1\", \"ann\", Money.rupees(\"300.00\"));\n        fz.account(\"ben\").setStatus(AccountStatus.FROZEN);\n        try { fz.transfer(\"k1\", \"ann\", \"ben\", Money.rupees(\"10.00\"), \"in\"); check(false, \"a frozen receiver must refuse\"); }\n        catch (TransferRejected e) { check(true, \"frozen receiver refused: \" + e.getMessage()); }\n        fz.account(\"ben\").setStatus(AccountStatus.ACTIVE);\n        fz.account(\"ann\").setStatus(AccountStatus.FROZEN);\n        try { fz.transfer(\"k2\", \"ann\", \"ben\", Money.rupees(\"10.00\"), \"out\"); check(false, \"a frozen sender must refuse\"); }\n        catch (TransferRejected e) { check(true, \"frozen sender refused: \" + e.getMessage()); }\n        check(fz.balanceOf(\"ann\") == Money.rupees(\"300.00\"), \"the frozen account's balance is untouched\");\n        try { fz.account(\"ann\").setStatus(AccountStatus.CLOSED); check(false, \"closing an account with money must be refused\"); }\n        catch (IllegalStateException e) { check(true, \"cannot close an account holding money: \" + e.getMessage()); }\n\n        // 5. the daily cap, with time handed in: the cap bites, the refusal writes nothing, and tomorrow is a\n        //    fresh day -- which is only testable because the clock is injected\n        WalletService cap = new WalletService(\"bank\", \"fee\", Currency.INR);\n        long[] now = { 1_700_000_000_000L };\n        cap.setClock(() -> now[0]);\n        cap.configure(List.of(new SameCurrencyRule(), new DailyLimitRule(Money.rupees(\"1000.00\"))), new NoFee());\n        cap.open(\"ann\", AccountType.USER, Currency.INR);\n        cap.open(\"ben\", AccountType.USER, Currency.INR);\n        cap.topUp(\"t1\", \"ann\", Money.rupees(\"5000.00\"));\n        cap.transfer(\"d1\", \"ann\", \"ben\", Money.rupees(\"600.00\"), \"morning\");\n        cap.transfer(\"d2\", \"ann\", \"ben\", Money.rupees(\"400.00\"), \"noon\");\n        long spent = cap.balanceOf(\"ben\");\n        try { cap.transfer(\"d3\", \"ann\", \"ben\", Money.rupees(\"0.01\"), \"one paise over\"); check(false, \"the cap must bite\"); }\n        catch (TransferRejected e) { check(true, \"daily cap refused the next paise: \" + e.getMessage()); }\n        check(cap.balanceOf(\"ben\") == spent, \"the capped transfer moved nothing\");\n        now[0] += 86_400_000L;                                                  // tomorrow\n        cap.transfer(\"d4\", \"ann\", \"ben\", Money.rupees(\"900.00\"), \"next day\");\n        check(cap.balanceOf(\"ben\") == spent + Money.rupees(\"900.00\"), \"a new day resets the counter\");\n\n        // 6. a reversal writes the OPPOSITE posting; it never edits an entry and never sets a balance by hand\n        WalletService rev = new WalletService(\"bank\", \"fee\", Currency.INR);\n        rev.configure(List.of(new SameCurrencyRule()), new MerchantFlatFee(Money.rupees(\"2.00\")));\n        rev.open(\"ann\", AccountType.USER, Currency.INR);\n        rev.open(\"shop\", AccountType.MERCHANT, Currency.INR);\n        rev.topUp(\"t1\", \"ann\", Money.rupees(\"500.00\"));\n        long annStart = rev.balanceOf(\"ann\");\n        Transaction paid = rev.transfer(\"buy\", \"ann\", \"shop\", Money.rupees(\"120.00\"), \"kettle\");\n        List<LedgerEntry> original = rev.ledger().entriesFor(\"shop\");\n        rev.reverse(\"rev-1\", paid.id());\n        check(rev.balanceOf(\"ann\") == annStart, \"the sender is back to the paise, fee included\");\n        check(rev.balanceOf(\"shop\") == 0 && rev.balanceOf(\"fee\") == 0, \"the merchant and the fee account are back to zero\");\n        check(rev.txn(paid.id()).status() == TxnStatus.REVERSED, \"the original transaction is marked REVERSED\");\n        check(rev.ledger().entriesFor(\"shop\").size() == original.size() + 1, \"the reversal ADDED a line, it did not edit one\");\n        check(rev.ledger().entriesFor(\"shop\").get(0).equals(original.get(0)), \"the original entry is byte-for-byte what it was\");\n        try { rev.reverse(\"rev-2\", paid.id()); check(false, \"reversing twice must be refused\"); }\n        catch (TransferRejected e) { check(true, \"a second reversal is refused: \" + e.getMessage()); }\n\n        // 7. the journal is the truth: replaying it must reproduce every cached balance, and every balance in\n        //    the system must add up to exactly zero\n        check(rev.reconcile(), \"after the reversal the wallet still reconciles\");\n        long total = 0;\n        for (String id : rev.ledger().accountsSeen()) {\n            check(rev.balanceOf(id) == rev.ledger().replay(id), \"replaying the journal reproduces \" + id + \"'s balance\");\n            total += rev.balanceOf(id);\n        }\n        check(total == 0, \"every balance in the wallet adds up to exactly zero\");\n\n        // 8. a listener that throws must not break the money path\n        WalletService noisy = plain();\n        noisy.open(\"ann\", AccountType.USER, Currency.INR);\n        noisy.open(\"ben\", AccountType.USER, Currency.INR);\n        noisy.addListener(t -> { throw new RuntimeException(\"push gateway is down\"); });\n        noisy.topUp(\"t1\", \"ann\", Money.rupees(\"100.00\"));\n        Transaction landed = noisy.transfer(\"k1\", \"ann\", \"ben\", Money.rupees(\"40.00\"), \"chai\");\n        check(landed.status() == TxnStatus.COMPLETED && noisy.balanceOf(\"ben\") == Money.rupees(\"40.00\"),\n              \"the transfer landed although the listener threw\");\n        check(noisy.reconcile(), \"and the books still reconcile\");\n\n        // 9. the balance is a CACHE, so ask what happens when it drifts: a crash between the journal append and\n        //    the balance write, a bug, a hand-edited row. reconcile() catches it and rebuildFromJournal() repairs\n        //    it from the entries -- which is the whole reason for saying \"the journal is the source of truth\"\n        WalletService drift = plain();\n        drift.open(\"ann\", AccountType.USER, Currency.INR);\n        drift.open(\"ben\", AccountType.USER, Currency.INR);\n        drift.topUp(\"t1\", \"ann\", Money.rupees(\"400.00\"));\n        drift.transfer(\"k1\", \"ann\", \"ben\", Money.rupees(\"150.00\"), \"dinner\");\n        drift.account(\"ben\").applyDelta(Money.rupees(\"99.00\"));     // the cache only: the journal is untouched\n        check(!drift.reconcile(), \"reconcile() catches a cached balance that the journal does not agree with\");\n        check(drift.rebuildFromJournal() == 1, \"rebuildFromJournal() repairs exactly the one account that drifted\");\n        check(drift.balanceOf(\"ben\") == Money.rupees(\"150.00\"), \"ben's balance is the fold of his entries again\");\n        check(drift.reconcile(), \"and the wallet reconciles once more\");\n\n        // 10. the card top-up that times out. UNKNOWN credits nothing, and the job that closes it later credits\n        //     exactly once however many times it runs, because the wallet's top-up is idempotent on the same key\n        WalletService cardTop = plain();\n        cardTop.open(\"ann\", AccountType.USER, Currency.INR);\n        Map<String, GatewayOutcome> answers = new HashMap<>();\n        PaymentGateway gw = new PaymentGateway() {\n            public GatewayOutcome charge(String key, String card, long paise) { return answers.getOrDefault(key, GatewayOutcome.UNKNOWN); }\n            public GatewayOutcome statusOf(String key) { return answers.getOrDefault(key + \"!later\", GatewayOutcome.UNKNOWN); }\n        };\n        GatewayTopUp cards = new GatewayTopUp(cardTop, gw);\n        check(cards.topUp(\"g1\", \"ann\", \"4111\", Money.rupees(\"500.00\")).equals(\"pending\"),\n              \"a gateway timeout answers 'pending' -- a real answer, not a failure to answer\");\n        check(cardTop.balanceOf(\"ann\") == 0, \"nothing is credited while the outcome is unknown\");\n        answers.put(\"g1!later\", GatewayOutcome.SUCCESS);            // the charge did go through after all\n        cards.reconcile(); cards.reconcile();                       // the job runs twice, on purpose\n        check(cardTop.balanceOf(\"ann\") == Money.rupees(\"500.00\"), \"the job credited it once although it ran twice\");\n        check(cards.stillPending() == 0 && cardTop.reconcile(), \"the unknown charge is closed and the books balance\");\n\n        System.out.println(failures == 0 ? \"ALL PASS\" : failures + \" FAILED\");\n        if (failures != 0) System.exit(1);\n    }\n}\n"};

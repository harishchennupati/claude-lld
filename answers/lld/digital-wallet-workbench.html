)\">Map&lt;idemKey, Transaction&gt; + putIfAbsent</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 81 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 61)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 106)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what did transaction T do?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 126 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 106)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;txnId, Transaction&gt;</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 126 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 106)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 151)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">my last ten lines?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 171 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 151)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;accountId, List&lt;LedgerEntry&gt;&gt;</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 171 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 151)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(n) lines</text></g><g transform=\"translate(30 196)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which account do I lock?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 216 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 196)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;accountId, Account&gt;</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 216 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 196)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 241)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is that balance honest?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 261 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 241)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">fold this account's entries</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 261 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 241)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a job, not a request</text></g><text x=\"615\" y=\"300\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the journal is the truth and the balance is a cache of it: the cache answers in O(1), and reconcile() is what makes it safe to trust</text></svg></div><div class=\"move\"><p>\"What does this account hold?\" is a <code>long</code> on the account, so a balance screen never folds a year of history. \"Have I seen this request before?\" is a map from idempotency key to transaction, and the operation on it is <code>putIfAbsent</code>, which is a compare-and-set: the thread that puts the value in owns the payment and everyone else gets the existing one. \"What did transaction T do?\" is a map from transaction id. \"My last ten lines?\" is a per-account list of entries the ledger maintains as it appends, so a statement is O(n) in the lines you asked for and never a scan of the journal. The one to say deliberately: the journal is the truth and the balance is a cache of it. That is a choice with a cost &mdash; two writes per movement, and a job that folds the journal and compares &mdash; and it buys you an audit trail, refunds that are postings rather than guesses, and a balance you can prove.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 305\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"300\" y=\"18\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">a transaction's life</text><g transform=\"translate(30 26)\"><rect width=\"150\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PENDING</text><text x=\"75.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the key is claimed</text></g><g transform=\"translate(230 26)\"><rect width=\"150\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">COMPLETED</text><text x=\"75.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">both legs written</text></g><g transform=\"translate(430 26)\"><rect width=\"150\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">REVERSED</text><text x=\"75.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an opposite posting</text></g><g transform=\"translate(230 106)\"><rect width=\"150\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FAILED</text><text x=\"75.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nothing was written</text></g><path d=\"M180 47 H230\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M380 47 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M105 68 V127 H230\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"300\" y=\"180\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">an account's life</text><g transform=\"translate(30 190)\"><rect width=\"150\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ACTIVE</text><text x=\"75.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">sends, receives</text></g><g transform=\"translate(230 190)\"><rect width=\"150\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FROZEN</text><text x=\"75.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">neither way</text></g><g transform=\"translate(430 190)\"><rect width=\"150\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CLOSED</text><text x=\"75.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">only at zero</text></g><path d=\"M180 203 H230\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M230 222 H180\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M380 211 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"300\" y=\"262\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">an illegal move throws; it cannot happen quietly</text><rect x=\"620\" y=\"20\" width=\"590\" height=\"270\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"915\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order at a transfer, and why it is this order</text><text x=\"636\" y=\"70\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1  claim the idempotency key: ONE putIfAbsent decides it</text><text x=\"636\" y=\"92\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2  compute the fee -- pure, no lock held, and it may throw</text><text x=\"636\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3  lock every account the posting touches, sorted by id</text><text x=\"636\" y=\"136\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4  check statuses, run the rules, check the balance</text><text x=\"636\" y=\"158\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5  append both legs to the journal -- the irreversible write</text><text x=\"636\" y=\"180\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">6  only then move the cached balances and mark COMPLETED</text><text x=\"636\" y=\"202\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">7  unlock, then tell the listeners inside a try/catch</text><text x=\"636\" y=\"224\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a refusal at step 4 leaves the journal and every balance untouched;</text><text x=\"636\" y=\"246\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a crash between 5 and 6 loses nothing: the journal is the truth, and</text><text x=\"636\" y=\"268\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">rebuildFromJournal() folds it again to repair the cached balance</text></svg></div><div class=\"move\"><p>A transaction is PENDING when its key is claimed, COMPLETED when both legs are in the journal, FAILED when a rule or an invariant refused it, REVERSED when a later opposite posting undid it; an account is ACTIVE, FROZEN or CLOSED, and closing one that still holds money is refused. Writing the states down forces the question that decides this interview, and the panel beside them is the answer: in what order do the steps happen? Two of those seven steps are the ones to defend. The key is claimed <i>first</i>, with one <code>putIfAbsent</code> and before a single account is locked, so a duplicate request never reaches the money at all. And the journal append is the irreversible write, so everything that can refuse &mdash; the statuses, the rules, the balance &mdash; runs before it, and the cached balances move only after it has succeeded. A refusal therefore leaves the journal and every balance exactly as they were. And a crash between the append and the balance write loses nothing either: the journal is the truth, <code>reconcile()</code> finds the account whose cached balance no longer matches it, and <code>rebuildFromJournal()</code> folds the entries again to repair it.</p></div><div class=\"move\"><h3>Move 7: yes, the locks make one account's payments happen one at a time. Ask for how long, and what is inside them.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 315\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"540\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the locks: about 2 microseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">two status checks and the rule checks</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">compare the balance against amount + fee</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">build two or three entries and append them</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">write two or three balance fields</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">about twenty operations in all</text></g><path d=\"M570 95 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"605\" y=\"85\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the locks: milliseconds to seconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the fee arithmetic: done before the locks are taken</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the receipt or push: about 50 ms, after the unlock</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the database write: about 5 ms (a follow-up)</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the person typing the amount: seconds</text></g><text x=\"615\" y=\"200\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">ten people pay the same chai stall at the same instant</text><g transform=\"translate(30 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(148 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 2 us</text></g><g transform=\"translate(266 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 4 us</text></g><g transform=\"translate(384 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 6 us</text></g><g transform=\"translate(502 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 8 us</text></g><g transform=\"translate(620 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 10 us</text></g><g transform=\"translate(738 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 12 us</text></g><g transform=\"translate(856 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 14 us</text></g><g transform=\"translate(974 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 16 us</text></g><g transform=\"translate(1092 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 18 us</text></g><text x=\"615\" y=\"283\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tenth phone waits eighteen microseconds for the shop's lock and then fifty milliseconds for its own receipt;</text><text x=\"615\" y=\"301\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and two payments that share no account never wait for each other at all, which is most of them</text></svg></div><div class=\"move\"><p>The question you will be asked: if every payment takes two or three locks, is the wallet now a queue? It is, for about two microseconds, and only for the accounts involved. Inside the locks there are two status checks, the rule checks (a map read for the daily counter and a short walk down the tail of the account's entry list for the velocity check), one comparison of the balance against amount plus fee, two or three entry objects appended to the journal and its index, and two or three field writes: roughly twenty operations. Everything slow is outside. The fee arithmetic happens before the locks are taken, deliberately, because it is the part that can throw. The receipt, about fifty milliseconds, happens after the unlock inside a try/catch, so a dead push gateway cannot hold a lock. Ten people paying the same chai stall at the same instant: the tenth waits about eighteen microseconds.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per account: where would it bite? do the arithmetic</text><text x=\"35\" y=\"62\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">an account's lock is held about 2 us per posting</text><text x=\"35\" y=\"85\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">so ONE account can serve about 500,000 postings a second</text><text x=\"35\" y=\"108\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a person: twenty payments a day. contention: none, ever</text><text x=\"35\" y=\"131\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a busy chai stall on a festival day: 500 a second = 0.1% busy</text><text x=\"35\" y=\"154\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the two hot spots are the HOUSE account (every top-up locks it)</text><text x=\"35\" y=\"177\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">and the JOURNAL's one monitor (every posting, about 1 us each)</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 listeners and persistence outside the locks</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: the receipt goes out after the unlock</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 shard the two hot spots: the house account and the journal</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">bank#0 .. bank#15 by a hash of the user; one journal per shard</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 a row per account in the database</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE account SET balance = balance + ? WHERE id = ?, the key UNIQUE</text></g></svg></div><div class=\"move\"><p>The picture has the arithmetic; here is what it means. No user's account ever contends with itself &mdash; twenty payments a day against a lock that could take five hundred thousand is not a queue. The two places that do contend are both shared: the house account, because every top-up in the system locks the one bank settlement account, and the journal, because <code>Ledger.post</code> is synchronised on the whole ledger so every posting passes through a single monitor. Those two, not a user's lock, are the wallet's ceiling: at around fifty thousand top-ups a second the bank account is ten per cent busy, and the journal's monitor tops out near a million postings a second. That is what the ladder fixes, cheapest rung first: listeners and persistence stay outside the locks, which this code already does; the house account splits into bank#0 to bank#15 by a hash of the user id (free, because a house account never needs a balance check) and the journal splits the same way, one per shard; and past one process each account becomes a database row whose write is <code>UPDATE account SET balance = balance + ?</code>, with the journal an INSERT into an append-only table where the monitor problem disappears entirely.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 362\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 16)\"><rect width=\"300\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two threads spend the same balance</text></g><path d=\"M330 34 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 16)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check and debit inside one lock; test 1: 50 threads both ways, the total is conserved</text></g><g transform=\"translate(30 56)\"><rect width=\"300\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Ann pays Ben while Ben pays Ann</text></g><path d=\"M330 74 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 56)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lock every account sorted by id; test 1 finishes at all -- a deadlock would time out</text></g><g transform=\"translate(30 96)\"><rect width=\"300\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the phone retries on a bad network</text></g><path d=\"M330 114 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 96)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">putIfAbsent on the key; test 3: the same txn comes back, and one journal line, not two</text></g><g transform=\"translate(30 136)\"><rect width=\"300\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">no money, frozen, or over the cap</text></g><path d=\"M330 154 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 136)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refuse before the append; tests 2, 4, 5: no balance moved and no journal line</text></g><g transform=\"translate(30 176)\"><rect width=\"300\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the payment was a mistake</text></g><path d=\"M330 194 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 176)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an opposite posting, never an edit; test 6: the original entry is exactly what it was</text></g><g transform=\"translate(30 216)\"><rect width=\"300\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the cached balance drifts</text></g><path d=\"M330 234 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 216)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reconcile() catches it, rebuildFromJournal() folds the journal again; tests 7 and 9</text></g><g transform=\"translate(30 256)\"><rect width=\"300\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the card charge times out</text></g><path d=\"M330 274 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 256)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">credit nothing, ask the gateway again later; test 10: the job cannot double-credit</text></g><g transform=\"translate(30 296)\"><rect width=\"300\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the push gateway is down</text></g><path d=\"M330 314 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 296)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">listeners after the unlock in a try/catch; test 8: a listener that throws changes nothing</text></g><text x=\"615\" y=\"348\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a failure test: FailureTests.java runs ten blocks and must print ALL PASS</text></svg></div><div class=\"move\"><p>Two threads spending the same balance, and Ann paying Ben while Ben pays Ann: one locked step, every account in id order, and the test proves the second one by <i>finishing</i> &mdash; a deadlock shows up as a timeout, not as a wrong number. A phone retrying on a bad network. Three refusals that must all leave the wallet exactly as it was: not enough money, a frozen account, the daily cap (that one needs the injected clock). A payment that was a mistake. A cached balance that has drifted, which <code>reconcile()</code> catches and <code>rebuildFromJournal()</code> repairs. A card charge that times out. A dead push gateway. That is ten blocks in FailureTests.java, and the last two are what separates a wallet from a bank-account exercise: a design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"230\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"320\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"860\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"230\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface FeePolicy / interface TransferRule: one method each</text><text x=\"860\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a new fee or limit is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"230\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">publish(t) after the unlock, inside a try/catch</text><text x=\"860\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">the fraud desk hears; the money never waits</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"230\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">PENDING &rarr; COMPLETED / FAILED &rarr; REVERSED, checked before every write</text><text x=\"860\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">reversing twice is impossible</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Event log</text><text x=\"230\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 5</text><text x=\"320\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">the journal IS the log; a balance is fold(journal)</text><text x=\"860\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">any balance can be re-derived and proved</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Guard, not Decorator</text><text x=\"230\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Ledger.post refuses legs whose signed sum is not zero</text><text x=\"860\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">one gate every movement goes through</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"230\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"320\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">the wallet is handed to its callers; nothing calls getInstance()</text><text x=\"860\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh WalletService</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"230\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">the rules arrive as a List in configure(); that IS the registry</text><text x=\"860\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when rules come from config</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"230\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">a transfer has four required arguments and nothing optional</text><text x=\"860\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">earns a place when a transfer grows optional fields</text><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>The table is the answer; what is worth saying out loud is the bottom half of it. Decorator did not earn a place here, and people expect it to: there is nothing to wrap, because the invariant that every posting sums to zero already sits in one gate, <code>Ledger.post</code>, that every movement goes through. Singleton earned nothing either &mdash; the wallet is handed to its callers, which is exactly why a test can build a fresh one per case. Factory and Builder are \"not yet\" rather than \"never\": the list of rules handed to <code>configure()</code> is already the registry, so Factory earns the name the day rules arrive as strings from a config file, and Builder earns its place the day a transfer grows optional fields &mdash; a note, tags, a device id. A pattern without a move behind it is decoration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Account: a balance. Ledger: movements. A rule: one policy. WalletService: the flow.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">CappedPercentFee is a new file plus one line in configure()</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">feePolicy.feeFor(...) and rule.check(...); never \"is this the merchant one?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">FeePolicy, TransferRule, TxnListener, Clock: one method each</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">wallet.configure(rules, fee);  wallet.setClock(() -&gt; t);  wallet.addListener(...)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>Read the table, then say the one sentence that matters: every letter here is something a move already did, not something added to satisfy a checklist. The one to point at under pressure is D. The wallet depends on interfaces and is handed the implementations, and that is not an ideal &mdash; it is the only reason a test can hand it a clock that says next Tuesday and prove the daily cap resets, or hand it a listener that throws and prove the money still moves.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a cap on new payees, a sanctions list</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind TransferRule plus one configure line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">cashback, analytics, the fraud desk</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more listener; the money path does not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">authorise then capture; an UNKNOWN top-up</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more state and one more checked transition</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across accounts</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">FX: three legs, two currencies</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every account in the SAME sorted lock set: all of it or none</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">persist it; two servers</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the account row behind a repository; the write becomes</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE account SET balance = ?, version = version + 1 WHERE id = ? AND version = ?</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the Account, the Ledger and the tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>The picture maps five shapes of twist onto five moves. What to add out loud is the trap inside each. The listener one: a cashback posting must not trigger another cashback, or the promo account drains one per cent at a time until the rounding stops it. The new-invariant one: a cross-currency payment must put every account it touches into the <i>same</i> sorted lock set, or you have re-invented the deadlock you designed out in move 4. The persistence one: the conditional UPDATE <i>is</i> the lock, so a caller that ignores its \"zero rows changed\" answer has quietly lost a payment. For all five the Account, the Ledger and the failure tests do not change, and that is the real test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 780\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M135.0 110L135.0 74\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1082.5 100L1082.5 74\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M950 477L944 477L944 230L950 230\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M950 317 L944 317\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M950 392 L944 392\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M470.0 286L470.0 310\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"476.0\" y=\"302.0\" font-size=\"10.5\" fill=\"var(--muted)\">id &rarr; account</text><path d=\"M300 150L290 150L290 600L300 600\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M640 153.0L670 105.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M300 647L266 647L266 469L260 469\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M135.0 538L135.0 560\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M797.5 190L797.5 220\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M640 380L658 380L658 340L670 340\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M640 430L670 428\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M640 480L652 480L652 515L670 515\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M640 200L934 200L934 47L950 47\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M640 212L928 212L928 230L950 230\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"1082\" y=\"690\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">all handed in through configure()</text><path d=\"M950 477L916 477L916 650L640 650\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"910\" y=\"668\" text-anchor=\"end\" font-size=\"10.5\" fill=\"var(--muted)\">reads the per-account index</text><path d=\"M300 60L274 60L274 47L260 47\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><path d=\"M300 ected</text></g><g transform=\"translate(950 290)\"><rect width=\"265\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SameCurrencyRule</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">both sides, one currency</text></g><g transform=\"translate(950 365)\"><rect width=\"265\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DailyLimitRule</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">spentToday + amount &lt;= cap</text></g><g transform=\"translate(950 440)\"><rect width=\"265\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">VelocityRule</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">ledger, maxDebits, windowMs</text><line x1=\"0\" y1=\"48\" x2=\"265\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">n debits in the last 60s</text></g><g transform=\"translate(950 545)\"><rect width=\"265\" height=\"106\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">the invariants</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">not rules: never handed in</text><line x1=\"0\" y1=\"48\" x2=\"265\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">balance &gt;= amount + fee</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">status == ACTIVE</text><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">the legs must sum to zero</text></g><g><path d=\"M20 755L64 755\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"759\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 755L284 755\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"759\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 755L504 755\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"759\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 755L684 755\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"759\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 755L904 755\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"759\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the wallet owns the accounts, the ledger and every transaction; the ledger owns every entry. Plain arrow = references: an entry points at its direction, an account at its status, its type and its currency. Dashed green = handed in through <code>configure()</code> and <code>setClock()</code>. Dotted blue = notifies. <b>Where state lives:</b> the account has the balance, the status, today's spend and <i>the lock</i> &mdash; there is no lock on the wallet at all, which is why two unrelated payments never meet; the ledger has the journal, the per-account index and one monitor of its own, which is always taken after the account locks and never before; a transaction has its status and the ids of the lines it wrote; a rule and a fee policy have no state worth the name, so one instance serves every payment. Notice what is <i>not</i> here: no Balance class, because a balance is a <code>long</code> the journal can prove, and no TopUp or Withdrawal class, because both are transfers with a house account on the other side.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (ten blocks, one per claim on page 02; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/** The currencies the wallet knows. v1 moves money only inside one currency; FX is a follow-up, not a special case. */\nenum Currency { INR, USD }\n\n/** Exact money, in paise. There is no double anywhere in this file; these two helpers are the only boundary. */\nfinal class Money {\n    /** Parse &quot;1234.50&quot; into 123450 paise, exactly. Used at the edge (a form, a file), never in the arithmetic. */\n    static long rupees(String amount) { return new java.math.BigDecimal(amount).movePointRight(2).longValueExact(); }\n    /** Print 123450 paise as &quot;1234.50&quot;. Presentation only. */\n    static String fmt(long paise) {\n        String sign = paise &lt; 0 ? &quot;-&quot; : &quot;&quot;; long a = Math.abs(paise);\n        return sign + (a / 100) + &quot;.&quot; + String.format(&quot;%02d&quot;, a % 100);\n    }\n}\n\n/**\n * What an account is for. The move worth saying out loud: the outside world is modelled as accounts too, so\n * every movement is a two-sided posting. A top-up is money out of BANK_SETTLEMENT; a fee is money into\n * FEE_REVENUE. Nothing appears from nowhere.\n */\nenum AccountType {\n    USER, MERCHANT, BANK_SETTLEMENT, FEE_REVENUE;\n    /** House accounts mirror the world outside the wallet: they may go negative, and policy rules skip them. */\n    boolean house() { return this == BANK_SETTLEMENT || this == FEE_REVENUE; }\n}\n\n/** An account&#x27;s life. ACTIVE may send and receive; FROZEN may do neither; CLOSED is the end of the line. */\nenum AccountStatus { ACTIVE, FROZEN, CLOSED }\n\n/**\n * A transaction&#x27;s life. PENDING is claimed but not yet settled; COMPLETED means both legs are in the journal;\n * FAILED means a rule or an invariant refused it and nothing was written; REVERSED means a later, opposite\n * posting undid it. A transaction is never edited, only moved along this list.\n */\nenum TxnStatus { PENDING, COMPLETED, FAILED, REVERSED }\n\n/** CREDIT = money INTO this account. DEBIT = money OUT of it. Every posting&#x27;s signed legs must sum to zero. */\nenum Direction { DEBIT, CREDIT }\n\n/**\n * One immutable line of the journal: this much money moved in or out of this account, as part of this\n * transaction, at this instant. Entries are appended and never edited; a mistake is corrected by an opposite\n * entry, which is what makes the history auditable.\n */\nrecord LedgerEntry(String entryId, String txnId, String accountId, Direction dir, long paise, long atMs, String memo) {\n    /** The signed effect on the account&#x27;s balance: a credit adds, a debit subtracts. */\n    long signed() { return dir == Direction.CREDIT ? paise : -paise; }\n    @Override public String toString() { return entryId + &quot; &quot; + accountId + &quot; &quot; + dir + &quot; &quot; + Money.fmt(paise) + &quot; (&quot; + txnId + &quot;)&quot;; }\n}\n\n/** Where time comes from. Injected, so a test can pick the instant and then move it. */\ninterface Clock { long nowMs(); }\n\n/**\n * The journal: every movement, append only, never edited. This is the source of truth. An account&#x27;s balance is\n * a cache of the fold over this journal, and reconcile() proves the two agree. post() is synchronized on the\n * ledger and is always called while the account locks are already held, so the order is always\n * accounts then ledger and there is no second lock order to deadlock against.\n */\nclass Ledger {\n    private final List&lt;LedgerEntry&gt; journal = new ArrayList&lt;&gt;();\n    private final Map&lt;String, List&lt;LedgerEntry&gt;&gt; byAccount = new HashMap&lt;&gt;();\n    private final AtomicLong nextId = new AtomicLong(1);\n\n    /** A fresh entry id. An atomic counter, so two threads building postings never collide. */\n    String nextEntryId() { return &quot;E&quot; + nextId.getAndIncrement(); }\n\n    /**\n     * Append one posting. Refuses any posting whose signed legs do not sum to zero, so a bug upstream cannot\n     * create or destroy money. Append first, then index by account: the journal is never missing a line that\n     * the index has.\n     */\n    synchronized void post(List&lt;LedgerEntry&gt; legs) {\n        long sum = 0;\n        for (LedgerEntry e : legs) sum += e.signed();\n        if (sum != 0) throw new IllegalStateException(&quot;posting does not balance: &quot; + sum + &quot; paise&quot;);\n        journal.addAll(legs);\n        for (LedgerEntry e : legs) byAccount.computeIfAbsent(e.accountId(), k -&gt; new ArrayList&lt;&gt;()).add(e);\n    }\n    /** The last n entries for one account, oldest first. O(n) off the per-account index, never a journal scan. */\n    synchronized List&lt;LedgerEntry&gt; statement(String accountId, int n) {\n        List&lt;LedgerEntry&gt; all = byAccount.getOrDefault(accountId, List.of());\n        return List.copyOf(all.subList(Math.max(0, all.size() - n), all.size()));\n    }\n    /** Every entry for one account, oldest first. The per-account index, which the fraud rule also reads. */\n    synchronized List&lt;LedgerEntry&gt; entriesFor(String accountId) {\n        return List.copyOf(byAccount.getOrDefault(accountId, List.of()));\n    }\n    /** Fold every entry for one account: what the balance MUST be if the cache is honest. */\n    synchronized long replay(String accountId) {\n        long sum = 0;\n        for (LedgerEntry e : byAccount.getOrDefault(accountId, List.of())) sum += e.signed();\n        return sum;\n    }\n    /** Every entry ever written, for an audit screen or a reconciliation job. */\n    synchronized List&lt;LedgerEntry&gt; journal() { return List.copyOf(journal); }\n    /** Every account the journal has ever touched. */\n    synchronized Set&lt;String&gt; accountsSeen() { return new TreeSet&lt;&gt;(byAccount.keySet()); }\n}\n\n/**\n * Where money sits. The account owns its balance, its status, its spend-so-far-today and its OWN lock: Alice\n * paying Bob must not block Carol paying Dan. It holds state and does arithmetic; it decides no policy.\n */\nclass Account {\n    private final String id;\n    private final AccountType type;\n    private final Currency currency;\n    private final ReentrantLock lock = new ReentrantLock();\n    private long balancePaise;                 // guarded by lock: a cache of the ledger fold\n    private AccountStatus status = AccountStatus.ACTIVE;   // guarded by lock\n    private long spentTodayPaise;              // guarded by lock\n    private long dayNumber = Long.MIN_VALUE;   // guarded by lock\n\n    Account(String id, AccountType type, Currency currency) { this.id = id; this.type = type; this.currency = currency; }\n    String id() { return id; }\n    AccountType type() { return type; }\n    Currency currency() { return currency; }\n    /** The lock the service takes. Exposed because the SERVICE decides the order: every account, sorted by id. */\n    ReentrantLock lock() { return lock; }\n\n    /** True if this account can fund `paise`. House accounts mirror the outside world, so they may go negative. */\n    boolean canCover(long paise) { return type.house() || balancePaise &gt;= paise; }\n    /** Move the cached balance. Called only with this lock held, and only after the journal append succeeded. */\n    void applyDelta(long delta) { balancePaise += delta; }\n    /** Overwrite the cached balance with a number the journal produced. Only rebuildFromJournal() calls this. */\n    void resetBalance(long fromJournal) { lock.lock(); try { balancePaise = fromJournal; } finally { lock.unlock(); } }\n    /** The balance while the caller already holds this lock. */\n    long balanceHeld() { return balancePaise; }\n    /** The balance, taken under the lock so nobody reads it half-written. O(1). */\n    long balance() { lock.lock(); try { return balancePaise; } finally { lock.unlock(); } }\n    /** The status while the caller already holds this lock. */\n    AccountStatus statusHeld() { return status; }\n    /** The status, taken under the lock. */\n    AccountStatus status() { lock.lock(); try { return status; } finally { lock.unlock(); } }\n    /** Freeze, unfreeze or close. Closing an account with money in it is refused; the money must leave first. */\n    void setStatus(AccountStatus s) {\n        lock.lock();\n        try {\n            if (s == AccountStatus.CLOSED &amp;&amp; balancePaise != 0)\n                throw new IllegalStateException(id + &quot; still holds &quot; + Money.fmt(balancePaise));\n            if (status == AccountStatus.CLOSED) throw new IllegalStateException(id + &quot; is closed&quot;);\n            status = s;\n        } finally { lock.unlock(); }\n    }\n    /** Paise sent today, with the day taken from the injected clock. Caller holds the lock. */\n    long spentToday(long nowMs) { return dayOf(nowMs) == dayNumber ? spentTodayPaise : 0; }\n    /** Count a completed spend against today. Caller holds the lock; a new day resets the counter. */\n    void addSpent(long paise, long nowMs) {\n        long d = dayOf(nowMs);\n        if (d != dayNumber) { dayNumber = d; spentTodayPaise = 0; }\n        spentTodayPaise += paise;\n    }\n    private static long dayOf(long ms) { return Math.floorDiv(ms, 86_400_000L); }\n    @Override public String toString() { return id + &quot;[&quot; + Money.fmt(balance()) + &quot;]&quot;; }\n}\n\n/** A transfer was refused. The reason is stored on the transaction, so a retry of the key replays the same answer. */\nclass TransferRejected extends RuntimeException {\n    TransferRejected(String reason) { super(reason); }\n}\n\n/**\n * One request to move money, and the record of what happened to it. The idempotency key is the caller&#x27;s; the\n * transaction id is ours. Status and the entry ids are written once, under the account locks, and read by\n * anyone, so they are volatile.\n */\nclass Transaction {\n    private final String id, idemKey, fromId, toId, memo;\n    private final long amountPaise, feePaise, createdMs;\n    private volatile TxnStatus status = TxnStatus.PENDING;\n    private volatile String failureReason = &quot;&quot;;\n    private volatile List&lt;String&gt; entryIds = List.of();\n    private volatile String reversedBy = &quot;&quot;;\n\n    Transaction(String id, String idemKey, String fromId, String toId, long amountPaise, long feePaise, long createdMs, String memo) {\n        this.id = id; this.idemKey = idemKey; this.fromId = fromId; this.toId = toId;\n        this.amountPaise = amountPaise; this.feePaise = feePaise; this.createdMs = createdMs; this.memo = memo;\n    }\n    String id() { return id; }\n    String idemKey() { return idemKey; }\n    String fromId() { return fromId; }\n    String toId() { return toId; }\n    String memo() { return memo; }\n    long amountPaise() { return amountPaise; }\n    long feePaise() { return feePaise; }\n    long createdMs() { return createdMs; }\n    TxnStatus status() { return status; }\n    String failureReason() { return failureReason; }\n    /** The journal lines this transaction wrote. Empty until it completes; proof of what it did afterwards. */\n    List&lt;String&gt; entryIds() { return entryIds; }\n    String reversedBy() { return reversedBy; }\n    /** Mark it settled and remember its journal lines. Called under the locks, after the append succeeded. */\n    void complete(List&lt;String&gt; ids) { this.entryIds = List.copyOf(ids); this.status = TxnStatus.COMPLETED; }\n    /** Mark it refused. Nothing was written, and this reason is what a retry of the same key is told. */\n    void fail(String reason) { this.failureReason = reason; this.status = TxnStatus.FAILED; }\n    /** Mark it undone by a later, opposite posting. The original entries are never touched. */\n    void markReversed(String byTxnId) { this.reversedBy = byTxnId; this.status = TxnStatus.REVERSED; }\n    @Override public String toString() {\n        return id + &quot; &quot; + fromId + &quot;-&gt;&quot; + toId + &quot; &quot; + Money.fmt(amountPaise)\n             + (feePaise &gt; 0 ? &quot; +fee &quot; + Money.fmt(feePaise) : &quot;&quot;) + &quot; &quot; + status\n             + (failureReason.isEmpty() ? &quot;&quot; : &quot; (&quot; + failureReason + &quot;)&quot;);\n    }\n}\n\n// &quot;they will change the fee on a Friday afternoon&quot; -&gt; pricing goes behind an interface -&gt; Strategy\n/**\n * What this transfer costs the sender. One method, because pricing is the rule most likely to change mid-round.\n * The service never builds a policy; it is handed one.\n */\ninterface FeePolicy {\n    /** The fee in paise, on top of the amount. Zero means free. */\n    long feeFor(long amountPaise, Account from, Account to);\n}\n\n/** Free. The default for person-to-person money, which is how wallets get used in the first place. */\nclass NoFee implements FeePolicy {\n    public long feeFor(long amountPaise, Account from, Account to) { return 0; }\n}\n\n/** A flat fee on merchant payments only; person-to-person stays free, and the house never charges itself. */\nclass MerchantFlatFee implements FeePolicy {\n    private final long feePaise;\n    MerchantFlatFee(long feePaise) { this.feePaise = feePaise; }\n    public long feeFor(long amountPaise, Account from, Account to) {\n        if (from.type().house()) return 0;                     // a top-up or a settlement is not a merchant payment\n        return to.type() == AccountType.MERCHANT ? feePaise : 0;\n    }\n}\n\n/**\n * One policy check on a transfer. It runs under the account locks, before anything is written, and it may READ\n * state but must never write any. A rule refuses by throwing TransferRejected. An invariant (is the sender\n * active, does he have the money) is not a rule: invariants are not negotiable, rules are.\n */\ninterface TransferRule {\n    /** Throw TransferRejected to refuse. Called with every account of the posting already locked. */\n    void check(Transaction t, Account from, Account to, long nowMs);\n}\n\n/** Both sides must be in the same currency. FX is a follow-up that replaces this rule, not a patch inside it. */\nclass SameCurrencyRule implements TransferRule {\n    public void check(Transaction t, Account from, Account to, long nowMs) {\n        if (from.currency() != to.currency())\n            throw new TransferRejected(&quot;currency mismatch: &quot; + from.currency() + &quot; -&gt; &quot; + to.currency());\n    }\n}\n\n/** A cap on what one account may send in a calendar day. The day comes from the injected clock, so it is testable. */\nclass DailyLimitRule implements TransferRule {\n    private final long capPaise;\n    DailyLimitRule(long capPaise) { this.capPaise = capPaise; }\n    public void check(Transaction t, Account from, Account to, long nowMs) {\n        if (from.type().house()) return;                       // policy applies to people, not to the house\n        long after = from.spentToday(nowMs) + t.amountPaise() + t.feePaise();\n        if (after &gt; capPaise)\n            throw new TransferRejected(&quot;daily limit: &quot; + Money.fmt(from.spentToday(nowMs)) + &quot; already sent today, cap is &quot; + Money.fmt(capPaise));\n    }\n}\n\n/**\n * The fraud check, in its simplest honest form: too many debits from one account inside a short window is\n * refused. It reads the ledger&#x27;s per-account index, so it costs nothing extra to keep.\n */\nclass VelocityRule implements TransferRule {\n    private final Ledger ledger; private final int maxDebits; private final long windowMs;\n    VelocityRule(Ledger ledger, int maxDebits, long windowMs) { this.ledger = ledger; this.maxDebits = maxDebits; this.windowMs = windowMs; }\n    public void check(Transaction t, Account from, Account to, long nowMs) {\n        if (from.type().house()) return;\n        int recent = 0;\n        List&lt;LedgerEntry&gt; mine = ledger.entriesFor(from.id());\n        for (int i = mine.size() - 1; i &gt;= 0; i--) {\n            LedgerEntry e = mine.get(i);\n            if (nowMs - e.atMs() &gt; windowMs) break;            // the index is in time order: stop at the window\n            if (e.dir() == Direction.DEBIT) recent++;\n        }\n        if (recent &gt;= maxDebits)\n            throw new TransferRejected(&quot;velocity: &quot; + recent + &quot; debits in the last &quot; + (windowMs / 1000) + &quot;s&quot;);\n    }\n}\n\n/** Someone who wants to know a transaction landed or was refus

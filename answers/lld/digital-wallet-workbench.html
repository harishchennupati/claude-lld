lent negative balance.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Undo a completed transaction by writing the OPPOSITE posting. No entry is ever edited and no balance is\n     * ever set by hand: the reversal is an ordinary movement that happens to point the other way, so the audit\n     * trail shows both the mistake and the correction. Idempotent by key, like every other write.\n     */\n    Transaction reverse(String idemKey, String txnId) {\n        Transaction orig = txn(txnId);\n        long now = clock.nowMs();\n        Transaction fresh = new Transaction(&quot;T&quot; + nextTxn.getAndIncrement(), idemKey, orig.toId(), orig.fromId(),\n                                            orig.amountPaise(), orig.feePaise(), now, &quot;reversal of &quot; + orig.id());\n        Transaction prior = byKey.putIfAbsent(idemKey, fresh);\n        if (prior != null) return replay(prior);\n        byId.put(fresh.id(), fresh);\n\n        Account from = account(orig.fromId()), to = account(orig.toId());\n        Account feeAcct = orig.feePaise() &gt; 0 ? account(feeId) : null;\n        List&lt;Account&gt; locked = sorted(from, to, feeAcct);\n        boolean ok = false;\n        lockAll(locked);\n        try {\n            if (orig.status() != TxnStatus.COMPLETED)\n                throw new TransferRejected(&quot;only a COMPLETED transaction can be reversed; &quot; + orig.id() + &quot; is &quot; + orig.status());\n            if (!to.canCover(orig.amountPaise()))                     // the receiver may have spent it already\n                throw new TransferRejected(&quot;cannot reverse: &quot; + to.id() + &quot; holds &quot; + Money.fmt(to.balanceHeld()));\n            long fee = orig.feePaise();\n            List&lt;LedgerEntry&gt; legs = new ArrayList&lt;&gt;(3);\n            legs.add(new LedgerEntry(ledger.nextEntryId(), fresh.id(), to.id(), Direction.DEBIT, orig.amountPaise(), now, &quot;reversal&quot;));\n            legs.add(new LedgerEntry(ledger.nextEntryId(), fresh.id(), from.id(), Direction.CREDIT, orig.amountPaise() + fee, now, &quot;reversal&quot;));\n            if (fee &gt; 0) legs.add(new LedgerEntry(ledger.nextEntryId(), fresh.id(), feeId, Direction.DEBIT, fee, now, &quot;fee refund&quot;));\n            ledger.post(legs);\n            to.applyDelta(-orig.amountPaise());\n            from.applyDelta(orig.amountPaise() + fee);\n            if (feeAcct != null) feeAcct.applyDelta(-fee);\n            fresh.complete(legs.stream().map(LedgerEntry::entryId).toList());\n            orig.markReversed(fresh.id());\n            ok = true;\n        } catch (TransferRejected r) {\n            fresh.fail(r.getMessage());\n        } finally { unlockAll(locked); }\n\n        publish(fresh);\n        if (!ok) throw new TransferRejected(fresh.failureReason());\n        return fresh;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>7 &middot; How do you know the balances are right? Prove it.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>By folding the journal. <code>reconcile()</code> walks every account the journal has ever touched, adds up the signed value of its entries, compares that with the number the wallet serves, and then adds every balance together, which must come to exactly zero. It can be zero at all only because of the move on page 02: the outside world is modelled as accounts, so a top-up is not money appearing, it is the bank settlement account going negative by the float we now hold. Two guards keep that true &mdash; <code>Ledger.post</code> refuses any posting whose legs do not sum to zero, and a balance moves only through <code>applyDelta</code>, immediately after an append that succeeded. Finding a mismatch is half the job, so <code>rebuildFromJournal()</code> folds the entries again and overwrites the cache; the journal is the truth, which is what makes the cache disposable. The last thing to say is that <code>reconcile()</code> is a job and not a request: it takes each account's lock one at a time, so on a live wallet it can read account A after a transfer and account B before the same one and report a difference that is not real &mdash; run it when the wallet is quiet, or fold only up to a fixed journal position and compare against balances read at that same point.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * The check that makes the cached balances trustworthy: fold the journal for every account and compare it\n     * with the number we serve. It also adds every balance up, which must be exactly zero, because every paise\n     * in someone&#x27;s wallet is a paise out of the bank settlement account. It is a JOB, not a request: it takes\n     * each account&#x27;s lock one at a time, so on a wallet taking payments it can read account A after a transfer\n     * and account B before the same one and report a difference that is not real. Run it when the wallet is\n     * quiet, or fold only the entries up to a fixed journal position and compare against balances read at that\n     * same point.\n     */\n    boolean reconcile() {\n        long total = 0;\n        for (String id : ledger.accountsSeen()) {\n            long cached = account(id).balance(), replayed = ledger.replay(id);\n            if (cached != replayed) {\n                System.out.println(&quot;  [reconcile] &quot; + id + &quot; cached &quot; + Money.fmt(cached) + &quot; journal &quot; + Money.fmt(replayed));\n                return false;\n            }\n            total += cached;\n        }\n        return total == 0;\n    }\n\n    /**\n     * Repair: re-derive every cached balance by folding the journal again, and return how many accounts were\n     * actually wrong. This is what makes &quot;the journal is the source of truth&quot; more than a slogan \u2014 a crash\n     * between the append and the balance write, or any drift reconcile() finds, is fixed from the entries\n     * themselves. The one thing it cannot rebuild is the daily spend counter, because &quot;sent today&quot; is not in\n     * the journal; a real system re-derives it from today&#x27;s DEBIT entries or keeps it in the same store.\n     */\n    int rebuildFromJournal() {\n        int repaired = 0;\n        for (String id : ledger.accountsSeen()) {\n            Account a = account(id);\n            long replayed = ledger.replay(id);\n            if (a.balance() != replayed) { a.resetBalance(replayed); repaired++; }\n        }\n        return repaired;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Top up from a card, and the gateway times out. Now what?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The order is everything: charge the card first, credit the wallet second. On SUCCESS the wallet is credited under the same key the gateway was given. On FAILED nothing happens. On UNKNOWN &mdash; which is the real answer to \"what if it times out\" &mdash; the money may or may not have left the bank, so the wallet is credited with nothing and the key is parked. A reconciliation job asks the gateway again later and finishes the job, and because the wallet's top-up is idempotent on that same key, the job can run as often as it likes without ever double-crediting. Crediting first and charging afterwards is how wallets give money away.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: top-up through a payment gateway -- the UNKNOWN outcome, and the reconciliation job that closes it\n/** What the card network said. UNKNOWN is the one that matters: the money may or may not have left the bank. */\nenum GatewayOutcome { SUCCESS, FAILED, UNKNOWN }\n\n/** The outside world&#x27;s money. charge() is the irreversible action; statusOf() is how we ask again later. */\ninterface PaymentGateway {\n    /** Charge the card. Idempotent on the same key at the gateway&#x27;s end too, which is why we pass ours through. */\n    GatewayOutcome charge(String idemKey, String card, long paise);\n    /** What happened to that charge, asked again after a timeout. */\n    GatewayOutcome statusOf(String idemKey);\n}\n\n/**\n * Top-up done in the only safe order: charge the card FIRST, and credit the wallet only once the charge is\n * known to have succeeded. If the gateway times out we credit nothing and remember the key; a reconciliation\n * job asks the gateway again and finishes the job. Crediting first and charging after is how wallets give away\n * money.\n */\nclass GatewayTopUp {\n    private final WalletService wallet; private final PaymentGateway gateway;\n    private final Map&lt;String, long[]&gt; pending = new LinkedHashMap&lt;&gt;();      // key -&gt; { paise }\n    private final Map&lt;String, String&gt; forAccount = new LinkedHashMap&lt;&gt;();   // key -&gt; account id\n\n    GatewayTopUp(WalletService wallet, PaymentGateway gateway) { this.wallet = wallet; this.gateway = gateway; }\n\n    /** &quot;credited&quot;, &quot;declined&quot; or &quot;pending&quot;: the third one is a real answer, not a failure to answer. */\n    String topUp(String idemKey, String accountId, String card, long paise) {\n        GatewayOutcome out = gateway.charge(idemKey, card, paise);\n        if (out == GatewayOutcome.SUCCESS) { wallet.topUp(idemKey, accountId, paise); return &quot;credited&quot;; }\n        if (out == GatewayOutcome.FAILED) return &quot;declined&quot;;\n        pending.put(idemKey, new long[] { paise }); forAccount.put(idemKey, accountId);\n        return &quot;pending&quot;;                                                   // nothing credited: the books are clean\n    }\n\n    /**\n     * Ask the gateway again about every unknown charge and finish it. Safe to run as often as you like: the\n     * wallet&#x27;s top-up is idempotent on the same key, so a double reconciliation cannot double-credit.\n     */\n    int reconcile() {\n        int closed = 0;\n        for (String key : new ArrayList&lt;&gt;(pending.keySet())) {\n            GatewayOutcome out = gateway.statusOf(key);\n            if (out == GatewayOutcome.UNKNOWN) continue;                    // still unknown: leave it pending\n            if (out == GatewayOutcome.SUCCESS) wallet.topUp(key, forAccount.get(key), pending.get(key)[0]);\n            pending.remove(key); forAccount.remove(key); closed++;\n        }\n        return closed;\n    }\n    /** How many charges are still unresolved. A dashboard number somebody is paid to watch. */\n    int stillPending() { return pending.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>9 &middot; Show me my balance and my last ten transactions, a thousand times a second.</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No new structure. The balance is a long on the account, read under its lock, so it is one field read. The statement comes off the per-account index the ledger maintains as it appends, so the last ten lines are a sublist and cost ten, not the size of the journal. \"What did transaction T do?\" is a map lookup by id, and the transaction carries the ids of the lines it wrote. Nothing anywhere re-reads the journal to answer a request; the only thing that folds it is <code>reconcile()</code>, which is a job, not a screen. The one honest cost to admit: <code>statement()</code> is synchronised on the ledger, the same monitor the money path takes, and <code>List.copyOf</code> copies the slice before returning it, so a thousand statement reads a second really do contend with payments &mdash; at that volume the statement stops being a read of the write model and becomes its own read model, fed from the journal.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The journal: every movement, append only, never edited. This is the source of truth. An account&#x27;s balance is\n * a cache of the fold over this journal, and reconcile() proves the two agree. post() is synchronized on the\n * ledger and is always called while the account locks are already held, so the order is always\n * accounts then ledger and there is no second lock order to deadlock against.\n */\nclass Ledger {\n    private final List&lt;LedgerEntry&gt; journal = new ArrayList&lt;&gt;();\n    private final Map&lt;String, List&lt;LedgerEntry&gt;&gt; byAccount = new HashMap&lt;&gt;();\n    private final AtomicLong nextId = new AtomicLong(1);\n\n    /** A fresh entry id. An atomic counter, so two threads building postings never collide. */\n    String nextEntryId() { return &quot;E&quot; + nextId.getAndIncrement(); }\n\n    /**\n     * Append one posting. Refuses any posting whose signed legs do not sum to zero, so a bug upstream cannot\n     * create or destroy money. Append first, then index by account: the journal is never missing a line that\n     * the index has.\n     */\n    synchronized void post(List&lt;LedgerEntry&gt; legs) {\n        long sum = 0;\n        for (LedgerEntry e : legs) sum += e.signed();\n        if (sum != 0) throw new IllegalStateException(&quot;posting does not balance: &quot; + sum + &quot; paise&quot;);\n        journal.addAll(legs);\n        for (LedgerEntry e : legs) byAccount.computeIfAbsent(e.accountId(), k -&gt; new ArrayList&lt;&gt;()).add(e);\n    }\n    /** The last n entries for one account, oldest first. O(n) off the per-account index, never a journal scan. */\n    synchronized List&lt;LedgerEntry&gt; statement(String accountId, int n) {\n        List&lt;LedgerEntry&gt; all = byAccount.getOrDefault(accountId, List.of());\n        return List.copyOf(all.subList(Math.max(0, all.size() - n), all.size()));\n    }\n    /** Every entry for one account, oldest first. The per-account index, which the fraud rule also reads. */\n    synchronized List&lt;LedgerEntry&gt; entriesFor(String accountId) {\n        return List.copyOf(byAccount.getOrDefault(accountId, List.of()));\n    }\n    /** Fold every entry for one account: what the balance MUST be if the cache is honest. */\n    synchronized long replay(String accountId) {\n        long sum = 0;\n        for (LedgerEntry e : byAccount.getOrDefault(accountId, List.of())) sum += e.signed();\n        return sum;\n    }\n    /** Every entry ever written, for an audit screen or a reconciliation job. */\n    synchronized List&lt;LedgerEntry&gt; journal() { return List.copyOf(journal); }\n    /** Every account the journal has ever touched. */\n    synchronized Set&lt;String&gt; accountsSeen() { return new TreeSet&lt;&gt;(byAccount.keySet()); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Authorise five hundred at the pump, capture three hundred and eighty.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A hold moves no money: it is a promise, so the only new idea is available() = balance minus holds, and every rule that asks \"can he cover it\" asks available() rather than balance(). The capture releases the hold and then does an ordinary transfer, so the ledger never learns a new shape and the money path is untouched; a release with no capture is just a subtraction. In a system with real books the hold itself becomes a leg into a per-user holds account so the balance sheet still adds up, and the hold grows its own small state machine &mdash; which is move 6's twist, a new step in a life.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: holds -- authorise 500 at the pump, capture 380 when the tank is full\n/**\n * A hold is money that is still in the account but may not be spent. available() = balance - holds, and every\n * rule that asks &quot;can he cover it&quot; asks available(), not balance(). The hold itself moves no money; the capture\n * is an ordinary transfer, so the ledger never learns a new shape.\n */\nclass Holds {\n    private final WalletService wallet;\n    private final Map&lt;String, long[]&gt; byHold = new ConcurrentHashMap&lt;&gt;();   // hold id -&gt; { paise }\n    private final Map&lt;String, String&gt; account = new ConcurrentHashMap&lt;&gt;();  // hold id -&gt; account id\n    private final Map&lt;String, Long&gt; heldOn = new ConcurrentHashMap&lt;&gt;();     // account id -&gt; paise on hold\n\n    Holds(WalletService wallet) { this.wallet = wallet; }\n\n    /** Spendable money: the balance minus everything already promised to somebody else. */\n    long available(String accountId) { return wallet.balanceOf(accountId) - heldOn.getOrDefault(accountId, 0L); }\n\n    /** Promise up to `paise` to a merchant. Refused if the available balance cannot cover it. */\n    void authorise(String holdId, String accountId, long paise) {\n        synchronized (this) {\n            if (available(accountId) &lt; paise) throw new TransferRejected(&quot;hold &quot; + holdId + &quot;: available is &quot; + Money.fmt(available(accountId)));\n            byHold.put(holdId, new long[] { paise }); account.put(holdId, accountId);\n            heldOn.merge(accountId, paise, Long::sum);\n        }\n    }\n    /** Take what was actually used, release the rest, and move the money as an ordinary transfer. */\n    Transaction capture(String holdId, String idemKey, String toId, long paise) {\n        long[] held = byHold.get(holdId);\n        if (held == null) throw new NoSuchElementException(&quot;no such hold: &quot; + holdId);\n        if (paise &gt; held[0]) throw new TransferRejected(&quot;capture &quot; + Money.fmt(paise) + &quot; exceeds the hold &quot; + Money.fmt(held[0]));\n        release(holdId);                                                    // free it first, then spend it\n        return wallet.transfer(idemKey, account.get(holdId), toId, paise, &quot;capture of &quot; + holdId);\n    }\n    /** Give the money back to the available balance. The balance never moved, so nothing is posted. */\n    synchronized void release(String holdId) {\n        long[] held = byHold.remove(holdId);\n        if (held == null) return;\n        heldOn.merge(account.get(holdId), -held[0], Long::sum);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; Ann keeps rupees and Dana keeps dollars. Ann pays Dana.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Never one posting in two currencies: legs in different currencies cannot sum to zero, so <code>Ledger.post</code> would refuse the whole thing, which is the guard doing exactly its job. It is two ordinary postings instead, each balanced inside one currency &mdash; Ann's rupees into the INR house account, Dana's dollars out of the USD house account &mdash; and each leg carries its own key derived from the caller's one key, so a retry is exactly-once on both. The rate is read once, at the moment of the transfer, and written into the memo of both legs, so nobody has to guess a year later what it was that afternoon. The two house accounts are then left holding a position, long rupees and short dollars, which the treasury desk squares in the real market: that is the honest answer to \"who carries the FX risk\". Say the weakness before you are asked &mdash; two postings are two atomic steps, so a crash between them leaves the rupee leg written and the dollar leg not; here the caller retries with the same keys and the second leg completes, while a real system gives the pair its own state machine with a pending leg that a job finishes.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: multi-currency -- the rate is captured at the moment of the transfer, through two FX house accounts\n/** Today&#x27;s rate, handed in. A test hands in a fixed one; production hands in the treasury desk&#x27;s. */\ninterface FxRates {\n    /** Convert minor units from one currency to another, rounded down to the minor unit. */\n    long convert(long minor, Currency from, Currency to);\n}\n\n/**\n * A cross-currency payment as two ordinary postings, each balanced inside ONE currency: the sender&#x27;s rupees go\n * into the INR FX account, and the receiver&#x27;s dollars come out of the USD FX account. The two house accounts\n * hold the position the treasury desk squares later, and each leg keeps its own currency&#x27;s books at zero.\n */\nclass FxTransfer {\n    private final WalletService wallet; private final FxRates rates;\n    FxTransfer(WalletService wallet, FxRates rates) { this.wallet = wallet; this.rates = rates; }\n\n    /** Two legs, two keys derived from the caller&#x27;s one key, so a retry is still exactly-once on both. */\n    List&lt;Transaction&gt; send(String idemKey, String fromId, String toId, long minor) {\n        Account from = wallet.account(fromId), to = wallet.account(toId);\n        long converted = rates.convert(minor, from.currency(), to.currency());\n        String memo = &quot;fx &quot; + from.currency() + &quot;-&gt;&quot; + to.currency() + &quot; &quot; + minor + &quot;/&quot; + converted;\n        Transaction out = wallet.transfer(idemKey + &quot;#out&quot;, fromId, &quot;fx-&quot; + from.currency(), minor, memo);\n        Transaction in = wallet.transfer(idemKey + &quot;#in&quot;, &quot;fx-&quot; + to.currency(), toId, converted, memo);\n        return List.of(out, in);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Marketing wants one per cent cashback on person-to-person payments, live tomorrow.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing in <code>transfer()</code> changes: cashback is one more listener, handed in with <code>addListener</code>. It runs after the locks are released, which is what makes it safe for it to call the wallet again &mdash; a listener that moved money while the account locks were still held would re-enter a <code>ReentrantLock</code> it already owns, which succeeds quietly and stretches the critical section instead of failing loudly. The money comes out of a promo house account, so the books still sum to zero and marketing's spend is a balance anyone can read. The trap is the loop: a cashback payment is itself a completed transaction, so the listener hears its own posting; the guard is the memo check on the first line, and without it the promo account drains one per cent at a time until the rounding stops it. The second trap is already handled &mdash; <code>publish()</code> wraps every listener in a try/catch, so a cashback bug cannot fail a payment that has already been written.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: cashback -- a new listener, zero edits to transfer(). The trap is the loop it can start\n/**\n * One percent back on every person-to-person payment, paid out of a promo house account. It is a listener, so\n * it runs after the locks are released, which is exactly why it may call the wallet again. The guard is the\n * memo: a cashback posting must not trigger another cashback, or the promo account drains one percent at a\n * time until the rounding stops it.\n */\nclass Cashback implements TxnListener {\n    private final WalletService wallet; private final String promoId; private final long basisPoints;\n    Cashback(WalletService wallet, String promoId, long basisPoints) {\n        this.wallet = wallet; this.promoId = promoId; this.basisPoints = basisPoints;\n    }\n    public void onTxn(Transaction t) {\n        if (t.status() != TxnStatus.COMPLETED) return;\n        if (t.memo().startsWith(&quot;cashback&quot;)) return;                        // the guard that stops the loop\n        if (wallet.account(t.fromId()).type() != AccountType.USER\n         || wallet.account(t.toId()).type() != AccountType.USER) return;    // person to person only\n        long back = t.amountPaise() * basisPoints / 10_000;\n        if (back &lt;= 0) return;\n        wallet.transfer(&quot;cb-&quot; + t.id(), promoId, t.fromId(), back, &quot;cashback for &quot; + t.id());\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Persist it. And now there are two servers.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The account's balance becomes a row behind a repository and the wallet's code does not change, only what it was handed. The read-modify-write that a lock protects today becomes a conditional UPDATE that names the version it read: it either changes one row or changes none, and changing none means somebody else got there first, so the caller re-reads and retries. The idempotency map becomes a unique index on the key with INSERT ... ON CONFLICT DO NOTHING, which is the same compare-and-set putIfAbsent does in memory. The journal is the easy part: it is append-only, so it is an INSERT with no contention at all.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- the balance behind a repository, and the conditional UPDATE that replaces the lock\n/**\n * What the account table looks like when the wallet outlives the process. The version column is the lock: an\n * UPDATE that names the version it read either changes one row or changes none, and changing none means\n * somebody else got there first, so the caller re-reads and tries again.\n *\n *   UPDATE account SET balance = ?, version = version + 1 WHERE id = ? AND version = ?\n *   INSERT INTO txn (idem_key, ...) VALUES (?, ...) ON CONFLICT (idem_key) DO NOTHING\n */\ninterface AccountRepository {\n    /** The balance and the version it was read at: { balance, version }. */\n    long[] load(String accountId);\n    /** The conditional UPDATE. Returns false if the row moved under us, which is the signal to retry. */\n    boolean compareAndSetBalance(String accountId, long expectedVersion, long newBalance);\n    /** The idempotency insert. True the first time a key is seen, false every time after. */\n    boolean claimKey(String idemKey);\n}\n\n/** A tiny in-memory stand-in that behaves exactly like the two SQL statements above. */\nclass InMemoryAccountRepository implements AccountRepository {\n    private final Map&lt;String, long[]&gt; rows = new ConcurrentHashMap&lt;&gt;();     // id -&gt; { balance, version }\n    private final Set&lt;String&gt; keys = ConcurrentHashMap.newKeySet();\n    public long[] load(String accountId) { return rows.computeIfAbsent(accountId, k -&gt; new long[] { 0, 0 }).clone(); }\n    public synchronized boolean compareAndSetBalance(String accountId, long expectedVersion, long newBalance) {\n        long[] row = rows.computeIfAbsent(accountId, k -&gt; new long[] { 0, 0 });\n        if (row[1] != expectedVersion) return false;                        // WHERE version = ? matched no row\n        row[0] = newBalance; row[1]++;\n        return true;\n    }\n    public boolean claimKey(String idemKey) { return keys.add(idemKey); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>14 &middot; Rent on the first of every month, and a nightly settlement sweep. The job crashes and re-runs. Prove it does not pay twice.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Neither one is new machinery; both are the idempotency key doing the work, which is the point. A standing instruction pays every period due by now, and its key is the instruction id plus the period number, so a second run &mdash; or a second server running the same job at the same time &mdash; pays each period exactly once and reports zero paid. The nightly settlement sweeps each merchant's balance out to the bank as an ordinary withdrawal, with the day in the key, so re-running the batch settles nothing again. Two things worth saying: a period that was <i>refused</i> keeps that refusal under its key, so retrying it needs an attempt number in the key, and whether to retry at all is a product decision rather than a technical one. And the sweep reads balances without holding anything across accounts, so a merchant paid while the batch is running is simply settled tomorrow &mdash; the journal, not the sweep, is the record.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: standing instructions -- rent on the first of every month, with a key that cannot double-charge\n/**\n * A scheduled payment. The interesting part is not the schedule, it is the key: it contains the period number,\n * so running the job twice, or running it on two servers, pays each period exactly once. That is the same\n * property that makes a retried HTTP request safe.\n */\nclass StandingInstruction {\n    private final String id, fromId, toId; private final long paise, startMs, periodMs;\n    StandingInstruction(String id, String fromId, String toId, long paise, long startMs, long periodMs) {\n        this.id = id; this.fromId = fromId; this.toId = toId; this.paise = paise; this.startMs = startMs; this.periodMs = periodMs;\n    }\n    /**\n     * Pay every period that is due by `nowMs`, and return how many periods this run actually paid. Safe to call\n     * again and again: a period whose key already exists is skipped, so a second run pays nothing. A period that\n     * was refused keeps its refusal; retrying it needs an attempt number in the key, which is a product decision.\n     */\n    int runUpTo(WalletService wallet, long nowMs) {\n        int paid = 0;\n        for (long p = 0; startMs + p * periodMs &lt;= nowMs; p++) {\n            String key = id + &quot;#&quot; + p;\n            if (wallet.byKey(key) != null) continue;                    // this period has already been attempted\n            try { wallet.transfer(key, fromId, toId, paise, id + &quot; period &quot; + p); paid++; }\n            catch (TransferRejected r) { /* refused: the reason is on the transaction under this key */ }\n        }\n        return paid;\n    }\n}\n\n// ---- ext: settlement -- sweep the merchants&#x27; balances out to the bank at the end of the day\n/**\n * At the end of the day every merchant&#x27;s wallet balance leaves for their real bank account. It is an ordinary\n * withdrawal per merchant, so it is auditable and reversible like everything else; the key names the day, so\n * running the batch twice settles once.\n */\nclass Settlement {\n    /** Sweep each merchant to zero. Returns the total moved, in paise. */\n    static long sweep(WalletService wallet, List&lt;String&gt; merchantIds, String dayKey) {\n        long moved = 0;\n        for (String m : merchantIds) {\n            long due = wallet.balanceOf(m);\n            if (due &lt;= 0) continue;\n            wallet.withdraw(&quot;settle-&quot; + dayKey + &quot;-&quot; + m, m, due);\n            moved += due;\n        }\n        return moved;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Where does time come from, and how do you test a daily cap?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The wallet has a Clock it was handed, and it stamps every entry and every transaction with it; nothing else in the system reads the wall clock. That is what makes the cap testable: the test hands in a clock returning a fixed instant, sends up to the cap, checks that the next paise is refused and that nothing moved, then adds a day to the instant and sends again. The same seam is what makes the velocity rule testable, and what makes a standing instruction a pure function of \"now\" rather than something that has to be waited for.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 5. the daily cap, with time handed in: the cap bites, the refusal writes nothing, and tomorrow is a\n        //    fresh day -- which is only testable because the clock is injected\n        WalletService cap = new WalletService(&quot;bank&quot;, &quot;fee&quot;, Currency.INR);\n        long[] now = { 1_700_000_000_000L };\n        cap.setClock(() -&gt; now[0]);\n        cap.configure(List.of(new SameCurrencyRule(), new DailyLimitRule(Money.rupees(&quot;1000.00&quot;))), new NoFee());\n        cap.open(&quot;ann&quot;, AccountType.USER, Currency.INR);\n        cap.open(&quot;ben&quot;, AccountType.USER, Currency.INR);\n        cap.topUp(&quot;t1&quot;, &quot;ann&quot;, Money.rupees(&quot;5000.00&quot;));\n        cap.transfer(&quot;d1&quot;, &quot;ann&quot;, &quot;ben&quot;, Money.rupees(&quot;600.00&quot;), &quot;morning&quot;);\n        cap.transfer(&quot;d2&quot;, &quot;ann&quot;, &quot;ben&quot;, Money.rupees(&quot;400.00&quot;), &quot;noon&quot;);\n        long spent = cap.balanceOf(&quot;ben&quot;);\n        try { cap.transfer(&quot;d3&quot;, &quot;ann&quot;, &quot;ben&quot;, Money.rupees(&quot;0.01&quot;), &quot;one paise over&quot;); check(false, &quot;the cap must bite&quot;); }\n        catch (TransferRejected e) { check(true, &quot;daily cap refused the next paise: &quot; + e.getMessage()); }\n        check(cap.balanceOf(&quot;ben&quot;) == spent, &quot;the capped transfer moved nothing&quot;);\n        now[0] += 86_400_000L;                                                  // tomorrow\n        cap.transfer(&quot;d4&quot;, &quot;ann&quot;, &quot;ben&quot;, Money.rupees(&quot;900.00&quot;), &quot;next day&quot;);\n        check(cap.balanceOf(&quot;ben&quot;) == spent + Money.rupees(&quot;900.00&quot;), &quot;a new day resets the counter&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Which pattern is where, which SOLID letter is where, and where would a Factory or a Builder earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None of them was chosen up front; each is what a move produced, and that is the whole answer. Strategy and Observer are move 3 &mdash; the fee and the rules are the things that change, so each is a one-method interface the wallet is handed, and listeners run after the unlock inside a try/catch so a dead push gateway cannot hold a lock. State is move 6, which is why reversing the same payment twice throws, and the journal is an event log in the small, so any balance is a fold and can be proved. Two absences are worth a sentence: Decorator, because the sum-to-zero invariant already has one gate in <code>Ledger.post</code> and there is nothing to wrap; and Singleton, because the wallet is handed to its callers, which is what lets every failure test build a fresh one. For SOLID, point at a line rather than a letter: <code>configure()</code> and <code>setClock()</code> are D, and they are the reason a test can prove the daily cap resets on Tuesday. Factory earns its name the day rules arrive as strings from a config file, and Builder the day a transfer grows optional fields &mdash; today it has four required arguments, so a builder would be ceremony.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: the rules that change, behind interfaces, handed in, never built by the wallet\ninterface FeePolicy   { long feeFor(long amountPaise, Account from, Account to); }\ninterface TransferRule { void check(Transaction t, Account from, Account to, long nowMs); }\nvoid configure(List&lt;TransferRule&gt; rules, FeePolicy feePolicy) { /* the wallet is GIVEN its policy */ }\n\n// Observer: the wallet announces; it does not know what a phone or a fraud desk is\ninterface TxnListener { void onTxn(Transaction t); }\nprivate void publish(Transaction t) {\n    for (TxnListener l : listeners)                       // after the locks are released, always\n        try { l.onTxn(t); } catch (RuntimeException ex) { /* log */ }\n}\n\n// State: the life is a fixed set of moves, checked before every write\nenum TxnStatus { PENDING, COMPLETED, FAILED, REVERSED }\nif (orig.status() != TxnStatus.COMPLETED) throw new TransferRejected(&quot;...is &quot; + orig.status());\n\n// Event log: the journal is the truth, a balance is the fold of it\nlong replayed = ledger.replay(accountId);                 // == account.balance(), always\n\n// NOT Decorator: the invariant has one gate already, so there is nothing to wrap\nvoid post(List&lt;LedgerEntry&gt; legs) { if (signedSum(legs) != 0) throw new IllegalStateException(...); }\n\n// Factory: not yet. configure() already takes the registry; it earns the name when rules come from config\nList&lt;TransferRule&gt; rules = List.of(new SameCurrencyRule(), new DailyLimitRule(cap));\n\n// Builder: not yet. Four required arguments is a method call; a note, tags and a device id would change that\nwallet.transfer(idemKey, fromId, toId, paise, memo);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/** The currencies the wallet knows. v1 moves money only inside one currency; FX is a follow-up, not a special case. */\nenum Currency { INR, USD }\n\n/** Exact money, in paise. There is no double anywhere in this file; these two helpers are the only boundary. */\nfinal class Money {\n    /** Parse \"1234.50\" into 123450 paise, exactly. Used at the edge (a form, a file), never in the arithmetic. */\n    static long rupees(String amount) { return new java.math.BigDecimal(amount).movePointRight(2).longValueExact(); }\n    /** Print 123450 paise as \"1234.50\". Presentation only. */\n    static String fmt(long paise) {\n        String sign = paise < 0 ? \"-\" : \"\"; long a = Math.abs(paise);\n        return sign + (a / 100) + \".\" + String.format(\"%02d\", a % 100);\n    }\n}\n\n/**\n * What an account is for. The move worth saying out loud: the outside world is modelled as accounts too, so\n * every movement is a two-sided posting. A top-up is money out of BANK_SETTLEMENT; a fee is money into\n * FEE_REVENUE. Nothing appears from nowhere.\n */\nenum AccountType {\n    USER, MERCHANT, BANK_SETTLEMENT, FEE_REVENUE;\n    /** House accounts mirror the world outside the wallet: they may go negative, and policy rules skip them. */\n    boolean house() { return this == BANK_SETTLEMENT || this == FEE_REVENUE; }\n}\n\n/** An account's life. ACTIVE may send and receive; FROZEN may do neither; CLOSED is the end of the line. */\nenum AccountStatus { ACTIVE, FROZEN, CLOSED }\n\n/**\n * A transaction's life. PENDING is claimed but not yet settled; COMPLETED means both legs are in the journal;\n * FAILED means a rule or an invariant refused it and nothing was written; REVERSED means a later, opposite\n * posting undid it. A transaction is never edited, only moved along this list.\n */\nenum TxnStatus { PENDING, COMPLETED, FAILED, REVERSED }\n\n/** CREDIT = money INTO this account. DEBIT = money OUT of it. Every posting's signed legs must sum to zero. */\nenum Direction { DEBIT, CREDIT }\n\n/**\n * One immutable line of the journal: this much money moved in or out of this account, as part of this\n * transaction, at this instant. Entries are appended and never edited; a mistake is corrected by an opposite\n * entry, which is what makes the history auditable.\n */\nrecord LedgerEntry(String entryId, String txnId, String accountId, Direction dir, long paise, long atMs, String memo) {\n    /** The signed effect on the account's balance: a credit adds, a debit subtracts. */\n    long signed() { return dir == Direction.CREDIT ? paise : -paise; }\n    @Override public String toString() { return entryId + \" \" + accountId + \" \" + dir + \" \" + Money.fmt(paise) + \" (\" + txnId + \")\"; }\n}\n\n/** Where time comes from. Injected, so a test can pick the instant and then move it. */\ninterface Clock { long nowMs(); }\n\n/**\n * The journal: every movement, append only, never edited. This is the source of truth. An account's balance is\n * a cache of the fold over this journal, and reconcile() proves the two agree. post() is synchronized on the\n * ledger and is always called while the account locks are already held, so the order is always\n * accounts then ledger and there is no second lock order to deadlock against.\n */\nclass Ledger {\n    private final List<LedgerEntry> journal = new ArrayList<>();\n    private final Map<String, List<LedgerEntry>> byAccount = new HashMap<>();\n    private final AtomicLong nextId = new AtomicLong(1);\n\n    /** A fresh entry id. An atomic counter, so two threads building postings never collide. */\n    String nextEntryId() { return \"E\" + nextId.getAndIncrement(); }\n\n    /**\n     * Append one posting. Refuses any posting whose signed legs do not sum to zero, so a bug upstream cannot\n     * create or destroy money. Append first, then index by account: the journal is never missing a line that\n     * the index has.\n     */\n    synchronized void post(List<LedgerEntry> legs) {\n        long sum = 0;\n        for (LedgerEntry e : legs) sum += e.signed();\n        if (sum != 0) throw new IllegalStateException(\"posting does not balance: \" + sum + \" paise\");\n        journal.addAll(legs);\n        for (LedgerEntry e : legs) byAccount.computeIfAbsent(e.accountId(), k -> new ArrayList<>()).add(e);\n    }\n    /** The last n entries for one account, oldest first. O(n) off the per-account index, never a journal scan. */\n    synchronized List<LedgerEntry> statement(String accountId, int n) {\n        List<LedgerEntry> all = byAccount.getOrDefault(accountId, List.of());\n        return List.copyOf(all.subList(Math.max(0, all.size() - n), all.size()));\n    }\n    /** Every entry for one account, oldest first. The per-account index, which the fraud rule also reads. */\n    synchronized List<LedgerEntry> entriesFor(String accountId) {\n        return List.copyOf(byAccount.getOrDefault(accountId, List.of()));\n    }\n    /** Fold every entry for one account: what the balance MUST be if the cache is honest. */\n    synchronized long replay(String accountId) {\n        long sum = 0;\n        for (LedgerEntry e : byAccount.getOrDefault(accountId, List.of())) sum += e.signed();\n        return sum;\n    }\n    /** Every entry ever written, for an audit screen or a reconciliation job. */\n    synchronized List<LedgerEntry> journal() { return List.copyOf(journal); }\n    /** Every account the journal has ever touched. */\n    synchronized Set<String> accountsSeen() { return new TreeSet<>(byAccount.keySet()); }\n}\n\n/**\n * Where money sits. The account owns its balance, its status, its spend-so-far-today and its OWN lock: Alice\n * paying Bob must not block Carol paying Dan. It holds state and does arithmetic; it decides no policy.\n */\nclass Account {\n    private final String id;\n    private final AccountType type;\n    private final Currency currency;\n    private final ReentrantLock lock = new ReentrantLock();\n    private long balancePaise;                 // guarded by lock: a cache of the ledger fold\n    private AccountStatus status = AccountStatus.ACTIVE;   // guarded by lock\n    private long spentTodayPaise;              // guarded by lock\n    private long dayNumber = Long.MIN_VALUE;   // guarded by lock\n\n    Account(String id, AccountType type, Currency currency) { this.id = id; this.type = type; this.currency = currency; }\n    String id() { return id; }\n    AccountType type() { return type; }\n    Currency currency() { return currency; }\n    /** The lock the service takes. Exposed because the SERVICE decides the order: every account, sorted by id. */\n    ReentrantLock lock() { return lock; }\n\n    /** True if this account can fund `paise`. House accounts mirror the outside world, so they may go negative. */\n    boolean canCover(long paise) { return type.house() || balancePaise >= paise; }\n    /** Move the cached balance. Called only with this lock held, and only after the journal append succeeded. */\n    void applyDelta(long delta) { balancePaise += delta; }\n    /** Overwrite the cached balance with a number the journal produced. Only rebuildFromJournal() calls this. */\n    void resetBalance(long fromJournal) { lock.lock(); try { balancePaise = fromJournal; } finally { lock.unlock(); } }\n    /** The balance while the caller already holds this lock. */\n    long balanceHeld() { return balancePaise; }\n    /** The balance, taken under the lock so nobody reads it half-written. O(1). */\n    long balance() { lock.lock(); try { return balancePaise; } finally { lock.unlock(); } }\n    /** The status while the caller already holds this lock. */\n    AccountStatus statusHeld() { return status; }\n    /** The status, taken under the lock. */\n    AccountStatus status() { lock.lock(); try { return status; } finally { lock.unlock(); } }\n    /** Freeze, unfreeze or close. Closing an account with money in it is refused; the money must leave first. */\n    void setStatus(AccountStatus s) {\n        lock.lock();\n        try {\n            if (s == AccountStatus.CLOSED && balancePaise != 0)\n                throw new IllegalStateException(id + \" still holds \" + Money.fmt(balancePaise));\n            if (status == AccountStatus.CLOSED) throw new IllegalStateException(id + \" is closed\");\n            status = s;\n        } finally { lock.unlock(); }\n    }\n    /** Paise sent today, with the day taken from the injected clock. Caller holds the lock. */\n    long spentToday(long nowMs) { return dayOf(nowMs) == dayNumber ? spentTodayPaise : 0; }\n    /** Count a completed spend against today. Caller holds the lock; a new day resets the counter. */\n    void addSpent(long paise, long nowMs) {\n        long d = dayOf(nowMs);\n        if (d != dayNumber) { dayNumber = d; spentTodayPaise = 0; }\n        spentTodayPaise += paise;\n    }\n    private static long dayOf(long ms) { return Math.floorDiv(ms, 86_400_000L); }\n    @Override public String toString() { return id + \"[\" + Money.fmt(balance()) + \"]\"; }\n}\n\n/** A transfer was refused. The reason is stored on the transaction, so a retry of the key replays the same answer. */\nclass TransferRejected extends RuntimeException {\n    TransferRejected(String reason) { super(reason); }\n}\n\n/**\n * One request to move money, and the record of what happened to it. The idempotency key is the caller's; the\n * transaction id is ours. Status and the entry ids are written once, under the account locks, and read by\n * anyone, so they are volatile.\n */\nclass Transaction {\n    private final String id, idemKey, fromId, toId, memo;\n    private final long amountPaise, feePaise, createdMs;\n    private volatile TxnStatus status = TxnStatus.PENDING;\n    private volatile String failureReason = \"\";\n    private volatile List<String> entryIds = List.of();\n    private volatile String reversedBy = \"\";\n\n    Transaction(String id, String idemKey, String fromId, String toId, long amountPaise, long feePaise, long createdMs, String memo) {\n        this.id = id; this.idemKey = idemKey; this.fromId = fromId; this.toId = toId;\n        this.amountPaise = amountPaise; this.feePaise = feePaise; this.createdMs = createdMs; this.memo = memo;\n    }\n    String id() { return id; }\n    String idemKey() { return idemKey; }\n    String fromId() { return fromId; }\n    String toId() { return toId; }\n    String memo() { return memo; }\n    long amountPaise() { return amountPaise; }\n    long feePaise() { return feePaise; }\n    long createdMs() { return createdMs; }\n    TxnStatus status() { return status; }\n    String failureReason() { return failureReason; }\n    /** The journal lines this transaction wrote. Empty until it completes; proof of what it did afterwards. */\n    List<String> entryIds() { return entryIds; }\n    String reversedBy() { return reversedBy; }\n    /** Mark it settled and remember its journal lines. Called under the locks, after the append succeeded. */\n    void complete(List<String> ids) { this.entryIds = List.copyOf(ids); this.status = TxnStatus.COMPLETED; }\n    /** Mark it refused. Nothing was written, and this reason is what a retry of the same key is told. */\n    void fail(String reason) { this.failureReason = reason; this.status = TxnStatus.FAILED; }\n    /** Mark it undone by a later, opposite posting. The original entries are never touched. */\n    void markReversed(String byTxnId) { this.reversedBy = byTxnId; this.status = TxnStatus.REVERSED; }\n    @Override public String toString() {\n        return id + \" \" + fromId + \"->\" + toId + \" \" + Money.fmt(amountPaise)\n             + (feePaise > 0 ? \" +fee \" + Money.fmt(feePaise) : \"\") + \" \" + status\n             + (failureReason.isEmpty() ? \"\" : \" (\" + failureReason + \")\");\n    }\n}\n\n// \"they will change the fee on a Friday afternoon\" -> pricing goes behind an interface -> Strategy\n/**\n * What this transfer costs the sender. One method, because pricing is the rule most likely to change mid-round.\n * The service never builds a policy; it is handed one.\n */\ninterface FeePolicy {\n    /** The fee in paise, on top of the amount. Zero means free. */\n    long feeFor(long amountPaise, Account from, Account to);\n}\n\n/** Free. The default for person-to-person money, which is how wallets get used in the first place. */\nclass NoFee implements FeePolicy {\n    public long feeFor(long amountPaise, Account from, Account to) { return 0; }\n}\n\n/** A flat fee on merchant payments only; person-to-person stays free, and the house never charges itself. */\nclass MerchantFlatFee implements FeePolicy {\n    private final long feePaise;\n    MerchantFlatFee(long feePaise) { this.feePaise = feePaise; }\n    public long feeFor(long amountPaise, Account from, Account to) {\n        if (from.type().house()) return 0;                     // a top-up or a settlement is not a merchant payment\n        return to.type() == AccountType.MERCHANT ? feePaise : 0;\n    }\n}\n\n/**\n * One policy check on a transfer. It runs under the account locks, before anything is written, and it may READ\n * state but must never write any. A rule refuses by throwing TransferRejected. An invariant (is the sender\n * active, does he have the money) is not a rule: invariants are not negotiable, rules are.\n */\ninterface TransferRule {\n    /** Throw TransferRejected to refuse. Called with every account of the posting already locked. */\n    void check(Transaction t, Account from, Account to, long nowMs);\n}\n\n/** Both sides must be in the same currency. FX is a follow-up that replaces this rule, not a patch inside it. */\nclass SameCurrencyRule implements TransferRule {\n    public void check(Transaction t, Account from, Account to, long nowMs) {\n        if (from.currency() != to.currency())\n            throw new TransferRejected(\"currency mismatch: \" + from.currency() + \" -> \" + to.currency());\n    }\n}\n\n/** A cap on what one account may send in a calendar day. The day comes from the injected clock, so it is testable. */\nclass DailyLimitRule implements TransferRule {\n    private final long capPaise;\n    DailyLimitRule(long capPaise) { this.capPaise = capPaise; }\n    public void check(Transaction t, Account from, Account to, long nowMs) {\n        if (from.type().house()) return;                       // policy applies to people, not to the house\n        long after = from.spentToday(nowMs) + t.amountPaise() + t.feePaise();\n        if (after > capPaise)\n            throw new TransferRejected(\"daily limit: \" + Money.fmt(from.spentToday(nowMs)) + \" already sent today, cap is \" + Money.fmt(capPaise));\n    }\n}\n\n/**\n * The fraud check, in its simplest honest form: too many debits from one account inside a short window is\n * refused. It reads the ledger's per-account index, so it costs nothing extra to keep.\n */\nclass VelocityRule implements TransferRule {\n    private final Ledger ledger; private final int maxDebits; private final long windowMs;\n    VelocityRule(Ledger ledger, int maxDebits, long windowMs) { this.ledger = ledger; this.maxDebits = maxDebits; this.windowMs = windowMs; }\n    public void check(Transaction t, Account from, Account to, long nowMs) {\n        if (from.type().house()) return;\n        int recent = 0;\n        List<LedgerEntry> mine = ledger.entriesFor(from.id());\n        for (int i = mine.size() - 1; i >= 0; i--) {\n            LedgerEntry e = mine.get(i);\n            if (nowMs - e.atMs() > windowMs) break;            // the index is in time order: stop at the window\n            if (e.dir() == Direction.DEBIT) recent++;\n        }\n        if (recent >= maxDebits)\n            throw new TransferRejected(\"velocity: \" + recent + \" debits in the last \" + (windowMs / 1000) + \"s\");\n    }\n}\n\n/** Someone who wants to know a transaction landed or was refused. Called AFTER the locks, never inside them. */\ninterface TxnListener {\n    /** Told about every transaction, completed, failed or reversed. Must not throw; if it does, it is swallowed. */\n    void onTxn(Transaction t);\n}\n\n/** A receipt on the user's phone. Stands in for a push notification, an SMS, an email. */\nclass ReceiptPrinter implements TxnListener {\n    public void onTxn(Transaction t) { System.out.println(\"  [receipt] \" + t); }\n}\n\n/** The fraud desk: it only cares about refusals, and it counts them. */\nclass FraudMonitor implements TxnListener {\n    private final AtomicInteger refusals = new AtomicInteger();\n    public void onTxn(Transaction t) { if (t.status() == TxnStatus.FAILED) refusals.incrementAndGet(); }\n    /** How many refusals this monitor has seen. */\n    int refusals() { return refusals.get(); }\n}\n\n/**\n * The wallet: it owns the accounts, the journal and the idempotency map, and it orchestrates one movement of\n * money. It holds NO lock of its own \u2014 the locks live on the accounts \u2014 and it decides no policy: the fee\n * policy, the rules, the listeners and the clock are all handed in.\n *\n * The order at a transfer is the design, and it is this: validate the arguments; claim the idempotency key with\n * one putIfAbsent, which is the compare-and-set that makes a retry safe; compute the fee; lock every account the\n * posting touches IN ID ORDER, so A-pays-B and B-pays-A cannot deadlock; check statuses, rules and balance with\n * nothing written yet; append both legs to the journal, which is the irreversible write; only then move the\n * cached balances and mark the transaction COMPLETED; unlock; tell the listeners.\n */\nclass WalletService {\n    private final Map<String, Account> accounts = new ConcurrentHashMap<>();\n    private final Map<String, Transaction> byKey = new ConcurrentHashMap<>();   // idempotency key -> the one attempt\n    private final Map<String, Transaction> byId = new ConcurrentHashMap<>();\n    private final Ledger ledger = new Ledger();\n    private final AtomicLong nextTxn = new AtomicLong(1);\n    private final List<TxnListener> listeners = new CopyOnWriteArrayList<>();\n    private volatile List<TransferRule> rules = List.of();\n    private volatile FeePolicy feePolicy = new NoFee();\n    private volatile Clock clock = System::currentTimeMillis;\n    private final String bankId, feeId;\n\n    /**\n     * Build a wallet with its two house accounts: the bank settlement account money enters and leaves through,\n     * and the revenue account fees land in. They exist from the first line so no movement is ever one-sided.\n     */\n    WalletService(String bankId, String feeId, Currency currency) {\n        this.bankId = bankId; this.feeId = feeId;\n        accounts.put(bankId, new Account(bankId, AccountType.BANK_SETTLEMENT, currency));\n        accounts.put(feeId, new Account(feeId, AccountType.FEE_REVENUE, currency));\n    }\n\n    /** Hand in the policy. The wallet never builds a rule or a fee policy, which is why a test can hand in a broken one. */\n    void configure(List<TransferRule> rules, FeePolicy feePolicy) {\n        this.rules = List.copyOf(rules); this.feePolicy = feePolicy;\n    }\n    /** Tests hand in a fixed clock, so \"today\" and \"the last sixty seconds\" are whatever the test says. */\n    void setClock(Clock c) { clock = c; }\n    /** Subscribe a listener. Setup only; listeners are called after the locks are released. */\n    void addListener(TxnListener l) { listeners.add(l); }\n    /** The journal, for an audit screen or a reconciliation job. */\n    Ledger ledger() { return ledger; }\n\n    /** Open an account. O(1). The id is what every journal entry stores, so a rename can never move money. */\n    Account open(String id, AccountType type, Currency currency) {\n        Account a = new Account(id, type, currency);\n        if (accounts.putIfAbsent(id, a) != null) throw new IllegalStateException(\"account exists: \" + id);\n        return a;\n    }\n    /** The account, or an error. O(1). */\n    Account account(String id) {\n        Account a = accounts.get(id);\n        if (a == null) throw new NoSuchElementException(\"no such account: \" + id);\n        return a;\n    }\n    /** What this account holds right now. O(1): the cached balance, not a fold of the journal. */\n    long balanceOf(String id) { return account(id).balance(); }\n    /** The last n journal lines for this account. O(n) off the per-account index. */\n    List<LedgerEntry> statement(String id, int n) { return ledger.statement(id, n); }\n    /** One transaction by our id, for a support screen. O(1). */\n    Transaction txn(String id) {\n        Transaction t = byId.get(id);\n        if (t == null) throw new NoSuchElementException(\"no such transaction: \" + id);\n        return t;\n    }\n    /** The one attempt behind an idempotency key, if there is one. */\n    Transaction byKey(String idemKey) { return byKey.get(idemKey); }\n\n    /**\n     * Move money from one account to another. Idempotent by key: the same key always yields the same outcome,\n     * whether that outcome was a completed transfer or a refusal. Throws TransferRejected if a rule or an\n     * invariant refuses, and in that case nothing at all was written.\n     */\n    Transaction transfer(String idemKey, String fromId, String toId, long paise, String memo) {\n        if (paise <= 0) throw new IllegalArgumentException(\"amount must be positive: \" + paise);\n        if (fromId.equals(toId)) throw new IllegalArgumentException(\"cannot transfer to the same account\");\n        Transaction seen = byKey.get(idemKey);                        // fast path: an obvious retry, no id burned\n        if (seen != null) return replay(seen);\n        Account from = account(fromId), to = account(toId);\n        long fee = feePolicy.feeFor(paise, from, to);                 // pure, outside every lock\n        long now = clock.nowMs();\n\n        Transaction fresh = new Transaction(\"T\" + nextTxn.getAndIncrement(), idemKey, fromId, toId, paise, fee, now, memo);\n        Transaction prior = byKey.putIfAbsent(idemKey, fresh);        // THE compare-and-set: one key, one attempt\n        if (prior != null) return replay(prior);\n        byId.put(fresh.id(), fresh);\n\n        Account feeAcct = fee > 0 ? account(feeId) : null;\n        List<Account> locked = sorted(from, to, feeAcct);             // sorted by id: the deadlock is designed out\n        boolean ok = false;\n        lockAll(locked);\n        try {\n            requireUsable(from, \"sender\"); requireUsable(to, \"receiver\");\n            for (TransferRule r : rules) r.check(fresh, from, to, now);\n            if (!from.canCover(paise + fee))\n                throw new TransferRejected(\"insufficient balance: \" + Money.fmt(from.balanceHeld()) + \" < \" + Money.fmt(paise + fee));\n\n            List<LedgerEntry> legs = new ArrayList<>(3);\n            legs.add(new LedgerEntry(ledger.nextEntryId(), fresh.id(), fromId, Direction.DEBIT, paise + fee, now, memo));\n            legs.add(new LedgerEntry(ledger.nextEntryId(), fresh.id(), toId, Direction.CREDIT, paise, now, memo));\n            if (fee > 0) legs.add(new LedgerEntry(ledger.nextEntryId(), fresh.id(), feeId, Direction.CREDIT, fee, now, \"fee \" + memo));\n            ledger.post(legs);                                        // the irreversible write happens FIRST\n            from.applyDelta(-(paise + fee));                          // from here nothing can throw\n            to.applyDelta(paise);\n            if (feeAcct != null) feeAcct.applyDelta(fee);\n            from.addSpent(paise + fee, now);\n            fresh.complete(legs.stream().map(LedgerEntry::entryId).toList());\n            ok = true;\n        } catch (TransferRejected r) {\n            fresh.fail(r.getMessage());                               // nothing was written: the journal is untouched\n        } finally { unlockAll(locked); }\n\n        publish(fresh);                                               // after the locks: a slow phone stalls nobody\n        if (!ok) throw new TransferRejected(fresh.failureReason());\n        return fresh;\n    }\n\n    /**\n     * Money in from the outside world: the bank settlement account pays the user. Not a new verb \u2014 the same\n     * posting, the same locks, the same idempotency \u2014 which is why a top-up can be reversed like anything else.\n     */\n    Transaction topUp(String idemKey, String toId, long paise) {\n        return transfer(idemKey, bankId, toId, paise, \"top-up\");\n    }\n    /** Money out to the outside world: the user pays the bank settlement account. The mirror of a top-up. */\n    Transaction withdraw(String idemKey, String fromId, long paise) {\n        return transfer(idemKey, fromId, bankId, paise, \"withdrawal\");\n    }\n\n    /**\n     * Undo a completed transaction by writing the OPPOSITE posting. No entry is ever edited and no balance is\n     * ever set by hand: the reversal is an ordinary movement that happens to point the other way, so the audit\n     * trail shows both the mistake and the correction. Idempotent by key, like every other write.\n     */\n    Transaction reverse(String idemKey, String txnId) {\n        Transaction orig = txn(txnId);\n        long now = clock.nowMs();\n        Transaction fresh = new Transaction(\"T\" + nextTxn.getAndIncrement(), idemKey, orig.toId(), orig.fromId(),\n                                            orig.amountPaise(), orig.feePaise(), now, \"reversal of \" + orig.id());\n        Transaction prior = byKey.putIfAbsent(idemKey, fresh);\n        if (prior != null) return replay(prior);\n        byId.put(fresh.id(), fresh);\n\n        Account from = account(orig.fromId()), to = account(orig.toId());\n        Account feeAcct = orig.feePaise() > 0 ? account(feeId) : null;\n        List<Account> locked = sorted(from, to, feeAcct);\n        boolean ok = false;\n        lockAll(locked);\n        try {\n            if (orig.status() != TxnStatus.COMPLETED)\n                throw new TransferRejected(\"only a COMPLETED transaction can be reversed; \" + orig.id() + \" is \" + orig.status());\n            if (!to.canCover(orig.amountPaise()))                     // the receiver may have spent it already\n                throw new TransferRejected(\"cannot reverse: \" + to.id() + \" holds \" + Money.fmt(to.balanceHeld()));\n            long fee = orig.feePaise();\n            List<LedgerEntry> legs = new ArrayList<>(3);\n            legs.add(new LedgerEntry(ledger.nextEntryId(), fresh.id(), to.id(), Direction.DEBIT, orig.amountPaise(), now, \"reversal\"));\n            legs.add(new LedgerEntry(ledger.nextEntryId(), fresh.id(), from.id(), Direction.CREDIT, orig.amountPaise() + fee, now, \"reversal\"));\n            if (fee > 0) legs.add(new LedgerEntry(ledger.nextEntryId(), fresh.id(), feeId, Direction.DEBIT, fee, now, \"fee refund\"));\n            ledger.post(legs);\n            to.applyDelta(-orig.amountPaise());\n            from.applyDelta(orig.amountPaise() + fee);\n            if (feeAcct != null) feeAcct.applyDelta(-fee);\n            fresh.complete(legs.stream().map(LedgerEntry::entryId).toList());\n            orig.markReversed(fresh.id());\n            ok = true;\n        } catch (TransferRejected r) {\n            fresh.fail(r.getMessage());\n        } finally { unlockAll(locked); }\n\n        publish(fresh);\n        if (!ok) throw new TransferRejected(fresh.failureReason());\n        return fresh;\n    }\n\n    /**\n     * The check that makes the cached balances trustworthy: fold the journal for every account and compare it\n     * with the number we serve. It also adds every balance up, which must be exactly zero, because every paise\n     * in someone's wallet is a paise out of the bank settlement account. It is a JOB, not a request: it takes\n     * each account's lock one at a time, so on a wallet taking payments it can read account A after a transfer\n     * and account B before the same one and report a difference that is not real. Run it when the wallet is\n     * quiet, or fold only the entries up to a fixed journal position and compare against balances read at that\n     * same point.\n     */\n    boolean reconcile() {\n        long total = 0;\n        for (String id : ledger.accountsSeen()) {\n            long cached = account(id).balance(), replayed = ledger.replay(id);\n            if (cached != replayed) {\n                System.out.println(\"  [reconcile] \" + id + \" cached \" + Money.fmt(cached) + \" journal \" + Money.fmt(replayed));\n                return false;\n            }\n            total += cached;\n        }\n        return total == 0;\n    }\n\n    /**\n     * Repair: re-derive every cached balance by folding the journal again, and return how many accounts were\n     * actually wrong. This is what makes \"the journal is the source of truth\" more than a slogan \u2014 a crash\n     * between the append and the balance write, or any drift reconcile() finds, is fixed from the entries\n     * themselves. The one thing it cannot rebuild is the daily spend counter, because \"sent today\" is not in\n     * the journal; a real system re-derives it from today's DEBIT entries or keeps it in the same store.\n     */\n    int rebuildFromJournal() {\n        int repaired = 0;\n        for (String id : ledger.accountsSeen()) {\n            Account a = account(id);\n            long replayed = ledger.replay(id);\n            if (a.balance() != replayed) { a.resetBalance(replayed); repaired++; }\n        }\n        return repaired;\n    }\n\n    /** Sorting by id is the whole deadlock story: every thread takes the same locks in the same order. */\n    private static List<Account> sorted(Account... maybe) {\n        List<Account> out = new ArrayList<>(3);\n        for (Account a : maybe) if (a != null && !out.contains(a)) out.add(a);\n        out.sort(Comparator.comparing(Account::id));\n        return out;\n    }\n    private static void lockAll(List<Account> as) { for (Account a : as) a.lock().lock(); }\n    private static void unlockAll(List<Account> as) { for (int i = as.size() - 1; i >= 0; i--) as.get(i).lock().unlock(); }\n    private static void requireUsable(Account a, String side) {\n        if (a.statusHeld() != AccountStatus.ACTIVE) throw new TransferRejected(side + \" \" + a.id() + \" is \" + a.statusHeld());\n    }\n    /**\n     * The same key, the same answer: a completed transfer comes back, a refusal is refused again for the same\n     * reason. If the first attempt is still inside the locks, the duplicate gets that transaction while it is\n     * still PENDING \u2014 which is the honest answer to a retry that arrives mid-flight. The caller must read the\n     * status: PENDING means \"in progress, ask again\", it does not mean \"paid\".\n     */\n    private Transaction replay(Transaction t) {\n        if (t.status() == TxnStatus.FAILED) throw new TransferRejected(t.failureReason());\n        return t;\n    }\n    /** Tell every listener, outside the locks, and survive one that throws. */\n    private void publish(Transaction t) {\n        for (TxnListener l : listeners) {\n            try { l.onTxn(t); } catch (RuntimeException ex) { System.err.println(\"[listener failed] \" + ex.getMessage()); }\n        }\n    }\n}\n\n/**\n * Proof it works: a top-up, a person-to-person transfer, a merchant payment with a fee, a retried request, a\n * refusal that writes nothing, a reversal, a statement, a reconciliation \u2014 and then fifty threads paying in\n * both directions at once, with the total conserved and no deadlock.\n */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        WalletService wallet = new WalletService(\"bank\", \"fee\", Currency.INR);\n        wallet.configure(List.of(new SameCurrencyRule(),\n                                 new DailyLimitRule(Money.rupees(\"100000.00\")),\n                                 ne ed e) { System.out.println(\"expected: \" + e.getMessage()); }\n        try {                                                            // the same key again: the same answer\n            wallet.transfer(\"k-3\", \"bob\", \"alice\", Money.rupees(\"9000.00\"), \"too much\");\n        } catch (TransferRejected e) { System.out.println(\"retry of k-3, same reason: \" + e.getMessage()); }\n        System.out.println(\"bob unchanged: \" + (wallet.balanceOf(\"bob\") == before));\n\n        // a frozen account can neither send nor receive\n        wallet.account(\"bob\").setStatus(AccountStatus.FROZEN);\n        try { wallet.transfer(\"k-4\", \"alice\", \"bob\", Money.rupees(\"10.00\"), \"blocked\"); }\n        catch (TransferRejected e) { System.out.println(\"expected: \" + e.getMessage()); }\n        wallet.account(\"bob\").setStatus(AccountStatus.ACTIVE);\n\n        // the chai was never served: reverse it. Opposite entries, nothing edited\n        wallet.reverse(\"rev-1\", chai.id());\n        System.out.println(\"after the reversal alice \" + Money.fmt(wallet.balanceOf(\"alice\"))\n            + \", chai-point \" + Money.fmt(wallet.balanceOf(\"chai-point\"))\n            + \", fee \" + Money.fmt(wallet.balanceOf(\"fee\")) + \", original is \" + wallet.txn(chai.id()).status());\n\n        System.out.println(\"alice's statement:\");\n        for (LedgerEntry e : wallet.statement(\"alice\", 10)) System.out.println(\"  \" + e);\n        System.out.println(\"reconciles (cached balances == journal fold, and everything sums to zero): \" + wallet.reconcile());\n        System.out.println(\"refusals seen by the fraud desk: \" + fraud.refusals());\n\n        // fifty threads, both directions at once: the classic deadlock, designed out by locking in id order\n        WalletService busy = new WalletService(\"bank\", \"fee\", Currency.INR);\n        busy.configure(List.of(new SameCurrencyRule()), new NoFee());\n        busy.open(\"x\", AccountType.USER, Currency.INR);\n        busy.open(\"y\", AccountType.USER, Currency.INR);\n        busy.topUp(\"f-x\", \"x\", Money.rupees(\"500.00\"));\n        busy.topUp(\"f-y\", \"y\", Money.rupees(\"500.00\"));\n        long start = busy.balanceOf(\"x\") + busy.balanceOf(\"y\");\n\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<?>> sent = new ArrayList<>();\n        for (int i = 0; i < 50; i++) {\n            final int n = i;\n            sent.add(pool.submit(() -> {\n                go.await();\n                String from = n % 2 == 0 ? \"x\" : \"y\", to = n % 2 == 0 ? \"y\" : \"x\";\n                try { busy.transfer(\"r-\" + n, from, to, Money.rupees(\"1.00\"), \"round \" + n); return 1; }\n                catch (TransferRejected r) { return 0; }\n            }));\n        }\n        go.countDown();\n        int done = 0;\n        for (Future<?> f : sent) done += (Integer) f.get();\n        pool.shutdown();\n        long end = busy.balanceOf(\"x\") + busy.balanceOf(\"y\");\n        System.out.println(\"50 two-way transfers: settled=\" + done + \" total before=\" + Money.fmt(start)\n            + \" after=\" + Money.fmt(end) + \" (must match), reconciles=\" + busy.reconcile());\n        if (start != end || !busy.reconcile()) throw new AssertionError(\"money was created or destroyed\");\n    }\n}\n", "f1": "import java.util.*;\nimport java.util.concurrent.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: the mid-round pricing change -- \"from today, 0.5% on transfers over 10,000, capped at 100\"\n/**\n * The whole rule change is one new class. Nothing in WalletService, Ledger, Account or Transaction moves,\n * because pricing went behind FeePolicy in move 3. A threshold, a percentage and a cap, in integer paise.\n */\nclass CappedPercentFee implements FeePolicy {\n    private final long thresholdPaise, capPaise; private final long basisPoints;\n    CappedPercentFee(long thresholdPaise, long basisPoints, long capPaise) {\n        this.thresholdPaise = thresholdPaise; this.basisPoints = basisPoints; this.capPaise = capPaise;\n    }\n    public long feeFor(long amountPaise, Account from, Account to) {\n        if (from.type().house()) return 0;                         // the house does not charge itself\n        if (amountPaise <= thresholdPaise) return 0;\n        long fee = amountPaise * basisPoints / 10_000;             // 50 bp = 0.5%, integer arithmetic throughout\n        return Math.min(fee, capPaise);\n    }\n}\n\n// ---- ext: top-up through a payment gateway -- the UNKNOWN outcome, and the reconciliation job that closes it\n/** What the card network said. UNKNOWN is the one that matters: the money may or may not have left the bank. */\nenum GatewayOutcome { SUCCESS, FAILED, UNKNOWN }\n\n/** The outside world's money. charge() is the irreversible action; statusOf() is how we ask again later. */\ninterface PaymentGateway {\n    /** Charge the card. Idempotent on the same key at the gateway's end too, which is why we pass ours through. */\n    GatewayOutcome charge(String idemKey, String card, long paise);\n    /** What happened to that charge, asked again after a timeout. */\n    GatewayOutcome statusOf(String idemKey);\n}\n\n/**\n * Top-up done in the only safe order: charge the card FIRST, and credit the wallet only once the charge is\n * known to have succeeded. If the gateway times out we credit nothing and remember the key; a reconciliation\n * job asks the gateway again and finishes the job. Crediting first and charging after is how wallets give away\n * money.\n */\nclass GatewayTopUp {\n    private final WalletService wallet; private final PaymentGateway gateway;\n    private final Map<String, long[]> pending = new LinkedHashMap<>();      // key -> { paise }\n    private final Map<String, String> forAccount = new LinkedHashMap<>();   // key -> account id\n\n    GatewayTopUp(WalletService wallet, PaymentGateway gateway) { this.wallet = wallet; this.gateway = gateway; }\n\n    /** \"credited\", \"declined\" or \"pending\": the third one is a real answer, not a failure to answer. */\n    String topUp(String idemKey, String accountId, String card, long paise) {\n        GatewayOutcome out = gateway.charge(idemKey, card, paise);\n        if (out == GatewayOutcome.SUCCESS) { wallet.topUp(idemKey, accountId, paise); return \"credited\"; }\n        if (out == GatewayOutcome.FAILED) return \"declined\";\n        pending.put(idemKey, new long[] { paise }); forAccount.put(idemKey, accountId);\n        return \"pending\";                                                   // nothing credited: the books are clean\n    }\n\n    /**\n     * Ask the gateway again about every unknown charge and finish it. Safe to run as often as you like: the\n     * wallet's top-up is idempotent on the same key, so a double reconciliation cannot double-credit.\n     */\n    int reconcile() {\n        int closed = 0;\n        for (String key : new ArrayList<>(pending.keySet())) {\n            GatewayOutcome out = gateway.statusOf(key);\n            if (out == GatewayOutcome.UNKNOWN) continue;                    // still unknown: leave it pending\n            if (out == GatewayOutcome.SUCCESS) wallet.topUp(key, forAccount.get(key), pending.get(key)[0]);\n            pending.remove(key); forAccount.remove(key); closed++;\n        }\n        return closed;\n    }\n    /** How many charges are still unresolved. A dashboard number somebody is paid to watch. */\n    int stillPending() { return pending.size(); }\n}\n\n// ---- ext: multi-currency -- the rate is captured at the moment of the transfer, through two FX house accounts\n/** Today's rate, handed in. A test hands in a fixed one; production hands in the treasury desk's. */\ninterface FxRates {\n    /** Convert minor units from one currency to another,

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"There are threads that represent hydrogen atoms and threads that represent oxygen atoms. Each one calls <code>hydrogen()</code> or <code>oxygen()</code> and hands you a release function. No thread may run its release until a full molecule &mdash; two hydrogen and one oxygen &mdash; has gathered, and then all three go together. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>Two kinds of thread walk up to the same object, and the only rule is that nobody leaves alone: a group of exactly two hydrogen and one oxygen leaves together, and the next group cannot start until this one has gone. So the thing you are writing is not a water molecule; it is a turnstile that holds atoms back until a complete set has gathered, then lets exactly that set through. Atoms arrive in any order and any number &mdash; five hydrogen and no oxygen is a perfectly normal Tuesday &mdash; and the surplus simply waits. Nobody may sit in a loop asking \"is it my turn yet\", because that burns a whole CPU to wait, so a thread that cannot bond goes to sleep and somebody has to wake it at the right moment. The one thing that must always be true: read the released atoms in order and every window of three is exactly two H and one O &mdash; never H,H,H, never H,O,O, and never three atoms borrowed from two different molecules.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: a class that compiles and a <code>main</code> that starts a crowd of threads and proves the grouping. The interviewer is watching for, in this order: the questions you ask before typing (is it always 2:1, and are the callbacks allowed to block, are the first two); which types exist and who owns which state; one atom's path end to end, including the sleeping; the race you are actually defending against, said out loud &mdash; a barrier of three trips on three hydrogens; whether the waits are <code>while</code> loops and not <code>if</code>s; what is inside the lock and for how long; what happens to a blocked thread that is interrupted. Then the twists: any molecule, not just water; timeouts; shutdown; do it with semaphores; do it without <code>java.util.concurrent</code>; make it fair.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"51\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--acc)\">hydrogen()</text><g transform=\"translate(150 20)\"><rect width=\"190\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a hydrogen thread arrives</text><text x=\"95.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">any thread, at any time</text></g><path d=\"M340 47 H362\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(362 20)\"><rect width=\"190\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take the lock</text><text x=\"95.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">interruptibly</text></g><path d=\"M552 47 H574\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(574 20)\"><rect width=\"190\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a free hydrogen seat?</text><text x=\"95.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two seats, never three</text></g><path d=\"M764 47 H786\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(786 20)\"><rect width=\"190\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">sit down: is it full now?</text><text x=\"95.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the last atom wakes the others</text></g><path d=\"M976 47 H998\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(998 20)\"><rect width=\"190\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">emit OUTSIDE the lock</text><text x=\"95.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">then count the emit</text></g><path d=\"M660 74 V104\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(500 104)\"><rect width=\"430\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"215.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">no seat, or not full yet: park &mdash; the lock is released</text></g><path d=\"M810 104 V78\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"652\" y=\"93\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--muted)\">not yet</text><text x=\"820\" y=\"93\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--acc)\">woken &rarr; look again</text><text x=\"88\" y=\"216\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--acc)\">oxygen()</text><g transform=\"translate(150 185)\"><rect width=\"190\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an oxygen thread arrives</text><text x=\"95.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">any thread, at any time</text></g><path d=\"M340 212 H362\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(362 185)\"><rect width=\"190\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take the lock</text><text x=\"95.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">interruptibly</text></g><path d=\"M552 212 H574\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(574 185)\"><rect width=\"190\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is the oxygen seat free?</text><text x=\"95.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one seat, never two</text></g><path d=\"M764 212 H786\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(786 185)\"><rect width=\"190\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">sit down: is it full now?</text><text x=\"95.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the last atom wakes the others</text></g><path d=\"M976 212 H998\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(998 185)\"><rect width=\"190\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">emit OUTSIDE the lock</text><text x=\"95.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">then count the emit</text></g><path d=\"M660 239 V269\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(500 269)\"><rect width=\"430\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"215.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">no seat, or not full yet: park &mdash; the lock is released</text></g><path d=\"M810 269 V243\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"652\" y=\"258\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--muted)\">not yet</text><text x=\"820\" y=\"258\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--acc)\">woken &rarr; look again</text><text x=\"1010\" y=\"160\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a wake means \"look again\",</text><text x=\"1010\" y=\"178\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">never \"the molecule is yours\"</text><text x=\"88\" y=\"335\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--acc)\">read</text><text x=\"150\" y=\"335\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, from any thread: how many molecules formed, how many seats taken right now, how many parks so far &mdash; each read under the lock</text><text x=\"615\" y=\"366\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">every window of three released atoms is exactly two H and one O, in any order, forever &mdash; with twenty hydrogen threads and ten oxygen threads running flat out</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Always two hydrogen and one oxygen, or will the recipe change?</td><td>2:1 now, any recipe later</td><td>A one-method <code>Recipe</code> handed in, not an <code>if</code> (moves 3, 5)</td></tr><tr><td>One molecule and stop, or the same instance forever?</td><td>Forever</td><td>Something that resets every generation: never a <code>CountDownLatch</code> (moves 6, 8)</td></tr><tr><td>Do the release callbacks block, and must the three run in a fixed order?</td><td>They may be slow; any order inside the molecule</td><td>The release runs OUTSIDE the lock (moves 6, 7)</td></tr><tr><td>Do callers guarantee a balanced supply of atoms?</td><td>Yes; a surplus just waits</td><td>No timeout, no rejection, and a documented assumption (move 12)</td></tr><tr><td>Must a blocked caller be cancellable?</td><td>Yes, by interrupt</td><td><code>lockInterruptibly</code>, and giving the seat back on the way out (moves 6, 9)</td></tr><tr><td>Fairness across long-waiting threads, or throughput?</td><td>Throughput; fairness is a flag</td><td>A non-fair lock by default, with the measured cost of the other choice (move 8)</td></tr><tr><td>Does anything need to watch the barrier?</td><td>A count, maybe a dashboard</td><td>One observer interface, called after the unlock (move 3)</td></tr><tr><td>One JVM, in memory?</td><td>Yes</td><td>No broker, no persistence yet; crossing machines is a follow-up (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li><code>hydrogen(release)</code> and <code>oxygen(release)</code> are called by any number of threads, in any order, repeatedly, on one instance.</li>\n<li>No thread runs its release until a complete molecule &mdash; two hydrogen and one oxygen &mdash; has gathered; then all three go.</li>\n<li>The same instance forms molecules forever: molecule 1,000 works exactly like molecule 1.</li>\n<li>A surplus of one element simply waits for its partners; nothing is dropped and nothing is forced through.</li>\n<li>A caller that is blocked can be cancelled, and cancelling it must not cost anybody else their molecule.</li>\n<li>The stoichiometry is a parameter: 2:1 today, any recipe on request, with no change to the waiting.</li>\n<li><code>moleculesFormed()</code> is a consistent snapshot, never a molecule that is still forming.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>No malformed molecule is possible under any interleaving: never H,H,H and never H,O,O.</li>\n<li>Every window of three released atoms belongs to one molecule: molecule N finishes before N+1 begins.</li>\n<li>No busy-waiting: a waiting atom parks and burns no CPU until somebody signals it.</li>\n<li>O(1) synchronisation per atom &mdash; one seat check, one wait, one signal &mdash; and memory O(number of elements).</li>\n<li>The caller's release callback runs outside the lock, and a slow or throwing one cannot wedge the barrier.</li>\n<li>The recipe, the clock and the listeners swap without touching the lock or the wait loops.</li>\n<li>One JVM, in memory, one process (say it; a follow-up crosses machines).</li></ul></div></div>\n<div class=\"move\"><h3>One run, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 0 ms   thirty threads start</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">20 hydrogen threads, 10 oxygen</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one latch releases them together</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">3,000 atoms waiting to be placed</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 0.01 ms   molecule one</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">H sits, H sits: both seats gone</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">O sits and wakes the other two</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">three emits, then seats reopen</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 0-26 ms   1,000 molecules</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">4,997 parks: five per molecule</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">nothing ever spun on a CPU</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">a third H could not sit down</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 26 ms   the count</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">3,000 atoms out, 0 malformed</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">every window of three is H,H,O</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the listener heard 1,000</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> two hydrogen and one oxygen per molecule, but the ratio is a parameter; the same instance forms molecules forever; atoms arrive from any thread in any order and a surplus waits; the caller's release callback may be slow, so it runs outside the lock; a blocked caller is cancellable by interrupt and hands its seat back when it goes; throughput first, so the lock is not fair. Named as out of scope: timeouts, shutdown, fairness, other molecules, crossing machines &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">The same twelve moves as every other page in this folder, run on a problem with almost no data in it. That is what makes it a good rehearsal: there is nowhere to hide behind classes, so every move has to earn its place on the ordering of four lines of code. The invariant is not arithmetic here, it is a shape &mdash; read the released atoms in order and every window of three must be exactly two H and one O &mdash; and moves 4, 6 and 7 are where that shape is won or lost.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class &mdash; and on a threading problem, notice what does not.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a HYDROGEN and an OXYGEN arrive at a BARRIER; a MOLECULE needs two H and one O; whoever cannot bond yet WAITS; when it is complete all three RELEASE</text><g transform=\"translate(30 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">H2OBarrier</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock, the counters</text></g><path d=\"M122.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(233 110)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Element</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">identity: an enum</text></g><path d=\"M315.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(416 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Recipe</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M503.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(609 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Molecule</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">not an object: a number</text></g><path d=\"M696.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(802 110)\"><rect width=\"190\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"95.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Hydrogen / Oxygen</text><text x=\"95.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">threads, not classes</text></g><path d=\"M897.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1010 110)\"><rect width=\"200\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"100.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the waiting rooms</text><text x=\"100.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">Conditions on the lock</text></g><path d=\"M1110.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a thread, a rule, a counter, or a waiting room the lock already keeps</text></svg></div><div class=\"move\"><p>Reading the sentence again: a <b>hydrogen</b> and an <b>oxygen</b> arrive at a <b>barrier</b>; a <b>molecule</b> needs two H and one O; whoever cannot bond yet <b>waits</b>; when the set is complete all three <b>release</b>. The barrier holds the lock, the seat counts, the waiting rooms and the count of molecules so far: a class, and the only one the callers ever touch. An element is identity and nothing else &mdash; no fields that move &mdash; so it is an enum, and every per-element array in the design is indexed by its ordinal. Then the four that a threading problem tempts you to make classes and must not. The recipe has no state, only an answer, so it is a one-method interface. A <i>molecule</i> is not an object at all: it is a generation number, because nothing is ever asked about a molecule after it has left. A hydrogen atom is not an object either &mdash; it is a thread that calls a method and hands in a callback. And the waiting rooms are not lists you keep: they are queues of parked threads the lock already maintains, reached only through <code>await</code> and <code>signal</code>. Writing an <code>Atom</code> class here is the classic wrong turn, and it drags a <code>Waiter</code> list along behind it.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 338\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cap how many of one element may enter</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 45 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 24)\"><rect width=\"380\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">H2OBarrier  (owns the seat counts)</text><text x=\"190.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M810 45 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 24)\"><rect width=\"330\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">while (seated[e] == want) await()</text><text x=\"165.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 76)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hold everybody until the set is complete</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 97 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 76)\"><rect width=\"380\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">H2OBarrier  (owns the lock)</text><text x=\"190.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M810 97 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 76)\"><rect width=\"330\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">full.await() / full.signalAll()</text><text x=\"165.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 128)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">say how many atoms a molecule takes</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 149 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 128)\"><rect width=\"380\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Recipe  (owns nothing: pure)</text><text x=\"190.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M810 149 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 128)\"><rect width=\"330\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">recipe.needed(e)</text><text x=\"165.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 180)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">let this atom out</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 201 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 180)\"><rect width=\"380\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the caller  (owns the callback)</text><text x=\"190.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M810 201 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 180)\"><rect width=\"330\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">release.run(), outside the lock</text><text x=\"165.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 232)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">close a molecule, open the next</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 253 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 232)\"><rect width=\"380\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">H2OBarrier  (owns the generation)</text><text x=\"190.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M810 253 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 232)\"><rect width=\"330\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">closeMyEmit()</text><text x=\"165.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">only the barrier can see the seat counts AND the waiting rooms, so it is the orchestrator; a hydrogen atom is not a class, it is any thread that calls a method</text><text x=\"615\" y=\"325\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and notice the verb that belongs to nobody here: deciding WHAT release means. The barrier owns WHEN an atom is let out; the caller hands in what that does</text></svg></div><div class=\"move\"><p>\"Cap how many atoms of one element may enter\" touches the seat counts, so it belongs to the barrier: <code>while (seated[e] == needed[e]) seatFree.await()</code>. \"Hold everybody until the set is complete\" touches the lock and its waiting rooms, so it belongs to the barrier too. \"Say how many atoms a molecule takes\" touches nothing at all &mdash; it reads an element and returns a number &mdash; so it is a pure rule, <code>recipe.needed(e)</code>. \"Close a molecule and open the next\" touches the counters and every waiting room at once, so it is the barrier again, which is why the barrier is the orchestrator. And then the verb that belongs to nobody in this design: deciding what \"released\" actually <i>does</i>. Printing an H, appending to a list, sending a message &mdash; none of that is ours. We own <i>when</i> an atom is let out; the caller hands in a <code>Runnable</code> that owns <i>what</i> that means. That single split is what makes one barrier reusable for a puzzle, a test and a real pipeline.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind a one-method interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 315\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 70)\"><rect width=\"230\" height=\"104\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"115.0\" y=\"46.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">H2OBarrier</text><text x=\"115.0\" y=\"62.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(clock), addObserver(o)</text></g><path d=\"M260 122 H340 V41 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 20)\"><rect width=\"290\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Recipe</text><text x=\"145.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">how many of each element</text></g><g transform=\"translate(770 20)\"><rect width=\"430\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Recipe.WATER / Recipe.PEROXIDE</text><text x=\"215.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">e -> e == HYDROGEN ? 2 : 1, a lambda</text></g><path d=\"M770 41 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 122 H340 V101 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 80)\"><rect width=\"290\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"145.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where a timestamp comes from</text></g><g transform=\"translate(770 80)\"><rect width=\"430\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::currentTimeMillis, or a fake</text><text x=\"215.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a test pins the instant it wants</text></g><path d=\"M770 101 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 122 H340 V161 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 140)\"><rect width=\"290\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MoleculeObserver</text><text x=\"145.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who wants to know</text></g><g transform=\"translate(770 140)\"><rect width=\"430\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MoleculeCounter, a dashboard, a log</text><text x=\"215.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">called after the unlock, in a try/catch</text></g><path d=\"M770 161 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 122 H340 V221 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 200)\"><rect width=\"290\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MoleculeBarrier</text><text x=\"145.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the whole build is a rule too</text></g><g transform=\"translate(770 200)\"><rect width=\"430\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">H2OBarrier / SemaphoreBarrier / Phaser</text><text x=\"215.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the tests run the same checks on both</text></g><path d=\"M770 221 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"282\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The barrier never builds a rule, so \"now make it CO2\" is a different lambda and nothing else moves</text><text x=\"615\" y=\"302\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one wrapper takes the whole interface instead: MeteredBarrier implements MoleculeBarrier and times any build, which never learns it is being measured</text></svg></div><div class=\"move\"><p>Four things will change here, and each becomes something the barrier is <i>given</i> rather than builds. The stoichiometry changes the moment they say \"now do CO2\", so it is <code>Recipe</code>, one method, and water is the lambda <code>e -&gt; e == HYDROGEN ? 2 : 1</code>. Where a timestamp comes from changes, because a test cannot wait for the wall clock &mdash; that is <code>Clock</code>. Who wants to know changes &mdash; that is <code>MoleculeObserver</code>, called after the unlock so a dashboard can never stall an atom. And the fourth is the interesting one on a threading problem: the <i>whole build</i> is a rule. <code>MoleculeBarrier</code> is the contract; <code>H2OBarrier</code> (one lock, three waiting rooms) and <code>SemaphoreBarrier</code> (semaphores plus a <code>CyclicBarrier</code>) are two implementations of it, and the failure tests run the same window check on both. This is where the patterns are born, not announced: a swappable rule behind an interface is <b>Strategy</b>; a wrapper that adds behaviour to the whole interface is <b>Decorator</b>, and here it is <code>MeteredBarrier</code>, which times any build without that build ever learning it is being measured; a barrier that says \"a molecule formed\" without knowing what a dashboard is, is <b>Observer</b>.</p></div><div class=\"move\"><h3>Move 4: state that many threads change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 370\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"25\" y=\"52\" text-anchor=\"start\" font-size=\"11.5\" fill=\"var(--acc)\">H thread 1</text><rect x=\"130\" y=\"32\" width=\"700\" height=\"30\" rx=\"4\" fill=\"var(--bg2)\" stroke=\"var(--line)\"/><text x=\"25\" y=\"96\" text-anchor=\"start\" font-size=\"11.5\" fill=\"var(--acc)\">H thread 2</text><rect x=\"130\" y=\"76\" width=\"700\" height=\"30\" rx=\"4\" fill=\"var(--bg2)\" stroke=\"var(--line)\"/><text x=\"25\" y=\"140\" text-anchor=\"start\" font-size=\"11.5\" fill=\"var(--acc)\">H thread 3</text><rect x=\"130\" y=\"120\" width=\"700\" height=\"30\" rx=\"4\" fill=\"var(--bg2)\" stroke=\"var(--line)\"/><text x=\"25\" y=\"184\" text-anchor=\"start\" font-size=\"11.5\" fill=\"var(--acc)\">O thread</text><rect x=\"130\" y=\"164\" width=\"700\" height=\"30\" rx=\"4\" fill=\"var(--bg2)\" stroke=\"var(--line)\"/><g transform=\"translate(140 32)\"><rect width=\"150\" height=\"30\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">arrives</text></g><g transform=\"translate(300 76)\"><rect width=\"150\" height=\"30\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">arrives</text></g><g transform=\"translate(460 120)\"><rect width=\"150\" height=\"30\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">arrives</text></g><g transform=\"translate(140 164)\"><rect width=\"300\" height=\"30\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">still walking over</text></g><path d=\"M636 22 V212\" stroke=\"#ff6b6b\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><text x=\"636\" y=\"16\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">a bare barrier of three trips here: it counted to three</text><g transform=\"translate(650 32)\"><rect width=\"170\" height=\"30\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">released: H</text></g><g transform=\"translate(650 76)\"><rect width=\"170\" height=\"30\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">released: H</text></g><g transform=\"translate(650 120)\"><rect width=\"170\" height=\"30\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">released: H</text></g><text x=\"535\" y=\"184\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the oxygen is still not here</text><path d=\"M130 224 H830\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><path d=\"M215 219 V229\" stroke=\"var(--line)\"/><text x=\"215\" y=\"245\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t1</text><path d=\"M375 219 V229\" stroke=\"var(--line)\"/><text x=\"375\" y=\"245\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t2</text><path d=\"M535 219 V229\" stroke=\"var(--line)\"/><text x=\"535\" y=\"245\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t3</text><path d=\"M695 219 V229\" stroke=\"var(--line)\"/><text x=\"695\" y=\"245\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t4</text><text x=\"860\" y=\"228\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">time &rarr;</text><g transform=\"translate(850 22)\"><rect width=\"360\" height=\"172\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the fix: seats, not a headcount</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">two hydrogen seats and one oxygen seat</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">a third hydrogen cannot even sit down</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">so the set can only ever be H + H + O</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the seats, the counters and the waiting rooms</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">are ONE object's state behind ONE lock:</text><text x=\"14\" y=\"126\" font-size=\"10.5\" fill=\"var(--muted)\">check and sit down are a single step</text></g><text x=\"615\" y=\"272\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">H,H,H: three atoms released as a molecule that does not exist. The gap is between \"three have arrived\" and \"the right three have arrived\"</text><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">Extensions.java has this bug as runnable code (NaiveBarrier): feed it three hydrogen threads and it really does print HHH</text><text x=\"615\" y=\"320\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and the second thing one lock buys you, which interviewers ask about separately: not one field in H2OBarrier is volatile, and none needs to be</text><text x=\"615\" y=\"338\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every read and every write of them happens with the lock held, and one thread's unlock happens-before the next thread's lock &mdash; so the next thread sees everything the last one wrote</text><text x=\"615\" y=\"356\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">that is also why moleculesFormed() and seatedCount() take the lock to return one int: a lock-free read here would be a read with no happens-before edge behind it</text></svg></div><div class=\"move\"><p>Here is the race, and it is not the one people expect. Three hydrogen threads walk up to a bare <code>CyclicBarrier(3)</code>. It counts to three, trips, and releases H, H, H: a molecule that does not exist. No lost update, no torn read &mdash; the barrier did exactly what it was told, and what it was told was wrong. The gap is between \"three parties have arrived\" and \"the <i>right</i> three have arrived\", so the fix is not a bigger barrier, it is a cap per element: two hydrogen seats and one oxygen seat, checked and taken as a single step. That means the seat counts, the molecule size, the generation number and the waiting rooms are all one object's state behind one lock &mdash; the shape with a name, the <b>monitor object</b>. The three waiting rooms hang off that same lock on purpose: an atom that is about to sleep tests its condition and goes to sleep <i>without</i> ever releasing the lock in between, which is what makes \"I looked, and then I slept\" atomic. Extensions.java carries the broken version as runnable code, because being able to demonstrate the bug is worth more in an interview than describing it. One last thing the lock buys, asked as a separate question often enough to prepare for: not a single field in <code>H2OBarrier</code> is <code>volatile</code>, and none needs to be, because one thread's unlock <i>happens-before</i> the next thread's lock and every field is touched only inside that. It is also why <code>moleculesFormed()</code> takes a lock to return an <code>int</code>: a lock-free read there would have no happens-before edge behind it and could legally return a stale number.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 352\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many H seats are taken?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the

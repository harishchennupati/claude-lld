">acquire, await, emit, release</text><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">  the permit AFTER the emit</text></g><g transform=\"translate(990 190)\"><rect width=\"240\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;Extensions.java&raquo;</text><text x=\"120.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PhaserBarrier</text><line x1=\"0\" y1=\"34\" x2=\"240\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">arrive + awaitAdvance</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">page 05: ladder rung 3</text></g><g transform=\"translate(990 300)\"><rect width=\"240\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;Extensions.java&raquo;</text><text x=\"120.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">MonitorBarrier</text><line x1=\"0\" y1=\"34\" x2=\"240\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">synchronized + notifyAll</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">page 05: no locks package</text></g><g><path d=\"M20 680L64 680\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"684\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 680L284 680\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"684\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 680L504 680\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"684\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 680L684 680\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"684\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 680L904 680\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"684\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the type name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods; <code>[takes the lock]</code> marks the two private steps that do the locking, and <code>[after unlock]</code> marks the one that must never run inside it. A &laquo;Extensions.java&raquo; tag on a box means it lives in the second file, the one that holds the answer to a follow-up; everything untagged is in Main.java. <b>The arrows.</b> Hollow triangle = implements: four builds and one decorator satisfy the one contract the callers depend on, which is why the failure tests can run the same window check over two of them. Filled diamond = owns: the barrier owns its lock and all three waiting rooms, and they die with it. Dashed green = handed in &mdash; the recipe through the constructor, because it decides how many waiting rooms exist, and the clock through <code>configure()</code>. Dotted blue = notifies. <b>Where state lives:</b> every mutable field in this design is inside <code>H2OBarrier</code>, and every one of them is read and written only under the one lock &mdash; that is the entire safety argument, and it is why the caller's callback is deliberately run <i>outside</i> that lock. Notice what is <i>not</i> a class: a hydrogen atom is a thread, a molecule is the <code>molecules</code> counter, and the three waiting rooms at the bottom are queues of parked threads the lock maintains for each <code>Condition</code>. The dashed card on the right names the two types that deliberately stay <i>outside</i> the interface, because they change the contract rather than the implementation. And notice what is not on this diagram either: there is no <code>FairBarrier</code>, because fairness turned out to be a constructor flag on the two builds that are already here.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies &mdash; and on this problem read <code>sitDown</code> and <code>closeMyEmit</code> together, because the correctness lives in the order between them. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (twenty claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * The kinds of atom this barrier knows about. Identity and nothing else -- no state, no behaviour --\n * so it is an enum, and every per-element array in the design is indexed by its ordinal.\n */\nenum Element {\n    HYDROGEN(&quot;H&quot;), OXYGEN(&quot;O&quot;);\n\n    private final String symbol;\n\n    /** One constant per element, carrying the letter the release callbacks print. */\n    Element(String symbol) { this.symbol = symbol; }\n\n    /** The one-letter symbol, used only for printing and for the tests that read the output. */\n    public String symbol() { return symbol; }\n}\n\n/** Where time comes from. Injected, so a test decides what &quot;now&quot; is instead of waiting for it. */\ninterface Clock {\n    /** The current instant in milliseconds. The only clock anything in this design is allowed to read. */\n    long nowMs();\n}\n\n/**\n * How many atoms of each element one molecule takes: the stoichiometry, and the only water-specific\n * fact in the whole design. One method, so a lambda is a valid implementation.\n */\ninterface Recipe {\n    /** How many atoms of this element one molecule needs. Zero means the element is not in this molecule. */\n    int needed(Element e);\n\n    /** Water: two hydrogen, one oxygen. The default the barrier is built with. */\n    Recipe WATER = e -&gt; e == Element.HYDROGEN ? 2 : 1;\n    /** Hydrogen peroxide: two hydrogen, two oxygen. Proof that the 2:1 rule is data, not code. */\n    Recipe PEROXIDE = e -&gt; 2;\n}\n\n/**\n * Somebody who wants to know that a molecule completed, without the barrier knowing what a dashboard is.\n * Called after the lock is released, so a slow or broken listener can never stall an atom.\n */\ninterface MoleculeObserver {\n    /** Called once per completed molecule, with its 1-based index and the millisecond it completed. */\n    void onMolecule(long index, long atMs);\n}\n\n/**\n * The contract every implementation on this page satisfies: two named doors, and a count of what came out.\n * Callers depend on this and never on permits, locks or barriers.\n */\ninterface MoleculeBarrier {\n    /** Offer one hydrogen atom. Returns only after a full molecule formed and this atom&#x27;s release has run. */\n    void hydrogen(Runnable releaseHydrogen) throws InterruptedException;\n\n    /** Offer one oxygen atom. Returns only after a full molecule formed and this atom&#x27;s release has run. */\n    void oxygen(Runnable releaseOxygen) throws InterruptedException;\n\n    /** How many complete molecules have been emitted so far. Never counts a molecule that is still forming. */\n    long moleculesFormed();\n}\n\n/**\n * The reference implementation: one ReentrantLock, one waiting room per element, and one more for\n * &quot;the molecule is full&quot;. Guarantees that the released atoms come out in groups of exactly the recipe --\n * two hydrogen and one oxygen for water -- with no group ever mixed into the next.\n *\n * Not one field below is volatile, and none needs to be: every read and every write of them happens\n * while this lock is held, and one thread&#x27;s unlock happens-before the next thread&#x27;s lock, so the next\n * thread sees everything the previous one wrote. That is also why the read methods take the lock.\n */\nfinal class H2OBarrier implements MoleculeBarrier {\n\n    /** Non-fair by default: a fair lock hands the next seat to the longest waiter and costs a context switch. */\n    private final ReentrantLock lock;\n    /** One waiting room per element: hydrogen atoms that found both H seats taken sleep here. */\n    private final EnumMap&lt;Element, Condition&gt; seatFree = new EnumMap&lt;&gt;(Element.class);\n    /** The waiting room for seated atoms: they sleep here until the last seat of their molecule is taken. */\n    private final Condition full;\n\n    /** How many atoms of each element one molecule takes. Fixed at construction. */\n    private final int[] needed = new int[Element.values().length];\n    /** How many seats of each element are taken in the molecule now forming. */\n    private final int[] seated = new int[Element.values().length];\n    /** Atoms in one complete molecule: the sum of the recipe. */\n    private final int size;\n\n    /** Seats taken in the molecule now forming, across all elements. */\n    private int filled;\n    /** Release callbacks that have finished in the molecule now forming. */\n    private int emitted;\n    /** How many molecules have been completely emitted. Also the generation number of the molecule now forming. */\n    private long molecules;\n    /** How many times a thread actually went to sleep here. Never a spin count: this design never spins. */\n    private long waits;\n\n    private Clock clock = System::currentTimeMillis;\n    private final List&lt;MoleculeObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n\n    /** A water barrier: two hydrogen and one oxygen per molecule. */\n    H2OBarrier() { this(Recipe.WATER, false); }\n\n    /** A barrier for any recipe, with the default (fast, non-fair) lock. */\n    H2OBarrier(Recipe recipe) { this(recipe, false); }\n\n    /**\n     * A barrier for any recipe. The recipe is a constructor argument and not a configure() one because\n     * the number of waiting rooms and the size of a molecule are decided by it. Pass fair = true to hand\n     * every seat to the longest waiter instead of to whoever is running: that is the whole of &quot;make it fair&quot;.\n     */\n    H2OBarrier(Recipe recipe, boolean fair) {\n        lock = new ReentrantLock(fair);            // &lt;- the whole of fairness is this flag\n        full = lock.newCondition();\n        int total = 0;\n        for (Element e : Element.values()) {\n            int n = recipe.needed(e);\n            if (n &lt; 0) throw new IllegalArgumentException(&quot;a recipe cannot need &quot; + n + &quot; atoms of &quot; + e);\n            needed[e.ordinal()] = n;\n            seatFree.put(e, lock.newCondition());\n            total += n;\n        }\n        if (total == 0) throw new IllegalArgumentException(&quot;a molecule with no atoms would never complete&quot;);\n        size = total;\n    }\n\n    /** Hand in the rules the barrier does not build for itself. Today that is only the clock. */\n    void configure(Clock clock) { this.clock = Objects.requireNonNull(clock, &quot;clock&quot;); }\n\n    /** Add a listener. It is called after the lock is released, never inside it. */\n    void addObserver(MoleculeObserver o) { observers.add(Objects.requireNonNull(o, &quot;observer&quot;)); }\n\n    /** Offer one hydrogen atom. Blocks until two hydrogen and one oxygen have gathered. */\n    public void hydrogen(Runnable releaseHydrogen) throws InterruptedException {\n        atom(Element.HYDROGEN, releaseHydrogen);\n    }\n\n    /** Offer one oxygen atom. Blocks until two hydrogen and one oxygen have gathered. */\n    public void oxygen(Runnable releaseOxygen) throws InterruptedException {\n        atom(Element.OXYGEN, releaseOxygen);\n    }\n\n    /**\n     * One atom&#x27;s whole life, in the order that makes the design correct: take a seat under the lock and\n     * wait for the molecule to fill; run the caller&#x27;s release OUTSIDE the lock; then count that emit.\n     * The atom that counts the last emit resets the seats, which is what stops molecule N+1 leaking into N.\n     */\n    void atom(Element e, Runnable release) throws InterruptedException {\n        Objects.requireNonNull(release, &quot;release&quot;);\n        sitDown(e);                        // returns only when this atom&#x27;s molecule is complete\n        try {\n            release.run();                 // outside the lock: a slow or throwing callback must not hold the barrier\n        } finally {\n            long done = closeMyEmit();     // non-zero only for the atom that finished the molecule\n            if (done &gt; 0) publish(done, clock.nowMs());\n        }\n    }\n\n    /**\n     * Take one of this element&#x27;s seats in the molecule now forming, then sleep until every seat is taken.\n     * Both waits are while loops: a wake means &quot;look again&quot;, never &quot;the molecule is yours&quot;.\n     *\n     * The wait protocol, in three rules, and this method is only those three rules twice over:\n     *   1. test the condition with the lock HELD -- so nobody can change it between the test and the sleep;\n     *   2. sleep in a while loop -- a wake may be spurious, or the state may have changed again since;\n     *   3. signal only after the state has actually changed, still under the lock.\n     * Rule 1 is what makes a LOST WAKEUP impossible here: await() releases the lock atomically as it parks,\n     * so a signal can never land in the gap between &quot;I looked&quot; and &quot;I slept&quot; -- there is no such gap.\n     */\n    private void sitDown(Element e) throws InterruptedException {\n        lock.lockInterruptibly();          // interruptibly, so an atom that ends up parked can still be cancelled\n        try {\n            int want = needed[e.ordinal()];\n            if (want == 0) throw new IllegalArgumentException(e + &quot; is not part of this molecule&quot;);\n\n            // 1. wait for a seat of MY element. This is the cap that makes H,H,H impossible.\n            while (seated[e.ordinal()] == want) {\n                waits++;\n                try {\n                    seatFree.get(e).await();\n                } catch (InterruptedException ie) {\n                    // the one way a wakeup COULD be lost: a signal was spent on me and I am leaving instead\n                    // of using it, so I pass it on. Without this line a seat can open with nobody awake for it.\n                    seatFree.get(e).signal();\n                    throw ie;\n                }\n            }\n            seated[e.ordinal()]++;\n            filled++;\n            long mine = molecules;         // the molecule I have just joined\n\n            // 2. the atom that takes the last seat completes the molecule and wakes the others.\n            if (filled == size) { full.signalAll(); return; }\n\n            // 3. everybody else sleeps until it is complete -- and gives the seat back if cancelled first.\n            try {\n                while (molecules == mine &amp;&amp; filled &lt; size) { waits++; full.await(); }\n            } catch (InterruptedException ie) {\n                if (molecules == mine &amp;&amp; filled &lt; size) {        // still incomplete: leaving is safe\n                    seated[e.ordinal()]--;\n                    filled--;\n                    seatFree.get(e).signal();                    // my seat is free again: wake somebody for it\n                    throw ie;\n                }\n                Thread.currentThread().interrupt();              // committed: the molecule formed as I was cancelled\n            }\n        } finally {\n            lock.unlock();\n        }\n    }\n\n    /**\n     * Count one finished release callback. The last one of a molecule clears the seats and wakes exactly as\n     * many waiters as seats it opened; it returns that molecule&#x27;s index so the caller can tell the observers\n     * after unlocking. signal() rather than signalAll() is safe here for one reason worth saying out loud:\n     * every thread parked on seatFree[e] is waiting for the same thing -- one seat of element e -- so they\n     * are interchangeable and waking n of them fills n seats. On a queue whose waiters want DIFFERENT things,\n     * signal() is a bug, which is exactly what goes wrong in the single-monitor build in Extensions.java.\n     */\n    private long closeMyEmit() {\n        lock.lock();                       // uninterruptible on purpose: this atom is committed and must be counted\n        try {\n            emitted++;\n            if (emitted &lt; size) return 0;\n            long done = ++molecules;\n            emitted = 0;\n            filled = 0;\n            for (Element e : Element.values()) {\n                seated[e.ordinal()] = 0;\n                // exactly as many signals as seats that just opened: signalAll here would wake every waiting\n                // hydrogen in the process so that two of them could sit down -- a thundering herd, every molecule\n                for (int k = 0; k &lt; needed[e.ordinal()]; k++) seatFree.get(e).signal();\n            }\n            return done;\n        } finally {\n            lock.unlock();\n        }\n    }\n\n    /** Tell the listeners, outside the lock, and never let a broken one break a molecule. */\n    private void publish(long index, long atMs) {\n        for (MoleculeObserver o : observers) {\n            try { o.onMolecule(index, atMs); } catch (RuntimeException ignored) { /* a broken meter is not our problem */ }\n        }\n    }\n\n    /** How many complete molecules have been emitted. Read under the lock, so it is never seen half-updated. */\n    public long moleculesFormed() { lock.lock(); try { return molecules; } finally { lock.unlock(); } }\n\n    /** How many seats of this element are taken in the molecule now forming. For the demo and the tests. */\n    public int seatedCount(Element e) { lock.lock(); try { return seated[e.ordinal()]; } finally { lock.unlock(); } }\n\n    /** How many times a thread parked here. Zero would mean nothing ever had to wait. */\n    public long waitCount() { lock.lock(); try { return waits; } finally { lock.unlock(); } }\n}\n\n/**\n * The same contract from two library pieces instead of one lock: a counting semaphore per element caps\n * how many atoms of that element may enter the molecule now forming, and a CyclicBarrier of three is the\n * rendezvous that releases them together. Ladder rung two, and the version most people write first.\n */\nfinal class SemaphoreBarrier implements MoleculeBarrier {\n\n    /** One counting semaphore per element: two permits for hydrogen, one for oxygen. */\n    private final EnumMap&lt;Element, Semaphore&gt; seats = new EnumMap&lt;&gt;(Element.class);\n    /** The rendezvous. It auto-resets every generation, which is the whole reason it is not a latch. */\n    private final CyclicBarrier bond;\n    private final AtomicLong molecules = new AtomicLong();\n\n    /** A water barrier: two hydrogen permits, one oxygen permit, a barrier of three. */\n    SemaphoreBarrier() { this(Recipe.WATER, false); }\n\n    /** A barrier for any recipe, with the default (fast, non-fair) permits. */\n    SemaphoreBarrier(Recipe recipe) { this(recipe, false); }\n\n    /**\n     * A barrier for any recipe: one semaphore per element, and a rendezvous the size of the whole molecule.\n     * Fair permits go to the longest waiter, so no thread can be starved -- at the price of a context switch\n     * on every handoff. Same one-flag change as the reference build&#x27;s ReentrantLock.\n     */\n    SemaphoreBarrier(Recipe recipe, boolean fair) {\n        int total = 0;\n        for (Element e : Element.values()) {\n            int n = recipe.needed(e);\n            seats.put(e, new Semaphore(n, fair));  // &lt;- the whole of fairness is this flag\n            total += n;\n        }\n        // the barrier action runs on the last arriving thread, before any of the three is released\n        bond = new CyclicBarrier(total, molecules::incrementAndGet);\n    }\n\n    /** Offer one hydrogen atom. Waits for a hydrogen permit, then for the other two atoms. */\n    public void hydrogen(Runnable releaseHydrogen) throws InterruptedException {\n        atom(Element.HYDROGEN, releaseHydrogen);\n    }\n\n    /** Offer one oxygen atom. Waits for the oxygen permit, then for the two hydrogen. */\n    public void oxygen(Runnable releaseOxygen) throws InterruptedException {\n        atom(Element.OXYGEN, releaseOxygen);\n    }\n\n    /**\n     * Acquire a seat, meet the others, emit, and only then hand the seat back. Releasing the permit after\n     * the emit -- not before the rendezvous -- is what keeps molecule N finished before N+1 can trip.\n     */\n    void atom(Element e, Runnable release) throws InterruptedException {\n        Objects.requireNonNull(release, &quot;release&quot;);\n        Semaphore seat = seats.get(e);\n        seat.acquire();                               // at most needed(e) atoms of this element are inside\n        try {\n            bond.await();                             // nobody moves until the whole molecule is here\n            release.run();\n        } catch (BrokenBarrierException broken) {\n            // a CyclicBarrier that saw one cancelled party is broken for everybody, for good, until reset()\n            throw new IllegalStateException(&quot;the bond broke: another atom of this molecule was cancelled&quot;, broken);\n        } finally {\n            seat.release();                           // AFTER the emit, never before the rendezvous\n        }\n    }\n\n    /** How many molecules the rendezvous has completed. Counted by the barrier action, so it cannot drift. */\n    public long moleculesFormed() { return molecules.get(); }\n}\n\n/** A listener that just counts, to show that the barrier tells somebody without knowing who. */\nfinal class MoleculeCounter implements MoleculeObserver {\n    private final AtomicLong seen = new AtomicLong();\n    private volatile long lastAtMs;\n\n    /** Remember that one more molecule formed, and when. Cheap, and called outside the barrier&#x27;s lock. */\n    public void onMolecule(long index, long atMs) { seen.incrementAndGet(); lastAtMs = atMs; }\n\n    /** How many molecules this listener was told about. */\n    public long seen() { return seen.get(); }\n\n    /** The instant the last molecule completed, from the injected clock. */\n    public long lastAtMs() { return lastAtMs; }\n}\n\n/** A demo that proves the three claims: groups of HHO, nobody leaves early, and nothing malforms under load. */\npublic class Main {\n\n    /** Runs the four demos in order; the last one is the race the whole design exists for. */\n    public static void main(String[] args) throws Exception {\n        moleculesComeOutInThrees();\n        nobodyLeavesEarly();\n        theSameContractTwoWays();\n        theRace();\n    }\n\n    /** Claim 1: five molecules, thirty threads, and the output is five clean groups of two H and one O. */\n    static void moleculesComeOutInThrees() throws Exception {\n        H2OBarrier barrier = new H2OBarrier();\n        MoleculeCounter counter = new MoleculeCounter();\n        barrier.addObserver(counter);\n        StringBuilder out = new StringBuilder();\n        List&lt;Thread&gt; threads = feed(barrier, out, 5);\n        for (Thread t : threads) t.join(5_000);\n        System.out.println(&quot;five molecules, released as: &quot; + group(out.toString(), 3)\n            + &quot;  (the listener was told &quot; + counter.seen() + &quot; times)&quot;);\n    }\n\n    /** Claim 2: two hydrogen with no oxygen in sight go to sleep, and the oxygen is what wakes them. */\n    static void nobodyLeavesEarly() throws Exception {\n        H2OBarrier barrier = new H2OBarrier();\n        StringBuilder out = new StringBuilder();\n        AtomicInteger released = new AtomicInteger();\n        Thread h1 = atomThread(barrier, Element.HYDROGEN, out, released);\n        Thread h2 = atomThread(barrier, Element.HYDROGEN, out, released);\n        h1.start(); h2.start();\n        Thread.sleep(200);                            // both are parked on &quot;the molecule is full&quot; for all of this\n        System.out.println(&quot;two hydrogen, no oxygen: released so far = &quot; + released.get()\n            + &quot;, still waiting = &quot; + (h1.isAlive() &amp;&amp; h2.isAlive()) + &quot;, seats taken = &quot;\n            + barrier.seatedCount(Element.HYDROGEN) + &quot; of 2&quot;);\n        long t0 = System.nanoTime();\n        Thread o1 = atomThread(barrier, Element.OXYGEN, out, released);\n        o1.start();\n        h1.join(5_000); h2.join(5_000); o1.join(5_000);\n        System.out.println(&quot;the oxygen arrived and all three left together after &quot;\n            + (System.nanoTime() - t0) / 1_000_000 + &quot; ms: &quot; + out + &quot;, molecules = &quot; + barrier.moleculesFormed()\n            + &quot;, threads parked &quot; + barrier.waitCount() + &quot; times and never spun&quot;);\n    }\n\n    /** Claim 3: the semaphore-and-CyclicBarrier build satisfies exactly the same contract. */\n    static void theSameContractTwoWays() throws Exception {\n        for (MoleculeBarrier barrier : List.of(new H2OBarrier(), new SemaphoreBarrier())) {\n            StringBuilder out = new StringBuilder();\n            List&lt;Thread&gt; threads = feed(barrier, out, 4);\n            for (Thread t : threads) t.join(5_000);\n            System.out.println(String.format(&quot;%-16s&quot;, barrier.getClass().getSimpleName()) + &quot; -&gt; &quot;\n                + group(out.toString(), 3) + &quot;  wellFormed=&quot; + wellFormed(out.toString(), 2, 1));\n        }\n    }\n\n    /** Claim 4: a thousand molecules under thirty threads, and every window of three is exactly H, H, O. */\n    static void theRace() throws Exception {\n        final int H_THREADS = 20, O_THREADS = 10, MOLECULES = 1000;   // 2000 hydrogen atoms, 1000 oxygen atoms\n        H2OBarrier barrier = new H2OBarrier();\n        MoleculeCounter counter = new MoleculeCounter();\n        barrier.addObserver(counter);\n\n        StringBuffer out = new StringBuffer();            // append is synchronized: the order is the release order\n        CountDownLatch go = new CountDownLatch(1);\n        // the atoms are a shared pool, not a per-thread quota: a thread supplies one seat at a time, so a\n        // quota that leaves the last two hydrogen atoms on ONE thread would wait for a partner that cannot come\n        AtomicInteger hLeft = new AtomicInteger(2 * MOLECULES), oLeft = new AtomicInteger(MOLECULES);\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; H_THREADS + O_THREADS; i++) {\n            final boolean isHydrogen = i &lt; H_THREADS;\n            Thread t = new Thread(() -&gt; {\n                try {\n                    go.await();\n                    AtomicInteger pool = isHydrogen ? hLeft : oLeft;\n                    while (pool.getAndDecrement() &gt; 0) {\n                        if (isHydrogen) barrier.hydrogen(() -&gt; out.append(&quot;H&quot;));\n                        else barrier.oxygen(() -&gt; out.append(&quot;O&quot;));\n                    }\n                } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            }, (isHydrogen ? &quot;H&quot; : &quot;O&quot;) + &quot;-&quot; + i);\n            threads.add(t);\n        }\n        threads.forEach(Thread::start);\n        long t0 = System.nanoTime();\n        go.countDown();\n        for (Thread t : threads) t.join(60_000);\n        long ms = (System.nanoTime() - t0) / 1_000_000;\n\n        String released = out.toString();\n        System.out.println(&quot;race: &quot; + released.length() + &quot; atoms released in &quot; + ms + &quot; ms (&quot;\n            + (ms == 0 ? &quot;instant&quot; : MOLECULES * 1000L / ms + &quot; molecules/second&quot;)\n            + &quot;), threads parked &quot; + barrier.waitCount() + &quot; times&quot;);\n        System.out.println(&quot;every window of three is exactly two H and one O: &quot; + wellFormed(released, 2, 1)\n            + &quot;, molecules = &quot; + barrier.moleculesFormed() + &quot;, the listener saw &quot; + counter.seen());\n        if (!wellFormed(released, 2, 1) || barrier.moleculesFormed() != MOLECULES || counter.seen() != MOLECULES)\n            throw new AssertionError(&quot;a molecule was malformed, lost or double counted&quot;);\n    }\n\n    /** Start the threads for n molecules of water: 2n hydrogen and n oxygen, all appending to one buffer. */\n    static List&lt;Thread&gt; feed(MoleculeBarrier barrier, StringBuilder out, int molecules) {\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        AtomicInteger released = new AtomicInteger();\n        for (int i = 0; i &lt; molecules; i++) {\n            threads.add(atomThread(barrier, Element.HYDROGEN, out, released));\n            threads.add(atomThread(barrier, Element.HYDROGEN, out, released));\n            threads.add(atomThread(barrier, Element.OXYGEN, out, released));\n        }\n        Collections.shuffle(threads);                 // arrive in any order: that is the point\n        threads.forEach(Thread::start);\n        return threads;\n    }\n\n    /** One thread offering one atom, whose release appends its symbol to the shared buffer. */\n    static Thread atomThread(MoleculeBarrier barrier, Element e, StringBuilder out, AtomicInteger released) {\n        return new Thread(() -&gt; {\n            try {\n                Runnable emit = () -&gt; { synchronized (out) { out.append(e.symbol()); } released.incrementAndGet(); };\n                if (e == Element.HYDROGEN) barrier.hydrogen(emit); else barrier.oxygen(emit);\n            } catch (InterruptedException ex) { Thread.currentThread().interrupt(); }\n        }, e.symbol() + &quot;-atom&quot;);\n    }\n\n    /** True when every window of `h + o` released atoms holds exactly h hydrogen and o oxygen. */\n    static boolean wellFormed(String released, int h, int o) {\n        int size = h + o;\n        if (released.length() % size != 0) return false;\n        for (int i = 0; i &lt; released.length(); i += size) {\n            int gotH = 0, gotO = 0;\n            for (int k = 0; k &lt; size; k++) {\n                if (released.charAt(i + k) == &#x27;H&#x27;) gotH++; else gotO++;\n            }\n            if (gotH != h || gotO != o) return false;\n        }\n        return true;\n    }\n\n    /** Split a release string into readable groups, for printing: HHOHOH -&gt; &quot;HHO HOH&quot;. */\n    static String group(String released, int size) {\n        StringBuilder sb = new StringBuilder();\n        for (int i = 0; i &lt; released.length(); i += size) {\n            if (i &gt; 0) sb.append(&#x27; &#x27;);\n            sb.append(released, i, Math.min(i + size, released.length()));\n        }\n        return sb.toString();\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: any molecule, any stoichiometry -- the same two ideas, keyed by symbol instead of by a two-value enum\n/**\n * CO2, NH3, C6H12O6: the seat-then-rendezvous shape does not change, only the recipe it is built from.\n * The map is read once in the constructor and never again, so no lookup in it is ever on a hot path.\n */\nfinal class MoleculeAssembler {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Map&lt;String, Condition&gt; seatFree = new HashMap&lt;&gt;();\n    private final Map&lt;String, Integer&gt; needed = new HashMap&lt;&gt;();\n    private final Map&lt;String, Integer&gt; seated = new HashMap&lt;&gt;();\n    private final Condition full = lock.newCondition();\n    private final int size;\n    private int filled, emitted;\n    private long molecules;\n\n    /** One waiting room per symbol, and a molecule the size of the whole recipe. */\n    MoleculeAssembler(Map&lt;String, Integer&gt; recipe) {\n        int total = 0;\n        for (Map.Entry&lt;String, Integer&gt; e : recipe.entrySet()) {\n            needed.put(e.getKey(), e.getValue());\n            seated.put(e.getKey(), 0);\n            seatFree.put(e.getKey(), lock.newCondition());\n            total += e.getValue();\n        }\n        if (total == 0) throw new IllegalArgumentException(&quot;a molecule with no atoms would never complete&quot;);\n        size = total;\n    }\n\n    /** Offer one atom of this symbol. Identical protocol to H2OBarrier, with a map where the enum array was. */\n    void atom(String symbol, Runnable release) throws InterruptedException {\n        Integer want = needed.get(symbol);\n        if (want == null) throw new IllegalArgumentException(symbol + &quot; is not in this molecule&quot;);\n        lock.lockInterruptibly();\n        try {\n            while (seated.get(symbol).equals(want)) seatFree.get(symbol).await();\n            seated.merge(symbol, 1, Integer::sum);\n            filled++;\n            long mine = molecules;\n            if (filled == size) full.signalAll();\n            else while (molecules == mine &amp;&amp; filled &lt; size) full.await();\n        } finally {\n            lock.unlock();\n        }\n        try {\n            release.run();\n        } finally {\n            lock.lock();\n            try {\n                if (++emitted == size) {\n                    emitted = 0;\n                    filled = 0;\n                    molecules++;\n                    for (String s : needed.keySet()) {\n                        seated.put(s, 0);\n                        for (int k = 0; k &lt; needed.get(s); k++) seatFree.get(s).signal();\n                    }\n                }\n            } finally { lock.unlock(); }\n        }\n    }\n\n    /** How many complete molecules have been emitted. */\n    long moleculesFormed() { lock.lock(); try { return molecules; } finally { lock.unlock(); } }\n}\n\n// ---- ext: ladder rung three -- a Phaser instead of a lock and three waiting rooms\n/**\n * A Phaser is a CyclicBarrier that can change its party count while it runs and is not permanently broken\n * by one cancelled party. The per-element semaphores are unchanged: they are what makes H,H,H impossible.\n */\nfinal class PhaserBarrier implements MoleculeBarrier {\n    private final EnumMap&lt;Element, Semaphore&gt; seats = new EnumMap&lt;&gt;(Element.class);\n    private final Phaser bond = new Phaser();\n\n    /** Two hydrogen permits, one oxygen permit, and a phase that advances once all three have arrived. */\n    PhaserBarrier() {\n        int total = 0;\n        for (Element e : Element.values()) { int n = Recipe.WATER.needed(e); seats.put(e, new Semaphore(n)); total += n; }\n        bond.bulkRegister(total);\n    }\n\n    /** Offer one hydrogen atom. */\n    public void hydrogen(Runnable releaseHydrogen) throws InterruptedException { atom(Element.HYDROGEN, releaseHydrogen); }\n\n    /** Offer one oxygen atom. */\n    public void oxygen(Runnable releaseOxygen) throws InterruptedException { atom(Element.OXYGEN, releaseOxygen); }\n\n    /** Arrive at the phase, wait for it to advance, emit, and only then hand the permit back. */\n    void atom(Element e, Runnable release) throws InterruptedException {\n        Semaphore seat = seats.get(e);\n        seat.acquire();\n        try {\n            bond.awaitAdvanceInterruptibly(bond.arrive());   // interruptible, and one cancelled atom does not break it\n            release.run();\n        } finally {\n            seat.release();\n        }\n    }\n\n    /** The phase number is the molecule count: it advances exactly once per complete molecule. */\n    public long moleculesFormed() { return bond.getPhase(); }\n}\n\n// ---- ext: a deadline and a way to stop -- the two things a barrier grows in production\n/**\n * The same protocol with two additions: every wait has a deadline, and a closed flag the wait loops already\n * read. An atom that gives up hands its seat back before it returns, so the molecule can still form without it.\n */\nfinal class TimedBarrier {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final EnumMap&lt;Element, Condition&gt; seatFree = new EnumMap&lt;&gt;(Element.class);\n    private final Condition full = lock.newCondition();\n    private final int[] needed = new int[Element.values().length];\n    private final int[] seated = new int[Element.values().length];\n    private final int size;\n    private int filled, emitted;\n    private long molecules;\n    private boolean closed;\n\n    /** A water barrier whose every wait can time out. */\n    TimedBarrier() {\n        int total = 0;\n        for (Element e : Element.values()) {\n            int n = Recipe.WATER.needed(e);\n            needed[e.ordinal()] = n;\n            seatFree.put(e, lock.newCondition());\n            total += n;\n        }\n        size = total;\n    }\n\n    /**\n     * Offer one atom, waiting at most this long in total. Returns false if the budget ran out; when it does,\n     * nothing has changed -- the seat is given back and the atom&#x27;s release never runs.\n     */\n    boolean atom(Element e, Runnable release, long timeoutMs) throws InterruptedException {\n        long deadline = System.nanoTime() + TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n        lock.lockInterruptibly();\n        try {\n            int want = needed[e.ordinal()];\n            while (seated[e.ordinal()] == want) {\n                if (closed) throw new IllegalStateException(&quot;this barrier is closed&quot;);\n                if (!awaitUntil(seatFree.get(e), deadline)) return false;      // gave up before taking a seat\n            }\n            seated[e.ordinal()]++;\n            filled++;\n            long mine = molecules;\n            if (filled == size) {\n                full.signalAll();\n            } else {\n                try {\n                    while (molecules == mine &amp;&amp; filled &lt; size) {\n                        if (closed) { giveSeatBack(e); throw new IllegalStateException(&quot;this barrier is closed&quot;); }\n                        if (!awaitUntil(full, deadline)) { giveSeatBack(e); return false; }\n                    }\n                } catch (InterruptedException ie) {\n                    if (molecules == mine &amp;&amp; filled &lt; size) { giveSeatBack(e); throw ie; }\n                    Thread.currentThread().interrupt();\n                }\n            }\n        } finally {\n            lock.unlock();\n        }\n        try {\n            release.run();\n        } finally {\n            closeMyEmit();\n        }\n        return true;\n    }\n\n    /** Wake everybody: parked atoms give their seats back and leave with an exception instead of sleeping forever. */\n    void close() {\n        lock.lock();\n        try {\n            closed = true;\n            full.signalAll();\n            for (Condition c : seatFree.values()) c.signalAll();\n        } finally { lock.unlock(); }\n    }\n\n    /** Wait on this condition until the deadline. False means the budget ran out. Caller holds the lock. */\n    private boolean awaitUntil(Condition c, long deadline) throws InterruptedException {\n        long left = deadline - System.nanoTime();\n        return left &gt; 0 &amp;&amp; c.awaitNanos(left) &gt; 0;\n    }\n\n    /** Undo the seat this atom took, and wake one thread that was waiting for it. Caller holds the lock. */\n    private void giveSeatBack(Element e) {\n        seated[e.ordinal()]--;\n        filled--;\n        seatFree.get(e).signal();\n    }\n\n    /** Count one finished callback; the last one of a molecule opens the seats for the next. */\n    private void closeMyEmit() {\n        lock.lock();\n        try {\n            if (++emitted &lt; size) return;\n            emitted = 0;\n            filled = 0;\n            molecules++;\n            for (Element e : Element.values()) {\n                seated[e.ordinal()] = 0;\n                for (int k = 0; k &lt; needed[e.ordinal()]; k++) seatFree.get(e).signal();\n            }\n        } finally { lock.unlock(); }\n    }\n\n    /** How many complete molecules have been emitted. */\n    long moleculesFormed() { lock.lock(); try { return molecules; } finally { lock.unlock(); } }\n}\n\n// ---- ext: why a CountDownLatch cannot do this job -- it builds exactly one molecule and is then dead\n/**\n * The tempting wrong answer. A latch counts down to zero and stays there: the first molecule is correct and\n * every atom after it walks straight through alone, because a spent latch lets everybody past instantly.\n * A CyclicBarrier or a Phaser resets itself every generation, which is the whole difference.\n */\nfinal class OneShotLatchBarrier {\n    private final Semaphore hydrogenSeats = new Semaphore(2), oxygenSeats = new Semaphore(1);\n    private final CountDownLatch gathered = new CountDownLatch(3);\n\n    /** Offer one atom, waiting at most this long. True means it was released -- which after molecule one is a lie. */\n    boolean atom(Element e, Runnable release, long timeoutMs) throws InterruptedException {\n        Semaphore seat = e == Element.HYDROGEN ? hydrogenSeats : oxygenSeats;\n        seat.acquire();\n        try {\n            gathered.countDown();\n            if (!gathered.await(timeoutMs, TimeUnit.MILLISECONDS)) return false;\n            release.run();                       // molecule 2 reaches this line with no partners at all\n            return true;\n        } finally {\n            seat.release();\n        }\n    }\n}\n\n// ---- ext: the naive barrier of three, and the HHH it ships -- the bug, as code that actually runs\n/**\n * A rendezvous with no per-element cap. Three hydrogen atoms are three parties, so the barrier trips and\n * emits H,H,H. This is the single most common wrong answer, and it is worth being able to demonstrate.\n */\nfinal class NaiveBarrier {\n    private final CyclicBarrier bond = new CyclicBarrier(3);\n\n    /** Any three atoms at all form a &quot;molecule&quot; here, which is exactly the defect. */\n    void atom(Runnable release) throws InterruptedException {\n        try { bond.await(); } catch (BrokenBarrierException e) { throw new IllegalStateException(e); }\n        release.run();\n    }\n}\n\n// ---- ext: the synchronized / wait / notifyAll version, for when java.util.concurrent.locks is off the table\n/**\n * One monitor instead of a lock with three waiting rooms. Everything still works, but every wake wakes\n * everybody: there is only one queue, so notify() could hand the wakeup to an atom that cannot use it.\n */\nfinal class MonitorBarrier implements MoleculeBarrier {\n    private int hydrogen, oxygen, filled, emitted;\n    private long molecules;\n\n    /** Offer one hydrogen atom. */\n    public void hydrogen(Runnable releaseHydrogen) throws InterruptedException { atom(true, releaseHydrogen); }\n\n    /** Offer one oxygen atom. */\n    public void oxygen(Runnable releaseOxygen) throws InterruptedException { atom(false, releaseOxygen); }\n\n    /** The same four steps, with wait() and notifyAll() in place of await() and signal(). */\n    private void atom(boolean isHydrogen, Runnable release) throws InterruptedException {\n        synchronized (this) {\n            while (isHydrogen ? hydrogen == 2 : oxygen == 1) wait();\n            if (isHydrogen) hydrogen++; else oxygen++;\n            filled++;\n            long mine = molecules;\n            if (filled == 3) {\n                notifyAll();                       // notify() here could wake an atom waiting for a SEAT instead\n            } else {\n                try {\n                    while (molecules == mine &amp;&amp; filled &lt; 3) wait();\n                } catch (InterruptedException ie) {\n                    if (molecules == mine &amp;&amp; filled &lt; 3) {\n                        if (isHydrogen) hydrogen--; else oxygen--;\n                        filled--;\n                        notifyAll();\n                        throw ie;\n                    }\n                    Thread.currentThread().interrupt();\n                }\n            }\n        }\n        try {\n            release.run();\n        } finally {\n            synchronized (this) {\n                if (++emitted == 3) { emitted = 0; filled = 0; hydrogen = 0; oxygen = 0; molecules++; notifyAll(); }\n            }\n        }\n    }\n\n    /** How many complete molecules have been emitted. */\n    public synchronized long moleculesFormed() { return molecules; }\n}\n\n// ---- ext: the unisex bathroom -- the same shape with the rule turned inside out\n/**\n * The H2O barrier says &quot;nobody LEAVES until the set is complete&quot;. Its sibling says &quot;nobody ENTERS unless the\n * room already matches&quot;: at most capacity people inside, and never two kinds at once. One lock, one condition.\n */\nfinal class UnisexRoom {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Condition changed = lock.newCondition();\n    private final int capacity;\n    private Element inside;                     // whose turn the room currently is; null when it is empty\n    private int occupants;\n    private long admitted;\n\n    /** A room that holds this many people of one kind at a time. */\n    UnisexRoom(int capacity) { this.capacity = capacity; }\n\n    /** Wait until the room is empty or already holds your kind with room left, then walk in. */\n    void enter(Element kind) throws InterruptedException {\n        lock.lockInterruptibly();\n        try {\n            while (!(occupants == 0 || (inside == kind &amp;&amp; occupants &lt; capacity))) changed.await();\n            inside = kind;\n            occupants++;\n            admitted++;\n        } finally { lock.unlock(); }\n    }\n\n    /** Walk out. The last one out empties the room, which is the only moment the other kind can get in. */\n    void leave() {\n        lock.lock();\n        try {\n            if (--occupants == 0) inside = null;\n            changed.signalAll();                // the room changed kind: everybody must look again\n        } finally { lock.unlock(); }\n    }\n\n    /** Whose turn the room currently is, and how many are in it. A test reads this from inside the room. */\n    Element currentKind() { lock.lock(); try { return inside; } finally { lock.unlock(); } }\n\n    /** How many people have been let in so far. */\n    long admitted() { lock.lock(); try { return admitted; } finally { lock.unlock(); } }\n}\n\n// ---- ext: measure without touching the barrier -- a decorator over the interface both sides already depend on\n/**\n * Wraps any MoleculeBarrier and records how long an atom waited and how many molecules formed. The barrier\n * it wraps is not edited, not subclassed and never learns it is being measured; callers see the same interface.\n */\nfinal class MeteredBarrier implements MoleculeBarrier {\n    private final MoleculeBarrier inner;\n    private final AtomicLong atoms = new AtomicLong(), totalWaitNs = new AtomicLong(), worstWaitNs = new AtomicLong();\n\n    /** Wrap a barrier. The only thing that changes at the call site is the word new. */\n    MeteredBarrier(MoleculeBarrier inner) { this.inner = Objects.requireNonNull(inner, &quot;inner&quot;); }\n\n    /** Time one hydrogen atom from the call to its release, then delegate the count upward. */\n    public void hydrogen(Runnable releaseHydrogen) throws InterruptedException {\n        long t0 = System.nanoTime();\n        try { inner.hydrogen(releaseHydrogen); } finally { record(System.nanoTime() - t0); }\n    }\n\n    /** Time one oxygen atom from the call to its release. */\n    public void oxygen(Runnable releaseOxygen) throws InterruptedException {\n        long t0 = System.nanoTime();\n        try { inner.oxygen(releaseOxygen); } finally { record(System.nanoTime() - t0); }\n    }\n\n    /** Keep the running total and the worst case. Lock-free, and never on the barrier&#x27;s critical path. */\n    private void record(long ns) {\n        atoms.incrementAndGet();\n        totalWaitNs.addAndGet(ns);\n        worstWaitNs.accumulateAndGet(ns, Math::max);\n    }\n\n    /** The average microseconds an atom spent between calling and being released. */\n    public double averageWaitUs() { long n = atoms.get(); return n == 0 ? 0 : totalWaitNs.get() / 1000.0 / n; }\n\n    /** The worst wait any single atom saw, in microseconds. */\n    public double worstWaitUs() { return worstWaitNs.get() / 1000.0; }\n\n    /** Delegated unchanged: a decorator adds, it does not replace. */\n    public long moleculesFormed() { return inner.moleculesFormed(); }\n}\n\n/** Runs every extension above, so the follow-up answers on page 05 are code that has actually executed. */\nclass ExtDemo {\n\n    /** Each block prints one line or two: the twist, and the evidence that it works. */\n    public static void main(String[] args) throws Exception {\n        anyMolecule();\n        phaserRung();\n        deadlinesAndShutdown();\n        theLatchIsOneShot();\n        theNaiveBarrierShipsHHH();\n        theMonitorVersion();\n        theUnisexRoom();\n        measureWithoutTouching();\n        fairnessCosts();\n    }\n\n    /** The same barrier, wrapped: it never learns it is being timed, and the caller&#x27;s line barely changes. */\n    static void measureWithoutTouching() throws Exception {\n        MeteredBarrier metered = new MeteredBarrier(new H2OBarrier());\n        race(metered, new StringBuffer(), 2000);\n        System.out.println(&quot;metered decorator: &quot; + metered.moleculesFormed() + &quot; molecules, an atom waited &quot;\n            + String.format(&quot;%.1f&quot;, metered.averageWaitUs()) + &quot; us on average and &quot;\n            + String.format(&quot;%.0f&quot;, metered.worstWaitUs()) + &quot; us at worst&quot;);\n    }\n\n    /** CO2 and NH3 from the same machinery: only the recipe map changes. */\n    static void anyMolecule() throws Exception {\n        StringBuffer out = new StringBuffer();\n        MoleculeAssembler co2 = new MoleculeAssembler(Map.of(&quot;C&quot;, 1, &quot;O&quot;, 2));\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 3; i++) for (String s : List.of(&quot;C&quot;, &quot;O&quot;, &quot;O&quot;))\n            threads.add(atomOf(() -&gt; co2.atom(s, () -&gt; out.append(s))));\n        join(threads);\n        System.out.println(&quot;CO2 from the same machinery: &quot; + group(out.toString(), 3)\n            + &quot;  molecules=&quot; + co2.moleculesFormed());\n    }\n\n    /** The Phaser build satisfies the same contract, and its phase number IS the molecule count. */\n    static void phaserRung() throws Exception {\n        PhaserBarrier barrier = new PhaserBarrier();\n        StringBuffer out = new StringBuffer();\n        join(water(barrier, out, 4));\n        System.out.println(&quot;phaser: &quot; + group(out.toString(), 3) + &quot;  wellFormed=&quot;\n            + Main.wellFormed(out.toString(), 2, 1) + &quot;  phase=&quot; + barrier.moleculesFormed());\n    }\n\n    /** A lonely hydrogen gives up on time and hands its seat back, and close() never leaves anybody parked. */\n    static void deadlinesAndShutdown() throws Exception {\n        TimedBarrier timed = new TimedBarrier();\n        long t0 = System.nanoTime();\n        boolean bonded = timed.atom(Element.HYDROGEN, () -&gt; { }, 120);\n        System.out.println(&quot;one hydrogen, no partners: bonded=&quot; + bonded + &quot; after &quot;\n            + (System.nanoTime() - t0) / 1_000_000 + &quot; ms, and its seat was handed back&quot;);\n        StringBuffer out = new StringBuffer();\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        for (Element e : List.of(Element.HYDROGEN, Element.HYDROGEN, Element.OXYGEN))\n            threads.add(atomOf(() -&gt; timed.atom(e, () -&gt; out.append(e.symbol()), 5_000)));\n        join(threads);\n        System.out.println(&quot;after the timeout the barrier still works: &quot; + out + &quot;, molecules=&quot;\n            + timed.moleculesFormed());\n        TimedBarrier closing = new TimedBarrier();\n        Thread parked = atomOf(() -&gt; {\n            try { closing.atom(Element.OXYGEN, () -&gt; { }, 30_000); }\n            catch (IllegalStateException e) { System.out.println(&quot;close() woke the parked atom: &quot; + e.getMessage()); }\n        });\n        parked.start();\n        Thread.sleep(80);\n        closing.close();\n        parked.join(3_000);\n    }\n\n    /** The latch builds exactly one molecule; after that it is at zero and lets every lone atom through. */\n    static void theLatchIsOneShot() throws Exception {\n        OneShotLatchBarrier latch = new OneShotLatchBarrier();\n        StringBuffer out = new StringBuffer();\n        List&lt;Thread&gt; first = new ArrayList&lt;&gt;();\n        for (Element e : List.of(Element.HYDROGEN, Element.HYDROGEN, Element.OXYGEN))\n            first.add(atomOf(() -&gt; latch.atom(e, () -&gt; out.append(e.symbol()), 2_000)));\n        join(first);\n        String afterOne = out.toString();\n        latch.atom(Element.OXYGEN, () -&gt; out.append(&quot;O&quot;), 150);       // one lone oxygen, no hydrogen anywhere\n        System.out.println(&quot;CountDownLatch: molecule 1 = &quot; + afterOne + &quot;, then one lone oxygen was released too: &quot;\n            + out + &quot; -- a spent latch lets everybody past, so molecule 2 is a single atom&quot;);\n    }\n\n    /** Evidence for the interview: a barrier of three with no per-element cap really does emit HHH. */\n    static void theNaiveBarrierShipsHHH() throws Exception {\n        NaiveBarrier naive = new NaiveBarrier();\n        StringBuffer out = new StringBuffer();\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 3; i++) threads.add(atomOf(() -&gt; naive.atom(() -&gt; out.append(&quot;H&quot;))));\n        join(threads);\n        System.out.println(&quot;the naive barrier of three, fed three hydrogen atoms, shipped: &quot; + out\n            + &quot;  (this is the molecule that does not exist)&quot;);\n    }\n\n    /** The wait/notifyAll build, for the interviewer who takes java.util.concurrent away. */\n    static void theMonitorVersion() throws Exception {\n        MonitorBarrier barrier = new MonitorBarrier();\n        StringBuffer out = new StringBuffer();\n        long ms = race(barrier, out, 500);\n        System.out.println(&quot;synchronized/wait/notifyAll: &quot; + barrier.moleculesFormed() + &quot; molecules in &quot; + ms\n            + &quot; ms, wellFormed=&quot; + Main.wellFormed(out.toString(), 2, 1));\n    }\n\n    /** The sibling problem: at most three inside, never mixed -- checked from inside the room. */\n    static void theUnisexRoom() throws Exception {\n        UnisexRoom room = new UnisexRoom(3);\n        AtomicInteger mixed = new AtomicInteger();\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 60; i++) {\n            final Element kind = i % 2 == 0 ? Element.HYDROGEN : Element.OXYGEN;\n            threads.add(atomOf(() -&gt; {\n                room.enter(kind);\n                if (room.currentKind() != kind) mixed.incrementAndGet();       // somebody of the other kind is in\n                Thread.sleep(1);\n                room.leave();\n            }));\n        }\n        join(threads);\n        System.out.println(&quot;unisex room: &quot; + room.admitted() + &quot; people admitted, times the room was mixed = &quot;\n            + mixed.get());\n    }\n\n    /**\n     * Fairness needs no new class at all: both builds already take the flag. Fair permits never starve a\n     * thread and cost a context switch per handoff -- here is that price on both builds, measured.\n     */\n    static void fairnessCosts() throws Exception {\n        long fast = race(new SemaphoreBarrier(Recipe.WATER, false), new StringBuffer(), 2000);\n        long fair = race(new SemaphoreBarrier(Recipe.WATER, true), new StringBuffer(), 2000);\n        long lockFast = race(new H2OBarrier(Recipe.WATER, false), new StringBuffer(), 2000);\n        long lockFair = race(new H2OBarrier(Recipe.WATER, true), new StringBuffer(), 2000);\n        System.out.println(&quot;2000 molecules, fairness is one constructor flag: semaphores &quot; + fast + &quot; ms -&gt; &quot;\n            + fair + &quot; ms fair, and the reference lock &quot; + lockFast + &quot; ms -&gt; &quot; + lockFair\n            + &quot; ms fair -- never starves, and it is not free&quot;);\n    }\n\n    /**\n     * Drive any barrier with twenty hydrogen threads and ten oxygen threads pulling from a shared pool of\n     * atoms, and return the milliseconds. A shared pool, not a per-thread quota: a thread supplies one seat\n     * at a time, so a quota that strands the last two hydrogen atoms on one thread would wait forever.\n     */\n    static long race(MoleculeBarrier barrier, StringBuffer out, int molecules) throws Exception {\n        AtomicInteger hLeft = new AtomicInteger(2 * molecules), oLeft = new AtomicInteger(molecules);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 30; i++) {\n            final boolean isHydrogen = i &lt; 20;\n            threads.add(atomOf(() -&gt; {\n                go.await();\n                AtomicInteger pool = isHydrogen ? hLeft : oLeft;\n                while (pool.getAndDecrement() &gt; 0) {\n                    if (isHydrogen) barrier.hydrogen(() -&gt; out.append(&quot;H&quot;));\n                    else barrier.oxygen(() -&gt; out.append(&quot;O&quot;));\n                }\n            }));\n        }\n        threads.forEach(Thread::start);\n        long t0 = System.nanoTime();\n        go.countDown();\n        for (Thread t : threads) t.join(60_000);\n        return (System.nanoTime() - t0) / 1_000_000;\n    }\n\n    /** Start one thread per atom for a handful of molecules, in a shuffled arrival order. */\n    static List&lt;Thread&gt; water(MoleculeBarrier barrier, StringBuffer out, int molecules) {\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; molecules; i++) {\n            threads.add(atomOf(() -&gt; barrier.hydrogen(() -&gt; out.append(&quot;H&quot;))));\n            threads.add(atomOf(() -&gt; barrier.hydrogen(() -&gt; out.append(&quot;H&quot;))));\n            threads.add(atomOf(() -&gt; barrier.oxygen(() -&gt; out.append(&quot;O&quot;))));\n        }\n        Collections.shuffle(threads);\n        threads.forEach(Thread::start);\n        return threads;\n    }\n\n    /** A demo body that is allowed to be interrupted, so no demo below writes the same try/catch twice. */\n    interface Body { void run() throws InterruptedException; }\n\n    /** One unstarted thread running this body, with the interrupt handled once, here. */\n    static Thread atomOf(Body body) {\n        return new Thread(() -&gt; {\n            try { body.run(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n    }\n\n    /** Start anything not started yet, then join every thread with a deadline: a demo may fail, never hang. */\n    static void join(List&lt;Thread&gt; threads) throws InterruptedException {\n        for (Thread t : threads) if (t.getState() == Thread.State.NEW) t.start();\n        for (Thread t : threads) t.join(20_000);\n    }\n\n    /** Split a release string into readable groups for printing. */\n    static String group(String released, int size) { return Main.group(released, size); }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n/**\n * Targeted failure tests: each one proves a claim the design makes on page 02, move 9. Every wait in this file\n * has a deadline and every thread is a daemon, so a bug shows up as a FAIL, never as a hung build; the\n * watchdog ends the run at 45 seconds. A barrier test that hangs has told you nothing.\n */\npublic class FailureTests {\n    static int failures = 0;\n\n    /** Print one line per claim and remember whether it held. */\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what);\n        if (!ok) failures++;\n    }\n\n    /** A barrier test suite that hangs is a failed test suite: this daemon ends the run if one does. */\n    static void watchdog(long seconds) {\n        Thread t = new Thread(() -&gt; {\n            try { Thread.sleep(seconds * 1000); } catch (InterruptedException e) { return; }\n            System.out.println(&quot;FAIL watchdog: the tests did not finish in &quot; + seconds + &quot; s (a deadlock or a lost wakeup)&quot;);\n            Runtime.getRuntime().halt(2);\n        });\n        t.setDaemon(true);\n        t.start();\n    }\n\n    /** One daemon thread offering one atom and appending its symbol to the shared buffer when released. */\n    static Thread atom(MoleculeBarrier barrier, Element e, StringBuffer out, AtomicInteger released) {\n        Thread t = new Thread(() -&gt; {\n            try {\n                Runnable emit = () -&gt; { out.append(e.symbol()); released.incrementAndGet(); };\n                if (e == Element.HYDROGEN) barrier.hydrogen(emit); else barrier.oxygen(emit);\n            } catch (InterruptedException ex) { Thread.currentThread().interrupt(); }\n        }, e.symbol() + &quot;-atom&quot;);\n        t.setDaemon(true);\n        t.start();\n        return t;\n    }\n\n    /**\n     * Drive any barrier with twenty hydrogen threads and ten oxygen threads pulling from a shared pool of\n     * atoms, and return the per-thread counts. A shared pool and not a per-thread quota, because a thread\n     * supplies one seat at a time: a quota that strands the last two hydrogen atoms on one thread deadlocks.\n     */\n    static int[] race(MoleculeBarrier barrier, StringBuffer out, int molecules, int hThreads, int oThreads)\n            throws Exception {\n        AtomicInteger hLeft = new AtomicInteger(2 * molecules), oLeft = new AtomicInteger(molecules);\n        CountDownLatch go = new CountDownLatch(1);\n        int[] done = new int[hThreads + oThreads];\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; hThreads + oThreads; i++) {\n            final int me = i;\n            final boolean isHydrogen = i &lt; hThreads;\n            Thread t = new Thread(() -&gt; {\n                try {\n                    go.await();\n                    AtomicInteger pool = isHydrogen ? hLeft : oLeft;\n                    while (pool.getAndDecrement() &gt; 0) {\n                        if (isHydrogen) barrier.hydrogen(() -&gt; out.append(&quot;H&quot;));\n                        else barrier.oxygen(() -&gt; out.append(&quot;O&quot;));\n                        done[me]++;\n                    }\n                } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            });\n            t.setDaemon(true);\n            threads.add(t);\n        }\n        threads.forEach(Thread::start);\n        go.countDown();\n        for (Thread t : threads) t.join(30_000);\n        return done;\n    }\n\n    /** The quietest and the busiest thread of a run: how evenly the seats were handed out. */\n    static int[] spread(int[] perThread) {\n        int min = Integer.MAX_VALUE, max = 0;\n        for (int n : perThread) { min = Math.min(min, n); max = Math.max(max, n); }\n        return new int[] { min, max };\n    }\n\n    public static void main(String[] args) throws Exception {\n        watchdog(45);\n\n        // 1. the race: a thousand molecules through thirty threads. Every window of three released atoms\n        //    must hold exactly two hydrogen and one oxygen -- never HHH, never HOO, and never a mixed window.\n        H2OBarrier barrier = new H2OBarrier();\n        MoleculeCounter counter = new MoleculeCounter();\n        barrier.addObserver(counter);\n        StringBuffer out = new StringBuffer();\n        race(barrier, out, 1000, 20, 10);\n        String released = out.toString();\n        check(released.length() == 3000, &quot;all 3000 atoms were released (&quot; + released.length() + &quot;)&quot;);\n        check(Main.wellFormed(released, 2, 1), &quot;every window of three is exactly two H and one O&quot;);\n        check(barrier.moleculesFormed() == 1000 &amp;&amp; counter.seen() == 1000,\n              &quot;1000 molecules formed and the listener was told exactly 1000 times&quot;);\n        // and the parks are the proof there was no thundering herd: closeMyEmit signals exactly the two\n        // hydrogen and one oxygen whose seats just opened, so a molecule costs about five parks, not thirty.\n        check(barrier.waitCount() &lt; 8 * 1000,\n              &quot;about five parks per molecule, not one per waiting thread (&quot; + barrier.waitCount() + &quot; parks)&quot;);\n\n        // 2. nobody leaves early: two hydrogen with no oxygen must both still be asleep, and the arrival of\n        //    the oxygen is what releases all three.\n        H2OBarrier waiting = new H2OBarrier();\n        StringBuffer w = new StringBuffer();\n        AtomicInteger released2 = new AtomicInteger();\n        Thread h1 = atom(waiting, Element.HYDROGEN, w, released2);\n        Thread h2 = atom(waiting, Element.HYDROGEN, w, released2);\n        Thread.sleep(250);\n        check(released2.get() == 0 &amp;&amp; h1.isAlive() &amp;&amp; h2.isAlive(),\n              &quot;two hydrogen and no oxygen: nothing was released and both threads are still parked&quot;);\n        Thread o1 = atom(waiting, Element.OXYGEN, w, released2);\n        h1.join(5_000); h2.join(5_000); o1.join(5_000);\n        check(released2.get() == 3 &amp;&amp; Main.wellFormed(w.toString(), 2, 1),\n              &quot;the oxygen arrived and exactly three atoms left together as one molecule: &quot; + w);\n\n        // 3. a surplus atom waits for a partner instead of forming a bad molecule.\n        H2OBarrier surplus = new H2OBarrier();\n        StringBuffer s = new StringBuffer();\n        AtomicInteger released3 = new AtomicInteger();\n        List&lt;Thread&gt; spare = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 3; i++) spare.add(atom(surplus, Element.HYDROGEN, s, released3));\n        atom(surplus, Element.OXYGEN, s, released3);\n        Thread.sleep(250);\n        long stillWaiting = spare.stream().filter(Thread::isAlive).count();\n        check(released3.get() == 3 &amp;&amp; stillWaiting == 1,\n              &quot;three hydrogen and one oxygen: exactly one molecule left and the spare hydrogen is still waiting&quot;);\n        atom(surplus, Element.HYDROGEN, s, released3);\n        atom(surplus, Element.OXYGEN, s, released3);\n        for (Thread t : spare) t.join(5_000);\n        Thread.sleep(100);\n        check(released3.get() == 6 &amp;&amp; Main.wellFormed(s.toString(), 2, 1),\n              &quot;its partners arrived and the second molecule formed: &quot; + s);\n\n        // 4. an interrupted atom hands its seat back. If it did not, the seat would be held by a thread that\n        //    no longer exists and the next molecule could never complete -- this test would then time out.\n        H2OBarrier cancel = new H2OBarrier();\n        StringBuffer c = new StringBuffer();\n        AtomicInteger released4 = new AtomicInteger();\n        AtomicBoolean interrupted = new AtomicBoolean();\n        Thread lonely = new Thread(() -&gt; {\n            try { cancel.hydrogen(() -&gt; { c.append(&quot;H&quot;); released4.incrementAndGet(); }); }\n            catch (InterruptedException e) { interrupted.set(true); }\n        });\n        lonely.setDaemon(true);\n        lonely.start();\n        Thread.sleep(200);\n        lonely.interrupt();\n        lonely.join(5_000);\n        check(interrupted.get() &amp;&amp; released4.get() == 0 &amp;&amp; cancel.seatedCount(Element.HYDROGEN) == 0,\n              &quot;a cancelled hydrogen threw InterruptedException, released nothing and gave its seat back&quot;);\n        Thread a1 = atom(cancel, Element.HYDROGEN, c, released4);\n        Thread a2 = atom(cancel, Element.HYDROGEN, c, released4);\n        Thread a3 = atom(cancel, Element.OXYGEN, c, released4);\n        a1.join(5_000); a2.join(5_000); a3.join(5_000);\n        check(released4.get() == 3 &amp;&amp; cancel.moleculesFormed() == 1,\n              &quot;and the barrier still forms molecules afterwards, which is the proof the seat came back&quot;);\n\n        // 5. a release callback that throws must not wedge the barrier: the emit is still counted in a finally,\n        //    so the molecule closes and the next one can form.\n        H2OBarrier boom = new H2OBarrier();\n        StringBuffer b = new StringBuffer();\n        AtomicInteger released5 = new AtomicInteger();\n        AtomicBoolean threw = new AtomicBoolean();\n        Thread bad = new Thread(() -&gt; {\n            try { boom.hydrogen(() -&gt; { throw new RuntimeException(&quot;the caller&#x27;s callback blew up&quot;); }); }\n            catch (RuntimeException e) { threw.set(true); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        bad.setDaemon(true);\n        bad.start();\n        Thread t2 = atom(boom, Element.HYDROGEN, b, released5);\n        Thread t3 = atom(boom, Element.OXYGEN, b, released5);\n        bad.join(5_000); t2.join(5_000); t3.join(5_000);\n        check(threw.get() &amp;&amp; boom.moleculesFormed() == 1,\n              &quot;a release callback that threw reached its caller and still closed its molecule&quot;);\n        StringBuffer b2 = new StringBuffer();\n        race(boom, b2, 20, 4, 2);\n        check(boom.moleculesFormed() == 21 &amp;&amp; Main.wellFormed(b2.toString(), 2, 1),\n              &quot;and twenty more molecules formed on the same barrier afterwards&quot;);\n\n        // 6. the semaphore + CyclicBarrier build satisfies exactly the same contract.\n        SemaphoreBarrier sem = new SemaphoreBarrier();\n        StringBuffer so = new StringBuffer();\n        race(sem, so, 500, 20, 10);\n        check(so.length() == 1500 &amp;&amp; Main.wellFormed(so.toString(), 2, 1) &amp;&amp; sem.moleculesFormed() == 500,\n              &quot;the semaphore + CyclicBarrier version passes the same window check over 500 molecules&quot;);\n\n        // 7. nobody is left behind: over a long run every one of the thirty threads is served and every atom\n        //    in the pool is consumed exactly once. The spread between them is the honest cost of a non-fair\n        //    lock, which is why the same run is repeated with fair permits.\n        H2OBarrier unfair = new H2OBarrier();\n        int[] per = race(unfair, new StringBuffer(), 1500, 20, 10);\n        int min = Integer.MAX_VALUE, max = 0, total = 0;\n        for (int n : per) { min = Math.min(min, n); max = Math.max(max, n); total += n; }\n        check(total == 4500 &amp;&amp; min &gt; 0 &amp;&amp; unfair.moleculesFormed() == 1500,\n              &quot;1500 molecules: all 4500 atoms consumed once and every thread served (quietest &quot; + min\n              + &quot;, busiest &quot; + max + &quot; -- a non-fair lock lets a hot thread barge)&quot;);\n        // fairness is one constructor flag on the build you already have -- here is what it buys, measured\n        // on the same run: the seat goes to the longest waiter instead of to whichever thread is running.\n        int[] barging = race(new SemaphoreBarrier(Recipe.WATER, false), new StringBuffer(), 1500, 20, 10);\n        SemaphoreBarrier evenly = new SemaphoreBarrier(Recipe.WATER, true);\n        int[] served = race(evenly, new StringBuffer(), 1500, 20, 10);\n        int[] sb = spread(barging), sf = spread(served);\n        check(evenly.moleculesFormed() == 1500 &amp;&amp; sf[0] &gt; 0 &amp;&amp; sf[1] - sf[0] &lt;= (sb[1] - sb[0]) / 4,\n              &quot;fair = true is still correct and far more even: &quot; + sf[0] + &quot;-&quot; + sf[1]\n              + &quot; atoms per thread, against &quot; + sb[0] + &quot;-&quot; + sb[1] + &quot; without the flag&quot;);\n\n        // 8. the 2:1 rule is data, not code: the same class with a peroxide recipe releases groups of 2 H + 2 O.\n        H2OBarrier peroxide = new H2OBarrier(Recipe.PEROXIDE);\n        StringBuffer p = new StringBuffer();\n        AtomicInteger released8 = new AtomicInteger();\n        List&lt;Thread&gt; quad = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 3; i++) {\n            quad.add(atom(peroxide, Element.HYDROGEN, p, released8));\n            quad.add(atom(peroxide, Element.HYDROGEN, p, released8));\n            quad.add(atom(peroxide, Element.OXYGEN, p, released8));\n            quad.add(atom(peroxide, Element.OXYGEN, p, released8));\n        }\n        for (Thread t : quad) t.join(10_000);\n        check(released8.get() == 12 &amp;&amp; Main.wellFormed(p.toString(), 2, 2) &amp;&amp; peroxide.moleculesFormed() == 3,\n              &quot;a peroxide recipe releases groups of two H and two O with no change to the barrier: &quot; + p);\n\n        // 9. a broken listener cannot break a molecule, and the timestamp comes from the injected clock.\n        H2OBarrier told = new H2OBarrier();\n        MoleculeCounter good = new MoleculeCounter();\n        told.addObserver((index, atMs) -&gt; { throw new RuntimeException(&quot;this dashboard is down&quot;); });\n        told.addObserver(good);\n        told.configure(() -&gt; 1_700_000_000_000L);\n        StringBuffer tb = new StringBuffer();\n        race(told, tb, 50, 4, 2);\n        check(told.moleculesFormed() == 50 &amp;&amp; good.seen() == 50,\n              &quot;a listener that throws did not stop a molecule, and the listener behind it still heard all 50&quot;);\n        check(good.lastAtMs() == 1_700_000_000_000L,\n              &quot;the molecule was stamped with the injected clock, not the wall clock&quot;);\n\n        // 10. the deadlock that is NOT in the barrier: a caller that owns a per-thread quota. One thread\n        //     holding both hydrogen atoms of a molecule blocks on the first and can never supply the second,\n        //     so the molecule never completes. The barrier is correct; the way it was driven is not.\n        H2OBarrier stranded = new H2OBarrier();\n        Thread quota = new Thread(() -&gt; {\n            try { stranded.hydrogen(() -&gt; { }); stranded.hydrogen(() -&gt; { }); }     // both H atoms, one thread\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        quota.setDaemon(true);\n        quota.start();\n        Thread onlyOxygen = atom(stranded, Element.OXYGEN, new StringBuffer(), new AtomicInteger());\n        Thread.sleep(400);\n        check(stranded.moleculesFormed() == 0 &amp;&amp; quota.isAlive() &amp;&amp; onlyOxygen.isAlive(),\n              &quot;a per-thread quota strands the molecule: one thread owning both H waits for itself forever&quot;);\n        atom(stranded, Element.HYDROGEN, new StringBuffer(), new AtomicInteger());   // a partner from outside\n        onlyOxygen.join(5_000);\n        for (int i = 0; i &lt; 100 &amp;&amp; stranded.moleculesFormed() == 0; i++) Thread.sleep(20);\n        check(stranded.moleculesFormed() == 1,\n              &quot;one hydrogen from any other thread frees it: drive the barrier from a shared pool, never a quota&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"There are threads that represent hydrogen atoms and threads that represent oxygen atoms. Each one calls <code>hydrogen()</code> or <code>oxygen()</code> and hands you a release function. No thread may run its release until a full molecule &mdash; two hydrogen and one oxygen &mdash; has gathered, and then all three go together. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (is the ratio fixed, and may the callbacks block, are the first two); then type in the order of Main.java: the Element enum, the Clock and Recipe interfaces with <code>Recipe.WATER</code>, the MoleculeObserver, the MoleculeBarrier contract, then H2OBarrier &mdash; its fields, its constructor from the recipe, <code>sitDown</code> with its two while loops, <code>closeMyEmit</code>, and <code>atom</code> which puts them either side of the caller's release; then the SemaphoreBarrier for contrast; then a main with thirty threads and a latch that checks every window of three.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; Now it is CO2. Then NH3. Then any molecule at all.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The stoichiometry is already an interface, so for anything the <code>Element</code> enum can name this is a different lambda and nothing else: <code>new H2OBarrier(e -&gt; 2)</code> is hydrogen peroxide, and the failure tests check that it releases clean groups of two H and two O. The constructor reads the recipe once, sums it into the molecule size and builds one waiting room per element, so no rule is ever consulted on a hot path. When the elements outgrow a two-value enum, the same body keyed by symbol is <code>MoleculeAssembler</code>: a map from symbol to seat count, a map from symbol to <code>Condition</code>, and the identical protocol. The thing to point at is what did <i>not</i> change &mdash; the lock, both wait loops, and the rule that the seats reopen only a

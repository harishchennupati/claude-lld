l=\"var(--text)\">who is waiting for a hydrogen seat?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 177 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 158)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">seatFree[H]: the lock's queue of parked threads</text><text x=\"270.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M980 177 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 158)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) park / wake</text></g><g transform=\"translate(30 204)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who is waiting for it to fill?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 223 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 204)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">full: a second queue of parked threads</text><text x=\"270.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M980 223 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 204)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) park / wake</text></g><g transform=\"translate(30 250)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which molecule am I in?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 269 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 250)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a long generation, read under the lock</text><text x=\"270.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M980 269 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 250)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><text x=\"615\" y=\"320\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">nothing scans, nothing is allocated per atom, and there is no list of waiters of our own: each Condition already keeps its own queue of parked threads</text><text x=\"615\" y=\"340\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">an EnumMap holds the three Conditions and a plain int[] holds the counts, so every question above is an array index, not a lookup</text></svg></div><div class=\"move\"><p>\"How many hydrogen seats are taken?\" is one array read: <code>seated[e.ordinal()]</code>. \"How many does a molecule need?\" is another, filled once in the constructor from the recipe and never read from the recipe again, so no rule runs on a hot path. \"Is the molecule complete?\" is the one worth naming: you keep a single <code>filled</code> counter rather than summing the array every time, so completeness is a comparison and not a loop. \"Who is waiting for a hydrogen seat?\" needs no structure from us at all &mdash; a <code>Condition</code> keeps its own queue of parked threads, so parking is O(1) and waking exactly two of them is O(1). And \"which molecule am I in?\" is a <code>long</code> generation number read under the lock, which costs nothing and is what lets a woken atom tell \"my molecule filled\" from \"my molecule already came and went\". Nothing scans, nothing is allocated per atom, and the memory is one small array plus one <code>Condition</code> per element, forever.</p></div><div class=\"move\"><h3>Move 6: one atom has a life cycle, and the order of the steps inside it is the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 686\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"880\" y=\"16\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">not full yet &rarr; sleep again: this arrow is exactly why the check is a while, not an if</text><path d=\"M1095 45 V28 H730 V45\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(150 45)\"><rect width=\"145\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"72.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hydrogen(emit)</text><text x=\"72.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">any thread</text></g><path d=\"M295 66 H315\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(315 45)\"><rect width=\"135\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"67.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lock it</text><text x=\"67.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">interruptibly</text></g><path d=\"M450 66 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 45)\"><rect width=\"150\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take a seat</text><text x=\"75.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">H seats: 1 of 2</text></g><path d=\"M620 66 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(640 45)\"><rect width=\"175\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">park on \"full\"</text><text x=\"87.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock is RELEASED</text></g><path d=\"M815 66 H835\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(835 45)\"><rect width=\"140\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">woken</text><text x=\"70.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the third atom came</text></g><path d=\"M975 66 H995\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(995 45)\"><rect width=\"210\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"105.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check again</text><text x=\"105.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">under the lock: while, never if</text></g><text x=\"25\" y=\"68\" text-anchor=\"start\" font-size=\"11.5\" fill=\"var(--acc)\">one atom</text><text x=\"25\" y=\"133\" text-anchor=\"start\" font-size=\"11.5\" fill=\"var(--acc)\">the lock</text><rect x=\"315\" y=\"112\" width=\"325\" height=\"30\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"477\" y=\"132\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--text)\">held by this thread</text><rect x=\"640\" y=\"112\" width=\"195\" height=\"30\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-dasharray=\"5 3\"/><text x=\"737\" y=\"132\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">held by NOBODY</text><rect x=\"835\" y=\"112\" width=\"365\" height=\"30\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"1017\" y=\"132\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--text)\">held again: await() re-acquires before it returns</text><g transform=\"translate(150 165)\"><rect width=\"265\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"132.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">unlock, THEN run the release</text><text x=\"132.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the caller's code, outside</text></g><path d=\"M415 186 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 165)\"><rect width=\"250\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">count the emit, in a finally</text><text x=\"125.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">even if the release threw</text></g><path d=\"M700 186 H730\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(730 165)\"><rect width=\"310\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the third emit reopens the seats</text><text x=\"155.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">signal 2 H and 1 O, not signalAll</text></g><path d=\"M1040 186 H1060\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1060 165)\"><rect width=\"140\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">return</text><text x=\"70.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">molecule closed</text></g><rect x=\"20\" y=\"228\" width=\"1190\" height=\"220\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside one atom, and why it is this order</text><text x=\"35\" y=\"276\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1  lock.lockInterruptibly()          so an atom that ends up parked can still be cancelled</text><text x=\"35\" y=\"298\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2  while (this element's seats are full) seatFree.await()          the cap that makes H,H,H impossible</text><text x=\"35\" y=\"320\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3  seated[e]++, filled++, remember the generation          the check and the sit-down are one step</text><text x=\"35\" y=\"342\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4  last seat taken? full.signalAll()   else   while (not complete) full.await()</text><text x=\"35\" y=\"364\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5  unlock, and only then release.run()          the caller's callback may be slow or may throw: never hold the lock through it</text><text x=\"35\" y=\"386\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">6  count the emit in a finally; the third emit resets the seats and signals exactly two H and one O</text><text x=\"35\" y=\"414\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">anything that throws before step 3 leaves every counter exactly as it was; an atom cancelled at step 4 hands its seat back and signals a peer, so the seat is not lost;</text><text x=\"35\" y=\"432\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">and because the seats reopen only after all THREE emits, molecule N is fully out of the door before any atom of N+1 can even sit down</text><text x=\"615\" y=\"482\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">underneath it, one protocol used twice &mdash; and every wait you will ever write is these three rules</text><g transform=\"translate(20 496)\"><rect width=\"380\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1   test the condition with the lock HELD</text><text x=\"190.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no reading state you will sleep on outside the lock</text></g><g transform=\"translate(425 496)\"><rect width=\"380\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2   sleep in a while loop, never an if</text><text x=\"190.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a wake means &quot;look again&quot;, never &quot;it is yours&quot;</text></g><g transform=\"translate(830 496)\"><rect width=\"380\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3   signal only after the state changed</text><text x=\"190.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">still under the lock, so a wake cannot outrun it</text></g><rect x=\"20\" y=\"558\" width=\"1190\" height=\"116\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"#ff6b6b\"/><text x=\"615\" y=\"580\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the two bugs those rules exist to kill</text><text x=\"35\" y=\"602\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">LOST WAKEUP: the signal fires in the gap between &quot;I looked&quot; and &quot;I slept&quot;, so the sleeper never hears it. There is no such gap here:</text><text x=\"35\" y=\"622\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">await() releases the lock atomically as it parks, so nobody can change a counter between the test and the sleep. Rule 1 is the whole defence.</text><text x=\"35\" y=\"642\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">SPURIOUS WAKEUP: the JVM may wake a parked thread for no reason at all. Rule 2 is the whole defence &mdash; re-test, and go back to sleep.</text><text x=\"35\" y=\"662\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">The one wakeup this design could still lose is one spent on an atom that is then cancelled, which is why it passes it on before it throws.</text></svg></div><div class=\"move\"><p>Follow one hydrogen along the clock. It takes the lock &mdash; interruptibly, so an atom that ends up parked can still be cancelled. It finds both hydrogen seats taken and waits on that element's room; when a seat opens it sits down, and <i>then</i> asks whether the molecule is now complete. If it took the last seat it wakes the others; otherwise it calls <code>full.await()</code>, which does the thing that makes the whole design work: it releases the lock while the thread sleeps, and re-acquires it before returning. The band at the bottom of the picture is the part to memorise, because every wait you will ever write is those three rules, and each one kills a bug that has a name. A <b>lost wakeup</b> is a signal that fires in the gap between \"I looked\" and \"I slept\", leaving a thread asleep on a condition that is already true; there is no such gap here, because <code>await()</code> releases the lock in the same atomic step as parking. A <b>spurious wakeup</b> is the JVM waking a parked thread for no reason at all, which it is allowed to do; the <code>while</code> loop is the entire defence, and it is why the arrow from \"woken\" goes back to the check. The one wakeup this design could still lose is one spent on an atom that is cancelled a moment later, which is the whole job of the <code>seatFree.signal()</code> in the interrupt handler: pass on the wake you are not going to use. Then the part people get wrong: the atom <b>unlocks first</b> and only then runs the caller's release, because that callback is somebody else's code and may be slow or may throw, and holding the lock through it would stall every other atom in the process. The emit is counted in a <code>finally</code>, so a callback that throws still closes its molecule; and the seats reopen only after all three emits have returned, which is precisely what stops an atom of molecule N+1 from appearing inside molecule N's window of three. That closing step takes the lock <i>un</i>interruptibly on purpose: once the release has run, this atom is committed and must be counted whatever later happens to its thread.</p></div><div class=\"move\"><h3>Move 7: yes, one lock means one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 425\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"560\" height=\"152\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about four nanoseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one array read and two int updates</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one comparison against the molecule size</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one signal onto a Condition's queue</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">measured: 4 ns for the whole locked part</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">nothing in here can block. Ever.</text></g><path d=\"M590 96 H650\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"620\" y=\"86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(650 20)\"><rect width=\"550\" height=\"152\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"275.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: microseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the caller's release callback: theirs, not ours</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">a park and an unpark: about 2 microseconds</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">a molecule needs four of them: about 9 us</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the listeners: after the unlock, in a try/catch</text></g><text x=\"615\" y=\"196\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">six threads, two molecules: exactly three atoms fill at each dashed line, and never a fourth</text><text x=\"25\" y=\"224\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">H-1</text><rect x=\"150\" y=\"212\" width=\"1050\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"200\" y=\"212\" width=\"16\" height=\"16\" rx=\"3\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><rect x=\"420\" y=\"212\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/><path d=\"M216 220 H420\" stroke=\"var(--muted)\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/><text x=\"25\" y=\"246\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">H-2</text><rect x=\"150\" y=\"234\" width=\"1050\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"250\" y=\"234\" width=\"16\" height=\"16\" rx=\"3\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><rect x=\"420\" y=\"234\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/><path d=\"M266 242 H420\" stroke=\"var(--muted)\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/><text x=\"25\" y=\"268\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">O-1</text><rect x=\"150\" y=\"256\" width=\"1050\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"390\" y=\"256\" width=\"16\" height=\"16\" rx=\"3\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><rect x=\"420\" y=\"256\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/><path d=\"M406 264 H420\" stroke=\"var(--muted)\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/><text x=\"25\" y=\"290\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">H-3</text><rect x=\"150\" y=\"278\" width=\"1050\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"450\" y=\"278\" width=\"16\" height=\"16\" rx=\"3\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><rect x=\"770\" y=\"278\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/><path d=\"M466 286 H770\" stroke=\"var(--muted)\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/><text x=\"25\" y=\"312\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">H-4</text><rect x=\"150\" y=\"300\" width=\"1050\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"480\" y=\"300\" width=\"16\" height=\"16\" rx=\"3\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><rect x=\"770\" y=\"300\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/><path d=\"M496 308 H770\" stroke=\"var(--muted)\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/><text x=\"25\" y=\"334\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">O-2</text><rect x=\"150\" y=\"322\" width=\"1050\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"740\" y=\"322\" width=\"16\" height=\"16\" rx=\"3\" fill=\"var(--bg)\" stroke=\"var(--acc)\"/><rect x=\"770\" y=\"322\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\" stroke-width=\"1.6\"/><path d=\"M756 330 H770\" stroke=\"var(--muted)\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/><path d=\"M438 206 V352\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><text x=\"446\" y=\"366\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--acc)\">molecule 1 leaves</text><path d=\"M788 206 V352\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><text x=\"796\" y=\"366\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--acc)\">molecule 2 leaves</text><text x=\"1090\" y=\"366\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">outlined = sat down    filled = released</text><text x=\"615\" y=\"392\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">H-3 and H-4 arrived during molecule 1 and could not sit down: both hydrogen seats were taken, which is the cap doing its job</text><text x=\"615\" y=\"412\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">measured: 1,000 molecules through twenty hydrogen and ten oxygen threads takes 26 milliseconds, and the threads parked 4,997 times &mdash; about five parks per molecule</text></svg></div><div class=\"move\"><p>Inside the lock there is one array read, two integer updates, a comparison and one signal: measured on this machine, the whole locked part costs about four nanoseconds. Everything expensive is outside it &mdash; the caller's release callback, the listeners, and the parking itself, because a park and an unpark is about two microseconds and a molecule needs four of them. So the honest arithmetic is that the lock is roughly a twenty-five-hundredth of what a molecule costs, and if you want this faster you do not attack the lock, you attack the parking. The measured run: a thousand molecules through twenty hydrogen threads and ten oxygen threads takes twenty-six milliseconds, about thirty-eight thousand molecules a second, and those threads parked 4,997 times &mdash; five parks per molecule, which is the number to volunteer. The picture also shows the thing the cap buys you: two of the six threads arrive during molecule one and simply cannot sit down, because both hydrogen seats are taken, and that is the whole defence against H,H,H expressed as a queue rather than as a check.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, name the ladder, and know what the library already gives you.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 510\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"300\" y=\"34\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">5,000 molecules, twenty H threads and ten O threads, measured on this machine</text><rect x=\"20\" y=\"46\" width=\"560\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"64.0\" font-size=\"10.5\" fill=\"var(--acc)\">the build</text><text x=\"265\" y=\"64.0\" font-size=\"10.5\" fill=\"var(--acc)\">us / molecule</text><text x=\"375\" y=\"64.0\" font-size=\"10.5\" fill=\"var(--acc)\">why</text><rect x=\"20\" y=\"74\" width=\"560\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"92.0\" font-size=\"11\" fill=\"var(--text)\">one lock + three waiting rooms</text><text x=\"265\" y=\"92.0\" font-size=\"11\" fill=\"var(--text)\">12.2</text><text x=\"375\" y=\"92.0\" font-size=\"11\" fill=\"var(--text)\">the reference on page 04</text><rect x=\"20\" y=\"102\" width=\"560\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"120.0\" font-size=\"11\" fill=\"var(--text)\">semaphores + CyclicBarrier</text><text x=\"265\" y=\"120.0\" font-size=\"11\" fill=\"var(--text)\">6.6</text><text x=\"375\" y=\"120.0\" font-size=\"11\" fill=\"var(--text)\">the library does the counting</text><rect x=\"20\" y=\"130\" width=\"560\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"148.0\" font-size=\"11\" fill=\"var(--text)\">semaphores + Phaser</text><text x=\"265\" y=\"148.0\" font-size=\"11\" fill=\"var(--text)\">5.8</text><text x=\"375\" y=\"148.0\" font-size=\"11\" fill=\"var(--text)\">and survives a cancelled atom</text><rect x=\"20\" y=\"158\" width=\"560\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"176.0\" font-size=\"11\" fill=\"var(--text)\">the same, with fair = true</text><text x=\"265\" y=\"176.0\" font-size=\"11\" fill=\"var(--text)\">10.3</text><text x=\"375\" y=\"176.0\" font-size=\"11\" fill=\"var(--text)\">never starves, but pays for it</text><rect x=\"20\" y=\"186\" width=\"560\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"204.0\" font-size=\"11\" fill=\"var(--err)\">synchronized + notifyAll</text><text x=\"265\" y=\"204.0\" font-size=\"11\" fill=\"var(--text)\">48</text><text x=\"375\" y=\"204.0\" font-size=\"11\" fill=\"var(--text)\">one queue wakes every waiter</text><rect x=\"20\" y=\"214\" width=\"560\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"232.0\" font-size=\"11\" fill=\"var(--acc)\">the lock itself, uncontended</text><text x=\"265\" y=\"232.0\" font-size=\"11\" fill=\"var(--text)\">0.004</text><text x=\"375\" y=\"232.0\" font-size=\"11\" fill=\"var(--text)\">4 ns: the lock is not the cost</text><text x=\"300\" y=\"256\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">four park-and-unpark trips a molecule, ~2 us each: the parking is the bill</text><text x=\"890\" y=\"34\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the ladder, in the order you would climb it</text><g transform=\"translate(600 50)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1   signal exactly as many as the seats that opened</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two H and one O, not signalAll: free, and 69 ms becomes 13</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2   semaphores + a CyclicBarrier of three</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the library counts and rendezvouses: 12.2 us becomes 6.6</text></g><g transform=\"translate(600 166)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3   semaphores + a Phaser</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">5.8 us, and one cancelled atom no longer breaks the barrier for good</text></g><text x=\"900\" y=\"256\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">no rung four: a lock-free barrier is a research paper, not an interview answer</text><rect x=\"20\" y=\"300\" width=\"1190\" height=\"26\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"317.0\" font-size=\"10.5\" fill=\"var(--acc)\">what java.util.concurrent gives you</text><text x=\"280\" y=\"317.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it does for you</text><text x=\"640\" y=\"317.0\" font-size=\"10.5\" fill=\"var(--acc)\">why it is not the whole answer on its own</text><rect x=\"20\" y=\"326\" width=\"1190\" height=\"26\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"343.0\" font-size=\"11\" fill=\"var(--text)\">Semaphore(n)</text><text x=\"280\" y=\"343.0\" font-size=\"11\" fill=\"var(--text)\">a counting cap: at most n threads inside at once</text><text x=\"640\" y=\"343.0\" font-size=\"11\" fill=\"var(--text)\">caps hydrogen at two, but never makes anybody wait for the oxygen</text><rect x=\"20\" y=\"352\" width=\"1190\" height=\"26\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"369.0\" font-size=\"11\" fill=\"var(--text)\">CountDownLatch(3)</text><text x=\"280\" y=\"369.0\" font-size=\"11\" fill=\"var(--text)\">wait until three things have happened</text><text x=\"640\" y=\"369.0\" font-size=\"11\" fill=\"var(--err)\">one-shot: it stays at zero, so molecule two is a lone atom walking through</text><rect x=\"20\" y=\"378\" width=\"1190\" height=\"26\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"395.0\" font-size=\"11\" fill=\"var(--text)\">CyclicBarrier(3)</text><text x=\"280\" y=\"395.0\" font-size=\"11\" fill=\"var(--text)\">a rendezvous that resets itself every generation</text><text x=\"640\" y=\"395.0\" font-size=\"11\" fill=\"var(--err)\">counts parties, not kinds: three hydrogen trip it. That is the H,H,H bug</text><rect x=\"20\" y=\"404\" width=\"1190\" height=\"26\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"421.0\" font-size=\"11\" fill=\"var(--text)\">Phaser</text><text x=\"280\" y=\"421.0\" font-size=\"11\" fill=\"var(--text)\">the same, with a party count that can change</text><text x=\"640\" y=\"421.0\" font-size=\"11\" fill=\"var(--text)\">same blindness to kind, but one cancelled party does not break it for good</text><rect x=\"20\" y=\"430\" width=\"1190\" height=\"26\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"447.0\" font-size=\"11\" fill=\"var(--acc)\">ReentrantLock + Condition</text><text x=\"280\" y=\"447.0\" font-size=\"11\" fill=\"var(--text)\">one queue of sleepers per thing worth waiting for</text><text x=\"640\" y=\"447.0\" font-size=\"11\" fill=\"var(--text)\">you write the protocol yourself &mdash; which is exactly the build on page 04</text><rect x=\"20\" y=\"456\" width=\"1190\" height=\"26\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"473.0\" font-size=\"11\" fill=\"var(--text)\">Exchanger, SynchronousQueue</text><text x=\"280\" y=\"473.0\" font-size=\"11\" fill=\"var(--text)\">a handoff between exactly two threads</text><text x=\"640\" y=\"473.0\" font-size=\"11\" fill=\"var(--text)\">a molecule is three threads, and they are not interchangeable</text><text x=\"615\" y=\"494\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">so the honest answer to &quot;could you just use X&quot; is that it takes two of them at once: a Semaphore per element for the cap, and a CyclicBarrier or Phaser for the rendezvous</text></svg></div><div class=\"move\"><p>Measure before you climb. The table is five thousand molecules through thirty threads, and its shape is the whole lesson: every build lands between five and twelve microseconds a molecule, the <code>synchronized</code>/<code>notifyAll</code> one lands at forty-eight because a monitor has a single queue and every wake wakes every waiter in the process, and the lock itself measures four nanoseconds. The lock is not the cost. The parking is, so the knobs are how many threads you wake and how often anybody sleeps at all. Rung one of the ladder is therefore free: wake exactly as many waiters as the seats that just opened &mdash; two hydrogen and one oxygen &mdash; instead of <code>signalAll</code>, which on this workload is the difference between five parks a molecule and thirty-one, and between thirteen milliseconds and sixty-nine for the same thousand. That is safe here for a reason worth saying out loud, because it is the follow-up: every thread parked on <code>seatFree[H]</code> wants the same thing, one hydrogen seat, so they are interchangeable and waking two of them fills two seats. Use <code>signal</code> on a queue whose sleepers want <i>different</i> things and you have written a bug &mdash; which is exactly what goes wrong in the single-monitor build. Rung two hands the counting to the library, and rung three swaps the barrier for a <code>Phaser</code>, which is a little faster and is not permanently broken by one cancelled party. There is no rung four; a lock-free barrier is a research paper, not an interview answer. The bottom table answers the question underneath all of this &mdash; \"could you not just use <i>X</i>?\" &mdash; and the answer is no, never one of them: the cap is per element and the rendezvous is per molecule, so it always takes two.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 432\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a barrier of three with no per-element cap</text></g><path d=\"M380 36 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 18)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a semaphore or a seat count per element; test 1 &mdash; 1,000 molecules, every window checked</text></g><g transform=\"translate(30 58)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the seat freed before the emit, not after</text></g><path d=\"M380 76 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 58)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">free it in the finally AFTER release.run(); test 1 &mdash; N+1 would leak into N's window</text></g><g transform=\"translate(30 98)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">if instead of while around a wait</text></g><path d=\"M380 116 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 98)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">re-test in a loop, always; tests 1 and 3 &mdash; a spare hydrogen must stay asleep</text></g><g transform=\"translate(30 138)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one monitor and notify()</text></g><path d=\"M380 156 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 138)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">with one queue you must use notifyAll; the monitor build in Extensions.java shows why</text></g><g transform=\"translate(30 178)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an interrupted atom keeps its seat</text></g><path d=\"M380 196 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 178)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hand the seat back and signal a peer; test 4 &mdash; the next molecule must still form</text></g><g transform=\"translate(30 218)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a release callback throws</text></g><path d=\"M380 236 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 218)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">count the emit in a finally; test 5 &mdash; twenty more molecules form afterwards</text></g><g transform=\"translate(30 258)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a CountDownLatch instead of a CyclicBarrier</text></g><path d=\"M380 276 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 258)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">it is one-shot: after molecule 1 every lone atom walks straight through (ExtDemo)</text></g><g transform=\"translate(30 298)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a listener called inside the lock, or throwing</text></g><path d=\"M380 316 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 298)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish after the unlock in a try/catch; test 9 &mdash; a listener that always throws</text></g><g transform=\"translate(30 338)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">each caller thread supplies its own quota</text></g><path d=\"M380 356 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 338)\"><rect width=\"800\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">not a bug in the barrier at all; test 10 &mdash; one thread owning both H waits for itself forever</text></g><text x=\"615\" y=\"398\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">twenty checks in FailureTests.java, every wait with a deadline, every thread a daemon and a 45-second watchdog behind all of it:</text><text x=\"615\" y=\"418\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a barrier test that hangs has told you nothing, so this suite is built so that a bug shows up as a FAIL and never as a stuck build</text></svg></div><div class=\"move\"><p>The table is the list; three things about it are worth saying rather than reading. First, the second row is the single most load-bearing line in the file: the seat is handed back <i>after</i> the emit, not before, and the other order lets an atom of molecule N+1 appear inside molecule N's window of three &mdash; a bug that no count-based test would catch, which is why the test checks the shape of the output instead. Second, the last row is not a bug in the barrier at all, and it catches people in real interviews: if every caller thread supplies a fixed quota of atoms, one thread that owns both hydrogen atoms of a molecule blocks on the first and can never hand over the second, so nothing completes. The barrier is correct and the way it was driven is not, and the answer is to feed it from a shared pool &mdash; which is exactly what the demo and the tests do. Third, how the suite is built: twenty checks, every wait with a deadline, every thread a daemon, a forty-five second watchdog behind all of it. A concurrency test that hangs has told you nothing, so this one is built so that a bug always shows up as a FAIL and never as a stuck build.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 418\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"210\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"300\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"850\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Monitor object</text><text x=\"210\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"300\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">one ReentrantLock + three Conditions, all private</text><text x=\"850\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">state is touched only through a method that locks</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"210\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">interface Recipe { int needed(Element e); }</text><text x=\"850\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">2:1 is data; peroxide is a lambda</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Strategy again</text><text x=\"210\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">interface MoleculeBarrier: H2OBarrier, SemaphoreBarrier</text><text x=\"850\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">the whole build swaps behind one name</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"210\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">MeteredBarrier implements MoleculeBarrier, wraps one</text><text x=\"850\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">measurement without opening the barrier</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"210\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">publish(index, atMs) after the unlock, in a try/catch</text><text x=\"850\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">a dashboard can never stall an atom</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">Command</text><text x=\"210\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"300\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">the release Runnable, handed in by the caller</text><text x=\"850\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">we own WHEN; the caller owns WHAT</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"210\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"300\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">the two while loops ARE the atom's state machine</text><text x=\"850\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">a wake goes back to the check, never to the emit</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">Barrier / rendezvous</text><text x=\"210\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">every move</text><text x=\"300\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">hold N parties, release them as one, then reset</text><text x=\"850\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">the thing this object IS; say the name</text><rect x=\"20\" y=\"290\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"210\" y=\"309.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"300\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">the barrier is handed to both sides; no getInstance()</text><text x=\"850\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh one per case</text><rect x=\"20\" y=\"320\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"210\" y=\"339.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"300\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">new H2OBarrier(Recipe.WATER) is one line</text><text x=\"850\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when recipes come from config</text><rect x=\"20\" y=\"350\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"369.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"210\" y=\"369.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"300\" y=\"369.0\" font-size=\"11\" fill=\"var(--muted)\">one constructor argument, and it has a default</text><text x=\"850\" y=\"369.0\" font-size=\"11\" fill=\"var(--muted)\">a builder here would be pure ceremony</text><text x=\"615\" y=\"402\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>Read the table down the \"born in\" column rather than the \"pattern\" column: not one of these was chosen, each is what a move left behind, and that is the difference between naming patterns and reciting them. Two rows are worth a sentence out loud. The first is <b>monitor object</b>, which is the name of the whole shape &mdash; private state, one lock, and the only way in is a method that takes it &mdash; and most candidates build it without ever saying the words. The second is the last real row: this object <i>is</i> a <b>barrier</b>, a rendezvous that holds N parties and releases them as one, and its interesting variant is that its parties are <i>typed</i>, which is the entire difficulty of the problem in one sentence. Interviewers notice when you skip that. The three greyed rows matter too, because a candidate who names a pattern that earned nothing loses more than one who names none.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"450\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"550\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"450\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"550\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">H2OBarrier synchronises. Recipe says how many. MoleculeCounter counts. Element is identity.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"450\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"550\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">Recipe.PEROXIDE is a lambda; the lock and both wait loops are untouched</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"450\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"550\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">FailureTests runs the same window check on H2OBarrier and on SemaphoreBarrier</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"450\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"550\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">Recipe, Clock, MoleculeObserver &mdash; a lambda implements each of them</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; be handed the rest</text><text x=\"450\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"550\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">configure(() -&gt; 1_700_000_000_000L) and a listener that throws on purpose</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>SOLID is not a list to recite; it is the check that the moves did their job, and the table is the whole answer. The two lines to say aloud are L and D, because both are provable rather than arguable here: L is the failure tests running the identical window check over <code>H2OBarrier</code> and <code>SemaphoreBarrier</code> without asking which one they got, and D is <code>configure()</code>, which is exactly why a test can hand the barrier a clock frozen at one instant and a listener that throws on purpose, and then assert that neither of them changed a molecule.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">CO2, NH3, any stoichiometry</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a different Recipe lambda; the lock and both wait loops are untouched</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a dashboard, a formation log</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer, called after the unlock in a try/catch</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">give up on a deadline; shut down</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a deadline in the wait loops and a closed flag they already read</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across parties</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">at most N inside, never mixed</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same lock, a different predicate: that is the unisex bathroom</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">atoms arriving from two machines</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the seats become a broker's consumer group and the rendezvous becomes</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a transaction that commits all three offsets or none: the same order, one layer down</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the seat counts, the two wait loops and the order at the emit are untouched; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>Four of the five rows leave the seat counts, both wait loops and the order at the emit completely untouched, and that is the test that the derivation was right: if a twist forces you back into the wait loops, a move was wrong. Row four is the one to recognise on sight &mdash; \"at most three in the bathroom and never two kinds at once\" is this same problem wearing a hat, one lock with a different predicate, and saying so is most of the answer. Row five is the only one that genuinely changes shape: once the atoms arrive from two machines the seats become a broker's consumer group and the rendezvous becomes a transaction that commits all three offsets or none. Even there the ordering rule survives word for word &mdash; commit only after the work succeeded. Page 05 has runnable code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 700\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M495.0 160L495.0 106\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M970 253 H975\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M990 225 H975\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M990 335 H975\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M975 335L975 103L692 103L692 63L680 63\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"985\" y=\"96\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--acc)\">three more builds, one contract</text><g transform=\"translate(925 400)\"><rect width=\"300\" height=\"128\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">deliberately NOT behind it</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">TimedBarrier: its calls can return</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">false, so the contract changes</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">MoleculeAssembler: keyed by symbol,</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">not by a two-value enum</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">both in Extensions.java, page 05</text></g><path d=\"M260 65.0L310 63.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M260 95L274 95L274 210L310 210\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"288\" y=\"124\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wraps one</text><pat xt-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--acc)\">seatFree[O]</text><rect x=\"16\" y=\"34\" width=\"46\" height=\"22\" rx=\"11\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"39\" y=\"49\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">O3</text><text x=\"78\" y=\"49\" font-size=\"10.5\" fill=\"var(--muted)\">1 seat</text></g><g transform=\"translate(910 560)\"><rect width=\"300\" height=\"74\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"22\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--acc)\">full &mdash; seated, waiting</text><rect x=\"16\" y=\"34\" width=\"46\" height=\"22\" rx=\"11\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"39\" y=\"49\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">H1</text><rect x=\"70\" y=\"34\" width=\"46\" height=\"22\" rx=\"11\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"93\" y=\"49\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">H2</text><text x=\"132\" y=\"49\" font-size=\"10.5\" fill=\"var(--muted)\">signalAll</text></g><path d=\"M400 474L400 538L420 538L420 560\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M495 474L495 538L755 538L755 560\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M590 474L590 538L1060 538L1060 560\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"654\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">these three are not classes: they are the queues of parked threads that the lock keeps for each Condition, reached only through await() and signal()</text><g transform=\"translate(10 20)\"><rect width=\"250\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;Extensions.java&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">MeteredBarrier</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">inner: MoleculeBarrier</text><line x1=\"0\" y1=\"56\" x2=\"250\" y2=\"56\" stroke=\"var(--line)\"/><text x=\"8\" y=\"69\" font-size=\"11.5\" fill=\"var(--text)\">hydrogen / oxygen: times it,</text><text x=\"8\" y=\"85\" font-size=\"11.5\" fill=\"var(--text)\">  then delegates</text></g><g transform=\"translate(10 130)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Hydrogen thread</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">barrier.hydrogen(emit)</text></g><g transform=\"translate(10 204)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Oxygen thread</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">barrier.oxygen(emit)</text></g><g transform=\"translate(10 285)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">MoleculeObserver</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">onMolecule(index, atMs)</text></g><g transform=\"translate(10 365)\"><rect width=\"250\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">MoleculeCounter</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">seen: AtomicLong</text><line x1=\"0\" y1=\"48\" x2=\"250\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">counts, after the unlock</text></g><g transform=\"translate(10 465)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Clock</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">nowMs(): long</text></g><g transform=\"translate(310 20)\"><rect width=\"370\" height=\"86\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"185.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"185.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">MoleculeBarrier</text><line x1=\"0\" y1=\"34\" x2=\"370\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">hydrogen(release)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">oxygen(release)</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--text)\">moleculesFormed(): long</text></g><g transform=\"translate(310 160)\"><rect width=\"370\" height=\"314\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"185.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">H2OBarrier</text><line x1=\"0\" y1=\"26\" x2=\"370\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">lock: ReentrantLock</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">seatFree: EnumMap&lt;Element, Condition&gt;</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">full: Condition</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">needed[] / seated[]: int</text><text x=\"8\" y=\"103\" font-size=\"11.5\" fill=\"var(--muted)\">size / filled / emitted: int</text><text x=\"8\" y=\"119\" font-size=\"11.5\" fill=\"var(--muted)\">molecules: long  (the generation)</text><text x=\"8\" y=\"135\" font-size=\"11.5\" fill=\"var(--muted)\">clock: Clock</text><text x=\"8\" y=\"151\" font-size=\"11.5\" fill=\"var(--muted)\">observers: List&lt;MoleculeObserver&gt;</text><line x1=\"0\" y1=\"160\" x2=\"370\" y2=\"160\" stroke=\"var(--line)\"/><text x=\"8\" y=\"173\" font-size=\"11.5\" fill=\"var(--text)\">hydrogen(r) / oxygen(r)</text><text x=\"8\" y=\"189\" font-size=\"11.5\" fill=\"var(--text)\">atom(e, r)  the whole life</text><text x=\"8\" y=\"205\" font-size=\"11.5\" fill=\"var(--text)\">sitDown(e)  [takes the lock]</text><text x=\"8\" y=\"221\" font-size=\"11.5\" fill=\"var(--text)\">closeMyEmit()  [takes the lock]</text><text x=\"8\" y=\"237\" font-size=\"11.5\" fill=\"var(--text)\">publish(i, ms)  [after unlock]</text><text x=\"8\" y=\"253\" font-size=\"11.5\" fill=\"var(--text)\">configure(clock) / addObserver(o)</text><text x=\"8\" y=\"269\" font-size=\"11.5\" fill=\"var(--text)\">moleculesFormed() / seatedCount(e)</text><text x=\"8\" y=\"285\" font-size=\"11.5\" fill=\"var(--text)\">waitCount(): long</text><text x=\"8\" y=\"301\" font-size=\"11.5\" fill=\"var(--text)\">&nbsp;</text></g><g transform=\"translate(720 20)\"><rect width=\"250\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Recipe</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">needed(e): int</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">WATER, PEROXIDE</text></g><g transform=\"translate(720 120)\"><rect width=\"250\" height=\"50\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Element</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">HYDROGEN(\"H\"), OXYGEN(\"O\")</text></g><g transform=\"translate(720 200)\"><rect width=\"250\" height=\"106\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SemaphoreBarrier</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">seats: EnumMap&lt;Element, Semaphore&gt;</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">bond: CyclicBarrier(3)</text><line x1=\"0\" y1=\"64\" x2=\"250\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\

n());\n        Trip ok = noisy.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO).orElseThrow();\n        noisy.driverArrived(ok.id()); noisy.startTrip(ok.id());\n        now[0] += 12 * 60_000L;\n        noisy.endTrip(ok.id(), 6.0);\n        check(ok.status() == TripStatus.COMPLETED, &quot;the trip completed although every notification threw&quot;);\n        check(ok.farePaise() == Money.rupees(&quot;130.00&quot;), &quot;and the fare is right: 40 + 12x6 km + 1.50x12 min = 130.00&quot;);\n        check(quiet.status() == DriverStatus.AVAILABLE, &quot;and the car went back into the pool&quot;);\n\n        // 8. the ping path: cheap, correct, and a driver who goes offline disappears from matching\n        GridIndex pings = new GridIndex();\n        RideService moving = service(pings, new CardPayment(), new NormalPricing());\n        moving.addRider(new Rider(&quot;R1&quot;, &quot;Meera&quot;));\n        Driver roamer = car(&quot;M1&quot;, &quot;Dev&quot;, VehicleType.GO, 12.9352, 77.6245);\n        moving.goOnline(roamer, roamer.location());\n        long rewritesAfterOnline = pings.rewrites();\n        for (int i = 0; i &lt; 200; i++) moving.ping(&quot;M1&quot;, new Location(12.9352 + i * 0.000002, 77.6245));\n        check(pings.pings() == 201, &quot;201 pings arrived (the one at sign-on plus 200)&quot;);\n        check(pings.rewrites() == rewritesAfterOnline, &quot;none of the 200 rewrote the grid: the car never left its cell&quot;);\n        check(pings.nearby(PICKUP).contains(roamer), &quot;and he is still found at the pickup point&quot;);\n        moving.ping(&quot;M1&quot;, new Location(12.9600, 77.6400));                    // 3 km away: a real cell crossing\n        check(pings.rewrites() == rewritesAfterOnline + 1, &quot;crossing a cell boundary rewrote the grid exactly once&quot;);\n        check(!pings.nearby(PICKUP).contains(roamer), &quot;he is no longer found at the old place&quot;);\n        check(pings.nearby(new Location(12.9600, 77.6400)).contains(roamer), &quot;and he is found at the new one&quot;);\n        check(moving.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO).isEmpty(), &quot;so a rider at the old place gets no car&quot;);\n        moving.goOffline(&quot;M1&quot;);\n        check(pings.nearby(new Location(12.9600, 77.6400)).isEmpty(), &quot;going offline removes him from the index entirely&quot;);\n        moving.ping(&quot;M1&quot;, new Location(12.9600, 77.6400));                    // a ping that was already in flight\n        check(pings.nearby(new Location(12.9600, 77.6400)).isEmpty(), &quot;and a late ping after sign-off does not put him back&quot;);\n        Trip busy = svc.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO).orElseThrow();\n        svc.driverArrived(busy.id()); svc.startTrip(busy.id());\n        try { svc.goOffline(busy.driver().id()); check(false, &quot;a driver must not vanish mid-ride&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;a driver cannot go offline while ON_TRIP&quot;); }\n\n        // 9. one rider, one live ride: a second tap must not become a second car, and the slot comes back at the end\n        RideService one = service(new GridIndex(), new CardPayment(), new NormalPricing());\n        one.addRider(new Rider(&quot;R1&quot;, &quot;Meera&quot;));\n        Driver c1 = car(&quot;C1&quot;, &quot;Asha&quot;,  VehicleType.GO, 12.9352, 77.6245);\n        Driver c2 = car(&quot;C2&quot;, &quot;Bilal&quot;, VehicleType.GO, 12.9353, 77.6246);\n        one.goOnline(c1, c1.location()); one.goOnline(c2, c2.location());\n        Trip held = one.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO).orElseThrow();\n        try { one.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO); check(false, &quot;a second tap must be refused&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;the second tap is refused: &quot; + e.getMessage()); }\n        check(one.trips().size() == 1, &quot;the refused tap created = DriverStatus.AVAILABLE).count() == 1,\n              &quot;and exactly one of the five cars left the pool: putIfAbsent decided, not luck&quot;);\n\n        // 10. something throws half-way through a request: the rider&#x27;s slot and any car it claimed are handed back\n        boolean[] routingDown = { true };\n        RideService fragile = new RideService(new GridIndex());\n        fragile.configure((p, type, cands) -&gt; {\n            if (routingDown[0]) throw new IllegalStateException(&quot;routing service timed out&quot;);\n            return new NearestDriver().select(p, type, cands);\n        }, new NormalPricing(), new StandardCancellation(), new CardPayment());\n        boolean[] clockDown = { false };\n        fragile.setClock(() -&gt; { if (clockDown[0]) { clockDown[0] = false; throw new IllegalStateException(&quot;clock unavailable&quot;); } return now[0]; });\n        fragile.addRider(new Rider(&quot;R1&quot;, &quot;Meera&quot;));\n        Driver only = car(&quot;X1&quot;, &quot;Asha&quot;, VehicleType.GO, 12.9352, 77.6245);\n        fragile.goOnline(only, only.location());\n        try { fragile.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO); check(false, &quot;a request whose rule throws must throw&quot;); }\n        catch (IllegalStateException e) { check(e.getMessage().contains(&quot;routing&quot;), &quot;the rule&#x27;s failure reaches the caller: &quot; + e.getMessage()); }\n        routingDown[0] = false;\n        clockDown[0] = true;                                                  // this time it fails AFTER the car is claimed\n        try { fragile.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO); check(false, &quot;a request whose clock throws must throw&quot;); }\n        catch (IllegalStateException e) { check(e.getMessage().contains(&quot;clock&quot;), &quot;a failure after the car was claimed reaches the caller too&quot;); }\n        check(only.status() == DriverStatus.AVAILABLE, &quot;and the car it had claimed is back in the pool, not stuck RESERVED&quot;);\n        boolean rebooked;\n        try { rebooked = fragile.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO).isPresent(); }\n        catch (IllegalStateException e) { rebooked = false; }\n        check(rebooked, &quot;and his slot came back, so his next tap books a car instead of &#x27;already has a ride&#x27;&quot;);\n\n        // 11. a payment retry on a trip that is still running is refused BEFORE the gateway is called\n        CardPayment gateway = new CardPayment();\n        RideService eager = service(new GridIndex(), gateway, new NormalPricing());\n        eager.addRider(new Rider(&quot;R1&quot;, &quot;Meera&quot;));\n        Driver e1 = car(&quot;E1&quot;, &quot;Bilal&quot;, VehicleType.GO, 12.9352, 77.6245);\n        eager.goOnline(e1, e1.location());\n        Trip running = eager.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO).orElseThrow();\n        eager.driverArrived(running.id()); eager.startTrip(running.id());\n        try { eager.retryPayment(running.id()); check(false, &quot;a retry on a running trip must be refused&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;a retry on a running trip is refused: &quot; + e.getMessage()); }\n        check(gateway.charges() == 0, &quot;and the gateway was never called, so the trip&#x27;s key is still unused&quot;);\n        now[0] += 24 * 60_000L;\n        eager.endTrip(running.id(), 8.0);\n        check(running.paymentRef().endsWith(&quot;-172.00&quot;),\n              &quot;so the real end charges the real 172.00, not a 0.00 left under the key by the early retry: &quot; + running.paymentRef());\n\n        // 12. a distance that is negative, not a number, or infinite is refused before anything is written\n        CardPayment meterPay = new CardPayment();\n        RideService meter = service(new GridIndex(), meterPay, new NormalPricing());\n        meter.addRider(new Rider(&quot;R1&quot;, &quot;Meera&quot;));\n        Driver k1 = car(&quot;K1&quot;, &quot;Chen&quot;, VehicleType.GO, 12.9352, 77.6245);\n        meter.goOnline(k1, k1.location());\n        Trip odd = meter.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO).orElseThrow();\n        meter.driverArrived(odd.id()); meter.startTrip(odd.id());\n        now[0] += 10 * 60_000L;\n        for (double bad : new double[]{-10.0, Double.NaN, Double.POSITIVE_INFINITY}) {\n            try { meter.endTrip(odd.id(), bad); check(false, bad + &quot; km must be refused, not billed&quot;); }\n            catch (RuntimeException e) { check(e instanceof IllegalArgumentException, bad + &quot; km is refused as bad input&quot;); }\n        }\n        check(odd.status() == TripStatus.IN_PROGRESS &amp;&amp; meterPay.charges() == 0, &quot;and the ride is still running, with no money moved&quot;);\n\n        // 13. one object per driver id: a second object under a known id is refused, so no ghost stays claimable\n        RideService registry = service(new GridIndex(), new CardPayment(), new NormalPricing());\n        registry.addRider(new Rider(&quot;R1&quot;, &quot;Meera&quot;));\n        Driver dev1 = car(&quot;D7&quot;, &quot;Dev&quot;, VehicleType.GO, 12.9352, 77.6245);\n        Driver dev2 = car(&quot;D7&quot;, &quot;Dev&quot;, VehicleType.GO, 12.9352, 77.6245);        // his phone restarted and signed on afresh\n        registry.goOnline(dev1, dev1.location());\n        try { registry.goOnline(dev2, dev2.location()); check(false, &quot;a second object for D7 must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;a second object for D7 is refused: &quot; + e.getMessage()); }\n        registry.goOffline(&quot;D7&quot;);\n        check(registry.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO).isEmpty(), &quot;after D7 goes offline no rider can be sent to him&quot;);\n\n        // 14. racing pings: one driver&#x27;s pings handled on eight threads at once leave him in exactly ONE cell\n        GridIndex storm = new GridIndex();\n        Driver drifter = car(&quot;S1&quot;, &quot;Drifter&quot;, VehicleType.GO, 12.9352, 77.6245);\n        drifter.goOnline(); storm.update(drifter, drifter.location());\n        List&lt;Location&gt; visited = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        ExecutorService pingers = Executors.newFixedThreadPool(8);\n        CountDownLatch burst = new CountDownLatch(1);\n        for (int th = 0; th &lt; 8; th++) {\n            final int lane = th;\n            pingers.submit(() -&gt; {\n                burst.await();\n                for (int i = 0; i &lt; 500; i++) {                                  // every ping lands in a cell no other ping uses\n                    Location l = new Location(10.0 + lane + (i / 20) * 0.03, 70.0 + (i % 20) * 0.03);\n                    visited.add(l);\n                    storm.update(drifter, l);\n                }\n                return null;\n            });\n        }\n        burst.countDown(); pingers.shutdown(); pingers.awaitTermination(60, TimeUnit.SECONDS);\n        Location parked = new Location(20.0, 80.0);\n        storm.update(drifter, parked);\n        long ghosts = visited.stream().filter(l -&gt; storm.nearby(l).contains(drifter)).count();\n        check(ghosts == 0 &amp;&amp; storm.nearby(parked).contains(drifter),\n              &quot;4,000 racing pings later he is found where he parked and nowhere else (cells still holding him: &quot; + ghosts + &quot;)&quot;);\n\n        // 15. extension claims: widening finds a FREE car, surge counts one area, a coupon cannot pay the rider,\n        //     and an upfront quote is what the rider pays\n        PrecisionIndex sparse = new PrecisionIndex(0.0025, 1);\n        Driver busyNear = car(&quot;W1&quot;, &quot;Busy&quot;, VehicleType.GO, 12.9352, 77.6245);\n        busyNear.goOnline(); busyNear.reserve(); sparse.update(busyNear, busyNear.location());\n        Driver freeFar = car(&quot;W2&quot;, &quot;Free&quot;, VehicleType.GO, 12.9352 + 0.0075, 77.6245);   // three small cells north\n        freeFar.goOnline(); sparse.update(freeFar, freeFar.location());\n        check(sparse.nearbyWidening(PICKUP, VehicleType.GO, 10).contains(freeFar), &quot;widening walks past a busy car to the free one three cells out&quot;);\n        GridIndex hub = new GridIndex();\n        for (int i = 0; i &lt; 3; i++) { Driver d = car(&quot;Z&quot; + i, &quot;z&quot; + i, VehicleType.GO, 12.9352, 77.6245); d.goOnline(); hub.update(d, d.location()); }\n        DemandCounter asks = new DemandCounter(5 * 60_000L);\n        for (int i = 0; i &lt; 6; i++) asks.record(new Location(12.9452, 77.6245), now[0]);   // one cell north: inside the nine\n        FareBasis at = new FareBasis(VehicleType.GO, 8.0, 24, PICKUP, now[0]);\n        check(new ZoneSurge(hub, asks).basisPoints(at) == 20_000, &quot;surge counts demand over the same nine cells as supply: 6 asks / 3 cars = 2.0x&quot;);\n        try { new CouponPricing(new NormalPricing(), 12_000, Money.rupees(&quot;1000.00&quot;)); check(false, &quot;a 120% coupon must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;a coupon over 100% is refused when it is made&quot;); }\n        FareQuote upfront = new FareQuote(new NormalPricing(), b -&gt; 15_000);\n        FareQuote.Quote shown = upfront.quote(VehicleType.GO, PICKUP, DROP, now[0]);\n        check(upfront.bill(shown.id(), VehicleType.GO, 8.0, 24, PICKUP, now[0]) == shown.paise(),\n              &quot;a ride within 15% of the estimate pays exactly the quote, &quot; + Money.fmt(shown.paise()));\n        check(upfront.bill(shown.id(), VehicleType.GO, 3.0, 10, PICKUP, now[0]) &lt; shown.paise(),\n              &quot;a ride far shorter than the estimate (a changed destination) is re-metered, not charged the full quote&quot;);\n        try { upfront.bill(&quot;Q404&quot;, VehicleType.GO, 8.0, 24, PICKUP, now[0]); check(false, &quot;an unknown quote must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;an unknown quote id is refused, never billed at 1.0x&quot;); }\n\n        // 16. offers with a deadline: never two offers for one driver, a late tap cannot take a newer offer, a decline moves on\n        GridIndex offerGrid = new GridIndex();\n        List&lt;Driver&gt; trio = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 3; i++) {\n            Driver d = car(&quot;O&quot; + i, &quot;o&quot; + i, VehicleType.GO, 12.9352 + i * 0.0005, 77.6245);\n            d.goOnline(); offerGrid.update(d, d.location()); trio.add(d);\n        }\n        OfferDesk desk = new OfferDesk(offerGrid, new NearestDriver(), () -&gt; now[0], 15_000);\n        ExecutorService dispatchers = Executors.newFixedThreadPool(8);\n        CountDownLatch ring = new CountDownLatch(1);\n        List&lt;Future&lt;Optional&lt;Offer&gt;&gt;&gt; made = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 30; i++) {\n            final String rid = &quot;q&quot; + i;\n            made.add(dispatchers.submit(() -&gt; { ring.await(); return desk.offer(rid, PICKUP, VehicleType.GO); }));\n        }\n        ring.countDown();\n        int offersMade = 0;\n        for (Future&lt;Optional&lt;Offer&gt;&gt; f : made) if (f.get().isPresent()) offersMade++;\n        dispatchers.shutdown();\n        check(offersMade == 3 &amp;&amp; trio.stream().allMatch(d -&gt; desk.historyOf(d.id()).size() == 1),\n              &quot;30 riders at once, 3 cars: exactly 3 offers, one per driver, never two at once&quot;);\n        now[0] += 16_000;\n        check(desk.expireDue() == 3 &amp;&amp; trio.stream().allMatch(d -&gt; d.status() == DriverStatus.AVAILABLE),\n              &quot;nobody tapped in 15 s: all 3 offers expired and the cars are back in the pool&quot;);\n        String staleOffer = desk.historyOf(&quot;O0&quot;).get(0).id();\n        Offer fresh = desk.offer(&quot;late-rider&quot;, PICKUP, VehicleType.GO).orElseThrow();\n        check(fresh.driver() == trio.get(0) &amp;&amp; !desk.accept(staleOffer),\n              &quot;his tap on the OLD offer is refused, although his status reads RESERVED again&quot;);\n        check(fresh.outcome() == Offer.Outcome.PENDING &amp;&amp; trio.get(0).status() == DriverStatus.RESERVED, &quot;and the new offer is untouched&quot;);\n        desk.decline(fresh.id());\n        Offer next = desk.offer(&quot;late-rider&quot;, PICKUP, VehicleType.GO).orElseThrow();\n        check(next.driver() != trio.get(0) &amp;&amp; desk.accept(next.id()), &quot;after a decline the next-nearest driver is asked, not the same one again&quot;);\n        check(desk.historyOf(&quot;O0&quot;).size() == 2 &amp;&amp; desk.historyOf(&quot;O0&quot;).get(1).outcome() == Offer.Outcome.DECLINED,\n              &quot;and his history shows what he let expire and what he declined&quot;);\n\n        // 17. the car-pool version: a seat is never sold twice, and a vehicle has one open ride\n        CarPool carPool = new CarPool();\n        CarPool.Ride swift = carPool.offer(&quot;John&quot;, &quot;KA-09-32321&quot;, 3, &quot;Bangalore&quot;, &quot;Mysore&quot;, now[0], 3 * 3_600_000L);\n        ExecutorService passengers = Executors.newFixedThreadPool(8);\n        CountDownLatch doors = new CountDownLatch(1);\n        List&lt;Future&lt;Optional&lt;CarPool.Ride&gt;&gt;&gt; seats = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 20; i++) {\n            final String p = &quot;p&quot; + i;\n            seats.add(passengers.submit(() -&gt; { doors.await(); return carPool.select(p, &quot;Bangalore&quot;, &quot;Mysore&quot;, 1, CarPool.Preference.MOST_VACANT, null); }));\n        }\n        doors.countDown();\n        int seated = 0;\n        for (Future&lt;Optional&lt;CarPool.Ride&gt;&gt; f : seats) if (f.get().isPresent()) seated++;\n        passengers.shutdown();\n        check(seated == 3 &amp;&amp; swift.seatsLeft() == 0, &quot;20 passengers at once for 3 seats: exactly 3 seated, none oversold&quot;);\n        try { carPool.offer(&quot;John&quot;, &quot;KA-09-32321&quot;, 2, &quot;Bangalore&quot;, &quot;Mysore&quot;, now[0], 3_600_000L); check(false, &quot;a second open ride on one vehicle must be refused&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;a second open ride on the same vehicle is refused&quot;); }\n        carPool.end(swift.id);\n        check(carPool.offer(&quot;John&quot;, &quot;KA-09-32321&quot;, 2, &quot;Mysore&quot;, &quot;Bangalore&quot;, now[0], 3_600_000L) != null,\n              &quot;once the ride ends, the vehicle can offer the next one&quot;);\n        check(carPool.offeredBy(&quot;John&quot;).size() == 2 &amp;&amp; carPool.takenBy(&quot;p0&quot;).size() + carPool.takenBy(&quot;p1&quot;).size() &lt;= 2,\n              &quot;and the per-user history lists what each one offered and took&quot;);\n\n        // 18. the map&#x27;s nearest free cars, and the route log that measures a trip from its own pings\n        RideService mapped = service(new GridIndex(), new CardPayment(), new NormalPricing());\n        Driver m0 = car(&quot;N0&quot;, &quot;near&quot;, VehicleType.GO, 12.9354, 77.6246), mBusy = car(&quot;N1&quot;, &quot;busy&quot;, VehicleType.GO, 12.9353, 77.6245);\n        Driver mFar = car(&quot;N2&quot;, &quot;far&quot;, VehicleType.GO, 12.9380, 77.6260), mAuto = car(&quot;N3&quot;, &quot;auto&quot;, VehicleType.AUTO, 12.9352, 77.6245);\n        for (Driver d : List.of(m0, mBusy, mFar, mAuto)) mapped.goOnline(d, d.location());\n        mBusy.reserve();\n        check(mapped.nearestFree(PICKUP, VehicleType.GO, 5).equals(List.of(m0, mFar)), &quot;the map lists free cars of the tier only, nearest first&quot;);\n        check(mapped.nearestFree(PICKUP, VehicleType.GO, 1).equals(List.of(m0)), &quot;and k = 1 keeps just the nearest&quot;);\n        RouteLog log = new RouteLog(new GridIndex());\n        RideService traced = new RideService(log);\n        traced.configure(new NearestDriver(), new NormalPricing(), new StandardCancellation(), new CardPayment());\n        traced.setClock(() -&gt; now[0]); traced.addObserver(log);\n        traced.addRider(new Rider(&quot;R1&quot;, &quot;Meera&quot;));\n        Driver v1 = car(&quot;V1&quot;, &quot;Dev&quot;, VehicleType.GO, 12.9352, 77.6245);\n        traced.goOnline(v1, v1.location());\n        traced.ping(&quot;V1&quot;, new Location(12.9353, 77.6245));                     // before any trip: belongs to no route\n        Trip routed = traced.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO).orElseThrow();\n        traced.driverArrived(routed.id()); traced.startTrip(routed.id());\n        for (int i = 1; i &lt;= 3; i++) traced.ping(&quot;V1&quot;, new Location(12.9352 + i * 0.0045, 77.6245));   // three pings ~0.5 km apart\n        now[0] += 6 * 60_000L;\n        traced.endTrip(routed.id(), log.drivenKm(routed.id()));\n        traced.ping(&quot;V1&quot;, new Location(12.9600, 77.6245));                     // after the trip: not added to it\n        check(log.routeOf(routed.id()).size() == 4, &quot;the route holds the pickup and the three pings of the ride, nothing before or after&quot;);\n        check(Math.abs(routed.distanceKm() - 1.5) &lt; 0.01, &quot;and the fare&#x27;s distance was measured from them: &quot; + String.format(&quot;%.3f&quot;, routed.distanceKm()) + &quot; km&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design the back end of Uber. A rider asks for a car, we find a nearby driver and send him, the ride runs, and at the end we charge for it. Two riders must never be given the same car. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (fleet size and straight-line-versus-routed distance first); then type in the order of Main.java: the three enums, the Money helpers, the Clock, the Location record with haversine, Rider and Vehicle, then Driver with its AtomicReference and <code>reserve()</code>, then DriverIndex and the GridIndex, then the matching and pricing interfaces with one implementation each plus the surge wrapper, then the cancellation rule, the payment gateway and the observer, then Trip with its legal-edge table, then RideService with its two claims (the rider's slot, then the car) and its two orders (claim-then-write at the start, commit-then-charge at the end), then a main with the race. If the hour runs short, the must-write core is the enums, Driver with <code>reserve()</code>, Trip with its table, NearestDriver, NormalPricing, and RideService's request, start, end and cancel, with the race in main. Scan a plain list of drivers instead of the grid, and say the grid out loud. The grid, the surge wrapper, the cancellation rule and the observer come next, in that order.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>1 &middot; Two riders tap for the same car in the same millisecond. Prove that only one of them gets it.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading a driver's status and writing it back. There is no lock: the status is an <code>AtomicReference</code> and the claim is <code>compareAndSet(AVAILABLE, RESERVED)</code>, so exactly one thread can get <code>true</code> for a given car, whatever the hardware does with the others. The proof is a count, not a log: fifty threads wait on one latch (a gate that opens for all of them at once) and all fifty request a ride against a fleet of one car, and the test asserts that exactly one trip exists. Then the same test runs with two hundred riders and forty cars and asserts forty trips and forty <i>distinct</i> drivers, which is the property that actually matters: no car was handed to two people, and no car was left idle while somebody was refused.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. the race: two riders reaching for the same car must not both get it. Fifty threads, one car,\n        //    then two hundred threads and forty cars: the count of trips must equal the count of cars exactly.\n        for (int[] size : new int[][]{{1, 50}, {40, 200}}) {\n            int cars = size[0], riders = size[1];\n            GridIndex index = new GridIndex();\n            RideService svc = service(index, new CardPayment(), new NormalPricing());\n            List&lt;Driver&gt; fleet = new ArrayList&lt;&gt;();\n            for (int i = 0; i &lt; cars; i++) {\n                Driver d = car(&quot;d&quot; + i, &quot;driver&quot; + i, VehicleType.GO, 12.9352, 77.6245);\n                svc.goOnline(d, d.location()); fleet.add(d);\n            }\n            for (int i = 0; i &lt; riders; i++) svc.addRider(new Rider(&quot;r&quot; + i, &quot;rider&quot; + i));\n            ExecutorService pool = Executors.newFixedThreadPool(16);\n            CountDownLatch go = new CountDownLatch(1);\n            List&lt;Future&lt;Optional&lt;Trip&gt;&gt;&gt; futures = new ArrayList&lt;&gt;();\n            for (int i = 0; i &lt; riders; i++) {\n                final String rid = &quot;r&quot; + i;\n                futures.add(pool.submit(() -&gt; { go.await(); return svc.requestRide(rid, PICKUP, DROP, VehicleType.GO); }));\n            }\n            go.countDown();\n            Set&lt;String&gt; claimed = new HashSet&lt;&gt;(); Set&lt;String&gt; tripIds = new HashSet&lt;&gt;();\n            for (Future&lt;Optional&lt;Trip&gt;&gt; f : futures) f.get().ifPresent(t -&gt; { claimed.add(t.driver().id()); tripIds.add(t.id()); });\n            pool.shutdown();\n            check(tripIds.size() == cars, riders + &quot; riders, &quot; + cars + &quot; car(s): exactly &quot; + cars + &quot; trips were created&quot;);\n            check(claimed.size() == cars, &quot;and no car was handed to two riders&quot;);\n            long busy = fleet.stream().filter(d -&gt; d.status() == DriverStatus.RESERVED).count();\n            check(busy == cars, &quot;every car that was claimed is RESERVED, none is still AVAILABLE&quot;);\n        }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>2 &middot; The driver ignores the request for fifteen seconds, or declines it. And can one driver be offered two rides at once?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The claim becomes an offer with a deadline. <code>offer()</code> takes the nearest free car out of the pool with the same <code>reserve()</code> compare-and-set as <code>requestRide</code>, so a driver is never offered two rides at once. Thirty riders dispatched at the same instant against three cars get exactly three offers. Each offer has one outcome, decided once by a compare-and-set away from PENDING: his accept, his decline, or the timer that expires it after fifteen seconds, whichever lands first. A decline or an expiry puts the car back, and the rider's next offer skips every driver who already saw his request. The offer object is also the ticket, so his tap on an old, expired offer is refused even when his status reads RESERVED again for a newer ride. Every offer stays in his history: that is the \"requests I accepted and declined\" screen.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the driver declines, or never taps accept -- the claim becomes an offer with a deadline\n/**\n * One ride shown on one driver&#x27;s phone until a deadline. What happens to it is decided exactly once, by a\n * compare-and-set away from PENDING, so &quot;he tapped accept&quot; and &quot;the timer ran out&quot; can arrive in the same\n * millisecond and only one of them wins. The offer object is also the ticket: a late tap on an OLD offer finds it\n * already decided, so it can never attach him to a newer ride, even though his status reads RESERVED again.\n */\nfinal class Offer {\n    enum Outcome { PENDING, ACCEPTED, DECLINED, EXPIRED }\n    private final String id, riderId;\n    private final Driver driver;\n    private final long deadlineMs;\n    private final AtomicReference&lt;Outcome&gt; outcome = new AtomicReference&lt;&gt;(Outcome.PENDING);\n\n    Offer(String id, String riderId, Driver driver, long deadlineMs) {\n        this.id = id; this.riderId = riderId; this.driver = driver; this.deadlineMs = deadlineMs;\n    }\n    String id()          { return id; }\n    String riderId()     { return riderId; }\n    Driver driver()      { return driver; }\n    long deadlineMs()    { return deadlineMs; }\n    Outcome outcome()    { return outcome.get(); }\n    /** Decide the offer, once. False if a tap or the timer already decided it. */\n    boolean decide(Outcome to) { return outcome.compareAndSet(Outcome.PENDING, to); }\n    @Override public String toString() { return id + &quot; &quot; + outcome.get(); }\n}\n\n/**\n * Dispatch with consent. offer() takes the nearest free car out of the pool with the same reserve() that\n * requestRide uses, so a driver can never be offered two rides at once: making the offer IS the compare-and-set.\n * accept() keeps the car; decline() and expireDue() put it back, and the rider&#x27;s next offer skips every driver who\n * already saw his request. Every offer stays in the driver&#x27;s history: that is his &quot;accepted and declined&quot; screen.\n */\nclass OfferDesk {\n    private final DriverIndex index;\n    private final MatchingStrategy matching;\n    private final Clock clock;\n    private final long windowMs;\n    private final AtomicLong seq = new AtomicLong();\n    private final Map&lt;String, Offer&gt; ringing = new ConcurrentHashMap&lt;&gt;();           // offer id -&gt; an undecided offer\n    private final Map&lt;String, Set&lt;String&gt;&gt; askedFor = new ConcurrentHashMap&lt;&gt;();    // rider -&gt; drivers who saw his request\n    private final Map&lt;String, List&lt;Offer&gt;&gt; history = new ConcurrentHashMap&lt;&gt;();     // driver -&gt; every offer he got\n\n    OfferDesk(DriverIndex index, MatchingStrategy matching, Clock clock, long windowMs) {\n        this.index = index; this.matching = matching; this.clock = clock; this.windowMs = windowMs;\n    }\n    /** Ring the nearest free car that has not seen this rider&#x27;s request yet. Empty when nobody is left to ask. */\n    Optional&lt;Offer&gt; offer(String riderId, Location pickup, VehicleType type) {\n        Set&lt;String&gt; asked = askedFor.computeIfAbsent(riderId, k -&gt; ConcurrentHashMap.newKeySet());\n        List&lt;Driver&gt; candidates = new ArrayList&lt;&gt;(index.nearby(pickup));\n        candidates.removeIf(d -&gt; asked.contains(d.id()));\n        while (true) {\n            Optional&lt;Driver&gt; pick = matching.select(pickup, type, candidates);\n            if (pick.isEmpty()) { askedFor.remove(riderId); return Optional.empty(); }   // a later request starts afresh\n            Driver d = pick.get();\n            if (!d.reserve()) { candidates.remove(d); continue; }    // his phone is already ringing for someone else\n            asked.add(d.id());\n            Offer o = new Offer(&quot;O&quot; + seq.incrementAndGet(), riderId, d, clock.nowMs() + windowMs);\n            ringing.put(o.id(), o);\n            history.computeIfAbsent(d.id(), k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(o);\n            return Optional.of(o);\n        }\n    }\n    /** He tapped accept. Wins only while the offer is undecided and the tap is inside the window. */\n    boolean accept(String offerId) {\n        Offer o = ringing.get(offerId);\n        if (o == null) return false;                                 // already decided: a late or a repeated tap\n        if (clock.nowMs() &gt; o.deadlineMs()) { close(o, Offer.Outcome.EXPIRED); return false; }\n        if (!o.decide(Offer.Outcome.ACCEPTED)) return false;         // the timer decided it a moment earlier\n        ringing.remove(offerId);\n        askedFor.remove(o.riderId());\n        return true;                                                 // the car stays RESERVED: the trip starts now\n    }\n    /** He tapped decline: the car goes straight back into the pool. */\n    boolean decline(String offerId) {\n        Offer o = ringing.get(offerId);\n        return o != null &amp;&amp; close(o, Offer.Outcome.DECLINED);\n    }\n    /** The timer, run every second: each offer past its deadline expires and its car goes back. Returns how many. */\n    int expireDue() {\n        int n = 0;\n        for (Offer o : ringing.values()) if (clock.nowMs() &gt; o.deadlineMs() &amp;&amp; close(o, Offer.Outcome.EXPIRED)) n++;\n        return n;\n    }\n    /** Every offer this driver got and what became of it, oldest first. */\n    List&lt;Offer&gt; historyOf(String driverId) { return List.copyOf(history.getOrDefault(driverId, List.of())); }\n\n    private boolean close(Offer o, Offer.Outcome how) {\n        if (!o.decide(how)) return false;                            // somebody else decided it first: touch nothing\n        ringing.remove(o.id());\n        o.driver().release();                                        // RESERVED -&gt; AVAILABLE, back in the pool\n        return true;\n    }\n}\n\n        // 16. offers with a deadline: never two offers for one driver, a late tap cannot take a newer offer, a decline moves on\n        GridIndex offerGrid = new GridIndex();\n        List&lt;Driver&gt; trio = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 3; i++) {\n            Driver d = car(&quot;O&quot; + i, &quot;o&quot; + i, VehicleType.GO, 12.9352 + i * 0.0005, 77.6245);\n            d.goOnline(); offerGrid.update(d, d.location()); trio.add(d);\n        }\n        OfferDesk desk = new OfferDesk(offerGrid, new NearestDriver(), () -&gt; now[0], 15_000);\n        ExecutorService dispatchers = Executors.newFixedThreadPool(8);\n        CountDownLatch ring = new CountDownLatch(1);\n        List&lt;Future&lt;Optional&lt;Offer&gt;&gt;&gt; made = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 30; i++) {\n            final String rid = &quot;q&quot; + i;\n            made.add(dispatchers.submit(() -&gt; { ring.await(); return desk.offer(rid, PICKUP, VehicleType.GO); }));\n        }\n        ring.countDown();\n        int offersMade = 0;\n        for (Future&lt;Optional&lt;Offer&gt;&gt; f : made) if (f.get().isPresent()) offersMade++;\n        dispatchers.shutdown();\n        check(offersMade == 3 &amp;&amp; trio.stream().allMatch(d -&gt; desk.historyOf(d.id()).size() == 1),\n              &quot;30 riders at once, 3 cars: exactly 3 offers, one per driver, never two at once&quot;);\n        now[0] += 16_000;\n        check(desk.expireDue() == 3 &amp;&amp; trio.stream().allMatch(d -&gt; d.status() == DriverStatus.AVAILABLE),\n              &quot;nobody tapped in 15 s: all 3 offers expired and the cars are back in the pool&quot;);\n        String staleOffer = desk.historyOf(&quot;O0&quot;).get(0).id();\n        Offer fresh = desk.offer(&quot;late-rider&quot;, PICKUP, VehicleType.GO).orElseThrow();\n        check(fresh.driver() == trio.get(0) &amp;&amp; !desk.accept(staleOffer),\n              &quot;his tap on the OLD offer is refused, although his status reads RESERVED again&quot;);\n        check(fresh.outcome() == Offer.Outcome.PENDING &amp;&amp; trio.get(0).status() == DriverStatus.RESERVED, &quot;and the new offer is untouched&quot;);\n        desk.decline(fresh.id());\n        Offer next = desk.offer(&quot;late-rider&quot;, PICKUP, VehicleType.GO).orElseThrow();\n        check(next.driver() != trio.get(0) &amp;&amp; desk.accept(next.id()), &quot;after a decline the next-nearest driver is asked, not the same one again&quot;);\n        check(desk.historyOf(&quot;O0&quot;).size() == 2 &amp;&amp; desk.historyOf(&quot;O0&quot;).get(1).outcome() == Offer.Outcome.DECLINED,\n              &quot;and his history shows what he let expire and what he declined&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>3 &middot; The rider taps Book twice because the screen did not change fast enough. What does he get?</h3><button class=\"timer\" data-min=\"6\">start 6:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One ride, and a message naming it. The rider's live-ride slot is a second claim, made before the index is even asked: <code>activeTrip.putIfAbsent(riderId, \"(matching)\")</code> returns null for exactly one caller, and any tap that finds a value already there is refused and told which trip is running. It is move 4 applied to the other end of the request, with <code>putIfAbsent</code> standing in for <code>compareAndSet</code> because the cell lives in a map rather than on an object. The slot goes back on every way out that makes no trip: no car found, or a rule or the clock throwing half-way, which a <code>finally</code> block covers along with any car already claimed. It also goes back with the car when the ride ends or is cancelled, even when the card declines. The tests fire twenty simultaneous taps at a fleet of five and count one ride and one car out of the pool, then make the rule and the clock throw and check that he can still book.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** riderId -&gt; the id of the ride he is on right now. The rider-side claim: it is what stops a double tap. */\n    private final Map&lt;String, String&gt; activeTrip = new ConcurrentHashMap&lt;&gt;();\n    /** The value parked in activeTrip while a request is still looking for a car, so a second tap sees a claim. */\n    private static final String MATCHING = &quot;(matching)&quot;;\n\n        // 9. one rider, one live ride: a second tap must not become a second car, and the slot comes back at the end\n        RideService one = service(new GridIndex(), new CardPayment(), new NormalPricing());\n        one.addRider(new Rider(&quot;R1&quot;, &quot;Meera&quot;));\n        Driver c1 = car(&quot;C1&quot;, &quot;Asha&quot;,  VehicleType.GO, 12.9352, 77.6245);\n        Driver c2 = car(&quot;C2&quot;, &quot;Bilal&quot;, VehicleType.GO, 12.9353, 77.6246);\n        one.goOnline(c1, c1.location()); one.goOnline(c2, c2.location());\n        Trip held = one.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO).orElseThrow();\n        try { one.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO); check(false, &quot;a second tap must be refused&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;the second tap is refused: &quot; + e.getMessage()); }\n        check(one.trips().size() == 1, &quot;the refused tap created no second trip&quot;);\n        check(c2.status() == DriverStatus.AVAILABLE, &quot;and it claimed no second car&quot;);\n        check(one.activeTripOf(&quot;R1&quot;).orElseThrow() == held, &quot;the app is told which ride he is already on&quot;);\n        one.driverArrived(held.id()); one.startTrip(held.id());\n        now[0] += 8 * 60_000L;\n        one.endTrip(held.id(), 3.0);\n        check(one.activeTripOf(&quot;R1&quot;).isEmpty(), &quot;when the ride ends the rider&#x27;s slot comes back&quot;);\n        check(one.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO).orElseThrow() != held, &quot;so he can book again at once&quot;);\n\n        RideService taps = service(new GridIndex(), new CardPayment(), new NormalPricing());\n        taps.addRider(new Rider(&quot;R9&quot;, &quot;Ravi&quot;));\n        List&lt;Driver&gt; five = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 5; i++) {\n            Driver d = car(&quot;F&quot; + i, &quot;spare&quot; + i, VehicleType.GO, 12.9352, 77.6245);\n            taps.goOnline(d, d.location()); five.add(d);\n        }\n        ExecutorService tapPool = Executors.newFixedThreadPool(8);\n        CountDownLatch tap = new CountDownLatch(1);\n        List&lt;Future&lt;Optional&lt;Trip&gt;&gt;&gt; taken = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 20; i++)\n            taken.add(tapPool.submit(() -&gt; {\n                tap.await();\n                try { return taps.requestRide(&quot;R9&quot;, PICKUP, DROP, VehicleType.GO); }\n                catch (IllegalStateException refused) { return Optional.&lt;Trip&gt;empty(); }   // the rider slot was taken\n            }));\n        tap.countDown();\n        int rides = 0;\n        for (Future&lt;Optional&lt;Trip&gt;&gt; f : taken) if (f.get().isPresent()) rides++;\n        tapPool.shutdown();\n        check(rides == 1, &quot;twenty simultaneous taps from one rider produced exactly one ride&quot;);\n        check(five.stream().filter(d -&gt; d.status() != DriverStatus.AVAILABLE).count() == 1,\n              &quot;and exactly one of the five cars left the pool: putIfAbsent decided, not luck&quot;);\n\n        // 10. something throws half-way through a request: the rider&#x27;s slot and any car it claimed are handed back\n        boolean[] routingDown = { true };\n        RideService fragile = new RideService(new GridIndex());\n        fragile.configure((p, type, cands) -&gt; {\n            if (routingDown[0]) throw new IllegalStateException(&quot;routing service timed out&quot;);\n            return new NearestDriver().select(p, type, cands);\n        }, new NormalPricing(), new StandardCancellation(), new CardPayment());\n        boolean[] clockDown = { false };\n        fragile.setClock(() -&gt; { if (clockDown[0]) { clockDown[0] = false; throw new IllegalStateException(&quot;clock unavailable&quot;); } return now[0]; });\n        fragile.addRider(new Rider(&quot;R1&quot;, &quot;Meera&quot;));\n        Driver only = car(&quot;X1&quot;, &quot;Asha&quot;, VehicleType.GO, 12.9352, 77.6245);\n        fragile.goOnline(only, only.location());\n        try { fragile.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO); check(false, &quot;a request whose rule throws must throw&quot;); }\n        catch (IllegalStateException e) { check(e.getMessage().contains(&quot;routing&quot;), &quot;the rule&#x27;s failure reaches the caller: &quot; + e.getMessage()); }\n        routingDown[0] = false;\n        clockDown[0] = true;                                                  // this time it fails AFTER the car is claimed\n        try { fragile.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO); check(false, &quot;a request whose clock throws must throw&quot;); }\n        catch (IllegalStateException e) { check(e.getMessage().contains(&quot;clock&quot;), &quot;a failure after the car was claimed reaches the caller too&quot;); }\n        check(only.status() == DriverStatus.AVAILABLE, &quot;and the car it had claimed is back in the pool, not stuck RESERVED&quot;);\n        boolean rebooked;\n        try { rebooked = fragile.requestRide(&quot;R1&quot;, PICKUP, DROP, VehicleType.GO).isPresent(); }\n        catch (IllegalStateException e) { rebooked = false; }\n        check(rebooked, &quot;and his slot came back, so his next tap books a car instead of &#x27;already has a ride&#x27;&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; The card declines after the ride is over, or the gateway times out. What is the state of the system?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Recorded, consistent, and retryable. A ride cannot be un-driven, so the order at the end is the opposite of the order at the start. Check the distance and price it (which writes nothing); record that the ride ended and free the car in one locked step; free the rider's slot; only then call the gateway, outside every lock, with the trip id as the idempotency key. A decline leaves the trip at COMPLETED_UNPAID with its fare stored and the driver already AVAILABLE, and <code>retryPayment</code> finishes it later. A timeout is the harder case, because the money may have moved: the retry sends the same key, so the gateway hands back the first charge instead of taking it twice, and the failure test fakes exactly that. <code>retryPayment</code> also refuses any trip that is not COMPLETED_UNPAID <i>before</i> it calls the gateway. An early retry on a running ride would otherwise spend the key on a fare of zero, and the real fare would never be charged.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The other critical step, and it has the opposite shape to the first one. Claiming a driver had to happen\n     * BEFORE anything was written; a ride cannot be un-driven, so here the ride is committed first and the money\n     * follows. The order is: check the distance, price it (writes nothing, and it may throw), then under the trip&#x27;s\n     * monitor record that the ride ended AND put the car back in the pool, and only then call the gateway, outside\n     * every lock, with the trip id as the idempotency key. A declined card leaves the trip COMPLETED_UNPAID, the\n     * driver free and the rider free to book again; retryPayment finishes the money later, and charges once. Money\n     * trouble must never hold a car, or a rider, hostage.\n     */\n    Trip endTrip(String tripId, double distanceKm) {\n        if (!(distanceKm &gt;= 0) || Double.isInfinite(distanceKm))                    // NaN fails the &gt;= test too\n            throw new IllegalArgumentException(&quot;a driven distance must be a number &gt;= 0, got &quot; + distanceKm);\n        Trip t = trip(tripId);\n        long now = clock.nowMs();\n        long mins = Math.max(1, Math.round((now - t.startedAtMs()) / 60_000.0));      // every ride bills at least a minute\n        long fare = pricing.price(new FareBasis(t.type(), distanceKm, mins, t.pickup(), now));\n        synchronized (t) {\n            t.ended(distanceKm, mins, fare, now);                                    // guarded: a second endTrip throws\n            t.driver().release();                                                    // the car is free before the money\n        }\n        activeTrip.remove(t.rider().id(), t.id());                                   // and so is the rider&#x27;s one-ride slot\n        publish(t, TripStatus.IN_PROGRESS, TripStatus.COMPLETED_UNPAID);\n        settle(t);\n        return t;\n    }\n\n    /**\n     * Try the money again on a trip the gateway refused. Refused BEFORE the gateway is called unless the trip is\n     * COMPLETED_UNPAID, so a retry can never send the trip&#x27;s key with a fare that is not final yet.\n     */\n    Trip retryPayment(String tripId) {\n        Trip t = trip(tripId);\n        if (t.status() != TripStatus.COMPLETED_UNPAID)\n            throw new IllegalStateException(t.id() + &quot; has nothing to charge: it is &quot; + t.status());\n        settle(t);\n        return t;\n    }\n\n    /** Charge a finished, unpaid trip once. Status and fare are read together, under the lock ended() wrote them in. */\n    private void settle(Trip t) {\n        long fare;\n        synchronized (t) {\n            if (t.status() != TripStatus.COMPLETED_UNPAID) return;            // a racing settle already finished it\n            fare = t.farePaise();\n        }\n        String ref;\n        try {\n            ref = payments.charge(t.rider().id(), fare, &quot;trip:&quot; + t.id());          // outside every lock\n        } catch (PaymentDeclined e) {\n            System.out.println(&quot;[unpaid] &quot; + t.id() + &quot; &quot; + Money.fmt(fare) + &quot;: &quot; + e.getMessage());\n            return;\n        }\n        if (t.paid(ref)) publish(t, TripStatus.COMPLETED_UNPAID, TripStatus.COMPLETED);\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; Cancellation. Who pays, and how do you know the fleet is not quietly draining?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The fee is a rule, not an if-chain: the policy is handed the state the trip is being cancelled in and how long the rider has waited, and returns paise. It is free while nobody has been sent, free for two more minutes because the driver has only just set off, and thirty rupees once he is really coming. The order is the usual one: work out the fee, run the guarded transition (it throws, changing nothing, if the meter is already running) and free the car in the same locked step, then charge the fee outside any lock. Reading the state and cancelling in it must be one step, inside the trip's own monitor. Split them and a rider who cancels in the same instant the driver reaches the kerb is priced as ASSIGNED, free, on a trip that has already become ARRIVED. Draining is the failure nobody tests for: every path that takes a car out of the pool has a matching <code>release()</code> in the same method, and the tests check the driver is AVAILABLE again after each one. A declined fee is only logged here; a real app adds it to the rider's next ride.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Free while nobody has been sent and for two minutes after that; thirty rupees once the driver is really coming. */\nclass StandardCancellation implements CancellationPolicy {\n    private static final long GRACE_MS = 2 * 60 * 1000L;\n    private static final long FEE = Money.rupees(&quot;30.00&quot;);\n    public long feePaise(TripStatus cancelledIn, long waitedMs) {\n        if (cancelledIn == TripStatus.REQUESTED) return 0;                       // no driver was ever claimed\n        if (cancelledIn == TripStatus.ASSIGNED &amp;&amp; waitedMs &lt; GRACE_MS) return 0; // he had only just set off\n        return FEE;                                                             // en route, or already waiting at the kerb\n    }\n}\n\n/**\n     * Call the ride off. The fee depends on the state the trip is being cancelled IN, so reading that state and\n     * cancelling must be ONE step: they run inside the trip&#x27;s own monitor, the same one transitionTo holds. Split\n     * them and a cancel racing the driver&#x27;s arrival reads ASSIGNED, prices the cancellation free, and then cancels\n     * a trip that has meanwhile reached ARRIVED -- a kerbside cancellation given away. The car goes back in the same\n     * locked step and the rider&#x27;s slot right after, because every path that takes a driver out must put him back or\n     * the fleet drains. A declined fee is only logged here; nothing retries it.\n     */\n    Trip cancelTrip(String tripId) {\n        Trip t = trip(tripId);\n        TripStatus from;\n        long fee;\n        synchronized (t) {                                                   // re-entrant: transitionTo takes this same lock\n            from = t.status();\n            fee = cancellation.feePaise(from, clock.nowMs() - t.requestedAtMs());\n            t.cancelled(fee);                                                // validated before anything else moves\n            t.driver().release();\n        }\n        activeTrip.remove(t.rider().id(), t.id());\n        if (fee &gt; 0) {\n            try { payments.charge(t.rider().id(), fee, &quot;cancel:&quot; + t.id()); }\n            catch (PaymentDeclined e) { System.out.println(&quot;[unpaid fee] &quot; + t.id() + &quot;: &quot; + e.getMessage()); }\n        }\n        publish(t, from, TripStatus.CANCELLED);\n        return t;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>6 &middot; The airport is busy: charge 1.8x there between six and nine. Do it without opening the fare formula.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Surge is not a flag inside <code>NormalPricing</code>; it is a second pricing rule that holds the first one and multiplies whatever it charged. So a time-and-place surge is a <code>SurgeSource</code> &mdash; one method that returns basis points, reading the pickup and the timestamp it was handed &mdash; and the fare rule itself is not touched. Basis points are ten-thousandths: 10,000 means 1.0x and 18,000 means 1.8x, so the multiplier is a whole number and the arithmetic stays exact. Because the wrapper is itself a <code>PricingStrategy</code>, a coupon wraps the surge and a toll wraps the coupon, and the order of the stack is visible where it is built. The zone version in Extensions.java divides the requests of the last five minutes by the free cars, both counted over the same nine cells.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Surge as a wrapper, not a flag: it takes whatever the base rule charged and multiplies it. Because it IS a\n * PricingStrategy and HOLDS a PricingStrategy, coupons and tolls stack the same way without anybody editing the\n * base formula. 10000 basis points is 1.0x, so a wrapper with no surge is exactly the base fare.\n */\nclass SurgePricing implements PricingStrategy {\n    private final PricingStrategy base;\n    private final SurgeSource surge;\n    SurgePricing(PricingStrategy base, SurgeSource surge) { this.base = base; this.surge = surge; }\n    public long price(FareBasis b) {\n        int bp = surge.basisPoints(b);\n        if (bp &lt; 10_000) throw new IllegalArgumentException(&quot;surge cannot be a discount: &quot; + bp + &quot; bp&quot;);\n        return Math.multiplyExact(base.price(b), (long) bp) / 10_000;       // truncates: the rider keeps the half paisa\n    }\n}\n\n// ---- ext: real surge -- the multiplier comes from the numbers the index already holds\n/** How many rides were asked for around a place lately: a sliding window of timestamps per grid cell. */\nclass DemandCounter {\n    private final Map&lt;String, Deque&lt;Long&gt;&gt; byCell = new ConcurrentHashMap&lt;&gt;();\n    private final long windowMs;\n    DemandCounter(long windowMs) { this.windowMs = windowMs; }\n    /** Record one request in its cell. O(1) amortised. */\n    void record(Location where, long nowMs) {\n        Deque&lt;Long&gt; q = byCell.computeIfAbsent(cell(where, 0, 0), k -&gt; new ConcurrentLinkedDeque&lt;&gt;());\n        q.addLast(nowMs);\n        trim(q, nowMs);\n    }\n    /** Requests inside the window over the SAME nine cells the index hands to matching: demand and supply, one area. */\n    int recent(Location where, long nowMs) {\n        int n = 0;\n        for (int dLat = -1; dLat &lt;= 1; dLat++)\n            for (int dLng = -1; dLng &lt;= 1; dLng++) {\n                Deque&lt;Long&gt; q = byCell.get(cell(where, dLat, dLng));\n                if (q != null) { trim(q, nowMs); n += q.size(); }\n            }\n        return n;\n    }\n    private void trim(Deque&lt;Long&gt; q, long nowMs) {\n        Long head;\n        while ((head = q.peekFirst()) != null &amp;&amp; head &lt; nowMs - windowMs) q.pollFirst();\n    }\n    private static String cell(Location l, int dLat, int dLng) {\n        return ((long) Math.floor(l.lat() / 0.01) + dLat) + &quot;:&quot; + ((long) Math.floor(l.lng() / 0.01) + dLng);\n    }\n}\n\n/**\n * Surge by area and minute: riders wanting a car divided by cars available, clamped between 1.0x and 3.0x. It\n * reads the index and the demand counter and nothing else, so the service never learns what surge is.\n */\nclass ZoneSurge implements SurgeSource {\n    private final DriverIndex index;\n    private final DemandCounter demand;\n    ZoneSurge(DriverIndex index, DemandCounter demand) { this.index = index; this.demand = demand; }\n    public int basisPoints(FareBasis b) {\n        int supply = 0;\n        for (Driver d : index.nearby(b.pickup())) if (d.status() == DriverStatus.AVAILABLE) supply++;\n        int want = demand.recent(b.pickup(), b.atMs());\n        if (supply == 0) return want &gt; 0 ? 30_000 : 10_000;\n        int bp = (int) Math.min(30_000L, 10_000L * want / supply);\n        return Math.max(10_000, bp);                                 // never a discount; that is a coupon&#x27;s job\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>7 &middot; Persist it: the tables first, then two servers.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Start with the tables, one fact in one place: rider, vehicle, driver (with its status), trip, offer and payment. The offer table answers \"which requests did this driver accept and decline\" with one query, and the payment table carries the idempotency key under a unique constraint. The service's code does not change, only what it is handed. The interesting half is the claim: a JVM's <code>AtomicReference</code> cannot arbitrate between two processes, so it becomes <code>UPDATE driver SET status='RESERVED' WHERE id=? AND status='AVAILABLE'</code> &mdash; one row updated means you won, zero means somebody else did, which is compare-and-set done by the database. The rider's slot becomes a unique index over open trips (the database refuses a second open trip for the same rider). The guarded transition becomes an UPDATE with the old status in the WHERE clause, so two settlement workers cannot both complete one ride.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- the compare-and-set becomes a conditional UPDATE, which is the same thing\n/**\n * Beyond one process the driver&#x27;s status cell cannot live in a JVM. It becomes a row, and the compare-and-set\n * becomes a conditional UPDATE: the database does exactly what the AtomicReference did, for the whole fleet.\n */\ninterface TripRepository {\n    /** Write a trip once. False means this id already existed, which is what makes a client retry safe. */\n    boolean insert(String tripId, String riderId, String driverId, TripStatus status);\n    /** Move a trip only if it is still in `from`. The guarded transition, in the database. */\n    boolean compareAndSetStatus(String tripId, TripStatus from, TripStatus to);\n    /** What a trip&#x27;s status is now, or empty if there is no such trip. */\n    Optional&lt;TripStatus&gt; statusOf(String tripId);\n}\n\n/** The in-memory implementation, which is the same two operations the service already performs, wearing a coat. */\nclass InMemoryTripRepository implements TripRepository {\n    private final Map&lt;String, TripStatus&gt; status = new ConcurrentHashMap&lt;&gt;();\n    public boolean insert(String tripId, String riderId, String driverId, TripStatus s) {\n        return status.putIfAbsent(tripId, s) == null;\n    }\n    public boolean compareAndSetStatus(String tripId, TripStatus from, TripStatus to) {\n        return status.replace(tripId, from, to);\n    }\n    public Optional&lt;TripStatus&gt; statusOf(String tripId) { return Optional.ofNullable(status.get(tripId)); }\n}\n// the tables, one fact in one place (normalised):\n//   rider(id PK, name)        vehicle(id PK, plate UNIQUE, type)        driver(id PK, name, vehicle_id FK, status)\n//   trip(id PK, rider_id FK, driver_id FK, status, pickup, drop, km, minutes, fare_paise, fee_paise)\n//   offer(id PK, trip_id FK, driver_id FK, outcome, offered_at)     -- &quot;what did he accept and decline&quot; is one SELECT\n//   payment(id PK, trip_id FK, idempotency_key UNIQUE, paise, gateway_ref, status)\n// the same operations in SQL, and the service&#x27;s code does not change, only what it was handed:\n//   UPDATE driver SET status = &#x27;RESERVED&#x27; WHERE id = ? AND status = &#x27;AVAILABLE&#x27;;\n//     -- 1 row updated means you won the car; 0 rows means somebody else did. That IS compareAndSet.\n//   INSERT INTO trip (id, rider_id, driver_id, status) VALUES (?,?,?,&#x27;ASSIGNED&#x27;) ON CONFLICT (id) DO NOTHING;\n//     -- 0 rows inserted means a retried request: stop, the trip already exists\n//   CREATE UNIQUE INDEX one_live_ride ON trip (rider_id) WHERE status NOT IN (&#x27;COMPLETED_UNPAID&#x27;,&#x27;COMPLETED&#x27;,&#x27;CANCELLED&#x27;);\n//     -- the rider&#x27;s one-ride slot: a second open trip for him fails on the insert\n//   UPDATE trip SET status = &#x27;COMPLETED&#x27;, payment_ref = ? WHERE id = ? AND status = &#x27;COMPLETED_UNPAID&#x27;;\n//     -- the guarded transition, so two settlement workers cannot both complete the same trip\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; The car-pool version (Swiggy, MakeMyTrip): users offer seats from Bangalore to Mysore, and a passenger picks one by preference.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The same name, a different prompt, and no map at all. A ride is offered with a vehicle, seats, origin, destination, start and duration; the route is the key of a map, so finding the rides on it is one lookup. Each preference (earliest ending, shortest, most vacant) is an enum constant that carries its own comparator, so a new preference is one more constant, and a preferred vehicle is a filter before the sort. Two rules carry the round, and both are move 4 again: a vehicle has one open ride (<code>putIfAbsent</code> on the vehicle), and a seat is never sold twice (a compare-and-set loop on the seats left). Twenty passengers racing for three seats seat exactly three. The sort reads a copy of the seat counts taken at search time, because sorting on numbers that change mid-sort can make Java's sort throw; if the chosen ride fills up meanwhile, the next one is tried. Ending a ride frees the vehicle for its next offer, and two maps answer \"the rides this user offered and took\".</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the car-pool version -- users offer seats on a route, others pick one by preference\n/**\n * The other prompt companies call &quot;ride sharing&quot; (a Swiggy / MakeMyTrip machine-coding round): no map and no\n * radius. A user OFFERS a ride -- vehicle, seats, origin, destination, start, duration -- and another user SELECTS\n * one of the open rides on that route by a preference. Two rules carry the round: a vehicle has at most one open\n * ride, and a seat is never sold twice. Both are move 4 again: putIfAbsent on the vehicle, compare-and-set on seats.\n */\nclass CarPool {\n    /** One offered ride. seatsLeft is the contended cell, so it only ever moves by compare-and-set. */\n    static final class Ride {\n        final String id, driver, vehicle, origin, destination;\n        final long startMs, durationMs;\n        private final AtomicInteger seatsLeft;\n        private volatile boolean ended;\n        Ride(String id, String driver, String vehicle, String origin, String destination, long startMs, long durationMs, int seats) {\n            this.id = id; this.driver = driver; this.vehicle = vehicle; this.origin = origin; this.destination = destination;\n            this.startMs = startMs; this.durationMs = durationMs; this.seatsLeft = new AtomicInteger(seats);\n        }\n        long endMs()    { return startMs + durationMs; }\n        int seatsLeft() { return seatsLeft.get(); }\n        /** Take n seats in one step, or none at all. */\n        boolean take(int n) {\n            while (true) {\n                int left = seatsLeft.get();\n                if (ended || left &lt; n) return false;\n                if (seatsLeft.compareAndSet(left, left - n)) return true;   // lost to another passenger: read again\n            }\n        }\n        @Override public String toString() { return id + &quot; &quot; + vehicle + &quot; &quot; + origin + &quot;-&gt;&quot; + destination + &quot; left &quot; + seatsLeft.get(); }\n    }\n    /** A ride as it looked when the passenger searched. Sorting reads this copy, never a count that moves mid-sort. */\n    record Seen(Ride ride, int left) {}\n    /** How a passenger chooses among the open rides on his route: the enum carries the order, one constant each. */\n    enum Preference {\n        EARLIEST_ENDING(Comparator.comparingLong((Seen s) -&gt; s.ride().endMs())),\n        LOWEST_DURATION(Comparator.comparingLong((Seen s) -&gt; s.ride().durationMs)),\n        MOST_VACANT(Comparator.comparingInt(Seen::left).reversed());\n        final Comparator&lt;Seen&gt; order;\n        Preference(Comparator&lt;Seen&gt; order) { this.order = order; }\n    }\n\n    private final AtomicLong seq = new AtomicLong();\n    private final Map&lt;String, Ride&gt; rides = new ConcurrentHashMap&lt;&gt;();              // ride id -&gt; ride\n    private final Map&lt;String, List&lt;Ride&gt;&gt; byRoute = new ConcurrentHashMap&lt;&gt;();      // &quot;origin-&gt;destination&quot; -&gt; rides\n    private final Map&lt;String, Ride&gt; openByVehicle = new ConcurrentHashMap&lt;&gt;();      // vehicle -&gt; its one open ride\n    private final Map&lt;String, List&lt;Ride&gt;&gt; offered = new ConcurrentHashMap&lt;&gt;(), taken = new ConcurrentHashMap&lt;&gt;();\n\n    /** Offer a ride. Refused if this vehicle already has one open: putIfAbsent decides between two taps. */\n    Ride offer(String driver, String vehicle, int seats, String origin, String destination, long startMs, long durationMs) {\n        if (seats &lt;= 0 || durationMs &lt;= 0) throw new IllegalArgumentException(&quot;a ride needs seats and a duration&quot;);\n        Ride r = new Ride(&quot;P&quot; + seq.incrementAndGet(), driver, vehicle, origin, destination, startMs, durationMs, seats);\n        if (openByVehicle.putIfAbsent(vehicle, r) != null)\n            throw new IllegalStateException(vehicle + &quot; already has an open ride&quot;);\n        rides.put(r.id, r);\n        byRoute.computeIfAbsent(origin + &quot;-&gt;&quot; + destination, k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(r);\n        offered.computeIfAbsent(driver, k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(r);\n        return r;\n    }\n    /**\n     * Take seats on the best open ride of this route by the passenger&#x27;s preference (and vehicle, if he named one).\n     * If someone takes the last seats in between, the next-best ride is tried: the loser never waits.\n     */\n    Optional&lt;Ride&gt; select(String passenger, String origin, String destination, int seats, Preference pref, String vehicle) {\n        if (seats &lt;= 0) throw new IllegalArgumentException(&quot;ask for at least one seat&quot;);\n        List&lt;Seen&gt; open = new ArrayList&lt;&gt;();\n        for (Ride r : byRoute.getOrDefault(origin + &quot;-&gt;&quot; + destination, List.of())) {\n            int left = r.seatsLeft();\n            if (!r.ended &amp;&amp; left &gt;= seats &amp;&amp; !r.driver.equals(passenger) &amp;&amp; (vehicle == null || r.vehicle.equals(vehicle)))\n                open.add(new Seen(r, left));\n        }\n        open.sort(pref.order);\n        for (Seen s : open)\n            if (s.ride().take(seats)) {\n                taken.computeIfAbsent(passenger, k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(s.ride());\n                return Optional.of(s.ride());\n            }\n        return Optional.empty();\n    }\n    /** The driver ends the ride: no seat is sold after this, and the vehicle may offer a new ride. */\n    void end(String rideId) {\n        Ride r = rides.get(rideId);\n        if (r == null) throw new NoSuchElementException(&quot;no ride &quot; + rideId);\n        r.ended = true;\n        r.seatsLeft.set(0);                                          // a take() racing this end now fails its CAS\n        openByVehicle.remove(r.vehicle, r);\n    }\n    /** Every ride this user offered. */\n    List&lt;Ride&gt; offeredBy(String user) { return List.copyOf(offered.getOrDefault(user, List.of())); }\n    /** Every ride this user took a seat on. */\n    List&lt;Ride&gt; takenBy(String user)   { return List.copyOf(taken.getOrDefault(user, List.of())); }\n}\n\n        // 17. the car-pool version: a seat is never sold twice, and a vehicle has one open ride\n        CarPool carPool = new CarPool();\n        CarPool.Ride swift = carPool.offer(&quot;John&quot;, &quot;KA-09-32321&quot;, 3, &quot;Bangalore&quot;, &quot;Mysore&quot;, now[0], 3 * 3_600_000L);\n        ExecutorService passengers = Executors.newFixedThreadPool(8);\n        CountDownLatch doors = new CountDownLatch(1);\n        List&lt;Future&lt;Optional&lt;CarPool.Ride&gt;&gt;&gt; seats = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 20; i++) {\n            final String p = &quot;p&quot; + i;\n            seats.add(passengers.submit(() -&gt; { doors.await(); return carPool.select(p, &quot;Bangalore&quot;, &quot;Mysore&quot;, 1, CarPool.Preference.MOST_VACANT, null); }));\n        }\n        doors.countDown();\n        int seated = 0;\n        for (Future&lt;Optional&lt;CarPool.Ride&gt;&gt; f : seats) if (f.get().isPresent()) seated++;\n        passengers.shutdown();\n        check(seated == 3 &amp;&amp; swift.seatsLeft() == 0, &quot;20 passengers at once for 3 seats: exactly 3 seated, none oversold&quot;);\n        try { carPool.offer(&quot;John&quot;, &quot;KA-09-32321&quot;, 2, &quot;Bangalore&quot;, &quot;Mysore&quot;, now[0], 3_600_000L); check(false, &quot;a second open ride on one vehicle must be refused&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;a second open ride on the same vehicle is refused&quot;); }\n        carPool.end(swift.id);\n        check(carPool.offer(&quot;John&quot;, &quot;KA-09-32321&quot;, 2, &quot;Mysore&quot;, &quot;Bangalore&quot;, now[0], 3_600_000L) != null,\n              &quot;once the ride ends, the vehicle can offer the next one&quot;);\n        check(carPool.offeredBy(&quot;John&quot;).size() == 2 &amp;&amp; carPool.takenBy(&quot;p0&quot;).size() + carPool.takenBy(&quot;p1&quot;).size() &lt;= 2,\n              &quot;and the per-user history lists what each one offered and took&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>9 &middot; Nykaa&#x27;s version: show the rider the five nearest cars, give out rides first come first served, and keep the exact route of every trip.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The five nearest are <code>nearestFree(pickup, type, 5)</code> on the service: the same nine-cell read as matching, then a heap that keeps the five nearest, so O(c log 5) for c cars nearby, and it changes nothing. First come, first served is how claims already settle: requests are never batched or reordered, and whichever compare-and-set lands first gets the car. A strict line by tap time, for when every car is busy, is a queue per area that a freed car serves before any newcomer; the food-delivery page builds that kind of line for orders waiting for a rider. The route is <code>RouteLog</code>, a wrapper around the index (it is a <code>DriverIndex</code> and holds one), so every ping passes through it. A ping from a driver on a trip is appended to that trip's list, and a trip observer opens and closes the list. The route also gives the fare a distance measured by the server, from the pings, instead of a number typed in by the driver's app.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * What the rider&#x27;s map shows before he books: the k nearest FREE cars of his tier, nearest first. The same nine\n     * cells as matching, then a heap that keeps only the k nearest, so it costs O(c log k) for c cars nearby. Each\n     * distance is read once, so a ping landing mid-sort cannot upset the order. Changes nothing.\n     */\n    List&lt;Driver&gt; nearestFree(Location pickup, VehicleType type, int k) {\n        if (k &lt;= 0) return List.of();\n        Comparator&lt;Map.Entry&lt;Driver, Double&gt;&gt; byKm = Map.Entry.comparingByValue();\n        PriorityQueue&lt;Map.Entry&lt;Driver, Double&gt;&gt; keep = new PriorityQueue&lt;&gt;(byKm.reversed());   // farthest on top\n        for (Driver d : index.nearby(pickup)) {\n            if (d.status() != DriverStatus.AVAILABLE || d.vehicle().type() != type) continue;\n            keep.add(Map.entry(d, d.location().distanceKm(pickup)));\n            if (keep.size() &gt; k) keep.poll();                               // drop the farthest: k stay\n        }\n        List&lt;Map.Entry&lt;Driver, Double&gt;&gt; out = new ArrayList&lt;&gt;(keep);\n        out.sort(byKm);\n        return out.stream().map(Map.Entry::getKey).toList();\n    }\n\n// ---- ext: the route each trip took -- Nykaa&#x27;s &quot;location history along with the exact route taken&quot;\n/**\n * The pings already arrive; the only question is where to keep the ones that belong to a trip. RouteLog IS a\n * DriverIndex and HOLDS one (a wrapper, like SurgePricing), so every ping passes through it on its way to the grid,\n * and it is also a TripObserver, which is how it learns when a trip starts and ends. The service changes by one\n * line: which index it is handed. The route also gives the fare a distance measured by the server, not a number\n * typed in by the driver&#x27;s app.\n */\nclass RouteLog implements DriverIndex, TripObserver {\n    private final DriverIndex inner;\n    private final Map&lt;String, List&lt;Location&gt;&gt; openRoute = new ConcurrentHashMap&lt;&gt;();  // driver -&gt; the route he is driving\n    private final Map&lt;String, List&lt;Location&gt;&gt; routes = new ConcurrentHashMap&lt;&gt;();     // trip -&gt; every point, in order\n    RouteLog(DriverIndex inner) { this.inner = inner; }\n\n    public void update(Driver d, Location where) {\n        inner.update(d, where);\n        List&lt;Location&gt; route = openRoute.get(d.id());\n        if (route != null) route.add(where);                          // one append per ping, only while on a trip\n    }\n    public void remove(Driver d) { inner.remove(d); }\n    public List&lt;Driver&gt; nearby(Location pickup) { return inner.nearby(pickup); }\n\n    /** The meter starts: open a route at the pickup. The car stops: close it. Called after the move, like any observer. */\n    public void onTrip(Trip t, TripStatus from, TripStatus to) {\n        if (to == TripStatus.IN_PROGRESS) {\n            List&lt;Location&gt; route = Collections.synchronizedList(new ArrayList&lt;&gt;(List.of(t.pickup())));\n            routes.put(t.id(), route);\n            openRoute.put(t.driver().id(), route);\n        } else if (to == TripStatus.COMPLETED_UNPAID) {\n            List&lt;Location&gt; route = routes.get(t.id());\n            if (route != null) openRoute.remove(t.driver().id(), route);\n        }\n    }\n    /** The exact route of one trip, as it was pinged. */\n    List&lt;Location&gt; routeOf(String tripId) {\n        List&lt;Location&gt; r = routes.getOrDefault(tripId, List.of());\n        synchronized (r) { return List.copyOf(r); }\n    }\n    /** Kilometres along the pings, point to point. Real GPS jitters, so production smooths or snaps it to roads first. */\n    double drivenKm(String tripId) {\n        List&lt;Location&gt; r = routeOf(tripId);\n        double km = 0;\n        for (int i = 1; i &lt; r.size(); i++) km += r.get(i - 1).distanceKm(r.get(i));\n        return km;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Nearest-first starves the car at the hotspot&#x27;s edge, a river is in the way, and the rider wants minutes by vehicle type.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Each is a new rule behind an interface, and none touches the service. Starvation: among the cars within five kilometres, send the one idle longest; distance stays the first filter, because fairness across a whole city is a rider waiting twenty minutes. The river: the rule asks an injected <code>RouteProvider</code> for travel time and sends the car that will <i>arrive</i> first, often not the nearest. Minutes by vehicle (Paytm's version of the question): <code>EtaByVehicle</code> keeps one <code>RouteProvider</code> per tier in an <code>EnumMap</code>, so an auto and a GO on the same spot two kilometres out get 540 and 405 seconds. \"Three minutes away\" is never stored: it is worked out when the screen asks, from the driver's last ping and the trip's status (to the kerb before the rider is in, to the destination after). A stored ETA would need fifteen thousand pings a second copied out to every open app.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: fairness -- nearest-first starves the car parked at the edge of the hotspot\n/**\n * Ops says the same few cars keep winning while a driver two streets out waits an hour. This is a NEW matching\n * rule and one line where the service is built: among the cars that are close enough, send the one who has been\n * idle longest. Distance is still the first filter, because fairness inside a five-kilometre radius is fair;\n * fairness across a city is a rider waiting twenty minutes.\n */\nclass LongestIdleMatching implements MatchingStrategy {\n    private static final double MAX_PICKUP_KM = 5.0;\n    private final Map&lt;String, Long&gt; idleSince = new ConcurrentHashMap&lt;&gt;();\n    private final Clock clock;\n    LongestIdleMatching(Clock clock) { this.clock = clock; }\n    /** Called when a driver comes back into the pool; stamps the start of his wait. */\n    void onAvailable(String driverId) { idleSince.put(driverId, clock.nowMs()); }\n    public Optional&lt;Driver&gt; select(Location pickup, VehicleType type, List&lt;Driver&gt; candidates) {\n        Driver best = null; long bestStamp = Long.MAX_VALUE;\n        for (Driver d : candidates) {\n            if (d.status() != DriverStatus.AVAILABLE || d.veh

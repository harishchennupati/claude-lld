ll=\"var(--muted)\">wanted by that trip's rider and its driver</text></g><path d=\"M570 95 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"605\" y=\"85\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">no lock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">everything else runs fully in parallel</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the nine-cell read: ~900 cars handed over, ~4 us</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the min-scan over them: about 5 us</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the card payment: about 500 ms, no lock held</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the push notifications: ~50 ms, afterwards</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">the person choosing a destination: seconds</text></g><text x=\"615\" y=\"200\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">four hundred riders tap in the same second</text><g transform=\"translate(30 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rider 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">0 retries</text></g><g transform=\"translate(148 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rider 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">0 retries</text></g><g transform=\"translate(266 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rider 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">0 retries</text></g><g transform=\"translate(384 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rider 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">0 retries</text></g><g transform=\"translate(502 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rider 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">0 retries</text></g><g transform=\"translate(620 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rider 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">0 retries</text></g><g transform=\"translate(738 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rider 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">0 retries</text></g><g transform=\"translate(856 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rider 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">0 retries</text></g><g transform=\"translate(974 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rider 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">0 retries</text></g><g transform=\"translate(1092 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rider 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">1 retry, ~5 us</text></g><text x=\"615\" y=\"283\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">nobody queues. The one rider who reached for a car another rider had already won is the only one who does extra work,</text><text x=\"615\" y=\"301\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and that work is one failed instruction and a second scan of his own candidate list: about five microseconds</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself: have you now made dispatch one-at-a-time? No, and this is the part worth being precise about. There is no lock anywhere in the matching path. The nine-cell read, the scan over the nine hundred cars it returns, the choice, the trip object, the notifications &mdash; all of it runs fully in parallel across every rider in the city. The only places two riders can collide are two atomic steps of tens of nanoseconds each: the compare-and-set on a driver's status, which involves only the riders who reached for the same car, and the <code>putIfAbsent</code> on a rider's slot, which involves only that one rider's own taps. The one real lock in the system is a trip's own monitor (the lock every Java object carries, taken with <code>synchronized</code>), wanted by exactly two people, that trip's rider and that trip's driver. <code>transitionTo</code> holds it, and so do start, end and cancel, so that a trip and its car always change in one step. Each holds it for well under a microsecond. Cancelling needs it most: it reads the state the trip is in, prices the fee from it and then cancels, and those three have to be one step. Split them and a rider who cancels at the exact moment the driver reaches the kerb is priced as if nobody had come. Everything slow is outside every one of them: the card at around five hundred milliseconds, the push at fifty. When four hundred riders tap in the same second, none waits for another.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the scan, not the claim, is what this costs</text><text x=\"35\" y=\"62\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">60,000 cars over a 700 km2 city: about 85 per km2</text><text x=\"35\" y=\"86\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">nine 1.1 km cells = 11 km2, so a read hands over ~900 cars</text><text x=\"35\" y=\"110\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">measured on a laptop: read 4 us + scan 5 us; a request ~20 us</text><text x=\"35\" y=\"134\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">400 requests a second x 20 us = 8 ms: under 1% of one core</text><text x=\"35\" y=\"158\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">pings: 15,000 a second, of which ~400 cross a cell</text><text x=\"35\" y=\"182\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the two claims cost tens of ns each, once per ride</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 keep the card and the push outside everything</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: the money runs with no lock held</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 finer cells where the city is dense</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">downtown a read hands over 4,000 cars: quadtree, geohash, S2</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 shard by zone, across processes</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE driver SET status='RESERVED' WHERE id=? AND status='AVAILABLE'</text></g></svg></div><div class=\"move\"><p>Sixty thousand cars online and four hundred ride requests a second at peak. Be careful with the number everybody gets wrong here: nine cell lookups is not nine cars. Sixty thousand cars over a seven-hundred-square-kilometre city is about eighty-five per square kilometre, and nine cells of 1.1 km is eleven square kilometres, so a read hands matching roughly nine hundred cars (930 in a simulated city). Each of those costs one haversine, about fifteen nanoseconds on a laptop. Measured: the read takes about 4 microseconds, the scan about 5, and a whole request, trip and all, about 20. Four hundred a second is 8 milliseconds of CPU in every second, under one per cent of one core, with no lock held for any of it. The two atomic claims are noise beside that: tens of nanoseconds per ride. The write path is the bigger count and the cheaper cost. Sixty thousand cars pinging every four seconds is fifteen thousand pings a second, but a car at city speed takes about two and a half minutes to cross a 1.1 km cell, so only about four hundred of those fifteen thousand touch the grid; the rest are one field write each. The ladder is beside this, in the order you would climb it, and only the middle rung needs a sentence. Downtown, that same read hands over four thousand cars and a request takes about a tenth of a millisecond, so you go finer <i>there</i>: a new class and one changed line, because the index is an interface. The names you will hear for it: a quadtree (cells that split into four wherever cars crowd), a geohash or Google's S2 (cells named by a string or a number, where a longer name is a smaller cell). The top rung is worth saying out loud too: <code>UPDATE driver SET status='RESERVED' WHERE id=? AND status='AVAILABLE'</code> is not a new idea, it is this page's compare-and-set performed by the database.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 406\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 16)\"><rect width=\"330\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two riders, one car</text></g><path d=\"M360 32 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 16)\"><rect width=\"800\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">compare-and-set; test 1: 200 riders, 40 cars, exactly 40 trips</text></g><g transform=\"translate(30 52)\"><rect width=\"330\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one rider, two taps</text></g><path d=\"M360 68 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 52)\"><rect width=\"800\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">putIfAbsent on his slot; test 9: 20 taps, exactly 1 ride</text></g><g transform=\"translate(30 88)\"><rect width=\"330\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a rule or the clock throws mid-request</text></g><path d=\"M360 104 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 88)\"><rect width=\"800\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a finally block hands back slot and car; test 10: he books again</text></g><g transform=\"translate(30 124)\"><rect width=\"330\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">end a ride not started, or at -10 km</text></g><path d=\"M360 140 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 124)\"><rect width=\"800\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">legal-edge table + input check; tests 3, 12: nothing written</text></g><g transform=\"translate(30 160)\"><rect width=\"330\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the card declines, or times out</text></g><path d=\"M360 176 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 160)\"><rect width=\"800\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">COMPLETED_UNPAID + the same key; test 6: the money moves once</text></g><g transform=\"translate(30 196)\"><rect width=\"330\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a payment retry while the ride runs</text></g><path d=\"M360 212 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 196)\"><rect width=\"800\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refused before the gateway; test 11: the real fare is charged</text></g><g transform=\"translate(30 232)\"><rect width=\"330\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a cancelled ride strands the car</text></g><path d=\"M360 248 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 232)\"><rect width=\"800\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every exit frees the driver; test 4: AVAILABLE again</text></g><g transform=\"translate(30 268)\"><rect width=\"330\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the push gateway is down</text></g><path d=\"M360 284 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 268)\"><rect width=\"800\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish after the move, in a try/catch; test 7: the trip completes</text></g><g transform=\"translate(30 304)\"><rect width=\"330\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a driver moves, logs off, pings race</text></g><path d=\"M360 320 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 304)\"><rect width=\"800\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one step per driver in the grid; tests 8, 14: one cell only</text></g><g transform=\"translate(30 340)\"><rect width=\"330\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two objects under one driver id</text></g><path d=\"M360 356 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 340)\"><rect width=\"800\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the second is refused; test 13: no ghost is ever matched</text></g><text x=\"615\" y=\"394\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a failure test: FailureTests.java runs eighteen blocks and must print ALL PASS</text></svg></div><div class=\"move\"><p>Two riders reaching for one car (exactly one trip, and the loser gets another car). One rider tapping twenty times (one ride, nineteen refusals, exactly one car out of the pool). A matching rule or the clock throwing half-way through a request (the slot and any claimed car come back, so he can book again). An out-of-order call or bad input, such as ending a ride that never started, or ending one at minus ten kilometres (it throws, and the trip is untouched). The card declining or timing out after the ride (the trip is recorded, the driver is free, and the retry with the same key moves the money exactly once). A payment retry while the ride is still running (refused before the gateway, so the real fare is charged at the end). A cancelled ride that forgets to give the car back (every exit releases the driver, or the fleet quietly drains over a day). The push gateway down (publish after the state has moved, inside a try/catch). A driver who drives across the city, logs off, or whose pings are handled on two threads at once (one step per driver in the grid, so he is only ever in one cell). Two driver objects under one id (the second is refused, so no ghost copy stays matchable). Each of these is a few lines in FailureTests.java; a design that cannot show its tests is a claim. Five of the eighteen blocks are races (the car, the double tap, the pings, the offers, the car-pool seats), and each is proved by counting rather than by reading a log.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"230\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"320\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"860\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"230\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">MatchingStrategy, PricingStrategy, CancellationPolicy: one method each</text><text x=\"860\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a new rule is a new class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"230\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">new SurgePricing(base, surge)  --  and a coupon wraps that</text><text x=\"860\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">surge, coupons and tolls stack, not flags</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"230\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 4</text><text x=\"320\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">publish(trip, from, to) after the move, inside a try/catch</text><text x=\"860\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">the phones hear; the ride never waits</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State (as a table)</text><text x=\"230\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">EnumMap&lt;TripStatus, EnumSet&gt;, checked before any write</text><text x=\"860\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">an illegal move cannot happen</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Facade</text><text x=\"230\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"320\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">RideService: request, arrive, start, end, cancel, and nothing else</text><text x=\"860\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">the order of operations lives in one place</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"230\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"320\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">the service is handed to its callers; nothing calls getInstance()</text><text x=\"860\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh RideService</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"230\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">VehicleType is an enum and the rate table is already the registry</text><text x=\"860\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when tiers come from config</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"230\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"320\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">a Trip has six required fields and not one optional one</text><text x=\"860\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">a pattern without a move is decoration</text><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>The table is the answer. Facade is simply the name for <code>RideService</code>'s shape: one class in front of the index, the trips and the rules, and the only one callers talk to. Two rows are worth defending out loud, because an interviewer pushes on both. State is move 6 but as a <i>table</i>, not a class per state: a trip's states carry no behaviour of their own, so a class each would buy nothing you cannot already read in six lines. The day a state does carry behaviour &mdash; a pooled leg that knows how to take on another rider &mdash; is the day you split them, and saying that is the difference between a decision and a shortcut. Decorator, not a flag, is the other: <code>SurgePricing</code> is a <code>PricingStrategy</code> that <i>holds</i> a <code>PricingStrategy</code>, which is exactly what lets a coupon wrap the surge and a toll wrap the coupon with nobody reopening the fare method. And the three grey rows matter as much as the five above them: naming Singleton, Factory or Builder here would be naming a pattern no move produced.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Index: where cars are. Trip: the life. Service: the order. A rule: one rule.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">LongestIdleMatching is a new file plus one line where the service is built</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">SurgePricing IS a PricingStrategy and HOLDS one, so it slots in anywhere</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">Matching, Pricing, Cancellation, Payment, Observer, Clock: one method each</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">svc.configure(matching, pricing, cancellation, payments);  svc.setClock(...)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>The thing to say out loud is that not one of the five was aimed at: each is what a move already produced, which is why every row has a line of code beside it instead of a definition. Two get probed. L, because <code>SurgePricing</code> is the sharp case &mdash; it <i>is</i> a pricing rule and <i>holds</i> one, so it can wrap the base, a coupon, or another surge, and the service never asks which it got. And I, because one method per interface is what makes the failure tests short: the gateway that always declines is three lines, and the clock that says the ride took twenty-four minutes is a lambda.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">shortest ETA, batched dispatch</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind MatchingStrategy plus one line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">ratings, analytics, receipts</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer; the trip and the CAS do not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the driver declines, a no-show</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the claim becomes an offer: PENDING, then accepted, declined or expired</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across things</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one car, several riders: pool</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same claim, then a fare divided so the shares sum to it</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 4 + 6</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive it</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">persist it; two servers</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the compare-and-set becomes a conditional UPDATE:</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE driver SET status='RESERVED' WHERE id=? AND status='AVAILABLE'</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the service, the trip machine and the tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>Three of the five deserve a sentence more than the table gives them. A new step in a life is rarely only an edge: the driver who never taps accept turns the claim into an <i>offer</i> with a deadline. The car is held while his phone rings for fifteen seconds, one compare-and-set decides between his tap and the timer, and a decline or silence sends the ride to the next car, never back to him. A new invariant (a rule that must always hold) across things is the pooled ride, and its hard part is not the car, it is the arithmetic: three shares that must add up to the fare to the last paisa, so the final leg absorbs the rounding. And state that must outlive the process only looks like a rewrite: <code>UPDATE driver SET status='RESERVED' WHERE id=? AND status='AVAILABLE'</code> is the compare-and-set performed by the database, and the rider's one-ride slot becomes a unique index (the database refuses a second open trip for the same rider). For all five the service, the trip machine and the tests are untouched; that is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 800\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"  777\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"781\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 777L904 777\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"781\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the service owns every trip, every driver and the index. Plain arrow = references: a trip points at its status, its two locations and the driver it is riding with. Dashed green = handed in through <code>configure()</code> or <code>setClock()</code>. Dotted blue = notifies. <b>Where state lives:</b> the driver has the two fields that move on their own: a volatile location written by the ping path, and an <code>AtomicReference</code> status, one of the only two cells threads fight over. The trip has its own status plus the table of legal moves, and is the only class allowed to write it. The index has the grid and nothing else. The service has the maps, the handed-in rules and the order of operations, and the other cell threads fight over: <code>activeTrip</code>, the rider-to-trip map that is claimed with <code>putIfAbsent</code> so a double tap cannot become two rides. The service holds no lock of its own. Notice what is <i>not</i> here: no Dispatcher class, because dispatch is a short loop inside <code>requestRide</code>; no state classes, because a trip's states carry no behaviour; and no ETA field anywhere, because an ETA is a question, not a thing to keep up to date.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (eighteen blocks of claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n/** The tiers a rider can ask for. The tier is the filter in matching and the key into the fare table. */\nenum VehicleType { AUTO, GO, PREMIER, XL }\n\n/**\n * A driver&#x27;s availability. OFFLINE is not working; AVAILABLE can be claimed by anybody; RESERVED means exactly one\n * rider won him; ON_TRIP means the ride is running. Only AVAILABLE -&gt; RESERVED is ever contended.\n */\nenum DriverStatus { OFFLINE, AVAILABLE, RESERVED, ON_TRIP }\n\n/**\n * A trip&#x27;s life. COMPLETED_UNPAID is the honest state between &quot;the car stopped&quot; and &quot;the card said yes&quot;: the ride\n * happened whatever the gateway thinks, so the money is a separate step that can be retried.\n */\nenum TripStatus { REQUESTED, ASSIGNED, ARRIVED, IN_PROGRESS, COMPLETED_UNPAID, COMPLETED, CANCELLED }\n\n/**\n * Money is whole paise in a long. The one double near a fare is the distance, rounded to whole paise once in\n * NormalPricing; every step after that is exact, and an overflow throws instead of wrapping to a negative fare.\n */\nfinal class Money {\n    /** Parse &quot;172.00&quot; into 17200 paise, exactly. Used at the edge (a form, a rate card), never in the maths. */\n    static long rupees(String amount) { return new java.math.BigDecimal(amount).movePointRight(2).longValueExact(); }\n    /** Print 17200 paise as &quot;172.00&quot;. Presentation only. */\n    static String fmt(long paise) {\n        String sign = paise &lt; 0 ? &quot;-&quot; : &quot;&quot;; long a = Math.abs(paise);\n        return sign + (a / 100) + &quot;.&quot; + String.format(&quot;%02d&quot;, a % 100);\n    }\n}\n\n/** Where time comes from. Injected, so a test can decide that a ride took exactly twenty-four minutes. */\ninterface Clock { long nowMs(); }\n\n/** A point on the map. Immutable, and it carries the one piece of geometry everybody needs. */\nrecord Location(double lat, double lng) {\n    /**\n     * Great-circle (haversine) distance in kilometres. This is the &quot;who is near me&quot; number. It is deliberately NOT\n     * the number a fare is built from: the fare uses the distance the car actually drove.\n     */\n    double distanceKm(Location o) {\n        double R = 6371.0;\n        double dLat = Math.toRadians(o.lat - lat), dLng = Math.toRadians(o.lng - lng);\n        double a = Math.sin(dLat / 2) * Math.sin(dLat / 2)\n                 + Math.cos(Math.toRadians(lat)) * Math.cos(Math.toRadians(o.lat))\n                 * Math.sin(dLng / 2) * Math.sin(dLng / 2);\n        return 2 * R * Math.asin(Math.min(1.0, Math.sqrt(a)));\n    }\n    @Override public String toString() { return String.format(&quot;(%.4f, %.4f)&quot;, lat, lng); }\n}\n\n/** A passenger. Only the id ever reaches a trip or a payment, so a rename can never move money. */\nrecord Rider(String id, String name) {}\n\n/** A car. The tier is what a rider asks for, so it lives here and not on the driver. */\nrecord Vehicle(String plate, VehicleType type) {}\n\n/**\n * One driver and his car. Two fields move on their own. `location` is written thousands of times a second by the\n * ping path and read by matching, so it is volatile and takes no lock. `status` is the one cell in this whole\n * system that two threads fight over, so it is an AtomicReference and every change to it is a compare-and-set.\n */\nclass Driver {\n    private final String id, name;\n    private final Vehicle vehicle;\n    private volatile Location location;\n    private final AtomicReference&lt;DriverStatus&gt; status = new AtomicReference&lt;&gt;(DriverStatus.OFFLINE);\n\n    Driver(String id, String name, Vehicle vehicle, Location at) {\n        this.id = id; this.name = name; this.vehicle = vehicle; this.location = at;\n    }\n    String id()              { return id; }\n    String name()            { return name; }\n    Vehicle vehicle()        { return vehicle; }\n    /** The last ping. May be a few seconds stale, which is fine for choosing a car. */\n    Location location()      { return location; }\n    DriverStatus status()    { return status.get(); }\n    /** The ping path: one volatile write, no lock, no allocation. */\n    void moveTo(Location where) { this.location = where; }\n    /** Start a shift: OFFLINE -&gt; AVAILABLE. False if he was already online. */\n    boolean goOnline()  { return status.compareAndSet(DriverStatus.OFFLINE, DriverStatus.AVAILABLE); }\n    /** End a shift. Only from AVAILABLE, so a driver can never vanish in the middle of a ride. */\n    boolean goOffline() { return status.compareAndSet(DriverStatus.AVAILABLE, DriverStatus.OFFLINE); }\n    /**\n     * THE critical step of this system. Two riders can reach the same car in the same microsecond; this single\n     * hardware instruction decides. Exactly one caller gets true, and from that moment the car is his alone.\n     */\n    boolean reserve()   { return status.compareAndSet(DriverStatus.AVAILABLE, DriverStatus.RESERVED); }\n    /** The rider is in the car: RESERVED -&gt; ON_TRIP. */\n    boolean board()     { return status.compareAndSet(DriverStatus.RESERVED, DriverStatus.ON_TRIP); }\n    /** Back into the pool, from RESERVED (the ride was cancelled) or ON_TRIP (it finished). */\n    boolean release()   { return status.compareAndSet(DriverStatus.RESERVED, DriverStatus.AVAILABLE)\n                              || status.compareAndSet(DriverStatus.ON_TRIP,  DriverStatus.AVAILABLE); }\n    @Override public String toString() { return id + &quot; &quot; + name + &quot; &quot; + vehicle.type() + &quot; &quot; + status.get(); }\n}\n\n// &quot;who is near this pickup?&quot; asked 400 times a second against 60,000 cars -&gt; never a scan -&gt; a spatial index\n/**\n * The shape that answers &quot;who is near here&quot;. An interface because the answer changes with the city: a flat grid\n * is right for one town, a quadtree or geohash for a country. Swapping it is one line at the composition root.\n */\ninterface DriverIndex {\n    /** Record a driver at a place. Called on every ping, so it must be O(1) and must not allocate in the common case. */\n    void update(Driver d, Location where);\n    /** Forget a driver: he went offline. */\n    void remove(Driver d);\n    /** Every driver in the neighbourhood of this pickup, of any status. Matching does the filtering. */\n    List&lt;Driver&gt; nearby(Location pickup);\n}\n\n/**\n * A uniform grid: round the latitude and longitude to a cell about 1.1 km across and keep a set per cell. A ping\n * only touches the grid when the car crosses a cell boundary, which at city speed is about once every two and a half\n * minutes, so the write-heavy path is a volatile field write and nothing else. A read is the pickup&#x27;s cell plus its\n * eight neighbours: nine bucket lookups, never a scan of the fleet.\n */\nclass GridIndex implements DriverIndex {\n    /** About 1.1 km of latitude. Bigger cells mean fewer rewrites and longer scans; this is the knob. */\n    private static final double CELL_DEG = 0.01;\n    private final Map&lt;Long, Set&lt;Driver&gt;&gt; cells = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Long&gt; cellOfDriver = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicLong pings = new AtomicLong(), rewrites = new AtomicLong(), scanned = new AtomicLong();\n\n    /**\n     * A cell crossing is &quot;leave the old set, join the new one, remember the new cell&quot;, and it runs inside compute()\n     * on this driver&#x27;s own entry, so two of his pings handled on two threads at once cannot both move him: without\n     * that, each would add him to a different cell and the loser&#x27;s cell would keep him forever, a ghost.\n     */\n    public void update(Driver d, Location where) {\n        pings.incrementAndGet();\n        d.moveTo(where);                                       // the cheap part: one volatile write\n        long cell = cellOf(where);\n        Long seen = cellOfDriver.get(d.id());\n        if (seen != null &amp;&amp; seen.longValue() == cell) return;  // the common case: same cell, nothing to rewrite\n        cellOfDriver.compute(d.id(), (id, old) -&gt; {            // one crossing at a time for THIS driver only\n            if (d.status() == DriverStatus.OFFLINE) {          // a late ping after sign-off must not re-add him\n                if (old != null) { Set&lt;Driver&gt; from = cells.get(old); if (from != null) from.remove(d); }\n                return null;\n            }\n            if (old != null &amp;&amp; old.longValue() == cell) return old;\n            rewrites.incrementAndGet();\n            if (old != null) { Set&lt;Driver&gt; from = cells.get(old); if (from != null) from.remove(d); }\n            cells.computeIfAbsent(cell, k -&gt; ConcurrentHashMap.newKeySet()).add(d);\n            return cell;\n        });\n    }\n    /** Forget a driver, in the same per-driver step as update, so a ping in flight cannot undo it. */\n    public void remove(Driver d) {\n        cellOfDriver.computeIfPresent(d.id(), (id, cell) -&gt; {\n            Set&lt;Driver&gt; from = cells.get(cell);\n            if (from != null) from.remove(d);\n            return null;                                       // null deletes his entry\n        });\n    }\n    public List&lt;Driver&gt; nearby(Location pickup) {\n        long latCell = (long) Math.floor(pickup.lat() / CELL_DEG), lngCell = (long) Math.floor(pickup.lng() / CELL_DEG);\n        List&lt;Driver&gt; out = new ArrayList&lt;&gt;();\n        for (long dLat = -1; dLat &lt;= 1; dLat++)\n            for (long dLng = -1; dLng &lt;= 1; dLng++) {\n                Set&lt;Driver&gt; bucket = cells.get(key(latCell + dLat, lngCell + dLng));\n                if (bucket != null) out.addAll(bucket);        // a concurrent set: a mildly stale view is fine\n            }\n        scanned.addAndGet(out.size());\n        return out;\n    }\n    /** How many pings arrived, how many of them actually rewrote the grid, and how many drivers reads have seen. */\n    String stats() { return &quot;pings=&quot; + pings + &quot; grid rewrites=&quot; + rewrites + &quot; drivers scanned=&quot; + scanned; }\n    /** How many location pings this index absorbed. */\n    long pings() { return pings.get(); }\n    /** How many of those pings actually moved a driver between cells. The rest were one volatile write and nothing else. */\n    long rewrites() { return rewrites.get(); }\n    /** How many drivers this index knows about. */\n    int size() { return cellOfDriver.size(); }\n    private static long cellOf(Location l) {\n        return key((long) Math.floor(l.lat() / CELL_DEG), (long) Math.floor(l.lng() / CELL_DEG));\n    }\n    private static long key(long latCell, long lngCell) { return (latCell &lt;&lt; 32) ^ (lngCell &amp; 0xffff_ffffL); }\n}\n\n// &quot;which driver?&quot; is a business rule that changes every quarter -&gt; hide it behind an interface -&gt; Strategy\n/** The rule that picks one car out of the neighbourhood. It only proposes; it never claims and never mutates. */\ninterface MatchingStrategy {\n    /** The car this rule would send, or empty if none of the candidates will do. */\n    Optional&lt;Driver&gt; select(Location pickup, VehicleType type, List&lt;Driver&gt; candidates);\n}\n\n/** Today&#x27;s rule: the closest AVAILABLE car of the right tier. A min-scan over the candidates, nothing more. */\nclass NearestDriver implements MatchingStrategy {\n    public Optional&lt;Driver&gt; select(Location pickup, VehicleType type, List&lt;Driver&gt; candidates) {\n        Driver best = null; double bestKm = Double.MAX_VALUE;\n        for (Driver d : candidates) {\n            if (d.status() != DriverStatus.AVAILABLE) continue;       // a hint only: it can change a nanosecond later\n            if (d.vehicle().type() != type) continue;\n            double km = d.location().distanceKm(pickup);\n            if (km &lt; bestKm) { bestKm = km; best = d; }\n        }\n        return Optional.ofNullable(best);\n    }\n}\n\n/** Everything a fare rule is allowed to look at. A value object, so a new rule needs no new method signature. */\nrecord FareBasis(VehicleType type, double distanceKm, long minutes, Location pickup, long atMs) {}\n\n// &quot;what do we charge?&quot; is the rule that changes weekly -&gt; the same move -&gt; Strategy again\n/** The rule that turns a finished ride into paise. One method, because the whole of pricing is one decision. */\ninterface PricingStrategy {\n    /** The fare for this ride, in paise. Must be deterministic: the same basis always gives the same number. */\n    long price(FareBasis basis);\n}\n\n/**\n * Base fare plus per-kilometre plus per-minute, from a table keyed by tier. The kilometres are the one double, rounded\n * to paise once; the sum is exact long arithmetic, and addExact throws rather than wrap if a number is absurd.\n */\nclass NormalPricing implements PricingStrategy {\n    private static final Map&lt;VehicleType, long[]&gt; RATE = rates();      // {base, perKm, perMin} in paise\n    private static Map&lt;VehicleType, long[]&gt; rates() {\n        Map&lt;VehicleType, long[]&gt; m = new EnumMap&lt;&gt;(VehicleType.class);\n        m.put(VehicleType.AUTO,    new long[]{2000,  800, 100});\n        m.put(VehicleType.GO,      new long[]{4000, 1200, 150});\n        m.put(VehicleType.PREMIER, new long[]{6000, 1600, 200});\n        m.put(VehicleType.XL,      new long[]{8000, 2000, 250});\n        return Collections.unmodifiableMap(m);\n    }\n    public long price(FareBasis b) {\n        long[] r = RATE.get(b.type());\n        long perKm = Math.round(r[1] * b.distanceKm());                     // the only rounding in a fare\n        return Math.addExact(Math.addExact(r[0], perKm), Math.multiplyExact(r[2], b.minutes()));\n    }\n}\n\n/** Where a surge multiplier comes from, in basis points: 10000 is 1.0x, 15000 is 1.5x. Integer, so it is exact. */\ninterface SurgeSource {\n    /** The multiplier for this ride, in basis points. Read at the moment of pricing, never cached on the trip. */\n    int basisPoints(FareBasis basis);\n}\n\n// &quot;add surge, then a coupon, then a toll&quot; must not become four flags in one method -&gt; wrap the rule -&gt; Decorator\n/**\n * Surge as a wrapper, not a flag: it takes whatever the base rule charged and multiplies it. Because it IS a\n * PricingStrategy and HOLDS a PricingStrategy, coupons and tolls stack the same way without anybody editing the\n * base formula. 10000 basis points is 1.0x, so a wrapper with no surge is exactly the base fare.\n */\nclass SurgePricing implements PricingStrategy {\n    private final PricingStrategy base;\n    private final SurgeSource surge;\n    SurgePricing(PricingStrategy base, SurgeSource surge) { this.base = base; this.surge = surge; }\n    public long price(FareBasis b) {\n        int bp = surge.basisPoints(b);\n        if (bp &lt; 10_000) throw new IllegalArgumentException(&quot;surge cannot be a discount: &quot; + bp + &quot; bp&quot;);\n        return Math.multiplyExact(base.price(b), (long) bp) / 10_000;       // truncates: the rider keeps the half paisa\n    }\n}\n\n// &quot;do we charge for a cancellation?&quot; is a third rule the interviewer will change -&gt; Strategy, again\n/** The rule that decides what a cancellation costs. Reads the state it was cancelled in and how long the rider waited. */\ninterface CancellationPolicy {\n    /** The fee in paise, zero when the cancellation is free. */\n    long feePaise(TripStatus cancelledIn, long waitedMs);\n}\n\n/** Free while nobody has been sent and for two minutes after that; thirty rupees once the driver is really coming. */\nclass StandardCancellation implements CancellationPolicy {\n    private static final long GRACE_MS = 2 * 60 * 1000L;\n    private static final long FEE = Money.rupees(&quot;30.00&quot;);\n    public long feePaise(TripStatus cancelledIn, long waitedMs) {\n        if (cancelledIn == TripStatus.REQUESTED) return 0;                       // no driver was ever claimed\n        if (cancelledIn == TripStatus.ASSIGNED &amp;&amp; waitedMs &lt; GRACE_MS) return 0; // he had only just set off\n        return FEE;                                                             // en route, or already waiting at the kerb\n    }\n}\n\n/**\n * Thrown when the gateway says no, or does not answer in time. After a timeout nobody knows whether the money\n * moved; that is safe here because the retry sends the same key, so it either charges now or returns the first\n * charge&#x27;s reference. The ride still happened; only the money is unfinished.\n */\nclass PaymentDeclined extends RuntimeException {\n    PaymentDeclined(String message) { super(message); }\n}\n\n/** The money gateway. Slow, external, and the one call in this system that cannot be undone by us. */\ninterface PaymentProcessor {\n    /** Charge the rider. Returns a reference on success; throws PaymentDeclined otherwise. Must be idempotent on the key. */\n    String charge(String riderId, long paise, String idempotencyKey);\n}\n\n/** A card gateway that remembers its keys, so the same trip charged twice takes the money once. */\nclass CardPayment implements PaymentProcessor {\n    private final Map&lt;String, String&gt; byKey = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicLong charges = new AtomicLong();\n    public String charge(String riderId, long paise, String key) {\n        return byKey.computeIfAbsent(key, k -&gt; {                 // the second call with the same key returns the first reference\n            charges.incrementAndGet();\n            return &quot;pay-&quot; + k + &quot;-&quot; + Money.fmt(paise);\n        });\n    }\n    /** How many times money actually moved. A retry must not increase this. */\n    long charges() { return charges.get(); }\n}\n\n// &quot;the rider&#x27;s phone and the driver&#x27;s phone must be told&quot; must not sit inside the money path -&gt; Observer\n/** Anyone who wants to hear that a trip moved: the rider&#x27;s phone, the driver&#x27;s app, analytics, a rating prompt. */\ninterface TripObserver {\n    /** Called after the state has already changed, outside every lock. Must not throw; if it does, it is ignored. */\n    void onTrip(Trip trip, TripStatus from, TripStatus to);\n}\n\n/** A push notification. Prints here; a real one calls a gateway, which is exactly why it runs after the transition. */\nclass PushNotifier implements TripObserver {\n    public void onTrip(Trip t, TripStatus from, TripStatus to) {\n        System.out.println(&quot;[push] &quot; + t.id() + &quot; &quot; + from + &quot; -&gt; &quot; + to\n            + &quot;  rider &quot; + t.rider().name() + &quot;, driver &quot; + t.driver().name()\n            + (to == TripStatus.COMPLETED ? &quot;, fare &quot; + Money.fmt(t.farePaise()) : &quot;&quot;));\n    }\n}\n\n/**\n * One ride, and the only place a ride&#x27;s rules live. Every legal move is in one table, so an out-of-order call\n * throws instead of quietly producing a nonsense fare. transitionTo is the only writer of status and it validates\n * BEFORE it writes, so a rejected call leaves the trip exactly as it was. status is volatile because other threads\n * read it without taking this monitor.\n */\nclass Trip {\n    private static final Map&lt;TripStatus, Set&lt;TripStatus&gt;&gt; LEGAL = legalEdges();\n    private static Map&lt;TripStatus, Set&lt;TripStatus&gt;&gt; legalEdges() {\n        Map&lt;TripStatus, Set&lt;TripStatus&gt;&gt; m = new EnumMap&lt;&gt;(TripStatus.class);\n        m.put(TripStatus.REQUESTED,        EnumSet.of(TripStatus.ASSIGNED, TripStatus.CANCELLED));\n        m.put(TripStatus.ASSIGNED,         EnumSet.of(TripStatus.ARRIVED, TripStatus.CANCELLED));\n        m.put(TripStatus.ARRIVED,          EnumSet.of(TripStatus.IN_PROGRESS, TripStatus.CANCELLED));\n        m.put(TripStatus.IN_PROGRESS,      EnumSet.of(TripStatus.COMPLETED_UNPAID));   // no cancelling a moving car\n        m.put(TripStatus.COMPLETED_UNPAID, EnumSet.of(TripStatus.COMPLETED));          // the money, later\n        m.put(TripStatus.COMPLETED,        EnumSet.noneOf(TripStatus.class));\n        m.put(TripStatus.CANCELLED,        EnumSet.noneOf(TripStatus.class));\n        return Collections.unmodifiableMap(m);\n    }\n\n    private final String id;\n    private final Rider rider;\n    private final Driver driver;\n    private final Location pickup, drop;\n    private final VehicleType type;\n    private final long requestedAtMs;\n    private volatile TripStatus status = TripStatus.REQUESTED;\n    private volatile long assignedAtMs, arrivedAtMs, startedAtMs, endedAtMs;\n    private volatile double distanceKm;\n    private volatile long minutes, farePaise, feePaise;\n    private volatile String paymentRef = &quot;&quot;;\n\n    Trip(String id, Rider rider, Driver driver, Location pickup, Location drop, VehicleType type, long atMs) {\n        this.id = id; this.rider = rider; this.driver = driver; this.pickup = pickup; this.drop = drop;\n        this.type = type; this.requestedAtMs = atMs;\n    }\n    String id()            { return id; }\n    Rider rider()          { return rider; }\n    Driver driver()        { return driver; }\n    Location pickup()      { return pickup; }\n    Location drop()        { return drop; }\n    VehicleType type()     { return type; }\n    TripStatus status()    { return status; }\n    long requestedAtMs()   { return requestedAtMs; }\n    long startedAtMs()     { return startedAtMs; }\n    long endedAtMs()       { return endedAtMs; }\n    double distanceKm()    { return distanceKm; }\n    long minutes()         { return minutes; }\n    /** What the ride cost, in paise. Zero until the ride ends. */\n    long farePaise()       { return farePaise; }\n    /** What the cancellation cost, in paise. Zero unless it was cancelled late. */\n    long feePaise()        { return feePaise; }\n    /** The gateway&#x27;s reference, empty while the trip is COMPLETED_UNPAID. */\n    String paymentRef()    { return paymentRef; }\n\n    /**\n     * The only writer of status. Looks the move up in the table and throws if it is not there, before touching a\n     * single field. Synchronized, so a rider cancelling and a driver starting at the same instant cannot both win.\n     */\n    synchronized void transitionTo(TripStatus to) {\n        if (!LEGAL.get(status).contains(to))\n            throw new IllegalStateException(id + &quot;: &quot; + status + &quot; -&gt; &quot; + to + &quot; is not a legal move&quot;);\n        status = to;\n    }\n    /** A car has been claimed for this ride and is on his way. */\n    synchronized void assigned(long atMs)  { transitionTo(TripStatus.ASSIGNED); assignedAtMs = atMs; }\n    /** The car is at the kerb. */\n    synchronized void arrived(long atMs)   { transitionTo(TripStatus.ARRIVED); arrivedAtMs = atMs; }\n    /** The rider is in and the meter is running. */\n    synchronized void started(long atMs)   { transitionTo(TripStatus.IN_PROGRESS); startedAtMs = atMs; }\n    /** The car stopped. The ride is now a fact; the money has not been touched yet. */\n    synchronized void ended(double km, long mins, long fare, long atMs) {\n        transitionTo(TripStatus.COMPLETED_UNPAID);\n        distanceKm = km; minutes = mins; farePaise = fare; endedAtMs = atMs;\n    }\n    /**\n     * The gateway said yes. The last move of a happy trip. False if a second settle racing this one already recorded\n     * it: both sent the same key, so the gateway moved the money once and handed both the same reference.\n     */\n    synchronized boolean paid(String ref) {\n        if (status == TripStatus.COMPLETED) return false;\n        transitionTo(TripStatus.COMPLETED); paymentRef = ref; return true;\n    }\n    /** Called off before the meter started, with whatever the policy decided it costs. */\n    synchronized void cancelled(long fee)  { transitionTo(TripStatus.CANCELLED); feePaise = fee; }\n\n    @Override public String toString() {\n        return id + &quot; &quot; + status + &quot; &quot; + rider.name() + &quot;/&quot; + driver.name() + &quot; &quot; + type\n            + (farePaise &gt; 0 ? &quot; fare &quot; + Money.fmt(farePaise) : &quot;&quot;) + (feePaise &gt; 0 ? &quot; fee &quot; + Money.fmt(feePaise) : &quot;&quot;);\n    }\n}\n\n/**\n * The aggregate root. It owns the riders, the drivers, the index and every trip, and it is the only class that\n * knows the order of operations. Notice what it does NOT own: a global lock. Dispatch runs fully in parallel,\n * because the contended state is never a big structure: it is one driver&#x27;s status, settled by a compare-and-set,\n * and one rider&#x27;s live-ride slot, settled by a putIfAbsent. Two claims, two single steps, no lock between riders.\n */\nclass RideService {\n    private final DriverIndex index;\n    private final Map&lt;String, Rider&gt; riders = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Driver&gt; drivers = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Trip&gt; trips = new ConcurrentHashMap&lt;&gt;();\n    /** riderId -&gt; the id of the ride he is on right now. The rider-side claim: it is what stops a double tap. */\n    private final Map&lt;String, String&gt; activeTrip = new ConcurrentHashMap&lt;&gt;();\n    /** The value parked in activeTrip while a request is still looking for a car, so a second tap sees a claim. */\n    private static final String MATCHING = &quot;(matching)&quot;;\n    private final List&lt;TripObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n    private final AtomicLong seq = new AtomicLong(), lostRaces = new AtomicLong();\n    private MatchingStrategy matching = new NearestDriver();\n    private PricingStrategy pricing = new NormalPricing();\n    private CancellationPolicy cancellation = new StandardCancellation();\n    private PaymentProcessor payments = new CardPayment();\n    private Clock clock = System::currentTimeMillis;\n\n    RideService(DriverIndex index) { this.index = index; }\n\n    /** Hand in the four rules. The service never builds one, which is why a test can hand in a card that always declines. */\n    void configure(MatchingStrategy m, PricingStrategy p, CancellationPolicy c, PaymentProcessor pay) {\n        this.matching = m; this.pricing = p; this.cancellation = c; this.payments = pay;\n    }\n    /** Tests hand in a fixed clock, so a ride can take exactly twenty-four minutes. */\n    void setClock(Clock c) { clock = c; }\n    /** Subscribe a listener. Setup only; listeners are called after the state has already moved. */\n    void addObserver(TripObserver o) { observers.add(o); }\n    /** Register a passenger. */\n    void addRider(Rider r) { riders.put(r.id(), r); }\n\n    /**\n     * A driver starts his shift: he becomes claimable and enters the index. One object per id: a second, different\n     * object under an id already known is refused, because the first would stay in the index, claimable, as a ghost.\n     */\n    void goOnline(Driver d, Location at) {\n        Driver known = drivers.putIfAbsent(d.id(), d);\n        if (known != null &amp;&amp; known != d) throw new IllegalArgumentException(d.id() + &quot; is already registered&quot;);\n        if (!d.goOnline()) throw new IllegalStateException(d.id() + &quot; is already &quot; + d.status());\n        index.update(d, at);\n    }\n    /** A driver ends his shift. Refused mid-ride, because goOffline only moves from AVAILABLE. */\n    void goOffline(String driverId) {\n        Driver d = driver(driverId);\n        if (!d.goOffline()) throw new IllegalStateException(d.id() + &quot; cannot go offline while &quot; + d.status());\n        index.remove(d);\n    }\n    /**\n     * The write-heavy path: every car, every few seconds. One volatile write, and a grid rewrite only when the car\n     * actually crosses a cell boundary. Nothing here takes a lock and nothing here can block a rider.\n     */\n    void ping(String driverId, Location where) { index.update(driver(driverId), where); }\n\n    /**\n     * The critical step, and it makes TWO claims. First the rider: putIfAbsent on his live-ride slot, so a double\n     * tap or a retried request cannot become two rides. Then the car: ask the index who is near, let the rule pick\n     * one, and CLAIM him with a compare-and-set. If the car claim fails another rider got there first, so drop that\n     * car and try the next-best one: the loser is never made to wait and never fails. Every way out that did not\n     * make a trip -- no car, or a rule that threw -- hands back the slot and any car it held (the finally block),\n     * so the system is left exactly as it was.\n     */\n    Optional&lt;Trip&gt; requestRide(String riderId, Location pickup, Location drop, VehicleType type) {\n        Rider rider = rider(riderId);\n        if (activeTrip.putIfAbsent(rider.id(), MATCHING) != null)           // the rider-side claim, one atomic step\n            throw new IllegalStateException(rider.id() + &quot; already has a ride: &quot; + activeTrip.get(rider.id()));\n        Driver held = null;                                                 // a car claimed but not yet in a trip\n        boolean booked = false;\n        try {\n            List&lt;Driver&gt; candidates = new ArrayList&lt;&gt;(index.nearby(pickup)); // a snapshot; a few entries may be stale\n            while (true) {\n                Optional&lt;Driver&gt; pick = matching.select(pickup, type, candidates);   // may throw: a routing call\n                if (pick.isEmpty()) return Optional.empty();                // no car: the finally hands the slot back\n                Driver d = pick.get();\n                if (!d.reserve()) {                                         // somebody beat us to this car by a nanosecond\n                    lostRaces.incrementAndGet();\n                    candidates.remove(d);\n                    continue;                                               // straight on to the next-nearest\n                }\n                held = d;\n                Trip t = new Trip(&quot;T&quot; + seq.incrementAndGet(), rider, d, pickup, drop, type, clock.nowMs());\n                t.assigned(clock.nowMs());\n                trips.put(t.id(), t);\n                activeTrip.put(rider.id(), t.id());                         // the slot now names the real ride\n                booked = true;\n                publish(t, TripStatus.REQUESTED, TripStatus.ASSIGNED);\n                return Optional.of(t);\n            }\n        } finally {\n            if (!booked) {                                                  // whatever this call took, it gives back\n                if (held != null) held.release();\n                activeTrip.remove(rider.id(), MATCHING);\n            }\n        }\n    }\n\n    /**\n     * What the rider&#x27;s map shows before he books: the k nearest FREE cars of his tier, nearest first. The same nine\n     * cells as matching, then a heap that keeps only the k nearest, so it costs O(c log k) for c cars nearby. Each\n     * distance is read once, so a ping landing mid-sort cannot upset the order. Changes nothing.\n     */\n    List&lt;Driver&gt; nearestFree(Location pickup, VehicleType type, int k) {\n        if (k &lt;= 0) return List.of();\n        Comparator&lt;Map.Entry&lt;Driver, Double&gt;&gt; byKm = Map.Entry.comparingByValue();\n        PriorityQueue&lt;Map.Entry&lt;Driver, Double&gt;&gt; keep = new PriorityQueue&lt;&gt;(byKm.reversed());   // farthest on top\n        for (Driver d : index.nearby(pickup)) {\n            if (d.status() != DriverStatus.AVAILABLE || d.vehicle().type() != type) continue;\n            keep.add(Map.entry(d, d.location().distanceKm(pickup)));\n            if (keep.size() &gt; k) keep.poll();                               // drop the farthest: k stay\n        }\n        List&lt;Map.Entry&lt;Driver, Double&gt;&gt; out = new ArrayList&lt;&gt;(keep);\n        out.sort(byKm);\n        return out.stream().map(Map.Entry::getKey).toList();\n    }\n\n    /** The car is at the kerb. */\n    Trip driverArrived(String tripId) {\n        Trip t = trip(tripId);\n        t.arrived(clock.nowMs());\n        publish(t, TripStatus.ASSIGNED, TripStatus.ARRIVED);\n        return t;\n    }\n\n    /**\n     * The rider is in. The trip goes IN_PROGRESS and the driver RESERVED -&gt; ON_TRIP in one step under the trip&#x27;s\n     * monitor, the same lock endTrip and cancelTrip hold, so nobody ever sees one of the two moves without the other.\n     */\n    Trip startTrip(String tripId) {\n        Trip t = trip(tripId);\n        synchronized (t) {\n            t.started(clock.nowMs());                                        // validated first: an early start throws here\n            t.driver().board();                                              // he can only be RESERVED for this trip here\n        }\n        publish(t, TripStatus.ARRIVED, TripStatus.IN_PROGRESS);\n        return t;\n    }\n\n    /**\n     * The other critical step, and it has the opposite shape to the first one. Claiming a driver had to happen\n     * BEFORE anything was written; a ride cannot be un-driven, so here the ride is committed first and the money\n     * follows. The order is: check the distance, price it (writes nothing, and it may throw), then under the trip&#x27;s\n     * monitor record that the ride ended AND put the car back in the pool, and only then call the gateway, outside\n     * every lock, with the trip id as the idempotency key. A declined card leaves the trip COMPLETED_UNPAID, the\n     * driver free and the rider free to book again; retryPayment finishes the money later, and charges once. Money\n     * trouble must never hold a car, or a rider, hostage.\n     */\n    Trip endTrip(String tripId, double distanceKm) {\n        if (!(distanceKm &gt;= 0) || Double.isInfinite(distanceKm))                    // NaN fails the &gt;= test too\n            throw new IllegalArgumentException(&quot;a driven distance must be a number &gt;= 0, got &quot; + distanceKm);\n        Trip t = trip(tripId);\n        long now = clock.nowMs();\n        long mins = Math.max(1, Math.round((now - t.startedAtMs()) / 60_000.0));      // every ride bills at least a minute\n        long fare = pricing.price(new FareBasis(t.type(), distanceKm, mins, t.pickup(), now));\n        synchronized (t) {\n            t.ended(distanceKm, mins, fare, now);                                    // guarded: a second endTrip throws\n            t.driver().release();                                                    // the car is free before the money\n        }\n        activeTrip.remove(t.rider().id(), t.id());                                   // and so is the rider&#x27;s one-ride slot\n        publish(t, TripStatus.IN_PROGRESS, TripStatus.COMPLETED_UNPAID);\n        settle(t);\n        return t;\n    }\n\n    /**\n     * Try the money again on a trip the gateway refused. Refused BEFORE the gateway is called unless the trip is\n     * COMPLETED_UNPAID, so a retry can never send the trip&#x27;s key with a fare that is not final yet.\n     */\n    Trip retryPayment(String tripId) {\n        Trip t = trip(tripId);\n

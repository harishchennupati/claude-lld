catch; test 6: the put still stands</text></g><g transform=\"translate(30 258)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a stale value is served for ever</text></g><path d=\"M350 276 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 258)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lazy expiry on the read; test 7: an injected clock, then a miss</text></g><g transform=\"translate(30 298)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LFU evicts the newest of a tie</text></g><path d=\"M350 316 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 298)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">each frequency bucket is itself an LRU list; test 8: the older one leaves</text></g><g transform=\"translate(30 338)\"><rect width=\"320\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a scan evicts the working set</text></g><path d=\"M350 356 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 338)\"><rect width=\"820\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a door: the newcomer must beat the victim; test 10: all 40 hot keys survive</text></g><text x=\"615\" y=\"398\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a failure test: FailureTests.java runs twenty-one blocks, sixty checks, and must print ALL PASS</text></svg></div><div class=\"move\"><p>A read that does not count as a use (the cache then evicts exactly the keys it is busiest with). Inserting before evicting (the count goes one over capacity: the easiest bug here to spot if the interviewer watches the size). The map and the list drifting apart (unlink from both in one step, or a row leaks for ever). An overwrite creating a second node. The database behind the loader being down, or a put racing the load (the ticket: nothing stale is written, and the retry works). A write-back listener that throws (it runs after the unlock, in a try/catch). A stale value served for ever (expiry is checked on the read that finds it). And LFU breaking a tie by the wrong rule (each frequency bucket is itself a recency list, so of two entries used once, the one used longer ago leaves). The last row is not a bug at all, and it is the one that actually costs money. A nightly report reads a million rows, and each one is the most recently used entry the moment it arrives. By morning the working set (the keys real users keep asking for) is gone. No eviction rule fixes that; an <i>admission</i> rule does, and it is question 11 on page 05. FailureTests.java runs twenty-one blocks and sixty checks; a design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"230\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"320\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"880\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"230\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">new LfuCache&lt;&gt;(1000) / new AdmissionLruCache&lt;&gt;(1000): the policy IS the class</text><text x=\"880\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">swap the rule without opening a caller</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"230\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">new StatsCache&lt;&gt;(cache);  new SingleFlightLoader&lt;&gt;(loader)</text><text x=\"880\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">stats and de-duplication, cache untouched</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"230\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"320\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">fire(key, value, CAPACITY) after the unlock, in a try/catch</text><text x=\"880\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">the store hears; the cache never waits</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"230\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">EvictionCause, and the ABSENT / RESIDENT / EXPIRED order</text><text x=\"880\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">an entry cannot be half-evicted</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--acc)\">Builder</text><text x=\"230\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">CacheBuilder.newBuilder().maximumSize(1000).expireAfterWrite(60s)</text><text x=\"880\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">six optional knobs: here it EARNS its place</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Template Method</text><text x=\"230\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not earned</text><text x=\"320\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">LockedCache holds state and helpers; it does not own get or put</text><text x=\"880\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">either cache can be read on its own</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"230\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"320\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">a cache is handed to its callers; nothing calls getInstance()</text><text x=\"880\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh one</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"230\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">in build()</text><text x=\"320\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">lfu ? new LfuCache&lt;&gt;(n) : new LruCache&lt;&gt;(n) -- one line</text><text x=\"880\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">it grows a name when policies come from config</text><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>Strategy is move 3, and here it is unusually clean. The policy is not a field on the cache; it is the whole implementation, so LRU, LFU and the admission cache are three classes behind one interface. Decorator is the same move's wrapper, and this problem has three. <code>StatsCache</code> counts hits from outside; <code>SynchronizedCache</code> adds a lock; and <code>SingleFlightLoader</code> wraps one loader in another, so that a thousand simultaneous misses on one key make one database call. Observer is move 4's rule that a slow listener runs after the unlock; State is move 6. And here is the one that differs from every other problem in this set: <b>Builder earns its place</b>. Capacity, TTL, policy, loader, listener, clock and stats are seven knobs, and six are optional. A seven-argument constructor full of nulls is worse than a chain of named calls, which is exactly why Guava ships <code>CacheBuilder</code> and Caffeine ships <code>Caffeine.newBuilder()</code>. The rule has not changed; the optional fields have.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Node holds links. RecencyList splices. LruCache owns the policy and the lock.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">LfuCache, StatsCache and AdmissionLruCache all exist; LruCache was never opened</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">cache.get(key);  never \"is this the LFU one?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">Clock, CacheLoader, EvictionListener: one method, so a fake is a lambda</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">cache.configure(loader, listener);  cache.setClock(() -&gt; now[0])</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>The table is the answer. What is worth saying out loud is that only one letter has a real trap on this problem. L says any implementation can stand in for another, and nothing asks which one it got. But a decorator that forgets to delegate <code>size()</code>, or a policy that quietly stops moving a key to the front on a read, breaks that promise <i>while still compiling</i>. Neither mistake fails to build and neither throws; the cache just gets slowly worse, which is the kind of failure that survives code review. That is what the failure tests are for. Test 1 catches a policy that stopped moving keys on a read; a wrapper that under-reports the size shows up the first time the dashboard disagrees with the cache.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">LFU, weighted by bytes, a door on the front</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind Cache; not one caller changes</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">hit rate, write-back, metrics</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more listener, or one more wrapper around Cache</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">expired, dirty, in flight</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more cause and one more checked transition</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across entries</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a budget in bytes, not entries</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the check AND the loop of evictions inside the SAME lock</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a crash; Redis in front of the database</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a log replayed on restart, or the far store as the loader</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">and a conditional UPDATE by version, plus an invalidation message</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five, Node, RecencyList and the failure tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (LFU, weighted by bytes, an admission door) is a new class behind <code>Cache</code>, and not one caller changes. Someone new who wants to know is one more listener or one more wrapper. A new step in an entry's life is one more cause and one more checked transition. A new invariant across entries (a budget in bytes instead of a count) is the check <i>and</i> a loop of evictions, inside the same lock. It is a loop because one big value can push out several small ones. And state that must outlive the process is a log or a shared store. Either the cache appends every change to a file before making it, and replays the file on restart. Or the far store becomes the loader, and its write becomes a conditional update (write only if my version is newer than the stored one). An invalidation message then tells the other servers to drop their copy. For all five, <code>Node</code>, <code>RecencyList</code> and the failure tests do not change; that is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 930\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M605 200L605 154\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M460 450L460 428L540 428L540 402\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M820 450L820 428L690 428L690 402\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M260 451L285 451L285 87L430 87\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M260 598L285 598L285 112L430 112\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M260 751L285 751L285 301L430 301\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M135 265L135 234\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--m sform=\"translate(430 200)\"><rect width=\"350\" height=\"202\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"175.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\" font-style=\"italic\">LockedCache</text><line x1=\"0\" y1=\"26\" x2=\"350\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">lock: ReentrantLock</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">loader, listener: handed in</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">clock: Clock</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">ttlMs, restartOnRead</text><text x=\"8\" y=\"103\" font-size=\"11.5\" fill=\"var(--muted)\">loading: key -&gt; ticket</text><line x1=\"0\" y1=\"112\" x2=\"350\" y2=\"112\" stroke=\"var(--line)\"/><text x=\"8\" y=\"125\" font-size=\"11.5\" fill=\"var(--text)\">configure(loader, listener)</text><text x=\"8\" y=\"141\" font-size=\"11.5\" fill=\"var(--text)\">setClock(c) / setTtlMs(ms, onRead)</text><text x=\"8\" y=\"157\" font-size=\"11.5\" fill=\"var(--text)\">stamp() / expired(n) / touched(n)</text><text x=\"8\" y=\"173\" font-size=\"11.5\" fill=\"var(--text)\">start / finish / cancelLoad(key)</text><text x=\"8\" y=\"189\" font-size=\"11.5\" fill=\"var(--text)\">fire(k, v, cause) -- after unlock</text></g><g transform=\"translate(300 450)\"><rect width=\"320\" height=\"170\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"160.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">LruCache</text><line x1=\"0\" y1=\"26\" x2=\"320\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">capacity: int</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">index: Map&lt;K, Node&gt;</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">order: RecencyList</text><line x1=\"0\" y1=\"80\" x2=\"320\" y2=\"80\" stroke=\"var(--line)\"/><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">get(key) / put(key, value)</text><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">write(key, value, ticket)</text><text x=\"8\" y=\"125\" font-size=\"11.5\" fill=\"var(--text)\">remove(key) / evictionOrder()</text><text x=\"8\" y=\"141\" font-size=\"11.5\" fill=\"var(--text)\">sweepExpired() / expireIfDue(k)</text><text x=\"8\" y=\"157\" font-size=\"11.5\" fill=\"var(--text)\">consistent(): boolean</text></g><g transform=\"translate(650 450)\"><rect width=\"340\" height=\"186\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"170.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">LfuCache</text><line x1=\"0\" y1=\"26\" x2=\"340\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">capacity: int</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">index: Map&lt;K, Node&gt;</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">buckets: Map&lt;count, list&gt;</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">minFreq: int</text><line x1=\"0\" y1=\"96\" x2=\"340\" y2=\"96\" stroke=\"var(--line)\"/><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">get(key) / put(key, value)</text><text x=\"8\" y=\"125\" font-size=\"11.5\" fill=\"var(--text)\">write(key, value, ticket)</text><text x=\"8\" y=\"141\" font-size=\"11.5\" fill=\"var(--text)\">remove(key) / evictionOrder()</text><text x=\"8\" y=\"157\" font-size=\"11.5\" fill=\"var(--text)\">bump(node): one more use</text><text x=\"8\" y=\"173\" font-size=\"11.5\" fill=\"var(--text)\">frequencyOf(key): int</text></g><g transform=\"translate(1030 20)\"><rect width=\"200\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"100.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"100.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">EvictionCause</text><line x1=\"0\" y1=\"34\" x2=\"200\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">CAPACITY, EXPIRED,</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">REPLACED, REMOVED</text></g><g transform=\"translate(1030 130)\"><rect width=\"200\" height=\"114\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"100.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Node</text><line x1=\"0\" y1=\"26\" x2=\"200\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">key: K  (final)</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">value: V</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">prev, next: Node</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">freq: int</text><text x=\"8\" y=\"103\" font-size=\"11.5\" fill=\"var(--muted)\">expireAtMs: long</text></g><g transform=\"translate(420 690)\"><rect width=\"350\" height=\"138\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"175.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RecencyList</text><line x1=\"0\" y1=\"26\" x2=\"350\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">head, tail: sentinel nodes</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">size: int</text><line x1=\"0\" y1=\"64\" x2=\"350\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">addFirst(n) / moveToFirst(n)</text><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">unlink(n)</text><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">last(): the next victim</text><text x=\"8\" y=\"125\" font-size=\"11.5\" fill=\"var(--text)\">keysOldestFirst(): List&lt;K&gt;</text></g><g><path d=\"M20 900L64 900\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"904\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 900L284 900\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"904\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 900L504 900\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"904\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 900L684 900\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"904\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 900L904 900\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"904\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (<i>italic</i> = abstract, never <code>new</code>-ed; dashed border = interface; &laquo;enum&raquo; = a fixed list of values; &laquo;Extensions.java&raquo; = a follow-up's class rather than part of the hour). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = extends or implements. Filled diamond = owns: each cache owns its order &mdash; one list for LRU, one list per use-count for LFU &mdash; and the list owns the nodes. Plain arrow = references. Dashed green = handed in through <code>configure()</code>. Dotted blue = notifies. <b>Where state lives:</b> a <code>Node</code> holds the key, the value, its two links, its use-count and its expiry; it is the only object with per-entry state. <code>RecencyList</code> holds nothing but two sentinels and a count, and does nothing but splice. <code>LockedCache</code> holds the one lock, the three handed-in rules and the tickets of the loads in flight. Each cache holds its capacity, its map and its order. Follow the two arrows into <code>Node</code>: the map points at it and the list points at it, and that is the entire design, two indexes over one object. Notice what is <i>not</i> here. There is no Entry class separate from the node: they are the same thing, which is what makes eviction O(1). And there is no policy field on the cache, because the policy <i>is</i> the class. That is why <code>AdmissionLruCache</code>, the one with a frequency sketch on its door, sits beside the other two, not inside them.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does and what it guarantees; read only those first for the shape, then the bodies for the pointer surgery. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (twenty-one claims, sixty checks; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * Why a value left the cache. The callback fires for every exit, not only the capacity one, because a\n * write-back store has to be told about all four: CAPACITY (the cache was full), EXPIRED (its time ran out),\n * REPLACED (a new value overwrote it) and REMOVED (a caller asked).\n */\nenum EvictionCause { CAPACITY, EXPIRED, REPLACED, REMOVED }\n\n/** Where time comes from. Injected, so a TTL test can jump an hour forward without sleeping for an hour. */\ninterface Clock { long nowMs(); }\n\n/**\n * Where a miss goes: a database read, an HTTP call, a computation. It is slow and it is allowed to throw,\n * which is exactly why the cache calls it with no lock held and writes nothing until it comes back.\n */\ninterface CacheLoader&lt;K, V&gt; {\n    /** The value for this key, or null if the source does not have one. May throw; the cache is unchanged if it does. */\n    V load(K key);\n}\n\n/**\n * Told after a value has left the cache. Called after the lock is released and inside a try/catch, so a slow\n * or broken listener can neither stall a cache operation nor leave the two indexes disagreeing. The price:\n * notices from two threads can arrive in either order, so a listener must not depend on arrival order.\n */\ninterface EvictionListener&lt;K, V&gt; {\n    /** One value left, and why. Runs on the thread that caused it, with no cache lock held. */\n    void onEvict(K key, V value, EvictionCause cause);\n}\n\n/**\n * The contract every cache in this file honours. This is the seam that makes &quot;now evict the least-FREQUENTLY\n * used instead&quot; a new class and one constructor line: a caller holds a Cache, never an LruCache.\n */\ninterface Cache&lt;K, V&gt; {\n    /** The value, or null on a miss. A read counts as a use: it changes the eviction order. */\n    V get(K key);\n    /** Insert or overwrite; returns the value that was there, or null. May evict exactly one entry. */\n    V put(K key, V value);\n    /** Drop this key now; returns the value that was there, or null. */\n    V remove(K key);\n    /** How many entries are resident. Never more than capacity(). */\n    int size();\n    /** The fixed budget, in entries. */\n    int capacity();\n    /** The keys in the order this cache would evict them, next victim first. O(n); for tests and debugging. */\n    List&lt;K&gt; evictionOrder();\n}\n\n/**\n * One entry, and one node of an order list, in the same object. The key rides INSIDE the node because\n * eviction starts from the order list and then has to delete that entry from the map: without the key in\n * hand that delete would be a scan of the whole map.\n */\nfinal class Node&lt;K, V&gt; {\n    final K key;                       // final: the identity of an entry never changes\n    V value;\n    Node&lt;K, V&gt; prev, next;             // the links of whichever list this node is currently in\n    int freq = 1;                      // LFU only: how many times this entry has been used\n    long expireAtMs;                   // 0 = never expires\n\n    Node(K key, V value, long expireAtMs) { this.key = key; this.value = value; this.expireAtMs = expireAtMs; }\n}\n\n/**\n * A doubly linked list of nodes with two sentinels, so every splice is straight-line pointer writes with no\n * empty-list or single-element special case. Doubly linked because eviction must unlink a node found through\n * the map, from the middle, without walking to its predecessor. Front = newest, back = the next victim.\n */\nfinal class RecencyList&lt;K, V&gt; {\n    private final Node&lt;K, V&gt; head = new Node&lt;&gt;(null, null, 0);   // sentinel: nothing before the newest\n    private final Node&lt;K, V&gt; tail = new Node&lt;&gt;(null, null, 0);   // sentinel: nothing after the oldest\n    private int size;\n\n    RecencyList() { head.next = tail; tail.prev = head; }\n\n    /** Splice n in as the newest. O(1). */\n    void addFirst(Node&lt;K, V&gt; n) {\n        n.prev = head; n.next = head.next;\n        head.next.prev = n; head.next = n;\n        size++;\n    }\n    /** Splice n out from wherever it is. O(1), and it is the reason the list is doubly linked. */\n    void unlink(Node&lt;K, V&gt; n) {\n        n.prev.next = n.next; n.next.prev = n.prev;\n        n.prev = null; n.next = null;\n        size--;\n    }\n    /** &quot;This entry was just used.&quot; Two splices, still O(1). */\n    void moveToFirst(Node&lt;K, V&gt; n) { unlink(n); addFirst(n); }\n    /** The oldest node: the one this list would give up next, or null if the list is empty. */\n    Node&lt;K, V&gt; last() { return size == 0 ? null : tail.prev; }\n    boolean isEmpty() { return size == 0; }\n    int size() { return size; }\n\n    /** The keys from newest to oldest. Walks the links, so it is the honest view of the order. */\n    List&lt;K&gt; keysNewestFirst() {\n        List&lt;K&gt; out = new ArrayList&lt;&gt;(size);\n        for (Node&lt;K, V&gt; n = head.next; n != tail; n = n.next) out.add(n.key);\n        return out;\n    }\n    /** The keys from oldest to newest: the order in which this list would give them up. */\n    List&lt;K&gt; keysOldestFirst() {\n        List&lt;K&gt; out = new ArrayList&lt;&gt;(size);\n        for (Node&lt;K, V&gt; n = tail.prev; n != head; n = n.prev) out.add(n.key);\n        return out;\n    }\n}\n\n/**\n * Everything both caches share: the one lock, the three rules they are handed, and the discipline that the\n * slow things happen outside the lock. It holds state and helpers; it does not own the algorithm, so get and\n * put are written out in full in each cache and either one can be read on its own.\n */\nabstract class LockedCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    /** One lock per cache. Every operation mutates (a get reorders), so there are no pure readers to separate. */\n    final ReentrantLock lock = new ReentrantLock();\n    // volatile: a rule handed in by one thread is seen by the very next read on any other thread, even one\n    // that reads it without taking the lock (load and fire run outside the lock)\n    private volatile CacheLoader&lt;K, V&gt; loader = key -&gt; null;               // default: a miss is just a miss\n    private volatile EvictionListener&lt;K, V&gt; listener = (k, v, c) -&gt; { };   // default: nobody is listening\n    private volatile Clock clock = System::currentTimeMillis;\n    private volatile long ttlMs = 0;                                       // 0 = entries never expire\n    private volatile boolean restartOnRead = false;                        // true = expire after the last USE\n    /** Keys being loaded right now, each with the ticket its load was given. Only touched with the lock held. */\n    private final Map&lt;K, Object&gt; loading = new HashMap&lt;&gt;();\n\n    /** Hand in the rules. The cache never builds them, which is why a test can hand in a loader that throws. */\n    void configure(CacheLoader&lt;K, V&gt; loader, EvictionListener&lt;K, V&gt; listener) {\n        this.loader = Objects.requireNonNull(loader);\n        this.listener = Objects.requireNonNull(listener);\n    }\n    /** Tests hand in a fixed instant so a TTL can be crossed without waiting for it. */\n    void setClock(Clock c) { this.clock = Objects.requireNonNull(c); }\n    /** Expire-after-write, in milliseconds: the time runs from the last put. 0 turns expiry off. */\n    void setTtlMs(long ttlMs) { setTtlMs(ttlMs, false); }\n    /** restartOnRead = expire-after-ACCESS: every hit pushes the deadline out again, not only every put. */\n    void setTtlMs(long ttlMs, boolean restartOnRead) { this.ttlMs = ttlMs; this.restartOnRead = restartOnRead; }\n\n    /** The expiry stamp to put on an entry written now, or 0 when there is no TTL. */\n    long stamp() { return ttlMs &lt;= 0 ? 0 : clock.nowMs() + ttlMs; }\n    /** Is this entry past its time? Checked lazily, on the read that finds it. */\n    boolean expired(Node&lt;K, V&gt; n) { return n.expireAtMs &gt; 0 &amp;&amp; clock.nowMs() &gt;= n.expireAtMs; }\n    /** A hit. With expire-after-access its deadline moves; with expire-after-write it stays where the put left it. */\n    void touched(Node&lt;K, V&gt; n) { if (restartOnRead) n.expireAtMs = stamp(); }\n    /** The read-through loader. ALWAYS called with no lock held: it is milliseconds, the lock is nanoseconds. */\n    V load(K key) { return loader.load(key); }\n    /** Tell the listener. Only ever called after the lock has been released, and it swallows a broken listener. */\n    void fire(K key, V value, EvictionCause cause) {\n        try { listener.onEvict(key, value, cause); }\n        catch (RuntimeException e) { /* a listener is a bystander: it cannot be allowed to break the cache */ }\n    }\n\n    // Tickets. A miss takes a ticket before it loads; a put or remove of that key tears the ticket up; the load\n    // may write its value only if its ticket is still there when it comes back. Without this, a slow load could\n    // overwrite a newer put, or bring back a key that was removed while it was loading.\n    /** A miss is about to load this key. Call with the lock held. */\n    Object startLoad(K key) { Object ticket = new Object(); loading.put(key, ticket); return ticket; }\n    /** A put or remove of this key: any load already running for it is now out of date. Call with the lock held. */\n    void cancelLoad(K key) { loading.remove(key); }\n    /** The load came back: may it write? Only if nobody put or removed the key meanwhile. Call with the lock held. */\n    boolean finishLoad(K key, Object ticket) { return loading.remove(key, ticket); }\n    /** The load threw or found nothing: hand the ticket back, so the map of loads cannot grow for ever. */\n    void abandonLoad(K key, Object ticket) { lock.lock(); try { loading.remove(key, ticket); } finally { lock.unlock(); } }\n}\n\n/**\n * The cache itself: a hash map from key to node, and one recency list over the very same nodes. The map\n * answers &quot;the value for this key&quot; in O(1) but has no order; the list has order but no lookup; pointing both\n * at one node object is the whole trick, and everything else on this page is bookkeeping.\n *\n * The invariant, in one line: the map and the list always name exactly the same keys, and there is never one\n * more entry than the capacity -- not even for an instant.\n */\nfinal class LruCache&lt;K, V&gt; extends LockedCache&lt;K, V&gt; {\n    private final int capacity;\n    private final Map&lt;K, Node&lt;K, V&gt;&gt; index;                       // key -&gt; the node that holds its value\n    private final RecencyList&lt;K, V&gt; order = new RecencyList&lt;&gt;();  // the same nodes, newest at the front\n\n    LruCache(int capacity) {\n        if (capacity &lt;= 0) throw new IllegalArgumentException(&quot;capacity must be positive, not &quot; + capacity);\n        this.capacity = capacity;\n        this.index = new HashMap&lt;&gt;(capacity * 2);                 // sized so a full cache never rehashes\n    }\n\n    /**\n     * A hit moves the entry to the front, because a read is a use. A miss, or an entry whose time has run out,\n     * takes a ticket and calls the loader with NO lock held. Only a value that came back is written, and only\n     * if its ticket survived: a loader that throws or returns null leaves the cache exactly as it was, and a\n     * put or remove that landed during the load is never undone by it.\n     */\n    public V get(K key) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        K deadKey = null; V deadValue = null; Object ticket;\n        lock.lock();\n        try {\n            Node&lt;K, V&gt; n = index.get(key);\n            if (n != null &amp;&amp; !expired(n)) { touched(n); order.moveToFirst(n); return n.value; }  // hot path: ~80 ns\n            if (n != null) { drop(n); deadKey = n.key; deadValue = n.value; }                    // stale: it leaves now\n            ticket = startLoad(key);             // a put or remove of this key while we load cancels it\n        } finally { lock.unlock(); }\n\n        if (deadKey != null) fire(deadKey, deadValue, EvictionCause.EXPIRED);\n        V loaded = null;\n        try { loaded = load(key); }              // outside the lock: milliseconds, and allowed to throw\n        finally { if (loaded == null) abandonLoad(key, ticket); }\n        if (loaded == null) return null;         // a miss stays a miss; nothing has been written\n        write(key, loaded, ticket);              // written only if nobody put or removed this key meanwhile\n        return loaded;\n    }\n\n    /**\n     * Insert or overwrite. The order is the design: an existing key is ONE node overwritten in place, never a\n     * second node; a new key into a full cache evicts the oldest FIRST and only then links the newcomer, so\n     * size is never capacity + 1; and the listener hears about it after the lock, never inside it.\n     */\n    public V put(K key, V value) { return write(key, value, null); }\n\n    /**\n     * The one write path. A put (no ticket) cancels any load running for this key, because the put&#x27;s value is\n     * newer. A load coming back (with its ticket) writes only if the ticket is still there.\n     */\n    private V write(K key, V value, Object ticket) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        Objects.requireNonNull(value, &quot;null values are not cached: null is how a miss is reported&quot;);\n        K evictedKey = null; V evictedValue = null, previous = null;\n        lock.lock();\n        try {\n            if (ticket == null) cancelLoad(key);                  // this value is newer than any load in flight\n            else if (!finishLoad(key, ticket)) return null;       // a put or remove got here first: it wins\n            Node&lt;K, V&gt; n = index.get(key);\n            if (n != null) {                                  // overwrite: one node, moved to the front\n                previous = n.value;\n                n.value = value; n.expireAtMs = stamp();\n                order.moveToFirst(n);\n            } else {\n                if (index.size() &gt;= capacity) {               // evict FIRST, so the cache is never over capacity\n                    Node&lt;K, V&gt; victim = order.last();\n                    drop(victim);\n                    evictedKey = victim.key; evictedValue = victim.value;\n                }\n                Node&lt;K, V&gt; fresh = new Node&lt;&gt;(key, value, stamp());\n                order.addFirst(fresh);                        // list and map are written in the same section:\n                index.put(key, fresh);                        // nobody can observe one without the other\n            }\n        } finally { lock.unlock(); }\n\n        if (evictedKey != null) fire(evictedKey, evictedValue, EvictionCause.CAPACITY);\n        if (previous != null) fire(key, previous, EvictionCause.REPLACED);\n        return previous;\n    }\n\n    /** Drop a key on request, e.g. because the row behind it changed. The listener hears REMOVED, after the lock. */\n    public V remove(K key) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        V gone = null;\n        lock.lock();\n        try {\n            cancelLoad(key);                     // a load already running must not bring the old row back\n            Node&lt;K, V&gt; n = index.get(key); if (n != null) { drop(n); gone = n.value; }\n        } finally { lock.unlock(); }\n        if (gone != null) fire(key, gone, EvictionCause.REMOVED);\n        return gone;\n    }\n\n    public int size() { lock.lock(); try { return index.size(); } finally { lock.unlock(); } }\n    public int capacity() { return capacity; }\n\n    /**\n     * Free expired entries now instead of on the next read. With expire-after-ACCESS every use restarts the\n     * clock, so the least recently used entry is always the first to expire: pop from the tail until the tail\n     * is fresh, O(1) per entry freed. With expire-after-write a read can move an old entry away from the tail,\n     * so this frees only what sits at the tail, and ExpirySweeper (Extensions.java) is the tool for that case.\n     */\n    int sweepExpired() {\n        List&lt;Node&lt;K, V&gt;&gt; dead = new ArrayList&lt;&gt;();\n        lock.lock();\n        try { for (Node&lt;K, V&gt; n = order.last(); n != null &amp;&amp; expired(n); n = order.last()) { drop(n); dead.add(n); } }\n        finally { lock.unlock(); }\n        for (Node&lt;K, V&gt; n : dead) fire(n.key, n.value, EvictionCause.EXPIRED);\n        return dead.size();\n    }\n\n    /** Drop this key only if its OWN deadline has passed. A sweeper&#x27;s note is a hint; the node&#x27;s stamp is the truth. */\n    boolean expireIfDue(K key) {\n        V gone = null;\n        lock.lock();\n        try { Node&lt;K, V&gt; n = index.get(key); if (n != null &amp;&amp; expired(n)) { drop(n); gone = n.value; } }\n        finally { lock.unlock(); }\n        if (gone != null) fire(key, gone, EvictionCause.EXPIRED);\n        return gone != null;\n    }\n\n    /** The keys the cache would give up, next victim first: the list read from the tail. */\n    public List&lt;K&gt; evictionOrder() { lock.lock(); try { return order.keysOldestFirst(); } finally { lock.unlock(); } }\n    /** Newest first: the same walk the other way round, which is how the demo prints the order. */\n    List&lt;K&gt; keysNewestFirst() { lock.lock(); try { return order.keysNewestFirst(); } finally { lock.unlock(); } }\n\n    /** Test hook: the two indexes must name exactly the same keys. If this is ever false, a splice went wrong. */\n    boolean consistent() {\n        lock.lock();\n        try { return order.size() == index.size() &amp;&amp; index.keySet().equals(new HashSet&lt;&gt;(order.keysNewestFirst())); }\n        finally { lock.unlock(); }\n    }\n\n    /** Out of both indexes in one step. Only ever called with the lock held. */\n    private void drop(Node&lt;K, V&gt; n) { index.remove(n.key); order.unlink(n); }\n}\n\n/**\n * The same cache with the other policy: evict the least-FREQUENTLY used. The recency list becomes one list\n * PER use-count, plus the smallest count currently in use, which keeps every operation O(1). Because each\n * bucket is itself a recency list, a tie between two entries used the same number of times is broken by\n * recency: of the entries used once, the one used longest ago leaves.\n */\nfinal class LfuCache&lt;K, V&gt; extends LockedCache&lt;K, V&gt; {\n    private final int capacity;\n    private final Map&lt;K, Node&lt;K, V&gt;&gt; index;\n    private final Map&lt;Integer, RecencyList&lt;K, V&gt;&gt; buckets = new HashMap&lt;&gt;();   // use-count -&gt; its entries, newest first\n    private int minFreq = 1;                              // the smallest use-count present; exact whenever the cache is full\n\n    LfuCache(int capacity) {\n        if (capacity &lt;= 0) throw new IllegalArgumentException(&quot;capacity must be positive, not &quot; + capacity);\n        this.capacity = capacity;\n        this.index = new HashMap&lt;&gt;(capacity * 2);\n    }\n\n    /** A hit counts one more use and moves the entry up a bucket. Same read-through and ticket rule as LruCache. */\n    public V get(K key) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        K deadKey = null; V deadValue = null; Object ticket;\n        lock.lock();\n        try {\n            Node&lt;K, V&gt; n = index.get(key);\n            if (n != null &amp;&amp; !expired(n)) { touched(n); bump(n); return n.value; }\n            if (n != null) { drop(n); deadKey = n.key; deadValue = n.value; }\n            ticket = startLoad(key);\n        } finally { lock.unlock(); }\n\n        if (deadKey != null) fire(deadKey, deadValue, EvictionCause.EXPIRED);\n        V loaded = null;\n        try { loaded = load(key); }\n        finally { if (loaded == null) abandonLoad(key, ticket); }\n        if (loaded == null) return null;\n        write(key, loaded, ticket);\n        return loaded;\n    }\n\n    /** Same order as the LRU cache: overwrite in place, or evict the least-used-then-oldest first and insert after. */\n    public V put(K key, V value) { return write(key, value, null); }\n\n    /** The one write path, with the same ticket rule as LruCache.write. */\n    private V write(K key, V value, Object ticket) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        Objects.requireNonNull(value, &quot;null values are not cached: null is how a miss is reported&quot;);\n        K evictedKey = null; V evictedValue = null, previous = null;\n        lock.lock();\n        try {\n            if (ticket == null) cancelLoad(key);\n            else if (!finishLoad(key, ticket)) return null;\n            Node&lt;K, V&gt; n = index.get(key);\n            if (n != null) {\n                previous = n.value;\n                n.value = value; n.expireAtMs = stamp();\n                bump(n);\n            } else {\n                if (index.size() &gt;= capacity) {\n                    Node&lt;K, V&gt; victim = buckets.get(minFreq).last();   // least used, and of those, least recent\n                    drop(victim);\n                    evictedKey = victim.key; evictedValue = victim.value;\n                }\n                Node&lt;K, V&gt; fresh = new Node&lt;&gt;(key, value, stamp());\n                index.put(key, fresh);\n                buckets.computeIfAbsent(1, f -&gt; new RecencyList&lt;&gt;()).addFirst(fresh);\n                minFreq = 1;                                           // a newcomer has been used once\n            }\n        } finally { lock.unlock(); }\n\n        if (evictedKey != null) fire(evictedKey, evictedValue, EvictionCause.CAPACITY);\n        if (previous != null) fire(key, previous, EvictionCause.REPLACED);\n        return previous;\n    }\n\n    public V remove(K key) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        V gone = null;\n        lock.lock();\n        try { cancelLoad(key); Node&lt;K, V&gt; n = index.get(key); if (n != null) { drop(n); gone = n.value; } }\n        finally { lock.unlock(); }\n        if (gone != null) fire(key, gone, EvictionCause.REMOVED);\n        return gone;\n    }\n\n    public int size() { lock.lock(); try { return index.size(); } finally { lock.unlock(); } }\n    public int capacity() { return capacity; }\n\n    /** Next victim first: the least-used bucket oldest-first, then each higher use-count in turn. */\n    public List&lt;K&gt; evictionOrder() {\n        lock.lock();\n        try {\n            List&lt;Integer&gt; freqs = new ArrayList&lt;&gt;(buckets.keySet());\n            Collections.sort(freqs);\n            List&lt;K&gt; out = new ArrayList&lt;&gt;(index.size());\n            for (int f : freqs) out.addAll(buckets.get(f).keysOldestFirst());\n            return out;\n        } finally { lock.unlock(); }\n    }\n\n    /** How often this key has been used. Test and demo only. */\n    int frequencyOf(K key) { lock.lock(); try { Node&lt;K, V&gt; n = index.get(key); return n == null ? 0 : n.freq; } finally { lock.unlock(); } }\n    /**\n     * Test hook: every node is in exactly one bucket, the buckets hold exactly the map&#x27;s keys, and whenever the\n     * cache is full (the only time minFreq is read) minFreq is the smallest use-count present.\n     */\n    boolean consistent() {\n        lock.lock();\n        try {\n            Set&lt;K&gt; inBuckets = new HashSet&lt;&gt;();\n            int count = 0;\n            for (Map.Entry&lt;Integer, RecencyList&lt;K, V&gt;&gt; e : buckets.entrySet()) {\n                if (e.getValue().isEmpty()) return false;              // an empty bucket must have been removed\n                inBuckets.addAll(e.getValue().keysNewestFirst());\n                count += e.getValue().size();\n            }\n            return count == index.size() &amp;&amp; inBuckets.equals(index.keySet())\n                &amp;&amp; (index.size() &lt; capacity || minFreq == Collections.min(buckets.keySet()));\n        } finally { lock.unlock(); }\n    }\n\n    /** One more use: out of its bucket, into the next one up, and mind the smallest count. O(1). */\n    private void bump(Node&lt;K, V&gt; n) {\n        RecencyList&lt;K, V&gt; from = buckets.get(n.freq);\n        from.unlink(n);\n        if (from.isEmpty()) {\n            buckets.remove(n.freq);\n            if (minFreq == n.freq) minFreq = n.freq + 1;               // the only entry at the bottom just moved up\n        }\n        n.freq++;\n        buckets.computeIfAbsent(n.freq, f -&gt; new RecencyList&lt;&gt;()).addFirst(n);\n    }\n\n    /**\n     * Out of the map and out of its bucket in one step. It never repairs minFreq, even when it empties the\n     * smallest bucket, and that is what keeps remove and expiry O(1) too: minFreq is only read when the cache\n     * is full, and a cache that has just lost an entry can only fill up again through an insert, which sets\n     * minFreq back to 1.\n     */\n    private void drop(Node&lt;K, V&gt; n) {\n        index.remove(n.key);\n        RecencyList&lt;K, V&gt; b = buckets.get(n.freq);\n        b.unlink(n);\n        if (b.isEmpty()) buckets.remove(n.freq);\n    }\n}\n\n/**\n * A listener that writes a value back to a store as it leaves the cache for good. Realistic in that it is\n * SLOW, which is the whole reason the cache calls it after releasing the lock.\n */\nclass WriteBackListener&lt;K, V&gt; implements EvictionListener&lt;K, V&gt; {\n    private final Map&lt;K, V&gt; store;\n    private final List&lt;String&gt; log = Collections.synchronizedList(new ArrayList&lt;&gt;());\n\n    WriteBackListener(Map&lt;K, V&gt; store) { this.store = store; }\n\n    /**\n     * Only CAPACITY and EXPIRED are written back: that value is leaving for good. A REPLACED value is already\n     * out of date (its newer value is still cached and is written when it leaves), and REMOVED was on purpose.\n     */\n    public void onEvict(K key, V value, EvictionCause cause) {\n        if (cause == EvictionCause.CAPACITY || cause == EvictionCause.EXPIRED) store.put(key, value);\n        log.add(cause + &quot; &quot; + key);\n    }\n    /** What this listener saw, in order. Demo and test only. */\n    List&lt;String&gt; log() { return log; }\n}\n\n/** A demo of the whole thing: the order after a read, an eviction, read-through, TTL, LFU, and a race. */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        // ---------- 1. the order after a read, and who leaves when the cache is full\n        Map&lt;String, String&gt; store = new HashMap&lt;&gt;();\n        WriteBackListener&lt;String, String&gt; writeBack = new WriteBackListener&lt;&gt;(store);\n        LruCache&lt;String, String&gt; cache = new LruCache&lt;&gt;(3);\n        cache.configure(key -&gt; null, writeBack);                // no loader yet: a miss is just a miss\n\n        cache.put(&quot;A&quot;, &quot;alpha&quot;); cache.put(&quot;B&quot;, &quot;bravo&quot;); cache.put(&quot;C&quot;, &quot;charlie&quot;);\n        System.out.println(&quot;newest first after A B C: &quot; + cache.keysNewestFirst());\n        cache.get(&quot;A&quot;);                                          // a read is a use: A is no longer the oldest\n        System.out.println(&quot;newest first after get(A): &quot; + cache.keysNewestFirst());\n        cache.put(&quot;D&quot;, &quot;delta&quot;);                                 // full, so the oldest -- B -- leaves\n        System.out.println(&quot;after put(D): &quot; + cache.keysNewestFirst() + &quot;  size=&quot; + cache.size()\n            + &quot;  B is gone: &quot; + (cache.get(&quot;B&quot;) == null) + &quot;  written back: &quot; + writeBack.log());\n\n        // ---------- 2. an overwrite is ONE node, not a second\n        cache.put(&quot;C&quot;, &quot;charlie-2&quot;);\n        System.out.println(&quot;after overwriting C: size=&quot; + cache.size() + &quot; value=&quot; + cache.get(&quot;C&quot;)\n            + &quot; the key appears once: &quot; + Collections.frequency(cache.keysNewestFirst(), &quot;C&quot;));\n\n        // ---------- 3. read-through: a miss loads from the store, outside the lock, and only then writes\n        Map&lt;String, String&gt; database = new HashMap&lt;&gt;(Map.of(&quot;x&quot;, &quot;from-db-x&quot;, &quot;y&quot;, &quot;from-db-y&quot;));\n        int[] reads = { 0 };\n        LruCache&lt;String, String&gt; readThrough = new LruCache&lt;&gt;(2);\n        readThrough.configure(key -&gt; { reads[0]++; return database.get(key); }, (k, v, c) -&gt; { });\n        System.out.println(&quot;read-through get(x) -&gt; &quot; + readThrough.get(&quot;x&quot;) + &quot;  database reads=&quot; + reads[0]);\n        System.out.println(&quot;read-through get(x) -&gt; &quot; + readThrough.get(&quot;x&quot;) + &quot;  database reads=&quot; + reads[0] + &quot; (a hit costs nothing)&quot;);\n        System.out.println(&quot;get(zzz), which no store has -&gt; &quot; + readThrough.get(&quot;zzz&quot;) + &quot;  size=&quot; + readThrough.size());\n\n        // ---------- 4. the loader&#x27;s database is down: nothing is written, and a retry works\n        LruCache&lt;String, String&gt; flaky = new LruCache&lt;&gt;(2);\n        boolean[] down = { true };\n        flaky.configure(key -&gt; { if (down[0]) throw new IllegalStateException(&quot;database unreachable&quot;); return &quot;late-&quot; + key; }, (k, v, c) -&gt; { });\n        try { flaky.get(&quot;k&quot;); } catch (IllegalStateException e) { System.out.println(&quot;expected: &quot; + e.getMessage() + &quot;; size is still &quot; + flaky.size()); }\n        down[0] = false;\n        System.out.println(&quot;after the database comes back, get(k) -&gt; &quot; + flaky.get(&quot;k&quot;) + &quot;  size=&quot; + flaky.size());\n\n        // ---------- 5. TTL, on an injected clock: no sleeping\n        long[] now = { 1_700_000_000_000L };\n        List&lt;String&gt; expiries = new ArrayList&lt;&gt;();\n        LruCache&lt;String, String&gt; ttl = new LruCache&lt;&gt;(10);\n        ttl.setClock(() -&gt; now[0]);\n        ttl.setTtlMs(60_000);                                    // one minute after it was written\n        ttl.configure(key -&gt; null, (k, v, c) -&gt; expiries.add(c + &quot; &quot; + k));\n        ttl.put(&quot;session&quot;, &quot;abc123&quot;);\n        now[0] += 59_000;\n        System.out.println(&quot;59s later: &quot; + ttl.get(&quot;session&quot;));\n        now[0] += 2_000;\n        System.out.println(&quot;61s later: &quot; + ttl.get(&quot;session&quot;) + &quot;  size=&quot; + ttl.size() + &quot;  listener saw &quot; + expiries);\n\n        // ---------- 6. the other policy: least-frequently used, ties broken by recency\n        LfuCache&lt;String, String&gt; lfu = new LfuCache&lt;&gt;(3);\n        lfu.put(&quot;hot&quot;, &quot;1&quot;); lfu.put(&quot;warm&quot;, &quot;2&quot;); lfu.put(&quot;cold&quot;, &quot;3&quot;);\n        lfu.get(&quot;hot&quot;); lfu.get(&quot;hot&quot;); lfu.get(&quot;warm&quot;);          // hot used 3x, warm 2x, cold 1x\n        lfu.put(&quot;new&quot;, &quot;4&quot;);                                     // cold is the least used: it leaves\n        System.out.println(&quot;LFU after put(new): &quot; + lfu.evictionOrder() + &quot; (victim first)  cold gone: &quot; + (lfu.get(&quot;cold&quot;) == null));\n        LfuCache&lt;String, String&gt; tie = new LfuCache&lt;&gt;(2);\n        tie.put(&quot;first&quot;, &quot;1&quot;); tie.put(&quot;second&quot;, &quot;2&quot;);            // both used once\n        tie.put(&quot;third&quot;, &quot;3&quot;);                                   // the tie is broken by recency: first leaves\n        System.out.println(&quot;LFU tie at frequency 1 -&gt; &quot; + tie.evictionOrder() + &quot;  &#x27;first&#x27; gone: &quot; + (tie.get(&quot;first&quot;) == null));\n\n        // ---------- 7. the race: fifty threads, twenty thousand distinct keys, one capacity-100 cache\n        final int threads = 50, perThread = 400, cap = 100;\n        LruCache&lt;String, String&gt; hot = new LruCache&lt;&gt;(cap);\n        AtomicInteger evicted = new AtomicInteger();\n        hot.configure(key -&gt; null, (k, v, c) -&gt; { if (c == EvictionCause.CAPACITY) evicted.incrementAndGet(); });\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; running = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; threads; t++) {\n            final int id = t;\n            running.add(pool.submit(() -&gt; {\n                go.await();\n                for (int i = 0; i &lt; perThread; i++) hot.put(&quot;t&quot; + id + &quot;-&quot; + i, &quot;v&quot;);\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : running) f.get();\n        pool.shutdown();\n        int inserted = threads * perThread, gone = evicted.get();\n        System.out.println(&quot;race: inserted=&quot; + inserted + &quot; evicted=&quot; + gone + &quot; resident=&quot; + hot.size()\n            + &quot;  evicted+resident=&quot; + (gone + hot.size()) + &quot; (must equal &quot; + inserted + &quot;)&quot;\n            + &quot;  map and list agree: &quot; + hot.consistent());\n        if (gone + hot.size() != inserted || hot.size() != cap || !hot.consistent())\n            throw new AssertionError(&quot;the cache lost or duplicated an entry under contention&quot;);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.io.IOException;\nimport java.nio.ByteBuffer;\nimport java.nio.channels.FileChannel;\nimport java.nio.charset.StandardCharsets;\nimport java.nio.file.*;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\nimport java.util.zip.CRC32;\n\n// Reference code for every follow-up on page 05. Nothing here edits Main.java: each twist is a new class that\n// either implements Cache, wraps a Cache, or is handed to a cache through configure().\n\n// ---- ext: stats -- the hit rate, as a wrapper, without touching either cache\n/**\n * &quot;What is the hit ratio?&quot; is not a change to the cache; it is another Cache that delegates and counts. It\n * composes with anything, because the seam it plugs into is the interface and not a class.\n *\n * One honest caveat: with a read-through loader a miss that the loader satisfies comes back non-null, so this\n * wrapper would call it a hit. Count the loader&#x27;s calls (as ExtDemo does) when that distinction matters.\n */\nfinal class StatsCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final Cache&lt;K, V&gt; inner;\n    private final AtomicLong hits = new AtomicLong(), misses = new AtomicLong(), writes = new AtomicLong();\n\n    StatsCache(Cache&lt;K, V&gt; inner) { this.inner = inner; }\n\n    public V get(K key) {\n        V v = inner.get(key);\n        if (v == null) misses.incrementAndGet(); else hits.incrementAndGet();\n        return v;\n    }\n    public V put(K key, V value) { writes.incrementAndGet(); return inner.put(key, value); }\n    public V remove(K key) { return inner.remove(key); }\n    public int size() { return inner.size(); }\n    public int capacity() { return inner.capacity(); }\n    public List&lt;K&gt; evictionOrder() { return inner.evictionOrder(); }\n\n    /** Hits over reads, 0 when nothing has been read yet. */\n    double hitRate() { long h = hits.get(), m = misses.get(); return h + m == 0 ? 0 : (double) h / (h + m); }\n    String summary() { return &quot;hits=&quot; + hits + &quot; misses=&quot; + misses + &quot; writes=&quot; + writes\n        + &quot; hitRate=&quot; + String.format(&quot;%.2f&quot;, hitRate()); }\n}\n\n// ---- ext: the locking decorator -- what it buys, and the one thing it cannot do\n/**\n * The textbook answer to &quot;make it thread-safe&quot;: wrap it. It is correct, it is five lines, and it is what you\n * write when the class you were handed is not yours to change.\n *\n * What it costs, and why the caches in Main.java hold their own lock instead: everything the inner cache does\n * now happens inside this lock, including the read-through loader (milliseconds against a database) and the\n * eviction listener (a write-back to a store). Only the owner of the lock can release it and THEN call the\n * listener, so from outside you cannot keep the slow things out of the critical section.\n */\nfinal class SynchronizedCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final Cache&lt;K, V&gt; inner;\n    SynchronizedCache(Cache&lt;K, V&gt; inner) { this.inner = inner; }\n\n    public synchronized V get(K key) { return inner.get(key); }\n    public synchronized V put(K key, V value) { return inner.put(key, value); }\n    public synchronized V remove(K key) { return inner.remove(key); }\n    public synchronized int size() { return inner.size(); }\n    public int capacity() { return inner.capacity(); }\n    public synchronized List&lt;K&gt; evictionOrder() { return inner.evictionOrder(); }\n}\n\n// ---- ext: bound by bytes -- a weight per entry, and a LOOP of evictions inside one lock\n/**\n * &quot;Bound it by memory, not by entry count.&quot; Capacity becomes a budget and each entry declares a weight, so a\n * single put can evict several entries -- or none, if what it replaced was bigger. The new invariant is &quot;the\n * sum of the weights never exceeds the budget&quot;, and the whole loop runs inside ONE lock: either the budget\n * holds when the lock is released, or nothing was written at all.\n */\nfinal class WeightedLruCache&lt;K, V&gt; extends LockedCache&lt;K, V&gt; {\n    private final long maxWeight;\n    private final ToLongFunction&lt;V&gt; weigher;\n    private final Map&lt;K, Node&lt;K, V&gt;&gt; index = new HashMap&lt;&gt;();\n    private final Map&lt;K, Long&gt; weights = new HashMap&lt;&gt;();\n    private final RecencyList&lt;K, V&gt; order = new RecencyList&lt;&gt;();\n    private long weight;\n\n    WeightedLruCache(long maxWeight, ToLongFunction&lt;V&gt; weigher) { this.maxWeight = maxWeight; this.weigher = weigher; }\n\n    public V get(K key) {\n        lock.lock();\n        try { Node&lt;K, V&gt; n = index.get(key); if (n == null) return null; order.moveToFirst(n); return n.value; }\n        finally { lock.unlock(); }\n    }\n\n    public V put(K key, V value) {\n        long w = weigher.applyAsLong(value);\n        if (w &lt; 0 || w &gt; maxWeight) throw new IllegalArgumentException(&quot;weight &quot; + w + &quot; is outside 0..&quot; + maxWeight);\n        List&lt;Node&lt;K, V&gt;&gt; evicted = new ArrayList&lt;&gt;();\n        V previous = null;\n        lock.lock();\n        try {\n            Node&lt;K, V&gt; n = index.get(key);\n            if (n != null) { previous = n.value; weight -= weights.get(key); n.value = value; order.moveToFirst(n); }\n            else { n = new Node&lt;&gt;(key, value, stamp()); order.addFirst(n); index.put(key, n); }\n            weights.put(key, w); weight += w;\n            while (weight &gt; maxWeight) {                      // a loop, not an if: one put can free several entries\n                Node&lt;K, V&gt; victim = order.last();\n                weight -= weights.remove(victim.key);\n                index.remove(victim.key); order.unlink(victim);\n                evicted.add(victim);\n            }\n        } finally { lock.unlock(); }\n        for (Node&lt;K, V&gt; v : evicted) fire(v.key, v.value, EvictionCause.CAPACITY);\n        return previous;\n    }\n\n    public V remove(K key) {\n        V gone = null;\n        lock.lock();\n        try { Node&lt;K, V&gt; n = index.remove(key); if (n != null) { order.unlink(n); weight -= weights.remove(key); gone = n.value; } }\n        finally { lock.unlock(); }\n        if (gone != null) fire(key, gone, EvictionCause.REMOVED);\n        return gone;\n    }\n\n    public int size() { lock.lock(); try { return index.size(); } finally { lock.unlock(); } }\n    /** There is no entry cap here: the budget is the weight. Reported so the interface still means something. */\n    public int capacity() { return (int) Math.min(maxWeight, Integer.MAX_VALUE); }\n    public List&lt;K&gt; evictionOrder() { lock.lock(); try { return order.keysOldestFirst(); } finally { lock.unlock(); } }\n    /** The bytes currently held. The whole point of this class. */\n    long weight() { lock.lock(); try { return weight; } finally { lock.unlock(); } }\n}\n\n// ---- ext: striping -- N segments, N locks, approximate global LRU\n/**\n * Rung two of the ladder. The keyspace is cut into independent segments by hash, each a whole little cache\n * with its own lock and its own order, so sixteen threads on sixteen different segments never meet.\n *\n * What you give up, and must say out loud: there is no longer one global recency order. A key can be evicted\n * from a crowded segment while an older key survives in a quiet one, so this is APPROXIMATE LRU -- exactly\n * the trade Guava&#x27;s cache makes (its segments each limit their own size). Caffeine keeps one global order\n * instead and makes the READS approximate: it records them in small buffers and may drop some when busy.\n */\nfinal class StripedCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final LruCache&lt;K, V&gt;[] segments;\n\n    @SuppressWarnings(&quot;unchecked&quot;)\n    StripedCache(int capacity, int stripes) {\n        this.segments = new LruCache[stripes];\n        int each = Math.max(1, capacity / stripes);\n        for (int i = 0; i &lt; stripes; i++) segments[i] = new LruCache&lt;&gt;(each);\n    }\n    /** Every segment is handed the same rules. */\n    void configure(CacheLoader&lt;K, V&gt; loader, EvictionListener&lt;K, V&gt; listener) {\n        for (LruCache&lt;K, V&gt; s : segments) s.configure(loader, listener);\n    }\n    /** Spread the low bits, the way HashMap does, so keys that differ only in their high bits do not pile up. */\n    private LruCache&lt;K, V&gt; segmentFor(K key) {\n        int h = key.hashCode(); h ^= (h &gt;&gt;&gt; 16);\n        return segments[Math.floorMod(h, segments.length)];\n    }\n    public V get(K key) { return segmentFor(key).get(key); }\n    public V put(K key, V value) { return segmentFor(key).put(key, value); }\n    public V remove(K key) { return segmentFor(key).remove(key); }\n    public int size() { int n = 0; for (LruCache&lt;K, V&gt; s : segments) n += s.size(); return n; }\n    public int capacity() { int n = 0; for (LruCache&lt;K, V&gt; s : segments) n += s.capacity(); return n; }\n    /** Segment by segment. There is deliberately no global order to report. */\n    public List&lt;K&gt; evictionOrder() {\n        List&lt;K&gt; out = new ArrayList&lt;&gt;();\n        for (LruCache&lt;K, V&gt; s : segments) out.addAll(s.evictionOrder());\n        return out;\n    }\n}\n\n// ---- ext: the stampede -- a thousand threads miss the same cold key; collapse them into one database read\n/**\n * A cold key that a thousand threads want at the same instant is a thousand database reads, because the\n * loader runs outside the lock on purpose. The fix is not to move it back inside: it is to make the LOADER\n * collapse duplicate work, so the first caller for a key does the read and everybody else waits on its result.\n * A CacheLoader wrapping a CacheLoader -- the same Decorator seam, one level down.\n */\nfinal class SingleFlightLoader&lt;K, V&gt; implements CacheLoader&lt;K, V&gt; {\n    private final CacheLoader&lt;K, V&gt; real;\n    private final ConcurrentMap&lt;K, FutureTask&lt;V&gt;&gt; inFlight = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicInteger calls = new AtomicInteger();\n\n    SingleFlightLoader(CacheLoader&lt;K, V&gt; real) { this.real = real; }\n\n    public V load(K key) {\n        FutureTask&lt;V&gt; mine = new FutureTask&lt;&gt;(() -&gt; { calls.incrementAndGet(); return real.load(key); });\n        FutureTask&lt;V&gt; running = inFlight.putIfAbsent(key, mine);\n        if (running == null) { running = mine; mine.run(); }       // I am the one who does the work\n        try { return running.get(); }                              // everybody else just waits for it\n        catch (ExecutionException e) {\n            Throwable cause = e.getCause();\n            throw cause instanceof RuntimeException r ? r : new RuntimeException(cause);\n        } catch (InterruptedException e) { Thread.currentThread().interrupt(); throw new RuntimeException(e); }\n        finally { inFlight.remove(key, mine); }                    // only the owner clears the slot\n    }\n    /** How many real loads happened. A thousand concurrent misses on one key should leave this at 1. */\n    int realLoads() { return calls.get(); }\n}\n\n// ---- ext: the sweeper -- proactive expiry, and why lazy is usually enough\n/**\n * Lazy expiry only frees an entry when somebody reads it, so a key that nobody ever asks for again holds its\n * memory until the capacity pushes it out. A sweeper is a second index ordered by expiry -- here a heap, in a\n * real system a timing wheel (a ring of time slots, each holding the keys due in it) -- that a background\n * tick drains. It is needed when entries can have DIFFERENT deadlines; with one fixed TTL a list in the right\n * order is enough (LruCache.sweepExpired for expire-after-access, the write-order list further down).\n *\n * The heap is only a hint about what to look at. A key written twice has two notes in it, and the older note\n * comes due while the newer value is still fresh, so the sweep asks the cache to drop the key only if the\n * node&#x27;s own deadline has passed.\n */\nfinal class ExpirySweeper&lt;K, V&gt; {\n    /** One &quot;look at this key at this time&quot; note. */\n    record Due&lt;K&gt;(long atMs, K key) { }\n\n    pri

 V&gt;&gt; index;\n    private final Map&lt;Integer, RecencyList&lt;K, V&gt;&gt; buckets = new HashMap&lt;&gt;();   // use-count -&gt; its entries, newest first\n    private int minFreq = 1;                              // the smallest use-count present; exact whenever the cache is full\n\n    LfuCache(int capacity) {\n        if (capacity &lt;= 0) throw new IllegalArgumentException(&quot;capacity must be positive, not &quot; + capacity);\n        this.capacity = capacity;\n        this.index = new HashMap&lt;&gt;(capacity * 2);\n    }\n\n    /** A hit counts one more use and moves the entry up a bucket. Same read-through and ticket rule as LruCache. */\n    public V get(K key) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        K deadKey = null; V deadValue = null; Object ticket;\n        lock.lock();\n        try {\n            Node&lt;K, V&gt; n = index.get(key);\n            if (n != null &amp;&amp; !expired(n)) { touched(n); bump(n); return n.value; }\n            if (n != null) { drop(n); deadKey = n.key; deadValue = n.value; }\n            ticket = startLoad(key);\n        } finally { lock.unlock(); }\n\n        if (deadKey != null) fire(deadKey, deadValue, EvictionCause.EXPIRED);\n        V loaded = null;\n        try { loaded = load(key); }\n        finally { if (loaded == null) abandonLoad(key, ticket); }\n        if (loaded == null) return null;\n        write(key, loaded, ticket);\n        return loaded;\n    }\n\n    /** Same order as the LRU cache: overwrite in place, or evict the least-used-then-oldest first and insert after. */\n    public V put(K key, V value) { return write(key, value, null); }\n\n    /** The one write path, with the same ticket rule as LruCache.write. */\n    private V write(K key, V value, Object ticket) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        Objects.requireNonNull(value, &quot;null values are not cached: null is how a miss is reported&quot;);\n        K evictedKey = null; V evictedValue = null, previous = null;\n        lock.lock();\n        try {\n            if (ticket == null) cancelLoad(key);\n            else if (!finishLoad(key, ticket)) return null;\n            Node&lt;K, V&gt; n = index.get(key);\n            if (n != null) {\n                previous = n.value;\n                n.value = value; n.expireAtMs = stamp();\n                bump(n);\n            } else {\n                if (index.size() &gt;= capacity) {\n                    Node&lt;K, V&gt; victim = buckets.get(minFreq).last();   // least used, and of those, least recent\n                    drop(victim);\n                    evictedKey = victim.key; evictedValue = victim.value;\n                }\n                Node&lt;K, V&gt; fresh = new Node&lt;&gt;(key, value, stamp());\n                index.put(key, fresh);\n                buckets.computeIfAbsent(1, f -&gt; new RecencyList&lt;&gt;()).addFirst(fresh);\n                minFreq = 1;                                           // a newcomer has been used once\n            }\n        } finally { lock.unlock(); }\n\n        if (evictedKey != null) fire(evictedKey, evictedValue, EvictionCause.CAPACITY);\n        if (previous != null) fire(key, previous, EvictionCause.REPLACED);\n        return previous;\n    }\n\n    public V remove(K key) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        V gone = null;\n        lock.lock();\n        try { cancelLoad(key); Node&lt;K, V&gt; n = index.get(key); if (n != null) { drop(n); gone = n.value; } }\n        finally { lock.unlock(); }\n        if (gone != null) fire(key, gone, EvictionCause.REMOVED);\n        return gone;\n    }\n\n    public int size() { lock.lock(); try { return index.size(); } finally { lock.unlock(); } }\n    public int capacity() { return capacity; }\n\n    /** Next victim first: the least-used bucket oldest-first, then each higher use-count in turn. */\n    public List&lt;K&gt; evictionOrder() {\n        lock.lock();\n        try {\n            List&lt;Integer&gt; freqs = new ArrayList&lt;&gt;(buckets.keySet());\n            Collections.sort(freqs);\n            List&lt;K&gt; out = new ArrayList&lt;&gt;(index.size());\n            for (int f : freqs) out.addAll(buckets.get(f).keysOldestFirst());\n            return out;\n        } finally { lock.unlock(); }\n    }\n\n    /** How often this key has been used. Test and demo only. */\n    int frequencyOf(K key) { lock.lock(); try { Node&lt;K, V&gt; n = index.get(key); return n == null ? 0 : n.freq; } finally { lock.unlock(); } }\n    /**\n     * Test hook: every node is in exactly one bucket, the buckets hold exactly the map&#x27;s keys, and whenever the\n     * cache is full (the only time minFreq is read) minFreq is the smallest use-count present.\n     */\n    boolean consistent() {\n        lock.lock();\n        try {\n            Set&lt;K&gt; inBuckets = new HashSet&lt;&gt;();\n            int count = 0;\n            for (Map.Entry&lt;Integer, RecencyList&lt;K, V&gt;&gt; e : buckets.entrySet()) {\n                if (e.getValue().isEmpty()) return false;              // an empty bucket must have been removed\n                inBuckets.addAll(e.getValue().keysNewestFirst());\n                count += e.getValue().size();\n            }\n            return count == index.size() &amp;&amp; inBuckets.equals(index.keySet())\n                &amp;&amp; (index.size() &lt; capacity || minFreq == Collections.min(buckets.keySet()));\n        } finally { lock.unlock(); }\n    }\n\n    /** One more use: out of its bucket, into the next one up, and mind the smallest count. O(1). */\n    private void bump(Node&lt;K, V&gt; n) {\n        RecencyList&lt;K, V&gt; from = buckets.get(n.freq);\n        from.unlink(n);\n        if (from.isEmpty()) {\n            buckets.remove(n.freq);\n            if (minFreq == n.freq) minFreq = n.freq + 1;               // the only entry at the bottom just moved up\n        }\n        n.freq++;\n        buckets.computeIfAbsent(n.freq, f -&gt; new RecencyList&lt;&gt;()).addFirst(n);\n    }\n\n    /**\n     * Out of the map and out of its bucket in one step. It never repairs minFreq, even when it empties the\n     * smallest bucket, and that is what keeps remove and expiry O(1) too: minFreq is only read when the cache\n     * is full, and a cache that has just lost an entry can only fill up again through an insert, which sets\n     * minFreq back to 1.\n     */\n    private void drop(Node&lt;K, V&gt; n) {\n        index.remove(n.key);\n        RecencyList&lt;K, V&gt; b = buckets.get(n.freq);\n        b.unlink(n);\n        if (b.isEmpty()) buckets.remove(n.freq);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>2 &middot; The prompt says users pick the eviction policy (LRU or FIFO today, LFU later) and the store when they create the cache. Show that shape.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Split the cache in two. A store (any <code>Map</code>) holds the values; an <code>EvictionPolicy</code> only hears which keys were used and answers which key should leave next. <code>PolicyCache</code> holds both under one lock. A put of a new key into a full store asks the policy for its victim, removes it from both, then stores the value and reports the use. LRU and FIFO are one class, <code>ListPolicy</code>. LRU moves a key to the front on every use; FIFO places it only when it first arrives. Test 17 shows the two losing different keys. The cost is a second index, because the policy keeps its own key-to-node map; the gain is one cache class for every policy. LFU plugs in the same way (<code>LfuCache</code>'s buckets without the values), and so does a policy that evicts the lowest rank some other service reports, with LRU breaking ties. Switching the policy of a live cache means building the new one from the keys already stored; their history is lost, so say so.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: pluggable policy -- a store plus an eviction policy, both chosen when the cache is built\n/**\n * The shape Flipkart-style machine-coding prompts ask for: &quot;users pick the store and the eviction policy when\n * they create the cache&quot;. The policy is split off from the values: it only hears which keys were used and\n * answers which key should leave next. The price is a second index (the policy keeps its own key-to-node\n * map); the gain is one cache class that serves every policy.\n */\ninterface EvictionPolicy&lt;K&gt; {\n    /** This key was just read or written. */\n    void keyUsed(K key);\n    /** This key has left the store: forget it. */\n    void keyRemoved(K key);\n    /** The key that should leave next, or null if there is none. It stays until keyRemoved is called. */\n    K victim();\n}\n\n/** LRU and FIFO are the same list. The only difference: does a repeat use move the key to the front? */\nfinal class ListPolicy&lt;K&gt; implements EvictionPolicy&lt;K&gt; {\n    /** A repeat use moves the key to the front: least recently used leaves first. */\n    static &lt;K&gt; ListPolicy&lt;K&gt; lru() { return new ListPolicy&lt;&gt;(true); }\n    /** A repeat use moves nothing: the first key in is the first out. */\n    static &lt;K&gt; ListPolicy&lt;K&gt; fifo() { return new ListPolicy&lt;&gt;(false); }\n\n    private final boolean moveOnUse;\n    private final Map&lt;K, Node&lt;K, Void&gt;&gt; nodes = new HashMap&lt;&gt;();\n    private final RecencyList&lt;K, Void&gt; order = new RecencyList&lt;&gt;();\n\n    private ListPolicy(boolean moveOnUse) { this.moveOnUse = moveOnUse; }\n\n    public void keyUsed(K key) {\n        Node&lt;K, Void&gt; n = nodes.get(key);\n        if (n == null) { n = new Node&lt;&gt;(key, null, 0); nodes.put(key, n); order.addFirst(n); }\n        else if (moveOnUse) order.moveToFirst(n);                // LRU moves it; FIFO leaves it where it arrived\n    }\n    public void keyRemoved(K key) { Node&lt;K, Void&gt; n = nodes.remove(key); if (n != null) order.unlink(n); }\n    public K victim() { Node&lt;K, Void&gt; n = order.last(); return n == null ? null : n.key; }\n}\n\n/**\n * The cache that prompt describes: a store (any Map) and an EvictionPolicy handed in at construction, under\n * one lock. LFU plugs in the same way: its policy is LfuCache&#x27;s buckets with the values taken out.\n */\nfinal class PolicyCache&lt;K, V&gt; {\n    private final int capacity;\n    private final Map&lt;K, V&gt; store;\n    private final EvictionPolicy&lt;K&gt; policy;\n    private final ReentrantLock lock = new ReentrantLock();\n\n    PolicyCache(int capacity, Map&lt;K, V&gt; store, EvictionPolicy&lt;K&gt; policy) {\n        if (capacity &lt;= 0) throw new IllegalArgumentException(&quot;capacity must be positive, not &quot; + capacity);\n        this.capacity = capacity; this.store = store; this.policy = policy;\n    }\n    /** The value or null. A hit is reported to the policy, which decides whether a read changes anything. */\n    V get(K key) {\n        lock.lock();\n        try { V v = store.get(key); if (v != null) policy.keyUsed(key); return v; }\n        finally { lock.unlock(); }\n    }\n    /** Insert or overwrite. A new key into a full cache first evicts the policy&#x27;s victim. */\n    V put(K key, V value) {\n        lock.lock();\n        try {\n            if (!store.containsKey(key) &amp;&amp; store.size() &gt;= capacity) {\n                K out = policy.victim();\n                store.remove(out); policy.keyRemoved(out);\n            }\n            V previous = store.put(key, value);\n            policy.keyUsed(key);\n            return previous;\n        } finally { lock.unlock(); }\n    }\n    /** Drop a key from the store and from the policy, in the same step. */\n    V remove(K key) {\n        lock.lock();\n        try { V v = store.remove(key); if (v != null) policy.keyRemoved(key); return v; }\n        finally { lock.unlock(); }\n    }\n    /** How many entries the store holds. */\n    int size() { lock.lock(); try { return store.size(); } finally { lock.unlock(); } }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; Fifty threads hammering one cache of a hundred. Prove nothing is lost and the count never goes over capacity, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading the count and writing the two indexes. Every operation does the whole read-modify-write inside one lock held by the cache: the lookup, the unlink of the victim from the list and the map, and the link of the newcomer. So no other writer can run in that gap. The proof is arithmetic, not a count. Fifty threads wait on one latch, then insert four hundred distinct keys each. Afterwards, the number the listener reported as evicted plus the number still resident must be exactly twenty thousand: a lost update leaves it short, a double count leaves it over. The test also checks the size after every put, and walks the list against the map's keys. Two things to say while you write it. A <code>ReadWriteLock</code> buys nothing, because a get moves a node, so there are no pure readers to let in together. And two thread-safe collections do not make a thread-safe cache. A <code>ConcurrentHashMap</code> next to a <code>ConcurrentLinkedDeque</code> (a double-ended queue) still has a gap between the two updates, and <code>deque.remove(key)</code> walks the whole deque, so it is O(n) as well.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 5. fifty threads, twenty thousand distinct keys, one cache of a hundred. The proof is arithmetic:\n        //    every key that went in either sits in the cache or was reported as evicted, exactly once. A lost\n        //    update would leave the two numbers short; a double count would leave them over.\n        final int threads = 50, perThread = 400, cap = 100;\n        LruCache&lt;String, String&gt; hot = new LruCache&lt;&gt;(cap);\n        AtomicInteger gone = new AtomicInteger();\n        AtomicInteger overCapacity = new AtomicInteger();\n        hot.configure(k -&gt; null, (k, v, c) -&gt; { if (c == EvictionCause.CAPACITY) gone.incrementAndGet(); });\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; running = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; threads; t++) {\n            final int id = t;\n            running.add(pool.submit(() -&gt; {\n                go.await();\n                for (int i = 0; i &lt; perThread; i++) {\n                    hot.put(&quot;t&quot; + id + &quot;-&quot; + i, &quot;v&quot;);\n                    if (hot.size() &gt; cap) overCapacity.incrementAndGet();   // sampled while the storm is running\n                }\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : running) f.get();\n        pool.shutdown();\n        int inserted = threads * perThread;\n        check(gone.get() + hot.size() == inserted, &quot;evicted (&quot; + gone.get() + &quot;) + resident (&quot; + hot.size()\n            + &quot;) = &quot; + inserted + &quot;: no entry was lost and none was counted twice&quot;);\n        check(hot.size() == cap, &quot;the cache is exactly full, not full-ish&quot;);\n        check(overCapacity.get() == 0, &quot;size was never observed above the capacity, not once in &quot; + inserted + &quot; puts&quot;);\n        check(hot.consistent(), &quot;after the race the map and the list still name exactly the same keys&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>4 &middot; One lock on a cache doing two hundred thousand gets a second. Have you serialised the whole system?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No. The locked part of a get is about eighty nanoseconds, so two hundred thousand of them are sixteen milliseconds of lock in every second: 1.6 per cent busy. A thread almost never finds it taken. The number that matters is what you keep out of the lock: one five-millisecond loader inside it would push that 1.6 per cent past a hundred. When traffic really does outgrow one lock, the next rung is the striped cache below. The key's hash picks one of sixteen segments, each a whole little cache with its own lock, map and order. Say its three costs out loud. There is no global recency order any more: a key can be evicted from a busy segment while an older key survives in a quiet one. That is approximate LRU, which is exactly what Guava ships. <code>size()</code> is a sum of sixteen snapshots taken at sixteen different instants, so it is a number to log, not one to branch on. And the capacity divides: a cache of a hundred in sixteen stripes is sixteen caches of six. A hot segment keeps evicting keys it still needs while a quiet one sits empty. Stripe only when capacity over stripes is still in the hundreds.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: striping -- N segments, N locks, approximate global LRU\n/**\n * Rung two of the ladder. The keyspace is cut into independent segments by hash, each a whole little cache\n * with its own lock and its own order, so sixteen threads on sixteen different segments never meet.\n *\n * What you give up, and must say out loud: there is no longer one global recency order. A key can be evicted\n * from a crowded segment while an older key survives in a quiet one, so this is APPROXIMATE LRU -- exactly\n * the trade Guava&#x27;s cache makes (its segments each limit their own size). Caffeine keeps one global order\n * instead and makes the READS approximate: it records them in small buffers and may drop some when busy.\n */\nfinal class StripedCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final LruCache&lt;K, V&gt;[] segments;\n\n    @SuppressWarnings(&quot;unchecked&quot;)\n    StripedCache(int capacity, int stripes) {\n        this.segments = new LruCache[stripes];\n        int each = Math.max(1, capacity / stripes);\n        for (int i = 0; i &lt; stripes; i++) segments[i] = new LruCache&lt;&gt;(each);\n    }\n    /** Every segment is handed the same rules. */\n    void configure(CacheLoader&lt;K, V&gt; loader, EvictionListener&lt;K, V&gt; listener) {\n        for (LruCache&lt;K, V&gt; s : segments) s.configure(loader, listener);\n    }\n    /** Spread the low bits, the way HashMap does, so keys that differ only in their high bits do not pile up. */\n    private LruCache&lt;K, V&gt; segmentFor(K key) {\n        int h = key.hashCode(); h ^= (h &gt;&gt;&gt; 16);\n        return segments[Math.floorMod(h, segments.length)];\n    }\n    public V get(K key) { return segmentFor(key).get(key); }\n    public V put(K key, V value) { return segmentFor(key).put(key, value); }\n    public V remove(K key) { return segmentFor(key).remove(key); }\n    public int size() { int n = 0; for (LruCache&lt;K, V&gt; s : segments) n += s.size(); return n; }\n    public int capacity() { int n = 0; for (LruCache&lt;K, V&gt; s : segments) n += s.capacity(); return n; }\n    /** Segment by segment. There is deliberately no global order to report. */\n    public List&lt;K&gt; evictionOrder() {\n        List&lt;K&gt; out = new ArrayList&lt;&gt;();\n        for (LruCache&lt;K, V&gt; s : segments) out.addAll(s.evictionOrder());\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; The database behind your loader is down. What is the state of the cache? And what if a put lands while a load is still running?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was. A miss leaves the lock first and only then calls the loader. So an exception reaches the caller with nothing written (no placeholder, no null entry, no half-linked node), and the next call retries cleanly. A loader that returns null is the same story: a miss stays a miss. This is the cache's version of paying before committing: the slow, fallible, outside step happens before any change, so there is nothing to roll back. The second danger is a writer arriving mid-load. Before it loads, a miss takes a ticket. A put or remove of that key tears the ticket up. A load whose ticket is gone hands its value to its caller, but does not write it. Without the ticket, a slow load could overwrite a newer put (test 11) or bring back a row that was just removed (test 12). Keeping the loader outside the lock has one more cost: a cold key hit by a thousand threads at once makes a thousand database calls, which is the next question but one.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * A hit moves the entry to the front, because a read is a use. A miss, or an entry whose time has run out,\n     * takes a ticket and calls the loader with NO lock held. Only a value that came back is written, and only\n     * if its ticket survived: a loader that throws or returns null leaves the cache exactly as it was, and a\n     * put or remove that landed during the load is never undone by it.\n     */\n    public V get(K key) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        K deadKey = null; V deadValue = null; Object ticket;\n        lock.lock();\n        try {\n            Node&lt;K, V&gt; n = index.get(key);\n            if (n != null &amp;&amp; !expired(n)) { touched(n); order.moveToFirst(n); return n.value; }  // hot path: ~80 ns\n            if (n != null) { drop(n); deadKey = n.key; deadValue = n.value; }                    // stale: it leaves now\n            ticket = startLoad(key);             // a put or remove of this key while we load cancels it\n        } finally { lock.unlock(); }\n\n        if (deadKey != null) fire(deadKey, deadValue, EvictionCause.EXPIRED);\n        V loaded = null;\n        try { loaded = load(key); }              // outside the lock: milliseconds, and allowed to throw\n        finally { if (loaded == null) abandonLoad(key, ticket); }\n        if (loaded == null) return null;         // a miss stays a miss; nothing has been written\n        write(key, loaded, ticket);              // written only if nobody put or removed this key meanwhile\n        return loaded;\n    }\n\n    /**\n     * Insert or overwrite. The order is the design: an existing key is ONE node overwritten in place, never a\n     * second node; a new key into a full cache evicts the oldest FIRST and only then links the newcomer, so\n     * size is never capacity + 1; and the listener hears about it after the lock, never inside it.\n     */\n    public V put(K key, V value) { return write(key, value, null); }\n\n    /**\n     * The one write path. A put (no ticket) cancels any load running for this key, because the put&#x27;s value is\n     * newer. A load coming back (with its ticket) writes only if the ticket is still there.\n     */\n    private V write(K key, V value, Object ticket) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        Objects.requireNonNull(value, &quot;null values are not cached: null is how a miss is reported&quot;);\n        K evictedKey = null; V evictedValue = null, previous = null;\n        lock.lock();\n        try {\n            if (ticket == null) cancelLoad(key);                  // this value is newer than any load in flight\n            else if (!finishLoad(key, ticket)) return null;       // a put or remove got here first: it wins\n            Node&lt;K, V&gt; n = index.get(key);\n            if (n != null) {                                  // overwrite: one node, moved to the front\n                previous = n.value;\n                n.value = value; n.expireAtMs = stamp();\n                order.moveToFirst(n);\n            } else {\n                if (index.size() &gt;= capacity) {               // evict FIRST, so the cache is never over capacity\n                    Node&lt;K, V&gt; victim = order.last();\n                    drop(victim);\n                    evictedKey = victim.key; evictedValue = victim.value;\n                }\n                Node&lt;K, V&gt; fresh = new Node&lt;&gt;(key, value, stamp());\n                order.addFirst(fresh);                        // list and map are written in the same section:\n                index.put(key, fresh);                        // nobody can observe one without the other\n            }\n        } finally { lock.unlock(); }\n\n        if (evictedKey != null) fire(evictedKey, evictedValue, EvictionCause.CAPACITY);\n        if (previous != null) fire(key, previous, EvictionCause.REPLACED);\n        return previous;\n    }\n\n    // Tickets. A miss takes a ticket before it loads; a put or remove of that key tears the ticket up; the load\n    // may write its value only if its ticket is still there when it comes back. Without this, a slow load could\n    // overwrite a newer put, or bring back a key that was removed while it was loading.\n    /** A miss is about to load this key. Call with the lock held. */\n    Object startLoad(K key) { Object ticket = new Object(); loading.put(key, ticket); return ticket; }\n    /** A put or remove of this key: any load already running for it is now out of date. Call with the lock held. */\n    void cancelLoad(K key) { loading.remove(key); }\n    /** The load came back: may it write? Only if nobody put or removed the key meanwhile. Call with the lock held. */\n    boolean finishLoad(K key, Object ticket) { return loading.remove(key, ticket); }\n    /** The load threw or found nothing: hand the ticket back, so the map of loads cannot grow for ever. */\n    void abandonLoad(K key, Object ticket) { lock.lock(); try { loading.remove(key, ticket); } finally { lock.unlock(); } }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>6 &middot; Why is this actually O(1)? Walk me through the eviction, pointer by pointer.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Three separate reasons, and an interviewer wants all three. First, the map answers \"the value for this key\" in one hash lookup. Second, the list is <i>doubly</i> linked, so unlinking a node found through the map is four pointer writes with no walk to find the node before it. With a singly linked list it would be O(n). Third, the key is stored inside the node, so when eviction takes the tail it already has the key it needs to delete the map row. Otherwise you would be searching the map by value. The two sentinels are a fourth, smaller reason: they remove every empty-list and one-element special case, so the splices are straight-line code and much harder to get wrong. Space is O(capacity): one map entry and one node per key, and an LRU hit allocates nothing at all.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * One entry, and one node of an order list, in the same object. The key rides INSIDE the node because\n * eviction starts from the order list and then has to delete that entry from the map: without the key in\n * hand that delete would be a scan of the whole map.\n */\nfinal class Node&lt;K, V&gt; {\n    final K key;                       // final: the identity of an entry never changes\n    V value;\n    Node&lt;K, V&gt; prev, next;             // the links of whichever list this node is currently in\n    int freq = 1;                      // LFU only: how many times this entry has been used\n    long expireAtMs;                   // 0 = never expires\n\n    Node(K key, V value, long expireAtMs) { this.key = key; this.value = value; this.expireAtMs = expireAtMs; }\n}\n\n/**\n * A doubly linked list of nodes with two sentinels, so every splice is straight-line pointer writes with no\n * empty-list or single-element special case. Doubly linked because eviction must unlink a node found through\n * the map, from the middle, without walking to its predecessor. Front = newest, back = the next victim.\n */\nfinal class RecencyList&lt;K, V&gt; {\n    private final Node&lt;K, V&gt; head = new Node&lt;&gt;(null, null, 0);   // sentinel: nothing before the newest\n    private final Node&lt;K, V&gt; tail = new Node&lt;&gt;(null, null, 0);   // sentinel: nothing after the oldest\n    private int size;\n\n    RecencyList() { head.next = tail; tail.prev = head; }\n\n    /** Splice n in as the newest. O(1). */\n    void addFirst(Node&lt;K, V&gt; n) {\n        n.prev = head; n.next = head.next;\n        head.next.prev = n; head.next = n;\n        size++;\n    }\n    /** Splice n out from wherever it is. O(1), and it is the reason the list is doubly linked. */\n    void unlink(Node&lt;K, V&gt; n) {\n        n.prev.next = n.next; n.next.prev = n.prev;\n        n.prev = null; n.next = null;\n        size--;\n    }\n    /** &quot;This entry was just used.&quot; Two splices, still O(1). */\n    void moveToFirst(Node&lt;K, V&gt; n) { unlink(n); addFirst(n); }\n    /** The oldest node: the one this list would give up next, or null if the list is empty. */\n    Node&lt;K, V&gt; last() { return size == 0 ? null : tail.prev; }\n    boolean isEmpty() { return size == 0; }\n    int size() { return size; }\n\n    /** The keys from newest to oldest. Walks the links, so it is the honest view of the order. */\n    List&lt;K&gt; keysNewestFirst() {\n        List&lt;K&gt; out = new ArrayList&lt;&gt;(size);\n        for (Node&lt;K, V&gt; n = head.next; n != tail; n = n.next) out.add(n.key);\n        return out;\n    }\n    /** The keys from oldest to newest: the order in which this list would give them up. */\n    List&lt;K&gt; keysOldestFirst() {\n        List&lt;K&gt; out = new ArrayList&lt;&gt;(size);\n        for (Node&lt;K, V&gt; n = tail.prev; n != head; n = n.prev) out.add(n.key);\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; A thousand threads miss the same cold key at the same instant. What happens to your database?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A thousand reads, unless you do something, because the loader deliberately runs outside the lock (this pile-up is called a cache stampede). The fix is not to put the loader back inside the lock: that would make every miss in the cache wait behind one slow key. It is to wrap the loader in another loader that collapses duplicate work. The first caller for a key puts a task in a concurrent map and runs it. Everybody else finds the task already there and waits for its result. The first caller clears the slot when it is done. A thousand callers, one database read, and the same Decorator seam one level down: a <code>CacheLoader</code> wrapping a <code>CacheLoader</code>. The small race that remains is worth admitting: a caller who arrives after the slot is cleared but before the value lands in the cache starts a second load.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the stampede -- a thousand threads miss the same cold key; collapse them into one database read\n/**\n * A cold key that a thousand threads want at the same instant is a thousand database reads, because the\n * loader runs outside the lock on purpose. The fix is not to move it back inside: it is to make the LOADER\n * collapse duplicate work, so the first caller for a key does the read and everybody else waits on its result.\n * A CacheLoader wrapping a CacheLoader -- the same Decorator seam, one level down.\n */\nfinal class SingleFlightLoader&lt;K, V&gt; implements CacheLoader&lt;K, V&gt; {\n    private final CacheLoader&lt;K, V&gt; real;\n    private final ConcurrentMap&lt;K, FutureTask&lt;V&gt;&gt; inFlight = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicInteger calls = new AtomicInteger();\n\n    SingleFlightLoader(CacheLoader&lt;K, V&gt; real) { this.real = real; }\n\n    public V load(K key) {\n        FutureTask&lt;V&gt; mine = new FutureTask&lt;&gt;(() -&gt; { calls.incrementAndGet(); return real.load(key); });\n        FutureTask&lt;V&gt; running = inFlight.putIfAbsent(key, mine);\n        if (running == null) { running = mine; mine.run(); }       // I am the one who does the work\n        try { return running.get(); }                              // everybody else just waits for it\n        catch (ExecutionException e) {\n            Throwable cause = e.getCause();\n            throw cause instanceof RuntimeException r ? r : new RuntimeException(cause);\n        } catch (InterruptedException e) { Thread.currentThread().interrupt(); throw new RuntimeException(e); }\n        finally { inFlight.remove(key, mine); }                    // only the owner clears the slot\n    }\n    /** How many real loads happened. A thousand concurrent misses on one key should leave this at 1. */\n    int realLoads() { return calls.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Expire entries sixty seconds after the write, then after the last use. How do you test that without sleeping?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Expiry is a second reason to leave, so it goes on the entry: each node carries the instant it stops being valid, stamped from an injected clock. The check is lazy: a read that finds an expired node treats it as a miss, unlinks it there and then, and tells the listener EXPIRED. That costs one comparison on every get. \"After last use\" (expire-after-access) is one more line: every hit stamps the node again. Lazy expiry never frees a key that nobody asks for again, so the proactive version needs the entries in expiry order. With expire-after-access that order already exists: the least recently used entry is always the first to expire, so <code>sweepExpired</code> pops expired nodes off the tail and stops at the first fresh one. When entries can have different deadlines, keep a heap of notes (key, due time) and let a background tick drain it. A key written twice has two notes, so the sweep drops a key only if the node's own deadline has passed (test 13). The tests never sleep. They hand the cache a clock that returns a number the test controls, then check a hit one millisecond before the minute is up and a miss one millisecond after.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Free expired entries now instead of on the next read. With expire-after-ACCESS every use restarts the\n     * clock, so the least recently used entry is always the first to expire: pop from the tail until the tail\n     * is fresh, O(1) per entry freed. With expire-after-write a read can move an old entry away from the tail,\n     * so this frees only what sits at the tail, and ExpirySweeper (Extensions.java) is the tool for that case.\n     */\n    int sweepExpired() {\n        List&lt;Node&lt;K, V&gt;&gt; dead = new ArrayList&lt;&gt;();\n        lock.lock();\n        try { for (Node&lt;K, V&gt; n = order.last(); n != null &amp;&amp; expired(n); n = order.last()) { drop(n); dead.add(n); } }\n        finally { lock.unlock(); }\n        for (Node&lt;K, V&gt; n : dead) fire(n.key, n.value, EvictionCause.EXPIRED);\n        return dead.size();\n    }\n\n    /** Drop this key only if its OWN deadline has passed. A sweeper&#x27;s note is a hint; the node&#x27;s stamp is the truth. */\n    boolean expireIfDue(K key) {\n        V gone = null;\n        lock.lock();\n        try { Node&lt;K, V&gt; n = index.get(key); if (n != null &amp;&amp; expired(n)) { drop(n); gone = n.value; } }\n        finally { lock.unlock(); }\n        if (gone != null) fire(key, gone, EvictionCause.EXPIRED);\n        return gone != null;\n    }\n\n// ---- ext: the sweeper -- proactive expiry, and why lazy is usually enough\n/**\n * Lazy expiry only frees an entry when somebody reads it, so a key that nobody ever asks for again holds its\n * memory until the capacity pushes it out. A sweeper is a second index ordered by expiry -- here a heap, in a\n * real system a timing wheel (a ring of time slots, each holding the keys due in it) -- that a background\n * tick drains. It is needed when entries can have DIFFERENT deadlines; with one fixed TTL a list in the right\n * order is enough (LruCache.sweepExpired for expire-after-access, the write-order list further down).\n *\n * The heap is only a hint about what to look at. A key written twice has two notes in it, and the older note\n * comes due while the newer value is still fresh, so the sweep asks the cache to drop the key only if the\n * node&#x27;s own deadline has passed.\n */\nfinal class ExpirySweeper&lt;K, V&gt; {\n    /** One &quot;look at this key at this time&quot; note. */\n    record Due&lt;K&gt;(long atMs, K key) { }\n\n    private final LruCache&lt;K, V&gt; cache;\n    private final PriorityQueue&lt;Due&lt;K&gt;&gt; heap = new PriorityQueue&lt;&gt;(Comparator.comparingLong(Due::atMs));\n\n    ExpirySweeper(LruCache&lt;K, V&gt; cache) { this.cache = cache; }\n\n    /** Called by whoever wrote the entry, with the same instant the cache stamped on it. */\n    synchronized void track(K key, long expireAtMs) { heap.add(new Due&lt;&gt;(expireAtMs, key)); }\n    /** One tick: look at every note due by now. O(k log n) for k notes due, not O(size). Returns how many left. */\n    int sweep(long nowMs) {\n        List&lt;K&gt; due = new ArrayList&lt;&gt;();\n        synchronized (this) { while (!heap.isEmpty() &amp;&amp; heap.peek().atMs() &lt;= nowMs) due.add(heap.poll().key()); }\n        int swept = 0;\n        for (K key : due) if (cache.expireIfDue(key)) swept++;     // outside this lock: the listener may be slow\n        return swept;                                               // a fresh rewrite stays; a real expiry fires EXPIRED\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; Every value expires a fixed time after it was written. Give put, get and getAverage() of the values still alive, all O(1).</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>With one fixed lifetime, entries expire in the order they were written. So the order this page already has is enough: the same <code>RecencyList</code>, except that only a write moves a node. A read moves nothing. A running sum sits beside it. Every call first pops expired nodes off the old end and subtracts them, then does its own work, so <code>average()</code> is the sum divided by the count. Each entry is popped at most once in its life, so the cleanup is O(1) amortized (averaged over all the calls), not a scan per call. An overwrite takes the old value out of the sum and moves the node to the front, which restarts its lifetime; test 19 walks the clock through 2, 10 and 12 seconds. Counting instead of averaging (how many live entries does this key have?) is the same list with a count per key. The assumption to say out loud: time only goes forward. If writes can arrive with older timestamps, the list is no longer in expiry order, and you need a heap.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: write-order expiry -- one fixed lifetime, and the average of the live values in O(1)\n/**\n * Every value lives a fixed time after it was WRITTEN, and average() must be O(1). With one fixed lifetime,\n * entries expire in the order they were written, so keep them in a list in write order (a read moves\n * nothing) plus a running sum. Every call first pops expired entries off the old end and subtracts them.\n * Each entry is popped at most once, so that cleanup is O(1) amortized (averaged over all the calls).\n */\nfinal class ExpiringAverageCache&lt;K&gt; {\n    private final Map&lt;K, Node&lt;K, Long&gt;&gt; index = new HashMap&lt;&gt;();\n    private final RecencyList&lt;K, Long&gt; byWriteTime = new RecencyList&lt;&gt;();   // newest write at the front\n    private final long lifeMs;\n    private final Clock clock;\n    private final ReentrantLock lock = new ReentrantLock();\n    private long sum;                                                       // of the live values: a long, so exact\n\n    ExpiringAverageCache(long lifeMs, Clock clock) { this.lifeMs = lifeMs; this.clock = clock; }\n\n    /** Insert or overwrite. An overwrite takes the old value out of the sum and restarts the lifetime. */\n    void put(K key, long value) {\n        lock.lock();\n        try {\n            expire();\n            Node&lt;K, Long&gt; old = index.remove(key);\n            if (old != null) { byWriteTime.unlink(old); sum -= old.value; }\n            Node&lt;K, Long&gt; n = new Node&lt;&gt;(key, value, clock.nowMs() + lifeMs);\n            byWriteTime.addFirst(n); index.put(key, n); sum += value;\n        } finally { lock.unlock(); }\n    }\n    /** The live value, or null. A read moves nothing: the lifetime runs from the write. */\n    Long get(K key) {\n        lock.lock();\n        try { expire(); Node&lt;K, Long&gt; n = index.get(key); return n == null ? null : n.value; }\n        finally { lock.unlock(); }\n    }\n    /** The mean of the live values, 0 when there are none. */\n    double average() {\n        lock.lock();\n        try { expire(); return index.isEmpty() ? 0 : (double) sum / index.size(); }\n        finally { lock.unlock(); }\n    }\n    /** Pop from the old end while the oldest write has expired. */\n    private void expire() {\n        long now = clock.nowMs();\n        for (Node&lt;K, Long&gt; n = byWriteTime.last(); n != null &amp;&amp; now &gt;= n.expireAtMs; n = byWriteTime.last()) {\n            byWriteTime.unlink(n); index.remove(n.key); sum -= n.value;\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Bound it by memory instead of by entry count: values are between one kilobyte and one megabyte.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The capacity becomes a budget, and every value declares a weight through a function handed in at construction. Two things change, and both matter. The eviction becomes a <i>loop</i> instead of an if, because one large value can push out several small ones. And the new invariant (the sum of the weights never exceeds the budget) is checked and restored inside the same lock. When the lock is released, either the budget holds or nothing was written. A value heavier than the whole budget, or with a negative weight, is refused up front, instead of emptying the cache for something that still will not fit. Everything else is untouched: same node, same list, same listener, same tests.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: bound by bytes -- a weight per entry, and a LOOP of evictions inside one lock\n/**\n * &quot;Bound it by memory, not by entry count.&quot; Capacity becomes a budget and each entry declares a weight, so a\n * single put can evict several entries -- or none, if what it replaced was bigger. The new invariant is &quot;the\n * sum of the weights never exceeds the budget&quot;, and the whole loop runs inside ONE lock: either the budget\n * holds when the lock is released, or nothing was written at all.\n */\nfinal class WeightedLruCache&lt;K, V&gt; extends LockedCache&lt;K, V&gt; {\n    private final long maxWeight;\n    private final ToLongFunction&lt;V&gt; weigher;\n    private final Map&lt;K, Node&lt;K, V&gt;&gt; index = new HashMap&lt;&gt;();\n    private final Map&lt;K, Long&gt; weights = new HashMap&lt;&gt;();\n    private final RecencyList&lt;K, V&gt; order = new RecencyList&lt;&gt;();\n    private long weight;\n\n    WeightedLruCache(long maxWeight, ToLongFunction&lt;V&gt; weigher) { this.maxWeight = maxWeight; this.weigher = weigher; }\n\n    public V get(K key) {\n        lock.lock();\n        try { Node&lt;K, V&gt; n = index.get(key); if (n == null) return null; order.moveToFirst(n); return n.value; }\n        finally { lock.unlock(); }\n    }\n\n    public V put(K key, V value) {\n        long w = weigher.applyAsLong(value);\n        if (w &lt; 0 || w &gt; maxWeight) throw new IllegalArgumentException(&quot;weight &quot; + w + &quot; is outside 0..&quot; + maxWeight);\n        List&lt;Node&lt;K, V&gt;&gt; evicted = new ArrayList&lt;&gt;();\n        V previous = null;\n        lock.lock();\n        try {\n            Node&lt;K, V&gt; n = index.get(key);\n            if (n != null) { previous = n.value; weight -= weights.get(key); n.value = value; order.moveToFirst(n); }\n            else { n = new Node&lt;&gt;(key, value, stamp()); order.addFirst(n); index.put(key, n); }\n            weights.put(key, w); weight += w;\n            while (weight &gt; maxWeight) {                      // a loop, not an if: one put can free several entries\n                Node&lt;K, V&gt; victim = order.last();\n                weight -= weights.remove(victim.key);\n                index.remove(victim.key); order.unlink(victim);\n                evicted.add(victim);\n            }\n        } finally { lock.unlock(); }\n        for (Node&lt;K, V&gt; v : evicted) fire(v.key, v.value, EvictionCause.CAPACITY);\n        return previous;\n    }\n\n    public V remove(K key) {\n        V gone = null;\n        lock.lock();\n        try { Node&lt;K, V&gt; n = index.remove(key); if (n != null) { order.unlink(n); weight -= weights.remove(key); gone = n.value; } }\n        finally { lock.unlock(); }\n        if (gone != null) fire(key, gone, EvictionCause.REMOVED);\n        return gone;\n    }\n\n    public int size() { lock.lock(); try { return index.size(); } finally { lock.unlock(); } }\n    /** There is no entry cap here: the budget is the weight. Reported so the interface still means something. */\n    public int capacity() { return (int) Math.min(maxWeight, Integer.MAX_VALUE); }\n    public List&lt;K&gt; evictionOrder() { lock.lock(); try { return order.keysOldestFirst(); } finally { lock.unlock(); } }\n    /** The bytes currently held. The whole point of this class. */\n    long weight() { lock.lock(); try { return weight; } finally { lock.unlock(); } }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; A nightly report reads a million rows through this cache. The next morning the hit rate is zero. Why, and what do the real caches do about it?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Because plain LRU has no defence against a scan. Each of those million rows is, the moment it arrives, the most recently used entry in the cache, so each one throws out a real key and then leaves itself. By morning the cache is full of rows nobody will ask for again. No eviction rule fixes this, because by the time a scan row is the victim, the damage is done. The fix is an <i>admission</i> rule: a door on the front. The cache below keeps a frequency sketch: a fixed array of small counters that stop at fifteen, four per key. A key's estimate is the smallest of its four, because a collision can only push a count up. Every request bumps them, hit or miss. On a full cache the newcomer is compared with the entry it would push out, and gets in only if its count is higher; ties go to the resident. Test 10 runs the same five-hundred-row scan through two caches: the forty-key working set survives in one and is wiped out in the other. Two details to volunteer. The counters are halved every so often, so the count is recent, not lifelong. And a genuinely new hot key is also seen once, so it is also refused, which is why Caffeine's <b>W-TinyLFU</b> puts every newcomer in a small LRU window first. A cheaper answer that interviewers also accept is segmented LRU. A new key enters a probation part, and only a second hit moves it to the protected part, so a one-pass scan churns probation and never touches protected.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: admission -- a scan must not be allowed to evict the working set (TinyLFU / Caffeine)\n/**\n * How often has this key been ASKED FOR? Answered in a fixed amount of memory, whatever the key space.\n *\n * The structure is a Count-Min sketch with small saturating counters: every key hashes to four counters, an\n * increment bumps all four, and the estimate is the SMALLEST of the four, because collisions can only push a\n * count up. Counters stop at fifteen, so &quot;very popular&quot; and &quot;popular&quot; are the same answer and that is fine.\n * Every so often all the counters are halved, which is what makes the count a RECENT frequency rather than a\n * record of all time: yesterday&#x27;s hot key decays instead of holding its place for ever.\n *\n * One byte per counter here, for readability; Caffeine packs sixteen four-bit counters into one long and\n * allocates one long per entry of capacity, so a cache of a hundred thousand entries spends about a megabyte\n * on it. Not thread-safe on its own: AdmissionLruCache only touches it with its lock held.\n */\nfinal class FrequencySketch&lt;K&gt; {\n    private static final int[] SEEDS = { 0x7f4a7c15, 0x9e3779b1, 0xc2b2ae35, 0x27d4eb2f };\n    private final byte[] counters;      // one saturating 0..15 counter each; length is a power of two\n    private final int mask;\n    private final int sampleSize;       // halve everything after this many increments\n    private int additions;\n\n    /** Four counters per expected entry keeps the collision rate low enough for the comparison to be useful. */\n    FrequencySketch(int expectedEntries) {\n        int n = 16;\n        while (n &lt; Math.max(4, expectedEntries) * 4) n &lt;&lt;= 1;\n        this.counters = new byte[n];\n        this.mask = n - 1;\n        this.sampleSize = 10 * Math.max(1, expectedEntries);\n    }\n\n    /** This key was asked for. O(1): four bumps, and a halving every sampleSize requests. */\n    void increment(K key) {\n        int h = spread(key.hashCode());\n        for (int i = 0; i &lt; SEEDS.length; i++) {\n            int j = slot(h, i);\n            if (counters[j] &lt; 15) counters[j]++;\n        }\n        if (++additions &gt;= sampleSize) halve();\n    }\n\n    /** The estimate: the smallest of this key&#x27;s four counters, so a collision can never make a key look rarer. */\n    int frequency(K key) {\n        int h = spread(key.hashCode()), min = 15;\n        for (int i = 0; i &lt; SEEDS.length; i++) min = Math.min(min, counters[slot(h, i)]);\n        return min;\n    }\n\n    /** Which counter this key uses for hash function i. Four different seeds give four independent-ish slots. */\n    private int slot(int hash, int i) { int h = hash * SEEDS[i]; return (h ^ (h &gt;&gt;&gt; 17)) &amp; mask; }\n    /** Mix the high bits down, the way HashMap does, so keys differing only up there do not collide. */\n    private static int spread(int h) { return h ^ (h &gt;&gt;&gt; 16); }\n    /** Halve every counter. The whole history fades by half; nothing is ever hot for ever. */\n    private void halve() {\n        for (int i = 0; i &lt; counters.length; i++) counters[i] = (byte) ((counters[i] &amp; 0xFF) &gt;&gt;&gt; 1);\n        additions = 0;\n    }\n}\n\n/**\n * The same LRU cache with a door on it. A nightly report that reads a million rows once is, to plain LRU, a\n * million most-recently-used entries: it pushes out the whole working set and the morning hit rate is zero.\n * Nothing about the EVICTION rule fixes that, because by the time a scan key is the victim it has already\n * thrown somebody out. The fix is an ADMISSION rule.\n *\n * On a full cache the newcomer is compared with the entry it would displace: it is let in only if the sketch\n * says it has been asked for MORE often than the victim. Ties go to the incumbent, which has already proved\n * itself, so a key seen once can never displace a key seen five times. A rejected newcomer is reported to the\n * listener immediately, because it did leave -- it just never got a place first.\n *\n * The known weakness, worth saying out loud: a genuinely new hot key is also seen once, so it is also refused.\n * Caffeine fixes that with the W in W-TinyLFU -- a small LRU window (1% of the cache to start with; Caffeine\n * tunes it as it runs) that every newcomer enters first, so only the window&#x27;s own victim ever faces the door,\n * by which time a real hot key has built up a count. W-TinyLFU is the policy inside Caffeine, the successor\n * that Guava&#x27;s own documentation points to.\n */\nfinal class AdmissionLruCache&lt;K, V&gt; extends LockedCache&lt;K, V&gt; {\n    private final int capacity;\n    private final Map&lt;K, Node&lt;K, V&gt;&gt; index;\n    private final RecencyList&lt;K, V&gt; order = new RecencyList&lt;&gt;();\n    private final FrequencySketch&lt;K&gt; sketch;\n    private long admitted, refused;\n\n    AdmissionLruCache(int capacity) {\n        if (capacity &lt;= 0) throw new IllegalArgumentException(&quot;capacity must be positive, not &quot; + capacity);\n        this.capacity = capacity;\n        this.index = new HashMap&lt;&gt;(capacity * 2);\n        this.sketch = new FrequencySketch&lt;&gt;(capacity);\n    }\n\n    /** Every request counts towards the frequency, hit or miss: that is how a scan key stays at one. */\n    public V get(K key) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        Object ticket;\n        lock.lock();\n        try {\n            sketch.increment(key);                             // under the lock: the sketch is plain arrays\n            Node&lt;K, V&gt; n = index.get(key);\n            if (n != null &amp;&amp; !expired(n)) { touched(n); order.moveToFirst(n); return n.value; }\n            if (n != null) { index.remove(n.key); order.unlink(n); }\n            ticket = startLoad(key);\n        } finally { lock.unlock(); }\n        V loaded = null;\n        try { loaded = load(key); }\n        finally { if (loaded == null) abandonLoad(key, ticket); }\n        if (loaded == null) return null;\n        write(key, loaded, ticket);\n        return loaded;\n    }\n\n    /** The only difference from LruCache: on a full cache the newcomer must beat the victim to get in. */\n    public V put(K key, V value) { return write(key, value, null); }\n\n    /** LruCache&#x27;s write path, ticket rule included, with the door added. */\n    private V write(K key, V value, Object ticket) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        Objects.requireNonNull(value, &quot;null values are not cached&quot;);\n        K goneKey = null; V goneValue = null, previous = null;\n        lock.lock();\n        try {\n            if (ticket == null) { cancelLoad(key); sketch.increment(key); }   // a load was counted by its get\n            else if (!finishLoad(key, ticket)) return null;\n            Node&lt;K, V&gt; n = index.get(key);\n            if (n != null) {                                   // an overwrite never faces the door\n                previous = n.value; n.value = value; n.expireAtMs = stamp();\n                order.moveToFirst(n);\n            } else if (index.size() &gt;= capacity) {\n                Node&lt;K, V&gt; victim = order.last();\n                if (sketch.frequency(key) &gt; sketch.frequency(victim.key)) {\n                    index.remove(victim.key); order.unlink(victim);   // the newcomer earned the place\n                    goneKey = victim.key; goneValue = victim.value;\n                    link(key, value); admitted++;\n                } else {\n                    goneKey = key; goneValue = value; refused++;      // the door stays shut; nothing moves\n                }\n            } else link(key, value);\n        } finally { lock.unlock(); }\n\n        if (goneKey != null) fire(goneKey, goneValue, EvictionCause.CAPACITY);\n        if (previous != null) fire(key, previous, EvictionCause.REPLACED);\n        return previous;\n    }\n\n    public V remove(K key) {\n        Objects.requireNonNull(key, &quot;null keys are not cached&quot;);\n        V gone = null;\n        lock.lock();\n        try { cancelLoad(key); Node&lt;K, V&gt; n = index.get(key); if (n != null) { index.remove(key); order.unlink(n); gone = n.value; } }\n        finally { lock.unlock(); }\n        if (gone != null) fire(key, gone, EvictionCause.REMOVED);\n        return gone;\n    }\n\n    public int size() { lock.lock(); try { return index.size(); } finally { lock.unlock(); } }\n    public int capacity() { return capacity; }\n    public List&lt;K&gt; evictionOrder() { lock.lock(); try { return order.keysOldestFirst(); } finally { lock.unlock(); } }\n    /** How many newcomers were let in, and how many the door refused. Demo and test only. */\n    String doorLog() { return &quot;admitted=&quot; + admitted + &quot; refused=&quot; + refused; }\n\n    private void link(K key, V value) {\n        Node&lt;K, V&gt; fresh = new Node&lt;&gt;(key, value, stamp());\n        order.addFirst(fresh);\n        index.put(key, fresh);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>12 &middot; Ops want the hit rate on a dashboard by Friday. Do not touch either cache class.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Another <code>Cache</code> that delegates and counts. Every method forwards to the one it wraps; get adds one to hits or misses on the way back, and hitRate is a division. It composes with anything, because the seam it plugs into is the interface, not a class, so the same wrapper works over LRU, LFU, the weighted cache and the striped one. The honest caveat to say out loud: with a read-through loader, a miss that the loader answers comes back non-null, so the wrapper records it as a hit. When that matters, count the loader's calls instead, which is what the demo does.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: stats -- the hit rate, as a wrapper, without touching either cache\n/**\n * &quot;What is the hit ratio?&quot; is not a change to the cache; it is another Cache that delegates and counts. It\n * composes with anything, because the seam it plugs into is the interface and not a class.\n *\n * One honest caveat: with a read-through loader a miss that the loader satisfies comes back non-null, so this\n * wrapper would call it a hit. Count the loader&#x27;s calls (as ExtDemo does) when that distinction matters.\n */\nfinal class StatsCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final Cache&lt;K, V&gt; inner;\n    private final AtomicLong hits = new AtomicLong(), misses = new AtomicLong(), writes = new AtomicLong();\n\n    StatsCache(Cache&lt;K, V&gt; inner) { this.inner = inner; }\n\n    public V get(K key) {\n        V v = inner.get(key);\n        if (v == null) misses.incrementAndGet(); else hits.incrementAndGet();\n        return v;\n    }\n    public V put(K key, V value) { writes.incrementAndGet(); return inner.put(key, value); }\n    public V remove(K key) { return inner.remove(key); }\n    public int size() { return inner.size(); }\n    public int capacity() { return inner.capacity(); }\n    public List&lt;K&gt; evictionOrder() { return inner.evictionOrder(); }\n\n    /** Hits over reads, 0 when nothing has been read yet. */\n    double hitRate() { long h = hits.get(), m = misses.get(); return h + m == 0 ? 0 : (double) h / (h + m); }\n    String summary() { return &quot;hits=&quot; + hits + &quot; misses=&quot; + misses + &quot; writes=&quot; + writes\n        + &quot; hitRate=&quot; + String.format(&quot;%.2f&quot;, hitRate()); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>13 &middot; The cache sits in front of a slow function as a memo (one answer kept per distinct call). It must survive a crash, order included.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two parts. The key: equal calls must build equal keys, and a Java array's own <code>equals</code> only asks \"same object?\", so <code>CallKey</code> compares arguments with <code>Arrays.deepEquals</code> and sorts named arguments by name (test 20). The crash: every change is appended to a log file before the cache changes (a write-ahead log). A restart replays it through the same LRU rules, which rebuilds the entries and their order, because hits are logged too. Puts are forced to disk with an fsync; hits are not, since losing the last few only makes the order slightly stale. Each line ends in a checksum (a number computed from its bytes), so a line torn by the crash does not match and is cut off. <code>compact()</code> rewrites the log through a temp file and one rename that happens all at once or not at all (test 21).</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: memo + log -- an LRU memo in front of a function, a key that is really equal, then a crash-proof log\n/**\n * The key a memo cache files a call under. Equal calls must give equal keys. Positional arguments compare by\n * CONTENT through Arrays.deepEquals: an array&#x27;s own equals only asks &quot;same object?&quot;, so f(new int[]{1}) called\n * twice would miss every time. Named arguments sit in a TreeMap, sorted by name, so f(a=1, b=2) and\n * f(b=2, a=1) are one key. The argument array is copied; an argument that is itself mutable must not change\n * while it is a key, because a HashMap cannot find a key whose hash has changed.\n */\nrecord CallKey(String fn, Object[] args, SortedMap&lt;String, Object&gt; named) {\n    CallKey { args = args.clone(); named = new TreeMap&lt;&gt;(named); }\n    @Override public boolean equals(Object o) {\n        return o instanceof CallKey k &amp;&amp; fn.equals(k.fn) &amp;&amp; Arrays.deepEquals(args, k.args) &amp;&amp; named.equals(k.named);\n    }\n    @Override public int hashCode() { return Objects.hash(fn, Arrays.deepHashCode(args), named); }\n}\n\n/** An LRU memo in front of one function: the function is the loader, so tickets and eviction come for free. */\nfinal class MemoCache&lt;V&gt; {\n    private final LruCache&lt;CallKey, V&gt; cache;\n\n    MemoCache(int capacity, CacheLoader&lt;CallKey, V&gt; function) {\n        cache = new LruCache&lt;&gt;(capacity);\n        cache.configure(function, (k, v, c) -&gt; { });\n    }\n\n    /** The answer for this call: computed once, then served from the cache until it is evicted. */\n    V call(String fn, Object[] args, Map&lt;String, Object&gt; named) { return cache.get(new CallKey(fn, args, new TreeMap&lt;&gt;(named))); }\n}\n\n/**\n * An LRU cache that survives a crash. Every change is appended to a log file BEFORE the cache changes (a\n * write-ahead log): die after the append and the restart replays it; die before and it never happened. A\n * restart replays the log through the same LRU rules, which rebuilds the entries AND their recency order.\n * A put is forced to disk (fsync: milliseconds). A hit is logged without the force, because losing the last\n * few hits in a crash only makes the order slightly stale. Each line ends in a CRC32 checksum, so a line\n * torn by a crash mid-write is found and cut off. compact() rewrites the log as the live entries, oldest\n * first, through a temp file and one atomic rename. Keys and values: text without tabs or newlines.\n */\nfinal class LoggedLruCache implements AutoCloseable {\n    private final LinkedHashMap&lt;String, String&gt; map;     // the five-line LRU from the LinkedHashMap question\n    private final Path file;\n    private FileChannel log;\n\n    LoggedLruCache(int capacity, Path file) throws IOException {\n        this.map = new LinkedHashMap&lt;&gt;(16, 0.75f, true) {\n            @Override protected boolean removeEldestEntry(Map.Entry&lt;String, String&gt; eldest) { return size() &gt; capacity; }\n        };\n        this.file = file;\n        this.log = FileChannel.open(file, StandardOpenOption.CREATE, StandardOpenOption.READ, StandardOpenOption.WRITE);\n        log.truncate(replay());                          // cut a torn last line, so new records start clean\n        log.position(log.size());\n    }\n\n    /** A hit is logged as a use, not forced: it only moves the order. */\n    synchronized String get(String key) throws IOException {\n        String v = map.get(key);\n        if (v != null) append(&quot;U\\t&quot; + key, false);\n        return v;\n    }\n    /** The log first, forced to disk; only then the cache. */\n    synchronized void put(String key, String value) throws IOException {\n        append(&quot;P\\t&quot; + key + &quot;\\t&quot; + value, true);\n        map.put(key, value);\n    }\n    /** The keys, next victim first. */\n    synchronized List&lt;String&gt; evictionOrder() { return new ArrayList&lt;&gt;(map.keySet()); }\n\n    /** Rewrite the log as the live entries, oldest first, so replaying it rebuilds the same cache and order. */\n    synchronized void compact() throws IOException {\n        Path tmp = file.resolveSibling(file.getFileName() + &quot;.tmp&quot;);\n        try (FileChannel out = FileChannel.open(tmp, StandardOpenOption.CREATE, StandardOpenOption.WRITE,\n                                                StandardOpenOption.TRUNCATE_EXISTING)) {\n            for (Map.Entry&lt;String, String&gt; e : map.entrySet()) out.write(line(&quot;P\\t&quot; + e.getKey() + &quot;\\t&quot; + e.getValue()));\n            out.force(true);\n        }\n        log.close();\n        Files.move(tmp, file, StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE);   // all or nothing\n        log = FileChannel.open(file, StandardOpenOption.WRITE, StandardOpenOption.APPEND);\n    }\n    public synchronized void close() throws IOException { log.close(); }\n\n    /** Replay every intact line in order; stop at the first torn one. Returns where the intact part ends. */\n    private long replay() throws IOException {\n        byte[] all = Files.readAllBytes(file);\n        int start = 0;\n        for (int i = 0; i &lt; all.length; i++) {\n            if (all[i] != &#x27;\\n&#x27;) continue;\n            String text = new String(all, start, i - start, StandardCharsets.UTF_8);\n            int cut = text.lastIndexOf(&#x27;\\t&#x27;);\n            if (cut &lt; 0 || !Long.toString(crc(text.substring(0, cut))).equals(text.substring(cut + 1))) break;\n            String[] f = text.substring(0, cut).split(&quot;\\t&quot;);\n            if (f[0].equals(&quot;P&quot;)) map.put(f[1], f[2]); else map.get(f[1]);    // a put, or a use\n            start = i + 1;\n        }\n        return start;\n    }\n    /** Append one record; force it to the disk when it must survive a crash. */\n    private void append(String record, boolean force) throws IOException {\n        log.write(line(record));\n        if (force) log.force(false);\n    }\n    /** One log line: the record, a tab, its checksum, a newline. */\n    private static ByteBuffer line(String record) {\n        return ByteBuffer.wrap((record + &quot;\\t&quot; + crc(record) + &quot;\\n&quot;).getBytes(StandardCharsets.UTF_8));\n    }\n    /** CRC32 of the record: a torn or damaged line will not match. */\n    private static long crc(String s) { CRC32 c = new CRC32(); c.update(s.getBytes(StandardCharsets.UTF_8)); return c.getValue(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>14 &middot; Now there are two servers, and they share one store (Redis or a table).</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Memory goes in front of the shared store, and the seams are already there. The store becomes the loader, so a local miss falls through to Redis or a table without the cache knowing what it is talking to. A write goes to the store first; then this server drops its own copy instead of updating it, so the next read loads whichever write won in the store. The store's write is a conditional update (write only if this version is newer than the stored one), which is the database doing what the lock does in one process. The versions must come from one place every server shares, such as a database sequence or Redis <code>INCR</code>. With a counter per server, a quiet server's newer write would lose to a busy server's older one (test 15). Then the hard part of every distributed cache: the other server's copy is now wrong, so a write publishes an invalidation message and every server drops that key. The ticket from question 5 stops a load already running from putting the old row back. Say out loud that this is eventually consistent (the servers agree in the end, not at every instant), and that the window is the message's delivery time. Three write policies are worth naming. Write-through writes the store on every put: this class, which then drops its copy instead of updating it. Write-back writes the store only when a value leaves the cache (<code>WriteBackListener</code>). Write-behind hands that write to a queue that one thread drains (<code>WriteBehindListener</code>).</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: two tiers -- memory, then a shared store, and the invalidation message\n/** The far tier: a shared store (Redis, a table) that outlives this process. */\ninterface CacheStore&lt;K, V&gt; {\n    /** The stored value, or null. */\n    V read(K key);\n    /** Write only if this version is newer than what is stored. Returns true if this write won. */\n    boolean write(K key, V value, long version);\n}\n\n/**\n * A store whose write is a conditional update, which is the database&#x27;s version of the cache&#x27;s lock: two\n * servers writing the same key at once do not have to coordinate, because the older version simply loses.\n */\nfinal class VersionedStore&lt;K, V&gt; implements CacheStore&lt;K, V&gt; {\n    private final ConcurrentMap&lt;K, Object[]&gt; rows = new ConcurrentHashMap&lt;&gt;();   // key -&gt; { version, value }\n\n    @SuppressWarnings(&quot;unchecked&quot;)\n    public V read(K key) { Object[] row = rows.get(key); return row == null ? null : (V) row[1]; }\n\n    public boolean write(K key, V value, long version) {\n        Object[] mine = { version, value };\n        Object[] winner = rows.merge(key, mine,\n            (old, fresh) -&gt; (Long) fresh[0] &gt; (Long) old[0] ? fresh : old);      // UPDATE ... WHERE version &lt; ?\n        return winner == mine;                                                  // did MY row end up stored?\n    }\n}\n\n/**\n * Memory in front of the shared store. A local miss falls through to the store because the store IS the\n * loader. A write goes to the store FIRST, then this server DROPS its local copy instead of updating it, so\n * the next read loads whichever write won in the store. Updating the copy instead could leave this server\n * serving a value the store refused. The versions come from ONE source every server shares (a database\n * sequence, Redis INCR): with a counter per server, a quiet server&#x27;s newer write would lose to a busy\n * server&#x27;s older one.\n */\nfinal class TwoTierCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    private final LruCache&lt;K, V&gt; memory;\n    private final CacheStore&lt;K, V&gt; far;\n    private final LongSupplier versions;\n\n    TwoTierCache(LruCache&lt;K, V&gt; memory, CacheStore&lt;K, V&gt; far, LongSupplier versions) {\n        this.memory = memory; this.far = far; this.versions = versions;\n        memory.configure(far::read, (k, v, c) -&gt; { });               // read-through to the far tier\n    }\n    public V get(K key) { return memory.get(key); }\n    public V put(K key, V value) {\n        far.write(key, value, versions.getAsLong());                 // the irreversible step first\n        return memory.remove(key);                                   // then drop the local copy (and any load of it)\n    }\n    public V remove(K key) { return memory.remove(key); }\n    public int size() { return memory.size(); }\n    public int capacity() { return memory.capacity(); }\n    public List&lt;K&gt; evictionOrder() { return memory.evictionOrder(); }\n    /** What another server publishes after it writes: this server&#x27;s copy of that key is now wrong. */\n    void onInvalidation(K key) { memory.remove(key); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>15 &middot; Levels L1 to Ln, each with a capacity, a read time and a write time; print usage and average times.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Each level is a whole <code>LruCache</code> plus two numbers, its read cost and its write cost, and <code>MultiLevelCache</code> holds the list, fastest first. A read walks down until a level has the key, then copies the value into every faster level above it; the time charged is every read tried plus every copy written. A write goes down from L1, reading each level first and stopping at the first one that already holds the same value, which is the prompt's rule. <code>stats()</code> prints each level's filled and total size, and the average read and write time over the last five calls, kept in two small queues. One lock covers all the levels, because a read also writes, and nobody may see a value half-copied. The levels' own locks are always taken inside it, in the same order, so nothing can deadlock. Test 18 checks the arithmetic: a write of 78 ms, a deep read of 38 ms, and a repeat write that stops at L1 in 1 ms.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: multi-level -- L1..Ln, each with its own capacity, read time and write time\n/**\n * N levels, fastest first, each a whole LruCache with a read cost and a write cost. A read walks down until\n * a level has the key, then copies the value into every faster level above it. A write goes down from L1 and\n * stops at the first level that already holds the same value (the prompt&#x27;s rule). Each call returns the time\n * it would take: every read it tried plus every write it made. stats() prints each level&#x27;s usage and the\n * average read and write time over the last few calls.\n */\nfinal class MultiLevelCache&lt;K, V&gt; {\n    /** One level: its cache, and what one read or one write at this level costs. */\n    record Level&lt;K, V&gt;(String name, LruCache&lt;K, V&gt; cache, int readMs, int writeMs) { }\n    /** What a read returns: the value (or null) and the time it took. */\n    record Read&lt;V&gt;(V value, int ms) { }\n\n    private final List&lt;Level&lt;K, V&gt;&gt; levels;\n    private final int window;                                        // stats average over the last `window` calls\n    private final Deque&lt;Integer&gt; reads = new ArrayDeque&lt;&gt;(), writes = new ArrayDeque&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();          // one lock over all levels: a read also writes\n\n    MultiLevelCache(List&lt;Level&lt;K, V&gt;&gt; levels, int window) { this.levels = List.copyOf(levels); this.window = window; }\n\n    /** Walk down; on a hit at level i, copy the value into levels 0..i-1. */\n    Read&lt;V&gt; read(K key) {\n        lock.lock();\n        try {\n            int ms = 0, hit = -1; V value = null;\n            for (int i = 0; i &lt; levels.size() &amp;&amp; value == null; i++) {\n                ms += levels.get(i).readMs();\n                value = levels.get(i).cache().get(key);\n                if (value != null) hit = i;\n            }\n            for (int i = 0; i &lt; hit; i++) { ms += levels.get(i).writeMs(); levels.get(i).cache().put(key, value); }\n            remember(reads, ms);\n            return new Read&lt;&gt;(value, ms);\n        } finally { lock.unlock(); }\n    }\n\n    /** Write down from L1; stop at the first level that already has this exact value. */\n    int write(K key, V value) {\n        lock.lock();\n        try {\n            int ms = 0;\n            for (Level&lt;K, V&gt; l : levels) {\n                ms += l.readMs();\n                if (value.equals(l.cache().get(key))) break;         // already here: the prompt says stop\n                ms += l.writeMs();\n                l.cache().put(key, value);\n            }\n            remember(writes, ms);\n            return ms;\n        } finally { lock.unlock(); }\n    }\n\n    /** Each level&#x27;s filled/total, then the average read and write time over the last `window` calls. */\n    String stats() {\n        lock.lock();\n        try {\n            StringBuilder s = new StringBuilder();\n            for (Level&lt;K, V&gt; l : levels) s.append(l.name()).append(&#x27; &#x27;).append(l.cache().size()).append(&#x27;/&#x27;).append(l.cache().capacity()).append(&quot;  &quot;);\n            return s + &quot;avgRead=&quot; + average(reads) + &quot;ms  avgWrite=&quot; + average(writes) + &quot;ms&quot;;\n        } finally { lock.unlock(); }\n    }\n\n    /** Keep the last `window` timings, oldest dropped first. */\n    private void remember(Deque&lt;Integer&gt; last, int ms) { last.a

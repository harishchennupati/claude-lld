d clock.\n        BoundedBlockingQueue&lt;String&gt; timed = new BoundedBlockingQueue&lt;&gt;(1);\n        long t0 = System.nanoTime();\n        String none = timed.poll(150, TimeUnit.MILLISECONDS);\n        long waitedMs = (System.nanoTime() - t0) / 1_000_000;\n        check(none == null &amp;&amp; waitedMs &gt;= 140, &quot;poll on an empty queue returned null after waiting the full 150 ms (&quot; + waitedMs + &quot; ms)&quot;);\n        timed.put(&quot;one&quot;);\n        check(!timed.offer(&quot;two&quot;, 100, TimeUnit.MILLISECONDS) &amp;&amp; timed.size() == 1, &quot;offer into a full queue gave up and wrote nothing&quot;);\n        AtomicLong fake = new AtomicLong();\n        timed.configure(new BlockUntilRoom&lt;&gt;(), () -&gt; fake.addAndGet(1_000_000_000L));  // every reading is a second later\n        timed.take();\n        t0 = System.nanoTime();\n        String expired = timed.poll(200, TimeUnit.MILLISECONDS);\n        long elapsedMs = (System.nanoTime() - t0) / 1_000_000;\n        check(expired == null &amp;&amp; elapsedMs &lt; 50, &quot;with an injected clock already past the deadline, poll gave up at once (&quot; + elapsedMs + &quot; ms)&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>9 &middot; One lock for everything. Have you serialised the whole pipeline? And what is above this if I need more?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Measure first. The locked part is one array write, two int updates and a signal: a put and a take together measure about twelve nanoseconds on one thread. Under load the lock is not what threads wait for &mdash; they wait for each other's items. The number that matters is how often a thread actually parks, and that is a function of capacity, which is what the table in move 8 measures: raise the capacity and the parking falls away. So the first fix is sizing, not architecture. Only then the ladder: batch with <code>drainTo</code>, which is one lock acquire per batch instead of per item; then two locks, a put lock and a take lock over a linked list with an atomic count, which is what <code>LinkedBlockingQueue</code> does and which moved 50,000 items in about 13 ms here; then a lock-free ring with two volatile cursors, 50,000 items in 2 ms, which is single-producer single-consumer only and hands back-pressure back to the caller, giving up the very thing a blocking queue was for.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: ladder rung 2 -- two locks, the LinkedBlockingQueue trick: producers and consumers stop meeting\n/**\n * One lock means a producer and a consumer contend even though they touch opposite ends of the queue. A linked\n * node list has two ends, so it can have two locks: producers take putLock, consumers take takeLock, and the\n * only shared word is an atomic count. The subtlety is the &quot;cascading signal&quot;: a put signals not-empty only when\n * the queue WAS empty, and it must do that outside its own lock, or the two locks would be taken in a fixed\n * order and the design would be back to one lock&#x27;s worth of contention.\n */\nfinal class TwoLockQueue&lt;T&gt; implements BlockingBuffer&lt;T&gt; {\n    /** A one-way linked cell. The head node is a dummy: its item is always null. */\n    private static final class Node&lt;T&gt; { T item; Node&lt;T&gt; next; Node(T item) { this.item = item; } }\n\n    private final int capacity;\n    private final AtomicInteger count = new AtomicInteger();\n    private Node&lt;T&gt; head = new Node&lt;&gt;(null), last = head;\n    private final ReentrantLock putLock = new ReentrantLock(), takeLock = new ReentrantLock();\n    private final Condition notFull = putLock.newCondition(), notEmpty = takeLock.newCondition();\n\n    /** A queue bounded to this many items, with one lock per end. */\n    TwoLockQueue(int capacity) { this.capacity = capacity; }\n\n    /** Append under putLock; wake a consumer only if the queue was empty before this item. */\n    public void put(T item) throws InterruptedException {\n        Objects.requireNonNull(item);\n        int c;\n        putLock.lockInterruptibly();\n        try {\n            while (count.get() == capacity) notFull.await();\n            last = last.next = new Node&lt;&gt;(item);\n            c = count.getAndIncrement();\n            if (c + 1 &lt; capacity) notFull.signal();   // still room: pass the baton to the next producer\n        } finally { putLock.unlock(); }\n        if (c == 0) signalNotEmpty();                 // it WAS empty: somebody may be parked on the other lock\n    }\n    /** Remove under takeLock; wake a producer only if the queue was full before this take. */\n    public T take() throws InterruptedException {\n        T item;\n        int c;\n        takeLock.lockInterruptibly();\n        try {\n            while (count.get() == 0) notEmpty.await();\n            item = dequeue();\n            c = count.getAndDecrement();\n            if (c &gt; 1) notEmpty.signal();             // more left: pass the baton to the next consumer\n        } finally { takeLock.unlock(); }\n        if (c == capacity) signalNotFull();           // it WAS full: a producer may be parked\n        return item;\n    }\n    /** The timed put: the same loop with a shrinking budget. */\n    public boolean offer(T item, long timeout, TimeUnit unit) throws InterruptedException {\n        Objects.requireNonNull(item);\n        long nanos = unit.toNanos(timeout);\n        int c;\n        putLock.lockInterruptibly();\n        try {\n            while (count.get() == capacity) {\n                if (nanos &lt;= 0) return false;\n                nanos = notFull.awaitNanos(nanos);    // awaitNanos hands back what is LEFT of the budget\n            }\n            last = last.next = new Node&lt;&gt;(item);\n            c = count.getAndIncrement();\n            if (c + 1 &lt; capacity) notFull.signal();\n        } finally { putLock.unlock(); }\n        if (c == 0) signalNotEmpty();\n        return true;\n    }\n    /** The timed take. */\n    public T poll(long timeout, TimeUnit unit) throws InterruptedException {\n        long nanos = unit.toNanos(timeout);\n        T item;\n        int c;\n        takeLock.lockInterruptibly();\n        try {\n            while (count.get() == 0) {\n                if (nanos &lt;= 0) return null;\n                nanos = notEmpty.awaitNanos(nanos);\n            }\n            item = dequeue();\n            c = count.getAndDecrement();\n            if (c &gt; 1) notEmpty.signal();\n        } finally { takeLock.unlock(); }\n        if (c == capacity) signalNotFull();\n        return item;\n    }\n    public int size() { return count.get(); }\n    public int capacity() { return capacity; }\n\n    /** Unlink the first real node; only ever called with takeLock held. */\n    private T dequeue() {\n        Node&lt;T&gt; first = head.next;\n        head.next = head;        // help the collector: the old dummy points at itself\n        head = first;\n        T item = first.item;\n        first.item = null;       // the new dummy holds nothing\n        return item;\n    }\n    /** Take the other lock just long enough to wake one waiter. */\n    private void signalNotEmpty() { takeLock.lock(); try { notEmpty.signal(); } finally { takeLock.unlock(); } }\n    private void signalNotFull()  { putLock.lock();  try { notFull.signal();  } finally { putLock.unlock(); } }\n}\n\n// ---- ext: ladder rung 3 -- no lock at all, one producer thread and one consumer thread\n/**\n * A single-producer single-consumer ring. Each cursor is written by exactly one thread and read by both, so a\n * volatile write and a volatile read are all the ordering needed: no lock, no CAS, no parking. The price is the\n * contract (exactly one thread on each side) and the fact that offer returning false is back-pressure the CALLER\n * must now handle -- spin, yield, park -- which is precisely what the blocking queue was doing for you.\n * In production this is where you also pad the cursors onto their own cache lines to stop false sharing.\n */\nfinal class SpscRing&lt;T&gt; {\n    private final Object[] slots;\n    private final int mask;\n    private volatile long writeAt, readAt;\n\n    /** Capacity must be a power of two so the wrap is a bit mask instead of a division. */\n    SpscRing(int capacity) {\n        if (Integer.bitCount(capacity) != 1) throw new IllegalArgumentException(&quot;capacity must be a power of two&quot;);\n        slots = new Object[capacity];\n        mask = capacity - 1;\n    }\n    /** Called by the one producer thread. False means full; the caller decides what to do about it. */\n    boolean offer(T item) {\n        long w = writeAt;\n        if (w - readAt == slots.length) return false;\n        slots[(int) (w &amp; mask)] = item;\n        writeAt = w + 1;                    // the volatile write publishes the slot as well\n        return true;\n    }\n    /** Called by the one consumer thread. Null means empty. */\n    @SuppressWarnings(&quot;unchecked&quot;)\n    T poll() {\n        long r = readAt;\n        if (r == writeAt) return null;\n        T item = (T) slots[(int) (r &amp; mask)];\n        slots[(int) (r &amp; mask)] = null;\n        readAt = r + 1;\n        return item;\n    }\n    /** How many items are in flight. */\n    int size() { return (int) (writeAt - readAt); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>10 &middot; In real code you would not write this yourself. What does java.util.concurrent already give you, and which one would you pick?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Say it before they do: <code>ArrayBlockingQueue</code> <i>is</i> this class &mdash; one lock, two conditions, a fixed array, a fairness flag in the constructor &mdash; and in production that is what you use. The exercise is to show you know what is inside it. The family is the same shape with one knob moved: <code>LinkedBlockingQueue</code> is rung two of the ladder (a put lock and a take lock); <code>SynchronousQueue</code> is capacity zero, a hand-off rather than a buffer, and is what a cached thread pool uses; <code>PriorityBlockingQueue</code> is the heap store; <code>DelayQueue</code> hands an item over only once its own time has come; <code>LinkedTransferQueue.transfer</code> waits until a consumer has actually taken the item. Two of them have a trap worth naming: <code>new LinkedBlockingQueue&lt;&gt;()</code> with no argument is unbounded, and <code>PriorityBlockingQueue</code> is always unbounded, so both quietly undo the back-pressure you were asked for. And the piece people miss: a <code>ThreadPoolExecutor</code> is a bounded queue plus a <code>RejectedExecutionHandler</code>, which is exactly our <code>OverflowPolicy</code> &mdash; <code>DiscardOldestPolicy</code> is drop-oldest, <code>AbortPolicy</code> is reject, and <code>CallerRunsPolicy</code> is the nearest thing to blocking, because the thread that submitted the work has to run it itself and therefore stops submitting. If they ask for a second way to write it by hand, the short one is two semaphores and a mutex: the permit count <i>is</i> the predicate, so there is no condition and no <code>while</code> loop &mdash; and no way to run a policy that wants to look inside a full queue, which is why the lock-and-two-conditions version is the one to type first. Test 10 runs ours, the semaphore one and <code>ArrayBlockingQueue</code> side by side and checks they answer identically.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: what java.util.concurrent already gives you -- and which one to reach for\n/**\n * Say this out loud in the interview: in production you use java.util.concurrent, and the exercise is to show\n * you know what is inside it. ArrayBlockingQueue IS this class -- one lock, two conditions, a ring, a fairness\n * flag in the constructor. The rest of the family is the same shape with one knob moved, and two of them have a\n * trap: LinkedBlockingQueue&#x27;s no-argument constructor is unbounded, and PriorityBlockingQueue is ALWAYS\n * unbounded, so both put the back-pressure you were asked for straight back into the heap.\n */\nfinal class Jdk {\n    /** Run one tiny example of each and return the lines to print. */\n    static List&lt;String&gt; tour() throws InterruptedException {\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n\n        // ArrayBlockingQueue: the same design as Main.java -- one lock, two conditions, a fixed array\n        BlockingQueue&lt;String&gt; abq = new ArrayBlockingQueue&lt;&gt;(2, /* fair = */ false);\n        abq.put(&quot;a&quot;);\n        boolean second = abq.offer(&quot;b&quot;);\n        boolean third = abq.offer(&quot;c&quot;, 20, TimeUnit.MILLISECONDS);\n        out.add(&quot;ArrayBlockingQueue(2): the second item was accepted (&quot; + second + &quot;) and the third gave up after 20 ms (&quot;\n              + third + &quot;) -- this is our class, in the JDK, fairness flag and all&quot;);\n\n        // LinkedBlockingQueue: ladder rung 2 (two locks). The no-argument constructor is UNBOUNDED: the trap\n        BlockingQueue&lt;String&gt; lbq = new LinkedBlockingQueue&lt;&gt;(2);\n        out.add(&quot;LinkedBlockingQueue(2): two locks, so producers and consumers stop meeting; remaining room &quot;\n              + lbq.remainingCapacity() + &quot;. new LinkedBlockingQueue&lt;&gt;() with no argument is UNBOUNDED&quot;);\n\n        // SynchronousQueue: capacity ZERO. Every put waits for a taker: a hand-off, not a buffer\n        SynchronousQueue&lt;String&gt; sq = new SynchronousQueue&lt;&gt;();\n        out.add(&quot;SynchronousQueue: capacity 0, so offer with no taker returns &quot; + sq.offer(&quot;x&quot;)\n              + &quot; -- it is a hand-off, and it is what a cached thread pool uses&quot;);\n\n        // PriorityBlockingQueue: our HeapStore, except it is unbounded, so put NEVER blocks\n        BlockingQueue&lt;Integer&gt; pbq = new PriorityBlockingQueue&lt;&gt;();\n        pbq.addAll(List.of(5, 1, 9));\n        out.add(&quot;PriorityBlockingQueue: urgent first (&quot; + pbq.take() + &quot; came out first) but it is ALWAYS unbounded: put never blocks&quot;);\n\n        // DelayQueue / LinkedTransferQueue: the two specialist ends of the family\n        out.add(&quot;DelayQueue: an item only becomes takeable at its own time -- scheduled retries. &quot;\n              + &quot;LinkedTransferQueue.transfer() waits until a consumer has actually taken the item&quot;);\n\n        // ThreadPoolExecutor: the bounded queue plus a RejectedExecutionHandler IS OverflowPolicy\n        ThreadPoolExecutor pool = new ThreadPoolExecutor(1, 1, 0, TimeUnit.SECONDS,\n                new ArrayBlockingQueue&lt;&gt;(1), new ThreadPoolExecutor.CallerRunsPolicy());\n        AtomicInteger ran = new AtomicInteger();\n        for (int i = 0; i &lt; 6; i++) pool.execute(ran::incrementAndGet);\n        pool.shutdown();\n        pool.awaitTermination(5, TimeUnit.SECONDS);\n        out.add(&quot;ThreadPoolExecutor(bounded queue + CallerRunsPolicy): all &quot; + ran.get()\n              + &quot; tasks ran, the submitter ran the overflow itself -- a RejectedExecutionHandler IS an OverflowPolicy&quot;);\n        return out;\n    }\n}\n\n// ---- ext: two semaphores and a mutex -- the same queue with no condition and no while loop\n/**\n * The other way interviewers ask for this. A counting semaphore IS a count of permits, so &quot;wait until there is\n * room&quot; becomes slots.acquire() and &quot;wait until there is an item&quot; becomes items.acquire(): the counting is the\n * predicate, so there is no condition to re-check and no while loop. The mutex only protects the deque itself.\n * What you give up: a consistent snapshot across both counters (size() is a permit count, not a locked read),\n * atomic bulk moves like drainTo, and any policy that wants to look at the queue while it is full. Which is why\n * the lock-plus-two-conditions version is the one to write when the interviewer says &quot;and now drop the oldest&quot;.\n */\nfinal class SemaphoreQueue&lt;T&gt; {\n    private final Semaphore slots, items;\n    private final ReentrantLock mutex = new ReentrantLock();\n    private final ArrayDeque&lt;T&gt; q = new ArrayDeque&lt;&gt;();\n\n    /** A queue of this many items: capacity permits on the slots side, zero on the items side. */\n    SemaphoreQueue(int capacity) {\n        slots = new Semaphore(capacity);\n        items = new Semaphore(0);\n    }\n    /** Take a free slot (waiting if there is none), append, then publish one item. */\n    void put(T item) throws InterruptedException {\n        slots.acquire();\n        mutex.lock();\n        try { q.addLast(item); } finally { mutex.unlock(); }\n        items.release();\n    }\n    /** Take an item (waiting if there is none), remove it, then hand the slot back. */\n    T take() throws InterruptedException {\n        items.acquire();\n        T item;\n        mutex.lock();\n        try { item = q.pollFirst(); } finally { mutex.unlock(); }\n        slots.release();\n        return item;\n    }\n    /** The timed put: tryAcquire either takes the permit or takes nothing, so nothing leaks on a timeout. */\n    boolean offer(T item, long timeout, TimeUnit unit) throws InterruptedException {\n        if (!slots.tryAcquire(timeout, unit)) return false;\n        mutex.lock();\n        try { q.addLast(item); } finally { mutex.unlock(); }\n        items.release();\n        return true;\n    }\n    /** How many items are in it: a permit count, not a locked snapshot. */\n    int size() { return items.availablePermits(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; The service is shutting down. Stop the queue cleanly: no work lost, nobody left asleep.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p><code>close()</code> sets a flag under the lock and then calls <code>signalAll</code> on both conditions, because this is the one change that concerns every waiter at once. The flag is read inside the same wait loops, so a parked thread wakes, re-checks, and sees it; a closing signal cannot be lost because the flag and the signal are set under the same lock. After close, a put is refused with an exception so nothing is silently dropped, while a take keeps handing out what is already in the queue and only then returns null as end-of-stream &mdash; which is exactly what the consumer loops in <code>main</code> use to exit. The portable alternative, for a queue you do not own, is one poison pill per consumer: a sentinel that travels in FIFO order behind the real work.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Stop the queue: no new work in, and every parked thread wakes up to find out. signalAll, not signal,\n     * because this is the one change that concerns every waiter on both sides at once.\n     */\n    public void close() {\n        int sizeAfter;\n        lock.lock();\n        try {\n            if (closed) return;\n            closed = true;\n            sizeAfter = store.size();\n            notFull.signalAll();\n            notEmpty.signalAll();\n        } finally {\n            lock.unlock();\n        }\n        publish(&quot;close&quot;, sizeAfter);\n    }\n\n// ---- ext: shutdown without a flag -- N poison pills for N consumers\n/**\n * close() is the better answer when you own the queue. When you do not -- a java.util.concurrent queue, say --\n * the portable trick is a sentinel: put one pill per consumer, and each consumer that sees one re-parks nothing,\n * exits its loop, and leaves. The pill travels in FIFO order behind the real work, so nothing is lost.\n */\nfinal class Pills {\n    /** The sentinel. Reference equality is the test, so a real item can never be mistaken for it. */\n    static final Object PILL = new Object();\n\n    /** Run a consumer loop until a pill arrives; returns how many real items it handled. */\n    static int consumeUntilPill(BoundedBlockingQueue&lt;Object&gt; q) throws InterruptedException {\n        int handled = 0;\n        while (true) {\n            Object item = q.take();\n            if (item == PILL || item == null) return handled;\n            handled++;\n        }\n    }\n    /** One pill per consumer, after the last real item. */\n    static void shutdown(BoundedBlockingQueue&lt;Object&gt; q, int consumers) throws InterruptedException {\n        for (int i = 0; i &lt; consumers; i++) q.put(PILL);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Urgent jobs must jump the queue. Priority instead of FIFO.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Storage was already a separate job behind its own interface, so this is a new <code>Store</code> and nothing else: a bounded binary heap with the same add / poll / isFull / size surface. The lock, both conditions, the wait loops and every policy are untouched, and the queue is constructed with the new store instead of a ring. Two honest caveats to volunteer: add and poll become O(log n) instead of O(1), and FIFO is gone, so a low-priority item can starve &mdash; the usual fix is a priority plus an arrival sequence number as a tie-break, or ageing. Also note that drop-oldest on a heap drops the <i>highest</i>-priority item, so pair a heap with drop-newest.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: priority instead of FIFO -- a new Store, and the lock, the conditions and the policies do not change\n/**\n * The urgent item goes first. Storage was already a separate job, so priority is a new Store and nothing else;\n * add and poll become O(log n) instead of O(1), which is the price of the ordering.\n * One honest caveat: with this store, drop-oldest drops the HIGHEST-priority item, so pair it with drop-newest.\n */\nfinal class HeapStore&lt;T&gt; implements Store&lt;T&gt; {\n    private final PriorityQueue&lt;T&gt; heap;\n    private final int capacity;\n\n    /** A bounded heap: at most this many items, ordered by this comparator. */\n    HeapStore(int capacity, Comparator&lt;? super T&gt; order) {\n        if (capacity &lt;= 0) throw new IllegalArgumentException(&quot;capacity must be &gt; 0&quot;);\n        this.capacity = capacity;\n        this.heap = new PriorityQueue&lt;&gt;(capacity, order);\n    }\n    public void add(T item) { if (isFull()) throw new IllegalStateException(&quot;heap is full&quot;); heap.add(item); }\n    public T poll() { if (heap.isEmpty()) throw new IllegalStateException(&quot;heap is empty&quot;); return heap.poll(); }\n    public boolean isFull() { return heap.size() == capacity; }\n    public boolean isEmpty() { return heap.isEmpty(); }\n    public int size() { return heap.size(); }\n    public int capacity() { return capacity; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; These messages are two megabytes each. Bound it by bytes, not by item count.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Same seam again: a store whose <code>isFull</code> compares a running byte total against a budget, with the size of an item supplied by a one-method <code>Weigher</code> handed in, because the queue must not guess how big anything is. The queue does not change at all. The one imprecision worth saying out loud before they say it: fullness is tested before the incoming item is weighed, so the bound can overshoot by at most one item; the exact fix is a <code>hasRoomFor(item)</code> on the store interface, which <code>put</code> would call instead of <code>isFull()</code>. An item larger than the whole budget is rejected rather than deadlocking the producer forever.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: bound by bytes, not by count -- because a thousand 2 KB messages and a thousand 2 MB ones are not the same risk\n/** How big one item is, in whatever unit the bound is written in. Handed in, so the queue does no guessing. */\ninterface Weigher&lt;T&gt; { int weightOf(T item); }\n\n/**\n * Full means &quot;the bytes budget is spent&quot;, not &quot;the slot count is spent&quot;. The overshoot is at most one item,\n * because fullness is tested before the item is weighed; the exact fix is one extra method on Store,\n * boolean hasRoomFor(T item), which put would call instead of isFull().\n */\nfinal class ByteBoundedStore&lt;T&gt; implements Store&lt;T&gt; {\n    private final ArrayDeque&lt;T&gt; items = new ArrayDeque&lt;&gt;();\n    private final Weigher&lt;T&gt; weigher;\n    private final int maxBytes;\n    private int bytes;\n\n    /** A store bounded by total weight rather than by item count. */\n    ByteBoundedStore(int maxBytes, Weigher&lt;T&gt; weigher) { this.maxBytes = maxBytes; this.weigher = weigher; }\n\n    public void add(T item) {\n        int w = weigher.weightOf(item);\n        if (w &gt; maxBytes) throw new IllegalArgumentException(&quot;item of &quot; + w + &quot; bytes can never fit in &quot; + maxBytes);\n        items.addLast(item);\n        bytes += w;\n    }\n    public T poll() { T item = items.pollFirst(); bytes -= weigher.weightOf(item); return item; }\n    public boolean isFull() { return bytes &gt;= maxBytes; }\n    public boolean isEmpty() { return items.isEmpty(); }\n    public int size() { return items.size(); }\n    /** The declared bound, in bytes: this store counts weight, not slots. */\n    public int capacity() { return maxBytes; }\n    /** The bytes held right now. */\n    public int bytes() { return bytes; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>14 &middot; One of my producers is being starved. What can you do about it, and what does it cost?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The lock is non-fair by default: a thread arriving at the very moment the lock is released can barge past threads that have been queued for a while. That is what makes it fast &mdash; the thread that just released the lock is still on a CPU and can simply take it again, with no park, no unpark and no context switch &mdash; and it is also how one caller can be passed over again and again, which is starvation. <code>new ReentrantLock(true)</code> hands the lock out in arrival order instead. Quote the price, because it is bigger than people expect: with six threads sharing nothing but the lock, the barging lock does about eleven million round-trips through it in 200 ms and the fair lock about forty thousand. That is two to three orders of magnitude, and it is all park and unpark. The second half of the answer is the one that gets the nod: on that same run the barging lock did not actually starve anybody &mdash; the busiest and quietest threads were within 1.1x of each other. Fairness buys a guarantee that no waiter is passed over indefinitely; it does not buy a better average. So measure first, and if one producer really is losing, the usual fix is a separate queue for it or a bigger capacity, not the flag.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: fairness and starvation -- one flag, and what it costs\n/**\n * A non-fair lock lets a thread that is arriving right now barge past threads that have been queued for a\n * while. That is fast, because the thread that just released the lock is still running and can simply take it\n * again -- no park, no unpark, no context switch. It is also how one caller can be passed over again and again,\n * which is starvation. new ReentrantLock(true) hands the lock out in arrival order instead.\n * This measures the flag on its own: six threads doing put-then-take on a queue big enough that nobody ever\n * blocks, so the ONLY thing being shared is the lock. The result is worth quoting in the interview: fairness\n * costs two to three ORDERS OF MAGNITUDE of throughput here, because every hand-off becomes a park and an\n * unpark -- and on this symmetric workload the barging lock did not starve anyone anyway (both spreads come\n * out near 1.0x). Fairness buys a guarantee that no waiter is passed over indefinitely, not a better average.\n */\nfinal class Fairness {\n    /**\n     * Six threads hammering one queue for a fixed window. Returns the total round-trips through the lock, and\n     * the busiest-to-quietest ratio across the six -- which is what &quot;one of my producers is starved&quot; means.\n     */\n    static String run(boolean fair, long millis) throws Exception {\n        BoundedBlockingQueue&lt;Integer&gt; q = new BoundedBlockingQueue&lt;&gt;(new RingBuffer&lt;&gt;(1024), fair);\n        final int THREADS = 6;\n        long[] ops = new long[THREADS];\n        AtomicBoolean stop = new AtomicBoolean();\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; THREADS; i++) {\n            final int id = i;\n            threads.add(new Thread(() -&gt; {\n                try { while (!stop.get()) { q.put(id); q.take(); ops[id]++; } }   // never full, never empty\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            }));\n        }\n        threads.forEach(Thread::start);\n        Thread.sleep(millis);\n        stop.set(true);\n        for (Thread t : threads) t.join(2000);\n        long total = 0, busiest = 0, quietest = Long.MAX_VALUE;\n        for (long o : ops) { total += o; busiest = Math.max(busiest, o); quietest = Math.min(quietest, o); }\n        return String.format(&quot;%s lock: %,d trips through the lock in %d ms; busiest thread %,d, quietest %,d (%.1fx spread)&quot;,\n                fair ? &quot;fair  &quot; : &quot;unfair&quot;, total, millis, busiest, quietest, busiest / (double) quietest);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>15 &middot; Now it has to survive a restart. And why did we bound it in the first place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Bounding is the answer to the second question: an unbounded queue does not remove the mismatch between a fast producer and a slow consumer, it hides it in the heap until the process dies &mdash; 200 items a second of surplus is 720,000 items an hour. A bound converts that into the producer waiting, which is the system telling the truth, and the capacity you pick is a latency budget: depth divided by drain rate. Durability is the same two cursors with the array replaced by an append-only file. Put appends and returns only once the write is durable; take reads at the committed offset; and the offset is committed only <i>after</i> the consumer's work succeeded. That order is the design: a crash in between replays the last item, so delivery is at-least-once and consumers must be idempotent, and exactly-once needs the work and the offset in one transaction. At that point you have described a message broker, which is the right thing to say next.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: surviving a restart -- the queue becomes a log, and the head index becomes a committed offset\n/**\n * An in-memory queue loses everything when the process dies. The durable version is the same two cursors with\n * the array replaced by an append-only file: put appends a line and returns only after the write is durable,\n * take reads at the committed offset, and the offset is committed only AFTER the consumer&#x27;s work succeeded.\n * That order is the whole design: a crash between the two replays the last item, so delivery is at-least-once\n * and consumers must be idempotent. Exactly-once needs the work and the offset commit in one transaction.\n * This is a sketch, not a broker: no fsync per record, no segments, no compaction -- that is what Kafka is.\n */\nfinal class DurableLog implements AutoCloseable {\n    private final java.nio.file.Path data, offsetFile;\n    private final java.io.BufferedWriter out;\n    private long committed;\n\n    /** Open (or create) a log and read back the offset the last run committed. */\n    DurableLog(java.nio.file.Path data, java.nio.file.Path offsetFile) throws java.io.IOException {\n        this.data = data;\n        this.offsetFile = offsetFile;\n        this.out = java.nio.file.Files.newBufferedWriter(data, java.nio.file.StandardOpenOption.CREATE,\n                                                         java.nio.file.StandardOpenOption.APPEND);\n        this.committed = java.nio.file.Files.exists(offsetFile)\n            ? Long.parseLong(java.nio.file.Files.readString(offsetFile).trim()) : 0;\n    }\n    /** Append and flush. The item is in the queue only once this returns. */\n    synchronized void append(String item) throws java.io.IOException {\n        out.write(item.replace(&quot;\\n&quot;, &quot; &quot;));\n        out.newLine();\n        out.flush();\n    }\n    /** The next item at the committed offset, or null when the log has been caught up with. */\n    synchronized String peek() throws java.io.IOException {\n        List&lt;String&gt; lines = java.nio.file.Files.readAllLines(data);\n        return committed &lt; lines.size() ? lines.get((int) committed) : null;\n    }\n    /** Move past the item -- called only after the consumer&#x27;s work succeeded, never before. */\n    synchronized void commit() throws java.io.IOException {\n        committed++;\n        java.nio.file.Files.writeString(offsetFile, Long.toString(committed));\n    }\n    /** How far the consumer has got. */\n    synchronized long offset() { return committed; }\n    public void close() throws java.io.IOException { out.close(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Which pattern is where, which SOLID letter is where, and why is OverflowPolicy not just an enum?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The tables on page 02 moves 10 and 11 are the answer; the snippet below is the sixty-second spoken version, one line per name. Two things are worth adding. The first is the question interviewers use to see whether you actually understand Strategy: why is what-happens-on-full not an <code>enum {BLOCK, DROP_OLDEST, REJECT}</code> with a <code>switch</code> inside <code>put</code>? Because each of those is behaviour, not a label &mdash; blocking has to call <code>awaitRoom</code>, drop-oldest has to evict, and the next one somebody asks for will want state of its own, like a count of how many it dropped. An enum puts all of that inside the queue and makes every new rule an edit to <code>put</code>; a one-method interface makes it a new file. Use an enum when the values really are just names, like an event type. The second is Factory and Builder: Factory earns its place the day capacity, policy and store arrive as strings from configuration; Builder never does here, because the constructor takes two arguments.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Monitor object: private state, one lock, and every path in takes it\nprivate final ReentrantLock lock;\nprivate final Condition notFull, notEmpty;      // two crowds, so a signal can be aimed\n\n// Strategy, twice: what &quot;full&quot; means, and how items are held\ninterface OverflowPolicy&lt;T&gt; { boolean onFull(BoundedBlockingQueue&lt;T&gt; queue, T item) throws InterruptedException; }\ninterface Store&lt;T&gt; { void add(T item); T poll(); boolean isFull(); boolean isEmpty(); int size(); int capacity(); }\nvoid configure(OverflowPolicy&lt;T&gt; policy, Clock clock) { this.onFull = policy; this.clock = clock; }\n\n// Decorator: the same interface, wrapped, so measurement never opens the queue\nfinal class MeteredBuffer&lt;T&gt; implements BlockingBuffer&lt;T&gt; { private final BlockingBuffer&lt;T&gt; inner; }\n\n// Observer: announced after the unlock, and a broken listener cannot break a handoff\nprivate void publish(String what, int size) {\n    for (QueueObserver o : observers) try { o.onEvent(what, size); } catch (RuntimeException ignored) { }\n}\n\n// State: the while loop IS the state machine -- a wake goes back to the check, never to the write\nwhile (store.isFull() &amp;&amp; !closed) { parks.incrementAndGet(); notFull.await(); }\n\n// Factory: not yet. It earns the name the day this line comes from configuration\nnew BoundedBlockingQueue&lt;&gt;(new RingBuffer&lt;&gt;(64), false);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * Where time comes from. Injected, never read from the wall clock inside a method, so a test can push a\n * deadline into the past and watch a timed call give up without actually waiting for it.\n */\ninterface Clock { long nanoTime(); }\n\n/**\n * The promise a producer and a consumer depend on: hand an item in, pull an item out, and two timed\n * versions for callers that cannot wait forever. put and take can block, so both declare InterruptedException.\n */\ninterface BlockingBuffer<T> {\n    /** Hand an item in. Blocks (or drops, or throws) when the buffer is full: that is the overflow policy's call. */\n    void put(T item) throws InterruptedException;\n    /** Pull the oldest item out. Blocks while the buffer is empty. Returns null only when the queue is closed and drained. */\n    T take() throws InterruptedException;\n    /** Hand an item in, waiting at most this long for room. Returns false if the budget ran out; nothing is written then. */\n    boolean offer(T item, long timeout, TimeUnit unit) throws InterruptedException;\n    /** Pull an item out, waiting at most this long for one. Returns null if the budget ran out (or the queue is closed and drained). */\n    T poll(long timeout, TimeUnit unit) throws InterruptedException;\n    /** How many items are in the buffer right now, read as one consistent snapshot. */\n    int size();\n    /** The bound this buffer was built with. It never changes. */\n    int capacity();\n}\n\n/**\n * Storage, and nothing else: no locks, no waiting, no opinions about what \"full\" means. One job, so it can be\n * tested on one thread. Swapping this is how FIFO becomes priority or count-bounded becomes byte-bounded.\n */\ninterface Store<T> {\n    /** Put an item at the tail. The caller must have checked isFull() first; a full store throws rather than overwrite. */\n    void add(T item);\n    /** Remove and return the head item. The caller must have checked isEmpty() first. */\n    T poll();\n    /** True when there is no room for another item, in whatever unit this store counts in. */\n    boolean isFull();\n    /** True when there is nothing to hand out. */\n    boolean isEmpty();\n    /** How many items are held right now. */\n    int size();\n    /** The declared bound: items for the ring buffer, bytes for a byte-bounded store. */\n    int capacity();\n}\n\n/**\n * A fixed array with two cursors. head is the next item to hand out, tail the next free slot; both advance\n * modulo the array length, so the queue rides a moving window over the array with no shifting and no allocation\n * per item. count is what tells full (count == capacity) from empty (count == 0), which head and tail alone cannot.\n */\nfinal class RingBuffer<T> implements Store<T> {\n    private final Object[] slots;\n    private int head, tail, count;\n\n    /** A ring of exactly this many slots. Capacity is fixed here and never changes: that is the bound. */\n    RingBuffer(int capacity) {\n        if (capacity <= 0) throw new IllegalArgumentException(\"capacity must be > 0, got \" + capacity);\n        slots = new Object[capacity];\n    }\n    /** Append at the tail and wrap. Throws if full, so a policy that lies about having made room is caught here. */\n    public void add(T item) {\n        if (count == slots.length) throw new IllegalStateException(\"ring is full: \" + count);\n        slots[tail] = item;\n        tail = (tail + 1) % slots.length;\n        count++;\n    }\n    /** Remove the head, wrap, and null the slot so the array does not pin a dead object. */\n    @SuppressWarnings(\"unchecked\")\n    public T poll() {\n        if (count == 0) throw new IllegalStateException(\"ring is empty\");\n        T item = (T) slots[head];\n        slots[head] = null;\n        head = (head + 1) % slots.length;\n        count--;\n        return item;\n    }\n    public boolean isFull() { return count == slots.length; }\n    public boolean isEmpty() { return count == 0; }\n    public int size() { return count; }\n    public int capacity() { return slots.length; }\n}\n\n/**\n * What \"full\" means, as one method. Called by put with the lock already held and the store already full.\n * Return true if the caller should now enqueue (room exists), false if this policy consumed or dropped the item.\n * A policy may wait, but only on the queue's own not-full condition, which releases the lock while it waits.\n */\ninterface OverflowPolicy<T> {\n    /** Decide what happens to this item when there is no room. Return true to enqueue it after all. */\n    boolean onFull(BoundedBlockingQueue<T> queue, T item) throws InterruptedException;\n}\n\n/** The default: make the producer wait until a consumer frees a slot. This is what \"blocking queue\" means. */\nfinal class BlockUntilRoom<T> implements OverflowPolicy<T> {\n    /** Park on not-full until there is room (or the queue closes), then tell put to enqueue. */\n    public boolean onFull(BoundedBlockingQueue<T> queue, T item) throws InterruptedException {\n        queue.awaitRoom();\n        return true;\n    }\n}\n\n/** Never stall the producer: throw the stalest item away and keep the freshest N. A live metrics panel wants this. */\nfinal class DropOldest<T> implements OverflowPolicy<T> {\n    /** Evict the head to make room, then tell put to enqueue. Never waits, so a producer is never blocked. */\n    public boolean onFull(BoundedBlockingQueue<T> queue, T item) {\n        queue.evictOldest();\n        return true;\n    }\n}\n\n/** Never stall and never lose silently: refuse the item loudly and let the caller decide. */\nfinal class RejectWhenFull<T> implements OverflowPolicy<T> {\n    /** Always throws. The caller sees the back-pressure as an exception instead of as a pause. */\n    public boolean onFull(BoundedBlockingQueue<T> queue, T item) {\n        throw new IllegalStateException(\"queue is full (\" + queue.capacity() + \")\");\n    }\n}\n\n/** Somebody who wants to know what the queue did, without the queue knowing what a dashboard is. */\ninterface QueueObserver {\n    /** Called after the lock is released, with what happened and the size right after it happened. */\n    void onEvent(String what, int size);\n}\n\n/**\n * The proof that the bound holds: it remembers the largest size it ever saw. If this ever exceeds capacity,\n * an item was enqueued into a full queue. Used by the demo and by FailureTests.\n */\nfinal class PeakMeter implements QueueObserver {\n    private final AtomicInteger peak = new AtomicInteger();\n    private final AtomicLong events = new AtomicLong();\n    /** Record the size, keeping the maximum. Cheap, lock-free, and called outside the queue's lock. */\n    public void onEvent(String what, int size) {\n        events.incrementAndGet();\n        peak.accumulateAndGet(size, Math::max);\n    }\n    /** The largest size ever observed. */\n    public int peak() { return peak.get(); }\n    /** How many events were seen. */\n    public long events() { return events.get(); }\n}\n\n/**\n * The whole point of the exercise: a queue with a fixed capacity where a producer waits when it is full and a\n * consumer waits when it is empty, with no spinning. One lock guards the store and both cursors; two conditions\n * keep the two waiting crowds apart, so a put wakes a consumer and a take wakes a producer, never the wrong one.\n * The invariant, always true outside the lock: the size is never negative and never past the capacity, the order is\n * FIFO, and every item is delivered exactly once.\n */\nfinal class BoundedBlockingQueue<T> implements BlockingBuffer<T> {\n    private final Store<T> store;\n    private final ReentrantLock lock;\n    private final Condition notFull;   // producers park here; a take signals it\n    private final Condition notEmpty;  // consumers park here; a put signals it\n    private OverflowPolicy<T> onFull = new BlockUntilRoom<>();\n    private Clock clock = System::nanoTime;\n    private final List<QueueObserver> observers = new CopyOnWriteArrayList<>();\n    private final AtomicLong parks = new AtomicLong();\n    private boolean closed;            // written and read under the lock only\n\n    /** A queue of this many items, with a non-fair lock (throughput first) and the blocking policy. */\n    BoundedBlockingQueue(int capacity) { this(new RingBuffer<>(capacity), false); }\n\n    /**\n     * The full constructor: any store, and fair = true to hand the lock out in arrival order. Fairness costs\n     * throughput and is only worth it when one starved waiter is a real problem.\n     */\n    BoundedBlockingQueue(Store<T> store, boolean fair) {\n        this.store = Objects.requireNonNull(store);\n        this.lock = new ReentrantLock(fair);\n        this.notFull = lock.newCondition();\n        this.notEmpty = lock.newCondition();\n    }\n\n    /** Hand in the rules. The queue never builds them, so a test can hand in a broken one on purpose. */\n    void configure(OverflowPolicy<T> policy, Clock clock) {\n        this.onFull = Objects.requireNonNull(policy);\n        this.clock = Objects.requireNonNull(clock);\n    }\n    /** Add a listener. It is called after the lock is released, never inside it. */\n    void addObserver(QueueObserver observer) { observers.add(observer); }\n\n    /**\n     * Hand an item in. Full means the policy decides: block (default), drop the oldest, or throw.\n     * The order is the design: change the store first, signal second, unlock third, tell the world fourth.\n     */\n    public void put(T item) throws InterruptedException {\n        Objects.requireNonNull(item, \"null is not an item: poll returns null to mean empty\");\n        int sizeAfter;\n        lock.lockInterruptibly();\n        try {\n            if (closed) throw new IllegalStateException(\"queue is closed\");\n            if (store.isFull() && !onFull.onFull(this, item)

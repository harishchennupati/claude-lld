a producer only if the queue was full before this take. */\n    public T take() throws InterruptedException {\n        T item;\n        int c;\n        takeLock.lockInterruptibly();\n        try {\n            while (count.get() == 0) notEmpty.await();\n            item = dequeue();\n            c = count.getAndDecrement();\n            if (c &gt; 1) notEmpty.signal();             // more left: pass the baton to the next consumer\n        } finally { takeLock.unlock(); }\n        if (c == capacity) signalNotFull();           // it WAS full: a producer may be parked\n        return item;\n    }\n    /** The timed put: the same loop with a shrinking budget. */\n    public boolean offer(T item, long timeout, TimeUnit unit) throws InterruptedException {\n        Objects.requireNonNull(item);\n        long nanos = unit.toNanos(timeout);\n        int c;\n        putLock.lockInterruptibly();\n        try {\n            while (count.get() == capacity) {\n                if (nanos &lt;= 0) return false;\n                nanos = notFull.awaitNanos(nanos);    // awaitNanos hands back what is LEFT of the budget\n            }\n            last = last.next = new Node&lt;&gt;(item);\n            c = count.getAndIncrement();\n            if (c + 1 &lt; capacity) notFull.signal();\n        } finally { putLock.unlock(); }\n        if (c == 0) signalNotEmpty();\n        return true;\n    }\n    /** The timed take. */\n    public T poll(long timeout, TimeUnit unit) throws InterruptedException {\n        long nanos = unit.toNanos(timeout);\n        T item;\n        int c;\n        takeLock.lockInterruptibly();\n        try {\n            while (count.get() == 0) {\n                if (nanos &lt;= 0) return null;\n                nanos = notEmpty.awaitNanos(nanos);\n            }\n            item = dequeue();\n            c = count.getAndDecrement();\n            if (c &gt; 1) notEmpty.signal();\n        } finally { takeLock.unlock(); }\n        if (c == capacity) signalNotFull();\n        return item;\n    }\n    public int size() { return count.get(); }\n    public int capacity() { return capacity; }\n\n    /** Unlink the first real node; only ever called with takeLock held. */\n    private T dequeue() {\n        Node&lt;T&gt; first = head.next;\n        head.next = head;        // help the collector: the old dummy points at itself\n        head = first;\n        T item = first.item;\n        first.item = null;       // the new dummy holds nothing\n        return item;\n    }\n    /** Take the other lock just long enough to wake one waiter. */\n    private void signalNotEmpty() { takeLock.lock(); try { notEmpty.signal(); } finally { takeLock.unlock(); } }\n    private void signalNotFull()  { putLock.lock();  try { notFull.signal();  } finally { putLock.unlock(); } }\n}\n\n// ---- ext: ladder rung 3 -- no lock at all, one producer thread and one consumer thread\n/**\n * A single-producer single-consumer ring. Each cursor is written by exactly one thread and read by both, so a\n * volatile write and a volatile read are all the ordering needed: no lock, no CAS, no parking. The price is the\n * contract (exactly one thread on each side) and the fact that offer returning false is back-pressure the CALLER\n * must now handle -- spin, yield, park -- which is precisely what the blocking queue was doing for you.\n * In production this is where you also pad the cursors onto their own cache lines to stop false sharing.\n */\nfinal class SpscRing&lt;T&gt; {\n    private final Object[] slots;\n    private final int mask;\n    private volatile long writeAt, readAt;\n\n    /** Capacity must be a power of two so the wrap is a bit mask instead of a division. */\n    SpscRing(int capacity) {\n        if (Integer.bitCount(capacity) != 1) throw new IllegalArgumentException(&quot;capacity must be a power of two&quot;);\n        slots = new Object[capacity];\n        mask = capacity - 1;\n    }\n    /** Called by the one producer thread. False means full; the caller decides what to do about it. */\n    boolean offer(T item) {\n        long w = writeAt;\n        if (w - readAt == slots.length) return false;\n        slots[(int) (w &amp; mask)] = item;\n        writeAt = w + 1;                    // the volatile write publishes the slot as well\n        return true;\n    }\n    /** Called by the one consumer thread. Null means empty. */\n    @SuppressWarnings(&quot;unchecked&quot;)\n    T poll() {\n        long r = readAt;\n        if (r == writeAt) return null;\n        T item = (T) slots[(int) (r &amp; mask)];\n        slots[(int) (r &amp; mask)] = null;\n        readAt = r + 1;\n        return item;\n    }\n    /** How many items are in flight. */\n    int size() { return (int) (writeAt - readAt); }\n}\n\n// ---- ext: the synchronized / wait / notify version, and the lost wakeup that comes free with it\n/**\n * The same queue with one monitor instead of a lock and two conditions. It is correct ONLY with notifyAll:\n * with a single monitor there is one waiting crowd, so notify() may hand the wakeup to a producer when the\n * thread that could make progress was a consumer. That thread goes straight back to sleep, the signal is spent,\n * and everybody hangs -- the classic lost wakeup. notifyAll is the fix and the thundering herd is its price,\n * which is the whole argument for a ReentrantLock with two conditions.\n */\nfinal class SyncQueue&lt;T&gt; {\n    private final ArrayDeque&lt;T&gt; items = new ArrayDeque&lt;&gt;();\n    private final int capacity;\n\n    /** A monitor-based bounded queue of this many items. */\n    SyncQueue(int capacity) { this.capacity = capacity; }\n\n    /** while, not if: a wakeup only means &quot;look again&quot;, never &quot;the slot is yours&quot;. */\n    synchronized void put(T item) throws InterruptedException {\n        while (items.size() == capacity) wait();\n        items.addLast(item);\n        notifyAll();        // NOT notify(): one monitor, two crowds, and no way to aim\n    }\n    /** Mirror of put. */\n    synchronized T take() throws InterruptedException {\n        while (items.isEmpty()) wait();\n        T item = items.pollFirst();\n        notifyAll();\n        return item;\n    }\n    /** Size, read under the same monitor. */\n    synchronized int size() { return items.size(); }\n}\n\n// ---- ext: shutdown without a flag -- N poison pills for N consumers\n/**\n * close() is the better answer when you own the queue. When you do not -- a java.util.concurrent queue, say --\n * the portable trick is a sentinel: put one pill per consumer, and each consumer that sees one re-parks nothing,\n * exits its loop, and leaves. The pill travels in FIFO order behind the real work, so nothing is lost.\n */\nfinal class Pills {\n    /** The sentinel. Reference equality is the test, so a real item can never be mistaken for it. */\n    static final Object PILL = new Object();\n\n    /** Run a consumer loop until a pill arrives; returns how many real items it handled. */\n    static int consumeUntilPill(BoundedBlockingQueue&lt;Object&gt; q) throws InterruptedException {\n        int handled = 0;\n        while (true) {\n            Object item = q.take();\n            if (item == PILL || item == null) return handled;\n            handled++;\n        }\n    }\n    /** One pill per consumer, after the last real item. */\n    static void shutdown(BoundedBlockingQueue&lt;Object&gt; q, int consumers) throws InterruptedException {\n        for (int i = 0; i &lt; consumers; i++) q.put(PILL);\n    }\n}\n\n// ---- ext: fairness and starvation -- one flag, and what it costs\n/**\n * A non-fair lock lets a thread that is arriving right now barge past threads that have been queued for a\n * while. That is fast, because the thread that just released the lock is still running and can simply take it\n * again -- no park, no unpark, no context switch. It is also how one caller can be passed over again and again,\n * which is starvation. new ReentrantLock(true) hands the lock out in arrival order instead.\n * This measures the flag on its own: six threads doing put-then-take on a queue big enough that nobody ever\n * blocks, so the ONLY thing being shared is the lock. The result is worth quoting in the interview: fairness\n * costs two to three ORDERS OF MAGNITUDE of throughput here, because every hand-off becomes a park and an\n * unpark -- and on this symmetric workload the barging lock did not starve anyone anyway (both spreads come\n * out near 1.0x). Fairness buys a guarantee that no waiter is passed over indefinitely, not a better average.\n */\nfinal class Fairness {\n    /**\n     * Six threads hammering one queue for a fixed window. Returns the total round-trips through the lock, and\n     * the busiest-to-quietest ratio across the six -- which is what &quot;one of my producers is starved&quot; means.\n     */\n    static String run(boolean fair, long millis) throws Exception {\n        BoundedBlockingQueue&lt;Integer&gt; q = new BoundedBlockingQueue&lt;&gt;(new RingBuffer&lt;&gt;(1024), fair);\n        final int THREADS = 6;\n        long[] ops = new long[THREADS];\n        AtomicBoolean stop = new AtomicBoolean();\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; THREADS; i++) {\n            final int id = i;\n            threads.add(new Thread(() -&gt; {\n                try { while (!stop.get()) { q.put(id); q.take(); ops[id]++; } }   // never full, never empty\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            }));\n        }\n        threads.forEach(Thread::start);\n        Thread.sleep(millis);\n        stop.set(true);\n        for (Thread t : threads) t.join(2000);\n        long total = 0, busiest = 0, quietest = Long.MAX_VALUE;\n        for (long o : ops) { total += o; busiest = Math.max(busiest, o); quietest = Math.min(quietest, o); }\n        return String.format(&quot;%s lock: %,d trips through the lock in %d ms; busiest thread %,d, quietest %,d (%.1fx spread)&quot;,\n                fair ? &quot;fair  &quot; : &quot;unfair&quot;, total, millis, busiest, quietest, busiest / (double) quietest);\n    }\n}\n\n// ---- ext: why bound at all -- the back-pressure arithmetic that decides the capacity\n/**\n * An unbounded queue does not remove the mismatch between a fast producer and a slow consumer, it hides it in\n * the heap until the process dies. A bound turns that into the producer waiting, which is the system telling the\n * truth. This prints the arithmetic that picks a capacity.\n */\nfinal class BackPressure {\n    /** What an unbounded queue costs, and what capacity a latency budget implies. */\n    static String arithmetic(int producedPerSecond, int consumedPerSecond, int bytesPerItem, int latencyBudgetMs) {\n        int gap = producedPerSecond - consumedPerSecond;\n        long perHour = (long) gap * 3600;\n        long mbPerHour = perHour * bytesPerItem / (1024 * 1024);\n        int capacityForBudget = Math.max(1, consumedPerSecond * latencyBudgetMs / 1000);\n        return &quot;in &quot; + producedPerSecond + &quot;/s, out &quot; + consumedPerSecond + &quot;/s -&gt; &quot; + gap + &quot; items/s pile up: &quot;\n             + perHour + &quot; items/hour, about &quot; + mbPerHour + &quot; MB/hour, and the process dies overnight.\\n&quot;\n             + &quot;  bounded instead: the producer waits, and the queue&#x27;s depth is the delay. A &quot; + latencyBudgetMs\n             + &quot; ms budget at &quot; + consumedPerSecond + &quot;/s means a capacity of about &quot; + capacityForBudget + &quot;.&quot;;\n    }\n}\n\n// ---- ext: the lost wakeup proper -- a signal sent before the waiter waited, and the one-lock rule that stops it\n/**\n * There are two different bugs people call a lost wakeup. One is a signal spent on a thread that cannot use it\n * (the SyncQueue block above: one monitor, two crowds, notify()). The other is this one, and it is the reason\n * the wait protocol says &quot;check the predicate and wait under the SAME lock&quot;: if you check outside the lock and\n * then take the lock to wait, the state can change and the signal can be sent in the gap between the two, and\n * that signal is gone forever -- notify wakes whoever is waiting NOW, it is not remembered for later.\n * Gate(false) reproduces it exactly; Gate(true) is the same code with the check inside the monitor, and the\n * setter then cannot get in until wait() has released it. One class, both halves, so you can read the diff.\n */\nfinal class LostWakeup {\n    /** A one-shot gate: a waiter waits for ready, a setter sets it. safe = check and wait under one monitor. */\n    static final class Gate {\n        private final boolean safe;\n        private boolean ready;\n        private final CountDownLatch pastTheCheck = new CountDownLatch(1);\n        private final CountDownLatch signalSent = new CountDownLatch(1);\n\n        /** safe = the correct protocol; false = check first, take the lock second, which leaves a gap. */\n        Gate(boolean safe) { this.safe = safe; }\n\n        /** Wait for ready, at most this long. Returns the milliseconds actually spent waiting. */\n        long awaitReady(long millis) throws InterruptedException {\n            long t0 = System.nanoTime();\n            if (safe) {\n                synchronized (this) {\n                    pastTheCheck.countDown();            // the setter is now free to TRY; it still needs the monitor\n                    while (!ready) wait(millis);         // check and wait, both inside the monitor\n                }\n            } else {\n                boolean seen;\n                synchronized (this) { seen = ready; }    // the check...\n                pastTheCheck.countDown();                // ...and here is the gap, holding nothing\n                signalSent.await();                      // the setter runs and signals right here\n                synchronized (this) { if (!seen) wait(millis); }   // ...and only now do we wait: too late\n            }\n            return (System.nanoTime() - t0) / 1_000_000;\n        }\n        /** Set ready and signal, timed to land exactly in the waiter&#x27;s gap. */\n        void makeReady() throws InterruptedException {\n            pastTheCheck.await();\n            synchronized (this) { ready = true; notifyAll(); }\n            signalSent.countDown();\n        }\n    }\n\n    /** Run one gate and return how long the waiter slept: the full timeout means the signal was lost. */\n    static long run(boolean safe, long timeoutMillis) throws InterruptedException {\n        Gate gate = new Gate(safe);\n        Thread setter = new Thread(() -&gt; {\n            try { gate.makeReady(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        setter.start();\n        long waited = gate.awaitReady(timeoutMillis);\n        setter.join(2000);\n        return waited;\n    }\n}\n\n// ---- ext: two semaphores and a mutex -- the same queue with no condition and no while loop\n/**\n * The other way interviewers ask for this. A counting semaphore IS a count of permits, so &quot;wait until there is\n * room&quot; becomes slots.acquire() and &quot;wait until there is an item&quot; becomes items.acquire(): the counting is the\n * predicate, so there is no condition to re-check and no while loop. The mutex only protects the deque itself.\n * What you give up: a consistent snapshot across both counters (size() is a permit count, not a locked read),\n * atomic bulk moves like drainTo, and any policy that wants to look at the queue while it is full. Which is why\n * the lock-plus-two-conditions version is the one to write when the interviewer says &quot;and now drop the oldest&quot;.\n */\nfinal class SemaphoreQueue&lt;T&gt; {\n    private final Semaphore slots, items;\n    private final ReentrantLock mutex = new ReentrantLock();\n    private final ArrayDeque&lt;T&gt; q = new ArrayDeque&lt;&gt;();\n\n    /** A queue of this many items: capacity permits on the slots side, zero on the items side. */\n    SemaphoreQueue(int capacity) {\n        slots = new Semaphore(capacity);\n        items = new Semaphore(0);\n    }\n    /** Take a free slot (waiting if there is none), append, then publish one item. */\n    void put(T item) throws InterruptedException {\n        slots.acquire();\n        mutex.lock();\n        try { q.addLast(item); } finally { mutex.unlock(); }\n        items.release();\n    }\n    /** Take an item (waiting if there is none), remove it, then hand the slot back. */\n    T take() throws InterruptedException {\n        items.acquire();\n        T item;\n        mutex.lock();\n        try { item = q.pollFirst(); } finally { mutex.unlock(); }\n        slots.release();\n        return item;\n    }\n    /** The timed put: tryAcquire either takes the permit or takes nothing, so nothing leaks on a timeout. */\n    boolean offer(T item, long timeout, TimeUnit unit) throws InterruptedException {\n        if (!slots.tryAcquire(timeout, unit)) return false;\n        mutex.lock();\n        try { q.addLast(item); } finally { mutex.unlock(); }\n        items.release();\n        return true;\n    }\n    /** How many items are in it: a permit count, not a locked snapshot. */\n    int size() { return items.availablePermits(); }\n}\n\n// ---- ext: what java.util.concurrent already gives you -- and which one to reach for\n/**\n * Say this out loud in the interview: in production you use java.util.concurrent, and the exercise is to show\n * you know what is inside it. ArrayBlockingQueue IS this class -- one lock, two conditions, a ring, a fairness\n * flag in the constructor. The rest of the family is the same shape with one knob moved, and two of them have a\n * trap: LinkedBlockingQueue&#x27;s no-argument constructor is unbounded, and PriorityBlockingQueue is ALWAYS\n * unbounded, so both put the back-pressure you were asked for straight back into the heap.\n */\nfinal class Jdk {\n    /** Run one tiny example of each and return the lines to print. */\n    static List&lt;String&gt; tour() throws InterruptedException {\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n\n        // ArrayBlockingQueue: the same design as Main.java -- one lock, two conditions, a fixed array\n        BlockingQueue&lt;String&gt; abq = new ArrayBlockingQueue&lt;&gt;(2, /* fair = */ false);\n        abq.put(&quot;a&quot;);\n        boolean second = abq.offer(&quot;b&quot;);\n        boolean third = abq.offer(&quot;c&quot;, 20, TimeUnit.MILLISECONDS);\n        out.add(&quot;ArrayBlockingQueue(2): the second item was accepted (&quot; + second + &quot;) and the third gave up after 20 ms (&quot;\n              + third + &quot;) -- this is our class, in the JDK, fairness flag and all&quot;);\n\n        // LinkedBlockingQueue: ladder rung 2 (two locks). The no-argument constructor is UNBOUNDED: the trap\n        BlockingQueue&lt;String&gt; lbq = new LinkedBlockingQueue&lt;&gt;(2);\n        out.add(&quot;LinkedBlockingQueue(2): two locks, so producers and consumers stop meeting; remaining room &quot;\n              + lbq.remainingCapacity() + &quot;. new LinkedBlockingQueue&lt;&gt;() with no argument is UNBOUNDED&quot;);\n\n        // SynchronousQueue: capacity ZERO. Every put waits for a taker: a hand-off, not a buffer\n        SynchronousQueue&lt;String&gt; sq = new SynchronousQueue&lt;&gt;();\n        out.add(&quot;SynchronousQueue: capacity 0, so offer with no taker returns &quot; + sq.offer(&quot;x&quot;)\n              + &quot; -- it is a hand-off, and it is what a cached thread pool uses&quot;);\n\n        // PriorityBlockingQueue: our HeapStore, except it is unbounded, so put NEVER blocks\n        BlockingQueue&lt;Integer&gt; pbq = new PriorityBlockingQueue&lt;&gt;();\n        pbq.addAll(List.of(5, 1, 9));\n        out.add(&quot;PriorityBlockingQueue: urgent first (&quot; + pbq.take() + &quot; came out first) but it is ALWAYS unbounded: put never blocks&quot;);\n\n        // DelayQueue / LinkedTransferQueue: the two specialist ends of the family\n        out.add(&quot;DelayQueue: an item only becomes takeable at its own time -- scheduled retries. &quot;\n              + &quot;LinkedTransferQueue.transfer() waits until a consumer has actually taken the item&quot;);\n\n        // ThreadPoolExecutor: the bounded queue plus a RejectedExecutionHandler IS OverflowPolicy\n        ThreadPoolExecutor pool = new ThreadPoolExecutor(1, 1, 0, TimeUnit.SECONDS,\n                new ArrayBlockingQueue&lt;&gt;(1), new ThreadPoolExecutor.CallerRunsPolicy());\n        AtomicInteger ran = new AtomicInteger();\n        for (int i = 0; i &lt; 6; i++) pool.execute(ran::incrementAndGet);\n        pool.shutdown();\n        pool.awaitTermination(5, TimeUnit.SECONDS);\n        out.add(&quot;ThreadPoolExecutor(bounded queue + CallerRunsPolicy): all &quot; + ran.get()\n              + &quot; tasks ran, the submitter ran the overflow itself -- a RejectedExecutionHandler IS an OverflowPolicy&quot;);\n        return out;\n    }\n}\n\n// ---- ext: the capacity table from move 8, measured here rather than remembered\n/**\n * The numbers on page 02 move 8 come from this. One producer, one consumer, the same item count at four\n * capacities, after a warm-up pass so the JIT is not being measured. The shape is the lesson: the lock costs\n * tens of nanoseconds and a park costs about two microseconds, so the cost of a small queue is parking, and\n * capacity is the first knob. Absolute numbers move with the machine; the ratios do not.\n */\nfinal class CapacityScan {\n    /** One producer, one consumer, n items through a queue of this capacity. Returns one table row. */\n    static String row(int capacity, int n) throws InterruptedException {\n        BoundedBlockingQueue&lt;Integer&gt; q = new BoundedBlockingQueue&lt;&gt;(capacity);\n        Thread producer = new Thread(() -&gt; {\n            try { for (int i = 0; i &lt; n; i++) q.put(i); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        AtomicLong sum = new AtomicLong();\n        Thread consumer = new Thread(() -&gt; {\n            try { for (int i = 0; i &lt; n; i++) sum.addAndGet(q.take()); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        long t0 = System.nanoTime();\n        producer.start(); consumer.start();\n        producer.join(60_000); consumer.join(60_000);\n        long nsPerItem = (System.nanoTime() - t0) / n;\n        double parksPerItem = q.parkCount() / (double) n;\n        return String.format(&quot;  capacity %5d: %6d ns per item, %,10d parks (%.3f per item)%s&quot;,\n                capacity, nsPerItem, q.parkCount(), parksPerItem,\n                sum.get() == (long) n * (n - 1) / 2 ? &quot;&quot; : &quot;  CHECKSUM FAILED&quot;);\n    }\n    /** put and take on ONE thread, so nothing ever blocks: this is what the lock alone costs. */\n    static String uncontended(int n) throws InterruptedException {\n        BoundedBlockingQueue&lt;Integer&gt; q = new BoundedBlockingQueue&lt;&gt;(64);\n        long t0 = System.nanoTime();\n        for (int i = 0; i &lt; n; i++) { q.put(i); q.take(); }\n        return String.format(&quot;  one thread, alone: %d ns for a put AND a take, %d parks&quot;, (System.nanoTime() - t0) / n, q.parkCount());\n    }\n    /** Warm up, then print the table. */\n    static List&lt;String&gt; table(int n) throws InterruptedException {\n        uncontended(n); row(8, n / 4);                       // warm-up: never measured\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        out.add(uncontended(n));\n        for (int capacity : new int[]{1, 8, 64, 1024}) out.add(row(capacity, n));\n        return out;\n    }\n}\n\n// ---- ext: surviving a restart -- the queue becomes a log, and the head index becomes a committed offset\n/**\n * An in-memory queue loses everything when the process dies. The durable version is the same two cursors with\n * the array replaced by an append-only file: put appends a line and returns only after the write is durable,\n * take reads at the committed offset, and the offset is committed only AFTER the consumer&#x27;s work succeeded.\n * That order is the whole design: a crash between the two replays the last item, so delivery is at-least-once\n * and consumers must be idempotent. Exactly-once needs the work and the offset commit in one transaction.\n * This is a sketch, not a broker: no fsync per record, no segments, no compaction -- that is what Kafka is.\n */\nfinal class DurableLog implements AutoCloseable {\n    private final java.nio.file.Path data, offsetFile;\n    private final java.io.BufferedWriter out;\n    private long committed;\n\n    /** Open (or create) a log and read back the offset the last run committed. */\n    DurableLog(java.nio.file.Path data, java.nio.file.Path offsetFile) throws java.io.IOException {\n        this.data = data;\n        this.offsetFile = offsetFile;\n        this.out = java.nio.file.Files.newBufferedWriter(data, java.nio.file.StandardOpenOption.CREATE,\n                                                         java.nio.file.StandardOpenOption.APPEND);\n        this.committed = java.nio.file.Files.exists(offsetFile)\n            ? Long.parseLong(java.nio.file.Files.readString(offsetFile).trim()) : 0;\n    }\n    /** Append and flush. The item is in the queue only once this returns. */\n    synchronized void append(String item) throws java.io.IOException {\n        out.write(item.replace(&quot;\\n&quot;, &quot; &quot;));\n        out.newLine();\n        out.flush();\n    }\n    /** The next item at the committed offset, or null when the log has been caught up with. */\n    synchronized String peek() throws java.io.IOException {\n        List&lt;String&gt; lines = java.nio.file.Files.readAllLines(data);\n        return committed &lt; lines.size() ? lines.get((int) committed) : null;\n    }\n    /** Move past the item -- called only after the consumer&#x27;s work succeeded, never before. */\n    synchronized void commit() throws java.io.IOException {\n        committed++;\n        java.nio.file.Files.writeString(offsetFile, Long.toString(committed));\n    }\n    /** How far the consumer has got. */\n    synchronized long offset() { return committed; }\n    public void close() throws java.io.IOException { out.close(); }\n}\n\n/** Runs every extension above, so the follow-up answers on page 05 are code that has actually executed. */\nclass ExtDemo {\n    /** Each block prints one line or two: the twist, and the evidence that it works. */\n    public static void main(String[] args) throws Exception {\n        // a new overflow policy: one class, one line, zero queue edits\n        BoundedBlockingQueue&lt;Integer&gt; newest = new BoundedBlockingQueue&lt;&gt;(3);\n        newest.configure(new DropNewest&lt;&gt;(), System::nanoTime);\n        for (int i = 1; i &lt;= 6; i++) newest.put(i);\n        List&lt;Integer&gt; kept = new ArrayList&lt;&gt;();\n        newest.drainTo(kept, 10);\n        System.out.println(&quot;drop-newest kept the first three: &quot; + kept);\n\n        // the decorator: measurement wrapped around the interface, not bolted into the queue\n        MeteredBuffer&lt;String&gt; metered = new MeteredBuffer&lt;&gt;(new BoundedBlockingQueue&lt;&gt;(4));\n        for (int i = 0; i &lt; 4; i++) metered.put(&quot;m&quot; + i);\n        for (int i = 0; i &lt; 4; i++) metered.take();\n        System.out.println(&quot;metered: &quot; + metered.report());\n\n        // priority instead of FIFO: a new Store; the lock, the conditions and the policies are untouched\n        BoundedBlockingQueue&lt;Integer&gt; urgent =\n            new BoundedBlockingQueue&lt;&gt;(new HeapStore&lt;&gt;(8, Comparator.&lt;Integer&gt;naturalOrder()), false);\n        for (int v : new int[]{5, 1, 9, 3}) urgent.put(v);\n        System.out.println(&quot;priority order out: &quot; + urgent.take() + &quot;, &quot; + urgent.take() + &quot;, &quot; + urgent.take() + &quot;, &quot; + urgent.take());\n\n        // bounded by bytes: 300 bytes of budget, items of 100 bytes each\n        ByteBoundedStore&lt;String&gt; byBytes = new ByteBoundedStore&lt;&gt;(300, s -&gt; s.length());\n        BoundedBlockingQueue&lt;String&gt; bytesQ = new BoundedBlockingQueue&lt;&gt;(byBytes, false);\n        bytesQ.configure(new DropOldest&lt;&gt;(), System::nanoTime);\n        for (int i = 0; i &lt; 5; i++) bytesQ.put(&quot;x&quot;.repeat(100));\n        System.out.println(&quot;byte-bounded: &quot; + bytesQ.size() + &quot; items holding &quot; + byBytes.bytes() + &quot; of 300 bytes&quot;);\n\n        // bulk transfer: one lock acquire instead of one per item\n        BoundedBlockingQueue&lt;Integer&gt; bulk = new BoundedBlockingQueue&lt;&gt;(128);\n        for (int i = 0; i &lt; 100; i++) bulk.put(i);\n        List&lt;Integer&gt; batch = new ArrayList&lt;&gt;();\n        int moved = Bulk.drainAtLeastOne(bulk, batch, 64, 50, TimeUnit.MILLISECONDS);\n        System.out.println(&quot;bulk drain moved &quot; + moved + &quot; items in one lock acquire (first=&quot; + batch.get(0) + &quot;)&quot;);\n\n        // ladder rung 2: two locks\n        TwoLockQueue&lt;Integer&gt; two = new TwoLockQueue&lt;&gt;(64);\n        int n = 50_000;\n        Thread tp = new Thread(() -&gt; { try { for (int i = 0; i &lt; n; i++) two.put(i); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } });\n        AtomicLong sum = new AtomicLong();\n        Thread tc = new Thread(() -&gt; { try { for (int i = 0; i &lt; n; i++) sum.addAndGet(two.take()); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } });\n        long t0 = System.nanoTime();\n        tp.start(); tc.start(); tp.join(10_000); tc.join(10_000);\n        System.out.println(&quot;two-lock queue moved &quot; + n + &quot; items in &quot; + (System.nanoTime() - t0) / 1_000_000\n            + &quot; ms, checksum ok=&quot; + (sum.get() == (long) n * (n - 1) / 2));\n\n        // ladder rung 3: no lock, one producer and one consumer\n        SpscRing&lt;Integer&gt; ring = new SpscRing&lt;&gt;(1024);\n        AtomicLong got = new AtomicLong();\n        Thread sp = new Thread(() -&gt; { for (int i = 0; i &lt; n; i++) while (!ring.offer(i)) Thread.onSpinWait(); });\n        Thread sc = new Thread(() -&gt; { for (int i = 0; i &lt; n; i++) { Integer v; while ((v = ring.poll()) == null) Thread.onSpinWait(); got.addAndGet(v); } });\n        t0 = System.nanoTime();\n        sp.start(); sc.start(); sp.join(10_000); sc.join(10_000);\n        System.out.println(&quot;lock-free spsc ring moved &quot; + n + &quot; items in &quot; + (System.nanoTime() - t0) / 1_000_000\n            + &quot; ms, checksum ok=&quot; + (got.get() == (long) n * (n - 1) / 2) + &quot; (the producer SPINS when full)&quot;);\n\n        // the monitor version\n        SyncQueue&lt;Integer&gt; sync = new SyncQueue&lt;&gt;(2);\n        Thread syncProducer = new Thread(() -&gt; { try { for (int i = 0; i &lt; 10; i++) sync.put(i); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } });\n        syncProducer.start();\n        int total = 0;\n        for (int i = 0; i &lt; 10; i++) total += sync.take();\n        syncProducer.join(2000);\n        System.out.println(&quot;synchronized/wait/notifyAll version delivered 10 items, sum=&quot; + total);\n\n        // poison pills\n        BoundedBlockingQueue&lt;Object&gt; pilled = new BoundedBlockingQueue&lt;&gt;(8);\n        ExecutorService pool = Executors.newFixedThreadPool(3);\n        List&lt;Future&lt;Integer&gt;&gt; handled = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 3; i++) handled.add(pool.submit(() -&gt; Pills.consumeUntilPill(pilled)));\n        for (int i = 0; i &lt; 30; i++) pilled.put(i);\n        Pills.shutdown(pilled, 3);\n        int done = 0;\n        for (Future&lt;Integer&gt; f : handled) done += f.get(10, TimeUnit.SECONDS);\n        pool.shutdown();\n        System.out.println(&quot;poison pills: 3 consumers exited on their own after handling &quot; + done + &quot; real items&quot;);\n\n        // fairness: the flag on its own, six threads and a queue big enough that nobody ever blocks\n        Fairness.run(false, 100);                          // warm-up, not printed\n        System.out.println(Fairness.run(false, 200));\n        System.out.println(Fairness.run(true, 200));\n\n        // the lost wakeup proper: the same waiter, once with the check outside the lock and once inside\n        System.out.println(&quot;lost wakeup: checking OUTSIDE the lock then waiting slept the whole &quot;\n            + LostWakeup.run(false, 300) + &quot; ms; checking and waiting under the SAME lock woke in &quot;\n            + LostWakeup.run(true, 300) + &quot; ms&quot;);\n\n        // the same queue built out of two semaphores instead of a lock and two conditions\n        SemaphoreQueue&lt;Integer&gt; sem = new SemaphoreQueue&lt;&gt;(2);\n        Thread semProducer = new Thread(() -&gt; { try { for (int i = 1; i &lt;= 5; i++) sem.put(i); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } });\n        semProducer.start();\n        StringBuilder semOut = new StringBuilder();\n        for (int i = 0; i &lt; 5; i++) semOut.append(sem.take()).append(&#x27; &#x27;);\n        semProducer.join(2000);\n        System.out.println(&quot;semaphore queue (capacity 2) delivered in order: &quot; + semOut.toString().trim()\n            + &quot; -- no condition, no while loop: the permit count IS the predicate&quot;);\n\n        // what java.util.concurrent already gives you\n        for (String line : Jdk.tour()) System.out.println(&quot;jdk | &quot; + line);\n\n        // the capacity table behind move 8, measured rather than remembered\n        System.out.println(&quot;capacity scan, one producer and one consumer, 200,000 items each time:&quot;);\n        for (String line : CapacityScan.table(200_000)) System.out.println(line);\n\n        // surviving a restart: append, hand over, commit the offset only after the work succeeded\n        java.nio.file.Path dir = java.nio.file.Files.createTempDirectory(&quot;bbq&quot;);\n        try (DurableLog log = new DurableLog(dir.resolve(&quot;data.log&quot;), dir.resolve(&quot;offset&quot;))) {\n            log.append(&quot;job-1&quot;); log.append(&quot;job-2&quot;);\n            String job = log.peek();\n            log.commit();                                  // only now: the work above succeeded\n            System.out.println(&quot;durable log: handled &quot; + job + &quot;, next is &quot; + log.peek() + &quot;, committed offset &quot; + log.offset());\n        }\n\n        // why bound at all\n        System.out.println(&quot;back-pressure: &quot; + BackPressure.arithmetic(1000, 800, 200, 50));\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n/**\n * Targeted failure tests: each one proves a claim the design makes on page 02, move 9. Every wait in this file\n * has a deadline, so a bug shows up as a FAIL, never as a hung build; the watchdog kills the run at 50 seconds.\n */\npublic class FailureTests {\n    static int failures = 0;\n\n    /** Print one line per claim and remember whether it held. */\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what);\n        if (!ok) failures++;\n    }\n\n    /** A blocking-queue test suite that hangs is a failed test suite: this daemon ends the run if one does. */\n    static void watchdog(long seconds) {\n        Thread t = new Thread(() -&gt; {\n            try { Thread.sleep(seconds * 1000); } catch (InterruptedException e) { return; }\n            System.out.println(&quot;FAIL watchdog: the tests did not finish in &quot; + seconds + &quot; s (a lost wakeup or a deadlock)&quot;);\n            Runtime.getRuntime().halt(2);\n        });\n        t.setDaemon(true);\n        t.start();\n    }\n\n    public static void main(String[] args) throws Exception {\n        watchdog(50);\n\n        // 1. FIFO: what one producer puts in, one consumer takes out in the same order, with the queue\n        //    blocking in both directions along the way (capacity 8 against 2000 items).\n        BoundedBlockingQueue&lt;Integer&gt; fifo = new BoundedBlockingQueue&lt;&gt;(8);\n        List&lt;Integer&gt; out = new ArrayList&lt;&gt;();\n        Thread producer = new Thread(() -&gt; {\n            try { for (int i = 0; i &lt; 2000; i++) fifo.put(i); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        Thread consumer = new Thread(() -&gt; {\n            try { for (int i = 0; i &lt; 2000; i++) out.add(fifo.take()); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        producer.start(); consumer.start();\n        producer.join(10_000); consumer.join(10_000);\n        boolean ordered = out.size() == 2000;\n        for (int i = 0; ordered &amp;&amp; i &lt; 2000; i++) ordered = out.get(i) == i;\n        check(ordered, &quot;2000 items came out in exactly the order they went in (FIFO)&quot;);\n        check(fifo.size() == 0 &amp;&amp; fifo.parkCount() &gt; 0, &quot;the queue is empty at the end, and it really blocked on the way (&quot; + fifo.parkCount() + &quot; parks)&quot;);\n\n        // 2. the race: 10 producers and 10 consumers, 100000 items. Nothing lost, nothing delivered twice,\n        //    and the bound held at every instant.\n        final int PRODUCERS = 10, CONSUMERS = 10, PER = 10_000, TOTAL = PRODUCERS * PER, CAP = 32;\n        BoundedBlockingQueue&lt;Integer&gt; q = new BoundedBlockingQueue&lt;&gt;(CAP);\n        PeakMeter meter = new PeakMeter();\n        q.addObserver(meter);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        List&lt;List&lt;Integer&gt;&gt; got = new ArrayList&lt;&gt;();\n        for (int p = 0; p &lt; PRODUCERS; p++) {\n            final int id = p;\n            threads.add(new Thread(() -&gt; {\n                try { go.await(); for (int i = 0; i &lt; PER; i++) q.put(id * PER + i); }\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            }));\n        }\n        for (int c = 0; c &lt; CONSUMERS; c++) {\n            List&lt;Integer&gt; mine = new ArrayList&lt;&gt;();\n            got.add(mine);\n            threads.add(new Thread(() -&gt; {\n                try { go.await(); Integer item; while ((item = q.take()) != null) mine.add(item); }\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            }));\n        }\n        threads.forEach(Thread::start);\n        go.countDown();\n        for (int i = 0; i &lt; PRODUCERS; i++) threads.get(i).join(30_000);\n        q.close();\n        for (int i = PRODUCERS; i &lt; threads.size(); i++) threads.get(i).join(30_000);\n        boolean[] seen = new boolean[TOTAL];\n        int delivered = 0, duplicates = 0, lost = 0;\n        for (List&lt;Integer&gt; list : got) for (int v : list) { delivered++; if (seen[v]) duplicates++; seen[v] = true; }\n        for (boolean b : seen) if (!b) lost++;\n        check(delivered == TOTAL &amp;&amp; lost == 0, TOTAL + &quot; items across 20 threads: every one delivered (&quot; + delivered + &quot;, lost &quot; + lost + &quot;)&quot;);\n        check(duplicates == 0, &quot;and not one of them twice&quot;);\n        check(meter.peak() &lt;= CAP &amp;&amp; q.size() == 0, &quot;0 &lt;= size &lt;= capacity held throughout: peak was &quot; + meter.peak() + &quot; of &quot; + CAP);\n\n        // 3. full means the producer SLEEPS, and a take is what wakes it. If put spun instead, the latch\n        //    would fire immediately; if the signal were lost, it would never fire.\n        BoundedBlockingQueue&lt;String&gt; small = new BoundedBlockingQueue&lt;&gt;(2);\n        small.put(&quot;a&quot;); small.put(&quot;b&quot;);\n        CountDownLatch putDone = new CountDownLatch(1);\n        Thread blocked = new Thread(() -&gt; {\n            try { small.put(&quot;c&quot;); putDone.countDown(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        blocked.start();\n        check(!putDone.await(200, TimeUnit.MILLISECONDS), &quot;a put into a full queue is still waiting 200 ms later&quot;);\n        check(small.parkCount() &gt;= 1 &amp;&amp; small.size() == 2, &quot;it parked instead of spinning, and wrote nothing while it waited&quot;);\n        small.take();\n        check(putDone.await(3, TimeUnit.SECONDS), &quot;the take woke it, and the put completed&quot;);\n        blocked.join(3_000);\n\n        // 4. empty means the consumer sleeps; an interrupt must wake it with InterruptedException, and the\n        //    queue must still work afterwards -- which is what the unlock-in-a-finally buys.\n        BoundedBlockingQueue&lt;String&gt; idle = new BoundedBlockingQueue&lt;&gt;(2);\n        AtomicBoolean interrupted = new AtomicBoolean();\n        Thread waiter = new Thread(() -&gt; {\n            try { idle.take(); } catch (InterruptedException e) { interrupted.set(true); }\n        });\n        waiter.start();\n        Thread.sleep(100);\n        waiter.interrupt();\n        waiter.join(3_000);\n        check(interrupted.get() &amp;&amp; !waiter.isAlive(), &quot;an interrupt woke the parked consumer with InterruptedException&quot;);\n        idle.put(&quot;still works&quot;);\n        check(&quot;still works&quot;.equals(idle.poll(2, TimeUnit.SECONDS)), &quot;and the queue is untouched: the lock was released, nothing half-written&quot;);\n\n        // 5. the timed calls give up on time, write nothing, and take their deadline from the injected clock.\n        BoundedBlockingQueue&lt;String&gt; timed = new BoundedBlockingQueue&lt;&gt;(1);\n        long t0 = System.nanoTime();\n        String none = timed.poll(150, TimeUnit.MILLISECONDS);\n        long waitedMs = (System.nanoTime() - t0) / 1_000_000;\n        check(none == null &amp;&amp; waitedMs &gt;= 140, &quot;poll on an empty queue returned null after waiting the full 150 ms (&quot; + waitedMs + &quot; ms)&quot;);\n        timed.put(&quot;one&quot;);\n        check(!timed.offer(&quot;two&quot;, 100, TimeUnit.MILLISECONDS) &amp;&amp; timed.size() == 1, &quot;offer into a full queue gave up and wrote nothing&quot;);\n        AtomicLong fake = new AtomicLong();\n        timed.configure(new BlockUntilRoom&lt;&gt;(), () -&gt; fake.addAndGet(1_000_000_000L));  // every reading is a second later\n        timed.take();\n        t0 = System.nanoTime();\n        String expired = timed.poll(200, TimeUnit.MILLISECONDS);\n        long elapsedMs = (System.nanoTime() - t0) / 1_000_000;\n        check(expired == null &amp;&amp; elapsedMs &lt; 50, &quot;with an injected clock already past the deadline, poll gave up at once (&quot; + elapsedMs + &quot; ms)&quot;);\n\n        // 6. capacity 1 and a stress loop: every round must finish, or a signal was lost. This is the test\n        //    that catches `if` instead of `while`, and a signal on the wrong condition.\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        boolean allRounds = true;\n        long roundsStart = System.nanoTime();\n        for (int round = 0; round &lt; 200 &amp;&amp; allRounds; round++) {\n            BoundedBlockingQueue&lt;Integer&gt; tiny = new BoundedBlockingQueue&lt;&gt;(1);\n            List&lt;Future&lt;?&gt;&gt; tasks = new ArrayList&lt;&gt;();\n            for (int p = 0; p &lt; 2; p++) tasks.add(pool.submit(() -&gt; { for (int i = 0; i &lt; 25; i++) tiny.put(i); return null; }));\n            AtomicInteger taken = new AtomicInteger();\n            for (int c = 0; c &lt; 2; c++) tasks.add(pool.submit(() -&gt; { for (int i = 0; i &lt; 25; i++) { tiny.take(); taken.incrementAndGet(); } return null; }));\n            try { for (Future&lt;?&gt; f : tasks) f.get(5, TimeUnit.SECONDS); }\n            catch (TimeoutException e) { allRounds = false; }\n            if (taken.get() != 50) allRounds = false;\n        }\n        pool.shutdownNow();\n        check(allRounds, &quot;200 rounds of 4 threads over a capacity-1 queue all finished (&quot;\n            + (System.nanoTime() - roundsStart) / 1_000_000 + &quot; ms): no wakeup was lost&quot;);\n\n        // 7. a listener that throws must not break a put, and swapping what &quot;full&quot; means must not touch the queue.\n        BoundedBlockingQueue&lt;Integer&gt; observed = new BoundedBlockingQueue&lt;&gt;(3);\n        AtomicInteger heard = new AtomicInteger();\n        observed.addObserver((what, size) -&gt; { heard.incrementAndGet(); throw new RuntimeException(&quot;the dashboard is down&quot;); });\n        observed.configure(new DropOldest&lt;&gt;(), System::nanoTime);\n        for (int i = 1; i &lt;= 6; i++) observed.put(i);\n        List&lt;Integer&gt; kept = new ArrayList&lt;&gt;();\n        observed.drainTo(kept, 10);\n        check(heard.get() &gt;= 6, &quot;a broken listener was called and threw, and every put still completed&quot;);\n        check(kept.equals(List.of(4, 5, 6)) &amp;&amp; observed.parkCount() == 0, &quot;drop-oldest kept the freshest three &quot; + kept + &quot; and never blocked a producer&quot;);\n\n        // 8. close() wakes everyone: no thread is left parked, put is refused, and what was already in the\n        //    queue is still handed out before the end-of-stream null.\n        BoundedBlockingQueue&lt;String&gt; closing = new BoundedBlockingQueue&lt;&gt;(4);\n        CountDownLatch woke = new CountDownLatch(3);\n        for (int i = 0; i &lt; 3; i++) {\n            new Thread(() -&gt; {\n                try { if (closing.take() == null) woke.countDown(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            }).start();\n        }\n        Thread.sleep(100);\n        closing.close();\n        check(woke.await(3, TimeUnit.SECONDS), &quot;close() woke all three parked consumers with end-of-stream&quot;);\n        boolean refused = false;\n        try { closing.put(&quot;late&quot;); } catch (IllegalStateException e) { refused = true; }\n        check(refused, &quot;a put after close is refused instead of being silently dropped&quot;);\n        BoundedBlockingQueue&lt;String&gt; draining = new BoundedBlockingQueue&lt;&gt;(4);\n        draining.put(&quot;x&quot;); draining.put(&quot;y&quot;);\n        draining.close();\n        check(&quot;x&quot;.equals(draining.take()) &amp;&amp; &quot;y&quot;.equals(draining.take()) &amp;&amp; draining.take() == null,\n              &quot;a closed queue hands out what it already had, then returns null&quot;);\n\n        // 9. the lost wakeup proper: a signal sent while nobody is waiting is gone, it is not remembered.\n        //    Checking the flag OUTSIDE the lock and then taking the lock to wait leaves exactly that gap.\n        long slept = LostWakeup.run(false, 300);\n        check(slept &gt;= 250, &quot;checking outside the lock missed the signal and slept the whole 300 ms (&quot; + slept + &quot; ms)&quot;);\n        long wokeAtOnce = LostWakeup.run(true, 300);\n        check(wokeAtOnce &lt; 100, &quot;the same code with the check INSIDE the lock cannot miss it: woke in &quot; + wokeAtOnce + &quot; ms&quot;);\n\n        // 10. the two alternatives agree with us: two semaphores, and the JDK&#x27;s own ArrayBlockingQueue.\n        //     If our queue were subtly wrong, this is where the orders would stop matching.\n        SemaphoreQueue&lt;Integer&gt; sem = new SemaphoreQueue&lt;&gt;(2);\n        Thread semFeeder = new Thread(() -&gt; {\n            try { for (int i = 0; i &lt; 500; i++) sem.put(i); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        semFeeder.start();\n        boolean semOrdered = true;\n        for (int i = 0; i &lt; 500; i++) semOrdered &amp;= sem.take() == i;\n        semFeeder.join(5_000);\n        check(semOrdered, &quot;the two-semaphore version delivers the same 500 items in the same FIFO order&quot;);\n        BlockingQueue&lt;Integer&gt; jdk = new ArrayBlockingQueue&lt;&gt;(2);\n        BoundedBlockingQueue&lt;Integer&gt; ours = new BoundedBlockingQueue&lt;&gt;(2);\n        boolean same = true;\n        for (int i = 0; i &lt; 500; i++) {\n            jdk.put(i); ours.put(i);\n            same &amp;= jdk.take().equals(ours.take());\n            same &amp;= jdk.offer(i, 5, TimeUnit.MILLISECONDS) == ours.offer(i, 5, TimeUnit.MILLISECONDS);\n            same &amp;= jdk.take().equals(ours.take());\n        }\n        check(same, &quot;our queue and java.util.concurrent&#x27;s ArrayBlockingQueue answer identically over 500 rounds&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Write me a bounded blocking queue. Fixed capacity, many producer threads, many consumer threads. <code>put</code> blocks when it is full, <code>take</code> blocks when it is empty, nothing is lost and nothing is delivered twice. I want working code, not a diagram. Go.\"</div>Before typing, write your six clarifying questions (what happens on full, and how many threads per side, first); then type in the order of Main.java: the <code>Clock</code> and <code>BlockingBuffer</code> interfaces, the <code>Store</code> interface and <code>RingBuffer</code> with no locks in it at all, <code>OverflowPolicy</code> with the blocking implementation, the observer, then <code>BoundedBlockingQueue</code> &mdash; the lock, the two conditions, and <code>put</code> with its order &mdash; then <code>take</code> as its mirror, then the timed pair, then <code>drainTo</code> and <code>close</code>, then a main that starts eight threads on one latch and counts what came out.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; Mid-round: this queue feeds a live metrics panel, so a producer must never stall. If it is full, throw away the stalest reading.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing in the queue changes. What happens on full was already a rule handed in, so this is one new class whose <code>onFull</code> evicts the head and returns true, plus one line at construction. It never waits, so a producer is never parked: the demo puts seven items into a capacity-3 queue and the park counter stays at zero while the queue holds the last three. The family is open &mdash; drop the newest instead, or refuse loudly with an exception &mdash; and each is another small class rather than another branch inside <code>put</code>. The one thing to say out loud is that the policy runs with the lock already held, so it may evict, but it may only wait on the queue's own condition.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Never stall the producer: throw the stalest item away and keep the freshest N. A live metrics panel wants this. */\nfinal class DropOldest&lt;T&gt; implements OverflowPolicy&lt;T&gt; {\n    /** Evict the head to make room, then tell put to enqueue. Never waits, so a producer is never blocked. */\n    public boolean onFull(BoundedBlockingQueue&lt;T&gt; queue, T item) {\n        queue.evictOldest();\n        return true;\n    }\n}\n\n// ---- ext: a new answer to &quot;what does full mean&quot; -- drop the NEWEST instead of the oldest. One class, one line.\n/**\n * Keep the oldest N and refuse the newcomer, which is what a &quot;first N wins&quot; sampler wants. The queue is not\n * touched at all: this is the whole edit, plus the line that hands it in.\n */\nfinal class DropNewest&lt;T&gt; implements OverflowPolicy&lt;T&gt; {\n    /** Silently swallow the item and tell put not to enqueue it. Never waits, so a producer never stalls. */\n    public boolean onFull(BoundedBlockingQueue&lt;T&gt; queue, T item) { return false; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Ten producers and ten consumers, a hundred thousand items. Prove nothing is lost and nothing is delivered twice.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading the count and acting on it, and the fix is that the whole read-modify-write happens under one lock. The proof is a count, not an argument: twenty threads wait on one latch, ten of them put ten thousand distinct integers each, ten of them take until the queue is closed and drained, and the test then marks every integer it saw. A lost item leaves a hole, a doubled item trips the duplicate counter, and an overfilled queue shows up in the observer's peak, which is checked against the capacity. All three are asserted, and every join has a thirty-second deadline so a deadlock fails the test instead of hanging the build.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 2. the race: 10 producers and 10 consumers, 100000 items. Nothing lost, nothing delivered twice,\n        //    and the bound held at every instant.\n        final int PRODUCERS = 10, CONSUMERS = 10, PER = 10_000, TOTAL = PRODUCERS * PER, CAP = 32;\n        BoundedBlockingQueue&lt;Integer&gt; q = new BoundedBlockingQueue&lt;&gt;(CAP);\n        PeakMeter meter = new PeakMeter();\n        q.addObserver(meter);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        List&lt;List&lt;Integer&gt;&gt; got = new ArrayList&lt;&gt;();\n        for (int p = 0; p &lt; PRODUCERS; p++) {\n            final int id = p;\n            threads.add(new Thread(() -&gt; {\n                try { go.await(); for (int i = 0; i &lt; PER; i++) q.put(id * PER + i); }\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            }));\n        }\n        for (int c = 0; c &lt; CONSUMERS; c++) {\n            List&lt;Integer&gt; mine = new ArrayList&lt;&gt;();\n            got.add(mine);\n            threads.add(new Thread(() -&gt; {\n                try { go.await(); Integer item; while ((item = q.take()) != null) mine.add(item); }\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            }));\n        }\n        threads.forEach(Thread::start);\n        go.countDown();\n        for (int i = 0; i &lt; PRODUCERS; i++) threads.get(i).join(30_000);\n        q.close();\n        for (int i = PRODUCERS; i &lt; threads.size(); i++) threads.get(i).join(30_000);\n        boolean[] seen = new boolean[TOTAL];\n        int delivered = 0, duplicates = 0, lost = 0;\n        for (List&lt;Integer&gt; list : got) for (int v : list) { delivered++; if (seen[v]) duplicates++; seen[v] = true; }\n        for (boolean b : seen) if (!b) lost++;\n        check(delivered == TOTAL &amp;&amp; lost == 0, TOTAL + &quot; items across 20 threads: every one delivered (&quot; + delivered + &quot;, lost &quot; + lost + &quot;)&quot;);\n        check(duplicates == 0, &quot;and not one of them twice&quot;);\n        check(meter.peak() &lt;= CAP &amp;&amp; q.size() == 0, &quot;0 &lt;= size &lt;= capacity held throughout: peak was &quot; + meter.peak() + &quot; of &quot; + CAP);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>3 &middot; Why is the wait a while loop and not an if? Show me what breaks.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Because a wakeup is not a promise. Two things can happen between the signal and this thread actually running: another producer can take the slot that was just freed (a signal steal), and the JVM is allowed to return from <code>await</code> for no reason at all (a spurious wakeup). With an <code>if</code>, the thread carries on and writes into a full ring, which either overwrites an item or throws. With a <code>while</code>, it re-tests and goes back to sleep, which costs one extra check. The state machine on page 02 move 6 is the picture of it: the arrow from \"woken\" goes back to \"check\", never forward to \"write\". The test that catches the <code>if</code> version is the stress loop: two hundred rounds of four threads over a capacity-1 queue, where any stale check corrupts the count and any lost wakeup hangs the round past its deadline.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Pull the oldest item out, waiting while the queue is empty. Returns null only when the queue was closed\n     * and has been drained, which is the end-of-stream signal for a consumer loop.\n     */\n    public T take() throws InterruptedException {\n        T item;\n        int sizeAfter;\n        lock.lockInterruptibly();\n        try {\n            try {\n                while (store.isEmpty() &amp;&amp; !closed) { parks.incrementAndGet(); notEmpty.await(); }\n            } catch (InterruptedException e) {\n                notEmpty.signal();      // we may have eaten a signal meant for another consumer: pass it on\n                throw e;\n            }\n            if (store.isEmpty()) return null;   // closed and drained\n            item = store.poll();\n            sizeAfter = store.size();\n            notFull.signal();           // one slot freed, so exactly one producer can proceed\n        } finally {\n            lock.unlock();\n        }\n        publish(&quot;take&quot;, sizeAfter);\n        return item;\n    }\n\n        // 6. capacity 1 and a stress loop: every round must finish, or a signal was lost. This is the test\n        //    that catches `if` instead of `while`, and a signal on the wrong condition.\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        boolean allRounds = true;\n        long roundsStart = System.nanoTime();\n        for (int round = 0; round &lt; 200 &amp;&amp; allRounds; round++) {\n            BoundedBlockingQueue&lt;Integer&gt; tiny = new BoundedBlockingQueue&lt;&gt;(1);\n            List&lt;Future&lt;?&gt;&gt; tasks = new ArrayList&lt;&gt;();\n            for (int p = 0; p &lt; 2; p++) tasks.add(pool.submit(() -&gt; { for (int i = 0; i &lt; 25; i++) tiny.put(i); return null; }));\n            AtomicInteger taken = new AtomicInteger();\n            for (int c = 0; c &lt; 2; c++) tasks.add(pool.submit(() -&gt; { for (int i = 0; i &lt; 25; i++) { tiny.take(); taken.incrementAndGet(); } return null; }));\n            try { for (Future&lt;?&gt; f : tasks) f.get(5, TimeUnit.SECONDS); }\n            catch (TimeoutException e) { allRounds = false; }\n            if (taken.get() != 50) allRounds = false;\n        }\n        pool.shutdownNow();\n        check(allRounds, &quot;200 rounds of 4 threads over a capacity-1 queue all finished (&quot;\n            + (System.nanoTime() - roundsStart) / 1_000_000 + &quot; ms): no wakeup was lost&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>4 &middot; Why two conditions and not one? And why signal rather than signalAll?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>With one condition there is one waiting crowd, so a wakeup cannot be aimed: a put that frees nothing for producers can still wake a producer, that producer re-checks, finds the queue full and goes back to sleep, and the wakeup is spent. With one monitor you are forced into <code>notifyAll</code>, which wakes everybody so that the one thread that can make progress is definitely among them &mdash; correct, and a thundering herd. Two conditions let a put wake a consumer and a take wake a producer, so <code>signal</code> is enough: each operation changes availability by exactly one, so exactly one waiter can use it. The two places that still need <code>signalAll</code> are the ones where the change concerns everyone: <code>close()</code>, and <code>drainTo</code>, which frees many slots at once and therefore signals once per slot freed.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Move up to max items into a sink under ONE lock acquire instead of max of them. The first rung of the\n     * scaling ladder: it does not make the lock shorter, it makes it happen far less often.\n     */\n    public int drainTo(Collection&lt;? super T&gt; sink, int max) {\n        int moved = 0, sizeAfter;\n        lock.lock();\n        try {\n            while (moved &lt; max &amp;&amp; !store.isEmpty()) { sink.add(store.poll()); moved++; }\n            for (int i = 0; i &lt; moved; i++) notFull.signal();  // one wake per slot freed: one signal would leave the rest asleep\n            sizeAfter = store.size();\n        } finally {\n            lock.unlock();\n        }\n        if (moved &gt; 0) publish(&quot;drain&quot;, sizeAfter);\n        return moved;\n    }\n\n// ---- ext: the synchronized / wait / notify version, and the lost wakeup that comes free with it\n/**\n * The same queue with one monitor instead of a lock and two conditions. It is correct ONLY with notifyAll:\n * with a single monitor there is one waiting crowd, so notify() may hand the wakeup to a producer when the\n * thread that could make progress was a consumer. That thread goes straight back to sleep, the signal is spent,\n * and everybody hangs -- the classic lost wakeup. notifyAll is the fix and the thundering herd is its price,\n * which is the whole argument for a ReentrantLock with two conditions.\n */\nfinal class SyncQueue&lt;T&gt; {\n    private final ArrayDeque&lt;T&gt; items = new ArrayDeque&lt;&gt;();\n    private final int capacity;\n\n    /** A monitor-based bounded queue of this many items. */\n    SyncQueue(int capacity) { this.capacity = capacity; }\n\n    /** while, not if: a wakeup only means &quot;look again&quot;, never &quot;the slot is yours&quot;. */\n    synchronized void put(T item) throws InterruptedException {\n        while (items.size() == capacity) wait();\n        items.addLast(item);\n        notifyAll();        // NOT notify(): one monitor, two crowds, and no way to aim\n    }\n    /** Mirror of put. */\n    synchronized T take() throws InterruptedException {\n        while (items.isEmpty()) wait();\n        T item = items.pollFirst();\n        notifyAll();\n        return item;\n    }\n    /** Size, read under the same monitor. */\n    synchronized int size() { return items.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>5 &middot; You keep saying &quot;lost wakeup&quot;. What exactly is lost, and why can it not happen here?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two different bugs go by that name. The first is the one in the monitor version above: the signal is spent on a thread that cannot use it, and everyone goes back to sleep. The second is the real one, and it is what the wait protocol is for. A signal is not stored anywhere: <code>signal</code> wakes whoever is waiting at that instant, and if nobody is waiting it does nothing at all. So if you check the condition, release the lock, and only then go and wait, the state can change in that gap and the signal can be sent while you are not yet waiting &mdash; and it is gone. This design cannot do that, because the check and the <code>await</code> are both inside the lock, and the thread that would change the state needs that same lock to change it. The reference code has both halves so you can read the diff, and test 9 measures them: the version that checks outside the lock sleeps the whole 300 ms, the version that checks inside wakes in 0 ms.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the lost wakeup proper -- a signal sent before the waiter waited, and the one-lock rule that stops it\n/**\n * There are two different bugs people call a lost wakeup. One is a signal spent on a thread that cannot use it\n * (the SyncQueue block above: one monitor, two crowds, notify()). The other is this one, and it is the reason\n * the wait protocol says &quot;check the predicate and wait under the SAME lock&quot;: if you check outside the lock and\n * then take the lock to wait, the state can change and the signal can be sent in the gap between the two, and\n * that signal is gone forever -- notify wakes whoever is waiting NOW, it is not remembered for later.\n * Gate(false) reproduces it exactly; Gate(true) is the same code with the check inside the monitor, and the\n * setter then cannot get in until wait() has released it. One class, both halves, so you can read the diff.\n */\nfinal class LostWakeup {\n    /** A one-shot gate: a waiter waits for ready, a setter sets it. safe = check and wait under one monitor. */\n    static final class Gate {\n        private final boolean safe;\n        private boolean ready;\n        private final CountDownLatch pastTheCheck = new CountDownLatch(1);\n        private final CountDownLatch signalSent = new CountDownLatch(1);\n\n        /** safe = the correct protocol; false = check first, take the lock second, which leaves a gap. */\n        Gate(boolean safe) { this.safe = safe; }\n\n        /** Wait for ready, at most this long. Returns the milliseconds actually spent waiting. */\n        long awaitReady(long millis) throws InterruptedException {\n            long t0 = System.nanoTime();\n            if (safe) {\n                synchronized (this) {\n                    pastTheCheck.countDown();            // the setter is now free to TRY; it still needs the monitor\n                    while (!ready) wait(millis);         // check and wait, both inside the monitor\n                }\n            } else {\n                boolean seen;\n                synchronized (this) { seen = ready; }    // the check...\n                pastTheCheck.countDown();                // ...and here is the gap, holding nothing\n                signalSent.await();                      // the setter runs and signals right here\n                synchronized (this) { if (!seen) wait(millis); }   // ...and only now do we wait: too late\n            }\n            return (System.nanoTime() - t0) / 1_000_000;\n        }\n        /** Set ready and signal, timed to land exactly in the waiter&#x27;s gap. */\n        void makeReady() throws InterruptedException {\n            pastTheCheck.await();\n            synchronized (this) { ready = true; notifyAll(); }\n            signalSent.countDown();\n        }\n    }\n\n    /** Run one gate and return how long the waiter slept: the full timeout means the signal was lost. */\n    static long run(boolean safe, long timeoutMillis) throws InterruptedException {\n        Gate gate = new Gate(safe);\n        Thread setter = new Thread(() -&gt; {\n            try { gate.makeReady(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        setter.start();\n        long waited = gate.awaitReady(timeoutMillis);\n        setter.join(2000);\n        return waited;\n    }\n}\n\n        // 9. the lost wakeup proper: a signal sent while nobody is waiting is gone, it is not remembered.\n        //    Checking the flag OUTSIDE the lock and then taking the lock to wait leaves exactly that gap.\n        long slept = LostWakeup.run(false, 300);\n        check(slept &gt;= 250, &quot;checking outside the lock missed the signal and slept the whole 300 ms (&quot; + slept + &quot; ms)&quot;);\n        long wokeAtOnce = LostWakeup.run(true, 300);\n        check(wokeAtOnce &lt; 100, &quot;the same code with the check INSIDE the lock cannot miss it: woke in &quot; + wokeAtOnce + &quot; ms&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>6 &middot; Where is volatile in all this? Why is the closed flag a plain boolean?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Because a lock does two jobs, and people only remember one. It keeps threads out of each other's way, and it also publishes memory: everything a thread wrote before it released the lock is visible to the next thread that acquires it. <code>closed</code>, the array, the head, the tail and the count are only ever written and read with the lock held, so they need nothing else &mdash; adding <code>volatile</code> to them would be noise, not safety. Two fields are different and show the rule by contrast. <code>parks</code> is an <code>AtomicLong</code> because <code>parkCount()</code> deliberately reads it without taking the lock, so a test can look while threads are running. And in the lock-free ring on page 05 there is no lock at all, so the two cursors have to be <code>volatile</code>: writing the cursor is what publishes the slot the producer just filled, and reading it is what makes that write visible. The rule to say out loud: either the state is under one lock, or every field it is reached through is volatile or atomic. Never half of each.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">private final Store&lt;T&gt; store;\n    private final ReentrantLock lock;\n    private final Condition notFull;   // producers park here; a take signals it\n    private final Condition notEmpty;  // consumers park here; a put signals it\n    private OverflowPolicy&lt;T&gt; onFull = new BlockUntilRoom&lt;&gt;();\n    private Clock clock = System::nanoTime;\n    private final List&lt;QueueObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n    private final AtomicLong parks = new AtomicLong();\n    private boolean closed;            // written and read under the lock only\n\n/**\n     * Stop the queue: no new work in, and every parked thread wakes up to find out. signalAll, not signal,\n     * because this is the one change that concerns every waiter on both sides at once.\n     */\n    public void close() {\n        int sizeAfter;\n        lock.lock();\n        try {\n            if (closed) return;\n            closed = true;\n            sizeAfter = store.size();\n            notFull.signalAll();\n            notEmpty.signalAll();\n        } finally {\n            lock.unlock();\n        }\n        publish(&quot;close&quot;, sizeAfter);\n    }\n\n/** A consistent snapshot of the size: read under the lock, so it is never seen half-updated. */\n    public int size() { lock.lock(); try { return store.size(); } finally { lock.unlock(); } }\n    /** The bound. Fixed at construction. */\n    public int capacity() { lock.lock(); try { return store.capacity(); } finally { lock.unlock(); } }\n    /** How much room is left right now. */\n    public int remainingCapacity() { lock.lock(); try { return store.capacity() - store.size(); } finally { lock.unlock(); } }\n    /** True once close() has run. */\n    public boolean isClosed() { lock.lock(); try { return closed; } finally { lock.unlock(); } }\n    /** How many times a caller actually went to sleep. Zero here means nothing ever blocked; it is never a spin count. */\n    public long parkCount() { return parks.get(); }\n\n/**\n * A single-producer single-consumer ring. Each cursor is written by exactly one thread and read by both, so a\n * volatile write and a volatile read are all the ordering needed: no lock, no CAS, no parking. The price is the\n * contract (exactly one thread on each side) and the fact that offer returning false is back-pressure the CALLER\n * must now handle -- spin, yield, park -- which is precisely what the blocking queue was doing for you.\n * In production this is where you also pad the cursors onto their own cache lines to stop false sharing.\n */\nfinal class SpscRing&lt;T&gt; {\n    private final Object[] slots;\n    private final int mask;\n    private volatile long writeAt, readAt;\n\n    /** Capacity must be a power of two so the wrap is a bit mask instead of a division. */\n    SpscRing(int capacity) {\n        if (Integer.bitCount(capacity) != 1) throw new IllegalArgumentException(&quot;capacity must be a power of two&quot;);\n        slots = new Object[capacity];\n        mask = capacity - 1;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>7 &middot; A consumer is blocked on an empty queue and the service is shutting down. How does the caller cancel it?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>By interrupting the thread. Both <code>put</code> and <code>take</code> acquire the lock with <code>lockInterruptibly</code> and wait with <code>await</code>, so a parked thread wakes with an <code>InterruptedException</code> rather than sitting there forever. Three details make it safe rather than merely possible. The unlock is in a <code>finally</code>, so the lock is released on the way out and the queue is still usable &mdash; the test interrupts a parked consumer and then does a normal put and poll to prove it. The catch signals the same condition before rethrowing, because this thread may have been the one a signal was spent on; without that line the wakeup dies with the cancelled thread and a peer sleeps forever. And the queue throws the exception rather than handling it, which is the right half of the rule; the other half is for the caller, and interviewers ask it: a catch block either rethrows, or it restores the flag with <code>Thread.currentThread().interrupt()</code> before it returns, because the flag was cleared when the exception was thrown and the next blocking call up the stack needs to see it. Swallowing it silently is the bug &mdash; every consumer loop in <code>main</code> restores it. If a caller genuinely must not be cancellable, the opposite pair exists: plain <code>lock()</code> and <code>awaitUninterruptibly()</code>, which is almost never what you want in a queue.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Called by the blocking policy, with the lock held: wait until there is room or the queue closes. */\n    void awaitRoom() throws InterruptedException {\n        requireLocked();\n        try {\n            while (store.isFull() &amp;&amp; !closed) { parks.incrementAndGet(); notFull.await(); }\n        } catch (InterruptedException e) {\n            notFull.signal();   // a signal may have been meant for us and spent on us: hand it to another producer\n            throw e;\n        }\n    }\n\n        // 4. empty means the consumer sleeps; an interrupt must wake it with InterruptedException, and the\n        //    queue must still work afterwards -- which is what the unlock-in-a-finally buys.\n        BoundedBlockingQueue&lt;String&gt; idle = new BoundedBlockingQueue&lt;&gt;(2);\n        AtomicBoolean interrupted = new AtomicBoolean();\n        Thread waiter = new Thread(() -&gt; {\n            try { idle.take(); } catch (InterruptedException e) { interrupted.set(true); }\n        });\n        waiter.start();\n        Thread.sleep(100);\n        waiter.interrupt();\n        waiter.join(3_000);\n        check(interrupted.get() &amp;&amp; !waiter.isAlive(), &quot;an interrupt woke the parked consumer with InterruptedException&quot;);\n        idle.put(&quot;still works&quot;);\n        check(&quot;still works&quot;.equals(idle.poll(2, TimeUnit.SECONDS)), &quot;and the queue is untouched: the lock was released, nothing half-written&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>8 &middot; Timed offer and poll: where does the deadline come from, and how do you test one without waiting for it?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The deadline is computed once, from an injected clock, and the remaining budget is recomputed on every wake: <code>awaitNanos</code> is given what is left, so a spurious wakeup shortens the wait instead of restarting it. That is the bug the naive version has &mdash; passing the full timeout again each time round the loop, so a thread woken ten times waits ten timeouts. Because the clock is handed in, a test can supply one whose every reading is a second later than the last: the deadline is already in the past on the first check, and <code>poll</code> returns null in under a millisecond, which is asserted. The real parking still uses the operating system's timer, so what the fake clock proves is the arithmetic, not the sleep.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Pull an item out, waiting at most this long. Returns null when the budget ran out, or when closed and drained. */\n    public T poll(long timeout, TimeUnit unit) throws InterruptedException {\n        long deadline = clock.nanoTime() + unit.toNanos(timeout);\n        T item;\n        int sizeAfter;\n        lock.lockInterruptibly();\n        try {\n            while (store.isEmpty()) {\n                if (closed) return null;\n                long left = deadline - clock.nanoTime();\n                if (left &lt;= 0) return null;\n                try { parks.incrementAndGet(); notEmpty.awaitNanos(left); }\n                catch (InterruptedException e) { notEmpty.signal(); throw e; }\n            }\n            item = store.poll();\n            sizeAfter = store.size();\n            notFull.signal();\n        } finally {\n            lock.unlock();\n        }\n        publish(&quot;poll&quot;, sizeAfter);\n        return item;\n    }\n\n        // 5. the timed calls give up on time, write nothing, and take their deadline from the injecte

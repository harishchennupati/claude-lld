ode>drainTo(sink, 64)</code>, which is one lock acquire per batch instead of per item and costs nothing to add. Two: two locks &mdash; a linked list has two ends, so producers take a put lock, consumers take a take lock, and the only shared word is an atomic count; that is what <code>LinkedBlockingQueue</code> does, and it moved 50,000 items in about 13 milliseconds here. Three: a lock-free ring with two volatile cursors, 50,000 items in 2 milliseconds &mdash; and it gives up the one thing you were asked for, because a full ring now returns false and back-pressure becomes the caller's problem.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 352\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">if instead of while around await</text></g><path d=\"M360 37 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 18)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">re-test in a loop, always; test 6 &mdash; 200 rounds of four threads over a capacity-1 queue</text></g><g transform=\"translate(30 60)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">checking the flag outside the lock</text></g><path d=\"M360 79 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 60)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check and wait under the SAME lock, so no signal can land in the gap; test 9</text></g><g transform=\"translate(30 102)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">notify() on one monitor, or no signal</text></g><path d=\"M360 121 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 102)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two conditions, and signal the matching one after every change; tests 1, 3 and 6</text></g><g transform=\"translate(30 144)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">unlock outside a finally</text></g><path d=\"M360 163 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 144)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">unlock in a finally, always; test 4 &mdash; after an interrupt the queue still works</text></g><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an interrupt eats a signal meant for a peer</text></g><path d=\"M360 205 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 186)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">re-signal that condition before rethrowing; test 4</text></g><g transform=\"translate(30 228)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the dashboard is called inside the lock</text></g><path d=\"M360 247 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 228)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish after the unlock, in a try/catch; test 7</text></g><g transform=\"translate(30 270)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a shutdown leaves threads parked forever</text></g><path d=\"M360 289 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 270)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">close() sets a flag the wait loops already read, then signalAll on both; test 8</text></g><text x=\"615\" y=\"338\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">twenty-three checks in FailureTests.java, every wait with a deadline and a fifty-second watchdog: a queue test that hangs is a failed queue test</text></svg></div><div class=\"move\"><p>An <code>if</code> instead of a <code>while</code> around the wait, so a stolen or spurious wakeup lets a thread act on a condition that is no longer true. One monitor with <code>notify()</code>, which hands the wakeup to whichever crowd it likes and can spend it on a thread that cannot use it. A signal forgotten after a change, or sent to the wrong condition, which leaves a thread asleep forever. An unlock outside a <code>finally</code>, so one exception wedges every thread in the process. An interrupt landing on a thread that had already been signalled, quietly swallowing that signal. A listener called inside the lock, or throwing. And a shutdown that never wakes the parked. Each of those is a few lines in FailureTests.java, and every wait in that file has a deadline with a watchdog behind it, because a concurrency test that hangs has told you nothing.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 388\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"850\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Monitor object</text><text x=\"220\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">one ReentrantLock + two Conditions, private to the queue</text><text x=\"850\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">state can only be touched through a method that locks</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">interface OverflowPolicy { boolean onFull(q, item); }</text><text x=\"850\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">block / drop / reject is a class, not a branch</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Strategy again</text><text x=\"220\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">interface Store { add / poll / isFull / size }</text><text x=\"850\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">FIFO &rarr; priority &rarr; bytes, lock untouched</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">MeteredBuffer implements BlockingBuffer, wraps one</text><text x=\"850\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">measurement without opening the queue</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">publish(...) after the unlock, inside a try/catch</text><text x=\"850\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">a dashboard can never slow a handoff</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"220\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">the while loop IS the state machine of a put</text><text x=\"850\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">a wake goes back to the check, never to the write</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">Producer-Consumer</text><text x=\"220\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">every move</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">put / take across threads, with a bound</text><text x=\"850\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">the pattern this object IS; say the name</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"220\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">the queue is handed to both sides; nothing calls getInstance()</text><text x=\"850\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh queue per case</text><rect x=\"20\" y=\"290\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"220\" y=\"309.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">new BoundedBlockingQueue&lt;&gt;(64) is one line</text><text x=\"850\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when they come from config</text><rect x=\"20\" y=\"320\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"220\" y=\"339.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"310\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">a capacity and a store: two arguments</text><text x=\"850\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">a builder here would be pure ceremony</text><text x=\"615\" y=\"372\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>Read the table, then say the two things it cannot. First, name the shape of the whole object out loud: private state, one lock, and the only way in is a method that takes it, is a <b>monitor object</b> &mdash; and the object itself <i>is</i> <b>Producer-Consumer</b>, which interviewers notice when you skip it. Second, be willing to say a pattern is not here: Singleton earned nothing, Factory earns its name the day capacity, policy and store arrive as strings from configuration, and Builder never does with two constructor arguments. Every other row is a move that already happened, which is why none of them was chosen before the code existed.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"450\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"550\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"450\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"550\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">RingBuffer stores. The queue synchronises. A policy decides what full means.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"450\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"550\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">DropNewest is a new file plus one line at construction</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"450\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"550\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">policy.onFull(this, item);  store.add(item);  never \"which one is it?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"450\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"550\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">OverflowPolicy, Clock, QueueObserver, Weigher &mdash; a lambda implements each</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; be handed the rest</text><text x=\"450\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"550\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">configure(policy, clock): a test hands in a clock already past the deadline</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>The table is the answer; here is what it is for. On a threading problem the S line is the one that pays: because storage, synchronisation and the full-policy are three types and not one, the ring buffer can be unit-tested on a single thread with no threading at all, and only the queue needs the awkward multi-thread tests. And the D line is what makes the timed calls testable: the clock is handed in through <code>configure</code>, so a test can supply one whose deadline has already passed and watch <code>poll</code> give up without waiting a single millisecond.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">never block: drop, or refuse</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind OverflowPolicy plus one line at construction</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">queue depth on a dashboard</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer, called after the unlock in a try/catch</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">shut down cleanly</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a closed flag the wait loops already read, then signalAll on both</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across items</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">bound by bytes, not by count</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new Store whose isFull() counts bytes; the lock does not change</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 3 + 5</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">survive a restart</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the array becomes an append-only log; head becomes a committed offset</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">commit the offset only AFTER the work succeeded: at-least-once, idempotent consumers</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the lock, the two conditions and the wait loops are untouched; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (\"never block, this feeds a live panel\") is a new class behind <code>OverflowPolicy</code> plus one line. Someone new who wants to know (queue depth on a dashboard, a log line per drop) is one more observer, called after the unlock. A new step in a life (shut it down; drain, then end-of-stream) is a flag the wait loops already read plus <code>signalAll</code> on both conditions, because that is the one change that concerns every waiter at once. A new invariant across items (bound it by bytes, not by count) is a new <code>Store</code> whose <code>isFull</code> counts bytes; the lock and the conditions do not move. And state that must outlive the process is the same two cursors with the array replaced by an append-only log: <code>head</code> becomes a committed offset, and the order becomes append first, hand the item over second, commit the offset only after the work succeeded &mdash; which is at-least-once delivery and is why the consumer must be idempotent. That last one is not a trick: it is what a message broker is. For all five, the lock, the two conditions and the wait loops are untouched.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 806\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M700 307 V90\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M720 137 H700\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M720 222 H700\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M720 307 H700\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M700 90L845 90L845 74\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M845.0 520L845.0 476\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M990 435.0L970 433.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M990 545.0L975 537L975 445L970 433.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M490.0 190L490.0 154\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M260 65.0L310 87.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1110 110L1110 92L690 92L670 87\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M670 355L695 355L695 433L720 433\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M720 47L690 47L690 230L670 230\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"845\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">handed in through configure()</text><path d=\"M260 525.0L280 525L280 430L310 430\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M310 330L285 330L285 337L260 337.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><path d=\"M135.0 394L135.0 364\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M260 155.0L292 155L292 250L310 250\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M260 245.0L300 245L300 290L310 290\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><g transform=\"translate(310 640)\"><rect width=\"360\" height=\"74\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-dasharray=\"5 3\"/><text x=\"180.0\" y=\"22\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--acc)\">notFull &mdash; producers asleep</text><rect x=\"18\" y=\"34\" width=\"46\" height=\"22\" rx=\"11\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"41\" y=\"49\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">P2</text><rect x=\"74\" y=\"34\" width=\"46\" height=\"22\" rx=\"11\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"97\" y=\"49\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">P5</text><text x=\"140\" y=\"49\" font-size=\"10.5\" fill=\"var(--muted)\">await() gave the lock back</text></g><g transform=\"translate(700 640)\"><rect width=\"360\" height=\"74\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-dasharray=\"5 3\"/><text x=\"180.0\" y=\"22\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--acc)\">notEmpty &mdash; consumers asleep</text><rect x=\"18\" y=\"34\" width=\"46\" height=\"22\" rx=\"11\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"41\" y=\"49\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">C1</text><rect x=\"74\" y=\"34\" width=\"46\" height=\"22\" rx=\"11\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"97\" y=\"49\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">C3</text><rect x=\"130\" y=\"34\" width=\"46\" height=\"22\" rx=\"11\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"153\" y=\"49\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">C4</text><text x=\"196\" y=\"49\" font-size=\"10.5\" fill=\"var(--muted)\">signal() wakes one</text></g><path d=\"M490 536L490 640\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M600 536L600 625L880 625L880 640\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"730\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">these two are not classes: they are the queues of parked threads that the lock itself keeps, reached only through await() and signal()</text><text x=\"615\" y=\"748\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every box tagged \"in Extensions.java\" is follow-up code, not part of the hour: MeteredBuffer, TwoLockQueue, HeapStore, ByteBoundedStore. Everything else is Main.java</text><g transform=\"translate(10 20)\"><rect width=\"250\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">MeteredBuffer</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">in Extensions.java</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">inner: BlockingBuffer&lt;T&gt;</text><line x1=\"0\" y1=\"64\" x2=\"250\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">put / take: times, delegates</text></g><g transform=\"translate(10 120)\"><rect width=\"250\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Producer thread</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">q.put(item)</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">q.offer(item, 50, MILLIS)</text></g><g transform=\"translate(10 210)\"><rect width=\"250\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" "47\" font-size=\"11.5\" fill=\"var(--text)\">nanoTime(): long</text></g><g transform=\"translate(310 20)\"><rect width=\"360\" height=\"134\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"180.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"180.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">BlockingBuffer&lt;T&gt;</text><line x1=\"0\" y1=\"34\" x2=\"360\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">put(item)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">take(): T</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--text)\">offer(item, timeout, unit)</text><text x=\"8\" y=\"95\" font-size=\"11.5\" fill=\"var(--text)\">poll(timeout, unit): T</text><text x=\"8\" y=\"111\" font-size=\"11.5\" fill=\"var(--text)\">size(): int</text><text x=\"8\" y=\"127\" font-size=\"11.5\" fill=\"var(--text)\">capacity(): int</text></g><g transform=\"translate(310 190)\"><rect width=\"360\" height=\"346\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"180.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">BoundedBlockingQueue&lt;T&gt;</text><line x1=\"0\" y1=\"26\" x2=\"360\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">store: Store&lt;T&gt;</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">lock: ReentrantLock</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">notFull: Condition</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">notEmpty: Condition</text><text x=\"8\" y=\"103\" font-size=\"11.5\" fill=\"var(--muted)\">onFull: OverflowPolicy&lt;T&gt;</text><text x=\"8\" y=\"119\" font-size=\"11.5\" fill=\"var(--muted)\">clock: Clock</text><text x=\"8\" y=\"135\" font-size=\"11.5\" fill=\"var(--muted)\">observers: List&lt;QueueObserver&gt;</text><text x=\"8\" y=\"151\" font-size=\"11.5\" fill=\"var(--muted)\">closed: boolean</text><line x1=\"0\" y1=\"160\" x2=\"360\" y2=\"160\" stroke=\"var(--line)\"/><text x=\"8\" y=\"173\" font-size=\"11.5\" fill=\"var(--text)\">put(item) / take()</text><text x=\"8\" y=\"189\" font-size=\"11.5\" fill=\"var(--text)\">offer(...) / poll(...)</text><text x=\"8\" y=\"205\" font-size=\"11.5\" fill=\"var(--text)\">drainTo(sink, max): int</text><text x=\"8\" y=\"221\" font-size=\"11.5\" fill=\"var(--text)\">close() / isClosed()</text><text x=\"8\" y=\"237\" font-size=\"11.5\" fill=\"var(--text)\">size() / capacity() / remainingCapacity()</text><text x=\"8\" y=\"253\" font-size=\"11.5\" fill=\"var(--text)\">parkCount(): long</text><text x=\"8\" y=\"269\" font-size=\"11.5\" fill=\"var(--text)\">configure(policy, clock)</text><text x=\"8\" y=\"285\" font-size=\"11.5\" fill=\"var(--text)\">addObserver(o)</text><text x=\"8\" y=\"301\" font-size=\"11.5\" fill=\"var(--text)\">awaitRoom()  [lock held]</text><text x=\"8\" y=\"317\" font-size=\"11.5\" fill=\"var(--text)\">evictOldest()  [lock held]</text><text x=\"8\" y=\"333\" font-size=\"11.5\" fill=\"var(--text)\">publish(what, size)  [after unlock]</text></g><g transform=\"translate(720 20)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">OverflowPolicy&lt;T&gt;</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">onFull(queue, item): boolean</text></g><g transform=\"translate(720 110)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">BlockUntilRoom</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">awaits notFull, then enqueue</text></g><g transform=\"translate(720 195)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DropOldest</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">evicts the head, then enqueue</text></g><g transform=\"translate(720 280)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RejectWhenFull</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">throws IllegalStateException</text></g><g transform=\"translate(720 390)\"><rect width=\"250\" height=\"86\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Store&lt;T&gt;</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">add(item) / poll(): T</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">isFull() / isEmpty()</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--text)\">size() / capacity()</text></g><g transform=\"translate(720 520)\"><rect width=\"250\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RingBuffer</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">slots: Object[]</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">head, tail, count: int</text><line x1=\"0\" y1=\"64\" x2=\"250\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">O(1), nothing allocated</text></g><g transform=\"translate(990 110)\"><rect width=\"240\" height=\"106\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">TwoLockQueue</text><line x1=\"0\" y1=\"26\" x2=\"240\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">in Extensions.java</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">putLock / takeLock</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">count: AtomicInteger</text><line x1=\"0\" y1=\"80\" x2=\"240\" y2=\"80\" stroke=\"var(--line)\"/><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">page 05: ladder rung 2</text></g><g transform=\"translate(990 390)\"><rect width=\"240\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">HeapStore</text><line x1=\"0\" y1=\"26\" x2=\"240\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">in Extensions.java</text><line x1=\"0\" y1=\"48\" x2=\"240\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">a bounded binary heap</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">priority instead of FIFO</text></g><g transform=\"translate(990 500)\"><rect width=\"240\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ByteBoundedStore</text><line x1=\"0\" y1=\"26\" x2=\"240\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">in Extensions.java</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">weigher: Weigher&lt;T&gt;</text><line x1=\"0\" y1=\"64\" x2=\"240\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">full = the byte budget</text></g><g><path d=\"M20 780L64 780\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"784\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 780L284 780\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"784\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 780L504 780\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"784\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 780L684 780\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"784\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 780L904 780\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"784\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the type name (dashed border = interface). Middle: its fields, the state it holds; a box whose first line reads <i>in Extensions.java</i> is follow-up code, not something you type in the hour. Bottom: its methods; <code>[lock held]</code> marks the two package-private hooks a policy is allowed to call, and <code>[after unlock]</code> marks the one that must not run inside it. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the queue owns its store, its lock and both conditions, and they die with it. Dashed green = handed in through <code>configure()</code> or the constructor. Dotted blue = notifies. <b>Where state lives:</b> every mutable field in this design is inside <code>BoundedBlockingQueue</code> or inside the <code>Store</code> it owns, and both are reachable only under the one lock &mdash; that is the whole safety argument, and it is why a policy is handed the queue rather than the array. Notice what is <i>not</i> a class: the producer and the consumer are threads, not objects; and the two waiting rooms at the bottom are queues of parked threads that the lock maintains for each <code>Condition</code>, which is why \"who is waiting?\" needs no data structure of ours.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does and what it guarantees; read only those first for the shape, then the bodies. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (twenty-three checks, every wait on a deadline; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * Where time comes from. Injected, never read from the wall clock inside a method, so a test can push a\n * deadline into the past and watch a timed call give up without actually waiting for it.\n */\ninterface Clock { long nanoTime(); }\n\n/**\n * The promise a producer and a consumer depend on: hand an item in, pull an item out, and two timed\n * versions for callers that cannot wait forever. put and take can block, so both declare InterruptedException.\n */\ninterface BlockingBuffer&lt;T&gt; {\n    /** Hand an item in. Blocks (or drops, or throws) when the buffer is full: that is the overflow policy&#x27;s call. */\n    void put(T item) throws InterruptedException;\n    /** Pull the oldest item out. Blocks while the buffer is empty. Returns null only when the queue is closed and drained. */\n    T take() throws InterruptedException;\n    /** Hand an item in, waiting at most this long for room. Returns false if the budget ran out; nothing is written then. */\n    boolean offer(T item, long timeout, TimeUnit unit) throws InterruptedException;\n    /** Pull an item out, waiting at most this long for one. Returns null if the budget ran out (or the queue is closed and drained). */\n    T poll(long timeout, TimeUnit unit) throws InterruptedException;\n    /** How many items are in the buffer right now, read as one consistent snapshot. */\n    int size();\n    /** The bound this buffer was built with. It never changes. */\n    int capacity();\n}\n\n/**\n * Storage, and nothing else: no locks, no waiting, no opinions about what &quot;full&quot; means. One job, so it can be\n * tested on one thread. Swapping this is how FIFO becomes priority or count-bounded becomes byte-bounded.\n */\ninterface Store&lt;T&gt; {\n    /** Put an item at the tail. The caller must have checked isFull() first; a full store throws rather than overwrite. */\n    void add(T item);\n    /** Remove and return the head item. The caller must have checked isEmpty() first. */\n    T poll();\n    /** True when there is no room for another item, in whatever unit this store counts in. */\n    boolean isFull();\n    /** True when there is nothing to hand out. */\n    boolean isEmpty();\n    /** How many items are held right now. */\n    int size();\n    /** The declared bound: items for the ring buffer, bytes for a byte-bounded store. */\n    int capacity();\n}\n\n/**\n * A fixed array with two cursors. head is the next item to hand out, tail the next free slot; both advance\n * modulo the array length, so the queue rides a moving window over the array with no shifting and no allocation\n * per item. count is what tells full (count == capacity) from empty (count == 0), which head and tail alone cannot.\n */\nfinal class RingBuffer&lt;T&gt; implements Store&lt;T&gt; {\n    private final Object[] slots;\n    private int head, tail, count;\n\n    /** A ring of exactly this many slots. Capacity is fixed here and never changes: that is the bound. */\n    RingBuffer(int capacity) {\n        if (capacity &lt;= 0) throw new IllegalArgumentException(&quot;capacity must be &gt; 0, got &quot; + capacity);\n        slots = new Object[capacity];\n    }\n    /** Append at the tail and wrap. Throws if full, so a policy that lies about having made room is caught here. */\n    public void add(T item) {\n        if (count == slots.length) throw new IllegalStateException(&quot;ring is full: &quot; + count);\n        slots[tail] = item;\n        tail = (tail + 1) % slots.length;\n        count++;\n    }\n    /** Remove the head, wrap, and null the slot so the array does not pin a dead object. */\n    @SuppressWarnings(&quot;unchecked&quot;)\n    public T poll() {\n        if (count == 0) throw new IllegalStateException(&quot;ring is empty&quot;);\n        T item = (T) slots[head];\n        slots[head] = null;\n        head = (head + 1) % slots.length;\n        count--;\n        return item;\n    }\n    public boolean isFull() { return count == slots.length; }\n    public boolean isEmpty() { return count == 0; }\n    public int size() { return count; }\n    public int capacity() { return slots.length; }\n}\n\n/**\n * What &quot;full&quot; means, as one method. Called by put with the lock already held and the store already full.\n * Return true if the caller should now enqueue (room exists), false if this policy consumed or dropped the item.\n * A policy may wait, but only on the queue&#x27;s own not-full condition, which releases the lock while it waits.\n */\ninterface OverflowPolicy&lt;T&gt; {\n    /** Decide what happens to this item when there is no room. Return true to enqueue it after all. */\n    boolean onFull(BoundedBlockingQueue&lt;T&gt; queue, T item) throws InterruptedException;\n}\n\n/** The default: make the producer wait until a consumer frees a slot. This is what &quot;blocking queue&quot; means. */\nfinal class BlockUntilRoom&lt;T&gt; implements OverflowPolicy&lt;T&gt; {\n    /** Park on not-full until there is room (or the queue closes), then tell put to enqueue. */\n    public boolean onFull(BoundedBlockingQueue&lt;T&gt; queue, T item) throws InterruptedException {\n        queue.awaitRoom();\n        return true;\n    }\n}\n\n/** Never stall the producer: throw the stalest item away and keep the freshest N. A live metrics panel wants this. */\nfinal class DropOldest&lt;T&gt; implements OverflowPolicy&lt;T&gt; {\n    /** Evict the head to make room, then tell put to enqueue. Never waits, so a producer is never blocked. */\n    public boolean onFull(BoundedBlockingQueue&lt;T&gt; queue, T item) {\n        queue.evictOldest();\n        return true;\n    }\n}\n\n/** Never stall and never lose silently: refuse the item loudly and let the caller decide. */\nfinal class RejectWhenFull&lt;T&gt; implements OverflowPolicy&lt;T&gt; {\n    /** Always throws. The caller sees the back-pressure as an exception instead of as a pause. */\n    public boolean onFull(BoundedBlockingQueue&lt;T&gt; queue, T item) {\n        throw new IllegalStateException(&quot;queue is full (&quot; + queue.capacity() + &quot;)&quot;);\n    }\n}\n\n/** Somebody who wants to know what the queue did, without the queue knowing what a dashboard is. */\ninterface QueueObserver {\n    /** Called after the lock is released, with what happened and the size right after it happened. */\n    void onEvent(String what, int size);\n}\n\n/**\n * The proof that the bound holds: it remembers the largest size it ever saw. If this ever exceeds capacity,\n * an item was enqueued into a full queue. Used by the demo and by FailureTests.\n */\nfinal class PeakMeter implements QueueObserver {\n    private final AtomicInteger peak = new AtomicInteger();\n    private final AtomicLong events = new AtomicLong();\n    /** Record the size, keeping the maximum. Cheap, lock-free, and called outside the queue&#x27;s lock. */\n    public void onEvent(String what, int size) {\n        events.incrementAndGet();\n        peak.accumulateAndGet(size, Math::max);\n    }\n    /** The largest size ever observed. */\n    public int peak() { return peak.get(); }\n    /** How many events were seen. */\n    public long events() { return events.get(); }\n}\n\n/**\n * The whole point of the exercise: a queue with a fixed capacity where a producer waits when it is full and a\n * consumer waits when it is empty, with no spinning. One lock guards the store and both cursors; two conditions\n * keep the two waiting crowds apart, so a put wakes a consumer and a take wakes a producer, never the wrong one.\n * The invariant, always true outside the lock: the size is never negative and never past the capacity, the order is\n * FIFO, and every item is delivered exactly once.\n */\nfinal class BoundedBlockingQueue&lt;T&gt; implements BlockingBuffer&lt;T&gt; {\n    private final Store&lt;T&gt; store;\n    private final ReentrantLock lock;\n    private final Condition notFull;   // producers park here; a take signals it\n    private final Condition notEmpty;  // consumers park here; a put signals it\n    private OverflowPolicy&lt;T&gt; onFull = new BlockUntilRoom&lt;&gt;();\n    private Clock clock = System::nanoTime;\n    private final List&lt;QueueObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n    private final AtomicLong parks = new AtomicLong();\n    private boolean closed;            // written and read under the lock only\n\n    /** A queue of this many items, with a non-fair lock (throughput first) and the blocking policy. */\n    BoundedBlockingQueue(int capacity) { this(new RingBuffer&lt;&gt;(capacity), false); }\n\n    /**\n     * The full constructor: any store, and fair = true to hand the lock out in arrival order. Fairness costs\n     * throughput and is only worth it when one starved waiter is a real problem.\n     */\n    BoundedBlockingQueue(Store&lt;T&gt; store, boolean fair) {\n        this.store = Objects.requireNonNull(store);\n        this.lock = new ReentrantLock(fair);\n        this.notFull = lock.newCondition();\n        this.notEmpty = lock.newCondition();\n    }\n\n    /** Hand in the rules. The queue never builds them, so a test can hand in a broken one on purpose. */\n    void configure(OverflowPolicy&lt;T&gt; policy, Clock clock) {\n        this.onFull = Objects.requireNonNull(policy);\n        this.clock = Objects.requireNonNull(clock);\n    }\n    /** Add a listener. It is called after the lock is released, never inside it. */\n    void addObserver(QueueObserver observer) { observers.add(observer); }\n\n    /**\n     * Hand an item in. Full means the policy decides: block (default), drop the oldest, or throw.\n     * The order is the design: change the store first, signal second, unlock third, tell the world fourth.\n     */\n    public void put(T item) throws InterruptedException {\n        Objects.requireNonNull(item, &quot;null is not an item: poll returns null to mean empty&quot;);\n        int sizeAfter;\n        lock.lockInterruptibly();\n        try {\n            if (closed) throw new IllegalStateException(&quot;queue is closed&quot;);\n            if (store.isFull() &amp;&amp; !onFull.onFull(this, item)) return;  // the policy dropped or rejected it\n            if (closed) throw new IllegalStateException(&quot;queue was closed while waiting for room&quot;);\n            store.add(item);            // 1. the state changes\n            sizeAfter = store.size();\n            notEmpty.signal();          // 2. exactly one consumer is woken: one item arrived, one waiter can use it\n        } finally {\n            lock.unlock();              // 3. in a finally, so a throw cannot leave the lock held\n        }\n        publish(&quot;put&quot;, sizeAfter);      // 4. listeners, outside the lock, where they cannot slow anybody down\n    }\n\n    /**\n     * Pull the oldest item out, waiting while the queue is empty. Returns null only when the queue was closed\n     * and has been drained, which is the end-of-stream signal for a consumer loop.\n     */\n    public T take() throws InterruptedException {\n        T item;\n        int sizeAfter;\n        lock.lockInterruptibly();\n        try {\n            try {\n                while (store.isEmpty() &amp;&amp; !closed) { parks.incrementAndGet(); notEmpty.await(); }\n            } catch (InterruptedException e) {\n                notEmpty.signal();      // we may have eaten a signal meant for another consumer: pass it on\n                throw e;\n            }\n            if (store.isEmpty()) return null;   // closed and drained\n            item = store.poll();\n            sizeAfter = store.size();\n            notFull.signal();           // one slot freed, so exactly one producer can proceed\n        } finally {\n            lock.unlock();\n        }\n        publish(&quot;take&quot;, sizeAfter);\n        return item;\n    }\n\n    /**\n     * Hand an item in, waiting at most this long for room, then giving up and returning false.\n     * The deadline is computed once from the injected clock and the remaining budget is recomputed on every\n     * wake, so a spurious wakeup shortens the wait instead of restarting it.\n     */\n    public boolean offer(T item, long timeout, TimeUnit unit) throws InterruptedException {\n        Objects.requireNonNull(item, &quot;null is not an item&quot;);\n        long deadline = clock.nanoTime() + unit.toNanos(timeout);\n        int sizeAfter;\n        lock.lockInterruptibly();\n        try {\n            if (closed) throw new IllegalStateException(&quot;queue is closed&quot;);\n            while (store.isFull()) {                       // offer answers &quot;what if full&quot; itself: it waits, then gives up\n                long left = deadline - clock.nanoTime();\n                if (left &lt;= 0) return false;               // budget spent; nothing was written\n                try { parks.incrementAndGet(); notFull.awaitNanos(left); }\n                catch (InterruptedException e) { notFull.signal(); throw e; }\n                if (closed) throw new IllegalStateException(&quot;queue was closed while waiting for room&quot;);\n            }\n            store.add(item);\n            sizeAfter = store.size();\n            notEmpty.signal();\n        } finally {\n            lock.unlock();\n        }\n        publish(&quot;offer&quot;, sizeAfter);\n        return true;\n    }\n\n    /** Pull an item out, waiting at most this long. Returns null when the budget ran out, or when closed and drained. */\n    public T poll(long timeout, TimeUnit unit) throws InterruptedException {\n        long deadline = clock.nanoTime() + unit.toNanos(timeout);\n        T item;\n        int sizeAfter;\n        lock.lockInterruptibly();\n        try {\n            while (store.isEmpty()) {\n                if (closed) return null;\n                long left = deadline - clock.nanoTime();\n                if (left &lt;= 0) return null;\n                try { parks.incrementAndGet(); notEmpty.awaitNanos(left); }\n                catch (InterruptedException e) { notEmpty.signal(); throw e; }\n            }\n            item = store.poll();\n            sizeAfter = store.size();\n            notFull.signal();\n        } finally {\n            lock.unlock();\n        }\n        publish(&quot;poll&quot;, sizeAfter);\n        return item;\n    }\n\n    /**\n     * Move up to max items into a sink under ONE lock acquire instead of max of them. The first rung of the\n     * scaling ladder: it does not make the lock shorter, it makes it happen far less often.\n     */\n    public int drainTo(Collection&lt;? super T&gt; sink, int max) {\n        int moved = 0, sizeAfter;\n        lock.lock();\n        try {\n            while (moved &lt; max &amp;&amp; !store.isEmpty()) { sink.add(store.poll()); moved++; }\n            for (int i = 0; i &lt; moved; i++) notFull.signal();  // one wake per slot freed: one signal would leave the rest asleep\n            sizeAfter = store.size();\n        } finally {\n            lock.unlock();\n        }\n        if (moved &gt; 0) publish(&quot;drain&quot;, sizeAfter);\n        return moved;\n    }\n\n    /**\n     * Stop the queue: no new work in, and every parked thread wakes up to find out. signalAll, not signal,\n     * because this is the one change that concerns every waiter on both sides at once.\n     */\n    public void close() {\n        int sizeAfter;\n        lock.lock();\n        try {\n            if (closed) return;\n            closed = true;\n            sizeAfter = store.size();\n            notFull.signalAll();\n            notEmpty.signalAll();\n        } finally {\n            lock.unlock();\n        }\n        publish(&quot;close&quot;, sizeAfter);\n    }\n\n    /** Called by the blocking policy, with the lock held: wait until there is room or the queue closes. */\n    void awaitRoom() throws InterruptedException {\n        requireLocked();\n        try {\n            while (store.isFull() &amp;&amp; !closed) { parks.incrementAndGet(); notFull.await(); }\n        } catch (InterruptedException e) {\n            notFull.signal();   // a signal may have been meant for us and spent on us: hand it to another producer\n            throw e;\n        }\n    }\n\n    /** Called by the drop-oldest policy, with the lock held: throw away the stalest item to make room. */\n    void evictOldest() {\n        requireLocked();\n        if (!store.isEmpty()) store.poll();\n    }\n\n    /** Guard for the two package-private hooks above: a policy that forgets the lock corrupts the store. */\n    private void requireLocked() {\n        if (!lock.isHeldByCurrentThread()) throw new IllegalStateException(&quot;the queue&#x27;s lock must be held here&quot;);\n    }\n\n    /** A consistent snapshot of the size: read under the lock, so it is never seen half-updated. */\n    public int size() { lock.lock(); try { return store.size(); } finally { lock.unlock(); } }\n    /** The bound. Fixed at construction. */\n    public int capacity() { lock.lock(); try { return store.capacity(); } finally { lock.unlock(); } }\n    /** How much room is left right now. */\n    public int remainingCapacity() { lock.lock(); try { return store.capacity() - store.size(); } finally { lock.unlock(); } }\n    /** True once close() has run. */\n    public boolean isClosed() { lock.lock(); try { return closed; } finally { lock.unlock(); } }\n    /** How many times a caller actually went to sleep. Zero here means nothing ever blocked; it is never a spin count. */\n    public long parkCount() { return parks.get(); }\n\n    /** Tell the listeners, outside the lock, and never let a broken one break the queue. */\n    private void publish(String what, int size) {\n        for (QueueObserver o : observers) {\n            try { o.onEvent(what, size); } catch (RuntimeException ignored) { /* a broken meter is not the queue&#x27;s problem */ }\n        }\n    }\n}\n\n/** A demo that proves the two claims: a full queue really parks a producer, and nothing is lost under load. */\npublic class Main {\n    /** Runs the four demos in order; the last one is the race that the whole design exists for. */\n    public static void main(String[] args) throws Exception {\n        blockingIsReal();\n        timedCallsGiveUp();\n        fullIsAPolicy();\n        theRace();\n    }\n\n    /** Claim 1: a producer meeting a full queue sleeps, and a take is what wakes it. The measured delay is the proof. */\n    static void blockingIsReal() throws Exception {\n        BoundedBlockingQueue&lt;String&gt; q = new BoundedBlockingQueue&lt;&gt;(2);\n        q.put(&quot;a&quot;);\n        q.put(&quot;b&quot;);                                   // the queue is now full\n        long start = System.nanoTime();\n        Thread producer = new Thread(() -&gt; {\n            try { q.put(&quot;c&quot;); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        }, &quot;producer&quot;);\n        producer.start();\n        Thread.sleep(150);                            // the producer is parked on not-full for all of this\n        System.out.println(&quot;while the queue is full, the third put is still waiting: &quot; + (producer.isAlive()));\n        String first = q.take();                      // this frees a slot and signals not-full\n        producer.join(2000);\n        long waitedMs = (System.nanoTime() - start) / 1_000_000;\n        System.out.println(&quot;took &quot; + first + &quot;, the parked producer woke and finished after &quot; + waitedMs\n            + &quot; ms, size=&quot; + q.size() + &quot;, it parked &quot; + q.parkCount() + &quot; time(s) and never spun&quot;);\n    }\n\n    /** Claim 2: the timed calls give up on time and write nothing when they do. */\n    static void timedCallsGiveUp() throws Exception {\n        BoundedBlockingQueue&lt;String&gt; q = new BoundedBlockingQueue&lt;&gt;(1);\n        long t0 = System.nanoTime();\n        String nothing = q.poll(100, TimeUnit.MILLISECONDS);\n        long ms = (System.nanoTime() - t0) / 1_000_000;\n        System.out.println(&quot;poll on an empty queue returned &quot; + nothing + &quot; after &quot; + ms + &quot; ms&quot;);\n        q.put(&quot;only&quot;);\n        boolean accepted = q.offer(&quot;overflow&quot;, 80, TimeUnit.MILLISECONDS);\n        System.out.println(&quot;offer into a full queue returned &quot; + accepted + &quot; and the size is still &quot; + q.size());\n    }\n\n    /** Claim 3: what &quot;full&quot; means is a handed-in rule, so the same queue can drop instead of block. */\n    static void fullIsAPolicy() throws Exception {\n        BoundedBlockingQueue&lt;Integer&gt; q = new BoundedBlockingQueue&lt;&gt;(3);\n        q.configure(new DropOldest&lt;&gt;(), System::nanoTime);\n        for (int i = 1; i &lt;= 7; i++) q.put(i);        // never blocks: the stalest reading is thrown away\n        List&lt;Integer&gt; kept = new ArrayList&lt;&gt;();\n        q.drainTo(kept, 10);\n        System.out.println(&quot;drop-oldest kept the freshest &quot; + kept.size() + &quot;: &quot; + kept + &quot; (no producer ever waited: parks=&quot; + q.parkCount() + &quot;)&quot;);\n    }\n\n    /** Claim 4: four producers and four consumers, 100000 items, every one delivered exactly once and in bounds. */\n    static void theRace() throws Exception {\n        final int CAPACITY = 64, PRODUCERS = 4, CONSUMERS = 4, PER_PRODUCER = 25_000;\n        final int TOTAL = PRODUCERS * PER_PRODUCER;\n        BoundedBlockingQueue&lt;Integer&gt; q = new BoundedBlockingQueue&lt;&gt;(CAPACITY);\n        PeakMeter meter = new PeakMeter();\n        q.addObserver(meter);\n\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n        AtomicInteger produced = new AtomicInteger();\n        List&lt;List&lt;Integer&gt;&gt; received = new ArrayList&lt;&gt;();\n\n        for (int p = 0; p &lt; PRODUCERS; p++) {\n            final int id = p;\n            Thread t = new Thread(() -&gt; {\n                try {\n                    go.await();\n                    for (int i = 0; i &lt; PER_PRODUCER; i++) { q.put(id * PER_PRODUCER + i); produced.incrementAndGet(); }\n                } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            }, &quot;producer-&quot; + p);\n            threads.add(t);\n        }\n        for (int c = 0; c &lt; CONSUMERS; c++) {\n            List&lt;Integer&gt; mine = new ArrayList&lt;&gt;();\n            received.add(mine);\n            Thread t = new Thread(() -&gt; {\n                try {\n                    go.await();\n                    Integer item;\n                    while ((item = q.take()) != null) mine.add(item);   // null = closed and drained\n                } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            }, &quot;consumer-&quot; + c);\n            threads.add(t);\n        }\n        threads.forEach(Thread::start);\n        long t0 = System.nanoTime();\n        go.countDown();\n        for (int i = 0; i &lt; PRODUCERS; i++) threads.get(i).join(30_000);\n        q.close();                                   // wakes every parked consumer; they drain, then see null\n        for (int i = PRODUCERS; i &lt; threads.size(); i++) threads.get(i).join(30_000);\n        long ms = (System.nanoTime() - t0) / 1_000_000;\n\n        boolean[] seen = new boolean[TOTAL];\n        int delivered = 0, duplicates = 0;\n        for (List&lt;Integer&gt; list : received) for (int v : list) { delivered++; if (seen[v]) duplicates++; seen[v] = true; }\n        int lost = 0;\n        for (boolean b : seen) if (!b) lost++;\n        System.out.println(&quot;race: produced=&quot; + produced.get() + &quot; delivered=&quot; + delivered + &quot; duplicates=&quot; + duplicates\n            + &quot; lost=&quot; + lost + &quot; in &quot; + ms + &quot; ms&quot;);\n        System.out.println(&quot;the bound held: peak size=&quot; + meter.peak() + &quot; of capacity &quot; + CAPACITY\n            + &quot;, final size=&quot; + q.size() + &quot;, threads parked &quot; + q.parkCount() + &quot; times&quot;);\n        if (delivered != TOTAL || duplicates != 0 || lost != 0 || meter.peak() &gt; CAPACITY)\n            throw new AssertionError(&quot;the queue lost, duplicated or overfilled an item&quot;);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: a new answer to &quot;what does full mean&quot; -- drop the NEWEST instead of the oldest. One class, one line.\n/**\n * Keep the oldest N and refuse the newcomer, which is what a &quot;first N wins&quot; sampler wants. The queue is not\n * touched at all: this is the whole edit, plus the line that hands it in.\n */\nfinal class DropNewest&lt;T&gt; implements OverflowPolicy&lt;T&gt; {\n    /** Silently swallow the item and tell put not to enqueue it. Never waits, so a producer never stalls. */\n    public boolean onFull(BoundedBlockingQueue&lt;T&gt; queue, T item) { return false; }\n}\n\n// ---- ext: measure without touching the queue -- a decorator over the interface both sides already depend on\n/**\n * Counts items and total blocked time around ANY BlockingBuffer, including one written next year. It wraps the\n * interface, not the class, so the queue keeps its single job and a test can stack a second wrapper on top.\n */\nfinal class MeteredBuffer&lt;T&gt; implements BlockingBuffer&lt;T&gt; {\n    private final BlockingBuffer&lt;T&gt; inner;\n    private final LongAdder puts = new LongAdder(), takes = new LongAdder(), blockedNanos = new LongAdder();\n\n    /** Wrap any buffer. The wrapped one does not know it is wrapped. */\n    MeteredBuffer(BlockingBuffer&lt;T&gt; inner) { this.inner = inner; }\n\n    /** Time the call, then delegate. The measurement is outside the queue&#x27;s lock by construction. */\n    public void put(T item) throws InterruptedException {\n        long t0 = System.nanoTime();\n        try { inner.put(item); } finally { blockedNanos.add(System.nanoTime() - t0); puts.increment(); }\n    }\n    /** Time the call, then delegate. */\n    public T take() throws InterruptedException {\n        long t0 = System.nanoTime();\n        try { return inner.take(); } finally { blockedNanos.add(System.nanoTime() - t0); takes.increment(); }\n    }\n    public boolean offer(T item, long timeout, TimeUnit unit) throws InterruptedException { puts.increment(); return inner.offer(item, timeout, unit); }\n    public T poll(long timeout, TimeUnit unit) throws InterruptedException { takes.increment(); return inner.poll(timeout, unit); }\n    public int size() { return inner.size(); }\n    public int capacity() { return inner.capacity(); }\n    /** What the meter saw: puts, takes and the average time a caller spent inside the queue. */\n    public String report() {\n        long calls = puts.sum() + takes.sum();\n        return &quot;puts=&quot; + puts.sum() + &quot; takes=&quot; + takes.sum()\n             + &quot; avg time in the queue=&quot; + (calls == 0 ? 0 : blockedNanos.sum() / calls) + &quot; ns&quot;;\n    }\n}\n\n// ---- ext: priority instead of FIFO -- a new Store, and the lock, the conditions and the policies do not change\n/**\n * The urgent item goes first. Storage was already a separate job, so priority is a new Store and nothing else;\n * add and poll become O(log n) instead of O(1), which is the price of the ordering.\n * One honest caveat: with this store, drop-oldest drops the HIGHEST-priority item, so pair it with drop-newest.\n */\nfinal class HeapStore&lt;T&gt; implements Store&lt;T&gt; {\n    private final PriorityQueue&lt;T&gt; heap;\n    private final int capacity;\n\n    /** A bounded heap: at most this many items, ordered by this comparator. */\n    HeapStore(int capacity, Comparator&lt;? super T&gt; order) {\n        if (capacity &lt;= 0) throw new IllegalArgumentException(&quot;capacity must be &gt; 0&quot;);\n        this.capacity = capacity;\n        this.heap = new PriorityQueue&lt;&gt;(capacity, order);\n    }\n    public void add(T item) { if (isFull()) throw new IllegalStateException(&quot;heap is full&quot;); heap.add(item); }\n    public T poll() { if (heap.isEmpty()) throw new IllegalStateException(&quot;heap is empty&quot;); return heap.poll(); }\n    public boolean isFull() { return heap.size() == capacity; }\n    public boolean isEmpty() { return heap.isEmpty(); }\n    public int size() { return heap.size(); }\n    public int capacity() { return capacity; }\n}\n\n// ---- ext: bound by bytes, not by count -- because a thousand 2 KB messages and a thousand 2 MB ones are not the same risk\n/** How big one item is, in whatever unit the bound is written in. Handed in, so the queue does no guessing. */\ninterface Weigher&lt;T&gt; { int weightOf(T item); }\n\n/**\n * Full means &quot;the bytes budget is spent&quot;, not &quot;the slot count is spent&quot;. The overshoot is at most one item,\n * because fullness is tested before the item is weighed; the exact fix is one extra method on Store,\n * boolean hasRoomFor(T item), which put would call instead of isFull().\n */\nfinal class ByteBoundedStore&lt;T&gt; implements Store&lt;T&gt; {\n    private final ArrayDeque&lt;T&gt; items = new ArrayDeque&lt;&gt;();\n    private final Weigher&lt;T&gt; weigher;\n    private final int maxBytes;\n    private int bytes;\n\n    /** A store bounded by total weight rather than by item count. */\n    ByteBoundedStore(int maxBytes, Weigher&lt;T&gt; weigher) { this.maxBytes = maxBytes; this.weigher = weigher; }\n\n    public void add(T item) {\n        int w = weigher.weightOf(item);\n        if (w &gt; maxBytes) throw new IllegalArgumentException(&quot;item of &quot; + w + &quot; bytes can never fit in &quot; + maxBytes);\n        items.addLast(item);\n        bytes += w;\n    }\n    public T poll() { T item = items.pollFirst(); bytes -= weigher.weightOf(item); return item; }\n    public boolean isFull() { return bytes &gt;= maxBytes; }\n    public boolean isEmpty() { return items.isEmpty(); }\n    public int size() { return items.size(); }\n    /** The declared bound, in bytes: this store counts weight, not slots. */\n    public int capacity() { return maxBytes; }\n    /** The bytes held right now. */\n    public int bytes() { return bytes; }\n}\n\n// ---- ext: bulk transfer -- wait for the first item, then take everything that is already there, under one lock\n/**\n * The batching consumer. drainTo alone never waits, so a consumer that called it in a loop would spin on an\n * empty queue; this waits for one item with a deadline and then drains the rest in the same breath.\n */\nfinal class Bulk {\n    /**\n     * Block up to the timeout for at least one item, then drain up to max in total. Returns how many were moved:\n     * zero means the budget ran out or the queue is closed and empty.\n     */\n    static &lt;T&gt; int drainAtLeastOne(BoundedBlockingQueue&lt;T&gt; q, Collection&lt;? super T&gt; sink, int max,\n                                   long timeout, TimeUnit unit) throws InterruptedException {\n        T first = q.poll(timeout, unit);\n        if (first == null) return 0;\n        sink.add(first);\n        return 1 + q.drainTo(sink, max - 1);\n    }\n}\n\n// ---- ext: ladder rung 2 -- two locks, the LinkedBlockingQueue trick: producers and consumers stop meeting\n/**\n * One lock means a producer and a consumer contend even though they touch opposite ends of the queue. A linked\n * node list has two ends, so it can have two locks: producers take putLock, consumers take takeLock, and the\n * only shared word is an atomic count. The subtlety is the &quot;cascading signal&quot;: a put signals not-empty only when\n * the queue WAS empty, and it must do that outside its own lock, or the two locks would be taken in a fixed\n * order and the design would be back to one lock&#x27;s worth of contention.\n */\nfinal class TwoLockQueue&lt;T&gt; implements BlockingBuffer&lt;T&gt; {\n    /** A one-way linked cell. The head node is a dummy: its item is always null. */\n    private static final class Node&lt;T&gt; { T item; Node&lt;T&gt; next; Node(T item) { this.item = item; } }\n\n    private final int capacity;\n    private final AtomicInteger count = new AtomicInteger();\n    private Node&lt;T&gt; head = new Node&lt;&gt;(null), last = head;\n    private final ReentrantLock putLock = new ReentrantLock(), takeLock = new ReentrantLock();\n    private final Condition notFull = putLock.newCondition(), notEmpty = takeLock.newCondition();\n\n    /** A queue bounded to this many items, with one lock per end. */\n    TwoLockQueue(int capacity) { this.capacity = capacity; }\n\n    /** Append under putLock; wake a consumer only if the queue was empty before this item. */\n    public void put(T item) throws InterruptedException {\n        Objects.requireNonNull(item);\n        int c;\n        putLock.lockInterruptibly();\n        try {\n            while (count.get() == capacity) notFull.await();\n            last = last.next = new Node&lt;&gt;(item);\n            c = count.getAndIncrement();\n            if (c + 1 &lt; capacity) notFull.signal();   // still room: pass the baton to the next producer\n        } finally { putLock.unlock(); }\n        if (c == 0) signalNotEmpty();                 // it WAS empty: somebody may be parked on the other lock\n    }\n    /** Remove under takeLock; wake

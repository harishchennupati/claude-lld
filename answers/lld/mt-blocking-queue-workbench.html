<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Write me a bounded blocking queue. Fixed capacity, many producer threads, many consumer threads. <code>put</code> blocks when it is full, <code>take</code> blocks when it is empty, nothing is lost and nothing is delivered twice. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>One thread makes work, another thread does it, and a box in the middle holds what has been made but not yet done. The box has a fixed size, and that is the whole problem: a producer that arrives at a full box cannot just carry on, and a consumer that arrives at an empty box has nothing to do. Neither may sit in a loop asking \"is it my turn yet\" &mdash; that burns a whole CPU to wait &mdash; so the thread has to go to sleep and somebody has to wake it at the right moment. Any number of threads may be on either side at the same instant, so the check (\"is there room?\") and the act (\"put it in\") have to happen as one indivisible step, or two producers both see the last free slot and one item is silently overwritten. The one thing that must always be true: the number of items is between zero and the capacity, they come out in the order they went in, and every item is delivered exactly once &mdash; never lost, never twice.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: a class that compiles and a <code>main</code> that starts a crowd of threads and proves the counts. The interviewer is watching for, in this order: the questions you ask before typing (what happens on full, and how many threads on each side, are the first two); which types exist and who owns which state; <code>put</code> and <code>take</code> end to end, including the waiting; the race you are actually defending against, named out loud; whether the wait is a <code>while</code> and not an <code>if</code>, and why there are two conditions and not one; what is inside the lock and for how long; what happens when a blocked thread is interrupted; and, near the end, why you would write any of this when <code>ArrayBlockingQueue</code> already exists. Then the twists: never block, drop instead; priority instead of FIFO; bound it by bytes; shut it down cleanly; make it faster than one lock.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"51\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">put</text><g transform=\"translate(150 20)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an item arrives</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">from any producer thread</text></g><path d=\"M345 47 H370\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(370 20)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take the lock</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">interruptibly</text></g><path d=\"M565 47 H590\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(590 20)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is there room?</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">count &lt; capacity</text></g><path d=\"M785 47 H810\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(810 20)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">copy it in, count + 1</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">then signal ONE consumer</text></g><path d=\"M1005 47 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 20)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">unlock, then listeners</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">never inside the lock</text></g><path d=\"M640 74 V104\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(560 104)\"><rect width=\"350\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"175.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">full: park on notFull &mdash; the lock is released</text></g><path d=\"M760 104 V78\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"632\" y=\"93\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--muted)\">full</text><text x=\"770\" y=\"93\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--acc)\">woken &rarr; check again</text><text x=\"88\" y=\"216\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">take</text><g transform=\"translate(150 185)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a consumer asks</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">from any consumer thread</text></g><path d=\"M345 212 H370\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(370 185)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take the lock</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">interruptibly</text></g><path d=\"M565 212 H590\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(590 185)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is there an item?</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">count &gt; 0</text></g><path d=\"M785 212 H810\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(810 185)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take the head, count - 1</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">then signal ONE producer</text></g><path d=\"M1005 212 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 185)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">unlock, return it</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">listeners after</text></g><path d=\"M640 239 V269\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(560 269)\"><rect width=\"350\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"175.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">empty: park on notEmpty &mdash; the lock is released</text></g><path d=\"M760 269 V243\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"632\" y=\"258\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--muted)\">empty</text><text x=\"770\" y=\"258\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--acc)\">woken &rarr; check again</text><text x=\"735\" y=\"160\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a wake only means \"look again\", never \"the slot is yours\" &mdash; so the check is a while loop, not an if</text><text x=\"88\" y=\"335\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"150\" y=\"335\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, from any thread: how many items are in it, and how much room is left &mdash; one lock, one consistent number</text><text x=\"615\" y=\"365\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">0 &le; count &le; capacity at every instant, FIFO order, every item delivered exactly once &mdash; with ten producers and ten consumers running flat out</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Fixed capacity, or can it grow?</td><td>Fixed at construction</td><td>An array ring buffer, and a bound that is real (moves 1, 5)</td></tr><tr><td>On full: block, wait a while, drop something, or throw?</td><td>Block; the rest are a policy</td><td>One-method <code>OverflowPolicy</code> handed in (move 3)</td></tr><tr><td>Many producers and many consumers, or one of each?</td><td>Many of both</td><td>A lock and two conditions, not a lock-free single-producer ring (moves 4, 8)</td></tr><tr><td>Do callers need a deadline, and must a blocked caller be cancellable?</td><td>Yes to both</td><td>Timed <code>offer</code>/<code>poll</code>, and <code>lockInterruptibly</code> (moves 6, 9)</td></tr><tr><td>FIFO, or is priority in scope?</td><td>FIFO</td><td>Storage behind its own interface, so a heap is a new class (moves 3, 12)</td></tr><tr><td>Does anything need to stop cleanly?</td><td>Yes: drain, then end-of-stream</td><td>A closed flag read inside the same wait loops (move 6)</td></tr><tr><td>Bulk operations, or one item at a time?</td><td><code>drainTo</code> for the consumer</td><td>One lock acquire per batch: rung one of the ladder (move 8)</td></tr><tr><td>One JVM and in memory?</td><td>Yes</td><td>No durability yet; the log version is a follow-up (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li><code>put(item)</code> appends at the tail and blocks while the queue is full; <code>take()</code> removes from the head and blocks while it is empty.</li>\n<li>Timed <code>offer</code> and <code>poll</code> wait only up to a deadline, then give up with <code>false</code> / <code>null</code>.</li>\n<li>Capacity is fixed at construction. Items are never null, so a <code>null</code> answer unambiguously means \"nothing\".</li>\n<li>What \"full\" means is itself a rule: block by default, or drop the oldest, or refuse loudly.</li>\n<li><code>size()</code> and <code>remainingCapacity()</code> are consistent snapshots; <code>drainTo</code> moves a batch in one go.</li>\n<li><code>close()</code> stops new work, wakes everybody parked, and lets consumers drain before end-of-stream.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Every item delivered exactly once, in FIFO order, with any number of threads on either side.</li>\n<li>0 &le; size &le; capacity at every instant: never an overwrite, never a read of an empty slot.</li>\n<li>No busy-waiting: a waiting thread parks and burns no CPU until somebody signals it.</li>\n<li>put, take, offer, poll and size are O(1); memory is exactly capacity slots and never grows.</li>\n<li>A blocked caller can be cancelled, and a failure anywhere leaves the queue exactly as it was.</li>\n<li>The rules &mdash; what full means, how items are stored, where time comes from, who is told &mdash; swap without touching the lock.</li>\n<li>One JVM, in memory, not durable (say it; a follow-up adds the log).</li></ul></div></div>\n<div class=\"move\"><h3>One run, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 0 ms   eight threads start</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">4 producers, 4 consumers, cap 64</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one latch releases them together</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the ring is empty: consumers park</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 0-42 ms   100,000 items</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the ring never holds more than 64</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">about 1 handoff in 10 parked a thread</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the other nine in ten never blocked</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 42 ms   producers done</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">close(): signalAll, both sides</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">every parked consumer re-checks</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">they drain, then see null</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 42 ms   the count</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">delivered 100,000, lost 0</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">duplicates 0, final size 0</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">peak size 64 of 64: the bound held</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> capacity is fixed at construction; many producers and many consumers; blocking is the default on full and on empty, and the timed variants give up on a deadline; items are never null so null can mean \"nothing\"; a blocked caller is cancellable by interrupt; FIFO. Named as out of scope: priority ordering, byte-based bounds, durability, distribution &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">The same twelve moves as every other page here, with the threading ones doing the work: the shared state and its one lock (move 4), the wait protocol &mdash; check under the lock, wait in a loop, signal after the change (move 6), what is inside the lock and what happens when N threads arrive at once (move 7), and the ladder from one lock and two conditions to two locks to no locks at all (move 8). Nothing is chosen up front, and no pattern is named before the move that produced it.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class &mdash; and on a threading problem, notice what does not.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a PRODUCER puts an ITEM into a QUEUE of fixed CAPACITY; a CONSUMER takes one out; when it is FULL, somebody WAITS</text><g transform=\"translate(30 110)\"><rect width=\"170\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BoundedBlockingQueue</text><text x=\"85.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock, the conditions</text></g><path d=\"M115.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(228 110)\"><rect width=\"180\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RingBuffer</text><text x=\"90.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">slots, head, tail, count</text></g><path d=\"M318.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(436 110)\"><rect width=\"180\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"90.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">OverflowPolicy</text><text x=\"90.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M526.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(644 110)\"><rect width=\"170\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"85.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Item</text><text x=\"85.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the payload, not ours</text></g><path d=\"M729.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(842 110)\"><rect width=\"170\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"85.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Producer / Consumer</text><text x=\"85.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">threads, not classes</text></g><path d=\"M927.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1040 110)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">notFull / notEmpty</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waiting rooms</text></g><path d=\"M1120.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a thread, a payload, an interface, or a waiting room that belongs to the lock</text></svg></div><div class=\"move\"><p>Reading the sentence again: a <b>producer</b> puts an <b>item</b> into a <b>queue</b> of fixed <b>capacity</b>; a <b>consumer</b> takes one out; when it is <b>full</b>, somebody <b>waits</b>. The queue holds the lock, the two conditions and the rules: a class, and the only one the callers touch. The storage has an array, a head, a tail and a count, all of which move: a class of its own, so it can be tested on one thread with no threading at all. What \"full\" means has no state, so it is an interface. And then the three that a threading problem tempts you to make classes and must not: the item is the caller's payload, not ours; a producer is not an object, it is any thread that calls <code>put</code>; and the waiting parties are not a list you keep &mdash; they are two queues of parked threads that the lock already maintains, reached only through <code>await</code> and <code>signal</code>. Inventing a <code>Waiter</code> class here is the classic wrong turn.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hold the items, in order</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 46 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 24)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RingBuffer  (owns the array + cursors)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 46 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ring.add(item) / ring.poll()</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 80)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">wait until there is room</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 102 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 80)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BoundedBlockingQueue  (owns the lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 102 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 80)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">notFull.await() / signal()</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 136)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">decide what \"full\" means</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 158 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 136)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">OverflowPolicy  (owns nothing: pure)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 158 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">policy.onFull(queue, item)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 192)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hand an item across threads</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 214 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 192)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BoundedBlockingQueue  (owns all three)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 214 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 192)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">q.put(item) / q.take()</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">only the queue can see the store AND the two conditions, so the queue is the orchestrator; a producer is not a class here, it is any thread that calls put</text><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and notice the verb with no class at all: waiting. It is two queues of parked threads owned by the lock, and await / signal are the only way to touch them</text></svg></div><div class=\"move\"><p>\"Hold the items in order\" touches the array and the two cursors, so it belongs to the ring buffer: <code>ring.add(item)</code> and <code>ring.poll()</code>. \"Wait until there is room\" touches the lock and the not-full condition, so it belongs to the thing that owns them: the queue. \"Decide what full means\" touches nothing at all &mdash; it is a decision, given the queue and the item &mdash; so it is a pure rule. And \"hand an item across threads\" touches all three at once; only the queue can see the store <i>and</i> the conditions, so <code>put</code> and <code>take</code> live there and the queue is the orchestrator. That is also the answer to a question interviewers like: why is there no <code>Producer</code> class? Because a producer owns no state that the queue cares about. It is a thread, and its only relationship with the design is that it calls a method.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind a one-method interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 70)\"><rect width=\"220\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BoundedBlockingQueue</text><text x=\"110.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(policy, clock)</text></g><path d=\"M250 120 H330 V42 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 20)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">OverflowPolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what \"full\" means</text></g><g transform=\"translate(760 20)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BlockUntilRoom / DropOldest / RejectWhenFull</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">and DropNewest, written next year</text></g><path d=\"M760 42 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 120 H330 V100 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 78)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Store</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">how the items are held</text></g><g transform=\"translate(760 78)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RingBuffer / HeapStore / ByteBoundedStore</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">FIFO, priority, bounded by bytes</text></g><path d=\"M760 100 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 120 H330 V158 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where a deadline comes from</text></g><g transform=\"translate(760 136)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::nanoTime, or a test's fake</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a lambda is a valid implementation</text></g><path d=\"M760 158 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 120 H330 V216 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 194)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">QueueObserver</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who wants to know</text></g><g transform=\"translate(760 194)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PeakMeter, a dashboard, a log line</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">called after the unlock, never inside</text></g><path d=\"M760 216 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The queue never builds a rule, so \"never block, throw the stalest reading away\" is a new class and one line at construction</text><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one wrapper takes the whole interface instead: MeteredBuffer wraps ANY BlockingBuffer to time it, and the queue never learns it is being measured</text></svg></div><div class=\"move\"><p>Four things will change, and each becomes an interface the queue is <i>given</i> rather than builds. What happens on full will change: block today, drop the stalest reading tomorrow, refuse loudly the day after &mdash; that is <code>OverflowPolicy</code>, and it is the seam the interviewer reaches for first. How the items are held will change: a ring today, a bounded heap when somebody says \"urgent jobs first\", a byte budget when somebody says \"these messages are two megabytes each\" &mdash; that is <code>Store</code>. Where a deadline comes from will change, because a test cannot afford to wait for one &mdash; that is <code>Clock</code>. And who wants to know will change &mdash; that is <code>QueueObserver</code>. This is where the patterns are born, not announced: a swappable rule behind an interface is <b>Strategy</b>; a wrapper that adds behaviour to the whole interface is <b>Decorator</b>, and here it is <code>MeteredBuffer</code>, which times any buffer without the queue ever knowing; a queue that says \"an item landed\" without knowing what a dashboard is, is <b>Observer</b>.</p></div><div class=\"move\"><h3>Move 4: state that many threads change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"25\" y=\"62\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">producer A</text><text x=\"25\" y=\"132\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">producer B</text><text x=\"25\" y=\"202\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">the ring</text><g transform=\"translate(150 40)\"><rect width=\"165\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reads count = 63</text><text x=\"82.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one free slot</text></g><g transform=\"translate(510 40)\"><rect width=\"165\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">writes slot 63</text><text x=\"82.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">count = 64</text></g><g transform=\"translate(330 110)\"><rect width=\"165\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reads count = 63</text><text x=\"82.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one free slot</text></g><g transform=\"translate(690 110)\"><rect width=\"165\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">writes slot 63 too</text><text x=\"82.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">count = 65</text></g><g transform=\"translate(190 180)\"><rect width=\"85\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"42.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">63</text></g><g transform=\"translate(370 180)\"><rect width=\"85\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"42.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">63</text></g><g transform=\"translate(550 180)\"><rect width=\"85\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"42.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">64</text></g><g transform=\"translate(730 180)\"><rect width=\"85\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"42.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">65</text></g><rect x=\"140\" y=\"28\" width=\"730\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"5 4\"/><text x=\"1000\" y=\"24\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">the gap: A read it, then B read the same number</text><path d=\"M140 235 H880\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><path d=\"M232 230 V240\" stroke=\"var(--line)\"/><text x=\"232\" y=\"256\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t1</text><path d=\"M412 230 V240\" stroke=\"var(--line)\"/><text x=\"412\" y=\"256\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t2</text><path d=\"M592 230 V240\" stroke=\"var(--line)\"/><text x=\"592\" y=\"256\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t3</text><path d=\"M772 230 V240\" stroke=\"var(--line)\"/><text x=\"772\" y=\"256\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t4</text><text x=\"905\" y=\"240\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">time &rarr;</text><g transform=\"translate(900 60)\"><rect width=\"300\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lock</text><text x=\"150.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the check and the write are ONE step</text></g><text x=\"1050\" y=\"180\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the two waiting rooms hang off that same lock,</text><text x=\"1050\" y=\"198\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">so nobody can wait on a number that is moving</text><text x=\"615\" y=\"285\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">count is now 65 in a ring of 64 slots: A's item was overwritten by B and vanished, and the count is a lie that never repairs itself</text></svg></div><div class=\"move\"><p>Two producers arrive at a queue with one free slot. Both read <code>count = 63</code> against a capacity of 64, both conclude there is room, and both write into slot 63: one item is silently overwritten, the count says 65 in a ring of 64, and nothing ever repairs itself. The gap is between the check and the act, and the only fix is to make them one step. So the array, both cursors, the count and the two conditions all belong to one object, and every path in and out goes through its lock &mdash; that shape has a name, the <b>monitor object</b>. The two waiting rooms hang off the same lock on purpose: a thread that is about to sleep tests the condition and goes to sleep <i>without</i> ever releasing the lock in between, which is what makes \"I checked and then I slept\" atomic. Anything that only listens is called after the unlock, never inside it.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 305\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what comes out next?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 40 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 20)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">slots[head] &mdash; one array read</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 40 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 20)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 70)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">where does the next item go?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 90 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 70)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">slots[tail], tail = (tail+1) % n</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 90 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 70)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 120)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is it full? is it empty?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 140 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 120)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an int count (head == tail cannot tell)</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 140 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 120)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 170)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who is waiting for room?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 190 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 170)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">notFull: the lock's queue of parked threads</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 190 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 170)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) park / wake</text></g><g transform=\"translate(30 220)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many items right now?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 240 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 220)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">count, read under the lock</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 240 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 220)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">no scanning, no allocation per item, and no list of waiters of our own: each Condition already keeps its own queue of parked threads</text></svg></div><div class=\"move\"><p>\"What comes out next?\" is one array read at <code>head</code>. \"Where does the next item go?\" is one array write at <code>tail</code>, then <code>tail = (tail + 1) % n</code> to wrap. \"Is it full? is it empty?\" is the one that catches people: <code>head == tail</code> is true in both cases, so you keep an <code>int count</code> and those two questions become comparisons. \"Who is waiting?\" needs no structure from us at all &mdash; each <code>Condition</code> keeps its own queue of parked threads, so parking is O(1) and waking exactly one is O(1). Nothing here scans, nothing allocates per item, and the memory is exactly capacity slots forever, which is the other half of what \"bounded\" buys you: a fixed, known ceiling on how much work can be in flight.</p></div><div class=\"move\"><h3>Move 6: a put has a life cycle, and the order of the steps inside it is the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 395\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"745\" y=\"16\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">still full &rarr; sleep again: this arrow is exactly why the check is a while, not an if</text><path d=\"M920 55 V30 H570 V55\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(160 55)\"><rect width=\"150\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">put(item)</text><text x=\"75.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">any thread</text></g><path d=\"M310 76 H320\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(320 55)\"><rect width=\"150\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take the lock</text><text x=\"75.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">interruptibly</text></g><path d=\"M470 76 H480\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(480 55)\"><rect width=\"180\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">park on notFull</text><text x=\"90.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock is RELEASED</text></g><path d=\"M660 76 H680\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(680 55)\"><rect width=\"140\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">woken</text><text x=\"70.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">by a take</text></g><path d=\"M820 76 H830\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(830 55)\"><rect width=\"180\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check AGAIN</text><text x=\"90.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">under the lock</text></g><path d=\"M1010 76 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 55)\"><rect width=\"170\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">add, signal, unlock</text><text x=\"85.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">in that order</text></g><text x=\"25\" y=\"80\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">one put</text><text x=\"25\" y=\"140\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">the lock</text><rect x=\"320\" y=\"122\" width=\"160\" height=\"32\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"400\" y=\"143\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--text)\">held by us</text><rect x=\"480\" y=\"122\" width=\"330\" height=\"32\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-dasharray=\"5 3\"/><text x=\"645\" y=\"143\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">held by NOBODY &mdash; await() gave it up while we slept</text><rect x=\"830\" y=\"122\" width=\"370\" height=\"32\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"1015\" y=\"143\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--text)\">held by us again, re-acquired before await returns</text><rect x=\"20\" y=\"180\" width=\"1190\" height=\"200\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"202\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside put, and why it is this order</text><text x=\"35\" y=\"226\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1  lock.lockInterruptibly()   so a caller that ends up parked can still be cancelled</text><text x=\"35\" y=\"246\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2  while (full) notFull.await()   in awaitRoom(), which the blocking policy calls: while, not if, because a wake only means \"look again\"</text><text x=\"35\" y=\"266\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3  store.add(item)   the state changes FIRST, and it cannot fail half way</text><text x=\"35\" y=\"286\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4  notEmpty.signal()   then exactly one consumer is woken, still under the lock</text><text x=\"35\" y=\"306\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5  unlock in a finally   an exception must never leave the lock held</text><text x=\"35\" y=\"326\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">6  then the listeners, outside the lock, in a try/catch</text><text x=\"35\" y=\"352\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">steps 2 and 3 are under the SAME lock a consumer needs to free a slot, so no signal can land between the check and the sleep: that gap is the real lost wakeup</text><text x=\"35\" y=\"370\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">anything that throws before step 3 leaves the count as it was; an interrupt landing after a signal was spent on us signals a peer before it throws</text></svg></div><div class=\"move\"><p>Follow one <code>put</code> along the clock. It takes the lock &mdash; interruptibly, so a caller that ends up parked can still be cancelled. It finds the queue full and calls <code>notFull.await()</code>, which does the thing that makes the whole design work: it releases the lock while the thread sleeps, and re-acquires it before returning. A consumer takes an item and signals; this thread wakes up, but a wake only means \"look again\", so it re-tests the condition &mdash; another producer may have taken the slot in between, which is called a signal steal, and the hardware is also allowed to wake a thread for no reason at all, which is a spurious wakeup. That is why the wait is a <code>while</code> and never an <code>if</code>; the arrow from \"woken\" goes back to the check, not forward to the write. Only when it sees room does it change the store, then signal one consumer, then unlock in a <code>finally</code>, then tell the listeners. Anything that throws before the store changes leaves the count exactly as it was; and an interrupt that lands after a signal was already spent on this thread signals a peer before it throws, so the wakeup does not die with it.</p></div><div class=\"move\"><h3>Move 7: yes, one lock means one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 405\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"560\" height=\"152\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about ten nanoseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one array write, two int updates, one modulo</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one signal onto the other condition's queue</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">an uncontended lock acquire and release</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">measured: put + take on one thread = 10 ns</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">nothing in here can block. Ever.</text></g><path d=\"M590 96 H650\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"620\" y=\"86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(650 20)\"><rect width=\"550\" height=\"152\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"275.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: microseconds to milliseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the consumer's actual work: milliseconds</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">a park and an unpark: about 2 microseconds</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the listeners: after the unlock, in a try/catch</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the producer making its next item</text></g><text x=\"615\" y=\"196\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">eight threads at the same instant: the lock is a baton, not a queue</text><text x=\"25\" y=\"223\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">producer 1</text><rect x=\"150\" y=\"212\" width=\"1050\" height=\"14\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"180\" y=\"212\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"25\" y=\"241\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">producer 2</text><rect x=\"150\" y=\"230\" width=\"1050\" height=\"14\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"310\" y=\"230\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"25\" y=\"259\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">producer 3</text><rect x=\"150\" y=\"248\" width=\"1050\" height=\"14\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"440\" y=\"248\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"25\" y=\"277\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">producer 4</text><rect x=\"150\" y=\"266\" width=\"1050\" height=\"14\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"570\" y=\"266\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"25\" y=\"295\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">consumer 1</text><rect x=\"150\" y=\"284\" width=\"1050\" height=\"14\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"700\" y=\"284\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"25\" y=\"313\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">consumer 2</text><rect x=\"150\" y=\"302\" width=\"1050\" height=\"14\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"830\" y=\"302\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"25\" y=\"331\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">consumer 3</text><rect x=\"150\" y=\"320\" width=\"1050\" height=\"14\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"960\" y=\"320\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"25\" y=\"349\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">consumer 4</text><rect x=\"150\" y=\"338\" width=\"1050\" height=\"14\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"1090\" y=\"338\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"615\" y=\"372\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the grey bar is the thread doing its own work, all at once; the green block is the ten nanoseconds it holds the lock</text><text x=\"615\" y=\"392\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">measured: 100,000 items through a capacity-64 queue with these eight threads is about 40 ms, and about one handoff in ten had to park anybody</text></svg></div><div class=\"move\"><p>Inside the lock there is one array write, two integer updates, a modulo and one signal: on this machine a <code>put</code> and a <code>take</code> together measure about ten nanoseconds when nothing blocks. Everything expensive is outside it &mdash; the work the consumer actually does, the listeners, the producer making its next item &mdash; because nothing that can block is allowed inside. So eight threads hitting the queue at the same instant pass the lock around like a baton rather than queueing behind it: the measured run of 100,000 items through a capacity-64 queue with four producers and four consumers takes about 40 milliseconds, and what those threads spent their time on was each other, not the lock. The honest number to volunteer is the other one: about one handoff in ten &mdash; ten thousand of the hundred thousand &mdash; actually had to put a thread to sleep and wake it again, and that is where the milliseconds went.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 255\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"300\" y=\"34\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one producer, one consumer, 200,000 items (CapacityScan, Extensions.java)</text><rect x=\"20\" y=\"46\" width=\"560\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"64.0\" font-size=\"10.5\" fill=\"var(--acc)\">capacity</text><text x=\"195\" y=\"64.0\" font-size=\"10.5\" fill=\"var(--acc)\">nanoseconds per item</text><text x=\"360\" y=\"64.0\" font-size=\"10.5\" fill=\"var(--acc)\">how often a thread parked</text><rect x=\"20\" y=\"74\" width=\"560\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"92.0\" font-size=\"11\" fill=\"var(--text)\">1</text><text x=\"195\" y=\"92.0\" font-size=\"11\" fill=\"var(--text)\">about 3,800</text><text x=\"360\" y=\"92.0\" font-size=\"11\" fill=\"var(--text)\">two parks for every single item</text><rect x=\"20\" y=\"102\" width=\"560\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"120.0\" font-size=\"11\" fill=\"var(--text)\">8</text><text x=\"195\" y=\"120.0\" font-size=\"11\" fill=\"var(--text)\">about 520</text><text x=\"360\" y=\"120.0\" font-size=\"11\" fill=\"var(--text)\">one item in four</text><rect x=\"20\" y=\"130\" width=\"560\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"148.0\" font-size=\"11\" fill=\"var(--text)\">64</text><text x=\"195\" y=\"148.0\" font-size=\"11\" fill=\"var(--text)\">about 65</text><text x=\"360\" y=\"148.0\" font-size=\"11\" fill=\"var(--text)\">one item in thirty</text><rect x=\"20\" y=\"158\" width=\"560\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"176.0\" font-size=\"11\" fill=\"var(--text)\">1024</text><text x=\"195\" y=\"176.0\" font-size=\"11\" fill=\"var(--text)\">about 65</text><text x=\"360\" y=\"176.0\" font-size=\"11\" fill=\"var(--text)\">one item in a thousand</text><rect x=\"20\" y=\"186\" width=\"560\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"204.0\" font-size=\"11\" fill=\"var(--acc)\">one thread, alone</text><text x=\"195\" y=\"204.0\" font-size=\"11\" fill=\"var(--text)\">12 for put AND take</text><text x=\"360\" y=\"204.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"300\" y=\"240\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the lock is not the cost. The parking is: capacity is the first knob, not cleverness.</text><text x=\"890\" y=\"34\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the ladder, in the order you would climb it</text><g transform=\"translate(600 50)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1   batch: drainTo(sink, 64)</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one lock acquire per batch instead of per item; costs nothing to add</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2   two locks: putLock + takeLock + an atomic count</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">producers and consumers stop meeting; 50,000 items in about 13 ms</text></g><g transform=\"translate(600 166)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3   a lock-free ring: two volatile cursors, one thread each side</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">50,000 items in 2 ms &mdash; and back-pressure becomes the caller's problem</text></g><text x=\"915\" y=\"240\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">rung 3 gives up the one thing the queue was for: blocking</text></svg></div><div class=\"move\"><p>Measure before you climb. One producer and one consumer moving 200,000 items: at capacity 1, about 3,800 nanoseconds per item and two parks for every single item; at capacity 8, about 520 nanoseconds and one item in four parks; at capacity 64, about 65 nanoseconds and one in thirty; at capacity 1024, about the same again and one in a thousand. Those absolute numbers move ten or twenty per cent from run to run &mdash; the ratios between the rows do not. The shape of that table is the whole lesson &mdash; the lock costs tens of nanoseconds, a park and an unpark costs about two microseconds, so the first knob is capacity, not cleverness, and a queue that is sized so it is rarely empty and rarely full barely blocks at all. Then the ladder, cheapest first. One: batch, with <c

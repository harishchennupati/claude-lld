 the buttons inside the cars are off\");\n            if (!car(carId).pressFloor(destination))\n                throw new IllegalStateException(\"car \" + carId + \" cannot serve floor \" + destination);\n            snaps = snapshots();\n        } finally { lock.unlock(); }\n        publish(snaps);\n    }\n\n    /**\n     * One step of the world: every car moves one floor or cycles its doors, calls that were served leave the\n     * index, and calls still waiting are offered to the cars again. Observers hear after the lock.\n     */\n    void tick() {\n        List<CarSnapshot> snaps;\n        lock.lock();\n        try {\n            long now = clock.nowMs();\n            for (ElevatorCar c : cars)\n                for (HallCall served : c.step(doorPolicy)) {\n                    assigned.remove(served);\n                    Long raised = raisedAtMs.remove(served);\n                    if (raised != null) { totalWaitMs += now - raised; servedCalls++; }\n                }\n            retryPending();\n            snaps = snapshots();\n        } finally { lock.unlock(); }\n        publish(snaps);\n    }\n\n    /**\n     * Emergency stop: the car halts where it is with its doors open and every hall call it owed goes back on\n     * the waiting queue. The queue is intact, so the next tick hands those calls to another car.\n     */\n    void takeOutOfService(int carId) {\n        List<CarSnapshot> snaps;\n        lock.lock();\n        try {\n            for (HallCall owed : car(carId).goOutOfService()) { assigned.remove(owed); pending.add(owed); }\n            snaps = snapshots();\n        } finally { lock.unlock(); }\n        publish(snaps);\n    }\n    /**\n     * Fire recall: under the lock, every car forgets its stops and is sent to one floor, and until endRecall()\n     * no car takes a hall call (the presses wait on the queue) and the buttons inside the cars do nothing.\n     * The hall calls the cars owed go back on the queue too, so nothing is lost while the building empties.\n     */\n    void recallAll(int floor) {\n        if (floor < bottomFloor || floor > topFloor) throw new IllegalArgumentException(\"no floor \" + floor + \" in this building\");\n        List<CarSnapshot> snaps;\n        lock.lock();\n        try {\n            recallFloor = floor;\n            for (ElevatorCar c : cars) {\n                for (HallCall owed : c.dropStops()) { assigned.remove(owed); pending.add(owed); }\n                c.pressFloor(floor);                   // straight to the car: a car out of service stays where it is\n            }\n            snaps = snapshots();\n        } finally { lock.unlock(); }\n        publish(snaps);\n    }\n    /** Fire recall is over: the buttons work again, and the next tick offers the waiting calls to the cars. */\n    void endRecall() { lock.lock(); try { recallFloor = null; } finally { lock.unlock(); } }\n\n    /**\n     * The OPEN button inside a car, and the door sensor: hold the doors for a few more ticks. Nothing that a\n     * panel displays changes, so there is nothing to publish. False means the doors were already shut, which\n     * is what pressing it in a moving car does: nothing.\n     */\n    boolean holdDoors(int carId, int extraTicks) {\n        lock.lock(); try { return car(carId).holdDoors(extraTicks); } finally { lock.unlock(); }\n    }\n    /** The CLOSE button inside a car: stop waiting, so the next tick shuts the doors. False if already shut. */\n    boolean closeDoors(int carId) {\n        lock.lock(); try { return car(carId).closeDoorsNow(); } finally { lock.unlock(); }\n    }\n\n    /** Put a car back on the bank; waiting calls may go to it from the next tick. */\n    void returnToService(int carId) {\n        List<CarSnapshot> snaps;\n        lock.lock();\n        try { car(carId).returnToService(); snaps = snapshots(); } finally { lock.unlock(); }\n        publish(snaps);\n    }\n\n    /** Which car owes this call, or -1. */\n    int assignedCar(HallCall call) { lock.lock(); try { return assigned.getOrDefault(call, -1); } finally { lock.unlock(); } }\n    /** Calls nobody could take yet; they are retried on every tick. */\n    Set<HallCall> pendingCalls()   { lock.lock(); try { return new LinkedHashSet<>(pending); } finally { lock.unlock(); } }\n    /** How many hall calls are outstanding: assigned plus waiting. */\n    int outstandingCalls()         { lock.lock(); try { return assigned.size() + pending.size(); } finally { lock.unlock(); } }\n    /** Mean time from the first press of a button to its doors opening, by the injected clock. */\n    double averageWaitMs()         { lock.lock(); try { return servedCalls == 0 ? 0 : (double) totalWaitMs / servedCalls; } finally { lock.unlock(); } }\n\n    /**\n     * Where every car is, read without the lock: each snapshot is an immutable record the car republished\n     * after its last change. This is what a lobby display and an estimate poll a thousand times a second.\n     */\n    List<CarSnapshot> snapshots() {\n        List<CarSnapshot> out = new ArrayList<>(cars.size());\n        for (ElevatorCar c : cars) out.add(c.snapshot());\n        return out;\n    }\n\n    /**\n     * Floors of travel before a car could answer that call: the nearest-car rule's own cost, over the same\n     * cars it may choose from (in service, and able to reach that floor). -1 when no car can come, because a\n     * board must show \"no service\", not a nonsense number. With another rule handed in, ask that rule instead.\n     */\n    int estimateFloorsToServe(HallCall call) {\n        if (recallFloor != null) return -1;                                  // fire recall: no car will come\n        int best = Integer.MAX_VALUE;\n        for (CarSnapshot s : snapshots()) {                                  // lock-free: snapshots only\n            if (s.state() == CarState.MAINTENANCE || !car(s.carId()).serves(call.floor())) continue;   // the range is final\n            best = Math.min(best, NearestCarStrategy.cost(s, call, bottomFloor, topFloor));\n        }\n        return best == Integer.MAX_VALUE ? -1 : best;\n    }\n\n    // ---- private: all of these run with the lock already held\n    /** Score the eligible cars and make the winner take the stop. Returns null having changed nothing on failure. */\n    private ElevatorCar choose(HallCall call) {\n        if (recallFloor != null) return null;                               // fire recall: every hall call waits\n        List<ElevatorCar> eligible = new ArrayList<>(cars.size());\n        for (ElevatorCar c : cars) if (c.inService() && c.serves(call.floor())) eligible.add(c);\n        if (eligible.isEmpty()) return null;\n        ElevatorCar chosen = dispatch.pick(eligible, call);\n        if (chosen == null || !chosen.accept(call)) return null;             // the car refused: nothing was written\n        return chosen;\n    }\n    /** Offer every waiting call to the cars again. Runs on each tick, so a returning car drains the queue. */\n    private void retryPending() {\n        for (Iterator<HallCall> it = pending.iterator(); it.hasNext(); ) {\n            HallCall call = it.next();\n            if (assigned.containsKey(call)) { it.remove(); continue; }\n            ElevatorCar chosen = choose(call);\n            if (chosen != null) { assigned.put(call, chosen.id); it.remove(); }\n        }\n    }\n    /** Tell every observer, outside the lock, from immutable snapshots. A broken panel corrupts nothing. */\n    private void publish(List<CarSnapshot> snaps) {\n        for (CarSnapshot s : snaps)\n            for (ElevatorObserver o : observers) {\n                try { o.onChange(s); } catch (RuntimeException e) { System.err.println(\"[observer failed] \" + e.getMessage()); }\n            }\n    }\n}\n\n/**\n * The buttons in a hallway: a thin actor with nothing of its own to remember. All the logic and the lock\n * live in the bank, which is exactly why many floors pressing at once is safe.\n */\nclass HallPanelButtons {\n    private final ElevatorSystem bank;\n    private final int floor;\n    HallPanelButtons(ElevatorSystem bank, int floor) { this.bank = bank; this.floor = floor; }\n    int up()   { return bank.requestHall(floor, Direction.UP); }\n    int down() { return bank.requestHall(floor, Direction.DOWN); }\n}\n\n/** The buttons inside one car: equally thin, bound to that car. Floor buttons, and the two door buttons. */\nclass CarPanelButtons {\n    private final ElevatorSystem bank;\n    private final int carId;\n    CarPanelButtons(ElevatorSystem bank, int carId) { this.bank = bank; this.carId = carId; }\n    void press(int destination) { bank.requestCar(carId, destination); }\n    /** The OPEN button: hold the doors for this many ticks more. False while the doors are shut. */\n    boolean holdDoor(int extraTicks) { return bank.holdDoors(carId, extraTicks); }\n    /** The CLOSE button: stop waiting and let the car move off. False while the doors are shut. */\n    boolean closeDoor()              { return bank.closeDoors(carId); }\n}\n\n/**\n * Proof it works: a sweep that picks up an on-the-way call, the two door buttons, a car that does not turn\n * early, a rejected floor, an emergency stop whose calls survive, and forty riders on one button at once.\n */\npublic class Main {\n    /** The simulated clock: one tick is half a second of building time, so waiting times are real numbers. */\n    static final long[] NOW = { 0L };\n    static void tick(ElevatorSystem bank) { NOW[0] += 500; bank.tick(); }\n\n    public static void main(String[] args) throws Exception {\n        int bottom = 0, top = 19;                                   // a twenty-floor tower, lobby = 0\n        List<ElevatorCar> cars = new ArrayList<>();                 // six cars: one in the lobby, five parked high overnight\n        cars.add(new ElevatorCar(0, bottom, top, 0));\n        for (int i = 1; i <= 5; i++) cars.add(new ElevatorCar(i, bottom, top, 14 + i));\n        ElevatorSystem bank = new ElevatorSystem(cars, bottom, top);\n        bank.configure(new NearestCarStrategy(bottom, top), new FixedDwellPolicy(1));\n        bank.setClock(() -> NOW[0]);\n        bank.addObserver(new DisplayPanel(0));                      // the panel above car 0's doors\n        MaintenanceMonitor monitor = new MaintenanceMonitor(12);\n        bank.addObserver(monitor);\n\n        // a rider on floor 2 wants to go up: the bank sends the nearest car, which climbs from the lobby to fetch them\n        int sent = bank.requestHall(2, Direction.UP);\n        System.out.println(\"hall call 2 UP -> car \" + sent\n                         + \" (estimate \" + bank.estimateFloorsToServe(new HallCall(2, Direction.UP)) + \" floors of travel)\");\n        for (int t = 0; t < 3; t++) tick(bank);                     // climb, climb, open the doors at floor 2\n\n        // the two door buttons: OPEN holds the doors (so does the sensor when somebody stands in them), CLOSE ends the wait\n        CarPanelButtons inside = new CarPanelButtons(bank, sent);\n        System.out.println(\"doors \" + bank.car(sent).doors() + \" at floor \" + bank.car(sent).floor()\n                         + \"; OPEN pressed: \" + inside.holdDoor(2));\n        tick(bank);\n        System.out.println(\"a tick later still at floor \" + bank.car(sent).floor()\n                         + \" with doors \" + bank.car(sent).doors() + \"; CLOSE pressed: \" + inside.closeDoor());\n        tick(bank);                                                 // the doors shut and the car is free again\n\n        bank.requestCar(sent, 12);                                  // the rider presses 12 inside\n        bank.requestHall(6, Direction.UP);                          // someone on 6 also wants up: the same car takes it en route\n        List<Integer> trace = new ArrayList<>();\n        for (int t = 0; t < 2; t++) { tick(bank); trace.add(bank.car(sent).floor()); }\n        bank.requestCar(sent, 1);                                   // now a rider wants the lobby: the sweep must not turn yet\n        for (int t = 0; t < 26; t++) { tick(bank); trace.add(bank.car(sent).floor()); }\n        System.out.println(\"car \" + sent + \" floor trace: \" + trace);\n        System.out.println(\"outstanding hall calls: \" + bank.outstandingCalls()\n                         + \", average wait \" + bank.averageWaitMs() + \" ms\");\n        System.out.println(\"car \" + sent + \" travelled \" + monitor.floorsTravelled(sent) + \" floors\");\n\n        try { bank.requestHall(99, Direction.UP); }                 // there is no floor 99\n        catch (IllegalArgumentException e) { System.out.println(\"expected: \" + e.getMessage()); }\n\n        // an emergency stop must not swallow the calls the car owed\n        int victim = bank.requestHall(17, Direction.DOWN);\n        System.out.println(\"hall call 17 DOWN -> car \" + victim);\n        bank.takeOutOfService(victim);\n        System.out.println(\"after the emergency stop the call is waiting again: \" + bank.pendingCalls());\n        tick(bank);\n        System.out.println(\"after one tick it belongs to car \" + bank.assignedCar(new HallCall(17, Direction.DOWN)));\n\n        // the race: forty riders press UP on floor 12 at the same instant; exactly one car may be sent\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<Integer>> presses = new ArrayList<>();\n        for (int i = 0; i < 40; i++) presses.add(pool.submit(() -> { go.await(); return bank.requestHall(12, Direction.UP); }));\n        go.countDown();\n        Set<Integer> answered = new HashSet<>();\n        for (Future<Integer> f : presses) answered.add(f.get());\n        pool.shutdown();\n        System.out.println(\"forty presses answered by cars \" + answered + \" (must be exactly one car)\");\n        if (answered.size() != 1) throw new AssertionError(\"the same hall call was dispatched twice!\");\n        int winner = answered.iterator().next();\n        long twelves = bank.car(winner).stops().floorsOn(Direction.UP).stream().filter(f -> f == 12).count();\n        System.out.println(\"floor 12 appears \" + twelves + \" time(s) in car \" + winner + \"'s up leg (must be 1)\");\n    }\n}\n", "f1": "import java.util.*;\nimport java.util.concurrent.*;\n\n// Reference code for every follow-up on page 05. Each block is a new class behind an existing seam: a rule\n// (DispatchStrategy, DoorPolicy), a listener (ElevatorObserver) or a caller. The one exception is fire recall,\n// whose mode lives in the bank (recallAll / endRecall), because only the bank can switch off the car buttons.\n\n// ---- ext: the 9am rule change. Idle cars wait in the lobby and up-calls from the lobby win.\n/**\n * Morning rush: bias the score so an idle car near the lobby wins an up-call, and a car already carrying a\n * crowd loses. Wraps the normal rule instead of replacing it, so the physics of the estimate stay shared.\n */\nclass UpPeakDispatch implements DispatchStrategy {\n    private final int bottom, top;\n    UpPeakDispatch(int bottom, int top) { this.bottom = bottom; this.top = top; }\n\n    public ElevatorCar pick(List<ElevatorCar> cars, HallCall call) {\n        ElevatorCar best = null; int bestScore = Integer.MAX_VALUE;\n        for (ElevatorCar c : cars) {\n            CarSnapshot s = c.snapshot();\n            int score = NearestCarStrategy.cost(s, call, bottom, top);     // reuse the normal estimate\n            if (call.floor() == bottom && s.heading() == Direction.IDLE) score -= 5;   // park the idle ones at the lobby\n            if (s.pendingStops() > 4) score += 3;                                      // spread the crowd\n            if (score < bestScore) { best = c; bestScore = score; }\n        }\n        return best;\n    }\n}\n\n// ---- ext: where idle cars wait. At nine in the morning they should wait in the lobby, not where they stopped.\n/**\n * Parking. Any car standing still away from the lobby is sent back to it, so the next up-call is answered\n * from floor 0 instead of floor 14. It is a caller, not a rule: it presses the ordinary car button, so the\n * bank and the car do not change. Run it on a timer, or after each tick.\n */\nclass LobbyParking {\n    private final ElevatorSystem bank;\n    private final int lobbyFloor;\n    LobbyParking(ElevatorSystem bank, int lobbyFloor) { this.bank = bank; this.lobbyFloor = lobbyFloor; }\n\n    /** Sends every idle car that is not already at the lobby back to it; returns how many were sent. */\n    int park() {\n        int sent = 0;\n        for (CarSnapshot s : bank.snapshots())                 // snapshots need no lock; each press takes it once\n            if (s.state() == CarState.IDLE && s.floor() != lobbyFloor) {\n                try { bank.requestCar(s.carId(), lobbyFloor); sent++; }\n                catch (IllegalStateException e) { /* a zoned car that cannot reach the lobby, or a fire recall */ }\n            }\n        return sent;\n    }\n}\n\n// ---- ext: energy at night. Starting a parked car costs more power than letting a moving one carry on.\n/**\n * Energy-saving scoring: the normal estimate plus a penalty for any car standing still, whose motor would have\n * to start. A car already on its way wins the call even when a parked car is a floor or two closer.\n */\nclass EnergySavingDispatch implements DispatchStrategy {\n    private final int bottom, top, wakePenalty;\n    EnergySavingDispatch(int bottom, int top, int wakePenalty) { this.bottom = bottom; this.top = top; this.wakePenalty = wakePenalty; }\n\n    public ElevatorCar pick(List<ElevatorCar> cars, HallCall call) {\n        ElevatorCar best = null; int bestScore = Integer.MAX_VALUE;\n        for (ElevatorCar c : cars) {\n            CarSnapshot s = c.snapshot();\n            int score = NearestCarStrategy.cost(s, call, bottom, top);\n            if (s.heading() == Direction.IDLE) score += wakePenalty;                 // a parked car's motor must start\n            if (score < bestScore) { best = c; bestScore = score; }\n        }\n        return best;\n    }\n}\n\n// ---- ext: express and zoned cars. A decorator: filter the candidates, then defer to any scorer.\n/**\n * Zoning: cars are allowed only inside their zone, so a candidate outside it is dropped before scoring. The\n * scoring rule underneath is untouched, and the LOOK sweep never hears about zones at all.\n */\nclass ZonedDispatch implements DispatchStrategy {\n    private final DispatchStrategy base;\n    private final Map<Integer, int[]> zones;                       // carId -> {lowest floor, highest floor}\n    ZonedDispatch(DispatchStrategy base, Map<Integer, int[]> zones) { this.base = base; this.zones = zones; }\n\n    public ElevatorCar pick(List<ElevatorCar> cars, HallCall call) {\n        List<ElevatorCar> allowed = new ArrayList<>();\n        for (ElevatorCar c : cars) {\n            int[] z = zones.get(c.id);\n            if (z == null || (call.floor() >= z[0] && call.floor() <= z[1])) allowed.add(c);\n        }\n        return allowed.isEmpty() ? null : base.pick(allowed, call);   // null = nobody may take it; it waits\n    }\n}\n\n// ---- ext: capacity and weight. Load is tracked beside the car so the base stays capacity-free.\n/** Riders and kilos on board one car, and the two limits that stop it answering another hall call. */\nclass CarLoad {\n    final int maxRiders, maxKg;\n    private int riders, kg;\n    CarLoad(int maxRiders, int maxKg) { this.maxRiders = maxRiders; this.maxKg = maxKg; }\n    /** Someone stepped in. Returns false, changing nothing, if the car is already at a limit. */\n    synchronized boolean board(int weightKg) {\n        if (riders + 1 > maxRiders || kg + weightKg > maxKg) return false;\n        riders++; kg += weightKg; return true;\n    }\n    synchronized void leave(int weightKg) { riders = Math.max(0, riders - 1); kg = Math.max(0, kg - weightKg); }\n    synchronized boolean full() { return riders >= maxRiders || kg >= maxKg; }\n}\n\n/** Skip cars that are full, then defer to the rule underneath. A full car keeps sweeping; it just stops answering. */\nclass CapacityAwareDispatch implements DispatchStrategy {\n    private final DispatchStrategy base;\n    private final Map<Integer, CarLoad> load;\n    CapacityAwareDispatch(DispatchStrategy base, Map<Integer, CarLoad> load) { this.base = base; this.load = load; }\n\n    public ElevatorCar pick(List<ElevatorCar> cars, HallCall call) {\n        List<ElevatorCar> roomy = new ArrayList<>();\n        for (ElevatorCar c : cars) { CarLoad l = load.get(c.id); if (l == null || !l.full()) roomy.add(c); }\n        return roomy.isEmpty() ? null : base.pick(roomy, call);\n    }\n}\n\n// ---- ext: the door rule changes too. The lobby needs longer doors than floor seventeen.\n/** Longer dwell at the lobby, the normal dwell everywhere else. One class, one configure() line. */\nclass LobbyDwellPolicy implements DoorPolicy {\n    private final int lobbyFloor, lobbyTicks, normalTicks;\n    LobbyDwellPolicy(int lobbyFloor, int lobbyTicks, int normalTicks) {\n        this.lobbyFloor = lobbyFloor; this.lobbyTicks = lobbyTicks; this.normalTicks = normalTicks;\n    }\n    public int dwellTicks(int carId, int floor) { return floor == lobbyFloor ? lobbyTicks : normalTicks; }\n}\n\n// ---- ext: maintenance mode -- take no new calls, finish the ones owed, then go out of service\n/**\n * Maintenance that can wait for the trip to end. A draining car is left out of every dispatch, keeps serving\n * the stops it already owes, and is taken out of service as soon as its snapshot shows it standing idle with\n * nothing owed. A filter plus a listener: the bank and the car do not change.\n */\nclass DrainForService implements DispatchStrategy, ElevatorObserver {\n    private final DispatchStrategy base;\n    private final ElevatorSystem bank;\n    private final Set<Integer> draining = ConcurrentHashMap.newKeySet();\n    DrainForService(DispatchStrategy base, ElevatorSystem bank) { this.base = base; this.bank = bank; }\n\n    /** Ask for maintenance on this car: from now on it takes no new hall call. */\n    void drain(int carId) { draining.add(carId); }\n\n    /** Leave out the draining cars, then defer to the rule underneath. Null when nobody is left: the call waits. */\n    public ElevatorCar pick(List<ElevatorCar> cars, HallCall call) {\n        List<ElevatorCar> others = new ArrayList<>();\n        for (ElevatorCar c : cars) if (!draining.contains(c.id)) others.add(c);\n        return others.isEmpty() ? null : base.pick(others, call);\n    }\n    /** Its last stop is served and its doors are shut: now take it out, with nothing owed and nobody waiting. */\n    public void onChange(CarSnapshot s) {\n        if (s.state() == CarState.IDLE && s.pendingStops() == 0 && draining.remove(s.carId()))\n            bank.takeOutOfService(s.carId());\n    }\n}\n\n// ---- ext: destination dispatch -- riders type where they are going in the lobby\n/** One rider's whole trip, typed on the keypad before boarding. */\nrecord Trip(int from, int to) {\n    /** The way this rider travels, which is also the leg their pickup goes on. */\n    Direction dir() { return to > from ? Direction.UP : Direction.DOWN; }\n}\n\n/**\n * Destination dispatch. The keypad knows each rider's floor before they board, so a rider is sent to a car\n * that is already collecting riders for that floor, and told which car to stand at. The pickup is an ordinary\n * hall call; the destination is pressed only when that car opens at the pickup going the rider's way, so the\n * car can never serve it before the rider is on board. A rule for the choice and a listener for the boarding.\n */\nclass DestinationDispatch implements DispatchStrategy, ElevatorObserver {\n    private final ElevatorSystem bank;\n    private final DispatchStrategy base;\n    private final Map<HallCall, Integer> typed = new ConcurrentHashMap<>();        // pickup being placed -> its destination\n    private final Map<Integer, List<Trip>> waiting = new ConcurrentHashMap<>();    // carId -> riders told to board it\n    DestinationDispatch(ElevatorSystem bank, DispatchStrategy base) { this.bank = bank; this.base = base; }\n\n    /** The keypad: \"I am on 0, I want 12\". Returns the car to stand at, or -1 when no car can take it yet. */\n    int enter(int from, int to) {\n        Trip trip = new Trip(from, to);\n        typed.put(new HallCall(from, trip.dir()), to);\n        int carId = bank.requestHall(from, trip.dir());\n        if (carId >= 0) waiting.computeIfAbsent(carId, k -> new CopyOnWriteArrayList<>()).add(trip);\n        return carId;\n    }\n\n    /** A car already collecting riders for this floor, going this way; failing that, the normal rule. */\n    public ElevatorCar pick(List<ElevatorCar> cars, HallCall call) {\n        Integer to = typed.get(call);\n        if (to != null)\n            for (ElevatorCar c : cars)\n                for (Trip t : waiting.getOrDefault(c.id, List.of()))\n                    if (t.to() == to && t.dir() == call.direction()) return c;     // same floor, same way: same car\n        return base.pick(cars, call);\n    }\n\n    /** Boarding: the car opened at a waiting rider's floor, going their way. Now, and only now, press their floor. */\n    public void onChange(CarSnapshot s) {\n        if (s.doors() != DoorState.OPEN) return;\n        List<Trip> list = waiting.getOrDefault(s.carId(), List.of());\n        for (Trip t : list)\n            if (t.from() == s.floor() && (s.heading() == t.dir() || s.heading() == Direction.IDLE) && list.remove(t))\n                bank.requestCar(s.carId(), t.to());            // remove() first, so a second listener call presses nothing\n    }\n}\n\n// ---- ext: request feasibility -- nobody may sit through more than five stops (Microsoft's version)\n/**\n * One car's plan for the sweep it is on, one per direction: the floors it will stop at and the trips it has\n * taken. A new trip is taken only if, with its two floors added, nobody (the newcomer included) sits through\n * more than maxStops stops and no more than maxRiders are ever on board. Stops already made stay in the plan\n * until the sweep ends, so a rider who has sat through three is not promised five more.\n */\nclass StopBudget {\n    private final int maxStops, maxRiders;\n    private final TreeSet<Integer> stops = new TreeSet<>();      // every floor this sweep stops at: made or planned\n    private final List<Trip> trips = new ArrayList<>();          // every trip taken on this sweep\n    StopBudget(int maxStops, int maxRiders) { this.maxStops = maxStops; this.maxRiders = maxRiders; }\n\n    /** Check and record in one synchronized step. False changes nothing: the rider waits for the next sweep. */\n    synchronized boolean tryTake(Trip next) {\n        TreeSet<Integer> after = new TreeSet<>(stops); after.add(next.from()); after.add(next.to());\n        List<Trip> all = new ArrayList<>(trips); all.add(next);\n        for (Trip r : all) if (stopsRidden(after, r) > maxStops) return false;\n        for (int f : after) if (onBoardLeaving(all, f) > maxRiders) return false;\n        stops.addAll(after); trips.add(next);\n        return true;\n    }\n    /** The car has turned round: this sweep is over and everyone on it has got out. */\n    synchronized void sweepEnded() { stops.clear(); trips.clear(); }\n\n    /** Stops a rider sits through: every stop after the one they board at, up to and including their own. */\n    static int stopsRidden(TreeSet<Integer> stops, Trip r) {\n        return r.dir() == Direction.UP ? stops.subSet(r.from(), false, r.to(), true).size()\n                                       : stops.subSet(r.to(), true, r.from(), false).size();\n    }\n    /** Riders inside as the car leaves floor f: boarded there or earlier, getting out further on. */\n    private static int onBoardLeaving(List<Trip> trips, int f) {\n        int n = 0;\n        for (Trip r : trips)\n            if (r.dir() == Direction.UP ? r.from() <= f && f < r.to() : r.to() < f && f <= r.from()) n++;\n        return n;\n    }\n}\n\n// ---- ext: fire service -- every car to the recall floor; no call is answered and the buttons inside are off\n/**\n * The fire panel's side of recall. The bank owns the mode, because only the bank can hold every hall call AND\n * switch off the buttons inside the cars in one locked step; this class engages it, watches for every car to\n * arrive, and releases it. The waiting calls survive the whole thing and are offered again after the release.\n */\nclass FireService {\n    private final ElevatorSystem bank;\n    private final int recallFloor;\n    FireService(ElevatorSystem bank, int recallFloor) { this.bank = bank; this.recallFloor = recallFloor; }\n\n    /** Engage: every car drops its stops and heads for the recall floor; hall presses wait, car buttons do nothing. */\n    void engage() { bank.recallAll(recallFloor); }\n    /** True once every car still in service stands at the recall floor. */\n    boolean complete() {\n        for (CarSnapshot s : bank.snapshots())\n            if (s.state() != CarState.MAINTENANCE && s.floor() != recallFloor) return false;\n        return true;\n    }\n    /** Release: the buttons work again and the queued calls are picked up on the next tick. */\n    void release() { bank.endRecall(); }\n}\n\n// ---- ext: the cheap query -- \"how long until a car reaches 7?\" answered off snapshots, no lock\n/**\n * The lobby board. It asks the bank's estimate, which scores the published snapshots of the cars that could\n * take that call with the dispatcher's own cost, and turns floors into milliseconds. O(cars), no lock, no scan.\n */\nclass EtaBoard {\n    private final ElevatorSystem bank;\n    private final long msPerFloor;\n    EtaBoard(ElevatorSystem bank, long msPerFloor) { this.bank = bank; this.msPerFloor = msPerFloor; }\n\n    /** Milliseconds of travel until a car could open its doors there, or -1 when no car can come. */\n    long etaMs(int floor, Direction direction) {\n        int floors = bank.estimateFloorsToServe(new HallCall(floor, direction));   // snapshots and final fields only\n        return floors < 0 ? -1 : floors * msPerFloor;\n    }\n}\n\n// ---- ext: persistence -- the assignment index becomes a repository, and the claim becomes a conditional UPDATE\n/**\n * Who owes which call, behind an interface so it can live in a database when one controller serves forty\n * buildings. claim() is the whole invariant: exactly one car may win a call.\n */\ninterface AssignmentRepository {\n    /** Claim the call for this car. False means another controller already claimed it; nothing was written. */\n    boolean claim(HallCall call, int carId);\n    /** Give the call up: it was served, or the car died. */\n    void release(HallCall call);\n    /** Which car owes it, if any. */\n    Optional<Integer> owner(HallCall call);\n}\n\n/** The in-memory one. putIfAbsent is a compare-and-set (write only if nobody has, in one step): the lock's idea again. */\nclass InMemoryAssignmentRepository implements AssignmentRepository {\n    private final Map<HallCall, Integer> rows = new ConcurrentHashMap<>();\n    public boolean claim(HallCall call, int carId) { return rows.putIfAbsent(call, carId) == null; }\n    public void release(HallCall call)             { rows.remove(call); }\n    public Optional<Integer> owner(HallCall call)  { return Optional.ofNullable(rows.get(call)); }\n}\n// the same claim in SQL, once two controllers run on two machines:\n// UPDATE hall_call SET car_id = ? WHERE building = ? AND floor = ? AND direction = ? AND car_id IS NULL;\n//   -- 1 row updated = this controller won it;  0 rows = the other one did, and it must pick again\n\n/** Runs every extension once so the file is proven, not just written. */\nclass ExtDemo {\n    public static void main(String[] args) {\n        int bottom = 0, top = 19;\n        List<ElevatorCar> cars = List.of(new ElevatorCar(0, bottom, top, 0),\n                                         new ElevatorCar(1, bottom, top, 9),\n                                         new ElevatorCar(2, bottom, top, 18));\n        ElevatorSystem bank = new ElevatorSystem(cars, bottom, top);\n        DispatchStrategy nearest = new NearestCarStrategy(bottom, top);\n\n        // 1. the 9am rule change: a new class and one configure line\n        bank.configure(new UpPeakDispatch(bottom, top), new LobbyDwellPolicy(0, 3, 1));\n        System.out.println(\"up-peak: a lobby up-call went to car \" + bank.requestHall(0, Direction.UP));\n\n        // 2. parking: the idle cars go back to the lobby to wait for the rush\n        System.out.println(\"parking: idle cars sent back to the lobby = \" + new LobbyParking(bank, bottom).park());\n\n        // 2b. energy at night: a car already climbing past takes the call instead of waking a parked one\n        ElevatorSystem night = new ElevatorSystem(List.of(new ElevatorCar(0, bottom, top, 8), new ElevatorCar(1, bottom, top, 11)), bottom, top);\n        night.requestCar(0, 15); night.tick();                  // car 0 is now climbing through 9; car 1 stands at 11\n        night.configure(new EnergySavingDispatch(bottom, top, 5), new FixedDwellPolicy(1));\n        System.out.println(\"energy: 12 UP went to car \" + night.requestHall(12, Direction.UP)\n                         + \" (the nearest-car rule would wake car 1, one floor away)\");\n\n        // 3. zoning: cars 0-1 serve the low rise, car 2 the high rise\n        Map<Integer, int[]> zones = Map.of(0, new int[]{0, 9}, 1, new int[]{0, 9}, 2, new int[]{10, 19});\n        bank.configure(new ZonedDispatch(nearest, zones), new FixedDwellPolicy(1));\n        System.out.println(\"zoned: floor 15 went to car \" + bank.requestHall(15, Direction.DOWN)\n                         + \", floor 4 went to car \" + bank.requestHall(4, Direction.UP));\n\n        // 4. capacity: a full car is skipped, and the one with room answers\n        Map<Integer, CarLoad> load = new HashMap<>();\n        for (ElevatorCar c : cars) load.put(c.id, new CarLoad(8, 680));\n        while (load.get(1).board(70)) { }                         // car 1 is now full\n        bank.configure(new CapacityAwareDispatch(nearest, load), new FixedDwellPolicy(1));\n        System.out.println(\"capacity: car 1 is full, so floor 9 went to car \" + bank.requestHall(9, Direction.UP));\n\n        // 5. destination dispatch: two riders bound for 17 are grouped into one car, and both get there. A\n        //    fresh bank, so the grouping is what decides and not a hall call this demo already assigned above.\n        ElevatorSystem lobby = new ElevatorSystem(List.of(new ElevatorCar(0, bottom, top, 0),\n                                                          new ElevatorCar(1, bottom, top, 1)), bottom, top);\n        DestinationDispatch dd = new DestinationDispatch(lobby, new NearestCarStrategy(bottom, top));\n        lobby.configure(dd, new FixedDwellPolicy(1));\n        lobby.addObserver(dd);                                     // it listens for the doors, to press 17 at boarding\n        int first = dd.enter(0, 17), second = dd.enter(1, 17);\n        for (int t = 0; t < 30; t++) lobby.tick();\n        System.out.println(\"destination dispatch: riders from floors 0 and 1, both going to 17, board car \"\n                         + first + \" / \" + second + \" (must be the same car); it is now at floor \"\n                         + lobby.car(first).floor() + \" owing \" + lobby.car(first).pendingStops() + \" stops\");\n\n        // 6. request feasibility: Microsoft's example, at most five stops for anyone on board\n        StopBudget up = new StopBudget(5, 20);\n        boolean a = up.tryTake(new Trip(0, 10)), b = up.tryTake(new Trip(1, 7)), c = up.tryTake(new Trip(8, 9));\n        System.out.println(\"five-stop rule: 0->10, 1->7, 8->9 taken \" + a + \"/\" + b + \"/\" + c\n                         + \"; 4->6 taken \" + up.tryTake(new Trip(4, 6)) + \" (0->10 would sit through 7 stops)\"\n                         + \"; 7->9 taken \" + up.tryTake(new Trip(7, 9)) + \" (no new floor)\");\n\n        // 7. maintenance mode: car 2 takes no new calls, finishes what it owes, then goes out of service\n        DrainForService maintenance = new DrainForService(nearest, bank);\n        bank.configure(maintenance, new FixedDwellPolicy(1));\n        bank.addObserver(maintenance);\n        maintenance.drain(2);\n        for (int t = 0; t < 60 && bank.car(2).state() != CarState.MAINTENANCE; t++) bank.tick();\n        System.out.println(\"maintenance mode: car 2 finished its stops and is now \" + bank.car(2).state()\n                         + \" at floor \" + bank.car(2).floor());\n\n        // 8. the cheap query, off snapshots and with no lock\n        EtaBoard board = new EtaBoard(bank, 2000);\n        System.out.println(\"eta to floor 7 going up: \" + board.etaMs(7, Direction.UP) + \" ms\");\n\n        // 9. fire service: every car home, calls held, buttons inside off; then release\n        FireService fire = new FireService(bank, 0);\n        bank.requestHall(12, Direction.DOWN);\n        fire.engage();\n        System.out.println(\"fire recall engaged; calls waiting = \" + bank.pendingCalls().size());\n        try { bank.requestCar(0, 7); System.out.println(\"a car button worked during recall!\"); }\n        catch (IllegalStateException e) { System.out.println(\"during recall: \" + e.getMessage()); }\n        for (int t = 0; t < 60 && !fire.complete(); t++) bank.tick();\n        System.out.println(\"every car in service is at the recall floor: \" + fire.complete());\n        fire.release();\n        bank.tick();\n        System.out.println(\"after the release the waiting calls are being served again: \"\n                         + (bank.pendingCalls().size() < bank.outstandingCalls()));\n\n        // 10. persistence: the same claim, but a row instead of a map entry\n        AssignmentRepository repo = new InMemoryAssignmentRepository();\n        HallCall call = new HallCall(7, Direction.UP);\n        System.out.println(\"repository claim: first=\" + repo.claim(call, 1) + \" second=\" + repo.claim(call, 2)\n                         + \" owner=\" + repo.owner(call).orElse(-1));\n    }\n}\n", "f2": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n// Thirteen claims the design makes, each with the test that proves it. Every one reproduces a bug a bank of\n// lifts really has: a call sent to two cars, a car in maintenance still being fed, a button that does not exist,\n// a sweep that turns early or runs on to the top of the shaft, an emergency stop that swallows the queue, a broken\n// or out-of-order listener, a button that queues three stops, a wait time read off the wall clock, a car going up\n// that puts out the down lamp, doors that close on a rider holding OPEN, the slower car sent, a car button obeyed\n// during fire recall, and a keypad rider carried to their floor before they were even on board.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? \"PASS \" : \"FAIL \") + what);\n        if (!ok) failures++;\n    }\n    /** A fresh bank: n cars in a twenty-floor tower, all standing at the lobby unless told otherwise. */\n    static ElevatorSystem bank(int cars, int... startFloors) {\n        List<ElevatorCar> list = new ArrayList<>();\n        for (int i = 0; i < cars; i++) list.add(new ElevatorCar(i, 0, 19, i < startFloors.length ? startFloors[i] : 0));\n        ElevatorSystem b = new ElevatorSystem(list, 0, 19);\n        b.configure(new NearestCarStrategy(0, 19), new FixedDwellPolicy(1));\n        return b;\n    }\n    /** Stops owed by the whole bank. One per outstanding call is the invariant we keep checking. */\n    static int totalStops(ElevatorSystem b) {\n        int n = 0;\n        for (CarSnapshot s : b.snapshots()) n += s.pendingStops();\n        return n;\n    }\n\n    public static void main(String[] args) throws Exception {\n        // 1. forty riders press the same button at the same instant: one car, one stop, one index entry\n        ElevatorSystem b1 = bank(3, 0, 9, 18);\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<Integer>> presses = new ArrayList<>();\n        for (int i = 0; i < 40; i++) presses.add(pool.submit(() -> { go.await(); return b1.requestHall(7, Direction.UP); }));\n        go.countDown();\n        Set<Integer> answered = new HashSet<>();\n        for (Future<Integer> f : presses) answered.add(f.get());\n        check(answered.size() == 1, \"forty presses of 7 UP were answered by exactly one car \" + answered);\n        check(b1.outstandingCalls() == 1, \"the bank owes that call once, not forty times\");\n        check(totalStops(b1) == 1, \"exactly one car has floor 7 in its sweep\");\n\n        // ... and six different buttons at the same instant: each gets exactly one car, none is lost\n        CountDownLatch go2 = new CountDownLatch(1);\n        int[] floors = { 2, 4, 11, 13, 15, 17 };\n        List<Future<Integer>> six = new ArrayList<>();\n        for (int f : floors) six.add(pool.submit(() -> { go2.await(); return b1.requestHall(f, Direction.DOWN); }));\n        go2.countDown();\n        int sent = 0;\n        for (Future<Integer> f : six) if (f.get() >= 0) sent++;\n        pool.shutdown();\n        check(sent == 6 && b1.outstandingCalls() == 7, \"six simultaneous calls each got a car, none dropped\");\n        check(totalStops(b1) == 7, \"seven calls, seven stops across the bank: no call was given to two cars\");\n\n        // 2. a car in maintenance is never assigned, and with every car down the call waits instead of vanishing\n        ElevatorSystem b2 = bank(2, 5, 15);\n        b2.takeOutOfService(0);\n        check(b2.requestHall(6, Direction.UP) == 1, \"the nearest car is out of service, so car 1 takes the call\");\n        check(b2.car(0).pendingStops() == 0, \"the car in maintenance was given nothing\");\n        b2.takeOutOfService(1);\n        check(b2.requestHall(3, Direction.UP) == -1, \"with every car down the call is not dispatched\");\n        check(b2.pendingCalls().contains(new HallCall(3, Direction.UP)), \"it waits in the queue instead of being lost\");\n        check(!b2.holdDoors(0, 3) && !b2.closeDoors(0), \"the door buttons do nothing in a car that is out of service\");\n        b2.returnToService(1);\n        b2.tick();\n        check(b2.assignedCar(new HallCall(3, Direction.UP)) == 1, \"a returning car drains the queue on the next tick\");\n\n        // 3. a button that does not exist is rejected before anything is touched\n        ElevatorSystem b3 = bank(2);\n        try { b3.requestHall(99, Direction.UP); check(false, \"floor 99 must be rejected\"); }\n        catch (IllegalArgumentException e) { check(true, \"floor 99 is rejected: \" + e.getMessage()); }\n        try { b3.requestHall(-1, Direction.DOWN); check(false, \"floor -1 must be rejected\"); }\n        catch (IllegalArgumentException e) { check(true, \"floor -1 is rejected\"); }\n        try { b3.requestCar(0, 99); check(false, \"a car button for 99 must be rejected\"); }\n        catch (IllegalArgumentException e) { check(true, \"the car button for floor 99 is rejected\"); }\n        try { b3.requestHall(19, Direction.UP); check(false, \"UP on the top floor must be rejected\"); }\n        catch (IllegalArgumentException e) { check(true, \"there is no UP button on the top floor\"); }\n        try { b3.requestHall(0, Direction.DOWN); check(false, \"DOWN on the ground floor must be rejected\"); }\n        catch (IllegalArgumentException e) { check(true, \"there is no DOWN button on the ground floor\"); }\n        check(b3.outstandingCalls() == 0 && totalStops(b3) == 0, \"after five rejections no car owes anything\");\n        try { new ElevatorSystem(List.of(new ElevatorCar(1, 0, 19, 0), new ElevatorCar(0, 0, 19, 0)), 0, 19);\n              check(false, \"car ids out of order must be refused: car(1) would return the wrong car\"); }\n        catch (IllegalArgumentException e) { check(true, \"a bank whose car ids are not 0, 1, 2 ... is refused\"); }\n\n        // 4. the sweep: never turns early, never runs past its last stop (LOOK, not SCAN), never shows a\n        //    direction arrow it is not actually travelling, and serves the call behind it within one sweep\n        ElevatorSystem b4 = bank(1);\n        b4.requestHall(8, Direction.UP);\n        b4.tick(); b4.tick();                                   // the car is climbing, now at floor 2\n        b4.requestHall(1, Direction.DOWN);                      // a call behind it: it must be served last\n        int previous = b4.car(0).floor(), highest = previous, ticksToServeBoth = -1;\n        boolean reachedEight = false, turnedEarly = false, servedLobby = false, arrowLied = false;\n        for (int t = 0; t < 40; t++) {\n            b4.tick();\n            int now = b4.car(0).floor();\n            highest = Math.max(highest, now);\n            if (!reachedEight && now < previous) turnedEarly = true;\n            if (now == 8) reachedEight = true;\n            if (reachedEight && now == 1) servedLobby = true;\n            if (ticksToServeBoth < 0 && b4.outstandingCalls() == 0) ticksToServeBoth = t + 1;\n            CarSnapshot s = b4.car(0).snapshot();\n            if (s.state() == CarState.MOVING_UP   && (s.heading() != Direction.UP   || s.doors() != DoorState.CLOSED)) arrowLied = true;\n            if (s.state() == CarState.MOVING_DOWN && (s.heading() != Direction.DOWN || s.doors() != DoorState.CLOSED)) arrowLied = true;\n            previous = now;\n        }\n        check(!turnedEarly, \"the car never descended while floor 8 was still ahead of it\");\n        check(reachedEight && servedLobby, \"it served floor 8 first and only then came back down to floor 1\");\n        check(highest == 8, \"it turned at its last stop and never ran on to floor 19: LOOK, not SCAN\");\n        check(!arrowLied, \"whenever the panel showed an arrow the car was really moving that way, doors shut\");\n        check(ticksToServeBoth > 0 && ticksToServeBoth <= 2 * 19,\n              \"the call behind the car was served inside one sweep of the shaft: \" + ticksToServeBoth + \" ticks, bound 38\");\n        check(b4.outstandingCalls() == 0, \"both hall calls left the index once their doors opened\");\n\n        // 5. an emergency stop leaves the queue intact for another car to retry\n        ElevatorSystem b5 = bank(2, 16, 2);\n        int owner = b5.requestHall(17, Direction.DOWN);\n        check(owner == 0, \"the near car takes the call at floor 17\");\n        b5.takeOutOfService(owner);\n        HallCall call = new HallCall(17, Direction.DOWN);\n        check(b5.pendingCalls().contains(call), \"the emergency stop put the call back on the queue\");\n        check(b5.outstandingCalls() == 1, \"the call still exists: it was moved, not dropped\");\n        check(b5.car(owner).pendingStops() == 0, \"the stopped car owes nothing any more\");\n        b5.tick();\n        check(b5.assignedCar(call) == 1, \"one tick later the other car owes it\");\n\n        // 6. a display panel that throws cannot break dispatch or the tick\n        ElevatorSystem b6 = bank(1);\n        b6.addObserver(s -> { throw new RuntimeException(\"panel is down\"); });\n        int car = b6.requestHall(4, Direction.UP);\n        check(car == 0, \"dispatch still answered although the panel threw\");\n        for (int t = 0; t < 4; t++) b6.tick();\n        check(b6.car(0).floor() == 4, \"the car still climbed to floor 4 although the panel threw on every change\");\n\n        // ... and listeners hear after the lock, from many threads, so two snapshots can arrive in the wrong order.\n        //     Four threads press buttons while this one ticks; the maintenance count must still equal the floors moved.\n        int wrongCounts = 0;\n        for (int trial = 0; trial < 20; trial++) {\n            ElevatorSystem bo = bank(1);\n            MaintenanceMonitor monitor = new MaintenanceMonitor(1_000_000);\n            bo.addObserver(monitor);\n            AtomicBoolean stop = new AtomicBoolean();\n            ExecutorService pressers = Executors.newFixedThreadPool(4);\n            for (int p = 0; p < 4; p++) pressers.submit(() -> {\n                Random r = new Random();\n                while (!stop.get()) bo.requestHall(1 + r.nextInt(18), r.nextBoolean() ? Direction.UP : Direction.DOWN);\n                return null;\n            });\n            int moved = 0, at = 0;\n            for (int t = 0; t < 3000; t++) { bo.tick(); int f = bo.car(0).floor(); moved += Math.abs(f - at); at = f; }\n            stop.set(true); pressers.shutdown(); pressers.awaitTermination(5, TimeUnit.SECONDS);\n            bo.tick(); moved += Math.abs(bo.car(0).floor() - at);             // one last publish, after the pressers stop\n            if (monitor.floorsTravelled(0) != moved) wrongCounts++;\n        }\n        check(wrongCounts == 0, \"with presses racing the ticks, the maintenance count equals the floors really moved (20 runs)\");\n\n        // 7. pressing the same button three times is one stop and one door opening\n        ElevatorSystem b7 = bank(1);\n        b7.requestCar(0, 5); b7.requestCar(0, 5); b7.requestCar(0, 5);\n        check(b7.car(0).pendingStops() == 1, \"three presses of floor 5 are one stop\");\n        int openings = 0; DoorState was = DoorState.CLOSED;\n        for (int t = 0; t < 12; t++) {\n            b7.tick();\n            DoorState now = b7.car(0).doors();\n            if (now == DoorState.OPEN && was == DoorState.CLOSED && b7.car(0).floor() == 5) openings++;\n            was = now;\n        }\n        check(openings == 1, \"the doors opened at floor 5 exactly once\");\n\n        // 8. waiting time is read from the injected clock, not the wall clock\n        ElevatorSystem b8 = bank(1);\n        long[] now = { 0L };\n        b8.setClock(() -> now[0]);\n        b8.requestHall(3, Direction.UP);                        // pressed at t = 0\n        for (int t = 0; t < 4; t++) { now[0] += 500; b8.tick(); }   // four half-second ticks: climb, climb, climb, open\n        check(b8.averageWaitMs() == 2000.0, \"the rider waited 2000 ms by the test's clock, whatever the wall clock says\");\n\n        // 9. a car climbing serves the UP crowd on that floor only: the DOWN lamp stays lit for the next leg\n        ElevatorSystem b9 = bank(1);                            // one car, standing at the lobby\n        b9.requestHall(6, Direction.UP);                        // two people on floor 6, wanting opposite ways\n        b9.requestHall(6, Direction.DOWN);\n        check(b9.outstandingCalls() == 2, \"UP and DOWN on floor 6 are two different calls, not one\");\n        for (int t = 0; t < 20 && !(b9.car(0).floor() == 6 && b9.car(0).doors() == DoorState.OPEN); t++) b9.tick();\n        check(b9.assignedCar(new HallCall(6, Direction.UP)) < 0, \"the UP lamp on 6 went out when the doors opened\");\n        check(b9.assignedCar(new HallCall(6, Direction.DOWN)) >= 0, \"the DOWN lamp on 6 is still lit: nobody served it yet\");\n        check(b9.car(0).pendingStops() == 1, \"floor 6 is still on that car's DOWN leg\");\n        b9.tick(); b9.tick();                                   // shut the doors, turn, open again going down\n        check(b9.outstandingCalls() == 0, \"one door cycle later the same car serves the DOWN call at floor 6\");\n\n        // 10. the door buttons: OPEN holds, CLOSE lets go, and neither can touch a car that is moving\n        ElevatorSystem b10 = bank(1);\n        CarPanelButtons inside = new CarPanelButtons(b10, 0);\n        b10.requestCar(0, 4);\n        check(!inside.holdDoor(3), \"the OPEN button does nothing while the car is moving with its doors shut\");\n        for (int t = 0; t < 6 && b10.car(0).doors() != DoorState.OPEN; t++) b10.tick();\n        check(b10.car(0).floor() == 4 && b10.car(0).doors() == DoorState.OPEN, \"the doors opened at floor 4\");\n        check(inside.holdDoor(3), \"the OPEN button holds the doors there\");\n        b10.tick(); b10.tick();\n        check(b10.car(0).doors() == DoorState.OPEN && b10.car(0).floor() == 4,\n              \"two ticks later the doors are still open and the car has not moved a floor\");\n        check(inside.closeDoor(), \"the CLOSE button ends the wait\");\n        b10.tick();\n        check(b10.car(0).doors() == DoorState.CLOSED, \"the next tick shuts the doors and the sweep goes on\");\n\n        // 11. the bank sends the car that will really get there first, and the lobby board shows that car's number\n        ElevatorSystem b11 = bank(2, 10, 3);\n        b11.requestCar(0, 12); b11.requestCar(1, 0); b11.tick();   // car 0 now climbs through 11, car 1 descends through 2\n        check(b11.requestHall(8, Direction.DOWN) == 0,\n              \"8 DOWN goes to car 0 (up to the top and back: 19 floors), not car 1 (down, up, down again: 32)\");\n        CarSnapshot goingDown = new CarSnapshot(0, 1, 10, Direction.DOWN, CarState.MOVING_DOWN, DoorState.CLOSED, 1, 0);\n        check(NearestCarStrategy.cost(goingDown, new HallCall(12, Direction.UP), 0, 19) == 22,\n              \"a car going down at 10 meets an UP call at 12 after one turn: 10 floors down, 12 up\");\n        ElevatorSystem b11z = new ElevatorSystem(List.of(new ElevatorCar(0, 0, 9, 9), new ElevatorCar(1, 10, 19, 19)), 0, 19);\n        check(b11z.estimateFloorsToServe(new HallCall(12, Direction.DOWN)) == 7 && b11z.requestHall(12, Direction.DOWN) == 1,\n              \"the board says 7 floors for 12 DOWN, the high-rise car's number: the low-rise car cannot reach 12\");\n        ElevatorSystem b11e = bank(2, 8, 11);\n        b11e.requestCar(0, 15); b11e.tick();                        // car 0 climbs through 9; car 1 stands parked at 11\n        b11e.configure(new EnergySavingDispatch(0, 19, 5), new FixedDwellPolicy(1));\n        check(b11e.requestHall(12, Direction.UP) == 0, \"energy rule: the climbing car takes 12 UP (3 floors) instead of waking the parked one (1)\");\n\n        // 12. two ways out of normal service. Fire recall: every car home, calls held, the buttons inside off ...\n        ElevatorSystem b12 = bank(2, 10, 5);\n        FireService fire = new FireService(b12, 0);\n        b12.requestHall(12, Direction.DOWN);\n        fire.engage();\n        check(b12.pendingCalls().contains(new HallCall(12, Direction.DOWN)), \"recall hands the 12 DOWN call back to the queue\");\n        boolean refused = false;\n        try { b12.requestCar(0, 7); } catch (IllegalStateException e) { refused = true; }\n        check(refused, \"during recall the buttons inside a car do nothing\");\n        check(b12.requestHall(15, Direction.DOWN) == -1, \"during recall a new hall call waits instead of getting a car\");\n        boolean openedOnTheWay = false;\n        for (int t = 0; t < 40 && !fire.complete(); t++) {\n            b12.tick();\n            for (CarSnapshot s : b12.snapshots()) if (s.doors() == DoorState.OPEN && s.floor() != 0) openedOnTheWay = true;\n        }\n        check(fire.complete() && !openedOnTheWay, \"every car went straight to the recall floor and opened nowhere else\");\n        fire.release(); b12.tick();\n        check(b12.pendingCalls().isEmpty() && b12.outstandingCalls() == 2, \"after the release both held calls get a car\");\n        // ... and maintenance mode: take no new call, finish the ones owed, then go out of service\n        ElevatorSystem b12m = bank(2, 3, 10);\n        DrainForService drainRule = new DrainForService(new NearestCarStrategy(0, 19), b12m);\n        b12m.configure(drainRule, new FixedDwellPolicy(1));\n        b12m.addObserver(drainRule);\n        check(b12m.requestHall(5, Direction.UP) == 0, \"car 0 takes the call at floor 5\");\n        drainRule.drain(0);\n        check(b12m.requestHall(4, Direction.DOWN) == 1, \"car 0 is draining, so 4 DOWN goes to car 1 although car 0 is nearer\");\n        for (int t = 0; t < 20 && b12m.car(0).state() != CarState.MAINTENANCE; t++) b12m.tick();\n        check(b12m.car(0).state() == CarState.MAINTENANCE && b12m.car(0).floor() == 5\n              && b12m.assignedCar(new HallCall(5, Direction.UP)) < 0, \"car 0 served the call it owed at 5, then went out of service\");\n\n        // 13. riders who type their floor. The destination is pressed only once the rider is on board ...\n        ElevatorSystem b13 = bank(1, 15);\n        DestinationDispatch keypad = new DestinationDispatch(b13, new NearestCarStrategy(0, 19));\n        b13.configure(keypad, new FixedDwellPolicy(1));\n        b13.addObserver(keypad);\n        keypad.enter(10, 17);                                       // the car is at 15: floor 17 is nearer than the rider\n        List<Integer> opened = new ArrayList<>(); DoorState before = DoorState.CLOSED;\n        for (int t = 0; t < 40; t++) {\n            b13.tick();\n            CarSnapshot s = b13.car(0).snapshot();\n            if (s.doors() == DoorState.OPEN && before == DoorState.CLOSED) opened.add(s.floor());\n            before = s.doors();\n        }\n        check(opened.equals(List.of(10, 17)), \"the car opened at 10 to pick the rider up, then at 17 to let them out \" + opened);\n        // ... and Microsoft's rule: nobody may sit through more than five stops\n        StopBudget budget = new StopBudget(5, 20);\n        check(budget.tryTake(new Trip(0, 10)) && budget.tryTake(new Trip(1, 7)) && budget.tryTake(new Trip(8, 9)),\n              \"0->10, 1->7 and 8->9 fit: the rider from 0 sits through 1, 7, 8, 9 and 10, five stops\");\n        check(!budget.tryTake(new Trip(4, 6)), \"4->6 is refused: the rider from 0 would sit through seven stops\");\n        check(budget.tryTake(new Trip(7, 9)), \"7->9 is taken: it adds no new floor, so nobody's count changes\");\n        StopBudget roomForTwo = new StopBudget(5, 2);\n        check(roomForTwo.tryTake(new Trip(0, 10)) && roomForTwo.tryTake(new Trip(1, 7)) && !roomForTwo.tryTake(new Trip(2, 5)),\n              \"with room for two riders, a third one riding from 2 to 5 is refused\");\n\n        System.out.println(failures == 0 ? \"ALL PASS\" : failures + \" FAILED\");\n        if (failures != 0) System.exit(1);\n    }\n}\n"};
function wireCopy(root){root.querySelectorAll('button.copy').forEach(b=>{b.onclick=()=>{const key=b.dataset.key;const txt=key?RAW[key]:b.closest('.ed').querySelector('code').textContent;navigator.clipboard.writeText(txt).then(()=>{b.textContent='copied';setTimeout(()=>b.textContent='copy',1500);});};});}
const KW=/\b(abstract|boolean|break|case|catch|class|continue|default|do|double|else|enum|extends|final|finally|for|if|implements|import|int|interface|long|new|null|package|private|protected|public|return|static|super|switch|synchronized|this|throw|throws|try|void|while|var|record|true|false)\b/g;
const TY=/\b([A-Z][A-Za-z0-9]*)\b/g;
function hl(src){let inDoc=false;return src.split('\n').map((l,i)=>{let e=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const t=e.trim();let out;if(inDoc||t.startsWith('/**')){out='<span class="d">'+e+'</span>';if(t.startsWith('/**'))inDoc=!t.endsWith('*/');else if(t.endsWith('*/'))inDoc=false;}else{const parts=e.split(/(\/\/.*$|"(?:[^"\\]|\\.)*")/);out=parts.map((p,j)=>j%2?(p.startsWith('//')?'<span class="c">'+p+'</span>':'<span class="s">'+p+'</span>'):p.replace(KW,'<span class="k">$1</span>').replace(TY,'<span class="t">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>')).join('');}return '<span class="ln">'+(i+1)+'</span>'+out;}).join('\n');}
let cur=parseInt(localStorage.getItem('elevator.step')||'1',10);
const side=document.getElementById('side'),study=document.getElementById('study');
function classesSoFar_unused(n){const out=[];STEPS.filter(s=>s.id<=n&&s.code).forEach(s=>{(s.code.match(/(?:class|interface|enum)\s+([A-Z]\w*)/g)||[]).forEach(m=>out.push({name:m.split(/\s+/)[1],step:s.id}));});return out;}
function render(){
  side.innerHTML='';let g='';STEPS.forEach(s=>{if(s.stage!==g){g=s.stage;side.insertAdjacentHTML('beforeend','<div class="grp">'+g+'</div>');}side.insertAdjacentHTML('beforeend','<div class="st'+(s.id===cur?' on':s.id<cur?' done':'')+'" data-id="'+s.id+'"><span class="n">'+String(s.id).padStart(2,'0')+'</span><span>'+s.title+'</span></div>');});
  const s=STEPS[cur-1];
  study.innerHTML='<div class="hdr"><span class="stage">'+s.stage+'</span><h2>'+String(s.id).padStart(2,'0')+' &middot; '+s.title+'</h2></div>'+(s.think?'<div class="think">'+s.think+'</div>':'')+(s.body||'')+(s.code?'<div class="ed"><div class="tab"><b>'+(s.file||'Main.java')+'</b><button class="copy" data-src="ed">copy</button></div><pre><code class="java">'+hl(s.code)+'</code></pre></div>':'')+'<div class="nav"><button id="prev">&larr; prev</button><button id="next" class="pri">next &rarr;</button></div>';
  study.querySelectorAll('pre code.java').forEach(el=>{el.innerHTML=hl(el.textContent);});wireCopy(study);wireTimers(study);const miss=document.getElementById('miss');if(miss){try{miss.value=localStorage.getItem('elevator.miss')||'';}catch(e){}miss.addEventListener('input',()=>{try{localStorage.setItem('elevator.miss',miss.value);}catch(e){}});}
  document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
  document.querySelector('.wrap').classList.toggle('wide',!!s.wide);document.querySelector('.wrap').classList.toggle('code',!!s.code);localStorage.setItem('elevator.step',cur);study.scrollIntoView();
}
function go(n){if(n<1||n>STEPS.length)return;cur=n;setMode('study');render();}
side.addEventListener('click',e=>{const t=e.target.closest('.st');if(t)go(+t.dataset.id);});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
const main=document.getElementById('main');
function setMode(m){}
function wireTimers(root){root.querySelectorAll('button.timer[data-min]').forEach(b=>{const total=+b.dataset.min*60;let left=total,id=null;const show=()=>{b.textContent=(id?'':'start ')+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');};b.onclick=()=>{if(id){clearInterval(id);id=null;b.classList.remove('run');show();return;}if(left<=0)left=total;b.classList.remove('done');b.classList.add('run');id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;b.classList.remove('run');b.classList.add('done');b.textContent='time -- open the fold';}},1000);show();};show();});}
render();

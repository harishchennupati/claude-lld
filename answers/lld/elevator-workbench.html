=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(log n)</text></g><g transform=\"translate(30 70)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is anything still ahead of me?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 90 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 70)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same two sets  .higher / .lower</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 90 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 70)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(log n), no scan</text></g><g transform=\"translate(30 120)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the two legs, keyed by direction</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 140 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 120)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EnumMap&lt;Direction, NavigableSet&lt;Integer&gt;&gt;</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 140 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 120)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an array index</text></g><g transform=\"translate(30 170)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who owes this hall call?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 190 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 170)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;HallCall, carId&gt;   a record is a key</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 190 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 170)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 220)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">where is car 3 right now?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 240 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 220)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">car.snapshot(): one volatile field</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 240 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 220)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), no lock</text></g><text x=\"615\" y=\"290\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">pressing 5 three times is one stop because a set dedupes; every sweep question is a lookup, so nothing scans inside the lock</text></svg></div><div class=\"move\"><p>The table above is the whole answer; four things in it are worth saying out loud. \"Is anything still ahead of me?\" decides when to turn round, so it must never be a loop over floors: on a sorted set it is <code>higher</code> or <code>lower</code>, O(log n). An <code>EnumMap</code> is an array indexed by the enum's position, so keying the two legs by direction costs no hashing at all. A <code>HallCall</code> record gets equals and hashCode for free, so it is a map key with no work. And the two-legs shape pays for itself twice over. Because the legs are separate, a car climbing to 6 opens its doors for the people going up and clears only the up leg. The DOWN lamp on 6 stays lit, and that crowd is served on the way back down. The last row needs no lock at all: after every change a car puts a <b>snapshot</b> (an immutable copy of its floor, heading and doors) into a volatile field, which every thread reads fresh. Every scan avoided here is a scan that would otherwise have happened inside the lock.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 50)\"><rect width=\"150\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">IDLE</text><text x=\"75.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no stops owed</text></g><g transform=\"translate(240 50)\"><rect width=\"230\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"115.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MOVING_UP / DOWN</text><text x=\"115.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one floor per tick</text></g><g transform=\"translate(540 50)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DOORS_OPEN</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the car may not move</text></g><path d=\"M180 72 H240\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"210\" y=\"42\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">a stop</text><path d=\"M470 72 H540\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"505\" y=\"42\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">arrived</text><path d=\"M630 94 Q 540 150 420 94\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"525\" y=\"143\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">doors close, stops remain</text><path d=\"M700 94 C 700 195, 110 195, 105 94\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"400\" y=\"192\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">doors close, nothing owed</text><path d=\"M300 50 Q 355 8 410 50\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"355\" y=\"22\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">nothing ahead: reverse the leg -- this is LOOK</text><path d=\"M60 96 V210\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"68\" y=\"192\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">emergency stop, any state</text><g transform=\"translate(30 210)\"><rect width=\"690\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"345.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MAINTENANCE</text><text x=\"345.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an emergency stop halts the car here and hands its hall calls back to the bank's queue</text></g><rect x=\"760\" y=\"20\" width=\"450\" height=\"232\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"985\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside requestHall, and why</text><text x=\"775\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 reject a button this building has not got:</text><text x=\"775\" y=\"87\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">   floor 99, or UP on the top floor</text><text x=\"775\" y=\"108\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 already lit? return the same car, do nothing else</text><text x=\"775\" y=\"129\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 score the cars that are in service</text><text x=\"775\" y=\"150\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4 the winner TAKES THE STOP (it may refuse)</text><text x=\"775\" y=\"171\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5 only now: write down who owes the call</text><text x=\"775\" y=\"192\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a refusal leaves every set exactly as it was and</text><text x=\"775\" y=\"213\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the call waits on the queue; the next tick offers it again</text><text x=\"615\" y=\"275\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a car state plus one rule: nothing is written down until a car has actually taken the stop. An emergency stop is the same rule backwards.</text></svg></div><div class=\"move\"><p>A car is IDLE with nothing owed, MOVING_UP or MOVING_DOWN while it sweeps, DOORS_OPEN while people get in and out, and MAINTENANCE when it is pulled out of service. One rule ties the machine together: a tick is a door cycle or a floor, never both, so a car can never move with its doors open. The two door buttons are safe for the same reason: both refuse unless the doors are already open and the car is in service. The sweep turns round only when nothing is owed ahead on this leg, and that one condition is the whole algorithm. It has a name, <b>LOOK</b>: keep going the way you are pointing until your last stop on this leg, then reverse. A car that has just reversed asks the other leg about the floor it is already standing on, which is how the turning floor itself gets served instead of skipped. Then the order at the critical step, the one that decides which car owes a call. Reject a button that does not exist, return the same car if the button is already lit, score the cars in service, let the winner take the stop, and only then write down who owes it. If the car refuses, nothing has been written: the call goes on the waiting queue and the next tick offers it again. An emergency stop runs the same rule backwards: the car hands its calls back before it stops existing as far as the bank is concerned.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes dispatch happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 305\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"540\" height=\"165\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: under a microsecond (measured ~0.6)</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">look the call up in the index: is it already lit?</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">score six cars from their snapshots: a few subtractions each</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the winner inserts one floor into a TreeSet</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">write who owes it; copy six snapshots</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">a tick: six cars stepped, then waiting calls re-offered</text></g><path d=\"M570 100 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"605\" y=\"90\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"165\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: milliseconds to seconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the panel above the doors: a serial write, ~5 ms</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the maintenance monitor: counting and a log line</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the door motor: 2 seconds</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the rider walking in: 10 seconds</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">the next tick: 500 ms away</text></g><text x=\"615\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">ten buttons pressed at the same instant</text><g transform=\"translate(30 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(148 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 1 us</text></g><g transform=\"translate(266 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 2 us</text></g><g transform=\"translate(384 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 3 us</text></g><g transform=\"translate(502 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 4 us</text></g><g transform=\"translate(620 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 5 us</text></g><g transform=\"translate(738 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 6 us</text></g><g transform=\"translate(856 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 7 us</text></g><g transform=\"translate(974 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 8 us</text></g><g transform=\"translate(1092 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 9 us</text></g><text x=\"615\" y=\"290\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">call it 1 us each: the tenth rider waits about nine microseconds for the lock, then two seconds for a door. One at a time is true, and nobody can tell</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself: if every press and every tick take the same lock, is the whole building now a queue? It is, for under a microsecond each (a new hall call measured about 0.6 on a laptop), and the two cards above say exactly what sits on each side of the line. The rule behind that split is the one to say out loud: inside the lock goes only work whose cost you can count in lookups. Anything that talks to hardware, to a screen or to a person goes outside it. So when ten buttons are pressed at the same instant, the tenth rider waits about nine microseconds for the lock and then two seconds for a door to finish opening. One at a time is true, and nobody in the building can tell. The one thing inside the lock that grows with the building is the tick re-scoring every waiting call, which is why it is the first rung of the ladder in the next move.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock for six cars: is it a bottleneck?</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a hall call holds it under 1 us: one lookup, six scores, one insert</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">morning peak in a twenty-floor tower: ~3 presses a second</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">ticks: two a second, six cars, under 1 us each: ~2 us a second</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">~5 us of lock in every 1,000,000 us; two presses collide ~once a day</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">the weak spot: a tick re-scores every waiting call in the lock</text><text x=\"880\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 stop re-scoring waiting calls every tick</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">offer them again only when a car frees up or comes back into service</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 a lock per car, taken after the index lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">cars on different sweeps stop waiting for each other</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 one thread per car with a mailbox</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a press becomes a queued command; snapshots stay the only shared read</text></g></svg></div><div class=\"move\"><p>Morning peak in a twenty-floor tower is about three presses a second, and the tick runs twice a second over six cars. Call each hold one microsecond, which is generous: that is about five microseconds of lock in every million, busy one part in two hundred thousand. Two presses collide about once a day. A door cycle takes two seconds whatever the lock does, so the lock is not the thing riders feel. The ladder in the picture is written cheapest first. Rung two carries the rule that stops it going wrong: two locks are only safe if every thread takes them in the same order. So the car lock is always taken after the index lock, never before it. Rung three gives each car its own thread and a mailbox (a queue of commands only that thread reads), so nothing about a car is shared any more. Say the arithmetic before you climb any of it. A hundred cars and four hundred floors would change the answer; six cars and twenty floors do not, and climbing the ladder anyway is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 330\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two riders, one button</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two cars sent, one empty trip</text></g><path d=\"M320 44 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 24)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">index + score + accept in one locked step; test: 40 threads, one latch, one car</text></g><g transform=\"translate(30 70)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the up car puts out the down lamp</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the down crowd is left standing</text></g><path d=\"M320 90 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 70)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">opening clears only the leg being served; test: the DOWN call on 6 is still owed</text></g><g transform=\"translate(30 116)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the sweep turns early</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the top floor starves</text></g><path d=\"M320 136 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 116)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">turn only when nothing is ahead; test: the floor trace never dips first</text></g><g transform=\"translate(30 162)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the sweep runs to the top</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wasted travel: that is SCAN</text></g><path d=\"M320 182 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 162)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">turn at the LAST STOP, not the last floor; test: the car never passes floor 8</text></g><g transform=\"translate(30 208)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an emergency stop</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the queue is swallowed with the car</text></g><path d=\"M320 228 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 208)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hand the calls back; test: the call is pending, then another car owes it</text></g><g transform=\"translate(30 254)\"><rect width=\"290\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a panel throws, or hears late</text><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the tick dies, or a count grows</text></g><path d=\"M320 274 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 254)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish after unlock, catch; version + odometer; test: a throwing panel, presses racing ticks</text></g><text x=\"615\" y=\"315\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim the design makes has a failure test: FailureTests.java runs thirteen of them and must print ALL PASS</text></svg></div><div class=\"move\"><p>The six above, and six more. A car sits in maintenance (it must never be fed a call, and with every car down the call must queue rather than vanish). Someone presses floor 99, or UP on the top floor where there is no UP button (both rejected before anything is touched). Pressing the same button three times is one stop and one door opening. The OPEN button holds the doors and the car does not move; CLOSE lets it go; neither does anything while the car is travelling. And one invariant (a rule that must hold after every step) is worth testing on every tick of a long run. Whenever the panel shows an arrow, the car really is moving that way with its doors shut; a panel that lies is a bug riders see. Waiting time comes from the injected clock, so a test can say a rider waited two thousand milliseconds without sleeping. The follow-ups that make a claim have checks too, such as: the car the bank sends really is the one that arrives first, a fire recall ignores the buttons inside, and a keypad rider's floor is pressed only once they are on board. Each of these is a few lines in FailureTests.java; a design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"850\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface DispatchStrategy { ElevatorCar pick(cars, call); }  via configure()</text><text x=\"850\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">change which car answers without opening the bank</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">ZonedDispatch(base): filter the candidates, then base.pick(allowed, call)</text><text x=\"850\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">add zoning on top of any scoring rule</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">publish(snaps) after unlock; DisplayPanel and MaintenanceMonitor</text><text x=\"850\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">panels hear; the bank never knows what a screen is</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"220\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">enum CarState + step(): a door cycle OR a floor, never both</text><text x=\"850\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">driving with the doors open cannot be written</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--muted)\">Command</text><text x=\"220\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">rung 3</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--muted)\">the mailbox in move 8: a press becomes a queued object</text><text x=\"850\" y=\"189.0\" font-size=\"11\" fill=\"var(--muted)\">earned only when each car gets its own thread</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"220\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">the bank is constructed and handed in: one controller may run several banks</text><text x=\"850\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">a getInstance() would have been wrong here</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Factory, Builder, Visitor</text><text x=\"220\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">cars arrive built; a factory pays when a building is read from a config file</text><text x=\"850\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">say 'not yet, and here is what would make me'</text><text x=\"615\" y=\"275\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>The table is the answer; this paragraph is only for the two names that are <i>not</i> in the code, because saying those out loud is worth as much as the four that are. Singleton did not earn a place: one controller may run several banks in several buildings. So the bank is constructed and handed to the panels; a <code>getInstance()</code> would have made a second building impossible to test. Factory has not earned one either: cars arrive built, and it pays the day a building is read from a config file and \"freight\" has to become a constructor. Command arrives only on the third rung of move 8's ladder, when a press becomes a queued object in a car's mailbox. A pattern without a move behind it is decoration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class (each owns one state)</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">StopSet: the sweep. ElevatorCar: its own physics. ElevatorSystem: dispatch and the lock</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">up-peak = one new class + one changed configure() line</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">dispatch.pick(eligible, call);  never 'is it the zoned one?'</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">DispatchStrategy, DoorPolicy, ElevatorObserver, Clock: one method each</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">bank.setClock(() -&gt; now[0]);   bank.configure(new UpPeakDispatch(0, 19), doors)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>Read the table, not this paragraph; it is here for the one thing a table cannot show, which is where the letters pull against each other. S says split. Split far enough, and ElevatorSystem would become a dispatcher, an index and a clock keeper: three objects that all need the same lock, and would have to reach into one another to keep it honest. The invariant wins: everything one lock protects stays in one class, and S is satisfied by giving that class one job, which is owning the invariant. That trade is the answer when they ask why the bank holds so much.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">up-peak, energy, destination dispatch</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind DispatchStrategy + one configure line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a lobby kiosk, analytics, the fire panel</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer; no car and no sweep changes</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">out of service, fire recall</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new state + the one place that checks it</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">MAINTENANCE on the car; the recall mode on the bank, checked by dispatch and the car buttons</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across cars</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a zone must always keep one car free</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">both claims inside the SAME locked step: all or nothing</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">forty buildings, one controller</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the index behind a repository interface; the claim becomes</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE hall_call SET car_id=? WHERE floor=? AND car_id IS NULL: the database's compare-and-set</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 5 + this one</text><text x=\"615\" y=\"310\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the cars and the sweep do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>Every twist an interviewer has ever added to this problem is one of the five rows above, so the useful skill is saying which one it is before you start typing. The last row is the only one that is not obvious. The index goes behind a repository (an interface a database can sit behind). Once two controllers share a bank, the claim that today is a put under a lock becomes a conditional update: set the car id on that call's row where it is still null. One row updated means you won it; zero means somebody else did. That is the database's compare-and-set, the same idea as the lock. For all five rows the cars and the sweep do not change, which is the test that the derivation was right; page 05 has working code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 840\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M250 65.0L300 65.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"275.0\" y=\"60.0\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">presses</text><path d=\"M250 193.0L300 193.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"275.0\" y=\"188.0\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">presses</text><path d=\"M455.0 334L455.0 360\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"461.0\" y=\"351.0\" font-size=\"10.5\" fill=\"var(--muted)\">cars 1..*</text><path d=\"M455.0 642L455.0 670\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#u ction, TreeSet&gt;</text><line x1=\"0\" y1=\"48\" x2=\"310\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">add(leg, floor) / clear(leg, floor)</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">servesOnLeg(floor, leg): boolean</text><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">hasStopAhead(from, leg): boolean</text><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">chooseDirection(from): Direction</text></g><g transform=\"translate(680 20)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DispatchStrategy</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">pick(cars, call): ElevatorCar</text></g><g transform=\"translate(680 110)\"><rect width=\"250\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">NearestCarStrategy</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">bottom, top: int</text><line x1=\"0\" y1=\"48\" x2=\"250\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">pick(): the lowest cost</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">cost(snap, call, lo, hi): int</text></g><g transform=\"translate(680 235)\"><rect width=\"250\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" 11.5\" fill=\"var(--text)\">dwellTicks(carId, floor): int</text></g><g transform=\"translate(680 545)\"><rect width=\"250\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FixedDwellPolicy</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">+ LobbyDwellPolicy:</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">&nbsp;&nbsp; 3 ticks at the lobby</text><line x1=\"0\" y1=\"64\" x2=\"250\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">dwellTicks(): the same everywhere</text></g><g transform=\"translate(680 645)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Clock</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">nowMs(): long</text></g><g transform=\"translate(970 20)\"><rect width=\"250\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;record&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">HallCall</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">floor: int</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">direction: Direction</text></g><g transform=\"translate(970 120)\"><rect width=\"250\" height=\"130\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;record&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CarSnapshot</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">carId, floor: int</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">version: long (+1 per change)</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--muted)\">heading: Direction</text><text x=\"8\" y=\"95\" font-size=\"11.5\" fill=\"var(--muted)\">state: CarState</text><text x=\"8\" y=\"111\" font-size=\"11.5\" fill=\"var(--muted)\">doors: DoorState</text><text x=\"8\" y=\"127\" font-size=\"11.5\" fill=\"var(--muted)\">pendingStops, floorsMoved: int</text></g><g transform=\"translate(970 270)\"><rect width=\"250\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Direction</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">UP, DOWN, IDLE</text><line x1=\"0\" y1=\"56\" x2=\"250\" y2=\"56\" stroke=\"var(--line)\"/><text x=\"8\" y=\"69\" font-size=\"11.5\" fill=\"var(--text)\">opposite() / delta()</text></g><g transform=\"translate(970 380)\"><rect width=\"250\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CarState</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">IDLE, MOVING_UP, MOVING_DOWN,</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">DOORS_OPEN, MAINTENANCE</text></g><g transform=\"translate(970 480)\"><rect width=\"250\" height=\"50\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DoorState</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">OPEN, CLOSED</text></g><g><path d=\"M20 815L64 815\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"819\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 815L284 815\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"819\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 815L504 815\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"819\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 815L684 815\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"819\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 815L904 815\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"819\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;record&raquo; = immutable data; &laquo;enum&raquo; = a fixed list of values; &laquo;extension&raquo; = it lives in Extensions.java on page 04, not in Main.java, and a \"+\" line names its siblings there). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the bank owns the cars, a car owns its stop set. Plain arrow = references: the bank keys its index by a hall call, a car publishes a snapshot. Dashed green = handed in through <code>configure()</code>. Dotted blue = notifies. <b>Where state lives:</b> the car has its floor, its heading, its doors and its two sorted legs, and nothing else in the system may write them. The bank has the cars, the index of who owes which call, the queue of calls with no car yet, the injected rules, the fire-recall mode and the one lock. A snapshot is a dead copy that anyone may read from any thread. Its version goes up by one on every change, so a listener can tell a late copy from a fresh one. The three enums on the right are named in the fields beside them. On the next step this diagram stays open in a second tab while you read the code.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does and what it guarantees; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an ExtDemo main that runs them all) and FailureTests.java (thirteen claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * Which way a rider wants to go, and which leg of the sweep a car is on. An enum, not a boolean, so\n * &quot;up and down at the same time&quot; cannot be written down.\n */\nenum Direction {\n    UP, DOWN, IDLE;\n    /** The other leg of the sweep. IDLE has no opposite and returns itself. */\n    Direction opposite() { return this == UP ? DOWN : this == DOWN ? UP : IDLE; }\n    /** +1 going up, -1 going down, 0 standing still. Used to move exactly one floor per tick. */\n    int delta()          { return this == UP ? 1 : this == DOWN ? -1 : 0; }\n}\n\n/** The doors. A tick is a door cycle OR one floor of travel, never both; this enum is how that is checked. */\nenum DoorState { OPEN, CLOSED }\n\n/**\n * A car&#x27;s life: standing still, sweeping one way, letting people in and out, or out of service.\n * MAINTENANCE is a dead end until someone returns the car to service.\n */\nenum CarState { IDLE, MOVING_UP, MOVING_DOWN, DOORS_OPEN, MAINTENANCE }\n\n/**\n * The button in the hallway: &quot;I am on this floor and I want to go that way.&quot; It belongs to the whole bank,\n * so any car may answer it; the direction is what makes dispatch possible.\n */\nrecord HallCall(int floor, Direction direction) {\n    HallCall {\n        if (direction == Direction.IDLE) throw new IllegalArgumentException(&quot;a hall call is UP or DOWN, never IDLE&quot;);\n    }\n}\n\n/**\n * An immutable published view of one car: what a panel or the dispatcher reads without touching, or\n * locking, the car&#x27;s live state. A reader sees a whole consistent car, never a torn mix of fields.\n * version goes up by one on every change, so a listener that hears two snapshots in the wrong order can keep\n * the newer one; floorsMoved is the car&#x27;s own odometer, counted by the car itself as it moves.\n */\nrecord CarSnapshot(int carId, long version, int floor, Direction heading, CarState state, DoorState doors,\n                   int pendingStops, int floorsMoved) {}\n\n/** Where time comes from. Injected so tests can advance it by hand and waiting times are replayable. */\ninterface Clock { long nowMs(); }\n\n/**\n * The stops a car still owes, split by the leg that will serve them: one sorted set for floors taken on the\n * way up, one for floors taken on the way down. Every sweep question is a TreeSet lookup, never a scan.\n */\nclass StopSet {\n    private final EnumMap&lt;Direction, NavigableSet&lt;Integer&gt;&gt; legs = new EnumMap&lt;&gt;(Direction.class);\n\n    StopSet() {\n        legs.put(Direction.UP, new TreeSet&lt;&gt;());       // floors served while climbing\n        legs.put(Direction.DOWN, new TreeSet&lt;&gt;());     // floors served while descending\n    }\n\n    /** Remember a floor on one leg. A set, so pressing the same button three times is one stop. */\n    void add(Direction leg, int floor) {\n        if (leg == Direction.IDLE) throw new IllegalArgumentException(&quot;a stop belongs to the UP leg or the DOWN leg&quot;);\n        legs.get(leg).add(floor);\n    }\n    /** Forget a floor on one leg; called when the doors open there. */\n    void clear(Direction leg, int floor) { legs.get(leg).remove(floor); }\n    /** Drop every stop, both legs. Used only by an emergency stop. */\n    void clearAll()                      { for (NavigableSet&lt;Integer&gt; s : legs.values()) s.clear(); }\n\n    boolean isEmpty() { return legs.get(Direction.UP).isEmpty() &amp;&amp; legs.get(Direction.DOWN).isEmpty(); }\n    int size()        { return legs.get(Direction.UP).size() + legs.get(Direction.DOWN).size(); }\n\n    /** Is this floor a stop on the leg the car is sweeping right now? O(log n). */\n    boolean servesOnLeg(int floor, Direction leg) { return leg != Direction.IDLE &amp;&amp; legs.get(leg).contains(floor); }\n    /** Is this floor a stop on either leg? Asked only when the car is standing still. */\n    boolean hasAnyAt(int floor) { return legs.get(Direction.UP).contains(floor) || legs.get(Direction.DOWN).contains(floor); }\n\n    /**\n     * Is anything still owed beyond this floor in this direction, on either leg? This single question is\n     * what makes the sweep a sweep: while it is true the car may not turn around. O(log n).\n     */\n    boolean hasStopAhead(int from, Direction leg) {\n        NavigableSet&lt;Integer&gt; up = legs.get(Direction.UP), down = legs.get(Direction.DOWN);\n        return leg == Direction.UP ? (up.higher(from) != null || down.higher(from) != null)\n                                   : (up.lower(from)  != null || down.lower(from)  != null);\n    }\n\n    /** From a standstill, head toward the nearest pending stop on either side; ties go up. */\n    Direction chooseDirection(int from) {\n        Integer above = minOf(legs.get(Direction.UP).higher(from), legs.get(Direction.DOWN).higher(from));\n        Integer below = maxOf(legs.get(Direction.UP).lower(from),  legs.get(Direction.DOWN).lower(from));\n        if (above == null &amp;&amp; below == null) return Direction.IDLE;\n        if (above == null) return Direction.DOWN;\n        if (below == null) return Direction.UP;\n        return (above - from) &lt;= (from - below) ? Direction.UP : Direction.DOWN;\n    }\n    /** A copy of one leg, for tests and displays. */\n    Set&lt;Integer&gt; floorsOn(Direction leg) { return new TreeSet&lt;&gt;(legs.get(leg)); }\n\n    // written as ifs on purpose: `a == null ? b : Math.min(a, b)` makes the conditional&#x27;s type int,\n    // which unboxes the null branch and throws NullPointerException.\n    private static Integer minOf(Integer a, Integer b) {\n        if (a == null) return b;\n        if (b == null) return a;\n        return a &lt;= b ? a : b;\n    }\n    private static Integer maxOf(Integer a, Integer b) {\n        if (a == null) return b;\n        if (b == null) return a;\n        return a &gt;= b ? a : b;\n    }\n}\n\n/**\n * One car: where it is, which way it is sweeping, its doors, and the stops it owes. Every field is written\n * only under the bank&#x27;s lock; readers take the immutable snapshot instead.\n */\nclass ElevatorCar {\n    final int id;\n    final int bottomFloor, topFloor;                 // this car&#x27;s servable range: express cars get a narrow one\n    private int floor;\n    private Direction heading = Direction.IDLE;\n    private CarState state   = CarState.IDLE;\n    private DoorState doors  = DoorState.CLOSED;\n    private final StopSet stops = new StopSet();\n    private final Set&lt;HallCall&gt; held = new HashSet&lt;&gt;();   // hall calls this car owes; handed back if it dies\n    private int dwellLeft = 0;                            // ticks the doors still stay open\n    private long version = 0;                             // one more on every change; stamped into each snapshot\n    private int floorsMoved = 0;                          // the odometer: floors this car has travelled\n    private volatile CarSnapshot published;               // the lock-free read for panels and estimates\n\n    ElevatorCar(int id, int bottomFloor, int topFloor, int startFloor) {\n        this.id = id; this.bottomFloor = bottomFloor; this.topFloor = topFloor; this.floor = startFloor;\n        republish();\n    }\n\n    /** The last published view. Safe to read from any thread without the bank&#x27;s lock. */\n    CarSnapshot snapshot()  { return published; }\n    int floor()             { return floor; }\n    Direction heading()     { return heading; }\n    CarState state()        { return state; }\n    DoorState doors()       { return doors; }\n    int pendingStops()      { return stops.size(); }\n    StopSet stops()         { return stops; }\n    /** False only while the car is out of service; the dispatcher filters on this. */\n    boolean inService()     { return state != CarState.MAINTENANCE; }\n    /** Can this car reach that floor at all? An express or zoned car says no to most of the building. */\n    boolean serves(int f)   { return f &gt;= bottomFloor &amp;&amp; f &lt;= topFloor; }\n\n    /**\n     * Take a hall call into the sweep. Returns false, having changed nothing, if the car cannot have it:\n     * out of service, or the floor is outside its range. This is the step the bank commits on.\n     */\n    boolean accept(HallCall call) {\n        if (!inService() || !serves(call.floor())) return false;\n        stops.add(call.direction(), call.floor());     // the UP button goes on the up leg, the DOWN button on the down leg\n        held.add(call);\n        republish();\n        return true;\n    }\n\n    /**\n     * A rider inside presses a floor. It joins the leg that reaches it from where the car is now; pressing\n     * it again changes nothing. Returns false if the car cannot serve that floor.\n     */\n    boolean pressFloor(int destination) {\n        if (!inService() || !serves(destination)) return false;\n        Direction leg = destination &gt; floor ? Direction.UP\n                      : destination &lt; floor ? Direction.DOWN\n                      : (heading == Direction.DOWN ? Direction.DOWN : Direction.UP);   // already here: open on this leg\n        stops.add(leg, destination);\n        republish();\n        return true;\n    }\n\n    /**\n     * One tick of physics: a door cycle, or one floor, or a turn plus one of those. Returns the hall calls\n     * this car finished in this tick so the bank can drop them from its index. Called under the bank&#x27;s lock.\n     */\n    List&lt;HallCall&gt; step(DoorPolicy policy) {\n        if (state == CarState.MAINTENANCE) return List.of();\n\n        if (doors == DoorState.OPEN) {                       // the doors own this tick; the car does not move\n            if (--dwellLeft &gt; 0) { republish(); return List.of(); }\n            doors = DoorState.CLOSED;\n            if (stops.isEmpty()) { heading = Direction.IDLE; state = CarState.IDLE; }\n            else {\n                // choose the leg for the next tick HERE, so the arrow on the panel is never a lie\n                if (heading == Direction.IDLE) heading = stops.chooseDirection(floor);\n                else if (!stops.servesOnLeg(floor, heading) &amp;&amp; !stops.hasStopAhead(floor, heading))\n                    heading = heading.opposite();            // nothing left ahead on this leg: the sweep turns here\n                state = heading == Direction.UP   ? CarState.MOVING_UP\n                      : heading == Direction.DOWN ? CarState.MOVING_DOWN : CarState.IDLE;\n            }\n            republish();\n            return List.of();\n        }\n        if (stops.isEmpty()) {                               // nothing owed: stand still\n            heading = Direction.IDLE; state = CarState.IDLE; republish(); return List.of();\n        }\n        if (heading == Direction.IDLE) {\n            if (stops.hasAnyAt(floor)) return open(policy, null);      // standing on a stop: serve both lamps\n            heading = stops.chooseDirection(floor);\n            if (heading == Direction.IDLE) { state = CarState.IDLE; republish(); return List.of(); }\n        }\n        // LOOK: turn around only when nothing is owed ahead on this leg. This one line is the whole algorithm.\n        if (!stops.servesOnLeg(floor, heading) &amp;&amp; !stops.hasStopAhead(floor, heading))\n            heading = heading.opposite();\n        if (stops.servesOnLeg(floor, heading)) return open(policy, heading);   // covers the turn floor too\n\n        floor += heading.delta();                            // one floor, and nothing else, this tick\n        floorsMoved++;\n        state = heading == Direction.UP ? CarState.MOVING_UP : CarState.MOVING_DOWN;\n        republish();\n        return List.of();\n    }\n\n    /** Open the doors and clear the floor from the leg being served (null = both legs, for an idle car). */\n    private List&lt;HallCall&gt; open(DoorPolicy policy, Direction leg) {\n        doors = DoorState.OPEN;\n        state = CarState.DOORS_OPEN;\n        dwellLeft = Math.max(1, policy.dwellTicks(id, floor));\n        List&lt;HallCall&gt; served = new ArrayList&lt;&gt;(2);\n        for (Direction d : leg == null ? List.of(Direction.UP, Direction.DOWN) : List.of(leg)) {\n            stops.clear(d, floor);\n            HallCall done = new HallCall(floor, d);\n            if (held.remove(done)) served.add(done);\n        }\n        republish();\n        return served;\n    }\n\n    /**\n     * The OPEN button inside the car, and the sensor that fires when somebody stands in the doorway: keep the\n     * doors open for a few ticks more. Does nothing if the doors are shut, so a rider can never stop a car\n     * that is moving, or if the car is out of service. Returns whether it held the doors.\n     */\n    boolean holdDoors(int extraTicks) {\n        if (doors != DoorState.OPEN || state == CarState.MAINTENANCE) return false;\n        dwellLeft = Math.max(dwellLeft, Math.max(1, extraTicks));\n        return true;                                        // nothing published changed: open before, open now\n    }\n\n    /**\n     * The CLOSE button: end the wait now, so the next tick shuts the doors and the sweep goes on. Does\n     * nothing if the doors are shut, or if the car is out of service (its doors stay open for the engineer).\n     */\n    boolean closeDoorsNow() {\n        if (doors != DoorState.OPEN || state == CarState.MAINTENANCE) return false;\n        dwellLeft = 1;                                      // one tick left, which the close branch above spends\n        return true;\n    }\n\n    /**\n     * Emergency stop or maintenance: halt here with the doors open, drop the stops, and hand back every hall\n     * call still owed so the bank can give them to another car. Nothing is lost.\n     */\n    List&lt;HallCall&gt; goOutOfService() {\n        List&lt;HallCall&gt; owed = dropStops();\n        heading = Direction.IDLE;\n        doors = DoorState.OPEN;                             // riders get out here\n        state = CarState.MAINTENANCE;\n        dwellLeft = 0;\n        republish();\n        return owed;\n    }\n    /**\n     * Forget every stop and hand back the hall calls still owed, staying in service. Used by an emergency\n     * stop and by fire recall; the bank is what decides where those calls go next.\n     */\n    List&lt;HallCall&gt; dropStops() {\n        List&lt;HallCall&gt; owed = new ArrayList&lt;&gt;(held);\n        held.clear();\n        stops.clearAll();\n        republish();\n        return owed;\n    }\n\n    /** Back in service, empty, standing still where it stopped. */\n    void returnToService() {\n        if (state != CarState.MAINTENANCE) return;\n        doors = DoorState.CLOSED; state = CarState.IDLE; heading = Direction.IDLE;\n        republish();\n    }\n\n    /** Take a fresh immutable picture after every mutation. Readers see whole cars, never half-written ones. */\n    private void republish() {\n        published = new CarSnapshot(id, ++version, floor, heading, state, doors, stops.size(), floorsMoved);\n    }\n}\n\n// &quot;they will change which car answers&quot; -&gt; hide it behind an interface -&gt; Strategy\n/**\n * Which car answers a hall call. The rule that changes every time an interviewer changes their mind, so it\n * is handed in, never built by the bank. Gets only the cars that are eligible; may return null for none.\n */\ninterface DispatchStrategy { ElevatorCar pick(List&lt;ElevatorCar&gt; cars, HallCall call); }\n\n/**\n * Send the car that would reach the caller soonest, counting a sweep the car must finish first. Ties go to\n * the lowest car id so a bank is deterministic and testable.\n */\nclass NearestCarStrategy implements DispatchStrategy {\n    private final int bottom, top;\n    NearestCarStrategy(int bottom, int top) { this.bottom = bottom; this.top = top

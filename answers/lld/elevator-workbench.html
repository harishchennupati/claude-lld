.d{color:#7fa66f;font-style:italic} .right-uml{margin:0} .right-uml svg{width:100%;height:auto} .move{margin:0 22px 18px} .move h3{margin:0 0 6px;font-size:14.5px} .move p{margin:6px 0 0;line-height:1.6} .fullboard{margin:0 22px 14px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px} .fullboard svg{width:100%;height:auto;display:block} .req{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 22px 18px} .req>div{background:var(--bg3);border-radius:8px;padding:16px 20px 18px} .req b{color:var(--acc)} .req ul{margin:6px 0 0;padding-left:18px} .req li{font-size:13.5px;line-height:1.55;margin:5px 0} table.ask{margin:0 0 6px} table.ask th{font-size:12px;color:var(--acc);font-weight:600;padding:8px 10px} table.ask td{font-size:13px;line-height:1.5;padding:9px 10px} table.ask td:first-child{color:var(--text)} table.ask td:not(:first-child){color:var(--muted)} .move h3{margin-top:10px} .grade{margin:0 22px 14px;background:var(--bg3);border-left:3px solid var(--acc);padding:10px 14px;border-radius:0 6px 6px 0} .grade b{color:var(--acc)} .wrap.wide .right{display:none}
.k{color:#c792ea} .s{color:#c3e88d} .c{color:#5c6773;font-style:italic} .n{color:#f78c6c} .t{color:#82aaff}

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design the lifts in an office tower. A handful of cars, twenty floors, buttons in the hallways and buttons inside each car. Riders should not wait long and a car should not bounce up and down. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>A tower with twenty floors and six lift cars sharing one lobby. A group of cars that share a lobby is called a <b>bank</b>, and one piece of software runs the whole bank. There are two different buttons, and telling them apart is most of the design. The UP or DOWN button in a hallway belongs to the bank, because any car may answer it. The floor button inside a car is bound to that one car and carries no direction at all. When a hallway button is pressed, the bank picks a car and gives it that stop. The car then drives itself, opening its doors at every floor it owes on the <b>leg</b> it is sweeping. A leg is one half of a round trip: the floors it will serve while climbing, or the floors it will serve while coming down. A car turns round only when nothing is left ahead of it. A display panel above each door shows where its car is, and a maintenance monitor counts the floors travelled. Many riders press at the same instant, so one hall call must be answered by exactly one car and never by two. A car taken out of service mid-sweep must hand back the calls it owed rather than swallow them.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that presses buttons, ticks a simulated clock and prints where each car went. The interviewer is watching for, in this order: the questions you ask before typing; which classes exist and which one owns which state; a hall call and a car call working end to end; how a car chooses its next stop, and why that is a sweep rather than first-come-first-served; what happens when two riders press the same button at the same instant; where the rules that will change (which car answers, how long the doors stay open) live, so a change is a new class and not an edit; what happens to the queue when a car dies mid-sweep. Then the twists: express zones (cars that serve only some floors), capacity and weight, and destination dispatch (riders type their floor in the lobby and are told which car to take). After those: a cap on the stops any one rider sits through, maintenance and fire recall, many buildings.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 455\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"80\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">hall call</text><g transform=\"translate(150 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a rider presses UP on 2</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a floor and a direction</text></g><path d=\"M400 57 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">score the cars in service</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">floors of travel, sweep included</text></g><path d=\"M670 57 H690\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(690 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">that car takes floor 2</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">into its up leg; the bank records it</text></g><path d=\"M940 57 H960\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(960 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the panel updates</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where that car is now</text></g><text x=\"80\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">the sweep</text><g transform=\"translate(150 165)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one tick of the world</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one floor, or one door cycle</text></g><path d=\"M400 192 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 165)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a stop on this leg?</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">open; the call leaves the index</text></g><path d=\"M670 192 H690\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(690 165)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the rider presses 12 inside</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">bound to this car only</text></g><path d=\"M940 192 H960\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(960 165)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">nothing left ahead: turn</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the other leg is served next</text></g><text x=\"80\" y=\"331\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">a car stops</text><g transform=\"translate(150 300)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">car 3 is taken out</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a fault, or the engineer's key</text></g><path d=\"M400 327 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 300)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">it drops its stops, doors open</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the riders inside get out here</text></g><path d=\"M670 327 H690\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(690 300)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">its calls go back on the queue</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nothing is lost</text></g><path d=\"M940 327 H960\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(960 300)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the next tick re-offers them</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">another car takes them</text></g><path d=\"M545 84 V95\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 95)\"><rect width=\"250\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">no car can take it: it waits</text></g><text x=\"150\" y=\"245\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">inside the car there are two more buttons: OPEN holds the doors, CLOSE ends the wait, and neither may move a car</text><text x=\"80\" y=\"400\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">query</text><text x=\"150\" y=\"400\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, without scanning anybody's stops: where is every car?  how long until one reaches floor 7?</text><text x=\"615\" y=\"440\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">many riders press at the same instant: one hall call must be answered by exactly one car, and never half-assigned</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr>\n<tr><td>How many cars and floors, and can every car reach every floor?</td><td>Six cars, twenty floors, every car everywhere</td><td>A floor range on the car, and the zoned twist (moves 1, 12)</td></tr>\n<tr><td>How does a car pick its next stop: first come first served, or a sweep?</td><td>A sweep, and it turns only when nothing is left ahead</td><td>Two sorted sets per car and the one turn rule (moves 5, 6)</td></tr>\n<tr><td>What are we optimising: waiting time, travel time or energy?</td><td>Waiting time, and say the estimate out loud</td><td>The cost function behind the dispatch interface (move 3)</td></tr>\n<tr><td>Once a call is given to a car, is it stuck there?</td><td>Yes: the car that takes it keeps it. Moving it later is a follow-up</td><td>One index entry per call, written once (moves 4, 6)</td></tr>\n<tr><td>Ticks or real time? Is a floor one step and a door another?</td><td>A tick: one floor, or one door cycle, never both</td><td>The state machine, the door buttons, tests with no sleeps (moves 6, 9)</td></tr>\n<tr><td>Do buttons fire from many threads at the same instant?</td><td>Yes</td><td>One lock in the bank; the panels stay thin callers (moves 4, 7)</td></tr>\n<tr><td>Capacity and weight, out of service, fire recall?</td><td>Out of scope, named</td><td>Each is one of the five twist moves (move 12)</td></tr>\n<tr><td>One building, in memory, one process?</td><td>Yes</td><td>No repository yet (an interface a database can sit behind); a follow-up adds one (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>A hall call (a floor and a direction) goes to one car; a car call (a floor pressed inside) goes to that car only.</li>\n<li>A car sweeps: it keeps going one way, opens at every stop it owes on that leg, and turns only when nothing is left ahead.</li>\n<li>A car climbing past floor 6 serves the people there who want to go up; the DOWN lamp on 6 stays lit for the way back.</li>\n<li>One tick moves each car one floor or cycles its doors, never both.</li>\n<li>The OPEN and CLOSE buttons inside a car change how long the doors stay open, and can never move a car.</li>\n<li>Which car answers is a rule that can be swapped mid-round; so is how long the doors stay open.</li>\n<li>A car can be taken out of service, and the calls it owed must not be lost.</li>\n<li>Panels and a maintenance monitor are told whenever a car changes.</li>\n<li>Answer \"where is every car?\" and \"how long until one reaches floor 7?\" without scanning anybody's stops.</li>\n<li>Reject a button the building does not have: floor 99, and UP on the top floor.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Many riders press at the same instant: one hall call is answered by exactly one car.</li>\n<li>No sweep question may scan: every one of them is a lookup on a sorted set, O(log n).</li>\n<li>Once a car has a call, it opens its doors there within one sweep of the shaft: at most 38 floors here.</li>\n<li>The dispatch rule and the door rule are swappable without touching a car.</li>\n<li>One source of truth for who owes which call: the bank's index.</li>\n<li>Nothing half-done: if no car takes a call it waits on a queue and is offered again on the next tick.</li>\n<li>Time is handed in, so waits are replayable and no test sleeps.</li>\n<li>In memory, one building, one process (say it; a follow-up adds persistence).</li></ul></div></div>\n<div class=\"move\"><h3>One morning, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">08:15:00.0  floor 2 presses UP</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">cars stand at 0, and 15 to 19</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">estimates: 2 floors, or 13 and up</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">car 0 is sent, and recorded</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">car 0 up leg: {2}</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">08:15:01.5  car 0 opens at 2</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the call leaves the index</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">waited 1500 ms by the clock</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the rider presses 12 inside</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">car 0 up leg: {12}</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">08:15:02.5  floor 6 presses UP</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">car 0 is at 2, owing 12: 4 floors</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the nearest other car: 9 floors</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">car 0 takes it on the way</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">car 0 up leg: {6, 12}</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">08:15:03.5  a rider presses 1</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">car 0 is at 4: 1 joins the DOWN leg</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">12 is still ahead, so no turn</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">6, then 12, then down to 1</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">trace: 3 4 5 6 6 6 .. 12 12 12 .. 1</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> one building, in memory, one process; a tick is one floor or one door cycle, never both; a car keeps the call it took; the two door buttons change the wait at a floor and nothing else; ties go to the lowest car id, so the same presses always send the same car. Named as out of scope: capacity and weight, express zones, destination dispatch, a stop limit per rider, maintenance and fire recall, moving a call to a different car, persistence; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (a lift bank, a parking lot, BookMyShow, Splitwise) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a RIDER presses a HALL BUTTON on a FLOOR; the BANK sends a CAR; the car works through its STOPS; the DOORS open; a PANEL shows where it is</text><g transform=\"translate(30 110)\"><rect width=\"210\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"105.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ElevatorSystem</text><text x=\"105.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the cars, the calls, the lock</text></g><path d=\"M135.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(250 110)\"><rect width=\"200\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ElevatorCar</text><text x=\"100.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">floor, heading, doors</text></g><path d=\"M350.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 110)\"><rect width=\"180\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">StopSet</text><text x=\"90.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two sorted sets</text></g><path d=\"M560.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(670 110)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">HallCall</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">floor + direction</text></g><path d=\"M750.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(850 110)\"><rect width=\"170\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"85.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Hall button</text><text x=\"85.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: a caller</text></g><path d=\"M935.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1040 110)\"><rect width=\"170\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"85.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Panel</text><text x=\"85.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a listener, not a model</text></g><path d=\"M1125.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = has its own state, becomes a class.   dashed = no state of its own: a caller or a listener</text></svg></div><div class=\"move\"><p>A car has a floor, a direction, doors and the stops it owes: a class. Those stops are not a plain list, and the questions asked of them are the whole algorithm, so they get a class of their own: StopSet. A hall call is a floor plus a direction and nothing else, so it is a small immutable record (it never changes once made), which also makes it a free map key. The bank holds the cars, the index of who owes which call and the lock: a class, and the only writer. A hall button remembers nothing, so it is a thin caller, not a model, and a floor is just an integer. The panel holds no state the system owns, so it is a listener.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 285\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press UP on floor 7</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 46 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 24)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ElevatorSystem  (cars + the call index + lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 46 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">bank.requestHall(7, UP)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 80)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press 12 inside car 0</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 102 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 80)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ElevatorCar  (owns its two stop sets)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 102 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 80)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">car.pressFloor(12)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 136)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">move a floor, or cycle the doors</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 158 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 136)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ElevatorCar  (floor, heading, doors)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 158 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">car.step(doorPolicy)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 192)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">decide which car answers</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 214 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 192)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">nobody: it is a rule, not state</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 214 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 192)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">strategy.pick(cars, call)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"270\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb whose state is spread over two classes goes to the class that owns both: the bank owns the cars and the index, so dispatch is its method</text></svg></div><div class=\"move\"><p>\"Press UP on floor 7\" touches the cars, the index and the lock at once, and only the bank sees all three, so it is <code>bank.requestHall(7, UP)</code>. \"Press 12 inside car 0\" touches one car's stop sets, so it is <code>car.pressFloor(12)</code>. \"Move a floor, or cycle the doors\" touches that car's floor, heading and doors, so it is <code>car.step(policy)</code>. Notice that there are two different decisions here, with two different owners. <b>Which car answers</b> a hall call is the bank's decision, and it is the one an interviewer keeps changing. <b>Where this car goes next</b> is the car's own, and it never changes. \"Decide which car answers\" touches no state at all: it only reads. That is the tell that it is a rule rather than a method, and move 3 takes it away into an interface. This is how a bank of small cars plus one orchestrator (the one class that coordinates the others) appears without anyone planning an architecture.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 90)\"><rect width=\"220\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ElevatorSystem</text><text x=\"110.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(dispatch, doors)</text></g><path d=\"M250 135 H330 V46 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DispatchStrategy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nearest today, up-peak at nine</text></g><g transform=\"translate(760 24)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">NearestCarStrategy / UpPeakDispatch / ZonedDispatch</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 46 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 135 H330 V106 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 84)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DoorPolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one tick now, three at the lobby</text></g><g transform=\"translate(760 84)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FixedDwellPolicy / LobbyDwellPolicy</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 106 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 135 H330 V166 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 144)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ElevatorObserver</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who wants to know a car moved</text></g><g transform=\"translate(760 144)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DisplayPanel / MaintenanceMonitor</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 166 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 135 H330 V226 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 204)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the tick now, a real clock later</text></g><g transform=\"translate(760 204)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the test's clock / System::currentTimeMillis</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 226 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"285\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. the bank never builds these, so a new rule is a new class and one changed line</text></svg></div><div class=\"move\"><p>Four things in this system will change, and none of them is the sweep: which car answers, how long the doors stay open, who wants to know that a car moved, and where time comes from. Each becomes a one-method interface the bank is <i>given</i> in <code>configure()</code> and never builds. That is why swapping one is a new class and a changed line, not an edit inside the bank. This is also where the patterns come from, not the other way round. A swappable rule behind an interface is <b>Strategy</b>. A rule that filters the candidates and then defers to the old one (zoning over nearest) is <b>Decorator</b>. A bank that announces 'this car changed' to whoever subscribed, without knowing what a screen is, is <b>Observer</b>. I write them; I do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"170\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rider A</text><text x=\"85.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">presses 7 UP</text></g><g transform=\"translate(30 110)\"><rect width=\"170\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rider B</text><text x=\"85.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">presses 7 UP</text></g><g transform=\"translate(340 70)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">nobody owes 7 UP</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">yet</text></g><path d=\"M200 52 H340 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M200 132 H340 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"270\" y=\"40\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads</text><text x=\"270\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads</text><rect x=\"550\" y=\"20\" width=\"300\" height=\"145\" rx=\"6\" fill=\"none\" stroke=\"#f38ba8\" stroke-dasharray=\"4 3\"/><text x=\"700\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#f38ba8\">the gap</text><text x=\"700\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#f38ba8\">both saw it unowed, both dispatch:</text><text x=\"700\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#f38ba8\">two cars sent to floor 7,</text><text x=\"700\" y=\"110\" text-anchor=\"middle\" font-size=\"11\" fill=\"#f38ba8\">one arrives to an empty hallway</text><text x=\"700\" y=\"145\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: look up, score, take, record: ONE step</text><g transform=\"translate(880 40)\"><rect width=\"320\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ElevatorSystem.lock</text><text x=\"160.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">check the index, score, accept, record</text></g><text x=\"1040\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock lives where the shared state lives</text><text x=\"1040\" y=\"185\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">panels are told after unlock, never inside it</text></svg></div><div class=\"move\"><p>Two riders press UP on floor 7 in the same millisecond. Both look at the index, both see that nobody owes 7 UP, and both dispatch: two cars drive to floor 7 and one of them arrives to an empty hallway. The gap is between \"nobody owes it\" and \"this car owes it\". So the lookup, the scoring, the car taking the stop and the write into the index must be one step under one lock, in the class that owns all of it: the bank. The second press then finds the call already lit and is handed back the same car, which is what a real lift does. Anything that only listens, like the panel, is called after the lock is released and never inside it.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers without scanning.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0

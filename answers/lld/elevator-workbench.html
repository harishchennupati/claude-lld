lt;&gt;();\n        for (int i = 0; i &lt; 40; i++) presses.add(pool.submit(() -&gt; { go.await(); return b1.requestHall(7, Direction.UP); }));\n        go.countDown();\n        Set&lt;Integer&gt; answered = new HashSet&lt;&gt;();\n        for (Future&lt;Integer&gt; f : presses) answered.add(f.get());\n        check(answered.size() == 1, &quot;forty presses of 7 UP were answered by exactly one car &quot; + answered);\n        check(b1.outstandingCalls() == 1, &quot;the bank owes that call once, not forty times&quot;);\n        check(totalStops(b1) == 1, &quot;exactly one car has floor 7 in its sweep&quot;);\n\n        // ... and six different buttons at the same instant: each gets exactly one car, none is lost\n        CountDownLatch go2 = new CountDownLatch(1);\n        int[] floors = { 2, 4, 11, 13, 15, 17 };\n        List&lt;Future&lt;Integer&gt;&gt; six = new ArrayList&lt;&gt;();\n        for (int f : floors) six.add(pool.submit(() -&gt; { go2.await(); return b1.requestHall(f, Direction.DOWN); }));\n        go2.countDown();\n        int sent = 0;\n        for (Future&lt;Integer&gt; f : six) if (f.get() &gt;= 0) sent++;\n        pool.shutdown();\n        check(sent == 6 &amp;&amp; b1.outstandingCalls() == 7, &quot;six simultaneous calls each got a car, none dropped&quot;);\n        check(totalStops(b1) == 7, &quot;seven calls, seven stops across the bank: no call was given to two cars&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>3 &middot; Which scheduling algorithm is this: first-come-first-served, SCAN, or LOOK? Why not the other two?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>LOOK, and the difference from the other two is one condition. Take a car at floor 5 heading up, with buttons pressed in the order 9, then 6, then 2. First-come-first-served serves them in that order: it climbs past floor 6 without stopping, opens at 9, comes back down to 6, then carries on to 2. Everyone rides longer, and the rider on 6 watches a car go by. SCAN sweeps end to end, like the arm of an old hard disk: it opens at 6, then 9, then carries on to floor 19 before reversing. No pass is wasted, but the car always runs the full height of the building. LOOK is SCAN that turns at its last stop instead of the last floor: 6, then 9, then straight back down to 2. In this code that turn is <code>hasStopAhead</code>: the car reverses only when neither leg owes anything beyond where it is standing. Because the stops are two sorted sets, that question is one <code>higher</code> or <code>lower</code> lookup, not a loop over floors. The failure test proves it: a car sent to floor 8 turns at 8 and never runs on to 19.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Is anything still owed beyond this floor in this direction, on either leg? This single question is\n     * what makes the sweep a sweep: while it is true the car may not turn around. O(log n).\n     */\n    boolean hasStopAhead(int from, Direction leg) {\n        NavigableSet&lt;Integer&gt; up = legs.get(Direction.UP), down = legs.get(Direction.DOWN);\n        return leg == Direction.UP ? (up.higher(from) != null || down.higher(from) != null)\n                                   : (up.lower(from)  != null || down.lower(from)  != null);\n    }\n\n        // LOOK: turn around only when nothing is owed ahead on this leg. This one line is the whole algorithm.\n        if (!stops.servesOnLeg(floor, heading) &amp;&amp; !stops.hasStopAhead(floor, heading))\n            heading = heading.opposite();\n        if (stops.servesOnLeg(floor, heading)) return open(policy, heading);   // covers the turn floor too\n\n// car at 5 heading up; buttons pressed in the order 9, then 6, then 2.  [n] = the doors open there\n//   FCFS  5 6 7 8 [9] 8 7 [6] 5 4 3 [2]     passes 6 without stopping, then has to come back for it\n//   SCAN  5 [6] 7 8 [9] 10 .. 19 .. [2]     no wasted pass, but always runs to the end of the shaft\n//   LOOK  5 [6] 7 8 [9] 8 7 6 .. [2]        SCAN that turns at its last stop: what this code does\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; A car is climbing to floor 6 for someone who pressed UP. Somebody else on 6 pressed DOWN. Do its doors open, and what happens to the lamp?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The doors open, because the doors always open for whoever is on that floor; what must not happen is that the DOWN lamp goes out. The two are different calls, HallCall(6, UP) and HallCall(6, DOWN), so they are different keys in the bank's index and they sit on different legs of the car's stop set. When the car opens while climbing, it clears floor 6 from the <i>up</i> leg only and hands back only HallCall(6, UP). The DOWN call is still owed, still in the index, and still on the down leg. The car finishes its climb, turns, comes back to 6 and opens again for the people going down. That is the whole reason the stop set is two sets keyed by direction rather than one set of floors.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /** Open the doors and clear the floor from the leg being served (null = both legs, for an idle car). */\n    private List&lt;HallCall&gt; open(DoorPolicy policy, Direction leg) {\n        doors = DoorState.OPEN;\n        state = CarState.DOORS_OPEN;\n        dwellLeft = Math.max(1, policy.dwellTicks(id, floor));\n        List&lt;HallCall&gt; served = new ArrayList&lt;&gt;(2);\n        for (Direction d : leg == null ? List.of(Direction.UP, Direction.DOWN) : List.of(leg)) {\n            stops.clear(d, floor);\n            HallCall done = new HallCall(floor, d);\n            if (held.remove(done)) served.add(done);\n        }\n        republish();\n        return served;\n    }\n\n        // 9. a car climbing serves the UP crowd on that floor only: the DOWN lamp stays lit for the next leg\n        ElevatorSystem b9 = bank(1);                            // one car, standing at the lobby\n        b9.requestHall(6, Direction.UP);                        // two people on floor 6, wanting opposite ways\n        b9.requestHall(6, Direction.DOWN);\n        check(b9.outstandingCalls() == 2, &quot;UP and DOWN on floor 6 are two different calls, not one&quot;);\n        for (int t = 0; t &lt; 20 &amp;&amp; !(b9.car(0).floor() == 6 &amp;&amp; b9.car(0).doors() == DoorState.OPEN); t++) b9.tick();\n        check(b9.assignedCar(new HallCall(6, Direction.UP)) &lt; 0, &quot;the UP lamp on 6 went out when the doors opened&quot;);\n        check(b9.assignedCar(new HallCall(6, Direction.DOWN)) &gt;= 0, &quot;the DOWN lamp on 6 is still lit: nobody served it yet&quot;);\n        check(b9.car(0).pendingStops() == 1, &quot;floor 6 is still on that car&#x27;s DOWN leg&quot;);\n        b9.tick(); b9.tick();                                   // shut the doors, turn, open again going down\n        check(b9.outstandingCalls() == 0, &quot;one door cycle later the same car serves the DOWN call at floor 6&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>5 &middot; One lock for the whole bank. Does that scale, or have you serialised the building?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Serialised means every press waits its turn in one line, and yes, it does, for under a microsecond each. It scales here, and the answer is arithmetic: about five microseconds of lock in every million, two presses colliding about once a day, against a door cycle of two seconds. Move 8 has that sum. What matters in the round is the number that would change your mind, so give it unprompted. At a hundred cars a press scores a hundred snapshots instead of six, and the tick re-scores every waiting call against all hundred: the locked section grows with cars times waiting calls. That is the point at which you climb the ladder below. Say rung two's rule out loud: two locks are only safe if every thread takes them in the same order.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// rung 1: the tick re-scores every waiting call inside the lock. Offer a waiting call again only when\n//         something changed: a car freed up, came back into service, or a new car joined the bank.\n\n// rung 2: a lock per car, always taken AFTER the index lock, so two locks can never be taken in two orders.\n//   indexLock.lock();  try { chosen = score(...); } finally { indexLock.unlock(); }\n//   chosen.lock.lock(); try { chosen.accept(call); }  finally { chosen.lock.unlock(); }\n\n// rung 3: one owning thread per car with a mailbox; a press becomes a queued command, snapshots stay the only shared read.\n//   BlockingQueue&lt;Runnable&gt; mailbox;  while (running) { mailbox.poll().run(); car.step(policy); }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; A car is stopped in the middle of a sweep. What happens to the calls it was holding? And if maintenance can wait until the trip is over?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing is lost, because the car never owned the calls on its own: the bank's index owns them and the car holds a copy. goOutOfService drops the car's stops, opens its doors where it stands, and returns every hall call it still owed. takeOutOfService then removes each of those from the index and puts it back on the waiting queue, and the next tick offers them to the cars again, so another car picks them up. The riders inside get out at the current floor, which is what the doors opening means. The gentle version is what Microsoft calls maintenance mode: take no new calls, finish the trip. DrainForService leaves the car out of every dispatch while it serves the stops it already owes. Once its snapshot shows it idle with nothing owed, the same class calls takeOutOfService.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    List&lt;HallCall&gt; goOutOfService() {\n        List&lt;HallCall&gt; owed = dropStops();\n        heading = Direction.IDLE;\n        doors = DoorState.OPEN;                             // riders get out here\n        state = CarState.MAINTENANCE;\n        dwellLeft = 0;\n        republish();\n        return owed;\n    }\n\n/**\n     * Emergency stop: the car halts where it is with its doors open and every hall call it owed goes back on\n     * the waiting queue. The queue is intact, so the next tick hands those calls to another car.\n     */\n    void takeOutOfService(int carId) {\n        List&lt;CarSnapshot&gt; snaps;\n        lock.lock();\n        try {\n            for (HallCall owed : car(carId).goOutOfService()) { assigned.remove(owed); pending.add(owed); }\n            snaps = snapshots();\n        } finally { lock.unlock(); }\n        publish(snaps);\n    }\n\n// ---- ext: maintenance mode -- take no new calls, finish the ones owed, then go out of service\n/**\n * Maintenance that can wait for the trip to end. A draining car is left out of every dispatch, keeps serving\n * the stops it already owes, and is taken out of service as soon as its snapshot shows it standing idle with\n * nothing owed. A filter plus a listener: the bank and the car do not change.\n */\nclass DrainForService implements DispatchStrategy, ElevatorObserver {\n    private final DispatchStrategy base;\n    private final ElevatorSystem bank;\n    private final Set&lt;Integer&gt; draining = ConcurrentHashMap.newKeySet();\n    DrainForService(DispatchStrategy base, ElevatorSystem bank) { this.base = base; this.bank = bank; }\n\n    /** Ask for maintenance on this car: from now on it takes no new hall call. */\n    void drain(int carId) { draining.add(carId); }\n\n    /** Leave out the draining cars, then defer to the rule underneath. Null when nobody is left: the call waits. */\n    public ElevatorCar pick(List&lt;ElevatorCar&gt; cars, HallCall call) {\n        List&lt;ElevatorCar&gt; others = new ArrayList&lt;&gt;();\n        for (ElevatorCar c : cars) if (!draining.contains(c.id)) others.add(c);\n        return others.isEmpty() ? null : base.pick(others, call);\n    }\n    /** Its last stop is served and its doors are shut: now take it out, with nothing owed and nobody waiting. */\n    public void onChange(CarSnapshot s) {\n        if (s.state() == CarState.IDLE &amp;&amp; s.pendingStops() == 0 &amp;&amp; draining.remove(s.carId()))\n            bank.takeOutOfService(s.carId());\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>7 &middot; The fire alarm goes off. Every car must go to the ground floor and ignore every button until the fire service releases it.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Recall is a mode of the whole bank, so the bank owns it. recallAll(floor) switches it on, and under the same lock every car drops its stops and is sent to that floor. The hall calls the cars owed go back on the waiting queue. While the mode is on, the dispatcher gives no car to any hall call, so every press waits on that queue, and requestCar refuses the buttons inside the cars. endRecall() switches it off, and the next tick offers the waiting calls to the cars again, so nothing pressed during the fire is lost. FireService is the fire panel's side: engage, watch until every car in service stands at the recall floor, release.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Fire recall: under the lock, every car forgets its stops and is sent to one floor, and until endRecall()\n     * no car takes a hall call (the presses wait on the queue) and the buttons inside the cars do nothing.\n     * The hall calls the cars owed go back on the queue too, so nothing is lost while the building empties.\n     */\n    void recallAll(int floor) {\n        if (floor &lt; bottomFloor || floor &gt; topFloor) throw new IllegalArgumentException(&quot;no floor &quot; + floor + &quot; in this building&quot;);\n        List&lt;CarSnapshot&gt; snaps;\n        lock.lock();\n        try {\n            recallFloor = floor;\n            for (ElevatorCar c : cars) {\n                for (HallCall owed : c.dropStops()) { assigned.remove(owed); pending.add(owed); }\n                c.pressFloor(floor);                   // straight to the car: a car out of service stays where it is\n            }\n            snaps = snapshots();\n        } finally { lock.unlock(); }\n        publish(snaps);\n    }\n    /** Fire recall is over: the buttons work again, and the next tick offers the waiting calls to the cars. */\n    void endRecall() { lock.lock(); try { recallFloor = null; } finally { lock.unlock(); } }\n\n// the two places that check the mode: requestCar(), then choose() for every hall call\nif (recallFloor != null) throw new IllegalStateException(&quot;fire recall: the buttons inside the cars are off&quot;);\nif (recallFloor != null) return null;                               // fire recall: every hall call waits\n\n// ---- ext: fire service -- every car to the recall floor; no call is answered and the buttons inside are off\n/**\n * The fire panel&#x27;s side of recall. The bank owns the mode, because only the bank can hold every hall call AND\n * switch off the buttons inside the cars in one locked step; this class engages it, watches for every car to\n * arrive, and releases it. The waiting calls survive the whole thing and are offered again after the release.\n */\nclass FireService {\n    private final ElevatorSystem bank;\n    private final int recallFloor;\n    FireService(ElevatorSystem bank, int recallFloor) { this.bank = bank; this.recallFloor = recallFloor; }\n\n    /** Engage: every car drops its stops and heads for the recall floor; hall presses wait, car buttons do nothing. */\n    void engage() { bank.recallAll(recallFloor); }\n    /** True once every car still in service stands at the recall floor. */\n    boolean complete() {\n        for (CarSnapshot s : bank.snapshots())\n            if (s.state() != CarState.MAINTENANCE &amp;&amp; s.floor() != recallFloor) return false;\n        return true;\n    }\n    /** Release: the buttons work again and the queued calls are picked up on the next tick. */\n    void release() { bank.endRecall(); }\n}\n\n        // 12. two ways out of normal service. Fire recall: every car home, calls held, the buttons inside off ...\n        ElevatorSystem b12 = bank(2, 10, 5);\n        FireService fire = new FireService(b12, 0);\n        b12.requestHall(12, Direction.DOWN);\n        fire.engage();\n        check(b12.pendingCalls().contains(new HallCall(12, Direction.DOWN)), &quot;recall hands the 12 DOWN call back to the queue&quot;);\n        boolean refused = false;\n        try { b12.requestCar(0, 7); } catch (IllegalStateException e) { refused = true; }\n        check(refused, &quot;during recall the buttons inside a car do nothing&quot;);\n        check(b12.requestHall(15, Direction.DOWN) == -1, &quot;during recall a new hall call waits instead of getting a car&quot;);\n        boolean openedOnTheWay = false;\n        for (int t = 0; t &lt; 40 &amp;&amp; !fire.complete(); t++) {\n            b12.tick();\n            for (CarSnapshot s : b12.snapshots()) if (s.doors() == DoorState.OPEN &amp;&amp; s.floor() != 0) openedOnTheWay = true;\n        }\n        check(fire.complete() &amp;&amp; !openedOnTheWay, &quot;every car went straight to the recall floor and opened nowhere else&quot;);\n        fire.release(); b12.tick();\n        check(b12.pendingCalls().isEmpty() &amp;&amp; b12.outstandingCalls() == 2, &quot;after the release both held calls get a car&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>8 &middot; Somebody presses OPEN while the doors are closing, and somebody else stands in the doorway. What do those buttons do?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both are the same thing: they add ticks to the wait at this floor. <code>holdDoors(n)</code> raises the number of ticks left before the doors shut, and <code>closeDoorsNow()</code> drops it to one so the next tick shuts them. Both refuse, changing nothing, unless the doors are already open and the car is in service. That is what stops a rider pressing OPEN in a moving car and freezing it. Nothing a panel shows changes, so neither one publishes. The door sensor that fires when someone stands in the way calls exactly the same method as the OPEN button, with a longer hold. The car does not need to know a finger from a shoulder.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * The OPEN button inside the car, and the sensor that fires when somebody stands in the doorway: keep the\n     * doors open for a few ticks more. Does nothing if the doors are shut, so a rider can never stop a car\n     * that is moving, or if the car is out of service. Returns whether it held the doors.\n     */\n    boolean holdDoors(int extraTicks) {\n        if (doors != DoorState.OPEN || state == CarState.MAINTENANCE) return false;\n        dwellLeft = Math.max(dwellLeft, Math.max(1, extraTicks));\n        return true;                                        // nothing published changed: open before, open now\n    }\n\n    /**\n     * The CLOSE button: end the wait now, so the next tick shuts the doors and the sweep goes on. Does\n     * nothing if the doors are shut, or if the car is out of service (its doors stay open for the engineer).\n     */\n    boolean closeDoorsNow() {\n        if (doors != DoorState.OPEN || state == CarState.MAINTENANCE) return false;\n        dwellLeft = 1;                                      // one tick left, which the close branch above spends\n        return true;\n    }\n\n    /**\n     * The OPEN button inside a car, and the door sensor: hold the doors for a few more ticks. Nothing that a\n     * panel displays changes, so there is nothing to publish. False means the doors were already shut, which\n     * is what pressing it in a moving car does: nothing.\n     */\n    boolean holdDoors(int carId, int extraTicks) {\n        lock.lock(); try { return car(carId).holdDoors(extraTicks); } finally { lock.unlock(); }\n    }\n    /** The CLOSE button inside a car: stop waiting, so the next tick shuts the doors. False if already shut. */\n    boolean closeDoors(int carId) {\n        lock.lock(); try { return car(carId).closeDoorsNow(); } finally { lock.unlock(); }\n    }\n\n        // 10. the door buttons: OPEN holds, CLOSE lets go, and neither can touch a car that is moving\n        ElevatorSystem b10 = bank(1);\n        CarPanelButtons inside = new CarPanelButtons(b10, 0);\n        b10.requestCar(0, 4);\n        check(!inside.holdDoor(3), &quot;the OPEN button does nothing while the car is moving with its doors shut&quot;);\n        for (int t = 0; t &lt; 6 &amp;&amp; b10.car(0).doors() != DoorState.OPEN; t++) b10.tick();\n        check(b10.car(0).floor() == 4 &amp;&amp; b10.car(0).doors() == DoorState.OPEN, &quot;the doors opened at floor 4&quot;);\n        check(inside.holdDoor(3), &quot;the OPEN button holds the doors there&quot;);\n        b10.tick(); b10.tick();\n        check(b10.car(0).doors() == DoorState.OPEN &amp;&amp; b10.car(0).floor() == 4,\n              &quot;two ticks later the doors are still open and the car has not moved a floor&quot;);\n        check(inside.closeDoor(), &quot;the CLOSE button ends the wait&quot;);\n        b10.tick();\n        check(b10.car(0).doors() == DoorState.CLOSED, &quot;the next tick shuts the doors and the sweep goes on&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>9 &middot; A rider on floor 19 presses DOWN during the morning rush. Can they wait forever?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Once a car has taken the call, the wait is bounded: the sweep never skips a stop it owes and never turns while something is ahead. The doors open there within one trip to the end of the shaft and back, at most 38 floors of travel here, and the failure test measures it. A call no car could take waits in <code>pending</code>, a LinkedHashSet (a set that keeps the order things were added), and every tick offers those calls again, oldest first. What you must name yourself is an unfair wait, not an endless one. Assignment is sticky (a call stays with the car that took it), so a call can wait on a busy car while another car stands idle. Lifting that needs a count per floor instead of a set, because the hallway and a rider inside can both want one floor. That count is also how \"cancel my floor\" works: the stop goes only when nobody wants it any more.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /** Offer every waiting call to the cars again. Runs on each tick, so a returning car drains the queue. */\n    private void retryPending() {\n        for (Iterator&lt;HallCall&gt; it = pending.iterator(); it.hasNext(); ) {\n            HallCall call = it.next();\n            if (assigned.containsKey(call)) { it.remove(); continue; }\n            ElevatorCar chosen = choose(call);\n            if (chosen != null) { assigned.put(call, chosen.id); it.remove(); }\n        }\n    }\n\n// the bound on an assigned call, proven in FailureTests test 4:\n// check(ticksToServeBoth &lt;= 2 * 19, &quot;served inside one sweep of the shaft&quot;);\n\n// lifting sticky assignment: a floor can be owed by BOTH the hallway and a rider inside, so a set is not enough\n//   Map&lt;Direction, NavigableMap&lt;Integer, Integer&gt;&gt; legs;   // floor -&gt; how many callers still want it\n//   release(call) or cancel(floor): if (--count == 0) legs.get(leg).remove(floor);   // only then does the stop go\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>10 &middot; The lobby board asks &quot;how long until a car reaches 7?&quot; a thousand times a second. Make it cheap.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No new structure and no lock. Every car republishes an immutable CarSnapshot into one volatile field after each change, so reading where all six cars are is six field reads. The board asks the bank's estimate. It skips the cars that could not take the call (out of service, or unable to reach that floor) and scores the rest with the nearest-car rule's own cost function. The board multiplies that by the time per floor. That is O(cars) with no scan of anybody's stops. At the moment of the press, the number shown is the cost of the car the nearest-car rule would send. With a different rule handed in, such as zoning, the board must ask that rule instead, or the two can disagree.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the cheap query -- &quot;how long until a car reaches 7?&quot; answered off snapshots, no lock\n/**\n * The lobby board. It asks the bank&#x27;s estimate, which scores the published snapshots of the cars that could\n * take that call with the dispatcher&#x27;s own cost, and turns floors into milliseconds. O(cars), no lock, no scan.\n */\nclass EtaBoard {\n    private final ElevatorSystem bank;\n    private final long msPerFloor;\n    EtaBoard(ElevatorSystem bank, long msPerFloor) { this.bank = bank; this.msPerFloor = msPerFloor; }\n\n    /** Milliseconds of travel until a car could open its doors there, or -1 when no car can come. */\n    long etaMs(int floor, Direction direction) {\n        int floors = bank.estimateFloorsToServe(new HallCall(floor, direction));   // snapshots and final fields only\n        return floors &lt; 0 ? -1 : floors * msPerFloor;\n    }\n}\n\n    /**\n     * Floors of travel before a car could answer that call: the nearest-car rule&#x27;s own cost, over the same\n     * cars it may choose from (in service, and able to reach that floor). -1 when no car can come, because a\n     * board must show &quot;no service&quot;, not a nonsense number. With another rule handed in, ask that rule instead.\n     */\n    int estimateFloorsToServe(HallCall call) {\n        if (recallFloor != null) return -1;                                  // fire recall: no car will come\n        int best = Integer.MAX_VALUE;\n        for (CarSnapshot s : snapshots()) {                                  // lock-free: snapshots only\n            if (s.state() == CarState.MAINTENANCE || !car(s.carId()).serves(call.floor())) continue;   // the range is final\n            best = Math.min(best, NearestCarStrategy.cost(s, call, bottomFloor, topFloor));\n        }\n        return best == Integer.MAX_VALUE ? -1 : best;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; Two twists at once: cars 1 to 3 serve the low rise and 4 to 6 the high rise, and a full car should stop answering hall calls.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both are the same move, which is the point: the interviewer is adding a <i>filter</i>, and a filter is a decorator. ZonedDispatch is handed the normal rule and a map of car to floor range. It drops every candidate whose zone does not cover the call and hands what is left to the rule underneath. CapacityAwareDispatch is handed the normal rule and a CarLoad per car, which counts riders and kilos and refuses a boarding that would pass either limit. It drops the full cars and hands the rest down. Either one may end up with nobody left, and then it returns null, which the bank already understands: the call waits on the queue instead of being forced onto the wrong car. A full car keeps sweeping and keeps serving what it already owes; it just stops being offered more. Neither the bank nor the car nor the sweep changes a line, and the two decorators stack, so zoned <i>and</i> capacity-aware is <code>new ZonedDispatch(new CapacityAwareDispatch(nearest, load), zones)</code>.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: express and zoned cars. A decorator: filter the candidates, then defer to any scorer.\n/**\n * Zoning: cars are allowed only inside their zone, so a candidate outside it is dropped before scoring. The\n * scoring rule underneath is untouched, and the LOOK sweep never hears about zones at all.\n */\nclass ZonedDispatch implements DispatchStrategy {\n    private final DispatchStrategy base;\n    private final Map&lt;Integer, int[]&gt; zones;                       // carId -&gt; {lowest floor, highest floor}\n    ZonedDispatch(DispatchStrategy base, Map&lt;Integer, int[]&gt; zones) { this.base = base; this.zones = zones; }\n\n    public ElevatorCar pick(List&lt;ElevatorCar&gt; cars, HallCall call) {\n        List&lt;ElevatorCar&gt; allowed = new ArrayList&lt;&gt;();\n        for (ElevatorCar c : cars) {\n            int[] z = zones.get(c.id);\n            if (z == null || (call.floor() &gt;= z[0] &amp;&amp; call.floor() &lt;= z[1])) allowed.add(c);\n        }\n        return allowed.isEmpty() ? null : base.pick(allowed, call);   // null = nobody may take it; it waits\n    }\n}\n\n// ---- ext: capacity and weight. Load is tracked beside the car so the base stays capacity-free.\n/** Riders and kilos on board one car, and the two limits that stop it answering another hall call. */\nclass CarLoad {\n    final int maxRiders, maxKg;\n    private int riders, kg;\n    CarLoad(int maxRiders, int maxKg) { this.maxRiders = maxRiders; this.maxKg = maxKg; }\n    /** Someone stepped in. Returns false, changing nothing, if the car is already at a limit. */\n    synchronized boolean board(int weightKg) {\n        if (riders + 1 &gt; maxRiders || kg + weightKg &gt; maxKg) return false;\n        riders++; kg += weightKg; return true;\n    }\n    synchronized void leave(int weightKg) { riders = Math.max(0, riders - 1); kg = Math.max(0, kg - weightKg); }\n    synchronized boolean full() { return riders &gt;= maxRiders || kg &gt;= maxKg; }\n}\n\n/** Skip cars that are full, then defer to the rule underneath. A full car keeps sweeping; it just stops answering. */\nclass CapacityAwareDispatch implements DispatchStrategy {\n    private final DispatchStrategy base;\n    private final Map&lt;Integer, CarLoad&gt; load;\n    CapacityAwareDispatch(DispatchStrategy base, Map&lt;Integer, CarLoad&gt; load) { this.base = base; this.load = load; }\n\n    public ElevatorCar pick(List&lt;ElevatorCar&gt; cars, HallCall call) {\n        List&lt;ElevatorCar&gt; roomy = new ArrayList&lt;&gt;();\n        for (ElevatorCar c : cars) { CarLoad l = load.get(c.id); if (l == null || !l.full()) roomy.add(c); }\n        return roomy.isEmpty() ? null : base.pick(roomy, call);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Destination dispatch: riders type the floor they want on a keypad in the lobby.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The keypad knows more than a button does, so use it. DestinationDispatch.enter takes \"I am on 0, I want 12\", notes the 12, presses the ordinary hall button, and tells the rider which car to stand at. As the dispatch rule, it prefers a car already collecting riders for 12, and otherwise lets the normal rule decide. The 12 is pressed only at boarding: the same class listens to the cars and presses it when that car opens at the rider's floor, going their way. Pressed any earlier, a car that reached 12 first would open there for nobody and leave the rider with no stop. One limit to say out loud: the bank keeps one car per hall button, so riders on one floor going one way share the car already coming.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: destination dispatch -- riders type where they are going in the lobby\n/** One rider&#x27;s whole trip, typed on the keypad before boarding. */\nrecord Trip(int from, int to) {\n    /** The way this rider travels, which is also the leg their pickup goes on. */\n    Direction dir() { return to &gt; from ? Direction.UP : Direction.DOWN; }\n}\n\n/**\n * Destination dispatch. The keypad knows each rider&#x27;s floor before they board, so a rider is sent to a car\n * that is already collecting riders for that floor, and told which car to stand at. The pickup is an ordinary\n * hall call; the destination is pressed only when that car opens at the pickup going the rider&#x27;s way, so the\n * car can never serve it before the rider is on board. A rule for the choice and a listener for the boarding.\n */\nclass DestinationDispatch implements DispatchStrategy, ElevatorObserver {\n    private final ElevatorSystem bank;\n    private final DispatchStrategy base;\n    private final Map&lt;HallCall, Integer&gt; typed = new ConcurrentHashMap&lt;&gt;();        // pickup being placed -&gt; its destination\n    private final Map&lt;Integer, List&lt;Trip&gt;&gt; waiting = new ConcurrentHashMap&lt;&gt;();    // carId -&gt; riders told to board it\n    DestinationDispatch(ElevatorSystem bank, DispatchStrategy base) { this.bank = bank; this.base = base; }\n\n    /** The keypad: &quot;I am on 0, I want 12&quot;. Returns the car to stand at, or -1 when no car can take it yet. */\n    int enter(int from, int to) {\n        Trip trip = new Trip(from, to);\n        typed.put(new HallCall(from, trip.dir()), to);\n        int carId = bank.requestHall(from, trip.dir());\n        if (carId &gt;= 0) waiting.computeIfAbsent(carId, k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(trip);\n        return carId;\n    }\n\n    /** A car already collecting riders for this floor, going this way; failing that, the normal rule. */\n    public ElevatorCar pick(List&lt;ElevatorCar&gt; cars, HallCall call) {\n        Integer to = typed.get(call);\n        if (to != null)\n            for (ElevatorCar c : cars)\n                for (Trip t : waiting.getOrDefault(c.id, List.of()))\n                    if (t.to() == to &amp;&amp; t.dir() == call.direction()) return c;     // same floor, same way: same car\n        return base.pick(cars, call);\n    }\n\n    /** Boarding: the car opened at a waiting rider&#x27;s floor, going their way. Now, and only now, press their floor. */\n    public void onChange(CarSnapshot s) {\n        if (s.doors() != DoorState.OPEN) return;\n        List&lt;Trip&gt; list = waiting.getOrDefault(s.carId(), List.of());\n        for (Trip t : list)\n            if (t.from() == s.floor() &amp;&amp; (s.heading() == t.dir() || s.heading() == Direction.IDLE) &amp;&amp; list.remove(t))\n                bank.requestCar(s.carId(), t.to());            // remove() first, so a second listener call presses nothing\n    }\n}\n\n        // 13. riders who type their floor. The destination is pressed only once the rider is on board ...\n        ElevatorSystem b13 = bank(1, 15);\n        DestinationDispatch keypad = new DestinationDispatch(b13, new NearestCarStrategy(0, 19));\n        b13.configure(keypad, new FixedDwellPolicy(1));\n        b13.addObserver(keypad);\n        keypad.enter(10, 17);                                       // the car is at 15: floor 17 is nearer than the rider\n        List&lt;Integer&gt; opened = new ArrayList&lt;&gt;(); DoorState before = DoorState.CLOSED;\n        for (int t = 0; t &lt; 40; t++) {\n            b13.tick();\n            CarSnapshot s = b13.car(0).snapshot();\n            if (s.doors() == DoorState.OPEN &amp;&amp; before == DoorState.CLOSED) opened.add(s.floor());\n            before = s.doors();\n        }\n        check(opened.equals(List.of(10, 17)), &quot;the car opened at 10 to pick the rider up, then at 17 to let them out &quot; + opened);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Microsoft&#x27;s version: one lift, fifty floors, twenty people at a time, and no rider may sit through more than five stops. When may the lift take a new request?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Each request now carries both floors, so every rider's trip is known, and that is what makes the rule checkable. StopBudget keeps, for the sweep the car is on, a sorted set of the floors it stops at and the list of trips it has taken. A new trip adds at most two floors. For every rider, the newcomer included, the stops they sit through are the floors after the one they board at, up to and including their own: one <code>subSet(...).size()</code> each. The trip is taken only if nobody passes five and the car never holds more than twenty; checking and recording are one synchronized step, the bank's lock rule again. Stops already made stay in the set until the sweep ends, so a rider who has sat through three is never promised five more. A refused rider waits for the next sweep.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: request feasibility -- nobody may sit through more than five stops (Microsoft&#x27;s version)\n/**\n * One car&#x27;s plan for the sweep it is on, one per direction: the floors it will stop at and the trips it has\n * taken. A new trip is taken only if, with its two floors added, nobody (the newcomer included) sits through\n * more than maxStops stops and no more than maxRiders are ever on board. Stops already made stay in the plan\n * until the sweep ends, so a rider who has sat through three is not promised five more.\n */\nclass StopBudget {\n    private final int maxStops, maxRiders;\n    private final TreeSet&lt;Integer&gt; stops = new TreeSet&lt;&gt;();      // every floor this sweep stops at: made or planned\n    private final List&lt;Trip&gt; trips = new ArrayList&lt;&gt;();          // every trip taken on this sweep\n    StopBudget(int maxStops, int maxRiders) { this.maxStops = maxStops; this.maxRiders = maxRiders; }\n\n    /** Check and record in one synchronized step. False changes nothing: the rider waits for the next sweep. */\n    synchronized boolean tryTake(Trip next) {\n        TreeSet&lt;Integer&gt; after = new TreeSet&lt;&gt;(stops); after.add(next.from()); after.add(next.to());\n        List&lt;Trip&gt; all = new ArrayList&lt;&gt;(trips); all.add(next);\n        for (Trip r : all) if (stopsRidden(after, r) &gt; maxStops) return false;\n        for (int f : after) if (onBoardLeaving(all, f) &gt; maxRiders) return false;\n        stops.addAll(after); trips.add(next);\n        return true;\n    }\n    /** The car has turned round: this sweep is over and everyone on it has got out. */\n    synchronized void sweepEnded() { stops.clear(); trips.clear(); }\n\n    /** Stops a rider sits through: every stop after the one they board at, up to and including their own. */\n    static int stopsRidden(TreeSet&lt;Integer&gt; stops, Trip r) {\n        return r.dir() == Direction.UP ? stops.subSet(r.from(), false, r.to(), true).size()\n                                       : stops.subSet(r.to(), true, r.from(), false).size();\n    }\n    /** Riders inside as the car leaves floor f: boarded there or earlier, getting out further on. */\n    private static int onBoardLeaving(List&lt;Trip&gt; trips, int f) {\n        int n = 0;\n        for (Trip r : trips)\n            if (r.dir() == Direction.UP ? r.from() &lt;= f &amp;&amp; f &lt; r.to() : r.to() &lt; f &amp;&amp; f &lt;= r.from()) n++;\n        return n;\n    }\n}\n\n        // ... and Microsoft&#x27;s rule: nobody may sit through more than five stops\n        StopBudget budget = new StopBudget(5, 20);\n        check(budget.tryTake(new Trip(0, 10)) &amp;&amp; budget.tryTake(new Trip(1, 7)) &amp;&amp; budget.tryTake(new Trip(8, 9)),\n              &quot;0-&gt;10, 1-&gt;7 and 8-&gt;9 fit: the rider from 0 sits through 1, 7, 8, 9 and 10, five stops&quot;);\n        check(!budget.tryTake(new Trip(4, 6)), &quot;4-&gt;6 is refused: the rider from 0 would sit through seven stops&quot;);\n        check(budget.tryTake(new Trip(7, 9)), &quot;7-&gt;9 is taken: it adds no new floor, so nobody&#x27;s count changes&quot;);\n        StopBudget roomForTwo = new StopBudget(5, 2);\n        check(roomForTwo.tryTake(new Trip(0, 10)) &amp;&amp; roomForTwo.tryTake(new Trip(1, 7)) &amp;&amp; !roomForTwo.tryTake(new Trip(2, 5)),\n              &quot;with room for two riders, a third one riding from 2 to 5 is refused&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>14 &middot; Persist it. Or: one controller for forty buildings.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The index of who owes which call goes behind a repository interface, and the in-memory map becomes one implementation. The services do not change. The claim, which today is a put under a lock, becomes a conditional update: set the car id on that call's row where it is still null. One row updated means this controller won it, zero rows means another controller did and it must pick again. That is the database's compare-and-set, the same idea as the lock: one indivisible step decides the winner, and it is what lets two controllers share one bank. The code stops at the repository, but it also answers \"resume safely after a power cut\", another Microsoft ask. The rows survive the restart, each car's floor is read back from the car itself, and a call whose car does not come back is released and offered again.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- the assignment index becomes a repository, and the claim becomes a conditional UPDATE\n/**\n * Who owes which call, behind an interface so it can live in a database when one controller serves forty\n * buildings. claim() is the whole invariant: exactly one car may win a call.\n */\ninterface AssignmentRepository {\n    /** Claim the call for this car. False means another controller already claimed it; nothing was written. */\n    boolean claim(HallCall call, int carId);\n    /** Give the call up: it was served, or the car died. */\n    void release(HallCall call);\n    /** Which car owes it, if any. */\n    Optional&lt;Integer&gt; owner(HallCall call);\n}\n\n/** The in-memory one. putIfAbsent is a compare-and-set (write only if nobody has, in one step): the lock&#x27;s idea again. */\nclass InMemoryAssignmentRepository implements AssignmentRepository {\n    private final Map&lt;HallCall, Integer&gt; rows = new ConcurrentHashMap&lt;&gt;();\n    public boolean claim(HallCall call, int carId) { return rows.putIfAbsent(call, carId) == null; }\n    public void release(HallCall call)             { rows.remove(call); }\n    public Optional&lt;Integer&gt; owner(HallCall call)  { return Optional.ofNullable(rows.get(call)); }\n}\n// the same claim in SQL, once two controllers run on two machines:\n// UPDATE hall_call SET car_id = ? WHERE building = ? AND floor = ? AND direction = ? AND car_id IS NULL;\n//   -- 1 row updated = this controller won it;  0 rows = the other one did, and it must pick again\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Where does time come from, and how do you prove a rider waited 2000 ms without sleeping?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The bank has a Clock it was handed. It stamps the moment a hall button was first pressed and works out the wait when the doors open there. Nothing else reads the time: the wall clock is only the default Clock, and a test hands in its own. The tick is the other half: a tick is one floor or one door cycle, so a test drives the world forward by calling tick and asserting, with no sleeps and nothing flaky. The failure test below hands in a clock it moves by five hundred milliseconds per tick, presses floor 3, ticks four times and checks the recorded wait is exactly two thousand milliseconds. Say the second benefit out loud: because time is a parameter, a peak-hour simulation of ten thousand presses runs in a second.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// the bank stamps the first press and closes the wait when the doors open, both from the injected clock\nraisedAtMs.putIfAbsent(call, clock.nowMs());              // in requestHall, under the lock\nLong raised = raisedAtMs.remove(served);                  // in tick(), when a car served it\nif (raised != null) { totalWaitMs += now - raised; servedCalls++; }\n\n        // 8. waiting time is read from the injected clock, not the wall clock\n        ElevatorSystem b8 = bank(1);\n        long[] now = { 0L };\n        b8.setClock(() -&gt; now[0]);\n        b8.requestHall(3, Direction.UP);                        // pressed at t = 0\n        for (int t = 0; t &lt; 4; t++) { now[0] += 500; b8.tick(); }   // four half-second ticks: climb, climb, climb, open\n        check(b8.averageWaitMs() == 2000.0, &quot;the rider waited 2000 ms by the test&#x27;s clock, whatever the wall clock says&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Point at the line for each pattern you used, and for each SOLID letter. Which ones did you deliberately not use?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Four patterns, each the output of a move, never chosen up front. Strategy: which car answers and how long the doors stay open both sit behind one-method interfaces the bank is handed. Decorator: zoning and capacity filter the candidates and then defer to the rule underneath instead of replacing it. Observer: the bank announces that a car changed, after the lock, and has no idea what a panel is. State: the car's life as an enum with one rule about what a tick may do. Not used, on purpose: Singleton, because one controller may run several banks; Factory, until cars are built from a config file. For SOLID the code is the argument, and the five lines below are where each letter lives.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy (move 3): a rule behind an interface, handed in -- also SOLID&#x27;s I, one method per interface\ninterface DispatchStrategy { ElevatorCar pick(List&lt;ElevatorCar&gt; cars, HallCall call); }\nvoid configure(DispatchStrategy d, DoorPolicy p) { lock.lock(); try { this.dispatch = d; this.doorPolicy = p; } finally { lock.unlock(); } }\n\n// Decorator (move 3): filter the candidates, then defer to the rule underneath -- also SOLID&#x27;s O, nothing opened\nclass ZonedDispatch implements DispatchStrategy { private final DispatchStrategy base; /* ... base.pick(allowed, call) */ }\nbank.configure(new ZonedDispatch(new NearestCarStrategy(0, 19), zones), new LobbyDwellPolicy(0, 3, 1));\n\n// Observer (moves 3 and 4): the bank announces, after the lock; it does not know what a screen is\ninterface ElevatorObserver { void onChange(CarSnapshot s); }\nfor (CarSnapshot s : snaps) for (ElevatorObserver o : observers) try { o.onChange(s); } catch (RuntimeException e) { /* logged */ }\n\n// State (move 6): the car&#x27;s life, and the rule that one tick is one thing\nenum CarState { IDLE, MOVING_UP, MOVING_DOWN, DOORS_OPEN, MAINTENANCE }\nif (doors == DoorState.OPEN) { /* the doors own this tick; the car does not move */ }\n\n// SOLID&#x27;s S: one reason to change each\nclass StopSet { /* the sweep questions */ }   class ElevatorCar { /* its own physics */ }   class ElevatorSystem { /* dispatch + the lock */ }\n// SOLID&#x27;s L: any implementation drops in; the bank never checks the concrete type\nElevatorCar chosen = dispatch.pick(eligible, call);\n// SOLID&#x27;s D: depend on the interface, hand in the implementation; tests hand in fakes\nbank.setClock(() -&gt; now[0]);   bank.addObserver(s -&gt; { throw new RuntimeException(&quot;panel is down&quot;); });\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>17 &middot; Enum states or ElevatorCar subclasses? Where would you use a Factory?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Enum, until a state gains behaviour of its own. IDLE, MOVING_UP, DOORS_OPEN and MAINTENANCE differ only in what the next tick may do, which is data: a few branches in one method you can read end to end. A subclass pays when a kind of car really behaves differently, such as a freight car with its own door timing and a key switch. Even then, the cheap version is a different DoorPolicy, not a new class of car. Factory earns its place when cars and zones are built from a configuration file: a registry that maps \"freight\" to a constructor turns adding a kind into one registration instead of a growing switch.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// data, not classes: the state only decides what the next tick may do\nenum CarState { IDLE, MOVING_UP, MOVING_DOWN, DOORS_OPEN, MAINTENANCE }\nif (doors == DoorState.OPEN) { /* close */ } else if (stops.servesOnLeg(floor, heading)) { /* open */ } else { floor += heading.delta(); }\n\n// the cheap version of a &#x27;different kind of car&#x27; is a different rule, not a subclass\nbank.configure(dispatch, new LobbyDwellPolicy(0, 3, 1));\n\n// a factory only once cars are built from strings: a registry, so a new kind is one registration\nMap&lt;String, Function&lt;Integer, ElevatorCar&gt;&gt; registry = Map.of(&quot;freight&quot;, id -&gt; new ElevatorCar(id, 0, 5, 0));\nElevatorCar c = registry.get(kind).apply(nextId);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * Which way a rider wants to go, and which leg of the sweep a car is on. An enum, not a boolean, so\n * \"up and down at the same time\" cannot be written down.\n */\nenum Direction {\n    UP, DOWN, IDLE;\n    /** The other leg of the sweep. IDLE has no opposite and returns itself. */\n    Direction opposite() { return this == UP ? DOWN : this == DOWN ? UP : IDLE; }\n    /** +1 going up, -1 going down, 0 standing still. Used to move exactly one floor per tick. */\n    int delta()          { return this == UP ? 1 : this == DOWN ? -1 : 0; }\n}\n\n/** The doors. A tick is a door cycle OR one floor of travel, never both; this enum is how that is checked. */\nenum DoorState { OPEN, CLOSED }\n\n/**\n * A car's life: standing still, sweeping one way, letting people in and out, or out of service.\n * MAINTENANCE is a dead end until someone returns the car to service.\n */\nenum CarState { IDLE, MOVING_UP, MOVING_DOWN, DOORS_OPEN, MAINTENANCE }\n\n/**\n * The button in the hallway: \"I am on this floor and I want to go that way.\" It belongs to the whole bank,\n * so any car may answer it; the direction is what makes dispatch possible.\n */\nrecord HallCall(int floor, Direction direction) {\n    HallCall {\n        if (direction == Direction.IDLE) throw new IllegalArgumentException(\"a hall call is UP or DOWN, never IDLE\");\n    }\n}\n\n/**\n * An immutable published view of one car: what a panel or the dispatcher reads without touching, or\n * locking, the car's live state. A reader sees a whole consistent car, never a torn mix of fields.\n * version goes up by one on every change, so a listener that hears two snapshots in the wrong order can keep\n * the newer one; floorsMoved is the car's own odometer, counted by the car itself as it moves.\n */\nrecord CarSnapshot(int carId, long version, int floor, Direction heading, CarState state, DoorState doors,\n                   int pendingStops, int floorsMoved) {}\n\n/** Where time comes from. Injected so tests can advance it by hand and waiting times are replayable. */\ninterface Clock { long nowMs(); }\n\n/**\n * The stops a car still owes, split by the leg that will serve them: one sorted set for floors taken on the\n * way up, one for floors taken on the way down. Every sweep question is a TreeSet lookup, never a scan.\n */\nclass StopSet {\n    private final EnumMap<Direction, NavigableSet<Integer>> legs = new EnumMap<>(Direction.class);\n\n    StopSet() {\n        legs.put(Direction.UP, new TreeSet<>());       // floors served while climbing\n        legs.put(Direction.DOWN, new TreeSet<>());     // floors served while descending\n    }\n\n    /** Remember a floor on one leg. A set, so pressing the same button three times is one stop. */\n    void add(Direction leg, int floor) {\n        if (leg == Direction.IDLE) throw new IllegalArgumentException(\"a stop belongs to the UP leg or the DOWN leg\");\n        legs.get(leg).add(floor);\n    }\n    /** Forget a floor on one leg; called when the doors open there. */\n    void clear(Direction leg, int floor) { legs.get(leg).remove(floor); }\n    /** Drop every stop, both legs. Used only by an emergency stop. */\n    void clearAll()                      { for (NavigableSet<Integer> s : legs.values()) s.clear(); }\n\n    boolean isEmpty() { return legs.get(Direction.UP).isEmpty() && legs.get(Direction.DOWN).isEmpty(); }\n    int size()        { return legs.get(Direction.UP).size() + legs.get(Direction.DOWN).size(); }\n\n    /** Is this floor a stop on the leg the car is sweeping right now? O(log n). */\n    boolean servesOnLeg(int floor, Direction leg) { return leg != Direction.IDLE && legs.get(leg).contains(floor); }\n    /** Is this floor a stop on either leg? Asked only when the car is standing still. */\n    boolean hasAnyAt(int floor) { return legs.get(Direction.UP).contains(floor) || legs.get(Direction.DOWN).contains(floor); }\n\n    /**\n     * Is anything still owed beyond this floor in this direction, on either leg? This single question is\n     * what makes the sweep a sweep: while it is true the car may not turn around. O(log n).\n     */\n    boolean hasStopAhead(int from, Direction leg) {\n        NavigableSet<Integer> up = legs.get(Direction.UP), down = legs.get(Direction.DOWN);\n        return leg == Direction.UP ? (up.higher(from) != null || down.higher(from) != null)\n                                   : (up.lower(from)  != null || down.lower(from)  != null);\n    }\n\n    /** From a standstill, head toward the nearest pending stop on either side; ties go up. */\n    Direction chooseDirection(int from) {\n        Integer above = minOf(legs.get(Direction.UP).higher(from), legs.get(Direction.DOWN).higher(from));\n        Integer below = maxOf(legs.get(Direction.UP).lower(from),  legs.get(Direction.DOWN).lower(from));\n        if (above == null && below == null) return Direction.IDLE;\n        if (above == null) return Direction.DOWN;\n        if (below == null) return Direction.UP;\n        return (above - from) <= (from - below) ? Direction.UP : Direction.DOWN;\n    }\n    /** A copy of one leg, for tests and displays. */\n    Set<Integer> floorsOn(Direction leg) { return new TreeSet<>(legs.get(leg)); }\n\n    // written as ifs on purpose: `a == null ? b : Math.min(a, b)` makes the conditional's type int,\n    // which unboxes the null branch and throws NullPointerException.\n    private static Integer minOf(Integer a, Integer b) {\n        if (a == null) return b;\n        if (b == null) return a;\n        return a <= b ? a : b;\n    }\n    private static Integer maxOf(Integer a, Integer b) {\n        if (a == null) return b;\n        if (b == null) return a;\n        return a >= b ? a : b;\n    }\n}\n\n/**\n * One car: where it is, which way it is sweeping, its doors, and the stops it owes. Every field is written\n * only under the bank's lock; readers take the immutable snapshot instead.\n */\nclass ElevatorCar {\n    final int id;\n    final int bottomFloor, topFloor;                 // this car's servable range: express cars get a narrow one\n    private int floor;\n    private Direction heading = Direction.IDLE;\n    private CarState state   = CarState.IDLE;\n    private DoorState doors  = DoorState.CLOSED;\n    private final StopSet stops = new StopSet();\n    private final Set<HallCall> held = new HashSet<>();   // hall calls this car owes; handed back if it dies\n    private int dwellLeft = 0;                            // ticks the doors still stay open\n    private long version = 0;                             // one more on every change; stamped into each snapshot\n    private int floorsMoved = 0;                          // the odometer: floors this car has travelled\n    private volatile CarSnapshot published;               // the lock-free read for panels and estimates\n\n    ElevatorCar(int id, int bottomFloor, int topFloor, int startFloor) {\n        this.id = id; this.bottomFloor = bottomFloor; this.topFloor = topFloor; this.floor = startFloor;\n        republish();\n    }\n\n    /** The last published view. Safe to read from any thread without the bank's lock. */\n    CarSnapshot snapshot()  { return published; }\n    int floor()             { return floor; }\n    Direction heading()     { return heading; }\n    CarState state()        { return state; }\n    DoorState doors()       { return doors; }\n    int pendingStops()      { return stops.size(); }\n    StopSet stops()         { return stops; }\n    /** False only while the car is out of service; the dispatcher filters on this. */\n    boolean inService()     { return state != CarState.MAINTENANCE; }\n    /** Can this car reach that floor at all? An express or zoned car says no to most of the building. */\n    boolean serves(int f)   { return f >= bottomFloor && f <= topFloor; }\n\n    /**\n     * Take a hall call into the sweep. Returns false, having changed nothing, if the car cannot have it:\n     * out of service, or the floor is outside its range. This is the step the bank commits on.\n     */\n    boolean accept(HallCall call) {\n        if (!inService() || !serves(call.floor())) return false;\n        stops.add(call.direction(), call.floor());     // the UP button goes on the up leg, the DOWN button on the down leg\n        held.add(call);\n        republish();\n        return true;\n    }\n\n    /**\n     * A rider inside presses a floor. It joins the leg that reaches it from where the car is now; pressing\n     * it again changes nothing. Returns false if the car cannot serve that floor.\n     */\n    boolean pressFloor(int destination) {\n        if (!inService() || !serves(destination)) return false;\n        Direction leg = destination > floor ? Direction.UP\n                      : destination < floor ? Direction.DOWN\n                      : (heading == Direction.DOWN ? Direction.DOWN : Direction.UP);   // already here: open on this leg\n        stops.add(leg, destination);\n        republish();\n        return true;\n    }\n\n    /**\n     * One tick of physics: a door cycle, or one floor, or a turn plus one of those. Returns the hall calls\n     * this car finished in this tick so the bank can drop them from its index. Called under the bank's lock.\n     */\n    List<HallCall> step(DoorPolicy policy) {\n        if (state == CarState.MAINTENANCE) return List.of();\n\n        if (doors == DoorState.OPEN) {                       // the doors own this tick; the car does not move\n            if (--dwellLeft > 0) { republish(); return List.of(); }\n            doors = DoorState.CLOSED;\n            if (stops.isEmpty()) { heading = Direction.IDLE; state = CarState.IDLE; }\n            else {\n                // choose the leg for the next tick HERE, so the arrow on the panel is never a lie\n                if (heading == Direction.IDLE) heading = stops.chooseDirection(floor);\n                else if (!stops.servesOnLeg(floor, heading) && !stops.hasStopAhead(floor, heading))\n                    heading = heading.opposite();            // nothing left ahead on this leg: the sweep turns here\n                state = heading == Direction.UP   ? CarState.MOVING_UP\n                      : heading == Direction.DOWN ? CarState.MOVING_DOWN : CarState.IDLE;\n            }\n            republish();\n            return List.of();\n        }\n        if (stops.isEmpty()) {                               // nothing owed: stand still\n            heading = Direction.IDLE; state = CarState.IDLE; republish(); return List.of();\n        }\n        if (heading == Direction.IDLE) {\n            if (stops.hasAnyAt(floor)) return open(policy, null);      // standing on a stop: serve both lamps\n            heading = stops.chooseDirection(floor);\n            if (heading == Direction.IDLE) { state = CarState.IDLE; republish(); return List.of(); }\n        }\n        // LOOK: turn around only when nothing is owed ahead on this leg. This one line is the whole algorithm.\n        if (!stops.servesOnLeg(floor, heading) && !stops.hasStopAhead(floor, heading))\n            heading = heading.opposite();\n        if (stops.servesOnLeg(floor, heading)) return open(policy, heading);   // covers the turn floor too\n\n        floor += heading.delta();                            // one floor, and nothing else, this tick\n        floorsMoved++;\n        state = heading == Direction.UP ? CarState.MOVING_UP : CarState.MOVING_DOWN;\n        republish();\n        return List.of();\n    }\n\n    /** Open the doors and clear the floor from the leg being served (null = both legs, for an idle car). */\n    private List<HallCall> open(DoorPolicy policy, Direction leg) {\n        doors = DoorState.OPEN;\n        state = CarState.DOORS_OPEN;\n        dwellLeft = Math.max(1, policy.dwellTicks(id, floor));\n        List<HallCall> served = new ArrayList<>(2);\n        for (Direction d : leg == null ? List.of(Direction.UP, Direction.DOWN) : List.of(leg)) {\n            stops.clear(d, floor);\n            HallCall done = new HallCall(floor, d);\n            if (held.remove(done)) served.add(done);\n        }\n        republish();\n        return served;\n    }\n\n    /**\n     * The OPEN button inside the car, and the sensor that fires when somebody stands in the doorway: keep the\n     * doors open for a few ticks more. Does nothing if the doors are shut, so a rider can never stop a car\n     * that is moving, or if the car is out of service. Returns whether it held the doors.\n     */\n    boolean holdDoors(int extraTicks) {\n        if (doors != DoorState.OPEN || state == CarState.MAINTENANCE) return false;\n        dwellLeft = Math.max(dwellLeft, Math.max(1, extraTicks));\n        return true;                                        // nothing published changed: open before, open now\n    }\n\n    /**\n     * The CLOSE button: end the wait now, so the next tick shuts the doors and the sweep goes on. Does\n     * nothing if the doors are shut, or if the car is out of service (its doors stay open for the engineer).\n     */\n    boolean closeDoorsNow() {\n        if (doors != DoorState.OPEN || state == CarState.MAINTENANCE) return false;\n        dwellLeft = 1;                                      // one tick left, which the close branch above spends\n        return true;\n    }\n\n    /**\n     * Emergency stop or maintenance: halt here with the doors open, drop the stops, and hand back every hall\n     * call still owed so the bank can give them to another car. Nothing is lost.\n     */\n    List<HallCall> goOutOfService() {\n        List<HallCall> owed = dropStops();\n        heading = Direction.IDLE;\n        doors = DoorState.OPEN;                             // riders get out here\n        state = CarState.MAINTENANCE;\n        dwellLeft = 0;\n        republish();\n        return owed;\n    }\n    /**\n     * Forget every stop and hand back the hall calls still owed, staying in service. Used by an emergency\n     * stop and by fire recall; the bank is what decides where those calls go next.\n     */\n    List<HallCall> dropStops() {\n        List<HallCall> owed = new ArrayList<>(held);\n        held.clear();\n        stops.clearAll();\n        republish();\n        return owed;\n    }\n\n    /** Back in service, empty, standing still where it stopped. */\n    void returnToService() {\n        if (state != CarState.MAINTENANCE) return;\n        doors = DoorState.CLOSED; state = CarState.IDLE; heading = Direction.IDLE;\n        republish();\n    }\n\n    /** Take a fresh immutable picture after every mutation. Readers see whole cars, never half-written ones. */\n    private void republish() {\n        published = new CarSnapshot(id, ++version, floor, heading, state, doors, stops.size(), floorsMoved);\n    }\n}\n\n// \"they will change which car answers\" -> hide it behind an interface -> Strategy\n/**\n * Which car answers a hall call. The rule that changes every time an interviewer changes their mind, so it\n * is handed in, never built by the bank. Gets only the cars that are eligible; may return null for none.\n */\ninterface DispatchStrategy { ElevatorCar pick(List<ElevatorCar> cars, HallCall call); }\n\n/**\n * Send the car that would reach the caller soonest, counting a sweep the car must finish first. Ties go to\n * the lowest car id so a bank is deterministic and testable.\n */\nclass NearestCarStrategy implements DispatchStrategy {\n    private final int bottom, top;\n    NearestCarStrategy(int bottom, int top) { this.bottom = bottom; this.top = top; }\n\n    public ElevatorCar pick(List<ElevatorCar> cars, HallCall call) {\n        ElevatorCar best = null; int bestCost = Integer.MAX_VALUE;\n        for (ElevatorCar c : cars) {\n            int cost = cost(c.snapshot(), call, bottom, top);      // scored off the snapshot, never live fields\n            if (cost < bestCost) { best = c; bestCost = cost; }\n        }\n        return best;\n    }\n\n    /**\n     * Floors of travel before this car could open its doors for that call. Ahead of the car and wanting its\n     * way: straight there. Wanting the other way: the car finishes its leg, turns, and meets the caller on\n     * the way back. Behind the car and wanting its way: a whole round trip. The leg is charged to the end of\n     * the shaft, not to the car's last stop, which over-counts a little. It is an estimate, and deliberately\n     * the SAME estimate the lobby board shows, so the number a rider sees and the choice the bank made agree.\n     */\n    static int cost(CarSnapshot s, HallCall call, int bottom, int top) {\n        int f = s.floor(), c = call.floor();\n        switch (s.heading()) {\n            case IDLE: return Math.abs(f - c);\n            case UP:\n                if (c >= f && call.direction() == Direction.UP) return c - f;              // ahead, same way: straight on\n                if (call.direction() == Direction.DOWN) return (top - f) + (top - c);      // wants down: up to the top, back to it\n                return (top - f) + (top - bottom) + (c - bottom);                          // behind, wants up: a round trip\n            default:\n                if (c <= f && call.direction() == Direction.DOWN) return f - c;\n                if (call.direction() == Direction.UP) return (f - bottom) + (c - bottom);\n                return (f - bottom) + (top - bottom) + (top - c);\n        }\n    }\n}\n\n// \"the lobby wants longer doors, accessibility wants longer still\" -> same shape -> Strategy again\n/** How many ticks the doors stay open at a floor. A rule, so it is handed in and never hard-coded in the car. */\ninterface DoorPolicy { int dwellTicks(int carId, int floor); }\n\n/** The same dwell everywhere. The starting rule; the lobby and accessibility versions are follow-ups. */\nclass FixedDwellPolicy implements DoorPolicy {\n    private final int ticks;\n    FixedDwellPolicy(int ticks) { this.ticks = ticks; }\n    public int dwellTicks(int carId, int floor) { return ticks; }\n}\n\n// \"a panel should update but must not be wired into dispatch\" -> publish/subscribe -> Observer\n/**\n * Anyone who wants to hear that a car changed: a display panel, a maintenance monitor, a fire panel. The\n * bank does not know what they are and is told nothing back.\n */\ninterface ElevatorObserver { void onChange(CarSnapshot s); }\n\n/**\n * The panel above one car's doors. Prints only when what it would show changed, like a real display.\n * Observers are called after the bank's lock, from any thread, so two snapshots can arrive in the wrong\n * order: the panel keeps the highest version it has seen and ignores an older one, so it never goes back.\n */\nclass DisplayPanel implements ElevatorObserver {\n    private final int watchedCar;\n    private long shownVersion = -1;\n    private String shown = \"\";\n    DisplayPanel(int watchedCar) { this.watchedCar = watchedCar; }\n    public synchronized void onChange(CarSnapshot s) {\n        if (s.carId() != watchedCar || s.version() <= shownVersion) return;     // late or repeated: skip it\n        shownVersion = s.version();\n        String now = \"floor \" + s.floor() + \" \" + s.state() + (s.doors() == DoorState.OPEN ? \" doors open\" : \"\");\n        if (!now.equals(shown)) { shown = now; System.out.println(\"[panel car \" + s.carId() + \"] \" + now); }\n    }\n}\n\n/**\n * Asks for service when a car has travelled a set number of floors. It reads the car's own odometer instead\n * of adding up floor-to-floor differences, so a snapshot that arrives late or twice cannot inflate the count.\n * Observers run from any thread, so its own callback is synchronized: its problem, not the bank's.\n */\nclass MaintenanceMonitor implements ElevatorObserver {\n    private final int serviceEvery;\n    private final Map<Integer, Integer> travelled = new HashMap<>();\n    private final Set<Integer> flagged = new HashSet<>();\n    MaintenanceMonitor(int serviceEvery) { this.serviceEvery = serviceEvery; }\n\n    public synchronized void onChange(CarSnapshot s) {\n        int floors = travelled.merge(s.carId(), s.floorsMoved(), Math::max);    // an older snapshot cannot lower it\n        if (floors >= serviceEvery && flagged.add(s.carId()))\n            System.out.println(\"[maintenance] car \" + s.carId() + \" has travelled \" + floors + \" floors: due for service\");\n    }\n    /** Floors this car has covered, as its odometer last reported. */\n    synchronized int floorsTravelled(int carId) { return travelled.getOrDefault(carId, 0); }\n}\n\n/**\n * The bank: the aggregate root (the one object that owns the others and guards their rules). It owns the cars,\n * the index of which car owes which hall call, the queue of calls nobody could take yet, and ONE lock. Every rule\n * it uses is handed in through configure().\n */\nclass ElevatorSystem {\n    private final List<ElevatorCar> cars;\n    private final int bottomFloor, topFloor;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Map<HallCall, Integer> assigned = new HashMap<>();            // guarded by lock: one car per call\n    private final Set<HallCall> pending = new LinkedHashSet<>();                // guarded by lock: waiting for a car\n    private final Map<HallCall, Long> raisedAtMs = new HashMap<>();             // guarded by lock: for the wait times\n    private final List<ElevatorObserver> observers = new CopyOnWriteArrayList<>();\n    private DispatchStrategy dispatch;                                          // guarded by lock, like the two below\n    private DoorPolicy doorPolicy = new FixedDwellPolicy(1);\n    private Clock clock = System::currentTimeMillis;\n    private long totalWaitMs, servedCalls;                                      // guarded by lock\n    private volatile Integer recallFloor;                                       // written under the lock; non-null during fire recall\n\n    ElevatorSystem(List<ElevatorCar> cars, int bottomFloor, int topFloor) {\n        this.cars = List.copyOf(cars); this.bottomFloor = bottomFloor; this.topFloor = topFloor;\n        for (int i = 0; i < this.cars.size(); i++)                             // car(id) is a list index, so ids are 0..n-1\n            if (this.cars.get(i).id != i) throw new IllegalArgumentException(\"car ids must be 0, 1, 2 ... in order\");\n        this.dispatch = new NearestCarStrategy(bottomFloor, topFloor);\n    }\n\n    /**\n     * Hand in the rules. The bank never builds one itself, so swapping a rule is a new class and this line.\n     * Written under the lock, so a swap made mid-round from another thread is seen by the very next press.\n     */\n    void configure(DispatchStrategy d, DoorPolicy p) {\n        lock.lock(); try { this.dispatch = d; this.doorPolicy = p; } finally { lock.unlock(); }\n    }\n    /** Tests hand in a clock they advance themselves. */\n    void setClock(Clock c)              { lock.lock(); try { this.clock = c; } finally { lock.unlock(); } }\n    void addObserver(ElevatorObserver o) { observers.add(o); }\n    List<ElevatorCar> cars()            { return cars; }\n    ElevatorCar car(int id)             { return cars.get(id); }\n\n    /**\n     * A hallway button. First reject a button this building has not got (no lock: the floors never change).\n     * Then, under the lock: return the same car if the button is already lit, score the eligible cars, and only\n     * once a car has actually taken the stop record who owes it. Returns the car id, or -1 when nobody could\n     * take it yet (the call waits and is retried every tick).\n     */\n    int requestHall(int floor, Direction direction) {\n        if (direction == Direction.IDLE) throw new IllegalArgumentException(\"press UP or DOWN, not IDLE\");\n        if (floor < bottomFloor || floor > topFloor)                                  // rejected before anything is touched\n            throw new IllegalArgumentException(\"no floor \" + floor + \" in this building\");\n        if (direction == Direction.UP && floor == topFloor)                           // the ends of the shaft have one button\n            throw new IllegalArgumentException(\"there is no UP button on the top floor\");\n        if (direction == Direction.DOWN && floor == bottomFloor)\n            throw new IllegalArgumentException(\"there is no DOWN button on the ground floor\");\n        HallCall call = new HallCall(floor, direction);\n        int carId; List<CarSnapshot> snaps;\n        lock.lock();                                   // critical section: check + score + accept + record = one step\n        try {\n            raisedAtMs.putIfAbsent(call, clock.nowMs());                    // the rider has waited since the FIRST press\n            Integer already = assigned.get(call);\n            if (already != null) return already;                            // a second press is not a second trip\n            ElevatorCar chosen = choose(call);\n            if (chosen == null) { pending.add(call); return -1; }           // nothing committed: the call waits\n            assigned.put(call, chosen.id);                                  // only now, and only because accept() succeeded\n            pending.remove(call);\n            carId = chosen.id;\n            snaps = snapshots();\n        } finally { lock.unlock(); }\n        publish(snaps);                                // panels hear AFTER the lock; a broken panel stalls no car\n        return carId;\n    }\n\n    /** A button inside a car. The car owns its own stop sets, so this is a straight hand-off. */\n    void requestCar(int carId, int destination) {\n        if (destination < bottomFloor || destination > topFloor)\n            throw new IllegalArgumentException(\"no floor \" + destination + \" in this building\");\n        List<CarSnapshot> snaps;\n        lock.lock();\n        try {\n            if (recallFloor != null) throw new IllegalStateException(\"fire recall:

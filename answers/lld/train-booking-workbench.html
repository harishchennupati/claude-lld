  // race 2: fifty phones on an empty class: 7 berths + 2 RAC halves + 3 waitlist = 12 places, 38 REGRET\n        TrainRun race2 = svc.addRun(\"12999\", LocalDate.of(2026, 10, 5), 1, 3);\n        int placed = race(50, i -> svc.book(race2.id, \"fan\" + i, \"PUNE\", \"GTL\", TravelClass.AC3, List.of(t(\"Fan\" + i, 30)), false));\n        Availability left = race2.availability(\"PUNE\", \"GTL\", TravelClass.AC3);\n        System.out.println(\"fifty phones, empty 3A: placed = \" + placed + \" (must be 12), now \" + left.label() + \", waitlist \" + left.waitlisted() + \"/\" + left.waitlistCap());\n        if (placed != 12) throw new AssertionError(\"the count of places is wrong\");\n    }\n\n    /** Start n threads behind one latch so they really collide; count the calls that returned instead of throwing. */\n    static int race(int n, java.util.function.IntFunction<Pnr> call) throws Exception {\n        ExecutorService pool = Executors.newFixedThreadPool(n);                      // one thread per phone\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<Pnr>> tries = new ArrayList<>();\n        for (int i = 0; i < n; i++) { int k = i; tries.add(pool.submit(() -> { go.await(); return call.apply(k); })); }\n        go.countDown();\n        int ok = 0;\n        for (Future<Pnr> f : tries) { try { f.get(); ok++; } catch (ExecutionException e) { /* NoPlaces for the losers */ } }\n        pool.shutdown();\n        return ok;\n    }\n\n    /** A gateway that always says no, for the decline path. */\n    static PaymentGateway declining() {\n        return new PaymentGateway() {\n            public String charge(String key, long paise) { return null; }\n            public void refund(String ref, long paise) { }\n        };\n    }\n}\n", "f1": "import java.time.*;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n// ---- ext: fares that change -- Tatkal and flexi-fare, each a new rule that wraps the one before it\n/**\n * Tatkal: the base fare plus a premium of 30% of it, never below a floor or above a cap for the class. The\n * amounts are illustrative; the shape (a percentage with a floor and a cap) is the real rule's shape.\n */\nfinal class TatkalFare implements FareRule {\n    private static final Map<TravelClass, long[]> FLOOR_CAP = new EnumMap<>(Map.of(\n        TravelClass.SLEEPER, new long[] { 10_000, 20_000 }, TravelClass.AC3, new long[] { 30_000, 40_000 },\n        TravelClass.AC2, new long[] { 40_000, 50_000 }));\n    private final FareRule base;\n    TatkalFare(FareRule base) { this.base = base; }\n    /** base + clamp(30% of base, floor, cap), in integer paise. */\n    public long farePaise(TrainRun run, int from, int to, TravelClass cls) {\n        long f = base.farePaise(run, from, to, cls);\n        long[] fc = FLOOR_CAP.get(cls);\n        return f + Math.max(fc[0], Math.min(fc[1], f * 30 / 100));\n    }\n}\n\n/**\n * Flexi-fare: the price climbs 10% for every tenth of the class already sold on that journey, up to 50% more.\n * It reads the run inside book(), where the lock is already held; the lock is re-entrant, so that is safe.\n */\nfinal class FlexiFare implements FareRule {\n    private final FareRule base;\n    FlexiFare(FareRule base) { this.base = base; }\n    /** base x (100 + 10 x tenths sold, at most 150) / 100. */\n    public long farePaise(TrainRun run, int from, int to, TravelClass cls) {\n        int tenths = Math.min(5, run.soldTenths(cls, from, to));\n        return base.farePaise(run, from, to, cls) * (100 + 10 * tenths) / 100;\n    }\n}\n\n// ---- ext: a family together -- one coach if it fits, lower berths for the seniors\n/**\n * Same coach when one coach has room for the whole group; seniors (60 and over) get lower berths first; then\n * each traveller's own preference if it is free; then whatever is left, in order. When there are fewer berths\n * than travellers, seniors get them first. Pure: it reads the free list and writes nothing.\n */\nfinal class FamilyChooser implements BerthChooser {\n    /** One entry per traveller, in the group's order; exactly min(group, free) of them are berths. */\n    public List<Berth> choose(List<Berth> free, List<Traveller> group) {\n        Map<String, List<Berth>> byCoach = new LinkedHashMap<>();\n        for (Berth b : free) byCoach.computeIfAbsent(b.coach, k -> new ArrayList<>()).add(b);\n        List<Berth> pool = new ArrayList<>(free);                          // no coach fits everyone: use them all\n        for (List<Berth> coach : byCoach.values()) if (coach.size() >= group.size()) { pool = new ArrayList<>(coach); break; }\n        Integer[] order = new Integer[group.size()];\n        for (int i = 0; i < order.length; i++) order[i] = i;\n        Arrays.sort(order, Comparator.comparingInt(i -> rank(group.get(i))));   // stable: seniors, then preferences, then the rest\n        Berth[] out = new Berth[group.size()];\n        int give = Math.min(group.size(), free.size());\n        for (int k = 0; k < give; k++) {\n            Traveller t = group.get(order[k]);\n            Berth b = takeFirst(pool, t.age() >= 60 ? BerthType.LOWER : t.preference());\n            if (b == null && t.age() >= 60) b = takeFirst(pool, BerthType.SIDE_LOWER);   // a side lower is still a lower\n            if (b == null) b = pool.remove(0);\n            out[order[k]] = b;\n        }\n        return Arrays.asList(out);\n    }\n    /** 0 = senior, 1 = has a preference, 2 = anything will do. */\n    private static int rank(Traveller t) { return t.age() >= 60 ? 0 : t.preference() != null ? 1 : 2; }\n    /** Remove and return the first berth of a type, or null (a null type matches nothing). */\n    private static Berth takeFirst(List<Berth> pool, BerthType type) {\n        for (Iterator<Berth> it = pool.iterator(); it.hasNext(); ) { Berth b = it.next(); if (b.type == type) { it.remove(); return b; } }\n        return null;\n    }\n}\n\n// ---- ext: the railway's refund rule -- how much comes back depends on the hours left and the status\n/**\n * The shape of the Indian Railways rule, with illustrative amounts. A confirmed passenger loses a flat charge for\n * his class until 48 hours before departure, a quarter of his fare (at least the flat charge) until 12 hours, half\n * until 4 hours, and everything after that. An RAC or waitlisted passenger loses only a small clerkage fee. It\n * runs inside the run's lock, before anybody moves up, so it sees each passenger's status exactly as it was.\n */\nfinal class RailwayRefund implements RefundRule {\n    private static final Map<TravelClass, Long> FLAT = new EnumMap<>(Map.of(\n        TravelClass.SLEEPER, 12_000L, TravelClass.AC3, 18_000L, TravelClass.AC2, 20_000L));\n    private static final long CLERKAGE = 6_000L;\n    /** The sum over passengers, in integer paise, never below zero. */\n    public long refundPaise(Pnr p, long nowMs) {\n        long each = p.amountPaise / p.passengers.size();                  // the amount is fare x passengers exactly\n        long hoursLeft = (p.run.departsMs(p.from) - nowMs) / 3_600_000L;\n        long flat = FLAT.get(p.cls), back = 0;\n        for (Passenger x : p.passengers) {\n            long charge;\n            if (x.status != PassengerStatus.CONFIRMED) charge = CLERKAGE;           // RAC or waitlisted\n            else if (hoursLeft >= 48) charge = flat;\n            else if (hoursLeft >= 12) charge = Math.max(flat, each / 4);\n            else if (hoursLeft >= 4) charge = Math.max(flat, each / 2);\n            else charge = each;                                                     // chart prepared: nothing back\n            back += Math.max(0, each - charge);\n        }\n        return back;\n    }\n}\n\n// ---- ext: availability without the walk -- the bitmaps turned sideways\n/**\n * For each segment, one bit per berth, set where that berth is FREE on that segment. Free for [from, to) is the AND\n * of rows from .. to-1, then a count of the bits: (to - from) x berths / 64 word operations instead of one test per\n * berth. It is built from a copy of the masks taken under the run's lock, so a reader never touches the lock.\n */\nfinal class SegmentIndex {\n    private final BitSet[] freeOn;                                        // freeOn[s]: bit i = berth i is free on segment s\n    SegmentIndex(long[] soldMasks, int segments) {\n        freeOn = new BitSet[segments];\n        for (int s = 0; s < segments; s++) {\n            freeOn[s] = new BitSet(soldMasks.length);\n            for (int i = 0; i < soldMasks.length; i++) if ((soldMasks[i] & (1L << s)) == 0) freeOn[s].set(i);\n        }\n    }\n    /** How many berths are free on every segment of [from, to). */\n    int freeFor(int from, int to) {\n        BitSet acc = (BitSet) freeOn[from].clone();\n        for (int s = from + 1; s < to; s++) acc.and(freeOn[s]);\n        return acc.cardinality();\n    }\n}\n\n// ---- ext: a sweeper -- so a waitlisted passenger hears about his berth in seconds, not at the next booking\n/**\n * Correctness never needs it: every call on a run releases lapsed holds first. But if nobody touches a run for\n * an hour, a hold that lapsed at 10:10 moves nobody up until 11:10. A pass every few seconds fixes that. Each\n * pass takes each run's lock for a few microseconds and lets go.\n */\nfinal class HoldSweeper {\n    private final List<TrainRun> runs;\n    private final ScheduledExecutorService timer = Executors.newSingleThreadScheduledExecutor(\n        r -> { Thread t = new Thread(r, \"hold-sweeper\"); t.setDaemon(true); return t; });\n    HoldSweeper(List<TrainRun> runs) { this.runs = runs; }\n    /** Sweep every run every so many milliseconds; one bad run cannot kill the timer. */\n    void start(long everyMs) {\n        timer.scheduleAtFixedRate(() -> {\n            for (TrainRun r : runs) { try { r.sweep(); } catch (RuntimeException e) { /* keep sweeping the others */ } }\n        }, everyMs, everyMs, TimeUnit.MILLISECONDS);\n    }\n    /** Stop the timer thread. */\n    void stop() { timer.shutdownNow(); }\n    /** One pass by hand, for tests: how many holds were released. */\n    int sweepOnce() { int n = 0; for (TrainRun r : runs) n += r.sweep(); return n; }\n}\n\n// ---- ext: a queue in front of a run -- the Tatkal rush, and where Kafka would go\n/**\n * One worker thread per run takes booking requests off a bounded queue and runs them one at a time, in arrival\n * order: the in-process picture of a Kafka topic partitioned by run id, one consumer per partition. The caller\n * waits on a future, not on a lock. A full queue refuses at once: back-pressure (telling the caller \"try again\"\n * instead of queueing without limit).\n */\nfinal class RunQueue {\n    private final BlockingQueue<Runnable> queue;\n    private final Thread worker;\n    RunQueue(String name, int capacity) {\n        queue = new ArrayBlockingQueue<>(capacity);\n        worker = new Thread(() -> {\n            try { while (true) queue.take().run(); } catch (InterruptedException e) { /* stop() was called */ }\n        }, name);\n        worker.setDaemon(true);\n        worker.start();\n    }\n    /** Queue one request. The future completes with its result or its exception; a full queue fails it at once. */\n    <T> CompletableFuture<T> submit(Supplier<T> job) {\n        CompletableFuture<T> f = new CompletableFuture<>();\n        Runnable r = () -> { try { f.complete(job.get()); } catch (RuntimeException e) { f.completeExceptionally(e); } };\n        if (!queue.offer(r)) f.completeExceptionally(new RejectedExecutionException(\"busy: try again in a moment\"));\n        return f;\n    }\n    /** Stop the worker; anything still queued is dropped. */\n    void stop() { worker.interrupt(); }\n}\n\n// ---- ext: persistence -- the tables, and a booking as one conditional UPDATE per berth\n/**\n * The tables are the classes, payments included (the table candidates forget):\n *   station(code PK, name)\n *   train(number PK, name)\n *   train_stop(train_no, seq, station_code, time_min, day_offset, km)    PK(train_no, seq), INDEX(station_code)\n *   coach(train_no, coach_id, class, bays)\n *   train_run(id PK, train_no, origin_date)                               UNIQUE(train_no, origin_date)\n *   run_berth(run_id, berth_id, class, type, shared, sold_mask BIGINT)    PK(run_id, berth_id): bit i = segment i sold\n *   pnr(id PK, run_id, user_id, class, from_seq, to_seq, status, amount_paise, hold_expires_at)\n *   passenger(pnr_id, seq, name, age, status, berth_id NULL, queue_no NULL)   queue_no orders RAC and the waitlist\n *   payment(id PK, pnr_id, idempotency_key UNIQUE, amount_paise, status, gateway_ref)\n * Optimistic: sell segments [2,4) of one berth with one conditional UPDATE; 1 row changed = yours, 0 = taken:\n *   UPDATE run_berth SET sold_mask = sold_mask | :m WHERE run_id = ? AND berth_id = ? AND (sold_mask & :m) = 0\n * A group is one transaction: every row changes, or ROLLBACK. Pessimistic, the same result with one lock per run,\n * exactly like the ReentrantLock:  SELECT id FROM train_run WHERE id = ? FOR UPDATE; read, decide, write; COMMIT.\n * A cancel and the promotion it causes are written in that same transaction.\n */\ninterface BerthStore {\n    /** Sell segments [from, to) on every named berth of a run: all of them, or none. */\n    boolean sellAll(String runId, List<String> berthIds, int from, int to);\n    /** Give segments [from, to) of one berth back. */\n    void release(String runId, String berthId, int from, int to);\n    /** The sold mask of one berth: bit i = segment i sold. */\n    long mask(String runId, String berthId);\n}\n\n/**\n * A stand-in for the run_berth table: one row per berth per run, a 64-bit mask each. Every write is a\n * compare-and-set on the row, which is what the conditional UPDATE does: the row changes only if none of our bits\n * are set. A group takes rows in id order and, at the first refusal, clears what it set: the ROLLBACK.\n */\nfinal class MaskStore implements BerthStore {\n    private final ConcurrentHashMap<String, AtomicLong> rows = new ConcurrentHashMap<>();\n    /** Insert one empty row. */\n    void add(String runId, String berthId) { rows.put(runId + \"#\" + berthId, new AtomicLong()); }\n    /** The bits of segments [from, to), for routes of up to 64 segments. */\n    static long bits(int from, int to) { return (to == 64 ? -1L : (1L << to) - 1) ^ ((1L << from) - 1); }\n    /** The group claim: every row's bits set, or none (the rows it took are cleared again). */\n    public boolean sellAll(String runId, List<String> berthIds, int from, int to) {\n        long m = bits(from, to);\n        List<AtomicLong> taken = new ArrayList<>();\n        for (String id : new TreeSet<>(berthIds)) {                        // one fixed order for every caller\n            AtomicLong row = rows.get(runId + \"#\" + id);\n            boolean ok = false;\n            while (row != null) {                                         // loops only when OTHER bits changed meanwhile\n                long cur = row.get();\n                if ((cur & m) != 0) break;                                // WHERE (sold_mask & :m) = 0 failed: 0 rows\n                if (row.compareAndSet(cur, cur | m)) { ok = true; break; }\n            }\n            if (!ok) { for (AtomicLong r : taken) r.getAndUpdate(v -> v & ~m); return false; }   // ROLLBACK\n            taken.add(row);\n        }\n        return true;                                                      // COMMIT\n    }\n    /** UPDATE run_berth SET sold_mask = sold_mask & ~:m: clears only this journey's bits. */\n    public void release(String runId, String berthId, int from, int to) { long m = bits(from, to); rows.get(runId + \"#\" + berthId).getAndUpdate(v -> v & ~m); }\n    /** The row's current mask. */\n    public long mask(String runId, String berthId) { return rows.get(runId + \"#\" + berthId).get(); }\n}\n\n// ---- ext: the flight version -- Cleartrip's machine-coding round: sectors, fare types, a wallet\n/** A traveller's account on the flight desk: a wallet in integer paise, guarded by this object's own monitor. */\nfinal class FlyUser {\n    final String id, name;\n    private long fundsPaise;\n    FlyUser(String id, String name, long fundsPaise) { this.id = id; this.name = name; this.fundsPaise = fundsPaise; }\n    /** Take money out if there is enough; false, and nothing changed, if not. */\n    synchronized boolean debit(long paise) { if (paise > fundsPaise) return false; fundsPaise -= paise; return true; }\n    /** Put money back. */\n    synchronized void credit(long paise) { fundsPaise += paise; }\n    /** The balance now. */\n    synchronized long funds() { return fundsPaise; }\n}\n\n/** One fare type on one flight (F1, SAVER): a price per seat and its own list of seats still for sale. */\nfinal class FlightFare {\n    final String type;\n    final long pricePaise;\n    final TreeSet<String> seats = new TreeSet<>();\n    FlightFare(String type, long pricePaise, List<String> seats) { this.type = type; this.pricePaise = pricePaise; this.seats.addAll(seats); }\n}\n\n/**\n * One flight on one date: a single sector, so a seat is simply sold or not, with no segments. Each fare type sells\n * from its own seat list. One lock per flight: on this side, the flight is the aggregate root.\n */\nfinal class Flight {\n    final String number, airline, from, to;\n    final int date, departMin;\n    final Map<String, FlightFare> fares = new LinkedHashMap<>();\n    final ReentrantLock lock = new ReentrantLock();\n    Flight(String number, String airline, String from, String to, int date, int departMin) {\n        this.number = number; this.airline = airline; this.from = from; this.to = to; this.date = date; this.departMin = departMin;\n    }\n    /** Add a fare type and the seats the airline gave it. Setup only. */\n    Flight fare(String type, long pricePaise, String... seats) { fares.put(type, new FlightFare(type, pricePaise, List.of(seats))); return this; }\n    /** Number and date, the key bookings use and the order locks are taken in: \"111/2\". */\n    String key() { return number + \"/\" + date; }\n}\n\n/** One offer a search returns: a flight, a fare type with enough seats, and those seats as they were at that moment. */\nrecord Offer(Flight flight, String fareType, long pricePaise, List<String> seats) {}\n\n/** A flight booking. Its fields change only under its flight's lock (and, for a change, the new flight's too). */\nfinal class FlightBooking {\n    final String id, userId;\n    volatile Flight flight;\n    volatile String fareType;\n    volatile List<String> seats;\n    volatile long paidPaise;\n    volatile boolean cancelled;\n    FlightBooking(String id, String userId, Flight flight, String fareType, List<String> seats, long paidPaise) {\n        this.id = id; this.userId = userId; this.flight = flight; this.fareType = fareType; this.seats = seats; this.paidPaise = paidPaise;\n    }\n}\n\n/**\n * The desk: users, flights, bookings. A booking takes its flight's lock, then the user's wallet; a change takes\n * both flights' locks in key order first. One fixed order everywhere means two calls can never wait for each\n * other in a circle (a deadlock).\n */\nfinal class FlightDesk {\n    private final Map<String, FlyUser> users = new ConcurrentHashMap<>();\n    private final Map<String, Flight> flights = new ConcurrentHashMap<>();                  // \"111/2\" -> flight\n    private final Map<String, List<Flight>> bySector = new ConcurrentHashMap<>();           // \"DEL-BLR-2\" -> flights\n    private final Map<String, FlightBooking> bookings = new ConcurrentHashMap<>();\n    private final Map<String, List<FlightBooking>> byUser = new ConcurrentHashMap<>();\n    private final AtomicInteger seq = new AtomicInteger();\n\n    /** ADDUSER u1 Vinit 5000 -> \"<u1, Vinit, Rs 5,000.00>\". */\n    String addUser(String id, String name, long fundsPaise) {\n        FlyUser u = new FlyUser(id, name, fundsPaise);\n        if (users.putIfAbsent(id, u) != null) throw new IllegalArgumentException(\"user \" + id + \" exists\");\n        return \"<\" + id + \", \" + name + \", \" + Main.rupees(fundsPaise) + \">\";\n    }\n    /** The supplier's feed: a flight on a sector and date. Setup. */\n    void addFlight(Flight f) {\n        if (flights.putIfAbsent(f.key(), f) != null) throw new IllegalArgumentException(\"flight \" + f.key() + \" exists\");\n        bySector.computeIfAbsent(f.from + \"-\" + f.to + \"-\" + f.date, k -> new CopyOnWriteArrayList<>()).add(f);\n    }\n\n    /** SEARCHFLIGHT from to date pax: every flight and fare type with at least pax seats, earliest first, then cheapest. */\n    List<Offer> search(String from, String to, int date, int pax) {\n        List<Offer> out = new ArrayList<>();\n        for (Flight f : bySector.getOrDefault(from + \"-\" + to + \"-\" + date, List.of())) {\n            f.lock.lock();                                                // one flight at a time: never two locks here\n            try {\n                for (FlightFare fare : f.fares.values())\n                    if (fare.seats.size() >= pax) out.add(new Offer(f, fare.type, fare.pricePaise, List.copyOf(fare.seats)));\n            } finally { f.lock.unlock(); }\n        }\n        out.sort(Comparator.comparingInt((Offer o) -> o.flight().departMin).thenComparingLong(Offer::pricePaise));\n        return out;\n    }\n    /** The bonus search: the preferred airline's offers first, then the others, each part in the order asked for. */\n    List<Offer> searchPreferred(String from, String to, int date, int pax, String airline, Comparator<Offer> order) {\n        List<Offer> out = search(from, to, date, pax);\n        out.sort(Comparator.comparing((Offer o) -> !o.flight().airline.equals(airline)).thenComparing(order));\n        return out;\n    }\n\n    /**\n     * BOOK: every seat must be free in that one fare type and the wallet must cover them all, or nothing happens\n     * and the message says why. Returns the booking id.\n     */\n    String book(String userId, String flightNo, int date, String fareType, List<String> seats) {\n        FlyUser u = user(userId);\n        Flight f = flight(flightNo, date);\n        if (seats.isEmpty() || new HashSet<>(seats).size() != seats.size()) throw new IllegalArgumentException(\"name each seat once\");\n        f.lock.lock();\n        try {\n            FlightFare fare = fareOf(f, fareType);\n            for (String s : seats) if (!fare.seats.contains(s)) throw new IllegalStateException(\"seat \" + s + \" is not available in \" + fareType + \" on \" + f.key());\n            long cost = fare.pricePaise * seats.size();\n            if (!u.debit(cost)) throw new IllegalStateException(\"insufficient funds: \" + Main.rupees(cost) + \" needed, \" + Main.rupees(u.funds()) + \" in the wallet\");\n            fare.seats.removeAll(seats);                                  // money and seats move inside the same lock\n            FlightBooking b = new FlightBooking(\"b\" + seq.incrementAndGet(), userId, f, fareType, List.copyOf(seats), cost);\n            bookings.put(b.id, b);\n            byUser.computeIfAbsent(userId, k -> new CopyOnWriteArrayList<>()).add(b);\n            return b.id;\n        } finally { f.lock.unlock(); }\n    }\n\n    /** CANCEL: the seats go back to their fare type and the money to the wallet, once. */\n    void cancel(String userId, String bookingId) {\n        FlightBooking b = booking(userId, bookingId);\n        while (true) {\n            Flight f = b.flight;                                          // a change may move it: lock, then re-check\n            f.lock.lock();\n            try {\n                if (b.flight != f) continue;                              // it moved while we waited: go again\n                if (b.cancelled) throw new IllegalStateException(\"booking \" + bookingId + \" is already cancelled\");\n                fareOf(f, b.fareType).seats.addAll(b.seats);\n                user(userId).credit(b.paidPaise);\n                b.cancelled = true;\n                return;\n            } finally { f.lock.unlock(); }\n        }\n    }\n\n    /**\n     * UPDATE: move a booking to another flight, fare and seats, charging or refunding the difference. Both flights\n     * are locked in key order, every check runs before anything moves, so a refusal leaves the old booking intact.\n     */\n    void change(String userId, String bookingId, String newFlightNo, int newDate, String fareType, List<String> seats) {\n        FlightBooking b = booking(userId, bookingId);\n        Flight to = flight(newFlightNo, newDate);\n        if (seats.isEmpty() || new HashSet<>(seats).size() != seats.size()) throw new IllegalArgumentException(\"name each seat once\");\n        while (true) {\n            Flight from = b.flight;\n            Flight first = from.key().compareTo(to.key()) <= 0 ? from : to, second = first == from ? to : from;\n            first.lock.lock();\n            if (second != first) second.lock.lock();\n            try {\n                if (b.flight != from) continue;                           // it moved while we waited for the locks\n                if (b.cancelled) throw new IllegalStateException(\"booking \" + bookingId + \" is cancelled\");\n                FlightFare oldFare = fareOf(from, b.fareType), newFare = fareOf(to, fareType);\n                for (String s : seats)                                    // his own seats count as free on the same fare\n                    if (!newFare.seats.contains(s) && !(newFare == oldFare && b.seats.contains(s)))\n                        throw new IllegalStateException(\"seat \" + s + \" is not available in \" + fareType + \" on \" + to.key());\n                long cost = newFare.pricePaise * seats.size(), diff = cost - b.paidPaise;\n                FlyUser u = user(userId);\n                if (diff > 0 && !u.debit(diff)) throw new IllegalStateException(\"insufficient funds for the difference \" + Main.rupees(diff));\n                if (diff < 0) u.credit(-diff);\n                oldFare.seats.addAll(b.seats);                            // nothing below can fail\n                newFare.seats.removeAll(seats);\n                b.flight = to; b.fareType = fareType; b.seats = List.copyOf(seats); b.paidPaise = cost;\n                return;\n            } finally {\n                if (second != first) second.lock.unlock();\n                first.lock.unlock();\n            }\n        }\n    }\n\n    /** GET_USER_BOOKING: every booking of the user, booked and cancelled, in the order made. */\n    List<String> bookings(String userId) {\n        List<String> out = new ArrayList<>();\n        for (FlightBooking b : byUser.getOrDefault(userId, List.of()))\n            out.add(\"<\" + b.id + \", \" + b.flight.number + \", \" + b.flight.date + \", \" + String.format(\"%02d:%02d\", b.flight.departMin / 60, b.flight.departMin % 60)\n                + \", \" + Main.rupees(b.paidPaise) + \", \" + b.fareType + \", \" + b.seats + (b.cancelled ? \", CANCELLED\" : \"\") + \">\");\n        return out;\n    }\n    /** A wallet balance, for the demo and the tests. */\n    long funds(String userId) { return user(userId).funds(); }\n\n    /** A user by id, or a clear error. */\n    private FlyUser user(String id) { FlyUser u = users.get(id); if (u == null) throw new NoSuchElementException(\"no user \" + id); return u; }\n    /** A flight by number and date, or a clear error. */\n    private Flight flight(String no, int date) { Flight f = flights.get(no + \"/\" + date); if (f == null) throw new NoSuchElementException(\"no flight \" + no + \" on day \" + date); return f; }\n    /** A fare type of a flight, or a clear error. */\n    private static FlightFare fareOf(Flight f, String type) { FlightFare x = f.fares.get(type); if (x == null) throw new IllegalStateException(\"no fare \" + type + \" on \" + f.key()); return x; }\n    /** One of the user's bookings, or a clear error. */\n    private FlightBooking booking(String userId, String id) {\n        FlightBooking b = bookings.get(id);\n        if (b == null || !b.userId.equals(userId)) throw new NoSuchElementException(\"no booking \" + id + \" for \" + userId);\n        return b;\n    }\n}\n\n/** Runs every extension once, so the reference code on page 05 is code that actually executed. */\nclass ExtDemo {\n    /** Each extension once, in the order of page 05, printing what it did. */\n    public static void main(String[] args) throws Exception {\n        long[] now = { ZonedDateTime.of(2026, 10, 1, 9, 58, 0, 0, TrainRun.IST).toInstant().toEpochMilli() };\n        Clock clock = () -> now[0];\n        BookingService svc = new BookingService(clock, 10 * 60_000L);\n        svc.addTrain(Main.deccanArrow());\n        TrainRun run = svc.addRun(\"12999\", LocalDate.of(2026, 10, 2), 1, 3);\n        PaymentGateway upi = new UpiGateway();\n\n        // a family of four with grandparents: one coach, lower berths for the two over sixty\n        svc.configure(new DistanceFare(), new FamilyChooser(), new RailwayRefund());\n        Pnr fam = svc.book(run.id, \"dev\", \"CSMT\", \"SBC\", TravelClass.AC3,\n            List.of(new Traveller(\"Dev\", 45, BerthType.UPPER), new Traveller(\"Mira\", 43, null), new Traveller(\"Nana\", 72, null), new Traveller(\"Nani\", 68, null)), false);\n        svc.pay(fam.id, upi);\n        System.out.println(\"family: \" + svc.status(fam.id));\n\n        // fares: Tatkal and flexi stack on the distance rule, and the order of wrapping changes the price\n        FareRule base = new DistanceFare(), tatkal = new TatkalFare(base);\n        FareRule flexiThenTatkal = new TatkalFare(new FlexiFare(base)), tatkalThenFlexi = new FlexiFare(new TatkalFare(base));\n        System.out.println(\"3A PUNE->SBC with 4 of 7 berths sold: base \" + Main.rupees(base.farePaise(run, 1, 4, TravelClass.AC3))\n            + \", Tatkal \" + Main.rupees(tatkal.farePaise(run, 1, 4, TravelClass.AC3))\n            + \", flexi inside Tatkal \" + Main.rupees(flexiThenTatkal.farePaise(run, 1, 4, TravelClass.AC3))\n            + \", Tatkal inside flexi \" + Main.rupees(tatkalThenFlexi.farePaise(run, 1, 4, TravelClass.AC3)));\n\n        // the railway's refund rule: 30 hours before departure, a confirmed 3A ticket loses a quarter\n        Pnr asha = svc.book(run.id, \"asha\", \"PUNE\", \"SBC\", TravelClass.AC3, List.of(new Traveller(\"Asha\", 34, null)), false);\n        svc.pay(asha.id, upi);\n        now[0] = run.departsMs(1) - 30 * 3_600_000L;\n        System.out.println(\"cancel 30 hours before a \" + Main.rupees(asha.amountPaise) + \" ticket: \" + Main.rupees(svc.cancel(asha.id, upi)) + \" back\");\n\n        // availability without the walk: the same count from the sideways index\n        SegmentIndex idx = new SegmentIndex(run.soldMasks(TravelClass.AC3), run.train.segments());\n        System.out.println(\"3A free PUNE->SUR: run says \" + run.availability(\"PUNE\", \"SUR\", TravelClass.AC3).berths() + \", sideways index says \" + idx.freeFor(1, 2));\n\n        // a sweeper releases a lapsed hold without anybody calling the run\n        Pnr ghost = svc.book(run.id, \"ghost\", \"CSMT\", \"PUNE\", TravelClass.SLEEPER, List.of(new Traveller(\"Ghost\", 30, null)), false);\n        now[0] += 10 * 60_000L;\n        HoldSweeper sweeper = new HoldSweeper(List.of(run));\n        System.out.println(\"the sweeper released \" + sweeper.sweepOnce() + \" hold; PNR \" + ghost.id + \" is \" + ghost.status);\n\n        // a queue in front of the run: one worker, arrival order, a bounded queue that says \"try again\"\n        TrainRun rush = svc.addRun(\"12999\", LocalDate.of(2026, 10, 6), 1, 3);\n        RunQueue q = new RunQueue(\"run-\" + rush.id, 64);\n        List<CompletableFuture<Pnr>> answers = new ArrayList<>();\n        for (int i = 0; i < 10; i++) { String u = \"tatkal\" + i; answers.add(q.submit(() -> svc.book(rush.id, u, \"CSMT\", \"SBC\", TravelClass.AC3, List.of(new Traveller(u, 30, null)), true))); }\n        int got = 0; for (CompletableFuture<Pnr> f : answers) { try { f.get(); got++; } catch (ExecutionException e) { /* NoPlaces */ } }\n        System.out.println(\"ten Tatkal requests through the queue for 7 berths: \" + got + \" booked, in arrival order\");\n        q.stop();\n\n        // persistence: fifty callers, one conditional UPDATE on one berth's mask: one row changes\n        MaskStore db = new MaskStore();\n        db.add(\"R1\", \"B1/1\"); db.add(\"R1\", \"B1/2\");\n        ExecutorService pool = Executors.newFixedThreadPool(50);\n        CountDownLatch go = new CountDownLatch(1);\n        AtomicInteger wins = new AtomicInteger();\n        for (int i = 0; i < 50; i++) pool.submit(() -> { go.await(); if (db.sellAll(\"R1\", List.of(\"B1/1\"), 1, 3)) wins.incrementAndGet(); return null; });\n        go.countDown(); pool.shutdown(); pool.awaitTermination(5, TimeUnit.SECONDS);\n        System.out.println(\"fifty conditional UPDATEs on B1/1 segments 1-3: \" + wins.get() + \" winner; the same berth for segments 3-4: \"\n            + db.sellAll(\"R1\", List.of(\"B1/1\"), 3, 4) + \"; mask now \" + Long.toBinaryString(db.mask(\"R1\", \"B1/1\")));\n\n        // the flight version: Cleartrip's commands\n        FlightDesk desk = new FlightDesk();\n        System.out.println(desk.addUser(\"u1\", \"Vinit\", 500_000) + \" \" + desk.addUser(\"u2\", \"Neha\", 150_000));\n        desk.addFlight(new Flight(\"111\", \"6E\", \"DEL\", \"BLR\", 2, 10 * 60 + 30).fare(\"F1\", 100_000, \"10a\", \"11c\", \"20b\", \"21a\").fare(\"F2\", 150_000, \"1a\", \"1b\"));\n        desk.addFlight(new Flight(\"211\", \"6E\", \"DEL\", \"BLR\", 2, 18 * 60 + 45).fare(\"F1\", 120_000, \"10a\", \"11c\", \"20b\"));\n        desk.addFlight(new Flight(\"141\", \"AI\", \"DEL\", \"BLR\", 2, 7 * 60 + 10).fare(\"F4\", 140_000, \"32e\", \"33a\"));\n        for (Offer o : atic class CountingGateway implements PaymentGateway {\n        final AtomicInteger charges = new AtomicInteger(), refunds = new AtomicInteger();\n        private final Map<String, String> byKey = new ConcurrentHashMap<>();\n        private final Set<String> refunded = ConcurrentHashMap.newKeySet();\n        private final boolean approve;\n        CountingGateway(boolean approve) { this.approve = approve; }\n        /** One reference per key; null when this gateway declines everything. */\n        public String charge(String key, long paise) { if (!approve) return null; return byKey.computeIfAbsent(key, k -> \"REF-\" + charges.incrementAndGet()); }\n        /** Counts each reference given back once. */\n        public void refund(String ref, long paise) { if (refunded.add(ref)) refunds.incrementAndGet(); }\n    }\n\n    static final long[] now = { ZonedDateTime.of(2026, 10, 1, 9, 58, 0, 0, TrainRun.IST).toInstant().toEpochMilli() };\n    static final long HOLD = 10 * 60_000L;\n    static int nextDay = 10;\n    static final String[] ST = { \"CSMT\", \"PUNE\", \"SUR\", \"GTL\", \"SBC\" };\n\n    /** A service with the Deccan Arrow and the shared clock the tests move by hand. */\n    static BookingService service() { BookingService s = new BookingService(() -> now[0], HOLD); s.addTrain(Main.deccanArrow()); return s; }\n    /** A run of the Deccan Arrow on a date no other test uses. With 1 RAC berth: 7 bookable 3A berths; with 0: 8. */\n    static TrainRun freshRun(BookingService s, int racBerths, int waitlistCap) { return s.addRun(\"12999\", LocalDate.of(2026, 10, 2).plusDays(nextDay++), racBerths, waitlistCap); }\n    /** A traveller with no preference. */\n    static Traveller t(String name, int age) { return new Traveller(name, age, null); }\n    /** n travellers aged 30 named prefix1 .. prefixN. */\n    static List<Traveller> people(String prefix, int n) { List<Traveller> out = new ArrayList<>(); for (int i = 1; i <= n; i++) out.add(t(prefix + i, 30)); return out;              if (p.cls != c) continue;\n                boolean live = p.status == PnrStatus.PENDING_PAYMENT || p.status == PnrStatus.BOOKED;\n                for (Passenger x : p.passengers) {\n                    String who = p.id + \" \" + x.who.name();\n                    if (live == (x.status == PassengerStatus.CANCELLED)) bad.add(who + \" is \" + x.status + \" on a \" + p.status + \" PNR\");\n                    if (x.place != null) on.computeIfAbsent(x.place, k -> new ArrayList<>()).add(x);\n                    boolean inRac = inv.rac.contains(x), inWl = inv.waitlist.contains(x);\n                    switch (x.status) {\n                        case CONFIRMED -> { if (x.place == null || x.place.shared || inRac || inWl) bad.add(who + \": CONFIRMED but not on a berth of his own\"); }\n                        case RAC -> {\n                            if (x.place == null || !x.place.shared || !inRac || inWl) bad.add(who + \": RAC but not on a shared half in the RAC queue\");\n                            else if (ClassInventory.firstFree(inv.berths, p.from, p.to) != null) bad.add(who + \" is RAC while a berth fits his journey\");\n                        }\n                        case WAITLISTED -> {\n                            if (x.place != null || inRac || !inWl) bad.add(who + \": WAITLISTED but not only on the waitlist\");\n                            else if (ClassInventory.firstFree(inv.berths, p.from, p.to) != null || ClassInventory.firstFree(inv.racHalves, p.from, p.to) != null)\n                                bad.add(who + \" waits while a place fits his journey\");\n                        }\n                        case CANCELLED -> { if (x.place != null || inRac || inWl) bad.add(who + \": CANCELLED but still holding something\"); }\n                    }\n                }\n            }\n            List<Berth> places = new ArrayList<>(inv.berths);\n            places.addAll(inv.racHalves);\n            int segs = run.train.segments();\n f(t(\"W\", 30)), false);\n            CyclicBarrier both = new CyclicBarrier(2);\n            ExecutorService two = Executors.newFixedThreadPool(2);\n            Future<Long> a = two.submit(() -> { both.await(); return s6.cancel(holder.id, pay); });\n            Future<Pnr> b = two.submit(() -> { both.await(); return s6.book(r6.id, \"n\", \"PUNE\", \"SUR\", TravelClass.AC3, List.of(t(\"N\", 30)), false); });\n            a.get(5, TimeUnit.SECONDS);\n            Pnr newcomer = b.get(5, TimeUnit.SECONDS);\n            two.shutdown();\n            if (place(waiter).equals(\"B1/1\") && newcomer.passengers.get(0).status == PassengerStatus.WAITLISTED && violations(r6).isEmpty()) fair++;\n        }\n        check(fair == 100, \"a cancel racing a newcomer, 100 rounds: the waiter got the freed berth every time (\" + fair + \")\");\n\n        // 7. a group is all or nothing\n        BookingService s7 = service();\n        TrainRun r7 = freshRun(s7, 1, 3);\n        s7.book(r7.id, \"grp\", \"CSMT\", \"SBC\", TravelClass.AC3, people(\"g\", 6), true);           // one berth left, 2 RAC halves, 3 waitlist\n        Availability before7 = s7.availability(r7.id, \"CSMT\", \"SBC\", TravelClass.AC3);\n        try { s7.book(r7.id, \"pair\", \"CSMT\", \"SBC\", TravelClass.AC3, people(\"p\", 2), true); check(false, \"two travellers, berths only, one berth: must be refused\"); }\n        catch (NoPlaces e) { check(true, \"two travellers, berths only, one berth free: refused (\" + e.getMessage() + \")\"); }\n        check(s7.availability(r7.id, \"CSMT\", \"SBC\", TravelClass.AC3).equals(before7), \"the refusal held nothing: \" + before7.label());\n        s7.book(r7.id, \"one\", \"CSMT\", \"SBC\", TravelClass.AC3, List.of(t(\"One\", 30)), false);  // the last berth\n        try { s7.book(r7.id, \"six\", \"CSMT\", \"SBC\", TravelClass.AC3, people(\"s\", 6), false); check(false, \"six travellers for five places: must be refused\"); }\n        catch (NoPlaces e) { check(true, \"six travellers );\n\n        // 9. a declined card keeps the places; ten minutes later the holds lapse and the waiter moves up\n        BookingService s9 = service();\n        TrainRun r9 = freshRun(s9, 0, 3);\n        Pnr held = s9.book(r9.id, \"held\", \"CSMT\", \"SBC\", TravelClass.AC3, people(\"h\", 6), true);\n        Pnr held2 = s9.book(r9.id, \"held2\", \"CSMT\", \"SBC\", TravelClass.AC3, people(\"k\", 2), true);   // all 8 berths held, none paid\n        Pnr waiter9 = s9.book(r9.id, \"w\", \"CSMT\", \"SBC\", TravelClass.AC3, List.of(t(\"W\", 30)), false);\n        s9.pay(waiter9.id, pay);\n        CountingGateway no = new CountingGateway(false);\n        try { s9.pay(held.id, no); check(false, \"a declined card must throw\"); }\n        catch (PaymentDeclined e) { check(true, \"a declined card throws: \" + e.getMessage()); }\n        check(held.status == PnrStatus.PENDING_PAYMENT && s9.status(held.id).get(0).startsWith(\"h1 CNF\"), \"after the decline the berths are still held for the same PNR\");\n        check(no.refunds.get() == 0, \"nothing was refunded: nothing was taken\");\n        now[0] = held.holdExpiresMs - 1;\n        check(s9.status(waiter9.id).equals(List.of(\"W WL 1\")), \"one millisecond before ten minutes the holds are alive and the waiter waits\");\n        now[0] = held.holdExpiresMs;\n        check(s9.status(waiter9.id).get(0).startsWith(\"W CNF\"), \"at ten minutes the next call releases the holds and confirms the waiter: \" + s9.status(waiter9.id));\n        check(held.status == PnrStatus.EXPIRED && held2.status == PnrStatus.EXPIRED, \"both unpaid PNRs are EXPIRED, with no sweeper running\");\n\n        // 10. the bank answers after the hold ran out: refused, and the money goes back once\n        BookingService s10 = service();\n        TrainRun r10 = freshRun(s10, 1, 3);\n        Pnr late = s10.book(r10.id, \"asha\", \"PUNE\", \"SBC\", TravelClass.AC3, List.of(t(\"Asha\", 34)), false);\n        CountingGateway slow = new CountingGateway(true) {\n            public String charge(String key, long paise) { now[0] += HOLD + 1; return super.charge(key, paise); }   // the round trip outlived the hold\n        };\n        try { s10.pay(late.id, slow); check(false, \"a payment after the hold must be refused\"); }\n        catch (HoldLapsed e) { check(true, \"the money came back after the hold ran out: refused (\" + e.getMessage() + \")\"); }\n        check(slow.charges.get() == 1 && slow.refunds.get() == 1, \"charged once and refunded once\");\n        check(late.status == PnrStatus.EXPIRED && s10.availability(r10.id, \"PUNE\", \"SBC\", TravelClass.AC3).berths() == 7, \"the PNR is EXPIRED and the berth is on sale again\");\n\n        // 11. the PNR is the idempotency key: a retry after a timeout, or two taps at once, is charged once\n        BookingService s11 = service();\n        TrainRun r11 = freshRun(s11, 1, 3);\n        Pnr tara = s11.book(r11.id, \"tara\", \"CSMT\", \"PUNE\", TravelClass.AC3, List.of(t(\"Tara\", 30)), false);\n        CountingGateway flaky = new CountingGateway(true) {\n            boolean first = true;\n            public String charge(String key, long paise) {\n                String r = super.charge(key, paise);\n                if (first) { first = false; throw new RuntimeException(\"timeout after the money moved\"); }\n                return r;\n            }\n        };\n        try { s11.pay(tara.id, flaky); } catch (RuntimeException e) { /* the app says \"something went wrong\"; she taps Pay again */ }\n        s11.pay(tara.id, flaky);\n        check(tara.status == PnrStatus.BOOKED && flaky.charges.get() == 1 && flaky.refunds.get() == 0, \"a timeout, then Pay again: charged once (\" + flaky.charges.get() + \")\");\n        Pnr uma = s11.book(r11.id, \"uma\", \"CSMT\", \"PUNE\", TravelClass.AC3, List.of(t(\"Uma\", 30)), false);\n        CyclicBarrier bothIn = new CyclicBarrier(2);\n        CountingGateway meeting = new CountingGateway(true) {\n            public String charge(String key, long paise) {\n                try { bothIn.await(2, TimeUnit.SECONDS); } catch (Exception e) { throw new IllegalStateException(e); }   // both taps inside at once\n                return super.charge(key, paise);\n            }\n        };\n        ExecutorService taps = Executors.newFixedThreadPool(2);\n        Future<Pnr> tapA = taps.submit(() -> s11.pay(uma.id, meeting)), tapB = taps.submit(() -> s11.pay(uma.id, meeting));\n        tapA.get(5, TimeUnit.SECONDS);\n        tapB.get(5, TimeUnit.SECONDS);\n        taps.shutdown();\n        check(uma.status == PnrStatus.BOOKED && meeting.charges.get() == 1 && meeting.refunds.get() == 0, \"two taps on Pay at the same instant: one charge, nothing to refund\");\n        try { s11.pay(uma.id, meeting); check(false, \"paying a BOOKED PNR must be refused\"); }\n        catch (IllegalStateException e) { check(meeting.charges.get() == 1, \"paying a BOOKED PNR again is refused before any money moves\"); }\n\n        // 12. a listener that throws breaks nothing\n        BookingService s12 = service();\n        s12.addObserver(e -> { throw new RuntimeException(\"SMS gateway is down\"); });\n        List<PnrEvent> after12 = new CopyOnWriteArrayList<>();\n        s12.addObserver(after12::add);\n        TrainRun r12 = freshRun(s12, 1, 3);\n        Pnr p12 = s12.book(r12.id, \"vik\", \"CSMT\", \"SBC\", TravelClass.AC3, List.of(t(\"Vik\", 30)), false);\n        s12.pay(p12.id, pay);\n        check(p12.status == PnrStatus.BOOKED, \"the booking completes although the first listener throws\");\n        check(after12.size() == 1 && after12.get(0).what().startsWith(\"BOOKED\"), \"the listener after the broken one still hears it\");\n\n        // 13. the refund rule: waitlisted passengers lose a clerkage fee; confirmed ones lose more as departure nears\n        long[] clk = { now[0] };\n        BookingService s13 = new BookingService(() -> clk[0], HOLD);\n        s13.addTrain(Main.deccanArrow());\n        s13.configure(new DistanceFare(), new FirstFreeBerths(), new RailwayRefund());\n        TrainRun r13 = s13.addRun(\"12999\", LocalDate.of(2026, 12, 1), 0, 3);\n        TrainRun r13b = s13.addRun(\"12999\", LocalDate.of(2026, 12, 2), 0, 3);\n        long departPune = r13.departsMs(1);\n        clk[0] = departPune - 70 * 3_600_000L;\n        s13.book(r13b.id, \"a\", \"PUNE\", \"SBC\", TravelClass.AC3, people(\"a\", 6), true);\n        s13.book(r13b.id, \"b\", \"PUNE\", \"SBC\", TravelClass.AC3, people(\"b\", 2), true);          // 8 berths held\n        Pnr wl13 = s13.book(r13b.id, \"wl\", \"PUNE\", \"SBC\", TravelClass.AC3, List.of(t(\"WL\", 30)), false);\n        s13.pay(wl13.id, pay);\n        check(s13.cancel(wl13.id, pay) == 121_520 - 6_000, \"a waitlisted passenger loses only the clerkage fee: Rs 1,155.20 of Rs 1,215.20 back\");\n        Pnr unpaid = s13.book(r13b.id, \"u\", \"PUNE\", \"SBC\", TravelClass.AC3, List.of(t(\"U\", 30)), false);\n        int refundsBefore = pay.refunds.get();\n        check(s13.cancel(unpaid.id, pay) == 0 && pay.refunds.get() == refundsBefore, \"a hold that was never paid refunds nothing and calls no gateway\");\n        long[] hoursBefore = { 60, 30, 8, 2 };\n        long[] expected = { 121_520 - 18_000, 121_520 - 30_380, 121_520 - 60_760, 0 };\n        for (int k = 0; k < 4; k++) {\n            clk[0] = departPune - hoursBefore[k] * 3_600_000L;\n            Pnr p = s13.book(r13.id, \"r\" + k, \"PUNE\", \"SBC\", TravelClass.AC3, List.of(t(\"R\" + k, 30)), false);\n            s13.pay(p.id, pay);\n            long back = s13.cancel(p.id, pay);\n            check(back == expected[k], hoursBefore[k] + \" hours before departure, a confirmed Rs 1,215.20 ticket gets \" + Main.rupees(back) + \" back\");\n        }\n\n        // 14. search: by the day you board, only forwards along the route, earliest first\n        BookingService s14 = service();\n        s14.addTrain(new Train(\"12111\", \"Morning Link\", List.of(new Stop(\"PUNE\", 6 * 60, 0, 0), new Stop(\"SUR\", 11 * 60, 0, 263),\n            new Stop(\"SBC\", 22 * 60, 0, 868)), List.of(new Coach(\"C1\", TravelClass.AC3, 1))));\n        for (LocalDate d : List.of(LocalDate.of(2026, 10, 2), LocalDate.of(2026, 10, 3))) { s14.addRun(\"12999\", d, 1, 3); s14.addRun(\"12111\", d, 1, 3); }\n        List<String> puneSbc = ids(s14.search(\"PUNE\", \"SBC\", LocalDate.of(2026, 10, 3)));\n        check(puneSbc.equals(List.of(\"12111/2026-10-03\", \"12999/2026-10-03\")), \"PUNE-SBC on 3 Oct: the 06:00 first, then the 23:15 \" + puneSbc);\n        List<String> surSbc = ids(s14.search(\"SUR\", \"SBC\", LocalDate.of(2026, 10, 3)));\n        check(surSbc.equals(List.of(\"12999/2026-10-02\", \"12111/2026-10-03\")), \"SUR-SBC on 3 Oct finds the train that left Mumbai on the 2nd (04:30) before the 11:00 \" + surSbc);\n        check(s14.search(\"SBC\", \"PUNE\", LocalDate.of(2026, 10, 3)).isEmpty(), \"the wrong direction finds nothing\");\n        check(s14.search(\"CSMT\", \"XYZ\", LocalDate.of(2026, 10, 3)).isEmpty(), \"a station no train stops at finds nothing\");\n        check(s14.train(\"12999\").stops.size() == 5, \"search by train number gives the route and its five stops\");\n\n        // 15. availability reads AVAILABLE, then RAC, then WL, then REGRET as the class fills\n        BookingService s15 = service();\n        TrainRun r15 = freshRun(s15, 1, 3);\n        List<String> labels = new ArrayList<>();\n        labels.add(s15.availability(r15.id, \"PUNE\", \"SUR\", TravelClass.AC3).label());\n        s15.book(r15.id, \"a\", \"PUNE\", \"SUR\", TravelClass.AC3, people(\"a\", 6), false);\n        s15.book(r15.id, \"b\", \"PUNE\", \"SUR\", TravelClass.AC3, people(\"b\", 1), false);\n        labels.add(s15.availability(r15.id, \"PUNE\", \"SUR\", TravelClass.AC3).label());\n        s15.book(r15.id, \"c\", \"PUNE\", \"SUR\", TravelClass.AC3, people(\"c\", 2), false);\n        labels.add(s15.availability(r15.id, \"PUNE\", \"SUR\", TravelClass.AC3).label());\n        s15.book(r15.id, \"d\", \"PUNE\", \"SUR\", TravelClass.AC3, people(\"d\", 3), false);\n        labels.add(s15.availability(r15.id, \"PUNE\", \"SUR\", TravelClass.AC3).label());\n        check(labels.equals(List.of(\"AVAILABLE 7\", \"RAC 1\", \"WL 1\", \"REGRET\")), \"the label follows the class filling up, each number the next passenger's: \" + labels);\n        check(s15.availability(r15.id, \"CSMT\", \"PUNE\", TravelClass.AC3).label().equals(\"AVAILABLE 7\"), \"and CSMT-PUNE on the same run is still wide open\");\n\n        // 16. the model holds: 3,000 random operations on one thread, then 8 threads at once\n        Random rnd = new Random(2026);\n        BookingService s16 = service();\n        List<PnrEvent> moves = new CopyOnWriteArrayList<>();\n        s16.addObserver(e -> { if (e.what().contains(\"->\")) moves.add(e); });\n        TrainRun r16 = freshRun(s16, 1, 4);\n        List<Pnr> live = new ArrayList<>();\n        int broken = 0;\n        for (int i = 0; i < 3000; i++) {\n            int op = rnd.nextInt(10);\n            try {\n                if (op < 5) {\n                    int[] j = journey(rnd);\n                    live.add(s16.book(r16.id, \"u\", ST[j[0]], ST[j[1]], rnd.nextBoolean() ? TravelClass.AC3 : TravelClass.SLEEPER,\n                        people(\"r\" + i + \"-\", 1 + rnd.nextInt(3)), rnd.nextInt(4) == 0));\n                } else if (op < 7 && !live.isEmpty()) s16.pay(live.get(rnd.nextInt(live.size())).id, pay);\n                else if (op < 9 && !live.isEmpty()) s16.cancel(live.remove(rnd.nextInt(live.size())).id, pay);\n                else now[0] += rnd.nextInt(4) * 60_000L;                          // up to three minutes: some holds lapse\n            } catch (RuntimeException e) { /* NoPlaces, HoldLapsed, a cancel of an expired hold: all legal refusals */ }\n            List<String> v = violations(r16);\n            if (!v.isEmpty() && broken++ == 0) System.out.println(\"  first violation at operation \" + i + \": \" + v);\n        }\n        check(broken == 0, \"3,000 random books, payments, cancels and clock moves: every invariant held after every one\");\n        check(moves.size() > 50, \"the workload moved waiters up \" + moves.size() + \" times, so promotion was really exercised\");\n        TrainRun r16b = freshRun(s16, 1, 4);\n        ExecutorService crowd = Executors.newFixedThreadPool(8);\n        CountDownLatch go16 = new CountDownLatch(1);\n        List<Future<Object>> jobs = new ArrayList<>();\n        for (int th = 0; th < 8; th++) {\n            int seed = th;\n            jobs.add(crowd.submit(() -> {\n                go16.await();\n                Random r = new Random(seed);\n                List<Pnr> mine = new ArrayList<>();\n                for (int i = 0; i < 400; i++) {\n                    try {\n                        if (mine.isEmpty() || r.nextInt(3) > 0) {\n                            int[] j = journey(r);\n                            Pnr p = s16.book(r16b.id, \"c\" + seed, ST[j[0]], ST[j[1]], TravelClass.AC3, people(\"c\" + seed + \"-\" + i + \"-\", 1 + r.nextInt(2)), false);\n                            mine.add(p);\n                            if (r.nextBoolean()) s16.pay(p.id, pay);\n                        } else s16.cancel(mine.remove(r.nextInt(mine.size())).id, pay);\n                    } catch (RuntimeException e) { /* a refusal */ }\n                }\n                return null;\n            }));\n        }\n        go16.countDown();\n        for (Future<Object> f : jobs) f.get(30, TimeUnit.SECONDS);\n        crowd.shutdown();\n        check(violations(r16b).isEmpty(), \"8 threads x 400 random books, payments and cancels at once: every invariant holds at the end \" + violations(r16b));\n\n        // 17. edges are refused, and nothing is held\n        BookingService s17 = service();\n        TrainRun r17 = freshRun(s17, 1, 3);\n        Object[][] edges = { { \"PUNE\", \"PUNE\", 1 }, { \"SBC\", \"PUNE\", 1 }, { \"CSMT\", \"XYZ\", 1 }, { \"CSMT\", \"SBC\", 0 }, { \"CSMT\", \"SBC\", 7 } };\n        for (Object[] c : edges) {\n            try { s17.book(r17.id, \"e\", (String) c[0], (String) c[1], TravelClass.AC3, people(\"e\", (Integer) c[2]), false); check(false, \"must be refused: \" + Arrays.toString(c)); }\n            catch (IllegalArgumentException e) { check(true, \"refused: \" + e.getMessage()); }\n        }\n        try { s17.book(r17.id, \"e\", \"CSMT\", \"SBC\", TravelClass.AC2, people(\"e\", 1), false); check(false, \"a class the train does not have must be refused\"); }\n        catch (NoSuchElementException e) { check(true, \"refused: \" + e.getMessage()); }\n        long[] clk17 = { r17.departsMs(1) + 60_000 };                                // a minute after it left Pune\n        BookingService s17b = new BookingService(() -> clk17[0], HOLD);\n        s17b.addTrain(Main.deccanArrow());\n        TrainRun r17b = s17b.addRun(\"12999\", r17.date, 1, 3);\n        try { s17b.book(r17b.id, \"e\", \"PUNE\", \"SBC\", TravelClass.AC3, people(\"e\", 1), false); check(false, \"boarding after the train left must be refused\"); }\n        catch (IllegalStateException e) { check(true, \"refused: \" + e.getMessage()); }\n        Pnr fromSur = s17b.book(r17b.id, \"e\", \"SUR\", \"SBC\", TravelClass.AC3, people(\"s\", 1), false);\n        check(fromSur.status == PnrStatus.PENDING_PAYMENT, \"but Solapur is still ahead of the train, so a Solapur boarding is sold\");\n        check(s17.availability(r17.id, \"CSMT\", \"SBC\", TravelClass.AC3).berths() == 7 && r17.pnrs().isEmpty(), \"the refusals held nothing\");\n\n        // 18. fares: distance, a peak day, Tatkal with its floor, flexi, and the order of wrapping\n        BookingService s18 = service();\n        TrainRun r18 = freshRun(s18, 1, 3), other18 = freshRun(s18, 1, 3);\n        FareRule base = new DistanceFare();\n        check(base.farePaise(r18, 1, 4, TravelClass.AC3) == 121_520, \"3A PUNE-SBC is 140 paise x 868 km = Rs 1,215.20\");\n        FareRule peak = new PeakDayFare(base, Set.of(r18.date), 120);\n        check(peak.farePaise(r18, 1, 4, TravelClass.AC3) == 145_824 && peak.farePaise(other18, 1, 4, TravelClass.AC3) == 121_520,\n              \"a peak day pays 1.2x (Rs 1,458.24); the next day pays Rs 1,215.20\");\n        check(new TatkalFare(base).farePaise(r18, 1, 4, TravelClass.AC3) == 121_520 + 36_456, \"Tatkal adds 30%: Rs 364.56, inside its floor and cap\");\n        check(new TatkalFare(base).farePaise(r18, 0, 1, TravelClass.AC3) == 26_880 + 30_000, \"a short Tatkal journey pays the floor: 30% of Rs 268.80 is below Rs 300\");\n        FareRule flexi = new FlexiFare(base);\n        check(flexi.farePaise(r18, 1, 4, TravelClass.AC3) == 121_520, \"flexi on an empty class is the base fare\");\n        s18.book(r18.id, \"g\", \"CSMT\", \"SBC\", TravelClass.AC3, people(\"g\", 4), true);          // 4 of 7 sold: 5 tenths\n        check(flexi.farePaise(r18, 1, 4, TravelClass.AC3) == 182_280, \"flexi with 4 of 7 berths sold: 1.5x, the cap\");\n        long inner = new TatkalFare(new FlexiFare(base)).farePaise(r18, 1, 4, TravelClass.AC3), outer = new FlexiFare(new TatkalFare(base)).farePaise(r18, 1, 4, TravelClass.AC3);\n        check(inner == 222_280 && outer == 236_964, \"the order of wrapping is a decision: flexi inside Tatkal \" + Main.rupees(inner) + \", Tatkal inside flexi \" + Main.rupees(outer));\n\n        // 19. a family together: one coach when one coach has room, lower berths for the seniors, seniors first when short\n        Train twoCoach = new Train(\"12888\", \"Two Coach\", Main.deccanArrow().stops, List.of(new Coach(\"B1\", TravelClass.AC3, 1), new Coach(\"B2\", TravelClass.AC3, 1)));\n        BookingService s19 = new BookingService(() -> now[0], HOLD);\n        s19.addTrain(twoCoach);\n        TrainRun r19 = s19.addRun(\"12888\", LocalDate.of(2026, 12, 20), 1, 3);            // B1: 8 berths, B2: 7 (B2/7 is the RAC berth)\n        s19.book(r19.id, \"x\", \"CSMT\", \"SBC\", TravelClass.AC3, people(\"x\", 6), true);      // B1/1..6: only 2 left in B1\n        s19.configure(new DistanceFare(), new FamilyChooser(), new FullRefund());\n        Pnr family = s19.book(r19.id, \"dev\", \"CSMT\", \"SBC\", TravelClass.AC3,\n            List.of(new Traveller(\"Dev\", 45, BerthType.UPPER), t(\"Mira\", 43), t(\"Nana\", 72), t(\"Nani\", 68)), false);\n        List<String> famStatus = s19.status(family.id);\n        check(famStatus.stream().allMatch(s -> s.contains(\" B2/\")), \"four travellers, two berths left in B1: all four go to B2 together \" + famStatus);\n        check(famStatus.get(2).endsWith(\"LOWER\") && famStatus.get(3).endsWith(\"LOWER\") && famStatus.get(0).endsWith(\"UPPER\"), \"the two over sixty get lower berths, Dev his upper\");\n        TrainRun r19b = s19.addRun(\"12888\", LocalDate.of(2026, 12, 21), 1, 3);\n        s19.configure(new DistanceFare(), new FirstFreeBerths(), new FullRefund());\n        s19.book(r19b.id, \"x\", \"CSMT\", \"SBC\", TravelClass.AC3, people(\"x\", 6), true);\n        s19.book(r19b.id, \"y\", \"CSMT\", \"SBC\", TravelClass.AC3, people(\"y\", 6), true);\n        s19.book(r19b.id, \"z\", \"CSMT\", \"SBC\", TravelClass.AC3, people(\"z\", 1), true);      // 13 of 15: two berths left\n        s19.configure(new DistanceFare(), new FamilyChooser(), new FullRefund());\n        Pnr short19 = s19.book(r19b.id, \"o\", \"CSMT\", \"SBC\", TravelClass.AC3, List.of(t(\"Anil\", 30), t(\"Bina\", 31), t(\"Grandpa\", 75)), false);\n        check(statuses(short19).get(2) == PassengerStatus.CONFIRMED && statuses(short19).contains(PassengerStatus.RAC), \"two berths for three: Grandpa, listed last, still gets one \" + statuses(short19));\n\n        // 20. the sideways index counts the same free berths as the walk, for every journey\n        SegmentIndex idx = new SegmentIndex(r16.soldMasks(TravelClass.AC3), r16.train.segments());\n        boolean same = true;\n        for (int a = 0; a < 4; a++) for (int b = a + 1; b <= 4; b++) same &= idx.freeFor(a, b) == r16.availability(ST[a], ST[b], TravelClass.AC3).berths();\n        check(same, \"after the random workload, the sideways index and the walk agree on all ten journeys\");\n\n        // 21. a queue in front of the run: arrival order, and a full queue says \"try again\" at once\n        BookingService s21 = service();\n        TrainRun r21 = freshRun(s21, 1, 3);\n        RunQueue q = new RunQueue(\"run-\" + r21.id, 64);\n        List<CompletableFuture<Pnr>> answers = new ArrayList<>();\n        for (int i = 0; i < 10; i++) { String u = \"tatkal\" + i; answers.add(q.submit(() -> s21.book(r21.id, u, \"CSMT\", \"SBC\", TravelClass.AC3, List.of(t(u, 30)), true))); }\n        List<Boolean> got = new ArrayList<>();\n        for (CompletableFuture<Pnr> f : answers) { try { f.get(5, TimeUnit.SECONDS); got.add(true); } catch (ExecutionException e) { got.add(false); } }\n        check(got.equals(List.of(true, true, true, true, true, true, true, false, false, false)), \"ten requests for seven berths: the first seven, in arrival order, get them \" + got);\n        q.stop();\n        RunQueue tiny = new RunQueue(\"tiny\", 1);\n        CountDownLatch started = new CountDownLatch(1), release = new CountDownLatch(1);\n        tiny.submit(() -> { started.countDown(); try { release.await(); } catch (InterruptedException e) { } return 1; });   // keeps the worker busy\n        started.await(2, TimeUnit.SECONDS);\n        CompletableFuture<Integer> queued = tiny.submit(() -> 2), refused = tiny.submit(() -> 3);\n        check(refused.isCompletedExceptionally() && !queued.isDone(), \"the queue holds one: the third request is refused at once instead of waiting\");\n        release.countDown();\n        check(queued.get(2, TimeUnit.SECONDS) == 2, \"the queued request still runs once the worker is free\");\n        tiny.stop();\n\n        // 22. the database stand-in: fifty conditional UPDATEs on one row, one winner; touching segments share a row; a group rolls back\n        MaskStore db = new MaskStore();\n        db.add(\"R\", \"B1/1\"); db.add(\"R\", \"A9/9\");\n        ExecutorService pool22 = Executors.newFixedThreadPool(50);\n        CountDownLatch go22 = new CountDownLatch(1);\n        AtomicInteger won = new AtomicInteger();\n        for (int i = 0; i < 50; i++) pool22.submit(() -> { go22.await(); if (db.sellAll(\"R\", List.of(\"B1/1\"), 1, 3)) won.incrementAndGet(); return null; });\n        go22.countDown(); pool22.shutdown(); pool22.awaitTermination(5, TimeUnit.SECONDS);\n        check(won.get() == 1, \"fifty conditional UPDATEs for segments 1-3 of one berth: one row changed (\" + won.get() + \")\");\n        check(db.sellAll(\"R\", List.of(\"B1/1\"), 3, 4) && !db.sellAll(\"R\", List.of(\"B1/1\"), 2, 4), \"segments 3-4 of the same row sell; 2-4 overlaps and does not\");\n        check(!db.sellAll(\"R\", List.of(\"B1/1\", \"A9/9\"), 0, 2) && db.mask(\"R\", \"A9/9\") == 0, \"a group whose second row is taken rolls back the first: A9/9 is empty again\");\n\n        // 23. the flight desk: every seat or none, the wallet, cancel once, change without losing the booking, no deadlock\n        FlightDesk fd = new FlightDesk();\n        fd.addUser(\"u1\", \"Vinit\", 500_000); fd.addUser(\"u2\", \"Neha\", 150_000);\n        fd.addFlight(new Flight(\"111\", \"6E\", \"DEL\", \"BLR\", 2, 10 * 60 + 30).fare(\"F1\", 100_000, \"10a\", \"11c\", \"20b\", \"21a\").fare(\"F2\", 150_000, \"1a\", \"1b\"));\n        fd.addFlight(new Flight(\"211\", \"6E\", \"DEL\", \"BLR\", 2, 18 * 60 + 45).fare(\"F1\", 120_000, \"10a\", \"11c\", \"20b\"));\n        String fb1 = fd.book(\"u1\", \"111\", 2, \"F1\", List.of(\"10a\", \"11c\"));\n        try { fd.book(\"u2\", \"111\", 2, \"F1\", List.of(\"20b\", \"11c\")); check(false, \"a taken seat must refuse the booking\"); }\n        catch (IllegalStateException e) { check(fd.funds(\"u2\") == 150_000 && seats(fd, \"111\", \"F1\").equals(List.of(\"20b\", \"21a\")), \"one taken seat refuses the whole booking: no money moved, 20b still free\"); }\n        try { fd.book(\"u2\", \"111\", 2, \"F2\", List.of(\"1a\", \"1b\")); check(false, \"a short wallet must refuse the booking\"); }\n        catch (IllegalStateException e) { check(fd.funds(\"u2\") == 150_000 && seats(fd, \"111\", \"F2\").size() == 2, \"Rs 3,000 of seats with Rs 1,500 in the wallet: refused, nothing moved\"); }\n        fd.cancel(\"u1\", fb1);\n        check(fd.funds(\"u1\") == 500_000 && seats(fd, \"111\", \"F1\").size() == 4, \"cancel gives back the seats and the money\");\n        try { fd.cancel(\"u1\", fb1); check(false, \"a second cancel must be refused\"); }\n        catch (IllegalStateException e) { check(fd.funds(\"u1\") == 500_000, \"a second cancel is refused and refunds nothing twice\"); }\n        String fb2 = fd.book(\"u2\", \"211\", 2, \"F1\", List.of(\"10a\"));                         // Rs 1,200: Neha has Rs 300 left\n        try { fd.change(\"u2\", fb2, \"111\", 2, \"F2\", List.of(\"1a\", \"1b\")); check(false, \"a change she cannot afford must be refused\"); }\n        catch (IllegalStateException e) { check(fd.funds(\"u2\") == 30_000 && !seats(fd, \"211\", \"F1\").contains(\"10a\") && seats(fd, \"111\", \"F2\").contains(\"1a\"), \"a change she cannot afford is refused; the old booking is untouched\"); }\n        fd.change(\"u2\", fb2, \"111\", 2, \"F1\", List.of(\"21a\"));\n        check(fd.funds(\"u2\") == 50_000 && seats(fd, \"211\", \"F1\").contains(\"10a\") && !seats(fd, \"111\", \"F1\").contains(\"21a\"), \"moving to a cheaper fare refunds Rs 200 and moves the seat\");\n        fd.addUser(\"a\", \"A\", 100_000_000); fd.addUser(\"b\", \"B\", 100_000_000);\n        String ba = fd.book(\"a\", \"111\", 2, \"F1\", List.of(\"20b\")), bb = fd.book(\"b\", \"211\", 2, \"F1\", List.of(\"11c\"));\n        ExecutorService swap = Executors.newFixedThreadPool(2);\n        Future<Object> fa = swap.submit(() -> { for (int i = 0; i < 200; i++) fd.change(\"a\", ba, i % 2 == 0 ? \"211\" : \"111\", 2, \"F1\", List.of(\"20b\")); return null; });\n        Future<Object> fbb = swap.submit(() -> { for (int i = 0; i < 200; i++) fd.change(\"b\", bb, i % 2 == 0 ? \"111\" : \"211\", 2, \"F1\", List.of(\"11c\")); return null; });\n        boolean finished = true;\n        try { fa.get(10, TimeUnit.SECONDS); fbb.get(10, TimeUnit.SECONDS); } catch (TimeoutException e) { finished = false; }\n        swap.shutdownNow();\n        check(finished, \"two users moving between the same two flights in opposite directions, 200 times each: no deadlock\");\n        check(seats(fd, \"111\", \"F1\").equals(List.of(\"10a\", \"11c\")) && seats(fd, \"211\", \"F1\").equals(List.of(\"10a\", \"20b\")), \"and every seat is exactly where it started\");\n\n        System.out.println(failures == 0 ? \"ALL PASS\" : failures + \" FAILED\");\n        if (failures != 0) System.exit(1);\n    }\n}\n"};
function wireCopy(root){root.querySelectorAll('button.copy').forEach(b=>{b.onclick=()=>{const key=b.dataset.key;const txt=key?RAW[key]:b.closest('.ed').querySelector('code').textContent;navigator.clipboard.writeText(txt).then(()=>{b.textContent='copied';setTimeout(()=>b.textContent='copy',1500);});};});}
const KW=/\b(abstract|boolean|break|case|catch|class|continue|default|do|double|else|enum|extends|final|finally|for|if|implements|import|int|interface|long|new|null|package|private|protected|public|return|static|super|switch|synchronized|this|throw|throws|try|void|while|var|record|true|false)\b/g;
const TY=/\b([A-Z][A-Za-z0-9]*)\b/g;
function hl(src){let inDoc=false;return src.split('\n').map((l,i)=>{let e=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const t=e.trim();let out;if(inDoc||t.startsWith('/**')){out='<span class="d">'+e+'</span>';if(t.startsWith('/**'))inDoc=!t.endsWith('*/');else if(t.endsWith('*/'))inDoc=false;}else{const parts=e.split(/(\/\/.*$|"(?:[^"\\]|\\.)*")/);out=parts.map((p,j)=>j%2?(p.startsWith('//')?'<span class="c">'+p+'</span>':'<span class="s">'+p+'</span>'):p.replace(KW,'<span class="k">$1</span>').replace(TY,'<span class="t">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>')).join('');}return '<span class="ln">'+(i+1)+'</span>'+out;}).join('\n');}
let cur=parseInt(localStorage.getItem('train-booking.step')||'1',10);
const side=document.getElementById('side'),study=document.getElementById('study');
function classesSoFar_unused(n){const out=[];STEPS.filter(s=>s.id<=n&&s.code).forEach(s=>{(s.code.match(/(?:class|interface|enum)\s+([A-Z]\w*)/g)||[]).forEach(m=>out.push({name:m.split(/\s+/)[1],step:s.id}));});return out;}
function render(){
  side.innerHTML='';let g='';STEPS.forEach(s=>{if(s.stage!==g){g=s.stage;side.insertAdjacentHTML('beforeend','<div class="grp">'+g+'</div>');}side.insertAdjacentHTML('beforeend','<div class="st'+(s.id===cur?' on':s.id<cur?' done':'')+'" data-id="'+s.id+'"><span class="n">'+String(s.id).padStart(2,'0')+'</span><span>'+s.title+'</span></div>');});
  const s=STEPS[cur-1];
  study.innerHTML='<div class="hdr"><span class="stage">'+s.stage+'</span><h2>'+String(s.id).padStart(2,'0')+' &middot; '+s.title+'</h2></div>'+(s.think?'<div class="think">'+s.think+'</div>':'')+(s.body||'')+(s.code?'<div class="ed"><div class="tab"><b>'+(s.file||'Main.java')+'</b><button class="copy" data-src="ed">copy</button></div><pre><code class="java">'+hl(s.code)+'</code></pre></div>':'')+'<div class="nav"><button id="prev">&larr; prev</button><button id="next" class="pri">next &rarr;</button></div>';
  study.querySelectorAll('pre code.java').forEach(el=>{el.innerHTML=hl(el.textContent);});wireCopy(study);wireTimers(study);const miss=document.getElementById('miss');if(miss){try{miss.value=localStorage.getItem('train-booking.miss')||'';}catch(e){}miss.addEventListener('input',()=>{try{localStorage.setItem('train-booking.miss',miss.value);}catch(e){}});}
  document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
  document.querySelector('.wrap').classList.toggle('wide',!!s.wide);document.querySelector('.wrap').classList.toggle('code',!!s.code);localStorage.setItem('train-booking.step',cur);study.scrollIntoView();
}
function go(n){if(n<1||n>STEPS.length)return;cur=n;setMode('study');render();}
side.addEventListener('click',e=>{const t=e.target.closest('.st');if(t)go(+t.dataset.id);});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
const main=document.getElementById('main');
function setMode(m){}
function wireTimers(root){root.querySelectorAll('button.timer[data-min]').forEach(b=>{const total=+b.dataset.min*60;let left=total,id=null;const show=()=>{b.textContent=(id?'':'start ')+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');};b.onclick=()=>{if(id){clearInterval(id);id=null;b.classList.remove('run');show();return;}if(left<=0)left=total;b.classList.remove('done');b.classList.add('run');id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;b.classList.remove('run');b.classList.add('done');b.textContent='time -- open the fold';}},1000);show();};show();});}

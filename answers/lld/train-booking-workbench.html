<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design IRCTC's ticket booking. Users search trains between two stations on a date, book berths for a group, pay and cancel; a berth sold from Mumbai to Pune must be sold again from Pune onwards, and when a class is full people go on RAC and the waitlist and move up when someone cancels. Thousands want the last berth at 10:00. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>Indian Railways sells berths on trains that run a fixed route of stations, once a day. A train on one date is a <b>run</b>; its berths sit in coaches, and each coach belongs to a class (sleeper, 3A, 2A) with its own price. Unlike a cinema seat, a berth is sold for only part of the route: from the station where the passenger boards to the one where he gets off. So one berth can carry Asha from Mumbai to Pune and Ravi from Pune to Bengaluru, and what is really sold is a <b>segment</b>: the track between two neighbouring stops. When a class has no berth left for a journey, the next passengers get <b>RAC</b> (reservation against cancellation: two people share one side-lower berth), then a place on a capped <b>waitlist</b>, and a cancellation moves them up. The rule that must always hold (the invariant): no segment of any berth is sold to two people, and a berth that comes free goes to the earliest waiting passenger whose journey fits, before anyone new can take it.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that sells one berth twice on different segments, fills a class, cancels, and races fifty threads for the last berth. The interviewer is watching for, in this order: the questions you ask before typing (does a berth resell per segment, what happens when a class is full); which classes exist and which one owns which state, above all the split between the train (a timetable) and the run (that train on one date), and a berth that stores segments instead of a free-or-sold flag; book and cancel working end to end, with RAC and the waitlist moving up; what happens when two people press Book for the last berth; where the rules that change live (fare, which berth, refund, payment), so a change is a new class and not an edit; and what happens when the payment fails or arrives after the hold. Then the twists: search by stations and date, availability at scale, a family in one coach, the database tables and locking, Tatkal at 10:00 (the last-minute quota that opens the day before travel), and the flight version.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 348\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"80\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">book</text><g transform=\"translate(150 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a group, a journey, a class</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">4 people, PUNE to SBC, 3A</text></g><path d=\"M400 57 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">free on every segment?</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one word test per berth</text></g><path d=\"M670 57 H690\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(690 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a place for each: all or none</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">berth, else RAC half, else WL</text></g><path d=\"M940 57 H960\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(960 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PNR held for ten minutes</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">pay outside the lock: BOOKED</text></g><text x=\"80\" y=\"201\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">cancel</text><g transform=\"translate(150 170)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cancel a PNR</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a ticket, or an unpaid hold</text></g><path d=\"M400 197 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 170)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">give its segments back</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the same locked step as the next</text></g><path d=\"M670 197 H690\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(690 170)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">move the waiters up</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">RAC to a berth, WL to RAC, in order</text></g><path d=\"M940 197 H960\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(960 170)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refund, then tell them</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">after the unlock: money, SMS</text></g><path d=\"M545 84 V96\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(395 96)\"><rect width=\"300\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the group does not fit: nothing held</text></g><text x=\"80\" y=\"266\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">search</text><text x=\"150\" y=\"266\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment: which trains run PUNE to SBC on 3 Oct?  how many 3A berths are free from SUR to SBC?</text><text x=\"80\" y=\"296\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">expire</text><text x=\"150\" y=\"296\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">a hold not paid within ten minutes is released by the next call on its run, and its berths go to the waiters first</text><text x=\"615\" y=\"332\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">many phones on one run at the same instant: no segment of a berth is ever sold twice, and a freed berth goes to the earliest waiter who fits, before anyone new</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Is a berth sold for the whole route, or again after its passenger gets off?</td><td>Again: a passenger holds a berth only between his two stations</td><td>A berth stores sold segments, not a flag (moves 1, 5)</td></tr><tr><td>What does one booking contend on: the train, the date, the class?</td><td>One train on one date: a run, with a new run every day</td><td>TrainRun owns everything a booking changes, behind one lock (moves 1, 4)</td></tr><tr><td>Which classes and berths; do preferences matter?</td><td>Sleeper, 3A, 2A in bays of eight; preferences best-effort</td><td>A class inventory; berth choice behind an interface (moves 3, 5)</td></tr><tr><td>When a class is full: RAC and a waitlist? How many?</td><td>Two RAC passengers per side-lower berth kept for RAC; a capped waitlist</td><td>Two queues and the promotion order (move 6)</td></tr><tr><td>Groups: how many per ticket, and what if only some fit?</td><td>Up to six; every one gets some place or none does; a \"berths only\" option</td><td>Decide all, then write all, under one lock (moves 4, 6)</td></tr><tr><td>Are berths held while the user pays? Can payment fail?</td><td>Yes, for ten minutes; it can decline or be slow</td><td>Hold, pay outside the lock, commit: BookMyShow's order (move 6)</td></tr><tr><td>How are fares and refunds worked out?</td><td>By class and distance; refunds by the hours left</td><td>Fare and refund rules behind interfaces (move 3)</td></tr><tr><td>One process, or a database and many servers? Flights too?</td><td>One process, in memory; the rest named</td><td>Follow-ups on page 05 (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul><li>Search trains between two stations on a date, where the date is the day the passenger boards; show a train's route by its number.</li><li>Availability: how many berths of a class are free for a journey, then RAC places, then the waitlist.</li><li>Book up to six passengers from one station to another in one class: each gets a berth, an RAC place or a waitlist number, or none of them does. An option: berths only.</li><li>A berth is sold per segment: sold from Mumbai to Pune, it is sold again from Pune onwards.</li><li>Hold the places for ten minutes while the user pays; the ticket (a BOOKED PNR; a PNR is the booking reference) exists only after the payment.</li><li>Cancel: the segments come back, RAC moves up to berths and the waitlist to RAC, earliest first, and money goes back.</li><li>Fares by class and distance; refunds by the hours left; both changeable.</li><li>A PNR enquiry: each passenger's current status, such as CNF B1/23 (confirmed, coach B1, berth 23), RAC 2, or WL 4 (fourth on the waitlist).</li></ul></div><div><b>Non-functional requirements</b><ul><li>Many users on one run at once: no segment of a berth is sold twice; the last berth has exactly one winner.</li><li>Fair: a freed berth goes to the earliest waiter whose journey fits, before any new booking.</li><li>Nothing half-done: a group is placed whole or not at all; a failed payment keeps the hold; a late one is refunded.</li><li>Fast: \"is this berth free for this journey\" is one word test; availability is one pass over a class; search is an index lookup.</li><li>Fare, berth choice, refund and payment swappable without opening the run.</li><li>Money in integer paise: a double loses fractions of a paisa across a sum.</li><li>In memory, one process, no database (say it; a follow-up adds the tables).</li></ul></div></div><div class=\"move\"><h3>One morning, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 188\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"112\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:58  Asha: CSMT to PUNE, 3A</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">first free berth for segment 0</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">B1/1, a lower berth</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">B1/1 bits: 1 0 0 0</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">Rs 268.80, paid: BOOKED</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"112\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:59  Ravi: PUNE to SBC, 3A</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">segments 1 to 3 of B1/1 are free</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">B1/1 again: he boards, she leaves</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">B1/1 bits: 1 1 1 1</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">Rs 1,215.20, paid: BOOKED</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"112\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">10:05  3A full from SUR to SBC</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">a family of six took the rest</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">Meena, Arjun: RAC 1 and RAC 2,</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">sharing the side lower B1/7</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">Kiran: WL 1</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"112\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">10:20  Ravi cancels</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">B1/1 free again, PUNE to SBC</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">Meena: RAC 1 -> CNF B1/1</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">Kiran: WL 1 -> RAC 2, on B1/7</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">refund, then the two SMSes</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> a run is one train on one date, with one lock; a berth is sold per segment, and a journey covers its segments half-open, so getting off at Pune and boarding at Pune do not clash; up to six passengers per PNR, every one placed or none; RAC is two people on one side-lower berth, the waitlist has a cap, and a freed berth goes to the waiters first; a ten-minute hold, payment outside the lock, the PNR as the idempotency key (a unique id per payment, so a retry is charged once); money in paise; one process, in memory. Named as out of scope: the database tables, search at scale, Tatkal, refund rules, a family in one coach, flights, many servers; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these twelve on any LLD and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order. Nothing is chosen up front, and no pattern is named before the move that produced it. For this problem the first move decides everything: a berth is not sold, a segment of it is.</p></div><div class=\"move\"><h3>Move 1: underline the nouns, and see that a berth is not sold: a segment of it is.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 306\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a PASSENGER books a BERTH in a COACH of a TRAIN that runs on a DATE, from one STATION to another; he gets a PNR, or waits</text><g transform=\"translate(20 104)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Train</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the timetable: a route</text></g><path d=\"M100 64 V104\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(192 104)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TrainRun</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one date: berths, lock</text></g><path d=\"M272 64 V104\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(364 104)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ClassInventory</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">3A: berths and queues</text></g><path d=\"M444 64 V104\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(536 104)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Berth</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one bit per segment</text></g><path d=\"M616 64 V104\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(708 104)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Pnr</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">journey, fare, status</text></g><path d=\"M788 64 V104\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(880 104)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Passenger</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">his status, his place</text></g><path d=\"M960 64 V104\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1052 104)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Station</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a code: no class</text></g><path d=\"M1132 64 V104\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"215\" y=\"232\" text-anchor=\"end\" font-size=\"13\" fill=\"var(--text)\">B1/1</text><path d=\"M250 218 H970\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"250\" cy=\"218\" r=\"4\" fill=\"var(--muted)\"/><text x=\"250\" y=\"198\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">CSMT</text><circle cx=\"430\" cy=\"218\" r=\"4\" fill=\"var(--muted)\"/><text x=\"430\" y=\"198\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">PUNE</text><circle cx=\"610\" cy=\"218\" r=\"4\" fill=\"var(--muted)\"/><text x=\"610\" y=\"198\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SUR</text><circle cx=\"790\" cy=\"218\" r=\"4\" fill=\"var(--muted)\"/><text x=\"790\" y=\"198\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">GTL</text><circle cx=\"970\" cy=\"218\" r=\"4\" fill=\"var(--muted)\"/><text x=\"970\" y=\"198\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SBC</text><rect x=\"254\" y=\"206\" width=\"172\" height=\"26\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"340\" y=\"223\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">Asha: segment 0</text><rect x=\"434\" y=\"206\" width=\"532\" height=\"26\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc2)\"/><text x=\"700\" y=\"223\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">Ravi: segments 1, 2, 3</text><text x=\"1000\" y=\"223\" text-anchor=\"start\" font-size=\"11.5\" fill=\"var(--acc)\">bits: 1 1 1 1</text><text x=\"615\" y=\"270\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = has its own state, becomes a class.   dashed = no state of its own: a value or a method</text><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--acc)\">the split that decides the design: a berth has no free-or-sold flag; it has one bit per segment, and PUNE is where Asha's bits end and Ravi's begin</text></svg></div><div class=\"move\"><p>Reading the prompt again: a <b>passenger</b> books a <b>berth</b> in a <b>coach</b> of a <b>train</b> that runs on a <b>date</b>, from one <b>station</b> to another; he gets a <b>PNR</b> (the booking reference), or waits. A train has a number, a route and a coach layout, and none of that changes while people book: <code>Train</code> is a timetable. What is sold is that train on one date, so it is its own class, <code>TrainRun</code>, with its own berth objects; the run of the 2nd and the run of the 3rd never share a field. One class of travel on a run (its 3A) has berths, RAC places and a waitlist: <code>ClassInventory</code>. A PNR has passengers, a journey, a fare and a status, and each <code>Passenger</code> has his own status and place. A station is only a code and search is a question, so neither becomes a class. Then the move that decides the design: is a berth free? A yes-or-no flag cannot say \"sold to Asha as far as Pune, free after\". So a <code>Berth</code> keeps one bit per segment, and a booking sets the bits of its journey.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 324\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is B1/1 free from SUR to SBC?</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 42 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 20)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Berth  (owns its segment bits)</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 42 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 20)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">berth.isFree(2, 4)</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 74)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hold 4 berths PUNE to SBC, or none</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 96 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 74)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TrainRun  (owns berths, queues, lock)</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 96 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 74)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">run.book(user, from, to, cls, group)</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 128)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">move the waiters up after a cancel</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 150 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 128)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TrainRun  (the same state, same lock)</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 150 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 128)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">promoteLocked(inventory, events)</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 182)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">find trains PUNE to SBC on 3 Oct</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 204 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 182)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BookingService  (owns the station index)</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 204 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 182)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">svc.search(from, to, date)</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 236)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">charge the card</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 258 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 236)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PaymentGateway  (owns no state here)</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 258 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 236)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gateway.charge(pnrId, paise)</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"310\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb whose state spans many objects goes to the one that owns them all: the run. A verb that owns nothing, like a charge, is handed in and runs outside every lock</text></svg></div><div class=\"move\"><p>\"Is B1/1 free from Solapur to Bengaluru\" reads the berth's bits, so <code>berth.isFree(2, 4)</code>. \"Hold four berths from Pune to Bengaluru, or none\" touches many berths, the RAC places, the waitlist and the PNR map at once; only the run owns all of them, so <code>run.book(...)</code>. \"Move the waiters up\" touches the same state, so it lives in the same class under the same lock. \"Find the trains from Pune to Bengaluru on the 3rd\" reads an index that spans every train, so it belongs to the orchestrator, <code>BookingService.search</code>. The orchestrator is the class that runs the steps in order and owns no berth of its own. \"Charge the card\" touches none of our state, so it is handed in and called outside every lock. A verb whose state spans many objects goes to the one that owns them all; that is how a small <code>Berth</code> and one busy <code>TrainRun</code> appear without planning them.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 356\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 110)\"><rect width=\"240\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"49.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BookingService</text><text x=\"120.0\" y=\"65.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(fare, chooser, refund)</text></g><path d=\"M270 165 H330 V42 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 20)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FareRule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">class x km; festival week; Tatkal</text></g><g transform=\"translate(770 20)\"><rect width=\"430\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DistanceFare / PeakDayFare / TatkalFare</text><text x=\"215.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M770 42 H730\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M270 165 H330 V100 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BerthChooser</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">first free; one coach; seniors low</text></g><g transform=\"translate(770 78)\"><rect width=\"430\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FirstFreeBerths / FamilyChooser</text><text x=\"215.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M770 100 H730\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M270 165 H330 V158 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 136)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RefundRule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">everything back; by hours left</text></g><g transform=\"translate(770 136)\"><rect width=\"430\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FullRefund / RailwayRefund</text><text x=\"215.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M770 158 H730\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M270 165 H330 V216 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 194)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PaymentGateway</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPI, card; it can say no</text></g><g transform=\"translate(770 194)\"><rect width=\"430\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">UpiGateway / a declining fake</text><text x=\"215.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M770 216 H730\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M270 165 H330 V274 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 252)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PnrObserver</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">SMS on WL -> CNF, analytics</text></g><g transform=\"translate(770 252)\"><rect width=\"430\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SmsNotifier / a counting listener</text><text x=\"215.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M770 274 H730\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"322\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in: three rules through configure(), listeners through addObserver(), the gateway at pay() time. The service builds none of them</text><text x=\"615\" y=\"342\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">new PeakDayFare(new DistanceFare(), peakDays, 120): one fare rule wrapping another is Decorator, born right here</text></svg></div><div class=\"move\"><p>Fares will change: by class and distance today, a festival week tomorrow, Tatkal and flexi-fare (a price that rises as the train fills) the round after. Which berth a passenger gets will change: the first free one today, a family in one coach and lower berths for seniors tomorrow. Refunds depend on the hours left before departure. Payment can say no. And somebody must be told when a waitlisted ticket confirms. Each becomes a one-method interface the service is <i>given</i> and never builds: three rules through <code>configure()</code>, listeners through <code>addObserver()</code>, the gateway as an argument to <code>pay()</code>. This is where the patterns come from, not the other way round. A swappable rule behind an interface is <b>Strategy</b>. A rule that wraps another and adds to it (a festival surcharge over the distance fare) is <b>Decorator</b>. A run that announces \"WL 1 moved to RAC 2\" to whoever subscribed, without knowing what an SMS is, is <b>Observer</b>. Write them; do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 264\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 1</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads: B1/8 free</text></g><g transform=\"translate(30 110)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 2</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads: B1/8 free</text></g><g transform=\"translate(340 70)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">B1/8, PUNE to SBC</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no bits set</text></g><path d=\"M220 52 H340 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M220 132 H340 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"280\" y=\"44\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"280\" y=\"150\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"560\" y=\"20\" width=\"300\" height=\"140\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"710\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"710\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both saw it free, both write:</text><text x=\"710\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">one berth, two tickets</text><text x=\"710\" y=\"130\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: decide and write as ONE step</text><g transform=\"translate(890 40)\"><rect width=\"310\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TrainRun.lock</text><text x=\"155.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">decide all, then write all: one step</text></g><text x=\"30\" y=\"196\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">the train's own gap:</text><g transform=\"translate(200 178)\"><rect width=\"220\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Ravi cancels</text><text x=\"110.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">B1/1 free, PUNE to SBC</text></g><path d=\"M420 200 H450\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 178)\"><rect width=\"220\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"110.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a newcomer books</text><text x=\"110.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">he takes B1/1</text></g><path d=\"M670 200 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(700 178)\"><rect width=\"220\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"110.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the promotion runs</text><text x=\"110.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">Meena, RAC 1, finds nothing</text></g><text x=\"960\" y=\"196\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">fix: release and promote</text><text x=\"960\" y=\"214\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">inside the SAME locked step</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one lock per run (a train on a date): two trains, or two dates of one train, never wait for each other; listeners are called after the unlock</text></svg></div><div class=\"move\"><p>Two phones read \"B1/8 is free from Pune to Bengaluru\" in the same millisecond and both write it. Between the read and the write is the gap, and the gap is one berth with two tickets. So deciding a place for every passenger and writing them all must be one step, under one lock, in the class that owns the berths: the run. One <code>ReentrantLock</code> per run (Java's standard lock; re-entrant means the thread holding it may take it again). The run is what callers really fight over, so two trains, or two dates of one train, never wait for each other. The train has a second gap of its own. If a cancel gave B1/1 back in one step and moved the waiters up in another, a new booking could land in between and take the berth Meena has waited for since morning. So the release and the promotion happen inside the same locked section. The clock is read inside the lock too, and listeners are called only after it is released.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 378\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which run is 12999 on 2 Oct?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 38 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 18)\"><rect width=\"560\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;runId, TrainRun&gt;  on the service</text><text x=\"280.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 38 H1030\" fill=\"none\" stroke=

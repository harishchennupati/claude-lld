\"12.5\" fill=\"var(--text)\">is B1/1 free on segments 2 and 3?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 134 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 114)\"><rect width=\"560\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BitSet per berth: nextSetBit(2) &gt;= 4</text><text x=\"280.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 134 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 114)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1): one word</text></g><g transform=\"translate(30 162)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which berths are free PUNE to SBC?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 182 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 162)\"><rect width=\"560\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">walk the class's berths once</text><text x=\"280.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 182 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 162)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">~250 tests, ~1 us</text></g><g transform=\"translate(30 210)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who is next on RAC, on the waitlist?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 230 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 210)\"><rect width=\"560\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LinkedHashSet&lt;Passenger&gt;: order + O(1) remove</text><text x=\"280.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 230 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 210)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 258)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PNR 4210000007?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 278 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 258)\"><rect width=\"560\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;pnr, run&gt; on the service, Map&lt;pnr, Pnr&gt; on the run</text><text x=\"280.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 278 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 258)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 306)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which unpaid holds have lapsed?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 326 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 306)\"><rect width=\"560\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ArrayDeque of holds: all last 10 minutes, oldest first</text><text x=\"280.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 326 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 306)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) each</text></g><text x=\"615\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every scan avoided here is a scan avoided INSIDE the lock, which is the only place a scan would have cost anybody anything</text></svg></div><div class=\"move\"><p>\"Which run is 12999 on the 2nd\": a map from run id to run. \"Which trains stop at Pune and then at Bengaluru\": a map from station to (train, stop number), filled when a train is added, so search walks only the trains that stop at Pune. \"Is B1/1 free on segments 2 and 3\": a <code>BitSet</code> (Java's growable array of bits) per berth; the first sold bit at or after segment 2 must be at 4 or later. Up to 64 segments that is one 64-bit word, the same cost for any journey. \"Which berths are free from Pune to Bengaluru\": the one walk on the booking path, one test per berth, about a microsecond for 250. \"Who is next on RAC or the waitlist\": a <code>LinkedHashSet</code>, which keeps arrival order and still removes a passenger in O(1) when he cancels from the middle. \"Which holds have lapsed\": every hold lasts the same ten minutes, so they lapse in the order they were made and the oldest is always at the head of a queue. Every scan avoided here is a scan avoided inside the lock.</p></div><div class=\"move\"><h3>Move 6: a passenger and a PNR each have a life cycle, and the ORDER at the critical steps is the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 352\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"30\" y=\"26\" text-anchor=\"start\" font-size=\"12.5\" fill=\"var(--acc)\">Passenger</text><g transform=\"translate(30 36)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WAITLISTED</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a queue number</text></g><g transform=\"translate(290 36)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RAC</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">half a side lower</text></g><g transform=\"translate(550 36)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CONFIRMED</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a berth of his own</text></g><g transform=\"translate(750 36)\"><rect width=\"140\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CANCELLED</text><text x=\"70.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">all given back</text></g><path d=\"M190 58 H290\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"240\" y=\"50\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">a half fits</text><path d=\"M450 58 H550\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"500\" y=\"50\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">a berth fits</text><path d=\"M110 80 V104 H630 V80\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"370\" y=\"118\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">a berth fits his whole journey: straight up</text><path d=\"M710 58 H750\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"820\" y=\"98\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">from any state</text><text x=\"30\" y=\"150\" text-anchor=\"start\" font-size=\"12.5\" fill=\"var(--acc)\">Pnr</text><g transform=\"translate(30 170)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PENDING_PAYMENT</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">places held 10 minutes</text></g><g transform=\"translate(330 170)\"><rect width=\"170\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BOOKED</text><text x=\"85.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">paid: the ticket</text></g><g transform=\"translate(600 170)\"><rect width=\"150\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CANCELLED</text><text x=\"75.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a ticket, or a hold</text></g><g transform=\"translate(330 250)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EXPIRED</text><text x=\"85.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">never paid</text></g><path d=\"M130 170 V150 H675 V170\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"420\" y=\"144\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">a hold given up</text><path d=\"M230 192 H330\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"280\" y=\"184\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">paid in time</text><path d=\"M500 192 H600\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"550\" y=\"184\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">cancel</text><path d=\"M130 214 V270 H330\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"145\" y=\"262\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">ten minutes pass</text><rect x=\"915\" y=\"20\" width=\"295\" height=\"292\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"1062\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order, and why</text><text x=\"928\" y=\"70\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">book, under the lock:</text><text x=\"928\" y=\"94\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 release lapsed holds first</text><text x=\"928\" y=\"118\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 decide every place, write nothing</text><text x=\"928\" y=\"142\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 all fit: write all; else throw</text><text x=\"928\" y=\"166\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">pay, NO lock: charge, key = the PNR</text><text x=\"928\" y=\"190\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">commit, locked: PENDING? then BOOKED</text><text x=\"928\" y=\"214\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">commit, locked: lapsed? refund it</text><text x=\"928\" y=\"238\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">cancel, locked: work out the refund,</text><text x=\"928\" y=\"262\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">then give back, move the waiters up</text><text x=\"928\" y=\"286\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">after the unlock: refund, the SMSes</text><text x=\"460\" y=\"338\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a passenger only ever moves up, and a freed berth never sits free while someone who fits is waiting</text></svg></div><div class=\"move\"><p>A passenger is WAITLISTED, RAC, CONFIRMED or CANCELLED, and he only moves up: WL to RAC, RAC to a berth, or WL straight to a berth when one fits his whole journey. A PNR is PENDING_PAYMENT while its places are held, BOOKED once paid, EXPIRED after ten unpaid minutes, CANCELLED if given back. Each is a small state machine (a fixed set of states and the moves allowed between them), and writing them down forces the order. Booking, under the lock: release lapsed holds first, decide a place for every passenger while writing nothing, refuse the whole group if one does not fit, and only then write them all. Payment runs after the unlock with the PNR as the idempotency key, and the commit books only a PNR that is still PENDING: BookMyShow's order, reused. Cancel, under the lock: work out the refund from the statuses as they are, give the segments back, and move the waiters up earliest first, skipping anyone whose journey does not fit. One difference from BookMyShow: a lapsed hold cannot simply read as free, because a freed berth belongs to the waitlist first. So every call on a run releases lapsed holds, and promotes, before it reads anything.</p></div><div class=\"move\"><h3>Move 7: yes, one lock per run makes bookings happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 306\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"540\" height=\"160\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the run's lock: about 2 microseconds a booking</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">release lapsed holds: a peek at the head of a queue</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">walk the class's berths once: ~250 one-word tests</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">check the chooser's answer; count RAC and waitlist room</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">write each passenger's bits; put the PNR in a map</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">a cancel adds the promotion walk: at worst ~0.1 ms</text></g><path d=\"M570 100 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"605\" y=\"90\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"160\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: milliseconds to minutes</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the payment gateway: about 1,500,000 us</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the SMS \"WL 3 -> CNF B1/12\": after the unlock</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">search: the station index, no run's lock at all</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the user typing six names: a minute</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">nothing slow is ever inside: that is the whole trick</text></g><text x=\"615\" y=\"210\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">ten phones press Book on the same run at the same instant</text><g transform=\"translate(30 224)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(148 224)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 2 us</text></g><g transform=\"translate(266 224)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 4 us</text></g><g transform=\"translate(384 224)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 6 us</text></g><g transform=\"translate(502 224)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 8 us</text></g><g transform=\"translate(620 224)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 10 us</text></g><g transform=\"translate(738 224)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 12 us</text></g><g transform=\"translate(856 224)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 14 us</text></g><g transform=\"translate(974 224)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 16 us</text></g><g transform=\"translate(1092 224)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">phone 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 18 us</text></g><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tenth phone waits about 18 microseconds for the lock, then a second and a half at the bank with the lock long released: one at a time is true, and nobody can tell</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself first: if every booking on a run takes the same lock, is a Tatkal morning now a queue? It is, for about two microseconds a booking. That is measured on a laptop with 256 berths in the class and a 20-stop route: a book-and-cancel pair took 3 to 5 microseconds. The left-hand box is all of it: a peek at the holds queue, one walk over the class's berths testing one word each, and a few field writes. A cancel adds the promotion walk; at its worst (108 waiters, none of whom fits) it took about a tenth of a millisecond, still the slowest thing inside. Everything slow is outside: the bank, the SMS, the search, the user typing names. One at a time is true and nobody can tell, as long as nothing slow gets inside. The sharp edge: the fare and refund rules run inside the lock, so they must stay arithmetic.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 238\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per run: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a booking holds the lock ~2 us; an availability count ~0.5 us</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">Tatkal at 10:00 on a hot train: say 3,000 tries in minute one</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">50 a second x 2 us = 100 us of lock per second: 0.01% busy</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">5,000 a second on one run, from bots: 10 ms per second, 1%</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">the bank inside the lock: 1.5 s each, under 1 booking a second</text><text x=\"900\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 reads off the lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">search gets a copy of the berth masks; the sideways index (page 05)</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 a lock per class</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">3A and sleeper share no berth and no queue, so they need not share a lock</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 one writer per run, or the database's lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a queue per run (a Kafka partition), or SELECT ... FOR UPDATE on the run</text></g><text x=\"615\" y=\"224\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">say the arithmetic first: at 0.01% busy, every rung is code nobody needs yet</text></svg></div><div class=\"move\"><p>Do the arithmetic out loud; it is four numbers and it ends the argument. Say a hot train gets three thousand booking attempts in the first minute of Tatkal: fifty a second, two microseconds each, a hundred microseconds of lock in every second, busy one hundredth of one per cent. Even five thousand a second on one run, from bots, keeps the lock one per cent busy. The number that decides the design is the red one: put the bank's second and a half inside the lock and the run books fewer than one ticket a second, so that minute's three thousand would take over an hour. Then the ladder, cheapest first. Rung one moves reads off the lock: search pages get a copy of the berth masks, and the sideways index on page 05. Rung two is a lock per class, safe here because 3A and sleeper share no berth and no queue. Rung three is one writer per run (a queue, or a Kafka partition per run) or the database's own row lock. Climbing without the arithmetic is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the hour is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 372\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"300\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two phones, the last berth</text><text x=\"150.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one berth, two tickets</text></g><path d=\"M330 40 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 20)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">decide and write in one locked step; test 2: 50 threads, one winner; test 3: exactly 12 places</text></g><g transform=\"translate(30 66)\"><rect width=\"300\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">overlapping segments</text><text x=\"150.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two people, one berth, one night</text></g><path d=\"M330 86 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 66)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the bit test covers every segment; test 1: three people share B1/1, the overlap goes elsewhere</text></g><g transform=\"translate(30 112)\"><rect width=\"300\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a newcomer after a cancel</text><text x=\"150.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the waiter is skipped</text></g><path d=\"M330 132 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 112)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">release and promote in one locked step; test 6: 100 races, the waiter wins every time</text></g><g transform=\"translate(30 158)\"><rect width=\"300\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a group that half fits</text><text x=\"150.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two booked, two dropped</text></g><path d=\"M330 178 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 158)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">decide all, then write all; test 7: refused whole, and nothing is held</text></g><g transform=\"translate(30 204)\"><rect width=\"300\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the card fails, or is too slow</text><text x=\"150.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a berth lost, or sold twice</text></g><path d=\"M330 224 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 204)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hold, pay outside, commit re-checks; tests 9, 10: the hold stays, or the money goes back</text></g><g transform=\"translate(30 250)\"><rect width=\"300\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a hold nobody pays</text><text x=\"150.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a berth held for ever</text></g><path d=\"M330 270 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 250)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every call releases lapsed holds first; test 9: at ten minutes the waiter is confirmed</text></g><g transform=\"translate(30 296)\"><rect width=\"300\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the SMS gateway throws</text><text x=\"150.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the promotion dies with it</text></g><path d=\"M330 316 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 296)\"><rect width=\"820\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish after the unlock, inside a catch; test 12: the booking completes</text></g><text x=\"615\" y=\"358\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and a model check: 3,000 random operations, then 8 threads at once, with every invariant checked from scratch (test 16). FailureTests runs 23 tests, 93 checks</text></svg></div><div class=\"move\"><p>The table is the list; the file is the proof. Every row is a bug that ships the moment the matching line of the design is dropped, and every row is a few lines in FailureTests.java. Three need a trick to test at all. The races start fifty threads behind one latch (a gate that opens for all of them at once), so they really collide. The expiry tests move an injected clock instead of sleeping ten minutes. And the strongest test is a model check: thousands of random bookings, payments, cancels and clock moves, with every invariant checked from scratch after each one (no segment sold twice, nobody waiting while a place fits his journey, every status matching its queue). The tests have teeth: take the lock out and the race sells more places than exist; take the promotion out and nine checks fail, the model check among them.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"230\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"320\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"860\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"230\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface FareRule { long farePaise(run, from, to, cls); }</text><text x=\"860\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">swap a rule without opening the run</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"230\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">new PeakDayFare(new DistanceFare(), peakDays, 120)</text><text x=\"860\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">add to a fare instead of copying it</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"230\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">publish(events) after lock.unlock(); SmsNotifier hears WL -&gt; CNF</text><text x=\"860\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">the run never learns what an SMS is</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"230\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">PassengerStatus + PnrStatus, and the fixed promotion order</text><text x=\"860\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">a passenger only ever moves up</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"230\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"189.0\" font-size=\"11\" fill=\"var(--muted)\">coaches arrive built; it pays when layouts come from a file</text><text x=\"860\" y=\"189.0\" font-size=\"11\" fill=\"var(--muted)\">say 'not yet, and here is why'</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"230\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">never here</text><text x=\"320\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">main builds one BookingService; every test builds its own</text><text x=\"860\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">a global is a test you cannot write</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Builder, Command</text><text x=\"230\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"320\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">no move produced them</text><text x=\"860\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">a pattern without a move is decoration</text><text x=\"615\" y=\"275\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>The table is the answer; what is worth practising is the order you say it in. Name the move first and the pattern second: \"fares will change, so the service is handed a one-method rule; that is Strategy\". The first half is a design decision; \"I used Strategy\" on its own is a label. Observer has its best reason on this page: a waitlisted ticket confirms while its passenger sleeps, and the SMS must go out after the lock, where a dead SMS gateway cannot stall the next booking. The grey rows are worth as much as the others. \"Factory has not earned a place yet; coach layouts read from a file would make me add one\" says more than a fifth pattern doing nothing.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"575\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"575\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Berth: its bits. TrainRun: its places, queues, lock. BookingService: the order of steps.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"575\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">Tatkal = one new class and one changed configure() line</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"575\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">fare.farePaise(this, from, to, cls) * group.size();  never 'is it Tatkal?'</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces, so a fake for a test is one line</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"575\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">FareRule, BerthChooser, RefundRule, Clock, PnrObserver: one method each</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"575\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">new BookingService(() -&gt; now[0], HOLD);  svc.pay(pnr, a gateway that declines)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>SOLID is a check you run after the design, not a list you design towards. Every row points back at a move, and a letter with no move behind it means you recited it rather than did it. The letter doing the most work here is D. The service is handed its clock, its rules and its gateway, and that single habit is the only reason a test can jump ten minutes forward, hand in a bank that declines, and count the charges.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 326\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">Tatkal, flexi-fare, a refund by hours</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind the existing interface + one configure line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">SMS on WL -> CNF, the chart, analytics</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer; the booking path does not change a line</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">chart prepared: waitlisted e-tickets refunded</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new status, and the one method that moves a PNR into it</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across berths</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a family in one coach; a Tatkal quota</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">decide and write inside the SAME locked step: all or nothing</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">persist it; many servers</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the maps behind tables; a berth claim becomes a conditional UPDATE</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE run_berth SET sold_mask = sold_mask | :m WHERE ... AND (sold_mask &amp; :m) = 0</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 5 + this one</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the order decide, write, pay, commit never changes: each adds a class, a listener, a status or a step inside the lock</text></svg></div><div class=\"move\"><p>The picture is the answer sheet: match the twist to one of the five, say which one aloud, then type. Two are worth rehearsing. A new invariant across berths (a family in one coach, a quota of berths kept for Tatkal) is not a search problem but a locking problem: choose and write inside the same locked step, or another booking takes a berth between your choosing and your writing. State that must outlive the process moves behind tables, and the berth claim becomes a conditional UPDATE on a 64-bit mask column: set the journey's bits only where none of them is set yet, and zero rows changed means somebody else won. That is the database's compare-and-set (write only if the value is still what you expect, as one atomic step), the same idea as the lock one layer down. For all five, the order decide, write, pay, commit never changes. Page 05 has the working code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 1000\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M127.5 240L127.5 204\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1080.0 104L1080.0 74\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1010.0 196L1010.0 74\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1210 233.0L1222 233.0L1222 57.0L1210 57.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M1080.0 384L1080.0 354\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1080.0 546L1080.0 516\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1080.0 724L1080.0 694\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M127.5 546L127.5 588\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"133.5\ \"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">pnr: Pnr</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">status: PassengerStatus</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">place: Berth  (null on WL)</text></g><g transform=\"translate(665 640)\"><rect width=\"245\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"122.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"122.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PassengerStatus</text><line x1=\"0\" y1=\"34\" x2=\"245\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">CONFIRMED, RAC,</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">WAITLISTED, CANCELLED</text></g><g transform=\"translate(665 740)\"><rect width=\"245\" height=\"98\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"122.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;record&raquo;</text><text x=\"122.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">the value records</text><line x1=\"0\" y1=\"34\" x2=\"245\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">Traveller(name, age, pref)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">Journey(run, from, to, ..)</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--muted)\">Availability(berths, rac, wl)</text><text x=\"8\" y=\"95\" font-size=\"11.5\" fill=\"var(--muted)\">PnrEvent(pnr, name, what)</text></g><g transform=\"translate(950 20)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FareRule</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">farePaise(run, from, to, cls)</text></g><g transform=\"translate(950 104)\"><rect width=\"260\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DistanceFare</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">PER_KM: Map&lt;class, paise&gt;</text><line x1=\"0\" y1=\"48\" x2=\"260\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">farePaise &rarr; rate x km</text></g><g transform=\"translate(950 196)\"><rect width=\"260\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PeakDayFare</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">base: FareRule, peakDays</text><line x1=\"0\" y1=\"48\" x2=\"260\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">farePaise &rarr; base x 1.2 on a peak day</text></g><g transform=\"translate(950 300)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">BerthChooser</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">choose(free, group): List&lt;Berth&gt;</text></g><g transform=\"translate(950 384)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FirstFreeBerths</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">choose &rarr; first free, in order</text></g><g transform=\"translate(950 462)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RefundRule</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">refundPaise(pnr, nowMs): long</text></g><g transform=\"translate(950 546)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FullRefund</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">refundPaise &rarr; the whole amount</text></g><g transform=\"translate(950 624)\"><rect width=\"260\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PaymentGateway</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">charge(key, paise): ref | null</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">refund(ref, paise)</text></g><g transform=\"translate(950 724)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">UpiGateway</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">charge &rarr; one ref per key</text></g><g transform=\"translate(950 802)\"><rect width=\"260\" height=\"86\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">the three exceptions</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">NoPlaces: the group does not fit</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">HoldLapsed: the places are gone</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--text)\">PaymentDeclined: the bank said no</text></g><g><path d=\"M20 975L64 975\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"979\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 975L284 975\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"979\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 975L504 975\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"979\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 975L684 975\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"979\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 975L904 975\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"979\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values; &laquo;record&raquo; = an immutable value). Middle: its fields, the state it holds. Bottom: its methods; a leading minus marks a private helper that runs with the lock already held. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the service owns the runs, a run owns one ClassInventory per class and its PNRs, an inventory owns its berths and RAC halves, a PNR owns its one to six passengers. Plain arrow = references: a passenger points at the berth or RAC half he sits on, a berth at its BerthType. Dashed green = handed in and never built here: the three rules through <code>configure()</code>, the clock through the constructor, the gateway as an argument to <code>pay()</code>. Dotted blue = notifies, after the lock is released. <b>Where state lives:</b> the left column is the catalog (a train, its stops and coaches) and never changes while anybody books. Every field that changes during a booking is on a Berth, a Passenger, a Pnr or the TrainRun itself, and every write to one of them happens inside that run's lock. The service holds no berth state: it owns the indexes, runs book, pay and commit in order, and is the only class that talks to the bank.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does and what it guarantees; read only those first for the shape, then the bodies, starting with <code>TrainRun.book</code> and <code>promoteLocked</code>, which are the whole interview. Each copy button copies that whole file. Below Main.java: Extensions.java (the reference code for every follow-up, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (23 tests, 93 checks; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.time.*;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/** The classes a train sells. Each class is its own pool of berths, RAC places and waitlist; nothing crosses between classes. */\nenum TravelClass { SLEEPER, AC3, AC2 }\n\n/** Where a berth sits in its bay of eight. Only a berth chooser reads it, to honour preferences such as a lower berth. */\nenum BerthType { LOWER, MIDDLE, UPPER, SIDE_LOWER, SIDE_UPPER }\n\n/** A passenger&#x27;s place right now: his own berth, half of a shared side-lower berth (RAC), a waitlist number, or nothing. */\nenum PassengerStatus { CONFIRMED, RAC, WAITLISTED, CANCELLED }\n\n/**\n * A PNR&#x27;s life. PENDING_PAYMENT while its places are held for ten minutes; BOOKED once paid (this is the ticket);\n * EXPIRED if the hold ran out first; CANCELLED if it was given back.\n */\nenum PnrStatus { PENDING_PAYMENT, BOOKED, EXPIRED, CANCELLED }\n\n/**\n * One stop on a route: the station code, the time the train leaves it (minutes after midnight; at the last stop,\n * the time it arrives), how many days after the first stop that is, and the distance from the first stop.\n */\nrecord Stop(String station, int timeMin, int dayOffset, int km) {}\n\n/** One coach in the layout: its id (B1), its class, and how many bays of eight berths it has. */\nrecord Coach(String id, TravelClass cls, int bays) {}\n\n/** Who wants to travel: a name, an age, and a berth preference (null = anything). Input only; never changed. */\nrecord Traveller(String name, int age, BerthType preference) {}\n\n/** One search hit: the run to book on, and when it leaves the first station and reaches the second. */\nrecord Journey(TrainRun run, String from, String to, LocalDateTime departs, LocalDateTime arrives, int km) {}\n\n/** What one class has left for one journey: free berths, free RAC halves, and how full the two queues are. */\nrecord Availability(int berths, int racPlaces, int racQueued, int waitlisted, int waitlistCap) {\n    /**\n     * The line a search page prints, as IRCTC does: AVAILABLE 3 (berths free), else RAC 2 or WL 4 (the number the next\n     * passenger would get), else REGRET when even the waitlist is full.\n     */\n    String label() {\n        if (berths &gt; 0) return &quot;AVAILABLE &quot; + berths;\n        if (racPlaces &gt; 0) return &quot;RAC &quot; + (racQueued + 1);\n        if (waitlisted &lt; waitlistCap) return &quot;WL &quot; + (waitlisted + 1);\n        return &quot;REGRET&quot;;\n    }\n}\n\n/** A change a passenger should hear about (booked, moved up, cancelled). Published after the run&#x27;s lock is released. */\nrecord PnrEvent(String pnr, String passenger, String what) {}\n\n/**\n * The timetable: a numbered train with a fixed route and a fixed coach layout. Catalog only: nothing here changes\n * while anybody books, and it holds no availability. Availability lives on a TrainRun, one per date.\n */\nfinal class Train {\n    final String number;\n    final String name;\n    final List&lt;Stop&gt; stops;\n    final List&lt;Coach&gt; coaches;\n    private final Map&lt;String, Integer&gt; stopNo = new HashMap&lt;&gt;();      // station -&gt; its position on the route, O(1)\n\n    Train(String number, String name, List&lt;Stop&gt; stops, List&lt;Coach&gt; coaches) {\n        if (stops.size() &lt; 2) throw new IllegalArgumentException(&quot;a route needs at least two stops&quot;);\n        this.number = number; this.name = name; this.stops = List.copyOf(stops); this.coaches = List.copyOf(coaches);\n        for (int i = 0; i &lt; stops.size(); i++) {\n            if (stopNo.put(stops.get(i).station(), i) != null)\n                throw new IllegalArgumentException(&quot;station &quot; + stops.get(i).station() + &quot; appears twice on train &quot; + number);\n            if (i &gt; 0 &amp;&amp; (stops.get(i).km() &lt;= stops.get(i - 1).km() || stops.get(i).dayOffset() &lt; stops.get(i - 1).dayOffset()))\n                throw new IllegalArgumentException(&quot;kilometres and days must go forward along the route of train &quot; + number);\n        }\n    }\n    /** The position of a station on this route (0 = the first stop), or -1 when the train does not stop there. */\n    int stopNo(String station) { return stopNo.getOrDefault(station, -1); }\n    /** How many segments the route has: one fewer than its stops. Segment i is the track from stop i to stop i + 1. */\n    int segments() { return stops.size() - 1; }\n    /** Kilometres from stop a to stop b. */\n    int km(int a, int b) { return stops.get(b).km() - stops.get(a).km(); }\n}\n\n/**\n * One berth on one run, or one half of a side-lower berth shared by two RAC passengers. It has no free-or-sold\n * status. It has a bitmap with one bit per segment of the route, set where that segment is sold. Every read and\n * write happens under its run&#x27;s lock.\n */\nfinal class Berth {\n    final String coach;\n    final int number;\n    final BerthType type;\n    final boolean shared;                          // true = an RAC half: two of these make one side-lower berth\n    private final BitSet sold = new BitSet();      // bit i set = segment i is sold\n\n    Berth(String coach, int number, BerthType type, boolean shared) {\n        this.coach = coach; this.number = number; this.type = type; this.shared = shared;\n    }\n    /** True when no segment in [from, to) is sold: the first sold bit at or after from is at or after to. */\n    boolean isFree(int from, int to) { int s = sold.nextSetBit(from); return s &lt; 0 || s &gt;= to; }\n    /** Sell segments [from, to). It refuses to overwrite: selling a segment twice is a bug, never a quiet overwrite. */\n    void take(int from, int to) {\n        if (!isFree(from, to)) throw new IllegalStateException(label() + &quot; is already sold on part of segments &quot; + from + &quot;-&quot; + to);\n        sold.set(from, to);\n    }\n    /** Give segments [from, to) back. Only the passenger who holds them calls this, so nobody else&#x27;s bits are touched. */\n    void release(int from, int to) { sold.clear(from, to); }\n    /** The sold segments as one 64-bit number (bit i = segment i), for routes of up to 64 segments: the database column. */\n    long mask() { long[] w = sold.toLongArray(); return w.length == 0 ? 0 : w[0]; }\n    /** How a ticket prints it: B1/23, or &quot;B1/7 shared&quot; for an RAC half. */\n    String label() { return coach + &quot;/&quot; + number + (shared ? &quot; shared&quot; : &quot;&quot;); }\n}\n\n/**\n * One traveller on one PNR, and where he is right now. The run creates it, never the caller, so no object is ever\n * shared by two bookings. The changing fields are written only under the run&#x27;s lock; volatile, so a reader\n * outside the lock sees the latest value.\n */\nfinal class Passenger {\n    final Traveller who;\n    final Pnr pnr;\n    volatile PassengerStatus status = PassengerStatus.WAITLISTED;\n    volatile Berth place;                          // his berth (CONFIRMED) or his shared half (RAC); null otherwise\n    Passenger(Traveller who, Pnr pnr) { this.who = who; this.pnr = pnr; }\n}\n\n/**\n * A booking reference: who travels, between which stops, in which class, for how much, and where it is in its\n * life. The fare is frozen when the places are taken, so paying can never quietly reprice it.\n */\nfinal class Pnr {\n    final String id;\n    final TrainRun run;\n    final String userId;\n    final TravelClass cls;\n    final int from, to;                            // stop numbers: the journey covers segments [from, to)\n    final List&lt;Passenger&gt; passengers;\n    final long amountPaise;                        // integer paise for the whole group: money is never a double\n    final long holdExpiresMs;\n    volatile PnrStatus status = PnrStatus.PENDING_PAYMENT;\n    volatile String paymentRef;                    // what the gateway gave back; needed to refund\n    Pnr(String id, TrainRun run, String userId, TravelClass cls, int from, int to, List&lt;Traveller&gt; group,\n        long amountPaise, long holdExpiresMs) {\n        this.id = id; this.run = run; this.userId = userId; this.cls = cls; this.from = from; this.to = to;\n        this.amountPaise = amountPaise; this.holdExpiresMs = holdExpiresMs;\n        List&lt;Passenger&gt; ps = new ArrayList&lt;&gt;();\n        for (Traveller t : group) ps.add(new Passenger(t, this));\n        this.passengers = List.copyOf(ps);\n    }\n}\n\n/** Not enough places for the whole group, or not enough berths when only berths were wanted. Nothing was held. */\nclass NoPlaces extends RuntimeException { NoPlaces(String m) { super(m); } }\n/** The hold ran out before the payment came back. The caller refunds whatever was charged. */\nclass HoldLapsed extends RuntimeException { HoldLapsed(String m) { super(m); } }\n/** The gateway said no. The places stay held until the hold runs out, so the user can try another card. */\nclass PaymentDeclined extends RuntimeException { PaymentDeclined(String m) { super(m); } }\n\n/** Where time comes from. Handed in, so a test can make ten minutes pass without sleeping. */\ninterface Clock { long nowMs(); }\n\n// &quot;fares will change: a festival week, Tatkal, flexi-fare&quot; -&gt; hide the rule behind an interface -&gt; Strategy\n/** What ONE passenger pays for a journey, in paise. Called inside the run&#x27;s lock, so it must stay arithmetic. */\ninterface FareRule { long farePaise(TrainRun run, int from, int to, TravelClass cls); }\n\n/** The base rule: paise per kilometre by class (made-up rates). A table, not an if-chain, so a new class is one row. */\nfinal class DistanceFare implements FareRule {\n    private static final Map&lt;TravelClass, Long&gt; PER_KM = new EnumMap&lt;&gt;(Map.of(\n        TravelClass.SLEEPER, 50L, TravelClass.AC3, 140L, TravelClass.AC2, 200L));\n    /** Rate times kilometres: 3A from Pune to Bengaluru is 140 x 868 = 121,520 paise. */\n    public long farePaise(TrainRun run, int from, int to, TravelClass cls) { return PER_KM.get(cls) * run.train.km(from, to); }\n}\n\n/**\n * Journeys on peak days (a festival week) cost more: a NEW rule that wraps the one it is given (Decorator). It\n * reads the run&#x27;s date, never the clock, so a booking made in September for a Diwali train pays the Diwali fare.\n */\nfinal class PeakDayFare implements FareRule {\n    private final FareRule base;\n    private final Set&lt;LocalDate&gt; peakDays;\n    private final int percent;                     // 120 = one fifth more\n    PeakDayFare(FareRule base, Set&lt;LocalDate&gt; peakDays, int percent) { this.base = base; this.peakDays = Set.copyOf(peakDays); this.percent = percent; }\n    /** The wrapped fare, times percent / 100 on a peak day; integer paise, rounded down. */\n    public long farePaise(TrainRun run, int from, int to, TravelClass cls) {\n        long f = base.farePaise(run, from, to, cls);\n        return peakDays.contains(run.date) ? f * percent / 100 : f;\n    }\n}\n\n// &quot;the family wants to sit together; grandma needs a lower berth&quot; -&gt; which berths is a rule -&gt; Strategy\n/**

i = 1; i &lt;= n; i++) out.add(t(prefix + i, 30)); return out; }\n    /** The label of the first passenger&#x27;s place, or &quot;-&quot;. */\n    static String place(Pnr p) { Berth b = p.passengers.get(0).place; return b == null ? &quot;-&quot; : b.label(); }\n    /** Every passenger&#x27;s status, in order. */\n    static List&lt;PassengerStatus&gt; statuses(Pnr p) { List&lt;PassengerStatus&gt; out = new ArrayList&lt;&gt;(); for (Passenger x : p.passengers) out.add(x.status); return out; }\n    /** Run ids of search hits, in the order returned. */\n    static List&lt;String&gt; ids(List&lt;Journey&gt; js) { List&lt;String&gt; out = new ArrayList&lt;&gt;(); for (Journey j : js) out.add(j.run().id); return out; }\n    /** The free seats of one fare type of one flight, as a search sees them. */\n    static List&lt;String&gt; seats(FlightDesk d, String flightNo, String fare) {\n        for (Offer o : d.search(&quot;DEL&quot;, &quot;BLR&quot;, 2, 0)) if (o.flight().number.equals(flightNo) &amp;&amp; o.fareType().equals(fare)) return o.seats();\n        return List.of();\n    }\n    /** A random journey along the Deccan Arrow&#x27;s five stops, as two stop numbers a &lt; b. */\n    static int[] journey(Random r) { int a = r.nextInt(4); return new int[] { a, a + 1 + r.nextInt(4 - a) }; }\n\n    /**\n     * Every rule the run promises, checked from scratch; an empty list means all of them hold. Call it only when\n     * no other thread is running. Checked: no segment of any place sold twice, and the bits equal the union of the\n     * passengers on it; each status matches its place and its queue; nobody waits while a place fits his journey;\n     * the waitlist is within its cap; a dead PNR has no live passenger.\n     */\n    static List&lt;String&gt; violations(TrainRun run) {\n        List&lt;String&gt; bad = new ArrayList&lt;&gt;();\n        List&lt;Pnr&gt; all = run.pnrs();\n        for (TravelClass c : TravelClass.values()) {\n            ClassInventory inv;\n            try { inv = run.inventory(c); } catch (NoSuchElementException e) { continue; }\n            Map&lt;Berth, List&lt;Passenger&gt;&gt; on = new IdentityHashMap&lt;&gt;();\n            for (Pnr p : all) {\n                if (p.cls != c) continue;\n                boolean live = p.status == PnrStatus.PENDING_PAYMENT || p.status == PnrStatus.BOOKED;\n                for (Passenger x : p.passengers) {\n                    String who = p.id + &quot; &quot; + x.who.name();\n                    if (live == (x.status == PassengerStatus.CANCELLED)) bad.add(who + &quot; is &quot; + x.status + &quot; on a &quot; + p.status + &quot; PNR&quot;);\n                    if (x.place != null) on.computeIfAbsent(x.place, k -&gt; new ArrayList&lt;&gt;()).add(x);\n                    boolean inRac = inv.rac.contains(x), inWl = inv.waitlist.contains(x);\n                    switch (x.status) {\n                        case CONFIRMED -&gt; { if (x.place == null || x.place.shared || inRac || inWl) bad.add(who + &quot;: CONFIRMED but not on a berth of his own&quot;); }\n                        case RAC -&gt; {\n                            if (x.place == null || !x.place.shared || !inRac || inWl) bad.add(who + &quot;: RAC but not on a shared half in the RAC queue&quot;);\n                            else if (ClassInventory.firstFree(inv.berths, p.from, p.to) != null) bad.add(who + &quot; is RAC while a berth fits his journey&quot;);\n                        }\n                        case WAITLISTED -&gt; {\n                            if (x.place != null || inRac || !inWl) bad.add(who + &quot;: WAITLISTED but not only on the waitlist&quot;);\n                            else if (ClassInventory.firstFree(inv.berths, p.from, p.to) != null || ClassInventory.firstFree(inv.racHalves, p.from, p.to) != null)\n                                bad.add(who + &quot; waits while a place fits his journey&quot;);\n                        }\n                        case CANCELLED -&gt; { if (x.place != null || inRac || inWl) bad.add(who + &quot;: CANCELLED but still holding something&quot;); }\n                    }\n                }\n            }\n            List&lt;Berth&gt; places = new ArrayList&lt;&gt;(inv.berths);\n            places.addAll(inv.racHalves);\n            int segs = run.train.segments();\n            for (Berth b : places) {\n                boolean[] covered = new boolean[segs];\n                for (Passenger x : on.getOrDefault(b, List.of()))\n                    for (int s = x.pnr.from; s &lt; x.pnr.to; s++) { if (covered[s]) bad.add(b.label() + &quot; segment &quot; + s + &quot; sold twice&quot;); covered[s] = true; }\n                for (int s = 0; s &lt; segs; s++) if (covered[s] == b.isFree(s, s + 1)) bad.add(b.label() + &quot; segment &quot; + s + &quot;: the bits disagree with its passengers&quot;);\n            }\n            if (inv.waitlist.size() &gt; inv.waitlistCap) bad.add(c + &quot; waitlist is over its cap&quot;);\n        }\n        return bad;\n    }\n\n    /** Runs every numbered test and prints ALL PASS, or exits non-zero. */\n    public static void main(String[] args) throws Exception {\n        CountingGateway pay = new CountingGateway(true);\n\n        // 1. a berth is sold per segment: three passengers share B1/1 end to end, and an overlap goes elsewhere\n        BookingService s1 = service();\n        TrainRun r1 = freshRun(s1, 1, 3);\n        Pnr x1 = s1.book(r1.id, &quot;x&quot;, &quot;CSMT&quot;, &quot;PUNE&quot;, TravelClass.AC3, List.of(t(&quot;X&quot;, 30)), true);     // segment 0\n        Pnr y1 = s1.book(r1.id, &quot;y&quot;, &quot;SUR&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Y&quot;, 30)), true);       // segments 2-3\n        check(place(x1).equals(&quot;B1/1&quot;) &amp;&amp; place(y1).equals(&quot;B1/1&quot;), &quot;CSMT-PUNE and SUR-SBC are both sold B1/1: &quot; + place(x1) + &quot;, &quot; + place(y1));\n        check(s1.availability(r1.id, &quot;PUNE&quot;, &quot;SUR&quot;, TravelClass.AC3).berths() == 7, &quot;a search for PUNE-SUR still counts all seven berths, B1/1 included&quot;);\n        Pnr z1 = s1.book(r1.id, &quot;z&quot;, &quot;PUNE&quot;, &quot;SUR&quot;, TravelClass.AC3, List.of(t(&quot;Z&quot;, 30)), true);      // segment 1: the gap\n        check(place(z1).equals(&quot;B1/1&quot;), &quot;PUNE-SUR fills the gap on B1/1: three passengers, one berth, touching at PUNE and SUR&quot;);\n        Pnr w1 = s1.book(r1.id, &quot;w&quot;, &quot;CSMT&quot;, &quot;SUR&quot;, TravelClass.AC3, List.of(t(&quot;W&quot;, 30)), true);\n        check(!place(w1).equals(&quot;B1/1&quot;), &quot;CSMT-SUR overlaps them and is sold another berth: &quot; + place(w1));\n        check(violations(r1).isEmpty(), &quot;no segment of any berth is sold twice &quot; + violations(r1));\n\n        // 2. fifty phones, the last berth, berths only: exactly one wins\n        BookingService s2 = service();\n        TrainRun r2 = freshRun(s2, 1, 3);\n        s2.book(r2.id, &quot;grp&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;g&quot;, 6), true);\n        int wins = Main.race(50, i -&gt; s2.book(r2.id, &quot;fan&quot; + i, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Fan&quot; + i, 30)), true));\n        check(wins == 1, &quot;fifty threads for the last berth: exactly one booking (&quot; + wins + &quot;)&quot;);\n        check(s2.availability(r2.id, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3).berths() == 0 &amp;&amp; violations(r2).isEmpty(), &quot;no berth left and nothing sold twice&quot;);\n\n        // 3. fifty phones on an empty class, one traveller each: 7 berths + 2 RAC halves + 3 waitlist = 12 places\n        BookingService s3 = service();\n        TrainRun r3 = freshRun(s3, 1, 3);\n        int placed = Main.race(50, i -&gt; s3.book(r3.id, &quot;fan&quot; + i, &quot;PUNE&quot;, &quot;GTL&quot;, TravelClass.AC3, List.of(t(&quot;Fan&quot; + i, 30)), false));\n        ClassInventory inv3 = r3.inventory(TravelClass.AC3);\n        check(placed == 12, &quot;fifty threads, empty 3A: exactly 12 get a place (&quot; + placed + &quot;)&quot;);\n        check(inv3.rac.size() == 2 &amp;&amp; inv3.waitlist.size() == 3, &quot;2 on RAC, 3 on the waitlist; the other 38 were told REGRET&quot;);\n        check(violations(r3).isEmpty(), &quot;every invariant holds after the race &quot; + violations(r3));\n\n        // 4. a cancel moves RAC up to a berth and the waitlist up to RAC, earliest first, in the same locked step\n        BookingService s4 = service();\n        List&lt;PnrEvent&gt; heard = new CopyOnWriteArrayList&lt;&gt;();\n        s4.addObserver(heard::add);\n        TrainRun r4 = freshRun(s4, 1, 3);\n        Pnr asha = s4.book(r4.id, &quot;asha&quot;, &quot;CSMT&quot;, &quot;PUNE&quot;, TravelClass.AC3, List.of(t(&quot;Asha&quot;, 34)), false);\n        Pnr ravi = s4.book(r4.id, &quot;ravi&quot;, &quot;PUNE&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Ravi&quot;, 41)), false);\n        Pnr fam = s4.book(r4.id, &quot;dev&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;f&quot;, 6), false);\n        Pnr meena = s4.book(r4.id, &quot;meena&quot;, &quot;SUR&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Meena&quot;, 38), t(&quot;Arjun&quot;, 15)), false);\n        Pnr kiran = s4.book(r4.id, &quot;kiran&quot;, &quot;SUR&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Kiran&quot;, 29)), false);\n        for (Pnr p : List.of(asha, ravi, fam, meena, kiran)) s4.pay(p.id, pay);\n        check(s4.status(meena.id).equals(List.of(&quot;Meena RAC 1 B1/7 shared&quot;, &quot;Arjun RAC 2 B1/7 shared&quot;)) &amp;&amp; s4.status(kiran.id).equals(List.of(&quot;Kiran WL 1&quot;)),\n              &quot;before: Meena RAC 1 and Arjun RAC 2 share B1/7, Kiran is WL 1&quot;);\n        heard.clear();\n        s4.cancel(ravi.id, pay);\n        check(s4.status(meena.id).equals(List.of(&quot;Meena CNF B1/1 LOWER&quot;, &quot;Arjun RAC 1 B1/7 shared&quot;)), &quot;Ravi cancels: Meena gets his berth, Arjun becomes RAC 1 &quot; + s4.status(meena.id));\n        check(s4.status(kiran.id).equals(List.of(&quot;Kiran RAC 2 B1/7 shared&quot;)), &quot;Kiran moves from WL 1 to RAC 2, into Meena&#x27;s half&quot;);\n        check(heard.size() == 3 &amp;&amp; heard.get(1).what().equals(&quot;RAC 1 -&gt; CNF B1/1&quot;) &amp;&amp; heard.get(2).what().startsWith(&quot;WL 1 -&gt; RAC 2&quot;),\n              &quot;they are told in that order, after the lock: &quot; + heard);\n        Pnr neel = s4.book(r4.id, &quot;neel&quot;, &quot;SUR&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Neel&quot;, 50)), false);\n        check(neel.passengers.get(0).status == PassengerStatus.WAITLISTED, &quot;a newcomer for the same journey is waitlisted: the berth went to the people already waiting&quot;);\n        check(violations(r4).isEmpty(), &quot;every invariant holds &quot; + violations(r4));\n\n        // 5. a waiter whose journey does not fit is skipped, and keeps his place\n        BookingService s5 = service();\n        TrainRun r5 = freshRun(s5, 0, 3);                                          // no RAC berth: 8 berths, a waitlist of 3\n        Pnr shortOne = s5.book(r5.id, &quot;s&quot;, &quot;SUR&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;S&quot;, 30)), true);   // B1/1 segments 2-3\n        s5.book(r5.id, &quot;f&quot;, &quot;CSMT&quot;, &quot;SUR&quot;, TravelClass.AC3, List.of(t(&quot;F&quot;, 30)), true);                  // B1/1 segments 0-1\n        s5.book(r5.id, &quot;g&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;g&quot;, 6), true);                       // B1/2 .. B1/7\n        s5.book(r5.id, &quot;h&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;H&quot;, 30)), true);                  // B1/8: full everywhere\n        Pnr longWait = s5.book(r5.id, &quot;l&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Long&quot;, 30)), false);\n        Pnr shortWait = s5.book(r5.id, &quot;m&quot;, &quot;SUR&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Short&quot;, 30)), false);\n        s5.cancel(shortOne.id, pay);                                               // frees B1/1 on segments 2-3 only\n        check(s5.status(longWait.id).equals(List.of(&quot;Long WL 1&quot;)), &quot;the first waiter needs CSMT-SBC, which B1/1 cannot give: he stays WL 1&quot;);\n        check(s5.status(shortWait.id).equals(List.of(&quot;Short CNF B1/1 LOWER&quot;)), &quot;the second waiter fits SUR-SBC and is confirmed on B1/1&quot;);\n        check(violations(r5).isEmpty(), &quot;every invariant holds &quot; + violations(r5));\n\n        // 6. a cancel and a newcomer at the same instant, a hundred times: the waiter always gets the berth\n        int fair = 0;\n        for (int round = 0; round &lt; 100; round++) {\n            BookingService s6 = service();\n            TrainRun r6 = freshRun(s6, 0, 3);\n            Pnr holder = s6.book(r6.id, &quot;h&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;H&quot;, 30)), true);   // B1/1\n            s6.book(r6.id, &quot;g&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;g&quot;, 6), true);\n            s6.book(r6.id, &quot;g7&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;G7&quot;, 30)), true);\n            Pnr waiter = s6.book(r6.id, &quot;w&quot;, &quot;PUNE&quot;, &quot;SUR&quot;, TravelClass.AC3, List.of(t(&quot;W&quot;, 30)), false);\n            CyclicBarrier both = new CyclicBarrier(2);\n            ExecutorService two = Executors.newFixedThreadPool(2);\n            Future&lt;Long&gt; a = two.submit(() -&gt; { both.await(); return s6.cancel(holder.id, pay); });\n            Future&lt;Pnr&gt; b = two.submit(() -&gt; { both.await(); return s6.book(r6.id, &quot;n&quot;, &quot;PUNE&quot;, &quot;SUR&quot;, TravelClass.AC3, List.of(t(&quot;N&quot;, 30)), false); });\n            a.get(5, n            int seed = th;\n            jobs.add(crowd.submit(() -&gt; {\n                go16.await();\n                Random r = new Random(seed);\n                List&lt;Pnr&gt; mine = new ArrayList&lt;&gt;();\n                for (int i = 0; i &lt; 400; i++) {\n                    try {\n                        if (mine.isEmpty() || r.nextInt(3) &gt; 0) {\n                            int[] j = journey(r);\n                            Pnr p = s16.book(r16b.id, &quot;c&quot; + seed, ST[j[0]], ST[j[1]], TravelClass.AC3, people(&quot;c&quot; + seed + &quot;-&quot; + i + &quot;-&quot;, 1 + r.nextInt(2)), false);\n                            mine.add(p);\n                            if (r.nextBoolean()) s16.pay(p.id, pay);\n                        } else s16.cancel(mine.remove(r.nextInt(mine.size())).id, pay);\n                    } catch (RuntimeException e) { /* a refusal */ }\n                }\n                return null;\n            }));\n        }\n        go16.countDown();\n        for (Future&lt;Object&gt; f : jobs) f.get(30, TimeUnit.SECONDS);\n        crowd.shutdown();\n        check(violations(r16b).isEmpty(), &quot;8 threads x 400 random books, payments and cancels at once: every invariant holds at the end &quot; + violations(r16b));\n\n        // 17. edges are refused, and nothing is held\n        BookingService s17 = service();\n        TrainRun r17 = freshRun(s17, 1, 3);\n        Object[][] edges = { { &quot;PUNE&quot;, &quot;PUNE&quot;, 1 }, { &quot;SBC&quot;, &quot;PUNE&quot;, 1 }, { &quot;CSMT&quot;, &quot;XYZ&quot;, 1 }, { &quot;CSMT&quot;, &quot;SBC&quot;, 0 }, { &quot;CSMT&quot;, &quot;SBC&quot;, 7 } };\n        for (Object[] c : edges) {\n            try { s17.book(r17.id, &quot;e&quot;, (String) c[0], (String) c[1], TravelClass.AC3, people(&quot;e&quot;, (Integer) c[2]), false); check(false, &quot;must be refused: &quot; + Arrays.toString(c)); }\n            catch (IllegalArgumentException e) { check(true, &quot;refused: &quot; + e.getMessage()); }\n        }\n        try { s17.book(r17.id, &quot;e&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC2, people(&quot;e&quot;, 1), false); check(false, &quot;a class the train does not have must be refused&quot;); }\n        catch (NoSuchElementException e) { check(true, &quot;refused: &quot; + e.getMessage()); }\n        long[] clk17 = { r17.departsMs(1) + 60_000 };                                // a minute after it left Pune\n        BookingService s17b = new BookingService(() -&gt; clk17[0], HOLD);\n        s17b.addTrain(Main.deccanArrow());\n        TrainRun r17b = s17b.addRun(&quot;12999&quot;, r17.date, 1, 3);\n        try { s17b.book(r17b.id, &quot;e&quot;, &quot;PUNE&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;e&quot;, 1), false); check(false, &quot;boarding after the train left must be refused&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;refused: &quot; + e.getMessage()); }\n        Pnr fromSur = s17b.book(r17b.id, &quot;e&quot;, &quot;SUR&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;s&quot;, 1), false);\n        check(fromSur.status == PnrStatus.PENDING_PAYMENT, &quot;but Solapur is still ahead of the train, so a Solapur boarding is sold&quot;);\n        check(s17.availability(r17.id, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3).berths() == 7 &amp;&amp; r17.pnrs().isEmpty(), &quot;the refusals held nothing&quot;);\n\n        // 18. fares: distance, a peak day, Tatkal with its floor, flexi, and the order of wrapping\n        BookingService s18 = service();\n        TrainRun r18 = freshRun(s18, 1, 3), other18 = freshRun(s18, 1, 3);\n        FareRule base = new DistanceFare();\n        check(base.farePaise(r18, 1, 4, TravelClass.AC3) == 121_520, &quot;3A PUNE-SBC is 140 paise x 868 km = Rs 1,215.20&quot;);\n        FareRule peak = new PeakDayFare(base, Set.of(r18.date), 120);\n        check(peak.farePaise(r18, 1, 4, TravelClass.AC3) == 145_824 &amp;&amp; peak.farePaise(other18, 1, 4, TravelClass.AC3) == 121_520,\n              &quot;a peak day pays 1.2x (Rs 1,458.24); the next day pays Rs 1,215.20&quot;);\n        check(new TatkalFare(base).farePaise(r18, 1, 4, TravelClass.AC3) == 121_520 + 36_456, &quot;Tatkal adds 30%: Rs 364.56, inside its floor and cap&quot;);\n        check(new TatkalFare(base).farePaise(r18, 0, 1, TravelClass.AC3) == 26_880 + 30_000, &quot;a short Tatkal journey pays the floor: 30% of Rs 268.80 is below Rs 300&quot;);\n        FareRule flexi = new FlexiFare(base);\n        check(flexi.farePaise(r18, 1, 4, TravelClass.AC3) == 121_520, &quot;flexi on an empty class is the base fare&quot;);\n        s18.book(r18.id, &quot;g&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;g&quot;, 4), true);          // 4 of 7 sold: 5 tenths\n        check(flexi.farePaise(r18, 1, 4, TravelClass.AC3) == 182_280, &quot;flexi with 4 of 7 berths sold: 1.5x, the cap&quot;);\n        long inner = new TatkalFare(new FlexiFare(base)).farePaise(r18, 1, 4, TravelClass.AC3), outer = new FlexiFare(new TatkalFare(base)).farePaise(r18, 1, 4, TravelClass.AC3);\n        check(inner == 222_280 &amp;&amp; outer == 236_964, &quot;the order of wrapping is a decision: flexi inside Tatkal &quot; + Main.rupees(inner) + &quot;, Tatkal inside flexi &quot; + Main.rupees(outer));\n\n        // 19. a family together: one coach when one coach has room, lower berths for the seniors, seniors first when short\n        Train twoCoach = new Train(&quot;12888&quot;, &quot;Two Coach&quot;, Main.deccanArrow().stops, List.of(new Coach(&quot;B1&quot;, TravelClass.AC3, 1), new Coach(&quot;B2&quot;, TravelClass.AC3, 1)));\n        BookingService s19 = new BookingService(() -&gt; now[0], HOLD);\n        s19.addTrain(twoCoach);\n        TrainRun r19 = s19.addRun(&quot;12888&quot;, LocalDate.of(2026, 12, 20), 1, 3);            // B1: 8 berths, B2: 7 (B2/7 is the RAC berth)\n        s19.book(r19.id, &quot;x&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;x&quot;, 6), true);      // B1/1..6: only 2 left in B1\n        s19.configure(new DistanceFare(), new FamilyChooser(), new FullRefund());\n        Pnr family = s19.book(r19.id, &quot;dev&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3,\n            List.of(new Traveller(&quot;Dev&quot;, 45, BerthType.UPPER), t(&quot;Mira&quot;, 43), t(&quot;Nana&quot;, 72), t(&quot;Nani&quot;, 68)), false);\n        List&lt;String&gt; famStatus = s19.status(family.id);\n        check(famStatus.stream().allMatch(s -&gt; s.contains(&quot; B2/&quot;)), &quot;four travellers, two berths left in B1: all four go to B2 together &quot; + famStatus);\n        check(famStatus.get(2).endsWith(&quot;LOWER&quot;) &amp;&amp; famStatus.get(3).endsWith(&quot;LOWER&quot;) &amp;&amp; famStatus.get(0).endsWith(&quot;UPPER&quot;), &quot;the two over sixty get lower berths, Dev his upper&quot;);\n        TrainRun r19b = s19.addRun(&quot;12888&quot;, LocalDate.of(2026, 12, 21), 1, 3);\n        s19.configure(new DistanceFare(), new FirstFreeBerths(), new FullRefund());\n        s19.book(r19b.id, &quot;x&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;x&quot;, 6), true);\n        s19.book(r19b.id, &quot;y&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;y&quot;, 6), true);\n        s19.book(r19b.id, &quot;z&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;z&quot;, 1), true);      // 13 of 15: two berths left\n        s19.configure(new DistanceFare(), new FamilyChooser(), new FullRefund());\n        Pnr short19 = s19.book(r19b.id, &quot;o&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Anil&quot;, 30), t(&quot;Bina&quot;, 31), t(&quot;Grandpa&quot;, 75)), false);\n        check(statuses(short19).get(2) == PassengerStatus.CONFIRMED &amp;&amp; statuses(short19).contains(PassengerStatus.RAC), &quot;two berths for three: Grandpa, listed last, still gets one &quot; + statuses(short19));\n\n        // 20. the sideways index counts the same free berths as the walk, for every journey\n        SegmentIndex idx = new SegmentIndex(r16.soldMasks(TravelClass.AC3), r16.train.segments());\n        boolean same = true;\n        for (int a = 0; a &lt; 4; a++) for (int b = a + 1; b &lt;= 4; b++) same &amp;= idx.freeFor(a, b) == r16.availability(ST[a], ST[b], TravelClass.AC3).berths();\n        check(same, &quot;after the random workload, the sideways index and the walk agree on all ten journeys&quot;);\n\n        // 21. a queue in front of the run: arrival order, and a full queue says &quot;try again&quot; at once\n        BookingService s21 = service();\n        TrainRun r21 = freshRun(s21, 1, 3);\n        RunQueue q = new RunQueue(&quot;run-&quot; + r21.id, 64);\n        List&lt;CompletableFuture&lt;Pnr&gt;&gt; answers = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 10; i++) { String u = &quot;tatkal&quot; + i; answers.add(q.submit(() -&gt; s21.book(r21.id, u, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(u, 30)), true))); }\n        List&lt;Boolean&gt; got = new ArrayList&lt;&gt;();\n        for (CompletableFuture&lt;Pnr&gt; f : answers) { try { f.get(5, TimeUnit.SECONDS); got.add(true); } catch (ExecutionException e) { got.add(false); } }\n        check(got.equals(List.of(true, true, true, true, true, true, true, false, false, false)), &quot;ten requests for seven berths: the first seven, in arrival order, get them &quot; + got);\n        q.stop();\n        RunQueue tiny = new RunQueue(&quot;tiny&quot;, 1);\n        CountDownLatch started = new CountDownLatch(1), release = new CountDownLatch(1);\n        tiny.submit(() -&gt; { started.countDown(); try { release.await(); } catch (InterruptedException e) { } return 1; });   // keeps the worker busy\n        started.await(2, TimeUnit.SECONDS);\n        CompletableFuture&lt;Integer&gt; queued = tiny.submit(() -&gt; 2), refused = tiny.submit(() -&gt; 3);\n        check(refused.isCompletedExceptionally() &amp;&amp; !queued.isDone(), &quot;the queue holds one: the third request is refused at once instead of waiting&quot;);\n        release.countDown();\n        check(queued.get(2, TimeUnit.SECONDS) == 2, &quot;the queued request still runs once the worker is free&quot;);\n        tiny.stop();\n\n        // 22. the database stand-in: fifty conditional UPDATEs on one row, one winner; touching segments share a row; a group rolls back\n        MaskStore db = new MaskStore();\n        db.add(&quot;R&quot;, &quot;B1/1&quot;); db.add(&quot;R&quot;, &quot;A9/9&quot;);\n        ExecutorService pool22 = Executors.newFixedThreadPool(50);\n        CountDownLatch go22 = new CountDownLatch(1);\n        AtomicInteger won = new AtomicInteger();\n        for (int i = 0; i &lt; 50; i++) pool22.submit(() -&gt; { go22.await(); if (db.sellAll(&quot;R&quot;, List.of(&quot;B1/1&quot;), 1, 3)) won.incrementAndGet(); return null; });\n        go22.countDown(); pool22.shutdown(); pool22.awaitTermination(5, TimeUnit.SECONDS);\n        check(won.get() == 1, &quot;fifty conditional UPDATEs for segments 1-3 of one berth: one row changed (&quot; + won.get() + &quot;)&quot;);\n        check(db.sellAll(&quot;R&quot;, List.of(&quot;B1/1&quot;), 3, 4) &amp;&amp; !db.sellAll(&quot;R&quot;, List.of(&quot;B1/1&quot;), 2, 4), &quot;segments 3-4 of the same row sell; 2-4 overlaps and does not&quot;);\n        check(!db.sellAll(&quot;R&quot;, List.of(&quot;B1/1&quot;, &quot;A9/9&quot;), 0, 2) &amp;&amp; db.mask(&quot;R&quot;, &quot;A9/9&quot;) == 0, &quot;a group whose second row is taken rolls back the first: A9/9 is empty again&quot;);\n\n        // 23. the flight desk: every seat or none, the wallet, cancel once, change without losing the booking, no deadlock\n        FlightDesk fd = new FlightDesk();\n        fd.addUser(&quot;u1&quot;, &quot;Vinit&quot;, 500_000); fd.addUser(&quot;u2&quot;, &quot;Neha&quot;, 150_000);\n        fd.addFlight(new Flight(&quot;111&quot;, &quot;6E&quot;, &quot;DEL&quot;, &quot;BLR&quot;, 2, 10 * 60 + 30).fare(&quot;F1&quot;, 100_000, &quot;10a&quot;, &quot;11c&quot;, &quot;20b&quot;, &quot;21a&quot;).fare(&quot;F2&quot;, 150_000, &quot;1a&quot;, &quot;1b&quot;));\n        fd.addFlight(new Flight(&quot;211&quot;, &quot;6E&quot;, &quot;DEL&quot;, &quot;BLR&quot;, 2, 18 * 60 + 45).fare(&quot;F1&quot;, 120_000, &quot;10a&quot;, &quot;11c&quot;, &quot;20b&quot;));\n        String fb1 = fd.book(&quot;u1&quot;, &quot;111&quot;, 2, &quot;F1&quot;, List.of(&quot;10a&quot;, &quot;11c&quot;));\n        try { fd.book(&quot;u2&quot;, &quot;111&quot;, 2, &quot;F1&quot;, List.of(&quot;20b&quot;, &quot;11c&quot;)); check(false, &quot;a taken seat must refuse the booking&quot;); }\n        catch (IllegalStateException e) { check(fd.funds(&quot;u2&quot;) == 150_000 &amp;&amp; seats(fd, &quot;111&quot;, &quot;F1&quot;).equals(List.of(&quot;20b&quot;, &quot;21a&quot;)), &quot;one taken seat refuses the whole booking: no money moved, 20b still free&quot;); }\n        try { fd.book(&quot;u2&quot;, &quot;111&quot;, 2, &quot;F2&quot;, List.of(&quot;1a&quot;, &quot;1b&quot;)); check(false, &quot;a short wallet must refuse the booking&quot;); }\n        catch (IllegalStateException e) { check(fd.funds(&quot;u2&quot;) == 150_000 &amp;&amp; seats(fd, &quot;111&quot;, &quot;F2&quot;).size() == 2, &quot;Rs 3,000 of seats with Rs 1,500 in the wallet: refused, nothing moved&quot;); }\n        fd.cancel(&quot;u1&quot;, fb1);\n        check(fd.funds(&quot;u1&quot;) == 500_000 &amp;&amp; seats(fd, &quot;111&quot;, &quot;F1&quot;).size() == 4, &quot;cancel gives back the seats and the money&quot;);\n        try { fd.cancel(&quot;u1&quot;, fb1); check(false, &quot;a second cancel must be refused&quot;); }\n        catch (IllegalStateException e) { check(fd.funds(&quot;u1&quot;) == 500_000, &quot;a second cancel is refused and refunds nothing twice&quot;); }\n        String fb2 = fd.book(&quot;u2&quot;, &quot;211&quot;, 2, &quot;F1&quot;, List.of(&quot;10a&quot;));                         // Rs 1,200: Neha has Rs 300 left\n        try { fd.change(&quot;u2&quot;, fb2, &quot;111&quot;, 2, &quot;F2&quot;, List.of(&quot;1a&quot;, &quot;1b&quot;)); check(false, &quot;a change she cannot afford must be refused&quot;); }\n        catch (IllegalStateException e) { check(fd.funds(&quot;u2&quot;) == 30_000 &amp;&amp; !seats(fd, &quot;211&quot;, &quot;F1&quot;).contains(&quot;10a&quot;) &amp;&amp; seats(fd, &quot;111&quot;, &quot;F2&quot;).contains(&quot;1a&quot;), &quot;a change she cannot afford is refused; the old booking is untouched&quot;); }\n        fd.change(&quot;u2&quot;, fb2, &quot;111&quot;, 2, &quot;F1&quot;, List.of(&quot;21a&quot;));\n        check(fd.funds(&quot;u2&quot;) == 50_000 &amp;&amp; seats(fd, &quot;211&quot;, &quot;F1&quot;).contains(&quot;10a&quot;) &amp;&amp; !seats(fd, &quot;111&quot;, &quot;F1&quot;).contains(&quot;21a&quot;), &quot;moving to a cheaper fare refunds Rs 200 and moves the seat&quot;);\n        fd.addUser(&quot;a&quot;, &quot;A&quot;, 100_000_000); fd.addUser(&quot;b&quot;, &quot;B&quot;, 100_000_000);\n        String ba = fd.book(&quot;a&quot;, &quot;111&quot;, 2, &quot;F1&quot;, List.of(&quot;20b&quot;)), bb = fd.book(&quot;b&quot;, &quot;211&quot;, 2, &quot;F1&quot;, List.of(&quot;11c&quot;));\n        ExecutorService swap = Executors.newFixedThreadPool(2);\n        Future&lt;Object&gt; fa = swap.submit(() -&gt; { for (int i = 0; i &lt; 200; i++) fd.change(&quot;a&quot;, ba, i % 2 == 0 ? &quot;211&quot; : &quot;111&quot;, 2, &quot;F1&quot;, List.of(&quot;20b&quot;)); return null; });\n        Future&lt;Object&gt; fbb = swap.submit(() -&gt; { for (int i = 0; i &lt; 200; i++) fd.change(&quot;b&quot;, bb, i % 2 == 0 ? &quot;111&quot; : &quot;211&quot;, 2, &quot;F1&quot;, List.of(&quot;11c&quot;)); return null; });\n        boolean finished = true;\n        try { fa.get(10, TimeUnit.SECONDS); fbb.get(10, TimeUnit.SECONDS); } catch (TimeoutException e) { finished = false; }\n        swap.shutdownNow();\n        check(finished, &quot;two users moving between the same two flights in opposite directions, 200 times each: no deadlock&quot;);\n        check(seats(fd, &quot;111&quot;, &quot;F1&quot;).equals(List.of(&quot;10a&quot;, &quot;11c&quot;)) &amp;&amp; seats(fd, &quot;211&quot;, &quot;F1&quot;).equals(List.of(&quot;10a&quot;, &quot;20b&quot;)), &quot;and every seat is exactly where it started&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design IRCTC's ticket booking. Users search trains between two stations on a date, book berths for a group, pay and cancel; a berth sold from Mumbai to Pune must be sold again from Pune onwards, and when a class is full people go on RAC and the waitlist and move up when someone cancels. Thousands want the last berth at 10:00. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions; then type in the order of Main.java: the enums (TravelClass, BerthType, PassengerStatus, PnrStatus), the records (Stop, Coach, Traveller), Train, Berth with its bitmap, Passenger and Pnr, the three small exceptions, Clock and the five one-method interfaces with one implementation each, ClassInventory, the TrainRun with its lock and the order inside <code>book</code> and <code>cancel</code>, the BookingService with the station index and the payment between the two locked halves, and a main with the race. If the clock runs out, the part that must exist is <code>Berth.isFree</code> and <code>take</code>, <code>TrainRun.book</code> and <code>cancel</code> with the promotion under one lock, and search. The ten-minute hold, the RAC halves, the fare and refund rules and the listeners come after.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>1 &middot; Fifty people press Book for the last 3A berth at once. Prove one wins. Pessimistic or optimistic locking?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading \"B1/8 is free\" and writing it. <code>book</code> does both inside the run's lock, in two passes: the first decides a place for every passenger and writes nothing, the second writes them all. The proof is two tests: fifty threads behind one latch want the last berth with \"berths only\", and exactly one booking comes back; fifty more hit an empty class of seven berths, two RAC halves and a waitlist of three, and exactly twelve get a place. That is pessimistic locking (take the lock, then read and write); optimistic locking lets everyone read and writes only if nothing changed meanwhile, and card 3 has both in SQL. The lock is created fair, so the thread that has waited longest goes next: Zepto's \"handle concurrent booking requests in a fair manner\". Intuit's \"the first 120 users fly free\" has the same shape: claim the counter inside the same lock, or <code>UPDATE promo SET used = used + 1 WHERE used &lt; 120</code>.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Book a group from one station to another in one class. Under the lock, in two passes: first decide a place\n     * for every traveller (a berth, else an RAC half, else the waitlist) while writing nothing; then write them all.\n     * If the group does not fit, it throws NoPlaces and nothing was held. The PNR comes back PENDING_PAYMENT.\n     */\n    Pnr book(String userId, String fromStation, String toStation, TravelClass cls, List&lt;Traveller&gt; group,\n             boolean berthsOnly, FareRule fare, BerthChooser chooser) {\n        int from = stop(fromStation), to = stop(toStation);\n        if (from &gt;= to) throw new IllegalArgumentException(&quot;a journey goes forward along the route: &quot; + fromStation + &quot; -&gt; &quot; + toStation);\n        if (group.isEmpty() || group.size() &gt; MAX_PASSENGERS)\n            throw new IllegalArgumentException(&quot;one to &quot; + MAX_PASSENGERS + &quot; passengers per PNR, not &quot; + group.size());\n        List&lt;PnrEvent&gt; events = new ArrayList&lt;&gt;();\n        lock.lock();                                                      // decide-then-take is ONE step: the race lives in the gap\n        try {\n            long now = clock.nowMs();                                     // read inside the lock, so callers agree about expiry\n            sweepLocked(now, events);                                     // lapsed holds go back first, and to the waitlist first\n            if (now &gt;= departsMs(from)) throw new IllegalStateException(&quot;train &quot; + train.number + &quot; has already left &quot; + fromStation);\n            ClassInventory inv = inventory(cls);\n            List&lt;Berth&gt; free = ClassInventory.free(inv.berths, from, to);            // pass one: look, do not touch\n            List&lt;Berth&gt; pick = chooser.choose(free, group);\n            int berths = checked(pick, free, group.size());                          // the rule chose which; the run checks how many\n            int missing = group.size() - berths;\n            if (berthsOnly &amp;&amp; missing &gt; 0)\n                throw new NoPlaces(&quot;only &quot; + berths + &quot; berths free &quot; + fromStation + &quot;-&quot; + toStation + &quot; for &quot; + group.size() + &quot; passengers&quot;);\n            List&lt;Berth&gt; halves = missing == 0 ? List.of() : ClassInventory.free(inv.racHalves, from, to);\n            int toRac = Math.min(missing, halves.size()), toWait = missing - toRac;\n            if (inv.waitlist.size() + toWait &gt; inv.waitlistCap) throw new NoPlaces(&quot;REGRET: the &quot; + cls + &quot; waitlist is full&quot;);\n            long amount = fare.farePaise(this, from, to, cls) * group.size();       // arithmetic on fields we already have\n            // nothing above this line wrote anything; below it, every step is a field write that cannot fail\n            Pnr p = new Pnr(String.valueOf(PNR_SEQ.incrementAndGet()), this, userId, cls, from, to, group, amount, now + holdMs);\n            int h = 0;\n            for (int i = 0; i &lt; group.size(); i++) {                                 // pass two: take them all\n                Passenger x = p.passengers.get(i);\n                if (pick.get(i) != null) seat(x, pick.get(i), PassengerStatus.CONFIRMED);\n                else if (h &lt; toRac) { seat(x, halves.get(h++), PassengerStatus.RAC); inv.rac.add(x); }\n                else { x.status = PassengerStatus.WAITLISTED; inv.waitlist.add(x); }\n            }\n            pnrs.put(p.id, p);\n            holds.addLast(p);                                             // every hold is ten minutes: the oldest is at the head\n            return p;\n        } finally { lock.unlock(); publish(events); }\n    }\n\n        // 2. fifty phones, the last berth, berths only: exactly one wins\n        BookingService s2 = service();\n        TrainRun r2 = freshRun(s2, 1, 3);\n        s2.book(r2.id, &quot;grp&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;g&quot;, 6), true);\n        int wins = Main.race(50, i -&gt; s2.book(r2.id, &quot;fan&quot; + i, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Fan&quot; + i, 30)), true));\n        check(wins == 1, &quot;fifty threads for the last berth: exactly one booking (&quot; + wins + &quot;)&quot;);\n        check(s2.availability(r2.id, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3).berths() == 0 &amp;&amp; violations(r2).isEmpty(), &quot;no berth left and nothing sold twice&quot;);\n\n        // 3. fifty phones on an empty class, one traveller each: 7 berths + 2 RAC halves + 3 waitlist = 12 places\n        BookingService s3 = service();\n        TrainRun r3 = freshRun(s3, 1, 3);\n        int placed = Main.race(50, i -&gt; s3.book(r3.id, &quot;fan&quot; + i, &quot;PUNE&quot;, &quot;GTL&quot;, TravelClass.AC3, List.of(t(&quot;Fan&quot; + i, 30)), false));\n        ClassInventory inv3 = r3.inventory(TravelClass.AC3);\n        check(placed == 12, &quot;fifty threads, empty 3A: exactly 12 get a place (&quot; + placed + &quot;)&quot;);\n        check(inv3.rac.size() == 2 &amp;&amp; inv3.waitlist.size() == 3, &quot;2 on RAC, 3 on the waitlist; the other 38 were told REGRET&quot;);\n        check(violations(r3).isEmpty(), &quot;every invariant holds after the race &quot; + violations(r3));\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>2 &middot; Search: trains from Pune to Bengaluru on 3 October, including the one that left Mumbai the night before.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Adding a train fills an index from station to (train, stop number). Search looks up the trains that stop at Pune, keeps those that stop at Bengaluru further along the route, and finds each one's run. The date is the day the passenger boards, so for a train that reaches his station on its second day the run is the one that started the day before: the start date is the boarding date minus that stop's day offset. Results come back earliest departure first, and no run's lock is taken, so browsing never slows booking. In SQL (Goldman Sachs asked for the query) it is the train_stop table joined to itself on the train number, with the boarding stop before the destination, joined to train_run on the computed start date.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /** Add a train to the timetable and index every stop, so search is a map lookup and not a scan of all trains. */\n    void addTrain(Train t) {\n        trains.put(t.number, t);\n        for (int i = 0; i &lt; t.stops.size(); i++)\n            atStation.computeIfAbsent(t.stops.get(i).station(), k -&gt; new ConcurrentHashMap&lt;&gt;()).put(t.number, i);\n    }\n\n    /**\n     * Trains from one station to another on a date, where the date is the day the passenger BOARDS. A train that\n     * reaches the boarding station on its second day belongs to the run that started the day before. Walks only the\n     * trains that stop at the boarding station; earliest departure first. Takes no run&#x27;s lock.\n     */\n    List&lt;Journey&gt; search(String from, String to, LocalDate date) {\n        List&lt;Journey&gt; out = new ArrayList&lt;&gt;();\n        Map&lt;String, Integer&gt; atTo = atStation.getOrDefault(to, Map.of());\n        for (Map.Entry&lt;String, Integer&gt; e : atStation.getOrDefault(from, Map.of()).entrySet()) {\n            Integer j = atTo.get(e.getKey());\n            int i = e.getValue();\n            if (j == null || j &lt;= i) continue;                              // does not stop there, or goes the other way\n            Train t = trains.get(e.getKey());\n            TrainRun r = runs.get(t.number + &quot;/&quot; + date.minusDays(t.stops.get(i).dayOffset()));\n            if (r != null) out.add(new Journey(r, from, to, r.at(i), r.at(j), t.km(i, j)));\n        }\n        out.sort(Comparator.comparing(Journey::departs));\n        return out;\n    }\n\n// the same search in SQL: the route joined to itself, then the run that started day_offset days earlier\n//   SELECT a.train_no, a.time_min AS departs, b.time_min AS arrives\n//   FROM train_stop a JOIN train_stop b ON b.train_no = a.train_no AND b.seq &gt; a.seq\n//   JOIN train_run r ON r.train_no = a.train_no AND r.origin_date = :date - a.day_offset\n//   WHERE a.station_code = :from AND b.station_code = :to\n//   ORDER BY a.day_offset DESC, a.time_min;\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>3 &middot; Persist it: which tables (payments included), the booking query, and pessimistic or optimistic locking.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The tables are the classes: station, train, train_stop, coach, train_run, run_berth, pnr, passenger, and payment with its idempotency key unique, the table a Flipkart candidate forgot. The one table the race touches is run_berth: one row per berth per run, with a 64-bit column of sold segments, the same bitmap as in memory. Optimistic: one conditional UPDATE sets the journey's bits only where none is set; one row changed means you got it, zero means someone else did, and a group is one transaction that rolls back if any row refuses. Pessimistic: lock the run's row with <code>SELECT ... FOR UPDATE</code>, then read, decide and write, which is the ReentrantLock one layer down. Either way a cancel and its promotions are written in the same transaction, and no database lock is held across the payment, because the hold is a status and an expiry time on the PNR row.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- the tables, and a booking as one conditional UPDATE per berth\n/**\n * The tables are the classes, payments included (the table candidates forget):\n *   station(code PK, name)\n *   train(number PK, name)\n *   train_stop(train_no, seq, station_code, time_min, day_offset, km)    PK(train_no, seq), INDEX(station_code)\n *   coach(train_no, coach_id, class, bays)\n *   train_run(id PK, train_no, origin_date)                               UNIQUE(train_no, origin_date)\n *   run_berth(run_id, berth_id, class, type, shared, sold_mask BIGINT)    PK(run_id, berth_id): bit i = segment i sold\n *   pnr(id PK, run_id, user_id, class, from_seq, to_seq, status, amount_paise, hold_expires_at)\n *   passenger(pnr_id, seq, name, age, status, berth_id NULL, queue_no NULL)   queue_no orders RAC and the waitlist\n *   payment(id PK, pnr_id, idempotency_key UNIQUE, amount_paise, status, gateway_ref)\n * Optimistic: sell segments [2,4) of one berth with one conditional UPDATE; 1 row changed = yours, 0 = taken:\n *   UPDATE run_berth SET sold_mask = sold_mask | :m WHERE run_id = ? AND berth_id = ? AND (sold_mask &amp; :m) = 0\n * A group is one transaction: every row changes, or ROLLBACK. Pessimistic, the same result with one lock per run,\n * exactly like the ReentrantLock:  SELECT id FROM train_run WHERE id = ? FOR UPDATE; read, decide, write; COMMIT.\n * A cancel and the promotion it causes are written in that same transaction.\n */\ninterface BerthStore {\n    /** Sell segments [from, to) on every named berth of a run: all of them, or none. */\n    boolean sellAll(String runId, List&lt;String&gt; berthIds, int from, int to);\n    /** Give segments [from, to) of one berth back. */\n    void release(String runId, String berthId, int from, int to);\n    /** The sold mask of one berth: bit i = segment i sold. */\n    long mask(String runId, String berthId);\n}\n\n/**\n * A stand-in for the run_berth table: one row per berth per run, a 64-bit mask each. Every write is a\n * compare-and-set on the row, which is what the conditional UPDATE does: the row changes only if none of our bits\n * are set. A group takes rows in id order and, at the first refusal, clears what it set: the ROLLBACK.\n */\nfinal class MaskStore implements BerthStore {\n    private final ConcurrentHashMap&lt;String, AtomicLong&gt; rows = new ConcurrentHashMap&lt;&gt;();\n    /** Insert one empty row. */\n    void add(String runId, String berthId) { rows.put(runId + &quot;#&quot; + berthId, new AtomicLong()); }\n    /** The bits of segments [from, to), for routes of up to 64 segments. */\n    static long bits(int from, int to) { return (to == 64 ? -1L : (1L &lt;&lt; to) - 1) ^ ((1L &lt;&lt; from) - 1); }\n    /** The group claim: every row&#x27;s bits set, or none (the rows it took are cleared again). */\n    public boolean sellAll(String runId, List&lt;String&gt; berthIds, int from, int to) {\n        long m = bits(from, to);\n        List&lt;AtomicLong&gt; taken = new ArrayList&lt;&gt;();\n        for (String id : new TreeSet&lt;&gt;(berthIds)) {                        // one fixed order for every caller\n            AtomicLong row = rows.get(runId + &quot;#&quot; + id);\n            boolean ok = false;\n            while (row != null) {                                         // loops only when OTHER bits changed meanwhile\n                long cur = row.get();\n                if ((cur &amp; m) != 0) break;                                // WHERE (sold_mask &amp; :m) = 0 failed: 0 rows\n                if (row.compareAndSet(cur, cur | m)) { ok = true; break; }\n            }\n            if (!ok) { for (AtomicLong r : taken) r.getAndUpdate(v -&gt; v &amp; ~m); return false; }   // ROLLBACK\n            taken.add(row);\n        }\n        return true;                                                      // COMMIT\n    }\n    /** UPDATE run_berth SET sold_mask = sold_mask &amp; ~:m: clears only this journey&#x27;s bits. */\n    public void release(String runId, String berthId, int from, int to) { long m = bits(from, to); rows.get(runId + &quot;#&quot; + berthId).getAndUpdate(v -&gt; v &amp; ~m); }\n    /** The row&#x27;s current mask. */\n    public long mask(String runId, String berthId) { return rows.get(runId + &quot;#&quot; + berthId).get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; A berth is booked from station 1 to 3 and again from 5 to 10. Who else can buy it, and what does a search from 3 to 4 show?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Anyone whose journey lies inside the gap, 3 to 5 or any part of it. A berth keeps one bit per segment, and a journey from stop a to stop b covers segments a up to b minus one: half-open, so a passenger getting off at 3 and another boarding at 3 share no segment. <code>isFree(a, b)</code> finds the first sold bit at or after a and says free if it is at b or later, one word for up to 64 segments. <code>take</code> refuses to set a bit that is already set, so even a buggy caller cannot sell a segment twice. A search from 3 to 4 counts this berth, because segment 3 is unsold. The test sells B1/1 for Mumbai to Pune and for Solapur to Bengaluru, finds it still counted from Pune to Solapur, sells that gap to a third passenger, and sends an overlapping journey to another berth.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * One berth on one run, or one half of a side-lower berth shared by two RAC passengers. It has no free-or-sold\n * status. It has a bitmap with one bit per segment of the route, set where that segment is sold. Every read and\n * write happens under its run&#x27;s lock.\n */\nfinal class Berth {\n    final String coach;\n    final int number;\n    final BerthType type;\n    final boolean shared;                          // true = an RAC half: two of these make one side-lower berth\n    private final BitSet sold = new BitSet();      // bit i set = segment i is sold\n\n    Berth(String coach, int number, BerthType type, boolean shared) {\n        this.coach = coach; this.number = number; this.type = type; this.shared = shared;\n    }\n    /** True when no segment in [from, to) is sold: the first sold bit at or after from is at or after to. */\n    boolean isFree(int from, int to) { int s = sold.nextSetBit(from); return s &lt; 0 || s &gt;= to; }\n    /** Sell segments [from, to). It refuses to overwrite: selling a segment twice is a bug, never a quiet overwrite. */\n    void take(int from, int to) {\n        if (!isFree(from, to)) throw new IllegalStateException(label() + &quot; is already sold on part of segments &quot; + from + &quot;-&quot; + to);\n        sold.set(from, to);\n    }\n    /** Give segments [from, to) back. Only the passenger who holds them calls this, so nobody else&#x27;s bits are touched. */\n    void release(int from, int to) { sold.clear(from, to); }\n    /** The sold segments as one 64-bit number (bit i = segment i), for routes of up to 64 segments: the database column. */\n    long mask() { long[] w = sold.toLongArray(); return w.length == 0 ? 0 : w[0]; }\n    /** How a ticket prints it: B1/23, or &quot;B1/7 shared&quot; for an RAC half. */\n    String label() { return coach + &quot;/&quot; + number + (shared ? &quot; shared&quot; : &quot;&quot;); }\n}\n\n        // 1. a berth is sold per segment: three passengers share B1/1 end to end, and an overlap goes elsewhere\n        BookingService s1 = service();\n        TrainRun r1 = freshRun(s1, 1, 3);\n        Pnr x1 = s1.book(r1.id, &quot;x&quot;, &quot;CSMT&quot;, &quot;PUNE&quot;, TravelClass.AC3, List.of(t(&quot;X&quot;, 30)), true);     // segment 0\n        Pnr y1 = s1.book(r1.id, &quot;y&quot;, &quot;SUR&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Y&quot;, 30)), true);       // segments 2-3\n        check(place(x1).equals(&quot;B1/1&quot;) &amp;&amp; place(y1).equals(&quot;B1/1&quot;), &quot;CSMT-PUNE and SUR-SBC are both sold B1/1: &quot; + place(x1) + &quot;, &quot; + place(y1));\n        check(s1.availability(r1.id, &quot;PUNE&quot;, &quot;SUR&quot;, TravelClass.AC3).berths() == 7, &quot;a search for PUNE-SUR still counts all seven berths, B1/1 included&quot;);\n        Pnr z1 = s1.book(r1.id, &quot;z&quot;, &quot;PUNE&quot;, &quot;SUR&quot;, TravelClass.AC3, List.of(t(&quot;Z&quot;, 30)), true);      // segment 1: the gap\n        check(place(z1).equals(&quot;B1/1&quot;), &quot;PUNE-SUR fills the gap on B1/1: three passengers, one berth, touching at PUNE and SUR&quot;);\n        Pnr w1 = s1.book(r1.id, &quot;w&quot;, &quot;CSMT&quot;, &quot;SUR&quot;, TravelClass.AC3, List.of(t(&quot;W&quot;, 30)), true);\n        check(!place(w1).equals(&quot;B1/1&quot;), &quot;CSMT-SUR overlaps them and is sold another berth: &quot; + place(w1));\n        check(violations(r1).isEmpty(), &quot;no segment of any berth is sold twice &quot; + violations(r1));\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>5 &middot; Now it is flights (Cleartrip&#x27;s machine-coding round): sectors, fare types each with its own list of seats, and users pay from a wallet.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A flight flies one sector, so there are no segments: a seat is simply sold or not, and the hard part moves to fare types and money. Each fare type has a price and its own set of seats. A booking takes the flight's lock, checks every seat is free in that one fare type, debits the whole price from the wallet, and only then removes the seats; a taken seat or a short wallet refuses the booking and moves nothing. Cancel puts the seats back and credits the wallet, once. Search looks up the flights on that sector and date and returns each fare type with at least the asked-for number of seats, earliest first. Money is integer paise, although the original prompt says \"a decimal number\".</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** One fare type on one flight (F1, SAVER): a price per seat and its own list of seats still for sale. */\nfinal class FlightFare {\n    final String type;\n    final long pricePaise;\n    final TreeSet&lt;String&gt; seats = new TreeSet&lt;&gt;();\n    FlightFare(String type, long pricePaise, List&lt;String&gt; seats) { this.type = type; this.pricePaise = pricePaise; this.seats.addAll(seats); }\n}\n\n/**\n * One flight on one date: a single sector, so a seat is simply sold or not, with no segments. Each fare type sells\n * from its own seat list. One lock per flight: on this side, the flight is the aggregate root.\n */\nfinal class Flight {\n    final String number, airline, from, to;\n    final int date, departMin;\n    final Map&lt;String, FlightFare&gt; fares = new LinkedHashMap&lt;&gt;();\n    final ReentrantLock lock = new ReentrantLock();\n    Flight(String number, String airline, String from, String to, int date, int departMin) {\n        this.number = number; this.airline = airline; this.from = from; this.to = to; this.date = date; this.departMin = departMin;\n    }\n    /** Add a fare type and the seats the airline gave it. Setup only. */\n    Flight fare(String type, long pricePaise, String... seats) { fares.put(type, new FlightFare(type, pricePaise, List.of(seats))); return this; }\n    /** Number and date, the key bookings use and the order locks are taken in: &quot;111/2&quot;. */\n    String key() { return number + &quot;/&quot; + date; }\n}\n\n    /** SEARCHFLIGHT from to date pax: every flight and fare type with at least pax seats, earliest first, then cheapest. */\n    List&lt;Offer&gt; search(String from, String to, int date, int pax) {\n        List&lt;Offer&gt; out = new ArrayList&lt;&gt;();\n        for (Flight f : bySector.getOrDefault(from + &quot;-&quot; + to + &quot;-&quot; + date, List.of())) {\n            f.lock.lock();                                                // one flight at a time: never two locks here\n            try {\n                for (FlightFare fare : f.fares.values())\n                    if (fare.seats.size() &gt;= pax) out.add(new Offer(f, fare.type, fare.pricePaise, List.copyOf(fare.seats)));\n            } finally { f.lock.unlock(); }\n        }\n        out.sort(Comparator.comparingInt((Offer o) -&gt; o.flight().departMin).thenComparingLong(Offer::pricePaise));\n        return out;\n    }\n\n    /**\n     * BOOK: every seat must be free in that one fare type and the wallet must cover them all, or nothing happens\n     * and the message says why. Returns the booking id.\n     */\n    String book(String userId, String flightNo, int date, String fareType, List&lt;String&gt; seats) {\n        FlyUser u = user(userId);\n        Flight f = flight(flightNo, date);\n        if (seats.isEmpty() || new HashSet&lt;&gt;(seats).size() != seats.size()) throw new IllegalArgumentException(&quot;name each seat once&quot;);\n        f.lock.lock();\n        try {\n            FlightFare fare = fareOf(f, fareType);\n            for (String s : seats) if (!fare.seats.contains(s)) throw new IllegalStateException(&quot;seat &quot; + s + &quot; is not available in &quot; + fareType + &quot; on &quot; + f.key());\n            long cost = fare.pricePaise * seats.size();\n            if (!u.debit(cost)) throw new IllegalStateException(&quot;insufficient funds: &quot; + Main.rupees(cost) + &quot; needed, &quot; + Main.rupees(u.funds()) + &quot; in the wallet&quot;);\n            fare.seats.removeAll(seats);                                  // money and seats move inside the same lock\n            FlightBooking b = new FlightBooking(&quot;b&quot; + seq.incrementAndGet(), userId, f, fareType, List.copyOf(seats), cost);\n            bookings.put(b.id, b);\n            byUser.computeIfAbsent(userId, k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(b);\n            return b.id;\n        } finally { f.lock.unlock(); }\n    }\n\n    /** CANCEL: the seats go back to their fare type and the money to the wallet, once. */\n    void cancel(String userId, String bookingId) {\n        FlightBooking b = booking(userId, bookingId);\n        while (true) {\n            Flight f = b.flight;                                          // a change may move it: lock, then re-check\n            f.lock.lock();\n            try {\n                if (b.flight != f) continue;                              // it moved while we waited: go again\n                if (b.cancelled) throw new IllegalStateException(&quot;booking &quot; + bookingId + &quot; is already cancelled&quot;);\n                fareOf(f, b.fareType).seats.addAll(b.seats);\n                user(userId).credit(b.paidPaise);\n                b.cancelled = true;\n                return;\n            } finally { f.lock.unlock(); }\n        }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; The class is full. Put people on RAC and the waitlist, and move them up when someone cancels.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A class keeps three tiers: berths, RAC halves (each side-lower berth kept for RAC carries two passengers, each half with its own segment bits), and a capped waitlist. A booking gives each passenger the best tier that fits his journey. A cancel gives the segments back and then, still inside the lock, walks the RAC queue earliest first: the first passenger whose whole journey now fits a berth is confirmed on it, and his half goes back. Then it walks the waitlist, giving each a berth if one fits, else an RAC half. A waiter whose journey does not fit is skipped and keeps his place, so a Solapur passenger can be confirmed ahead of a Mumbai one who needs more of the berth than came back. Each move is an event, told after the unlock; the second test races a cancel against a newcomer a hundred times, and the waiter gets the berth every time.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Hand freed places to the people already waiting, earliest first, before anybody new can ask. RAC passengers\n     * try for a berth; then waitlisted ones try for a berth, else an RAC half. A waiter whose journey does not fit\n     * is skipped and keeps his place. One pass is enough: the RAC half gives back only RAC halves, and the\n     * waitlist half runs after it and only takes places. Lock held.\n     */\n    private void promoteLocked(ClassInventory inv, List&lt;PnrEvent&gt; events) {\n        int n = 0;\n        for (Passenger x : new ArrayList&lt;&gt;(inv.rac)) {                    // RAC first, in RAC order\n            n++;\n            Berth b = ClassInventory.firstFree(inv.berths, x.pnr.from, x.pnr.to);\n            if (b == null) continue;                                      // no berth fits his journey: he stays RAC\n            x.place.release(x.pnr.from, x.pnr.to);                        // his shared half goes back\n            inv.rac.remove(x);\n            seat(x, b, PassengerStatus.CONFIRMED);\n            events.add(new PnrEvent(x.pnr.id, x.who.name(), &quot;RAC &quot; + n + &quot; -&gt; CNF &quot; + b.label()));\n        }\n        int w = 0;\n        for (Passenger x : new ArrayList&lt;&gt;(inv.waitlist)) {               // then the waitlist, in order\n            w++;\n            Berth b = ClassInventory.firstFree(inv.berths, x.pnr.from, x.pnr.to);\n            if (b != null) {\n                inv.waitlist.remove(x);\n                seat(x, b, PassengerStatus.CONFIRMED);\n                events.add(new PnrEvent(x.pnr.id, x.who.name(), &quot;WL &quot; + w + &quot; -&gt; CNF &quot; + b.label()));\n                continue;\n            }\n            Berth half = ClassInventory.firstFree(inv.racHalves, x.pnr.from, x.pnr.to);\n            if (half == null) continue;                                   // nothing fits: he keeps his place\n            inv.waitlist.remove(x);\n            seat(x, half, PassengerStatus.RAC);\n            inv.rac.add(x);\n            events.add(new PnrEvent(x.pnr.id, x.who.name(), &quot;WL &quot; + w + &quot; -&gt; RAC &quot; + inv.rac.size() + &quot; &quot; + half.label()));\n        }\n    }\n\n        // 5. a waiter whose journey does not fit is skipped, and keeps his place\n        BookingService s5 = service();\n        TrainRun r5 = freshRun(s5, 0, 3);                                          // no RAC berth: 8 berths, a waitlist of 3\n        Pnr shortOne = s5.book(r5.id, &quot;s&quot;, &quot;SUR&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;S&quot;, 30)), true);   // B1/1 segments 2-3\n        s5.book(r5.id, &quot;f&quot;, &quot;CSMT&quot;, &quot;SUR&quot;, TravelClass.AC3, List.of(t(&quot;F&quot;, 30)), true);                  // B1/1 segments 0-1\n        s5.book(r5.id, &quot;g&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;g&quot;, 6), true);                       // B1/2 .. B1/7\n        s5.book(r5.id, &quot;h&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;H&quot;, 30)), true);                  // B1/8: full everywhere\n        Pnr longWait = s5.book(r5.id, &quot;l&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Long&quot;, 30)), false);\n        Pnr shortWait = s5.book(r5.id, &quot;m&quot;, &quot;SUR&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;Short&quot;, 30)), false);\n        s5.cancel(shortOne.id, pay);                                               // frees B1/1 on segments 2-3 only\n        check(s5.status(longWait.id).equals(List.of(&quot;Long WL 1&quot;)), &quot;the first waiter needs CSMT-SBC, which B1/1 cannot give: he stays WL 1&quot;);\n        check(s5.status(shortWait.id).equals(List.of(&quot;Short CNF B1/1 LOWER&quot;)), &quot;the second waiter fits SUR-SBC and is confirmed on B1/1&quot;);\n        check(violations(r5).isEmpty(), &quot;every invariant holds &quot; + violations(r5));\n\n        // 6. a cancel and a newcomer at the same instant, a hundred times: the waiter always gets the berth\n        int fair = 0;\n        for (int round = 0; round &lt; 100; round++) {\n            BookingService s6 = service();\n            TrainRun r6 = freshRun(s6, 0, 3);\n            Pnr holder = s6.book(r6.id, &quot;h&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;H&quot;, 30)), true);   // B1/1\n            s6.book(r6.id, &quot;g&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;g&quot;, 6), true);\n            s6.book(r6.id, &quot;g7&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;G7&quot;, 30)), true);\n            Pnr waiter = s6.book(r6.id, &quot;w&quot;, &quot;PUNE&quot;, &quot;SUR&quot;, TravelClass.AC3, List.of(t(&quot;W&quot;, 30)), false);\n            CyclicBarrier both = new CyclicBarrier(2);\n            ExecutorService two = Executors.newFixedThreadPool(2);\n            Future&lt;Long&gt; a = two.submit(() -&gt; { both.await(); return s6.cancel(holder.id, pay); });\n            Future&lt;Pnr&gt; b = two.submit(() -&gt; { both.await(); return s6.book(r6.id, &quot;n&quot;, &quot;PUNE&quot;, &quot;SUR&quot;, TravelClass.AC3, List.of(t(&quot;N&quot;, 30)), false); });\n            a.get(5, TimeUnit.SECONDS);\n            Pnr newcomer = b.get(5, TimeUnit.SECONDS);\n            two.shutdown();\n            if (place(waiter).equals(&quot;B1/1&quot;) &amp;&amp; newcomer.passengers.get(0).status == PassengerStatus.WAITLISTED &amp;&amp; violations(r6).isEmpty()) fair++;\n        }\n        check(fair == 100, &quot;a cancel racing a newcomer, 100 rounds: the waiter got the freed berth every time (&quot; + fair + &quot;)&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>7 &middot; A confirmed passenger cancels 30 hours before departure. How much comes back, and who gets the berth?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two decisions, made in one locked step in this order. The refund rule runs first, while every passenger's status is still what it was. The railway's rule, with illustrative amounts, charges a confirmed passenger a flat fee until 48 hours before departure, a quarter of his fare until 12 hours, half until 4, and everything after; an RAC or waitlisted passenger loses only a small fixed fee (the railway calls it clerkage). Thirty hours before, the Rs 1,215.20 ticket loses a quarter and Rs 911.40 comes back. Then the segments go back and the waiters move up in the same step, and the refund goes out after the unlock. A cancelled hold that was never paid refunds nothing and calls no gateway.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Give a PNR back: a paid ticket, or a hold the user abandons. Its places go back and the people waiting move up\n     * in the SAME locked step, so no new booking can take a freed berth first. Returns the paise to refund: the\n     * rule&#x27;s amount for a paid ticket, 0 for a hold that was never paid.\n     */\n    long cancel(Pnr p, RefundRule rule) {\n        List&lt;PnrEvent&gt; events = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            long now = clock.nowMs();\n            sweepLocked(now, events);\n            if (p.status == PnrStatus.CANCELLED || p.status == PnrStatus.EXPIRED)\n                throw new IllegalStateException(&quot;PNR &quot; + p.id + &quot; is already &quot; + p.status);\n            long back = p.status == PnrStatus.BOOKED ? Math.max(0, Math.min(p.amountPaise, rule.refundPaise(p, now))) : 0;\n            releaseLocked(p);                                             // decided above from the statuses as they were\n            p.status = PnrStatus.CANCELLED;\n            events.add(new PnrEvent(p.id, &quot;&quot;, &quot;CANCELLED, refund &quot; + Main.rupees(back)));\n            promoteLocked(inventory(p.cls), events);                      // the freed places go to the waiters, now\n            return back;\n        } finally { lock.unlock(); publish(events); }\n    }\n\n// ---- ext: the railway&#x27;s refund rule -- how much comes back depends on the hours left and the status\n/**\n * The shape of the Indian Railways rule, with illustrative amounts. A confirmed passenger loses a flat charge for\n * his class until 48 hours before departure, a quarter of his fare (at least the flat charge) until 12 hours, half\n * until 4 hours, and everything after that. An RAC or waitlisted passenger loses only a small clerkage fee. It\n * runs inside the run&#x27;s lock, before anybody moves up, so it sees each passenger&#x27;s status exactly as it was.\n */\nfinal class RailwayRefund implements RefundRule {\n    private static final Map&lt;TravelClass, Long&gt; FLAT = new EnumMap&lt;&gt;(Map.of(\n        TravelClass.SLEEPER, 12_000L, TravelClass.AC3, 18_000L, TravelClass.AC2, 20_000L));\n    private static final long CLERKAGE = 6_000L;\n    /** The sum over passengers, in integer paise, never below zero. */\n    public long refundPaise(Pnr p, long nowMs) {\n        long each = p.amountPaise / p.passengers.size();                  // the amount is fare x passengers exactly\n        long hoursLeft = (p.run.departsMs(p.from) - nowMs) / 3_600_000L;\n        long flat = FLAT.get(p.cls), back = 0;\n        for (Passenger x : p.passengers) {\n            long charge;\n            if (x.status != PassengerStatus.CONFIRMED) charge = CLERKAGE;           // RAC or waitlisted\n            else if (hoursLeft &gt;= 48) charge = flat;\n            else if (hoursLeft &gt;= 12) charge = Math.max(flat, each / 4);\n            else if (hoursLeft &gt;= 4) charge = Math.max(flat, each / 2);\n            else charge = each;                                                     // chart prepared: nothing back\n            back += Math.max(0, each - charge);\n        }\n        return back;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>8 &middot; The search page shows availability for 40 trains, 10,000 times a second. Keep it fast, and keep it off the booking lock.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It is already fast: a count walks the class's berths once, one word test each, about half a microsecond for 256 berths, so ten thousand counts a second keep a run's lock about half a per cent busy. When that stops being enough, the next rung is a copy. Take every berth's 64-bit mask under the lock once, and turn the bitmaps sideways: for each segment, one bit per berth, set where the berth is free on that segment. The berths free for a journey are then the AND of its segments' rows, and the count is the number of set bits: four segments times four words, instead of 256 tests, and readers never touch the lock. The test builds it after the random workload and it agrees with the walk on all ten journeys.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /** What is left for one journey in one class. It releases lapsed holds first, so the numbers are never stale. */\n    Availability availability(String fromStation, String toStation, TravelClass cls) {\n        int from = stop(fromStation), to = stop(toStation);\n        if (from &gt;= to) throw new IllegalArgumentException(&quot;a journey goes forward along the route: &quot; + fromStation + &quot; -&gt; &quot; + toStation);\n        List&lt;PnrEvent&gt; events = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            sweepLocked(clock.nowMs(), events);\n            ClassInventory inv = inventory(cls);\n            int berths = 0, halves = 0;\n            for (Berth b : inv.berths) if (b.isFree(from, to)) berths++;             // one word test per berth: no list built\n            for (Berth b : inv.racHalves) if (b.isFree(from, to)) halves++;\n            return new Availability(berths, halves, inv.rac.size(), inv.waitlist.size(), inv.waitlistCap);\n        } finally { lock.unlock(); publish(events); }\n    }\n\n// ---- ext: availability without the walk -- the bitmaps turned sideways\n/**\n * For each segment, one bit per berth, set where that berth is FREE on that segment. Free for [from, to) is the AND\n * of rows from .. to-1, then a count of the bits: (to - from) x berths / 64 word operations instead of one test per\n * berth. It is built from a copy of the masks taken under the run&#x27;s lock, so a reader never touches the lock.\n */\nfinal class SegmentIndex {\n    private final BitSet[] freeOn;                                        // freeOn[s]: bit i = berth i is free on segment s\n    SegmentIndex(long[] soldMasks, int segments) {\n        freeOn = new BitSet[segments];\n        for (int s = 0; s &lt; segments; s++) {\n            freeOn[s] = new BitSet(soldMasks.length);\n            for (int i = 0; i &lt; soldMasks.length; i++) if ((soldMasks[i] &amp; (1L &lt;&lt; s)) == 0) freeOn[s].set(i);\n        }\n    }\n    /** How many berths are free on every segment of [from, to). */\n    int freeFor(int from, int to) {\n        BitSet acc = (BitSet) freeOn[from].clone();\n        for (int s = from + 1; s &lt; to; s++) acc.and(freeOn[s]);\n        return acc.cardinality();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; A family of four: all together or not at all, in one coach, with the grandparents on lower berths.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>All or nothing is in the run: it decides a place for every traveller before writing anything, and if the group does not fit (berths, RAC and the waitlist's room together) it throws, and not one place was taken. \"Berths only\" is a flag: fewer free berths than travellers and the booking is refused whole, like IRCTC's option to book only if confirmed berths are allotted. Which berths is the chooser's job, so the family rule is one new class. It uses one coach when a coach has room for everyone, gives travellers of sixty and over the lower berths first, then each traveller's own preference, then anything; when there are fewer berths than travellers, seniors get them first. The run still checks its answer: one entry per traveller, every berth from the free list, none twice, and no berth left empty while someone would wait.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a family together -- one coach if it fits, lower berths for the seniors\n/**\n * Same coach when one coach has room for the whole group; seniors (60 and over) get lower berths first; then\n * each traveller&#x27;s own preference if it is free; then whatever is left, in order. When there are fewer berths\n * than travellers, seniors get them first. Pure: it reads the free list and writes nothing.\n */\nfinal class FamilyChooser implements BerthChooser {\n    /** One entry per traveller, in the group&#x27;s order; exactly min(group, free) of them are berths. */\n    public List&lt;Berth&gt; choose(List&lt;Berth&gt; free, List&lt;Traveller&gt; group) {\n        Map&lt;String, List&lt;Berth&gt;&gt; byCoach = new LinkedHashMap&lt;&gt;();\n        for (Berth b : free) byCoach.computeIfAbsent(b.coach, k -&gt; new ArrayList&lt;&gt;()).add(b);\n        List&lt;Berth&gt; pool = new ArrayList&lt;&gt;(free);                          // no coach fits everyone: use them all\n        for (List&lt;Berth&gt; coach : byCoach.values()) if (coach.size() &gt;= group.size()) { pool = new ArrayList&lt;&gt;(coach); break; }\n        Integer[] order = new Integer[group.size()];\n        for (int i = 0; i &lt; order.length; i++) order[i] = i;\n        Arrays.sort(order, Comparator.comparingInt(i -&gt; rank(group.get(i))));   // stable: seniors, then preferences, then the rest\n        Berth[] out = new Berth[group.size()];\n        int give = Math.min(group.size(), free.size());\n        for (int k = 0; k &lt; give; k++) {\n            Traveller t = group.get(order[k]);\n            Berth b = takeFirst(pool, t.age() &gt;= 60 ? BerthType.LOWER : t.preference());\n            if (b == null &amp;&amp; t.age() &gt;= 60) b = takeFirst(pool, BerthType.SIDE_LOWER);   // a side lower is still a lower\n            if (b == null) b = pool.remove(0);\n            out[order[k]] = b;\n        }\n        return Arrays.asList(out);\n    }\n    /** 0 = senior, 1 = has a preference, 2 = anything will do. */\n    private static int rank(Traveller t) { return t.age() &gt;= 60 ? 0 : t.preference() != null ? 1 : 2; }\n    /** Remove and return the first berth of a type, or null (a null type matches nothing). */\n    private static Berth takeFirst(List&lt;Berth&gt; pool, BerthType type) {\n        for (Iterator&lt;Berth&gt; it = pool.iterator(); it.hasNext(); ) { Berth b = it.next(); if (b.type == type) { it.remove(); return b; } }\n        return null;\n    }\n}\n\n        // 7. a group is all or nothing\n        BookingService s7 = service();\n        TrainRun r7 = freshRun(s7, 1, 3);\n        s7.book(r7.id, &quot;grp&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;g&quot;, 6), true);           // one berth left, 2 RAC halves, 3 waitlist\n        Availability before7 = s7.availability(r7.id, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3);\n        try { s7.book(r7.id, &quot;pair&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;p&quot;, 2), true); check(false, &quot;two travellers, berths only, one berth: must be refused&quot;); }\n        catch (NoPlaces e) { check(true, &quot;two travellers, berths only, one berth free: refused (&quot; + e.getMessage() + &quot;)&quot;); }\n        check(s7.availability(r7.id, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3).equals(before7), &quot;the refusal held nothing: &quot; + before7.label());\n        s7.book(r7.id, &quot;one&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, List.of(t(&quot;One&quot;, 30)), false);  // the last berth\n        try { s7.book(r7.id, &quot;six&quot;, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3, people(&quot;s&quot;, 6), false); check(false, &quot;six travellers for five places: must be refused&quot;); }\n        catch (NoPlaces e) { check(true, &quot;six travellers when 2 RAC halves and 3 waitlist places are left: refused whole (&quot; + e.getMessage() + &quot;)&quot;); }\n        Availability mid7 = s7.availability(r7.id, &quot;CSMT&quot;, &quot;SBC&quot;, TravelClass.AC3);\n        check(mid7.racPlaces() == 2 &amp;&amp; mid7.waitlisted() == 0, &quot;not one of the six was put on RAC or the waitlist&quot;);\n        Pnr three = s7.book(r7.id, &quot;three&quot;, &qu

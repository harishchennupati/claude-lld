reateTable(&quot;users&quot;, &quot;id&quot;,\n            Column.intCol(&quot;id&quot;, true), Column.text(&quot;name&quot;, true), Column.text(&quot;city&quot;, true), Column.intCol(&quot;age&quot;, false));\n        db.createTable(&quot;orders&quot;, &quot;id&quot;,\n            Column.intCol(&quot;id&quot;, true), Column.intCol(&quot;user_id&quot;, true), Column.intCol(&quot;total&quot;, true), Column.intCol(&quot;placed_at&quot;, true));\n        db.table(&quot;users&quot;).createIndex(&quot;city&quot;);\n        db.table(&quot;users&quot;).createIndex(&quot;age&quot;);\n        db.table(&quot;orders&quot;).createIndex(&quot;user_id&quot;);\n        db.table(&quot;orders&quot;).createIndex(&quot;placed_at&quot;);\n        db.table(&quot;users&quot;).addRule(new CheckRule(Where.between(&quot;age&quot;, 0, 150), &quot;age between 0 and 150&quot;));\n        return db;\n    }\n\n    public static void main(String[] args) throws Exception {\n        Database db = sample();\n        AuditTrigger audit = new AuditTrigger();\n        CityCount byCity = new CityCount(&quot;users&quot;, &quot;city&quot;);\n        db.addTrigger(audit);\n        db.addTrigger(byCity);\n        db.addTrigger(batch -&gt; { throw new RuntimeException(&quot;this trigger is broken on purpose&quot;); });\n        Schema us = db.table(&quot;users&quot;).schema();\n\n        System.out.println(&quot;-- inserts (autocommit) ------------------------------------------&quot;);\n        db.insert(&quot;users&quot;, 1, &quot;Asha&quot;, &quot;Pune&quot;, 31);\n        db.insert(&quot;users&quot;, 2, &quot;Bela&quot;, &quot;Pune&quot;, 42);\n        db.insert(&quot;users&quot;, 3, &quot;Chandra&quot;, &quot;Kochi&quot;, 27);\n        db.insert(&quot;users&quot;, 4, &quot;Devi&quot;, &quot;Kochi&quot;, 55);\n        db.insert(&quot;users&quot;, 5, &quot;Ekta&quot;, &quot;Indore&quot;, 36);\n        for (int i = 1; i &lt;= 6; i++) db.insert(&quot;orders&quot;, i, (i % 5) + 1, 100L * i, 20260900L + i);\n        System.out.println(&quot;users: &quot; + db.table(&quot;users&quot;).rowCount() + &quot; rows, orders: &quot; + db.table(&quot;orders&quot;).rowCount() + &quot; rows&quot;);\n        System.out.println(&quot;a broken trigger threw on every commit; commits: fine, failures counted = &quot; + db.triggerFailures());\n\n        System.out.println(&quot;\\n-- the three access paths ----------------------------------------&quot;);\n        System.out.println(&quot;by primary key : &quot; + db.explain(&quot;users&quot;, Where.eq(&quot;id&quot;, 3)));\n        System.out.println(&quot;                 &quot; + db.select(&quot;users&quot;, Where.eq(&quot;id&quot;, 3)).get(0).show(us));\n        System.out.println(&quot;by index       : &quot; + db.explain(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Pune&quot;)));\n        for (Row r : db.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Pune&quot;))) System.out.println(&quot;                 &quot; + r.show(us));\n        System.out.println(&quot;by range       : &quot; + db.explain(&quot;users&quot;, Where.between(&quot;age&quot;, 30, 45)));\n        for (Row r : db.select(&quot;users&quot;, Where.between(&quot;age&quot;, 30, 45))) System.out.println(&quot;                 &quot; + r.show(us));\n        System.out.println(&quot;no index       : &quot; + db.explain(&quot;users&quot;, Where.eq(&quot;name&quot;, &quot;Devi&quot;)));\n        System.out.println(&quot;materialised   : users in Pune = &quot; + byCity.count(&quot;Pune&quot;) + &quot;, in Kochi = &quot; + byCity.count(&quot;Kochi&quot;) + &quot;  (no scan)&quot;);\n\n        System.out.println(&quot;\\n-- an update moves the row in the index --------------------------&quot;);\n        db.update(&quot;users&quot;, Where.eq(&quot;id&quot;, 1), Map.of(&quot;city&quot;, &quot;Kochi&quot;, &quot;age&quot;, 32));\n        System.out.println(&quot;Pune now : &quot; + db.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Pune&quot;)).size() + &quot; row(s)&quot;);\n        System.out.println(&quot;Kochi now: &quot; + db.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Kochi&quot;)).size() + &quot; row(s)&quot;);\n        System.out.println(&quot;counts   : &quot; + byCity.all());\n\n        System.out.println(&quot;\\n-- what a rejected write leaves behind ---------------------------&quot;);\n        int before = db.table(&quot;users&quot;).rowCount();\n        for (Object[] bad : new Object[][] {\n                { 2L, &quot;Twin&quot;, &quot;Pune&quot;, 30L },                      // duplicate primary key\n                { 9L, &quot;NoCity&quot;, null, 30L },                      // NOT NULL\n                { 10L, &quot;Wrong&quot;, &quot;Pune&quot;, &quot;thirty&quot; },               // wrong type\n                { 11L, &quot;Old&quot;, &quot;Pune&quot;, 900L } }) {                 // the CHECK\n            try { db.insert(&quot;users&quot;, bad); System.out.println(&quot;ACCEPTED (bug!)&quot;); }\n            catch (ConstraintViolation e) { System.out.println(&quot;refused: &quot; + e.getMessage()); }\n        }\n        System.out.println(&quot;rows before &quot; + before + &quot;, rows after &quot; + db.table(&quot;users&quot;).rowCount() + &quot; -- nothing was half written&quot;);\n\n        System.out.println(&quot;\\n-- a transaction, a savepoint and a rollback ---------------------&quot;);\n        Txn t = db.begin();\n        t.insert(&quot;users&quot;, 6, &quot;Farid&quot;, &quot;Surat&quot;, 45);\n        int sp = t.savepoint();\n        t.delete(&quot;users&quot;, Where.eq(&quot;id&quot;, 3));\n        t.update(&quot;users&quot;, Where.eq(&quot;id&quot;, 4), Map.of(&quot;city&quot;, &quot;Surat&quot;));\n        System.out.println(&quot;inside the transaction : &quot; + t.select(&quot;users&quot;, Where.all()).size() + &quot; rows, Kochi = &quot;\n            + t.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Kochi&quot;)).size());\n        t.rollbackTo(sp);\n        System.out.println(&quot;after ROLLBACK TO      : &quot; + t.select(&quot;users&quot;, Where.all()).size() + &quot; rows, Kochi = &quot;\n            + t.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Kochi&quot;)).size());\n        t.rollback();\n        System.out.println(&quot;after ROLLBACK         : &quot; + db.table(&quot;users&quot;).rowCount() + &quot; rows, Surat = &quot;\n            + db.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Surat&quot;)).size() + &quot;, counts = &quot; + byCity.all());\n        System.out.println(&quot;the audit trigger never saw the rolled-back rows: &quot; + audit.lines().size() + &quot; lines for &quot;\n            + (db.table(&quot;users&quot;).rowCount() + db.table(&quot;orders&quot;).rowCount() + 1) + &quot; committed changes&quot;);\n\n        System.out.println(&quot;\\n-- the race: 50 threads, one primary key -------------------------&quot;);\n        race();\n\n        System.out.println(&quot;\\n-- the same 50 read-modify-writes, with the lock and without -----&quot;);\n        lostUpdate(new StrictTableLocking(), &quot;strict table locking&quot;);\n        lostUpdate(new NoLocking(), &quot;no locking at all&quot;);\n\n        System.out.println(&quot;\\n-- deadlock: two transactions, two tables, opposite order --------&quot;);\n        deadlock();\n    }\n\n    /**\n     * Fifty threads insert the SAME primary key at the same instant, and fifty more insert fifty distinct keys\n     * into a second table. Exactly one winner on the contested key, exact counts everywhere, indexes in step.\n     */\n    static void race() throws Exception {\n        Database db = sample();\n        db.configure(new StrictTableLocking(), 2000);\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;Boolean&gt;&gt; contested = new ArrayList&lt;&gt;(), distinct = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final int n = i;\n            contested.add(pool.submit(() -&gt; { go.await(); return tryInsert(db, &quot;users&quot;, 7L, &quot;racer&quot; + n, &quot;Pune&quot;, 30L); }));\n            distinct.add(pool.submit(() -&gt; { go.await(); return tryInsert(db, &quot;orders&quot;, 1000L + n, 1L, 50L, 20260901L); }));\n        }\n        go.countDown();\n        int wonPk = 0, wonDistinct = 0;\n        for (Future&lt;Boolean&gt; f : contested) if (f.get()) wonPk++;\n        for (Future&lt;Boolean&gt; f : distinct) if (f.get()) wonDistinct++;\n        pool.shutdown();\n        int rows = db.table(&quot;users&quot;).select(Where.eq(&quot;id&quot;, 7L)).size();\n        int indexed = db.table(&quot;orders&quot;).index(&quot;user_id&quot;).eq(1L).size();\n        System.out.println(&quot;the same key  : told \\&quot;inserted\\&quot; &quot; + wonPk + &quot; / 50, rows with that key: &quot; + rows);\n        System.out.println(&quot;distinct keys : &quot; + wonDistinct + &quot; / 50 accepted, &quot; + db.table(&quot;orders&quot;).rowCount()\n            + &quot; rows, &quot; + indexed + &quot; primary keys in the user_id index&quot;);\n        System.out.println(wonPk == 1 &amp;&amp; rows == 1 &amp;&amp; wonDistinct == 50 &amp;&amp; indexed == 50\n            ? &quot;invariant held: one winner, exact counts, every index in step with the rows&quot;\n            : &quot;INVARIANT BROKEN&quot;);\n    }\n\n    /**\n     * Fifty read-modify-writes of one row -- read the counter, add one, write it back -- run with the lock policy\n     * handed in. Identical code both times: nothing here knows or asks which policy it got.\n     */\n    static void lostUpdate(LockPolicy policy, String label) throws Exception {\n        Database db = new Database();\n        db.configure(policy, 2000);\n        db.createTable(&quot;counters&quot;, &quot;id&quot;, Column.intCol(&quot;id&quot;, true), Column.intCol(&quot;hits&quot;, true));\n        db.insert(&quot;counters&quot;, 1, 0);\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; all = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) all.add(pool.submit(() -&gt; {\n            go.await();\n            Txn t = db.begin();\n            try {\n                long hits = (Long) t.select(&quot;counters&quot;, Where.eq(&quot;id&quot;, 1)).get(0).get(db.table(&quot;counters&quot;).schema(), &quot;hits&quot;);\n                t.update(&quot;counters&quot;, Where.eq(&quot;id&quot;, 1), Map.of(&quot;hits&quot;, hits + 1));\n                t.commit();\n            } catch (RuntimeException e) { t.rollback(); }\n            return null;\n        }));\n        go.countDown();\n        for (Future&lt;?&gt; f : all) f.get();\n        pool.shutdown();\n        long hits = (Long) db.select(&quot;counters&quot;, Where.eq(&quot;id&quot;, 1)).get(0).get(db.table(&quot;counters&quot;).schema(), &quot;hits&quot;);\n        System.out.println(String.format(&quot;%-22s : 50 increments, the counter says %d%s&quot;, label, hits,\n            hits == 50 ? &quot;&quot; : &quot;  &lt;-- &quot; + (50 - hits) + &quot; committed updates vanished&quot;));\n    }\n\n    /** Insert and say whether it was accepted. Any rule failure or lock timeout is a &quot;no&quot;, not a crash. */\n    static boolean tryInsert(Database db, String table, Object... values) {\n        try { db.insert(table, values); return true; }\n        catch (ConstraintViolation | LockTimeout e) { return false; }\n        catch (RuntimeException e) { return false; }\n    }\n\n    /** T1 takes users then wants orders; T2 takes orders then wants users. One of them must give up and roll back. */\n    static void deadlock() throws Exception {\n        Database db = sample();\n        db.configure(new StrictTableLocking(), 300);\n        CyclicBarrier both = new CyclicBarrier(2);\n        Callable&lt;String&gt; t1 = () -&gt; cross(db, both, &quot;users&quot;, 100L, &quot;orders&quot;, 100L, 0);\n        Callable&lt;String&gt; t2 = () -&gt; cross(db, both, &quot;orders&quot;, 101L, &quot;users&quot;, 101L, 100);\n        ExecutorService pool = Executors.newFixedThreadPool(2);\n        Future&lt;String&gt; f1 = pool.submit(t1), f2 = pool.submit(t2);\n        String r1 = f1.get(5, TimeUnit.SECONDS), r2 = f2.get(5, TimeUnit.SECONDS);\n        pool.shutdown();\n        System.out.println(&quot;T1: &quot; + r1);\n        System.out.println(&quot;T2: &quot; + r2);\n        System.out.println(&quot;rows left behind: &quot; + (db.table(&quot;users&quot;).rowCount() + db.table(&quot;orders&quot;).rowCount())\n            + &quot; (the winner&#x27;s two rows; the loser&#x27;s writes were undone by its own rollback)&quot;);\n    }\n\n    /** One half of the deadlock: write to one table, wait for the other thread, then reach for the other table. */\n    static String cross(Database db, CyclicBarrier both, String first, long id1, String second, long id2, int staggerMs) {\n        Txn t = db.begin();\n        try {\n            if (first.equals(&quot;users&quot;)) t.insert(&quot;users&quot;, id1, &quot;dead&quot;, &quot;Pune&quot;, 30L);\n            else t.insert(&quot;orders&quot;, id1, 1L, 10L, 20260901L);\n            both.await();\n            Thread.sleep(staggerMs);\n            if (second.equals(&quot;users&quot;)) t.insert(&quot;users&quot;, id2, &quot;lock&quot;, &quot;Pune&quot;, 30L);\n            else t.insert(&quot;orders&quot;, id2, 1L, 10L, 20260901L);\n            t.commit();\n            return &quot;committed both rows&quot;;\n        } catch (LockTimeout e) {\n            return &quot;gave up and rolled back: &quot; + e.getMessage();\n        } catch (Exception e) {\n            t.rollback();\n            return &quot;failed: &quot; + e;\n        }\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist; ExtDemo at the bottom runs all of them,\n// so none of this can rot. Nothing here changes Main.java: every block is a new class handed to the database.\n\n// ---- ext: a foreign key -- a new rule handed in, and the reason a rule is given the TRANSACTION and not the map\n/**\n * A foreign key: this column must name a row that exists in the parent table. It is a TableRule because it has to\n * READ another table, and it reads through the transaction, so the parent table is locked for as long as this\n * transaction lives -- which is exactly why two transactions touching two tables in opposite orders can deadlock.\n */\nfinal class ForeignKeyRule implements TableRule {\n    private final String column, parentTable;\n    /** @param column the child column; parentTable the table whose primary key it must match. */\n    ForeignKeyRule(String column, String parentTable) { this.column = column; this.parentTable = parentTable; }\n    public void check(Txn txn, Table t, Row before, Row after) {\n        if (after == null) return;                                    // a delete in the child cannot break this\n        Object v = after.get(t.schema(), column);\n        if (v == null) return;                                        // null means &quot;no parent&quot;, which is allowed\n        if (txn.select(parentTable, Where.eq(txn.db().table(parentTable).schema().pkName(), v)).isEmpty())\n            throw new ConstraintViolation(t.name() + &quot;.&quot; + column + &quot; = &quot; + v + &quot; has no row in &quot; + parentTable);\n    }\n}\n\n/**\n * The other direction: do not delete a row that somebody still points at. Installed on the PARENT table, and it\n * scans the child through the transaction, so a child insert cannot slip in behind it.\n */\nfinal class RestrictDeleteRule implements TableRule {\n    private final String childTable, childColumn;\n    /** @param childTable the table that points here; childColumn the column that holds this table&#x27;s key. */\n    RestrictDeleteRule(String childTable, String childColumn) { this.childTable = childTable; this.childColumn = childColumn; }\n    public void check(Txn txn, Table t, Row before, Row after) {\n        if (after != null || before == null) return;                  // only a delete is our business\n        Object pk = before.pk(t.schema());\n        int kids = txn.select(childTable, Where.eq(childColumn, pk)).size();\n        if (kids &gt; 0) throw new ConstraintViolation(&quot;cannot delete &quot; + t.name() + &quot; &quot; + pk + &quot;: &quot; + kids + &quot; row(s) in &quot; + childTable);\n    }\n}\n\n// ---- ext: an index added at run time -- backfilled from the rows already there, then maintained by the same door\n/**\n * Adding an index to a table that already has rows. createIndex backfills, so the new index is complete the\n * moment it exists, and from then on the table&#x27;s single apply() keeps it in step like any other index.\n */\nfinal class LateIndex {\n    private LateIndex() {}\n    /** Add the index and immediately prove the planner uses it. Do it while nothing else is running: DDL is not transactional. */\n    static String add(Database db, String table, String column) {\n        Table t = db.table(table);\n        Index ix = t.createIndex(column);\n        return &quot;index on &quot; + table + &quot;.&quot; + column + &quot; built over &quot; + t.rowCount() + &quot; existing rows, &quot;\n             + ix.keyCount() + &quot; distinct values; the planner now says: &quot; + t.plan(Where.eq(column, t.allRows().get(0).get(t.schema(), column))).how();\n    }\n}\n\n// ---- ext: EXPLAIN -- when two indexes are usable, pick the one that examines fewer rows\n/**\n * A cost-based planner. Main&#x27;s planner takes the first usable index; this one prices every usable path by the rows\n * it would examine and takes the cheapest. Probing an index to price it is cheap at this size; a real planner keeps\n * histograms (counts of rows per range of values) because probing millions of rows would cost more than the query.\n */\nfinal class CostPlanner {\n    private CostPlanner() {}\n    /** The cheapest usable path. Each index path is priced by probing it; the scan is priced at the row count. */\n    static Plan cheapest(Table t, Predicate p) {\n        Plan best = null;\n        for (Predicate q : (p instanceof And a) ? a.parts() : List.of(p)) {\n            Plan c = probe(t, q);\n            if (c != null &amp;&amp; (best == null || c.candidates().size() &lt; best.candidates().size())) best = c;\n        }\n        return best != null ? best : new Plan(&quot;full scan (&quot; + t.rowCount() + &quot; rows)&quot;, t.allRows());\n    }\n    /** One part of the where-clause as an index path, or null when no index can answer it. */\n    private static Plan probe(Table t, Predicate q) {\n        if (q instanceof Eq e &amp;&amp; e.val() != null &amp;&amp; e.col().equals(t.schema().pkName()))\n            return new Plan(&quot;primary key lookup on &quot; + e.col(), t.row(e.val()) == null ? List.of() : List.of(t.row(e.val())));\n        if (q instanceof Eq e &amp;&amp; e.val() != null &amp;&amp; t.index(e.col()) != null)\n            return new Plan(&quot;index probe on &quot; + e.col(), rows(t, t.index(e.col()).eq(e.val())));\n        if (q instanceof Between b &amp;&amp; t.index(b.col()) != null)\n            return new Plan(&quot;index range on &quot; + b.col(), rows(t, t.index(b.col()).range(b.lo(), b.hi())));\n        return null;\n    }\n    private static List&lt;Row&gt; rows(Table t, Collection&lt;Object&gt; pks) {\n        List&lt;Row&gt; out = new ArrayList&lt;&gt;();\n        for (Object pk : pks) out.add(t.row(pk));\n        return out;\n    }\n    /** The rows, found through the cheapest path: the same rows as Main&#x27;s select, with the fewest examined. */\n    static List&lt;Row&gt; select(Txn tx, String table, Predicate p) {\n        Table t = tx.table(table);                            // locked for the rest of the transaction, like any read\n        List&lt;Row&gt; out = new ArrayList&lt;&gt;();\n        for (Row r : cheapest(t, p).candidates()) if (p.test(t.schema(), r)) out.add(r);\n        return out;\n    }\n}\n\n// ---- ext: ORDER BY and a column list -- select(columns, where, orderBy), the API-driven version of this prompt\n/**\n * ORDER BY over several columns, each ascending or descending, then only the columns asked for (a projection).\n * Only the k matched rows are sorted, O(k log k), never the table. A range read through a TreeMap index already\n * returns rows in that column&#x27;s order, and Java&#x27;s sort notices an already-sorted list and makes one pass.\n */\nfinal class OrderBy {\n    private OrderBy() {}\n    /** One sort key, written &quot;age&quot; or &quot;age DESC&quot;. A null sorts last in either direction. */\n    static Comparator&lt;Row&gt; key(Schema s, String spec) {\n        String[] p = spec.trim().split(&quot;\\\\s+&quot;);\n        int col = s.pos(p[0]);\n        boolean desc = p.length &gt; 1 &amp;&amp; p[1].equalsIgnoreCase(&quot;DESC&quot;);\n        return (a, b) -&gt; {\n            Object x = a.get(col), y = b.get(col);\n            if (x == null || y == null) return x == y ? 0 : (x == null ? 1 : -1);\n            int c = Index.cmp(x, y);\n            return desc ? -c : c;\n        };\n    }\n    /** SELECT columns FROM table WHERE where ORDER BY keys, read inside the caller&#x27;s transaction like any read. */\n    static List&lt;List&lt;Object&gt;&gt; select(Txn tx, String table, List&lt;String&gt; columns, Predicate where, String... orderBy) {\n        Table t = tx.table(table);\n        Schema s = t.schema();\n        List&lt;Row&gt; rows = t.select(where);                     // the planner picks the rows: key, index or scan\n        Comparator&lt;Row&gt; order = null;\n        for (String k : orderBy) order = (order == null) ? key(s, k) : order.thenComparing(key(s, k));\n        if (order != null) rows.sort(order);                  // k log k for the k matches only\n        List&lt;List&lt;Object&gt;&gt; out = new ArrayList&lt;&gt;();\n        for (Row r : rows) {\n            List&lt;Object&gt; cells = new ArrayList&lt;&gt;();\n            for (String c : columns) cells.add(r.get(s, c));\n            out.add(cells);\n        }\n        return out;\n    }\n}\n\n// ---- ext: joins -- nested loop with an index, and a hash join, and when each one wins\n/**\n * Two ways to join users to orders. Nested loop walks the left side and probes the right side&#x27;s index: cheap when\n * the left side is small and the right side is indexed. Hash join builds a map from the smaller side and streams\n * the other: one pass over each, no index needed, but the map has to fit in memory. Both read the two tables\n * inside the caller&#x27;s transaction, so the join sees one consistent database while other clients write.\n */\nfinal class Joins {\n    private Joins() {}\n    /** For each user, probe the orders index on user_id: n left rows x one index probe each. */\n    static List&lt;String&gt; nestedLoop(Txn tx) {\n        Table users = tx.table(&quot;users&quot;), orders = tx.table(&quot;orders&quot;);\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (Row u : users.allRows())\n            for (Row o : orders.select(Where.eq(&quot;user_id&quot;, u.pk(users.schema()))))\n                out.add(u.get(users.schema(), &quot;name&quot;) + &quot; -&gt; &quot; + o.get(orders.schema(), &quot;total&quot;));\n        Collections.sort(out);\n        return out;\n    }\n    /** Build a map from users (the smaller side), then stream orders once: O(n + m), and no index is needed. */\n    static List&lt;String&gt; hashJoin(Txn tx) {\n        Table users = tx.table(&quot;users&quot;), orders = tx.table(&quot;orders&quot;);\n        Map&lt;Object, String&gt; build = new HashMap&lt;&gt;();\n        for (Row u : users.allRows()) build.put(u.pk(users.schema()), (String) u.get(users.schema(), &quot;name&quot;));\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (Row o : orders.allRows()) {\n            String name = build.get(o.get(orders.schema(), &quot;user_id&quot;));\n            if (name != null) out.add(name + &quot; -&gt; &quot; + o.get(orders.schema(), &quot;total&quot;));\n        }\n        Collections.sort(out);\n        return out;\n    }\n}\n\n// ---- ext: persistence -- a write-ahead log, and the conditional UPDATE the same design becomes in SQL\n/**\n * Durability: the database&#x27;s CommitLog. COMMIT appends the batch here while the transaction still holds its tables,\n * so the lines are in commit order, and only then releases the locks. On a real disk the append ends with an fsync\n * (the call that forces the bytes onto the disk); if it throws, the commit fails and is rolled back. A rolled-back\n * transaction never reaches here, which is why replaying the log rebuilds exactly the committed state.\n */\nfinal class WalLog implements CommitLog {\n    private final List&lt;String&gt; log = Collections.synchronizedList(new ArrayList&lt;&gt;());\n    public void append(List&lt;Change&gt; batch) {\n        List&lt;String&gt; lines = new ArrayList&lt;&gt;();\n        for (Change c : batch) {\n            Row r = c.after() != null ? c.after() : c.before();\n            StringJoiner j = new StringJoiner(&quot;~&quot;);\n            j.add(c.kind().name()).add(c.table());\n            for (int i = 0; i &lt; c.schema().size(); i++) j.add(enc(r.get(i)));\n            lines.add(j.toString());                                  // a real log writes lengths and a checksum\n        }\n        log.addAll(lines);                                            // one transaction&#x27;s lines stay together\n    }\n    /** The log lines, oldest first. */\n    List&lt;String&gt; lines() { return List.copyOf(log); }\n    /** One value as text, with its type, so replay can put back a long rather than a string that looks like one. */\n    static String enc(Object v) {\n        if (v == null) return &quot;N&quot;;\n        if (v instanceof Long l) return &quot;L&quot; + l;\n        if (v instanceof Boolean b) return &quot;B&quot; + (b ? 1 : 0);\n        return &quot;S&quot; + v;\n    }\n    /** One value back from text. */\n    static Object dec(String s) {\n        return switch (s.charAt(0)) {\n            case &#x27;N&#x27; -&gt; null;\n            case &#x27;L&#x27; -&gt; Long.parseLong(s.substring(1));\n            case &#x27;B&#x27; -&gt; s.charAt(1) == &#x27;1&#x27;;\n            default -&gt; s.substring(1);\n        };\n    }\n    /**\n     * Rebuild a database from the log. The log is a list of statements, so replay is just running them again;\n     * this is also why the log, not the map, is the thing you ship to a replica.\n     */\n    static Database replay(List&lt;String&gt; lines, Database fresh) {\n        for (String line : lines) {\n            String[] f = line.split(&quot;~&quot;);\n            Table t = fresh.table(f[1]);\n            Schema s = t.schema();\n            Object[] cells = new Object[s.size()];\n            for (int i = 0; i &lt; s.size(); i++) cells[i] = dec(f[i + 2]);\n            Object pk = cells[s.pkIndex()];\n            switch (ChangeKind.valueOf(f[0])) {\n                case INSERT -&gt; fresh.insert(f[1], cells);\n                case DELETE -&gt; fresh.delete(f[1], Where.eq(s.pkName(), pk));\n                case UPDATE -&gt; {\n                    Map&lt;String, Object&gt; set = new LinkedHashMap&lt;&gt;();\n                    for (int i = 0; i &lt; s.size(); i++) if (i != s.pkIndex()) set.put(s.col(i).name(), cells[i]);\n                    fresh.update(f[1], Where.eq(s.pkName(), pk), set);\n                }\n            }\n        }\n        return fresh;\n    }\n    /**\n     * The same design on a real database, where the lock is the row and the transaction is the server&#x27;s. The\n     * version column makes the write conditional: two servers cannot both apply an update to the row they read.\n     *\n     * &lt;pre&gt;\n     * UPDATE users SET city = ?, version = version + 1\n     *  WHERE id = ? AND version = ?;         -- 0 rows updated means somebody else got there first: re-read and retry\n     * INSERT INTO users (...) VALUES (...) ON CONFLICT (id) DO NOTHING;   -- a retried request inserts once\n     * &lt;/pre&gt;\n     */\n    static final String SQL = &quot;see the Javadoc above&quot;;\n}\n\n// ---- ext: MVCC -- versions per row, so a reader never waits behind a writer\n/**\n * Multi-version concurrency control, small enough to read. Every key keeps a chain of versions stamped with the\n * commit number that created them. A reader takes a snapshot -- the commit number at its start -- and always\n * reads the newest version older than that, so it never blocks and never sees a half-finished transaction.\n * What it costs: old versions are garbage that something has to collect, and two transactions can both commit\n * against the same snapshot (write skew), which is why snapshot isolation is not serialisable.\n */\nfinal class MvccStore {\n    /** One committed value of one key, stamped with the commit that wrote it. */\n    private record Version(long at, String value, boolean deleted) {}\n    private final Map&lt;String, List&lt;Version&gt;&gt; chains = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicLong commits = new AtomicLong();\n    /** A reader&#x27;s snapshot: everything committed up to now is visible, everything later is not. */\n    long snapshot() { return commits.get(); }\n    /** The value this snapshot sees: the newest version at or before it. A reader never waits for a writer&#x27;s\n     *  transaction; the only wait is this key&#x27;s monitor, held for the length of one list append. */\n    String read(String key, long snapshot) {\n        List&lt;Version&gt; chain = chains.get(key);\n        if (chain == null) return null;\n        String seen = null;\n        synchronized (chain) {\n            for (Version v : chain) if (v.at() &lt;= snapshot) seen = v.deleted() ? null : v.value();\n        }\n        return seen;\n    }\n    /** Commit a new version. Readers already running keep reading the old one. */\n    void write(String key, String value) { append(key, value, false); }\n    /** Commit a deletion as a version, so a reader with an older snapshot still sees the row. */\n    void delete(String key) { append(key, null, true); }\n    private void append(String key, String value, boolean deleted) {\n        List&lt;Version&gt; chain = chains.computeIfAbsent(key, k -&gt; new ArrayList&lt;&gt;());\n        synchronized (chain) { chain.add(new Version(commits.incrementAndGet(), value, deleted)); }\n    }\n    /** Drop versions no live snapshot can still need. This is the garbage collector MVCC buys you. */\n    int vacuum(long oldestLiveSnapshot) {\n        int dropped = 0;\n        for (List&lt;Version&gt; chain : chains.values())\n            synchronized (chain) {\n                int keep = 0;\n                for (int i = 0; i &lt; chain.size(); i++) if (chain.get(i).at() &lt;= oldestLiveSnapshot) keep = i;\n                while (keep-- &gt; 0) { chain.remove(0); dropped++; }\n            }\n        return dropped;\n    }\n}\n\n// ---- ext: row-level locks -- the next rung, and the phantom it lets back in\n/**\n * A lock per row instead of a lock per table: two transactions writing different rows of one table never wait.\n * The interface has to widen -- a key is now part of the request -- and one guarantee is lost: a table lock also\n * stopped rows from APPEARING, so with row locks a repeated range query can return a new row (a phantom) unless\n * the range itself is locked. Multi-key requests are taken in sorted order, which is how you avoid deadlock.\n */\nfinal class KeyLocks {\n    private final ConcurrentHashMap&lt;String, ReentrantLock&gt; locks = new ConcurrentHashMap&lt;&gt;();\n    /** Take one row&#x27;s lock, waiting at most timeoutMs. */\n    boolean acquire(String table, Object pk, long timeoutMs) {\n        ReentrantLock l = locks.computeIfAbsent(table + &quot;#&quot; + pk, k -&gt; new ReentrantLock());\n        try { return l.tryLock(timeoutMs, TimeUnit.MILLISECONDS); }\n        catch (InterruptedException e) { Thread.currentThread().interrupt(); return false; }\n    }\n    /** Give one row&#x27;s lock back. */\n    void release(String table, Object pk) { locks.get(table + &quot;#&quot; + pk).unlock(); }\n    /** Take several rows in one agreed order, so two transactions wanting the same pair cannot deadlock. */\n    boolean acquireAll(String table, List&lt;Object&gt; pks, long timeoutMs) {\n        List&lt;Object&gt; sorted = new ArrayList&lt;&gt;(pks);\n        sorted.sort((a, b) -&gt; Index.cmp(a, b));\n        List&lt;Object&gt; taken = new ArrayList&lt;&gt;();\n        for (Object pk : sorted) {\n            if (!acquire(table, pk, timeoutMs)) { for (Object done : taken) release(table, done); return false; }\n            taken.add(pk);\n        }\n        return true;\n    }\n}\n\n// ---- ext: sharding by primary key -- more locks by having more databases\n/**\n * Split one table across n databases by the hash of its primary key. Each shard has its own lock, so throughput\n * multiplies by n for key lookups and writes. What it costs: a query that is not on the key has to ask every\n * shard and merge, and a transaction touching two shards needs two-phase commit -- so COMMIT can now fail.\n */\nfinal class ShardedUsers {\n    private final List&lt;Database&gt; shards = new ArrayList&lt;&gt;();\n    /** @param n how many shards; each is a whole little database with its own tables and locks. */\n    ShardedUsers(int n) {\n        for (int i = 0; i &lt; n; i++) {\n            Database db = new Database();\n            db.createTable(&quot;users&quot;, &quot;id&quot;, Column.intCol(&quot;id&quot;, true), Column.text(&quot;name&quot;, true),\n                Column.text(&quot;city&quot;, true), Column.intCol(&quot;age&quot;, false));\n            db.table(&quot;users&quot;).createIndex(&quot;city&quot;);\n            shards.add(db);\n        }\n    }\n    /** Which shard owns this key. The whole routing rule, and it must never change without a migration. */\n    Database shardFor(Object pk) { return shards.get(Math.floorMod(pk.hashCode(), shards.size())); }\n    /** Insert: one shard, one lock. */\n    void insert(long id, String name, String city, long age) { shardFor(id).insert(&quot;users&quot;, id, name, city, age); }\n    /** Read by key: one shard, O(1), no fan-out. */\n    Row get(long id) {\n        List&lt;Row&gt; rows = shardFor(id).select(&quot;users&quot;, Where.eq(&quot;id&quot;, id));\n        return rows.isEmpty() ? null : rows.get(0);\n    }\n    /** Anything not keyed by the primary key: ask every shard and merge. This is what sharding costs. */\n    List&lt;Row&gt; byCity(String city) {\n        List&lt;Row&gt; out = new ArrayList&lt;&gt;();\n        for (Database db : shards) out.addAll(db.select(&quot;users&quot;, Where.eq(&quot;city&quot;, city)));\n        return out;\n    }\n    /** Rows per shard, to show the spread. */\n    List&lt;Integer&gt; sizes() {\n        List&lt;Integer&gt; out = new ArrayList&lt;&gt;();\n        for (Database db : shards) out.add(db.table(&quot;users&quot;).rowCount());\n        return out;\n    }\n}\n\n// ---- ext: isolation levels -- what strict two-phase locking gives you, and what each weaker level lets back in\n/**\n * The three anomalies an interviewer names, each as a scenario you can run twice: once with the lock policy this\n * design ships with, once with no locking at all. A reader begins a transaction, counts the rows in Pune, lets a\n * writer loose, and counts again. Under StrictTableLocking the writer cannot have the table until the reader\n * commits, so both counts agree. Under NoLocking the writer lands in the middle of the reader and they differ.\n *\n * &lt;p&gt;The four SQL isolation levels, said in terms of this code. Every level keeps a table it WROTE locked to the\n * end; only the reads differ. READ UNCOMMITTED: reads take no lock, so you can see a write that is rolled back a\n * moment later (a dirty read). NoLocking is worse than any level: it drops the write locks too, so updates are lost.\n * READ COMMITTED: a table that was only READ is released at the end of the statement, which lets non-repeatable\n * reads back in. REPEATABLE READ keeps read locks to the end but on rows, not the table, so rows can still APPEAR\n * between two reads (a phantom). SERIALIZABLE is what Main already does: a table lock also stops inserts.\n */\nfinal class Isolation {\n    private Isolation() {}\n    /** Which anomaly the scenario tries to produce. */\n    enum Anomaly { DIRTY_READ, NON_REPEATABLE_READ, PHANTOM }\n    /** One reader&#x27;s two counts of the same query. Equal counts mean the anomaly did not happen. */\n    record Reads(int first, int second) {\n        /** True if the transaction saw the same database twice, which is the whole promise of isolation. */\n        boolean stable() { return first == second; }\n    }\n    /**\n     * Run one scenario under one lock policy and report what the reader counted before and after the writer ran.\n     * Nothing here waits forever: the writer is given 300 ms to get in, which is all it needs when it can.\n     */\n    static Reads run(LockPolicy policy, Anomaly anomaly) throws Exception {\n        Database db = Main.sample();\n        db.configure(policy, 2000);\n        db.insert(&quot;users&quot;, 1, &quot;Asha&quot;, &quot;Pune&quot;, 31);\n        CountDownLatch started = new CountDownLatch(1), wrote = new CountDownLatch(1), readerDone = new CountDownLatch(1);\n        Thread writer = new Thread(() -&gt; {\n            started.countDown();\n            Txn w = db.begin();\n            try {\n                switch (anomaly) {\n                    case DIRTY_READ           -&gt; w.insert(&quot;users&quot;, 2, &quot;Never&quot;, &quot;Pune&quot;, 20);   // never committed\n                    case NON_REPEATABLE_READ  -&gt; w.update(&quot;users&quot;, Where.eq(&quot;id&quot;, 1), Map.of(&quot;city&quot;, &quot;Kochi&quot;));\n                    case PHANTOM              -&gt; w.insert(&quot;users&quot;, 2, &quot;Bela&quot;, &quot;Pune&quot;, 42);\n                }\n                if (anomaly != Anomaly.DIRTY_READ) w.commit();\n            } catch (RuntimeException e) { /* it waited for the table and gave up: that is the lock doing its job */ }\n            wrote.countDown();\n            if (anomaly == Anomaly.DIRTY_READ) {\n                try { readerDone.await(3, TimeUnit.SECONDS); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n                w.rollback();                                         // so the row the reader may have seen never existed\n            }\n        });\n        Txn reader = db.begin();\n        int first = reader.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Pune&quot;)).size();\n        writer.start();\n        started.await();\n        wrote.await(300, TimeUnit.MILLISECONDS);                      // under strict locking it cannot get in, and that is the point\n        int second = reader.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Pune&quot;)).size();\n        reader.commit();\n        readerDone.countDown();\n        writer.join(5000);\n        return new Reads(first, second);\n    }\n    /** The same scenario as one line for a demo print. */\n    static String describe(LockPolicy policy, String label, Anomaly anomaly) throws Exception {\n        Reads r = run(policy, anomaly);\n        return String.format(&quot;%-12s %-20s reader counted %d then %d  %s&quot;, label, anomaly, r.first(), r.second(),\n            r.stable() ? &quot;-- the same database twice&quot; : &quot;&lt;-- &quot; + anomaly + &quot;: one transaction, two different databases&quot;);\n    }\n}\n\n// ---- ext: TTL rows -- the injected clock, and why the sweeper is an ordinary transaction\n/**\n * Rows that expire. Every row is stamped with the injected clock when it is written, so a sweeper can delete\n * everything older than a TTL -- and it does it with ordinary transactions, so the triggers, the indexes and the\n * undo log all behave exactly as they do for a hand-typed DELETE. A test moves the clock instead of sleeping.\n */\nfinal class TtlSweeper {\n    private final Database db;\n    private final String table;\n    private final long ttlMs;\n    private final Clock clock;\n    /** @param ttlMs how old a row may get; clock the same clock the database was handed. */\n    TtlSweeper(Database db, String table, long ttlMs, Clock clock) { this.db = db; this.table = table; this.ttlMs = ttlMs; this.clock = clock; }\n    /** Delete every row written longer ago than the TTL. Returns how many went. */\n    int sweep() {\n        long cutoff = clock.nowMs() - ttlMs;\n        return db.delete(table, (s, r) -&gt; r.atMs() &lt; cutoff);          // a lambda predicate: the planner cannot read it, so it is a scan\n    }\n}\n\n/** Runs every extension above so none of them can rot. Run it: java ExtDemo. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        Database db = Main.sample();\n        db.table(&quot;orders&quot;).addRule(new ForeignKeyRule(&quot;user_id&quot;, &quot;users&quot;));\n        db.table(&quot;users&quot;).addRule(new RestrictDeleteRule(&quot;orders&quot;, &quot;user_id&quot;));\n        db.insert(&quot;users&quot;, 1, &quot;Asha&quot;, &quot;Pune&quot;, 31);\n        db.insert(&quot;users&quot;, 2, &quot;Bela&quot;, &quot;Pune&quot;, 42);\n        db.insert(&quot;users&quot;, 3, &quot;Chandra&quot;, &quot;Kochi&quot;, 27);\n        db.insert(&quot;orders&quot;, 10, 1, 300, 20260901);\n        db.insert(&quot;orders&quot;, 11, 2, 450, 20260902);\n        db.insert(&quot;orders&quot;, 12, 1, 120, 20260903);\n\n        System.out.println(&quot;-- foreign keys --------------------------------------------------&quot;);\n        try { db.insert(&quot;orders&quot;, 13, 99, 10, 20260904); } catch (ConstraintViolation e) { System.out.println(&quot;refused: &quot; + e.getMessage()); }\n        try { db.delete(&quot;users&quot;, Where.eq(&quot;id&quot;, 1)); } catch (ConstraintViolation e) { System.out.println(&quot;refused: &quot; + e.getMessage()); }\n        System.out.println(&quot;orders: &quot; + db.table(&quot;orders&quot;).rowCount() + &quot; rows, users: &quot; + db.table(&quot;users&quot;).rowCount() + &quot; rows -- both refusals wrote nothing&quot;);\n\n        System.out.println(&quot;\\n-- an index added after the rows ---------------------------------&quot;);\n        System.out.println(LateIndex.add(db, &quot;users&quot;, &quot;name&quot;));\n\n        System.out.println(&quot;\\n-- EXPLAIN: two usable indexes, one of them cheaper --------------&quot;);\n        Predicate both = Where.and(Where.eq(&quot;city&quot;, &quot;Pune&quot;), Where.eq(&quot;name&quot;, &quot;Bela&quot;));\n        System.out.println(&quot;first usable : &quot; + db.explain(&quot;users&quot;, both));\n        Txn planning = db.begin();\n        Plan best = CostPlanner.cheapest(planning.table(&quot;users&quot;), both);\n        System.out.println(&quot;cheapest     : &quot; + best.how() + &quot;, &quot; + best.candidates().size() + &quot; row(s) examined; rows found: &quot;\n            + CostPlanner.select(planning, &quot;users&quot;, both).size());\n        planning.commit();\n\n        System.out.println(&quot;\\n-- ORDER BY city, age DESC, and only two columns ------------------&quot;);\n        Txn sorting = db.begin();\n        System.out.println(OrderBy.select(sorting, &quot;users&quot;, List.of(&quot;name&quot;, &quot;age&quot;), Where.all(), &quot;city&quot;, &quot;age DESC&quot;));\n        sorting.commit();\n\n        System.out.println(&quot;\\n-- joins ---------------------------------------------------------&quot;);\n        Txn reading = db.begin();\n        System.out.println(&quot;nested loop: &quot; + Joins.nestedLoop(reading));\n        System.out.println(&quot;hash join  : &quot; + Joins.hashJoin(reading));\n        System.out.println(&quot;same answer: &quot; + Joins.nestedLoop(reading).equals(Joins.hashJoin(reading)));\n        reading.commit();\n\n        System.out.println(&quot;\\n-- a write-ahead log, and replay ---------------------------------&quot;);\n        Database live = Main.sample();\n        WalLog wal = new WalLog();\n        live.setLog(wal);\n        live.insert(&quot;users&quot;, 1, &quot;Asha&quot;, &quot;Pune&quot;, 31);\n        live.insert(&quot;users&quot;, 2, &quot;Bela&quot;, &quot;Pune&quot;, 42);\n        live.update(&quot;users&quot;, Where.eq(&quot;id&quot;, 1), Map.of(&quot;city&quot;, &quot;Kochi&quot;));\n        Txn doomed = live.begin();\n        doomed.insert(&quot;users&quot;, 3, &quot;Never&quot;, &quot;Surat&quot;, 20);\n        doomed.rollback();\n        live.delete(&quot;users&quot;, Where.eq(&quot;id&quot;, 2));\n        Database rebuilt = WalLog.replay(wal.lines(), Main.sample());\n        System.out.println(&quot;log lines: &quot; + wal.lines());\n        System.out.println(&quot;rebuilt: &quot; + rebuilt.table(&quot;users&quot;).rowCount() + &quot; row(s), &quot; + rebuilt.table(&quot;users&quot;).allRows().get(0).show(rebuilt.table(&quot;users&quot;).schema()));\n        System.out.println(&quot;the rolled-back row is not in the log: &quot; + wal.lines().stream().noneMatch(l -&gt; l.contains(&quot;Never&quot;)));\n\n        System.out.println(&quot;\\n-- MVCC: a reader that does not wait ------------------------------&quot;);\n        MvccStore mv = new MvccStore();\n        mv.write(&quot;balance&quot;, &quot;100&quot;);\n        long reader = mv.snapshot();\n        mv.write(&quot;balance&quot;, &quot;999&quot;);\n        System.out.println(&quot;the old reader still sees &quot; + mv.read(&quot;balance&quot;, reader) + &quot;; a new reader sees &quot; + mv.read(&quot;balance&quot;, mv.snapshot()));\n        mv.delete(&quot;balance&quot;);\n        System.out.println(&quot;after a delete: old reader &quot; + mv.read(&quot;balance&quot;, reader) + &quot;, new reader &quot; + mv.read(&quot;balance&quot;, mv.snapshot()));\n        System.out.println(&quot;vacuum dropped &quot; + mv.vacuum(mv.snapshot()) + &quot; dead version(s)&quot;);\n\n        System.out.println(&quot;\\n-- row-level locks -----------------------------------------------&quot;);\n        KeyLocks keys = new KeyLocks();\n        CountDownLatch held = new CountDownLatch(1), done = new CountDownLatch(1);\n        Thread other = new Thread(() -&gt; { keys.acquire(&quot;users&quot;, 1L, 1000); held.countDown(); try { done.await(); } catch (InterruptedException e) { } keys.release(&quot;users&quot;, 1L); });\n        other.start();\n        held.await();\n        System.out.println(&quot;row 1 is held by another transaction; row 2 free? &quot; + keys.acquire(&quot;users&quot;, 2L, 200));\n        System.out.println(&quot;row 1 free? &quot; + keys.acquire(&quot;users&quot;, 1L, 200) + &quot;  (with a table lock, both answers would be no)&quot;);\n        keys.release(&quot;users&quot;, 2L);\n        done.countDown(); other.join();\n\n        System.out.println(&quot;\\n-- sharding by primary key ---------------------------------------&quot;);\n        ShardedUsers sharded = new ShardedUsers(4);\n        for (long i = 1; i &lt;= 100; i++) sharded.insert(i, &quot;u&quot; + i, i % 3 == 0 ? &quot;Pune&quot; : &quot;Kochi&quot;, 20 + i % 40);\n        System.out.println(&quot;rows per shard: &quot; + sharded.sizes());\n        System.out.println(&quot;by key, one shard: &quot; + sharded.get(42).show(sharded.shardFor(42L).table(&quot;users&quot;).schema()));\n        System.out.println(&quot;by city, all four shards: &quot; + sharded.byCity(&quot;Pune&quot;).size() + &quot; rows&quot;);\n\n        System.out.println(&quot;\\n-- isolation: the same three scenarios, with the lock and without -&quot;);\n        for (Isolation.Anomaly a : Isolation.Anomaly.values()) System.out.println(Isolation.describe(new StrictTableLocking(), &quot;strict 2PL&quot;, a));\n        for (Isolation.Anomaly a : Isolation.Anomaly.values()) System.out.println(Isolation.describe(new NoLocking(), &quot;no locking&quot;, a));\n\n        System.out.println(&quot;\\n-- TTL rows, with the clock moved by hand -------------------------&quot;);\n        Database ttlDb = Main.sample();\n        long[] now = { 1_700_000_000_000L };\n        ttlDb.setClock(() -&gt; now[0]);\n        ttlDb.insert(&quot;users&quot;, 1, &quot;Old&quot;, &quot;Pune&quot;, 30);\n        now[0] += 60_000;\n        ttlDb.insert(&quot;users&quot;, 2, &quot;New&quot;, &quot;Pune&quot;, 30);\n        TtlSweeper sweeper = new TtlSweeper(ttlDb, &quot;users&quot;, 30_000, () -&gt; now[0]);\n        System.out.println(&quot;swept &quot; + sweeper.sweep() + &quot; row(s); left: &quot; + ttlDb.table(&quot;users&quot;).allRows().get(0).show(ttlDb.table(&quot;users&quot;).schema()));\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// Targeted failure tests: each one proves a claim the design makes on page 02 (move 9) or in a follow-up on page 05.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n    /** The value of one column of one row, for a short assertion. */\n    static Object v(Database db, String table, Object pk, String col) {\n        Row r = db.table(table).row(pk);\n        return r == null ? null : r.get(db.table(table).schema(), col);\n    }\n    /** Every primary key the index on that column currently points at, over the whole index. */\n    static Set&lt;Object&gt; indexed(Database db, String table, String col) {\n        Set&lt;Object&gt; out = new LinkedHashSet&lt;&gt;();\n        Index ix = db.table(table).index(col);\n        for (Row r : db.table(table).allRows()) out.addAll(ix.eq(r.get(db.table(table).schema(), col)));\n        return out;\n    }\n\n    public static void main(String[] args) throws Exception {\n\n        // 1. fifty threads insert the SAME primary key at the same instant, and fifty more insert fifty distinct\n        //    keys: exactly one winner on the contested key, exact counts everywhere, and every index in step.\n        Database race = Main.sample();\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;Boolean&gt;&gt; same = new ArrayList&lt;&gt;(), distinct = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final int n = i;\n            same.add(pool.submit(() -&gt; { go.await(); return Main.tryInsert(race, &quot;users&quot;, 7L, &quot;racer&quot; + n, &quot;Pune&quot;, 30L); }));\n            distinct.add(pool.submit(() -&gt; { go.await(); return Main.tryInsert(race, &quot;orders&quot;, 1000L + n, 7L, 50L, 20260901L); }));\n        }\n        go.countDown();\n        int wonSame = 0, wonDistinct = 0;\n        for (Future&lt;Boolean&gt; f : same) if (f.get()) wonSame++;\n        for (Future&lt;Boolean&gt; f : distinct) if (f.get()) wonDistinct++;\n        pool.shutdown();\n        check(wonSame == 1, &quot;exactly one of 50 transactions was told it inserted the contested key (was &quot; + wonSame + &quot;)&quot;);\n        check(race.table(&quot;users&quot;).rowCount() == 1, &quot;and exactly one row carries that key&quot;);\n        check(wonDistinct == 50 &amp;&amp; race.table(&quot;orders&quot;).rowCount() == 50, &quot;50 distinct keys: 50 accepted, 50 rows, nothing lost&quot;);\n        check(race.table(&quot;orders&quot;).index(&quot;user_id&quot;).eq(7L).size() == 50, &quot;the secondary index holds all 50 primary keys&quot;);\n        check(indexed(race, &quot;orders&quot;, &quot;placed_at&quot;).size() == 50, &quot;the second index holds them too: no index drifted from the rows&quot;);\n\n        // 2. a duplicate primary key is refused, and the refusal changes nothing at all\n        Database db = Main.sample();\n        db.insert(&quot;users&quot;, 1, &quot;Asha&quot;, &quot;Pune&quot;, 31);\n        db.insert(&quot;users&quot;, 2, &quot;Bela&quot;, &quot;Kochi&quot;, 42);\n        int rowsBefore = db.table(&quot;users&quot;).rowCount();\n        try {\n            db.insert(&quot;users&quot;, 1, &quot;Impostor&quot;, &quot;Surat&quot;, 20);\n            check(false, &quot;a duplicate primary key must be refused&quot;);\n        } catch (ConstraintViolation e) { check(true, &quot;duplicate primary key refused: &quot; + e.getMessage()); }\n        check(db.table(&quot;users&quot;).rowCount() == rowsBefore, &quot;the refused insert added no row&quot;);\n        check(&quot;Asha&quot;.equals(v(db, &quot;users&quot;, 1L, &quot;name&quot;)), &quot;and it did not overwrite the row that was already there&quot;);\n        check(db.table(&quot;users&quot;).index(&quot;city&quot;).eq(&quot;Surat&quot;).isEmpty(), &quot;and it left nothing behind in any index&quot;);\n\n        // 3. a wrong type, a null in a NOT NULL column and a failed CHECK are all refused before the lock is taken\n        try { db.insert(&quot;users&quot;, 3, &quot;Chandra&quot;, &quot;Kochi&quot;, &quot;twenty-seven&quot;); check(false, &quot;a wrong type must be refused&quot;); }\n        catch (ConstraintViolation e) { check(true, &quot;wrong type refused: &quot; + e.getMessage()); }\n        try { db.insert(&quot;users&quot;, 4, &quot;Devi&quot;, null, 30); check(false, &quot;a null in a NOT NULL column must be refused&quot;); }\n        catch (ConstraintViolation e) { check(true, &quot;NOT NULL refused: &quot; + e.getMessage()); }\n        try { db.insert(&quot;users&quot;, 5, &quot;Ekta&quot;, &quot;Pune&quot;, 900); check(false, &quot;a failed CHECK must be refused&quot;); }\n        catch (ConstraintViolation e) { check(true, &quot;CHECK refused: &quot; + e.getMessage()); }\n        try { db.insert(&quot;users&quot;, 6, &quot;Farid&quot;); check(false, &quot;the wrong number of values must be refused&quot;); }\n        catch (ConstraintViolation e) { check(true, &quot;wrong arity refused: &quot; + e.getMessage()); }\n        check(db.table(&quot;users&quot;).rowCount() == 2, &quot;four refused inserts, still two rows&quot;);\n        check(!db.table(&quot;users&quot;).lock().isLocked(), &quot;and the table is not left locked by any of them&quot;);\n\n        // 4. an update that changes an indexed column moves the row in that index: old key gone, new key there\n        db.insert(&quot;users&quot;, 3, &quot;Chandra&quot;, &quot;Kochi&quot;, 27);\n        db.update(&quot;users&quot;, Where.eq(&quot;id&quot;, 1), Map.of(&quot;city&quot;, &quot;Surat&quot;, &quot;age&quot;, 32));\n        check(db.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Pune&quot;)).isEmpty(), &quot;the old index key no longer finds the row&quot;);\n        check(db.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Surat&quot;)).size() == 1, &quot;the new index key does&quot;);\n        check(db.select(&quot;users&quot;, Where.between(&quot;age&quot;, 32, 32)).size() == 1, &quot;the range index moved with it&quot;);\n        check((Long) v(db, &quot;users&quot;, 1L, &quot;age&quot;) == 32L &amp;&amp; &quot;Asha&quot;.equals(v(db, &quot;users&quot;, 1L, &quot;name&quot;)),\n              &quot;the columns that were not in the SET are untouched&quot;);\n        try { db.update(&quot;users&quot;, Where.eq(&quot;id&quot;, 1), Map.of(&quot;id&quot;, 99)); check(false, &quot;editing a primary key must be refused&quot;); }\n        catch (ConstraintViolation e) { check(true, &quot;editing a primary key refused: &quot; + e.getMessage()); }\n\n        // 5. a range query answered by the TreeMap index returns exactly what a full scan would, in key order\n        Database ages = Main.sample();\n        for (int i = 1; i &lt;= 40; i++) ages.insert(&quot;users&quot;, i, &quot;u&quot; + i, &quot;Pune&quot;, 20 + i);\n        List&lt;Row&gt; byIndex = ages.select(&quot;users&quot;, Where.between(&quot;age&quot;, 30, 35));\n        List&lt;Long&gt; scan = new ArrayList&lt;&gt;();\n        for (Row r : ages.table(&quot;users&quot;).allRows()) {\n            long a = (Long) r.get(ages.table(&quot;users&quot;).schema(), &quot;age&quot;);\n            if (a &gt;= 30 &amp;&amp; a &lt;= 35) scan.add(a);\n        }\n        List&lt;Long&gt; got = new ArrayList&lt;&gt;();\n        for (Row r : byIndex) got.add((Long) r.get(ages.table(&quot;users&quot;).schema(), &quot;age&quot;));\n        Collections.sort(scan);\n        check(got.equals(scan) &amp;&amp; got.size() == 6, &quot;the range index returns the same 6 rows a scan would, in key order: &quot; + got);\n        check(ages.explain(&quot;users&quot;, Where.between(&quot;age&quot;, 30, 35)).startsWith(&quot;index range&quot;), &quot;and it says so: &quot; + ages.explain(&quot;users&quot;, Where.between(&quot;age&quot;, 30, 35)));\n        check(ages.explain(&quot;users&quot;, Where.eq(&quot;id&quot;, 5)).startsWith(&quot;primary key lookup&quot;), &quot;a primary key query is one hash lookup, not a scan&quot;);\n        check(ages.explain(&quot;users&quot;, Where.eq(&quot;name&quot;, &quot;u5&quot;)).startsWith(&quot;full scan&quot;), &quot;an unindexed column is a scan, and the planner admits it&quot;);\n        boolean backwardsIsEmpty;\n        try { backwardsIsEmpty = ages.select(&quot;users&quot;, Where.between(&quot;age&quot;, 35, 30)).isEmpty(); }\n        catch (RuntimeException e) { backwardsIsEmpty = false; }\n        check(backwardsIsEmpty, &quot;a range written backwards (35 to 30) finds nothing, as a scan would, instead of throwing&quot;);\n\n        // 6. a delete removes the row from the primary key map AND from every secondary index\n        ages.delete(&quot;users&quot;, Where.eq(&quot;id&quot;, 11));                       // age 31, inside the range above\n        check(ages.table(&quot;users&quot;).row(11L) == null, &quot;the deleted row is gone from the primary key map&quot;);\n        check(ages.select(&quot;users&quot;, Where.between(&quot;age&quot;, 30, 35)).size() == 5, &quot;and out of the range index&quot;);\n        check(ages.table(&quot;users&quot;).index(&quot;city&quot;).eq(&quot;Pune&quot;).size() == 39, &quot;and out of the equality index&quot;);\n        check(indexed(ages, &quot;users&quot;, &quot;age&quot;).size() == 39, &quot;no index still points at a row that is not there&quot;);\n\n        // 7. ROLLBACK puts everything back, including deleted rows, and a savepoint rolls back only part of it\n        Database tx = Main.sample();\n        tx.insert(&quot;users&quot;, 1, &quot;Asha&quot;, &quot;Pune&quot;, 31);\n        tx.insert(&quot;users&quot;, 2, &quot;Bela&quot;, &quot;Kochi&quot;, 42);\n        Txn t = tx.begin();\n        t.insert(&quot;users&quot;, 3, &quot;Chandra&quot;, &quot;Surat&quot;, 27);\n        int sp = t.savepoint();\n        t.delete(&quot;users&quot;, Where.eq(&quot;id&quot;, 1));\n        t.update(&quot;users&quot;, Where.eq(&quot;id&quot;, 2), Map.of(&quot;city&quot;, &quot;Surat&quot;));\n        check(t.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Surat&quot;)).size() == 2, &quot;inside the transaction the writes are visible to it&quot;);\n        t.rollbackTo(sp);\n        check(t.select(&quot;users&quot;, Where.all()).size() == 3, &quot;ROLLBACK TO SAVEPOINT put the deleted row back&quot;);\n        check(&quot;Kochi&quot;.equals(v(tx, &quot;users&quot;, 2L, &quot;city&quot;)), &quot;and undid the update, but kept the insert before the savepoint&quot;);\n        t.rollback();\n        check(tx.table(&quot;users&quot;).rowCount() == 2, &quot;ROLLBACK undid the rest: the insert is gone&quot;);\n        check(&quot;Asha&quot;.equals(v(tx, &quot;users&quot;, 1L, &quot;name&quot;)) &amp;&amp; &quot;Kochi&quot;.equals(v(tx, &quot;users&quot;, 2L, &quot;city&quot;)), &quot;every row is exactly as it was&quot;);\n        check(tx.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Surat&quot;)).isEmpty() &amp;&amp; tx.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Pune&quot;)).size() == 1,\n              &quot;and every index is exactly as it was&quot;);\n        check(t.state() == TxnState.ROLLED_BACK, &quot;the transaction says so&quot;);\n        try { t.insert(&quot;users&quot;, 9, &quot;Late&quot;, &quot;Pune&quot;, 20); check(false, &quot;a finished transaction must not accept more work&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;a finished transaction refuses more work: &quot; + e.getMessage()); }\n\n        // 8. a trigger that throws cannot break the commit, cannot stop the other triggers, and never sees a rolled-back row\n        Database trg = Main.sample();\n        AuditTrigger audit = new AuditTrigger();\n        SafeTrigger broken = trg.addTrigger(batch -&gt; { throw new RuntimeException(&quot;the index rebuilder is down&quot;); });\n        trg.addTrigger(audit);\n        trg.insert(&quot;users&quot;, 1, &quot;Asha&quot;, &quot;Pune&quot;, 31);\n        Txn doomed = trg.begin();\n        doomed.insert(&quot;users&quot;, 2, &quot;Never&quot;, &quot;Surat&quot;, 20);\n        doomed.rollback();\n        trg.insert(&quot;users&quot;, 3, &quot;Chandra&quot;, &quot;Kochi&quot;, 27);\n        check(trg.table(&quot;users&quot;).rowCount() == 2, &quot;the commits went through although a trigger threw every time&quot;);\n        check(broken.failures() == 2, &quot;the broken trigger&#x27;s failures are counted, not swallowed: &quot; + broken.failures());\n        check(audit.lines().size() == 2, &quot;the trigger AFTER the broken one still saw both batches&quot;);\n        check(audit.lines().toString().contains(&quot;Asha&quot;) &amp;&amp; !audit.lines().toString().contains(&quot;Never&quot;),\n              &quot;and it never saw the row that was rolled back&quot;);\n        Database busy = Main.sample();\n        AuditTrigger heard = new AuditTrigger();\n        busy.addTrigger(heard);\n        ExecutorService eight = Executors.newFixedThreadPool(8);\n        List&lt;Future&lt;?&gt;&gt; writers = new ArrayList&lt;&gt;();\n        for (int w = 0; w &lt; 8; w++) {\n            final long base = w * 1000L;\n            writers.add(eight.submit(() -&gt; { for (long i = 0; i &lt; 400; i++) busy.insert(&quot;orders&quot;, base + i, 1L, 10L, 20260901L); return null; }));\n        }\n        for (Future&lt;?&gt; f : writers) f.get();\n        eight.shutdown();\n        check(heard.lines().size() == 3200 &amp;&amp; busy.triggerFailures() == 0,\n              &quot;8 threads, 3,200 commits: the trigger, called from all of them at once, kept every line (&quot; + heard.lines().size() + &quot;)&quot;);\n\n        // 9. a deadlock: two transactions take two tables in opposite orders; one is aborted and leaves nothing behind\n        Database dl = Main.sample();\n        dl.configure(new StrictTableLocking(), 300);\n        CyclicBarrier both = new CyclicBarrier(2);\n        ExecutorService pair = Executors.newFixedThreadPool(2);\n        Future&lt;String&gt; a = pair.submit(() -&gt; Main.cross(dl, both, &quot;users&quot;, 100L, &quot;orders&quot;, 100L, 0));\n        Future&lt;String&gt; b = pair.submit(() -&gt; Main.cross(dl, both, &quot;orders&quot;, 101L, &quot;users&quot;, 101L, 100));\n        String ra = a.get(5, TimeUnit.SECONDS), rb = b.get(5, TimeUnit.SECONDS);\n        pair.shutdown();\n        int committed = (ra.startsWith(&quot;committed&quot;) ? 1 : 0) + (rb.startsWith(&quot;committed&quot;) ? 1 : 0);\n        int rows = dl.table(&quot;users&quot;).rowCount() + dl.table(&quot;orders&quot;).rowCount();\n        check(ra.startsWith(&quot;gave up&quot;) || rb.startsWith(&quot;gave up&quot;), &quot;the deadlock was broken by a timeout, not by hanging&quot;);\n        check(rows == committed * 2, &quot;every row present belongs to a transaction that committed (&quot; + rows + &quot; rows, &quot; + committed + &quot; committed)&quot;);\n        check(!dl.table(&quot;users&quot;).lock().isLocked() &amp;&amp; !dl.table(&quot;orders&quot;).lock().isLocked(), &quot;and both tables were released by the loser&quot;);\n\n        // 10. the isolation the lock buys: inside one transaction, two identical reads see the same database --\n        //     no value changes under it, no row appears in it. The same code with no locking shows all three anomalies.\n        for (Isolation.Anomaly anomaly : Isolation.Anomaly.values())\n            check(Isolation.run(new StrictTableLocking(), anomaly).stable(), &quot;strict two-phase locking: no &quot; + anomaly);\n        check(Isolation.run(new NoLocking(), Isolation.Anomaly.DIRTY_READ).second() == 2,\n              &quot;with no locking the reader sees a row from a transaction that never committed (a dirty read)&quot;);\n        check(Isolation.run(new NoLocking(), Isolation.Anomaly.NON_REPEATABLE_READ).second() == 0,\n              &quot;with no locking the row it just read moves out from under it (a non-repeatable read)&quot;);\n        check(Isolation.run(new NoLocking(), Isolation.Anomaly.PHANTOM).second() == 2,\n              &quot;with no locking a new row appears inside its range (a phantom)&quot;);\n\n        // 11. a statement is all or nothing, even inside a transaction: an UPDATE refused on its second row puts the\n        //     first row back, and the transaction stays open, so a COMMIT after it saves nothing half done\n        Database st = Main.sample();\n        st.table(&quot;users&quot;).addRule(new CheckRule((s, r) -&gt; !(&quot;Surat&quot;.equals(r.get(s, &quot;city&quot;)) &amp;&amp; (Long) r.get(s, &quot;age&quot;) &gt; 40),\n                                                &quot;nobody over 40 lives in Surat&quot;));\n        st.insert(&quot;users&quot;, 1, &quot;Asha&quot;, &quot;Pune&quot;, 31);\n        st.insert(&quot;users&quot;, 2, &quot;Bela&quot;, &quot;Pune&quot;, 42);\n        Txn move = st.begin();\n        try { move.update(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Pune&quot;), Map.of(&quot;city&quot;, &quot;Surat&quot;)); check(false, &quot;the second row must be refused&quot;); }\n        catch (ConstraintViolation e) { check(true, &quot;the UPDATE was refused on its second row: &quot; + e.getMessage()); }\n        move.commit();\n        check(&quot;Pune&quot;.equals(v(st, &quot;users&quot;, 1L, &quot;city&quot;)), &quot;the first row, already changed, was put back before the COMMIT&quot;);\n        check(st.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Pune&quot;)).size() == 2 &amp;&amp; st.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Surat&quot;)).isEmpty(),\n              &quot;and the city index agrees: two in Pune, none in Surat&quot;);\n\n        // 12. the commit log is written while the tables are held, so its order is the commit order even when the\n        //     first committer&#x27;s disk is slow, and replaying it rebuilds the live database. A failed append fails the COMMIT.\n        Database live = Main.sample();\n        live.configure(new StrictTableLocking(), 2000);\n        WalLog wal = new WalLog();\n        CountDownLatch secondDone = new CountDownLatch(1), firstHolds = new CountDownLatch(1);\n        live.setLog(batch -&gt; {\n            if (batch.get(0).kind() == ChangeKind.INSERT)      // the first commit&#x27;s disk is slow: it waits, up to 300 ms\n                try { secondDone.await(300, TimeUnit.MILLISECONDS); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            wal.append(batch);\n        });\n        Thread first = new Thread(() -&gt; { Txn t1 = live.begin(); t1.insert(&quot;users&quot;, 5, &quot;Asha&quot;, &quot;Pune&quot;, 31); firstHolds.countDown(); t1.commit(); });\n        Thread second = new Thread(() -&gt; {\n            try { firstHolds.await(); } catch (InterruptedException e) { return; }\n            live.update(&quot;users&quot;, Where.eq(&quot;id&quot;, 5), Map.of(&quot;city&quot;, &quot;Kochi&quot;));   // waits for the table, then commits\n            secondDone.countDown();\n        });\n        first.start(); second.start(); first.join(5000); second.join(5000);\n        Database rebuilt = WalLog.replay(wal.lines(), Main.sample());\n        check(&quot;Kochi&quot;.equals(v(live, &quot;users&quot;, 5L, &quot;city&quot;)) &amp;&amp; wal.lines().size() == 2 &amp;&amp; wal.lines().get(0).startsWith(&quot;INSERT&quot;),\n              &quot;the log holds the insert before the update, the order they committed in: &quot; + wal.lines());\n        check(&quot;Kochi&quot;.equals(v(rebuilt, &quot;users&quot;, 5L, &quot;city&quot;)), &quot;and replaying it rebuilds the same row: &quot; + rebuilt.table(&quot;users&quot;).allRows().get(0).show(rebuilt.table(&quot;users&quot;).schema()));\n        Database full = Main.sample();\n        full.setLog(batch -&gt; { throw new IllegalStateException(&quot;disk full&quot;); });\n        try { full.insert(&quot;users&quot;, 1, &quot;Asha&quot;, &quot;Pune&quot;, 31); check(false, &quot;a commit whose log append failed must not succeed&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;the log append failed, so the COMMIT failed: &quot; + e.getMessage()); }\n        check(full.table(&quot;users&quot;).rowCount() == 0 &amp;&amp; !full.table(&quot;users&quot;).lock().isLocked(), &quot;and the row was rolled back and the table released&quot;);\n\n        // 13. two usable indexes: the cost-based planner takes the one that examines fewer rows\n        Database cp = Main.sample();\n        cp.table(&quot;users&quot;).createIndex(&quot;name&quot;);\n        cp.insert(&quot;users&quot;, 1, &quot;Asha&quot;, &quot;Pune&quot;, 31);\n        cp.insert(&quot;users&quot;, 2, &quot;Bela&quot;, &quot;Pune&quot;, 42);\n        cp.insert(&quot;users&quot;, 3, &quot;Chandra&quot;, &quot;Kochi&quot;, 27);\n        int[] examined = { 0 };\n        Predicate counted = Where.and((s, r) -&gt; { examined[0]++; return true; }, Where.eq(&quot;city&quot;, &quot;Pune&quot;), Where.eq(&quot;name&quot;, &quot;Bela&quot;));\n        Txn q = cp.begin();\n        List&lt;Row&gt; found = CostPlanner.select(q, &quot;users&quot;, counted);\n        q.commit();\n        check(found.size() == 1 &amp;&amp; examined[0] == 1,\n              &quot;city = Pune AND name = Bela examined &quot; + examined[0] + &quot; row through the name index, not 2 through the city index&quot;);\n\n        // 14. ORDER BY two columns, one of them descending, then only the columns asked for\n        Database ob = Main.sample();\n        ob.insert(&quot;users&quot;, 1, &quot;Asha&quot;, &quot;Pune&quot;, 31);\n        ob.insert(&quot;users&quot;, 2, &quot;Bela&quot;, &quot;Pune&quot;, 42);\n        ob.insert(&quot;users&quot;, 3, &quot;Chandra&quot;, &quot;Kochi&quot;, 27);\n        ob.insert(&quot;users&quot;, 4, &quot;Devi&quot;, &quot;Kochi&quot;, 55);\n        Txn sorted = ob.begin();\n        List&lt;List&lt;Object&gt;&gt; names = OrderBy.select(sorted, &quot;users&quot;, List.of(&quot;name&quot;), Where.all(), &quot;city&quot;, &quot;age DESC&quot;);\n        List&lt;List&lt;Object&gt;&gt; byAge = OrderBy.select(sorted, &quot;users&quot;, List.of(&quot;age&quot;), Where.between(&quot;age&quot;, 30, 60), &quot;age&quot;);\n        sorted.commit();\n        check(names.equals(List.of(List.of(&quot;Devi&quot;), List.of(&quot;Chandra&quot;), List.of(&quot;Bela&quot;), List.of(&quot;Asha&quot;))),\n              &quot;ORDER BY city, age DESC, name only: Kochi before Pune, the older first in each: &quot; + names);\n        check(byAge.equals(List.of(List.of(31L), List.of(42L), List.of(55L))), &quot;a range read through the age index, ordered by age: &quot; + byAge);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Build me a small in-memory database. Tables with typed columns and a primary key, indexes so lookups and range queries are fast, constraints, and transactions that can be rolled back &mdash; and several clients hitting it at once. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (what makes a row valid, and what two clients are promised, come first). Main.java is far more than an hour of typing, so know the must-write core: about 250 lines. In typing order: ColType and Column, Schema, an immutable Row, Eq and Between, one TreeMap Index, Table (its key map, its one apply() and a three-if planner), the primary-key check inside the lock, Txn (the order at insert, the undo log, commit and rollback), Database with begin(), and a main with fifty threads on one primary key. Only if time is left: the rule interfaces, triggers with SafeTrigger, savepoints, EXPLAIN, and the LockPolicy and CommitLog seams &mdash; which is what the follow-ups below ask for.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Mid-round: &quot;a row in orders must name a real user, and a user with orders cannot be deleted.&quot;</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A foreign key is a new class behind the TableRule interface plus one addRule line; nothing in Table or Txn is opened. It is a TableRule and not a RowRule because it has to read another table, which is also why it runs inside the lock rather than before it. The rule is handed the transaction rather than the database, so its read of the parent table takes that table's lock, like any other read, and holds it to the end. So a parent row cannot be deleted out from under a child insert. The other direction is a second rule on the parent that counts the children before allowing a delete. Both refusals throw before anything is written, so the database is exactly as it was.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a foreign key -- a new rule handed in, and the reason a rule is given the TRANSACTION and not the map\n/**\n * A foreign key: this column must name a row that exists in the parent table. It is a TableRule because it has to\n * READ another table, and it reads through the transaction, so the parent table is locked for as long as this\n * transaction lives -- which is exactly why two transactions touching two tables in opposite orders can deadlock.\n */\nfinal class ForeignKeyRule implements TableRule {\n    private final String column, parentTable;\n    /** @param column the child column; parentTable the table whose primary key it must match. */\n    ForeignKeyRule(String column, String parentTable) { this.column = column; this.parentTable = parentTable; }\n    public void check(Txn txn, Table t, Row before, Row after) {\n        if (after == null) return;                                    // a delete in the child cannot break this\n        Object v = after.get(t.schema(), column);\n        if (v == null) return;                                        // null means &quot;no parent&quot;, which is allowed\n        if (txn.select(parentTable, Where.eq(txn.db().table(parentTable).schema().pkName(), v)).isEmpty())\n            throw new ConstraintViolation(t.name() + &quot;.&quot; + column + &quot; = &quot; + v + &quot; has no row in &quot; + parentTable);\n    }\n}\n\n/**\n * The other direction: do not delete a row that somebody still points at. Installed on the PARENT table, and it\n * scans the child through the transaction, so a child insert cannot slip in behind it.\n */\nfinal class RestrictDeleteRule implements TableRule {\n    private final String childTable, childColumn;\n    /** @param childTable the table that points here; childColumn the column that holds this table&#x27;s key. */\n    RestrictDeleteRule(String childTable, String childColumn) { this.childTable = childTable; this.childColumn = childColumn; }\n    public void check(Txn txn, Table t, Row before, Row after) {\n        if (after != null || before == null) return;                  // only a delete is our business\n        Object pk = before.pk(t.schema());\n        int kids = txn.select(childTable, Where.eq(childColumn, pk)).size();\n        if (kids &gt; 0) throw new ConstraintViolation(&quot;cannot delete &quot; + t.name() + &quot; &quot; + pk + &quot;: &quot; + kids + &quot; row(s) in &quot; + childTable);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two clients insert the same primary key at the same instant. Prove you cannot end up with two rows, or none.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between \"is this key free?\" and the write. Both checks happen inside the table's lock, held by the transaction from the first touch, so no other writer can run in that gap. The proof is a count rather than an argument: fifty threads wait on one latch and all insert the same key, and exactly one is told it succeeded while exactly one row exists. Fifty more threads insert fifty distinct keys at the same moment, and all fifty land &mdash; so the lock is not hiding a lost write. The last check is the one people forget: every secondary index must hold exactly those fifty keys, because a row and its index entries move together in one method or the database is quietly corrupt.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. fifty threads insert the SAME primary key at the same instant, and fifty more insert fifty distinct\n        //    keys: exactly one winner on the contested key, exact counts everywhere, and every index in step.\n        Database race = Main.sample();\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;Boolean&gt;&gt; same = new ArrayList&lt;&gt;(), distinct = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final int n = i;\n            same.add(pool.submit(() -&gt; { go.await(); return Main.tryInsert(race, &quot;users&quot;, 7L, &quot;racer&quot; + n, &quot;Pune&quot;, 30L); }));\n            distinct.add(pool.submi

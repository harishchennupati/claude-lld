<div class="top"><h1>In-memory Database</h1><span class="sub">LLD &middot; Java &middot; OpenJDK 21: demo, 14 failure tests and a 50-thread race pass</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>

<div class="wrap">

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Build me a small in-memory database. Tables with typed columns and a primary key, indexes so lookups and range queries are fast, constraints, and transactions that can be rolled back &mdash; and several clients hitting it at once. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>A database here is a box of tables. A table has a fixed shape &mdash; a list of columns, each with a type &mdash; and a pile of rows. One column is the primary key: its value names exactly one row. Clients insert rows, change them, delete them and ask for them back. The asking is the interesting part: by primary key (\"give me row 41\"), by another column (\"everyone in Pune\"), or by a range (\"everyone aged thirty to forty\"). None of those may turn into reading every row, so the table keeps indexes, which are just other maps pointing at the same rows. Writes can be grouped into a transaction that either all happens or none of it does, so there has to be a way to put things back. And several clients do all this at the same moment. That is where the two invariants live (rules that must be true at every instant): a primary key names exactly one row, ever; and no index may point at a row that is not there, or miss one that is.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that creates a table, inserts, queries three ways and rolls a transaction back. The interviewer is watching for, in this order: the questions you ask before typing (what makes a row valid, and what two clients are promised, are the first two); which classes exist and which one owns the rows; an insert end to end; what happens when two clients insert the same key at the same instant; where the rules that will change live &mdash; a new constraint, a new index, a new listener &mdash; so each is a new class and not an edit; and what the database looks like after a write is refused half way. Then the twists. A foreign key: a column that must name a row in another table. A savepoint: a mark inside a transaction you can roll back to. A query planner: the code that picks how to answer a query. Joins across two tables. MVCC: old versions kept so that readers never wait. A write-ahead log: every commit written to disk, and replayed after a restart. Sharding: the rows split across several databases.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 342\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">insert</text><g transform=\"translate(155 30)\"><rect width=\"245\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"122.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a row, typed, from a client</text><text x=\"122.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">four values in column order</text></g><path d=\"M400 57 H415\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(415 30)\"><rect width=\"245\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"122.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check what needs no table</text><text x=\"122.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">types, NOT NULL, CHECK: no lock yet</text></g><path d=\"M660 57 H675\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(675 30)\"><rect width=\"245\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"122.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take the table, check the key</text><text x=\"122.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">is this primary key still free?</text></g><path d=\"M920 57 H935\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(935 30)\"><rect width=\"245\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"122.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">write the row AND every index</text><text x=\"122.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one apply(), so they cannot drift</text></g><path d=\"M797 84 V95\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(642 95)\"><rect width=\"310\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"155.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refused: nothing written, no lock taken</text></g><text x=\"88\" y=\"176\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">commit</text><g transform=\"translate(155 148)\"><rect width=\"300\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">log the batch, then unlock</text><text x=\"150.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">tables held until the log has it</text></g><path d=\"M455 172 H475\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(475 148)\"><rect width=\"345\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"172.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">then tell the triggers, one batch</text><text x=\"172.5\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an audit line, a count</text></g><text x=\"845\" y=\"166\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the indexes were told long before, inside apply():</text><text x=\"845\" y=\"184\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">an index is state, a trigger is an announcement</text><text x=\"88\" y=\"238\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">rollback</text><g transform=\"translate(155 210)\"><rect width=\"300\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">replay the undo log backwards</text><text x=\"150.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">apply(after, before), newest first</text></g><path d=\"M455 234 H475\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(475 210)\"><rect width=\"345\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"172.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">then unlock every table</text><text x=\"172.5\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">rows and indexes exactly as before</text></g><text x=\"845\" y=\"228\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the triggers hear nothing at all: they are only</text><text x=\"845\" y=\"246\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">ever told about rows that committed</text><text x=\"88\" y=\"292\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">query</text><text x=\"155\" y=\"292\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">the row with id 41?  everyone in Pune?  everyone aged 30 to 40?  and which of those was a scan?</text><text x=\"615\" y=\"326\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">many clients at once: one primary key names exactly one row, ever, and no index may ever disagree with the rows</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Key-value, or tables with typed columns and a primary key?</td><td>Tables, fixed schema, one primary key</td><td>A Schema, a type check, and a row as cells in column order (moves 1, 5)</td></tr><tr><td>Which reads must be fast: by key, by a column, by range?</td><td>All three</td><td>A hash map on the key; secondary indexes in TreeMaps, maps kept sorted by key (move 5)</td></tr><tr><td>Transactions? Savepoints? Or one statement at a time?</td><td>Transactions with savepoints; a lone statement auto-commits</td><td>An undo log (the old version of every row the transaction changed) per transaction, and the order at the write (move 6)</td></tr><tr><td>What do two clients at the same instant get to assume?</td><td>Serialisable (as if the transactions ran one after another), by locking, and say what it costs</td><td>Strict two-phase locking (take each table at first touch, give all back at the end), one lock per table (moves 4, 7)</td></tr><tr><td>Lock the table or the row?</td><td>The table first; row locks are the named upgrade</td><td>One lock per table, held first touch to end (moves 4, 8)</td></tr><tr><td>When do indexes and listeners learn about a change?</td><td>Indexes with the row; listeners only after a commit</td><td>Index maintenance inside apply(); triggers after the unlock (move 6)</td></tr><tr><td>Does it have to survive a restart?</td><td>No: in memory, one process</td><td>No log yet; the follow-up writes one at COMMIT, before the unlock (move 12)</td></tr><tr><td>Joins, a planner, MVCC, sharding?</td><td>Out of scope, named</td><td>Each is one of the five twist moves (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Create and drop a table: typed columns, one primary key, NOT NULL, and a CHECK (a rule every row must pass) the caller hands in.</li>\n<li>Insert, update, delete and read rows, with the where-clause (the filter: which rows?) as an object rather than a string.</li>\n<li>Secondary indexes for equality and for ranges, buildable at any time over rows that already exist.</li>\n<li>Transactions: BEGIN, COMMIT, ROLLBACK, SAVEPOINT; a single statement runs in its own transaction.</li>\n<li>A write is refused by a duplicate key, a wrong type, a null, a broken CHECK or a foreign key.</li>\n<li>Triggers (code the database calls after a commit) hear about every committed change once, as one batch per transaction.</li>\n<li>Say which access path (key lookup, index or scan) a query used, so \"is this a scan?\" has an answer.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Many clients at once: one primary key names exactly one row, and no index may disagree with the rows.</li>\n<li>By primary key O(1); by an indexed value O(log n) plus one step per hit; a scan called a scan.</li>\n<li>Rules, triggers and the locking policy swappable without opening the table or the transaction.</li>\n<li>One source of truth: rows and indexes move together, through one method, or not at all.</li>\n<li>Nothing half-done: a refused statement (even one that already changed a row) and an abandoned transaction leave the database exactly as it was.</li>\n<li>Rollback costs what the transaction touched, never what the table holds.</li>\n<li>In memory, one process, no durability (say it; a write-ahead log is a follow-up).</li></ul></div></div>\n<div class=\"move\"><h3>One afternoon, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"197\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M197 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"275\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"137.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">14:02  insert user 41</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one hash put, two index inserts</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">about 0.3 microseconds of lock</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the trigger hears after the unlock</text></g><circle cx=\"487\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M487 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"275\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"137.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">14:05  two clients, id 41</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">both check, one writes</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the other: duplicate primary key</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one row, not two, and no lost row</text></g><circle cx=\"777\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M777 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"275\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"137.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">14:06  orders 14:00 to 14:05</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">a range read on the placed_at index</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">6 rows examined of 100,000</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the same query on total: a scan</text></g><circle cx=\"1067\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1067 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"275\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"137.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">14:07  a client disappears</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">3 orders deleted in a transaction</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">rollback puts all three back,</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">and their index entries with them</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> tables have a fixed schema and one primary key; values are long, String and boolean, and a wrong type is refused before anything is locked; reads are by key, by an indexed value or by range, and anything else is a scan I will admit to. One lock per table, taken at the first touch and held to the end of the transaction. That makes it serialisable: no dirty reads, no non-repeatable reads, no phantoms (no value that is later rolled back, no row that changes, no row that appears, between two reads). It also makes deadlock possible: two transactions each waiting for a table the other holds. In memory, one process. Named as out of scope: durability, MVCC, joins, a cost-based planner, sharding &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, elevator, BookMyShow) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On this problem two moves carry most of the weight: move 5, because a database is nothing but the right collection behind each question, and move 6, because the order of operations is what a transaction actually is.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a DATABASE holds TABLES; a TABLE has a SCHEMA of COLUMNS, ROWS and INDEXES; a TRANSACTION collects UNDO ENTRIES; a RULE checks; a TRIGGER is told</text><g transform=\"translate(25 110)\"><rect width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Database</text><text x=\"75.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">tables, triggers</text></g><path d=\"M100.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(190 110)\"><rect width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Table</text><text x=\"75.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">rows, indexes, lock</text></g><path d=\"M265.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(355 110)\"><rect width=\"145\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"72.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Schema</text><text x=\"72.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">columns, the key</text></g><path d=\"M427.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(515 110)\"><rect width=\"120\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"60.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Row</text><text x=\"60.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the cells</text></g><path d=\"M575.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(650 110)\"><rect width=\"130\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"65.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Index</text><text x=\"65.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">value to keys</text></g><path d=\"M715.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(795 110)\"><rect width=\"155\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"77.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Transaction</text><text x=\"77.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">undo log, locks</text></g><path d=\"M872.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(965 110)\"><rect width=\"115\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"57.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Rule</text><text x=\"57.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state</text></g><path d=\"M1022.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1095 110)\"><rect width=\"115\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"57.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Predicate</text><text x=\"57.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a question</text></g><path d=\"M1152.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a check, a question, a lambda</text></svg></div><div class=\"move\"><p>Reading the paragraph again: a <b>database</b> holds <b>tables</b>; a table has a <b>schema</b> of <b>columns</b>, a pile of <b>rows</b> and some <b>indexes</b>; a <b>transaction</b> groups writes and collects <b>undo entries</b>; a <b>rule</b> decides whether a row is allowed; a <b>trigger</b> is told what changed. A table has rows, indexes and a lock, all of which change: a class. A row is cells that never change once written &mdash; an update builds a new row rather than editing one, and that single decision is what makes undo free later. A schema is fixed at create time, so one instance is shared by every row of the table. An index has its own map: a class. A transaction has an undo log and a set of held tables: a class. A rule and a where-clause have no state at all &mdash; they are questions &mdash; so they are interfaces, and a lambda is a valid implementation of either.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 332\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 20)\"><rect width=\"320\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is this row allowed?</text><text x=\"160.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M345 41 H415\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(415 20)\"><rect width=\"420\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RowRule (before the lock) / TableRule (in it)</text><text x=\"210.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M835 41 H905\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(905 20)\"><rect width=\"300\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rule.check(...): throws or returns</text><text x=\"150.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(25 72)\"><rect width=\"320\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">find the rows that match</text><text x=\"160.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M345 93 H415\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(415 72)\"><rect width=\"420\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Table  (owns the rows and the indexes)</text><text x=\"210.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M835 93 H905\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(905 72)\"><rect width=\"300\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">table.select(predicate)</text><text x=\"150.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(25 124)\"><rect width=\"320\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">write the row and its indexes</text><text x=\"160.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M345 145 H415\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(415 124)\"><rect width=\"420\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Table  (the one door for every write)</text><text x=\"210.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M835 145 H905\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(905 124)\"><rect width=\"300\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">table.apply(before, after)</text><text x=\"150.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(25 176)\"><rect width=\"320\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">remember how to undo it</text><text x=\"160.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M345 197 H415\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(415 176)\"><rect width=\"420\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Txn  (owns the undo log and the locks)</text><text x=\"210.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M835 197 H905\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(905 176)\"><rect width=\"300\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">txn.insert / update / delete</text><text x=\"150.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(25 228)\"><rect width=\"320\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">tell whoever is listening</text><text x=\"160.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M345 249 H415\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(415 228)\"><rect width=\"420\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Database  (owns the triggers)</text><text x=\"210.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M835 249 H905\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(905 228)\"><rect width=\"300\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">db.publish(batch)</text><text x=\"150.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"300\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb that touches two classes goes to the one that owns both: the transaction owns the undo log and the locks, so it runs the steps</text><text x=\"615\" y=\"319\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and a delete is not a special verb: it is apply(row, null), which is why an undo is apply(after, before) and nothing else</text></svg></div><div class=\"move\"><p>\"Is this row allowed?\" touches nothing: it reads a row and either throws or returns, so it belongs to a pure rule. \"Find the rows that match\" touches the rows and the indexes, so it belongs to the table: <code>table.select(predicate)</code>. \"Write the row and its indexes\" touches the same state, so it is the table again. It is deliberately one method, <code>table.apply(before, after)</code>, so there is exactly one place in the system where a row and its indexes can get out of step. \"Remember how to undo it\" touches the undo log and the locks, which the transaction owns, so the transaction runs the steps. \"Tell whoever is listening\" touches the trigger list, which the database owns. Notice what is not a separate verb: a delete is <code>apply(row, null)</code> and an undo is <code>apply(after, before)</code> &mdash; the same door, with the arguments swapped.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 332\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 95)\"><rect width=\"250\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Database / Table</text><text x=\"125.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure, addRule, addTrigger</text></g><path d=\"M275 140 H330 V37 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 16)\"><rect width=\"290\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RowRule</text><text x=\"145.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">judged from the row alone</text></g><g transform=\"translate(740 16)\"><rect width=\"465\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"232.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TypeRule / NotNullRule / CheckRule</text><text x=\"232.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 37 H680\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M275 140 H330 V89 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 68)\"><rect width=\"290\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TableRule</text><text x=\"145.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">has to read a table</text></g><g transform=\"translate(740 68)\"><rect width=\"465\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"232.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PrimaryKeyRule / ForeignKeyRule</text><text x=\"232.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 89 H680\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M275 140 H330 V141 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 120)\"><rect width=\"290\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Trigger / CommitLog</text><text x=\"145.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who is told; what must survive</text></g><g transform=\"translate(740 120)\"><rect width=\"465\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"232.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AuditTrigger / CityCount;  WalLog (page 05)</text><text x=\"232.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 141 H680\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M275 140 H330 V193 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 172)\"><rect width=\"290\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LockPolicy</text><text x=\"145.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who may touch a table</text></g><g transform=\"translate(740 172)\"><rect width=\"465\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"232.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">StrictTableLocking / NoLocking</text><text x=\"232.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 193 H680\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M275 140 H330 V245 H390\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 224)\"><rect width=\"290\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"145.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where time comes from</text></g><g transform=\"translate(740 224)\"><rect width=\"465\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"232.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::currentTimeMillis / a test's long[]</text><text x=\"232.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M740 245 H680\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"300\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The table never builds a rule, so a foreign key is a new class and one addRule line</text><text x=\"615\" y=\"319\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one wrapper sits over the others: SafeTrigger(t) wraps EVERY trigger, so a listener written next year cannot break a commit</text></svg></div><div class=\"move\"><p>What makes a row valid will change: a CHECK today, a foreign key in five minutes, a unique second column after that. Who is told will change: an audit log today, a materialised count (a total kept up to date as rows change) tomorrow. What must survive a restart will change: nothing today, a log on disk later. How clients are kept out of each other's way will change: a table lock today, row locks or MVCC later. Each becomes a small interface the table or the database is <i>given</i> and never builds. There are two rule interfaces, not one, and the split is the interesting part. A <code>RowRule</code> can be judged by looking at the row alone, so it runs before any lock is taken. A <code>TableRule</code> has to read a table (is this key free? does the parent row exist?), so it can only run inside the lock. This is where the patterns come from: a swappable rule behind an interface is <b>Strategy</b>; something that announces a change without knowing who is listening is <b>Observer</b>; and the wrapper the database puts around every trigger it is handed, so a broken listener cannot break a commit, is <b>Decorator</b>. I do them; I do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 212\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 30)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client A: INSERT id 41</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">id 41 free? yes</text></g><g transform=\"translate(25 112)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client B: INSERT id 41</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">id 41 free? yes</text></g><g transform=\"translate(350 71)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">users.byPk</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no row 41 yet</text></g><path d=\"M225 52 H350 V71\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M225 134 H350 V115\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"288\" y=\"42\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"288\" y=\"162\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"575\" y=\"20\" width=\"300\" height=\"145\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"725\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"725\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both were told the key was free</text><text x=\"725\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both write: one row is silently lost,</text><text x=\"725\" y=\"110\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">and two clients were told they wrote it</text><text x=\"725\" y=\"145\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: check and write as ONE step</text><g transform=\"translate(905 45)\"><rect width=\"300\" height=\"95\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"41.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Table.lock</text><text x=\"150.0\" y=\"57.5\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">check the key, write the row and every index</text></g><text x=\"1055\" y=\"178\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock lives where the shared state lives:</text><text x=\"1055\" y=\"196\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one lock per TABLE, so two tables never wait</text></svg></div><div class=\"move\"><p>Two clients insert the same primary key at the same instant. Both ask \"is 41 free?\", both are told yes, both write, and one row is simply gone &mdash; while both clients were told their insert succeeded, which is worse than an error. So the check and the write have to be one step, in the class that owns the rows: the table. The same gap eats an update: two clients read a counter as 100, both write 101, and one increment vanishes. The lock is per <i>table</i>, not per database, which is the whole trick &mdash; a thousand tables take writes in parallel and never wait for each other. And it is held from the first touch until the transaction ends, not just for one statement. That is what makes the undo log safe: nobody else can change a row between the moment this transaction saved its before-image (the row as it was before the change) and the moment it puts it back.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 332\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 18)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">give me row 41</text><text x=\"175.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M375 36 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 18)\"><rect width=\"470\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"235.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">HashMap&lt;pk, Row&gt;</text><text x=\"235.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M900 36 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 18)\"><rect width=\"250\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(25 62)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">everyone in Pune</text><text x=\"175.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M375 80 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 62)\"><rect width=\"470\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"235.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TreeMap&lt;value, LinkedHashSet&lt;pk&gt;&gt;</text><text x=\"235.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M900 80 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 62)\"><rect width=\"250\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(log n) + 1 per hit</text></g><g transform=\"translate(25 106)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">everyone aged 30 to 40</text><text x=\"175.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M375 124 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 106)\"><rect width=\"470\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"235.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same TreeMap, subMap(lo, hi)</text><text x=\"235.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M900 124 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 106)\"><rect width=\"250\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(log n) + 1 per hit</text></g><g transform=\"translate(25 150)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how do I put this transaction back?</text><text x=\"175.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M375 168 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 150)\"><rect width=\"470\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"235.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ArrayList&lt;UndoEntry&gt;, appended</text><text x=\"235.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M900 168 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 150)\"><rect width=\"250\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) add, O(k) undo</text></g><g transform=\"translate(25 194)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what must the triggers be told?</text><text x=\"175.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M375 212 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 194)\"><rect width=\"470\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"235.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ArrayList&lt;Change&gt;, one per row change</text><text x=\"235.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M900 212 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 194)\"><rect width=\"250\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) append</text></g><g transform=\"translate(25 238)\"><rect width=\"350\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which table is called users?</text><text x=\"175.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M375 256 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 238)\"><rect width=\"470\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"235.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ConcurrentHashMap&lt;name, Table&gt;</text><text x=\"235.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M900 256 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 238)\"><rect width=\"250\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><text x=\"615\" y=\"300\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the index holds primary keys, not rows, so a row moves without the index having to be rebuilt: one map is the truth, the rest are pointers</text><text x=\"615\" y=\"319\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and a row with null in an indexed column is simply not in that index, so a query for it falls back to a scan -- say that out loud</text></svg></div><div class=\"move\"><p>\"Give me row 41\" is a hash map from primary key to row: one lookup at any table size. \"Everyone in Pune\" is a secondary index: a map from a column value to the primary keys that hold it. It is a TreeMap rather than a HashMap for one reason: \"everyone aged thirty to forty\" is then a <code>subMap</code> (the slice of the sorted map between two keys) instead of a scan. The index holds keys, not rows, so a row can be replaced without the index being rebuilt. \"How do I put this transaction back?\" is a list of before-images, appended, replayed backwards. \"What must the triggers be told?\" is a second list, one entry per row change, published only if the transaction commits. The where-clause is a shape too: <code>Eq</code>, <code>Between</code> and <code>And</code> are objects rather than lambdas precisely so the planner can <i>read</i> them and reach for an index. A lambda predicate is always a scan, and the code says so.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 248\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 30)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ACTIVE</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holding its tables</text></g><g transform=\"translate(300 20)\"><rect width=\"190\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">COMMITTED</text><text x=\"95.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">log, unlock, publish</text></g><g transform=\"translate(300 88)\"><rect width=\"190\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ROLLED_BACK</text><text x=\"95.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">undo, then unlock</text></g><path d=\"M215 45 H300\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M215 62 H300 V88\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"258\" y=\"148\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">any operation after the end throws</text><rect x=\"545\" y=\"14\" width=\"665\" height=\"200\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"877\" y=\"38\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order at an insert, and why it is this order</text><text x=\"560\" y=\"62\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 build the row and check types, NOT NULL, CHECK -- no lock held, nothing written</text><text x=\"560\" y=\"84\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 take the table's lock, and keep it until the transaction ends</text><text x=\"560\" y=\"106\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 now the checks that must READ the table: is this primary key free? does the parent row exist?</text><text x=\"560\" y=\"128\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4 only now apply: the row and every index, in one method that cannot fail half way</text><text x=\"560\" y=\"150\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5 keep the before-image; at commit: the log, then unlock, then the triggers</text><text x=\"560\" y=\"172\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a refused write leaves every row and every index exactly as they were;</text><text x=\"560\" y=\"194\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">an abandoned transaction is put back from its own undo log, newest change first</text><text x=\"615\" y=\"234\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">an update or delete of many rows checks them one by one inside the lock; if row 3 is refused, rows 1 and 2 are undone too</text></svg></div><div class=\"move\"><p>A transaction is ACTIVE, then COMMITTED or ROLLED_BACK, and anything asked of it afterwards throws rather than quietly doing nothing. Writing that down forces the question the interviewer will ask &mdash; what is the state of the database when a write is refused half way? &mdash; and the answer is the five-step order in the box. Each step is there for a reason you should be able to give. The cheap checks come first so that most refusals never reach the table at all. The checks that must read the table come after the lock because reading and writing have to be one step. Apply is one method so a row and its indexes cannot move separately. An UPDATE of many rows adds one case: row 3 can be refused after rows 1 and 2 were written. So a statement notes where the undo log stood when it began, and a refusal undoes back to that mark; the transaction stays open, and a later COMMIT saves nothing half done. At COMMIT the batch goes to the log first, while the tables are still held, so a log sees commits in the order they happened. Only after the unlock are the triggers told: a listener must never run while a table is held, and must never hear about a row that was later rolled back. That is why an index (state, rolled back with the row) and a trigger (an announcement about committed rows only) are told at different moments.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one table's transactions happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 315\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 20)\"><rect width=\"555\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"277.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about 0.3 microseconds a statement</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one hash lookup: is this primary key taken?</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one hash put: the row</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">two TreeMap inserts, about 17 compares each</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">a five-statement transaction: about 3 microseconds</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">measured on a laptop; held from the first touch to COMMIT</text></g><path d=\"M580 95 H650\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"85\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(650 20)\"><rect width=\"555\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"277.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: milliseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">building and type-checking the row: before the lock</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the trigger that refreshes a search index: 5 ms, after</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the client thinking between two statements: seconds</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">-- which is the only reason the lock is ever hot</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">(a log on disk must flush before the unlock: card 11)</text></g><text x=\"615\" y=\"200\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">ten clients commit a five-statement transaction on the same table at the same instant</text><g transform=\"translate(25 215)\"><rect width=\"107\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.5\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 1</text><text x=\"53.5\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(144 215)\"><rect width=\"107\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.5\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 2</text><text x=\"53.5\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 3 us</text></g><g transform=\"translate(263 215)\"><rect width=\"107\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.5\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 3</text><text x=\"53.5\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 6 us</text></g><g transform=\"translate(382 215)\"><rect width=\"107\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.5\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 4</text><text x=\"53.5\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 9 us</text></g><g transform=\"translate(501 215)\"><rect width=\"107\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.5\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 5</text><text x=\"53.5\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 12 us</text></g><g transform=\"translate(620 215)\"><rect width=\"107\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.5\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 6</text><text x=\"53.5\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 15 us</text></g><g transform=\"translate(739 215)\"><rect width=\"107\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.5\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 7</text><text x=\"53.5\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 18 us</text></g><g transform=\"translate(858 215)\"><rect width=\"107\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.5\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 8</text><text x=\"53.5\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 21 us</text></g><g transform=\"translate(977 215)\"><rect width=\"107\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.5\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 9</text><text x=\"53.5\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 24 us</text></g><g transform=\"translate(1096 215)\"><rect width=\"107\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.5\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">client 10</text><text x=\"53.5\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 27 us</text></g><text x=\"615\" y=\"283\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tenth client waits about 27 microseconds for the table; its triggers then run after the unlock, on its own time:</text><text x=\"615\" y=\"301\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one at a time is true, and nobody can tell, as long as nothing slow is allowed inside the lock -- so never hold a transaction open across a network round trip</text></svg></div><div class=\"move\"><p>Inside the lock, one statement does a hash lookup, a hash put and one tree insert per secondary index. Measured on a laptop, that is about 0.3 microseconds. A five-statement transaction holds the table for about 3, counting the hand-over of the lock from one thread to the next. Everything expensive is outside. The row is built and type-checked before the lock is taken, and the triggers (an audit line, a search-index refresh) run after the commit released it, each wrapped so it cannot throw into the caller. Ten clients committing on the same table at the same instant means the tenth waits about 27 microseconds, which nobody notices. One line in that picture is not an optimisation detail: reads take the lock too, and hold it to the end of the transaction. That looks like waste until you name what it buys: two identical queries inside one transaction see the same database. That is what the word <i>isolation</i> means, and card 5 on page 05 shows what each cheaper promise lets back in.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 266\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"232\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per table: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a statement holds the lock about 0.3 us; a five-statement transaction, 3 us</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">measured, ten clients: about 300,000 transactions a second on one table</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a chatty client that keeps a transaction open across two round trips</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">holds it 200 us instead, and the same table drops to 5,000 a second</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">reads take the lock too, so a read-heavy table is what hurts first</text><text x=\"35\" y=\"186\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">and the second budget, because this is memory: measured, a row is</text><text x=\"35\" y=\"210\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">about 200 bytes, each index 50 more -- 1 GB holds about 3 million rows</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"605\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"302.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 keep the lock short, hold nothing slow</text><text x=\"302.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: validate before it, publish after it</text></g><g transform=\"translate(600 108)\"><rect width=\"605\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"302.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 one lock per row, taken in sorted order</text><text x=\"302.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two writers on different rows never meet -- but phantoms come back</text></g><g transform=\"translate(600 158)\"><rect width=\"605\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"302.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 versions per row (MVCC): readers never block</text><text x=\"302.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a reader takes a snapshot; the price: old versions to clean up</text></g></svg></div><div class=\"move\"><p>A third of a mi

t(() -&gt; { go.await(); return Main.tryInsert(race, &quot;orders&quot;, 1000L + n, 7L, 50L, 20260901L); }));\n        }\n        go.countDown();\n        int wonSame = 0, wonDistinct = 0;\n        for (Future&lt;Boolean&gt; f : same) if (f.get()) wonSame++;\n        for (Future&lt;Boolean&gt; f : distinct) if (f.get()) wonDistinct++;\n        pool.shutdown();\n        check(wonSame == 1, &quot;exactly one of 50 transactions was told it inserted the contested key (was &quot; + wonSame + &quot;)&quot;);\n        check(race.table(&quot;users&quot;).rowCount() == 1, &quot;and exactly one row carries that key&quot;);\n        check(wonDistinct == 50 &amp;&amp; race.table(&quot;orders&quot;).rowCount() == 50, &quot;50 distinct keys: 50 accepted, 50 rows, nothing lost&quot;);\n        check(race.table(&quot;orders&quot;).index(&quot;user_id&quot;).eq(7L).size() == 50, &quot;the secondary index holds all 50 primary keys&quot;);\n        check(indexed(race, &quot;orders&quot;, &quot;placed_at&quot;).size() == 50, &quot;the second index holds them too: no index drifted from the rows&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock per table. Have you serialised the database? And how big can this thing get?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Per table, not per database, so a thousand tables take writes in parallel. Inside the lock one statement is a hash lookup, a hash put and one tree insert per index: about 0.3 microseconds, measured. A five-statement transaction holds the table for about 3, so one table takes about 300,000 of them a second. The number that hurts is the client that runs BEGIN and then waits for two network round trips before COMMIT. That holds the table for two hundred microseconds and drops it to five thousand a second, which is why rung one is keeping the lock short rather than any data structure. Rung two is the code below, a lock per row taken in sorted order. Its honest cost: a table lock also stopped rows from <i>appearing</i>, so phantoms come back unless the range itself is locked; rung three is the next card. The other ceiling is memory, because that is all there is here: measured, about 200 bytes a row plus 50 per index, so a gigabyte holds about three million rows with two indexes. Past that the answer is not a lock but sharding by primary key: each database owns a slice of the keys. A transaction that spans two shards then needs two-phase commit (every shard first promises it can commit, then all of them do), so COMMIT can now fail.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: row-level locks -- the next rung, and the phantom it lets back in\n/**\n * A lock per row instead of a lock per table: two transactions writing different rows of one table never wait.\n * The interface has to widen -- a key is now part of the request -- and one guarantee is lost: a table lock also\n * stopped rows from APPEARING, so with row locks a repeated range query can return a new row (a phantom) unless\n * the range itself is locked. Multi-key requests are taken in sorted order, which is how you avoid deadlock.\n */\nfinal class KeyLocks {\n    private final ConcurrentHashMap&lt;String, ReentrantLock&gt; locks = new ConcurrentHashMap&lt;&gt;();\n    /** Take one row&#x27;s lock, waiting at most timeoutMs. */\n    boolean acquire(String table, Object pk, long timeoutMs) {\n        ReentrantLock l = locks.computeIfAbsent(table + &quot;#&quot; + pk, k -&gt; new ReentrantLock());\n        try { return l.tryLock(timeoutMs, TimeUnit.MILLISECONDS); }\n        catch (InterruptedException e) { Thread.currentThread().interrupt(); return false; }\n    }\n    /** Give one row&#x27;s lock back. */\n    void release(String table, Object pk) { locks.get(table + &quot;#&quot; + pk).unlock(); }\n    /** Take several rows in one agreed order, so two transactions wanting the same pair cannot deadlock. */\n    boolean acquireAll(String table, List&lt;Object&gt; pks, long timeoutMs) {\n        List&lt;Object&gt; sorted = new ArrayList&lt;&gt;(pks);\n        sorted.sort((a, b) -&gt; Index.cmp(a, b));\n        List&lt;Object&gt; taken = new ArrayList&lt;&gt;();\n        for (Object pk : sorted) {\n            if (!acquire(table, pk, timeoutMs)) { for (Object done : taken) release(table, done); return false; }\n            taken.add(pk);\n        }\n        return true;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>4 &middot; My reporting queries are queueing behind every writer. Give me readers that never wait.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Stop making readers take a lock at all: that is MVCC, and it is what every real database ended up doing. Every key keeps a chain of versions stamped with the commit number that wrote it, and a writer appends a new version instead of overwriting, so nothing a reader is looking at is ever changed under it. A reader takes a snapshot &mdash; the commit number at the moment it starts &mdash; and reads the newest version at or before it, so it never waits for a writer and never sees a half-finished transaction. A delete is a version too, a tombstone (a marker saying the row is gone from this commit on), which is how an older snapshot still sees a dropped row. Name the two costs before the interviewer does. First, dead versions pile up until something collects them, which is what <code>vacuum</code> is for (an LSM store, built from append-only sorted files, deletes with the same tombstones and calls its vacuum compaction). Second, two transactions can each commit against the same snapshot, so snapshot isolation is not serialisable. The example for that last one is write skew &mdash; two transactions read the same two rows, each changes a different one, and together they break an invariant neither broke alone.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: MVCC -- versions per row, so a reader never waits behind a writer\n/**\n * Multi-version concurrency control, small enough to read. Every key keeps a chain of versions stamped with the\n * commit number that created them. A reader takes a snapshot -- the commit number at its start -- and always\n * reads the newest version older than that, so it never blocks and never sees a half-finished transaction.\n * What it costs: old versions are garbage that something has to collect, and two transactions can both commit\n * against the same snapshot (write skew), which is why snapshot isolation is not serialisable.\n */\nfinal class MvccStore {\n    /** One committed value of one key, stamped with the commit that wrote it. */\n    private record Version(long at, String value, boolean deleted) {}\n    private final Map&lt;String, List&lt;Version&gt;&gt; chains = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicLong commits = new AtomicLong();\n    /** A reader&#x27;s snapshot: everything committed up to now is visible, everything later is not. */\n    long snapshot() { return commits.get(); }\n    /** The value this snapshot sees: the newest version at or before it. A reader never waits for a writer&#x27;s\n     *  transaction; the only wait is this key&#x27;s monitor, held for the length of one list append. */\n    String read(String key, long snapshot) {\n        List&lt;Version&gt; chain = chains.get(key);\n        if (chain == null) return null;\n        String seen = null;\n        synchronized (chain) {\n            for (Version v : chain) if (v.at() &lt;= snapshot) seen = v.deleted() ? null : v.value();\n        }\n        return seen;\n    }\n    /** Commit a new version. Readers already running keep reading the old one. */\n    void write(String key, String value) { append(key, value, false); }\n    /** Commit a deletion as a version, so a reader with an older snapshot still sees the row. */\n    void delete(String key) { append(key, null, true); }\n    private void append(String key, String value, boolean deleted) {\n        List&lt;Version&gt; chain = chains.computeIfAbsent(key, k -&gt; new ArrayList&lt;&gt;());\n        synchronized (chain) { chain.add(new Version(commits.incrementAndGet(), value, deleted)); }\n    }\n    /** Drop versions no live snapshot can still need. This is the garbage collector MVCC buys you. */\n    int vacuum(long oldestLiveSnapshot) {\n        int dropped = 0;\n        for (List&lt;Version&gt; chain : chains.values())\n            synchronized (chain) {\n                int keep = 0;\n                for (int i = 0; i &lt; chain.size(); i++) if (chain.get(i).at() &lt;= oldestLiveSnapshot) keep = i;\n                while (keep-- &gt; 0) { chain.remove(0); dropped++; }\n            }\n        return dropped;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>5 &middot; What isolation level is this? Show me a dirty read, a non-repeatable read and a phantom.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It is SERIALIZABLE, and it gets there the crude way. A transaction takes a whole table the first time it touches it and holds it to the end, so nobody can change a row it read or add a row to a range it scanned. The three anomalies are three things one transaction can see: a <b>dirty read</b> is a value written by a transaction that later rolls back; a <b>non-repeatable read</b> is the same row read twice with two different values; a <b>phantom</b> is the same range read twice with a row in it that was not there before. <code>Isolation.run</code> plays each one out with two threads &mdash; a reader counts the rows in Pune, a writer is let loose, the reader counts again &mdash; under both lock policies. With <code>StrictTableLocking</code> the counts are 1 then 1 all three times; with <code>NoLocking</code> they are 1 then 2, 1 then 0 and 1 then 2; test 10 asserts both. Every weaker level keeps the tables it WROTE locked to the end and differs only in its reads. READ UNCOMMITTED takes no read locks, so it allows dirty reads. READ COMMITTED releases a table it only READ at the end of each statement, which lets non-repeatable reads back in. REPEATABLE READ keeps read locks to the end but on rows, not the table, which is exactly why phantoms come back. <code>NoLocking</code> is worse than all four: it drops the write locks too, which is how the demo loses most of its fifty updates.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: isolation levels -- what strict two-phase locking gives you, and what each weaker level lets back in\n/**\n * The three anomalies an interviewer names, each as a scenario you can run twice: once with the lock policy this\n * design ships with, once with no locking at all. A reader begins a transaction, counts the rows in Pune, lets a\n * writer loose, and counts again. Under StrictTableLocking the writer cannot have the table until the reader\n * commits, so both counts agree. Under NoLocking the writer lands in the middle of the reader and they differ.\n *\n * &lt;p&gt;The four SQL isolation levels, said in terms of this code. Every level keeps a table it WROTE locked to the\n * end; only the reads differ. READ UNCOMMITTED: reads take no lock, so you can see a write that is rolled back a\n * moment later (a dirty read). NoLocking is worse than any level: it drops the write locks too, so updates are lost.\n * READ COMMITTED: a table that was only READ is released at the end of the statement, which lets non-repeatable\n * reads back in. REPEATABLE READ keeps read locks to the end but on rows, not the table, so rows can still APPEAR\n * between two reads (a phantom). SERIALIZABLE is what Main already does: a table lock also stops inserts.\n */\nfinal class Isolation {\n    private Isolation() {}\n    /** Which anomaly the scenario tries to produce. */\n    enum Anomaly { DIRTY_READ, NON_REPEATABLE_READ, PHANTOM }\n    /** One reader&#x27;s two counts of the same query. Equal counts mean the anomaly did not happen. */\n    record Reads(int first, int second) {\n        /** True if the transaction saw the same database twice, which is the whole promise of isolation. */\n        boolean stable() { return first == second; }\n    }\n    /**\n     * Run one scenario under one lock policy and report what the reader counted before and after the writer ran.\n     * Nothing here waits forever: the writer is given 300 ms to get in, which is all it needs when it can.\n     */\n    static Reads run(LockPolicy policy, Anomaly anomaly) throws Exception {\n        Database db = Main.sample();\n        db.configure(policy, 2000);\n        db.insert(&quot;users&quot;, 1, &quot;Asha&quot;, &quot;Pune&quot;, 31);\n        CountDownLatch started = new CountDownLatch(1), wrote = new CountDownLatch(1), readerDone = new CountDownLatch(1);\n        Thread writer = new Thread(() -&gt; {\n            started.countDown();\n            Txn w = db.begin();\n            try {\n                switch (anomaly) {\n                    case DIRTY_READ           -&gt; w.insert(&quot;users&quot;, 2, &quot;Never&quot;, &quot;Pune&quot;, 20);   // never committed\n                    case NON_REPEATABLE_READ  -&gt; w.update(&quot;users&quot;, Where.eq(&quot;id&quot;, 1), Map.of(&quot;city&quot;, &quot;Kochi&quot;));\n                    case PHANTOM              -&gt; w.insert(&quot;users&quot;, 2, &quot;Bela&quot;, &quot;Pune&quot;, 42);\n                }\n                if (anomaly != Anomaly.DIRTY_READ) w.commit();\n            } catch (RuntimeException e) { /* it waited for the table and gave up: that is the lock doing its job */ }\n            wrote.countDown();\n            if (anomaly == Anomaly.DIRTY_READ) {\n                try { readerDone.await(3, TimeUnit.SECONDS); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n                w.rollback();                                         // so the row the reader may have seen never existed\n            }\n        });\n        Txn reader = db.begin();\n        int first = reader.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Pune&quot;)).size();\n        writer.start();\n        started.await();\n        wrote.await(300, TimeUnit.MILLISECONDS);                      // under strict locking it cannot get in, and that is the point\n        int second = reader.select(&quot;users&quot;, Where.eq(&quot;city&quot;, &quot;Pune&quot;)).size();\n        reader.commit();\n        readerDone.countDown();\n        writer.join(5000);\n        return new Reads(first, second);\n    }\n    /** The same scenario as one line for a demo print. */\n    static String describe(LockPolicy policy, String label, Anomaly anomaly) throws Exception {\n        Reads r = run(policy, anomaly);\n        return String.format(&quot;%-12s %-20s reader counted %d then %d  %s&quot;, label, anomaly, r.first(), r.second(),\n            r.stable() ? &quot;-- the same database twice&quot; : &quot;&lt;-- &quot; + anomaly + &quot;: one transaction, two different databases&quot;);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; A constraint fails half way through a write. What is the state of the database?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was. The row is built and checked against the type, NOT NULL and CHECK rules before the lock is taken and before anything is written, so most refusals never reach the table at all. The checks that must read the table (is the key free? does the parent exist?) happen inside the lock but still before any write. What follows them is a single method that puts the row and every index entry in together. An UPDATE or DELETE of many rows is the one place a refusal can come after a write: row 2 fails after row 1 changed. So the statement notes where the undo log stood when it began and undoes back to there; the transaction stays open, and test 11 commits after the refusal and finds nothing half done. The machine-coding versions of this prompt ask for a string of at most 20 characters, an int between -1024 and 1024, a required column: each is one CheckRule or NOT NULL.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Insert one row. The order is the whole design: build and validate the row with nothing locked and nothing\n     * written; take the lock; check the rules that must read the table; only then write the row and its indexes.\n     */\n    Row insert(String table, Object... values) {\n        alive();\n        Table t = db.table(table);\n        Row row = t.build(db, values);\n        t.checkRow(row);                                  // types, NOT NULL, CHECK -- no lock held, nothing written\n        use(t);                                           // now the lock, and we keep it until commit or rollback\n        t.checkTable(this, null, row);                      // primary key uniqueness: must read the table, so it is in here\n        write(t, null, row, ChangeKind.INSERT);\n        return row;\n    }\n\n    /**\n     * Update every row matching the where-clause. Each new row can only be built after reading the old one, so its\n     * rules run inside the lock. If the third row is refused, the first two are undone: a statement is all or nothing.\n     */\n    int update(String table, Predicate where, Map&lt;String, Object&gt; set) {\n        alive();\n        Table t = db.table(table);\n        if (set.containsKey(t.schema().pkName()))\n            throw new ConstraintViolation(&quot;a primary key is not editable: delete the row and insert it again&quot;);\n        use(t);\n        int start = undo.size();                              // where this statement began, like a savepoint\n        try {\n            List&lt;Row&gt; hits = t.select(where);\n            for (Row before : hits) {\n                Row after = before.with(t.schema(), set, db.nextVersion(), db.now());\n                t.checkRow(after);\n                t.checkTable(this, before, after);\n                write(t, before, after, ChangeKind.UPDATE);\n            }\n            return hits.size();\n        } catch (RuntimeException e) { undoStatement(start); throw e; }\n    }\n\n/** A statement that failed half way is undone back to its start; the transaction stays open, as in SQL. */\n    private void undoStatement(int start) {\n        if (state == TxnState.ACTIVE) rollbackTo(start);      // a lock timeout has already rolled everything back\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>7 &middot; &quot;Give me everyone aged thirty to forty&quot; over a hundred thousand rows, without a scan.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The secondary index is a TreeMap from column value to the primary keys that hold it, so a range is a subMap: one descent to find the start, then one step per row you actually return. Equality on an indexed column is a single tree lookup, and equality on the primary key is a hash lookup that never touches an index at all. The planner is three ifs over the where-clause: the primary key first, then an index probe, then an index range, and only then a scan. It names the path it took, so \"is this a scan?\" is a question the code answers rather than a guess. That is the payoff for making Eq and Between objects instead of lambdas: a lambda cannot be read, so a lambda predicate is always a full scan.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Choose the access path. In order of cheapness: the primary key map, an index probe, an index range, and\n     * only then a full scan. This is the whole query planner: three ifs, and it is why a where-clause is an\n     * object rather than a lambda -- the planner has to be able to READ the predicate to improve on it.\n     */\n    Plan plan(Predicate p) {\n        List&lt;Predicate&gt; parts = (p instanceof And a) ? a.parts() : List.of(p);\n        for (Predicate q : parts)\n            if (q instanceof Eq e &amp;&amp; e.val() != null &amp;&amp; e.col().equals(schema.pkName())) {\n                Row r = byPk.get(e.val());\n                return new Plan(&quot;primary key lookup on &quot; + name, r == null ? List.of() : List.of(r));\n            }\n        for (Predicate q : parts)\n            if (q instanceof Eq e &amp;&amp; e.val() != null &amp;&amp; indexes.containsKey(e.col()))\n                return new Plan(&quot;index probe on &quot; + name + &quot;.&quot; + e.col(), rowsOf(indexes.get(e.col()).eq(e.val())));\n        for (Predicate q : parts)\n            if (q instanceof Between b &amp;&amp; indexes.containsKey(b.col()))\n                return new Plan(&quot;index range on &quot; + name + &quot;.&quot; + b.col(), rowsOf(indexes.get(b.col()).range(b.lo(), b.hi())));\n        return new Plan(&quot;full scan of &quot; + name + &quot; (&quot; + byPk.size() + &quot; rows)&quot;, allRows());\n    }\n\n/**\n * A secondary index: one column&#x27;s value -&gt; the primary keys that hold it, kept in a TreeMap so &quot;between&quot; is a\n * subMap instead of a scan. Rows whose indexed value is null are not in the index; a query for them scans.\n */\nfinal class Index {\n    private final String column;\n    private final int col;\n    private final TreeMap&lt;Object, LinkedHashSet&lt;Object&gt;&gt; tree = new TreeMap&lt;&gt;(Index::cmp);\n\n    /** @param s the table&#x27;s schema, used once to turn the column name into a position. */\n    Index(Schema s, String column) { this.column = column; this.col = s.pos(column); }\n    /** The column this index is on. */\n    String column() { return column; }\n    /** Compare two values of the same column. They are Long, String or Boolean, so all of them are Comparable. */\n    @SuppressWarnings(&quot;unchecked&quot;)\n    static int cmp(Object a, Object b) { return ((Comparable&lt;Object&gt;) a).compareTo(b); }\n    /** Record that this row, whose primary key is pk, holds its value in this column. */\n    void add(Row r, Object pk) {\n        Object k = r.get(col);\n        if (k == null) return;\n        tree.computeIfAbsent(k, x -&gt; new LinkedHashSet&lt;&gt;()).add(pk);\n    }\n    /** Forget that row. An empty key is removed so a settled index costs no memory. */\n    void remove(Row r, Object pk) {\n        Object k = r.get(col);\n        if (k == null) return;\n        Set&lt;Object&gt; s = tree.get(k);\n        if (s != null) { s.remove(pk); if (s.isEmpty()) tree.remove(k); }\n    }\n    /** The primary keys holding exactly this value: one tree lookup, O(log n). */\n    Set&lt;Object&gt; eq(Object v) {\n        Set&lt;Object&gt; s = tree.get(Values.norm(v));\n        return s == null ? Set.of() : s;\n    }\n    /** The primary keys in this closed range, in key order: O(log n) to find the start, then one step per hit. */\n    List&lt;Object&gt; range(Object lo, Object hi) {\n        List&lt;Object&gt; out = new ArrayList&lt;&gt;();\n        if (cmp(Values.norm(lo), Values.norm(hi)) &gt; 0) return out;    // 35 to 30 is empty, as a scan says; subMap would throw\n        for (Set&lt;Object&gt; s : tree.subMap(Values.norm(lo), true, Values.norm(hi), true).values()) out.addAll(s);\n        return out;\n    }\n    /** How many distinct values the index holds. Used by the planner and by the tests. */\n    int keyCount() { return tree.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>8 &middot; The API version of this prompt: select(columns, where, orderBy). Sort by city, then by age with the oldest first, and return only the names.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>This is how the prompt is often asked: create a table, insert, then select(columns, where, order_by), built level by level. The rows come from the same planner as before (key, index or scan); only the k matched rows are then sorted, O(k log k), never the whole table. Each sort key is a column and a direction (\"age DESC\"), and the keys chain with <code>thenComparing</code>, so two users in the same city are ordered by age. A range read through a TreeMap index already returns rows in that column's order, and Java's sort notices a sorted list and makes one pass. The column list is the last step: each row is cut down to the columns asked for. Test 14 checks both orders.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: ORDER BY and a column list -- select(columns, where, orderBy), the API-driven version of this prompt\n/**\n * ORDER BY over several columns, each ascending or descending, then only the columns asked for (a projection).\n * Only the k matched rows are sorted, O(k log k), never the table. A range read through a TreeMap index already\n * returns rows in that column&#x27;s order, and Java&#x27;s sort notices an already-sorted list and makes one pass.\n */\nfinal class OrderBy {\n    private OrderBy() {}\n    /** One sort key, written &quot;age&quot; or &quot;age DESC&quot;. A null sorts last in either direction. */\n    static Comparator&lt;Row&gt; key(Schema s, String spec) {\n        String[] p = spec.trim().split(&quot;\\\\s+&quot;);\n        int col = s.pos(p[0]);\n        boolean desc = p.length &gt; 1 &amp;&amp; p[1].equalsIgnoreCase(&quot;DESC&quot;);\n        return (a, b) -&gt; {\n            Object x = a.get(col), y = b.get(col);\n            if (x == null || y == null) return x == y ? 0 : (x == null ? 1 : -1);\n            int c = Index.cmp(x, y);\n            return desc ? -c : c;\n        };\n    }\n    /** SELECT columns FROM table WHERE where ORDER BY keys, read inside the caller&#x27;s transaction like any read. */\n    static List&lt;List&lt;Object&gt;&gt; select(Txn tx, String table, List&lt;String&gt; columns, Predicate where, String... orderBy) {\n        Table t = tx.table(table);\n        Schema s = t.schema();\n        List&lt;Row&gt; rows = t.select(where);                     // the planner picks the rows: key, index or scan\n        Comparator&lt;Row&gt; order = null;\n        for (String k : orderBy) order = (order == null) ? key(s, k) : order.thenComparing(key(s, k));\n        if (order != null) rows.sort(order);                  // k log k for the k matches only\n        List&lt;List&lt;Object&gt;&gt; out = new ArrayList&lt;&gt;();\n        for (Row r : rows) {\n            List&lt;Object&gt; cells = new ArrayList&lt;&gt;();\n            for (String c : columns) cells.add(r.get(s, c));\n            out.add(cells);\n        }\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; An update changes a column that is indexed. What has to happen, and what usually goes wrong?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The old index entry has to go and a new one has to arrive, and the usual bug is that some code path writes the row without doing it. That is why there is exactly one method that ever changes a row: apply(before, after) removes the before-image from every index, writes the row, then adds the after-image to every index. An insert is apply(null, row), a delete is apply(row, null), and an undo is apply(after, before) &mdash; the same door in reverse. With one door there is exactly one place a row and its indexes could get out of step, and the tests check the old value finds nothing afterwards while the new one finds the row.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * THE ONE DOOR every row change passes through: an insert (before = null), an update, a delete (after = null),\n     * and an undo, which is this same call with the two images swapped. Row and indexes move together or not at\n     * all, so there is exactly one place an index could ever go out of step with the rows.\n     */\n    void apply(Row before, Row after) {\n        Object pk = (after != null ? after : before).pk(schema);\n        if (before != null) for (Index ix : indexes.values()) ix.remove(before, pk);\n        if (after == null) byPk.remove(pk); else byPk.put(pk, after);\n        if (after != null) for (Index ix : indexes.values()) ix.add(after, pk);\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; The client ran three statements and disappeared. And: I want SAVEPOINT.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Every write appends a before-image to the transaction's undo log, so a rollback is that log replayed backwards through the same apply() &mdash; rows and index entries land back exactly where they were. It costs what the transaction touched, never what the table holds, and it is free to prepare because rows are immutable: the old row object IS the before-image, so nothing is copied. A savepoint is then almost nothing: the length of the undo log at that moment. ROLLBACK TO undoes entries back to that mark and stops. The transaction stays open and, importantly, keeps its locks: releasing them early is what would reopen the lost update. The pending batch for the triggers is trimmed the same way, so a rolled-back statement is never published. Who calls rollback when a client vanishes? Whoever holds the transaction: here the caller's try/catch, the same shape as the autocommit methods; a server does it when the connection drops.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** A SQL SAVEPOINT: how many changes this transaction has made so far. Locks are not released -- they are held to the end. */\n    int savepoint() { alive(); return undo.size(); }\n\n    /** Undo everything done since that savepoint and keep the transaction open. Nested BEGIN is this, with a name. */\n    void rollbackTo(int savepoint) {\n        alive();\n        if (savepoint &lt; 0 || savepoint &gt; undo.size()) throw new IllegalArgumentException(&quot;no such savepoint: &quot; + savepoint);\n        for (int i = undo.size() - 1; i &gt;= savepoint; i--) {\n            UndoEntry e = undo.remove(i);\n            e.table().apply(e.after(), e.before());\n            pending.remove(pending.size() - 1);           // undo and pending grow in step, one entry per change\n        }\n    }\n\n/**\n     * Commit, in three steps. The batch goes to the log while the tables are still held, so the log&#x27;s order is the\n     * commit order; if the log throws, the transaction is rolled back and the caller is told. Then the locks are\n     * released. Only then are the triggers told, so a trigger never runs while a table is held.\n     */\n    void commit() {\n        alive();\n        List&lt;Change&gt; batch = List.copyOf(pending);\n        if (!batch.isEmpty()) {\n            try { db.log().append(batch); }                   // the commit point: a failed append is a failed commit\n            catch (RuntimeException e) { rollback(); throw e; }\n        }\n        state = TxnState.COMMITTED;\n        undo.clear(); pending.clear();\n        releaseAll();\n        if (!batch.isEmpty()) db.publish(batch);\n    }\n\n    /** Roll back: replay the undo log backwards through the same door, release every table, publish nothing. */\n    void rollback() {\n        if (state != TxnState.ACTIVE) return;             // rolling back a finished transaction is a no-op, not an error\n        for (int i = undo.size() - 1; i &gt;= 0; i--) {\n            UndoEntry e = undo.get(i);\n            e.table().apply(e.after(), e.before());\n        }\n        state = TxnState.ROLLED_BACK;\n        undo.clear(); pending.clear();\n        releaseAll();\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>11 &middot; Two transactions, two tables, opposite order. Show me the deadlock and what you do about it.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Strict two-phase locking makes deadlock possible by construction: T1 holds users and wants orders while T2 holds orders and wants users, and neither will ever let go. The code does not pretend otherwise: every acquisition is a tryLock with a timeout. The transaction that runs out of patience rolls back, which releases everything it held, and throws a LockTimeout the client can retry. The alternative is a waits-for graph: who waits for whom, where a cycle is a deadlock and one transaction in it (the victim) is aborted. It catches the cycle at once and never aborts a transaction that was merely slow, at the cost of bookkeeping on every acquisition; a timeout is the honest one-line answer, and you say which you chose and why. The test proves both halves: somebody gave up, and every row still present belongs to a transaction that committed.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 9. a deadlock: two transactions take two tables in opposite orders; one is aborted and leaves nothing behind\n        Database dl = Main.sample();\n        dl.configure(new StrictTableLocking(), 300);\n        CyclicBarrier both = new CyclicBarrier(2);\n        ExecutorService pair = Executors.newFixedThreadPool(2);\n        Future&lt;String&gt; a = pair.submit(() -&gt; Main.cross(dl, both, &quot;users&quot;, 100L, &quot;orders&quot;, 100L, 0));\n        Future&lt;String&gt; b = pair.submit(() -&gt; Main.cross(dl, both, &quot;orders&quot;, 101L, &quot;users&quot;, 101L, 100));\n        String ra = a.get(5, TimeUnit.SECONDS), rb = b.get(5, TimeUnit.SECONDS);\n        pair.shutdown();\n        int committed = (ra.startsWith(&quot;committed&quot;) ? 1 : 0) + (rb.startsWith(&quot;committed&quot;) ? 1 : 0);\n        int rows = dl.table(&quot;users&quot;).rowCount() + dl.table(&quot;orders&quot;).rowCount();\n        check(ra.startsWith(&quot;gave up&quot;) || rb.startsWith(&quot;gave up&quot;), &quot;the deadlock was broken by a timeout, not by hanging&quot;);\n        check(rows == committed * 2, &quot;every row present belongs to a transaction that committed (&quot; + rows + &quot; rows, &quot; + committed + &quot; committed)&quot;);\n        check(!dl.table(&quot;users&quot;).lock().isLocked() &amp;&amp; !dl.table(&quot;orders&quot;).lock().isLocked(), &quot;and both tables were released by the loser&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Make it survive a restart.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Durability is the database's CommitLog slot. At COMMIT the batch is appended to the log while the transaction still holds its tables, and only then are the locks released. So the log's order is the commit order, and replaying it against an empty database rebuilds exactly the committed state; test 12 slows the first committer's disk and still finds the insert before the update. The log is not wrapped like a trigger: if the append throws (disk full), the commit fails and is rolled back, so no client is told \"committed\" for a change the log does not have. The price is the fsync (the call that forces bytes onto the disk, about a millisecond) inside the lock, which caps one table near a thousand commits a second. Group commit (one fsync for every transaction waiting at that moment) buys it back, or Redis's default: one fsync a second, at the risk of losing that second. A real log also writes each batch's length and a checksum, so replay stops cleanly at a batch a crash cut in half; a snapshot every so often lets the old log be deleted. The SQL version, a conditional UPDATE, is in the code below.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- a write-ahead log, and the conditional UPDATE the same design becomes in SQL\n/**\n * Durability: the database&#x27;s CommitLog. COMMIT appends the batch here while the transaction still holds its tables,\n * so the lines are in commit order, and only then releases the locks. On a real disk the append ends with an fsync\n * (the call that forces the bytes onto the disk); if it throws, the commit fails and is rolled back. A rolled-back\n * transaction never reaches here, which is why replaying the log rebuilds exactly the committed state.\n */\nfinal class WalLog implements CommitLog {\n    private final List&lt;String&gt; log = Collections.synchronizedList(new ArrayList&lt;&gt;());\n    public void append(List&lt;Change&gt; batch) {\n        List&lt;String&gt; lines = new ArrayList&lt;&gt;();\n        for (Change c : batch) {\n            Row r = c.after() != null ? c.after() : c.before();\n            StringJoiner j = new StringJoiner(&quot;~&quot;);\n            j.add(c.kind().name()).add(c.table());\n            for (int i = 0; i &lt; c.schema().size(); i++) j.add(enc(r.get(i)));\n            lines.add(j.toString());                                  // a real log writes lengths and a checksum\n        }\n        log.addAll(lines);                                            // one transaction&#x27;s lines stay together\n    }\n    /** The log lines, oldest first. */\n    List&lt;String&gt; lines() { return List.copyOf(log); }\n    /** One value as text, with its type, so replay can put back a long rather than a string that looks like one. */\n    static String enc(Object v) {\n        if (v == null) return &quot;N&quot;;\n        if (v instanceof Long l) return &quot;L&quot; + l;\n        if (v instanceof Boolean b) return &quot;B&quot; + (b ? 1 : 0);\n        return &quot;S&quot; + v;\n    }\n    /** One value back from text. */\n    static Object dec(String s) {\n        return switch (s.charAt(0)) {\n            case &#x27;N&#x27; -&gt; null;\n            case &#x27;L&#x27; -&gt; Long.parseLong(s.substring(1));\n            case &#x27;B&#x27; -&gt; s.charAt(1) == &#x27;1&#x27;;\n            default -&gt; s.substring(1);\n        };\n    }\n    /**\n     * Rebuild a database from the log. The log is a list of statements, so replay is just running them again;\n     * this is also why the log, not the map, is the thing you ship to a replica.\n     */\n    static Database replay(List&lt;String&gt; lines, Database fresh) {\n        for (String line : lines) {\n            String[] f = line.split(&quot;~&quot;);\n            Table t = fresh.table(f[1]);\n            Schema s = t.schema();\n            Object[] cells = new Object[s.size()];\n            for (int i = 0; i &lt; s.size(); i++) cells[i] = dec(f[i + 2]);\n            Object pk = cells[s.pkIndex()];\n            switch (ChangeKind.valueOf(f[0])) {\n                case INSERT -&gt; fresh.insert(f[1], cells);\n                case DELETE -&gt; fresh.delete(f[1], Where.eq(s.pkName(), pk));\n                case UPDATE -&gt; {\n                    Map&lt;String, Object&gt; set = new LinkedHashMap&lt;&gt;();\n                    for (int i = 0; i &lt; s.size(); i++) if (i != s.pkIndex()) set.put(s.col(i).name(), cells[i]);\n                    fresh.update(f[1], Where.eq(s.pkName(), pk), set);\n                }\n            }\n        }\n        return fresh;\n    }\n    /**\n     * The same design on a real database, where the lock is the row and the transaction is the server&#x27;s. The\n     * version column makes the write conditional: two servers cannot both apply an update to the row they read.\n     *\n     * &lt;pre&gt;\n     * UPDATE users SET city = ?, version = version + 1\n     *  WHERE id = ? AND version = ?;         -- 0 rows updated means somebody else got there first: re-read and retry\n     * INSERT INTO users (...) VALUES (...) ON CONFLICT (id) DO NOTHING;   -- a retried request inserts once\n     * &lt;/pre&gt;\n     */\n    static final String SQL = &quot;see the Javadoc above&quot;;\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Join users to orders. Which algorithm, and when does the other one win?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nested loop walks the left table and probes the right table's index once per row. It is cheap when the left side is small and the right side is indexed, and terrible when neither is true. Hash join builds a map from the smaller table, then streams the larger one past it: one pass over each, no index needed, but the build side has to fit in memory. So the rule of thumb is: an index on the join column and a small left side means nested loop; two big unindexed tables mean hash join; already-sorted inputs mean a merge join (walk the two sorted lists side by side), the third one worth naming. Both read the two tables inside one transaction, so the join sees one consistent database while others write. Both return the same rows, which the demo asserts &mdash; a join is a choice of algorithm, never a choice of answer.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: joins -- nested loop with an index, and a hash join, and when each one wins\n/**\n * Two ways to join users to orders. Nested loop walks the left side and probes the right side&#x27;s index: cheap when\n * the left side is small and the right side is indexed. Hash join builds a map from the smaller side and streams\n * the other: one pass over each, no index needed, but the map has to fit in memory. Both read the two tables\n * inside the caller&#x27;s transaction, so the join sees one consistent database while other clients write.\n */\nfinal class Joins {\n    private Joins() {}\n    /** For each user, probe the orders index on user_id: n left rows x one index probe each. */\n    static List&lt;String&gt; nestedLoop(Txn tx) {\n        Table users = tx.table(&quot;users&quot;), orders = tx.table(&quot;orders&quot;);\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (Row u : users.allRows())\n            for (Row o : orders.select(Where.eq(&quot;user_id&quot;, u.pk(users.schema()))))\n                out.add(u.get(users.schema(), &quot;name&quot;) + &quot; -&gt; &quot; + o.get(orders.schema(), &quot;total&quot;));\n        Collections.sort(out);\n        return out;\n    }\n    /** Build a map from users (the smaller side), then stream orders once: O(n + m), and no index is needed. */\n    static List&lt;String&gt; hashJoin(Txn tx) {\n        Table users = tx.table(&quot;users&quot;), orders = tx.table(&quot;orders&quot;);\n        Map&lt;Object, String&gt; build = new HashMap&lt;&gt;();\n        for (Row u : users.allRows()) build.put(u.pk(users.schema()), (String) u.get(users.schema(), &quot;name&quot;));\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (Row o : orders.allRows()) {\n            String name = build.get(o.get(orders.schema(), &quot;user_id&quot;));\n            if (name != null) out.add(name + &quot; -&gt; &quot; + o.get(orders.schema(), &quot;total&quot;));\n        }\n        Collections.sort(out);\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Which index did that query use, and what if two are usable? And add an index at run time.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Main's planner takes the first usable path in a fixed order: primary key, index probe, index range, scan. The cost-based version prices every usable path by how many rows it would examine and takes the cheapest. So city = 'Pune' AND name = 'Bela' examines one row through the name index instead of two through the city index; test 13 counts them. It can price exactly because probing an index is cheap at this size. A real planner keeps histograms (counts of rows per range of values), because probing millions of rows to plan a query would cost more than running it. Adding an index later is one call: it is filled from the rows already there, so it is complete the moment it exists, and from then on the table's single apply() maintains it like any other. Do it while nothing else is running: creating an index is not transactional here, and saying so is better than pretending.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: EXPLAIN -- when two indexes are usable, pick the one that examines fewer rows\n/**\n * A cost-based planner. Main&#x27;s planner takes the first usable index; this one prices every usable path by the rows\n * it would examine and takes the cheapest. Probing an index to price it is cheap at this size; a real planner keeps\n * histograms (counts of rows per range of values) because probing millions of rows would cost more than the query.\n */\nfinal class CostPlanner {\n    private CostPlanner() {}\n    /** The cheapest usable path. Each index path is priced by probing it; the scan is priced at the row count. */\n    static Plan cheapest(Table t, Predicate p) {\n        Plan best = null;\n        for (Predicate q : (p instanceof And a) ? a.parts() : List.of(p)) {\n            Plan c = probe(t, q);\n            if (c != null &amp;&amp; (best == null || c.candidates().size() &lt; best.candidates().size())) best = c;\n        }\n        return best != null ? best : new Plan(&quot;full scan (&quot; + t.rowCount() + &quot; rows)&quot;, t.allRows());\n    }\n    /** One part of the where-clause as an index path, or null when no index can answer it. */\n    private static Plan probe(Table t, Predicate q) {\n        if (q instanceof Eq e &amp;&amp; e.val() != null &amp;&amp; e.col().equals(t.schema().pkName()))\n            return new Plan(&quot;primary key lookup on &quot; + e.col(), t.row(e.val()) == null ? List.of() : List.of(t.row(e.val())));\n        if (q instanceof Eq e &amp;&amp; e.val() != null &amp;&amp; t.index(e.col()) != null)\n            return new Plan(&quot;index probe on &quot; + e.col(), rows(t, t.index(e.col()).eq(e.val())));\n        if (q instanceof Between b &amp;&amp; t.index(b.col()) != null)\n            return new Plan(&quot;index range on &quot; + b.col(), rows(t, t.index(b.col()).range(b.lo(), b.hi())));\n        return null;\n    }\n    private static List&lt;Row&gt; rows(Table t, Collection&lt;Object&gt; pks) {\n        List&lt;Row&gt; out = new ArrayList&lt;&gt;();\n        for (Object pk : pks) out.add(t.row(pk));\n        return out;\n    }\n    /** The rows, found through the cheapest path: the same rows as Main&#x27;s select, with the fewest examined. */\n    static List&lt;Row&gt; select(Txn tx, String table, Predicate p) {\n        Table t = tx.table(table);                            // locked for the rest of the transaction, like any read\n        List&lt;Row&gt; out = new ArrayList&lt;&gt;();\n        for (Row r : cheapest(t, p).candidates()) if (p.test(t.schema(), r)) out.add(r);\n        return out;\n    }\n}\n\n// ---- ext: an index added at run time -- backfilled from the rows already there, then maintained by the same door\n/**\n * Adding an index to a table that already has rows. createIndex backfills, so the new index is complete the\n * moment it exists, and from then on the table&#x27;s single apply() keeps it in step like any other index.\n */\nfinal class LateIndex {\n    private LateIndex() {}\n    /** Add the index and immediately prove the planner uses it. Do it while nothing else is running: DDL is not transactional. */\n    static String add(Database db, String table, String column) {\n        Table t = db.table(table);\n        Index ix = t.createIndex(column);\n        return &quot;index on &quot; + table + &quot;.&quot; + column + &quot; built over &quot; + t.rowCount() + &quot; existing rows, &quot;\n             + ix.keyCount() + &quot; distinct values; the planner now says: &quot; + t.plan(Where.eq(column, t.allRows().get(0).get(t.schema(), column))).how();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Where does time come from, and how do you test something that expires?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The database is handed a Clock, and it stamps every row it writes; nothing else reads the wall clock. So a sweeper for a TTL (time to live: how old a row may get) is a few lines: everything stamped longer ago than the TTL is deleted. The deletes are ordinary transactions, so the indexes, the undo log and the triggers all behave exactly as they do for a hand-typed DELETE. A test moves the clock instead of sleeping: insert a row, advance the long by a minute, insert another, sweep with a thirty-second TTL, and exactly one row goes.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: TTL rows -- the injected clock, and why the sweeper is an ordinary transaction\n/**\n * Rows that expire. Every row is stamped with the injected clock when it is written, so a sweeper can delete\n * everything older than a TTL -- and it does it with ordinary transactions, so the triggers, the indexes and the\n * undo log all behave exactly as they do for a hand-typed DELETE. A test moves the clock instead of sleeping.\n */\nfinal class TtlSweeper {\n    private final Database db;\n    private final String table;\n    private final long ttlMs;\n    private final Clock clock;\n    /** @param ttlMs how old a row may get; clock the same clock the database was handed. */\n    TtlSweeper(Database db, String table, long ttlMs, Clock clock) { this.db = db; this.table = table; this.ttlMs = ttlMs; this.clock = clock; }\n    /** Delete every row written longer ago than the TTL. Returns how many went. */\n    int sweep() {\n        long cutoff = clock.nowMs() - ttlMs;\n        return db.delete(table, (s, r) -&gt; r.atMs() &lt; cutoff);          // a lambda predicate: the planner cannot read it, so it is a scan\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Which pattern is where, which SOLID letter is where, and where would a Factory or a Builder earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None of the patterns was chosen up front; each is what a move produced, and the code below is the one line behind each name. The two worth defending out loud are Memento and Interpreter. The before-image is the old <code>Row</code> object itself, free because rows are immutable. The where-clause is a little tree the planner can <i>read</i>, which is the only reason a query can reach for an index: hand it a lambda and it is a full scan every time. For SOLID: S is move 2, O is the foreign key (a new file and one <code>addRule</code> line), L is the same fifty-thread race running byte-identically against two lock policies, I is seven interfaces with six of them one method, and D is <code>configure()</code>, <code>setClock()</code> and <code>setLog()</code>. Factory earns its place the day schemas arrive as DDL text (CREATE TABLE statements), because the column-type map is already the registry. A new column type, which the machine-coding versions ask for, is one enum constant and one line in that map. Builder earns its place the day a column gains a default value and other options &mdash; today <code>createTable</code> takes a name, a key and the columns, and all three are required.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: what makes a row valid, who may touch a table, where commits are kept -- all handed in\ninterface RowRule   { void check(Schema s, Row row); }                 // judged from the row alone: before the lock\ninterface TableRule { void check(Txn txn, Table t, Row before, Row after); }  // has to read a table: inside the lock\ninterface LockPolicy { boolean acquire(Table t, long timeoutMs); void release(Table t); }\ninterface CommitLog { void append(List&lt;Change&gt; batch); }             // at COMMIT, before the unlock; never wrapped\n\n// Decorator: every trigger handed in gets the same guarantee, written once\nSafeTrigger addTrigger(Trigger t) { SafeTrigger s = new SafeTrigger(t); triggers.add(s); return s; }\n\n// Observer: committed batches only, after every lock is released\nvoid commit() { db.log().append(batch); state = COMMITTED; releaseAll(); db.publish(batch); }\n\n// Memento + Command: the old row IS the before-image, and undo is the same door in reverse\nrecord UndoEntry(Table table, Row before, Row after) {}\ne.table().apply(e.after(), e.before());                 // rollback, newest change first\n\n// Interpreter: a where-clause the planner can READ (a lambda would always be a scan)\nrecord Eq(String col, Object val) implements Predicate { ... }\nif (q instanceof Eq e &amp;&amp; e.col().equals(schema.pkName())) return new Plan(&quot;primary key lookup&quot;, ...);\n\n// Factory: not yet. ColType&#x27;s EnumMap is already the registry; DDL text would make it a factory\nstatic { JAVA.put(INT, Long.class); JAVA.put(TEXT, String.class); JAVA.put(BOOL, Boolean.class); }\n\n// Builder: not yet. Three required things; defaults and collations per column would change that\ndb.createTable(&quot;users&quot;, &quot;id&quot;, Column.intCol(&quot;id&quot;, true), Column.text(&quot;name&quot;, true));\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * The types a column can hold. The enum is also the type checker: the check is one map lookup, never a chain of\n * ifs, so adding DECIMAL later is one constant and one line in the table below.\n */\nenum ColType {\n    INT, TEXT, BOOL;\n    /** The Java class each column type stores. An EnumMap, so a type check is an array index. */\n    private static final EnumMap<ColType, Class<?>> JAVA = new EnumMap<>(ColType.class);\n    static { JAVA.put(INT, Long.class); JAVA.put(TEXT, String.class); JAVA.put(BOOL, Boolean.class); }\n    /** Can a column of this type hold this value? null is the NOT NULL rule's business, not this one's. */\n    boolean accepts(Object v) { return v == null || JAVA.get(this).isInstance(v); }\n    /** The Java class behind this type, so a rejection message tells you what to hand it instead. */\n    String javaType() { return JAVA.get(this).getSimpleName(); }\n}\n\n/** One column of a table: its name, its type, and whether it may hold null. Fixed when the table is created. */\nrecord Column(String name, ColType type, boolean notNull) {\n    /** A whole-number column, stored as a long. */\n    static Column intCol(String name, boolean notNull) { return new Column(name, ColType.INT, notNull); }\n    /** A string column. */\n    static Column text(String name, boolean notNull) { return new Column(name, ColType.TEXT, notNull); }\n    /** A true/false column. */\n    static Column bool(String name, boolean notNull) { return new Column(name, ColType.BOOL, notNull); }\n}\n\n/** The one coercion in the system: an int literal becomes a long, so 1 and 1L mean the same column value. */\nfinal class Values {\n    private Values() {}\n    /** Normalise a value handed in from outside. Everything else is stored exactly as given. */\n    static Object norm(Object v) { return (v instanceof Integer i) ? Long.valueOf(i.longValue()) : v; }\n}\n\n/** A rule was broken: a type, a NOT NULL, a CHECK, a duplicate primary key, a foreign key. Nothing of the refused statement stays. */\nclass ConstraintViolation extends RuntimeException {\n    /** @param message what was refused, in words a caller can act on. */\n    ConstraintViolation(String message) { super(message); }\n}\n\n/** This transaction waited for a table longer than it was allowed to. It has been rolled back; retry it. */\nclass LockTimeout extends RuntimeException {\n    /** @param message which table was wanted and for how long. */\n    LockTimeout(String message) { super(message); }\n}\n\n/**\n * The shape of a table: its columns in order, a name-to-position map so a lookup by name is O(1), and which\n * column is the primary key. Immutable, so every row of the table can share one Schema.\n */\nfinal class Schema {\n    private final List<Column> cols;\n    private final Map<String, Integer> pos;\n    private final int pk;\n\n    /** @param pkColumn the name of the primary key column; it must exist and must be NOT NULL. */\n    Schema(String pkColumn, Column... columns) {\n        cols = List.of(columns);\n        Map<String, Integer> p = new LinkedHashMap<>();\n        for (int i = 0; i < cols.size(); i++)\n            if (p.put(cols.get(i).name(), i) != null) throw new IllegalArgumentException(\"duplicate column: \" + cols.get(i).name());\n        pos = Map.copyOf(p);\n        Integer k = p.get(pkColumn);\n        if (k == null) throw new IllegalArgumentException(\"primary key column is not in the table: \" + pkColumn);\n        if (!cols.get(k).notNull()) throw new IllegalArgumentException(\"a primary key column cannot be nullable: \" + pkColumn);\n        pk = k;\n    }\n    /** How many columns the table has. */\n    int size() { return cols.size(); }\n    /** The column at this position. */\n    Column col(int i) { return cols.get(i); }\n    /** The position of a column by name, O(1). Throws if there is no such column, which is a bug, not bad data. */\n    int pos(String name) {\n        Integer i = pos.get(name);\n        if (i == null) throw new IllegalArgumentException(\"no such column: \" + name);\n        return i;\n    }\n    /** Does the table have this column? Used by the planner before it tries to read a predicate. */\n    boolean has(String name) { return pos.containsKey(name); }\n    /** The position of the primary key column. */\n    int pkIndex() { return pk; }\n    /** The name of the primary key column. */\n    String pkName() { return cols.get(pk).name(); }\n    /** The columns, in order. */\n    List<Column> columns() { return cols; }\n}\n\n/**\n * One row, immutable. An update never edits a row: it builds a new one and swaps it in, which is exactly what\n * makes the undo log free -- the old object IS the before-image, so nothing has to be copied to be able to undo.\n */\nfinal class Row {\n    private final Object[] cells;\n    private final long version;\n    private final long atMs;\n\n    /** @param cells one value per column, in column order; version and atMs come from the database. */\n    Row(Object[] cells, long version, long atMs) { this.cells = cells; this.version = version; this.atMs = atMs; }\n    /** The value in this column position. */\n    Object get(int i) { return cells[i]; }\n    /** The value in this column by name. */\n    Object get(Schema s, String col) { return cells[s.pos(col)]; }\n    /** A number no other write shares, from one database-wide counter: the stamp an optimistic-locking check compares. */\n    long version() { return version; }\n    /** When this version of the row was written, from the injected clock. */\n    long atMs() { return atMs; }\n    /** This row's primary key value. */\n    Object pk(Schema s) { return cells[s.pkIndex()]; }\n    /** A copy with some columns replaced. The original is untouched, so it can still be used as the undo image. */\n    Row with(Schema s, Map<String, Object> set, long version, long atMs) {\n        Object[] c = cells.clone();\n        for (Map.Entry<String, Object> e : set.entrySet()) c[s.pos(e.getKey())] = Values.norm(e.getValue());\n        return new Row(c, version, atMs);\n    }\n    /** The row as \"id=1, name=Asha, city=Pune\", for a demo print or a failing test's message. */\n    String show(Schema s) {\n        StringJoiner j = new StringJoiner(\", \");\n        for (int i = 0; i < cells.length; i++) j.add(s.col(i).name() + \"=\" + cells[i]);\n        return j.toString();\n    }\n}\n\n/** Where time comes from. Injected, so a test can stamp rows, and time out a lock, at instants it chooses. */\ninterface Clock { long nowMs(); }\n\n/**\n * A where-clause: does this row match? One method, so a lambda is a valid predicate. The two shapes the planner\n * can READ -- Eq and Between -- are what let it reach for an index instead of scanning.\n */\ninterface Predicate {\n    /** True if this row matches. The schema is handed in so a predicate can name columns rather than positions. */\n    boolean test(Schema s, Row r);\n}\n\n/** column = value. On the primary key this is a hash lookup; on an indexed column, an index probe. */\nrecord Eq(String col, Object val) implements Predicate {\n    public boolean test(Schema s, Row r) { return Objects.equals(r.get(s.pos(col)), val); }\n}\n\n/** lo <= column <= hi, both ends included. On an indexed column the planner turns this into a TreeMap subMap. */\nrecord Between(String col, Object lo, Object hi) implements Predicate {\n    public boolean test(Schema s, Row r) {\n        Object v = r.get(s.pos(col));\n        return v != null && Index.cmp(v, lo) >= 0 && Index.cmp(v, hi) <= 0;\n    }\n}\n\n/** Every part must match. The planner uses the first part it can turn into an index probe and filters with the rest. */\nrecord And(List<Predicate> parts) implements Predicate {\n    public boolean test(Schema s, Row r) {\n        for (Predicate p : parts) if (!p.test(s, r)) return false;\n        return true;\n    }\n}\n\n/** Matches every row: a full scan, said out loud rather than implied. */\nrecord All() implements Predicate {\n    public boolean test(Schema s, Row r) { return true; }\n}\n\n/** Readable constructors for the where-clause: Where.eq(\"city\", \"Pune\"), Where.between(\"age\", 30, 40). */\nfinal class Where {\n    private Where() {}\n    /** column = value. */\n    static Predicate eq(String column, Object value) { return new Eq(column, Values.norm(value)); }\n    /** lo <= column <= hi. */\n    static Predicate between(String column, Object lo, Object hi) { return new Between(column, Values.norm(lo), Values.norm(hi)); }\n    /** All of these must match. */\n    static Predicate and(Predicate... parts) { return new And(List.of(parts)); }\n    /** Every row. */\n    static Predicate all() { return new All(); }\n}\n\n/**\n * A rule that can be judged by looking at the row alone: a type, a NOT NULL, a CHECK. It runs BEFORE any lock is\n * taken and before anything is written, so a bad row never reaches the table at all.\n */\ninterface RowRule {\n    /** Throw ConstraintViolation if this row may not be stored. */\n    void check(Schema s, Row row);\n}\n\n/** Every value must fit its column's type. Built in: a table always has this rule. */\nfinal class TypeRule implements RowRule {\n    public void check(Schema s, Row row) {\n        for (int i = 0; i < s.size(); i++) {\n            Column c = s.col(i);\n            if (!c.type().accepts(row.get(i)))\n                throw new ConstraintViolation(\"column \" + c.name() + \" is \" + c.type() + \" (\" + c.type().javaType()\n                    + \"), got \" + (row.get(i) == null ? \"null\" : row.get(i).getClass().getSimpleName()));\n        }\n    }\n}\n\n/** A NOT NULL column may not hold null. Built in: a table always has this rule. */\nfinal class NotNullRule implements RowRule {\n    public void check(Schema s, Row row) {\n        for (int i = 0; i < s.size(); i++)\n            if (s.col(i).notNull() && row.get(i) == null)\n                throw new ConstraintViolation(\"column \" + s.col(i).name() + \" is NOT NULL\");\n    }\n}\n\n/** A CHECK: any predicate over the row itself, handed in when the table is created. */\nfinal class CheckRule implements RowRule {\n    private final Predicate p;\n    private final String message;\n    /** @param p the condition every row must satisfy; message is what the caller is told when it does not. */\n    CheckRule(Predicate p, String message) { this.p = p; this.message = message; }\n    public void check(Schema s, Row row) { if (!p.test(s, row)) throw new ConstraintViolation(\"CHECK failed: \" + message); }\n}\n\n/**\n * A rule that cannot be judged from the row alone because it has to READ a table: primary key uniqueness, a\n * foreign key. That is the whole reason it runs INSIDE the table lock -- reading and writing must be one step.\n */\ninterface TableRule {\n    /** Throw ConstraintViolation if this change may not happen. before is null for an insert, after for a delete.\n     *  It is handed the transaction, not the database, so a rule that reads another table locks it like any read. */\n    void check(Txn txn, Table t, Row before, Row after);\n}\n\n/** The primary key is unique. Built in, and the one check that must be inside the lock or two inserts both win. */\nfinal class PrimaryKeyRule implements TableRule {\n    public void check(Txn txn, Table t, Row before, Row after) {\n        if (after == null) return;                                   // a delete cannot create a duplicate\n        Object pk = after.pk(t.schema());\n        Row existing = t.row(pk);\n        if (existing != null && existing != before)                  // identity: an update may keep its own key\n            throw new ConstraintViolation(\"duplicate primary key \" + t.schema().pkName() + \"=\" + pk + \" in \" + t.name());\n    }\n}\n\n/** What happened to one row. INSERT has no before, DELETE has no after, UPDATE has both. */\nenum ChangeKind { INSERT, UPDATE, DELETE }\n\n/** One row change from one committed transaction, handed to the triggers as part of a batch. */\nrecord Change(String table, Schema schema, ChangeKind kind, Row before, Row after) {}\n\n/**\n * Somebody who wants to know what changed: an audit log, a count kept up to date, a cache to refresh.\n * Called AFTER the transaction commits and AFTER every lock is released, with the whole batch in one call.\n * So two commits can call it at the same moment, in either order: a trigger must be thread-safe, and anything\n * that needs the commit order (a log for a restart) is a CommitLog instead, written before the unlock.\n */\ninterface Trigger {\n    /** The changes of one committed transaction, in the order they happened. */\n    void afterCommit(List<Change> batch);\n}\n\n/**\n * The wrapper the database puts around every trigger it is handed. A trigger that throws must not break a commit\n * that already happened, and must not stop the other triggers; the failure is counted instead of swallowed.\n */\nfinal class SafeTrigger implements Trigger {\n    private final Trigger inner;\n    private final AtomicInteger failures = new AtomicInteger();\n    /** @param inner the trigger that was handed in; it is never called directly by the database. */\n    SafeTrigger(Trigger inner) { this.inner = inner; }\n    public void afterCommit(List<Change> batch) {\n        try { inner.afterCommit(batch); } catch (RuntimeException e) { failures.incrementAndGet(); }\n    }\n    /** How many times this trigger has thrown. A number worth putting on a dashboard. */\n    int failures() { return failures.get(); }\n    /** The trigger that was handed in, for a test that wants to read it. */\n    Trigger inner() { return inner; }\n}\n\n/**\n * Where committed changes go so that they outlive the process: a file on disk, a feed to a replica. It is called\n * at COMMIT while the transaction still holds its tables, so the log's order is the commit order. It is NOT\n * wrapped like a trigger: a log that fails must fail the commit. The default keeps nothing (memory only).\n */\ninterface CommitLog {\n    /** Append one transaction's changes and return only when they are safe; throw if they are not. */\n    void append(List<Change> batch);\n}\n\n/**\n * A secondary index: one column's value -> the primary keys that hold it, kept in a TreeMap so \"between\" is a\n * subMap instead of a scan. Rows whose indexed value is null are not in the index; a query for them scans.\n */\nfinal class Index {\n    private final String column;\n    private final int col;\n    private final TreeMap<Object, LinkedHashSet<Object>> tree = new TreeMap<>(Index::cmp);\n\n    /** @param s the table's schema, used once to turn the column name into a position. */\n    Index(Schema s, String column) { this.column = column; this.col = s.pos(column); }\n    /** The column this index is on. */\n    String column() { return column; }\n    /** Compare two values of the same column. They are Long, String or Boolean, so all of them are Comparable. */\n    @SuppressWarnings(\"unchecked\")\n    static int cmp(Object a, Object b) { return ((Comparable<Object>) a).compareTo(b); }\n    /** Record that this row, whose primary key is pk, holds its value in this column. */\n    void add(Row r, Object pk) {\n        Object k = r.get(col);\n        if (k == null) return;\n        tree.computeIfAbsent(k, x -> new LinkedHashSet<>()).add(pk);\n    }\n    /** Forget that row. An empty key is removed so a settled index costs no memory. */\n    void remove(Row r, Object pk) {\n        Object k = r.get(col);\n        if (k == null) return;\n        Set<Object> s = tree.get(k);\n        if (s != null) { s.remove(pk); if (s.isEmpty()) tree.remove(k); }\n    }\n    /** The primary keys holding exactly this value: one tree lookup, O(log n). */\n    Set<Object> eq(Object v) {\n        Set<Object> s = tree.get(Values.norm(v));\n        return s == null ? Set.of() : s;\n    }\n    /** The primary keys in this closed range, in key order: O(log n) to find the start, then one step per hit. */\n    List<Object> range(Object lo, Object hi) {\n        List<Object> out = new ArrayList<>();\n        if (cmp(Values.norm(lo), Values.norm(hi)) > 0) return out;    // 35 to 30 is empty, as a scan says; subMap would throw\n        for (Set<Object> s : tree.subMap(Values.norm(lo), true, Values.norm(hi), true).values()) out.addAll(s);\n        return out;\n    }\n    /** How many distinct values the index holds. Used by the planner and by the tests. */\n    int keyCount() { return tree.size(); }\n}\n\n/** How a query will be answered: the access path chosen, and the rows it has to look at. */\nrecord Plan(String how, List<Row> candidates) {}\n\n/**\n * One table: its shape, its rows by primary key, its secondary indexes, its rules and its one lock. Every row\n * change in the whole system goes through this class's apply(), which is the only place rows and indexes move.\n */\nfinal class Table {\n    private final String name;\n    private final Schema schema;\n    private final Map<Object, Row> byPk = new HashMap<>();\n    private final Map<String, Index> indexes = new LinkedHashMap<>();\n    private final List<RowRule> rowRules = new ArrayList<>();\n    private final List<TableRule> tableRules = new ArrayList<>();\n    private final ReentrantLock lock = new ReentrantLock();\n\n    /** A table starts with the three rules every table has: types, NOT NULL, and a unique primary key. */\n    Table(String name, Schema schema) {\n        this.name = name; this.schema = schema;\n        rowRules.add(new TypeRule());\n        rowRules.add(new NotNullRule());\n        tableRules.add(new PrimaryKeyRule());\n    }\n    /** The table's name. */\n    String name() { return name; }\n    /** The table's shape. */\n    Schema schema() { return schema; }\n    /** The one lock for this table. Taken by the lock policy, never by the table itself. */\n    ReentrantLock lock() { return lock; }\n    /** Hand in a row-level rule (a CHECK). The table never builds one. */\n    Table addRule(RowRule r) { rowRules.add(r); return this; }\n    /** Hand in a table-level rule (a foreign key). It will run inside the lock, with the table already readable. */\n    Table addRule(TableRule r) { tableRules.add(r); return this; }\n\n    /**\n     * Build a secondary index on a column, backfilling from the rows already there, so an index can be added at\n     * any time. Call it while nothing else is running: creating an index is not part of the transaction story.\n     */\n    Index createIndex(String column) {\n        Index ix = new Index(schema, column);\n        for (Map.Entry<Object, Row> e : byPk.entrySet()) ix.add(e.getValue(), e.getKey());\n        indexes.put(column, ix);\n        return ix;\n    }\n    /** The index on this column, or null if there is none. */\n    Index index(String column) { return indexes.get(column); }\n    /** Every index on this table. */\n    Collection<Index> indexes() { return indexes.values(); }\n\n    /** Run every row-level rule. Called before the lock is taken, because none of them needs to read the table. */\n    void checkRow(Row r) { for (RowRule x : rowRules) x.check(schema, r); }\n    /** Run every table-level rule. Called inside the lock, because all of them read the table. */\n    void checkTable(Txn txn, Row before, Row after) { for (TableRule x : tableRules) x.check(txn, this, before, after); }\n\n    /**\n     * THE ONE DOOR every row change passes through: an insert (before = null), an update, a delete (after = null),\n     * and an undo, which is this same call with the two images swapped. Row and indexes move together or not at\n     * all, so there is exactly one place an index could ever go out of step with the rows.\n     */\n    void apply(Row before, Row after) {\n        Object pk = (after != null ? after : before).pk(schema);\n        if (before != null) for (Index ix : indexes.values()) ix.remove(before, pk);\n        if (after == null) byPk.remove(pk); else byPk.put(pk, after);\n        if (after != null) for (Index ix : indexes.values()) ix.add(after, pk);\n    }\n\n    /** Build a row from positional values in column order. Arity is checked here; types are checked by the rules. */\n    Row build(Database db, Object[] values) {\n        if (values.length != schema.size())\n            throw new ConstraintViolation(name + \" has \" + schema.size() + \" columns, got \" + values.length + \" values\");\n        Object[] cells = new Object[values.length];\n        for (int i = 0; i < values.length; i++) cells[i] = Values.norm(values[i]);\n        return new Row(cells, db.nextVersion(), db.now());\n    }\n\n    /** The row with this primary key, or null. One hash lookup: O(1) at any table size. */\n    Row row(Object pk) { return byPk.get(Values.norm(pk)); }\n    /** How many rows the table holds. */\n    int rowCount() { return byPk.size(); }\n    /** Every row, in primary key order, so a print or a test is deterministic. */\n    List<Row> allRows() { return sortedByPk(byPk.values()); }\n\n    /**\n     * Choose the access path. In order of cheapness: the primary key map, an index probe, an index range, and\n     * only then a full scan. This is the whole query planner: three ifs, and it is why a where-clause is an\n     * object rather than a lambda -- the planner has to be able to READ the predicate to improve on it.\n     */\n    Plan plan(Predicate p) {\n        List<Predicate> parts = (p instanceof And a) ? a.parts() : List.of(p);\n        for (Predicate q : parts)\n            if (q instanceof Eq e && e.val() != null && e.col().equals(schema.pkName())) {\n                Row r = byPk.get(e.val());\n                return new Plan(\"primary key lookup on \" + name, r == null ? List.of() : List.of(r));\n            }\n        for (Predicate q : parts)\n            if (q instanceof Eq e && e.val() != null && indexes.containsKey(e.col()))\n                return new Pla

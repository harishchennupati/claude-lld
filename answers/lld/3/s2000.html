crosecond a statement and about three for a five-statement transaction: measured with ten clients, one table takes about 300,000 such transactions a second, and tables do not wait for each other. A chatty client that holds the transaction open across two network round trips turns three microseconds into two hundred. The same table then drops to five thousand a second, which is why the first rung of the ladder is not a data structure at all. Rungs two and three are in the picture, and each has an honest cost written next to it. Row locks let phantoms back in (a new row appearing in a range you already read) unless the range itself is locked. Versions per row need a garbage collector for the old versions, and give up serialisability for snapshot isolation (each transaction reads the database as it was when it began). There is a second budget in an in-memory database, and it is the one that ends the conversation: memory. Measured, a four-column row costs about two hundred bytes of Java objects and each secondary index about fifty more. With two indexes that is three hundred bytes a row, so a gigabyte holds about three million rows. Past that you are not tuning a lock: you are buying RAM, or sharding. Say both numbers before you climb: a rung nobody costed is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 389\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 18)\"><rect width=\"375\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"187.5\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two clients insert the same primary key</text></g><path d=\"M400 37 H445\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(445 18)\"><rect width=\"760\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"380.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the key check and the write inside one lock; test 1: 50 threads, one winner</text></g><g transform=\"translate(25 60)\"><rect width=\"375\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"187.5\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a wrong type, a null, a CHECK that fails</text></g><path d=\"M400 79 H445\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(445 60)\"><rect width=\"760\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"380.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refuse before the lock is taken; test 3: four refusals, nothing written</text></g><g transform=\"translate(25 102)\"><rect width=\"375\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"187.5\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an update changes an indexed column</text></g><path d=\"M400 121 H445\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(445 102)\"><rect width=\"760\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"380.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one door removes the old key and adds the new; test 4: the old key finds nothing</text></g><g transform=\"translate(25 144)\"><rect width=\"375\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"187.5\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a client disappears mid-transaction</text></g><path d=\"M400 163 H445\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(445 144)\"><rect width=\"760\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"380.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">replay the undo log backwards; test 7: every row and index as before</text></g><g transform=\"translate(25 186)\"><rect width=\"375\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"187.5\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the search-index listener is down</text></g><path d=\"M400 205 H445\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(445 186)\"><rect width=\"760\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"380.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every trigger is wrapped, and it runs after the commit; test 8</text></g><g transform=\"translate(25 228)\"><rect width=\"375\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"187.5\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two transactions, two tables, opposite orders</text></g><path d=\"M400 247 H445\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(445 228)\"><rect width=\"760\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"380.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">tryLock with a timeout; the loser rolls back; test 9: nobody hangs</text></g><g transform=\"translate(25 270)\"><rect width=\"375\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"187.5\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same query twice inside one transaction</text></g><path d=\"M400 289 H445\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(445 270)\"><rect width=\"760\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"380.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the table is held to the end, not per statement; test 10: no phantom either</text></g><g transform=\"translate(25 312)\"><rect width=\"375\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"187.5\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an UPDATE of two rows is refused on row 2</text></g><path d=\"M400 331 H445\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(445 312)\"><rect width=\"760\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"380.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">undo back to where the statement began; test 11: row 1 is put back</text></g><text x=\"615\" y=\"376\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a test: FailureTests.java runs fourteen of them, sixty-one checks, and must print ALL PASS</text></svg></div><div class=\"move\"><p>The table above pairs each one with the test that proves it, and three of them are worth a sentence more. The refusals (a wrong type, a null in a NOT NULL column, a failed CHECK, the wrong number of values) all happen before the lock is even taken. So the test checks not only that no row was added, but that the table was not left locked either: the bug people actually ship. Then the quiet one: a report that runs the same query twice inside one transaction and gets two different answers. That cannot happen here, because the table is held to the end of the transaction rather than released after each statement. Test 10 runs the scenario twice, once with the lock and once without, and asserts both outcomes. The last row is the one most designs miss: an UPDATE of two rows whose second row breaks a CHECK. Test 11 commits after the refusal and finds the first row exactly as it was. A design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 350\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"860\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface LockPolicy / RowRule / TableRule / CommitLog, handed in</text><text x=\"860\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a new constraint is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">addTrigger wraps EVERY trigger in SafeTrigger</text><text x=\"860\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">no listener can break a commit</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">db.publish(batch) after the unlock, at commit only</text><text x=\"860\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">a rolled-back row reaches nobody</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Memento</text><text x=\"220\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">the old Row object IS the before-image; undo = apply(after, before)</text><text x=\"860\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">rollback costs nothing to prepare</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Command</text><text x=\"220\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">an UndoEntry is one reversible change; a WAL line is the same thing as text</text><text x=\"860\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">undo, and replay after a restart, are one idea</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">Interpreter</text><text x=\"220\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">move 5</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">Eq / Between / And as objects the planner can READ</text><text x=\"860\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">a where-clause can choose an index</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"220\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">the Database is handed to its callers; nothing calls getInstance()</text><text x=\"860\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh database</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"220\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">ColType's EnumMap is already the registry of types</text><text x=\"860\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when schemas arrive as DDL text</text><rect x=\"20\" y=\"290\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"220\" y=\"309.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">createTable(name, pk, columns...) is three required things</text><text x=\"860\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">it earns a place when columns gain defaults</text><text x=\"615\" y=\"335\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>The table above is the answer; these are the three that need a sentence of defence. Memento is the one this problem really earns: the before-image is the old <code>Row</code> object itself, so a rollback costs nothing to prepare &mdash; free precisely because rows are immutable and an update builds a new one. Command sits next to it: every change is an object holding its before and after. Undoing it is applying it backwards, and the commit batch can be written to a log as text and replayed after a restart. Interpreter is move 5: the where-clause is a little tree the planner can read rather than a lambda it cannot see into, which is the only reason a query can reach for an index at all. The three greyed rows matter as much as the six above them. Singleton earned nothing here, and Factory and Builder each have a specific day they would: schemas arriving as DDL text (CREATE TABLE statements), and a column gaining defaults. A pattern without a move behind it is decoration, and an interviewer can tell.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"450\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"560\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"450\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"560\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Index answers one question. Table owns rows and the lock. Txn owns the undo log.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"450\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">ForeignKeyRule is a new file plus one addRule line</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"450\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">the same race runs against StrictTableLocking and NoLocking, byte for byte</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"450\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">six interfaces have one method; LockPolicy has two: a lock is given back</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"450\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 12</text><text x=\"560\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">db.configure(policy, timeout);  db.setClock(() -&gt; now[0]);  db.setLog(wal)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>S: each class has one reason to change, which move 2 gave you &mdash; an index changes when the answer to one question changes, the table when storage does, the transaction when transaction rules do, and nobody does two of those. O: a foreign key is a new file and one <code>addRule</code> line; nothing in Table or Txn is opened. L: the same fifty-thread race runs byte-identically against <code>StrictTableLocking</code> and <code>NoLocking</code> and nothing asks which policy it got &mdash; which is how the demo can print the lost update appearing and then not appearing. I: seven interfaces, six of them one method, so a fake in a test is a lambda; <code>LockPolicy</code> has two because a lock has to be given back. D: the database is handed its lock policy, its clock, its log and its triggers. That is exactly why a test can hand it a clock that says last Tuesday, a log that fails, and a trigger that throws on purpose.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a foreign key, a CHECK, unique</text></g><path d=\"M355 46 H415\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(415 24)\"><rect width=\"665\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"332.5\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind RowRule or TableRule plus one addRule line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(25 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an audit, a count, a cache</text></g><path d=\"M355 100 H415\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(415 78)\"><rect width=\"665\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"332.5\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more trigger; the table and the lock do not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(25 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">PREPARED, for two-phase commit</text></g><path d=\"M355 154 H415\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(415 132)\"><rect width=\"665\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"332.5\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more transaction state and one more checked transition</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(25 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across rows</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a foreign key, a balance floor</text></g><path d=\"M355 208 H415\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(415 186)\"><rect width=\"665\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"332.5\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the check and the writes inside the SAME lock: all or nothing</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(25 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">persist it; two servers</text></g><path d=\"M355 262 H415\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(415 240)\"><rect width=\"665\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"332.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a CommitLog appends each batch before the unlock; the row update becomes</text><text x=\"332.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE users SET city = ?, version = version + 1 WHERE id = ? AND version = ?</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 3 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the table, the transaction and the tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>The first four are read off the table above. The useful habit is saying which one a twist is before you start typing: for a new rule, which of the two rule interfaces it is <i>tells you</i> whether it runs before the lock or inside it. The fifth is the one that goes furthest: state that must outlive the process. At COMMIT, before the locks are released, the batch is appended to a log on disk, and a failed append fails the commit. Replaying the log against an empty database rebuilds exactly the committed state, and the same log is what you ship to a replica (a copy of the database on another machine). On a real database the in-memory read-modify-write then becomes <code>UPDATE users SET city = ?, version = version + 1 WHERE id = ? AND version = ?</code>. Zero rows updated means somebody got there first: the database took the same all-at-once step our lock did. For all five the table, the transaction and the tests do not change; that is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 930\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M490.0 238L490.0 268\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"496.0\" y=\"257.0\" font-size=\"10.5\" fill=\"var(--muted)\">tables</text><path d=\"M490.0 502L490.0 560\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"496.0\" y=\"535.0\" font-size=\"10.5\" fill=\"var(--muted)\">indexes</text><path d=\"M147.5 270L147.5 322\" fill=\"none\" stroke-width=\"1  text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RowRule</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">check(schema, row)</text></g><g transform=\"translate(950 268)\"><rect width=\"250\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">TypeRule | NotNullRule</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">CheckRule too, all handed in</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">throws ConstraintViolation</text></g><g transform=\"translate(950 348)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">TableRule</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">check(txn, table, b, a)</text></g><g transform=\"translate(950 422)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PrimaryKeyRule</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">reads the table, inside the lock</text></g><g transform=\"translate(950 502)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Trigger</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">afterCommit(batch)</text></g><g transform=\"translate(950 576)\"><rect width=\"250\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SafeTrigger</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">inner: Trigger (wrapped)</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">failures: AtomicInteger</text><line x1=\"0\" y1=\"64\" x2=\"250\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">afterCommit in try/catch</text></g><g transform=\"translate(950 690)\"><rect width=\"250\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">AuditTrigger | CityCount</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">afterCommit(batch)</text></g><g transform=\"translate(950 764)\"><rect width=\"250\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;Extensions.java&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ForeignKeyRule | WalLog</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">+ RestrictDeleteRule; they sit</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">behind TableRule / CommitLog</text></g><g><path d=\"M20 908L64 908\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"912\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 908L284 908\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"912\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 908L504 908\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"912\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 908L684 908\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"912\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 908L904 908\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"912\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the database owns the tables, a table owns its indexes, a transaction owns its undo log. Plain arrow = references. Dashed green = handed in and never built here: the rules, the lock policy, the clock, the log. Dotted blue = notifies. <b>Where state lives:</b> the table has the rows, the indexes, the rules and the one lock &mdash; everything that can change. The schema and every row are immutable, which is why one schema is shared by a million rows, and why the old row object can be kept as the undo image for free. The transaction has the undo log, the tables it is holding and the batch it will publish if it commits. The database has the tables, the triggers, the log, the lock policy and the clock, and no row state at all, which is exactly why a table can be locked without locking the database. <b>One box is not from Main.java:</b> the &laquo;Extensions.java&raquo; box at the bottom right is page 05's code, drawn so you can see that a foreign key and a write-ahead log are new classes behind interfaces that already exist. Notice what is <i>not</i> here: no Query class, because a query is a predicate plus a table; and no Transaction Manager, because a transaction manages itself.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (fourteen claims, sixty-one checks; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * The types a column can hold. The enum is also the type checker: the check is one map lookup, never a chain of\n * ifs, so adding DECIMAL later is one constant and one line in the table below.\n */\nenum ColType {\n    INT, TEXT, BOOL;\n    /** The Java class each column type stores. An EnumMap, so a type check is an array index. */\n    private static final EnumMap&lt;ColType, Class&lt;?&gt;&gt; JAVA = new EnumMap&lt;&gt;(ColType.class);\n    static { JAVA.put(INT, Long.class); JAVA.put(TEXT, String.class); JAVA.put(BOOL, Boolean.class); }\n    /** Can a column of this type hold this value? null is the NOT NULL rule&#x27;s business, not this one&#x27;s. */\n    boolean accepts(Object v) { return v == null || JAVA.get(this).isInstance(v); }\n    /** The Java class behind this type, so a rejection message tells you what to hand it instead. */\n    String javaType() { return JAVA.get(this).getSimpleName(); }\n}\n\n/** One column of a table: its name, its type, and whether it may hold null. Fixed when the table is created. */\nrecord Column(String name, ColType type, boolean notNull) {\n    /** A whole-number column, stored as a long. */\n    static Column intCol(String name, boolean notNull) { return new Column(name, ColType.INT, notNull); }\n    /** A string column. */\n    static Column text(String name, boolean notNull) { return new Column(name, ColType.TEXT, notNull); }\n    /** A true/false column. */\n    static Column bool(String name, boolean notNull) { return new Column(name, ColType.BOOL, notNull); }\n}\n\n/** The one coercion in the system: an int literal becomes a long, so 1 and 1L mean the same column value. */\nfinal class Values {\n    private Values() {}\n    /** Normalise a value handed in from outside. Everything else is stored exactly as given. */\n    static Object norm(Object v) { return (v instanceof Integer i) ? Long.valueOf(i.longValue()) : v; }\n}\n\n/** A rule was broken: a type, a NOT NULL, a CHECK, a duplicate primary key, a foreign key. Nothing of the refused statement stays. */\nclass ConstraintViolation extends RuntimeException {\n    /** @param message what was refused, in words a caller can act on. */\n    ConstraintViolation(String message) { super(message); }\n}\n\n/** This transaction waited for a table longer than it was allowed to. It has been rolled back; retry it. */\nclass LockTimeout extends RuntimeException {\n    /** @param message which table was wanted and for how long. */\n    LockTimeout(String message) { super(message); }\n}\n\n/**\n * The shape of a table: its columns in order, a name-to-position map so a lookup by name is O(1), and which\n * column is the primary key. Immutable, so every row of the table can share one Schema.\n */\nfinal class Schema {\n    private final List&lt;Column&gt; cols;\n    private final Map&lt;String, Integer&gt; pos;\n    private final int pk;\n\n    /** @param pkColumn the name of the primary key column; it must exist and must be NOT NULL. */\n    Schema(String pkColumn, Column... columns) {\n        cols = List.of(columns);\n        Map&lt;String, Integer&gt; p = new LinkedHashMap&lt;&gt;();\n        for (int i = 0; i &lt; cols.size(); i++)\n            if (p.put(cols.get(i).name(), i) != null) throw new IllegalArgumentException(&quot;duplicate column: &quot; + cols.get(i).name());\n        pos = Map.copyOf(p);\n        Integer k = p.get(pkColumn);\n        if (k == null) throw new IllegalArgumentException(&quot;primary key column is not in the table: &quot; + pkColumn);\n        if (!cols.get(k).notNull()) throw new IllegalArgumentException(&quot;a primary key column cannot be nullable: &quot; + pkColumn);\n        pk = k;\n    }\n    /** How many columns the table has. */\n    int size() { return cols.size(); }\n    /** The column at this position. */\n    Column col(int i) { return cols.get(i); }\n    /** The position of a column by name, O(1). Throws if there is no such column, which is a bug, not bad data. */\n    int pos(String name) {\n        Integer i = pos.get(name);\n        if (i == null) throw new IllegalArgumentException(&quot;no such column: &quot; + name);\n        return i;\n    }\n    /** Does the table have this column? Used by the planner before it tries to read a predicate. */\n    boolean has(String name) { return pos.containsKey(name); }\n    /** The position of the primary key column. */\n    int pkIndex() { return pk; }\n    /** The name of the primary key column. */\n    String pkName() { return cols.get(pk).name(); }\n    /** The columns, in order. */\n    List&lt;Column&gt; columns() { return cols; }\n}\n\n/**\n * One row, immutable. An update never edits a row: it builds a new one and swaps it in, which is exactly what\n * makes the undo log free -- the old object IS the before-image, so nothing has to be copied to be able to undo.\n */\nfinal class Row {\n    private final Object[] cells;\n    private final long version;\n    private final long atMs;\n\n    /** @param cells one value per column, in column order; version and atMs come from the database. */\n    Row(Object[] cells, long version, long atMs) { this.cells = cells; this.version = version; this.atMs = atMs; }\n    /** The value in this column position. */\n    Object get(int i) { return cells[i]; }\n    /** The value in this column by name. */\n    Object get(Schema s, String col) { return cells[s.pos(col)]; }\n    /** A number no other write shares, from one database-wide counter: the stamp an optimistic-locking check compares. */\n    long version() { return version; }\n    /** When this version of the row was written, from the injected clock. */\n    long atMs() { return atMs; }\n    /** This row&#x27;s primary key value. */\n    Object pk(Schema s) { return cells[s.pkIndex()]; }\n    /** A copy with some columns replaced. The original is untouched, so it can still be used as the undo image. */\n    Row with(Schema s, Map&lt;String, Object&gt; set, long version, long atMs) {\n        Object[] c = cells.clone();\n        for (Map.Entry&lt;String, Object&gt; e : set.entrySet()) c[s.pos(e.getKey())] = Values.norm(e.getValue());\n        return new Row(c, version, atMs);\n    }\n    /** The row as &quot;id=1, name=Asha, city=Pune&quot;, for a demo print or a failing test&#x27;s message. */\n    String show(Schema s) {\n        StringJoiner j = new StringJoiner(&quot;, &quot;);\n        for (int i = 0; i &lt; cells.length; i++) j.add(s.col(i).name() + &quot;=&quot; + cells[i]);\n        return j.toString();\n    }\n}\n\n/** Where time comes from. Injected, so a test can stamp rows, and time out a lock, at instants it chooses. */\ninterface Clock { long nowMs(); }\n\n/**\n * A where-clause: does this row match? One method, so a lambda is a valid predicate. The two shapes the planner\n * can READ -- Eq and Between -- are what let it reach for an index instead of scanning.\n */\ninterface Predicate {\n    /** True if this row matches. The schema is handed in so a predicate can name columns rather than positions. */\n    boolean test(Schema s, Row r);\n}\n\n/** column = value. On the primary key this is a hash lookup; on an indexed column, an index probe. */\nrecord Eq(String col, Object val) implements Predicate {\n    public boolean test(Schema s, Row r) { return Objects.equals(r.get(s.pos(col)), val); }\n}\n\n/** lo &lt;= column &lt;= hi, both ends included. On an indexed column the planner turns this into a TreeMap subMap. */\nrecord Between(String col, Object lo, Object hi) implements Predicate {\n    public boolean test(Schema s, Row r) {\n        Object v = r.get(s.pos(col));\n        return v != null &amp;&amp; Index.cmp(v, lo) &gt;= 0 &amp;&amp; Index.cmp(v, hi) &lt;= 0;\n    }\n}\n\n/** Every part must match. The planner uses the first part it can turn into an index probe and filters with the rest. */\nrecord And(List&lt;Predicate&gt; parts) implements Predicate {\n    public boolean test(Schema s, Row r) {\n        for (Predicate p : parts) if (!p.test(s, r)) return false;\n        return true;\n    }\n}\n\n/** Matches every row: a full scan, said out loud rather than implied. */\nrecord All() implements Predicate {\n    public boolean test(Schema s, Row r) { return true; }\n}\n\n/** Readable constructors for the where-clause: Where.eq(&quot;city&quot;, &quot;Pune&quot;), Where.between(&quot;age&quot;, 30, 40). */\nfinal class Where {\n    private Where() {}\n    /** column = value. */\n    static Predicate eq(String column, Object value) { return new Eq(column, Values.norm(value)); }\n    /** lo &lt;= column &lt;= hi. */\n    static Predicate between(String column, Object lo, Object hi) { return new Between(column, Values.norm(lo), Values.norm(hi)); }\n    /** All of these must match. */\n    static Predicate and(Predicate... parts) { return new And(List.of(parts)); }\n    /** Every row. */\n    static Predicate all() { return new All(); }\n}\n\n/**\n * A rule that can be judged by looking at the row alone: a type, a NOT NULL, a CHECK. It runs BEFORE any lock is\n * taken and before anything is written, so a bad row never reaches the table at all.\n */\ninterface RowRule {\n    /** Throw ConstraintViolation if this row may not be stored. */\n    void check(Schema s, Row row);\n}\n\n/** Every value must fit its column&#x27;s type. Built in: a table always has this rule. */\nfinal class TypeRule implements RowRule {\n    public void check(Schema s, Row row) {\n        for (int i = 0; i &lt; s.size(); i++) {\n            Column c = s.col(i);\n            if (!c.type().accepts(row.get(i)))\n                throw new ConstraintViolation(&quot;column &quot; + c.name() + &quot; is &quot; + c.type() + &quot; (&quot; + c.type().javaType()\n                    + &quot;), got &quot; + (row.get(i) == null ? &quot;null&quot; : row.get(i).getClass().getSimpleName()));\n        }\n    }\n}\n\n/** A NOT NULL column may not hold null. Built in: a table always has this rule. */\nfinal class NotNullRule implements RowRule {\n    public void check(Schema s, Row row) {\n        for (int i = 0; i &lt; s.size(); i++)\n            if (s.col(i).notNull() &amp;&amp; row.get(i) == null)\n                throw new ConstraintViolation(&quot;column &quot; + s.col(i).name() + &quot; is NOT NULL&quot;);\n    }\n}\n\n/** A CHECK: any predicate over the row itself, handed in when the table is created. */\nfinal class CheckRule implements RowRule {\n    private final Predicate p;\n    private final String message;\n    /** @param p the condition every row must satisfy; message is what the caller is told when it does not. */\n    CheckRule(Predicate p, String message) { this.p = p; this.message = message; }\n    public void check(Schema s, Row row) { if (!p.test(s, row)) throw new ConstraintViolation(&quot;CHECK failed: &quot; + message); }\n}\n\n/**\n * A rule that cannot be judged from the row alone because it has to READ a table: primary key uniqueness, a\n * foreign key. That is the whole reason it runs INSIDE the table lock -- reading and writing must be one step.\n */\ninterface TableRule {\n    /** Throw ConstraintViolation if this change may not happen. before is null for an insert, after for a delete.\n     *  It is handed the transaction, not the database, so a rule that reads another table locks it like any read. */\n    void check(Txn txn, Table t, Row before, Row after);\n}\n\n/** The primary key is unique. Built in, and the one check that must be inside the lock or two inserts both win. */\nfinal class PrimaryKeyRule implements TableRule {\n    public void check(Txn txn, Table t, Row before, Row after) {\n        if (after == null) return;                                   // a delete cannot create a duplicate\n        Object pk = after.pk(t.schema());\n        Row existing = t.row(pk);\n        if (existing != null &amp;&amp; existing != before)                  // identity: an update may keep its own key\n            throw new ConstraintViolation(&quot;duplicate primary key &quot; + t.schema().pkName() + &quot;=&quot; + pk + &quot; in &quot; + t.name());\n    }\n}\n\n/** What happened to one row. INSERT has no before, DELETE has no after, UPDATE has both. */\nenum ChangeKind { INSERT, UPDATE, DELETE }\n\n/** One row change from one committed transaction, handed to the triggers as part of a batch. */\nrecord Change(String table, Schema schema, ChangeKind kind, Row before, Row after) {}\n\n/**\n * Somebody who wants to know what changed: an audit log, a count kept up to date, a cache to refresh.\n * Called AFTER the transaction commits and AFTER every lock is released, with the whole batch in one call.\n * So two commits can call it at the same moment, in either order: a trigger must be thread-safe, and anything\n * that needs the commit order (a log for a restart) is a CommitLog instead, written before the unlock.\n */\ninterface Trigger {\n    /** The changes of one committed transaction, in the order they happened. */\n    void afterCommit(List&lt;Change&gt; batch);\n}\n\n/**\n * The wrapper the database puts around every trigger it is handed. A trigger that throws must not break a commit\n * that already happened, and must not stop the other triggers; the failure is counted instead of swallowed.\n */\nfinal class SafeTrigger implements Trigger {\n    private final Trigger inner;\n    private final AtomicInteger failures = new AtomicInteger();\n    /** @param inner the trigger that was handed in; it is never called directly by the database. */\n    SafeTrigger(Trigger inner) { this.inner = inner; }\n    public void afterCommit(List&lt;Change&gt; batch) {\n        try { inner.afterCommit(batch); } catch (RuntimeException e) { failures.incrementAndGet(); }\n    }\n    /** How many times this trigger has thrown. A number worth putting on a dashboard. */\n    int failures() { return failures.get(); }\n    /** The trigger that was handed in, for a test that wants to read it. */\n    Trigger inner() { return inner; }\n}\n\n/**\n * Where committed changes go so that they outlive the process: a file on disk, a feed to a replica. It is called\n * at COMMIT while the transaction still holds its tables, so the log&#x27;s order is the commit order. It is NOT\n * wrapped like a trigger: a log that fails must fail the commit. The default keeps nothing (memory only).\n */\ninterface CommitLog {\n    /** Append one transaction&#x27;s changes and return only when they are safe; throw if they are not. */\n    void append(List&lt;Change&gt; batch);\n}\n\n/**\n * A secondary index: one column&#x27;s value -&gt; the primary keys that hold it, kept in a TreeMap so &quot;between&quot; is a\n * subMap instead of a scan. Rows whose indexed value is null are not in the index; a query for them scans.\n */\nfinal class Index {\n    private final String column;\n    private final int col;\n    private final TreeMap&lt;Object, LinkedHashSet&lt;Object&gt;&gt; tree = new TreeMap&lt;&gt;(Index::cmp);\n\n    /** @param s the table&#x27;s schema, used once to turn the column name into a position. */\n    Index(Schema s, String column) { this.column = column; this.col = s.pos(column); }\n    /** The column this index is on. */\n    String column() { return column; }\n    /** Compare two values of the same column. They are Long, String or Boolean, so all of them are Comparable. */\n    @SuppressWarnings(&quot;unchecked&quot;)\n    static int cmp(Object a, Object b) { return ((Comparable&lt;Object&gt;) a).compareTo(b); }\n    /** Record that this row, whose primary key is pk, holds its value in this column. */\n    void add(Row r, Object pk) {\n        Object k = r.get(col);\n        if (k == null) return;\n        tree.computeIfAbsent(k, x -&gt; new LinkedHashSet&lt;&gt;()).add(pk);\n    }\n    /** Forget that row. An empty key is removed so a settled index costs no memory. */\n    void remove(Row r, Object pk) {\n        Object k = r.get(col);\n        if (k == null) return;\n        Set&lt;Object&gt; s = tree.get(k);\n        if (s != null) { s.remove(pk); if (s.isEmpty()) tree.remove(k); }\n    }\n    /** The primary keys holding exactly this value: one tree lookup, O(log n). */\n    Set&lt;Object&gt; eq(Object v) {\n        Set&lt;Object&gt; s = tree.get(Values.norm(v));\n        return s == null ? Set.of() : s;\n    }\n    /** The primary keys in this closed range, in key order: O(log n) to find the start, then one step per hit. */\n    List&lt;Object&gt; range(Object lo, Object hi) {\n        List&lt;Object&gt; out = new ArrayList&lt;&gt;();\n        if (cmp(Values.norm(lo), Values.norm(hi)) &gt; 0) return out;    // 35 to 30 is empty, as a scan says; subMap would throw\n        for (Set&lt;Object&gt; s : tree.subMap(Values.norm(lo), true, Values.norm(hi), true).values()) out.addAll(s);\n        return out;\n    }\n    /** How many distinct values the index holds. Used by the planner and by the tests. */\n    int keyCount() { return tree.size(); }\n}\n\n/** How a query will be answered: the access path chosen, and the rows it has to look at. */\nrecord Plan(String how, List&lt;Row&gt; candidates) {}\n\n/**\n * One table: its shape, its rows by primary key, its secondary indexes, its rules and its one lock. Every row\n * change in the whole system goes through this class&#x27;s apply(), which is the only place rows and indexes move.\n */\nfinal class Table {\n    private final String name;\n    private final Schema schema;\n    private final Map&lt;Object, Row&gt; byPk = new HashMap&lt;&gt;();\n    private final Map&lt;String, Index&gt; indexes = new LinkedHashMap&lt;&gt;();\n    private final List&lt;RowRule&gt; rowRules = new ArrayList&lt;&gt;();\n    private final List&lt;TableRule&gt; tableRules = new ArrayList&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n\n    /** A table starts with the three rules every table has: types, NOT NULL, and a unique primary key. */\n    Table(String name, Schema schema) {\n        this.name = name; this.schema = schema;\n        rowRules.add(new TypeRule());\n        rowRules.add(new NotNullRule());\n        tableRules.add(new PrimaryKeyRule());\n    }\n    /** The table&#x27;s name. */\n    String name() { return name; }\n    /** The table&#x27;s shape. */\n    Schema schema() { return schema; }\n    /** The one lock for this table. Taken by the lock policy, never by the table itself. */\n    ReentrantLock lock() { return lock; }\n    /** Hand in a row-level rule (a CHECK). The table never builds one. */\n    Table addRule(RowRule r) { rowRules.add(r); return this; }\n    /** Hand in a table-level rule (a foreign key). It will run inside the lock, with the table already readable. */\n    Table addRule(TableRule r) { tableRules.add(r); return this; }\n\n    /**\n     * Build a secondary index on a column, backfilling from the rows already there, so an index can be added at\n     * any time. Call it while nothing else is running: creating an index is not part of the transaction story.\n     */\n    Index createIndex(String column) {\n        Index ix = new Index(schema, column);\n        for (Map.Entry&lt;Object, Row&gt; e : byPk.entrySet()) ix.add(e.getValue(), e.getKey());\n        indexes.put(column, ix);\n        return ix;\n    }\n    /** The index on this column, or null if there is none. */\n    Index index(String column) { return indexes.get(column); }\n    /** Every index on this table. */\n    Collection&lt;Index&gt; indexes() { return indexes.values(); }\n\n    /** Run every row-level rule. Called before the lock is taken, because none of them needs to read the table. */\n    void checkRow(Row r) { for (RowRule x : rowRules) x.check(schema, r); }\n    /** Run every table-level rule. Called inside the lock, because all of them read the table. */\n    void checkTable(Txn txn, Row before, Row after) { for (TableRule x : tableRules) x.check(txn, this, before, after); }\n\n    /**\n     * THE ONE DOOR every row change passes through: an insert (before = null), an update, a delete (after = null),\n     * and an undo, which is this same call with the two images swapped. Row and indexes move together or not at\n     * all, so there is exactly one place an index could ever go out of step with the rows.\n     */\n    void apply(Row before, Row after) {\n        Object pk = (after != null ? after : before).pk(schema);\n        if (before != null) for (Index ix : indexes.values()) ix.remove(before, pk);\n        if (after == null) byPk.remove(pk); else byPk.put(pk, after);\n        if (after != null) for (Index ix : indexes.values()) ix.add(after, pk);\n    }\n\n    /** Build a row from positional values in column order. Arity is checked here; types are checked by the rules. */\n    Row build(Database db, Object[] values) {\n        if (values.length != schema.size())\n            throw new ConstraintViolation(name + &quot; has &quot; + schema.size() + &quot; columns, got &quot; + values.length + &quot; values&quot;);\n        Object[] cells = new Object[values.length];\n        for (int i = 0; i &lt; values.length; i++) cells[i] = Values.norm(values[i]);\n        return new Row(cells, db.nextVersion(), db.now());\n    }\n\n    /** The row with this primary key, or null. One hash lookup: O(1) at any table size. */\n    Row row(Object pk) { return byPk.get(Values.norm(pk)); }\n    /** How many rows the table holds. */\n    int rowCount() { return byPk.size(); }\n    /** Every row, in primary key order, so a print or a test is deterministic. */\n    List&lt;Row&gt; allRows() { return sortedByPk(byPk.values()); }\n\n    /**\n     * Choose the access path. In order of cheapness: the primary key map, an index probe, an index range, and\n     * only then a full scan. This is the whole query planner: three ifs, and it is why a where-clause is an\n     * object rather than a lambda -- the planner has to be able to READ the predicate to improve on it.\n     */\n    Plan plan(Predicate p) {\n        List&lt;Predicate&gt; parts = (p instanceof And a) ? a.parts() : List.of(p);\n        for (Predicate q : parts)\n            if (q instanceof Eq e &amp;&amp; e.val() != null &amp;&amp; e.col().equals(schema.pkName())) {\n                Row r = byPk.get(e.val());\n                return new Plan(&quot;primary key lookup on &quot; + name, r == null ? List.of() : List.of(r));\n            }\n        for (Predicate q : parts)\n            if (q instanceof Eq e &amp;&amp; e.val() != null &amp;&amp; indexes.containsKey(e.col()))\n                return new Plan(&quot;index probe on &quot; + name + &quot;.&quot; + e.col(), rowsOf(indexes.get(e.col()).eq(e.val())));\n        for (Predicate q : parts)\n            if (q instanceof Between b &amp;&amp; indexes.containsKey(b.col()))\n                return new Plan(&quot;index range on &quot; + name + &quot;.&quot; + b.col(), rowsOf(indexes.get(b.col()).range(b.lo(), b.hi())));\n        return new Plan(&quot;full scan of &quot; + name + &quot; (&quot; + byPk.size() + &quot; rows)&quot;, allRows());\n    }\n\n    /** The rows matching this predicate: the planner picks the candidates, then every candidate is tested. */\n    List&lt;Row&gt; select(Predicate p) {\n        List&lt;Row&gt; out = new ArrayList&lt;&gt;();\n        for (Row r : plan(p).candidates()) if (p.test(schema, r)) out.add(r);\n        return out;\n    }\n\n    /** Turn a list of primary keys from an index into rows, keeping the index&#x27;s order. */\n    private List&lt;Row&gt; rowsOf(Collection&lt;Object&gt; pks) {\n        List&lt;Row&gt; out = new ArrayList&lt;&gt;(pks.size());\n        for (Object pk : pks) { Row r = byPk.get(pk); if (r != null) out.add(r); }\n        return out;\n    }\n    /** Sort by primary key, so a scan has a stable order (a real database promises none without ORDER BY). */\n    private List&lt;Row&gt; sortedByPk(Collection&lt;Row&gt; rows) {\n        List&lt;Row&gt; out = new ArrayList&lt;&gt;(rows);\n        out.sort((a, b) -&gt; Index.cmp(a.pk(schema), b.pk(schema)));\n        return out;\n    }\n}\n\n/**\n * Who may touch a table, and for how long. Handed in, so the same race in main() can be run twice -- once with\n * locking and once without -- and the difference printed rather than described.\n */\ninterface LockPolicy {\n    /** Take the table for the calling transaction, waiting at most timeoutMs. false means &quot;give up and abort&quot;. */\n    boolean acquire(Table t, long timeoutMs);\n    /** Give the table back. Called once per table, when the transaction ends. */\n    void release(Table t);\n}\n\n/**\n * Strict two-phase locking: take a table&#x27;s lock the first time the transaction touches it and hold it until the\n * transaction ends. That is what makes the undo log sound -- nobody else can write a row between the moment this\n * transaction saved its before-image and the moment it decides to put it back.\n */\nfinal class StrictTableLocking implements LockPolicy {\n    public boolean acquire(Table t, long timeoutMs) {\n        try { return t.lock().tryLock(timeoutMs, TimeUnit.MILLISECONDS); }\n        catch (InterruptedException e) { Thread.currentThread().interrupt(); return false; }\n    }\n    public void release(Table t) { t.lock().unlock(); }\n}\n\n/** No locking at all. It exists so the demo can run the same race with it and show what breaks. Never ship it. */\nfinal class NoLocking implements LockPolicy {\n    public boolean acquire(Table t, long timeoutMs) { return true; }\n    public void release(Table t) { }\n}\n\n/** A transaction&#x27;s life. Every operation after it ends throws, rather than quietly doing nothing. */\nenum TxnState { ACTIVE, COMMITTED, ROLLED_BACK }\n\n/** One reversible change: undoing it is apply(after, before) -- the same door, with the two images swapped. */\nrecord UndoEntry(Table table, Row before, Row after) {}\n\n/**\n * One client&#x27;s transaction: the undo log, the tables it holds, and the changes it will publish if it commits.\n * Used only by the thread that began it: a table lock is a ReentrantLock, which only the thread that took it can\n * release. One thread runs one transaction at a time; the concurrency is between transactions, never inside one.\n */\nfinal class Txn {\n    private final Database db;\n    private final long id;\n    private final List&lt;UndoEntry&gt; undo = new ArrayList&lt;&gt;();\n    private final List&lt;Change&gt; pending = new ArrayList&lt;&gt;();\n    private final LinkedHashSet&lt;Table&gt; held = new LinkedHashSet&lt;&gt;();\n    private TxnState state = TxnState.ACTIVE;\n\n    /** @param db the database this transaction runs against; id is for logs and messages. */\n    Txn(Database db, long id) { this.db = db; this.id = id; }\n    /** This transaction&#x27;s number. */\n    long id() { return id; }\n    /** The database this transaction runs against, for a rule that needs to name another table. */\n    Database db() { return db; }\n    /** ACTIVE, COMMITTED or ROLLED_BACK. */\n    TxnState state() { return state; }\n\n    /** Refuse anything after the transaction has ended: a finished transaction is not a usable handle. */\n    private void alive() {\n        if (state != TxnState.ACTIVE) throw new IllegalStateException(&quot;transaction &quot; + id + &quot; is &quot; + state + &quot;; begin a new one&quot;);\n    }\n\n    /**\n     * Take this table&#x27;s lock unless we already hold it, and hold it until the transaction ends. If the wait runs\n     * out this transaction is the deadlock loser: it rolls back (freeing every table it held) and throws.\n     */\n    private void use(Table t) {\n        if (held.add(t) &amp;&amp; !db.locks().acquire(t, db.lockTimeoutMs())) {\n            held.remove(t);\n            rollback();\n            throw new LockTimeout(&quot;transaction &quot; + id + &quot; waited &quot; + db.lockTimeoutMs() + &quot; ms for &quot; + t.name() + &quot; and gave up&quot;);\n        }\n    }\n\n    /**\n     * Insert one row. The order is the whole design: build and validate the row with nothing locked and nothing\n     * written; take the lock; check the rules that must read the table; only then write the row and its indexes.\n     */\n    Row insert(String table, Object... values) {\n        alive();\n        Table t = db.table(table);\n        Row row = t.build(db, values);\n        t.checkRow(row);                                  // types, NOT NULL, CHECK -- no lock held, nothing written\n        use(t);                                           // now the lock, and we keep it until commit or rollback\n        t.checkTable(this, null, row);                      // primary key uniqueness: must read the table, so it is in here\n        write(t, null, row, ChangeKind.INSERT);\n        return row;\n    }\n\n    /**\n     * Update every row matching the where-clause. Each new row can only be built after reading the old one, so its\n     * rules run inside the lock. If the third row is refused, the first two are undone: a statement is all or nothing.\n     */\n    int update(String table, Predicate where, Map&lt;String, Object&gt; set) {\n        alive();\n        Table t = db.table(table);\n        if (set.containsKey(t.schema().pkName()))\n            throw new ConstraintViolation(&quot;a primary key is not editable: delete the row and insert it again&quot;);\n        use(t);\n        int start = undo.size();                              // where this statement began, like a savepoint\n        try {\n            List&lt;Row&gt; hits = t.select(where);\n            for (Row before : hits) {\n                Row after = before.with(t.schema(), set, db.nextVersion(), db.now());\n                t.checkRow(after);\n                t.checkTable(this, before, after);\n                write(t, before, after, ChangeKind.UPDATE);\n            }\n            return hits.size();\n        } catch (RuntimeException e) { undoStatement(start); throw e; }\n    }\n\n    /** Delete every row matching the where-clause. A table rule (a foreign key) may refuse one; then none go. */\n    int delete(String table, Predicate where) {\n        alive();\n        Table t = db.table(table);\n        use(t);\n        int start = undo.size();\n        try {\n            List&lt;Row&gt; hits = t.select(where);\n            for (Row before : hits) {\n                t.checkTable(this, before, null);\n                write(t, before, null, ChangeKind.DELETE);\n            }\n            return hits.size();\n        } catch (RuntimeException e) { undoStatement(start); throw e; }\n    }\n\n    /** A statement that failed half way is undone back to its start; the transaction stays open, as in SQL. */\n    private void undoStatement(int start) {\n        if (state == TxnState.ACTIVE) rollbackTo(start);      // a lock timeout has already rolled everything back\n    }\n\n    /** The table, locked for the rest of this transaction. Every read starts here, and so can code that reads the\n     *  table&#x27;s maps directly (a join, a cost-based planner). */\n    Table table(String table) {\n        alive();\n        Table t = db.table(table);\n        use(t);\n        return t;\n    }\n\n    /** Read the rows matching the where-clause. Reads take the lock too, and keep it: that is what isolation costs. */\n    List&lt;Row&gt; select(String table, Predicate where) { return table(table).select(where); }\n\n    /** How this transaction would answer that query: the access path, for an EXPLAIN-style print. */\n    String explain(String table, Predicate where) {\n        Plan p = table(table).plan(where);\n        return p.how() + &quot;, &quot; + p.candidates().size() + &quot; row(s) examined&quot;;\n    }\n\n    /** One write: through the table&#x27;s single door, then one undo entry and one pending change, always in step. */\n    private void write(Table t, Row before, Row after, ChangeKind kind) {\n        t.apply(before, after);\n        undo.add(new UndoEntry(t, before, after));\n        pending.add(new Change(t.name(), t.schema(), kind, before, after));\n    }\n\n    /** A SQL SAVEPOINT: how many changes this transaction has made so far. Locks are not released -- they are held to the end. */\n    int savepoint() { alive(); return undo.size(); }\n\n    /** Undo everything done since that savepoint and keep the transaction open. Nested BEGIN is this, with a name. */\n    void rollbackTo(int savepoint) {\n        alive();\n        if (savepoint &lt; 0 || savepoint &gt; undo.size()) throw new IllegalArgumentException(&quot;no such savepoint: &quot; + savepoint);\n        for (int i = undo.size() - 1; i &gt;= savepoint; i--) {\n            UndoEntry e = undo.remove(i);\n            e.table().apply(e.after(), e.before());\n            pending.remove(pending.size() - 1);           // undo and pending grow in step, one entry per change\n        }\n    }\n\n    /**\n     * Commit, in three steps. The batch goes to the log while the tables are still held, so the log&#x27;s order is the\n     * commit order; if the log throws, the transaction is rolled back and the caller is told. Then the locks are\n     * released. Only then are the triggers told, so a trigger never runs while a table is held.\n     */\n    void commit() {\n        alive();\n        List&lt;Change&gt; batch = List.copyOf(pending);\n        if (!batch.isEmpty()) {\n            try { db.log().append(batch); }                   // the commit point: a failed append is a failed commit\n            catch (RuntimeException e) { rollback(); throw e; }\n        }\n        state = TxnState.COMMITTED;\n        undo.clear(); pending.clear();\n        releaseAll();\n        if (!batch.isEmpty()) db.publish(batch);\n    }\n\n    /** Roll back: replay the undo log backwards through the same door, release every table, publish nothing. */\n    void rollback() {\n        if (state != TxnState.ACTIVE) return;             // rolling back a finished transaction is a no-op, not an error\n        for (int i = undo.size() - 1; i &gt;= 0; i--) {\n            UndoEntry e = undo.get(i);\n            e.table().apply(e.after(), e.before());\n        }\n        state = TxnState.ROLLED_BACK;\n        undo.clear(); pending.clear();\n        releaseAll();\n    }\n\n    /** Give back every table this transaction took, in the order it took them. */\n    private void releaseAll() {\n        for (Table t : held) db.locks().release(t);\n        held.clear();\n    }\n}\n\n/**\n * The database: the tables, the triggers, the log, the lock policy and the clock. It hands out transactions and\n * publishes their batches; it owns no row state itself, which is why a table can be locked without locking the database.\n */\nfinal class Database {\n    private final Map&lt;String, Table&gt; tables = new ConcurrentHashMap&lt;&gt;();\n    private final List&lt;SafeTrigger&gt; triggers = new CopyOnWriteArrayList&lt;&gt;();\n    private final AtomicLong txnIds = new AtomicLong();\n    private final AtomicLong versions = new AtomicLong();\n    private volatile LockPolicy locks = new StrictTableLocking();\n    private volatile Clock clock = System::currentTimeMillis;\n    private volatile CommitLog log = batch -&gt; { };\n    private volatile long lockTimeoutMs = 500;\n\n    /** Create a table. DDL (a statement that creates or drops a table) is not transactional here: do it before the clients arrive. */\n    Table createTable(String name, String pkColumn, Column... columns) {\n        Table t = new Table(name, new Schema(pkColumn, columns));\n        if (tables.putIfAbsent(name, t) != null) throw new IllegalArgumentException(&quot;table already exists: &quot; + name);\n        return t;\n    }\n    /** Drop a table and every row in it. DDL again: do it when no client is using the table. */\n    void dropTable(String name) {\n        if (tables.remove(name) == null) throw new IllegalArgumentException(&quot;no such table: &quot; + name);\n    }\n    /** The table with this name. Throws if there is none, which is a bug in the query, not bad data. */\n    Table table(String name) {\n        Table t = tables.get(name);\n        if (t == null) throw new IllegalArgumentException(&quot;no such table: &quot; + name);\n        return t;\n    }\n    /** Every table, in name order. */\n    List&lt;Table&gt; tables() {\n        List&lt;Table&gt; out = new ArrayList&lt;&gt;(tables.values());\n        out.sort(Comparator.comparing(Table::name));\n        return out;\n    }\n    /** Hand in the locking policy and the deadlock timeout. The database never builds them itself. */\n    void configure(LockPolicy policy, long lockTimeoutMs) { this.locks = policy; this.lockTimeoutMs = lockTimeoutMs; }\n    /** Hand in the clock. Tests use it to stamp rows at an instant they choose. */\n    void setClock(Clock c) { this.clock = c; }\n    /** Hand in the commit log. It is not wrapped: if it throws, the commit fails and is rolled back. */\n    void setLog(CommitLog l) { this.log = l; }\n    /** The commit log in force. By default it keeps nothing, because this database lives in memory only. */\n    CommitLog log() { return log; }\n    /** Add a trigger. It is wrapped, so one that throws cannot break a commit or stop the others. */\n    SafeTrigger addTrigger(Trigger t) { SafeTrigger s = new SafeTrigger(t); triggers.add(s); return s; }\n    /** How many times any trigger has thrown since startup. */\n    int triggerFailures() { int n = 0; for (SafeTrigger t : triggers) n += t.failures(); return n; }\n    /** Now, from the injected clock. */\n    long now() { return clock.nowMs(); }\n    /** The next row version. One counter for the whole database, so no two writes ever share a version. */\n    long nextVersion() { return versions.incrementAndGet(); }\n    /** The lock policy in force. */\n    LockPolicy locks() { return locks; }\n    /** How long a transaction waits for a table before it gives up and rolls back. */\n    long lockTimeoutMs() { return lockTimeoutMs; }\n    /** Tell every trigger about one committed batch. Called after the locks are gone, never inside them. */\n    void publish(List&lt;Change&gt; batch) { for (SafeTrigger t : triggers) t.afterCommit(batch); }\n    /** Begin a transaction. It belongs to the thread that begins it. */\n    Txn begin() { return new Txn(this, txnIds.incrementAndGet()); }\n\n    /** Autocommit: one insert in its own transaction. A failure rolls back and rethrows, so nothing is half done. */\n    Row insert(String table, Object... values) {\n        Txn t = begin();\n        try { Row r = t.insert(table, values); t.commit(); return r; }\n        catch (RuntimeException e) { t.rollback(); throw e; }\n    }\n    /** Autocommit: one update in its own transaction. */\n    int update(String table, Predicate where, Map&lt;String, Object&gt; set) {\n        Txn t = begin();\n        try { int n = t.update(table, where, set); t.commit(); return n; }\n        catch (RuntimeException e) { t.rollback(); throw e; }\n    }\n    /** Autocommit: one delete in its own transaction. */\n    int delete(String table, Predicate where) {\n        Txn t = begin();\n        try { int n = t.delete(table, where); t.commit(); return n; }\n        catch (RuntimeException e) { t.rollback(); throw e; }\n    }\n    /** Autocommit: one read in its own transaction. */\n    List&lt;Row&gt; select(String table, Predicate where) {\n        Txn t = begin();\n        try { List&lt;Row&gt; rows = t.select(table, where); t.commit(); return rows; }\n        catch (RuntimeException e) { t.rollback(); throw e; }\n    }\n    /** Autocommit: how that query would be answered. */\n    String explain(String table, Predicate where) {\n        Txn t = begin();\n        try { String s = t.explain(table, where); t.commit(); return s; }\n        catch (RuntimeException e) { t.rollback(); throw e; }\n    }\n}\n\n/**\n * An audit trigger: keeps one line per committed row change. The simplest possible listener, and still it must be\n * thread-safe, because two commits can call it at the same moment.\n */\nfinal class AuditTrigger implements Trigger {\n    private final List&lt;String&gt; lines = Collections.synchronizedList(new ArrayList&lt;&gt;());\n    public void afterCommit(List&lt;Change&gt; batch) {\n        for (Change c : batch) {\n            Row r = c.after() != null ? c.after() : c.before();\n            lines.add(c.kind() + &quot; &quot; + c.table() + &quot; [&quot; + r.show(c.schema()) + &quot;]&quot;);\n        }\n    }\n    /** A copy of everything this trigger has seen. */\n    List&lt;String&gt; lines() { return List.copyOf(lines); }\n}\n\n/**\n * A materialised count (a result kept up to date as rows change, so reading it needs no scan): &quot;how many users in\n * each city&quot;, in O(1). It is the mid-round change that costs one class and one line, because the database already\n * announces what changed. Adding and subtracting give the same total in any order, so batches may arrive in any order.\n */\nfinal class CityCount implements Trigger {\n    private final String table, column;\n    private final Map&lt;String, Integer&gt; counts = new ConcurrentHashMap&lt;&gt;();\n    /** @param table the table to watch; column the text column to count by. */\n    CityCount(String table, String column) { this.table = table; this.column = column; }\n    public void afterCommit(List&lt;Change&gt; batch) {\n        for (Change c : batch) {\n            if (!c.table().equals(table)) continue;\n            if (c.before() != null) add((String) c.before().get(c.schema(), column), -1);\n            if (c.after() != null) add((String) c.after().get(c.schema(), column), +1);\n        }\n    }\n    private void add(String key, int delta) { if (key != null) counts.merge(key, delta, (a, b) -&gt; a + b == 0 ? null : a + b); }\n    /** How many rows hold that value, without touching the table. */\n    int count(String value) { return counts.getOrDefault(value, 0); }\n    /** The whole tally, for a print. */\n    Map&lt;String, Integer&gt; all() { return new TreeMap&lt;&gt;(counts); }\n}\n\n/** The demo and the race. Run it: java Main. */\npublic class Main {\n    /** Build the two tables, their indexes and their rules. Used by the demo and by the tests. */\n    static Database sample() {\n        Database db = new Database();\n        db.c

ation, a cache, undo</text></g><g transform=\"translate(760 140)\"><rect width=\"430\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BadgeManager, ModerationQueue, RepReversal</text><text x=\"215.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what can be handed in</text></g><path d=\"M760 162 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 120 H330 V220 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 198)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock + Directory</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where time and people come from</text></g><g transform=\"translate(760 198)\"><rect width=\"430\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::currentTimeMillis, so::user</text><text x=\"215.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what can be handed in</text></g><path d=\"M760 220 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The service never builds a rule, so a new reputation policy is a new class and one changed line</text><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one rule wraps another: DailyCap(adder, 200) caps what anybody earns in a day without the vote path learning that caps exist</text></svg></div><div class=\"move\"><p>The reputation numbers will change: they are policy, and an interviewer will change them in front of you. How a delta <i>lands</i> will change too, the moment somebody says \"cap it at two hundred a day\". Who wants to know will change: badges today, a moderation queue tomorrow, a cache for the front page after that. Each becomes a one-method interface the service is <i>given</i> and never builds: <code>ReputationRules</code> with <code>pointsFor(reason)</code>, <code>RepAward</code> with <code>award(user, delta, at)</code>, <code>PostListener</code> with <code>onEvent(e)</code>, plus <code>Clock</code> and <code>Directory</code>. This is where the patterns come from, not the other way round: a swappable rulebook behind an interface is <b>Strategy</b>; <code>DailyCap</code>, which wraps the plain adder and hands on less, is <b>Decorator</b>; a service that announces \"a vote happened\" without knowing what a badge is, is <b>Observer</b>. The one subtlety worth saying out loud: the cap wraps the <i>award</i> rule and not the rulebook, because the rulebook is asked twice per vote &mdash; once for the old state, once for the new &mdash; and so it has to stay pure.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Carol's tab</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads score 41</text></g><g transform=\"translate(30 110)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Dan's tab</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads score 41</text></g><g transform=\"translate(350 70)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a1.score</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">41</text></g><path d=\"M220 52 H350 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M220 132 H350 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"285\" y=\"40\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"285\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"580\" y=\"20\" width=\"300\" height=\"140\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"730\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"730\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both read 41, both write 42</text><text x=\"730\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">one upvote is gone, and so is +10</text><text x=\"730\" y=\"130\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: read and write as ONE step</text><g transform=\"translate(910 40)\"><rect width=\"290\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Question.lock</text><text x=\"145.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">check, ledger, score, reputation</text></g><text x=\"1055\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock lives where the shared state lives</text><text x=\"1055\" y=\"185\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one lock per QUESTION: two threads never wait</text></svg></div><div class=\"move\"><p>Carol and Dan upvote the same answer at the same instant. Both read the score as 41, both add one, both write 42: one upvote has vanished, and so has ten points of somebody's reputation, and nothing looks wrong afterwards. So reading the ledger and writing the score must be one step, in the class that owns both: the question thread. The lock is per <i>question</i>, which is the whole trick &mdash; twenty-four million threads take votes in parallel and never wait for each other, while the people inside one thread are serialised for about a microsecond. Reputation is the exception that proves the rule: one user is voted on from many different threads at once, each holding a different lock, so it cannot live under any of them. It is one number with no companion invariant, so it is an <code>AtomicLong</code> and the add is lock-free &mdash; and because additions commute, the total is right whatever order they arrive in. Anything that only listens is called after the lock is released.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 310\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 16)\"><rect width=\"380\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which way did this user vote?</text></g><path d=\"M410 34 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 16)\"><rect width=\"540\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;userId, VoteType&gt;, on the post</text></g><path d=\"M1000 34 H1050\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1050 16)\"><rect width=\"150\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 60)\"><rect width=\"380\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is this post's score?</text></g><path d=\"M410 78 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 60)\"><rect width=\"540\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an int field, written with the ledger</text></g><path d=\"M1000 78 H1050\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1050 60)\"><rect width=\"150\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 104)\"><rect width=\"380\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which post in this thread is that id?</text></g><path d=\"M410 122 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 104)\"><rect width=\"540\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;postId, Post&gt;, inside the question</text></g><path d=\"M1000 122 H1050\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1050 104)\"><rect width=\"150\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 148)\"><rect width=\"380\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which thread owns this post?</text></g><path d=\"M410 166 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 148)\"><rect width=\"540\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;postId, questionId&gt;, in the service</text></g><path d=\"M1000 166 H1050\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1050 148)\"><rect width=\"150\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 192)\"><rect width=\"380\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which questions carry this tag or word?</text></g><path d=\"M410 210 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 192)\"><rect width=\"540\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;word, Set&lt;questionId&gt;&gt;</text></g><path d=\"M1000 210 H1050\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1050 192)\"><rect width=\"150\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(matches)</text></g><g transform=\"translate(30 236)\"><rect width=\"380\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"190.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">may this user downvote yet?</text></g><path d=\"M410 254 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 236)\"><rect width=\"540\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an enum of thresholds, one compare</text></g><path d=\"M1000 254 H1050\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1050 236)\"><rect width=\"150\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><text x=\"615\" y=\"296\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the score is STORED and moved with the ledger entry, never recomputed by counting votes: that is what makes a hot question cheap to read</text></svg></div><div class=\"move\"><p>The table is the move, and two of its rows carry the round. The score is an <code>int</code> field written in the same step as the ledger entry and never recomputed by counting the map: recomputing is the mistake that makes a front-page question expensive exactly when it is popular. And \"which thread owns this post?\" is one map in the service, which is what turns <code>vote(postId, ...)</code> into two hash lookups &mdash; without it, voting on an answer means finding its question first. The rest follow the same rule, which is to ask the question before choosing the shape: the inverted index costs the number of matches rather than the number of questions on the site, and the privilege check is an enum of thresholds and one comparison rather than an if-chain scattered through the service.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 245\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">OPEN</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">answers and comments land</text></g><g transform=\"translate(300 30)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CLOSED</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no new answers; still votable</text></g><g transform=\"translate(165 130)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DELETED</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">terminal; out of the index</text></g><path d=\"M230 46 H300\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M300 62 H230\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M265 74 V130\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"265\" y=\"22\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">close / reopen</text><rect x=\"560\" y=\"20\" width=\"650\" height=\"190\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"885\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside a vote, and why it is this order</text><text x=\"575\" y=\"68\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 take the thread's lock and find the post in the id map</text><text x=\"575\" y=\"89\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 refuse a self-vote, an unknown post, too little reputation</text><text x=\"575\" y=\"110\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 read the vote this user had before -- the same one again returns now</text><text x=\"575\" y=\"131\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4 only now write: the ledger entry, the score, the author's counter</text><text x=\"575\" y=\"152\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5 unlock, then tell the listeners inside a try/catch</text><text x=\"575\" y=\"173\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a refused vote leaves every score and every reputation untouched;</text><text x=\"575\" y=\"194\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the three writes in step 4 are field writes that cannot fail half way</text><text x=\"615\" y=\"230\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">three states and one rule: nothing is written until every check has passed. Accepting follows the same order -- reverse the old award, then make the new one.</text></svg></div><div class=\"move\"><p>A question is OPEN when it is asked, CLOSED when somebody with the close privilege closes it, OPEN again if it is reopened, and DELETED once &mdash; terminal, out of the search index, and refused to anybody who is neither the asker nor a moderator. Writing the states down forces the questions the interviewer will ask: can you still vote on a closed question? Yes, and only new answers and comments are refused. Then the order, which is the real answer to \"what happens when it fails\". Take the thread's lock, find the post, and refuse a self-vote, an unknown post, or a voter without the reputation for it. Read the vote this user had before &mdash; if it is the same one, return now, and that is what makes a retried request safe. Only then write, and the three writes are a map entry, an <code>int</code> and one atomic add: field writes that cannot fail half way. Unlock, then tell the listeners inside a try/catch. Accepting follows the same shape: check the actor is the asker, take back the previous fifteen points, then award the new ones, all inside one lock, so nobody can read a thread where two answers look accepted or none does. What happens to the reputation a deleted thread paid out is policy rather than mechanism, and the ledger is what makes either answer cheap: page 05 has the listener that hands every point back.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one thread's votes happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 315\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"545\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"272.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about one microsecond</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">find the post in the thread's id map</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">read this voter's previous vote</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">write the ledger entry and the score</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">one atomic add to the author's counter</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">about six operations, no allocation worth the name</text></g><path d=\"M575 95 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"607\" y=\"85\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: milliseconds to seconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">indexing the question's words: at ask time</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the badge listener: after the unlock</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">rendering the page: about 20 ms</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the reader deciding to click: seconds</text></g><text x=\"615\" y=\"200\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">ten people upvote the same answer at the same instant</text><g transform=\"translate(30 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">voter 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(148 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">voter 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 1 us</text></g><g transform=\"translate(266 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">voter 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 2 us</text></g><g transform=\"translate(384 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">voter 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 3 us</text></g><g transform=\"translate(502 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">voter 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 4 us</text></g><g transform=\"translate(620 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">voter 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 5 us</text></g><g transform=\"translate(738 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">voter 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 6 us</text></g><g transform=\"translate(856 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">voter 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 7 us</text></g><g transform=\"translate(974 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">voter 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 8 us</text></g><g transform=\"translate(1092 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">voter 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 9 us</text></g><text x=\"615\" y=\"283\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tenth voter waits nine microseconds for the lock and then twenty milliseconds for the page to redraw:</text><text x=\"615\" y=\"301\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one at a time is true, and nobody can tell, because nothing slow is allowed inside the lock</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself: if every vote takes the thread's lock, have you made Stack Overflow a queue? You have, for about one microsecond, and only for the people reading that one question. The picture lists everything the lock covers: two map lookups, a map write, an <code>int</code> add and one atomic add, with no allocation worth the name. Everything slow is deliberately outside it &mdash; a question's words are indexed when it is asked, not when it is voted on, and the listeners run after the unlock inside a try/catch, so a broken badge rule cannot break a vote that already happened. When ten people upvote the same answer at the same instant, the tenth waits about nine microseconds for the lock and then twenty milliseconds for the page to redraw, and cannot tell the difference.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per question thread: is it a bottleneck?</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the locked part of a vote: about six operations, roughly 1 us</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the real site takes a few votes a second across 24 million questions</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a front-page question at its peak: about 20 votes a second</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">even 1000 votes a second into ONE thread is 1 ms of lock per second</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">that is 0.1% busy, and the lock is per question: threads never meet</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 index, listeners and rendering outside the lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done; reputation is already a lock-free counter</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 a lock per POST instead of per thread</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">buys parallel votes on different answers, costs the single-accept invariant</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 a row per vote in the database</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">unique key on (post_id, voter_id), UPDATE posts SET score = score + ?</text></g></svg></div><div class=\"move\"><p>The whole site takes a few votes a second spread over twenty-four million questions; a question on the front page at its peak might take twenty a second. Against a lock held for one microsecond, even an imaginary thread taking a thousand votes a second holds its lock one millisecond in every second: busy a tenth of one per cent of the time, and that is per question, so the number of questions is irrelevant. Then the ladder, in the order you would climb it. First, keep indexing, listeners and rendering outside the lock, which this code already does, and keep reputation as a lock-free counter, which it already is. Second, if one thread ever needed it, move the lock from the question down to the post, so votes on different answers of the same question stop waiting &mdash; and say the price out loud: the single-accepted-answer invariant spans two posts, so it would need the thread's lock anyway. Third, beyond one process, every vote becomes a row with a unique key on (post_id, voter_id) and the score becomes <code>UPDATE posts SET score = score + ?</code> in the same transaction, which is the database performing exactly the atomic step the lock performed. Say the arithmetic first: climbing without it is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 347\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">fifty people vote in the same instant</text></g><path d=\"M350 37 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 18)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lock per thread; test 1: 100 calls, 50 voters, score exactly 50</text></g><g transform=\"translate(30 60)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same vote arrives twice</text></g><path d=\"M350 79 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 60)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the ledger is read before anything is written; test 1: the second call does nothing</text></g><g transform=\"translate(30 102)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a voter flips, then takes it back</text></g><path d=\"M350 121 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 102)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">new minus old; test 2: score and reputation return to exactly zero</text></g><g transform=\"translate(30 144)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a downvote drags a new user below zero</text></g><path d=\"M350 163 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 144)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">store the truth, floor on the read; test 7: retracting gives back exactly 1</text></g><g transform=\"translate(30 186)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the asker changes the accepted answer</text></g><path d=\"M350 205 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 186)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reverse, then award, under one lock; test 4: the +15 moves, it is not duplicated</text></g><g transform=\"translate(30 228)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the badge listener throws</text></g><path d=\"M350 247 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 228)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish after the unlock in a try/catch; test 8: the vote still landed</text></g><g transform=\"translate(30 270)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a thread with 40 upvotes is deleted</text></g><path d=\"M350 289 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 270)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the ledger is the undo log; test 9: every point paid out comes back, once</text></g><text x=\"615\" y=\"334\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a failure test: FailureTests.java runs nine blocks of them and must print ALL PASS</text></svg></div><div class=\"move\"><p>The seven rows above are the list, and three of them are worth saying out loud. The reputation floor is the subtle one: store a clamped number and retracting a downvote hands out points that were never taken, so the true signed number is what lives on the user and the floor lives on the read. Publishing after the unlock is the second: a badge listener that throws must not be able to undo a vote that already happened. Deleting a thread is the third: because the ledger says which way every voter went, one pass can hand back exactly what that thread paid out, and it must run once and not twice. Each row is a few lines in FailureTests.java, which prints ALL PASS or exits non-zero; a design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 350\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill xt><text x=\"330\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">OPEN &harr; CLOSED, DELETED terminal, checked before a write</text><text x=\"870\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">an answer on a closed question cannot happen</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Template Method</text><text x=\"240\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 1</text><text x=\"330\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">abstract PostKind kind() -- the one thing each post answers</text><text x=\"870\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">one vote path for three kinds of post</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">Facade</text><text x=\"240\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"330\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">so.vote(postId, voterId, UP): two O(1) hops, no lock in sight</text><text x=\"870\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">callers never touch an index or a lock</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"240\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"330\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">the service is handed to its callers; nothing calls getInstance()</text><text x=\"870\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh QaService</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"240\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"330\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">the RepReason &rarr; points EnumMap IS the registry, one line per rule</text><text x=\"870\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when rules come from config</text><rect x=\"20\" y=\"290\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"240\" y=\"309.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"330\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">a question has four fields and all four are required</text><text x=\"870\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">it earns a place when bounties and flags arrive</text><text x=\"615\" y=\"335\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>Every pattern in the table came out of a move, which is why each gets one line and not a paragraph. Three are worth a sentence more. Decorator is the one people put in the wrong place: <code>DailyCap</code> wraps the <i>award</i> rule and not the rulebook, because the rulebook is asked twice per vote &mdash; once for the old state, once for the new &mdash; and has to stay pure. Observer is why the word \"badge\" appears nowhere in <code>vote()</code>: move 3 handed the interface in, move 4 said nothing slow may sit inside the lock, and between them badges, the moderation queue, the page cache and the undo that runs when a thread is deleted are all just listeners. Template Method is the quiet one: <code>Post</code> holds the whole voting machinery and leaves exactly one thing abstract, <code>kind()</code>, which is how one vote path serves three kinds of post. The last three rows are the ones that earned nothing, and the table says what would change that.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"470\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"470\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Post: the ledger. Question: the flow and the lock. Rules: the numbers. Index: the words.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"470\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">BadgeManager is a new file and one more argument to configure()</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"470\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">moves 1, 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">the vote path calls post.kind(); it never asks \"is this an answer?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: take only what you use</text><text x=\"470\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 1</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">Comment is votable but not Commentable, so it carries no comment list</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"470\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">configure(rules, listeners);  setAwards(...);  setClock(() -&gt; t)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>The table is the whole move: five letters, five lines of this code, nothing recited. The one worth defending out loud is I, because it is the letter people skip: a comment is votable but not <code>Commentable</code>, so it carries no comment list it would never use, and \"you cannot comment on a comment\" becomes a type question rather than a runtime check. D is the one a test cashes in: the question is handed its rulebook, its award rule, its clock and its listeners, which is why a test can give it numbers that pay double, a clock stuck on last Tuesday and a listener that throws on purpose. If a letter cannot be pointed at a line, the moves did not do their job.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the numbers change; a daily cap</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new ReputationRules, or a RepAward wrapper, plus one configure line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">badges, moderation, undo on delete</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more listener; Post, the lock and the vote path do not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">on hold, protected, duplicate</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more QuestionState and one more checked transition</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across posts</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a bounty that may not go negative</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the check and the writes inside the SAME thread lock: all or nothing</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">persist it; two servers</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the voters map becomes a table with a unique key on (post_id, voter_id)</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">and the score becomes UPDATE posts SET score = score + ? in the same transaction</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the question, the post and the tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (the numbers change, a daily cap, downvoting costs the voter a point) is a new <code>ReputationRules</code> or a <code>RepAward</code> wrapper plus one configure line. Someone new who wants to know (badges, a moderation queue, a hot-question cache, the undo that runs when a thread is deleted) is one more listener. A new step in a life (on hold, protected, duplicate) is one more <code>QuestionState</code> and one more checked transition. A new invariant across posts (a bounty that may not leave a user negative) is the check and the writes inside the <i>same</i> thread lock, all or nothing. And state that must outlive the process is the voters map becoming a table with a unique key on (post_id, voter_id), while the score becomes <code>UPDATE posts SET score = score + ?</code> in the same transaction: the database performing the atomic step the lock performed. For all five the question, the post and the tests are untouched; that is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">users: Map&lt;id, User&gt;</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">questions: Map&lt;id, Question&gt;</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">home: Map&lt;postId, questionId&gt;</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">index: SearchIndex</text><text x=\"8\" y=\"103\" font-size=\"11.5\" fill=\"var(--muted)\">listeners: List&lt;PostListener&gt;</text><text x=\"8\" y=\"119\" font-size=\"11.5\" fill=\"var(--muted)\">rules / awards / clock / ids</text><line x1=\"0\" y1=\"128\" x2=\"250\" y2=\"128\" stroke=\"var(--line)\"/><text x=\"8\" y=\"141\" font-size=\"11.5\" fill=\"var(--text)\">ask / answer / comment</text><text x=\"8\" y=\"157\" font-size=\"11.5\" fill=\"var(--text)\">vote / retractVote / accept</text><text x=\"8\" y=\"173\" font-size=\"11.5\" fill=\"var(--text)\">close / reopen / delete / edit</text><text x=\"8\" y=\"189\" font-size=\"11.5\" fill=\"var(--text)\">byTag / byWord / byAuthor</text><text x=\"8\" y=\"205\" font-size=\"11.5\" fill=\"var(--text)\">configure / setAwards / setClock</text></g><g transform=\"translate(10 290)\"><rect width=\"250\" height=\"122\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SearchIndex</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">byWord / byTag / byAuthor:</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">  Map&lt;String, Set&lt;questionId&gt;&gt;</text><line x1=\"0\" y1=\"64\" x2=\"250\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">add(q) / remove(q)</text><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">byTag / byWord / byAuthor</text><text x=\"8\" y e x1=\"0\" y1=\"26\" x2=\"225\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">id / name: String</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">rep: AtomicLong</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">badges: Set&lt;String&gt;</text><line x1=\"0\" y1=\"80\" x2=\"225\" y2=\"80\" stroke=\"var(--line)\"/><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">reputation(): floored at 0</text><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">rawReputation(): the truth</text><text x=\"8\" y=\"125\" font-size=\"11.5\" fill=\"var(--text)\">addRep(delta): lock-free</text><text x=\"8\" y=\"141\" font-size=\"11.5\" fill=\"var(--text)\">can(Privilege): boolean</text></g><g transform=\"translate(690 212)\"><rect width=\"225\" height=\"50\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"112.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"112.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">VoteType</text><line x1=\"0\" y1=\"34\" x2=\"225\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">UP(+1), DOWN(-1)</text></g><g transform=\"translate(690 282)\"><rect width=\"225\" height=\"50\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"112.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"112.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PostKind</text><line x1=\"0\" y1=\"34\" x2=\"225\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">QUESTION, ANSWER, COMMENT</text></g><g transform=\"translate(690 352)\"><rect width=\"225\" height=\"50\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"112.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"112.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">QuestionState</text><line x1=\"0\" y1=\"34\" x2=\"225\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">OPEN, CLOSED, DELETED</text></g><g transform=\"translate(690 422)\"><rect width=\"225\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"112.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"112.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RepReason</text><line x1=\"0\" y1=\"34\" x2=\"225\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">QUESTION_UP / _DOWN,</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">ANSWER_UP / _DOWN, ACCEPTED ...</text></g><g transform=\"translate(690 508)\"><rect width=\"225\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"112.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"112.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Privilege</text><line x1=\"0\" y1=\"34\" x2=\"225\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">VOTE_UP(15), COMMENT(50),</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">VOTE_DOWN(125), CLOSE(500)</text></g><g transform=\"translate(690 594)\"><rect width=\"225\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"112.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"112.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">EventKind</text><line x1=\"0\" y1=\"34\" x2=\"225\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">ASKED, ANSWERED, VOTED,</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">ACCEPTED, CLOSED, DELETED ...</text></g><g transform=\"translate(955 20)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ReputationRules</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">pointsFor(RepReason): int</text></g><g transform=\"translate(955 98)\"><rect width=\"260\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DefaultRules</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">table: EnumMap</text><line x1=\"0\" y1=\"48\" x2=\"260\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">+5 / +10 / -2 / +15 / +2</text></g><g transform=\"translate(955 196)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RepAward</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">award(user, delta, at): int</text></g><g transform=\"translate(955 274)\"><rect width=\"260\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">the plain adder</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">a lambda, not a class</text><line x1=\"0\" y1=\"48\" x2=\"260\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">user.addRep(delta)</text></g><g transform=\"translate(955 352)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Clock</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">nowMs(): long</text></g><g transform=\"translate(955 430)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Directory</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">byId(userId): User</text></g><g transform=\"translate(955 508)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Commentable</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">comments(): List&lt;Comment&gt;</text></g><g><path d=\"M20 706L64 706\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"710\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 706L284 706\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"710\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 706L504 706\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"710\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 706L684 706\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"710\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 706L904 706\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"710\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (italic = abstract, dashed border = interface, &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = extends or implements: a question, an answer and a comment are all posts, and both a question and an answer are commentable while a comment is not. Filled diamond = owns: the question owns every answer and comment in its thread, the service owns every thread. Plain arrow = references. Dashed lavender = handed in through <code>configure()</code>, <code>setAwards()</code> and <code>setClock()</code>. Dotted blue = notifies. <b>Where state lives:</b> a post holds its own body, its score and the map of who voted which way; the question holds the answers, the comments, the id map, the accepted flag, the state and the one lock that makes a vote atomic; a user holds a reputation counter that is written from many threads at once, which is why it is an <code>AtomicLong</code> and not an <code>int</code>; the rules hold no state at all, which is why one instance serves the whole site. Notice what is <i>not</i> here: no Vote class, because a vote is one entry in a map, and no Reputation class, because reputation is a number on a user plus a table of policy.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (nine blocks of claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/** Which way a vote went. The weight is what it adds to a post&#x27;s score; what it is worth in reputation is a separate table. */\nenum VoteType {\n    UP(+1), DOWN(-1);\n    final int weight;\n    VoteType(int weight) { this.weight = weight; }\n}\n\n/** What kind of post this is. It chooses the reputation row and decides what may be attached to it. */\nenum PostKind { QUESTION, ANSWER, COMMENT }\n\n/** A question&#x27;s life. Answers and comments are accepted only while OPEN; DELETED is terminal and leaves the index. */\nenum QuestionState { OPEN, CLOSED, DELETED }\n\n/** Every reason reputation can move. One enum, so the whole rulebook is one table with exactly one home. */\nenum RepReason { QUESTION_UP, QUESTION_DOWN, ANSWER_UP, ANSWER_DOWN, COMMENT_UP, COMMENT_DOWN, ANSWER_ACCEPTED, ACCEPTER_BONUS }\n\n/** What a user earns the right to do, and the reputation it takes. A table, not an if-chain. */\nenum Privilege {\n    VOTE_UP(15), COMMENT(50), VOTE_DOWN(125), CLOSE(500);\n    final int minRep;\n    Privilege(int minRep) { this.minRep = minRep; }\n}\n\n/** What happened on a thread, for anybody listening. */\nenum EventKind { ASKED, ANSWERED, COMMENTED, VOTED, VOTE_RETRACTED, ACCEPTED, UNACCEPTED, ACCEPT_BONUS, CLOSED, REOPENED, DELETED }\n\n/**\n * One thing that happened, already carrying the reputation delta that was applied. A listener never recomputes\n * the rulebook: it is told what moved, by how much, and for whom.\n */\nrecord QaEvent(EventKind kind, String questionId, String postId, String actorId, String authorId, int repDelta, long atMs) {}\n\n/** Where time comes from. Injected, so a test can stamp a post with any instant it likes. */\ninterface Clock { long nowMs(); }\n\n/** The reputation rulebook: one number per reason. One method, so a whole new policy is one class and one wiring line. */\ninterface ReputationRules { int pointsFor(RepReason reason); }\n\n/** How a question thread finds the people whose reputation a vote moves. Handed in, never looked up globally. */\ninterface Directory { User byId(String userId); }\n\n/**\n * How a reputation delta actually lands. The default simply adds it; a wrapper can cap it, log it or hold it back.\n * It is separate from the rulebook because the rulebook must stay pure -- it is asked twice per vote, once for the\n * old state and once for the new -- while this is called exactly once, with the number that really moved.\n */\ninterface RepAward { int award(User user, int delta, long atMs); }\n\n/** Anybody who wants to know what happened. Called AFTER the thread&#x27;s lock is released, inside a try/catch. */\ninterface PostListener { void onEvent(QaEvent e); }\n\n/** A capability, not a base class: a question and an answer carry comments, a comment does not. */\ninterface Commentable { List&lt;Comment&gt; comments(); }\n\n/** The default Stack Overflow numbers, in one EnumMap so every delta is visible and tunable in one place. */\nfinal class DefaultRules implements ReputationRules {\n    private final Map&lt;RepReason, Integer&gt; table = new EnumMap&lt;&gt;(RepReason.class);\n    DefaultRules() {\n        table.put(RepReason.QUESTION_UP, 5);          // an upvoted question earns its asker 5\n        table.put(RepReason.QUESTION_DOWN, -2);       // a downvote costs the author 2, either way\n        table.put(RepReason.ANSWER_UP, 10);           // an answer is worth more than a question\n        table.put(RepReason.ANSWER_DOWN, -2);\n        table.put(RepReason.COMMENT_UP, 0);           // comments carry a score but earn no reputation\n        table.put(RepReason.COMMENT_DOWN, 0);\n        table.put(RepReason.ANSWER_ACCEPTED, 15);     // being accepted\n        table.put(RepReason.ACCEPTER_BONUS, 2);       // and a little for the asker who bothered to accept\n    }\n    public int pointsFor(RepReason reason) { return table.getOrDefault(reason, 0); }\n}\n\n/**\n * A person. Reputation is an AtomicLong because one user is voted on from many question threads at once, each\n * holding a different lock: it is one number with no companion invariant, so a lock-free add is exactly right.\n */\nfinal class User {\n    private final String id, name;\n    private final AtomicLong rep = new AtomicLong();\n    private final Set&lt;String&gt; badges = ConcurrentHashMap.newKeySet();\n\n    User(String id, String name, long startingRep) { this.id = id; this.name = name; rep.set(startingRep); }\n\n    String id() { return id; }\n    String name() { return name; }\n    /** The true stored value, which may be negative. The audit path and the tests read this. */\n    long rawReputation() { return rep.get(); }\n    /** What the profile shows. The floor lives on the READ path: clamping on write would destroy reversibility. */\n    long reputation() { return Math.max(0, rep.get()); }\n    /** Apply a signed delta. Lock-free, and commutative, so the order deltas arrive in cannot change the total. */\n    void addRep(int delta) { rep.addAndGet(delta); }\n    /** Does this user have enough reputation for this action? A table lookup, not an if-chain. */\n    boolean can(Privilege p) { return reputation() &gt;= p.minRep; }\n    void awardBadge(String badge) { badges.add(badge); }\n    Set&lt;String&gt; badges() { return Set.copyOf(badges); }\n    @Override public String toString() { return name + &quot;(&quot; + reputation() + &quot;)&quot;; }\n}\n\n/**\n * The machinery every votable thing shares: an author, a body, a stored score, and the ledger of who voted which\n * way. The score is stored and never recomputed from the ledger, so reading it is O(1). Every mutator here is\n * called only while the owning question thread&#x27;s lock is held.\n */\nabstract class Post {\n    private final String id, authorId;\n    private final long createdAtMs;\n    private String body;\n    private int score;\n    private final Map&lt;String, VoteType&gt; voters = new HashMap&lt;&gt;();     // guarded by the thread&#x27;s lock\n\n    Post(String id, String authorId, String body, long createdAtMs) {\n        this.id = id; this.authorId = authorId; this.b

ody = body; this.createdAtMs = createdAtMs;\n    }\n\n    /** Which row of the reputation table this post uses. The one thing every subclass must answer. */\n    abstract PostKind kind();\n\n    String id() { return id; }\n    String authorId() { return authorId; }\n    long createdAtMs() { return createdAtMs; }\n    String body() { return body; }\n    int score() { return score; }\n    /** Which way this user voted, or null if they have not voted. A map entry, not an entity. */\n    VoteType voteOf(String userId) { return voters.get(userId); }\n    /** A copy of the whole ledger: who voted which way. Read under the thread&#x27;s lock, for an audit or an undo. */\n    Map&lt;String, VoteType&gt; ledger() { return Map.copyOf(voters); }\n    int voterCount() { return voters.size(); }\n    void setBody(String newBody) { body = newBody; }\n\n    /**\n     * Write the ledger and the score in one step. `now` of null means retract. Returns the previous vote.\n     * The score moves by new-minus-old, which is why a flip and a retraction need no special case at all.\n     */\n    VoteType record(String voterId, VoteType now) {\n        VoteType before = voters.get(voterId);\n        int weightBefore = before == null ? 0 : before.weight;\n        int weightNow = now == null ? 0 : now.weight;\n        if (now == null) voters.remove(voterId); else voters.put(voterId, now);\n        score += weightNow - weightBefore;\n        return before;\n    }\n}\n\n/** A remark on a question or an answer. Votable, earns no reputation, and is deliberately not itself commentable. */\nfinal class Comment extends Post {\n    private final String targetPostId;\n    Comment(String id, String authorId, String body, long atMs, String targetPostId) {\n        super(id, authorId, body, atMs); this.targetPostId = targetPostId;\n    }\n    String targetPostId() { return targetPostId; }\n    PostKind kind() { return PostKind.COMMENT; }\n}\n\n/** One answer to one question. Votable, commentable, and acceptable -- but only by the asker. */\nfinal class Answer extends Post implements Commentable {\n    private final String questionId;\n    private final List&lt;Comment&gt; comments = new ArrayList&lt;&gt;();          // guarded by the thread&#x27;s lock\n    Answer(String id, String authorId, String body, long atMs, String questionId) {\n        super(id, authorId, body, atMs); this.questionId = questionId;\n    }\n    String questionId() { return questionId; }\n    public List&lt;Comment&gt; comments() { return comments; }\n    PostKind kind() { return PostKind.ANSWER; }\n}\n\n/**\n * One question thread: the question itself, its answers, every comment on them, the ledger of who voted on what,\n * and the single lock that makes a vote atomic. This is the aggregate root -- nothing outside reaches into an\n * answer&#x27;s voter map, every write comes through a method here. Two different questions never wait for each other.\n */\nfinal class Question extends Post implements Commentable {\n    private final String title;\n    private final Set&lt;String&gt; tags;\n    private final List&lt;Answer&gt; answers = new ArrayList&lt;&gt;();\n    private final List&lt;Comment&gt; comments = new ArrayList&lt;&gt;();\n    private final Map&lt;String, Post&gt; byId = new HashMap&lt;&gt;();            // O(1): any post in this thread, by id\n    private final ReentrantLock lock = new ReentrantLock();\n    private volatile String acceptedAnswerId;                          // volatile: readers see the winner lock-free\n    private volatile QuestionState state = QuestionState.OPEN;\n    private volatile String closeReason;\n    private boolean awardsReversed;                                    // guarded by the lock: undo runs once\n    private volatile ReputationRules rules;\n    private volatile RepAward awards = (user, delta, atMs) -&gt; { user.addRep(delta); return delta; };\n    private volatile Clock clock;\n    private final Directory people;\n\n    Question(String id, String authorId, String title, String body, Set&lt;String&gt; tags, long atMs,\n             ReputationRules rules, Directory people, Clock clock) {\n        super(id, authorId, body, atMs);\n        this.title = title; this.tags = Set.copyOf(tags); this.rules = rules; this.people = people; this.clock = clock;\n        byId.put(id, this);                                            // the question is a post in its own thread\n    }\n\n    String title() { return title; }\n    Set&lt;String&gt; tags() { return tags; }\n    PostKind kind() { return PostKind.QUESTION; }\n    public List&lt;Comment&gt; comments() { return comments; }\n    QuestionState state() { return state; }\n    String closeReason() { return closeReason; }\n    String acceptedAnswerId() { return acceptedAnswerId; }\n    /** One rulebook for the whole site: the service re-points every live thread when the policy changes. */\n    void setRules(ReputationRules r) { rules = r; }\n    void setAwards(RepAward a) { awards = a; }\n    void setClock(Clock c) { clock = c; }\n\n    /** A copy, so a caller can iterate it while somebody else answers. */\n    List&lt;Answer&gt; answers() { lock.lock(); try { return List.copyOf(answers); } finally { lock.unlock(); } }\n    /** Any post in this thread by id, or null. One hash lookup. */\n    Post post(String postId) { lock.lock(); try { return byId.get(postId); } finally { lock.unlock(); } }\n\n    // ---------------------------------------------------------------- writes\n\n    /**\n     * Add an answer. Idempotent on the id, so a retried request cannot post twice. Only while the thread is OPEN.\n     */\n    Answer addAnswer(String answerId, User author, String body) {\n        lock.lock();\n        try {\n            requireLive();\n            if (state != QuestionState.OPEN) throw new IllegalStateException(&quot;the question is closed: &quot; + id());\n            Post existing = byId.get(answerId);\n            if (existing instanceof Answer a) return a;\n            Answer a = new Answer(answerId, author.id(), body, clock.nowMs(), id());\n            answers.add(a); byId.put(answerId, a);\n            return a;\n        } finally { lock.unlock(); }\n    }\n\n    /** Add a comment on the question or on one of its answers. A comment on a comment is refused, by design. */\n    Comment addComment(String commentId, String targetPostId, User author, String body) {\n        lock.lock();\n        try {\n            requireLive();\n            if (state != QuestionState.OPEN) throw new IllegalStateException(&quot;the question is closed: &quot; + id());\n            if (!author.can(Privilege.COMMENT))\n                throw new IllegalStateException(author.id() + &quot; needs &quot; + Privilege.COMMENT.minRep + &quot; reputation to comment&quot;);\n            Post target = byId.get(targetPostId);\n            if (target == null) throw new NoSuchElementException(&quot;no such post in this thread: &quot; + targetPostId);\n            if (!(target instanceof Commentable c)) throw new IllegalArgumentException(&quot;you cannot comment on a comment&quot;);\n            Post existing = byId.get(commentId);\n            if (existing instanceof Comment old) return old;\n            Comment cm = new Comment(commentId, author.id(), body, clock.nowMs(), targetPostId);\n            c.comments().add(cm); byId.put(commentId, cm);\n            return cm;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * Cast or change a vote. THE critical step: every check happens before anything is written, and what follows\n     * is three field writes -- the ledger entry, the score, the author&#x27;s counter -- that cannot fail half way.\n     * Returns the events for the caller to publish after this method has released the lock.\n     */\n    List&lt;QaEvent&gt; vote(String postId, User voter, VoteType type) {\n        return apply(postId, voter, Objects.requireNonNull(type, &quot;use retract() to take a vote back&quot;), EventKind.VOTED);\n    }\n\n    /** Take a vote back. Its own verb rather than vote(user, null): a null vote type is not a value. */\n    List&lt;QaEvent&gt; retract(String postId, User voter) {\n        return apply(postId, voter, null, EventKind.VOTE_RETRACTED);\n    }\n\n    private List&lt;QaEvent&gt; apply(String postId, User voter, VoteType type, EventKind kind) {\n        lock.lock();\n        try {\n            requireLive();\n            Post target = byId.get(postId);\n            if (target == null) throw new NoSuchElementException(&quot;no such post in this thread: &quot; + postId);\n            if (target.authorId().equals(voter.id())) throw new IllegalArgumentException(&quot;you cannot vote on your own post&quot;);\n            if (target.kind() == PostKind.COMMENT &amp;&amp; type == VoteType.DOWN)\n                throw new IllegalArgumentException(&quot;comments can only be upvoted&quot;);\n            if (type != null) {\n                Privilege needed = type == VoteType.UP ? Privilege.VOTE_UP : Privilege.VOTE_DOWN;\n                if (!voter.can(needed))\n                    throw new IllegalStateException(voter.id() + &quot; needs &quot; + needed.minRep + &quot; reputation to &quot; + needed);\n            }\n            VoteType before = target.voteOf(voter.id());\n            if (before == type) return List.of();                      // idempotent: the same vote twice is a no-op\n            int delta = points(target.kind(), type) - points(target.kind(), before);   // new minus old: no branching\n            long now = clock.nowMs();\n            target.record(voter.id(), type);                           // only now is anything written\n            int applied = award(target.authorId(), delta, now);\n            return List.of(new QaEvent(kind, id(), postId, voter.id(), target.authorId(), applied, now));\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * Mark exactly one answer accepted. Only the asker may do it. Re-accepting reverses the previous +15 first,\n     * so the flag and the reputation always tell the same story; the asker&#x27;s bonus is granted once, on the first.\n     */\n    List&lt;QaEvent&gt; accept(String answerId, User actor) {\n        lock.lock();\n        try {\n            requireLive();\n            if (!authorId().equals(actor.id())) throw new IllegalArgumentException(&quot;only the asker may accept an answer&quot;);\n            Post target = byId.get(answerId);\n            if (!(target instanceof Answer answer)) throw new NoSuchElementException(&quot;no such answer in this thread: &quot; + answerId);\n            if (answerId.equals(acceptedAnswerId)) return List.of();   // idempotent\n            long now = clock.nowMs();\n            List&lt;QaEvent&gt; out = new ArrayList&lt;&gt;(3);\n            String previous = acceptedAnswerId;\n            if (previous != null) {                                    // reverse the old award before making the new one\n                Post old = byId.get(previous);\n                int back = award(old.authorId(), -rules.pointsFor(RepReason.ANSWER_ACCEPTED), now);\n                out.add(new QaEvent(EventKind.UNACCEPTED, id(), previous, actor.id(), old.authorId(), back, now));\n            }\n            int bonus = award(answer.authorId(), rules.pointsFor(RepReason.ANSWER_ACCEPTED), now);\n            acceptedAnswerId = answerId;\n            out.add(new QaEvent(EventKind.ACCEPTED, id(), answerId, actor.id(), answer.authorId(), bonus, now));\n            if (previous == null) {                                    // the asker is paid once, not once per change\n                int askerBonus = award(actor.id(), rules.pointsFor(RepReason.ACCEPTER_BONUS), now);\n                out.add(new QaEvent(EventKind.ACCEPT_BONUS, id(), id(), actor.id(), actor.id(), askerBonus, now));\n            }\n            return out;\n        } finally { lock.unlock(); }\n    }\n\n    /** OPEN -&gt; CLOSED. A closed thread takes no new answers or comments, but existing posts stay votable. */\n    List&lt;QaEvent&gt; close(User by, String reason) {\n        lock.lock();\n        try {\n            requireLive();\n            if (!by.can(Privilege.CLOSE))\n                throw new IllegalStateException(by.id() + &quot; needs &quot; + Privilege.CLOSE.minRep + &quot; reputation to close&quot;);\n            if (state == QuestionState.CLOSED) return List.of();\n            state = QuestionState.CLOSED; closeReason = reason;\n            return List.of(new QaEvent(EventKind.CLOSED, id(), id(), by.id(), authorId(), 0, clock.nowMs()));\n        } finally { lock.unlock(); }\n    }\n\n    /** CLOSED -&gt; OPEN. The only way back; DELETED has no way back. */\n    List&lt;QaEvent&gt; reopen(User by) {\n        lock.lock();\n        try {\n            requireLive();\n            if (!by.can(Privilege.CLOSE))\n                throw new IllegalStateException(by.id() + &quot; needs &quot; + Privilege.CLOSE.minRep + &quot; reputation to reopen&quot;);\n            if (state == QuestionState.OPEN) return List.of();\n            state = QuestionState.OPEN; closeReason = null;\n            return List.of(new QaEvent(EventKind.REOPENED, id(), id(), by.id(), authorId(), 0, clock.nowMs()));\n        } finally { lock.unlock(); }\n    }\n\n    /** Terminal. Only the asker or somebody with the close privilege may; the service drops it from the index. */\n    List&lt;QaEvent&gt; delete(User by) {\n        lock.lock();\n        try {\n            if (!authorId().equals(by.id()) &amp;&amp; !by.can(Privilege.CLOSE))\n                throw new IllegalStateException(by.id() + &quot; may not delete &quot; + id());\n            if (state == QuestionState.DELETED) return List.of();\n            state = QuestionState.DELETED;\n            return List.of(new QaEvent(EventKind.DELETED, id(), id(), by.id(), authorId(), 0, clock.nowMs()));\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * Hand back every reputation point this thread ever paid out. The ledger IS the undo log: each entry says\n     * which way that voter went, so what it was worth can be recomputed and reversed without anything extra\n     * having been remembered. One pass under the one lock, and exactly once however many times it is called.\n     * Returns the signed total that was applied, which is negative when points were taken back.\n     */\n    int reverseAwards() {\n        lock.lock();\n        try {\n            if (awardsReversed) return 0;                              // exactly once, whoever asks\n            awardsReversed = true;\n            long now = clock.nowMs();\n            int moved = 0;\n            for (Post p : byId.values())\n                for (Map.Entry&lt;String, VoteType&gt; e : p.ledger().entrySet())\n                    moved += award(p.authorId(), -points(p.kind(), e.getValue()), now);\n            if (acceptedAnswerId != null) {                            // and the acceptance, both halves of it\n                Post accepted = byId.get(acceptedAnswerId);\n                moved += award(accepted.authorId(), -rules.pointsFor(RepReason.ANSWER_ACCEPTED), now);\n                moved += award(authorId(), -rules.pointsFor(RepReason.ACCEPTER_BONUS), now);\n            }\n            return moved;\n        } finally { lock.unlock(); }\n    }\n\n    /** Hand the delta to the award rule and report what really landed, so the event never lies to a listener. */\n    private int award(String userId, int delta, long atMs) {\n        User u = people.byId(userId);\n        if (u == null || delta == 0) return 0;\n        return awards.award(u, delta, atMs);\n    }\n\n    /**\n     * Replace a post&#x27;s body under the thread&#x27;s lock and hand the OLD body back, which is what a revision log\n     * stores. Only the author, or somebody with the close privilege, may edit.\n     */\n    String editBody(String postId, User editor, String newBody) {\n        lock.lock();\n        try {\n            requireLive();\n            Post target = byId.get(postId);\n            if (target == null) throw new NoSuchElementException(&quot;no such post in this thread: &quot; + postId);\n            if (!target.authorId().equals(editor.id()) &amp;&amp; !editor.can(Privilege.CLOSE))\n                throw new IllegalStateException(editor.id() + &quot; may not edit &quot; + postId);\n            String old = target.body();\n            target.setBody(newBody);\n            return old;\n        } finally { lock.unlock(); }\n    }\n\n    private void requireLive() {\n        if (state == QuestionState.DELETED) throw new IllegalStateException(&quot;the question is deleted: &quot; + id());\n    }\n\n    /** What one vote of this kind is worth to the post&#x27;s author. No vote at all is worth nothing, which is the trick. */\n    private int points(PostKind kind, VoteType v) {\n        if (v == null) return 0;\n        RepReason reason = switch (kind) {\n            case QUESTION -&gt; v == VoteType.UP ? RepReason.QUESTION_UP : RepReason.QUESTION_DOWN;\n            case ANSWER   -&gt; v == VoteType.UP ? RepReason.ANSWER_UP   : RepReason.ANSWER_DOWN;\n            case COMMENT  -&gt; v == VoteType.UP ? RepReason.COMMENT_UP  : RepReason.COMMENT_DOWN;\n        };\n        return rules.pointsFor(reason);\n    }\n}\n\n/**\n * The inverted index: word -&gt; question ids, tag -&gt; question ids, author -&gt; question ids. Concurrent maps, so\n * indexing one question never blocks a vote on another, and a lookup is O(k) in the matches, never O(n) in the site.\n */\nfinal class SearchIndex {\n    private final Map&lt;String, Set&lt;String&gt;&gt; byWord = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Set&lt;String&gt;&gt; byTag = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Set&lt;String&gt;&gt; byAuthor = new ConcurrentHashMap&lt;&gt;();\n\n    /** Index one question&#x27;s words, tags and author. Called after the question is already in the store. */\n    void add(Question q) {\n        for (String w : words(q.title() + &quot; &quot; + q.body())) byWord.computeIfAbsent(w, k -&gt; ConcurrentHashMap.newKeySet()).add(q.id());\n        for (String t : q.tags()) byTag.computeIfAbsent(t.toLowerCase(), k -&gt; ConcurrentHashMap.newKeySet()).add(q.id());\n        byAuthor.computeIfAbsent(q.authorId(), k -&gt; ConcurrentHashMap.newKeySet()).add(q.id());\n    }\n\n    /** Drop a deleted question out of every posting list, so search can never point at something nobody can fetch. */\n    void remove(Question q) {\n        for (String w : words(q.title() + &quot; &quot; + q.body())) drop(byWord, w, q.id());\n        for (String t : q.tags()) drop(byTag, t.toLowerCase(), q.id());\n        drop(byAuthor, q.authorId(), q.id());\n    }\n\n    Set&lt;String&gt; byTag(String tag) { return copy(byTag.get(tag == null ? &quot;&quot; : tag.toLowerCase())); }\n    Set&lt;String&gt; byWord(String word) { return copy(byWord.get(word == null ? &quot;&quot; : word.toLowerCase())); }\n    Set&lt;String&gt; byAuthor(String userId) { return copy(byAuthor.get(userId)); }\n\n    private static void drop(Map&lt;String, Set&lt;String&gt;&gt; index, String key, String id) {\n        Set&lt;String&gt; s = index.get(key);\n        if (s != null) { s.remove(id); if (s.isEmpty()) index.remove(key, s); }\n    }\n    private static Set&lt;String&gt; copy(Set&lt;String&gt; s) { return s == null ? Set.of() : Set.copyOf(s); }\n\n    /** Lowercase words of two letters or more. Deliberately crude: v1 has no stemming and no ranking. */\n    static List&lt;String&gt; words(String text) {\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (String w : text.toLowerCase().split(&quot;[^a-z0-9]+&quot;)) if (w.length() &gt;= 2) out.add(w);\n        return out;\n    }\n}\n\n/**\n * The one thing a caller talks to: it mints the ids, keeps the users and the threads, owns the search index, and\n * publishes events after the thread&#x27;s lock has been released. It holds no lock of its own -- every write is\n * serialised by the one question thread it touches.\n */\nfinal class QaService {\n    private final Map&lt;String, User&gt; users = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Question&gt; questions = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, String&gt; home = new ConcurrentHashMap&lt;&gt;();   // any post id -&gt; the thread that owns it\n    private final SearchIndex index = new SearchIndex();\n    private final List&lt;PostListener&gt; listeners = new CopyOnWriteArrayList&lt;&gt;();\n    private final AtomicInteger qIds = new AtomicInteger(), aIds = new AtomicInteger(), cIds = new AtomicInteger();\n    private volatile ReputationRules rules = new DefaultRules();\n    private volatile Clock clock = System::currentTimeMillis;\n    private volatile RepAward awards = (user, delta, atMs) -&gt; { user.addRep(delta); return delta; };\n\n    /** Hand in the rulebook and the listeners. The service never builds them, which is why a test can swap both. */\n    void configure(ReputationRules newRules, PostListener... newListeners) {\n        rules = newRules;\n        for (Question q : questions.values()) q.setRules(newRules);       // one rulebook, even for live threads\n        listeners.addAll(List.of(newListeners));\n    }\n    /** Hand in how deltas land: the plain adder, or a wrapper that caps or logs them. */\n    void setAwards(RepAward a) { for (Question q : questions.values()) q.setAwards(a); awards = a; }\n    /** Time is handed in too, so a test can decide exactly what a post is stamped with. */\n    void setClock(Clock c) { clock = c; for (Question q : questions.values()) q.setClock(c); }\n\n    User register(String id, String name) { return register(id, name, 1); }\n    User register(String id, String name, long startingRep) {\n        User u = new User(id, name, startingRep);\n        users.put(id, u);\n        return u;\n    }\n    User user(String id) { return users.get(id); }\n    Question question(String id) { return questions.get(id); }\n\n    /**\n     * Ask. The order matters: the question goes into the store FIRST and is indexed second. If indexing ever\n     * threw, the question would still exist and could be re-indexed; the other order would leave the index\n     * pointing at a question nobody can fetch.\n     */\n    Question ask(String authorId, String title, String body, Set&lt;String&gt; tags) {\n        User author = require(authorId);\n        String qid = &quot;q&quot; + qIds.incrementAndGet();\n        Question q = new Question(qid, author.id(), title, body, tags, clock.nowMs(), rules, this::user, clock);\n        q.setAwards(awards);\n        questions.put(qid, q);\n        home.put(qid, qid);\n        index.add(q);\n        publish(List.of(new QaEvent(EventKind.ASKED, qid, qid, authorId, authorId, 0, clock.nowMs())));\n        return q;\n    }\n\n    /** Answer a question. The thread takes its own lock; the event goes out after it is released. */\n    Answer answer(String questionId, String authorId, String body) {\n        Question q = thread(questionId);\n        Answer a = q.addAnswer(&quot;a&quot; + aIds.incrementAndGet(), require(authorId), body);\n        home.put(a.id(), questionId);\n        publish(List.of(new QaEvent(EventKind.ANSWERED, questionId, a.id(), authorId, authorId, 0, clock.nowMs())));\n        return a;\n    }\n\n    /** Comment on any question or answer. `postId` is the thing being commented on, not the thread. */\n    Comment comment(String postId, String authorId, String body) {\n        Question q = thread(owner(postId));\n        Comment c = q.addComment(&quot;c&quot; + cIds.incrementAndGet(), postId, require(authorId), body);\n        home.put(c.id(), q.id());\n        publish(List.of(new QaEvent(EventKind.COMMENTED, q.id(), c.id(), authorId, authorId, 0, clock.nowMs())));\n        return c;\n    }\n\n    /** Vote on any post, anywhere. Two O(1) hops: the post&#x27;s thread, then the post inside it. */\n    void vote(String postId, String voterId, VoteType type) {\n        Question q = thread(owner(postId));\n        publish(q.vote(postId, require(voterId), type));\n    }\n    void retractVote(String postId, String voterId) {\n        Question q = thread(owner(postId));\n        publish(q.retract(postId, require(voterId)));\n    }\n    void accept(String answerId, String actorId) {\n        Question q = thread(owner(answerId));\n        publish(q.accept(answerId, require(actorId)));\n    }\n    /** Edit a post&#x27;s body. Returns the text that was there before, which is what a revision log keeps. */\n    String edit(String postId, String editorId, String newBody) {\n        Question q = thread(owner(postId));\n        return q.editBody(postId, require(editorId), newBody);\n    }\n    void close(String questionId, String byUserId, String reason) { publish(thread(questionId).close(require(byUserId), reason)); }\n    void reopen(String questionId, String byUserId) { publish(thread(questionId).reopen(require(byUserId))); }\n    /** Delete a thread: mark it, then drop it from the index so search stops returning it. */\n    void delete(String questionId, String byUserId) {\n        Question q = thread(questionId);\n        List&lt;QaEvent&gt; events = q.delete(require(byUserId));\n        if (!events.isEmpty()) index.remove(q);\n        publish(events);\n    }\n\n    // ---------------------------------------------------------------- reads\n\n    /** By tag: O(k) in the matches. This is what the inverted index is for. */\n    List&lt;Question&gt; byTag(String tag) { return hydrate(index.byTag(tag)); }\n    /** By keyword: also O(k), because the words of a question were indexed when it was asked. */\n    List&lt;Question&gt; byWord(String word) { return hydrate(index.byWord(word)); }\n    List&lt;Question&gt; byAuthor(String userId) { return hydrate(index.byAuthor(userId)); }\n\n    /** Best first, then newest first. A handed-in comparator is one of the follow-ups. */\n    private List&lt;Question&gt; hydrate(Set&lt;String&gt; qids) {\n        List&lt;Question&gt; out = new ArrayList&lt;&gt;(qids.size());\n        for (String id : qids) {\n            Question q = questions.get(id);\n            if (q != null &amp;&amp; q.state() != QuestionState.DELETED) out.add(q);\n        }\n        out.sort(Comparator.&lt;Question&gt;comparingInt(Question::score).reversed().thenComparing(Question::createdAtMs, Comparator.reverseOrder()));\n        return out;\n    }\n\n    // ---------------------------------------------------------------- plumbing\n\n    /** Announce, after the lock. A listener that throws cannot break a vote that already happened. */\n    private void publish(List&lt;QaEvent&gt; events) {\n        for (QaEvent e : events)\n            for (PostListener l : listeners)\n                try { l.onEvent(e); } catch (RuntimeException ex) { /* log and carry on */ }\n    }\n    private String owner(String postId) {\n        String qid = home.get(postId);\n        if (qid == null) throw new NoSuchElementException(&quot;no such post: &quot; + postId);\n        return qid;\n    }\n    private Question thread(String questionId) {\n        Question q = questions.get(questionId);\n        if (q == null) throw new NoSuchElementException(&quot;no such question: &quot; + questionId);\n        return q;\n    }\n    private User require(String userId) {\n        User u = users.get(userId);\n        if (u == null) throw new NoSuchElementException(&quot;no such user: &quot; + userId);\n        return u;\n    }\n}\n\n/** A demo of the whole flow, then fifty threads voting on one answer to show the invariant holding. */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        QaService so = new QaService();\n        boolean[] loud = { true };                     // the listener is the only thing printing the reputation moves\n        so.configure(new DefaultRules(), e -&gt; {\n            if (loud[0] &amp;&amp; e.repDelta() != 0)\n                System.out.println(&quot;   event &quot; + e.kind() + &quot; &quot; + e.postId() + &quot; -&gt; &quot; + e.authorId() + &quot; &quot; + (e.repDelta() &gt; 0 ? &quot;+&quot; : &quot;&quot;) + e.repDelta());\n        });\n        so.register(&quot;alice&quot;, &quot;Alice&quot;, 300);\n        so.register(&quot;bob&quot;, &quot;Bob&quot;, 300);\n        so.register(&quot;carol&quot;, &quot;Carol&quot;, 300);\n        so.register(&quot;dan&quot;, &quot;Dan&quot;, 300);\n\n        System.out.println(&quot;-- ask, answer, comment --&quot;);\n        Question q = so.ask(&quot;alice&quot;, &quot;Why does HashMap lose my key?&quot;,\n                            &quot;I put a mutable object in a HashMap and now get(k) returns null.&quot;, Set.of(&quot;java&quot;, &quot;collections&quot;));\n        Answer a1 = so.answer(q.id(), &quot;bob&quot;, &quot;You mutated a field used by hashCode after the put.&quot;);\n        Answer a2 = so.answer(q.id(), &quot;carol&quot;, &quot;Use an immutable key, or re-put after mutating.&quot;);\n        so.comment(a1.id(), &quot;dan&quot;, &quot;This is the actual cause, not a JDK bug.&quot;);\n        System.out.println(&quot;   &quot; + q.title() + &quot;  answers=&quot; + q.answers().size());\n\n        System.out.println(&quot;-- votes --&quot;);\n        so.vote(a1.id(), &quot;carol&quot;, VoteType.UP);        // carol +0, bob +10\n        so.vote(a1.id(), &quot;dan&quot;, VoteType.UP);          // bob +10\n        so.vote(a1.id(), &quot;dan&quot;, VoteType.UP);          // the same vote twice: a no-op\n        so.vote(q.id(), &quot;bob&quot;, VoteType.UP);           // alice +5\n        so.vote(a2.id(), &quot;dan&quot;, VoteType.DOWN);        // carol -2\n        System.out.println(&quot;   a1 score=&quot; + q.post(a1.id()).score() + &quot;  a2 score=&quot; + q.post(a2.id()).score()\n            + &quot;  question score=&quot; + q.score());\n        System.out.println(&quot;   bob=&quot; + so.user(&quot;bob&quot;) + &quot; carol=&quot; + so.user(&quot;carol&quot;) + &quot; alice=&quot; + so.user(&quot;alice&quot;));\n\n        System.out.println(&quot;-- dan changes his mind, then takes it back --&quot;);\n        so.vote(a2.id(), &quot;dan&quot;, VoteType.UP);          // carol -2 reversed and +10 applied = +12\n        so.retractVote(a2.id(), &quot;dan&quot;);                // and all the way back to nothing\n        System.out.println(&quot;   a2 score=&quot; + q.post(a2.id()).score() + &quot;  carol=&quot; + so.user(&quot;carol&quot;));\n\n        System.out.println(&quot;-- accept, then change the accepted answer --&quot;);\n        so.accept(a1.id(), &quot;alice&quot;);                   // bob +15, alice +2\n        so.accept(a2.id(), &quot;alice&quot;);                   // bob -15, carol +15, alice keeps the +2\n        System.out.println(&quot;   accepted=&quot; + q.acceptedAnswerId() + &quot;  bob=&quot; + so.user(&quot;bob&quot;) + &quot; carol=&quot; + so.user(&quot;carol&quot;));\n\n        System.out.println(&quot;-- search --&quot;);\n        System.out.println(&quot;   tag java      -&gt; &quot; + so.byTag(&quot;java&quot;).size());\n        System.out.println(&quot;   word hashmap  -&gt; &quot; + so.byWord(&quot;hashmap&quot;).size());\n        System.out.println(&quot;   author alice  -&gt; &quot; + so.byAuthor(&quot;alice&quot;).size());\n\n        System.out.println(&quot;-- fifty people upvote the same answer at the same instant --&quot;);\n        loud[0] = false;                               // fifty identical lines prove nothing; the counts below do\n        Question hot = so.ask(&quot;alice&quot;, &quot;What is the fastest way to sort?&quot;, &quot;Sorting a big array of longs.&quot;, Set.of(&quot;java&quot;));\n        Answer target = so.answer(hot.id(), &quot;bob&quot;, &quot;Arrays.sort on a primitive array is a dual-pivot quicksort.&quot;);\n        long bobBefore = so.user(&quot;bob&quot;).reputation();\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        CountDownLatch done = new CountDownLatch(50);\n        for (int i = 0; i &lt; 50; i++) {\n            String voter = &quot;v&quot; + i;\n            so.register(voter, &quot;Voter &quot; + i, 200);\n            pool.submit(() -&gt; {\n                try { go.await(); so.vote(target.id(), voter, VoteType.UP); so.vote(target.id(), voter, VoteType.UP); }\n                catch (Exception ignored) { } finally { done.countDown(); }\n            });\n        }\n        go.countDown();\n        done.await();\n        pool.shutdown();\n        System.out.println(&quot;   voters=&quot; + hot.post(target.id()).voterCount() + &quot;  score=&quot; + hot.post(target.id()).score()\n            + &quot;  bob gained &quot; + (so.user(&quot;bob&quot;).reputation() - bobBefore) + &quot; (50 x 10)&quot;);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: a new rulebook -- the numbers move, and nothing else does\n/**\n * The interviewer changes the policy mid-round: an answer upvote is now +12, a downvote costs the author 3, and\n * an accepted answer is worth 20. A new class implementing the same one method, handed in through configure().\n * Post, the vote path and the tests are untouched.\n */\nfinal class TunedRules implements ReputationRules {\n    private final Map&lt;RepReason, Integer&gt; table = new EnumMap&lt;&gt;(RepReason.class);\n    TunedRules() {\n        table.put(RepReason.QUESTION_UP, 6);\n        table.put(RepReason.QUESTION_DOWN, -3);\n        table.put(RepReason.ANSWER_UP, 12);\n        table.put(RepReason.ANSWER_DOWN, -3);\n        table.put(RepReason.COMMENT_UP, 0);\n        table.put(RepReason.COMMENT_DOWN, 0);\n        table.put(RepReason.ANSWER_ACCEPTED, 20);\n        table.put(RepReason.ACCEPTER_BONUS, 2);\n    }\n    public int pointsFor(RepReason reason) { return table.getOrDefault(reason, 0); }\n}\n\n// ---- ext: a daily reputation cap -- a Decorator on how a delta lands, not on the rulebook\n/**\n * &quot;Nobody may earn more than 200 reputation a day.&quot; It wraps the award rule rather than the rulebook, because\n * the rulebook is asked twice per vote (old state, new state) and must stay pure; this is called once, with the\n * number that really moved. Losses and reversals are never capped -- capping them would make a downvote\n * irreversible, which is the same mistake as flooring reputation on the write path.\n */\nfinal class DailyCap implements RepAward {\n    private final RepAward base;\n    private final int perDay;\n    private final Map&lt;String, long[]&gt; earned = new ConcurrentHashMap&lt;&gt;();   // userId -&gt; { day number, earned that day }\n\n    DailyCap(RepAward base, int perDay) { this.base = base; this.perDay = perDay; }\n\n    public int award(User user, int delta, long atMs) {\n        if (delta &lt;= 0) return base.award(user, delta, atMs);\n        long day = atMs / 86_400_000L;\n        long[] row = earned.computeIfAbsent(user.id(), k -&gt; new long[] { day, 0 });\n        synchronized (row) {                                               // one tiny lock per user, not per site\n            if (row[0] != day) { row[0] = day; row[1] = 0; }               // a new day resets the budget\n            int give = (int) Math.min(delta, Math.max(0, perDay - row[1]));\n            if (give == 0) return 0;\n            row[1] += give;\n            return base.award(user, give, atMs);\n        }\n    }\n}\n\n// ---- ext: badges -- a NEW listener and one wiring line; Post and the rulebook do not change\n/**\n * Bronze at 15 reputation, silver at 50, gold at 500. It listens to the events the service already publishes\n * and reads the reputation the award rule already applied, so it never recomputes a delta and cannot disagree\n * with the profile page.\n */\nfinal class BadgeManager implements PostListener {\n    private static final int[] LEVELS = { 15, 50, 500 };\n    private static final String[] NAMES = { &quot;bronze&quot;, &quot;silver&quot;, &quot;gold&quot; };\n    private final Directory people;\n    private final List&lt;String&gt; awarded = new CopyOnWriteArrayList&lt;&gt;();\n\n    BadgeManager(Directory people) { this.people = people; }\n\n    public void onEvent(QaEvent e) {\n        if (e.repDelta() == 0) return;\n        User u = people.byId(e.authorId());\n        if (u == null) return;\n        for (int i = 0; i &lt; LEVELS.length; i++) {\n            if (u.reputation() &gt;= LEVELS[i] &amp;&amp; !u.badges().contains(NAMES[i])) {\n                u.awardBadge(NAMES[i]);\n                awarded.add(u.id() + &quot;:&quot; + NAMES[i]);\n            }\n        }\n    }\n    List&lt;String&gt; awarded() { return List.copyOf(awarded); }\n}\n\n// ---- ext: edit history -- the body becomes an append-only chain, and the post still holds only the latest\n/** One earlier version of a post&#x27;s body, with who replaced it and when. Nothing is ever overwritten in the log. */\nrecord Revision(String postId, String editorId, String body, long atMs) {}\n\n/**\n * The revision log. The edit itself happens inside the thread&#x27;s lock (QaService.edit returns the text that was\n * there before), so the log entry and the new body can never disagree. Reading a post stays one field read.\n */\nfinal class EditLog {\n    private final QaService so;\n    private final Clock clock;\n    private final Map&lt;String, List&lt;Revision&gt;&gt; history = new ConcurrentHashMap&lt;&gt;();\n\n    EditLog(QaService so, Clock clock) { this.so = so; this.clock = clock; }\n\n    /** Edit a post and keep what was there. Returns the number of stored revisions after the edit. */\n    int edit(String postId, String editorId, String newBody) {\n        String previous = so.edit(postId, editorId, newBody);               // under the thread&#x27;s lock\n        List&lt;Revision&gt; chain = history.computeIfAbsent(postId, k -&gt; new CopyOnWriteArrayList&lt;&gt;());\n        chain.add(new Revision(postId, editorId, previous, clock.nowMs()));\n        return chain.size();\n    }\n    /** Every earlier version, oldest first. The current text lives on the post itself. */\n    List&lt;Revision&gt; historyOf(String postId) { return List.copyOf(history.getOrDefault(postId, List.of())); }\n}\n\n// ---- ext: a moderation queue -- another listener, watching the same events badges watch\n/**\n * Any post whose score falls to the floor or below is queued for a human. It is a listener, so the vote path\n * never learns what moderation is, and a moderator who is offline cannot slow a vote down.\n */\nfinal class ModerationQueue implements PostListener {\n    private final QaService so;\n    private final int floor;\n    private final Set&lt;String&gt; flagged = ConcurrentHashMap.newKeySet();\n\n    ModerationQueue(QaService so, int floor) { this.so = so; this.floor = floor; }\n\n    public void onEvent(QaEvent e) {\n        if (e.kind() != EventKind.VOTED &amp;&amp; e.kind() != EventKind.VOTE_RETRACTED) return;\n        Question q = so.question(e.questionId());\n        Post p = q == null ? null : q.post(e.postId());\n        if (p == null) return;\n        if (p.score() &lt;= floor) flagged.add(p.id()); else flagged.remove(p.id());\n    }\n    Set&lt;String&gt; flagged() { return Set.copyOf(flagged); }\n}\n\n// ---- ext: bounties -- reputation held in escrow, paid on accept, returned when it expires\n/**\n * The asker puts reputation on the line now and it is deducted immediately: an escrow that cannot be spent\n * twice. If an answer is accepted before the deadline the sponsor&#x27;s points go to its author; if the deadline\n * passes with nothing accepted, sweep() gives them back. Time is the injected clock, so a test can skip a week.\n */\nfinal class BountyDesk implements PostListener {\n    /** One live offer. Points are already out of the sponsor&#x27;s account when this exists. */\n    record Offer(String questionId, String sponsorId, int points, long expiresAtMs) {}\n\n    private final Directory people;\n    private final Map&lt;String, Offer&gt; open = new ConcurrentHashMap&lt;&gt;();\n    private final List&lt;String&gt; paid = new CopyOnWriteArrayList&lt;&gt;();\n\n    BountyDesk(Directory people) { this.people = people; }\n\n    /** Escrow the points now. Refused if the sponsor cannot cover it, so the site can never go into deficit. */\n    void offer(String questionId, String sponsorId, int points, long nowMs, long lifetimeMs) {\n        User sponsor = people.byId(sponsorId);\n        if (sponsor == null || sponsor.reputation() &lt; points) throw new IllegalStateException(&quot;not enough reputation for a bounty&quot;);\n        if (open.putIfAbsent(questionId, new Offer(questionId, sponsorId, points, nowMs + lifetimeMs)) != null)\n            throw new IllegalStateException(&quot;this question already has a bounty&quot;);\n        sponsor.addRep(-points);\n    }\n\n    public void onEvent(QaEvent e) {\n        if (e.kind() != EventKind.ACCEPTED) return;\n        Offer offer = open.remove(e.questionId());\n        if (offer == null || e.atMs() &gt; offer.expiresAtMs()) return;\n        User winner = people.byId(e.authorId());\n        if (winner != null) { winner.addRep(offer.points()); paid.add(e.authorId() + &quot;:&quot; + offer.points()); }\n    }\n\n    /** Give back every expired bounty nobody won. Called by a scheduler with the same injected clock. */\n    int sweep(long nowMs) {\n        int returned = 0;\n        for (Offer o : List.copyOf(open.values())) {\n            if (nowMs &lt;= o.expiresAtMs() || open.remove(o.questionId()) == null) continue;\n            User sponsor = people.byId(o.sponsorId());\n            if (sponsor != null) { sponsor.addRep(o.points()); returned++; }\n        }\n        return returned;\n    }\n    List&lt;String&gt; paid() { return List.copyOf(paid); }\n}\n\n// ---- ext: search, sort and pagination -- the index is already O(matches); this is only how they are shown\n/** How a result list is ordered. A comparator behind a name, chosen per query rather than baked into search. */\nenum SortOrder {\n    NEWEST(Comparator.comparingLong(Question::createdAtMs).reversed()),\n    VOTES(Comparator.comparingInt(Question::score).reversed()),\n    UNANSWERED(Comparator.comparingInt((Question q) -&gt; q.answers().size()).thenComparing(Question::createdAtMs, Comparator.reverseOrder()));\n\n    final Comparator&lt;Question&gt; order;\n    SortOrder(Comparator&lt;Question&gt; order) { this.order = order; }\n}\n\n/** One page of results plus what the caller needs to draw the pager. */\nrecord Page&lt;T&gt;(List&lt;T&gt; items, int page, int size, int total) {\n    boolean hasNext() { return (long) (page + 1) * size &lt; total; }\n}\n\n/** Sorting, slicing and combining, kept out of the index so a new sort or filter never touches indexing. */\nfinal class Search {\n    static Page&lt;Question&gt; page(List&lt;Question&gt; matches, SortOrder order, int page, int size) {\n        List&lt;Question&gt; sorted = new ArrayList&lt;&gt;(matches);\n        sorted.sort(order.order);\n        int from = Math.min(page * size, sorted.size()), to = Math.min(from + size, sorted.size());\n        return new Page&lt;&gt;(List.copyOf(sorted.subList(from, to)), page, size, sorted.size());\n    }\n\n    /**\n     * [java] AND [spring]: walk the SHORTEST posting list and keep only ids that are in all the others. The cost is the\n     * smallest list, not the site, which is why the rarest tag is the one you start from.\n     */\n    static List&lt;Question&gt; allTags(QaService so, List&lt;String&gt; tags) {\n        List&lt;List&lt;Question&gt;&gt; lists = new ArrayList&lt;&gt;();\n        for (String t : tags) lists.add(so.byTag(t));\n        lists.sort(Comparator.comparingInt(List::size));                   // rarest tag first\n        List&lt;Question&gt; out = new ArrayList&lt;&gt;();\n        outer:\n        for (Question q : lists.get(0)) {\n            for (int i = 1; i &lt; lists.size(); i++) {\n                boolean here = false;\n                for (Question other : lists.get(i)) if (other.id().equals(q.id())) { here = true; break; }\n                if (!here) continue outer;\n            }\n            out.add(q);\n        }\n        return out;\n    }\n\n    /** The order a thread page shows its answers in: the accepted one first, then by score, then oldest first. */\n    static List&lt;Answer&gt; answersInOrder(Question q) {\n        String accepted = q.acceptedAnswerId();\n        List&lt;Answer&gt; out = new ArrayList&lt;&gt;(q.answers());\n        out.sort(Comparator.comparingInt((Answer a) -&gt; a.id().equals(accepted) ? 0 : 1)\n                           .thenComparing(Comparator.comparingInt(Answer::score).reversed())\n                           .thenComparingLong(Answer::createdAtMs));\n        return out;\n    }\n}\n\n// ---- ext: a spam rate limit -- a token bucket per user, consulted before a post is created\n/**\n * Six posts an hour, with a burst of three. A bucket per user, refilled from the injected clock rather than a\n * timer thread, so a test can move an hour in one line. The CALLER asks before it calls ask() -- one line at the\n * edge -- so the question, the vote path and the rulebook never learn that spam exists.\n */\nfinal class PostQuota {\n    private final int burst;\n    private final long refillEveryMs;\n    private final Map&lt;String, long[]&gt; buckets = new ConcurrentHashMap&lt;&gt;();  // userId -&gt; { tokens, last refill }\n\n    PostQuota(int burst, long refillEveryMs) { this.burst = burst; this.refillEveryMs = refillEveryMs; }\n\n    /** True if this user may post now, and the token is taken. False costs nothing. */\n    boolean allow(String userId, long nowMs) {\n        long[] b = buckets.computeIfAbsent(userId, k -&gt; new long[] { burst, nowMs });\n        synchronized (b) {\n            long gained = (nowMs - b[1]) / refillEveryMs;\n            if (gained &gt; 0) { b[0] = Math.min(burst, b[0] + gained); b[1] += gained * refillEveryMs; }\n            if (b[0] &lt;= 0) return false;\n            b[0]--;\n            return true;\n        }\n    }\n}\n\n// ---- ext: deleting a question -- the ledger is the undo log, and the reversal is one more listener\n/**\n * The policy: reputation earned on a deleted thread goes away, and a stranger cannot delete somebody else&#x27;s\n * question (Question.delete already refuses anybody who is neither the asker nor a 500-reputation moderator).\n * Nothing in Question or the vote path changes to add this -- the service already publishes DELETED, so the\n * policy is one more listener. Question.reverseAwards() walks the ledger, hands every point back under the\n * thread&#x27;s one lock, and is idempotent, so a replayed event cannot take the same points twice.\n */\nfinal class RepReversal implements PostListener {\n    private final QaService so;\n    private final Map&lt;String, Integer&gt; reversed = new ConcurrentHashMap&lt;&gt;();   // questionId -&gt; signed total undone\n\n    RepReversal(QaService so) { this.so = so; }\n\n    public void onEvent(QaEvent e) {\n        if (e.kind() != EventKind.DELETED) return;\n        Question q = so.question(e.questionId());\n        if (q != null) reversed.put(q.id(), q.reverseAwards());\n    }\n    /** What was handed back per thread, for the audit trail. Negative: these are points taken away. */\n    Map&lt;String, Integer&gt; reversed() { return Map.copyOf(reversed); }\n}\n\n// ---- ext: persistence -- the same atomic step, performed by the database instead of the lock\n/** The store, behind an interface. The domain classes never learn what a row is. */\ninterface QuestionRepository {\n    void save(Question q);\n    Question byId(String id);\n}\n\n/** The vote table. The unique key on (post_id, voter_id) IS the idempotency the voters map gives us in memory. */\ninterface VoteRepository {\n    /** Upsert a vote and return the previous type, or null. One statement, one round trip. */\n    VoteType upsert(String postId, String voterId, VoteType type);\n}\n\n/** What the three statements look like. One transaction, and no application lock anywhere. */\nfinal class SqlSketch {\n    /** The ledger entry. ON CONFLICT is why a retried request, or a second server, cannot double-count. */\n    static final String UPSERT_VOTE = &quot;&quot;&quot;\n        INSERT INTO votes (post_id, voter_id, type) VALUES (?, ?, ?)\n          ON CONFLICT (post_id, voter_id) DO UPDATE SET type = EXCLUDED.type\n          RETURNING (xmax = 0) AS was_new&quot;&quot;&quot;;\n    /** The score. SET score = score + ? is the database doing exactly what the lock did: read and write as one step. */\n    static final String BUMP_SCORE = &quot;UPDATE posts SET score = score + ? WHERE id = ?&quot;;\n    /** And reputation, which was already a lock-free counter in memory. */\n    static final String BUMP_REP = &quot;UPDATE users SET reputation = reputation + ? WHERE id = ?&quot;;\n    /** The accepted answer, guarded so two accepters cannot both win: the compare is in the WHERE clause. */\n    static final String ACCEPT = &quot;UPDATE questions SET accepted_answer_id = ? WHERE id = ? AND (accepted_answer_id IS NULL OR accepted_answer_id = ?)&quot;;\n}\n\n// ---- ext: the hot-question cache -- a rendered thread, thrown away by the same events badges listen to\n/**\n * A question that reaches the front page is read a hundred thousand times and written twice. Keep the rendered\n * thread in a small LRU and let the event stream invalidate it: any event on that thread drops its entry, so a\n * reader can never see a stale score. No new coupling -- it is one more listener.\n */\nfinal class HotThreadCache implements PostListener {\n    private final int capacity;\n    private final LinkedHashMap&lt;String, String&gt; rendered;\n    private int hits, misses;\n\n    HotThreadCache(int capacity) {\n        this.capacity = capacity;\n        this.rendered = new LinkedHashMap&lt;&gt;(16, 0.75f, true) {\n            protected boolean removeEldestEntry(Map.Entry&lt;String, String&gt; e) { return size() &gt; HotThreadCache.this.capacity; }\n        };\n    }\n\n    /** The rendered thread, built once and reused until something on it changes. */\n    synchronized String view(QaService so, String questionId) {\n        String cached = rendered.get(questionId);\n        if (cached != null) { hits++; return cached; }\n        misses++;\n        Question q = so.question(questionId);\n        StringBuilder sb = new StringBuilder(q.title()).append(&quot; [&quot;).append(q.score()).append(&quot;]&quot;);\n        for (Answer a : q.answers()) sb.append(&quot; | &quot;).append(a.id()).append(&quot; &quot;).append(a.score());\n        String view = sb.toString();\n        rendered.put(questionId, view);\n        return view;\n    }\n\n    public synchronized void onEvent(QaEvent e) { rendered.remove(e.questionId()); }\n    synchronized String stats() { return hits + &quot; hits, &quot; + misses + &quot; misses&quot;; }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) {\n        long[] now = { 1_700_000_000_000L };                               // a clock the demo controls\n        QaService so = new QaService();\n        so.setClock(() -&gt; now[0]);\n        so.register(&quot;alice&quot;, &quot;Alice&quot;, 130);            // enough to downvote (125); not enough for gold yet\n        so.register(&quot;bob&quot;, &quot;Bob&quot;, 130);\n        so.register(&quot;carol&quot;, &quot;Carol&quot;, 130);\n        so.register(&quot;mod&quot;, &quot;Mod&quot;, 700);                // 500+ reputation, so she may edit somebody else&#x27;s post\n\n        BadgeManager badges = new BadgeManager(so::user);\n        ModerationQueue mods = new ModerationQueue(so, -2);\n        BountyDesk bounties = new BountyDesk(so::user);\n        HotThreadCache cache = new HotThreadCache(64);\n        RepReversal undo = new RepReversal(so);\n        so.configure(new TunedRules(), badges, mods, bounties, cache, undo);\n\n        Question q = so.ask(&quot;alice&quot;, &quot;How do I reverse a list in place?&quot;, &quot;Without allocating a second list.&quot;, Set.of(&quot;java&quot;));\n        Answer a1 = so.answer(q.id(), &quot;bob&quot;, &quot;Swap from both ends, i and n-1-i.&quot;);\n        Answer a2 = so.answer(q.id(), &quot;carol&quot;, &quot;Collections.reverse does it for you.&quot;);\n\n        // a new rulebook: an answer upvote is now +12\n        long bobBefore = so.user(&quot;bob&quot;).reputation();\n        so.vote(a1.id(), &quot;carol&quot;, VoteType.UP);\n        System.out.println(&quot;tuned rulebook: an answer upvote moved bob &quot; + (so.user(&quot;bob&quot;).reputation() - bobBefore) + &quot; (was 10)&quot;);\n\n        // a daily cap, wrapping the plain adder\n        so.setAwards(new DailyCap((u, d, t) -&gt; { u.addRep(d); return d; }, 20));\n        so.register(&quot;dan&quot;, &quot;Dan&quot;, 300); so.register(&quot;eve&quot;, &quot;Eve&quot;, 300);\n        long carolBefore = so.user(&quot;carol&quot;).reputation();\n        so.vote(a2.id(), &quot;dan&quot;, VoteType.UP);\n        so.vote(a2.id(), &quot;eve&quot;, VoteType.UP);\n        System.out.println(&quot;daily cap 20/day: carol earned &quot; + (so.user(&quot;carol&quot;).reputation() - carolBefore) + &quot; from two +12 upvotes&quot;);\n        now[0] += 86_400_000L;                                             // tomorrow\n        so.vote(q.id(), &quot;dan&quot;, VoteType.UP);\n        System.out.println(&quot;next day the budget resets: alice is now &quot; + so.user(&quot;alice&quot;).reputation());\n        so.setAwards((u, d, t) -&gt; { u.addRep(d); return d; });             // back to the plain adder\n\n        // badges, from the events that already flow\n        System.out.println(&quot;badges awarded: &quot; + badges.awarded());\n\n        // edit history\n        EditLog edits = new EditLog(so, () -&gt; now[0]);\n        edits.edit(a1.id(), &quot;bob&quot;, &quot;Swap from both ends: for (i = 0; i &lt; n/2; i++) swap(i, n-1-i).&quot;);\n        edits.edit(a1.id(), &quot;mod&quot;, &quot;Swap from both ends. See also Collections.reverse.&quot;);\n        System.out.println(&quot;revisions of &quot; + a1.id() + &quot;: &quot; + edits.historyOf(a1.id()).size()\n            + &quot;, oldest = \\&quot;&quot; + edits.historyOf(a1.id()).get(0).body() + &quot;\\&quot;&quot;);\n\n        // a moderation queue, from the same events\n        so.vote(a2.id(), &quot;alice&quot;, VoteType.DOWN);\n        so.vote(a2.id(), &quot;bob&quot;, VoteType.DOWN);\n        so.retractVote(a2.id(), &quot;dan&quot;);\n        so.retractVote(a2.id(), &quot;eve&quot;);\n        System.out.println(&quot;flagged for moderation (score &lt;= -2): &quot; + mods.flagged());\n\n        // a bounty, escrowed now and paid on accept\n        long aliceBefore = so.user(&quot;alice&quot;).reputation();\n        bounties.offer(q.id(), &quot;alice&quot;, 50, now[0], 7L * 86_400_000L);\n        System.out.println(&quot;bounty escrowed: alice &quot; + aliceBefore + &quot; -&gt; &quot; + so.user(&quot;alice&quot;).reputation());\n        long bobRep = so.user(&quot;bob&quot;).reputation();\n        so.accept(a1.id(), &quot;alice&quot;);\n        System.out.println(&quot;bounty paid: bob &quot; + bobRep + &quot; -&gt; &quot; + so.user(&quot;bob&quot;).reputation() + &quot; &quot; + bounties.paid());\n\n        // an expired bounty comes back\n        Question stale = so.ask(&quot;alice&quot;, &quot;Why is my regex slow?&quot;, &quot;Catastrophic backtracking, probably.&quot;, Set.of(&quot;regex&quot;));\n        long before = so.user(&quot;alice&quot;).reputation();\n        bounties.offer(stale.id(), &quot;alice&quot;, 25, now[0], 7L * 86_400_000L);\n        long escrowed = so.user(&quot;alice&quot;).reputation();\n        now[0] += 8L * 86_400_000L;\n        int swept = bounties.sweep(now[0]);\n        System.out.println(&quot;swept &quot; + swept + &quot; expired bounty: alice &quot; + before + &quot; -&gt; &quot; + escrowed\n            + &quot; while it was open -&gt; &quot; + so.user(&quot;alice&quot;).reputation() + &quot; after the sweep&quot;);\n\n        // search, sorted and paged\n        for (int i = 0; i &lt; 7; i++) so.ask(&quot;bob&quot;, &quot;Question &quot; + i + &quot; about lists&quot;, &quot;body about java lists&quot;, Set.of(&quot;java&quot;));\n        List&lt;Question&gt; matches = so.byTag(&quot;java&quot;);\n        Page&lt;Question&gt; p0 = Search.page(matches, SortOrder.VOTES, 0, 3);\n        System.out.println(&quot;tag java: &quot; + matches.size() + &quot; matches, page 0 of size 3 = &quot;\n            + p0.items().size() + &quot;, hasNext=&quot; + p0.hasNext());\n\n        // two tags at once, and the order a thread page shows its answers in\n        so.ask(&quot;bob&quot;, &quot;Spring bean scopes&quot;, &quot;prototype or singleton&quot;, Set.of(&quot;java&quot;, &quot;spring&quot;));\n        System.out.println(&quot;java AND spring: &quot; + Search.allTags(so, List.of(&quot;java&quot;, &quot;spring&quot;)).size()\n            + &quot; of &quot; + so.byTag(&quot;java&quot;).size() + &quot; java questions&quot;);\n        System.out.println(&quot;thread page order (accepted first): &quot; + Search.answersInOrder(q).stream().map(Answer::id).toList());\n\n        // a spam quota, asked at the EDGE: three in a burst, and the fourth never reaches ask()\n        PostQuota quota = new PostQuota(3, 600_000L);                      // 3 burst, one more every 10 minutes\n        int posted = 0;\n        for (int i = 0; i &lt; 5; i++)\n            if (quota.allow(&quot;bob&quot;, now[0])) { so.ask(&quot;bob&quot;, &quot;Burst question &quot; + i, &quot;body&quot;, Set.of(&quot;java&quot;)); posted++; }\n        System.out.println(&quot;spam quota: &quot; + posted + &quot; of 5 asks allowed in the same second&quot;);\n        System.out.println(&quot;ten minutes later: &quot; + quota.allow(&quot;bob&quot;, now[0] + 600_000L));\n\n        // the hot-question cache\n        System.out.println(&quot;cache: &quot; + cache.view(so, q.id()));\n        cache.view(so, q.id());\n        so.vote(a1.id(), &quot;dan&quot;, VoteType.UP);                              // any event drops the entry\n        cache.view(so, q.id());\n        System.out.println(&quot;cache &quot; + cache.stats() + &quot; (the vote invalidated it)&quot;);\n\n        // persistence: the three statements that replace the lock\n        System.out.println(&quot;sql: &quot; + SqlSketch.BUMP_SCORE);\n\n        // and last, because it takes the thread away: deleting it hands back every point it ever paid out\n        long bobAtDelete = so.user(&quot;bob&quot;).reputation();\n        so.delete(q.id(), &quot;mod&quot;);\n        System.out.println(&quot;deleted &quot; + q.id() + &quot;: reversed &quot; + undo.reversed().get(q.id())\n            + &quot; reputation; bob &quot; + bobAtDelete + &quot; -&gt; &quot; + so.user(&quot;bob&quot;).reputation()\n            + &quot;, and it is out of the index: tag java now &quot; + so.byTag(&quot;java&quot;).size());\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// Targeted failure tests: each one proves a claim the design makes on page 02, move 9.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n    /** Run something that must be refused, and report whether it was. */\n    static boolean refused(Runnable r) { try { r.run(); return false; } catch (RuntimeException e) { return true; } }\n\n    public static void main(String[] args) throws Exception {\n\n        // 1. fifty people upvote the SAME answer in the same instant, each of them twice. The score must be the\n        //    number of distinct voters, never 100 and never 49, and the author&#x27;s reputation must match it exactly.\n        QaService so = new QaService();\n        so.register(&quot;alice&quot;, &quot;Alice&quot;, 100);\n        so.register(&quot;bob&quot;, &quot;Bob&quot;, 100);\n        Question hot = so.ask(&quot;alice&quot;, &quot;Why is my loop slow?&quot;, &quot;A tight loop over a linked list.&quot;, Set.of(&quot;java&quot;, &quot;performance&quot;));\n        Answer hotAnswer = so.answer(hot.id(), &quot;bob&quot;, &quot;Random access on a linked list is O(n) per step.&quot;);\n        long bobBefore = so.user(&quot;bob&quot;).reputation();\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; votes = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            String voter = &quot;v&quot; + i;\n            so.register(voter, &quot;Voter &quot; + i, 200);\n            votes.add(pool.submit(() -&gt; {\n                go.await();\n                so.vote(hotAnswer.id(), voter, VoteType.UP);\n                so.vote(hotAnswer.id(), voter, VoteType.UP);      // the same vote again: must be a no-op\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : votes) f.get();\n        pool.shutdown();\n        Post voted = hot.post(hotAnswer.id());\n        check(voted.voterCount() == 50, &quot;50 distinct voters are in the ledger, not 49 and not 100&quot;);\n        check(voted.score() == 50, &quot;the score is exactly 50 after 100 concurrent vote calls&quot;);\n        check(so.user(&quot;bob&quot;).reputation() - bobBefore == 500, &quot;bob&#x27;s reputation moved by exactly 50 x 10 = 500&quot;);\n\n        // 2. cast, flip, retract. new-minus-old must bring the score AND the reputation back to exactly where\n        //    they started -- not &quot;about right&quot;, and with no unearned points left behind.\n        QaService s2 = new QaService();\n        s2.register(&quot;asker&quot;, &quot;Asker&quot;, 100);\n        s2.register(&quot;answerer&quot;, &quot;Answerer&quot;, 100);\n        s2.register(&quot;voter&quot;, &quot;Voter&quot;, 200);\n        Question q2 = s2.ask(&quot;asker&quot;, &quot;How do I reverse a string?&quot;, &quot;Without a StringBuilder.&quot;, Set.of(&quot;java&quot;));\n        Answer a2 = s2.answer(q2.id(), &quot;answerer&quot;, &quot;new StringBuilder(s).reverse().toString().&quot;);\n        long repStart = s2.user(&quot;answerer&quot;).rawReputation();\n        s2.vote(a2.id(), &quot;voter&quot;, VoteType.UP);\n        check(q2.post(a2.id()).score() == 1 &amp;&amp; s2.user(&quot;answerer&quot;).rawReputation() - repStart == 10, &quot;an upvote is +1 score, +10 reputation&quot;);\n        s2.vote(a2.id(), &quot;voter&quot;, VoteType.DOWN);\n        check(q2.post(a2.id()).score() == -1 &amp;&amp; s2.user(&quot;answerer&quot;).rawReputation() - repStart == -2, &quot;the flip is a net -2 score and -12 reputation, in one step&quot;);\n        s2.retractVote(a2.id(), &quot;voter&quot;);\n        check(q2.post(a2.id()).score() == 0 &amp;&amp; s2.user(&quot;answerer&quot;).rawReputation() == repStart, &quot;after retracting, score and reputation are back to exactly zero&quot;);\n        check(q2.post(a2.id()).voterCount() == 0, &quot;and the retracted voter is out of the ledger, not stored as null&quot;);\n\n        // 3. the guards: you cannot vote on your own post, and you cannot vote on a post that does not exist.\n        //    Neither may write anything at all.\n        int scoreBefore = q2.post(a2.id()).score();\n        long repBefore = s2.user(&quot;answerer&quot;).rawReputation();\n        check(refused(() -&gt; s2.vote(a2.id(), &quot;answerer&quot;, VoteType.UP)), &quot;voting on your own answer is refused&quot;);\n        check(refused(() -&gt; s2.vote(&quot;a999&quot;, &quot;voter&quot;, VoteType.UP)), &quot;voting on a post that does not exist is refused&quot;);\n        check(q2.post(a2.id()).score() == scoreBefore &amp;&amp; s2.user(&quot;answerer&quot;).rawReputation() == repBefore,\n              &quot;and neither refusal changed a score or a reputation&quot;);\n\n        // 4. accepting: only the asker, exactly one, and re-accepting MOVES the +15 instead of handing out a second one.\n        QaService s4 = new QaService();\n        s4.register(&quot;asker&quot;, &quot;Asker&quot;, 100);\n        s4.register(&quot;first&quot;, &quot;First&quot;, 100);\n        s4.register(&quot;second&quot;, &quot;Second&quot;, 100);\n        Question q4 = s4.ask(&quot;asker&quot;, &quot;Which map should I use?&quot;, &quot;Concurrent reads, rare writes.&quot;, Set.of(&quot;java&quot;));\n        Answer first = s4.answer(q4.id(), &quot;first&quot;, &quot;ConcurrentHashMap.&quot;);\n        Answer second = s4.answer(q4.id(), &quot;second&quot;, &quot;Map.copyOf if it never changes.&quot;);\n        check(refused(() -&gt; s4.accept(first.id(), &quot;second&quot;)), &quot;a non-asker cannot accept an answer&quot;);\n        check(q4.acceptedAnswerId() == null, &quot;and nothing was accepted by that attempt&quot;);\n        long askerBefore = s4.user(&quot;asker&quot;).reputation();\n        s4.accept(first.id(), &quot;asker&quot;);\n        check(q4.acceptedAnswerId().equals(first.id()) &amp;&amp; s4.user(&quot;first&quot;).reputation() == 115, &quot;the asker accepts: the answer&#x27;s author gains 15&quot;);\n        check(s4.user(&quot;asker&quot;).reputation() - askerBefore == 2, &quot;and the asker gains the 2 for accepting&quot;);\n        s4.accept(first.id(), &quot;asker&quot;);\n        check(s4.user(&quot;first&quot;).reputation() == 115, &quot;accepting the same answer twice is a no-op&quot;);\n        s4.accept(second.id(), &quot;asker&quot;);\n        check(q4.acceptedAnswerId().equals(second.id()), &quot;re-accepting moves the flag to the second answer&quot;);\n        check(s4.user(&quot;first&quot;).reputation() == 100 &amp;&amp; s4.user(&quot;second&quot;).reputation() == 115, &quot;the first author&#x27;s 15 is taken back and given to the second&quot;);\n        check(s4.user(&quot;asker&quot;).reputation() - askerBefore == 2, &quot;the asker is paid the accept bonus once, not once per change of mind&quot;);\n\n        // 5. the life cycle: a closed question takes no new answers or comments, but its posts stay votable;\n        //    a deleted one refuses everything.\n        QaService s5 = new QaService();\n        s5.register(&quot;asker&quot;, &quot;Asker&quot;, 100);\n        s5.register(&quot;mod&quot;, &quot;Mod&quot;, 900);\n        s5.register(&quot;bob&quot;, &quot;Bob&quot;, 200);\n        Question q5 = s5.ask(&quot;asker&quot;, &quot;Is this opinion based?&quot;, &quot;Which framework is best?&quot;, Set.of(&quot;java&quot;));\n        Answer a5 = s5.answer(q5.id(), &quot;bob&quot;, &quot;Depends on the team.&quot;);\n        s5.close(q5.id(), &quot;mod&quot;, &quot;opinion based&quot;);\n        check(q5.state() == QuestionState.CLOSED, &quot;a user with the close privilege closed the question&quot;);\n        check(refused(() -&gt; s5.answer(q5.id(), &quot;bob&quot;, &quot;Another answer&quot;)), &quot;a closed question refuses a new answer&quot;);\n        check(refused(() -&gt; s5.comment(q5.id(), &quot;bob&quot;, &quot;a comment&quot;)), &quot;a closed question refuses a new comment&quot;);\n        s5.vote(a5.id(), &quot;mod&quot;, VoteType.UP);\n        check(q5.post(a5.id()).score() == 1, &quot;but an existing answer on a closed question is still votable&quot;);\n        check(refused(() -&gt; s5.close(q5.id(), &quot;bob&quot;, &quot;me too&quot;)), &quot;a user below the close threshold cannot close&quot;);\n        s5.reopen(q5.id(), &quot;mod&quot;);\n        check(q5.state() == QuestionState.OPEN, &quot;and a moderator can reopen it&quot;);\n        s5.delete(q5.id(), &quot;mod&quot;);\n        check(refused(() -&gt; s5.vote(a5.id(), &quot;asker&quot;, VoteType.UP)), &quot;a deleted question refuses even a vote&quot;);\n\n        // 6. search: the inverted index finds by tag, by word and by author, and a deleted question leaves it.\n        QaService s6 = new QaService();\n        s6.register(&quot;alice&quot;, &quot;Alice&quot;, 100);\n        s6.register(&quot;mod&quot;, &quot;Mod&quot;, 900);\n        Question keep = s6.ask(&quot;alice&quot;, &quot;How do I parse a date in Java?&quot;, &quot;The format keeps throwing.&quot;, Set.of(&quot;java&quot;, &quot;datetime&quot;));\n        Question drop = s6.ask(&quot;alice&quot;, &quot;How do I parse a date in Python?&quot;, &quot;strptime is confusing.&quot;, Set.of(&quot;python&quot;, &quot;datetime&quot;));\n        check(s6.byTag(&quot;datetime&quot;).size() == 2, &quot;two questions carry the datetime tag&quot;);\n        check(s6.byWord(&quot;parse&quot;).size() == 2 &amp;&amp; s6.byWord(&quot;strptime&quot;).size() == 1, &quot;the word index finds both, and one&quot;);\n        check(s6.byAuthor(&quot;alice&quot;).size() == 2, &quot;and the author index finds both&quot;);\n        s6.delete(drop.id(), &quot;mod&quot;);\n        check(s6.byTag(&quot;datetime&quot;).size() == 1 &amp;&amp; s6.byWord(&quot;strptime&quot;).isEmpty(), &quot;a deleted question is out of every posting list&quot;);\n        check(s6.byTag(&quot;datetime&quot;).get(0).id().equals(keep.id()), &quot;and the survivor is the one that was kept&quot;);\n\n        // 7. the reputation floor is a display rule. Storing a clamped value would hand out points for a\n        //    downvote that no longer exists, so the true value is stored and the floor lives on the read.\n        QaService s7 = new QaService();\n        s7.register(&quot;newbie&quot;, &quot;Newbie&quot;, 1);\n        s7.register(&quot;critic&quot;, &quot;Critic&quot;, 200);\n        s7.register(&quot;asker&quot;, &quot;Asker&quot;, 100);\n        Question q7 = s7.ask(&quot;asker&quot;, &quot;Is this a good pattern?&quot;, &quot;Singleton everywhere.&quot;, Set.of(&quot;design&quot;));\n        Answer a7 = s7.answer(q7.id(), &quot;newbie&quot;, &quot;Yes, use it for everything.&quot;);\n        s7.vote(a7.id(), &quot;critic&quot;, VoteType.DOWN);\n        check(s7.user(&quot;newbie&quot;).rawReputation() == -1, &quot;the true value went below zero and was stored&quot;);\n        check(s7.user(&quot;newbie&quot;).reputation() == 0, &quot;but the profile shows zero: the floor is on the read path&quot;);\n        s7.retractVote(a7.id(), &quot;critic&quot;);\n        check(s7.user(&quot;newbie&quot;).rawReputation() == 1, &quot;retracting the downvote returns exactly the original 1, not 3&quot;);\n\n        // 8. privileges are a threshold table, and a listener that throws cannot break a vote or lose a delta.\n        QaService s8 = new QaService();\n        s8.register(&quot;asker&quot;, &quot;Asker&quot;, 100);\n        s8.register(&quot;author&quot;, &quot;Author&quot;, 100);\n        s8.register(&quot;rookie&quot;, &quot;Rookie&quot;, 14);\n        s8.register(&quot;regular&quot;, &quot;Regular&quot;, 15);\n        s8.register(&quot;trusted&quot;, &quot;Trusted&quot;, 125);\n        List&lt;String&gt; heard = new ArrayList&lt;&gt;();\n        s8.configure(new DefaultRules(),\n            e -&gt; { throw new IllegalStateException(&quot;this listener is broken&quot;); },\n            e -&gt; heard.add(e.kind() + &quot;:&quot; + e.repDelta()));\n        Question q8 = s8.ask(&quot;asker&quot;, &quot;Why does this throw?&quot;, &quot;A NullPointerException on line 3.&quot;, Set.of(&quot;java&quot;));\n        Answer a8 = s8.answer(q8.id(), &quot;author&quot;, &quot;Something on that line is null.&quot;);\n        check(refused(() -&gt; s8.vote(a8.id(), &quot;rookie&quot;, VoteType.UP)), &quot;14 reputation is not enough to upvote (15 needed)&quot;);\n        check(q8.post(a8.id()).score() == 0, &quot;and the refused vote wrote nothing&quot;);\n        s8.vote(a8.id(), &quot;regular&quot;, VoteType.UP);\n        check(q8.post(a8.id()).score() == 1 &amp;&amp; s8.user(&quot;author&quot;).reputation() == 110, &quot;15 reputation is enough, and the vote landed despite the broken listener&quot;);\n        check(refused(() -&gt; s8.vote(a8.id(), &quot;regular&quot;, VoteType.DOWN)), &quot;but 15 is not enough to downvote (125 needed)&quot;);\n        s8.vote(a8.id(), &quot;trusted&quot;, VoteType.DOWN);\n        check(q8.post(a8.id()).score() == 0 &amp;&amp; s8.user(&quot;author&quot;).reputation() == 108, &quot;125 reputation can downvote, and the reputation moved&quot;);\n        check(heard.contains(&quot;VOTED:10&quot;) &amp;&amp; heard.contains(&quot;VOTED:-2&quot;), &quot;the second listener heard every event the broken one threw on&quot;);\n\n        // 9. deleting a thread. A stranger cannot; the asker can; and when it goes, every reputation point the\n        //    thread ever paid out comes back -- exactly once, even if the DELETED event is replayed.\n        QaService s9 = new QaService();\n        s9.register(&quot;asker&quot;, &quot;Asker&quot;, 100);\n        s9.register(&quot;author&quot;, &quot;Author&quot;, 100);\n        s9.register(&quot;voter&quot;, &quot;Voter&quot;, 200);\n        RepReversal undo = new RepReversal(s9);\n        s9.configure(new DefaultRules(), undo);\n        Question q9 = s9.ask(&quot;asker&quot;, &quot;Why does this compile?&quot;, &quot;A generic method with a wildcard.&quot;, Set.of(&quot;java&quot;));\n        Answer a9 = s9.answer(q9.id(), &quot;author&quot;, &quot;The wildcard is captured into a type variable.&quot;);\n        s9.vote(a9.id(), &quot;voter&quot;, VoteType.UP);                  // author +10\n        s9.accept(a9.id(), &quot;asker&quot;);                             // author +15, asker +2\n        check(s9.user(&quot;author&quot;).reputation() == 125 &amp;&amp; s9.user(&quot;asker&quot;).reputation() == 102, &quot;an upvote and an acceptance paid out 25 and 2&quot;);\n        check(refused(() -&gt; s9.delete(q9.id(), &quot;voter&quot;)), &quot;a stranger with 200 reputation cannot delete somebody else&#x27;s question&quot;);\n        check(q9.state() == QuestionState.OPEN, &quot;and the refused delete left the thread open&quot;);\n        s9.delete(q9.id(), &quot;asker&quot;);                             // the asker may delete their own\n        check(s9.user(&quot;author&quot;).reputation() == 100 &amp;&amp; s9.user(&quot;asker&quot;).reputation() == 100, &quot;deleting the thread hands every point back, from the ledger&quot;);\n        undo.onEvent(new QaEvent(EventKind.DELETED, q9.id(), q9.id(), &quot;asker&quot;, &quot;asker&quot;, 0, 0));\n        check(s9.user(&quot;author&quot;).reputation() == 100, &quot;and a replayed DELETED event takes nothing a second time&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design Stack Overflow. People ask questions, others answer them and comment, anybody can upvote or downvote a post and change their mind later, the asker accepts one answer, and all of that moves reputation. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (the exact reputation numbers and whether a vote can be changed come first); then type in the order of Main.java: the six enums, the QaEvent record, the five one-method interfaces, DefaultRules, User with its atomic counter, the abstract Post with its ledger, Answer and Comment, then Question with its lock and the order inside <code>vote</code>, then SearchIndex, then the thin QaService, then a main with fifty threads voting on one answer.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; Stack Overflow changes its mind: an answer upvote is now +12, an accepted answer +20, and nobody may earn more than two hundred reputation a day.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The numbers are one class. TunedRules implements the same single method with different values and is handed in through configure(), which also re-points every thread that already exists, so the change applies mid-flight. The daily cap is a different shape and it is worth saying why: the rulebook is asked twice on every vote, once for the state the voter was in and once for the state they are moving to, so it has to stay pure. The cap therefore wraps the <i>award</i> rule instead &mdash; DailyCap holds the plain adder, tracks what each user has earned today from the injected clock, and hands on only what is left of the budget. Losses and reversals are never capped, because capping them would make a downvote irreversible.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a new rulebook -- the numbers move, and nothing else does\n/**\n * The interviewer changes the policy mid-round: an answer upvote is now +12, a downvote costs the author 3, and\n * an accepted answer is worth 20. A new class implementing the same one method, handed in through configure().\n * Post, the vote path and the tests are untouched.\n */\nfinal class TunedRules implements ReputationRules {\n    private final Map&lt;RepReason, Integer&gt; table = new EnumMap&lt;&gt;(RepReason.class);\n    TunedRules() {\n        table.put(RepReason.QUESTION_UP, 6);\n        table.put(RepReason.QUESTION_DOWN, -3);\n        table.put(RepReason.ANSWER_UP, 12);\n        table.put(RepReason.ANSWER_DOWN, -3);\n        table.put(RepReason.COMMENT_UP, 0);\n        table.put(RepReason.COMMENT_DOWN, 0);\n        table.put(RepReason.ANSWER_ACCEPTED, 20);\n        table.put(RepReason.ACCEPTER_BONUS, 2);\n    }\n    public int pointsFor(RepReason reason) { return table.getOrDefault(reason, 0); }\n}\n\n// ---- ext: a daily reputation cap -- a Decorator on how a delta lands, not on the rulebook\n/**\n * &quot;Nobody may earn more than 200 reputation a day.&quot; It wraps the award rule rather than the rulebook, because\n * the rulebook is asked twice per vote (old state, new state) and must stay pure; this is called once, with the\n * number that really moved. Losses and reversals are never capped -- capping them would make a downvote\n * irreversible, which is the same mistake as flooring reputation on the write path.\n */\nfinal class DailyCap implements RepAward {\n    private final RepAward base;\n    private final int per

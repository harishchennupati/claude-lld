<style>

.d{color:#7fa66f;font-style:italic} .right-uml{margin:0} .right-uml svg{width:100%;height:auto} .move{margin:0 22px 18px} .move h3{margin:0 0 6px;font-size:14.5px} .move p{margin:6px 0 0;line-height:1.6} .fullboard{margin:0 22px 14px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px} .fullboard svg{width:100%;height:auto;display:block} .req{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 22px 18px} .req>div{background:var(--bg3);border-radius:8px;padding:16px 20px 18px} .req b{color:var(--acc)} .req ul{margin:6px 0 0;padding-left:18px} .req li{font-size:13.5px;line-height:1.55;margin:5px 0} table.ask{margin:0 0 6px} table.ask th{font-size:12px;color:var(--acc);font-weight:600;padding:8px 10px} table.ask td{font-size:13px;line-height:1.5;padding:9px 10px} table.ask td:first-child{color:var(--text)} table.ask td:not(:first-child){color:var(--muted)} .move h3{margin-top:10px} .grade{margin:0 22px 14px;background:var(--bg3);border-left:3px solid var(--acc);padding:10px 14px;border-radius:0 6px 6px 0} .grade b{color:var(--acc)} .wrap.wide .right{display:none}
.k{color:#c792ea} .s{color:#c3e88d} .c{color:#5c6773;font-style:italic} .n{color:#f78c6c} .t{color:#82aaff}
.nav{display:flex;gap:10px;padding:0 22px 24px} .nav button{background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit} .nav button.pri{background:var(--acc);color:#04211a;border-color:var(--acc);font-weight:600}
.right h3{margin:4px 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#cd{width:100%;height:auto;display:block} .nd rect{fill:var(--bg3);stroke:var(--line);stroke-width:1.2} .nd text{fill:var(--text);font-family:var(--mono)} .nd .lb{font-size:12px} .nd .sb{font-size:9.5px;fill:var(--muted)}
.nd.iface rect{stroke-dasharray:4 3} .nd.enum rect{rx:14} .nd{opacity:0;transition:opacity .3s} .nd.seen{opacity:.45} .nd.cur{opacity:1} .nd.cur rect{stroke:var(--acc);stroke-width:1.8;fill:#12302a}
.e{fill:none;stroke:var(--line);stroke-width:1.2;opacity:0;transition:opacity .3s;color:var(--line)} .e.seen{opacity:.6} .e.cur{opacity:1;stroke:var(--acc);color:var(--acc)} .e.isa{} .e.ref{stroke-dasharray:4 3} .e.use{stroke-dasharray:1.5 3}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin:8px 0 14px;flex-wrap:wrap} .legend span::before{content:"";display:inline-block;width:22px;border-top:1.5px solid var(--muted);margin-right:5px;vertical-align:middle} .legend .own::before{} .legend .ref::before{border-top-style:dashed} .legend .use::before{border-top-style:dotted}
.pat{margin-top:10px} .pat div{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px} .pat div span:last-child{color:var(--muted)} .pat div.on{color:var(--acc)} .pat div.on span:last-child{color:var(--text)}
/* practice */
.prac{padding:0 22px}
.card{border:1px solid var(--line);border-radius:8px;background:var(--bg2);margin-bottom:16px} .card .ch{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)} .card .ch h3{margin:0;font-size:15px} .card .cb{padding:14px 16px;line-height:1.6}
.timer{margin-left:auto;font-family:var(--mono);font-size:12px;background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:4px 12px;cursor:pointer} .timer.run{background:var(--acc);color:#04211a} .timer.done{border-color:var(--err);color:var(--err)}
.kind{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:2px 6px;white-space:nowrap} .ans table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0} .ans th,.ans td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} .ans th{color:var(--muted);font-weight:500} .ans .ed{margin:10px 0} .say2{margin:8px 0 0;padding:8px 12px;background:#132a24;border-left:3px solid var(--acc);border-radius:0 6px 6px 0} .say2 b{color:var(--acc)}
.prompt{background:var(--bg3);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 6px 6px 0;font-style:italic;margin-bottom:10px}
details{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:10px} summary{cursor:pointer;color:var(--acc2);font-weight:600} a{color:var(--acc)}
.right .lock{display:none;color:var(--muted);padding:40px 10px;text-align:center;border:1px dashed var(--line);border-radius:8px} .right.locked .lock{display:block} .right.locked #cd,.right.locked .legend,.right.locked .pat,.right.locked h3:nth-of-type(2){display:none} summary small{color:var(--muted);font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} th{color:var(--text);font-weight:500;white-space:nowrap} td{color:var(--muted)}
ul.chk{list-style:none;padding:0;margin:6px 0} ul.chk li::before{content:"[ ] ";font-family:var(--mono);color:var(--muted)}
.miss textarea{width:100%;min-height:80px;background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:13px var(--mono)}
@media (max-width:1100px){.wrap{grid-template-columns:200px 1fr} .right{display:none}}

<div class="top"><h1>Stack Overflow</h1><span class="sub">LLD &middot; Java &middot; OpenJDK 21: demo, 9 failure-test blocks and a 50-thread vote race pass</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design Stack Overflow. People ask questions, others answer them and comment, anybody can upvote or downvote a post and change their mind later, the asker accepts one answer, and all of that moves reputation. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>People ask questions and other people answer them. Anyone can leave a comment, and anyone except the author can vote a post up or down &mdash; and change that vote later, or take it back entirely. Every one of those votes moves the <i>author's</i> reputation by a fixed number of points, and reputation is what buys the right to do more: you need fifteen points to upvote, a hundred and twenty-five to downvote. The person who asked can mark exactly one answer as the accepted one, which pays its author fifteen points, and they can change their mind later. Questions carry tags so other people can find them. Thousands of people vote on the same front-page answer at the same moment, so the one thing that must always be true is that a post's score is the number of distinct people who voted on it &mdash; never more, never fewer &mdash; and the author's reputation agrees with it to the point.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that asks, answers, votes and accepts, and prints the scores. The interviewer is watching for, in this order: the questions you ask before typing (the exact reputation numbers and whether a vote can be changed are the first two); which classes exist and which one owns the votes; a vote end to end; what happens when fifty people vote at the same instant; where the reputation numbers live, so changing them is one line and not a search through the code; and what the system looks like after a refused vote. Then the twists: badges, bounties, edit history, moderation, search and paging, persistence.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 348\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"86\" y=\"54\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">ask &amp; answer</text><g transform=\"translate(175 24)\"><rect width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone asks a question</text><text x=\"120.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a title, a body, some tags</text></g><path d=\"M415 50 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 24)\"><rect width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">it lands in the store first</text><text x=\"120.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">and only then in the search index</text></g><path d=\"M675 50 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 24)\"><rect width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">answers arrive on the thread</text><text x=\"120.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">only while it is still open</text></g><path d=\"M935 50 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 24)\"><rect width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">comments hang off both</text><text x=\"120.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">never off another comment</text></g><text x=\"86\" y=\"136\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">vote</text><g transform=\"translate(175 106)\"><rect width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a reader votes on a post</text><text x=\"120.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">up, down, changed, taken back</text></g><path d=\"M415 132 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 106)\"><rect width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">read the vote they had before</text><text x=\"120.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the same vote again does nothing</text></g><path d=\"M675 132 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 106)\"><rect width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">score and reputation move</text><text x=\"120.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">by new minus old, as one step</text></g><path d=\"M935 132 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 106)\"><rect width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">then tell the listeners</text><text x=\"120.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">after the lock, never inside it</text></g><text x=\"86\" y=\"256\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">accept</text><g transform=\"translate(175 226)\"><rect width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the asker accepts an answer</text><text x=\"120.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">only the asker, only one</text></g><path d=\"M415 252 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 226)\"><rect width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take back the previous +15</text><text x=\"120.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">if one was already accepted</text></g><path d=\"M675 252 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 226)\"><rect width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">award the new author +15</text><text x=\"120.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the asker's +2 is paid once</text></g><path d=\"M935 252 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 226)\"><rect width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the flag moves</text><text x=\"120.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">readers see it without the lock</text></g><path d=\"M555 158 V166\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(390 166)\"><rect width=\"450\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"225.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refused: your own post, or too little reputation</text><text x=\"225.0\" y=\"28.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nothing at all is written</text></g><text x=\"86\" y=\"300\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"300\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, without counting a single vote: what is this post's score?  what is my reputation?  which questions carry the tag java?</text><text x=\"615\" y=\"332\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">fifty people vote on the same answer in the same instant: the score must equal the number of distinct voters, and no reputation may be counted twice</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Questions and answers only, or comments and edits too?</td><td>Questions, answers and comments; edit history is a follow-up</td><td>Three kinds of post sharing one votable base (moves 1, 12)</td></tr><tr><td>Can a vote be changed or taken back, and is the same vote twice a no-op?</td><td>Yes to all three</td><td>A ledger of who voted which way, and new-minus-old arithmetic (moves 2, 6)</td></tr><tr><td>Give me the exact reputation numbers.</td><td>+5 question up, +10 answer up, -2 down, +15 accepted, +2 to the accepter</td><td>One rulebook behind one interface, handed in (move 3)</td></tr><tr><td>Can somebody vote on their own post, and who may accept an answer?</td><td>No; only the asker, and only one answer at a time</td><td>The guards that run before anything is written (move 6)</td></tr><tr><td>Does reputation gate anything?</td><td>Yes: 15 to upvote, 50 to comment, 125 to downvote, 500 to close</td><td>A threshold table on the user, checked inside the flow (move 5)</td></tr><tr><td>Tags and search now, or later?</td><td>Tags, keyword and author search; no ranking</td><td>An inverted index, O(matches) rather than a scan (move 5)</td></tr><tr><td>One process and in memory, or a database and many servers?</td><td>One process, in memory</td><td>No repository yet; a follow-up adds one (move 12)</td></tr><tr><td>Badges, bounties, moderation, edit history?</td><td>Out of scope, named</td><td>Each is one of the five twist moves (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Register users; ask a question with a title, a body and tags.</li>\n<li>Answer an open question; comment on a question or on an answer.</li>\n<li>Upvote or downvote any post you did not write, then change that vote or take it back.</li>\n<li>Every vote and every acceptance moves the <i>target author's</i> reputation by a fixed amount.</li>\n<li>The asker marks exactly one answer accepted, and may change which one.</li>\n<li>Close, reopen and delete a question, with reputation thresholds deciding who may.</li>\n<li>Find questions by tag, by keyword and by author.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Many people voting on one post at once: the score equals the number of distinct voters, never more, never fewer.</li>\n<li>A repeated vote is a no-op; a flip or a retraction is exactly invertible, so score and reputation can never drift apart.</li>\n<li>A post's score, a user's vote and \"which thread owns this post\" are all O(1); search is O(matches), never a scan.</li>\n<li>The reputation numbers are swappable without touching a line of the vote path.</li>\n<li>One source of truth per thread: the question owns its posts, its ledger and its one lock.</li>\n<li>Nothing half-done: a refused vote leaves every score and every reputation exactly as they were.</li>\n<li>In memory, one process, no persistence (say it; a follow-up adds it).</li></ul></div></div>\n<div class=\"move\"><h3>One morning, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 186\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:12  Alice asks q1</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">tagged java and collections</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">into the store, then into the index</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">score 0, nothing accepted yet</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:20  Bob answers, Carol upvotes</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">a1 score 0 -&gt; 1</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">Bob 100 -&gt; 110 reputation</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">Carol pays nothing to vote</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:21  Dan upvotes a1 twice</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the ledger already says Dan: UP</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">score stays 1, Bob stays at 110</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">idempotent by the ledger, not by luck</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">11:40  Alice accepts a2, not a1</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">Bob -15 and Carol +15, one step</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">Alice keeps the +2 she was paid once</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">flag and reputation still agree</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> a vote is not an entity, it is one entry in a map from user to direction; the same vote twice is a no-op and a change is new-minus-old; reputation is stored as the true signed number and floored only when it is shown; one lock per question thread, in memory, one process. Named as out of scope: badges, bounties, edit history, moderation, ranking and persistence &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, elevator, Splitwise) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On this problem two of them carry the round: move 1, because deciding that a vote is a map entry and not an entity makes changing and retracting a vote free, and move 6, because the order inside the lock is the whole difference between a score you can trust and one you cannot.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 225\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a USER asks a QUESTION; others post ANSWERS and COMMENTS; a VOTE moves a SCORE and a REPUTATION; a TAG finds the question later</text><g transform=\"translate(30 110)\"><rect width=\"170\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">User</text><text x=\"85.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">id + a reputation counter</text></g><path d=\"M115.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(218 110)\"><rect width=\"190\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Question</text><text x=\"95.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">title, tags, answers, lock</text></g><path d=\"M313.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(426 110)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Answer</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">body, score, its voters</text></g><path d=\"M508.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(609 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Comment</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">votable, not commentable</text></g><path d=\"M696.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(802 110)\"><rect width=\"195\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"97.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Vote</text><text x=\"97.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a map entry, not an entity</text></g><path d=\"M899.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1015 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Rulebook</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M1107.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a map entry, or an interface</text><text x=\"615\" y=\"210\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one noun is three nouns: a question, an answer and a comment all carry an author, a body, a score and a ledger, so that machinery is one abstract Post</text></svg></div><div class=\"move\"><p>Reading the prompt again: a <b>user</b> asks a <b>question</b>; other users post <b>answers</b> and leave <b>comments</b>; a <b>vote</b> moves a <b>score</b> and a <b>reputation</b>; a <b>tag</b> finds the question later. A user has an id and a reputation that moves: a class. A question has a title, tags, its answers, a state and a lock: a class. An answer and a comment have a body and a score: classes. A vote is the interesting one, because the tempting answer is wrong &mdash; a vote is not an entity with an id and a timestamp, it is the answer to \"which way did this user go on this post\", which is one entry in a map. Making it a map entry is what makes changing and retracting a vote almost free later. And the reputation rulebook has no state at all &mdash; it is a table of numbers &mdash; so it is an interface, not a class with fields. Finally, notice that the question, the answer and the comment all carry the same four things: an author, a body, a score and a ledger of voters. That repetition is the abstract <code>Post</code>, and it is the only inheritance in the design.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">turn a reason into points</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 46 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 24)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ReputationRules  (no state: pure)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 46 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rules.pointsFor(ANSWER_UP)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 80)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">move one post's score</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 102 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 80)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Post  (owns the voters map)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 102 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 80)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">post.record(voterId, UP)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 136)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">decide a vote, end to end</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 158 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 136)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Question  (owns the posts and the lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 158 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">question.vote(postId, user, UP)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 192)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">find questions by a word</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 214 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 192)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SearchIndex  (owns the inverted maps)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 214 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 192)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">index.byWord(\"hashmap\")</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb whose state is spread over two classes goes to the class that owns both: the question owns every post in its thread, so it owns the vote</text><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and accepting is not a new kind of vote: it is one flag on the question plus two reputation moves, so it lives beside vote(), under the same lock</text></svg></div><div class=\"move\"><p>\"Turn a reason into points\" touches nothing: it takes an enum and returns a number, so it belongs to a pure rule, <code>rules.pointsFor(ANSWER_UP)</code>. \"Move one post's score\" touches the voters map and the score, which live together on the post, so it is <code>post.record(voterId, UP)</code> &mdash; one method that writes both, because writing one without the other is the bug. \"Decide a vote end to end\" touches the post, the ledger, the author's reputation and the lock; only the question sees all of those, so <code>question.vote(postId, user, UP)</code> is the orchestrator. \"Find questions by a word\" touches the inverted maps and nothing else, so it is the index's. And notice what is not a new verb: accepting an answer. It is one flag on the question plus two reputation moves, so it sits beside <code>vote</code> under the same lock and follows the same order.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0

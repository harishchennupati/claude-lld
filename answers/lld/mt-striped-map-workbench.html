r (Thread t : waiters) { t.join(6_000); allWoke &amp;= !t.isAlive(); }\n        check(parked == 8 &amp;&amp; allWoke &amp;&amp; woke.get() == 8 &amp;&amp; quit.get() == 0,\n              &quot;8 threads parked on one condition; one signalAll after the write woke all &quot; + woke.get() + &quot; of them&quot;);\n\n        // 12. and the same wait with a budget, on a key that never arrives: it gives up, on time, instead of\n        //     hanging -- because awaitNanos hands back what is LEFT and the loop cannot restart the clock.\n        long waitT0 = System.nanoTime();\n        String never = waitMap.awaitValue(&quot;never-arrives&quot;, 200);\n        long waitMs = (System.nanoTime() - waitT0) / 1_000_000;\n        check(never == null &amp;&amp; waitMs &gt;= 150 &amp;&amp; waitMs &lt; 1_500,\n              &quot;a wait for a key that never arrives returned null after &quot; + waitMs + &quot; ms, not never&quot;);\n\n        // 13. cancelling a thread that is blocked on a lock somebody else holds. lock() cannot be interrupted;\n        //     lockInterruptibly() can. Both finish here -- the point is WHEN, and that neither one is stuck.\n        String canCancel = LockWaiting.cancelWhileBlocked(true);\n        String cannot = LockWaiting.cancelWhileBlocked(false);\n        check(canCancel.startsWith(&quot;cancelled&quot;), &quot;lockInterruptibly(): &quot; + canCancel);\n        check(cannot.startsWith(&quot;waited for the holder&quot;), &quot;plain lock() ignores the interrupt: &quot; + cannot);\n\n        // 14. fairness. The default lock lets an arriving thread barge past the queue, which is most of why it is\n        //     fast; a fair lock hands turns out in arrival order and pays a context switch for each one.\n        LockWaiting.Turns unfair = LockWaiting.hammer(false, 4, 200);\n        LockWaiting.Turns fairTurns = LockWaiting.hammer(true, 4, 200);\n        check(unfair.total &gt; fairTurns.total * 5,\n              &quot;the default (barging) lock did &quot; + unfair.total + &quot; acquisitions where the fair one did &quot;\n              + fairTurns.total + &quot;: fairness is not free&quot;);\n        check(fairTurns.min &gt; 0 &amp;&amp; fairTurns.max &lt;= fairTurns.min * 2 &amp;&amp; unfair.min &gt; 0,\n              &quot;under the fair lock every thread got a turn and the spread was &quot; + fairTurns.min + &quot;..&quot; + fairTurns.max\n              + &quot;; under the barging lock it was &quot; + unfair.min + &quot;..&quot; + unfair.max);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Write me a thread-safe hash map. Many threads reading, many threads writing, and wrapping a HashMap in one <code>synchronized</code> is not an answer. Show me that two threads incrementing the same counter never lose an update. I want working code, not a diagram. Go.\"</div>Before typing, write your six clarifying questions (which operations must be atomic, and how many stripes, first); then type in the order of Main.java: the <code>Clock</code> and <code>Hasher</code> interfaces, <code>SpreadHasher</code> with its multiply, the <code>KeyValueStore</code> contract, <code>Entry</code>, then <code>Segment</code> &mdash; its lock, its bucket array, its volatile count, and <code>putLocked</code> with the publish-then-count order &mdash; then <code>resize</code>, then <code>merge</code> and <code>computeIfAbsent</code> with the caller's function inside the hold, then <code>StripedMap</code> as the router (the two bit ranges, <code>tableSizeFor</code>, <code>lockAll</code> in index order), then a main that starts eight threads on one latch and prints the counter both ways.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; Mid-round: our keys are sequential ids, and every single one of them is landing in stripe 0. Fix it.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing in the map changes. How a hashCode becomes bits was already a rule handed in at construction, so this is one new class and one changed line. The bug is worth naming precisely, because it is the trap in this design: the stripe is chosen from the HIGH bits of the spread hash, and the classic spreader &mdash; <code>h ^ (h &gt;&gt;&gt; 16)</code>, which is exactly what <code>java.util.HashMap</code> uses &mdash; only folds the high bits down onto the low ones and leaves the high ones untouched. Sequential integers have all-zero high bits, so every key gets stripe 0. The fix is a multiply by the 32-bit golden ratio before the fold, which makes every output bit depend on every input bit. The evidence is a histogram, not an argument: with the fold-only spreader, 16 stripes hold 0..20,000 entries and 15 of them are empty; with the multiply, 1,248..1,252 each and none empty.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The default spreader: multiply by the 32-bit golden ratio so every input bit reaches every output bit, then fold\n * the top sixteen down with an xor. The multiply is the part that matters here. java.util.HashMap gets away with\n * the fold alone because it only ever uses the LOW bits; this map picks a stripe from the HIGH bits, and a fold\n * leaves those exactly as they were -- so with a fold-only spreader every sequential Integer key lands in stripe 0.\n */\nfinal class SpreadHasher implements Hasher {\n    /** Fibonacci mix, then fold: consecutive keys come out far apart in both the high bits and the low ones. */\n    public int spread(int hashCode) {\n        int h = hashCode * 0x9E3779B1;\n        return h ^ (h &gt;&gt;&gt; 16);\n    }\n}\n\n// ---- ext: the naive spreader, and the histogram that catches it in thirty seconds\n/**\n * What java.util.HashMap does: fold the high sixteen bits down onto the low ones. Perfectly good there, because\n * HashMap only ever uses the LOW bits. Here it is a trap: this map picks a stripe from the HIGH bits, and a fold\n * leaves those untouched, so every sequential Integer key keeps its all-zero top bits and lands in stripe 0.\n */\nfinal class FoldOnlyHasher implements Hasher {\n    /** No multiply, so no avalanche: bit 31 of the output is still bit 31 of the input. */\n    public int spread(int hashCode) { return hashCode ^ (hashCode &gt;&gt;&gt; 16); }\n}\n\n/** The histogram that turns &quot;I think the keys are spread&quot; into a number you can read in one line. */\nfinal class Histogram {\n    /** min..max entries per stripe, and how many stripes got nothing at all. */\n    static String of(int[] sizes) {\n        int min = Integer.MAX_VALUE, max = 0, empty = 0;\n        for (int s : sizes) { min = Math.min(min, s); max = Math.max(max, s); if (s == 0) empty++; }\n        return sizes.length + &quot; stripes hold &quot; + min + &quot;..&quot; + max + &quot; entries each, &quot; + empty + &quot; of them empty&quot;;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Eight threads, one counter key, fifty thousand increments each. Prove nothing is lost.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading a value and writing it back, and the fix is that the whole read-modify-write happens inside one hold of that key's stripe lock: that is what <code>merge</code> is, with the caller's function running <i>inside</i> the critical section. The proof is a number, not an argument. Eight threads released by one latch each call <code>merge(&quot;hits&quot;, 1, Integer::sum)</code> fifty thousand times, and the counter reads exactly 400,000. The same loop written as a <code>get</code> and then a <code>put</code> &mdash; two holds with a gap &mdash; lands on about 100,000, so three of every four increments are silently gone. Both versions are in <code>main</code>, which is the point: the race is demonstrated by running it, not asserted. The honest cost to volunteer in the same breath is that this is the one case striping cannot help, because every thread is on the same key and therefore the same lock.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 2. the race. A read-modify-write inside ONE lock hold loses nothing; the same thing split across a get\n        //    and a put loses most of it. Shown by running it, not by asserting it.\n        final int RT = 8, RI = 25_000, EXPECT = RT * RI;\n        StripedMap&lt;String, Integer&gt; safe = new StripedMap&lt;&gt;(16);\n        runAll(RT, id -&gt; { for (int i = 0; i &lt; RI; i++) safe.merge(&quot;hits&quot;, 1, Integer::sum); }, 20_000);\n        check(safe.get(&quot;hits&quot;) == EXPECT, &quot;merge: &quot; + RT + &quot; threads x &quot; + RI + &quot; increments = exactly &quot; + EXPECT);\n        StripedMap&lt;String, Integer&gt; racy = new StripedMap&lt;&gt;(16);\n        runAll(RT, id -&gt; {\n            for (int i = 0; i &lt; RI; i++) { Integer c = racy.get(&quot;hits&quot;); racy.put(&quot;hits&quot;, c == null ? 1 : c + 1); }\n        }, 20_000);\n        check(racy.get(&quot;hits&quot;) &lt; EXPECT, &quot;get-then-put: the same loop landed on &quot; + racy.get(&quot;hits&quot;)\n              + &quot; instead of &quot; + EXPECT + &quot; -- the gap between two lock holds, demonstrated&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock per stripe. Does that actually scale, and what is above it?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Measure first. Eight threads doing 1.6 million writes: one stripe takes 62 ms (38 ns a write), sixteen takes 25 ms, sixty-four takes 20 ms (12 ns) &mdash; about three times, for one constructor argument. Now run the same thing with 1.8 microseconds of real work inside the lock and the shape changes: 256 ms on one stripe against 51 ms on sixty-four, five times and still climbing. That is the rule in one sentence: striping buys you exactly as much as the time spent inside the lock. The ladder, cheapest first: more stripes; then get the slow thing out of the lock (a future per key rather than a loader inside the critical section); then no lock on the read path at all, which is what <code>ConcurrentHashMap</code> does. The code below is the rung deliberately left <i>off</i> the ladder, because it is the one everybody suggests: a read/write lock per stripe. On a 95 per cent read workload it measured 33 ms with plain locks, 75 ms with read/write locks and 12 ms with no read lock at all. The RW version is slower, and the reason is one sentence: taking a read lock is itself a compare-and-set on one shared counter, so ten readers of the same stripe still fight over the same cache line &mdash; they just do not block while they do it. It pays only when the critical section is long enough that the exclusion itself was the cost, and fifteen nanoseconds is not that.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the rung that is NOT on the ladder -- a read/write lock per stripe, and why it disappoints\n/**\n * The obvious next move when somebody says &quot;our workload is 95% reads&quot;: swap each stripe&#x27;s ReentrantLock for a\n * ReentrantReadWriteLock, so many readers share a stripe and only a writer excludes everybody. Measured on this\n * machine it is consistently about TWICE AS SLOW as the plain lock (33 ms against 75 ms on the run below), and that\n * is the point worth remembering: a read lock is not free. Taking one is still a compare-and-set on a single shared\n * counter, so every reader in a stripe still writes to the same cache line and readers still fight each other --\n * they just do not block while they do it. An RW lock pays only when the critical section is long enough that the\n * exclusion itself was the cost, and here it is fifteen nanoseconds. When reads really dominate, the shape that wins\n * is the next block: stop locking on reads at all.\n */\nfinal class RwStripedMap&lt;K, V&gt; {\n    /** One stripe: a plain HashMap guarded by its own read/write lock. The JDK&#x27;s HashMap is fine once it is guarded. */\n    private static final class RwStripe&lt;K, V&gt; {\n        final ReentrantReadWriteLock lock = new ReentrantReadWriteLock();\n        final Map&lt;K, V&gt; data = new HashMap&lt;&gt;();\n        volatile int count;\n    }\n\n    private final RwStripe&lt;K, V&gt;[] stripes;\n    private final int mask, shift;\n    private final Hasher hasher;\n\n    /** Stripes rounded up to a power of two, with the spreader handed in exactly as the main map does it. */\n    @SuppressWarnings(&quot;unchecked&quot;)\n    RwStripedMap(int stripes, Hasher hasher) {\n        int n = StripedMap.tableSizeFor(stripes);\n        this.mask = n - 1;\n        this.shift = 32 - Integer.numberOfTrailingZeros(n);\n        this.hasher = hasher;\n        this.stripes = (RwStripe&lt;K, V&gt;[]) new RwStripe[n];\n        for (int i = 0; i &lt; n; i++) this.stripes[i] = new RwStripe&lt;&gt;();\n    }\n\n    private RwStripe&lt;K, V&gt; stripeFor(K key) {\n        int h = hasher.spread(key.hashCode());\n        return stripes[(h &gt;&gt;&gt; shift) &amp; mask];\n    }\n\n    /** Readers share: ten threads can be inside the same stripe at the same instant. */\n    V get(K key) {\n        RwStripe&lt;K, V&gt; s = stripeFor(key);\n        s.lock.readLock().lock();\n        try { return s.data.get(key); } finally { s.lock.readLock().unlock(); }\n    }\n\n    /** Writers exclude: the write lock waits for every reader in this stripe to leave. */\n    V put(K key, V value) {\n        RwStripe&lt;K, V&gt; s = stripeFor(key);\n        s.lock.writeLock().lock();\n        try { V old = s.data.put(key, value); s.count = s.data.size(); return old; }\n        finally { s.lock.writeLock().unlock(); }\n    }\n\n    /** The read-modify-write, under the write lock, exactly as before: one hold, no lost update. */\n    V merge(K key, V value, BinaryOperator&lt;V&gt; remap) {\n        RwStripe&lt;K, V&gt; s = stripeFor(key);\n        s.lock.writeLock().lock();\n        try {\n            V old = s.data.get(key);\n            V now = old == null ? value : remap.apply(old, value);\n            s.data.put(key, now);\n            s.count = s.data.size();\n            return now;\n        } finally { s.lock.writeLock().unlock(); }\n    }\n\n    /** Weakly consistent, as before: a sum of volatile counters, no lock. */\n    int size() { int n = 0; for (RwStripe&lt;K, V&gt; s : stripes) n += s.count; return n; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; The function I pass to merge throws halfway through. What is the state of the map?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was. The order inside the critical section is what guarantees it: the chain is walked, the caller's function is applied, and only when it <i>returns</i> is anything written &mdash; the value field for an existing key, or a brand-new node linked and published for an absent one. A function that throws propagates out through the <code>finally</code> that releases the lock, so the lock is never left held either, and the caller can retry. The same reasoning covers a <code>hashCode</code> or <code>equals</code> that throws while the chain is being walked. The one ordering rule underneath all of it is the general one: never commit anything before the step that can fail has succeeded. The test asserts both halves &mdash; the exception comes out, and the value and the count are unchanged.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The read-modify-write that the whole design exists for. The caller&#x27;s remap function runs INSIDE the one lock\n     * hold, between the read and the write, so no other thread can slip an update in between and have it overwritten.\n     * If remap throws, nothing has been written yet and the map is exactly as it was.\n     */\n    V merge(K key, int hash, V value, BinaryOperator&lt;V&gt; remap) {\n        acquire();\n        try {\n            Entry&lt;K, V&gt; e = findLocked(key, hash);\n            if (e == null) { putLocked(key, hash, value); return value; }\n            V merged = remap.apply(e.value, value);\n            if (merged == null) { removeLocked(key, hash); return null; }\n            e.value = merged;\n            return merged;\n        } finally { lock.unlock(); }\n    }\n\n        boolean threw = false;\n        try { one.merge(&quot;k&quot;, 1, (a, b) -&gt; { throw new IllegalStateException(&quot;boom&quot;); }); }\n        catch (IllegalStateException e) { threw = true; }\n        check(threw &amp;&amp; one.get(&quot;k&quot;).equals(last) &amp;&amp; one.size() == 1,\n              &quot;a remap function that throws left the value and the count exactly as they were&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>5 &middot; size() while fifty threads are writing: exact or approximate? And how do I iterate?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two different questions, so two different methods, and saying that out loud is most of the answer. <code>size()</code> sums sixteen volatile counters with no lock at all: it is O(number of stripes), it costs nothing, and it is <i>weakly consistent</i> &mdash; a write can land between two of the reads. That is right for monitoring and wrong for an assertion. <code>exactSize(budgetMs)</code> takes every stripe lock in index order, sums, and releases in reverse; it is exact and it fights the whole map, so it carries a budget and returns -1 rather than blocking forever. Iteration is the same trade: <code>StripeIterator</code> copies one stripe at a time under that one lock, so it reflects writes that land while it runs and can never throw <code>ConcurrentModificationException</code>, while <code>snapshot(budgetMs)</code> takes every lock and gives you a frozen moment. The ordering &mdash; stripe 0, 1, 2, always &mdash; is what makes the all-lock path deadlock-free.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The exact count, taken with every stripe lock held so no write can slip between two of the counters. Returns\n     * -1 when the budget ran out: an exact size fights the whole map, and a monitoring call must never be the thing\n     * that stops it. The order is stripe 0, 1, 2 ... always, which is what makes a deadlock impossible.\n     */\n    int exactSize(long budgetMs) {\n        if (!lockAll(budgetMs)) return -1;\n        try {\n            int n = 0;\n            for (Segment&lt;K, V&gt; s : segments) n += s.size();\n            return n;\n        } finally { unlockAll(segments.length); }\n    }\n\n    /** A frozen copy of the whole map, taken with every lock held. Null when the budget ran out. O(n): say so out loud. */\n    Map&lt;K, V&gt; snapshot(long budgetMs) {\n        if (!lockAll(budgetMs)) return null;\n        try {\n            Map&lt;K, V&gt; out = new LinkedHashMap&lt;&gt;();\n            for (Segment&lt;K, V&gt; s : segments) s.copyInto(out);\n            return out;\n        } finally { unlockAll(segments.length); }\n    }\n\n// ---- ext: iteration that never copies the whole map -- one stripe at a time, lazily\n/**\n * A weakly-consistent iterator: it copies ONE stripe under that stripe&#x27;s lock, hands those entries out, then moves\n * to the next. It therefore reflects writes that land while it is running, never freezes the map, and can never\n * throw ConcurrentModificationException, because it is walking a copy and not live state. Say &quot;weakly consistent&quot;\n * out loud -- it is the word that tells an interviewer you know this is not a snapshot.\n */\nfinal class StripeIterator&lt;K, V&gt; implements Iterator&lt;Map.Entry&lt;K, V&gt;&gt; {\n    private final StripedMap&lt;K, V&gt; map;\n    private int stripe = -1;\n    private Iterator&lt;Map.Entry&lt;K, V&gt;&gt; current = Collections.emptyIterator();\n\n    /** Start before the first stripe; nothing is copied until the first hasNext(). */\n    StripeIterator(StripedMap&lt;K, V&gt; map) { this.map = map; }\n\n    /** Advance stripe by stripe until one of them has an entry, or there are no stripes left. */\n    public boolean hasNext() {\n        while (!current.hasNext() &amp;&amp; stripe + 1 &lt; map.stripeCount())\n            current = map.stripeSnapshot(++stripe).entrySet().iterator();\n        return current.hasNext();\n    }\n\n    public Map.Entry&lt;K, V&gt; next() {\n        if (!hasNext()) throw new NoSuchElementException();\n        return current.next();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>6 &middot; Move a value from one key to another, atomically, when the two keys are in different stripes.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two stripes means two locks, and that is where the deadlock lives: one thread moving A to B holds stripe 4 and wants stripe 10, while another moving B to A holds 10 and wants 4, and both sit there forever. The fix is one line of policy, and it is the thing to say before you write any code: always acquire in a fixed global order &mdash; here, the lower stripe index first &mdash; and release in reverse. Two threads then ask for the same lock first, so one of them simply waits. The demonstration is safe rather than theoretical: the unordered version is run with <code>tryLock</code> and a 20 ms deadline, so each would-be deadlock shows up as a counted back-off (about 1,700 of them in 2,000 rounds) instead of a hung build, while the ordered version records zero. The test then moves a value back and forth twenty thousand times from both directions and checks that exactly one key holds it at the end.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Move a value from one key to another as ONE atomic step, even when the two keys live in different stripes.\n     * The ORDER is the whole answer: always take the lower stripe index first. Two threads moving in opposite\n     * directions then ask for the same lock first, so one of them waits instead of both holding half of what the\n     * other needs. Taking them &quot;naturally&quot; -- source first, destination second -- deadlocks within seconds.\n     */\n    boolean moveValue(K from, K to) {\n        int hf = hashOf(from), ht = hashOf(to);\n        int i = stripeIndex(hf), j = stripeIndex(ht);\n        int first = Math.min(i, j), second = Math.max(i, j);\n        segments[first].lock.lock();\n        if (second != first) segments[second].lock.lock();\n        try {\n            V v = segments[i].getLocked(from, hf);\n            if (v == null) return false;\n            segments[i].removeLocked(from, hf);\n            segments[j].putLocked(to, ht, v);\n            return true;\n        } finally {\n            if (second != first) segments[second].lock.unlock();\n            segments[first].lock.unlock();\n        }\n    }\n\n// ---- ext: two stripes at once, and the deadlock you get for free when you do not order them\n/**\n * Two threads, two locks, opposite directions. Ordered acquisition -- always the lower index first -- cannot\n * deadlock, so it runs to completion. The &quot;natural&quot; order -- source first, destination second -- can, and does.\n * The demo proves it with tryLock and a deadline, so the evidence is a count of back-offs and never a hung build.\n */\nfinal class LockOrdering {\n    /** Run N rounds of two threads taking two locks in opposite orders. Returns how often a thread had to back off. */\n    static int race(boolean ordered, int rounds) throws InterruptedException {\n        ReentrantLock a = new ReentrantLock(), b = new ReentrantLock();\n        AtomicInteger backoffs = new AtomicInteger();\n        CountDownLatch go = new CountDownLatch(1);\n        Thread t1 = new Thread(job(a, b, rounds, backoffs, go), &quot;left&quot;);\n        Thread t2 = new Thread(ordered ? job(a, b, rounds, backoffs, go)     // both ask for `a` first: no cycle\n                                       : job(b, a, rounds, backoffs, go),    // opposite orders: the cycle is back\n                               &quot;right&quot;);\n        t1.start(); t2.start();\n        go.countDown();\n        t1.join(20_000); t2.join(20_000);\n        return backoffs.get();\n    }\n\n    /** Take `first`, then try for `second` with a deadline. Failing to get the second one IS the deadlock, survived. */\n    private static Runnable job(ReentrantLock first, ReentrantLock second, int rounds, AtomicInteger backoffs, CountDownLatch go) {\n        return () -&gt; {\n            try { go.await(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }\n            for (int i = 0; i &lt; rounds; i++) {\n                first.lock();\n                try {\n                    if (!second.tryLock(20, TimeUnit.MILLISECONDS)) { backoffs.incrementAndGet(); continue; }\n                    try { Thread.onSpinWait(); } finally { second.unlock(); }\n                } catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }\n                finally { first.unlock(); }\n            }\n        };\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>7 &middot; Fifty threads miss the same key at once and the loader is a 200 ms database call. Call it once \u2014 without holding the stripe.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p><code>computeIfAbsent</code> as written runs the loader inside the stripe lock, which is exactly what makes it exactly-once: the second caller blocks and finds the entry already there when it gets in. The test proves it &mdash; 32 threads, one loader call. The cost is equally real: a 200 ms load holds up every other key in that stripe for 200 ms. The fix is to store a promise instead of a value. The first caller wins a <code>putIfAbsent</code> of an empty <code>CompletableFuture</code>, which is one very short lock hold, and then does the slow work holding nothing at all; the losers get the winner's future back and wait on that. A loader that throws removes the slot so the next caller retries rather than caching a failure forever. Measured: 32 threads, the loader ran once, total wall time 210 ms rather than 32 x 200 ms.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: load once per key WITHOUT holding the stripe while the loader runs -- one future per key\n/**\n * computeIfAbsent runs the loader inside the stripe lock, which is what makes it exactly-once but also means a\n * four-hundred-millisecond database call holds up every other key in that stripe. The fix is to put a promise in\n * the map instead of a value: the first caller wins a putIfAbsent -- one short lock hold -- and then does the slow\n * work holding nothing, while the losers wait on its future. A loader that throws removes the slot so the next\n * caller retries, rather than caching a failure forever.\n */\nfinal class FutureLoader&lt;K, V&gt; {\n    private final StripedMap&lt;K, CompletableFuture&lt;V&gt;&gt; slots;\n    private final LongAdder loaderCalls = new LongAdder();\n\n    /** As many stripes as the map it fronts. The slot map holds promises, not values. */\n    FutureLoader(int stripes) { this.slots = new StripedMap&lt;&gt;(stripes); }\n\n    /** Get, loading at most once per key, with the load running outside every lock. */\n    V get(K key, Function&lt;K, V&gt; loader) {\n        CompletableFuture&lt;V&gt; mine = new CompletableFuture&lt;&gt;();\n        CompletableFuture&lt;V&gt; winner = slots.putIfAbsent(key, mine);\n        if (winner != null) return winner.join();           // a loser: waits holding no lock at all\n        try {\n            loaderCalls.increment();\n            V v = loader.apply(key);                        // the slow part, with nothing held\n            mine.complete(v);\n            return v;\n        } catch (RuntimeException e) {\n            slots.remove(key);                              // do not cache a failure: the next caller retries\n            mine.completeExceptionally(e);\n            throw e;\n        }\n    }\n\n    /** How many times the loader actually ran. The number the test asserts. */\n    long loaderCalls() { return loaderCalls.sum(); }\n}\n\n        // 3. computeIfAbsent: the loader runs at most once per key, however many threads miss it at once.\n        StripedMap&lt;String, String&gt; loaded = new StripedMap&lt;&gt;(16);\n        AtomicInteger calls = new AtomicInteger();\n        boolean allGot = runAll(32, id -&gt; {\n            String v = loaded.computeIfAbsent(&quot;hot&quot;, k -&gt; { calls.incrementAndGet(); return &quot;value-&quot; + k; });\n            if (!&quot;value-hot&quot;.equals(v)) throw new AssertionError(&quot;a caller got &quot; + v);\n        }, 10_000);\n        check(allGot &amp;&amp; calls.get() == 1, &quot;32 threads missed the same key: the loader ran &quot; + calls.get() + &quot; time(s)&quot;);\n        AtomicInteger perKey = new AtomicInteger();\n        runAll(32, id -&gt; { for (int i = 0; i &lt; 100; i++) loaded.computeIfAbsent(&quot;k&quot; + i, k -&gt; { perKey.incrementAndGet(); return k; }); }, 10_000);\n        check(perKey.get() == 100, &quot;100 distinct keys missed by 32 threads each: the loader ran &quot; + perKey.get() + &quot; times, one per key&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Now get(key) has to BLOCK until somebody puts it \u2014 up to 200 ms. Write it.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>This is the one place a map needs a thread to <i>wait</i> rather than just take its turn, and it is where multi-threading rounds are actually won or lost. The stripe grows one <code>Condition</code>, which is a queue of threads parked on that stripe, and four rules come with it. <b>One: check under the lock.</b> Look for the key while holding the stripe, never before taking it \u2014 check outside and the value can arrive in the gap between your look and your <code>await</code>, taking the announcement with it, and you then sleep waiting for something that has already happened. That is a <b>lost wakeup</b>, and it is a hang, not a slowdown. <b>Two: wait in a <code>while</code> loop, never an <code>if</code>.</b> <code>await</code> is allowed to return with nobody having signalled at all \u2014 a <b>spurious wakeup</b> \u2014 and even after a real signal another waiter may have taken the value first, so the loop re-checks the thing you actually care about. <b>Three: signal after the change and before the unlock.</b> <code>signalAll</code> only moves threads from the condition queue to the lock queue, so it is two pointer moves and Java requires the lock to be held for it \u2014 note the contrast with the observer in <code>StripedMap</code>, which is somebody else's code and must be called <i>after</i> the unlock. <b>Four: carry a deadline, not a fresh timeout.</b> <code>awaitNanos</code> returns how much of the budget is left, and feeding that back into the loop is what stops a thread waiting forever in a series of short naps. The door is <code>lockInterruptibly</code>, so a cancelled request is not stuck waiting for permission to start waiting. The tests hold it to both halves: eight threads park, one <code>signalAll</code> after the write wakes all eight, and a wait for a key that never arrives returns <code>null</code> after about 200 ms rather than never.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: waiting for a key to appear -- the wait protocol, in a loop, with a deadline\n/**\n * The one place a map like this needs a thread to WAIT rather than just take its turn: &quot;give me the value under\n * this key, and if it is not there yet, wait for it.&quot; A stripe grows one Condition -- a queue of threads parked\n * on that stripe -- and four rules come with it. Every one of them is a bug if you skip it.\n *\n * 1. CHECK UNDER THE LOCK. Look for the key while holding the stripe, not before taking it. Check outside and the\n *    value can arrive in the gap between your look and your await, taking the signal with it: you then wait for an\n *    announcement that has already been made. That is a LOST WAKEUP, and it is a hang, not a slowdown.\n * 2. WAIT IN A WHILE LOOP, never an if. await() is allowed to return with nobody having signalled at all -- a\n *    SPURIOUS WAKEUP -- and even after a real signal another waiter may have taken the value first. The loop\n *    re-checks the thing you actually care about, so neither case can fool you.\n * 3. SIGNAL AFTER THE CHANGE, STILL HOLDING THE LOCK. signalAll() only moves threads from the condition queue to\n *    the lock queue, so it is cheap and Java requires the lock to be held for it. Note the contrast with the\n *    observer in StripedMap: a listener is arbitrary user code and must be called AFTER the unlock; a signal is\n *    two pointer moves and must be called BEFORE it.\n * 4. CARRY A DEADLINE, NOT A FRESH TIMEOUT. awaitNanos returns how much of the budget is LEFT; feeding that back\n *    into the loop is what stops a thread waiting forever in a series of short naps.\n *\n * And lockInterruptibly at the door, so a cancelled request is not stuck waiting for permission to start waiting.\n */\nfinal class WaitableMap&lt;K, V&gt; {\n    /** One stripe: its lock, the queue of threads waiting on it, and the entries. */\n    private static final class Cell&lt;K, V&gt; {\n        final ReentrantLock lock = new ReentrantLock();\n        final Condition changed = lock.newCondition();\n        final Map&lt;K, V&gt; data = new HashMap&lt;&gt;();\n    }\n\n    private final Cell&lt;K, V&gt;[] cells;\n    private final int mask, shift;\n    private final Hasher hasher;\n\n    /** The same routing as every other map here: a power-of-two stripe count, chosen by the high bits. */\n    @SuppressWarnings(&quot;unchecked&quot;)\n    WaitableMap(int stripeCount, Hasher hasher) {\n        int n = StripedMap.tableSizeFor(stripeCount);\n        this.mask = n - 1;\n        this.shift = 32 - Integer.numberOfTrailingZeros(n);\n        this.hasher = hasher;\n        this.cells = (Cell&lt;K, V&gt;[]) new Cell[n];\n        for (int i = 0; i &lt; n; i++) this.cells[i] = new Cell&lt;&gt;();\n    }\n\n    private Cell&lt;K, V&gt; cellFor(K key) { int h = hasher.spread(key.hashCode()); return cells[(h &gt;&gt;&gt; shift) &amp; mask]; }\n\n    /** Store, then wake everybody parked on this stripe -- inside the lock, after the change. Rule 3. */\n    V put(K key, V value) {\n        Cell&lt;K, V&gt; c = cellFor(key);\n        c.lock.lock();\n        try {\n            V old = c.data.put(key, value);\n            c.changed.signalAll();                      // cheap: it only re-queues threads, it does not run them\n            return old;\n        } finally { c.lock.unlock(); }\n    }\n\n    /** The value right now, or null. No waiting. */\n    V get(K key) {\n        Cell&lt;K, V&gt; c = cellFor(key);\n        c.lock.lock();\n        try { return c.data.get(key); } finally { c.lock.unlock(); }\n    }\n\n    /**\n     * The value under this key, waiting up to timeoutMs for it to appear. Returns null when the budget ran out.\n     * Throws InterruptedException the moment the caller is cancelled, whether it is queued for the lock or parked\n     * on the condition. All four rules above are visible in these eight lines.\n     */\n    V awaitValue(K key, long timeoutMs) throws InterruptedException {\n        Cell&lt;K, V&gt; c = cellFor(key);\n        c.lock.lockInterruptibly();                     // cancellable even before the wait starts\n        try {\n            long left = TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n            V v;\n            while ((v = c.data.get(key)) == null) {     // rule 1 + rule 2: checked under the lock, in a loop\n                if (left &lt;= 0L) return null;            // the budget is spent: say so, do not wait on\n                left = c.changed.awaitNanos(left);      // rule 4: awaitNanos hands back what remains\n            }\n            return v;\n        } finally { c.lock.unlock(); }\n    }\n\n    /** How many threads are parked on this key&#x27;s stripe right now. Only ever an estimate; used by the demo. */\n    int waitersOn(K key) {\n        Cell&lt;K, V&gt; c = cellFor(key);\n        c.lock.lock();\n        try { return c.lock.getWaitQueueLength(c.changed); } finally { c.lock.unlock(); }\n    }\n}\n\n        // 11. the wait protocol. Eight threads ask for a key that does not exist, one thread supplies it, and a\n        //     single signalAll wakes every one of them -- because each re-checks in a loop rather than assuming.\n        WaitableMap&lt;String, String&gt; waitMap = new WaitableMap&lt;&gt;(16, new SpreadHasher());\n        AtomicInteger woke = new AtomicInteger(), quit = new AtomicInteger();\n        CountDownLatch asked = new CountDownLatch(8);\n        List&lt;Thread&gt; waiters = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 8; i++) waiters.add(new Thread(() -&gt; {\n            asked.countDown();\n            try { if (waitMap.awaitValue(&quot;late&quot;, 5_000) != null) woke.incrementAndGet(); else quit.incrementAndGet(); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        }, &quot;waiter&quot;));\n        waiters.forEach(Thread::start);\n        asked.await(3, TimeUnit.SECONDS);\n        Thread.sleep(100);\n        int parked = waitMap.waitersOn(&quot;late&quot;);\n        waitMap.put(&quot;late&quot;, &quot;here&quot;);\n        boolean allWoke = true;\n        for (Thread t : waiters) { t.join(6_000); allWoke &amp;= !t.isAlive(); }\n        check(parked == 8 &amp;&amp; allWoke &amp;&amp; woke.get() == 8 &amp;&amp; quit.get() == 0,\n              &quot;8 threads parked on one condition; one signalAll after the write woke all &quot; + woke.get() + &quot; of them&quot;);\n\n        // 12. and the same wait with a budget, on a key that never arrives: it gives up, on time, instead of\n        //     hanging -- because awaitNanos hands back what is LEFT and the loop cannot restart the clock.\n        long waitT0 = System.nanoTime();\n        String never = waitMap.awaitValue(&quot;never-arrives&quot;, 200);\n        long waitMs = (System.nanoTime() - waitT0) / 1_000_000;\n        check(never == null &amp;&amp; waitMs &gt;= 150 &amp;&amp; waitMs &lt; 1_500,\n              &quot;a wait for a key that never arrives returned null after &quot; + waitMs + &quot; ms, not never&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>9 &middot; A thread is blocked on a stripe somebody else is holding. Can I cancel it? Can it starve?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two separate questions, and both have a one-line answer plus a number. <b>Cancel:</b> not if you wrote <code>lock()</code>. <code>ReentrantLock.lock()</code> is uninterruptible \u2014 interrupting a thread parked inside it only sets a flag the thread notices much later, once it has the lock anyway, which the test shows directly. <code>lockInterruptibly()</code> and <code>tryLock(timeout)</code> both give up on demand, and the price is that every method built on them must be allowed to fail. That is exactly the split in Main.java: plain <code>lock()</code> on the single-key path, where the wait is nanoseconds and failing would be absurd, and <code>tryLock</code> with a deadline on the all-stripe path, where the wait is unbounded. <b>Starve:</b> <code>new ReentrantLock()</code> is <i>unfair</i> \u2014 a thread arriving at a just-released lock may barge in front of threads already queued, and that barging is most of why it is fast. <code>new ReentrantLock(true)</code> hands the lock out in strict arrival order and pays a context switch per handover. Measured here on four threads hammering one lock for 250 ms: barging did about 30 million acquisitions with the unluckiest thread on 6.9 million and the luckiest on 9.0 million; fair did about 134,000, and every thread got within a whisker of 33,500 \u2014 dead even, and two hundred times less total work done. So: on a stripe held for fifteen nanoseconds nothing starves in practice, and you keep the default. What <i>can</i> starve is an operation that needs every stripe at once, which is precisely why <code>exactSize</code> carries a budget and returns -1 instead of promising an answer.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a thread stuck on a busy stripe -- cancelling it, and whether the lock is fair\n/**\n * Two questions about the thread that lost the race for a stripe.\n *\n * CAN YOU CANCEL IT? Not if you wrote lock(). ReentrantLock.lock() is uninterruptible: interrupting a thread\n * parked in it only sets a flag that the thread will notice long afterwards, once it has the lock anyway.\n * lockInterruptibly() and tryLock(timeout) both give up on demand, and the price is that every method built on\n * them must be allowed to fail. That is exactly the split in Main.java: plain lock() on the single-key path,\n * where the wait is nanoseconds and failure would be absurd, and tryLock with a deadline on the all-stripe path,\n * where the wait is unbounded and giving up is the right answer.\n *\n * CAN IT STARVE? new ReentrantLock() is UNFAIR: a thread arriving at an unlocked-but-queued lock may barge in\n * front of threads that have been waiting, and that barging is most of why it is fast. new ReentrantLock(true)\n * hands the lock out strictly in arrival order and costs a context switch per handover -- measured below, it is\n * an order of magnitude slower. On a stripe held for fifteen nanoseconds nothing starves in practice. What CAN\n * starve is an operation that needs every stripe at once, which is precisely why exactSize carries a budget and\n * returns -1 rather than promising an answer.\n */\nfinal class LockWaiting {\n    /** What one run measured: total acquisitions, and the fewest and the most any single thread got. */\n    static final class Turns {\n        final long total; final long min; final long max;\n        Turns(long total, long min, long max) { this.total = total; this.min = min; this.max = max; }\n        public String toString() { return total + &quot; acquisitions, the unluckiest thread got &quot; + min + &quot; and the luckiest &quot; + max; }\n    }\n\n    /**\n     * N threads hammering ONE lock for a fixed wall-clock window. A barging lock does far more total work; a fair\n     * lock spreads the work evenly. Both numbers matter, and you rarely get both.\n     */\n    static Turns hammer(boolean fair, int threads, long windowMs) throws InterruptedException {\n        ReentrantLock lock = new ReentrantLock(fair);\n        long[] counts = new long[threads];\n        CountDownLatch go = new CountDownLatch(1);\n        AtomicBoolean stop = new AtomicBoolean();\n        List&lt;Thread&gt; ts = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; threads; i++) {\n            final int id = i;\n            ts.add(new Thread(() -&gt; {\n                try { go.await(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }\n                while (!stop.get()) {\n                    lock.lock();\n                    try { counts[id]++; } finally { lock.unlock(); }\n                }\n            }, &quot;hammer-&quot; + i));\n        }\n        ts.forEach(Thread::start);\n        go.countDown();\n        Thread.sleep(windowMs);\n        stop.set(true);\n        for (Thread t : ts) t.join(10_000);\n        long total = 0, min = Long.MAX_VALUE, max = 0;\n        for (long c : counts) { total += c; min = Math.min(min, c); max = Math.max(max, c); }\n        return new Turns(total, min, max);\n    }\n\n    /**\n     * Park a thread on a lock somebody else holds, interrupt it, and report whether it came back. With\n     * lockInterruptibly it returns immediately; with plain lock() it cannot, and only finishes when the holder\n     * lets go -- with its interrupt flag still set, which is the whole of what the interrupt achieved.\n     */\n    static String cancelWhileBlocked(boolean interruptibly) throws Exception {\n        ReentrantLock lock = new ReentrantLock();\n        CountDownLatch parked = new CountDownLatch(1), finished = new CountDownLatch(1);\n        AtomicBoolean threw = new AtomicBoolean(), flagStillSet = new AtomicBoolean();\n        lock.lock();                                     // the holder: this thread\n        Thread waiter = new Thread(() -&gt; {\n            parked.countDown();\n            try {\n                if (interruptibly) lock.lockInterruptibly(); else lock.lock();\n                try { flagStillSet.set(Thread.currentThread().isInterrupted()); } finally { lock.unlock(); }\n            } catch (InterruptedException e) { threw.set(true); }\n            finished.countDown();\n        }, &quot;waiter&quot;);\n        waiter.start();\n        parked.await(2, TimeUnit.SECONDS);\n        Thread.sleep(60);                                // let it actually reach the lock and block there\n        waiter.interrupt();\n        boolean cameBackWhileHeld = finished.await(400, TimeUnit.MILLISECONDS);\n        lock.unlock();                                   // now let it in\n        boolean done = finished.await(3, TimeUnit.SECONDS);\n        waiter.join(3_000);\n        if (!done) return &quot;STUCK&quot;;\n        if (cameBackWhileHeld &amp;&amp; threw.get()) return &quot;cancelled while the lock was still held&quot;;\n        if (!cameBackWhileHeld &amp;&amp; flagStillSet.get()) return &quot;waited for the holder, then finished with the interrupt flag still set&quot;;\n        return &quot;finished, but not in either expected way&quot;;\n    }\n}\n\n        // 13. cancelling a thread that is blocked on a lock somebody else holds. lock() cannot be interrupted;\n        //     lockInterruptibly() can. Both finish here -- the point is WHEN, and that neither one is stuck.\n        String canCancel = LockWaiting.cancelWhileBlocked(true);\n        String cannot = LockWaiting.cancelWhileBlocked(false);\n        check(canCancel.startsWith(&quot;cancelled&quot;), &quot;lockInterruptibly(): &quot; + canCancel);\n        check(cannot.startsWith(&quot;waited for the holder&quot;), &quot;plain lock() ignores the interrupt: &quot; + cannot);\n\n        // 14. fairness. The default lock lets an arriving thread barge past the queue, which is most of why it is\n        //     fast; a fair lock hands turns out in arrival order and pays a context switch for each one.\n        LockWaiting.Turns unfair = LockWaiting.hammer(false, 4, 200);\n        LockWaiting.Turns fairTurns = LockWaiting.hammer(true, 4, 200);\n        check(unfair.total &gt; fairTurns.total * 5,\n              &quot;the default (barging) lock did &quot; + unfair.total + &quot; acquisitions where the fair one did &quot;\n              + fairTurns.total + &quot;: fairness is not free&quot;);\n        check(fairTurns.min &gt; 0 &amp;&amp; fairTurns.max &lt;= fairTurns.min * 2 &amp;&amp; unfair.min &gt; 0,\n              &quot;under the fair lock every thread got a turn and the spread was &quot; + fairTurns.min + &quot;..&quot; + fairTurns.max\n              + &quot;; under the barging lock it was &quot; + unfair.min + &quot;..&quot; + unfair.max);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Bound it: at most ten thousand entries, evicting the least recently used.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Per stripe, and the eviction runs inside the same write hold that caused it, so the bound is never exceeded even for an instant. You do not write the recency list yourself: a <code>LinkedHashMap</code> constructed in access order with <code>removeEldestEntry</code> overridden is the whole mechanism, and it is called by the map after the insert while your lock is still held. One caveat to volunteer before they raise it: the bound is per stripe, total divided by N each, so a skewed key set evicts one stripe early while others sit half empty. A truly global bound needs one shared counter, which is precisely the contention the whole design exists to remove &mdash; so the usual answer in real systems is per-shard bounds plus a little slack, and the named implementation to reach for is Caffeine.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: bound the map -- a per-stripe LRU that evicts inside the write, so the bound is real\n/**\n * &quot;At most ten thousand entries, evict the least recently used.&quot; Per stripe, a LinkedHashMap in access order with\n * removeEldestEntry does the whole job -- you never write the linked list yourself -- and the eviction happens\n * inside the same write that caused it, so the bound is never exceeded even for an instant. The caveat to say out\n * loud before they say it: the bound is per stripe (total / N each), so a skewed key set evicts one stripe early\n * while others sit half empty. A global bound would need one shared counter, which is the contention you just spent\n * the whole design removing.\n */\nfinal class CappedMap&lt;K, V&gt; {\n    /** One stripe: an access-ordered LinkedHashMap that drops its eldest entry when it is over its share. */\n    private static final class Shard&lt;K, V&gt; extends LinkedHashMap&lt;K, V&gt; {\n        private final int max;\n        Shard(int max) { super(16, 0.75f, true); this.max = max; }\n        /** Called by LinkedHashMap after each insert, still inside our lock: true means &quot;drop this one&quot;. */\n        protected boolean removeEldestEntry(Map.Entry&lt;K, V&gt; eldest) { return size() &gt; max; }\n    }\n\n    private final Object[] locks;\n    private final Shard&lt;K, V&gt;[] shards;\n    private final int mask, shift;\n    private final Hasher hasher;\n    private final LongAdder evictions = new LongAdder();\n\n    /** Total capacity is split evenly across the stripes; at least one entry per stripe. */\n    @SuppressWarnings(&quot;unchecked&quot;)\n    CappedMap(int stripes, int totalCapacity, Hasher hasher) {\n        int n = StripedMap.tableSizeFor(stripes);\n        this.mask = n - 1;\n        this.shift = 32 - Integer.numberOfTrailingZeros(n);\n        this.hasher = hasher;\n        this.locks = new Object[n];\n        this.shards = (Shard&lt;K, V&gt;[]) new Shard[n];\n        for (int i = 0; i &lt; n; i++) { locks[i] = new Object(); shards[i] = new Shard&lt;&gt;(Math.max(1, totalCapacity / n)); }\n    }\n\n    private int indexOf(K key) { int h = hasher.spread(key.hashCode()); return (h &gt;&gt;&gt; shift) &amp; mask; }\n\n    /** A get is a write here: access order means reading an entry moves it to the young end. */\n    V get(K key) {\n        int i = indexOf(key);\n        synchronized (locks[i]) { return shards[i].get(key); }\n    }\n\n    /** Insert, and evict the eldest in the same hold if this stripe is now over its share. */\n    V put(K key, V value) {\n        int i = indexOf(key);\n        synchronized (locks[i]) {\n            int before = shards[i].size();\n            V old = shards[i].put(key, value);\n            if (shards[i].size() == before &amp;&amp; old == null) evictions.increment();\n            return old;\n        }\n    }\n\n    /** Entries held across every stripe. */\n    int size() { int n = 0; for (int i = 0; i &lt; shards.length; i++) synchronized (locks[i]) { n += shards[i].size(); } return n; }\n\n    /** How many entries the bound has thrown away. */\n    long evictions() { return evictions.sum(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>11 &middot; Add metrics \u2014 hit rate, write rate \u2014 without touching StripedMap.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A decorator, because both sides already depend on the <code>KeyValueStore</code> interface rather than on the class. <code>MeteredMap</code> implements that interface and holds one: every method delegates, and <code>get</code> additionally counts a hit or a miss on the way back. The map never learns it is being measured, and the same wrapper works unchanged over a <code>ConcurrentHashMap</code> adapter if the engine is swapped later. The counters are <code>LongAdder</code> rather than <code>AtomicLong</code>, which is worth a sentence because it is the same idea as the whole page: an adder keeps one cell per contending thread and sums them on read, so writers stop fighting over a single cache line. If the requirement is per-write notification rather than counting &mdash; an audit line, a cache invalidation &mdash; that is the observer instead, and the rule there is that it is called after the unlock inside a try/catch.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: measure without touching the map -- a Decorator over the interface both sides already depend on\n/**\n * Counts hits, misses and writes around ANY KeyValueStore, because it implements the same interface and holds\n * one. The map never learns it is being measured, and swapping the map underneath for a ConcurrentHashMap adapter\n * changes nothing here. Counters are LongAdders: under contention they beat a synchronized long by an order of\n * magnitude, because each thread adds into its own cell.\n */\nfinal class MeteredMap&lt;K, V&gt; implements KeyValueStore&lt;K, V&gt; {\n    private final KeyValueStore&lt;K, V&gt; inner;\n    private final LongAdder hits = new LongAdder(), misses = new LongAdder(), writes = new LongAdder();\n\n    /** Wrap a store. The wrapper is the only thing the caller sees; the store does not know it exists. */\n    MeteredMap(KeyValueStore&lt;K, V&gt; inner) { this.inner = inner; }\n\n    public V get(K key) {\n        V v = inner.get(key);\n        if (v == null) misses.increment(); else hits.increment();\n        return v;\n    }\n    public V put(K key, V value) { writes.increment(); return inner.put(key, value); }\n    public V putIfAbsent(K key, V value) { writes.increment(); return inner.putIfAbsent(key, value); }\n    public V remove(K key) { writes.increment(); return inner.remove(key); }\n    public boolean replace(K key, V expected, V updated) { writes.increment(); return inner.replace(key, expected, updated); }\n    public V merge(K key, V value, BinaryOperator&lt;V&gt; remap) { writes.increment(); return inner.merge(key, value, remap); }\n    public V compute(K key, BiFunction&lt;? super K, ? super V, ? extends V&gt; remap) { writes.increment(); return inner.compute(key, remap); }\n    public V computeIfAbsent(K key, Function&lt;? super K, ? extends V&gt; loader) { writes.increment(); return inner.computeIfAbsent(key, loader); }\n    public int size() { return inner.size(); }\n\n    /** One line for a dashboard: reads, hit rate, writes. */\n    String report() {\n        long h = hits.sum(), m = misses.sum();\n        long pct = (h + m) == 0 ? 0 : 100 * h / (h + m);\n        return h + &quot; hits, &quot; + m + &quot; misses (&quot; + pct + &quot;% hit rate), &quot; + writes.sum() + &quot; writes&quot;;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>12 &middot; Where does time come from in this design, and how do you test a budget without waiting for it?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Time enters through a one-method <code>Clock</code> handed in at <code>configure</code>, and it is used in exactly one place that matters: the all-stripe operations. <code>lockAll</code> computes a deadline once, then takes each stripe's lock with a <code>tryLock</code> given whatever budget is left, and on running out it releases what it holds in reverse order and reports failure rather than sitting on half the map. Because the clock is injected, a test hands in one whose every reading is ten seconds later than the last: the deadline is already in the past at the first check, so <code>exactSize</code> returns -1 in under a millisecond and the test asserts both the answer and the elapsed time. The honest limit, worth saying out loud, is that the actual blocking still uses the operating system's timer &mdash; what the fake clock proves is the arithmetic, not the sleep.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Every stripe lock, in index order, inside a deadline taken from the injected clock. All or nothing. */\n    private boolean lockAll(long budgetMs) {\n        long deadline = clock.nowMs() + budgetMs;\n        int held = 0;\n        try {\n            for (int i = 0; i &lt; segments.length; i++) {\n                long left = deadline - clock.nowMs();\n                if (left &lt;= 0 || !segments[i].lock.tryLock(left, TimeUnit.MILLISECONDS)) { unlockAll(held); return false; }\n                held++;\n            }\n        } catch (InterruptedException e) {\n            unlockAll(held);\n            Thread.currentThread().interrupt();\n            return false;\n        }\n        return true;\n    }\n\n        long[] tick = { 0 };\n        budgeted.configure(new SpreadHasher(), () -&gt; tick[0] += 10_000);       // every reading is 10 s later\n        long t0 = System.nanoTime();\n        int refused = budgeted.exactSize(50);\n        long ms = (System.nanoTime() - t0) / 1_000_000;\n        check(refused == -1 &amp;&amp; ms &lt; 200, &quot;with a clock already past the deadline it returned &quot; + refused\n              + &quot; in &quot; + ms + &quot; ms instead of blocking the whole map&quot;);\n        budgeted.configure(new SpreadHasher(), System::currentTimeMillis);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Now it has to survive a restart.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The map becomes a cache over an append-only log, and the whole answer is an order. The append &mdash; the irreversible thing &mdash; happens inside the same stripe hold as the in-memory write, using the general <code>compute</code> seam, so an append that throws leaves the map exactly as it was and the caller retries. For a real store the same shape is a version column: <code>UPDATE rows SET value=?, version=version+1 WHERE key=? AND version=?</code>, where zero rows updated means somebody else got there first, which is exactly what the demo's stale writer sees. Recovery is replaying the log in order, last writer per key winning. And this is the one place you deliberately allow something slow inside a lock &mdash; which is precisely why the arithmetic on page 02 has a second column: at 1.8 microseconds inside the critical section, sixty-four stripes is 5.4 times one lock, and that is what makes a durable write per key affordable at all.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: surviving a restart -- an append-only log, and a conditional UPDATE so a stale writer cannot win\n/**\n * The map becomes a cache over a log. The ORDER is the design: the append -- the irreversible thing -- happens\n * inside the same stripe hold as the in-memory write, so an append that throws leaves the map exactly as it was\n * and the caller can retry. That is the one slow thing deliberately allowed inside a lock, and the stripes are\n * precisely what stops it from serialising the whole map (page 02, move 8, part B).\n *\n * For a real database the same shape is a version column: UPDATE rows SET value=?, version=version+1 WHERE key=?\n * AND version=?, and &quot;zero rows updated&quot; means somebody else got there first.\n */\nfinal class DurableMap {\n    /** A row as it would live in a table: the value plus the version that write produced. */\n    static final class Row {\n        final String value; final long version;\n        Row(String value, long version) { this.value = value; this.version = version; }\n        public String toString() { return value + &quot;@v&quot; + version; }\n    }\n\n    private final StripedMap&lt;String, Row&gt; memory = new StripedMap&lt;&gt;(16);\n    private final List&lt;String&gt; log = Collections.synchronizedList(new ArrayList&lt;&gt;());\n\n    /**\n     * Conditional write. Returns the new version, or -1 when the caller&#x27;s expected version is stale. The compare,\n     * the append and the in-memory write are one hold of one stripe lock, so two writers cannot both win.\n     */\n    long put(String key, String value, long expectedVersion) {\n        long[] written = { -1 };                                      // set only on the path that actually wrote\n        memory.compute(key, (k, current) -&gt; {\n            long have = current == null ? 0 : current.version;\n            if (have != expectedVersion) return current;              // stale: change nothing at all\n            long next = have + 1;\n            log.add(k + &quot;=&quot; + value + &quot;@v&quot; + next);                   // the irreversible step, before the commit\n            written[0] = next;\n            return new Row(value, next);\n        });\n        return written[0];\n    }\n\n    /** The value under a key, or null. */\n    Row get(String key) { return memory.get(key); }\n\n    /** How many records the log holds. */\n    int logSize() { return log.size(); }\n\n    /** Rebuild the whole map from the log after a restart: replay in order, last writer per key wins. */\n    static Map&lt;String, Row&gt; replay(List&lt;String&gt; log) {\n        Map&lt;String, Row&gt; out = new LinkedHashMap&lt;&gt;();\n        for (String line : log) {\n            int eq = line.indexOf(&#x27;=&#x27;), at = line.lastIndexOf(&quot;@v&quot;);\n            out.put(line.substring(0, eq), new Row(line.substring(eq + 1, at), Long.parseLong(line.substring(at + 2))));\n        }\n        return out;\n    }\n\n    /** The log itself, for the replay demo. */\n    List&lt;String&gt; log() { return log; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Why does java.util.concurrent.ConcurrentHashMap not look like this? And what else in java.util.concurrent should I have used?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Because Java 8 threw the segments away. The lock granularity is now one <i>bucket</i>, not one stripe: a read takes nothing at all &mdash; a volatile array read, a chain walk, a volatile value read &mdash; a write into an empty bucket is a single compare-and-set, and a write into an occupied one synchronizes on the node that is already the head. A bucket that gets long turns into a red-black tree, and the resize is incremental, with writers helping to transfer bins. The consequence worth naming is that because a reader holds nothing, a node can never be relinked underneath one &mdash; which is exactly what this design's resize does, and exactly why its <code>get</code> takes the lock. Then the rest of the shelf, because the interviewer is really asking whether you would ever write this at work. <code>ConcurrentHashMap</code> is the default, and its <code>merge</code> and <code>computeIfAbsent</code> are atomic per key, which is most of what this page is about. <code>Collections.synchronizedMap</code> is the one lock around everything you were told at the start not to write. <code>LongAdder</code> beats <code>AtomicLong</code> for a contended counter, because it keeps one cell per contending thread and only sums them on read &mdash; the same divide-the-state idea as striping, applied to a single number. <code>ConcurrentSkipListMap</code> is the one to reach for when you need keys in order. <code>StampedLock</code> gives an optimistic read that takes no lock and is validated afterwards, which is the read/write lock done properly, at the cost of an API that is easy to misuse. So: in production, use <code>ConcurrentHashMap</code>. You build this in an interview to show you know what is under it, and the one real reason to build your own is a compound operation across several keys, which no single map API gives you.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: one lock per BIN -- what ConcurrentHashMap became in Java 8\n/**\n * The Java 8 ConcurrentHashMap shape, in miniature. There are no stripes: the lock granularity is ONE BUCKET.\n * A read takes nothing at all -- a volatile array read, a walk, a volatile value read. A write into an empty\n * bucket is a single compare-and-set; a write into an occupied one synchronizes on the node that is already the\n * head. That is why CHM never relinks a node another thread might be walking: a reader holds nothing, so a node\n * has to stay valid forever. This version has a fixed bucket count, which is the part that has been left out --\n * a concurrent resize is where the real implementation&#x27;s complexity lives.\n */\nfinal class CasMap&lt;K, V&gt; {\n    /** A chain node whose value and next are volatile, because a reader walks it holding no lock. */\n    private static final class Node&lt;K, V&gt; {\n        final K key; final int hash; volatile V value; volatile Node&lt;K, V&gt; next;\n        Node(K key, int hash, V value, Node&lt;K, V&gt; next) { this.key = key; this.hash = hash; this.value = value; this.next = next; }\n    }\n\n    private final AtomicReferenceArray&lt;Node&lt;K, V&gt;&gt; bins;\n    private final LongAdder count = new LongAdder();\n\n    /** A fixed number of buckets, rounded up to a power of two. No resize: that is the part left out on purpose. */\n    CasMap(int buckets) { this.bins = new AtomicReferenceArray&lt;&gt;(StripedMap.tableSizeFor(buckets)); }\n\n    private int spread(K key) { int h = key.hashCode() * 0x9E3779B1; return h ^ (h &gt;&gt;&gt; 16); }\n\n    /** No lock, no CAS, nothing: two volatile reads and a walk. This is the whole point of rung 3. */\n    V get(K key) {\n        int h = spread(key), i = h &amp; (bins.length() - 1);\n        for (Node&lt;K, V&gt; e = bins.get(i); e != null; e = e.next)\n            if (e.hash == h &amp;&amp; e.key.equals(key)) return e.value;\n        return null;\n    }\n\n    /** CAS into an empty bucket; synchronize on the head node when the bucket is not empty; retry if it moved. */\n    V put(K key, V value) {\n        int h = spread(key), i = h &amp; (bins.length() - 1);\n        for (;;) {\n            Node&lt;K, V&gt; head = bins.get(i);\n            if (head == null) {\n                if (bins.compareAndSet(i, null, new Node&lt;&gt;(key, h, value, null))) { count.increment(); return null; }\n                continue;                                   // somebody else won the empty bucket: look again\n            }\n            synchronized (head) {\n                if (bins.get(i) != head) continue;          // the head changed under us: start over\n                Node&lt;K, V&gt; prev = null;\n                for (Node&lt;K, V&gt; e = head; e != null; prev = e, e = e.next)\n                    if (e.hash == h &amp;&amp; e.key.equals(key)) { V old = e.value; e.value = value; return old; }\n                prev.next = new Node&lt;&gt;(key, h, value, null); // append at the tail, so nobody walking is disturbed\n                count.increment();\n                return null;\n            }\n        }\n    }\n\n    /** A LongAdder, which is the same trick as striping applied to one number: per-thread cells, summed on read. */\n    int size() { return count.intValue(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n/**\n * Where time comes from. Injected, never read off the wall clock inside a method, so a test can hand in a clock\n * whose reading is already past a deadline and watch a budgeted operation give up without actually waiting.\n */\ninterface Clock {\n    /** Milliseconds since some fixed origin. Only differences are ever used, so the origin does not matter. */\n    long nowMs();\n}\n\n/**\n * The promise the callers depend on: read a key, write a key, and -- because callers will want counters --\n * read-modify-write a key as ONE atomic step. Nothing in here mentions stripes or locks, so the implementation\n * underneath can be swapped for a global lock or for java.util.concurrent.ConcurrentHashMap without touching a\n * single call site.\n */\ninterface KeyValueStore<K, V> {\n    /** The value stored under this key, or null when there is none. Null keys and values are refused, so null is unambiguous. */\n    V get(K key);\n    /** Store the value; returns what was there before, or null when the key is new. Last writer wins. */\n    V put(K key, V value);\n    /** Store only when the key is absent. Returns the value that won: the existing one, or null when this call stored. */\n    V putIfAbsent(K key, V value);\n    /** Remove the key; returns the value it held, or null when it held none. */\n    V remove(K key);\n    /** Compare-and-set on one key: replaces only when the current value equals expected. One lock hold, so it cannot race. */\n    boolean replace(K key, V expected, V updated);\n    /** Read-modify-write in ONE lock hold: remap(old, value) when the key exists, value when it does not. Never loses an update. */\n    V merge(K key, V value, BinaryOperator<V> remap);\n    /** The general read-modify-write: remap(key, current-or-null) runs inside one lock hold; returning null removes the key. */\n    V compute(K key, BiFunction<? super K, ? super V, ? extends V> remap);\n    /** Load on miss, with the loader running at most once per key: a second caller waits and takes the first one's answer. */\n    V computeIfAbsent(K key, Function<? super K, ? extends V> loader);\n    /** How many entries are held. Weakly consistent: a sum of per-stripe counters, taken with no lock at all. */\n    int size();\n}\n\n/**\n * The one rule most likely to change per workload: how a key's hashCode becomes the bits that pick a stripe and a\n * bucket. Handed in, so \"our keys are sequential Longs and they all pile into four stripes\" is a new class and one\n * changed line at construction, never an edit to anything that holds a lock.\n */\ninterface Hasher {\n    /** Spread a raw hashCode. Must be a pure function of its argument: the same key has to reach the same stripe every time. */\n    int spread(int hashCode);\n}\n\n/**\n * The default spreader: multiply by the 32-bit golden ratio so every input bit reaches every output bit, then fold\n * the top sixteen down with an xor. The multiply is the part that matters here. java.util.HashMap gets away with\n * the fold alone because it only ever uses the LOW bits; this map picks a stripe from the HIGH bits, and a fold\n * leaves those exactly as they were -- so with a fold-only spreader every sequential Integer key lands in stripe 0.\n */\nfinal class SpreadHasher implements Hasher {\n    /** Fibonacci mix, then fold: consecutive keys come out far apart in both the high bits and the low ones. */\n    public int spread(int hashCode) {\n        int h = hashCode * 0x9E3779B1;\n        return h ^ (h >>> 16);\n    }\n}\n\n/**\n * Whoever wants to know that a write happened: a metrics counter, an audit line, a cache invalidator. Called AFTER\n * the stripe lock is released, inside a try/catch, so a slow or broken listener can never hold a stripe shut.\n */\ninterface MapObserver {\n    /** One completed write. op is \"put\" / \"remove\" / \"merge\" / \"compute\"; stripe is the index the key landed in. */\n    void onWrite(String op, Object key, int stripe, long atMs);\n}\n\n/**\n * One node in a bucket's collision chain: the key, its spread hash cached so a lookup compares two ints before it\n * ever calls equals, the value, and the next node. Only value and next ever change, and only under the owning\n * stripe's lock; key and hash are final, which is what makes a node safe to read once it is published.\n */\nfinal class Entry<K, V> {\n    final K key;\n    final int hash;\n    V value;\n    Entry<K, V> next;\n\n    /** Build a node that already points at the current head of its bucket, so publishing it is one reference write. */\n    Entry(K key, int hash, V value, Entry<K, V> next) {\n        this.key = key; this.hash = hash; this.value = value; this.next = next;\n    }\n}\n\n/**\n * One stripe: a bucket array, a count, and its own lock. This is the monitor object of the design -- every field\n * is private, and every path that touches one goes through a method that takes the lock, so \"who guards this\n * state\" has exactly one answer. Stripes know nothing about each other, which is the whole point: two threads\n * working on two stripes never meet.\n */\nfinal class Segment<K, V> {\n    /** The one lock guarding everything below. Package-private because the map takes it for two-stripe operations. */\n    final ReentrantLock lock = new ReentrantLock();\n    private Entry<K, V>[] table;\n    /** Entries held. Volatile so size() can read it with no lock; written only under the lock, and written LAST. */\n    private volatile int count;\n    private int threshold;\n    private final float loadFactor;\n    /** How often a thread found this stripe already held. The only contention number worth quoting. */\n    private final LongAdder waits = new LongAdder();\n\n    /** A stripe with its own bucket array. Capacity is rounded to a power of two by the caller. */\n    Segment(int capacity, float loadFactor) {\n        this.table = newTable(capacity);\n        this.loadFactor = loadFactor;\n        this.threshold = (int) (capacity * loadFactor);\n    }\n\n    /** Allocate a bucket array. The one unavoidable unchecked cast: Java cannot make an array of a generic type. */\n    @SuppressWarnings(\"unchecked\")\n    private Entry<K, V>[] newTable(int capacity) { return (Entry<K, V>[]) new Entry[capacity]; }\n\n    /** Take the lock, counting the times somebody else already had it. An uncontended tryLock is the same CAS as lock(). */\n    private void acquire() {\n        if (!lock.tryLock()) { waits.increment(); lock.lock(); }\n    }\n\n    /** The bucket a hash belongs to. The low bits, masked -- a power-of-two length turns a modulo into an AND. */\n    private int indexFor(int hash) { return hash & (table.length - 1); }\n\n    // ---- the public surface: each one takes the lock, does its work, and releases it in a finally\n\n    /** Look the key up. Reads take the lock too in this version; rung 2 of the ladder is where readers stop excluding readers. */\n    V get(K key, int hash) { acquire(); try { return getLocked(key, hash); } finally { lock.unlock(); } }\n\n    /** Insert or overwrite in one hold. Returns the previous value, or null when the key is new. */\n    V put(K key, int hash, V value) { acquire(); try { return putLocked(key, hash, value); } finally { lock.unlock(); } }\n\n    /** Insert only when absent. The check and the write are one hold, so two threads cannot both think they are first. */\n    V putIfAbsent(K key, int hash, V value) {\n        acquire();\n        try {\n            Entry<K, V> e = findLocked(key, hash);\n            if (e != null) return e.value;\n            putLocked(key, hash, value);\n            return null;\n        } finally { lock.unlock(); }\n    }\n\n    /** Remove in one hold. Returns the value that was there, or null. */\n    V remove(K key, int hash) { acquire(); try { return removeLocked(key, hash); }

\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">It is waiting.</text></svg></div><div class=\"move\"><p>A stripe is <b>Serving</b> almost always, and <b>Growing</b> for the few microseconds when a writer that just pushed it past its load factor rehashes it &mdash; same thread, same lock hold, straight back to Serving. Now follow one <code>put</code> along the clock. Take the stripe's lock. Walk the bucket, comparing the cached hash before <code>equals</code>. If the caller handed in a function &mdash; <code>merge</code>, <code>compute</code>, <code>computeIfAbsent</code> &mdash; it runs <i>here</i>, inside the one hold, which is the whole reason none of those can lose an update. Then link the new node to the current head and publish it with one reference write, so the chain is never half-built. Only <i>then</i> raise the volatile count, so a <code>size()</code> running with no lock can never count an entry it could not have found. If that pushed the stripe over its threshold, rehash into a doubled array and swap the table in one more reference write &mdash; all of it still under the same lock, which is the complete answer to \"what does a reader see mid-resize?\": nothing, it is waiting. If anything is parked waiting for this key to appear, signal it <i>here</i>, with the lock still held: a signal only moves threads from the waiting queue to the lock queue, so it costs two pointer moves, and doing it before the unlock is what stops a wake-up going missing. Then unlock in a <code>finally</code>, and only then tell the listeners, which are arbitrary code somebody else wrote. One line to remember: <b>signal inside the lock, call listeners outside it</b> &mdash; the wait protocol on page 05 is built on it. Anything that throws before the publish &mdash; a bad <code>equals</code>, a remap function that blows up &mdash; leaves the map exactly as it was, and the caller can simply retry.</p></div><div class=\"move\"><h3>Move 7: yes, a stripe is one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 456\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(24 18)\"><rect width=\"570\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: 15 ns for a put, 10 ns for a get</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one shift and one mask to find the bucket</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">a walk of a chain that is almost always one node long</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">two int comparisons, one field write</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">sometimes: a doubled array and a rehash</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">nothing in here can block, and nothing calls out</text></g><path d=\"M594 93 H652\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"623\" y=\"83\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(652 18)\"><rect width=\"550\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"275.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: everything that could take a while</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the listeners, in a try/catch, after the unlock</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the caller's own work between calls</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">a loader, when you use a future instead</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">a durable append &mdash; unless you put it in on purpose</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">the boxing, the string building, the garbage</text></g><text x=\"615\" y=\"192\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">eight threads at the same instant, sixteen stripes: the green block is the fifteen nanoseconds a thread holds one stripe</text><text x=\"24\" y=\"221\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">thread 1</text><rect x=\"110\" y=\"208\" width=\"1092\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"200\" y=\"208\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"24\" y=\"243\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">thread 2</text><rect x=\"110\" y=\"230\" width=\"1092\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"750\" y=\"230\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#3a1f22\" stroke=\"#ff6b6b\"/><text x=\"24\" y=\"265\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">thread 3</text><rect x=\"110\" y=\"252\" width=\"1092\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"370\" y=\"252\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"24\" y=\"287\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">thread 4</text><rect x=\"110\" y=\"274\" width=\"1092\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"1010\" y=\"274\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"24\" y=\"309\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">thread 5</text><rect x=\"110\" y=\"296\" width=\"1092\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"530\" y=\"296\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"24\" y=\"331\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">thread 6</text><rect x=\"110\" y=\"318\" width=\"1092\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"750\" y=\"318\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#3a1f22\" stroke=\"#ff6b6b\"/><text x=\"24\" y=\"353\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">thread 7</text><rect x=\"110\" y=\"340\" width=\"1092\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"1170\" y=\"340\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"24\" y=\"375\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--muted)\">thread 8</text><rect x=\"110\" y=\"362\" width=\"1092\" height=\"16\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><rect x=\"290\" y=\"362\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#12302a\" stroke=\"var(--acc)\"/><rect x=\"742\" y=\"230\" width=\"24\" height=\"112\" rx=\"4\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"615\" y=\"400\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">threads 2 and 6 both hashed into stripe 11: one of them waits fifteen nanoseconds. That is the only waiting on this whole picture.</text><text x=\"615\" y=\"422\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">measured: 50 threads writing 100,000 distinct keys finished in 30 ms, and a thread found its stripe already held about 6,500 times in 100,000 writes &mdash; under seven per cent</text><text x=\"615\" y=\"442\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">so the honest answer to &quot;is everything one by one now?&quot; is: per stripe yes, for fifteen nanoseconds; across the map, sixteen things happen at once</text></svg></div><div class=\"move\"><p>Inside the lock there is a shift, a mask, a walk of a chain that is almost always one node long, two int comparisons and a field write: measured on one thread with nobody to contend with, fifteen nanoseconds for a <code>put</code> and ten for a <code>get</code>. Everything slow is outside &mdash; the listeners, the caller's own work, the boxing and the garbage. So when eight threads arrive at the same instant they are almost never on the same stripe: fifty threads writing a hundred thousand distinct keys finished in thirty milliseconds, and a thread found its stripe already held about six and a half thousand times out of a hundred thousand writes. Under seven per cent. That is the number to volunteer, because it is the honest answer to \"is everything one by one now?\" &mdash; per stripe yes, for fifteen nanoseconds; across the map, sixteen things are happening at once. The one case where striping cannot help at all is worth saying in the same breath: every thread hammering the <i>same</i> key is every thread on one lock, and no amount of striping changes that. It is also the case in the lost-update demo, which is why that demo is honest about the cost as well as the correctness.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></ma font-size=\"11\" fill=\"var(--text)\">25</text><text x=\"420\" y=\"146.0\" font-size=\"11\" fill=\"var(--text)\">119 ms   2.2x</text><rect x=\"20\" y=\"156\" width=\"596\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"174.0\" font-size=\"11\" fill=\"var(--acc)\">16</text><text x=\"130\" y=\"174.0\" font-size=\"11\" fill=\"var(--text)\">25 ms</text><text x=\"305\" y=\"174.0\" font-size=\"11\" fill=\"var(--text)\">15</text><text x=\"420\" y=\"174.0\" font-size=\"11\" fill=\"var(--text)\">78 ms   3.3x</text><rect x=\"20\" y=\"184\" width=\"596\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"202.0\" font-size=\"11\" fill=\"var(--text)\">64</text><text x=\"130\" y=\"202.0\" font-size=\"11\" fill=\"var(--text)\">20 ms</text><text x=\"305\" y=\"202.0\" font-size=\"11\" fill=\"var(--text)\">12</text><text x=\"420\" y=\"202.0\" font-size=\"11\" fill=\"var(--text)\">51 ms   5.0x</text><rect x=\"20\" y=\"212\" width=\"596\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"230.0\" font-size=\"11\" fill=\"var(--muted)\">one thread</text><text x=\"130\" y=\"230.0\" font-size=\"11\" fill=\"var(--text)\">nobody to wait for</text><text x=\"305\" y=\"230.0\" font-size=\"11\" fill=\"var(--text)\">15 put, 10 get</text><text x=\"420\" y=\"230.0\" font-size=\"11\" fill=\"var(--muted)\">that IS the critical section</text><text x=\"911\" y=\"32\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the ladder, in the order you would climb it</text><g transform=\"translate(624 48)\"><rect width=\"578\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"289.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1   more stripes</text><text x=\"289.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one constructor argument: 1 &rarr; 64 took 62 ms to 20 ms. Try this first, always</text></g><g transform=\"translate(624 110)\"><rect width=\"578\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"289.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2   get the slow thing out of the lock</text><text x=\"289.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a future per key instead of a loader inside it: 32 misses, one 200 ms load</text></g><g transform=\"translate(624 172)\"><rect width=\"578\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"289.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3   no lock on the read path at all</text><text x=\"289.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">CHM's shape: volatile bins, CAS an empty one, synchronize on the head. 14 ns a get</text></g><text x=\"615\" y=\"264\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">striping buys you exactly as much as the time spent inside the lock: at 15 ns inside, 64 stripes is 3x; at 1.8 us inside, 5x and still climbing</text><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">and the rung that is NOT on this ladder: a read/write lock per stripe. On a 95% read workload it measured 33 ms with plain locks,</text><text x=\"615\" y=\"306\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">75 ms with RW locks and 12 ms with no read lock at all &mdash; the obvious rung is the slowest of the three. Measure before you climb.</text></svg></div><div class=\"move\"><p>Measure before you climb. Eight threads, 1.6 million writes over 65,536 keys: one stripe takes 62 ms (38 ns a write), two 54 ms, four 41 ms, sixteen 25 ms, sixty-four 20 ms (12 ns). Three times, for a constructor argument. Then run the same thing with 1.8 microseconds of real work inside the lock &mdash; a loader, a big value, a durable append &mdash; and the table changes shape: one stripe 256 ms, four 119 ms, sixteen 78 ms, sixty-four 51 ms, which is 5x and still climbing. That is the whole lesson in one sentence: <i>striping buys you exactly as much as the time spent inside the lock</i>. Now the ladder, cheapest first. One: more stripes, which is one argument and always worth trying first. Two: get the slow thing out of the lock &mdash; a future per key instead of a loader inside the critical section, so thirty-two threads missing the same key cost one 200 ms load instead of thirty-two. Three: no lock on the read path at all, which is what <code>ConcurrentHashMap</code> actually does &mdash; volatile bins, a compare-and-set into an empty one, <code>synchronized</code> on the head node otherwise &mdash; and measures 14 ns a get here. And one rung that is deliberately <i>not</i> on this ladder, because it is the one everybody reaches for: a read/write lock per stripe. The same 95 per cent read workload measured 33 ms on plain locks, 75 ms on read/write locks and 12 ms with no read lock at all. The RW version is <i>slower</i>, and the reason is worth one sentence: taking a read lock is itself a compare-and-set on one shared counter, so ten readers of the same stripe still hammer the same cache line &mdash; they simply do not block while they do it. An RW lock pays only when the critical section is long enough that the exclusion itself was the cost; here it is fifteen nanoseconds. Have the number before you claim the rung.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 490\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" l(#uArr)\"/><g transform=\"translate(416 174)\"><rect width=\"786\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"393.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">always the lower index first; test 6 moves a value both ways 20,000 times and finishes</text></g><g transform=\"translate(24 214)\"><rect width=\"372\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"186.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an exact size() that fights every writer</text></g><path d=\"M396 232 H416\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(416 214)\"><rect width=\"786\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"393.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a budget from the injected clock, then give up and say so; test 7</text></g><g transform=\"translate(24 254)\"><rect width=\"372\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"186.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a waiter that looks before it takes the lock</text></g><path d=\"M396 272 H416\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(416 254)\"><rect width=\"786\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"393.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">look for the key UNDER the lock, or it arrives in the gap and the signal is lost; test 11</text></g><g transform=\"translate(24 294)\"><rect width=\"372\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"186.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">await() in an if, or a wait with no deadline</text></g><path d=\"M396 312 H416\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(416 294)\"><rect width=\"786\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"393.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a while loop beats a spurious wake-up; awaitNanos returns the budget LEFT; test 12 stops at 200 ms</text></g><g transform=\"translate(24 334)\"><rect width=\"372\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"186.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lock() where the wait can be long</text></g><path d=\"M396 352 H416\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(416 334)\"><rect width=\"786\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"393.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lockInterruptibly / tryLock on the all-stripe path, so a cancelled caller is not stuck; test 13</text></g><g transform=\"translate(24 374)\"><rect width=\"372\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"186.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a listener called inside the lock</text></g><path d=\"M396 392 H416\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(416 374)\"><rect width=\"786\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"393.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish after the unlock, in a try/catch; test 8 proves it from another thread</text></g><g transform=\"translate(24 414)\"><rect width=\"372\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"186.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a stripe count that is not a power of two</text></g><path d=\"M396 432 H416\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(416 414)\"><rect width=\"786\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"393.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">round up at construction: 17 becomes 32; test 7</text></g><text x=\"615\" y=\"476\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">twenty-nine checks in FailureTests.java, every join with a deadline and a forty-five-second watchdog behind the lot: a concurrency test that hangs has told you nothing</text></svg></div><div class=\"move\"><p>A counter done as a <code>get</code> then a <code>put</code>, which is two holds with a gap. A spreader with no multiply in it, which is fine for <code>HashMap</code> because that only uses the low bits, and a disaster here because the stripe comes from the high bits &mdash; the fold-only version puts all twenty thousand sequential keys in stripe zero, and the thirty-second way to catch it is to print the per-stripe histogram. A count raised before the node is published, so a lock-free <code>size()</code> counts something nobody can find. A resize a reader can walk into. Two stripes taken in whatever order they happened to come in, which is the classic deadlock. An exact <code>size()</code> that fights every writer with no budget. A listener called inside the lock. A stripe count that is not a power of two, so the mask silently drops keys into a subset of the stripes. Then the three that only appear once a thread has to <i>wait</i> for something rather than just take its turn, and they are the ones that hang rather than slow down. A waiter that looks for the key <i>before</i> it takes the lock: the value can arrive in the gap, taking the announcement with it, and the waiter then sleeps for an announcement that has already been made &mdash; a <b>lost wakeup</b>. An <code>await</code> inside an <code>if</code> instead of a <code>while</code>: <code>await</code> is allowed to return with nobody having signalled at all (a <b>spurious wakeup</b>), and even after a real signal another waiter may have taken the value first, so the condition has to be re-checked rather than assumed. And a wait with no deadline, which is a hang wearing a different hat. Each of those is a few lines in FailureTests.java &mdash; twenty-nine checks, every join with a deadline and a forty-five-second watchdog behind the lot, because a concurrency test that hangs has told you nothing.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 402\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"18\" width=\"1190\" height=\"29\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"36.5\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"196\" y=\"36.5\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"282\" y=\"36.5\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"820\" y=\"36.5\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"47\" width=\"1190\" height=\"29\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"65.5\" font-size=\"11\" fill=\"var(--text)\">Monitor object</text><text x=\"196\" y=\"65.5\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"282\" y=\"65.5\" font-size=\"11\" fill=\"var(--text)\">Segment: private fields, one ReentrantLock, every path takes it</text><text x=\"820\" y=\"65.5\" font-size=\"11\" fill=\"var(--text)\">one answer to &quot;who guards this?&quot;</text><rect x=\"20\" y=\"76\" width=\"1190\" height=\"29\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"94.5\" font-size=\"11\" fill=\"var(--text)\">Lock striping</text><text x=\"196\" y=\"94.5\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"282\" y=\"94.5\" font-size=\"11\" fill=\"var(--text)\">Segment[] segments, chosen by the top bits of the hash</text><text x=\"820\" y=\"94.5\" font-size=\"11\" fill=\"var(--text)\">sixteen writers instead of one</text><rect x=\"20\" y=\"105\" width=\"1190\" height=\"29\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"123.5\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"196\" y=\"123.5\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"282\" y=\"123.5\" font-size=\"11\" fill=\"var(--text)\">interface Hasher { int spread(int hashCode); }</text><text x=\"820\" y=\"123.5\" font-size=\"11\" fill=\"var(--text)\">a new spreader is a class, not an edit</text><rect x=\"20\" y=\"134\" width=\"1190\" height=\"29\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"152.5\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"196\" y=\"152.5\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"282\" y=\"152.5\" font-size=\"11\" fill=\"var(--text)\">MeteredMap implements KeyValueStore, holds one</text><text x=\"820\" y=\"152.5\" font-size=\"11\" fill=\"var(--text)\">hit rates without opening the map</text><rect x=\"20\" y=\"163\" width=\"1190\" height=\"29\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"181.5\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"196\" y=\"181.5\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"282\" y=\"181.5\" font-size=\"11\" fill=\"var(--text)\">publish(op, key, stripe) after the unlock, in a try/catch</text><text x=\"820\" y=\"181.5\" font-size=\"11\" fill=\"var(--text)\">a broken listener cannot hold a stripe</text><rect x=\"20\" y=\"192\" width=\"1190\" height=\"29\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"210.5\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"196\" y=\"210.5\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"282\" y=\"210.5\" font-size=\"11\" fill=\"var(--text)\">Serving &rarr; Growing &rarr; Serving, all under one lock hold</text><text x=\"820\" y=\"210.5\" font-size=\"11\" fill=\"var(--text)\">&quot;what is seen mid-resize?&quot; &mdash; nothing</text><rect x=\"20\" y=\"221\" width=\"1190\" height=\"29\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"239.5\" font-size=\"11\" fill=\"var(--text)\">Iterator</text><text x=\"196\" y=\"239.5\" font-size=\"11\" fill=\"var(--text)\">move 5</text><text x=\"282\" y=\"239.5\" font-size=\"11\" fill=\"var(--text)\">StripeIterator: one stripe copied at a time</text><text x=\"820\" y=\"239.5\" font-size=\"11\" fill=\"var(--text)\">iteration that cannot throw</text><rect x=\"20\" y=\"250\" width=\"1190\" height=\"29\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"268.5\" font-size=\"11\" fill=\"var(--muted)\">Adapter</text><text x=\"196\" y=\"268.5\" font-size=\"11\" fill=\"var(--text)\">if asked</text><text x=\"282\" y=\"268.5\" font-size=\"11\" fill=\"var(--muted)\">a ConcurrentHashMap behind the same KeyValueStore</text><text x=\"820\" y=\"268.5\" font-size=\"11\" fill=\"var(--muted)\">swap the whole engine, keep the callers</text><rect x=\"20\" y=\"279\" width=\"1190\" height=\"29\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"297.5\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"196\" y=\"297.5\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"282\" y=\"297.5\" font-size=\"11\" fill=\"var(--muted)\">the map is handed to whoever needs it; no getInstance()</text><text x=\"820\" y=\"297.5\" font-size=\"11\" fill=\"var(--muted)\">every test builds a fresh map</text><rect x=\"20\" y=\"308\" width=\"1190\" height=\"29\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"326.5\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"196\" y=\"326.5\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"282\" y=\"326.5\" font-size=\"11\" fill=\"var(--muted)\">new StripedMap&lt;&gt;(16) is one line</text><text x=\"820\" y=\"326.5\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when 16 comes from config</text><rect x=\"20\" y=\"337\" width=\"1190\" height=\"29\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"355.5\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"196\" y=\"355.5\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"282\" y=\"355.5\" font-size=\"11\" fill=\"var(--muted)\">three constructor arguments, two with defaults</text><text x=\"820\" y=\"355.5\" font-size=\"11\" fill=\"var(--muted)\">a builder here is pure ceremony</text><text x=\"615\" y=\"388\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name comes with a one-sentence defence</text></svg></div><div class=\"move\"><p><b>Monitor object</b> is move 4: <code>Segment</code> has private fields, one lock, and the only way in is a method that takes it. <b>Lock striping</b> is the second half of the same move, and it is worth naming out loud because it is the name of the whole exercise: divide the state into independent pieces and give each its own guard. <b>Strategy</b> is move 3, for the hasher. <b>Decorator</b> is the same move's wrapper, <code>MeteredMap</code>, which implements <code>KeyValueStore</code> and holds one. <b>Observer</b> is move 4's rule that a listener runs after the unlock. <b>State</b> is move 6: Serving to Growing and back, inside one lock hold. <b>Iterator</b> is move 5's <code>StripeIterator</code>, which copies one stripe at a time and therefore cannot throw. If they ask how you would swap the engine, that is <b>Adapter</b>: a <code>ConcurrentHashMap</code> behind the same interface, and not one call site changes. Singleton earned nothing &mdash; the map is handed to whoever needs it, so every test builds a fresh one. Factory is not yet: <code>new StripedMap&lt;&gt;(16)</code> is one line, and it earns the name the day the sixteen comes from a config file. Builder is never: three constructor arguments, two of them with defaults.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"18\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"68\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"450\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"546\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"52\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"73.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"68\" y=\"73.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"450\" y=\"73.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"546\" y=\"73.0\" font-size=\"11\" fill=\"var(--text)\">Segment stores and locks. StripedMap routes. Hasher spreads. Entry links.</text><rect x=\"20\" y=\"86\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"107.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"68\" y=\"107.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"450\" y=\"107.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"546\" y=\"107.0\" font-size=\"11\" fill=\"var(--text)\">FoldOnlyHasher is a new file and one changed line at construction</text><rect x=\"20\" y=\"120\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"141.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"68\" y=\"141.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"450\" y=\"141.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"546\" y=\"141.0\" font-size=\"11\" fill=\"var(--text)\">hasher.spread(key.hashCode()) &mdash; the map never asks which spreader it got</text><rect x=\"20\" y=\"154\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"175.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"68\" y=\"175.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"450\" y=\"175.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"546\" y=\"175.0\" font-size=\"11\" fill=\"var(--text)\">Hasher, Clock and MapObserver are one method each; a lambda implements all three</text><rect x=\"20\" y=\"188\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"209.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"68\" y=\"209.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; be handed the rest</text><text x=\"450\" y=\"209.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"546\" y=\"209.0\" font-size=\"11\" fill=\"var(--text)\">configure(hasher, clock): a test hands in a clock already past the deadline</text><text x=\"615\" y=\"246\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>S: the stripe stores and locks, the map routes, the hasher spreads, the entry links &mdash; four reasons to change, four types, and that split is why the entry and the spreader can be tested with no threads at all. O: a different way of spreading a hash is a new file and one changed line at construction, never an edit to anything that holds a lock. L: the map calls <code>hasher.spread(key.hashCode())</code> and never asks which implementation it got, which is why the test can hand it one that sends every key to stripe zero and watch the map stay correct. I: <code>Hasher</code>, <code>Clock</code> and <code>MapObserver</code> have one method each, so a fake for a test is a lambda. D: the map depends on those interfaces and is handed the implementations through <code>configure</code>, which is exactly how a test hands it a clock whose every reading is ten seconds later than the last and watches <code>exactSize</code> give up in under a millisecond instead of fighting fifty writers.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 336\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(28 20)\"><rect width=\"300\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"150.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a different way to spread a hash</text></g><path d=\"M328 43 H388\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(388 20)\"><rect width=\"700\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"350.0\" y=\"23.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind Hasher plus one line at construction</text></g><text x=\"1150\" y=\"48\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(28 76)\"><rect width=\"300\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"150.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">hit rate, write rate, per-stripe load</text></g><path d=\"M328 99 H388\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(388 76)\"><rect width=\"700\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"350.0\" y=\"23.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an observer after the unlock, or a Decorator over the interface</text></g><text x=\"1150\" y=\"104\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 3 + 4</text><g transform=\"translate(28 132)\"><rect width=\"300\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"150.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">bound it, and evict when it is full</text></g><path d=\"M328 155 H388\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(388 132)\"><rect width=\"700\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"350.0\" y=\"23.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the eviction runs inside the same write hold, so the bound is never exceeded</text></g><text x=\"1150\" y=\"160\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(28 188)\"><rect width=\"300\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across items</text><text x=\"150.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">move a value between two keys, atomically</text></g><path d=\"M328 211 H388\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(388 188)\"><rect width=\"700\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"350.0\" y=\"23.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">both stripe locks, always in index order; that ordering IS the invariant</text></g><text x=\"1150\" y=\"216\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 4 + 9</text><g transform=\"translate(28 244)\"><rect width=\"300\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"150.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">survive a restart</text></g><path d=\"M328 267 H388\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(388 244)\"><rect width=\"700\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"350.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">append to the log inside the same hold, then commit; a version refuses a stale writer</text><text x=\"350.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">and that is the one slow thing you put inside a lock on purpose &mdash; stripes are what keep it cheap</text></g><text x=\"1150\" y=\"272\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 6 + 8</text><text x=\"615\" y=\"322\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the striping, the lock per stripe and the order inside a write are untouched; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (\"our keys are sequential ids\") is a new <code>Hasher</code> plus one line. Someone new who wants to know (hit rate, per-stripe load) is an observer after the unlock, or a decorator around the whole interface. A new step in a life (\"bound it at ten thousand entries\") is an eviction that runs inside the same write hold that caused it, so the bound is never exceeded even for an instant &mdash; and the honest caveat is that the bound is per stripe, so a skewed key set evicts one stripe early. A new invariant across items (\"move a value between two keys atomically\") is the one that is genuinely hard: it needs both stripe locks, and taking them in whatever order they arrive is a deadlock within seconds, so the rule is always the lower stripe index first. The ordering <i>is</i> the invariant. And state that must outlive the process is the append-only log: the append happens inside the same stripe hold as the in-memory write, so a failed append leaves the map exactly as it was, and a version column refuses a writer holding a stale version. That last one is also the only time you deliberately put something slow inside a lock &mdash; and the stripes are precisely what stops it from serialising the whole map. Then say the honest exception, because on a threading problem they will find it: there is a sixth shape, and it is \"a caller must now <i>wait</i> for something rather than take its turn\" &mdash; \"block until this key appears\". That is not a new rule and not a new state; it is a <code>Condition</code> grown on the stripe, and it brings four rules of its own. They are the first follow-up card on page 05 that has nothing to do with hashing.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 810\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M1032 268 V60\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M1042 124 H1032\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M1042 192 H1032\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M1042 268 H1032\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M1032 60L1120 60L1120 74\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M482.0 210L482.0 170\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M256 233.0L276 232L276 100L296 100\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M668 343.0L706 327.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"693.0\" y=\"339.0\" font-size=\"10.5\" fi nslate(1042 336)\"><rect width=\"178\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"89.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;Extensions.java&raquo;</text><text x=\"89.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RwStripedMap</text><line x1=\"0\" y1=\"34\" x2=\"178\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">RW lock per stripe</text><line x1=\"0\" y1=\"56\" x2=\"178\" y2=\"56\" stroke=\"var(--line)\"/><text x=\"8\" y=\"69\" font-size=\"11.5\" fill=\"var(--text)\">page 05: measured slower</text></g><g transform=\"translate(1042 424)\"><rect width=\"178\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"89.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;Extensions.java&raquo;</text><text x=\"89.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CasMap</text><line x1=\"0\" y1=\"34\" x2=\"178\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">bins: AtomicRefArray</text><line x1=\"0\" y1=\"56\" x2=\"178\" y2=\"56\" stroke=\"var(--line)\"/><text x=\"8\" y=\"69\" font-size=\"11.5\" fill=\"var(--text)\">page 05: one lock/bin</text></g><g transform=\"translate(1042 512)\"><rect width=\"178\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"89.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;Extensions.java&raquo;</text><text x=\"89.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">WaitableMap</text><line x1=\"0\" y1=\"34\" x2=\"178\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">changed: Condition</text><line x1=\"0\" y1=\"56\" x2=\"178\" y2=\"56\" stroke=\"var(--line)\"/><text x=\"8\" y=\"69\" font-size=\"11.5\" fill=\"var(--text)\">page 05: wait protocol</text></g><g><path d=\"M20 790L64 790\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"794\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 790L284 790\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"794\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 790L504 790\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"794\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 790L684 790\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"794\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 790L904 790\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"794\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the type name (dashed border = interface). Middle: its fields, the state it holds. Bottom: its methods; <code>[lock held]</code> marks the ones that assume the caller already took the stripe lock &mdash; they exist so the map can do a two-stripe or all-stripe operation without taking the same lock twice &mdash; and <code>[after unlock]</code> marks the one that must never run inside it. A box stamped <i>&laquo;Extensions.java&raquo;</i> is not part of the system you type in the hour: it is a follow-up's answer, living in the second file. Everything without that stamp is in Main.java. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the map owns its stripes, a stripe owns its bucket array and its lock, and they die with it. Plain arrow = references: one entry points at the next in its chain. Dashed green = handed in through <code>configure()</code>. Dotted blue = notifies. <b>Where state lives:</b> every mutable field in this design is inside a <code>Segment</code> or inside the <code>Entry</code> chain it owns, and every one of them is reachable only under that stripe's lock &mdash; with exactly one exception, the volatile <code>count</code>, which is written under the lock and read without it so that <code>size()</code> costs nothing. <code>StripedMap</code> itself holds no entry and no lock: it routes. The row of padlocked boxes at the bottom is the same information as the <code>Segment</code> class, drawn sixteen times, because that is the picture worth having in your head when you type.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does and what it guarantees; read only those first for the shape, then the bodies. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (twenty-nine checks, every join on a deadline; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS in about five seconds).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n/**\n * Where time comes from. Injected, never read off the wall clock inside a method, so a test can hand in a clock\n * whose reading is already past a deadline and watch a budgeted operation give up without actually waiting.\n */\ninterface Clock {\n    /** Milliseconds since some fixed origin. Only differences are ever used, so the origin does not matter. */\n    long nowMs();\n}\n\n/**\n * The promise the callers depend on: read a key, write a key, and -- because callers will want counters --\n * read-modify-write a key as ONE atomic step. Nothing in here mentions stripes or locks, so the implementation\n * underneath can be swapped for a global lock or for java.util.concurrent.ConcurrentHashMap without touching a\n * single call site.\n */\ninterface KeyValueStore&lt;K, V&gt; {\n    /** The value stored under this key, or null when there is none. Null keys and values are refused, so null is unambiguous. */\n    V get(K key);\n    /** Store the value; returns what was there before, or null when the key is new. Last writer wins. */\n    V put(K key, V value);\n    /** Store only when the key is absent. Returns the value that won: the existing one, or null when this call stored. */\n    V putIfAbsent(K key, V value);\n    /** Remove the key; returns the value it held, or null when it held none. */\n    V remove(K key);\n    /** Compare-and-set on one key: replaces only when the current value equals expected. One lock hold, so it cannot race. */\n    boolean replace(K key, V expected, V updated);\n    /** Read-modify-write in ONE lock hold: remap(old, value) when the key exists, value when it does not. Never loses an update. */\n    V merge(K key, V value, BinaryOperator&lt;V&gt; remap);\n    /** The general read-modify-write: remap(key, current-or-null) runs inside one lock hold; returning null removes the key. */\n    V compute(K key, BiFunction&lt;? super K, ? super V, ? extends V&gt; remap);\n    /** Load on miss, with the loader running at most once per key: a second caller waits and takes the first one&#x27;s answer. */\n    V computeIfAbsent(K key, Function&lt;? super K, ? extends V&gt; loader);\n    /** How many entries are held. Weakly consistent: a sum of per-stripe counters, taken with no lock at all. */\n    int size();\n}\n\n/**\n * The one rule most likely to change per workload: how a key&#x27;s hashCode becomes the bits that pick a stripe and a\n * bucket. Handed in, so &quot;our keys are sequential Longs and they all pile into four stripes&quot; is a new class and one\n * changed line at construction, never an edit to anything that holds a lock.\n */\ninterface Hasher {\n    /** Spread a raw hashCode. Must be a pure function of its argument: the same key has to reach the same stripe every time. */\n    int spread(int hashCode);\n}\n\n/**\n * The default spreader: multiply by the 32-bit golden ratio so every input bit reaches every output bit, then fold\n * the top sixteen down with an xor. The multiply is the part that matters here. java.util.HashMap gets away with\n * the fold alone because it only ever uses the LOW bits; this map picks a stripe from the HIGH bits, and a fold\n * leaves those exactly as they were -- so with a fold-only spreader every sequential Integer key lands in stripe 0.\n */\nfinal class SpreadHasher implements Hasher {\n    /** Fibonacci mix, then fold: consecutive keys come out far apart in both the high bits and the low ones. */\n    public int spread(int hashCode) {\n        int h = hashCode * 0x9E3779B1;\n        return h ^ (h &gt;&gt;&gt; 16);\n    }\n}\n\n/**\n * Whoever wants to know that a write happened: a metrics counter, an audit line, a cache invalidator. Called AFTER\n * the stripe lock is released, inside a try/catch, so a slow or broken listener can never hold a stripe shut.\n */\ninterface MapObserver {\n    /** One completed write. op is &quot;put&quot; / &quot;remove&quot; / &quot;merge&quot; / &quot;compute&quot;; stripe is the index the key landed in. */\n    void onWrite(String op, Object key, int stripe, long atMs);\n}\n\n/**\n * One node in a bucket&#x27;s collision chain: the key, its spread hash cached so a lookup compares two ints before it\n * ever calls equals, the value, and the next node. Only value and next ever change, and only under the owning\n * stripe&#x27;s lock; key and hash are final, which is what makes a node safe to read once it is published.\n */\nfinal class Entry&lt;K, V&gt; {\n    final K key;\n    final int hash;\n    V value;\n    Entry&lt;K, V&gt; next;\n\n    /** Build a node that already points at the current head of its bucket, so publishing it is one reference write. */\n    Entry(K key, int hash, V value, Entry&lt;K, V&gt; next) {\n        this.key = key; this.hash = hash; this.value = value; this.next = next;\n    }\n}\n\n/**\n * One stripe: a bucket array, a count, and its own lock. This is the monitor object of the design -- every field\n * is private, and every path that touches one goes through a method that takes the lock, so &quot;who guards this\n * state&quot; has exactly one answer. Stripes know nothing about each other, which is the whole point: two threads\n * working on two stripes never meet.\n */\nfinal class Segment&lt;K, V&gt; {\n    /** The one lock guarding everything below. Package-private because the map takes it for two-stripe operations. */\n    final ReentrantLock lock = new ReentrantLock();\n    private Entry&lt;K, V&gt;[] table;\n    /** Entries held. Volatile so size() can read it with no lock; written only under the lock, and written LAST. */\n    private volatile int count;\n    private int threshold;\n    private final float loadFactor;\n    /** How often a thread found this stripe already held. The only contention number worth quoting. */\n    private final LongAdder waits = new LongAdder();\n\n    /** A stripe with its own bucket array. Capacity is rounded to a power of two by the caller. */\n    Segment(int capacity, float loadFactor) {\n        this.table = newTable(capacity);\n        this.loadFactor = loadFactor;\n        this.threshold = (int) (capacity * loadFactor);\n    }\n\n    /** Allocate a bucket array. The one unavoidable unchecked cast: Java cannot make an array of a generic type. */\n    @SuppressWarnings(&quot;unchecked&quot;)\n    private Entry&lt;K, V&gt;[] newTable(int capacity) { return (Entry&lt;K, V&gt;[]) new Entry[capacity]; }\n\n    /** Take the lock, counting the times somebody else already had it. An uncontended tryLock is the same CAS as lock(). */\n    private void acquire() {\n        if (!lock.tryLock()) { waits.increment(); lock.lock(); }\n    }\n\n    /** The bucket a hash belongs to. The low bits, masked -- a power-of-two length turns a modulo into an AND. */\n    private int indexFor(int hash) { return hash &amp; (table.length - 1); }\n\n    // ---- the public surface: each one takes the lock, does its work, and releases it in a finally\n\n    /** Look the key up. Reads take the lock too in this version; rung 2 of the ladder is where readers stop excluding readers. */\n    V get(K key, int hash) { acquire(); try { return getLocked(key, hash); } finally { lock.unlock(); } }\n\n    /** Insert or overwrite in one hold. Returns the previous value, or null when the key is new. */\n    V put(K key, int hash, V value) { acquire(); try { return putLocked(key, hash, value); } finally { lock.unlock(); } }\n\n    /** Insert only when absent. The check and the write are one hold, so two threads cannot both think they are first. */\n    V putIfAbsent(K key, int hash, V value) {\n        acquire();\n        try {\n            Entry&lt;K, V&gt; e = findLocked(key, hash);\n            if (e != null) return e.value;\n            putLocked(key, hash, value);\n            return null;\n        } finally { lock.unlock(); }\n    }\n\n    /** Remove in one hold. Returns the value that was there, or null. */\n    V remove(K key, int hash) { acquire(); try { return removeLocked(key, hash); } finally { lock.unlock(); } }\n\n    /** Compare-and-set on a value. The compare and the set are one hold: this is what makes it a CAS and not a race. */\n    boolean replace(K key, int hash, V expected, V updated) {\n        acquire();\n        try {\n            Entry&lt;K, V&gt; e = findLocked(key, hash);\n            if (e == null || !e.value.equals(expected)) return false;\n            e.value = updated;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * The read-modify-write that the whole design exists for. The caller&#x27;s remap function runs INSIDE the one lock\n     * hold, between the read and the write, so no other thread can slip an update in between and have it overwritten.\n     * If remap throws, nothing has been written yet and the map is exactly as it was.\n     */\n    V merge(K key, int hash, V value, BinaryOperator&lt;V&gt; remap) {\n        acquire();\n        try {\n            Entry&lt;K, V&gt; e = findLocked(key, hash);\n            if (e == null) { putLocked(key, hash, value); return value; }\n            V merged = remap.apply(e.value, value);\n            if (merged == null) { removeLocked(key, hash); return null; }\n            e.value = merged;\n            return merged;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * The general form of merge: the caller&#x27;s function sees the key and whatever is there (null when absent), and\n     * whatever it returns is stored -- or the key is removed when it returns null. One hold, so a durable store can\n     * append to its log inside this same hold and know the map and the log can never disagree.\n     */\n    V compute(K key, int hash, BiFunction&lt;? super K, ? super V, ? extends V&gt; remap) {\n        acquire();\n        try {\n            Entry&lt;K, V&gt; e = findLocked(key, hash);\n            V made = remap.apply(key, e == null ? null : e.value);\n            if (made == null) { if (e != null) removeLocked(key, hash); return null; }\n            if (e != null) { e.value = made; return made; }\n            putLocked(key, hash, made);\n            return made;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * Load on miss with the loader inside the lock, which is what buys &quot;called exactly once per key&quot;: the second\n     * caller blocks on the stripe, and by the time it gets in the entry is there. The price is honest and worth\n     * saying out loud -- a slow loader holds up every other key in this stripe.\n     */\n    V computeIfAbsent(K key, int hash, Function&lt;? super K, ? extends V&gt; loader) {\n        acquire();\n        try {\n            Entry&lt;K, V&gt; e = findLocked(key, hash);\n            if (e != null) return e.value;\n            V made = loader.apply(key);\n            if (made == null) return null;\n            putLocked(key, hash, made);\n            return made;\n        } finally { lock.unlock(); }\n    }\n\n    /** Entries held right now. A plain volatile read: no lock, so size() cannot be the thing that stops the map. */\n    int size() { return count; }\n\n    /** Buckets in this stripe&#x27;s array right now. Grows on resize; useful only for the demo and the tests. */\n    int capacity() { lock.lock(); try { return table.length; } finally { lock.unlock(); } }\n\n    /** How many times a thread arrived to find this stripe busy. */\n    long waitCount() { return waits.sum(); }\n\n    // ---- [lock held] the same work, without taking the lock: for the map&#x27;s two-stripe and all-stripe operations\n\n    /** [lock held] Walk the chain. The cached int hash is compared first, so equals runs at most once per bucket. */\n    Entry&lt;K, V&gt; findLocked(K key, int hash) {\n        for (Entry&lt;K, V&gt; e = table[indexFor(hash)]; e != null; e = e.next)\n            if (e.hash == hash &amp;&amp; e.key.equals(key)) return e;\n        return null;\n    }\n\n    /** [lock held] The value under this key, or null. */\n    V getLocked(K key, int hash) {\n        Entry&lt;K, V&gt; e = findLocked(key, hash);\n        return e == null ? null : e.value;\n    }\n\n    /**\n     * [lock held] Insert or overwrite. The ORDER is the design: the node is built pointing at the current head and\n     * published with one reference write, and only THEN is the volatile count raised. A size() running without any\n     * lock therefore never counts an entry it could not have found.\n     */\n    V putLocked(K key, int hash, V value) {\n        int i = indexFor(hash);\n        for (Entry&lt;K, V&gt; e = table[i]; e != null; e = e.next)\n            if (e.hash == hash &amp;&amp; e.key.equals(key)) { V old = e.value; e.value = value; return old; }\n        table[i] = new Entry&lt;&gt;(key, hash, value, table[i]);\n        count = count + 1;\n        if (count &gt; threshold) resize();\n        return null;\n    }\n\n    /** [lock held] Unlink the node from its chain and lower the count. Returns the value it held, or null. */\n    V removeLocked(K key, int hash) {\n        int i = indexFor(hash);\n        Entry&lt;K, V&gt; prev = null;\n        for (Entry&lt;K, V&gt; e = table[i]; e != null; prev = e, e = e.next)\n            if (e.hash == hash &amp;&amp; e.key.equals(key)) {\n                if (prev == null) table[i] = e.next; else prev.next = e.next;\n                count = count - 1;\n                return e.value;\n            }\n        return null;\n    }\n\n    /** [lock held] Copy every entry of this stripe into the sink. Used by the map&#x27;s snapshot. */\n    void copyInto(Map&lt;K, V&gt; sink) {\n        for (Entry&lt;K, V&gt; head : table)\n            for (Entry&lt;K, V&gt; e = head; e != null; e = e.next) sink.put(e.key, e.value);\n    }\n\n    /** [lock held] Drop everything in this stripe. */\n    void clearLocked() {\n        table = newTable(16);\n        threshold = (int) (16 * loadFactor);\n        count = 0;\n    }\n\n    /**\n     * [lock held] Double the bucket array and rehash every chain into it, then swap the table in ONE reference\n     * write. The whole rehash happens under this stripe&#x27;s lock, so no thread can be walking a chain while its nodes\n     * are being relinked -- that is precisely why get() takes the lock in this version, and precisely what a\n     * lock-free read would have to pay for (see rung 3 of the ladder).\n     */\n    private void resize() {\n        Entry&lt;K, V&gt;[] old = table;\n        int cap = old.length &lt;&lt; 1;\n        if (cap &lt;= 0) return;                       // 2^30 buckets is the ceiling; refuse to overflow the int\n        Entry&lt;K, V&gt;[] fresh = newTable(cap);\n        for (Entry&lt;K, V&gt; head : old)\n            for (Entry&lt;K, V&gt; e = head; e != null; ) {\n                Entry&lt;K, V&gt; next = e.next;\n                int i = e.hash &amp; (cap - 1);\n                e.next = fresh[i];\n                fresh[i] = e;\n                e = next;\n            }\n        table = fresh;\n        threshold = (int) (cap * loadFactor);\n    }\n}\n\n/**\n * The aggregate root, and mostly a router: it owns a power-of-two array of stripes, spreads a key&#x27;s hash once,\n * picks the stripe with the HIGH bits and hands the whole hash to that stripe, which picks a bucket with the LOW\n * bits. Two bit ranges, so the stripe choice and the bucket choice never correlate.\n *\n * The invariant: a key lives in exactly one stripe, and every read-modify-write on that key happens inside one\n * hold of that stripe&#x27;s lock. No update is ever lost, and no reader ever sees a half-built chain.\n */\nfinal class StripedMap&lt;K, V&gt; implements KeyValueStore&lt;K, V&gt; {\n    private final Segment&lt;K, V&gt;[] segments;\n    private final int segMask;\n    private final int segShift;\n    /** Handed in, never built here after construction. Volatile so a late configure() is at least visible. */\n    private volatile Hasher hasher = new SpreadHasher();\n    private volatile Clock clock = System::currentTimeMillis;\n    private final List&lt;MapObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n\n    /** A map with at least this many stripes, rounded UP to a power of two so the stripe choice is a mask, not a modulo. */\n    StripedMap(int stripes) { this(stripes, 16, 0.75f); }\n\n    /** The full form: stripe count, the bucket array each stripe starts with, and the load factor that triggers its resize. */\n    @SuppressWarnings(&quot;unchecked&quot;)\n    StripedMap(int stripes, int bucketsPerStripe, float loadFactor) {\n        int n = tableSizeFor(stripes);\n        this.segMask = n - 1;\n        this.segShift = 32 - Integer.numberOfTrailingZeros(n);\n        this.segments = (Segment&lt;K, V&gt;[]) new Segment[n];\n        int buckets = tableSizeFor(bucketsPerStripe);\n        for (int i = 0; i &lt; n; i++) this.segments[i] = new Segment&lt;&gt;(buckets, loadFactor);\n    }\n\n    /** Hand in the two rules the map must not build for itself: how to spread a hash, and where time comes from. */\n    void configure(Hasher hasher, Clock clock) {\n        this.hasher = Objects.requireNonNull(hasher);\n        this.clock = Objects.requireNonNull(clock);\n    }\n\n    /** Register a listener. It is called after the lock is released, so it can be as slow as it likes. */\n    void addObserver(MapObserver o) { observers.add(o); }\n\n    /** Round up to the next power of two, so a mask can replace a modulo everywhere. 17 stripes becomes 32. */\n    static int tableSizeFor(int c) {\n        int n = -1 &gt;&gt;&gt; Integer.numberOfLeadingZeros(Math.max(1, c) - 1);\n        return (n &lt; 0) ? 1 : (n &gt;= 1 &lt;&lt; 30) ? 1 &lt;&lt; 30 : n + 1;\n    }\n\n    /** The spread hash of a key. Null keys are refused here, once, so no stripe has to think about them. */\n    private int hashOf(K key) {\n        Objects.requireNonNull(key, &quot;null keys are not allowed: get() could not tell absent from null&quot;);\n        return hasher.spread(key.hashCode());\n    }\n\n    /** The stripe index for a spread hash: the top bits, masked. Decorrelated from the bucket, which uses the low bits. */\n    int stripeIndex(int hash) { return (hash &gt;&gt;&gt; segShift) &amp; segMask; }\n\n    /** Which stripe a key lands in. Public for the demo, the tests and the pictures on page 02. */\n    int stripeOf(K key) { return stripeIndex(hashOf(key)); }\n\n    /** How many stripes this map has: the rounded-up power of two, not necessarily what was asked for. */\n    int stripeCount() { return segments.length; }\n\n    /** How many times any thread arrived at a stripe that was already held. Summed across stripes. */\n    long waitCount() { long n = 0; for (Segment&lt;K, V&gt; s : segments) n += s.waitCount(); return n; }\n\n    /** Entries per stripe right now: the histogram that tells you whether the hasher is doing its job. */\n    int[] stripeSizes() {\n        int[] out = new int[segments.length];\n        for (int i = 0; i &lt; segments.length; i++) out[i] = segments[i].size();\n        return out;\n    }\n\n    /** How many buckets one stripe has grown to. Each stripe resizes on its own, so these can differ. */\n    int bucketsIn(int stripe) { return segments[stripe].capacity(); }\n\n    // ---- the single-key operations: spread once, route once, one stripe lock, then tell the listeners\n\n    public V get(K key) { int h = hashOf(key); return segments[stripeIndex(h)].get(key, h); }\n\n    public V put(K key, V value) {\n        Objects.requireNonNull(value, &quot;null values are not allowed: get() could not tell absent from null&quot;);\n        int h = hashOf(key), i = stripeIndex(h);\n        V old = segments[i].put(key, h, value);\n        publish(&quot;put&quot;, key, i);\n        return old;\n    }\n\n    public V putIfAbsent(K key, V value) {\n        Objects.requireNonNull(value);\n        int h = hashOf(key), i = stripeIndex(h);\n        V won = segments[i].putIfAbsent(key, h, value);\n        if (won == null) publish(&quot;put&quot;, key, i);\n        return won;\n    }\n\n    public V remove(K key) {\n        int h = hashOf(key), i = stripeIndex(h);\n        V gone = segments[i].remove(key, h);\n        if (gone != null) publish(&quot;remove&quot;, key, i);\n        return gone;\n    }\n\n    public boolean replace(K key, V expected, V updated) {\n        Objects.requireNonNull(updated);\n        int h = hashOf(key), i = stripeIndex(h);\n        boolean done = segments[i].replace(key, h, expected, updated);\n        if (done) publish(&quot;replace&quot;, key, i);\n        return done;\n    }\n\n    public V merge(K key, V value, BinaryOperator&lt;V&gt; remap) {\n        Objects.requireNonNull(value);\n        int h = hashOf(key), i = stripeIndex(h);\n        V now = segments[i].merge(key, h, value, remap);\n        publish(&quot;merge&quot;, key, i);\n        return now;\n    }\n\n    public V compute(K key, BiFunction&lt;? super K, ? super V, ? extends V&gt; remap) {\n        int h = hashOf(key), i = stripeIndex(h);\n        V now = segments[i].compute(key, h, remap);\n        publish(&quot;compute&quot;, key, i);\n        return now;\n    }\n\n    public V computeIfAbsent(K key, Function&lt;? super K, ? extends V&gt; loader) {\n        int h = hashOf(key), i = stripeIndex(h);\n        V v = segments[i].computeIfAbsent(key, h, loader);\n        publish(&quot;compute&quot;, key, i);\n        return v;\n    }\n\n    /** Weakly consistent: a sum of volatile counters taken with no lock, so it can miss a write that lands mid-sum. */\n    public int size() {\n        long n = 0;\n        for (Segment&lt;K, V&gt; s : segments) n += s.size();\n        return (int) Math.min(n, Integer.MAX_VALUE);\n    }\n\n    // ---- the all-stripe operations: every lock, in index order, with a budget\n\n    /**\n     * The exact count, taken with every stripe lock held so no write can slip between two of the counters. Returns\n     * -1 when the budget ran out: an exact size fights the whole map, and a monitoring call must never be the thing\n     * that stops it. The order is stripe 0, 1, 2 ... always, which is what makes a deadlock impossible.\n     */\n    int exactSize(long budgetMs) {\n        if (!lockAll(budgetMs)) return -1;\n        try {\n            int n = 0;\n            for (Segment&lt;K, V&gt; s : segments) n += s.size();\n            return n;\n        } finally { unlockAll(segments.length); }\n    }\n\n    /** A frozen copy of the whole map, taken with every lock held. Null when the budget ran out. O(n): say so out loud. */\n    Map&lt;K, V&gt; snapshot(long budgetMs) {\n        if (!lockAll(budgetMs)) return null;\n        try {\n            Map&lt;K, V&gt; out = new LinkedHashMap&lt;&gt;();\n            for (Segment&lt;K, V&gt; s : segments) s.copyInto(out);\n            return out;\n        } finally { unlockAll(segments.length); }\n    }\n\n    /** A copy of ONE stripe, under just that stripe&#x27;s lock: the unit a weakly-consistent iterator walks. */\n    Map&lt;K, V&gt; stripeSnapshot(int stripe) {\n        Segment&lt;K, V&gt; s = segments[stripe];\n        s.lock.lock();\n        try { Map&lt;K, V&gt; out = new LinkedHashMap&lt;&gt;(); s.copyInto(out); return out; }\n        finally { s.lock.unlock(); }\n    }\n\n    /**\n     * A copy taken one stripe at a time. It reflects writes that land while it runs, so it is NOT a frozen moment\n     * -- but it holds one lock at a time, never blocks the whole map, and cannot throw\n     * ConcurrentModificationException, because it copies instead of iterating live state.\n     */\n    Map&lt;K, V&gt; weakSnapshot() {\n        Map&lt;K, V&gt; out = new LinkedHashMap&lt;&gt;();\n        for (Segment&lt;K, V&gt; s : segments) {\n            s.lock.lock();\n            try { s.copyInto(out); } finally { s.lock.unlock(); }\n        }\n        return out;\n    }\n\n    /** Empty every stripe, with all locks held so nobody sees the map half-empty. False when the budget ran out. */\n    boolean clear(long budgetMs) {\n        if (!lockAll(budgetMs)) return false;\n        try { for (Segment&lt;K, V&gt; s : segments) s.clearLocked(); return true; }\n        finally { unlockAll(segments.length); }\n    }\n\n    /**\n     * Move a value from one key to another as ONE atomic step, even when the two keys live in different stripes.\n     * The ORDER is the whole answer: always take the lower stripe index first. Two threads moving in opposite\n     * directions then ask for the same lock first, so one of them waits instead of both holding half of what the\n     * other needs. Taking them &quot;naturally&quot; -- source first, destination second -- deadlocks within seconds.\n     */\n    boolean moveValue(K from, K to) {\n        int hf = hashOf(from), ht = hashOf(to);\n        int i = stripeIndex(hf), j = stripeIndex(ht);\n        int first = Math.min(i, j), second = Math.max(i, j);\n        segments[first].lock.lock();\n        if (second != first) segments[second].lock.lock();\n        try {\n            V v = segments[i].getLocked(from, hf);\n            if (v == null) return false;\n            segments[i].removeLocked(from, hf);\n            segments[j].putLocked(to, ht, v);\n            return true;\n        } finally {\n            if (second != first) segments[second].lock.unlock();\n            segments[first].lock.unlock();\n        }\n    }\n\n    /** Every stripe lock, in index order, inside a deadline taken from the injected clock. All or nothing. */\n    private boolean lockAll(long budgetMs) {\n        long deadline = clock.nowMs() + budgetMs;\n        int held = 0;\n        try {\n            for (int i = 0; i &lt; segments.length; i++) {\n                long left = deadline - clock.nowMs();\n                if (left &lt;= 0 || !segments[i].lock.tryLock(left, TimeUnit.MILLISECONDS)) { unlockAll(held); return false; }\n                held++;\n            }\n        } catch (InterruptedException e) {\n            unlockAll(held);\n            Thread.currentThread().interrupt();\n            return false;\n        }\n        return true;\n    }\n\n    /** Release the first `held` stripe locks in reverse order. */\n    private void unlockAll(int held) { for (int i = held - 1; i &gt;= 0; i--) segments[i].lock.unlock(); }\n\n    /** Tell the listeners, AFTER the lock is gone and inside a try/catch: a broken listener cannot break a write. */\n    private void publish(String op, K key, int stripe) {\n        if (observers.isEmpty()) return;\n        long at = clock.nowMs();\n        for (MapObserver o : observers) {\n            try { o.onWrite(op, key, stripe, at); } catch (RuntimeException ignored) { }\n        }\n    }\n}\n\n/**\n * A demo and a race. The demo shows one thread&#x27;s view: routing, chaining, growth. The race shows the two claims\n * that matter -- a read-modify-write inside one lock hold never loses an increment, and writers on different\n * stripes really do run at the same time -- and the arithmetic behind the ladder on page 02, move 8.\n */\npublic class Main {\n    /** Everything this page claims, run once and printed. */\n    public static void main(String[] args) throws Exception {\n        oneThread();\n        theLostUpdate();\n        theRace();\n        theArithmetic();\n    }\n\n    /** Claim 1: a key routes to exactly one stripe, collisions chain, and a stripe that fills up grows by itself. */\n    static void oneThread() {\n        StripedMap&lt;String, Integer&gt; map = new StripedMap&lt;&gt;(16);\n        map.put(&quot;alice&quot;, 1);\n        map.put(&quot;bob&quot;, 2);\n        map.put(&quot;carol&quot;, 3);\n        System.out.println(&quot;get(bob)=&quot; + map.get(&quot;bob&quot;) + &quot;  stripes: alice-&gt;&quot; + map.stripeOf(&quot;alice&quot;)\n            + &quot; bob-&gt;&quot; + map.stripeOf(&quot;bob&quot;) + &quot; carol-&gt;&quot; + map.stripeOf(&quot;carol&quot;) + &quot; of &quot; + map.stripeCount());\n        System.out.println(&quot;removed bob=&quot; + map.remove(&quot;bob&quot;) + &quot;, get(bob) is now &quot; + map.get(&quot;bob&quot;)\n            + &quot;, size=&quot; + map.size());\n        map.merge(&quot;hits&quot;, 1,

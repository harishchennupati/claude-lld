finally { lock.unlock(); } }\n\n    /** Compare-and-set on a value. The compare and the set are one hold: this is what makes it a CAS and not a race. */\n    boolean replace(K key, int hash, V expected, V updated) {\n        acquire();\n        try {\n            Entry<K, V> e = findLocked(key, hash);\n            if (e == null || !e.value.equals(expected)) return false;\n            e.value = updated;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * The read-modify-write that the whole design exists for. The caller's remap function runs INSIDE the one lock\n     * hold, between the read and the write, so no other thread can slip an update in between and have it overwritten.\n     * If remap throws, nothing has been written yet and the map is exactly as it was.\n     */\n    V merge(K key, int hash, V value, BinaryOperator<V> remap) {\n        acquire();\n        try {\n            Entry<K, V> e = findLocked(key, hash);\n            if (e == null) { putLocked(key, hash, value); return value; }\n            V merged = remap.apply(e.value, value);\n            if (merged == null) { removeLocked(key, hash); return null; }\n            e.value = merged;\n            return merged;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * The general form of merge: the caller's function sees the key and whatever is there (null when absent), and\n     * whatever it returns is stored -- or the key is removed when it returns null. One hold, so a durable store can\n     * append to its log inside this same hold and know the map and the log can never disagree.\n     */\n    V compute(K key, int hash, BiFunction<? super K, ? super V, ? extends V> remap) {\n        acquire();\n        try {\n            Entry<K, V> e = findLocked(key, hash);\n            V made = remap.apply(key, e == null ? null : e.value);\n            if (made == null) { if (e != null) removeLocked(key, hash); return null; }\n            if (e != null) { e.value = made; return made; }\n            putLocked(key, hash, made);\n            return made;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * Load on miss with the loader inside the lock, which is what buys \"called exactly once per key\": the second\n     * caller blocks on the stripe, and by the time it gets in the entry is there. The price is honest and worth\n     * saying out loud -- a slow loader holds up every other key in this stripe.\n     */\n    V computeIfAbsent(K key, int hash, Function<? super K, ? extends V> loader) {\n        acquire();\n        try {\n            Entry<K, V> e = findLocked(key, hash);\n            if (e != null) return e.value;\n            V made = loader.apply(key);\n            if (made == null) return null;\n            putLocked(key, hash, made);\n            return made;\n        } finally { lock.unlock(); }\n    }\n\n    /** Entries held right now. A plain volatile read: no lock, so size() cannot be the thing that stops the map. */\n    int size() { return count; }\n\n    /** Buckets in this stripe's array right now. Grows on resize; useful only for the demo and the tests. */\n    int capacity() { lock.lock(); try { return table.length; } finally { lock.unlock(); } }\n\n    /** How many times a thread arrived to find this stripe busy. */\n    long waitCount() { return waits.sum(); }\n\n    // ---- [lock held] the same work, without taking the lock: for the map's two-stripe and all-stripe operations\n\n    /** [lock held] Walk the chain. The cached int hash is compared first, so equals runs at most once per bucket. */\n    Entry<K, V> findLocked(K key, int hash) {\n        for (Entry<K, V> e = table[indexFor(hash)]; e != null; e = e.next)\n            if (e.hash == hash && e.key.equals(key)) return e;\n        return null;\n    }\n\n    /** [lock held] The value under this key, or null. */\n    V getLocked(K key, int hash) {\n        Entry<K, V> e = findLocked(key, hash);\n        return e == null ? null : e.value;\n    }\n\n    /**\n     * [lock held] Insert or overwrite. The ORDER is the design: the node is built pointing at the current head and\n     * published with one reference write, and only THEN is the volatile count raised. A size() running without any\n     * lock therefore never counts an entry it could not have found.\n     */\n    V putLocked(K key, int hash, V value) {\n        int i = indexFor(hash);\n        for (Entry<K, V> e = table[i]; e != null; e = e.next)\n            if (e.hash == hash && e.key.equals(key)) { V old = e.value; e.value = value; return old; }\n        table[i] = new Entry<>(key, hash, value, table[i]);\n        count = count + 1;\n        if (count > threshold) resize();\n        return null;\n    }\n\n    /** [lock held] Unlink the node from its chain and lower the count. Returns the value it held, or null. */\n    V removeLocked(K key, int hash) {\n        int i = indexFor(hash);\n        Entry<K, V> prev = null;\n        for (Entry<K, V> e = table[i]; e != null; prev = e, e = e.next)\n            if (e.hash == hash && e.key.equals(key)) {\n                if (prev == null) table[i] = e.next; else prev.next = e.next;\n                count = count - 1;\n                return e.value;\n            }\n        return null;\n    }\n\n    /** [lock held] Copy every entry of this stripe into the sink. Used by the map's snapshot. */\n    void copyInto(Map<K, V> sink) {\n        for (Entry<K, V> head : table)\n            for (Entry<K, V> e = head; e != null; e = e.next) sink.put(e.key, e.value);\n    }\n\n    /** [lock held] Drop everything in this stripe. */\n    void clearLocked() {\n        table = newTable(16);\n        threshold = (int) (16 * loadFactor);\n        count = 0;\n    }\n\n    /**\n     * [lock held] Double the bucket array and rehash every chain into it, then swap the table in ONE reference\n     * write. The whole rehash happens under this stripe's lock, so no thread can be walking a chain while its nodes\n     * are being eturn stripeIndex(hashOf(key)); }\n\n    /** How many stripes this map has: the rounded-up power of two, not necessarily what was asked for. */\n    int stripeCount() { return segments.length; }\n\n    /** How many times any thread arrived at a stripe that was already held. Summed across stripes. */\n    long waitCount() { long n = 0; for (Segment<K, V> s : segments) n += s.waitCount(); return n; }\n\n    /** Entries per stripe right now: the histogram that tells you whether the hasher is doing its job. */\n    int[] stripeSizes() {\n        int[] out = new int[segments.length];\n        for (int i = 0; i < segments.length; i++) out[i] = segments[i].size();\n        return out;\n    }\n\n    /** How many buckets one stripe has grown to. Each stripe resizes on its own, so these can differ. */\n    int bucketsIn(int stripe) { return segments[stripe].capacity(); }\n\n    // ---- the single-key operations: spread once, route once, one stripe lock, then tell the listeners\n\n    public V get(K key) { int h = hashOf(key); return segments[stripeIndex(h)].get(key, h); }\n\n    public V put(K key, V value) {\n        Objects.requireNonNull(value, \"null values are not allowed: get() could not tell absent from null\");\n        int h = hashOf(key), i = stripeIndex(h);\n        V old = segments[i].put(key, h, value);\n        publish(\"put\", key, i);\n        return old;\n    }\n\n    public V putIfAbsent(K key, V value) {\n        Objects.requireNonNull(value);\n        int h = hashOf(key), i = stripeIndex(h);\n        V won = segments[i].putIfAbsent(key, h, value);\n        if (won == null) publish(\"put\", key, i);\n        return won;\n    }\n\n    public V remove(K key) {\n        int h = hashOf(key), i = stripeIndex(h);\n        V gone = segments[i].remove(key, h);\n        if (gone != null) publish(\"remove\", key, i);\n        return gone;\n    }\n\n    public boolean replace(K key, V expected, V updated) {\n        Objects.requireNonNull(updated);\n        int h = ha le map, taken with every lock held. Null when the budget ran out. O(n): say so out loud. */\n    Map<K, V> snapshot(long budgetMs) {\n        if (!lockAll(budgetMs)) return null;\n        try {\n            Map<K, V> out = new LinkedHashMap<>();\n            for (Segment<K, V> s : segments) s.copyInto(out);\n            return out;\n        } finally { unlockAll(segments.length); }\n    }\n\n    /** A copy of ONE stripe, under just that stripe's lock: the unit a weakly-consistent iterator walks. */\n    Map<K, V> stripeSnapshot(int stripe) {\n        Segment<K, V> s = segments[stripe];\n        s.lock.lock();\n        try { Map<K, V> out = new LinkedHashMap<>(); s.copyInto(out); return out; }\n        finally { s.lock.unlock(); }\n    }\n\n    /**\n     * A copy taken one stripe at a time. It reflects writes that land while it runs, so it is NOT a frozen moment\n     * -- but it holds one lock at a time, never blocks the whole map, and cannot throw\n     * ConcurrentModificationException, because it copies instead of iterating live state.\n     */\n    Map<K, V> weakSnapshot() {\n        Map<K, V> out = new LinkedHashMap<>();\n        for (Segment<K, V> s : segments) {\n            s.lock.lock();\n            try { s.copyInto(out); } finally { s.lock.unlock(); }\n        }\n        return out;\n    }\n\n    /** Empty every stripe, with all locks held so nobody sees the map half-empty. False when the budget ran out. */\n    boolean clear(long budgetMs) {\n        if (!lockAll(budgetMs)) return false;\n        try { for (Segment<K, V> s : segments) s.clearLocked(); return true; }\n        finally { unlockAll(segments.length); }\n    }\n\n    /**\n     * Move a value from one key to another as ONE atomic step, even when the two keys live in different stripes.\n     * The ORDER is the whole answer: always take the lower stripe index first. Two threads moving in opposite\n     * directions then ask for the same lock first, so one of them waits instead of both holding half of what the\n     * other needs. Taking them \"naturally\" -- source first, destination second -- deadlocks within seconds.\n     */\n    boolean moveValue(K from, K to) {\n        int hf = hashOf(from), ht = hashOf(to);\n        int i = stripeIndex(hf), j = stripeIndex(ht);\n        int first = Math.min(i, j), second = Math.max(i, j);\n        segments[first].lock.lock();\n        if (second != first) segments[second].lock.lock();\n        try {\n            V v = segments[i].getLocked(from, hf);\n            if (v == null) return false;\n            segments[i].removeLocked(from, hf);\n            segments[j].putLocked(to, ht, v);\n            return true;\n        } finally {\n            if (second != first) segments[second].lock.unlock();\n            segments[first].lock.unlock();\n        }\n    }\n\n    /** Every stripe lock, in index order, inside a deadline taken from the injected clock. All or nothing. */\n    private boolean lockAll(long budgetMs) {\n        long deadline = clock.nowMs() + budgetMs;\n        int held = 0;\n        try {\n            for (int i = 0; i < segments.length; i++) {\n                long left = deadline - clock.nowMs();\n                if (left <= 0 || !segments[i].lock.tryLock(left, TimeUnit.MILLISECONDS)) { unlockAll(held); return false; }\n                held++;\n            }\n        } catch (InterruptedException e) {\n            unlockAll(held);\n            Thread.currentThread().interrupt();\n            return false;\n        }\n        return true;\n    }\n\n    /** Release the first `held` stripe locks in reverse order. */\n    private void unlockAll(int held) { for (int i = held - 1; i >= 0; i--) segments[i].lock.unlock(); }\n\n    /** Tell the listeners, AFTER the lock is gone and inside a try/catch: a broken listener cannot break a write. */\n    private void publish(String op, K key, int stripe) {\n        if (observers.isEmpty()) return;\n        long at = clock.nowMs();\n        for (MapObserver o : observ     StripedMap<String, Integer> map = new StripedMap<>(stripes);\n            long ms = timed(THREADS, PER, keys, vals, map, 0);\n            System.out.printf(\"   %3d stripe(s): %5d ms   %4d ns per write%n\",\n                map.stripeCount(), ms, ms * 1_000_000 / (THREADS * PER));\n        }\n\n        final int SLOW_PER = 20_000, SLOW_TOTAL = THREADS * SLOW_PER;\n        System.out.println(\"B. the same, with real work INSIDE the lock (a loader, a big value, a listener):\");\n        long oneStripeMs = 0;\n        for (int stripes : new int[] { 1, 4, 16, 64 }) {\n            StripedMap<String, Integer> map = new StripedMap<>(stripes);\n            long ms = timed(THREADS, SLOW_PER, keys, vals, map, 2200);\n            if (stripes == 1) oneStripeMs = ms;\n            System.out.printf(\"   %3d stripe(s): %5d ms   %,d writes/second   %.1fx the one-lock version%n\",\n                map.stripeCount(), ms, ms == 0 ? 0 : (long) SLOW_TOTAL * 1000 / ms, oneStripeMs / (double) ms);\n        }\n        System.out.println(\"   one lock serialises everything, so its time / writes IS the critical section: \"\n            + (oneStripeMs * 1_000_000 / SLOW_TOTAL) + \" ns of work held the whole map\");\n\n        StripedMap<String, Integer> solo = new StripedMap<>(16);\n        long t0 = System.nanoTime();\n        for (int i = 0; i < 2_000_000; i++) solo.put(keys[i & 0xffff], vals[i & 0xff]);\n        long put = (System.nanoTime() - t0) / 2_000_000;\n        t0 = System.nanoTime();\n        for (int i = 0; i < 2_000_000; i++) solo.get(keys[i & 0xffff]);\n        long get = (System.nanoTime() - t0) / 2_000_000;\n        System.out.println(\"C. one thread, nobody to contend with: \" + put + \" ns per put, \" + get\n            + \" ns per get -- that is all that is inside the lock in part A\");\n    }\n\n    /** Run one write loop on N threads released together, and return the wall time in milliseconds. */\n    static long timed(int threads, int per, String[] keys, Integer[] v ction, or a wrapper around the interface both\n * sides already depend on. That is the test that the derivation on page 02 was right.\n */\n\n// ---- ext: the naive spreader, and the histogram that catches it in thirty seconds\n/**\n * What java.util.HashMap does: fold the high sixteen bits down onto the low ones. Perfectly good there, because\n * HashMap only ever uses the LOW bits. Here it is a trap: this map picks a stripe from the HIGH bits, and a fold\n * leaves those untouched, so every sequential Integer key keeps its all-zero top bits and lands in stripe 0.\n */\nfinal class FoldOnlyHasher implements Hasher {\n    /** No multiply, so no avalanche: bit 31 of the output is still bit 31 of the input. */\n    public int spread(int hashCode) { return hashCode ^ (hashCode >>> 16); }\n}\n\n/** The histogram that turns \"I think the keys are spread\" into a number you can read in one line. */\nfinal class Histogram {\n    /** min..max entries per stripe, and how many stripes got nothing at all. */\n    static String of(int[] sizes) {\n        int min = Integer.MAX_VALUE, max = 0, empty = 0;\n        for (int s : sizes) { min = Math.min(min, s); max = Math.max(max, s); if (s == 0) empty++; }\n        return sizes.length + \" stripes hold \" + min + \"..\" + max + \" entries each, \" + empty + \" of them empty\";\n    }\n}\n\n// ---- ext: force every key into one stripe -- the worst case, on purpose, so a test can measure it\n/**\n * Every key to stripe 0. Not a bug: the deliberate worst case. A map that is still correct under this -- right\n * answers, chains that grow, a stripe that resizes itself -- is correct under any hashCode anybody hands you.\n */\nfinal class OneStripeHasher implements Hasher {\n    /** Constant, so the stripe bits and the bucket bits are both constant and every key collides. */\n    public int spread(int hashCode) { return 0; }\n}\n\n// ---- ext: measure without touching the map -- a Decorator over the interface both sides already depend on\ -- a queue of threads parked\n * on that stripe -- and four rules come with it. Every one of them is a bug if you skip it.\n *\n * 1. CHECK UNDER THE LOCK. Look for the key while holding the stripe, not before taking it. Check outside and the\n *    value can arrive in the gap between your look and your await, taking the signal with it: you then wait for an\n *    announcement that has already been made. That is a LOST WAKEUP, and it is a hang, not a slowdown.\n * 2. WAIT IN A WHILE LOOP, never an if. await() is allowed to return with nobody having signalled at all -- a\n *    SPURIOUS WAKEUP -- and even after a real signal another waiter may have taken the value first. The loop\n *    re-checks the thing you actually care about, so neither case can fool you.\n * 3. SIGNAL AFTER THE CHANGE, STILL HOLDING THE LOCK. signalAll() only moves threads from the condition queue to\n *    the lock queue, so it is cheap and Java requires the lock to be held for it. Note the contrast with the\n *    observer in StripedMap: a listener is arbitrary user code and must be called AFTER the unlock; a signal is\n *    two pointer moves and must be called BEFORE it.\n * 4. CARRY A DEADLINE, NOT A FRESH TIMEOUT. awaitNanos returns how much of the budget is LEFT; feeding that back\n *    into the loop is what stops a thread waiting forever in a series of short naps.\n *\n * And lockInterruptibly at the door, so a cancelled request is not stuck waiting for permission to start waiting.\n */\nfinal class WaitableMap<K, V> {\n    /** One stripe: its lock, the queue of threads waiting on it, and the entries. */\n    private static final class Cell<K, V> {\n        final ReentrantLock lock = new ReentrantLock();\n        final Condition changed = lock.newCondition();\n        final Map<K, V> data = new HashMap<>();\n    }\n\n    private final Cell<K, V>[] cells;\n    private final int mask, shift;\n    private final Hasher hasher;\n\n    /** The same routing as every other map here: a power-of-two stripe count, chosen by the high bits. */\n    @SuppressWarnings(\"unchecked\")\n    WaitableMap(int stripeCount, Hasher hasher) {\n        int n = StripedMap.tableSizeFor(stripeCount);\n        this.mask = n - 1;\n        this.shift = 32 - Integer.numberOfTrailingZeros(n);\n        this.hasher = hasher;\n        this.cells = (Cell<K, V>[]) new Cell[n];\n        for (int i = 0; i < n; i++) this.cells[i] = new Cell<>();\n    }\n\n    private Cell<K, V> cellFor(K key) { int h = hasher.spread(key.hashCode()); return cells[(h >>> shift) & mask]; }\n\n    /** Store, then wake everybody parked on this stripe -- inside the lock, after the change. Rule 3. */\n    V put(K key, V value) {\n        Cell<K, V> c = cellFor(key);\n        c.lock.lock();\n        try {\n            V old = c.data.put(key, value);\n            c.changed.signalAll();                      // cheap: it only re-queues threads, it does not run them\n            return old;\n        } finally { c.lock.unlock(); }\n    }\n\n    /** The value right now, or null. No waiting. */\n    V get(K key) {\n        Cell<K, V> c = cellFor(key);\n        c.lock.lock();\n        try { return c.data.get(key); } finally { c.lock.unlock(); }\n    }\n\n    /**\n     * The value under this key, waiting up to timeoutMs for it to appear. Returns null when the budget ran out.\n     * Throws InterruptedException the moment the caller is cancelled, whether it is queued for the lock or parked\n     * on the condition. All four rules above are visible in these eight lines.\n     */\n    V awaitValue(K key, long timeoutMs) throws InterruptedException {\n        Cell<K, V> c = cellFor(key);\n        c.lock.lockInterruptibly();                     // cancellable even before the wait starts\n        try {\n            long left = TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n            V v;\n            while ((v = c.data.get(key)) == null) {     // rule 1 + rule 2: checked under the lock, in a loop\n                if (left <= 0L) return null;            // the budget is spent: say so, do not wait on\n                left = c.changed.awaitNanos(left);      // rule 4: awaitNanos hands back what remains\n            }\n            return v;\n        } finally { c.lock.unlock(); }\n    }\n\n    /** How many threads are parked on this key's stripe right now. Only ever an estimate; used by the demo. */\n    int waitersOn(K key) {\n        Cell<K, V> c = cellFor(key);\n        c.lock.lock();\n        try { return c.lock.getWaitQueueLength(c.changed); } finally { c.lock.unlock(); }\n    }\n}\n\n// ---- ext: a thread stuck on a busy stripe -- cancelling it, and whether the lock is fair\n/**\n * Two questions about the thread that lost the race for a stripe.\n *\n * CAN YOU CANCEL IT? Not if you wrote lock(). ReentrantLock.lock() is uninterruptible: interrupting a thread\n * parked in it only sets a flag that the thread will notice long afterwards, once it has the lock anyway.\n * lockInterruptibly() and tryLock(timeout) both give up on demand, and the price is that every method built on\n * them must be allowed to fail. That is exactly the split in Main.java: plain lock() on the single-key path,\n * where the wait is nanoseconds and failure would be absurd, and tryLock with a deadline on the all-stripe path,\n * where the wait is unbounded and giving up is the right answer.\n *\n * CAN IT STARVE? new ReentrantLock() is UNFAIR: a thread arriving at an unlocked-but-queued lock may barge in\n * front of threads that have been waiting, and that barging is most of why it is fast. new ReentrantLock(true)\n * hands the lock out strictly in arrival order and costs a context switch per handover -- measured below, it is\n * an order of magnitude slower. On a stripe held for fifteen nanoseconds nothing starves in practice. What CAN\n * starve is an operation that needs every stripe at once, which is precisely why exactSize carries a budget and\n * returns -1 rather than promising an answer.\n */\nfinal class LockWaiting {\n    /** What one run measured: total acquisitions, and the fewest and the most any single thread got. */\n    static final class Turns {\n        final long total; final long min; final long max;\n        Turns(long total, long min, long max) { this.total = total; this.min = min; this.max = max; }\n        public String toString() { return total + \" acquisitions, the unluckiest thread got \" + min + \" and the luckiest \" + max; }\n    }\n\n    /**\n     * N threads hammering ONE lock for a fixed wall-clock window. A barging lock does far more total work; a fair\n     * lock spreads the work evenly. Both numbers matter, and you rarely get both.\n     */\n    static Turns hammer(boolean fair, int threads, long windowMs) throws InterruptedException {\n        ReentrantLock lock = new ReentrantLock(fair);\n        long[] counts = new long[threads];\n        CountDownLatch go = new CountDownLatch(1);\n        AtomicBoolean stop = new AtomicBoolean();\n        List<Thread> ts = new ArrayList<>();\n        for (int i = 0; i < threads; i++) {\n            final int id = i;\n            ts.add(new Thread(() -> {\n                try { go.await(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }\n                while (!stop.get()) {\n                    lock.lock();\n                    try { counts[id]++; } finally { lock.unlock(); }\n                }\n            }, \"hammer-\" + i));\n        }\n        ts.forEach(Thread::start);\n        go.countDown();\n        Thread.sleep(windowMs);\n        stop.set(true);\n        for (Thread t : ts) t.join(10_000);\n        long total = 0, min = Long.MAX_VALUE, max = 0;\n        for (long c : counts) { total += c; min = Math.min(min, c); max = Math.max(max, c); }\n        return new Turns(total, min, max);\n    }\n\n    /**\n     * Park a thread on a lock somebody else holds, interrupt it, and report whether it came back. With\n     * lockInterruptibly it returns immediately; with plain lock() it cannot, and only finishes when the holder\n     * lets go -- with its interrupt flag still set, which is the whole of what the interrupt achieved.\n     */\n    static String cancelWhileBlocked(boolean interruptibly) throws Exception {\n        ReentrantLock lock = new ReentrantLock();\n        CountDownLatch parked = new CountDownLatch(1), finished = new CountDownLatch(1);\n        AtomicBoolean threw = new AtomicBoolean(), flagStillSet = new AtomicBoolean();\n        lock.lock();                                     // the holder: this thread\n        Thread waiter = new Thread(() -> {\n            parked.countDown();\n            try {\n                if (interruptibly) lock.lockInterruptibly(); else lock.lock();\n                try { flagStillSet.set(Thread.currentThread().isInterrupted()); } finally { lock.unlock(); }\n            } catch (InterruptedException e) { threw.set(true); }\n            finished.countDown();\n        }, \"waiter\");\n        waiter.start();\n        parked.await(2, TimeUnit.SECONDS);\n        Thread.sleep(60);                                // let it actually reach the lock and block there\n        waiter.interrupt();\n        boolean cameBackWhileHeld = finished.await(400, TimeUnit.MILLISECONDS);\n        lock.unlock();                                   // now let it in\n        boolean done = finished.await(3, TimeUnit.SECONDS);\n        waiter.join(3_000);\n        if (!done) return \"STUCK\";\n        if (cameBackWhileHeld && threw.get()) return \"cancelled while the lock was still held\";\n        if (!cameBackWhileHeld && flagStillSet.get()) return \"waited for the holder, then finished with the interrupt flag still set\";\n        return \"finished, but not in either expected way\";\n    }\n}\n\n// ---- ext: bound the map -- a per-stripe LRU that evicts inside the write, so the bound is real\n/**\n * \"At most ten thousand entries, evict the least recently used.\" Per stripe, a LinkedHashMap in access order with\n * removeEldestEntry does the whole job -- you never write the linked list yourself -- and the eviction happens\n * inside the same write that caused it, so the bound is never exceeded even for an instant. The caveat to say out\n * loud before they say it: the bound is per stripe (total / N each), so a skewed key set evicts one stripe early\n * while others sit half empty. A global bound would need one shared counter, which is the contention you just spent\n * the whole design removing.\n */\nfinal class CappedMap<K, V> {\n    /** One stripe: an access-ordered LinkedHashMap that drops its eldest entry when it is over its share. */\n    private static final class Shard<K, V> extends LinkedHashMap<K, V> {\n        private final int max;\n        Shard(int max) { super(16, 0.75f, true); this.max = max; }\n        /** Called by LinkedHashMap after each insert, still inside our lock: true means \"drop this one\". */\n        protected boolean removeEldestEntry(Map.Entry<K, V> eldest) { return size() > max; }\n    }\n\n    private final Object[] locks;\n    private final Shard<K, V>[] shards;\n    private final int mask, shift;\n    private final Hasher hasher;\n    private final LongAdder evictions = new LongAdder();\n\n    /** Total capacity is split evenly across the stripes; at least one entry per stripe. */\n    @SuppressWarnings(\"unchecked\")\n    CappedMap(int stripes, int totalCapacity, Hasher hasher) {\n        int n = StripedMap.tableSizeFor(stripes);\n        this.mask = n - 1;\n        this.shift = 32 - Integer.numberOfTrailingZeros(n);\n        this.hasher = hasher;\n        this.locks = new Object[n];\n        this.shards = (Shard<K, V>[]) new Shard[n];\n        for (int i = 0; i < n; i++) { locks[i] = new Object(); shards[i] = new Shard<>(Math.max(1, totalCapacity / n)); }\n    }\n\n    private int indexOf(K key) { int h = hasher.spread(key.hashCode()); return (h >>> shift) & mask; }\n\n    /** A get is a write here: access order means reading an entry moves it to the young end. */\n    V get(K key) {\n        int i = indexOf(key);\n        synchronized (locks[i]) { return shards[i].get(key); }\n    }\n\n    /** Insert, and evict the eldest in the same hold if this stripe is now over its share. */\n    V put(K key, V value) {\n        int i = indexOf(key);\n        synchronized (locks[i]) {\n            int before = shards[i].size();\n            V old = shards[i].put(key, value);\n            if (shards[i].size() == before && old == null) evictions.increment();\n            return old;\n        }\n    }\n\n    /** Entries held across every stripe. */\n    int size() { int n = 0; for (int i = 0; i < shards.length; i++) synchronized (locks[i]) { n += shards[i].size(); } return n; }\n\n    /** How many entries the bound has thrown away. */\n    long evictions() { return evictions.sum(); }\n}\n\n// ---- ext: iteration that never copies the whole map -- one stripe at a time, lazily\n/**\n * A weakly-consistent iterator: it copies ONE stripe under that stripe's lock, hands those entries out, then moves\n * to the next. It therefore reflects writes that land while it is running, never freezes the map, and can never\n * throw ConcurrentModificationException, because it is walking a copy and not live state. Say \"weakly consistent\"\n * out loud -- it is the word that tells an interviewer you know this is not a snapshot.\n */\nfinal class StripeIterator<K, V> implements Iterator<Map.Entry<K, V>> {\n    private final StripedMap<K, V> map;\n    private int stripe = -1;\n    private Iterator<Map.Entry<K, V>> current = Collections.emptyIterator();\n\n    /** Start before the first stripe; nothing is copied until the first hasNext(). */\n    StripeIterator(StripedMap<K, V> map) { this.map = map; }\n\n    /** Advance stripe by stripe until one of them has an entry, or there are no stripes left. */\n    public boolean hasNext() {\n        while (!current.hasNext() && stripe + 1 < map.stripeCount())\n            current = map.stripeSnapshot(++stripe).entrySet().iterator();\n        return current.hasNext();\n    }\n\n    public Map.Entry<K, V> next() {\n        if (!hasNext()) throw new NoSuchElementException();\n        return current.next();\n    }\n}\n\n// ---- ext: surviving a restart -- an append-only log, and a conditional UPDATE so a stale writer cannot win\n/**\n * The map becomes a cache over a log. The ORDER is the design: the append -- the irreversible thing -- happens\n * inside the same stripe hold as the in-memory write, so an append that throws leaves the map exactly as it was\n * and the caller can retry. That is the one slow thing deliberately allowed inside a lock, and the stripes are\n * precisely what stops it from serialising the whole map (page 02, move 8, part B).\n *\n * For a real database the same shape is a version column: UPDATE rows SET value=?, version=version+1 WHERE key=?\n * AND version=?, and \"zero rows updated\" means somebody else got there first.\n */\nfinal class DurableMap {\n    /** A row as it would live in a table: the value plus the version that write produced. */\n    static final class Row {\n        final String value; final long version;\n        Row(String value, long version) { this.value = value; this.version = version; }\n        public String toString() { return value + \"@v\" + version; }\n    }\n\n    private final StripedMap<String, Row> memory = new StripedMap<>(16);\n    private final List<String> log = Collections.synchronizedList(new ArrayList<>());\n\n    /**\n     * Conditional write. Returns the new version, or -1 when the caller's expected version is stale. The compare,\n     * the append and the in-memory write are one hold of one stripe lock, so two writers cannot both win.\n     */\n    long put(String key, String value, long expectedVersion) {\n        long[] written = { -1 };                                      // set only on the path that actually wrote\n        memory.compute(key, (k, current) -> {\n            long have = current == null ? 0 : current.version;\n            if (have != expectedVersion) return current;              // stale: change nothing at all\n            long next = have + 1;\n            log.add(k + \"=\" + value + \"@v\" + next);                   // the irreversible step, before the commit\n            written[0] = next;\n            return new Row(value, next);\n        });\n        return written[0];\n    }\n\n    /** The value under a key, or null. */\n    Row get(String key) { return memory.get(key); }\n\n    /** How many records the log holds. */\n    int logSize() { return log.size(); }\n\n    /** Rebuild the whole map from the log after a restart: replay in order, last writer per key wins. */\n    static Map<String, Row> replay(List<String> log) {\n        Map<String, Row> out = new LinkedHashMap<>();\n        for (String line : log) {\n            int eq = line.indexOf('='), at = line.lastIndexOf(\"@v\");\n            out.put(line.substring(0, eq), new Row(line.substring(eq + 1, at), Long.parseLong(line.substring(at + 2))));\n        }\n        return out;\n    }\n\n    /** The log itself, for the replay demo. */\n    List<String> log() { return log; }\n}\n\n/** Runs every extension above, so each follow-up answer on page 05 is code that has actually executed. */\nclass ExtDemo {\n    /** Each block prints the twist and the evidence that it works. */\n    public static void main(String[] args) throws Exception {\n        // 1. the naive spreader: same map, same keys, one changed line at construction\n        StripedMap<Integer, Integer> good = new StripedMap<>(16);\n        StripedMap<Integer, Integer> bad = new StripedMap<>(16);\n        bad.configure(new FoldOnlyHasher(), System::currentTimeMillis);\n        for (int i = 0; i < 20_000; i++) { good.put(i, i); bad.put(i, i); }\n        System.out.println(\"multiply-then-fold: \" + Histogram.of(good.stripeSizes()));\n        System.out.println(\"fold only:          \" + Histogram.of(bad.stripeSizes()) + \"  <- same map, one line changed\");\n\n        // 2. the deliberate worst case: every key in one stripe. Still correct, just not parallel.\n        StripedMap<String, Integer> worst = new StripedMap<>(16);\n        worst.configure(new OneStripeHasher(), System::currentTimeMillis);\n        for (int i = 0; i < 5_000; i++) worst.put(\"k\" + i, i);\n        System.out.println(\"every key in stripe 0: size=\" + worst.size() + \", get(k4999)=\" + worst.get(\"k4999\")\n            + \", stripe 0 grew to \" + worst.bucketsIn(0) + \" buckets\");\n\n        // 3. the decorator: counting without the map knowing\n        MeteredMap<String, Integer> metered = new MeteredMap<>(new StripedMap<>(16));\n        for (int i = 0; i < 1_000; i++) metered.put(\"m\" + i, i);\n        for (int i = 0; i < 1_500; i++) metered.get(\"m\" + i);\n        System.out.println(\"metered: \" + metered.report());\n\n        // 4. the read-heavy question, three ways. Every one is warmed first, or whichever runs second gets a JIT\n        //    the first one paid for and the comparison is worthless. These numbers move 30% run to run: what is\n        //    stable is which shape wins, not the milliseconds.\n        readHeavyPlain(16); readHeavyRw(16); readHeavyLockFree(16);\n        long plainMs = readHeavyPlain(16), rwMs = readHeavyRw(16), freeMs = readHeavyLockFree(16);\n        System.out.println(\"read-heavy (95% get), 8 threads, 2,000,000 operations:\");\n        System.out.println(\"   plain lock per stripe    : \" + plainMs + \" ms\");\n        System.out.println(\"   read/write per stripe    : \" + rwMs + \" ms  <- \"\n            + String.format(\"%.1fx\", rwMs / (double) plainMs) + \" the plain lock -- SLOWER, not faster: taking a read\"\n            + \" lock is still a CAS on one shared counter, so readers in a stripe still fight over one cache line\");\n        System.out.println(\"   no lock on reads at all  : \" + freeMs + \" ms  <- \"\n            + String.format(\"%.1fx\", plainMs / (double) freeMs) + \" the plain lock. THAT is the read-heavy answer\");\n\n        // 5. the same map under a resize, read with no lock: the old table is left intact, so nobody tears\n        ReadOptimizedMap<Integer, Integer> lockFree = new ReadOptimizedMap<>(16, 16, new SpreadHasher());\n        for (int i = 0; i < 50_000; i++) lockFree.put(i, i);\n        System.out.println(\"lock-free reads: size=\" + lockFree.size() + \", get(49999)=\" + lockFree.get(49_999)\n            + \", stripe 0 grew to \" + lockFree.bucketsIn(0) + \" buckets by copying, never by relinking\");\n\n        // 6. one lock per bin: what ConcurrentHashMap became in Java 8\n        CasMap<String, Integer> cas = new CasMap<>(1 << 16);\n        String[] ck = keys();\n        for (int i = 0; i < ck.length; i++) cas.put(ck[i], i);\n        long t0 = System.nanoTime();\n        long sum = 0;\n        for (int i = 0; i < 2_000_000; i++) { Integer v = cas.get(ck[i & 0xffff]); sum += v == null ? 0 : 1; }\n        long casNs = (System.nanoTime() - t0) / 2_000_000;\n        System.out.println(\"CAS map (CHM shape): size=\" + cas.size() + \", \" + casNs\n            + \" ns per lock-free get, all found=\" + (sum == 2_000_000));\n\n        // 7. lock ordering: the same work, ordered and unordered\n        System.out.println(\"two threads, two locks, 2000 rounds each:\");\n        System.out.println(\"   ordered (lower index first): \" + LockOrdering.race(true, 2000) + \" back-offs\");\n        System.out.println(\"   natural order (the bug)    : \" + LockOrdering.race(false, 2000)\n            + \" back-offs -- each one would have been a permanent deadlock without the deadline\");\n\n        // 8. one loader call per key, with the slow load outside every lock\n        FutureLoader<String, String> loader = new FutureLoader<>(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List<Thread> ts = new ArrayList<>();\n        AtomicInteger answers = new AtomicInteger();\n        for (int i = 0; i < 32; i++) {\n            ts.add(new Thread(() -> {\n                try { go.await(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }\n                String v = loader.get(\"hot\", k -> { sleep(200); return \"loaded-\" + k; });\n                if (\"loaded-hot\".equals(v)) answers.incrementAndGet();\n            }));\n        }\n        ts.forEach(Thread::start);\n        long t1 = System.nanoTime();\n        go.countDown();\n        for (Thread t : ts) t.join(10_000);\n        System.out.println(\"32 threads missed the same key: loader ran \" + loader.loaderCalls() + \" time(s), \"\n            + answers.get() + \" got the answer, total wall time \" + (System.nanoTime() - t1) / 1_000_000\n            + \" ms (one 200 ms load, not 32)\");\n\n        // 9. the wait protocol: eight threads ask for a key that does not exist yet, one thread supplies it\n        WaitableMap<String, String> waiting = new WaitableMap<>(16, new SpreadHasher());\n        CountDownLatch asked = new CountDownLatch(8);\n        AtomicInteger got = new AtomicInteger(), gaveUp = new AtomicInteger();\n        List<Thread> waiters = new ArrayList<>();\n        for (int i = 0; i < 8; i++) {\n            waiters.add(new Thread(() -> {\n                asked.countDown();\n                try { if (waiting.awaitValue(\"late\", 3_000) != null) got.incrementAndGet(); else gaveUp.incrementAndGet(); }\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            }, \"waiter-\" + i));\n        }\n        waiters.forEach(Thread::start);\n        asked.await(2, TimeUnit.SECONDS);\n        sleep(80);\n        System.out.println(\"wait protocol: \" + waiting.waitersOn(\"late\") + \" threads parked on the condition\");\n        waiting.put(\"late\", \"here at last\");\n        for (Thread t : waiters) t.join(5_000);\n        long t2 = System.nanoTime();\n        String none = waiting.awaitValue(\"never\", 150);\n        System.out.println(\"   one signalAll woke all of them: \" + got.get() + \" got the value, \" + gaveUp.get()\n            + \" gave up; a wait for a key that never arrives returned \" + none + \" after \"\n            + (System.nanoTime() - t2) / 1_000_000 + \" ms instead of hanging\");\n\n        // 10. cancellation and fairness: what happens to the thread that lost the race for a stripe\n        System.out.println(\"a thread blocked on a lock somebody else holds:\");\n        System.out.println(\"   lockInterruptibly(): \" + LockWaiting.cancelWhileBlocked(true));\n        System.out.println(\"   plain lock()       : \" + LockWaiting.cancelWhileBlocked(false));\n        LockWaiting.Turns barging = LockWaiting.hammer(false, 4, 250);\n        LockWaiting.Turns fair = LockWaiting.hammer(true, 4, 250);\n        System.out.println(\"4 threads, one lock, 250 ms each:\");\n        System.out.println(\"   unfair (the default): \" + barging);\n        System.out.println(\"   fair                : \" + fair + \"  <- even, and \"\n            + (barging.total / Math.max(1, fair.total)) + \"x less total work done\");\n\n        // 11. the bound, with eviction inside the write\n        CappedMap<Integer, Integer> capped = new CappedMap<>(16, 10_000, new SpreadHasher());\n        for (int i = 0; i < 100_000; i++) capped.put(i, i);\n        System.out.println(\"capped at 10,000: size=\" + capped.size() + \" after 100,000 puts, \"\n            + capped.evictions() + \" evicted; the newest key is still there: \" + capped.get(99_999));\n\n        // 12. weakly-consistent iteration while a writer runs\n        StripedMap<Integer, Integer> live = new StripedMap<>(16);\n        for (int i = 0; i < 10_000; i++) live.put(i, i);\n        Thread writer = new Thread(() -> { for (int i = 10_000; i < 60_000; i++) live.put(i, i); });\n        writer.start();\n        int seen = 0;\n        for (Iterator<Map.Entry<Integer, Integer>> it = new StripeIterator<>(live); it.hasNext(); it.next()) seen++;\n        writer.join(10_000);\n        System.out.println(\"iterated \" + seen + \" entries while a writer added 50,000 more: no exception, and \"\n            + seen + \" is somewhere between 10,000 and \" + live.size() + \" -- that is what weakly consistent means\");\n\n        // 13. durability: append first, commit second, and a stale writer loses\n        DurableMap durable = new DurableMap();\n        long v1 = durable.put(\"balance\", \"100\", 0);\n        long v2 = durable.put(\"balance\", \"150\", v1);\n        long stale = durable.put(\"balance\", \"999\", v1);        // a writer holding the old version\n        System.out.println(\"durable: v1=\" + v1 + \" v2=\" + v2 + \" stale write returned \" + stale\n            + \", value is still \" + durable.get(\"balance\") + \", log holds \" + durable.logSize() + \" records\");\n        System.out.println(\"replayed from the log after a restart: \" + DurableMap.replay(durable.log()));\n    }\n\n    /** 8 threads, 95% gets, on plain per-stripe locks. */\n    static long readHeavyPlain(int stripes) throws Exception {\n        StripedMap<String, Integer> map = new StripedMap<>(stripes);\n        String[] keys = keys();\n        for (int i = 0; i < keys.length; i++) map.put(keys[i], i);\n        return run(8, 250_000, (x, i) -> {\n            String k = keys[(x >>> 8) & 0xffff];\n            if ((x & 31) == 0) map.put(k, i); else map.get(k);\n        });\n    }\n\n    /** The same workload on read/write locks, so the two numbers are comparable. */\n    static long readHeavyRw(int stripes) throws Exception {\n        RwStripedMap<String, Integer> map = new RwStripedMap<>(stripes, new SpreadHasher());\n        String[] keys = keys();\n        for (int i = 0; i < keys.length; i++) map.put(keys[i], i);\n        return run(8, 250_000, (x, i) -> {\n            String k = keys[(x >>> 8) & 0xffff];\n            if ((x & 31) == 0) map.put(k, i); else map.get(k);\n        });\n    }\n\n    /** The same workload again, with readers taking import java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.function.*;\n\n/**\n * Targeted failure tests: each one proves a claim the design makes on page 02, move 9. Every wait in this file has\n * a deadline, so a bug shows up as a FAIL and never as a hung build; the watchdog ends the run at 45 seconds.\n */\npublic class FailureTests {\n    static int failures = 0;\n\n    /** Print one line per claim and remember whether it held. */\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? \"PASS \" : \"FAIL \") + what);\n        if (!ok) failures++;\n    }\n\n    /** A concurrency test suite that hangs has told you nothing: this daemon ends the run if one does. */\n    static void watchdog(long seconds) {\n        Thread t = new Thread(() -> {\n            try { Thread.sleep(seconds * 1000); } catch (InterruptedException e) { return; }\n            System.out.println(\"FAIL watchdog: the tests did not finish in \" + seconds + \" s (a deadlock, or a lost lock)\");\n            Runtime.getRuntime().halt(2);\n        });\n        t.setDaemon(true);\n        t.start();\n    }\n\n    /** Start N threads on one latch, run the job, and join with a deadline. Returns false if anybody was late. */\n    static boolean runAll(int threads, IntConsumer job, long joinMs) throws Exception {\n        CountDownLatch go = new CountDownLatch(1);\n        List<Thread> ts = new ArrayList<>();\n        for (int i = 0; i < threads; i++) {\n            final int id = i;\n            ts.add(new Thread(() -> {\n                try { go.await(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }\n                job.accept(id);\n            }, \"t\" + i));\n        }\n        ts.forEach(Thread::start);\n        go.countDown();\n        boolean allDone = true;\n        for (Thread t : ts) { t.join(joinMs); allDone &= !t.isAlive(); }\n        return allDone;\n    }\n\n    public static void main(String[] args) throws Exception {\n        watchdog(45);\n\n        // 1. fifty threads writing distinct keys: every key present, the exact count right, the weak count\n        //    agreeing once the writers have stopped, and the stripes evenly loaded.\n        final int THREADS = 50, PER = 2_000, TOTAL = THREADS * PER;\n        StripedMap<String, Integer> map = new StripedMap<>(16);\n        boolean done = runAll(THREADS, id -> { for (int i = 0; i < PER; i++) map.put(id + \":\" + i, i); }, 20_000);\n        int missing = 0;\n        for (int t = 0; t < THREADS; t++)\n            for (int i = 0; i < PER; i++) { Integer v = map.get(t + \":\" + i); if (v == null || v != i) missing++; }\n        int[] sizes = map.stripeSizes();\n        int min = Integer.MAX_VALUE, max = 0;\n        for (int s : sizes) { min = Math.min(min, s); max = Math.max(max, s); }\n        check(done && missing == 0, \"50 threads wrote \" + TOTAL + \" distinct keys and all of them came back (\" + missing + \" missing)\");\n        check(map.exactSize(2000) == TOTAL && map.size() == TOTAL,\n              \"exact size and weak size both read \" + TOTAL + \" once the writers stopped\");\n        check(max - min < TOTAL / 20, \"the 16 stripes hold \" + min + \"..\" + max + \" entries: the spreader really spreads\");\n\n        // 2. the race. A read-modify-write inside ONE lock hold loses nothing; the same thing split across a get\n        //    and a put loses most of it. Shown by running it, not by asserting it.\n        final int RT = 8, RI = 25_000, EXPECT = RT * RI;\n        StripedMap<String, Integer> safe = new StripedMap<>(16);\n        runAll(RT, id -> { for (int i = 0; i < RI; i++) safe.merge(\"hits\", 1, Integer::sum); }, 20_000);\n        check(safe.get(\"hits\") == EXPECT, \"merge: \" + RT + \" threads x \" + RI + \" increments = exactly \" + EXPECT);\n        StripedMap<String, Integer> racy = new StripedMap<>(16);\n        runAll(RT, id -> {\n            for (int i = 0; i < RI; i++) { Integer c = racy.get(\"hits\"); racy.put(\"hits\", c == null ? 1 : c + 1); }\n        }, 20_000);\n        check(racy.get(\"hits\") < EXPECT, \"get-then-put: the same loop landed on \" + racy.get(\"hits\")\n              + \" instead of \" + EXPECT + \" -- the gap between two lock holds, demonstrated\");\n\n        // 3. computeIfAbsent: the loader runs at most once per key, however many threads miss it at once.\n        StripedMap<String, String> loaded = new StripedMap<>(16);\n        AtomicInteger calls = new AtomicInteger();\n        boolean allGot = runAll(32, id -> {\n            String v = loaded.computeIfAbsent(\"hot\", k -> { calls.incrementAndGet(); return \"value-\" + k; });\n            if (!\"value-hot\".equals(v)) throw new AssertionError(\"a caller got \" + v);\n        }, 10_000);\n        check(allGot && calls.get() == 1, \"32 threads missed the same key: the loader ran \" + calls.get() + \" time(s)\");\n        AtomicInteger perKey = new AtomicInteger();\n        runAll(32, id -> { for (int i = 0; i < 100; i++) loaded.computeIfAbsent(\"k\" + i, k -> { perKey.incrementAndGet(); return k; }); }, 10_000);\n        check(perKey.get() == 100, \"100 distinct keys missed by 32 threads each: the loader ran \" + perKey.get() + \" times, one per key\");\n\n        // 4. a stripe that resizes while readers are reading it. The worst hasher on purpose, so every one of\n        //    20,000 keys lands in stripe 0 and that one stripe has to grow its buckets many times.\n        StripedMap<Integer, Integer> crowded = new StripedMap<>(16);\n        crowded.configure(new OneStripeHasher(), System::currentTimeMillis);\n        AtomicInteger badReads = new AtomicInteger();\n        boolean grew = runAll(8, id -> {\n            if (id == 0) { for (int i = 0; i < 20_000; i++) crowded.put(i, i); }\n            else for (int r = 0; r < 20_000; r++) {\n                Integer v = crowded.get(r % 20_000);\n                if (v != null && v != r % 20_000) badReads.incrementAndGet(); \n              \"the two keys really are in different stripes (\" + moving.stripeOf(from) + \" and \" + moving.stripeOf(to) + \")\");\n        moving.put(from, \"the coin\");\n        boolean moved = runAll(2, id -> {\n            for (int i = 0; i < 20_000; i++) { if (id == 0) moving.moveValue(from, to); else moving.moveValue(to, from); }\n        }, 15_000);\n        String at1 = moving.get(from), at2 = moving.get(to);\n        check(moved, \"two threads moved a value between two stripes in opposite directions 20,000 times, no deadlock\");\n        check(moving.size() == 1 && (\"the coin\".equals(at1) ^ \"the coin\".equals(at2)),\n              \"the value was never duplicated and never lost: exactly one key holds it at the end\");\n\n        // 7. the stripe count is rounded UP to a power of two, and an all-stripe operation is budgeted: with a\n        //    clock whose reading is already past the deadline it gives up instead of fighting every writer.\n        check(new StripedMap<>(17).stripeCount() == 32 && new StripedMap<>(1).stripeCount() == 1\n              && new StripedMap<>(100).stripeCount() == 128,\n              \"17 stripes becomes 32, 100 becomes 128: a power of two, so the stripe choice is a mask not a modulo\");\n        StripedMap<String, Integer> budgeted = new StripedMap<>(16);\n        for (int i = 0; i < 100; i++) budgeted.put(\"b\" + i, i);\n        check(budgeted.exactSize(1000) == 100, \"with a real clock, exactSize takes all 16 locks in order and returns 100\");\n        long[] tick = { 0 };\n        budgeted.configure(new SpreadHasher(), () -> tick[0] += 10_000);       // every reading is 10 s later\n        long t0 = System.nanoTime();\n        int refused = budgeted.exactSize(50);\n        long ms = (System.nanoTime() - t0) / 1_000_000;\n        check(refused == -1 && ms < 200, \"with a clock already past the deadline it returned \" + refused\n              + \" in \" + ms + \" ms instead of blocking the whole map\");\n        budgeted.configure(new SpreadHasher(), System::currentTimeMillis);\n\n        // 8. listeners are called AFTER the lock is released, and a broken one cannot break a write. The proof\n        //    that it is outside: the listener waits for ANOTHER thread to finish a write on the same key, which\n        //    could never happen if the listener were running inside that stripe's lock.\n        StripedMap<String, Integer> watched = new StripedMap<>(4);\n        AtomicInteger heard = new AtomicInteger();\n        AtomicBoolean outside = new AtomicBoolean();\n        AtomicBoolean firstOnly = new AtomicBoolean();\n        watched.addObserver((op, key, stripe, at) -> { throw new RuntimeException(\"a broken listener\"); });\n        watched.addObserver((op, key, stripe, at) -> heard.incrementAndGet());\n        watched.addObserver((op, key, stripe, at) -> {\n            if (!\"a\".equals(key) || !firstOnly.compareAndSet(false, true)) return;\n            CountDownLatch otherDone = new CountDownLatch(1);\n            new Thread(() -> { watched.put(\"a\", 2); otherDone.countDown(); }, \"other-writer\").start();\n            try { outside.set(otherDone.await(3, TimeUnit.SECONDS)); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        watched.put(\"a\", 1);\n        check(heard.get() >= 1 && watched.get(\"a\") != null,\n              \"a listener threw and the write still completed, and the next listener was still called\");\n        check(outside.get(), \"while a listener was running, another thread completed a write on the same key: \"\n              + \"the listener is outside the lock\");\n\n        // 9. iteration while a writer runs: weakly consistent, and it can never throw.\n        StripedMap<Integer, Integer> live = new StripedMap<>(16);\n        for (int i = 0; i < 10_000; i++) live.put(i, i);\n        Thread writer = new Thread(() -> { for (int i = 10_000; i < 40_000; i++) live.put(i, i); }, \"writer\");\n        writer.start();\n        int seen = 0;\n        RuntimeException blew = null;\n        try { for (Iterator<Map.Entry<Integer, Integer>> it = new StripeIterator<>(live); it.hasNext(); it.next()) seen++; }\n        catch (RuntimeException e) { blew = e; }\n        writer.join(10_000);\n        check(blew == null && seen >= 10_000 && seen <= live.size(),\n              \"iterated \" + seen + \" entries while 30,000 more were being written: no ConcurrentModificationException\");\n        Map<Integer, Integer> frozen = live.snapshot(2000);\n        check(frozen != null && frozen.size() == live.exactSize(2000),\n              \"and a snapshot taken under all 16 locks is exact: \" + (frozen == null ? -1 : frozen.size()) + \" entries\");\n\n        // 10. reads that take NO lock, while the stripe they are reading resizes underneath them. The resize\n        //     copies into a fresh table instead of relinking the old one, so a reader mid-walk is never stranded.\n        ReadOptimizedMap<Integer, Integer> free = new ReadOptimizedMap<>(16, 16, new OneStripeHasher());\n        AtomicInteger wrong = new AtomicInteger();\n        boolean ranFree = runAll(8, id -> {\n            if (id == 0) { for (int i = 0; i < 20_000; i++) free.put(i, i); }\n            else for (int r = 0; r < 40_000; r++) {\n                int k = r % 20_000;\n                Integer v = free.get(k);\n                if (v != null && v != k) wrong.incrementAndGet();      // a stale read is fine; a WRONG one is not\n            }\n        }, 20_000);\n        check(ranFree && wrong.get() == 0 && free.size() == 20_000,\n              \"20,000 keys into ONE lock-free stripe while 7 readers read it with no lock: 0 wrong reads, size=\" + free.size());\n        check(free.bucketsIn(0) >= 16_384,\n              \"that stripe copied itself up to \" + free.bucketsIn(0) + \" buckets; readers walking the old table were never relinked\");\n\n        // 11. the wait protocol. Eight threads ask for a key that does not exist, one thread supplies it, and a\n        //     single signalAll wakes every one of them -- because each re-checks in a loop rather than assuming.\n        WaitableMap<String, String> waitMap = new WaitableMap<>(16, new SpreadHasher());\n        AtomicInteger woke = new AtomicInteger(), quit = new AtomicInteger();\n        CountDownLatch asked = new CountDownLatch(8);\n        List<Thread> waiters = new ArrayList<>();\n        for (int i = 0; i < 8; i++) waiters.add(new Thread(() -> {\n            asked.countDown();\n            try { if (waitMap.awaitValue(\"late\", 5_000) != null) woke.incrementAndGet(); else quit.incrementAndGet(); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        }, \"waiter\"));\n        waiters.forEach(Thread::start);\n        asked.await(3, TimeUnit.SECONDS);\n        Thread.sleep(100);\n        int parked = waitMap.waitersOn(\"late\");\n        waitMap.put(\"late\", \"here\");\n        boolean allWoke = true;\n        for (Thread t : waiters) { t.join(6_000); allWoke &= !t.isAlive(); }\n        check(parked == 8 && allWoke && woke.get() == 8 && quit.get() == 0,\n              \"8 threads parked on one condition; one signalAll after the write woke all \" + woke.get() + \" of them\");\n\n        // 12. and the same wait with a budget, on a key that never arrives: it gives up, on time, instead of\n        //     hanging -- because awaitNanos hands back what is LEFT and the loop cannot restart the clock.\n        long waitT0 = System.nanoTime();\n        String never = waitMap.awaitValue(\"never-arrives\", 200);\n        long waitMs = (System.nanoTime() - waitT0) / 1_000_000;\n        check(never == null && waitMs >= 150 && waitMs < 1_500,\n              \"a wait for a key that never arrives returned null after \" + waitMs + \" ms, not never\");\n\n        // 13. cancelling a thread that is blocked on a lock somebody else holds. lock() cannot be interrupted;\n        //     lockInterruptibly() can. Both   study.innerHTML='<div class="hdr"><span class="stage">'+s.stage+'</span><h2>'+String(s.id).padStart(2,'0')+' &middot; '+s.title+'</h2></div>'+(s.think?'<div class="think">'+s.think+'</div>':'')+(s.body||'')+(s.code?'<div class="ed"><div class="tab"><b>'+(s.file||'Main.java')+'</b><button class="copy" data-src="ed">copy</button></div><pre><code class="java">'+hl(s.code)+'</code></pre></div>':'')+'<div class="nav"><button id="prev">&larr; prev</button><button id="next" class="pri">next &rarr;</button></div>';
  study.querySelectorAll('pre code.java').forEach(el=>{el.innerHTML=hl(el.textContent);});wireCopy(study);wireTimers(study);const miss=document.getElementById('miss');if(miss){try{miss.value=localStorage.getItem('mt-striped-map.miss')||'';}catch(e){}miss.addEventListener('input',()=>{try{localStorage.setItem('mt-striped-map.miss',miss.value);}catch(e){}});}
  document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
  document.querySelector('.wrap').classList.toggle('wide',!!s.wide);document.querySelector('.wrap').classList.toggle('code',!!s.code);localStorage.setItem('mt-striped-map.step',cur);study.scrollIntoView();
}
function go(n){if(n<1||n>STEPS.length)return;cur=n;setMode('study');render();}
side.addEventListener('click',e=>{const t=e.target.closest('.st');if(t)go(+t.dataset.id);});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
const main=document.getElementById('main');
function setMode(m){}
function wireTimers(root){root.querySelectorAll('button.timer[data-min]').forEach(b=>{const total=+b.dataset.min*60;let left=total,id=null;const show=()=>{b.textContent=(id?'':'start ')+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');};b.onclick=()=>{if(id){clearInterval(id);id=null;b.classList.remove('run');show();return;}if(left<=0)left=total;b.classList.remove('done');b.classList.add('run');id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;b.classList.remove('run');b.classList.add('done');b.textContent='time -- open the fold';}},1000);show();};show();});}
render();

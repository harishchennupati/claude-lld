<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Write me a thread-safe hash map. Many threads reading, many threads writing, and wrapping a HashMap in one <code>synchronized</code> is not an answer. Show me that two threads incrementing the same counter never lose an update. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>A hash map is an array of buckets; a key's hash picks the bucket, and keys that land in the same bucket hang off it in a chain. On one thread that is a first-year exercise. The moment two threads write at the same time it stops being one: two writers can relink the same chain and lose a node, and a reader can walk a chain while a resize is rebuilding it. The obvious fix is one lock around the whole map, and it works &mdash; it also means that a thread writing key <code>alice</code> waits for a thread writing key <code>zoe</code>, which is a purely invented reason to wait. So you cut the table into N independent pieces, called <b>stripes</b> or segments, and give each piece its own lock. A key's hash chooses its stripe, so unrelated keys usually land on different locks and never meet. The one thing that must always be true: a key lives in exactly one stripe, and everything that reads and then writes that key happens inside one hold of that stripe's lock &mdash; otherwise two threads both read 41, both write 42, and one increment is gone forever.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: a class that compiles and a <code>main</code> that starts a crowd of threads and prints numbers that prove it. The interviewer is watching for, in this order: the questions you ask before typing (how many stripes, and which operations have to be atomic, are the first two); which types exist and who owns which state &mdash; and specifically that the lock lives on the <i>stripe</i> and not on the map; the path of a <code>get</code> and a <code>put</code> end to end, including which bits pick the stripe and which pick the bucket; the race, named out loud and then demonstrated by running it; the order of the writes inside the lock and what a resize does; what <code>size()</code> can honestly mean; and what happens when one operation needs two stripes. Then the twists: a hasher that puts every key in one stripe, loading a key exactly once, bounding the map, making it durable, and why <code>ConcurrentHashMap</code> does not look like this at all.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 355\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"46\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">put</text><g transform=\"translate(150 18)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a key and a value</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">from any thread</text></g><path d=\"M340 43 H362\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(362 18)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">spread the hash once</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">multiply, then fold</text></g><path d=\"M552 43 H574\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(574 18)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">pick the stripe</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the HIGH bits, masked</text></g><path d=\"M764 43 H786\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(786 18)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lock THAT stripe</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">not the map</text></g><path d=\"M976 43 H998\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(998 18)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">write, raise the count</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">then unlock</text></g><text x=\"88\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">merge</text><g transform=\"translate(150 92)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">key, value, a function</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">count + 1, say</text></g><path d=\"M340 117 H362\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(362 92)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">same spread, same stripe</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a key never moves</text></g><path d=\"M552 117 H574\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(574 92)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ONE hold of the lock</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read, apply, write</text></g><path d=\"M764 117 H786\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(786 92)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">nothing can interleave</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no update is lost</text></g><path d=\"M976 117 H998\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(998 92)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">unlock, then listeners</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">never inside</text></g><text x=\"88\" y=\"194\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">size</text><g transform=\"translate(150 166)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">nobody asks a lock</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no stripe is touched</text></g><path d=\"M340 191 H362\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(362 166)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">read 16 volatile ints</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one per stripe</text></g><path d=\"M552 191 H574\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(574 166)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">add them up</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a weak, cheap answer</text></g><path d=\"M764 191 H786\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(786 166)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">exactSize: all 16 locks</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">in index order, budgeted</text></g><path d=\"M976 191 H998\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(998 166)\"><rect width=\"190\" height=\"50\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">that one is O(n)</text><text x=\"95.0\" y=\"35.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">say it out loud</text></g><path d=\"M150 43 H122 V240 H146\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(150 224)\"><rect width=\"250\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"10.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a null key or value: refused</text><text x=\"125.0\" y=\"26.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">before any lock is taken</text></g><text x=\"88\" y=\"292\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"150\" y=\"292\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any instant, from any thread: the value under a key &mdash; one stripe lock, a walk of one short chain, back out</text><text x=\"615\" y=\"322\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">a key lives in exactly ONE stripe, and every read-modify-write on it happens inside ONE hold of that stripe's lock:</text><text x=\"615\" y=\"341\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">no update is ever lost, and no reader ever walks a chain that is being relinked</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Which operations have to be atomic: just get and put, or compound ones too?</td><td>Compound too: merge, putIfAbsent, replace, computeIfAbsent</td><td>Whether a lock is needed at all, or a single volatile would do (moves 4, 6)</td></tr><tr><td>How many stripes, and can that number change at runtime?</td><td>Fixed at construction, a power of two; buckets inside a stripe still grow</td><td>A mask instead of a modulo, and per-stripe resize (moves 5, 6)</td></tr><tr><td>Read-heavy or write-heavy?</td><td>Mixed; and if reads really dominate, do not reach for a read/write lock</td><td>Whether reads take a lock at all, which decides how resize works (moves 6, 8)</td></tr><tr><td>Does <code>size()</code> have to be exact?</td><td>No: a weak sum for monitoring, and a separate exact call</td><td>A volatile count per stripe, and an ordered all-lock path (moves 5, 7)</td></tr><tr><td>Null keys or values?</td><td>Neither. A concurrent map forbids both</td><td>A <code>null</code> answer means absent, with no second call to check (move 9)</td></tr><tr><td>Is iteration required, and must it be a frozen snapshot?</td><td>Weakly consistent is fine; a true snapshot is a separate, expensive call</td><td>One stripe locked at a time, versus all of them (moves 5, 12)</td></tr><tr><td>Will one operation ever need two keys at once?</td><td>Yes &mdash; and that is where the deadlock lives</td><td>A fixed global lock order by stripe index (moves 9, 12)</td></tr><tr><td>One JVM and in memory?</td><td>Yes</td><td>No durability yet; the log and the version column are a follow-up (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li><code>get</code>, <code>put</code>, <code>remove</code> on a key, with the map safe for any number of threads on either side.</li>\n<li><code>merge</code> and <code>compute</code>: read-modify-write on one key as a single indivisible step, so counters work.</li>\n<li><code>putIfAbsent</code> and <code>replace(key, expected, updated)</code>: check-then-act, also indivisible.</li>\n<li><code>computeIfAbsent</code> runs its loader at most once per key, however many threads miss it at the same instant.</li>\n<li>A cheap <code>size()</code> for monitoring, and an exact one for when you really need it &mdash; two methods, not one.</li>\n<li>Iteration that never throws while somebody is writing, and a true snapshot when you ask for one.</li>\n<li>Null keys and null values are refused, so a <code>null</code> answer means \"absent\" and nothing else.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>No lost updates and no torn reads with fifty threads writing flat out: exactly one stripe owns a key, and one lock guards that stripe.</li>\n<li><code>get</code>, <code>put</code>, <code>remove</code> and <code>merge</code> are O(1) on average; only the all-stripe operations are not.</li>\n<li>Threads working on different keys must not wait for each other &mdash; that is the entire point of the exercise.</li>\n<li>No caller waits forever: any wait not measured in nanoseconds carries a deadline and is allowed to give up.</li>\n<li>Nothing half-done: a function the caller supplied that throws leaves the map exactly as it was.</li>\n<li>How the hash is spread, where time comes from and who is told are all swappable without touching a lock.</li>\n<li>One JVM, in memory, not durable (say it; a follow-up adds the log).</li></ul></div></div>\n<div class=\"move\"><h3>One run, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">50 threads start together</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one latch releases all of them</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">100,000 distinct keys to write</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">16 stripes, 16 locks</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">30 ms later: all written</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">exact size 100,000, none missing</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">stripes hold 6,239..6,267 each</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">6,500 met another thread</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">then 8 threads, ONE key</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">merge: 400,000, to the increment</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">get-then-put: about 100,000</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">three of every four vanished</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same load, 1 stripe</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">with 1.8 us inside the lock:</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">256 ms against 51 ms</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">five times, for one argument</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> a fixed, power-of-two number of stripes, each with its own lock and its own bucket array that grows on its own; compound operations are atomic per key; null keys and values are refused; <code>size()</code> is weakly consistent and there is a separate exact call; iteration is weakly consistent. Named as out of scope: rehashing across a different stripe count, eviction, durability, distribution &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">The same twelve moves as every other page here, with the threading ones doing the work: the shared state and how it is cut up before it is locked (move 4), the order of the writes inside one hold and what a reader sees during a resize (move 6), what is inside the lock and what happens when eight threads arrive at once (move 7), and the ladder from one lock to sixteen to none at all (move 8). Nothing is chosen up front, and no pattern is named before the move that produced it.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class &mdash; and on a threading problem, notice hard what does not.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 228\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a KEY maps to a VALUE; the TABLE is cut into STRIPES; each stripe owns its BUCKETS and its LOCK; a spread HASH picks which stripe</text><g transform=\"translate(24 110)\"><rect width=\"178\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"89.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">StripedMap</text><text x=\"89.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the stripe array, the rules</text></g><path d=\"M113.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(216 110)\"><rect width=\"178\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"89.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Segment</text><text x=\"89.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">buckets, count, its lock</text></g><path d=\"M305.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(408 110)\"><rect width=\"178\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"89.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Entry</text><text x=\"89.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">key, hash, value, next</text></g><path d=\"M497.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(600 110)\"><rect width=\"178\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"89.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Hasher</text><text x=\"89.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M689.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(792 110)\"><rect width=\"190\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"95.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Key / Value</text><text x=\"95.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the caller's, not ours</text></g><path d=\"M887.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(994 110)\"><rect width=\"216\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"108.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Bucket / Thread / Lock</text><text x=\"108.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">not classes: see below</text></g><path d=\"M1102.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"186\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a pure rule, the caller's payload, or something the JDK already gives you</text><text x=\"615\" y=\"212\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a bucket is one slot in an array holding the head of a chain, not an object; a &quot;writer&quot; is any thread that calls put; and the lock is java.util.concurrent's, not yours</text></svg></div><div class=\"move\"><p>Reading the sentence again: a <b>key</b> maps to a <b>value</b>; the <b>table</b> is cut into <b>stripes</b>; each stripe owns its <b>buckets</b> and its <b>lock</b>; a spread <b>hash</b> picks which stripe. The map owns the array of stripes and the handed-in rules, so it is a class &mdash; and it is the only one the callers touch. A stripe owns a bucket array, a count and a lock, all of which change: a class, and the important one, because that is where the lock ends up living. An entry owns a key, a cached hash, a value and a next pointer: a class, deliberately tiny. How to spread a hash has no state at all, so it is an interface. Then the three a threading problem tempts you to invent and must not. A <code>Bucket</code> is not a class: it is one slot in an array holding the head of a chain, and wrapping it costs an object per slot for nothing. A <code>Writer</code> or <code>Reader</code> is not a class: it is any thread that calls a method. And the lock is not yours to write &mdash; <code>ReentrantLock</code> already exists, and the entire design question is <i>how many of them and where</i>, not how one works.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 334\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(28 20)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hold the entries of one stripe</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M358 42 H424\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(424 20)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Segment  (owns the buckets + the lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M824 42 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 20)\"><rect width=\"312\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"156.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">seg.put(key, hash, value)</text><text x=\"156.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(28 74)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">decide which stripe a key is in</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M358 96 H424\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(424 74)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">StripedMap  (owns the stripe array)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M824 96 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 74)\"><rect width=\"312\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"156.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stripeIndex(hash)</text><text x=\"156.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(28 128)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">spread a hashCode into bits</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M358 150 H424\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(424 128)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Hasher  (owns nothing: pure)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M824 150 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 128)\"><rect width=\"312\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"156.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hasher.spread(key.hashCode())</text><text x=\"156.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(28 182)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">add one to a counter under a key</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M358 204 H424\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(424 182)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Segment  (owns the value AND the lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M824 204 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 182)\"><rect width=\"312\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"156.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">seg.merge(k, h, 1, sum)</text><text x=\"156.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(28 236)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">count the whole map</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M358 258 H424\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(424 236)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">StripedMap  (the only one seeing all)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M824 258 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 236)\"><rect width=\"312\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"156.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">size() / exactSize(ms)</text><text x=\"156.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"302\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the verb that decides the whole design is &quot;add one to a counter&quot;: it touches a value AND the lock that guards it, and only the Segment sees both &mdash; so it is one method there,</text><text x=\"615\" y=\"321\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">never a get and a put from outside. Notice too that the map itself owns no entry and no lock: it routes, and everything else belongs to a stripe.</text></svg></div><div class=\"move\"><p>\"Hold the entries of one stripe\" touches a bucket array and a count, so it belongs to the stripe: <code>seg.put(key, hash, value)</code>. \"Decide which stripe a key is in\" touches the array of stripes, which only the map has: <code>stripeIndex(hash)</code>. \"Spread a hashCode\" touches nothing at all &mdash; it is arithmetic on an int &mdash; so it is a pure rule. \"Count the whole map\" touches every stripe's counter, and again only the map sees all of them. The verb that decides the design is the fourth one: \"add one to a counter under a key\" touches a value <i>and</i> the lock that guards it, and the only object that can see both is the stripe. So it is one method there, <code>merge</code>, and never a <code>get</code> followed by a <code>put</code> from outside &mdash; because outside, those are two separate holds of the lock with a gap in the middle. Notice also what the map itself does not own: not a single entry, and not a single lock. It routes. Everything else belongs to a stripe, and that is exactly why the stripes can work in parallel.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind a one-method interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(28 76)\"><rect width=\"230\" height=\"104\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"115.0\" y=\"46.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">StripedMap</text><text x=\"115.0\" y=\"62.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(hasher, clock)</text></g><path d=\"M258 128 H330 V42 H396\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(396 20)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Hasher</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">how a hashCode is spread</text></g><g transform=\"translate(750 20)\"><rect width=\"452\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"226.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SpreadHasher / FoldOnlyHasher / OneStripeHasher</text><text x=\"226.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the seam they reach for first</text></g><path d=\"M750 42 H686\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M258 128 H330 V100 H396\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(396 78)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MapObserver</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who wants to know about a write</text></g><g transform=\"translate(750 78)\"><rect width=\"452\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"226.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">metrics, an audit line, a cache invalidator</text><text x=\"226.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">called after the unlock, in a try/catch</text></g><path d=\"M750 100 H686\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M258 128 H330 V158 H396\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(396 136)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where a deadline comes from</text></g><g transform=\"translate(750 136)\"><rect width=\"452\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"226.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::currentTimeMillis, or a test's fake</text><text x=\"226.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a lambda is a valid implementation</text></g><path d=\"M750 158 H686\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M258 128 H330 V216 H396\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(396 194)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">KeyValueStore</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the contract itself</text></g><g transform=\"translate(750 194)\"><rect width=\"452\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"226.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MeteredMap wraps ANY implementation</text><text x=\"226.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">that one is a Decorator, not a Strategy</text></g><path d=\"M750 216 H686\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The map never builds a rule, so &quot;our keys are sequential ids and they all pile into one stripe&quot; is a new class and one changed line at construction</text><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and the last row is the odd one out: MeteredMap implements the same interface and holds one, so it counts hits and misses and the map never learns it is being measured</text></svg></div><div class=\"move\"><p>Three things will change, and each becomes an interface the map is <i>given</i> rather than builds. How a hashCode becomes bits will change, because it depends entirely on what the keys look like &mdash; that is <code>Hasher</code>, and it is the seam the interviewer reaches for first, usually with \"our keys are sequential ids\". Who wants to know about a write will change &mdash; metrics today, an audit log tomorrow, a cache invalidator the day after &mdash; that is <code>MapObserver</code>, and the rule that comes with it is that it is called after the unlock. Where a deadline comes from will change, because a test cannot afford to wait for one &mdash; that is <code>Clock</code>. This is where the patterns are born, not announced: a swappable rule behind an interface is <b>Strategy</b>; a map that says \"a write happened\" without knowing what a dashboard is, is <b>Observer</b>. And one more, which is the odd one out: <code>MeteredMap</code> implements the same <code>KeyValueStore</code> interface and holds one, so it counts hits and misses around any implementation at all and the map never learns it is being measured. Wrapping the whole interface rather than plugging into a slot is <b>Decorator</b>.</p></div><div class=\"move\"><h3>Move 4: state that many threads change at once gets one owner and one lock &mdash; so cut the state until one lock is many.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 404\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"24\" y=\"58\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">thread A</text><text x=\"24\" y=\"116\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">thread B</text><text x=\"24\" y=\"176\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">key \"hits\"</text><g transform=\"translate(128 36)\"><rect width=\"160\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">get(hits) &rarr; 41</text><text x=\"80.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">hold one, released</text></g><g transform=\"translate(472 36)\"><rect width=\"160\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">put(hits, 42)</text><text x=\"80.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">hold two</text></g><g transform=\"translate(300 94)\"><rect width=\"160\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">get(hits) &rarr; 41</text><text x=\"80.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the same 41</text></g><g transform=\"translate(644 94)\"><rect width=\"160\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">put(hits, 42)</text><text x=\"80.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">overwrites A</text></g><g transform=\"translate(166 156)\"><rect width=\"84\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"42.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">41</text></g><g transform=\"translate(338 156)\"><rect width=\"84\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"42.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">41</text></g><g transform=\"translate(510 156)\"><rect width=\"84\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"42.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">42</text></g><g transform=\"translate(682 156)\"><rect width=\"84\" height=\"32\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"42.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">42</text></g><rect x=\"118\" y=\"26\" width=\"516\" height=\"62\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"5 4\"/><text x=\"376\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">the gap: A read it, released the lock, and B read the same number</text><path d=\"M118 208 H820\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><path d=\"M208 203 V213\" stroke=\"var(--line)\"/><text x=\"208\" y=\"229\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t1</text><path d=\"M380 203 V213\" stroke=\"var(--line)\"/><text x=\"380\" y=\"229\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t2</text><path d=\"M552 203 V213\" stroke=\"var(--line)\"/><text x=\"552\" y=\"229\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t3</text><path d=\"M724 203 V213\" stroke=\"var(--line)\"/><text x=\"724\" y=\"229\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t4</text><text x=\"848\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">time &rarr;</text><g transform=\"translate(840 30)\"><rect width=\"362\" height=\"118\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"181.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the fix: one hold, not two</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">merge(key, 1, Integer::sum)</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">read, apply, write &mdash; inside one lock hold</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">nothing can interleave, so nothing is lost</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">measured: 400,000 exact, against about 100,000</text></g><text x=\"615\" y=\"258\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--text)\">and now the second half of the move: WHOSE lock? One lock over the whole map would fix this too,</text><text x=\"615\" y=\"277\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--text)\">and would make alice wait for zoe. So cut the state first, then lock each piece.</text><g transform=\"translate(130 294)\"><rect width=\"118\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"59.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stripe 0</text><text x=\"59.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">its own lock</text></g><g transform=\"translate(266 294)\"><rect width=\"118\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"59.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stripe 1</text><text x=\"59.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">its own lock</text></g><g transform=\"translate(402 294)\"><rect width=\"118\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"59.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stripe 2</text><text x=\"59.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">its own lock</text></g><g transform=\"translate(538 294)\"><rect width=\"118\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"59.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stripe 3</text><text x=\"59.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">its own lock</text></g><g transform=\"translate(674 294)\"><rect width=\"118\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"59.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stripe 4</text><text x=\"59.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">its own lock</text></g><g transform=\"translate(810 294)\"><rect width=\"118\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"59.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stripe 5</text><text x=\"59.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">its own lock</text></g><g transform=\"translate(946 294)\"><rect width=\"118\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"59.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stripe 6</text><text x=\"59.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">its own lock</text></g><g transform=\"translate(1082 294)\"><rect width=\"118\" height=\"52\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"59.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stripe 7</text><text x=\"59.0\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">its own lock</text></g><text x=\"189\" y=\"364\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">alice</text><text x=\"597\" y=\"364\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">zoe</text><text x=\"615\" y=\"390\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">two writers, two locks, no waiting (eight of the sixteen drawn). The lock did not move to the map; the state was cut into sixteen pieces and each piece kept its own.</text></svg></div><div class=\"move\"><p>Two threads increment the same counter. A reads 41 and releases the lock; B reads 41; A writes 42; B writes 42. One increment is gone, and nothing ever repairs it &mdash; measured on this machine, 400,000 increments written that way land somewhere near 100,000 &mdash; a different number every run &mdash; so three of every four vanish. The gap is between the read and the write, and the only fix is to make them one hold of one lock: that is <code>merge(key, 1, Integer::sum)</code>, with the caller's function running <i>inside</i> the critical section. So far this is the same move as every other page. The part that is special here is the second half: <i>whose</i> lock? One lock around the whole map would also fix it, and would make a thread writing <code>alice</code> wait for a thread writing <code>zoe</code> for no reason anybody can name. So you cut the state first &mdash; sixteen independent bucket arrays, each with its own count &mdash; and then give each piece its own lock. The lock did not move up to the map; the state was divided, and every piece kept its own guard. That pattern has a name worth saying: <b>lock striping</b>, and the object it produces is a <b>monitor</b> &mdash; private fields, one lock, and the only way in is a method that takes it.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 362\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(28 18)\"><rect width=\"344\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"172.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which stripe holds this key?</text><text x=\"172.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M372 38 H432\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(432 18)\"><rect width=\"530\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"265.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">segments[(h &gt;&gt;&gt; shift) &amp; mask] &mdash; the HIGH bits</text><text x=\"265.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M962 38 H1016\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1016 18)\"><rect width=\"186\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), no modulo</text></g><g transform=\"translate(28 66)\"><rect width=\"344\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"172.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which bucket inside the stripe?</text><text x=\"172.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M372 86 H432\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(432 66)\"><rect width=\"530\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"265.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">table[h &amp; (table.length - 1)] &mdash; the LOW bits</text><text x=\"265.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M962 86 H1016\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1016 66)\"><rect width=\"186\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), no modulo</text></g><g transform=\"translate(28 114)\"><rect width=\"344\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"172.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is this node the key I want?</text><text x=\"172.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M372 134 H432\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(432 114)\"><rect width=\"530\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"265.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">compare the cached int hash, then equals</text><text x=\"265.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M962 134 H1016\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1016 114)\"><rect width=\"186\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">~1 equals per bucket</text></g><g transform=\"translate(28 162)\"><rect width=\"344\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"172.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is this stripe getting full?</text><text x=\"172.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M372 182 H432\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(432 162)\"><rect width=\"530\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"265.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">count &gt; threshold, kept and never counted</text><text x=\"265.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M962 182 H1016\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1016 162)\"><rect width=\"186\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(28 210)\"><rect width=\"344\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"172.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many entries are there?</text><text x=\"172.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M372 230 H432\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(432 210)\"><rect width=\"530\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"265.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">16 volatile ints, summed, with no lock</text><text x=\"265.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M962 230 H1016\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1016 210)\"><rect width=\"186\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(stripes) = 16</text></g><g transform=\"translate(28 258)\"><rect width=\"344\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"172.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">everything, as one frozen moment?</text><text x=\"172.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M372 278 H432\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(432 258)\"><rect width=\"530\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"265.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">all 16 locks, in index order, budgeted</text><text x=\"265.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M962 278 H1016\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1016 258)\"><rect width=\"186\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(n), not O(1)</text></g><text x=\"615\" y=\"328\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the two bit ranges are the whole trick: the stripe comes from the top bits and the bucket from the bottom ones, so two keys in the same stripe are not also in the same bucket</text><text x=\"615\" y=\"348\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and both are masks rather than modulos, which is why the stripe count and the bucket count are always rounded up to a power of two</text></svg></div><div class=\"move\"><p>\"Which stripe holds this key?\" is <code>(h &gt;&gt;&gt; shift) &amp; mask</code>: a shift, an AND and one array read. \"Which bucket inside it?\" is <code>h &amp; (table.length - 1)</code>. Both are masks rather than modulos, which is why the stripe count and the bucket count are always rounded up to a power of two &mdash; asking for seventeen stripes gives you thirty-two. And the two use different halves of the same integer on purpose: the stripe comes from the top bits, the bucket from the bottom ones, so two keys that share a stripe are not thereby forced to share a bucket. \"Is this the key?\" compares the cached int hash first and only calls <code>equals</code> when it matches, which is why every node stores its hash. \"Is this stripe filling up?\" is a comparison against a kept threshold, never a count. \"How many entries?\" is sixteen volatile ints added up with no lock at all. And one question is deliberately not O(1): a frozen snapshot needs every lock at once, which is O(n) and fights the whole map &mdash; so it is a separate method with a budget, and you say that out loud rather than pretending.</p></div><div class=\"move\"><h3>Move 6: a stripe has a life cycle, and the order of the steps inside a write is the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 478\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"24\" y=\"54\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">the writer</text><text x=\"24\" y=\"118\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">stripe 5's lock</text><text x=\"24\" y=\"158\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">a reader of stripe 5</text><text x=\"24\" y=\"198\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">a reader of stripe 9</text><text x=\"24\" y=\"238\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">size()</text><g transform=\"translate(166 32)\"><rect width=\"128\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"64.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">put(k, v)</text><text x=\"64.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">any thread</text></g><path d=\"M294 53 H306\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(306 32)\"><rect width=\"122\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"61.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lock stripe 5</text><text x=\"61.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">only stripe 5</text></g><path d=\"M428 53 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 32)\"><rect width=\"140\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">walk the bucket</text><text x=\"70.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">cached hash first</text></g><path d=\"M590 53 H612\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(612 32)\"><rect width=\"152\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"76.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish the node</text><text x=\"76.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one reference write</text></g><path d=\"M764 53 H786\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(786 32)\"><rect width=\"140\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">raise the count</text><text x=\"70.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">volatile, LAST</text></g><path d=\"M926 53 H948\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(948 32)\"><rect width=\"148\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"74.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rehash + swap</text><text x=\"74.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">over the load factor</text></g><path d=\"M1096 53 H1108\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1108 32)\"><rect width=\"96\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"48.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">unlock</text><text x=\"48.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">then listeners</text></g><rect x=\"306\" y=\"104\" width=\"898\" height=\"28\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"755\" y=\"123\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--text)\">held by us, start to finish &mdash; the rehash included</text><rect x=\"306\" y=\"144\" width=\"898\" height=\"28\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-dasharray=\"5 3\"/><text x=\"755\" y=\"163\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits here, then walks the NEW table: it can never see a half-moved chain</text><rect x=\"212\" y=\"184\" width=\"992\" height=\"28\" rx=\"4\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"708\" y=\"203\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--text)\">never waits at all: a different lock, and 15 of the 16 stripes are in this position</text><rect x=\"212\" y=\"224\" width=\"992\" height=\"28\" rx=\"4\" fill=\"#12302a\" stroke=\"var(--acc)\"/><text x=\"708\" y=\"243\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--text)\">never waits either: it reads sixteen volatile counters and takes no lock at all</text><rect x=\"20\" y=\"268\" width=\"700\" height=\"196\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"370\" y=\"290\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside a write, and why it is this order</text><text x=\"34\" y=\"314\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1  take the stripe's lock &mdash; nothing before it reads or writes shared state</text><text x=\"34\" y=\"332\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2  walk the chain, cached int hash first &mdash; an equals that throws has changed nothing</text><text x=\"34\" y=\"350\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3  the caller's function runs HERE &mdash; merge / compute, still inside the one hold</text><text x=\"34\" y=\"368\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4  link the new node, then publish it &mdash; one write; the chain is never half-built</text><text x=\"34\" y=\"386\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5  only NOW raise the volatile count &mdash; a lock-free size() never counts a node it cannot find</text><text x=\"34\" y=\"404\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">6  over the load factor? rehash and swap &mdash; all of it under this same lock</text><text x=\"34\" y=\"422\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">7  anybody parked waiting for this key? signal them HERE, lock still held</text><text x=\"34\" y=\"440\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">8  unlock in a finally, then the listeners &mdash; outside, in a try/catch</text><g transform=\"translate(752 300)\"><rect width=\"168\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"84.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Serving</text><text x=\"84.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">readers and writers</text></g><g transform=\"translate(1034 300)\"><rect width=\"168\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"84.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Growing</text><text x=\"84.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the writer rehashes</text></g><path d=\"M920 314 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"976\" y=\"292\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--muted)\">count &gt; threshold</text><path d=\"M1034 336 H924\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"976\" y=\"362\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--muted)\">the new table is swapped in</text><text x=\"977\" y=\"394\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the same thread does both, holding the same lock the whole time,</text><text x=\"977\" y=\"412\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">so &quot;what does a reader see mid-resize?&quot; has a one-word answer: nothing.</text><text x=\"977\" y=\"434\" text-anchor=

) {\n        if (opening.paise() &lt; 0) throw new RuleViolation(&quot;an account cannot open below zero: &quot; + opening);\n        this.id = id; this.customerId = customerId; this.kind = kind;\n        this.currency = opening.currency(); this.clock = clock; this.listeners = listeners;\n        this.balance = Money.zero(currency);\n        this.lastActivityMs = clock.nowMs();\n        lock.lock();\n        try { post(TxnType.OPENING, opening, balance.plus(opening), null, &quot;account opened&quot;); }\n        finally { lock.unlock(); }\n    }\n\n    /** The account number. Immutable, and it doubles as the key that orders the locks in a transfer. */\n    final String id() { return id; }\n    /** Who owns it. */\n    final String customerId() { return customerId; }\n    /** Savings or current: the key into the bank&#x27;s interest registry. */\n    final AccountKind kind() { return kind; }\n    /** The one currency this account holds. */\n    final String currency() { return currency; }\n    /** The stored balance, not re-added from the ledger: one field read under the lock, O(1). */\n    final Money balance() { lock.lock(); try { return balance; } finally { lock.unlock(); } }\n    /** Where the account is in its life. */\n    final AccountStatus status() { lock.lock(); try { return status; } finally { lock.unlock(); } }\n    /** Hand in one more veto. Setup only; rules compose, and every one of them must agree to a withdrawal. */\n    final void addRule(WithdrawalRule rule) { rules.add(rule); }\n\n    /**\n     * Money in. A bank does not refuse your money, so a deposit passes no rules \u2014 but a FROZEN or CLOSED account\n     * refuses every posting. The row and the new balance are written in one lock hold; listeners hear afterwards.\n     */\n    final Txn deposit(Money amount, String note) {\n        requirePositive(amount);\n        Txn t;\n        lock.lock();\n        try {\n            requirePostable(); requireSameCurrency(amount);\n            t = post(TxnType.DEPOSIT, amount, balance.plus(amount), null, note);\n        } finally { lock.unlock(); }\n        publish(t);\n        return t;\n    }\n\n    /**\n     * Money out. Every rule must agree, and the checks run in the SAME lock hold that writes the row, so no other\n     * thread can empty the account between the approval and the posting. A rule that says no throws before\n     * anything is written: no row, no balance change, nothing to undo, and the caller may retry.\n     */\n    final Txn withdraw(Money amount, String note) {\n        requirePositive(amount);\n        Txn t;\n        lock.lock();\n        try {\n            requirePostable(); requireSameCurrency(amount);\n            long now = clock.nowMs();\n            for (WithdrawalRule rule : rules) rule.check(this, amount, now);     // every rule, before any write\n            t = post(TxnType.WITHDRAW, amount, balance.minus(amount), null, note);\n            for (WithdrawalRule rule : rules) rule.onWithdrawn(this, amount, now); // a stateful rule remembers\n        } finally { lock.unlock(); }\n        publish(t);\n        return t;\n    }\n\n    /**\n     * Everything that could make a credit fail, asked before a single paise leaves the other account. Called by\n     * Bank.transfer with both locks held. If this throws, the source has not been touched.\n     */\n    final void checkCanReceive(Money amount) {\n        requirePositive(amount);\n        lock.lock();\n        try { requirePostable(); requireSameCurrency(amount); } finally { lock.unlock(); }\n    }\n\n    /**\n     * The debit half of a transfer: the rules and the TRANSFER_OUT row in one hold. Returned unpublished. The\n     * rules are asked about the amount PLUS the fee (null for none), so a fee can never take the balance past\n     * the floor or the overdraft ceiling; the caller writes the fee row later, in the same two-lock hold.\n     */\n    final Txn debitForTransfer(Money amount, Money fee, String transferId, String note) {\n        requirePositive(amount);\n        lock.lock();\n        try {\n            requirePostable(); requireSameCurrency(amount);\n            Money total = (fee == null) ? amount : amount.plus(fee);     // a fee in another currency throws here\n            long now = clock.nowMs();\n            for (WithdrawalRule rule : rules) rule.check(this, total, now);\n            Txn t = post(TxnType.TRANSFER_OUT, amount, balance.minus(amount), transferId, note);\n            for (WithdrawalRule rule : rules) rule.onWithdrawn(this, total, now);\n            return t;\n        } finally { lock.unlock(); }\n    }\n\n    /** The credit half: it cannot fail, because checkCanReceive already asked everything it could refuse on. */\n    final Txn creditForTransfer(Money amount, String transferId, String note) {\n        lock.lock();\n        try {\n            requirePostable(); requireSameCurrency(amount);\n            return post(TxnType.TRANSFER_IN, amount, balance.plus(amount), transferId, note);\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * Put back money a transfer took out, by writing the opposite row, never by editing one. Deliberately allowed\n     * on a frozen account: you must always be able to unwind money that should not have moved. Returned\n     * unpublished, because its one caller still holds two locks.\n     */\n    final Txn postReversal(Money amount, String ref, String note) {\n        lock.lock();\n        try { return post(TxnType.REVERSAL, amount, balance.plus(amount), ref, note); }\n        finally { lock.unlock(); }\n    }\n\n    /** The interest the bank&#x27;s rule computed, as its own row so a statement can show it. Does not wake a dormant account. */\n    final Txn postInterest(Money interest) {\n        Txn t;\n        lock.lock();\n        try {\n            requirePostable();\n            t = post(TxnType.INTEREST, interest, balance.plus(interest), null, &quot;interest&quot;);\n        } finally { lock.unlock(); }\n        publish(t);\n        return t;\n    }\n\n    /** A charge the bank raised (a transfer fee, an overdraft penalty). Also not customer activity. */\n    final Txn postFee(Money fee, String ref, String note) {\n        Txn t = postFeeRow(fee, ref, note);\n        publish(t);\n        return t;\n    }\n\n    /** The fee row without telling anybody: for a caller that is holding two locks and will publish after them. */\n    final Txn postFeeRow(Money fee, String ref, String note) {\n        lock.lock();\n        try {\n            requirePostable();\n            return post(TxnType.FEE, fee, balance.minus(fee), ref, note);\n        } finally { lock.unlock(); }\n    }\n\n    /** ACTIVE or DORMANT to FROZEN. The balance is untouched; every posting is refused until it is unfrozen. */\n    final void freeze() {\n        lock.lock();\n        try {\n            if (status == AccountStatus.CLOSED) throw new AccountNotActive(id + &quot; is CLOSED&quot;);\n            status = AccountStatus.FROZEN;\n        } finally { lock.unlock(); }\n    }\n\n    /** FROZEN back to ACTIVE. Nothing else may leave FROZEN. */\n    final void unfreeze() {\n        lock.lock();\n        try {\n            if (status != AccountStatus.FROZEN) throw new AccountNotActive(id + &quot; is &quot; + status + &quot;, not FROZEN&quot;);\n            status = AccountStatus.ACTIVE;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * Close, only at exactly zero, so money can never be stranded in an account nobody can reach. CLOSED is final.\n     * A FROZEN account cannot be closed: a freeze is a legal hold, and closing would end it.\n     */\n    final void close() {\n        lock.lock();\n        try {\n            if (status == AccountStatus.CLOSED) return;\n            if (status == AccountStatus.FROZEN) throw new AccountNotActive(id + &quot; is FROZEN: unfreeze it before closing&quot;);\n            if (balance.paise() != 0)\n                throw new RuleViolation(&quot;account &quot; + id + &quot; still holds &quot; + balance + &quot;: empty it before closing&quot;);\n            status = AccountStatus.CLOSED;\n        } finally { lock.unlock(); }\n    }\n\n    /** ACTIVE and untouched for idleMs becomes DORMANT. Returns true if this call changed it. */\n    final boolean markDormantIfIdle(long nowMs, long idleMs) {\n        lock.lock();\n        try {\n            if (status != AccountStatus.ACTIVE || nowMs - lastActivityMs &lt; idleMs) return false;\n            status = AccountStatus.DORMANT;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * The rows in a window (both ends included), plus the balance the window opened and closed with. The ledger\n     * is appended in time order, so both ends are a binary search: O(log n + k), never a scan of the whole history.\n     */\n    final Statement statement(long fromMs, long toMs) {\n        if (fromMs &gt; toMs) throw new IllegalArgumentException(&quot;the window ends before it starts&quot;);\n        lock.lock();\n        try {\n            int from = firstAtOrAfter(fromMs);\n            int to = (toMs == Long.MAX_VALUE) ? ledger.size() : firstAtOrAfter(toMs + 1);   // toMs + 1 would overflow\n            Money opening = from == 0 ? Money.zero(currency) : ledger.get(from - 1).balanceAfter();\n            Money closing = to == 0 ? opening : ledger.get(to - 1).balanceAfter();\n            return new Statement(id, fromMs, toMs, opening, closing, List.copyOf(ledger.subList(from, to)));\n        } finally { lock.unlock(); }\n    }\n\n    /** A copy of the whole ledger. A copy, because handing out the live list would hand out the audit trail. */\n    final List&lt;Txn&gt; ledger() { lock.lock(); try { return List.copyOf(ledger); } finally { lock.unlock(); } }\n\n    /** How many rows this account has. O(1), and the tests use it to prove a refusal wrote nothing. */\n    final int rowCount() { lock.lock(); try { return ledger.size(); } finally { lock.unlock(); } }\n\n    /** Index of the first row at or after this instant. Binary search over rows that are already in time order. */\n    private int firstAtOrAfter(long ms) {\n        int lo = 0, hi = ledger.size();\n        while (lo &lt; hi) { int mid = (lo + hi) &gt;&gt;&gt; 1; if (ledger.get(mid).atMs() &lt; ms) lo = mid + 1; else hi = mid; }\n        return lo;\n    }\n\n    /**\n     * The ONE writer. Called with the lock held; the row, the balance, the sequence number and the activity stamp\n     * all move together here or not at all. Interest and fees are the bank&#x27;s activity, not the customer&#x27;s, so\n     * they do not wake a dormant account. A row is never stamped earlier than the row before it, so a clock that\n     * steps back cannot put the ledger out of time order (every binary search on this page depends on that order).\n     */\n    private Txn post(TxnType type, Money amount, Money after, String ref, String note) {\n        long at = clock.nowMs();\n        if (!ledger.isEmpty()) at = Math.max(at, ledger.get(ledger.size() - 1).atMs());\n        Txn t = new Txn(++seq, id, type, amount, after, at, ref, note);\n        balance = after;\n        ledger.add(t);\n        if (type != TxnType.INTEREST &amp;&amp; type != TxnType.FEE) {\n            lastActivityMs = t.atMs();\n            if (status == AccountStatus.DORMANT) status = AccountStatus.ACTIVE;   // any customer posting wakes it\n        }\n        return t;\n    }\n\n    /** Tell the listeners, AFTER the lock, each in a try/catch: a broken SMS gateway cannot break a posting. */\n    final void publish(Txn t) {\n        for (AccountListener l : listeners) {\n            try { l.onPosted(this, t); } catch (RuntimeException ignored) { /* never break a posting for a listener */ }\n        }\n    }\n\n    /** Take this account&#x27;s lock. Package-private for exactly one caller: Bank.transfer, which takes two in id order. */\n    final void lockAccount() { lock.lock(); }\n    /** Release it. */\n    final void unlockAccount() { lock.unlock(); }\n\n    /** FROZEN and CLOSED refuse every posting; ACTIVE and DORMANT accept. */\n    private void requirePostable() {\n        if (status == AccountStatus.FROZEN || status == AccountStatus.CLOSED)\n            throw new AccountNotActive(&quot;account &quot; + id + &quot; is &quot; + status);\n    }\n    /** A posting in another currency is a bug, not a conversion. */\n    private void requireSameCurrency(Money amount) {\n        if (!amount.currency().equals(currency))\n            throw new CurrencyMismatch(&quot;account &quot; + id + &quot; holds &quot; + currency + &quot;, not &quot; + amount.currency());\n    }\n    /** Zero and negative amounts are refused at the door, so no row can ever mean &quot;minus a negative&quot;. */\n    private void requirePositive(Money amount) {\n        if (amount.paise() &lt;= 0) throw new RuleViolation(&quot;amount must be positive, not &quot; + amount);\n    }\n}\n\n/**\n * Savings: earns interest, and may never fall below a floor. The floor arrives as a rule object rather than an\n * overridden method, so a second veto (a daily cap, a fraud hold) composes with it instead of replacing it.\n */\nfinal class SavingsAccount extends Account {\n    private final Money minBalance;\n    /** Open a savings account and wire in its one rule: the minimum balance. */\n    SavingsAccount(String id, String customerId, Money opening, Money minBalance,\n                   Clock clock, List&lt;AccountListener&gt; listeners) {\n        super(id, customerId, AccountKind.SAVINGS, opening, clock, listeners);\n        this.minBalance = minBalance;\n        addRule(new MinBalanceRule(minBalance));\n    }\n    /** The floor this account may never go under. */\n    Money minBalance() { return minBalance; }\n}\n\n/**\n * Current: may run negative, down to the overdraft ceiling, and earns no interest. Everything else about it is\n * identical to savings, which is the point: the subclass holds the is-a difference and nothing else.\n */\nfinal class CurrentAccount extends Account {\n    private final Money overdraftLimit;\n    /** Open a current account and wire in its one rule: the overdraft ceiling. */\n    CurrentAccount(String id, String customerId, Money opening, Money overdraftLimit,\n                   Clock clock, List&lt;AccountListener&gt; listeners) {\n        super(id, customerId, AccountKind.CURRENT, opening, clock, listeners);\n        this.overdraftLimit = overdraftLimit;\n        addRule(new OverdraftRule(overdraftLimit));\n    }\n    /** How far below zero this account may go. */\n    Money overdraftLimit() { return overdraftLimit; }\n}\n\n/**\n * The bank: it owns the customers, the accounts, the interest rules, the listeners and the clock, and it is the\n * only place that may hold two account locks at once \u2014 which is why the two-account invariant (a transfer) lives\n * here and not on Account. An account reaching into another account is how two threads each hold one lock and\n * wait forever for the other.\n */\nfinal class Bank {\n    private final Map&lt;String, Customer&gt; customers = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Account&gt; accounts = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, List&lt;String&gt;&gt; accountsOf = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, TransferReceipt&gt; transfers = new ConcurrentHashMap&lt;&gt;();   // idempotency, by transfer id\n    private final List&lt;AccountListener&gt; listeners = new CopyOnWriteArrayList&lt;&gt;();\n    private final EnumMap&lt;AccountKind, InterestRule&gt; interestRules = new EnumMap&lt;&gt;(AccountKind.class);\n    private Clock clock = System::currentTimeMillis;\n    // no fee until one is handed in; volatile, because setFeePolicy may be called while transfers run\n    private volatile FeePolicy fees = (from, to, amount) -&gt; null;\n    private long dormantAfterMs = 180L * 24 * 3600 * 1000;\n\n    /**\n     * Hand in the rules and the clock. The bank never builds an interest rule, and every account it opens is\n     * handed this clock, which is why it must be called before the first account exists.\n     */\n    void configure(Map&lt;AccountKind, InterestRule&gt; rules, Clock clock) {\n        if (!accounts.isEmpty())\n            throw new IllegalStateException(&quot;configure the bank before opening accounts: each account is handed the clock&quot;);\n        interestRules.clear(); interestRules.putAll(rules); this.clock = clock;\n    }\n    /** Hand in what a transfer costs. Safe while transfers run: the field is volatile, so the next transfer sees it. */\n    void setFeePolicy(FeePolicy p) { fees = p; }\n    /** Change how long an untouched account stays ACTIVE before the sweep marks it DORMANT. */\n    void dormantAfterDays(int days) { dormantAfterMs = days * 24L * 3600 * 1000; }\n    /** Subscribe a listener. The list is shared with every account, so this reaches all of them at once. */\n    void addListener(AccountListener l) { listeners.add(l); }\n    /** Register a customer. */\n    Customer addCustomer(Customer c) { customers.put(c.id(), c); return c; }\n\n    /** Open a savings account with a minimum balance. */\n    SavingsAccount openSavings(String id, String customerId, Money opening, Money minBalance) {\n        SavingsAccount a = new SavingsAccount(id, customerId, opening, minBalance, clock, listeners);\n        register(a); return a;\n    }\n    /** Open a current account with an overdraft ceiling. */\n    CurrentAccount openCurrent(String id, String customerId, Money opening, Money overdraft) {\n        CurrentAccount a = new CurrentAccount(id, customerId, opening, overdraft, clock, listeners);\n        register(a); return a;\n    }\n    /** Index the account by its id and under its owner. Both lookups are O(1). */\n    private void register(Account a) {\n        if (accounts.putIfAbsent(a.id(), a) != null) throw new RuleViolation(&quot;account id already exists: &quot; + a.id());\n        accountsOf.computeIfAbsent(a.customerId(), k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(a.id());\n    }\n    /** An account by id. O(1), and it throws rather than returning null, so no caller can forget the check. */\n    Account account(String id) {\n        Account a = accounts.get(id);\n        if (a == null) throw new NoSuchAccount(&quot;no account &quot; + id);\n        return a;\n    }\n    /** The ids this customer owns. O(1): a read-only view, so a caller cannot edit the bank&#x27;s index. */\n    List&lt;String&gt; accountsOf(String customerId) {\n        return Collections.unmodifiableList(accountsOf.getOrDefault(customerId, List.of()));\n    }\n\n    /**\n     * Move money between two accounts so that nobody can ever see the debit without the credit. The ORDER is the\n     * design:\n     *   1  the transfer id: if it already has a receipt, return it and post nothing, so a retry is free\n     *      (the same id for a DIFFERENT transfer is refused, never answered with another transfer&#x27;s receipt);\n     *   2  take BOTH locks, lower account id first: every thread takes them in the same order, so two opposite\n     *      transfers can never each hold the lock the other wants, and deadlock is impossible rather than rare;\n     *   3  ask everything that could refuse BEFORE any money moves: the destination (frozen, closed, currency)\n     *      and the fee policy, so a policy that throws leaves nothing behind;\n     *   4  debit the source: its rules see the amount plus the fee, and the row is written in the same hold;\n     *   5  credit the destination: it cannot fail, because step 3 already asked;\n     *   6  write the fee row, already approved in step 4, in the same hold;\n     *   7  record the receipt under the same locks, release both, and only then tell the listeners.\n     * Anything that throws before step 4 leaves both accounts exactly as they were. Nothing is recorded for a\n     * failed transfer, so the same id may be retried once the reason is fixed.\n     */\n    TransferReceipt transfer(String transferId, String fromId, String toId, Money amount, String note) {\n        TransferReceipt prior = transfers.get(transferId);\n        if (prior != null) return sameRequest(prior, fromId, toId, amount);   // fast path: a retry takes no lock\n        Account from = account(fromId), to = account(toId);\n        if (from == to) throw new RuleViolation(&quot;a transfer needs two different accounts: &quot; + fromId);\n        Account first = fromId.compareTo(toId) &lt; 0 ? from : to;     // THE total order: by account id\n        Account second = (first == from) ? to : from;\n        Txn out, in, feeRow = null;\n        TransferReceipt receipt;\n        first.lockAccount();\n        second.lockAccount();\n        try {\n            TransferReceipt raced = transfers.get(transferId);\n            if (raced != null) return sameRequest(raced, fromId, toId, amount);   // a duplicate that got here first\n            to.checkCanReceive(amount);                             // everything that could refuse the credit,\n            Money fee = fees.feeFor(from, to, amount);              // and the fee: both before any money moves\n            if (fee != null &amp;&amp; fee.paise() &lt;= 0) fee = null;\n            out = from.debitForTransfer(amount, fee, transferId, note);\n            try {\n                in = to.creditForTransfer(amount, transferId, note);\n            } catch (RuntimeException impossible) {                 // belt and braces: never leave money in mid-air\n                from.postReversal(amount, transferId, &quot;reversal: the credit failed&quot;);\n                throw impossible;\n            }\n            if (fee != null) feeRow = from.postFeeRow(fee, transferId, &quot;transfer fee&quot;);   // approved in step 4\n            receipt = new TransferReceipt(transferId, fromId, toId, amount, out.atMs());\n            transfers.put(transferId, receipt);\n        } finally { second.unlockAccount(); first.unlockAccount(); }\n        from.publish(out); to.publish(in);                          // after both locks: a slow SMS stalls nobody\n        if (feeRow != null) from.publish(feeRow);\n        return receipt;\n    }\n\n    /** A retry must be the same request. An id reused for a different transfer is a caller bug, and is refused. */\n    private static TransferReceipt sameRequest(TransferReceipt r, String fromId, String toId, Money amount) {\n        if (!r.fromId().equals(fromId) || !r.toId().equals(toId) || !r.amount().equals(amount))\n            throw new RuleViolation(&quot;transfer id &quot; + r.transferId() + &quot; was already used for a different transfer&quot;);\n        return r;\n    }\n\n    /** The receipt for a transfer id, or null if it never completed. */\n    TransferReceipt receipt(String transferId) { return transfers.get(transferId); }\n\n    /**\n     * End of period: every account earns what its KIND&#x27;s rule says, as its own row. The rule is handed the\n     * account and the instant, so IT decides the basis \u2014 the balance as it stands, or the closing balance of\n     * every day in the period. FROZEN and CLOSED accounts get no row. Run it like a bank&#x27;s end-of-day batch.\n     */\n    List&lt;Txn&gt; accrueInterest(int days) {\n        List&lt;Txn&gt; posted = new ArrayList&lt;&gt;();\n        long now = clock.nowMs();\n        for (Account a : accounts.values()) {\n            InterestRule rule = interestRules.get(a.kind());\n            if (rule == null) continue;\n            Money interest = rule.interest(a, days, now);\n            if (interest.paise() &lt;= 0) continue;\n            // the status is checked INSIDE the account&#x27;s lock, by postInterest: an account frozen mid-batch is\n            // skipped, and the batch goes on\n            try { posted.add(a.postInterest(interest)); } catch (AccountNotActive frozenOrClosed) { }\n        }\n        return posted;\n    }\n\n    /** The dormancy sweep: anything ACTIVE and untouched for the dormancy period becomes DORMANT. */\n    int markDormant() {\n        long now = clock.nowMs();\n        int n = 0;\n        for (Account a : accounts.values()) if (a.markDormantIfIdle(now, dormantAfterMs)) n++;\n        return n;\n    }\n\n    /** Close an account. Refused unless the balance is exactly zero. */\n    void close(String accountId) { account(accountId).close(); }\n\n    /**\n     * What the bank holds in one currency, summed from the stored balances. Deliberately not a snapshot: read it\n     * when nothing is in flight. A transfer never changes it, which is the invariant the race test proves.\n     */\n    Money totalAssets(String currency) {\n        Money total = Money.zero(currency);\n        for (Account a : accounts.values()) if (a.currency().equals(currency)) total = total.plus(a.balance());\n        return total;\n    }\n\n    /** Every account, for a sweep or a report. */\n    Collection&lt;Account&gt; accounts() { return accounts.values(); }\n}\n\n/**\n * Proof it works: a demo of both account types, the rules, a transfer with its retry, a statement, interest and\n * dormancy on an injected clock, then sixty-four threads firing transfers in both directions between four\n * accounts while the bank&#x27;s total assets stay, to the paise, where they started.\n */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        long day = 24L * 3600 * 1000;\n        long[] now = { 1_700_000_000_000L };                       // the injected clock: the tests own the time\n        Bank bank = new Bank();\n        bank.configure(Map.of(AccountKind.SAVINGS, new SimpleInterest(400)), () -&gt; now[0]);\n        bank.dormantAfterDays(180);\n        AuditLog audit = new AuditLog();\n        LargeWithdrawalAlert alerts = new LargeWithdrawalAlert(Money.inr(&quot;50000.00&quot;));\n        bank.addListener(audit); bank.addListener(alerts);\n\n        bank.addCustomer(new Customer(&quot;c1&quot;, &quot;Asha&quot;));\n        bank.addCustomer(new Customer(&quot;c2&quot;, &quot;Bharat&quot;));\n        SavingsAccount asha = bank.openSavings(&quot;SB-1001&quot;, &quot;c1&quot;, Money.inr(&quot;100000.00&quot;), Money.inr(&quot;1000.00&quot;));\n        CurrentAccount shop = bank.openCurrent(&quot;CA-2001&quot;, &quot;c2&quot;, Money.inr(&quot;20000.00&quot;), Money.inr(&quot;50000.00&quot;));\n        System.out.println(&quot;opened &quot; + asha.id() + &quot; &quot; + asha.balance() + &quot; and &quot; + shop.id() + &quot; &quot; + shop.balance()\n                           + &quot;; Asha owns &quot; + bank.accountsOf(&quot;c1&quot;));\n\n        // savings keeps its floor: this withdrawal would leave INR 500, under the INR 1000 minimum\n        try {\n            asha.withdraw(Money.inr(&quot;99500.00&quot;), &quot;atm&quot;);\n        } catch (RuleViolation e) { System.out.println(&quot;expected: &quot; + e.getMessage()); }\n        System.out.println(&quot;after the refusal the balance is untouched: &quot; + asha.balance()\n                           + &quot;, rows &quot; + asha.rowCount());\n\n        // current may go negative, but only to the ceiling\n        shop.withdraw(Money.inr(&quot;60000.00&quot;), &quot;supplier&quot;);\n        System.out.println(&quot;current account overdrawn to &quot; + shop.balance());\n        try {\n            shop.withdraw(Money.inr(&quot;20000.00&quot;), &quot;too far&quot;);\n        } catch (RuleViolation e) { System.out.println(&quot;expected: &quot; + e.getMessage()); }\n\n        // a transfer: ordered locks, the destination checked first, then debit and credit as one step\n        TransferReceipt r = bank.transfer(&quot;T-1&quot;, &quot;SB-1001&quot;, &quot;CA-2001&quot;, Money.inr(&quot;25000.00&quot;), &quot;rent&quot;);\n        System.out.println(&quot;transfer &quot; + r.transferId() + &quot; &quot; + r.amount()\n                           + &quot; -&gt; &quot; + asha.balance() + &quot; / &quot; + shop.balance());\n        // the same transfer id again (a retried request): one receipt, no second pair of rows\n        TransferReceipt again = bank.transfer(&quot;T-1&quot;, &quot;SB-1001&quot;, &quot;CA-2001&quot;, Money.inr(&quot;25000.00&quot;), &quot;rent&quot;);\n        System.out.println(&quot;retry of T-1 returned the same receipt: &quot; + (r.equals(again))\n                           + &quot;, asha is still &quot; + asha.balance());\n\n        // a frozen destination refuses the credit, and the source is not touched\n        shop.freeze();\n        Money beforeFreeze = asha.balance();\n        try {\n            bank.transfer(&quot;T-2&quot;, &quot;SB-1001&quot;, &quot;CA-2001&quot;, Money.inr(&quot;1000.00&quot;), &quot;blocked&quot;);\n        } catch (AccountNotActive e) { System.out.println(&quot;expected: &quot; + e.getMessage()); }\n        System.out.println(&quot;the source was not debited: &quot; + beforeFreeze.equals(asha.balance())\n                           + &quot;, and T-2 has no receipt: &quot; + (bank.receipt(&quot;T-2&quot;) == null));\n        shop.unfreeze();\n\n        // interest on the injected clock: thirty days at 4.00% a year, savings only\n        now[0] += 30 * day;\n        List&lt;Txn&gt; interest = bank.accrueInterest(30);\n        System.out.println(&quot;interest rows &quot; + interest.size() + &quot; -&gt; &quot; + interest.get(0).amount()\n                           + &quot; (a current account earns none)&quot;);\n\n        // a festival bonus of 0.50% for the next month: a wrapper, not an edited rule\n        InterestRule promo = new PromoInterest(new SimpleInterest(400), 50);\n        System.out.println(&quot;thirty days on &quot; + asha.balance() + &quot;: plain &quot;\n                           + new SimpleInterest(400).on(asha.balance(), 30)\n                           + &quot;, with the festival bonus &quot; + promo.interest(asha, 30, now[0]));\n\n        // the statement for the window we just lived through\n        System.out.print(asha.statement(1_700_000_000_000L, now[0]).print());\n\n        // dormancy: six months with nobody touching the shop account\n        now[0] += 200 * day;\n        System.out.println(&quot;dormancy sweep marked &quot; + bank.markDormant() + &quot; account(s); shop is &quot; + shop.status());\n        shop.deposit(Money.inr(&quot;100.00&quot;), &quot;a customer pays&quot;);\n        System.out.println(&quot;one posting wakes it: &quot; + shop.status());\n\n        // closing is refused while money is inside\n        try {\n            bank.close(&quot;SB-1001&quot;);\n        } catch (RuleViolation e) { System.out.println(&quot;expected: &quot; + e.getMessage()); }\n\n        // sixty-four threads, transfers in both directions between four accounts: the total must not move\n        Bank busy = new Bank();\n        busy.configure(Map.of(), () -&gt; now[0]);\n        for (int i = 0; i &lt; 4; i++) busy.openCurrent(&quot;A&quot; + i, &quot;c1&quot;, Money.inr(&quot;10000.00&quot;), Money.inr(&quot;100000.00&quot;));\n        Money before = busy.totalAssets(Money.INR);\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; fired = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 64; i++) {\n            final int n = i;\n            fired.add(pool.submit(() -&gt; {\n                go.await();\n                String a = &quot;A&quot; + (n % 4), b = &quot;A&quot; + ((n + 1) % 4);\n                return busy.transfer(&quot;X&quot; + n, n % 2 == 0 ? a : b, n % 2 == 0 ? b : a, Money.inr(&quot;100.00&quot;), &quot;r&quot; + n);\n            }));\n        }\n        go.countDown();\n        int done = 0;\n        for (Future&lt;?&gt; f : fired) { f.get(); done++; }\n        pool.shutdown();\n        System.out.println(&quot;64 concurrent transfers: completed=&quot; + done\n                           + &quot; total assets before=&quot; + before + &quot; after=&quot; + busy.totalAssets(Money.INR));\n        if (done != 64 || !before.equals(busy.totalAssets(Money.INR)))\n            throw new AssertionError(&quot;a transfer created or destroyed money&quot;);\n        System.out.println(&quot;audit log saw &quot; + audit.size() + &quot; postings; alerts &quot; + alerts.alerts().size());\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: a daily cap on cash withdrawals -- one new class and one addRule line, and it composes with the floor\n/**\n * &quot;Cap ATM withdrawals at INR 3,000 a day.&quot; A cap is stateful: it has to remember what today already cost. As an\n * overridden method on SavingsAccount there is nowhere clean to keep that memory; as a rule object it is one\n * class with a private counter, updated through the onWithdrawn hook. It composes with the minimum balance,\n * because every rule on the account must agree. Its fields are only ever touched inside the account&#x27;s lock.\n * Rules see every debit, transfers included; a cash-only cap would need the channel passed to check().\n */\nfinal class DailyLimitRule implements WithdrawalRule {\n    private final Money cap;\n    private long day = -1;                                          // which UTC day the counter belongs to\n    private long spentPaise = 0;                                    // guarded by the account lock, like the balance\n\n    /** @param cap the most that may leave this account in one calendar day. */\n    DailyLimitRule(Money cap) { this.cap = cap; }\n\n    /** Refuse anything that would take today&#x27;s total past the cap. A new day starts the count at zero. */\n    public void check(Account account, Money amount, long nowMs) {\n        long today = nowMs / 86_400_000L;                           // UTC days; a real bank would use the branch&#x27;s zone\n        long already = (today == day) ? spentPaise : 0;\n        if (already + amount.paise() &gt; cap.paise())\n            throw new RuleViolation(&quot;daily cap &quot; + cap + &quot;: &quot; + Money.of(already, cap.currency())\n                                    + &quot; already taken today, &quot; + amount + &quot; would break it&quot;);\n    }\n\n    /** The memory: only called after the row was written, so a refused withdrawal never counts against the cap. */\n    public void onWithdrawn(Account account, Money amount, long nowMs) {\n        long today = nowMs / 86_400_000L;\n        if (today != day) { day = today; spentPaise = 0; }\n        spentPaise += amount.paise();\n    }\n    /** What is left of today&#x27;s allowance. */\n    Money remainingToday(long nowMs) {\n        long today = nowMs / 86_400_000L;\n        return Money.of(cap.paise() - (today == day ? spentPaise : 0), cap.currency());\n    }\n}\n// the whole change at the call site:\n//     asha.addRule(new DailyLimitRule(Money.inr(&quot;3000.00&quot;)));\n\n// ---- ext: interest on the daily closing balance -- the basis is the rule&#x27;s choice, and the ledger is the record\n/**\n * What a savings account is really paid on. An Indian bank pays interest on the CLOSING BALANCE OF EVERY DAY,\n * not on whatever happens to be in the account when the batch runs, so money paid in on the 28th earns three\n * days and not a month. The rule reads the ledger to get those daily balances \u2014 which is exactly why\n * InterestRule is handed the account and not a number. The division happens once, at the end, so the whole\n * period is rounded down a single time instead of once a day.\n */\nfinal class DailyBalanceInterest implements InterestRule {\n    private final int annualBasisPoints;\n\n    /** @param annualBasisPoints hundredths of a percent a year: 400 is 4.00%. */\n    DailyBalanceInterest(int annualBasisPoints) { this.annualBasisPoints = annualBasisPoints; }\n\n    /** Sum the days&#x27; closing balances (an overdrawn day earns nothing), then apply the rate once. */\n    public Money interest(Account account, int days, long nowMs) {\n        if (days &lt;= 0) return Money.zero(account.currency());\n        long sum = 0;\n        for (long closing : DailyBalances.closingPaise(account, days, nowMs)) if (closing &gt; 0) sum += closing;\n        return Money.of(sum * annualBasisPoints / (10_000L * 365L), account.currency());\n    }\n}\n\n/**\n * The closing balance of each of the last N days, read off the ledger. Every row carries the balance after it\n * and the rows are already in time order, so one day is a binary search: one O(n) copy of the rows, then\n * O(N log n). Interest is a batch job, so one copy per account is the right price for not holding the lock.\n */\nfinal class DailyBalances {\n    static final long DAY_MS = 24L * 3600 * 1000;\n\n    /** Index 0 is the closing balance of the day that ends at nowMs, index 1 the day before, and so on back N days. */\n    static long[] closingPaise(Account account, int days, long nowMs) {\n        List&lt;Txn&gt; rows = account.ledger();\n        long[] closing = new long[days];\n        for (int d = 0; d &lt; days; d++) closing[d] = balanceBefore(rows, nowMs - (long) d * DAY_MS);\n        return closing;\n    }\n\n    /**\n     * The balance after the last row strictly BEFORE this instant (a day&#x27;s end), or zero if the account did not\n     * exist yet. Strictly: a row stamped exactly at midnight belongs to the day that starts then, not the one ending.\n     */\n    private static long balanceBefore(List&lt;Txn&gt; rows, long ms) {\n        int lo = 0, hi = rows.size();\n        while (lo &lt; hi) { int mid = (lo + hi) &gt;&gt;&gt; 1; if (rows.get(mid).atMs() &lt; ms) lo = mid + 1; else hi = mid; }\n        return lo == 0 ? 0 : rows.get(lo - 1).balanceAfter().paise();\n    }\n}\n\n// ---- ext: a charge instead of a veto -- the minimum-balance penalty, and interest on an overdraft\n/**\n * What the bank takes at the end of a period, as opposed to what it pays. Same shape as InterestRule, opposite\n * direction, and zero is the normal answer. Kept separate from WithdrawalRule on purpose: a veto happens at the\n * moment of a withdrawal, a charge happens at the end of a month and cannot refuse anything. The sweep calls it\n * with the account&#x27;s lock held, so it must be quick and must never touch another account (a second lock taken\n * out of id order could deadlock with a transfer).\n */\ninterface MonthlyCharge {\n    /** What this account owes the bank for the period ending at nowMs. Never negative; zero means no row. */\n    Money charge(Account account, int days, long nowMs);\n}\n\n/**\n * &quot;Do not refuse her, charge her.&quot; A real savings account does not bounce a withdrawal for breaking the minimum\n * balance; it lets the balance fall and bills a penalty once a month, on the AVERAGE of the daily closing\n * balances. Swapping the MinBalanceRule veto for this charge is a one-line change at the call site and touches\n * nothing else \u2014 the same move as the daily cap, in the other direction. Two RBI rules shape the number: the\n * charge is a share of the shortfall (not a flat fee), and it may never take the balance below zero.\n */\nfinal class MinBalancePenalty implements MonthlyCharge {\n    private final Money required;\n    private final int shortfallBasisPoints;\n\n    /**\n     * @param required the average monthly balance the product promises\n     * @param shortfallBasisPoints the share of the shortfall charged, in hundredths of a per cent: 400 = 4%\n     */\n    MinBalancePenalty(Money required, int shortfallBasisPoints) {\n        this.required = required; this.shortfallBasisPoints = shortfallBasisPoints;\n    }\n\n    /** Savings only: a share of (required - average daily closing balance), capped at what the account holds. */\n    public Money charge(Account account, int days, long nowMs) {\n        if (account.kind() != AccountKind.SAVINGS || days &lt;= 0) return Money.zero(account.currency());\n        long sum = 0;\n        for (long closing : DailyBalances.closingPaise(account, days, nowMs)) sum += closing;\n        long shortfall = required.paise() - sum / days;\n        if (shortfall &lt;= 0) return Money.zero(account.currency());\n        long fee = shortfall * shortfallBasisPoints / 10_000L;\n        return Money.of(Math.min(fee, Math.max(0, account.balance().paise())), account.currency());  // never below zero\n    }\n}\n\n/**\n * The other half of &quot;what differs between savings and current&quot;: a current account that sits overdrawn pays for\n * it. The rate is applied to the negative part of each day&#x27;s closing balance, so an afternoon in the red costs\n * a day and not a month, and an account that never went under pays nothing without a special case.\n */\nfinal class OverdraftInterest implements MonthlyCharge {\n    private final int annualBasisPoints;\n\n    /** @param annualBasisPoints the overdraft rate: 1800 is 18.00% a year. */\n    OverdraftInterest(int annualBasisPoints) { this.annualBasisPoints = annualBasisPoints; }\n\n    /** Current accounts only; the sum of the days spent below zero, charged once at the end. */\n    public Money charge(Account account, int days, long nowMs) {\n        if (account.kind() != AccountKind.CURRENT || days &lt;= 0) return Money.zero(account.currency());\n        long owed = 0;\n        for (long closing : DailyBalances.closingPaise(account, days, nowMs)) if (closing &lt; 0) owed += -closing;\n        return Money.of(owed * annualBasisPoints / (10_000L * 365L), account.currency());\n    }\n}\n\n/**\n * The end-of-month batch: every charge against every account, each as its own FEE row so a statement can\n * explain it. A charge deliberately does NOT run the withdrawal rules \u2014 it is the bank taking its own money,\n * and the penalty for breaking the minimum balance may push the balance further below that minimum (never below\n * zero: the penalty caps itself). Each charge is computed and written in ONE hold of the account&#x27;s lock, so a\n * withdrawal cannot slip in between the cap and the row; the hold lasts microseconds, one account at a time.\n */\nfinal class MonthEndSweep {\n    /** Post every charge that came out positive. Returns the rows written, for a test or a report. */\n    static List&lt;Txn&gt; run(Bank bank, List&lt;MonthlyCharge&gt; charges, int days, long nowMs) {\n        List&lt;Txn&gt; posted = new ArrayList&lt;&gt;();\n        for (Account a : bank.accounts()) {\n            for (MonthlyCharge c : charges) {\n                Txn row = null;\n                a.lockAccount();\n                try {\n                    Money amount = c.charge(a, days, nowMs);\n                    if (amount.paise() &gt; 0) row = a.postFeeRow(amount, null, c.getClass().getSimpleName());\n                } catch (AccountNotActive frozenOrClosed) {         // checked inside the lock; the batch goes on\n                } finally { a.unlockAccount(); }\n                if (row != null) { a.publish(row); posted.add(row); }   // listeners hear after the unlock\n            }\n        }\n        return posted;\n    }\n}\n\n// ---- ext: a joint account -- two owners, and anything large needs a second signature\n/**\n * Two owners on one balance. The only new state is the owner set; everything that makes it a joint account is a\n * rule: above a threshold a withdrawal is refused until a second, different owner has signed for that exact\n * amount. The signature arms the rule; the withdrawal spends it, through the same onWithdrawn hook the daily cap\n * uses, so one signature can never pay for two withdrawals. Both maps are guarded by the account&#x27;s lock, like\n * the balance: check and onWithdrawn already run inside it, and JointAccount.sign takes it around sign().\n */\nfinal class DualApprovalRule implements WithdrawalRule {\n    private final Money threshold;\n    private final Map&lt;Long, Set&lt;String&gt;&gt; signatures = new HashMap&lt;&gt;();   // amount in paise -&gt; who has signed\n    private final Set&lt;Long&gt; armed = new HashSet&lt;&gt;();                     // amounts with two distinct signatures\n\n    /** @param threshold the amount above which one owner is not enough. */\n    DualApprovalRule(Money threshold) { this.threshold = threshold; }\n\n    /** True when this amount needs a second owner. */\n    boolean needsTwo(Money amount) { return threshold.lessThan(amount); }\n\n    /** Record a signature; returns true once two different owners have signed for this amount. Lock held. */\n    boolean sign(String ownerId, Money amount) {\n        Set&lt;String&gt; who = signatures.computeIfAbsent(amount.paise(), k -&gt; new HashSet&lt;&gt;());\n        who.add(ownerId);\n        if (who.size() &gt;= 2) { armed.add(amount.paise()); return true; }\n        return false;\n    }\n    /** Small amounts pass; large ones need the amount to be armed by a second owner. */\n    public void check(Account account, Money amount, long nowMs) {\n        if (needsTwo(amount) &amp;&amp; !armed.contains(amount.paise()))\n            throw new RuleViolation(&quot;a withdrawal over &quot; + threshold + &quot; needs a second owner&#x27;s signature&quot;);\n    }\n    /** Spend the signature: one approval, one withdrawal. */\n    public void onWithdrawn(Account account, Money amount, long nowMs) {\n        armed.remove(amount.paise());\n        signatures.remove(amount.paise());\n    }\n}\n\n/**\n * An account with more than one owner. It is a plain Account plus a set of owners and the approval rule; the\n * balance, the ledger, the lock and the posting path are exactly the ones every other account uses.\n */\nfinal class JointAccount extends Account {\n    private final Set&lt;String&gt; owners;\n    private final DualApprovalRule approvals;\n\n    /** Open a joint account. The first owner is the primary for reporting; both may sign. */\n    JointAccount(String id, List&lt;String&gt; owners, Money opening, Money minBalance, Money approvalThreshold,\n                 Clock clock, List&lt;AccountListener&gt; listeners) {\n        super(id, owners.get(0), AccountKind.SAVINGS, opening, clock, listeners);\n        this.owners = new LinkedHashSet&lt;&gt;(owners);\n        this.approvals = new DualApprovalRule(approvalThreshold);\n        addRule(new MinBalanceRule(minBalance));\n        addRule(approvals);                                          // two vetoes, and both must agree\n    }\n    /** Who may sign. */\n    Set&lt;String&gt; owners() { return Collections.unmodifiableSet(owners); }\n    /**\n     * One owner asks for money. Under the threshold it simply goes through; over it, the first call parks the\n     * request and returns null, and the second owner&#x27;s call performs the withdrawal. Any other refusal (the\n     * minimum balance, say) is thrown, never mistaken for &quot;waiting for a signature&quot;.\n     */\n    Txn sign(String ownerId, Money amount, String note) {\n        if (!owners.contains(ownerId)) throw new RuleViolation(ownerId + &quot; does not own &quot; + id());\n        if (!approvals.needsTwo(amount)) return withdraw(amount, note);   // one owner is enough\n        boolean armed;\n        lockAccount();                                                    // the rule&#x27;s maps live under this lock\n        try { armed = approvals.sign(ownerId, amount); } finally { unlockAccount(); }\n        return armed ? withdraw(amount, note) : null;                     // first owner: parked; second: done\n    }\n}\n\n// ---- ext: a standing instruction -- rent on the first of every month, and a job that ran twice pays once\n/**\n * Rent, an SIP, an EMI: a schedule that posts real transfers. The interesting part is not the schedule, it is\n * the transfer id: it carries the period number, so running the job twice \u2014 or on two threads at the same\n * moment \u2014 pays each period exactly once, because Bank.transfer is idempotent by that id (a retry with the same\n * id does nothing new). Across two servers the same id needs a shared store: the unique index further down.\n */\nfinal class StandingInstruction {\n    private final String id, fromId, toId;\n    private final Money amount;\n    private final long startMs, periodMs;\n\n    /** @param id the instruction&#x27;s name, which becomes the prefix of every transfer id it creates. */\n    StandingInstruction(String id, String fromId, String toId, Money amount, long startMs, long periodMs) {\n        this.id = id; this.fromId = fromId; this.toId = toId; this.amount = amount;\n        this.startMs = startMs; this.periodMs = periodMs;\n    }\n    /** Pay every period that has fallen due by nowMs. Safe to call as often as you like, from anywhere. */\n    List&lt;TransferReceipt&gt; runUpTo(Bank bank, long nowMs) {\n        List&lt;TransferReceipt&gt; paid = new ArrayList&lt;&gt;();\n        for (long period = 0; startMs + period * periodMs &lt;= nowMs; period++)\n            paid.add(bank.transfer(id + &quot;#&quot; + period, fromId, toId, amount, id + &quot; period &quot; + period));\n        return paid;\n    }\n}\n\n// ---- ext: a loan as a schedule -- the outstanding falls, and each instalment is an ordinary transfer\n/**\n * A loan is not a new kind of money: it is an amount still owed plus a schedule of instalments, each one an\n * ordinary transfer from the borrower&#x27;s account into the loan account. This one uses equal principal with\n * interest on the reducing outstanding, so every number is exact integer paise. (A bank&#x27;s EMI uses the annuity\n * formula; BigDecimal.pow(n) computes (1 + r)^n exactly, so no double is needed: round the instalment to paise\n * once and let the LAST instalment absorb the rounding, so the loan still closes at zero.)\n */\nfinal class Loan {\n    private final String loanAccountId, borrowerAccountId;\n    private final Money principal;\n    private final int annualBasisPoints, months;\n    private Money outstanding;\n    private int paid = 0;                                            // instalments already paid, in order\n\n    /** @param principal what was lent; @param months how many equal-principal instalments. */\n    Loan(String loanAccountId, String borrowerAccountId, Money principal, int annualBasisPoints, int months) {\n        this.loanAccountId = loanAccountId; this.borrowerAccountId = borrowerAccountId;\n        this.principal = principal; this.annualBasisPoints = annualBasisPoints; this.months = months;\n        this.outstanding = principal;\n    }\n    /** What is still owed. */\n    synchronized Money outstanding() { return outstanding; }\n    /** The interest part of the next instalment: one month on what is still outstanding. */\n    synchronized Money interestDue() {\n        return Money.of(outstanding.paise() * annualBasisPoints / (10_000L * 12L), outstanding.currency());\n    }\n    /**\n     * Pay instalment n: principal/months plus this month&#x27;s interest, moved from the borrower&#x27;s account to the\n     * loan account by an ordinary transfer, with an id that contains n so a repeated job cannot double-charge.\n     * A repeat of an instalment already paid returns its receipt and leaves the outstanding alone, so the loan&#x27;s\n     * own numbers are as safe as the money. The last instalment absorbs the rounding, so the loan closes at zero.\n     */\n    synchronized TransferReceipt pay(Bank bank, int n) {\n        String id = loanAccountId + &quot;#emi&quot; + n;\n        if (n &lt; paid) return bank.receipt(id);                          // the job ran twice: nothing changes\n        if (n != paid || n &gt;= months) throw new RuleViolation(&quot;instalment &quot; + n + &quot; is not the next one due&quot;);\n        Money principalPart = (n == months - 1) ? outstanding\n                            : Money.of(principal.paise() / months, principal.currency());\n        Money due = principalPart.plus(interestDue());\n        TransferReceipt r = bank.transfer(id, borrowerAccountId, loanAccountId, due, &quot;emi &quot; + (n + 1) + &quot; of &quot; + months);\n        outstanding = outstanding.minus(principalPart);                 // only after the money moved\n        paid++;\n        return r;\n    }\n}\n\n// ---- ext: KYC -- an unverified account may receive money, but not take much out\n/**\n * KYC is a state, and the consequence of the state is a rule. Nothing in Account or Bank changes: the status\n * lives on the rule that reads it, and a verified customer&#x27;s rule simply stops refusing. Note the shape \u2014 this\n * is the same move as the daily cap, which is what &quot;a new rule is a new class&quot; is supposed to feel like.\n */\nenum KycStatus { PENDING, VERIFIED, EXPIRED }\n\n/**\n * Caps withdrawals while the customer&#x27;s papers are not in order. The status is set by the back office from\n * outside the account&#x27;s lock, so it is volatile: the next withdrawal on any thread sees the latest value.\n */\nfinal class KycRule implements WithdrawalRule {\n    private final Money capWhilePending;\n    private volatile KycStatus status = KycStatus.PENDING;\n    /** @param capWhilePending the most an unverified account may take out in one go. */\n    KycRule(Money capWhilePending) { this.capWhilePending = capWhilePending; }\n    /** Move the customer along their KYC life. */\n    void set(KycStatus s) { status = s; }\n    /** VERIFIED passes everything; PENDING and EXPIRED are capped. */\n    public void check(Account account, Money amount, long nowMs) {\n        if (status != KycStatus.VERIFIED &amp;&amp; capWhilePending.lessThan(amount))\n            throw new RuleViolation(&quot;KYC is &quot; + status + &quot;: withdrawals are capped at &quot; + capWhilePending);\n    }\n}\n\n// ---- ext: a fee on a transfer -- a third row, written inside the same two locks\n/**\n * A flat fee on anything above a threshold. The policy itself is trivial; the design point is when it is asked:\n * Bank.transfer asks it before any money moves, the source&#x27;s rules must agree to the amount plus the fee, and\n * the fee row is written in the same two-lock hold, so no other thread ever sees the transfer without its fee.\n */\nfinal class FlatFeeAboveThreshold implements FeePolicy {\n    private final Money threshold, fee;\n    /** @param threshold transfers above this are charged; @param fee the flat charge. */\n    FlatFeeAboveThreshold(Money threshold, Money fee) { this.threshold = threshold; this.fee = fee; }\n    /** The flat fee, or null when the transfer is small enough to be free. */\n    public Money feeFor(Account from, Account to, Money amount) { return threshold.lessThan(amount) ? fee : null; }\n}\n// the whole change at the call site:\n//     bank.setFeePolicy(new FlatFeeAboveThreshold(Money.inr(&quot;100000.00&quot;), Money.inr(&quot;25.00&quot;)));\n\n// ---- ext: persistence and a second server -- the conditional UPDATE is the lock, moved into the database\n/**\n * When the balance outlives the process, the account lock is no longer the thing that decides the winner: the\n * database is. The debit becomes one conditional UPDATE whose WHERE clause carries the rule, so two servers\n * racing on the same account cannot both succeed, and the transfer id gets a unique index, so a retried request\n * inserts nothing the second time. Both are the same idea as the in-memory version, one level down.\n */\ninterface AccountRepository {\n    /** UPDATE accounts SET paise = paise - ? WHERE id = ? AND paise - ? &gt;= floor -- true if one row changed. */\n    boolean debitIfAllowed(String accountId, long paise, long floorPaise);\n    /** UPDATE accounts SET paise = paise + ? WHERE id = ? -- a credit has no condition to fail on. */\n    void credit(String accountId, long paise);\n    /** INSERT INTO transfers(id) VALUES (?) ON CONFLICT DO NOTHING -- true if this caller inserted the row. */\n    boolean claimTransfer(String transferId);\n    /** What a ROLLBACK does to the claim: the id is free again, so a refused transfer can be retried. */\n    void releaseTransfer(String transferId);\n    /** SELECT paise FROM accounts WHERE id = ?. */\n    long balance(String accountId);\n}\n\n/** A hash map pretending to be a table, so the shape of the calls can be run and tested here. */\nfinal class InMemoryAccountRepository implements AccountRepository {\n    private final Map&lt;String, Long&gt; rows = new ConcurrentHashMap&lt;&gt;();\n    private final Set&lt;String&gt; transfers = ConcurrentHashMap.newKeySet();\n    /** Seed a row, the way a migration would. */\n    InMemoryAccountRepository open(String accountId, long paise) { rows.put(accountId, paise); return this; }\n    /** The compare-and-set: compute the new value and write it only if the condition still holds. */\n    public boolean debitIfAllowed(String accountId, long paise, long floorPaise) {\n        Long[] ok = { null };\n        rows.computeIfPresent(accountId, (k, current) -&gt; {\n            if (current - paise &lt; floorPaise) return current;                  // the WHERE clause said no\n            ok[0] = current - paise; return current - paise;\n        });\n        return ok[0] != null;\n    }\n    /** An unconditional add. */\n    public void credit(String accountId, long paise) { rows.merge(accountId, paise, Long::sum); }\n    /** The unique index on the transfer id, doing the idempotency. */\n    public boolean claimTransfer(String transferId) { return transfers.add(transferId); }\n    /** The rollback of a claim. */\n    public void releaseTransfer(String transferId) { transfers.remove(transferId); }\n    /** Read one row. */\n    public long balance(String accountId) { return rows.getOrDefault(accountId, 0L); }\n}\n\n/**\n * The whole two-server transfer: claim the id, debit conditionally, credit. No application lock anywhere. In\n * the database the three statements are ONE transaction, so a refused debit rolls the claim back with it;\n * here that rollback is the releaseTransfer call, and it is what lets the caller retry the same id later.\n */\nfinal class PersistedTransfer {\n    /** Returns false when the debit&#x27;s condition failed; true when the money moved or had already moved. */\n    static boolean transfer(AccountRepository repo, String transferId, String fromId, String toId,\n                            long paise, long floorPaise) {\n        if (!repo.claimTransfer(transferId)) return true;                      // somebody already did this one\n        if (!repo.debitIfAllowed(fromId, paise, floorPaise)) {                 // the rule lives in the WHERE clause\n            repo.releaseTransfer(transferId);                                  // ROLLBACK: nothing moved, id free\n            return false;\n        }\n        repo.credit(toId, paise);\n        return true;\n    }\n}\n\n/**\n * Runs every extension once, so the reference code on page 05 is code that actually executes rather than a\n * snippet in a slide. Compile with Main.java and run: java ExtDemo.\n */\nclass ExtDemo {\n    public static void main(String[] args) {\n        long day = 24L * 3600 * 1000, month = 30L * day;\n        long[] now = { 1_700_000_000_000L };\n        Bank bank = new Bank();\n        bank.configure(Map.of(AccountKind.SAVINGS, new SimpleInterest(400)), () -&gt; now[0]);\n        bank.addCustomer(new Customer(&quot;c1&quot;, &quot;Asha&quot;));\n        bank.addCustomer(new Customer(&quot;c2&quot;, &quot;Bharat&quot;));\n\n        // 1. the daily cap: one class, one line, and it composes with the minimum balance\n        SavingsAccount asha = bank.openSavings(&quot;SB-1&quot;, &quot;c1&quot;, Money.inr(&quot;50000.00&quot;), Money.inr(&quot;1000.00&quot;));\n        DailyLimitRule cap = new DailyLimitRule(Money.inr(&quot;3000.00&quot;));\n        asha.addRule(cap);\n        asha.withdraw(Money.inr(&quot;2000.00&quot;), &quot;atm&quot;);\n        try { asha.withdraw(Money.inr(&quot;1500.00&quot;), &quot;atm again&quot;); }\n        catch (RuleViolation e) { System.out.println(&quot;daily cap: &quot; + e.getMessage()); }\n        System.out.println(&quot;left today &quot; + cap.remainingToday(now[0]) + &quot;, balance &quot; + asha.balance());\n        now[0] += day;                                                         // tomorrow, the allowance is back\n        asha.withdraw(Money.inr(&quot;2500.00&quot;), &quot;atm tomorrow&quot;);\n        System.out.println(&quot;tomorrow the cap resets: balance &quot; + asha.balance());\n\n        // 2. a joint account: the second signature is what makes the large withdrawal happen\n        JointAccount joint = new JointAccount(&quot;JT-1&quot;, List.of(&quot;c1&quot;, &quot;c2&quot;), Money.inr(&quot;200000.00&quot;),\n                Money.inr(&quot;1000.00&quot;), Money.inr(&quot;50000.00&quot;), () -&gt; now[0], List.of());\n        System.out.println(&quot;one owner asks for INR 80000: &quot; + joint.sign(&quot;c1&quot;, Money.inr(&quot;80000.00&quot;), &quot;car&quot;));\n        Txn done = joint.sign(&quot;c2&quot;, Money.inr(&quot;80000.00&quot;), &quot;car&quot;);\n        System.out.println(&quot;the second owner signs: &quot; + done + &quot;, balance &quot; + joint.balance());\n\n        // 3. a standing instruction, run twice on purpose\n        CurrentAccount landlord = bank.openCurrent(&quot;CA-9&quot;, &quot;c2&quot;, Money.inr(&quot;0.00&quot;), Money.inr(&quot;0.00&quot;));\n        bank.openSavings(&quot;SB-R&quot;, &quot;c1&quot;, Money.inr(&quot;100000.00&quot;), Money.inr(&quot;0.00&quot;));   // no daily cap on this one\n        StandingInstruction rent = new StandingInstruction(&quot;rent&quot;, &quot;SB-R&quot;, &quot;CA-9&quot;, Money.inr(&quot;12000.00&quot;),\n                                                           now[0], month);\n        rent.runUpTo(bank, now[0] + 2 * month);\n        rent.runUpTo(bank, now[0] + 2 * month);                                // the job ran twice\n        System.out.println(&quot;rent after running the job twice: landlord holds &quot; + landlord.balance()\n                           + &quot; over &quot; + landlord.rowCount() + &quot; rows&quot;);\n\n        // 4. a loan: equal principal plus interest on the reducing outstanding, closing at exactly zero\n        CurrentAccount loanAccount = bank.openCurrent(&quot;LN-1&quot;, &quot;c1&quot;, Money.inr(&quot;0.00&quot;), Money.inr(&quot;0.00&quot;));\n        bank.openSavings(&quot;SB-2&quot;, &quot;c1&quot;, Money.inr(&quot;100000.00&quot;), Money.inr(&quot;0.00&quot;));\n        Loan loan = new Loan(&quot;LN-1&quot;, &quot;SB-2&quot;, Money.inr(&quot;60000.00&quot;), 1200, 6);\n        for (int i = 0; i &lt; 6; i++) loan.pay(bank, i);\n        System.out.println(&quot;loan outstanding after six instalments: &quot; + loan.outstanding()\n                           + &quot;, loan account holds &quot; + loanAccount.balance());\n\n        // 5. KYC: a state, whose consequence is a rule\n        SavingsAccount newbie = bank.openSavings(&quot;SB-3&quot;, &quot;c2&quot;, Money.inr(&quot;90000.00&quot;), Money.inr(&quot;0.00&quot;));\n        KycRule kyc = new KycRule(Money.inr(&quot;10000.00&quot;));\n        newbie.addRule(kyc);\n        try { newbie.withdraw(Money.inr(&quot;25000.00&quot;), &quot;big&quot;); }\n        catch (RuleViolation e) { System.out.println(&quot;kyc: &quot; + e.getMessage()); }\n        kyc.set(KycStatus.VERIFIED);\n        newbie.withdraw(Money.inr(&quot;25000.00&quot;), &quot;big, after verification&quot;);\n        System.out.println(&quot;after verification the same withdrawal works: &quot; + newbie.balance());\n\n        // 6. a fee: a third row inside the same two locks as the transfer\n        bank.setFeePolicy(new FlatFeeAboveThreshold(Money.inr(&quot;10000.00&quot;), Money.inr(&quot;25.00&quot;)));\n        Money before = newbie.balance();\n        bank.transfer(&quot;F-1&quot;, &quot;SB-3&quot;, &quot;CA-9&quot;, Money.inr(&quot;20000.00&quot;), &quot;big transfer&quot;);\n        System.out.println(&quot;transfer of INR 20000 with a fee: &quot; + before + &quot; -&gt; &quot; + newbie.balance()\n                           + &quot; (20000 + 25), rows end with &quot; + newbie.ledger().get(newbie.rowCount() - 1).type());\n\n        // 7. the basis of interest: the same money, the same rate, two honest answers\n        long[] later = { 1_700_000_000_000L };\n        Bank b2 = new Bank();\n        b2.configure(Map.of(), () -&gt; later[0]);\n        b2.addCustomer(new Customer(&quot;c1&quot;, &quot;Asha&quot;));\n        SavingsAccount late = b2.openSavings(&quot;SB-L&quot;, &quot;c1&quot;, Money.inr(&quot;10000.00&quot;), Money.inr(&quot;0.00&quot;));\n        later[0] += 27 * day;\n        late.deposit(Money.inr(&quot;100000.00&quot;), &quot;salary on the 28th&quot;);\n        later[0] += 3 * day;\n        System.out.println(&quot;30 days at 4%: on the balance as it stands = &quot;\n                           + new SimpleInterest(400).interest(late, 30, later[0])\n                           + &quot;, on the daily closing balances = &quot;\n                           + new DailyBalanceInterest(400).interest(late, 30, later[0]));\n\n        // 8. month end: a penalty instead of a veto, and interest on the days spent overdrawn\n        SavingsAccount thin = b2.openSavings(&quot;SB-T&quot;, &quot;c1&quot;, Money.inr(&quot;500.00&quot;), Money.inr(&quot;0.00&quot;));\n        CurrentAccount red = b2.openCurrent(&quot;CA-T&quot;, &quot;c1&quot;, Money.inr(&quot;0.00&quot;), Money.inr(&quot;100000.00&quot;));\n        red.withdraw(Money.inr(&quot;50000.00&quot;), &quot;a bad month&quot;);\n        later[0] += 30 * day;\n        List&lt;Txn&gt; charges = MonthEndSweep.run(b2, List.of(new MinBalancePenalty(Money.inr(&quot;10000.00&quot;), 400),\n                                                          new OverdraftInterest(1800)), 30, later[0]);\n        System.out.println(&quot;month-end charges: &quot; + charges.size() + &quot; rows -&gt; thin &quot; + thin.balance()\n                           + &quot; (4% of a 9,500 shortfall), overdrawn &quot; + red.balance());\n\n        // 9. persistence: the conditional UPDATE is the lock, and the unique index is the idempotency\n        AccountRepository repo = new InMemoryAccountRepository().open(&quot;A&quot;, 100_000).open(&quot;B&quot;, 0);\n        System.out.println(&quot;db transfer 700.00: &quot; + PersistedTransfer.transfer(repo, &quot;t1&quot;, &quot;A&quot;, &quot;B&quot;, 70_000, 0));\n        System.out.println(&quot;the same request again: &quot; + PersistedTransfer.transfer(repo, &quot;t1&quot;, &quot;A&quot;, &quot;B&quot;, 70_000, 0)\n                           + &quot; and A still holds &quot; + Money.of(repo.balance(&quot;A&quot;), Money.INR));\n        System.out.println(&quot;one more, which the WHERE clause refuses: &quot;\n                           + PersistedTransfer.transfer(repo, &quot;t2&quot;, &quot;A&quot;, &quot;B&quot;, 70_000, 0));\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n/**\n * Targeted failure tests: each one proves a claim the design makes on page 02, move 9. Run with\n * javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests -- it prints ALL PASS or exits non-zero.\n */\npublic class FailureTests {\n    static int failures = 0;\n    /** One assertion, printed either way, counted when it fails. */\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what);\n        if (!ok) failures++;\n    }\n    /** Every bank these tests build, so the last check can replay every ledger in all of them. */\n    static final List&lt;Bank&gt; ALL = new ArrayList&lt;&gt;();\n    /** A bank whose clock is the array the caller can move, so &quot;six months later&quot; costs no time at all. */\n    static Bank bankAt(long[] now, Map&lt;AccountKind, InterestRule&gt; rules) {\n        Bank b = new Bank();\n        b.configure(rules, () -&gt; now[0]);\n        b.addCustomer(new Customer(&quot;c1&quot;, &quot;Asha&quot;));\n        b.addCustomer(new Customer(&quot;c2&quot;, &quot;Bharat&quot;));\n        ALL.add(b);\n        return b;\n    }\n\n    public static void main(String[] args) throws Exception {\n        long day = 24L * 3600 * 1000;\n        long[] now = { 1_700_000_000_000L };\n\n        // 1. an overdraft is a CURRENT-account thing. Savings stops at its floor; current sinks to its ceiling\n        //    and refuses the step past it. Same code path, different rule objects.\n        Bank bank = bankAt(now, Map.of(AccountKind.SAVINGS, new SimpleInterest(400)));\n        SavingsAccount savings = bank.openSavings(&quot;SB-1&quot;, &quot;c1&quot;, Money.inr(&quot;10000.00&quot;), Money.inr(&quot;1000.00&quot;));\n        CurrentAccount current = bank.openCurrent(&quot;CA-1&quot;, &quot;c2&quot;, Money.inr(&quot;10000.00&quot;), Money.inr(&quot;50000.00&quot;));\n        try {\n            savings.withdraw(Money.inr(&quot;9500.00&quot;), &quot;would break the floor&quot;);\n            check(false, &quot;a savings withdrawal through the minimum balance must be refused&quot;);\n        } catch (RuleViolation e) { check(true, &quot;savings refused: &quot; + e.getMessage()); }\n        current.withdraw(Money.inr(&quot;55000.00&quot;), &quot;supplier&quot;);\n        check(current.balance().equals(Money.inr(&quot;-45000.00&quot;)), &quot;a current account may run to &quot; + current.balance());\n        try {\n            current.withdraw(Money.inr(&quot;6000.00&quot;), &quot;past the ceiling&quot;);\n            check(false, &quot;a current withdrawal past the overdraft ceiling must be refused&quot;);\n        } catch (RuleViolation e) { check(true, &quot;current refused at the ceiling: &quot; + e.getMessage()); }\n\n        // 2. a refused withdrawal writes NOTHING: not a row, not a paise, not an alert.\n        Money before = savings.balance();\n        int rowsBefore = savings.rowCount();\n        try { savings.withdraw(Money.inr(&quot;100000.00&quot;), &quot;far too much&quot;); } catch (RuleViolation ignored) {}\n        check(before.equals(savings.balance()) &amp;&amp; rowsBefore == savings.rowCount(),\n              &quot;the refused withdrawal changed neither the balance nor the ledger&quot;);\n\n        // 3. interest for a period, on the injected clock, and only for the kind that earns it.\n        //    INR 100000.00 at 4.00% for 365 days is exactly INR 4000.00, in integer paise.\n        long[] t3 = { 1_700_000_000_000L };\n        Bank b3 = bankAt(t3, Map.of(AccountKind.SAVINGS, new SimpleInterest(400)));\n        SavingsAccount s3 = b3.openSavings(&quot;SB-3&quot;, &quot;c1&quot;, Money.inr(&quot;100000.00&quot;), Money.inr(&quot;0.00&quot;));\n        CurrentAccount c3 = b3.openCurrent(&quot;CA-3&quot;, &quot;c2&quot;, Money.inr(&quot;100000.00&quot;), Money.inr(&quot;0.00&quot;));\n        t3[0] += 365 * day;\n        List&lt;Txn&gt; posted = b3.accrueInterest(365);\n        check(posted.size() == 1 &amp;&amp; posted.get(0).accountId().equals(&quot;SB-3&quot;),\n              &quot;one interest row, on the savings account only&quot;);\n        check(s3.balance().equals(Money.inr(&quot;104000.00&quot;)), &quot;365 days at 4.00% on INR 100000 is &quot; + s3.balance());\n        check(c3.balance().equals(Money.inr(&quot;100000.00&quot;)), &quot;the current account earned nothing&quot;);\n        check(new SimpleInterest(400).on(Money.inr(&quot;100000.00&quot;), 30).equals(Money.inr(&quot;328.76&quot;)),\n              &quot;thirty days is INR 328.76, rounded down to the paise&quot;);\n        check(new PromoInterest(new SimpleInterest(400), 50).interest(c3, 365, t3[0]).equals(Money.inr(&quot;4500.00&quot;)),\n              &quot;the festival wrapper adds 0.50% to the same INR 100000 without touching the rule it wraps&quot;);\n\n        // 4. the BASIS of interest. Asha&#x27;s salary lands on the 28th. Paid on the balance as it stands, she earns\n        //    a month on money that was there for three days; paid on the daily closing balances, she earns three\n        //    days. Same rate, same account, same ledger: the rule decides, which is why it is handed the account.\n        long[] t4 = { 1_700_000_000_000L };\n        Bank b4 = bankAt(t4, Map.of());\n        SavingsAccount late = b4.openSavings(&quot;SB-4&quot;, &quot;c1&quot;, Money.inr(&quot;10000.00&quot;), Money.inr(&quot;0.00&quot;));\n        t4[0] += 27 * day;\n        late.deposit(Money.inr(&quot;100000.00&quot;), &quot;salary on the 28th&quot;);\n        t4[0] += 3 * day;\n        check(new SimpleInterest(400).interest(late, 30, t4[0]).equals(Money.inr(&quot;361.64&quot;)),\n              &quot;on the balance as it stands, thirty days pays &quot; + new SimpleInterest(400).interest(late, 30, t4[0]));\n        check(new DailyBalanceInterest(400).interest(late, 30, t4[0]).equals(Money.inr(&quot;65.75&quot;)),\n              &quot;on the daily closing balances the same month pays &quot;\n              + new DailyBalanceInterest(400).interest(late, 30, t4[0]) + &quot;: the money was there for three days&quot;);\n\n        // 5. month end takes as well as gives, and a charge is not a withdrawal: it does not run the vetoes.\n        //    A savings account under the average balance pays 4% of the shortfall, even though a customer\n        //    withdrawal of one rupee would be refused; the penalty never takes a balance below zero; a current\n        //    account pays 18% a year on the days it spent in the red.\n        long[] t5 = { 1_700_000_000_000L };\n        Bank b5 = bankAt(t5, Map.of());\n        SavingsAccount atTheLine = b5.openSavings(&quot;SB-5&quot;, &quot;c1&quot;, Money.inr(&quot;5000.00&quot;), Money.inr(&quot;5000.00&quot;));\n        SavingsAccount nearlyEmpty = b5.openSavings(&quot;SB-5E&quot;, &quot;c1&quot;, Money.inr(&quot;100.00&quot;), Money.inr(&quot;0.00&quot;));\n        CurrentAccount inTheRed = b5.openCurrent(&quot;CA-5&quot;, &quot;c2&quot;, Money.inr(&quot;0.00&quot;), Money.inr(&quot;100000.00&quot;));\n        inTheRed.withdraw(Money.inr(&quot;50000.00&quot;), &quot;a bad month&quot;);\n        t5[0] += 30 * day;\n        List&lt;Txn&gt; charged = MonthEndSweep.run(b5, List.of(new MinBalancePenalty(Money.inr(&quot;10000.00&quot;), 400),\n                                                          new OverdraftInterest(1800)), 30, t5[0]);\n        check(charged.size() == 3 &amp;&amp; charged.stream().allMatch(t -&gt; t.type() == TxnType.FEE),\n              &quot;the sweep wrote one FEE row per charge, and nothing for the accounts that owed nothing&quot;);\n        check(atTheLine.balance().equals(Money.inr(&quot;4800.00&quot;)),\n              &quot;4% of a 5,000 shortfall pushed the savings account below its floor: &quot; + atTheLine.balance());\n        check(nearlyEmpty.balance().paise() == 0,\n              &quot;4% of a 9,900 shortfall is 396.00, but the account held 100.00: it lands at &quot; + nearlyEmpty.balance());\n        try {\n            atTheLine.withdraw(Money.inr(&quot;1.00&quot;), &quot;one rupee&quot;);\n            check(false, &quot;a customer withdrawal below the floor must still be refused&quot;);\n        } catch (RuleViolation e) { check(true, &quot;and a customer withdrawal is still vetoed: &quot; + e.getMessage()); }\n        check(inTheRed.balance().equals(Money.inr(&quot;-50739.72&quot;)),\n              &quot;thirty days overdrawn by INR 50000 at 18.00% cost INR 739.72: &quot; + inTheRed.balance());\n\n        // 6. sixteen ATMs on ONE account, all released together. The floor is checked and the row is written in\n        //    the same lock hold, so the arithmetic is exact: INR 9,000 above the floor divided by INR 100 is\n        //    ninety withdrawals, whatever order the threads ran in, and the ninety-first is refused.\n        long[] t6a = { 1_700_000_000_000L };\n        Bank b6a = bankAt(t6a, Map.of());\n        SavingsAccount hot = b6a.openSavings(&quot;SB-6A&quot;, &quot;c1&quot;, Money.inr(&quot;10000.00&quot;), Money.inr(&quot;1000.00&quot;));\n        ExecutorService atms = Executors.newFixedThreadPool(16);\n        CountDownLatch release = new CountDownLatch(1);\n        List&lt;Future&lt;Integer&gt;&gt; tills = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 16; i++) tills.add(atms.submit(() -&gt; {\n            release.await();\n            int took = 0;\n            for (int k = 0; k &lt; 12; k++) {\n                try { hot.withdraw(Money.inr(&quot;100.00&quot;), &quot;atm&quot;); took++; } catch (RuleViolation refused) { }\n            }\n            return took;\n        }));\n        release.countDown();\n        int handedOut = 0;\n        for (Future&lt;Integer&gt; f : tills) handedOut += f.get(20, TimeUnit.SECONDS);\n        atms.shutdown();\n        check(handedOut == 90, &quot;192 attempts, exactly 90 succeeded: no thread slipped through the check&quot;);\n        check(hot.balance().equals(Money.inr(&quot;1000.00&quot;)) &amp;&amp; hot.rowCount() == 91,\n              &quot;the floor held to the paise and there are 90 rows plus the opening one: &quot; + hot.balance());\n\n        // 7. sixty-four threads firing transfers in BOTH directions between four accounts: no deadlock, and the\n        //    bank&#x27;s total assets are exactly what they were. A lost update would show up as a changed total.\n        long[] t6 = { 1_700_000_000_000L };\n        Bank b6 = bankAt(t6, Map.of());\n        for (int i = 0; i &lt; 4; i++) b6.openCurrent(&quot;A&quot; + i, &quot;c1&quot;, Money.inr(&quot;10000.00&quot;), Money.inr(&quot;100000.00&quot;));\n        Money assetsBefore = b6.totalAssets(Money.INR);\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; fired = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 64; i++) {\n            final int n = i;\n            fired.add(pool.submit(() -&gt; {\n                go.await();\n                String a = &quot;A&quot; + (n % 4), b = &quot;A&quot; + ((n + 1) % 4);\n                return b6.transfer(&quot;X&quot; + n, n % 2 == 0 ? a : b, n % 2 == 0 ? b : a, Money.inr(&quot;100.00&quot;), &quot;r&quot; + n);\n            }));\n        }\n        go.countDown();\n        int completed = 0;\n        for (Future&lt;?&gt; f : fired) { f.get(20, TimeUnit.SECONDS); completed++; }   // a deadlock would time out here\n        pool.shutdown();\n        check(completed == 64, &quot;all 64 opposing transfers finished: the lock order made a cycle impossible&quot;);\n        check(assetsBefore.equals(b6.totalAssets(Money.INR)),\n              &quot;total assets are unchanged: &quot; + assetsBefore + &quot; -&gt; &quot; + b6.totalAssets(Money.INR));\n        int rows = 0;\n        for (Account a : b6.accounts()) rows += a.rowCount();\n        check(rows == 4 + 128, &quot;every transfer wrote exactly two rows, and none wrote three&quot;);\n\n        // 8. an account nobody touches goes DORMANT, and one customer posting wakes it. Interest does not.\n        long[] t7 = { 1_700_000_000_000L };\n        Bank b7 = bankAt(t7, Map.of(AccountKind.SAVINGS, new SimpleInterest(400)));\n        b7.dormantAfterDays(180);\n        SavingsAccount idle = b7.openSavings(&quot;SB-5&quot;, &quot;c1&quot;, Money.inr(&quot;5000.00&quot;), Money.inr(&quot;0.00&quot;));\n        t7[0] += 100 * day;\n        check(b7.markDormant() == 0 &amp;&amp; idle.status() == AccountStatus.ACTIVE, &quot;100 days idle is still ACTIVE&

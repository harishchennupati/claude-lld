quot;);\n        t7[0] += 100 * day;\n        check(b7.markDormant() == 1 &amp;&amp; idle.status() == AccountStatus.DORMANT, &quot;200 days idle is DORMANT&quot;);\n        b7.accrueInterest(200);\n        check(idle.status() == AccountStatus.DORMANT, &quot;the bank&#x27;s own interest row did not wake it&quot;);\n        idle.deposit(Money.inr(&quot;100.00&quot;), &quot;salary&quot;);\n        check(idle.status() == AccountStatus.ACTIVE, &quot;one customer posting woke it&quot;);\n\n        // 9. closing is refused while money is inside, allowed at exactly zero, and CLOSED refuses everything.\n        SavingsAccount leaving = bank.openSavings(&quot;SB-6&quot;, &quot;c1&quot;, Money.inr(&quot;500.00&quot;), Money.inr(&quot;0.00&quot;));\n        try {\n            bank.close(&quot;SB-6&quot;);\n            check(false, &quot;closing an account that still holds money must be refused&quot;);\n        } catch (RuleViolation e) { check(true, &quot;close refused: &quot; + e.getMessage()); }\n        leaving.withdraw(leaving.balance(), &quot;empty it&quot;);\n        bank.close(&quot;SB-6&quot;);\n        check(leaving.status() == AccountStatus.CLOSED &amp;&amp; leaving.balance().paise() == 0, &quot;closed at exactly zero&quot;);\n        try {\n            leaving.deposit(Money.inr(&quot;100.00&quot;), &quot;after closing&quot;);\n            check(false, &quot;a CLOSED account must refuse a deposit&quot;);\n        } catch (AccountNotActive e) { check(true, &quot;a closed account refuses postings: &quot; + e.getMessage()); }\n        SavingsAccount held = bank.openSavings(&quot;SB-6F&quot;, &quot;c1&quot;, Money.inr(&quot;0.00&quot;), Money.inr(&quot;0.00&quot;));\n        held.freeze();\n        try {\n            bank.close(&quot;SB-6F&quot;);\n            check(false, &quot;a FROZEN account must not be closed: a freeze is a legal hold&quot;);\n        } catch (AccountNotActive e) { check(true, &quot;a frozen account cannot be closed: &quot; + e.getMessage()); }\n\n        // 10. the same transfer id twice is ONE movement of money; and a transfer that failed claims no id,\n        //    so the caller may retry that same id once the reason is fixed.\n        long[] t9 = { 1_700_000_000_000L };\n        Bank b9 = bankAt(t9, Map.of());\n        CurrentAccount from = b9.openCurrent(&quot;CA-7&quot;, &quot;c1&quot;, Money.inr(&quot;1000.00&quot;), Money.inr(&quot;0.00&quot;));\n        CurrentAccount to = b9.openCurrent(&quot;CA-8&quot;, &quot;c2&quot;, Money.inr(&quot;0.00&quot;), Money.inr(&quot;0.00&quot;));\n        TransferReceipt first = b9.transfer(&quot;T-7&quot;, &quot;CA-7&quot;, &quot;CA-8&quot;, Money.inr(&quot;400.00&quot;), &quot;rent&quot;);\n        TransferReceipt retry = b9.transfer(&quot;T-7&quot;, &quot;CA-7&quot;, &quot;CA-8&quot;, Money.inr(&quot;400.00&quot;), &quot;rent&quot;);\n        check(first.equals(retry), &quot;a retried transfer id returns the same receipt&quot;);\n        check(from.balance().equals(Money.inr(&quot;600.00&quot;)) &amp;&amp; to.balance().equals(Money.inr(&quot;400.00&quot;)),\n              &quot;and the money moved exactly once: &quot; + from.balance() + &quot; / &quot; + to.balance());\n        check(from.rowCount() == 2 &amp;&amp; to.rowCount() == 2, &quot;two rows each, not four&quot;);\n        try {\n            b9.transfer(&quot;T-7&quot;, &quot;CA-7&quot;, &quot;CA-8&quot;, Money.inr(&quot;50.00&quot;), &quot;a different transfer under the same id&quot;);\n            check(false, &quot;the same id for a DIFFERENT transfer must be refused, not answered with the old receipt&quot;);\n        } catch (RuleViolation e) { check(true, &quot;an id reused for a different transfer is refused: &quot; + e.getMessage()); }\n        try {\n            b9.transfer(&quot;T-8&quot;, &quot;CA-7&quot;, &quot;CA-8&quot;, Money.inr(&quot;5000.00&quot;), &quot;more than there is&quot;);\n            check(false, &quot;a transfer with nothing behind it must be refused&quot;);\n        } catch (RuleViolation e) { check(true, &quot;transfer refused: &quot; + e.getMessage()); }\n        check(b9.receipt(&quot;T-8&quot;) == null &amp;&amp; from.balance().equals(Money.inr(&quot;600.00&quot;)),\n              &quot;the failed transfer claimed no id and debited nothing, so T-8 can be retried&quot;);\n        from.deposit(Money.inr(&quot;10000.00&quot;), &quot;top up&quot;);\n        b9.transfer(&quot;T-8&quot;, &quot;CA-7&quot;, &quot;CA-8&quot;, Money.inr(&quot;5000.00&quot;), &quot;retried after the top-up&quot;);\n        check(to.balance().equals(Money.inr(&quot;5400.00&quot;)), &quot;and the retry of T-8 went through: &quot; + to.balance());\n\n        // 11. a listener that throws must not break a posting: they run after the lock, each in a try/catch.\n        long[] t10 = { 1_700_000_000_000L };\n        Bank b10 = bankAt(t10, Map.of());\n        AuditLog audit = new AuditLog();\n        b10.addListener((account, txn) -&gt; { throw new RuntimeException(&quot;the SMS gateway is down&quot;); });\n        b10.addListener(audit);\n        SavingsAccount s8 = b10.openSavings(&quot;SB-8&quot;, &quot;c1&quot;, Money.inr(&quot;1000.00&quot;), Money.inr(&quot;0.00&quot;));\n        s8.deposit(Money.inr(&quot;500.00&quot;), &quot;cash&quot;);\n        check(s8.balance().equals(Money.inr(&quot;1500.00&quot;)), &quot;the deposit landed despite a listener that throws&quot;);\n        check(audit.size() == 1, &quot;and the listener after the broken one still ran&quot;);\n\n        // 12. a frozen destination is discovered BEFORE the source is debited\n        long[] t11 = { 1_700_000_000_000L };\n        Bank b11 = bankAt(t11, Map.of());\n        CurrentAccount payer = b11.openCurrent(&quot;CA-91&quot;, &quot;c1&quot;, Money.inr(&quot;1000.00&quot;), Money.inr(&quot;0.00&quot;));\n        CurrentAccount frozen = b11.openCurrent(&quot;CA-92&quot;, &quot;c2&quot;, Money.inr(&quot;0.00&quot;), Money.inr(&quot;0.00&quot;));\n        frozen.freeze();\n        try {\n            b11.transfer(&quot;T-9&quot;, &quot;CA-91&quot;, &quot;CA-92&quot;, Money.inr(&quot;100.00&quot;), &quot;into a frozen account&quot;);\n            check(false, &quot;a transfer into a FROZEN account must be refused&quot;);\n        } catch (AccountNotActive e) { check(true, &quot;frozen destination refused: &quot; + e.getMessage()); }\n        check(payer.balance().equals(Money.inr(&quot;1000.00&quot;)) &amp;&amp; payer.rowCount() == 1,\n              &quot;the source was never debited, because the destination was asked first&quot;);\n\n        // 13. rules compose, and any implementation drops in: a one-line lambda veto beside the built-in floor\n        SavingsAccount picky = b11.openSavings(&quot;SB-93&quot;, &quot;c1&quot;, Money.inr(&quot;10000.00&quot;), Money.inr(&quot;1000.00&quot;));\n        picky.addRule((account, amount, nowMs) -&gt; {\n            if (Money.inr(&quot;2000.00&quot;).lessThan(amount)) throw new RuleViolation(&quot;this branch caps cash at INR 2000.00&quot;);\n        });\n        picky.withdraw(Money.inr(&quot;2000.00&quot;), &quot;at the cap&quot;);\n        try {\n            picky.withdraw(Money.inr(&quot;2500.00&quot;), &quot;over the cap&quot;);\n            check(false, &quot;the handed-in rule must be able to refuse&quot;);\n        } catch (RuleViolation e) { check(true, &quot;a lambda rule composed with the floor: &quot; + e.getMessage()); }\n\n        // 14. money refuses to add two currencies, so a mixed amount can never reach a balance\n        try {\n            Money.inr(&quot;100.00&quot;).plus(Money.of(100, &quot;USD&quot;));\n            check(false, &quot;INR plus USD must throw&quot;);\n        } catch (CurrencyMismatch e) { check(true, &quot;money refused the mixed arithmetic: &quot; + e.getMessage()); }\n\n        // 15. the statement window is exact: the rows inside it, and the balances either side of it\n        long[] ta = { 1_700_000_000_000L };\n        Bank ba = bankAt(ta, Map.of());\n        SavingsAccount sa = ba.openSavings(&quot;SB-A&quot;, &quot;c1&quot;, Money.inr(&quot;1000.00&quot;), Money.inr(&quot;0.00&quot;));\n        ta[0] += day;   sa.deposit(Money.inr(&quot;500.00&quot;), &quot;day 1&quot;);\n        ta[0] += day;   sa.deposit(Money.inr(&quot;700.00&quot;), &quot;day 2&quot;);\n        ta[0] += day;   sa.withdraw(Money.inr(&quot;200.00&quot;), &quot;day 3&quot;);\n        Statement st = sa.statement(1_700_000_000_000L + day, 1_700_000_000_000L + 2 * day);\n        check(st.rows().size() == 2 &amp;&amp; st.opening().equals(Money.inr(&quot;1000.00&quot;))\n              &amp;&amp; st.closing().equals(Money.inr(&quot;2200.00&quot;)),\n              &quot;the statement window holds exactly its own rows: &quot; + st.opening() + &quot; -&gt; &quot; + st.closing());\n\n        // 16. the fee is asked BEFORE any money moves, and the source&#x27;s rules must agree to the amount plus the fee.\n        //     A pricing service that throws leaves both accounts as they were; a fee may not break the ceiling.\n        long[] tf = { 1_700_000_000_000L };\n        Bank bf = bankAt(tf, Map.of());\n        CurrentAccount payerF = bf.openCurrent(&quot;CA-F1&quot;, &quot;c1&quot;, Money.inr(&quot;1000.00&quot;), Money.inr(&quot;0.00&quot;));\n        CurrentAccount payeeF = bf.openCurrent(&quot;CA-F2&quot;, &quot;c2&quot;, Money.inr(&quot;0.00&quot;), Money.inr(&quot;0.00&quot;));\n        bf.setFeePolicy((f, t, amount) -&gt; { throw new IllegalStateException(&quot;the pricing service is down&quot;); });\n        try { bf.transfer(&quot;F-1&quot;, &quot;CA-F1&quot;, &quot;CA-F2&quot;, Money.inr(&quot;100.00&quot;), &quot;no price&quot;); } catch (RuntimeException expected) { }\n        check(payerF.rowCount() == 1 &amp;&amp; payeeF.rowCount() == 1 &amp;&amp; bf.receipt(&quot;F-1&quot;) == null,\n              &quot;a fee policy that throws left no row anywhere and no receipt, so F-1 can be retried&quot;);\n        CurrentAccount payerG = bf.openCurrent(&quot;CA-G1&quot;, &quot;c1&quot;, Money.inr(&quot;1000.00&quot;), Money.inr(&quot;0.00&quot;));\n        bf.setFeePolicy((f, t, amount) -&gt; Money.inr(&quot;25.00&quot;));\n        try {\n            bf.transfer(&quot;F-2&quot;, &quot;CA-G1&quot;, &quot;CA-F2&quot;, Money.inr(&quot;1000.00&quot;), &quot;the fee would break the ceiling&quot;);\n            check(false, &quot;a fee that takes the balance past the ceiling must be refused: &quot; + payerG.balance());\n        } catch (RuleViolation e) { check(true, &quot;the rules saw the amount plus the fee: &quot; + e.getMessage()); }\n        try { bf.transfer(&quot;F-3&quot;, &quot;CA-G1&quot;, &quot;CA-F2&quot;, Money.inr(&quot;975.00&quot;), &quot;exactly what the balance covers&quot;); }\n        catch (RuleViolation e) { check(false, &quot;975.00 plus a 25.00 fee fits in 1000.00: &quot; + e.getMessage()); }\n        check(payerG.balance().paise() == 0, &quot;975.00 plus the 25.00 fee takes the payer to exactly &quot; + payerG.balance());\n\n        // 17. a clock that steps back (a time-server correction) cannot put the ledger out of time order, which\n        //     every binary search here depends on; and a statement &quot;to the end of time&quot; does not overflow.\n        long[] tb = { 1_700_000_000_000L };\n        Bank bb = bankAt(tb, Map.of());\n        SavingsAccount back = bb.openSavings(&quot;SB-B&quot;, &quot;c1&quot;, Money.inr(&quot;100.00&quot;), Money.inr(&quot;0.00&quot;));\n        tb[0] += 2 * 3_600_000L;  back.deposit(Money.inr(&quot;1.00&quot;), &quot;at two o&#x27;clock&quot;);\n        tb[0] -= 3_600_000L;      back.deposit(Money.inr(&quot;2.00&quot;), &quot;the clock stepped back an hour&quot;);\n        List&lt;Txn&gt; rowsB = back.ledger();\n        boolean inOrder = true;\n        for (int i = 1; i &lt; rowsB.size(); i++) if (rowsB.get(i).atMs() &lt; rowsB.get(i - 1).atMs()) inOrder = false;\n        check(inOrder, &quot;the ledger stayed in time order although the clock went back an hour&quot;);\n        check(back.statement(0, Long.MAX_VALUE).rows().size() == 3, &quot;a statement up to Long.MAX_VALUE holds all three rows&quot;);\n\n        // 18. a batch checks each account&#x27;s status INSIDE its lock. A freeze that lands mid-batch (here, a rule\n        //     that freezes the account it is asked about) skips that one account; the batch pays everybody else.\n        long[] tz = { 1_700_000_000_000L };\n        Bank bz = bankAt(tz, Map.of(AccountKind.SAVINGS, (account, days, nowMs) -&gt; {\n            if (account.id().equals(&quot;SB-Z1&quot;)) account.freeze();          // a court order arrives mid-batch\n            return Money.inr(&quot;1.00&quot;);\n        }));\n        SavingsAccount z1 = bz.openSavings(&quot;SB-Z1&quot;, &quot;c1&quot;, Money.inr(&quot;100.00&quot;), Money.inr(&quot;0.00&quot;));\n        SavingsAccount z2 = bz.openSavings(&quot;SB-Z2&quot;, &quot;c2&quot;, Money.inr(&quot;100.00&quot;), Money.inr(&quot;0.00&quot;));\n        List&lt;Txn&gt; paidZ = new ArrayList&lt;&gt;();\n        try { paidZ = bz.accrueInterest(30); } catch (RuntimeException e) { check(false, &quot;the interest batch died: &quot; + e); }\n        check(paidZ.size() == 1 &amp;&amp; z1.balance().equals(Money.inr(&quot;100.00&quot;)) &amp;&amp; z2.balance().equals(Money.inr(&quot;101.00&quot;)),\n              &quot;the account frozen mid-batch got no row, and the other account was still paid&quot;);\n        MonthlyCharge freezing = (account, days, nowMs) -&gt; {\n            if (account.id().equals(&quot;SB-Z2&quot;)) account.freeze();\n            return Money.inr(&quot;1.00&quot;);\n        };\n        List&lt;Txn&gt; chargedZ = null;\n        try { chargedZ = MonthEndSweep.run(bz, List.of(freezing), 30, tz[0]); }\n        catch (RuntimeException e) { check(false, &quot;the sweep died: &quot; + e); }\n        check(chargedZ != null &amp;&amp; chargedZ.isEmpty(), &quot;the month-end sweep skipped both frozen accounts the same way&quot;);\n\n        // 19. a joint account. A small withdrawal that breaks the floor is REFUSED, not parked as &quot;waiting for a\n        //     signature&quot;; and two owners signing the same large amounts at the same instant give exactly one\n        //     withdrawal per amount and no errors, because the approval maps live under the account&#x27;s lock.\n        long[] tj = { 1_700_000_000_000L };\n        JointAccount joint = new JointAccount(&quot;JT-9&quot;, List.of(&quot;c1&quot;, &quot;c2&quot;), Money.inr(&quot;10000.00&quot;), Money.inr(&quot;1000.00&quot;),\n                                              Money.inr(&quot;50000.00&quot;), () -&gt; tj[0], List.of());\n        try {\n            Txn parked = joint.sign(&quot;c1&quot;, Money.inr(&quot;9500.00&quot;), &quot;breaks the floor&quot;);\n            check(false, &quot;a small withdrawal that breaks the floor must be refused, not parked: got &quot; + parked);\n        } catch (RuleViolation e) { check(true, &quot;refused, not parked: &quot; + e.getMessage()); }\n        JointAccount rich = new JointAccount(&quot;JT-10&quot;, List.of(&quot;c1&quot;, &quot;c2&quot;), Money.inr(&quot;1000000000.00&quot;), Money.inr(&quot;0.00&quot;),\n                                             Money.inr(&quot;50000.00&quot;), () -&gt; tj[0], List.of());\n        int amounts = 1000;\n        ExecutorService owners = Executors.newFixedThreadPool(2);\n        CountDownLatch pen = new CountDownLatch(1);\n        List&lt;Future&lt;Integer&gt;&gt; signers = new ArrayList&lt;&gt;();\n        for (String owner : List.of(&quot;c1&quot;, &quot;c2&quot;)) signers.add(owners.submit(() -&gt; {\n            pen.await();\n            int errors = 0;\n            for (int i = 0; i &lt; amounts; i++) {\n                try { rich.sign(owner, Money.of((50_001L + i) * 100, Money.INR), &quot;large &quot; + i); }\n                catch (RuntimeException e) { errors++; }\n            }\n            return errors;\n        }));\n        pen.countDown();\n        int signErrors = 0;\n        for (Future&lt;Integer&gt; f : signers) signErrors += f.get(20, TimeUnit.SECONDS);\n        owners.shutdown();\n        check(signErrors == 0 &amp;&amp; rich.rowCount() == 1 + amounts, &quot;two owners, &quot; + amounts + &quot; large amounts at once: &quot;\n              + (rich.rowCount() - 1) + &quot; withdrawals, &quot; + signErrors + &quot; errors&quot;);\n\n        // 20. a loan whose job ran twice: instalment 0 paid twice is ONE payment, for the money AND for the loan&#x27;s\n        //     own outstanding (10,000 of principal plus 1% of 60,000 in interest).\n        long[] tl = { 1_700_000_000_000L };\n        Bank bl = bankAt(tl, Map.of());\n        bl.openCurrent(&quot;LN-9&quot;, &quot;c1&quot;, Money.inr(&quot;0.00&quot;), Money.inr(&quot;0.00&quot;));\n        SavingsAccount borrower = bl.openSavings(&quot;SB-L9&quot;, &quot;c1&quot;, Money.inr(&quot;100000.00&quot;), Money.inr(&quot;0.00&quot;));\n        Loan loan = new Loan(&quot;LN-9&quot;, &quot;SB-L9&quot;, Money.inr(&quot;60000.00&quot;), 1200, 6);\n        loan.pay(bl, 0);\n        loan.pay(bl, 0);\n        check(loan.outstanding().equals(Money.inr(&quot;50000.00&quot;)) &amp;&amp; borrower.balance().equals(Money.inr(&quot;89400.00&quot;)),\n              &quot;instalment 0 run twice: outstanding &quot; + loan.outstanding() + &quot;, borrower &quot; + borrower.balance());\n\n        // 21. the database version: a refused debit rolls the id&#x27;s claim back, so the same id can be retried and then\n        //     really moves the money; it must never answer &quot;already done&quot; for money that never moved.\n        AccountRepository repo = new InMemoryAccountRepository().open(&quot;A&quot;, 10_000).open(&quot;B&quot;, 0);\n        boolean refusedFirst = !PersistedTransfer.transfer(repo, &quot;db-1&quot;, &quot;A&quot;, &quot;B&quot;, 50_000, 0);\n        repo.credit(&quot;A&quot;, 100_000);\n        boolean retried = PersistedTransfer.transfer(repo, &quot;db-1&quot;, &quot;A&quot;, &quot;B&quot;, 50_000, 0);\n        check(refusedFirst &amp;&amp; retried &amp;&amp; repo.balance(&quot;B&quot;) == 50_000,\n              &quot;refused, topped up, retried with the same id: B holds &quot; + Money.of(repo.balance(&quot;B&quot;), Money.INR));\n\n        // 22. edges at the door: an account cannot open below zero, and the owner index is read-only to callers.\n        try {\n            bank.openSavings(&quot;SB-NEG&quot;, &quot;c1&quot;, Money.inr(&quot;-500.00&quot;), Money.inr(&quot;0.00&quot;));\n            check(false, &quot;a negative opening balance must be refused&quot;);\n        } catch (RuleViolation e) { check(true, &quot;a negative opening is refused: &quot; + e.getMessage()); }\n        try {\n            bank.accountsOf(&quot;c1&quot;).clear();\n            check(false, &quot;a caller must not be able to clear the bank&#x27;s owner index&quot;);\n        } catch (UnsupportedOperationException e) {\n            check(!bank.accountsOf(&quot;c1&quot;).isEmpty(), &quot;the owner index is read-only&quot;);\n        }\n\n        // 23. a field written OUTSIDE the lock and read inside it must be volatile, or another thread may keep\n        //     seeing the old value: the KYC status (the back office sets it) and the bank&#x27;s fee policy.\n        check(java.lang.reflect.Modifier.isVolatile(KycRule.class.getDeclaredField(&quot;status&quot;).getModifiers())\n              &amp;&amp; java.lang.reflect.Modifier.isVolatile(Bank.class.getDeclaredField(&quot;fees&quot;).getModifiers()),\n              &quot;KycRule.status and Bank.fees are volatile&quot;);\n\n        // 24. the ledger explains the balance. Every row of every account in every bank these tests built is\n        //     replayed from zero; each row&#x27;s balanceAfter must be exactly where the replay arrives, and the last\n        //     one must be the stored balance. This is the claim that the row and the field are written together.\n        boolean reconciled = true;\n        int replayed = 0;\n        for (Bank b : ALL) for (Account a : b.accounts()) {\n            Money running = Money.zero(a.currency());\n            for (Txn t : a.ledger()) {\n                running = switch (t.type()) {\n                    case OPENING, DEPOSIT, TRANSFER_IN, INTEREST, REVERSAL -&gt; running.plus(t.amount());\n                    case WITHDRAW, TRANSFER_OUT, FEE -&gt; running.minus(t.amount());\n                };\n                if (!running.equals(t.balanceAfter())) reconciled = false;\n                replayed++;\n            }\n            if (!running.equals(a.balance())) reconciled = false;\n        }\n        check(reconciled, &quot;all &quot; + replayed + &quot; rows in &quot; + ALL.size() + &quot; banks replay to the stored balances&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design the core of a bank. Customers with savings and current accounts; deposits, withdrawals and transfers between two accounts; a statement at the end of the month. Savings keeps a minimum balance and earns interest, current may go overdrawn. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (how money is represented, and what actually differs between savings and current, come first); then type in the order of Main.java: the three enums, the exception family, the Money value type, the Txn and Statement records, the Clock, the WithdrawalRule interface with MinBalanceRule and OverdraftRule, the InterestRule with SimpleInterest and the PromoInterest wrapper, the listener interface, then Account with its one lock and its single <code>post()</code>, then the two thin subclasses, then Bank with the ordered locks and the seven-step transfer, then a main with the race. If the hour runs short, the must-write core is Money, Txn, the WithdrawalRule with its two rules, Account with its lock and <code>post()</code>, and <code>Bank.transfer</code>; interest, dormancy, statements and listeners come after it. The smallest version of this prompt is LeetCode 2043, Simple Bank System (reported at Capital One, PayPal, Okta and OpenAI): balances in a <code>long[]</code> by account number, and every call returns false instead of throwing.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; The bank announces a festival bonus: half a per cent on top of the savings rate, for one month only.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing is edited. PromoInterest holds the rule it decorates (wraps) and a second rule for the bonus, and returns the sum of what both say. So the base rate and the promotion stay separate objects, and the promotion comes off again by dropping one wrapper. The bank is handed <code>new PromoInterest(new SimpleInterest(400), 50)</code> for SAVINGS; rates are in basis points, hundredths of a per cent, so 400 is 4.00% a year and 50 is 0.50%. Nothing else changes: not Account, not Bank, not the tests. The alternative, an <code>if (festivalMonth)</code> inside SimpleInterest, is the same feature and a permanent edit to a class that had one job. Because the bonus is a rule and not a number, handing in <code>new PromoInterest(dailyBalanceRule, dailyBalanceBonus)</code> keeps both halves on the same basis.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * A festival bonus on top of whatever rule this account kind already has: it wraps a rule instead of replacing\n * it, so the base rate and the promotion stay separate and the promotion can be taken off again by removing one\n * wrapper. This is the Decorator, and it exists because the rate is one sentence and the bonus is another.\n */\nfinal class PromoInterest implements InterestRule {\n    private final InterestRule base;\n    private final InterestRule bonus;\n    /** @param base the rule this promotion adds to; @param bonusBasisPoints the extra annual rate, 50 = 0.50%. */\n    PromoInterest(InterestRule base, int bonusBasisPoints) { this(base, new SimpleInterest(bonusBasisPoints)); }\n    /** Hand in the bonus as a rule of its own when it must use the same basis as the rule it tops up. */\n    PromoInterest(InterestRule base, InterestRule bonus) { this.base = base; this.bonus = bonus; }\n    /** The base rule&#x27;s interest plus the bonus rule&#x27;s, each asked the same question. */\n    public Money interest(Account account, int days, long nowMs) {\n        return base.interest(account, days, nowMs).plus(bonus.interest(account, days, nowMs));\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>2 &middot; Her salary lands on the 28th. How much interest does she earn for that month?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The rate is not the interesting part; the <b>basis</b> is. SimpleInterest pays on the balance as it stands when the batch runs, so INR 1,00,000 that arrived on the 28th earns a whole month: INR 361.64 in the test. A real savings account is paid on the closing balance of <i>every day</i> (the RBI's rule for Indian banks since April 2010). The same account then earns INR 65.75, because the money was there for three days. DailyBalanceInterest gets those daily balances from the ledger, which is exactly why InterestRule is handed the account and not a number. It needs one binary search per day, since every row already carries the balance after it. Watch the boundary: a day's closing balance counts only the rows strictly before midnight, so a deposit stamped at exactly 00:00 on the 28th belongs to the 28th, not the 27th. The rule sums the days first and divides once at the end, so the month is rounded down one time instead of thirty; the fraction of a paisa stays with the bank. Compounding is the same rule run more often: credit the INTEREST row monthly and the next month's daily balances already include it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: interest on the daily closing balance -- the basis is the rule&#x27;s choice, and the ledger is the record\n/**\n * What a savings account is really paid on. An Indian bank pays interest on the CLOSING BALANCE OF EVERY DAY,\n * not on whatever happens to be in the account when the batch runs, so money paid in on the 28th earns three\n * days and not a month. The rule reads the ledger to get those daily balances \u2014 which is exactly why\n * InterestRule is handed the account and not a number. The division happens once, at the end, so the whole\n * period is rounded down a single time instead of once a day.\n */\nfinal class DailyBalanceInterest implements InterestRule {\n    private final int annualBasisPoints;\n\n    /** @param annualBasisPoints hundredths of a percent a year: 400 is 4.00%. */\n    DailyBalanceInterest(int annualBasisPoints) { this.annualBasisPoints = annualBasisPoints; }\n\n    /** Sum the days&#x27; closing balances (an overdrawn day earns nothing), then apply the rate once. */\n    public Money interest(Account account, int days, long nowMs) {\n        if (days &lt;= 0) return Money.zero(account.currency());\n        long sum = 0;\n        for (long closing : DailyBalances.closingPaise(account, days, nowMs)) if (closing &gt; 0) sum += closing;\n        return Money.of(sum * annualBasisPoints / (10_000L * 365L), account.currency());\n    }\n}\n\n/**\n * The closing balance of each of the last N days, read off the ledger. Every row carries the balance after it\n * and the rows are already in time order, so one day is a binary search: one O(n) copy of the rows, then\n * O(N log n). Interest is a batch job, so one copy per account is the right price for not holding the lock.\n */\nfinal class DailyBalances {\n    static final long DAY_MS = 24L * 3600 * 1000;\n\n    /** Index 0 is the closing balance of the day that ends at nowMs, index 1 the day before, and so on back N days. */\n    static long[] closingPaise(Account account, int days, long nowMs) {\n        List&lt;Txn&gt; rows = account.ledger();\n        long[] closing = new long[days];\n        for (int d = 0; d &lt; days; d++) closing[d] = balanceBefore(rows, nowMs - (long) d * DAY_MS);\n        return closing;\n    }\n\n    /**\n     * The balance after the last row strictly BEFORE this instant (a day&#x27;s end), or zero if the account did not\n     * exist yet. Strictly: a row stamped exactly at midnight belongs to the day that starts then, not the one ending.\n     */\n    private static long balanceBefore(List&lt;Txn&gt; rows, long ms) {\n        int lo = 0, hi = rows.size();\n        while (lo &lt; hi) { int mid = (lo + hi) &gt;&gt;&gt; 1; if (rows.get(mid).atMs() &lt; ms) lo = mid + 1; else hi = mid; }\n        return lo == 0 ? 0 : rows.get(lo - 1).balanceAfter().paise();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>3 &middot; She fell below the minimum balance. Do not refuse her, charge her. And the shop has sat overdrawn all month.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A veto and a charge are two different objects, which is why the veto never became an overridden method. MinBalancePenalty is a MonthlyCharge: at the end of the period it averages the daily closing balances and, if the average is under the line, charges a share of the shortfall (4% in the test). Two RBI rules shape that number: the charge must be in proportion to the shortfall, and it may never take a savings balance below zero, so the penalty caps itself at what the account holds. OverdraftInterest charges its rate on the negative part of each day's closing balance, so a day that ends in the red costs one day's interest, not a month's. Each charge is a FEE row that deliberately does <i>not</i> run the withdrawal rules: this is the bank taking its own money, so the penalty may push the balance further below the minimum. The test shows the same account still refusing a customer's one-rupee withdrawal a moment later. The sweep computes each charge and writes its row in one hold of the account's lock, so a withdrawal cannot slip in between the cap and the row. A transfer fee is different, because the customer started the transfer: FeePolicy is asked before any money moves, and the source's rules must agree to the amount plus the fee.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a charge instead of a veto -- the minimum-balance penalty, and interest on an overdraft\n/**\n * What the bank takes at the end of a period, as opposed to what it pays. Same shape as InterestRule, opposite\n * direction, and zero is the normal answer. Kept separate from WithdrawalRule on purpose: a veto happens at the\n * moment of a withdrawal, a charge happens at the end of a month and cannot refuse anything. The sweep calls it\n * with the account&#x27;s lock held, so it must be quick and must never touch another account (a second lock taken\n * out of id order could deadlock with a transfer).\n */\ninterface MonthlyCharge {\n    /** What this account owes the bank for the period ending at nowMs. Never negative; zero means no row. */\n    Money charge(Account account, int days, long nowMs);\n}\n\n/**\n * &quot;Do not refuse her, charge her.&quot; A real savings account does not bounce a withdrawal for breaking the minimum\n * balance; it lets the balance fall and bills a penalty once a month, on the AVERAGE of the daily closing\n * balances. Swapping the MinBalanceRule veto for this charge is a one-line change at the call site and touches\n * nothing else \u2014 the same move as the daily cap, in the other direction. Two RBI rules shape the number: the\n * charge is a share of the shortfall (not a flat fee), and it may never take the balance below zero.\n */\nfinal class MinBalancePenalty implements MonthlyCharge {\n    private final Money required;\n    private final int shortfallBasisPoints;\n\n    /**\n     * @param required the average monthly balance the product promises\n     * @param shortfallBasisPoints the share of the shortfall charged, in hundredths of a per cent: 400 = 4%\n     */\n    MinBalancePenalty(Money required, int shortfallBasisPoints) {\n        this.required = required; this.shortfallBasisPoints = shortfallBasisPoints;\n    }\n\n    /** Savings only: a share of (required - average daily closing balance), capped at what the account holds. */\n    public Money charge(Account account, int days, long nowMs) {\n        if (account.kind() != AccountKind.SAVINGS || days &lt;= 0) return Money.zero(account.currency());\n        long sum = 0;\n        for (long closing : DailyBalances.closingPaise(account, days, nowMs)) sum += closing;\n        long shortfall = required.paise() - sum / days;\n        if (shortfall &lt;= 0) return Money.zero(account.currency());\n        long fee = shortfall * shortfallBasisPoints / 10_000L;\n        return Money.of(Math.min(fee, Math.max(0, account.balance().paise())), account.currency());  // never below zero\n    }\n}\n\n/**\n * The other half of &quot;what differs between savings and current&quot;: a current account that sits overdrawn pays for\n * it. The rate is applied to the negative part of each day&#x27;s closing balance, so an afternoon in the red costs\n * a day and not a month, and an account that never went under pays nothing without a special case.\n */\nfinal class OverdraftInterest implements MonthlyCharge {\n    private final int annualBasisPoints;\n\n    /** @param annualBasisPoints the overdraft rate: 1800 is 18.00% a year. */\n    OverdraftInterest(int annualBasisPoints) { this.annualBasisPoints = annualBasisPoints; }\n\n    /** Current accounts only; the sum of the days spent below zero, charged once at the end. */\n    public Money charge(Account account, int days, long nowMs) {\n        if (account.kind() != AccountKind.CURRENT || days &lt;= 0) return Money.zero(account.currency());\n        long owed = 0;\n        for (long closing : DailyBalances.closingPaise(account, days, nowMs)) if (closing &lt; 0) owed += -closing;\n        return Money.of(owed * annualBasisPoints / (10_000L * 365L), account.currency());\n    }\n}\n\n/**\n * The end-of-month batch: every charge against every account, each as its own FEE row so a statement can\n * explain it. A charge deliberately does NOT run the withdrawal rules \u2014 it is the bank taking its own money,\n * and the penalty for breaking the minimum balance may push the balance further below that minimum (never below\n * zero: the penalty caps itself). Each charge is computed and written in ONE hold of the account&#x27;s lock, so a\n * withdrawal cannot slip in between the cap and the row; the hold lasts microseconds, one account at a time.\n */\nfinal class MonthEndSweep {\n    /** Post every charge that came out positive. Returns the rows written, for a test or a report. */\n    static List&lt;Txn&gt; run(Bank bank, List&lt;MonthlyCharge&gt; charges, int days, long nowMs) {\n        List&lt;Txn&gt; posted = new ArrayList&lt;&gt;();\n        for (Account a : bank.accounts()) {\n            for (MonthlyCharge c : charges) {\n                Txn row = null;\n                a.lockAccount();\n                try {\n                    Money amount = c.charge(a, days, nowMs);\n                    if (amount.paise() &gt; 0) row = a.postFeeRow(amount, null, c.getClass().getSimpleName());\n                } catch (AccountNotActive frozenOrClosed) {         // checked inside the lock; the batch goes on\n                } finally { a.unlockAccount(); }\n                if (row != null) { a.publish(row); posted.add(row); }   // listeners hear after the unlock\n            }\n        }\n        return posted;\n    }\n}\n\n// and the transfer fee, for comparison: asked before any money moves; the rules see amount + fee\n//     bank.setFeePolicy(new FlatFeeAboveThreshold(Money.inr(&quot;100000.00&quot;), Money.inr(&quot;25.00&quot;)));\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>4 &middot; Sixteen ATMs on one account, and two customers paying each other, all at the same instant. Prove the floor holds and nothing hangs.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The mechanism is the digital wallet page's, in one line: the rule checks, the row and the balance all happen inside one hold of the account's lock, and a transfer takes both locks in account-id order, so no two threads can each hold the lock the other wants. What is worth your time here is the assertion. For one account the arithmetic is exact: INR 9,000 above the floor, taken INR 100 at a time, is exactly 90 successful withdrawals out of 192 attempts, whatever order the threads ran in. A single lost update (two threads both writing from the same old balance) would make it 91. For the transfers the check is that money is conserved: 64 threads fire transfers in both directions, and the bank's total assets must be unchanged to the paise, because a lost credit has no matching lost debit. The deadlock proof is the timeout on <code>Future.get</code>: a deadlock makes the test hang rather than fail, so the timeout <i>is</i> the assertion. If asked for another way out of the deadlock: <code>tryLock</code> with a timeout, then release both, wait a random moment and retry. It works, but under load the retries can repeat, so the fixed order is the better first answer.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 6. sixteen ATMs on ONE account, all released together. The floor is checked and the row is written in\n        //    the same lock hold, so the arithmetic is exact: INR 9,000 above the floor divided by INR 100 is\n        //    ninety withdrawals, whatever order the threads ran in, and the ninety-first is refused.\n        long[] t6a = { 1_700_000_000_000L };\n        Bank b6a = bankAt(t6a, Map.of());\n        SavingsAccount hot = b6a.openSavings(&quot;SB-6A&quot;, &quot;c1&quot;, Money.inr(&quot;10000.00&quot;), Money.inr(&quot;1000.00&quot;));\n        ExecutorService atms = Executors.newFixedThreadPool(16);\n        CountDownLatch release = new CountDownLatch(1);\n        List&lt;Future&lt;Integer&gt;&gt; tills = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 16; i++) tills.add(atms.submit(() -&gt; {\n            release.await();\n            int took = 0;\n            for (int k = 0; k &lt; 12; k++) {\n                try { hot.withdraw(Money.inr(&quot;100.00&quot;), &quot;atm&quot;); took++; } catch (RuleViolation refused) { }\n            }\n            return took;\n        }));\n        release.countDown();\n        int handedOut = 0;\n        for (Future&lt;Integer&gt; f : tills) handedOut += f.get(20, TimeUnit.SECONDS);\n        atms.shutdown();\n        check(handedOut == 90, &quot;192 attempts, exactly 90 succeeded: no thread slipped through the check&quot;);\n        check(hot.balance().equals(Money.inr(&quot;1000.00&quot;)) &amp;&amp; hot.rowCount() == 91,\n              &quot;the floor held to the paise and there are 90 rows plus the opening one: &quot; + hot.balance());\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>5 &middot; One lock per account, and two locks for a transfer. Does that scale, or have you serialised the bank?</h3><button class=\"timer\" data-min=\"4\">start 4:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It scales, and the answer is arithmetic rather than opinion. Inside the lock there are about twelve operations (move 7 lists them), roughly a microsecond and a half; a transfer is that twice, under two locks. A busy merchant at five postings a second holds its lock seven and a half microseconds in each second, and even an invented thousand a second is 0.15% busy. The lock is per account, so the number of accounts is irrelevant. The ladder (slow work outside the lock, then split a genuinely hot account into k sub-balances, then a conditional UPDATE in a database) is the wallet page's, step for step. The banking-specific note is the batch: interest and the month-end charges hold one account's lock at a time, for microseconds, so end-of-month over fifty million accounts never makes a customer wait longer than that.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Money out. Every rule must agree, and the checks run in the SAME lock hold that writes the row, so no other\n     * thread can empty the account between the approval and the posting. A rule that says no throws before\n     * anything is written: no row, no balance change, nothing to undo, and the caller may retry.\n     */\n    final Txn withdraw(Money amount, String note) {\n        requirePositive(amount);\n        Txn t;\n        lock.lock();\n        try {\n            requirePostable(); requireSameCurrency(amount);\n            long now = clock.nowMs();\n            for (WithdrawalRule rule : rules) rule.check(this, amount, now);     // every rule, before any write\n            t = post(TxnType.WITHDRAW, amount, balance.minus(amount), null, note);\n            for (WithdrawalRule rule : rules) rule.onWithdrawn(this, amount, now); // a stateful rule remembers\n        } finally { lock.unlock(); }\n        publish(t);\n        return t;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; The destination account is frozen, and you only find out halfway. What is the state of both accounts?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was, because you never find out halfway: the destination is asked everything that could refuse a credit &mdash; frozen, closed, wrong currency &mdash; before a single paise leaves the source. The order is the design, not a detail. If that check throws, no row has been written anywhere, the transfer id is <i>not</i> claimed, and the caller may retry the same id once the account is unfrozen. A rule saying no has the same shape: the source's rules run inside its own hold before its row is written, so a refusal leaves no row, no paise and no alert. The one case left is a credit that throws after the debit, which cannot happen here. The code still posts a REVERSAL row rather than leaving money in mid-air: you undo a ledger by writing the opposite row, never by editing one.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 12. a frozen destination is discovered BEFORE the source is debited\n        long[] t11 = { 1_700_000_000_000L };\n        Bank b11 = bankAt(t11, Map.of());\n        CurrentAccount payer = b11.openCurrent(&quot;CA-91&quot;, &quot;c1&quot;, Money.inr(&quot;1000.00&quot;), Money.inr(&quot;0.00&quot;));\n        CurrentAccount frozen = b11.openCurrent(&quot;CA-92&quot;, &quot;c2&quot;, Money.inr(&quot;0.00&quot;), Money.inr(&quot;0.00&quot;));\n        frozen.freeze();\n        try {\n            b11.transfer(&quot;T-9&quot;, &quot;CA-91&quot;, &quot;CA-92&quot;, Money.inr(&quot;100.00&quot;), &quot;into a frozen account&quot;);\n            check(false, &quot;a transfer into a FROZEN account must be refused&quot;);\n        } catch (AccountNotActive e) { check(true, &quot;frozen destination refused: &quot; + e.getMessage()); }\n        check(payer.balance().equals(Money.inr(&quot;1000.00&quot;)) &amp;&amp; payer.rowCount() == 1,\n              &quot;the source was never debited, because the destination was asked first&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; The app asks for a balance a thousand times a second, and then wants March&#x27;s statement.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The balance is a stored field written in the same lock hold as the row that changed it, so a read is one field read: O(1), and it can never disagree with the ledger because the two move together. The statement is the interesting one: rows are appended in time order and never reordered, so both ends of a window are a binary search and the answer is a sublist &mdash; O(log n + k), never a scan of a lifetime of history. Opening and closing balances come free, because every row carries the balance after it. At twenty years of history you stop keeping every row in memory: the old ones go to cold storage and each month's statement is anchored by its opening balance, which is the same binary-search boundary you already compute. Reads take the lock, which guarantees the reader sees the latest write (without it, another thread may see an old balance). The day that lock costs anything, make the field <code>volatile</code>: Money is immutable, so a volatile read always returns a whole, current value, with no lock.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The rows in a window (both ends included), plus the balance the window opened and closed with. The ledger\n     * is appended in time order, so both ends are a binary search: O(log n + k), never a scan of the whole history.\n     */\n    final Statement statement(long fromMs, long toMs) {\n        if (fromMs &gt; toMs) throw new IllegalArgumentException(&quot;the window ends before it starts&quot;);\n        lock.lock();\n        try {\n            int from = firstAtOrAfter(fromMs);\n            int to = (toMs == Long.MAX_VALUE) ? ledger.size() : firstAtOrAfter(toMs + 1);   // toMs + 1 would overflow\n            Money opening = from == 0 ? Money.zero(currency) : ledger.get(from - 1).balanceAfter();\n            Money closing = to == 0 ? opening : ledger.get(to - 1).balanceAfter();\n            return new Statement(id, fromMs, toMs, opening, closing, List.copyOf(ledger.subList(from, to)));\n        } finally { lock.unlock(); }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>8 &middot; Mid-round: &quot;cap ATM withdrawals at INR 3,000 a day.&quot; And while you are there, KYC.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One new class and one line, for both. A daily cap is stateful: it has to remember what today already cost, and that memory has nowhere clean to live if the veto is an overridden method. As a rule object it is a private counter, updated through the <code>onWithdrawn</code> hook, which only fires after the row is written, so a refused withdrawal never counts against the cap. It stacks with the minimum balance, because every rule on the account must agree. Rules see every debit, transfers included; to cap only cash, pass the channel (ATM or transfer) to <code>check()</code>. A cap over the last 24 hours instead of the calendar day keeps a queue of (time, amount) and drops the old entries before each check. KYC (the bank's identity check) is the same move: a status on the rule, a cap while the papers are not in order, and nothing in Account or Bank changes. The cap's counter is only touched inside the account's lock, so it needs no lock of its own. The KYC status is set by the back office from outside that lock, so it is <code>volatile</code>: every thread sees the latest value.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a daily cap on cash withdrawals -- one new class and one addRule line, and it composes with the floor\n/**\n * &quot;Cap ATM withdrawals at INR 3,000 a day.&quot; A cap is stateful: it has to remember what today already cost. As an\n * overridden method on SavingsAccount there is nowhere clean to keep that memory; as a rule object it is one\n * class with a private counter, updated through the onWithdrawn hook. It composes with the minimum balance,\n * because every rule on the account must agree. Its fields are only ever touched inside the account&#x27;s lock.\n * Rules see every debit, transfers included; a cash-only cap would need the channel passed to check().\n */\nfinal class DailyLimitRule implements WithdrawalRule {\n    private final Money cap;\n    private long day = -1;                                          // which UTC day the counter belongs to\n    private long spentPaise = 0;                                    // guarded by the account lock, like the balance\n\n    /** @param cap the most that may leave this account in one calendar day. */\n    DailyLimitRule(Money cap) { this.cap = cap; }\n\n    /** Refuse anything that would take today&#x27;s total past the cap. A new day starts the count at zero. */\n    public void check(Account account, Money amount, long nowMs) {\n        long today = nowMs / 86_400_000L;                           // UTC days; a real bank would use the branch&#x27;s zone\n        long already = (today == day) ? spentPaise : 0;\n        if (already + amount.paise() &gt; cap.paise())\n            throw new RuleViolation(&quot;daily cap &quot; + cap + &quot;: &quot; + Money.of(already, cap.currency())\n                                    + &quot; already taken today, &quot; + amount + &quot; would break it&quot;);\n    }\n\n    /** The memory: only called after the row was written, so a refused withdrawal never counts against the cap. */\n    public void onWithdrawn(Account account, Money amount, long nowMs) {\n        long today = nowMs / 86_400_000L;\n        if (today != day) { day = today; spentPaise = 0; }\n        spentPaise += amount.paise();\n    }\n    /** What is left of today&#x27;s allowance. */\n    Money remainingToday(long nowMs) {\n        long today = nowMs / 86_400_000L;\n        return Money.of(cap.paise() - (today == day ? spentPaise : 0), cap.currency());\n    }\n}\n// the whole change at the call site:\n//     asha.addRule(new DailyLimitRule(Money.inr(&quot;3000.00&quot;)));\n\n// ---- ext: KYC -- an unverified account may receive money, but not take much out\n/**\n * KYC is a state, and the consequence of the state is a rule. Nothing in Account or Bank changes: the status\n * lives on the rule that reads it, and a verified customer&#x27;s rule simply stops refusing. Note the shape \u2014 this\n * is the same move as the daily cap, which is what &quot;a new rule is a new class&quot; is supposed to feel like.\n */\nenum KycStatus { PENDING, VERIFIED, EXPIRED }\n\n/**\n * Caps withdrawals while the customer&#x27;s papers are not in order. The status is set by the back office from\n * outside the account&#x27;s lock, so it is volatile: the next withdrawal on any thread sees the latest value.\n */\nfinal class KycRule implements WithdrawalRule {\n    private final Money capWhilePending;\n    private volatile KycStatus status = KycStatus.PENDING;\n    /** @param capWhilePending the most an unverified account may take out in one go. */\n    KycRule(Money capWhilePending) { this.capWhilePending = capWhilePending; }\n    /** Move the customer along their KYC life. */\n    void set(KycStatus s) { status = s; }\n    /** VERIFIED passes everything; PENDING and EXPIRED are capped. */\n    public void check(Account account, Money amount, long nowMs) {\n        if (status != KycStatus.VERIFIED &amp;&amp; capWhilePending.lessThan(amount))\n            throw new RuleViolation(&quot;KYC is &quot; + status + &quot;: withdrawals are capped at &quot; + capWhilePending);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; A joint account: two owners, and anything over INR 50,000 needs the second signature.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The only genuinely new state is the set of owners; everything that makes it a joint account is a rule. Below the threshold a withdrawal simply goes through. Above it, the rule refuses until a second, <i>different</i> owner has signed for that exact amount: the first owner's call parks the request and returns null, and the second owner's call performs the withdrawal. Any other refusal, such as the minimum balance, is thrown, never mistaken for \"waiting\". The signature is spent through the same <code>onWithdrawn</code> hook the daily cap uses, so one approval can never pay for two withdrawals. The rule's memory of who signed lives under the account's lock, like the balance, so two owners signing at the same instant still give exactly one withdrawal (a test signs 1,000 amounts from two threads at once). The balance, the ledger, the lock and the posting path are the ones every other account uses. That is the point of the whole page: a twist that needs a big block of code means the derivation went wrong.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a joint account -- two owners, and anything large needs a second signature\n/**\n * Two owners on one balance. The only new state is the owner set; everything that makes it a joint account is a\n * rule: above a threshold a withdrawal is refused until a second, different owner has signed for that exact\n * amount. The signature arms the rule; the withdrawal spends it, through the same onWithdrawn hook the daily cap\n * uses, so one signature can never pay for two withdrawals. Both maps are guarded by the account&#x27;s lock, like\n * the balance: check and onWithdrawn already run inside it, and JointAccount.sign takes it around sign().\n */\nfinal class DualApprovalRule implements WithdrawalRule {\n    private final Money threshold;\n    private final Map&lt;Long, Set&lt;String&gt;&gt; signatures = new HashMap&lt;&gt;();   // amount in paise -&gt; who has signed\n    private final Set&lt;Long&gt; armed = new HashSet&lt;&gt;();                     // amounts with two distinct signatures\n\n    /** @param threshold the amount above which one owner is not enough. */\n    DualApprovalRule(Money threshold) { this.threshold = threshold; }\n\n    /** True when this amount needs a second owner. */\n    boolean needsTwo(Money amount) { return threshold.lessThan(amount); }\n\n    /** Record a signature; returns true once two different owners have signed for this amount. Lock held. */\n    boolean sign(String ownerId, Money amount) {\n        Set&lt;String&gt; who = signatures.computeIfAbsent(amount.paise(), k -&gt; new HashSet&lt;&gt;());\n        who.add(ownerId);\n        if (who.size() &gt;= 2) { armed.add(amount.paise()); return true; }\n        return false;\n    }\n    /** Small amounts pass; large ones need the amount to be armed by a second owner. */\n    public void check(Account account, Money amount, long nowMs) {\n        if (needsTwo(amount) &amp;&amp; !armed.contains(amount.paise()))\n            throw new RuleViolation(&quot;a withdrawal over &quot; + threshold + &quot; needs a second owner&#x27;s signature&quot;);\n    }\n    /** Spend the signature: one approval, one withdrawal. */\n    public void onWithdrawn(Account account, Money amount, long nowMs) {\n        armed.remove(amount.paise());\n        signatures.remove(amount.paise());\n    }\n}\n\n/**\n * An account with more than one owner. It is a plain Account plus a set of owners and the approval rule; the\n * balance, the ledger, the lock and the posting path are exactly the ones every other account uses.\n */\nfinal class JointAccount extends Account {\n    private final Set&lt;String&gt; owners;\n    private final DualApprovalRule approvals;\n\n    /** Open a joint account. The first owner is the primary for reporting; both may sign. */\n    JointAccount(String id, List&lt;String&gt; owners, Money opening, Money minBalance, Money approvalThreshold,\n                 Clock clock, List&lt;AccountListener&gt; listeners) {\n        super(id, owners.get(0), AccountKind.SAVINGS, opening, clock, listeners);\n        this.owners = new LinkedHashSet&lt;&gt;(owners);\n        this.approvals = new DualApprovalRule(approvalThreshold);\n        addRule(new MinBalanceRule(minBalance));\n        addRule(approvals);                                          // two vetoes, and both must agree\n    }\n    /** Who may sign. */\n    Set&lt;String&gt; owners() { return Collections.unmodifiableSet(owners); }\n    /**\n     * One owner asks for money. Under the threshold it simply goes through; over it, the first call parks the\n     * request and returns null, and the second owner&#x27;s call performs the withdrawal. Any other refusal (the\n     * minimum balance, say) is thrown, never mistaken for &quot;waiting for a signature&quot;.\n     */\n    Txn sign(String ownerId, Money amount, String note) {\n        if (!owners.contains(ownerId)) throw new RuleViolation(ownerId + &quot; does not own &quot; + id());\n        if (!approvals.needsTwo(amount)) return withdraw(amount, note);   // one owner is enough\n        boolean armed;\n        lockAccount();                                                    // the rule&#x27;s maps live under this lock\n        try { armed = approvals.sign(ownerId, amount); } finally { unlockAccount(); }\n        return armed ? withdraw(amount, note) : null;                     // first owner: parked; second: done\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Rent on the first of every month. And then: model a loan.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both are schedules that post ordinary transfers, and the interesting part of both is the transfer id. A standing instruction (a repeating payment the customer set up once) builds its id out of its own name and the period number. So running the job twice, or on two threads at the same moment, pays each period exactly once, because a transfer is idempotent by that id. On two servers the ids need one shared store: the unique index in the next follow-up. A loan is not a new kind of money either: it is an amount owed plus a schedule of instalments, each one a transfer from the borrower into the loan account with the same id trick. The loan also counts the instalments it has paid, so a job that runs twice changes neither the money nor the amount still owed. This version uses equal principal plus interest on the reducing outstanding, so every number stays exact integer paise and the last instalment absorbs the rounding, closing the loan at exactly zero.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a standing instruction -- rent on the first of every month, and a job that ran twice pays once\n/**\n * Rent, an SIP, an EMI: a schedule that posts real transfers. The interesting part is not the schedule, it is\n * the transfer id: it carries the period number, so running the job twice \u2014 or on two threads at the same\n * moment \u2014 pays each period exactly once, because Bank.transfer is idempotent by that id (a retry with the same\n * id does nothing new). Across two servers the same id needs a shared store: the unique index further down.\n */\nfinal class StandingInstruction {\n    private final String id, fromId, toId;\n    private final Money amount;\n    private final long startMs, periodMs;\n\n    /** @param id the instruction&#x27;s name, which becomes the prefix of every transfer id it creates. */\n    StandingInstruction(String id, String fromId, String toId, Money amount, long startMs, long periodMs) {\n        this.id = id; this.fromId = fromId; this.toId = toId; this.amount = amount;\n        this.startMs = startMs; this.periodMs = periodMs;\n    }\n    /** Pay every period that has fallen due by nowMs. Safe to call as often as you like, from anywhere. */\n    List&lt;TransferReceipt&gt; runUpTo(Bank bank, long nowMs) {\n        List&lt;TransferReceipt&gt; paid = new ArrayList&lt;&gt;();\n        for (long period = 0; startMs + period * periodMs &lt;= nowMs; period++)\n            paid.add(bank.transfer(id + &quot;#&quot; + period, fromId, toId, amount, id + &quot; period &quot; + period));\n        return paid;\n    }\n}\n\n// ---- ext: a loan as a schedule -- the outstanding falls, and each instalment is an ordinary transfer\n/**\n * A loan is not a new kind of money: it is an amount still owed plus a schedule of instalments, each one an\n * ordinary transfer from the borrower&#x27;s account into the loan account. This one uses equal principal with\n * interest on the reducing outstanding, so every number is exact integer paise. (A bank&#x27;s EMI uses the annuity\n * formula; BigDecimal.pow(n) computes (1 + r)^n exactly, so no double is needed: round the instalment to paise\n * once and let the LAST instalment absorb the rounding, so the loan still closes at zero.)\n */\nfinal class Loan {\n    private final String loanAccountId, borrowerAccountId;\n    private final Money principal;\n    private final int annualBasisPoints, months;\n    private Money outstanding;\n    private int paid = 0;                                            // instalments already paid, in order\n\n    /** @param principal what was lent; @param months how many equal-principal instalments. */\n    Loan(String loanAccountId, String borrowerAccountId, Money principal, int annualBasisPoints, int months) {\n        this.loanAccountId = loanAccountId; this.borrowerAccountId = borrowerAccountId;\n        this.principal = principal; this.annualBasisPoints = annualBasisPoints; this.months = months;\n        this.outstanding = principal;\n    }\n    /** What is still owed. */\n    synchronized Money outstanding() { return outstanding; }\n    /** The interest part of the next instalment: one month on what is still outstanding. */\n    synchronized Money interestDue() {\n        return Money.of(outstanding.paise() * annualBasisPoints / (10_000L * 12L), outstanding.currency());\n    }\n    /**\n     * Pay instalment n: principal/months plus this month&#x27;s interest, moved from the borrower&#x27;s account to the\n     * loan account by an ordinary transfer, with an id that contains n so a repeated job cannot double-charge.\n     * A repeat of an instalment already paid returns its receipt and leaves the outstanding alone, so the loan&#x27;s\n     * own numbers are as safe as the money. The last instalment absorbs the rounding, so the loan closes at zero.\n     */\n    synchronized TransferReceipt pay(Bank bank, int n) {\n        String id = loanAccountId + &quot;#emi&quot; + n;\n        if (n &lt; paid) return bank.receipt(id);                          // the job ran twice: nothing changes\n        if (n != paid || n &gt;= months) throw new RuleViolation(&quot;instalment &quot; + n + &quot; is not the next one due&quot;);\n        Money principalPart = (n == months - 1) ? outstanding\n                            : Money.of(principal.paise() / months, principal.currency());\n        Money due = principalPart.plus(interestDue());\n        TransferReceipt r = bank.transfer(id, borrowerAccountId, loanAccountId, due, &quot;emi &quot; + (n + 1) + &quot; of &quot; + months);\n        outstanding = outstanding.minus(principalPart);                 // only after the money moved\n        paid++;\n        return r;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; Persist it. And now there are two branches, on two servers.</h3><button class=\"timer\" data-min=\"6\">start 6:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The mechanism is the wallet page's. The balance becomes a row behind a repository, and the debit becomes one conditional <code>UPDATE ... SET paise = paise - ? WHERE id = ? AND paise - ? &gt;= floor</code>, so the database does the check and the write in one step, as the lock did. The other two standard answers are <code>SELECT ... FOR UPDATE</code> (lock the row, then check and write) and a version column (write only if the version is still the one you read). A unique index on the transfer id gives you the same idempotency the receipt map gives you in memory. The claim of the id, the debit and the credit are one database transaction. If the debit's condition fails, the claim is rolled back with it, so the same id can be retried later (<code>releaseTransfer</code> stands for that rollback here). Two consequences are specific to a bank. First, the stored balance stops being the truth: the ledger is, and the balance is a cache you can rebuild by replaying the rows. Interviewers who say \"ledger\" often mean double entry: every movement is written twice, a debit on one account and a credit on another, so the whole book always sums to zero. Transfers here already do that; interest and fees would need the bank's own income and expense accounts as their other side. Second, the month-end batch becomes the hard part rather than the transfer: interest must be computed from each day's closing balances as they stood at a fixed cut-off time, not from rows that are still changing.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence and a second server -- the conditional UPDATE is the lock, moved into the database\n/**\n * When the balance outlives the process, the account lock is no longer the thing that decides the winner: the\n * database is. The debit becomes one conditional UPDATE whose WHERE clause carries the rule, so two servers\n * racing on the same account cannot both succeed, and the transfer id gets a unique index, so a retried request\n * inserts nothing the second time. Both are the same idea as the in-memory version, one level down.\n */\ninterface AccountRepository {\n    /** UPDATE accounts SET paise = paise - ? WHERE id = ? AND paise - ? &gt;= floor -- true if one row changed. */\n    boolean debitIfAllowed(String accountId, long paise, long floorPaise);\n    /** UPDATE accounts SET paise = paise + ? WHERE id = ? -- a credit has no condition to fail on. */\n    void credit(String accountId, long paise);\n    /** INSERT INTO transfers(id) VALUES (?) ON CONFLICT DO NOTHING -- true if this caller inserted the row. */\n    boolean claimTransfer(String transferId);\n    /** What a ROLLBACK does to the claim: the id is free again, so a refused transfer can be retried. */\n    void releaseTransfer(String transferId);\n    /** SELECT paise FROM accounts WHERE id = ?. */\n    long balance(String accountId);\n}\n\n/** A hash map pretending to be a table, so the shape of the calls can be run and tested here. */\nfinal class InMemoryAccountRepository implements AccountRepository {\n    private final Map&lt;String, Long&gt; rows = new ConcurrentHashMap&lt;&gt;();\n    private final Set&lt;String&gt; transfers = ConcurrentHashMap.newKeySet();\n    /** Seed a row, the way a migration would. */\n    InMemoryAccountRepository open(String accountId, long paise) { rows.put(accountId, paise); return this; }\n    /** The compare-and-set: compute the new value and write it only if the condition still holds. */\n    public boolean debitIfAllowed(String accountId, long paise, long floorPaise) {\n        Long[] ok = { null };\n        rows.computeIfPresent(accountId, (k, current) -&gt; {\n            if (current - paise &lt; floorPaise) return current;                  // the WHERE clause said no\n            ok[0] = current - paise; return current - paise;\n        });\n        return ok[0] != null;\n    }\n    /** An unconditional add. */\n    public void credit(String accountId, long paise) { rows.merge(accountId, paise, Long::sum); }\n    /** The unique index on the transfer id, doing the idempotency. */\n    public boolean claimTransfer(String transferId) { return transfers.add(transferId); }\n    /** The rollback of a claim. */\n    public void releaseTransfer(String transferId) { transfers.remove(transferId); }\n    /** Read one row. */\n    public long balance(String accountId) { return rows.getOrDefault(accountId, 0L); }\n}\n\n/**\n * The whole two-server transfer: claim the id, debit conditionally, credit. No application lock anywhere. In\n * the database the three statements are ONE transaction, so a refused debit rolls the claim back with it;\n * here that rollback is the releaseTransfer call, and it is what lets the caller retry the same id later.\n */\nfinal class PersistedTransfer {\n    /** Returns false when the debit&#x27;s condition failed; true when the money moved or had already moved. */\n    static boolean transfer(AccountRepository repo, String transferId, String fromId, String toId,\n                            long paise, long floorPaise) {\n        if (!repo.claimTransfer(transferId)) return true;                      // somebody already did this one\n        if (!repo.debitIfAllowed(fromId, paise, floorPaise)) {                 // the rule lives in the WHERE clause\n            repo.releaseTransfer(transferId);                                  // ROLLBACK: nothing moved, id free\n            return false;\n        }\n        repo.credit(toId, paise);\n        return true;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>12 &middot; Where does time come from, and how do you test interest, charges and dormancy without waiting six months?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The bank is handed a Clock and hands it to every account it opens; nothing in the system reads the wall clock inside a method. A test therefore owns the date: it keeps a one-element array, hands in a lambda that reads it, moves it forward by a year and asserts that INR 1,00,000 at four per cent earned exactly INR 4,000.00. The amounts are integer paise, so the assertion is an equality, not a tolerance. If the real clock steps back (a time-server correction), <code>post()</code> stamps the row with the previous row's time instead, so the ledger stays in order; test 17 moves the clock back an hour to prove it. The same seam drives the interest basis (move the clock twenty-seven days, deposit, move three more, and the two rules give different answers), dormancy, the month-end charges, the daily cap and the statement window. It is also why <code>configure</code> refuses to run once an account exists: every account must hold the same clock.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Where time comes from. Injected everywhere, so a test can say &quot;six months later&quot; without sleeping. */\ninterface Clock { long nowMs(); }\n\n// on the bank: handed in with the rules, then given to every account it opens\nvoid configure(Map&lt;AccountKind, InterestRule&gt; rules, Clock clock) {\n    if (!accounts.isEmpty()) throw new IllegalStateException(&quot;configure before opening accounts&quot;);\n    interestRules.clear(); interestRules.putAll(rules); this.clock = clock;\n}\n\n// in a test: pick the instant, then move it\nlong[] now = { 1_700_000_000_000L };\nbank.configure(Map.of(AccountKind.SAVINGS, new SimpleInterest(400)), () -&gt; now[0]);\nSavingsAccount a = bank.openSavings(&quot;SB-3&quot;, &quot;c1&quot;, Money.inr(&quot;100000.00&quot;), Money.inr(&quot;0.00&quot;));\nnow[0] += 365L * 24 * 3600 * 1000;                       // a year later\nbank.accrueInterest(365);                                // -&gt; exactly INR 4000.00 of interest\nnow[0] += 200L * 24 * 3600 * 1000;                       // and two hundred days of silence\nbank.markDormant();                                      // -&gt; DORMANT, until the next customer posting\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>13 &middot; Which pattern is where, which SOLID letter is where, and why are Savings and Current subclasses at all?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Each pattern is what a move produced: Strategy is move 3 (the veto, the interest rule, the fee policy), Decorator is PromoInterest, Observer is the listeners called after the unlock, State is move 6, and the ordered two-lock acquisition has no pattern name and is the most valuable line in the file. The SOLID letters are the five rows of move 11. The subclasses survive because earning interest and having an overdraft ceiling are genuinely is-a differences, but notice how little is left in each: a constructor that wires one rule. The veto itself is deliberately not an overridden method, because an override expresses one difference and cannot stack with the second and third. AccountKind stays an enum because it is only a key into the interest rules; a Factory earns its place the day account kinds arrive as strings from configuration.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Savings: earns interest, and may never fall below a floor. The floor arrives as a rule object rather than an\n * overridden method, so a second veto (a daily cap, a fraud hold) composes with it instead of replacing it.\n */\nfinal class SavingsAccount extends Account {\n    private final Money minBalance;\n    /** Open a savings account and wire in its one rule: the minimum balance. */\n    SavingsAccount(String id, String customerId, Money opening, Money minBalance,\n                   Clock clock, List&lt;AccountListener&gt; listeners) {\n        super(id, customerId, AccountKind.SAVINGS, opening, clock, listeners);\n        this.minBalance = minBalance;\n        addRule(new MinBalanceRule(minBalance));\n    }\n    /** The floor this account may never go under. */\n    Money minBalance() { return minBalance; }\n}\n\n/**\n * Current: may run negative, down to the overdraft ceiling, and earns no interest. Everything else about it is\n * identical to savings, which is the point: the subclass holds the is-a difference and nothing else.\n */\nfinal class CurrentAccount extends Account {\n    private final Money overdraftLimit;\n    /** Open a current account and wire in its one rule: the overdraft ceiling. */\n    CurrentAccount(String id, String customerId, Money opening, Money overdraftLimit,\n                   Clock clock, List&lt;AccountListener&gt; listeners) {\n        super(id, customerId, AccountKind.CURRENT, opening, clock, listeners);\n        this.overdraftLimit = overdraftLimit;\n        addRule(new OverdraftRule(overdraftLimit));\n    }\n    /** How far below zero this account may go. */\n    Money overdraftLimit() { return overdraftLimit; }\n}\n\n// Strategy: the veto is an object, so vetoes COMPOSE -- which an overridden method cannot do\nasha.addRule(new MinBalanceRule(Money.inr(&quot;1000.00&quot;)));\nasha.addRule(new DailyLimitRule(Money.inr(&quot;3000.00&quot;)));   // both must agree, at run time\n\n// Decorator: a bonus on top of a rate nobody edited\nbank.configure(Map.of(AccountKind.SAVINGS, new PromoInterest(new SimpleInterest(400), 50)), clock);\n\n// Observer: the account announces; it does not know what an SMS is\ninterface AccountListener { void onPosted(Account account, Txn txn); }\n\n// State: the life is a fixed set of moves, checked before every write\nenum AccountStatus { ACTIVE, DORMANT, FROZEN, CLOSED }\n\n// the line with no pattern name, and the one that matters most\nAccount first = fromId.compareTo(toId) &lt; 0 ? from : to;   // a total order over the ids\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];

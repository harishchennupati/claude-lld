<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design the core of a bank. Customers with savings and current accounts; deposits, withdrawals and transfers between two accounts; a statement at the end of the month. Savings keeps a minimum balance and earns interest, current may go overdrawn. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>A bank holds accounts. Each account belongs to a customer, holds a balance, and keeps a full history of every rupee that moved, because the statement <i>is</i> the product. Money goes in and money comes out. The two account types disagree about one thing: how far the balance may fall. A savings account must stay above a floor (its minimum balance); a current account may sink below zero, down to its overdraft limit. They also differ in what the bank pays or charges at the end of a month. There the real question is not the rate but the <i>basis</i>: which balance the rate is applied to. A savings account is paid on the closing balance of every day, so money that arrived on the 28th earns three days, not a month. Money also moves between two accounts, and nobody may ever see the debit without the credit. Tellers, ATMs and the phone app all post (write a row to an account) at the same moment. So two things must always be true: no posting may be lost, and a transfer never creates or destroys a rupee (whatever the bank held before it, it holds after it). Interest, charges, dormancy (an idle account being marked inactive) and statements all depend on the date, so the date is something the code is given, not something it looks up.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that opens two accounts, moves money and prints the balances. The interviewer is watching for, in this order: the questions you ask before typing (how money is represented, and what actually differs between savings and current, are the first two); which classes exist and which one owns the balance; a deposit, a withdrawal and a transfer end to end; what happens when two ATMs hit one account at the same instant; where the rule that will change lives, so a daily cap is a new class and not an edit; what the account looks like when a rule says no. Then the twists: interest and what it is paid on, a charge instead of a refusal, dormancy, joint accounts, standing instructions, loans, KYC, persistence.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 350\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"57\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">post</text><g transform=\"translate(175 26)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cash in, or cash out</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an account, an amount</text></g><path d=\"M415 53 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 26)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every rule must agree</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">floor, ceiling, daily cap</text></g><path d=\"M675 53 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 26)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">row and balance together</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one lock hold, or neither</text></g><path d=\"M935 53 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 26)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">tell the SMS and the audit</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">after the unlock, never inside</text></g><text x=\"88\" y=\"181\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">transfer</text><g transform=\"translate(175 150)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">pay B out of A</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">with a transfer id</text></g><path d=\"M415 177 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 150)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lock both, lower id first</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">so a cycle cannot form</text></g><path d=\"M675 177 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 150)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ask B, debit A, credit B</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the fee is asked first, too</text></g><path d=\"M935 177 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 150)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one receipt per id</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a retried request pays once</text></g><text x=\"88\" y=\"245\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">end of period</text><g transform=\"translate(175 214)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">interest for the period</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">by account kind</text></g><path d=\"M415 241 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 214)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">on the daily closing balances</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read off the ledger</text></g><path d=\"M675 241 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 214)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">charges, as FEE rows</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">below the floor, overdrawn</text></g><path d=\"M935 241 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 214)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">180 days idle: DORMANT</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a customer posting wakes it</text></g><path d=\"M555 80 V90\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(360 90)\"><rect width=\"390\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"195.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a rule says no: no row, no paise</text></g><text x=\"88\" y=\"300\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"300\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, without re-adding the history: what is my balance?  what did March look like?  what does the bank hold?</text><text x=\"615\" y=\"334\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">tellers, ATMs and the app all at once: no posting may be lost, a transfer may not create or destroy a rupee, and two customers paying each other must never deadlock</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>How is money represented?</td><td>Integer paise inside a value type that carries its currency</td><td><code>long</code>, never <code>double</code>; INR plus USD throws (moves 1, 5)</td></tr><tr><td>What really differs between savings and current?</td><td>Only how far below zero the balance may go</td><td>The difference is a rule object, not an overridden method (move 3)</td></tr><tr><td>Is the balance a stored field, or the sum of the ledger?</td><td>Stored, and written with its row while the lock is held</td><td>O(1) reads now; persisted, this flips (move 5)</td></tr><tr><td>Two callers on one account at the same instant &mdash; and two customers paying each other?</td><td>Both happen, and a request may be retried</td><td>One lock per account, both taken in id order, and the transfer id decides a repeat (moves 4, 6)</td></tr><tr><td>What is interest paid on?</td><td>The closing balance of each day in the period</td><td>The rule is handed the account, not a number, and reads the ledger (moves 3, 5)</td></tr><tr><td>Who drives interest, charges and dormancy?</td><td>An injected clock, and a month-end batch over every account (a sweep) that the caller runs</td><td><code>Clock</code> as an interface; a test moves a year in one line (moves 3, 9)</td></tr><tr><td>One process in memory, or a database and many branches?</td><td>One process, in memory</td><td>No repository yet; a follow-up adds one (move 12)</td></tr><tr><td>Joint accounts, loans, KYC, scheduled payments?</td><td>Out of scope, named</td><td>Each is one of the five twist moves (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Open savings and current accounts for a customer, each with an opening balance.</li>\n<li>Deposit and withdraw; every balance change writes one row to the account's ledger (its history, never edited), and the row carries the balance after it.</li>\n<li>Savings keeps a minimum balance; current may run negative, down to an overdraft ceiling.</li>\n<li>Transfer between two accounts: nobody may ever see the debit without the credit, and a caller-supplied key makes a retried request move the money once.</li>\n<li>Interest accrues for a period, by account kind, on the closing balance of each day, driven by an injected clock.</li>\n<li>The bank charges as well as pays: a penalty under the minimum balance, interest on the days a current account spent overdrawn.</li>\n<li>An account is ACTIVE, DORMANT (idle for months), FROZEN or CLOSED; closing is refused unless the balance is exactly zero.</li>\n<li>A statement for any window, and alerts to whoever subscribed (a large withdrawal, an audit feed).</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Many tellers and ATMs at once: no lost update, and no transfer creates or destroys a rupee.</li>\n<li>Two customers paying each other must never deadlock: the lock order is decided, not hoped for.</li>\n<li>Money is exact: integer paise inside a value type, never a double, and INR never adds to USD.</li>\n<li>Balance, account lookup and \"which accounts does she own\" are O(1); a statement is a binary search.</li>\n<li>Withdrawal rules, interest, fees and alerts swappable without editing Account or Bank.</li>\n<li>Nothing half-done: a refused withdrawal or transfer leaves no row, no paise and no alert behind it.</li>\n<li>In memory, one process, no persistence (say it; a follow-up adds it).</li></ul></div></div>\n<div class=\"move\"><h3>One afternoon, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">10:05  Asha at an ATM</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">SB-1001 holds 1,00,000.00</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">floor 1,000.00; she asks for 99,500</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">refused: not a row, not a paise</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the balance reads 1,00,000.00</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">11:20  the shop pays a supplier</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">CA-2001 holds 20,000.00</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">it pays out 60,000.00</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">allowed to -40,000.00</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">current account, ceiling 50,000</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">14:00  rent, SB-1001 to CA-2001</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">25,000.00, transfer id T-1</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">locks: CA-2001 then SB-1001</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the app retried T-1 at 14:00:01</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">same receipt, no second pair of rows</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">31st, 23:00  the month closes</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">she held 75,000 for 17 of 31 days</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">paid on each day's closing balance</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the shop pays 18% on its red days</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">each its own row: INTEREST or FEE</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> money is integer paise in a value type that carries its currency and refuses mixed arithmetic; the balance is a stored field, written together with its ledger row while the account's lock is held; savings and current differ only in the rule objects they are opened with; interest is paid on the daily closing balance, so the rule is handed the account and reads the ledger; a transfer takes both account locks in id order, and is idempotent by a caller-supplied key (a retry with the same key moves no more money); the date is injected. Named as out of scope: joint accounts, standing instructions, loans, KYC, persistence &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, elevator, Splitwise) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On a bank two of the moves do more work than usual. Move 3, because the obvious design (override withdraw() per account type) is the wrong one. Move 5, because the ledger has to answer \"what did she hold on each day of March?\" as well as \"what is my balance?\". The two-account transfer (ordered locks, one receipt per id, a debit and a credit that land together) is worked through in full on the digital wallet page. Here it is stated once, and the hour goes on the things only a bank has.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a CUSTOMER holds ACCOUNTS; an ACCOUNT has a BALANCE and a LEDGER of ROWS; a RULE vetoes a WITHDRAWAL; a TRANSFER moves money between two accounts</text><g transform=\"translate(30 110)\"><rect width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Customer</text><text x=\"75.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an id; nothing moves</text></g><path d=\"M105.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(200 110)\"><rect width=\"180\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Account</text><text x=\"90.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">balance, ledger, lock</text></g><path d=\"M290.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 110)\"><rect width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Txn</text><text x=\"75.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one immutable row</text></g><path d=\"M475.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(570 110)\"><rect width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Money</text><text x=\"75.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">paise + currency</text></g><path d=\"M645.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(740 110)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Bank</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">accounts, transfer ids</text></g><path d=\"M820.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(920 110)\"><rect width=\"140\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"70.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Rule</text><text x=\"70.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an interface</text></g><path d=\"M990.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1080 110)\"><rect width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"75.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Balance</text><text x=\"75.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a field, not a class</text></g><path d=\"M1155.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a field, an interface, or a method</text></svg></div><div class=\"move\"><p>Reading the paragraph again: a <b>customer</b> holds <b>accounts</b>; an account has a <b>balance</b> and a <b>ledger</b> of <b>rows</b>; a <b>rule</b> vetoes a <b>withdrawal</b>; a <b>transfer</b> moves money between two accounts. An account has a balance, a status, a history and a lock, all of which change: a class, and the one the whole design turns on. A ledger row has a type, an amount and the balance after it, and never changes again: a record. Money is two values that never change once made, paise and a currency, so it is a value type (an object that is nothing but its values). Making it a type rather than a bare <code>long</code> is what stops somebody adding rupees to dollars. A customer has an id and a name and nothing that moves, so the account stores the id and a rename can never move money. A rule answers one question, so it is an interface; the rare rule that must remember something, such as a daily cap, keeps that memory inside its own class. And a balance is not a separate thing to store twice: it is one field on the account, written in the same breath as the row that explains it.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 288\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">put money in, take money out</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 42 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 20)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Account  (owns the balance, the ledger, the lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 42 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 20)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">account.deposit / withdraw(amount)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 74)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">say no to a withdrawal</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 96 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 74)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WithdrawalRule  (owns only its own memory)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 96 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 74)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rule.check(account, amount, now)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 128)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">move money between two accounts</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 150 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 128)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Bank  (owns both accounts, so it owns the order)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 150 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 128)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">bank.transfer(id, from, to, amt)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 182)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what did March look like?</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 204 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 182)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Account  (owns the rows)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 204 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 182)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">account.statement(from, to)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"255\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb whose state sits in TWO classes belongs to neither: it goes up to the class that owns both. That is why transfer lives on the Bank</text><text x=\"615\" y=\"274\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and a statement is not a new class reaching into the ledger: the account owns the rows, so the account prints them</text></svg></div><div class=\"move\"><p>\"Put money in, take money out\" touches the balance, the ledger and the lock, and only the account owns all three, so <code>account.deposit(...)</code> and <code>account.withdraw(...)</code>. \"Say no to a withdrawal\" touches nothing but the amount and the balance it is given, so it belongs to a rule: <code>rule.check(account, amount, now)</code>. \"What did March look like?\" touches the rows, and the account owns the rows, so <code>account.statement(from, to)</code> &mdash; a statement is not a new class reaching into somebody else's list. Then the interesting one. \"Move money between two accounts\" touches two balances, and a verb whose state sits in two classes belongs to neither: it goes up to the class that owns both. That is the bank. It is not an extra layer: it is the only place allowed to hold two account locks, and that rule is what stops one account reaching into another and two threads waiting for each other forever.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 464\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 142)\"><rect width=\"220\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Bank / Account</text><text x=\"110.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(...) / addRule(...)</text></g><path d=\"M250 187 H330 V42 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 20)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WithdrawalRule</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">floor, overdraft, daily cap, KYC</text></g><g transform=\"translate(760 20)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MinBalanceRule / OverdraftRule / DailyLimitRule</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 42 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 187 H330 V100 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 78)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">InterestRule</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a rate, a bonus, and the BASIS</text></g><g transform=\"translate(760 78)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SimpleInterest, DailyBalanceInterest, PromoInterest</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 100 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 187 H330 V158 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MonthlyCharge</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">below the floor, days overdrawn</text></g><g transform=\"translate(760 136)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MinBalancePenalty, OverdraftInterest</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 158 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 187 H330 V216 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 194)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FeePolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">free, or flat above a threshold</text></g><g transform=\"translate(760 194)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FlatFeeAboveThreshold, or a lambda</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 216 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 187 H330 V274 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 252)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AccountListener</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">SMS, audit, fraud, analytics</text></g><g transform=\"translate(760 252)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AuditLog, LargeWithdrawalAlert, a lambda</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 274 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 187 H330 V332 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 310)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what today's date is</text></g><g transform=\"translate(760 310)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::currentTimeMillis, or a test's lambda</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 332 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"384\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed = handed in. Nothing here builds a rule, so a daily cap is a new class and one line &mdash; and one rule WRAPS another:</text><text x=\"615\" y=\"403\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">PromoInterest(SimpleInterest(400), 50) adds a festival bonus to a rate nobody edited. That is Decorator, and it was born here</text><text x=\"615\" y=\"426\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">InterestRule is handed the ACCOUNT, not a number, so \"which balance do we pay on?\" is the rule's answer too, read off the ledger</text><text x=\"615\" y=\"449\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tempting design is to override withdraw() in SavingsAccount and CurrentAccount. Then the first daily cap needs an instanceof: vetoes stack up, overrides do not</text></svg></div><div class=\"move\"><p>How far the balance may fall will change: a floor today, an overdraft for current accounts, a daily cap on ATMs before the hour is out. The interest rate will change, and so will a festival bonus on top of it. What the bank takes will change twice over: what a transfer costs, and what it charges at the end of a month &mdash; a penalty under the minimum balance, interest on the days a current account spent overdrawn. Who is told will change: an SMS today, a fraud engine and a regulator feed later. Each becomes a one-method interface that is handed in through <code>configure()</code> or <code>addRule()</code> and never built inside. One of them hides a question most candidates miss. <code>InterestRule</code> is handed the <i>account</i>, not a balance, so the rule also decides the <b>basis</b>. It can pay on the balance as it stands, or on the closing balance of every day in the month. The second is what a real savings account is paid on, and it stops a deposit made on the 28th earning a full month. Reading those daily balances needs the ledger, and the account already has it. This is where the patterns come from, not the other way round: a swappable rule behind an interface is <b>Strategy</b>; a rule that wraps another and adds to it is <b>Decorator</b>; a bank that announces \"a row was written\" without knowing what an SMS is, is <b>Observer</b>. And notice the design this replaces. The tempting move is to override <code>withdraw()</code> in SavingsAccount and CurrentAccount, since that is the one sentence they disagree about. Do that and the first extra check &mdash; a daily cap, a fraud hold &mdash; means editing both subclasses or writing an <code>instanceof</code>. An override can express one difference. Vetoes have to stack up (every one of them must agree), and a list of rule objects stacks; overrides do not. The subclasses shrink to what is genuinely is-a: savings earns interest, current has a ceiling.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"210\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"105.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an ATM in Kolkata</text><text x=\"105.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads 5,000.00</text></g><g transform=\"translate(30 110)\"><rect width=\"210\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"105.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">her phone, same instant</text><text x=\"105.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads 5,000.00</text></g><g transform=\"translate(360 70)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the balance</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">INR 5,000.00</text></g><path d=\"M240 52 H360 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M240 132 H360 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"300\" y=\"40\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"300\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"590\" y=\"20\" width=\"300\" height=\"148\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"740\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"740\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both were told \"you have enough\"</text><text x=\"740\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">8,000.00 leaves a 5,000.00 account</text><text x=\"740\" y=\"110\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">and the 1,000.00 floor is broken</text><text x=\"740\" y=\"145\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: check and write as ONE step</text><g transform=\"translate(920 40)\"><rect width=\"280\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"140.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Account.lock</text><text x=\"140.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">rules + row + balance, one hold</text></g><text x=\"1060\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock lives where the balance lives</text><text x=\"1060\" y=\"185\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one lock per ACCOUNT: two customers never wait</text></svg></div><div class=\"move\"><p>An ATM in Kolkata and her phone hit the same account at the same instant, both asking for four thousand out of a balance of five thousand with a floor of one thousand. Both read five thousand, both are told \"you have enough\", both write: eight thousand leaves an account that held five, and the floor everyone was so careful about is broken. So checking and writing must be one step, in the class that owns the balance and the ledger: the account. Both happen in one <i>hold</i> of its lock (the lock is taken once and not released in between). The lock is per <i>account</i>, not per bank, and that is the whole trick. Fifty million accounts post in parallel and never wait for each other; the two tellers touching one account take turns, for about a microsecond and a half each. Anything that only listens (the SMS, the audit file) is called after the lock is released, never inside it, because a gateway that hangs for thirty seconds must not be able to hold a balance hostage.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 396\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is my balance?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 39 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 20)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a Money field, written with the row</text><text x=\"

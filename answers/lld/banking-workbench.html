text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 250)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">have I already done this transfer?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 269 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 250)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ConcurrentHashMap&lt;txId, Receipt&gt;</text><text x=\"260.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 269 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 250)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 296)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what did she hold on each day of March?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 315 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 296)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one copy of the ledger, one binary search a day</text><text x=\"260.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 315 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 296)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(n + 31 log n)</text></g><text x=\"615\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the balance is a STORED field, not re-added from the ledger: the row and the field are written in the same lock hold, so they cannot disagree</text><text x=\"615\" y=\"383\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and the ledger answers the last question for free, which is what makes interest on the daily closing balance a rule and not a new store</text></svg></div><div class=\"move\"><p>\"What is my balance?\" is a field on the account, written in the same lock hold as the row that changed it, so the two can never disagree. It is not re-added from the ledger on every read: adding up a year of history on every balance screen is the mistake that makes a real bank slow. \"The account numbered CA-2001?\" is a map by id. \"Which accounts does she own?\" is a map from customer id to a list of account ids. \"What happened in March?\" is the ledger, appended in time order, so both ends of a window are a binary search: O(log n + k), never a scan. That order is guaranteed: <code>post()</code> never stamps a row earlier than the row before it, even if the server's clock steps back. \"Which interest rule does a savings account use?\" is an <code>EnumMap</code> keyed by the account kind, which is what the kind enum is <i>for</i>. \"Have I already done this transfer?\" is a map from the caller's transfer id to its receipt, and that one map is what makes a retried request free. Then the question the ledger answers for free: \"what did she hold on each day of March?\" is one copy of the rows and thirty-one binary searches over it. That is why interest on the daily closing balance is a rule that reads the ledger, not a second store of daily balances. One honest note: the day this is saved to a database, the ledger becomes the record, and the stored balance becomes a copy (a cache) you can always rebuild by replaying the rows. The last failure test does exactly that.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 345\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(60 30)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ACTIVE</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">takes postings</text></g><g transform=\"translate(330 30)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FROZEN</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">refuses everything</text></g><g transform=\"translate(60 125)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DORMANT</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">180 days untouched</text></g><g transform=\"translate(330 125)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CLOSED</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">final; never reopens</text></g><path d=\"M240 45 H330\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"285\" y=\"37\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--muted)\">freeze</text><path d=\"M330 62 H240\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"285\" y=\"79\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--muted)\">unfreeze</text><path d=\"M120 74 V125\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"112\" y=\"104\" text-anchor=\"end\" font-size=\"9.5\" fill=\"var(--muted)\">180 days idle</text><path d=\"M180 125 V74\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"190\" y=\"104\" text-anchor=\"start\" font-size=\"9.5\" fill=\"var(--muted)\">customer posts</text><path d=\"M228 74 L336 125\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M240 147 H330\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"285\" y=\"141\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"var(--muted)\">at zero</text><text x=\"285\" y=\"195\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">ACTIVE or DORMANT to CLOSED, only at exactly zero</text><text x=\"285\" y=\"213\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">FROZEN cannot close: a freeze is a legal hold</text><rect x=\"560\" y=\"20\" width=\"650\" height=\"200\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"885\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside a transfer, and why it is this order</text><text x=\"575\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1  the transfer id: if it already has a receipt, return it and post nothing</text><text x=\"575\" y=\"84\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2  take BOTH locks, lower account id first -- always, by id</text><text x=\"575\" y=\"102\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3  ask all that could refuse: the destination, and the fee policy</text><text x=\"575\" y=\"120\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4  debit the source: its rules see amount + fee, in the same hold</text><text x=\"575\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5  credit the destination: it cannot fail, because step 3 already asked</text><text x=\"575\" y=\"156\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">6  write the fee row, already approved in step 4, in the same hold</text><text x=\"575\" y=\"174\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">7  write the receipt, release both locks, and only then tell the listeners</text><text x=\"575\" y=\"192\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">anything that throws before step 4 leaves both accounts exactly as they were, and the</text><text x=\"575\" y=\"210\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">id is not claimed, so the caller may retry it once the reason has been fixed</text><g transform=\"translate(30 255)\"><rect width=\"250\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 1:  A pays B</text><text x=\"125.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds A, wants B</text></g><g transform=\"translate(330 255)\"><rect width=\"250\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 2:  B pays A</text><text x=\"125.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds B, wants A</text></g><path d=\"M280 267 H330\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M330 289 H280\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><rect x=\"20\" y=\"245\" width=\"570\" height=\"64\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"305\" y=\"325\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">a deadlock: each holds one lock and waits for the other, forever</text><g transform=\"translate(640 255)\"><rect width=\"570\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the fix is not more locks, it is an ORDER</text><text x=\"285.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">sort the two ids and take the LOWER one first: a cycle cannot form</text></g><text x=\"925\" y=\"325\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every thread takes the lower id first, so none can hold what another waits for</text></svg></div><div class=\"move\"><p>An account is ACTIVE when it is working. It becomes DORMANT after 180 days in which no customer touched it (this code's number; for an Indian \"inoperative\" account the RBI's number is two years). It is FROZEN when the bank or a court says so, and a frozen account cannot be closed until it is unfrozen. It is CLOSED only when the balance is exactly zero, so money can never be stranded in an account nobody can reach; CLOSED is final. Any customer posting wakes a dormant account, but the bank's own interest row does not, which is a small rule worth saying out loud. Writing the states down forces the question the interviewer will ask: what if something fails halfway through a transfer? The answer is an order (the digital wallet page derives it in full). One: check the transfer id, and return the old receipt if it has one. Two: take <i>both</i> locks, lower account id first. Three: before a single paise moves, ask everything that could refuse: the destination (frozen, closed, wrong currency) and the fee policy. Four: debit the source, with its rules checking the amount plus the fee in the same hold. Five: credit the destination, which now cannot fail. Six: write the fee row. Seven: write the receipt, release both locks, then tell the listeners. Anything that throws before the debit leaves both accounts exactly as they were, and the id is not claimed, so the caller can retry it. The one line worth memorising is the lock <i>order</i>. Every thread takes the lower account id first, so no thread can hold one account while waiting for a thread that holds the other: A-pays-B while B-pays-A cannot deadlock. That is impossible, not merely unlikely.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one account's postings happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"540\" height=\"155\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about 1.5 microseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">is the status ACTIVE or DORMANT?</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one to three rule checks, each reading the balance</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one Money subtract, overflow-checked</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">append one row; write balance, seq and the stamp</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">about twelve operations in all</text></g><path d=\"M570 97 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"605\" y=\"87\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"155\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: milliseconds to seconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the SMS to the customer: about 50 ms, after unlock</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the audit file: about 1 ms, after unlock</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the database write: about 5 ms (a follow-up)</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the customer at the ATM: seconds</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">a transfer holds TWO locks, for about 3 us</text></g><text x=\"615\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">ten ATMs hit one salary account at the same instant</text><g transform=\"translate(30 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">atm 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(148 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">atm 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 1.5 us</text></g><g transform=\"translate(266 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">atm 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 3.0 us</text></g><g transform=\"translate(384 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">atm 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 4.5 us</text></g><g transform=\"translate(502 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">atm 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 6.0 us</text></g><g transform=\"translate(620 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">atm 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 7.5 us</text></g><g transform=\"translate(738 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">atm 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 9.0 us</text></g><g transform=\"translate(856 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">atm 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 10.5 us</text></g><g transform=\"translate(974 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">atm 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 12.0 us</text></g><g transform=\"translate(1092 220)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">atm 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 13.5 us</text></g><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tenth ATM waits 13.5 microseconds for the lock and then fifty milliseconds for its own SMS:</text><text x=\"615\" y=\"306\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one at a time is true, and nobody can tell, because nothing slow is allowed inside the lock</text></svg></div><div class=\"move\"><p>If every posting takes the account's lock, is the bank a queue? It is, for about a microsecond and a half, and only for the people touching that one account. Inside the lock: a status check, one to three rule checks, one overflow-checked subtraction, one row appended, three field writes; about twelve operations. Each rule check reads the balance, which takes the same lock again; that works because the lock is reentrant (the thread that holds it may take it again). Everything slow is outside: the SMS at fifty milliseconds, the audit file, a later version's database write, and the customer standing at the machine. So when ten ATMs hit one salary account at the same instant, the tenth waits about 13.5 microseconds for the lock and then fifty milliseconds for its own SMS. The one banking-specific note: interest and the month-end charges hold one account's lock at a time, for microseconds, to read that account's balances and write its row. So a batch over fifty million accounts never makes a customer at an ATM wait longer than that.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per account: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the locked part of a posting: ~12 operations, about 1.5 us</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a salary account: about 30 postings a month, one a day</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a busy merchant current account: 5 a second = 7.5 us a second</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">even 1,000 postings a second into ONE account is 1.5 ms: 0.15% busy</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">and the lock is per ACCOUNT: fifty million accounts never meet</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 nothing slow inside the lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the SMS, the audit file, the database: all after the unlock</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 shrink the hold, or split one very hot account</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">k sub-balances, each with its own lock, summed on read</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 the balance becomes a database row</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE ... SET paise = paise - ? WHERE id = ? AND paise - ? &gt;= floor</text></g></svg></div><div class=\"move\"><p>A salary account sees about thirty postings a month. A busy merchant's current account might see five a second, which is seven and a half microseconds of lock in every second. Invent a thousand postings a second into one account and it is one and a half milliseconds a second: busy fifteen hundredths of one per cent of the time. The lock is per account, so the number of accounts is irrelevant; only the two accounts in a transfer ever share. Then the ladder, in the order you would climb it. First, keep everything slow outside the lock, which this code already does. Second, if one account really is hot (a settlement account where a big merchant's card payments land, a million credits a day), split its balance into k sub-balances, each with its own lock, summed on read. Third, beyond one process, make the balance a database row and the debit one conditional <code>UPDATE ... WHERE paise - ? &gt;= floor</code>, with a unique index on the transfer id (the database refuses a second row with the same id). Say the arithmetic first: climbing the ladder without it is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 347\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">sixteen ATMs on one account at once</text></g><path d=\"M370 37 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 18)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check and write in ONE lock hold; test 6: 192 tries, exactly 90 get paid</text></g><g transform=\"translate(30 60)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">A pays B while B pays A</text></g><path d=\"M370 79 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 60)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">both locks in account-id order; test 7: all 64 finish, total assets unchanged</text></g><g transform=\"translate(30 102)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the destination is frozen</text></g><path d=\"M370 121 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 102)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ask the destination BEFORE the debit; test 12: the source still has one row</text></g><g transform=\"translate(30 144)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a savings account is drained past its floor</text></g><path d=\"M370 163 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 144)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every rule inside the same hold; tests 1 and 2: balance and ledger identical</text></g><g transform=\"translate(30 186)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same transfer request arrives twice</text></g><path d=\"M370 205 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 186)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the transfer id is the key; test 10: two rows each, not four</text></g><g transform=\"translate(30 228)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a month's interest on 3-day-old money</text></g><path d=\"M370 247 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 228)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the rule reads the daily closing balances; test 4: INR 65.75, not INR 361.64</text></g><g transform=\"translate(30 270)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the balance and the ledger disagree</text></g><path d=\"M370 289 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 270)\"><rect width=\"790\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one writer, both written in one hold; test 24: 277 rows replay to the balances</text></g><text x=\"615\" y=\"334\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a failure test: FailureTests.java runs fifty-eight of them and must print ALL PASS</text></svg></div><div class=\"move\"><p>Sixteen ATMs on one account at the same instant: the check and the write happen in one hold, so the arithmetic is exact. INR 9,000 above the floor, taken INR 100 at a time, is exactly 90 successful withdrawals out of 192 attempts, whatever order the threads ran in. Two customers paying each other at the same instant: both locks in account-id order, all 64 transfers finish, and the bank's total assets are unchanged to the paise. The destination frozen: asked before the debit, so the source still has exactly one row. A savings account drained past its floor: every rule inside the same hold, and a refusal leaves no row and no paise. The same transfer request arriving twice: the id is the key, two rows each and not four. A fee policy that throws, or a fee that would break the overdraft limit: the fee is asked before any money moves, so nothing is written. A month of interest paid on money that arrived three days ago: the daily-closing-balance rule pays INR 65.75 where the naive one pays INR 361.64. The balance and the ledger drifting apart: every row of every account in every test bank is replayed from zero and must land on the stored balance. And the SMS gateway throwing: listeners run after the unlock, each in a try/catch, and the deposit still lands. Each of these is a few lines in FailureTests.java; a design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 345\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"29\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"38.5\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"210\" y=\"38.5\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"300\" y=\"38.5\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"860\" y=\"38.5\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"49\" width=\"1190\" height=\"29\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"67.5\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"210\" y=\"67.5\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"67.5\" font-size=\"11\" fill=\"var(--text)\">interface WithdrawalRule { void check(account, amount, now); }</text><text x=\"860\" y=\"67.5\" font-size=\"11\" fill=\"var(--text)\">a daily cap is a class plus one addRule line</text><rect x=\"20\" y=\"78\" width=\"1190\" height=\"29\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"96.5\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"210\" y=\"96.5\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"96.5\" font-size=\"11\" fill=\"var(--text)\">new PromoInterest(new SimpleInterest(400), 50)</text><text x=\"860\" y=\"96.5\" font-size=\"11\" fill=\"var(--text)\">a festival bonus without editing the rate</text><rect x=\"20\" y=\"107\" width=\"1190\" height=\"29\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"125.5\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"210\" y=\"125.5\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"300\" y=\"125.5\" font-size=\"11\" fill=\"var(--text)\">publish(t) after the unlock, inside a try/catch</text><text x=\"860\" y=\"125.5\" font-size=\"11\" fill=\"var(--text)\">the SMS hears; the balance never waits</text><rect x=\"20\" y=\"136\" width=\"1190\" height=\"29\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"154.5\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"210\" y=\"154.5\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"300\" y=\"154.5\" font-size=\"11\" fill=\"var(--text)\">ACTIVE / DORMANT / FROZEN / CLOSED, checked before every post</text><text x=\"860\" y=\"154.5\" font-size=\"11\" fill=\"var(--text)\">an illegal posting cannot happen</text><rect x=\"20\" y=\"165\" width=\"1190\" height=\"29\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"183.5\" font-size=\"11\" fill=\"var(--text)\">Ordered locking</text><text x=\"210\" y=\"183.5\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"300\" y=\"183.5\" font-size=\"11\" fill=\"var(--text)\">first = fromId.compareTo(toId) &lt; 0 ? from : to;</text><text x=\"860\" y=\"183.5\" font-size=\"11\" fill=\"var(--text)\">deadlock is impossible, not rare</text><rect x=\"20\" y=\"194\" width=\"1190\" height=\"29\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"212.5\" font-size=\"11\" fill=\"var(--muted)\">Template Method</text><text x=\"210\" y=\"212.5\" font-size=\"11\" fill=\"var(--text)\">rejected</text><text x=\"300\" y=\"212.5\" font-size=\"11\" fill=\"var(--muted)\">withdraw() fixed in Account, canWithdraw() overridden per subclass</text><text x=\"860\" y=\"212.5\" font-size=\"11\" fill=\"var(--muted)\">a second veto would need an instanceof</text><rect x=\"20\" y=\"223\" width=\"1190\" height=\"29\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"241.5\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"210\" y=\"241.5\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"300\" y=\"241.5\" font-size=\"11\" fill=\"var(--muted)\">the Bank is handed to its callers; no getInstance()</text><text x=\"860\" y=\"241.5\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh Bank</text><rect x=\"20\" y=\"252\" width=\"1190\" height=\"29\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"270.5\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"210\" y=\"270.5\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"300\" y=\"270.5\" font-size=\"11\" fill=\"var(--muted)\">openSavings / openCurrent are the two constructors</text><text x=\"860\" y=\"270.5\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when kinds come from config</text><rect x=\"20\" y=\"281\" width=\"1190\" height=\"29\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"299.5\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"210\" y=\"299.5\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"300\" y=\"299.5\" font-size=\"11\" fill=\"var(--muted)\">an account has five fields and every one is required</text><text x=\"860\" y=\"299.5\" font-size=\"11\" fill=\"var(--muted)\">it earns a place when an application form arrives</text><text x=\"615\" y=\"330\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence, and \"rejected\" is an answer too</text></svg></div><div class=\"move\"><p>Every pattern here came out of a move, which is why each can be defended in one sentence. Strategy is move 3: how far a balance may fall, what interest it earns and what a transfer costs are rules that will change, so each sits behind a one-method interface that is handed in. Decorator is the same move's wrapper: <code>PromoInterest</code> adds a festival bonus to whatever rule an account kind already has, instead of editing the rate. Observer is move 4's rule that an SMS gateway must never be inside the lock. State is move 6: the account's life written down, so a posting to a closed account throws instead of quietly working. The ordered two-lock acquisition in a transfer has no fancy name and is the most valuable line on the page. Then the honest negatives. Template Method (a fixed <code>withdraw()</code> in Account that calls one step each subclass overrides, such as <code>canWithdraw()</code>) is the design most people reach for here. It is rejected on purpose: it expresses exactly one difference, and the second veto costs an <code>instanceof</code>. Singleton earned nothing: the bank is handed to its callers, so a test builds a fresh one. Factory earns the name the day account kinds arrive as strings from configuration, and Builder the day a real application form arrives with a dozen optional fields. A pattern without a move behind it is decoration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"450\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"560\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"450\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"560\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Money does arithmetic, Txn is one row, Account guards one balance, Bank owns the transfer</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"450\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">DailyLimitRule is a new file plus asha.addRule(...); Account and Bank are untouched</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"450\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">deposit / withdraw are final, so no subclass can skip a rule or post outside the lock</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"450\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">WithdrawalRule, InterestRule, FeePolicy, AccountListener, Clock: one method to implement each</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"450\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"560\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">bank.configure(rules, clock);  account.addRule(rule);  bank.setFeePolicy(p)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>SOLID is not a list to recite; it is the check that the moves did their job. S: a class has one reason to change, which move 2 gave you &mdash; Money does arithmetic, a Txn is one immutable row, an Account guards one balance and its history, a rule answers one question, and the Bank owns the one invariant that spans two accounts. O: a daily cap is a new file and one <code>addRule</code> call, and Account, Bank, Money, Txn and both subclasses are never opened. L: <code>deposit</code>, <code>withdraw</code> and both halves of a transfer are <code>final</code>, so no subclass can skip a rule or write a row outside the lock &mdash; the substitution is safe because there is nothing left to override. I: five interfaces, one method to implement each, so a fake for a test is a lambda. D: the bank depends on interfaces and is handed the implementations, which is exactly why a test can hand it a clock that says next March and a rule that refuses everything.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns 2.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a fee, a sweep across three accounts</text></g><path d=\"M370 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every leg inside the SAME ordered locks: all of it or none</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 4, 6</text><g transform=\"translate(30 240)\"><rect width=\"340\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"170.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">persist it; two branches</text></g><path d=\"M370 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the balance becomes a row; the debit becomes</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE ... WHERE id = ? AND paise - ? &gt;= floor, plus a unique index on the transfer id</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the Account, the Bank and the tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (a daily cap, KYC, a fraud hold, two-person approval) is a new class behind <code>WithdrawalRule</code> plus one <code>addRule</code> line, and a charge at the end of a month is the same move behind <code>MonthlyCharge</code>. Someone new who wants to know (an SMS, a fraud engine, a regulator feed) is one more listener; the account and the bank do not change. A new step in a life (pending closure, blocked by a court order) is one more status and one more checked transition. A new invariant across accounts (a fee charged with the transfer, a sweep across three accounts) is every leg inside the <i>same</i> ordered locks, all of it or none of it. State that must outlive the process is the balance behind a repository (an interface that loads and saves accounts), where the debit becomes <code>UPDATE ... WHERE id = ? AND paise - ? &gt;= floor</code>: the database doing the same compare-and-set (change the row only if it still passes the check, in one step). For all five the Account, the Bank and the tests do not change; that is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 800\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" t x=\"120.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"120.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">AccountKind</text><line x1=\"0\" y1=\"34\" x2=\"240\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">SAVINGS, CURRENT</text></g><g transform=\"translate(680 175)\"><rect width=\"240\" height=\"82\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"120.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">TxnType</text><line x1=\"0\" y1=\"34\" x2=\"240\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">OPENING, DEPOSIT, WITHDRAW,</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">TRANSFER_IN / TRANSFER_OUT,</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--muted)\">INTEREST, FEE, REVERSAL</text></g><g transform=\"translate(680 275)\"><rect width=\"240\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Statement</text><line x1=\"0\" y1=\"26\" x2=\"240\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">opening / closing: Money</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">rows: List&lt;Txn&gt;</text><line x1=\"0\" y1=\"64\" x2=\"240\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">print(): String</text></g><g transform=\"translate(680 380)\"><rect width=\"240\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SavingsAccount</text><line x1=\"0\" y1=\"26\" x2=\"240\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">minBalance: Money</text><line x1=\"0\" y1=\"48\" x2=\"240\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">wires a MinBalanceRule</text></g><g transform=\"translate(680 480)\"><rect width=\"240\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CurrentAccount</text><line x1=\"0\" y1=\"26\" x2=\"240\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">overdraftLimit: Money</text><line x1=\"0\" y1=\"48\" x2=\"240\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">wires an OverdraftRule</text></g><g transform=\"translate(960 20)\"><rect width=\"225\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"112.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"112.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">WithdrawalRule</text><line x1=\"0\" y1=\"34\" x2=\"225\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">check(account, amount, now)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">onWithdrawn(account, amount)</text></g><g transform=\"translate(960 130)\"><rect width=\"225\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"112.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"112.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">InterestRule</text><line x1=\"0\" y1=\"34\" x2=\"225\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">interest(account, days, now)</text></g><g transform=\"translate(960 210)\"><rect width=\"225\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"112.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SimpleInterest</text><line x1=\"0\" y1=\"26\" x2=\"225\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">the balance as it stands</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">x bps x days / 365</text></g><g transform=\"translate(960 306)\"><rect width=\"225\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"112.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PromoInterest</text><line x1=\"0\" y1=\"26\" x2=\"225\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">base: InterestRule (wrapped)</text><line x1=\"0\" y1=\"48\" x2=\"225\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">+ a festival bonus</text></g><g transform=\"translate(960 400)\"><rect width=\"225\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"112.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"112.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FeePolicy</text><line x1=\"0\" y1=\"34\" x2=\"225\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">feeFor(from, to, amount)</text></g><g transform=\"translate(680 648)\"><rect width=\"165\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"82.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">MinBalanceRule</text><line x1=\"0\" y1=\"26\" x2=\"165\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">no lower than a floor</text></g><g transform=\"translate(860 648)\"><rect width=\"165\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"82.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">OverdraftRule</text><line x1=\"0\" y1=\"26\" x2=\"165\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">no lower than -ceiling</text></g><g transform=\"translate(1040 648)\"><rect width=\"165\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"82.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DailyLimitRule</text><line x1=\"0\" y1=\"26\" x2=\"165\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">a cap with a memory</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">(Extensions.java)</text></g><g><path d=\"M20 782L64 782\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"786\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 782L284 782\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"786\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 782L504 782\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"786\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 782L684 782\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"786\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 782L904 782\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"786\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (italic = abstract, dashed border = interface, &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = extends or implements. Filled diamond = owns: the bank owns every account, an account owns every row of its ledger. Plain arrow = references: an account points at its status and its kind, a row at its type. Dashed green = handed in through <code>configure()</code>, <code>addRule()</code> or <code>setFeePolicy()</code>. Dotted blue = notifies. <b>Where state lives:</b> the account has the balance, the status, the ledger, its rules and the one lock, and its private <code>post()</code> is the only thing in the system that writes a row; the bank has the accounts, the transfer receipts, the interest rules, the clock and no balance of its own; a row never changes after it is written; <code>Money</code> is immutable, so a number in a ledger row cannot be edited behind the account's back. Down the left column are the things that only listen or only carry a value: the two listeners on one bus, the clock, Money, a receipt, and the one exception family every refusal is thrown as. A box marked <code>(Extensions.java)</code> is not part of the hour's code &mdash; it is a follow-up's class, drawn here to show where it would plug in. Notice what is <i>not</i> here: no Balance class, because a balance is a field the account writes with the row that explains it; no Transfer class, because a transfer is a method on the bank plus a receipt; and almost nothing in SavingsAccount and CurrentAccount, because the sentence they disagree about became a rule object instead of an overridden method.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code &mdash; the daily cap, the daily-closing-balance interest, the month-end charges, the joint account, the schedules &mdash; with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (fifty-eight claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * What a ledger row did to the balance. The type carries the direction, so the amount on a row is always\n * positive and nobody has to remember whether a minus sign meant &quot;money out&quot; or &quot;a correction&quot;.\n * REVERSAL always puts money back: it undoes a debit whose transfer could not finish.\n */\nenum TxnType { OPENING, DEPOSIT, WITHDRAW, TRANSFER_IN, TRANSFER_OUT, INTEREST, FEE, REVERSAL }\n\n/**\n * An account&#x27;s life. ACTIVE takes postings; DORMANT is an ACTIVE account nobody has touched for months, and any\n * customer posting wakes it; FROZEN refuses every posting until somebody unfreezes it; CLOSED is final and never\n * reopens, and an account can only reach it at exactly zero.\n */\nenum AccountStatus { ACTIVE, DORMANT, FROZEN, CLOSED }\n\n/** Which kind of account this is. Only a key: the behaviour lives in the withdrawal rules and the interest rule. */\nenum AccountKind { SAVINGS, CURRENT }\n\n/** Everything this bank refuses to do throws one of these, so a caller can catch the whole family in one line. */\nclass BankingException extends RuntimeException {\n    /** @param message what was refused, in words a support agent could read out. */\n    BankingException(String message) { super(message); }\n}\n\n/** A withdrawal rule said no: the minimum balance, the overdraft ceiling, a daily cap, a two-person approval. */\nclass RuleViolation extends BankingException {\n    /** @param message which rule refused, and with what numbers. */\n    RuleViolation(String message) { super(message); }\n}\n\n/** The account is FROZEN or CLOSED, so nothing may be posted to it at all. */\nclass AccountNotActive extends BankingException {\n    /** @param message the account id and the status that refused. */\n    AccountNotActive(String message) { super(message); }\n}\n\n/** No account with that id in this bank. */\nclass NoSuchAccount extends BankingException {\n    /** @param message the id that was not found. */\n    NoSuchAccount(String message) { super(message); }\n}\n\n/** Somebody tried to add INR to USD. Caught in the value type, so it can never reach a balance. */\nclass CurrencyMismatch extends BankingException {\n    /** @param message the two currencies that do not add up. */\n    CurrencyMismatch(String message) { super(message); }\n}\n\n/**\n * Exact money: a count of paise plus a currency, immutable. There is no double anywhere in this file. Arithmetic\n * across two currencies throws instead of quietly producing a number that means nothing, and every add and\n * subtract is checked for overflow rather than wrapping silently.\n */\nrecord Money(long paise, String currency) {\n    /** The one currency this demo uses. A second currency needs no new code here: this type refuses to mix them. */\n    static final String INR = &quot;INR&quot;;\n    /** Guards the value type itself: a currency is never null and never blank. */\n    Money {\n        if (currency == null || currency.isBlank()) throw new CurrencyMismatch(&quot;a Money needs a currency&quot;);\n    }\n    /** Parse &quot;1234.50&quot; into 123450 paise of INR, exactly. Used at the edge (a form, a file), never in the maths. */\n    static Money inr(String amount) {\n        return new Money(new java.math.BigDecimal(amount).movePointRight(2).longValueExact(), INR);\n    }\n    /** A raw paise count in a currency, for tests and for arithmetic that already produced paise. */\n    static Money of(long paise, String currency) { return new Money(paise, currency); }\n    /** Zero in a currency: the identity for plus, and the only balance at which an account may be closed. */\n    static Money zero(String currency) { return new Money(0, currency); }\n    /** This plus that, same currency, overflow-checked. */\n    Money plus(Money other) { return new Money(Math.addExact(paise, same(other)), currency); }\n    /** This minus that, same currency, overflow-checked. The result may be negative: that is an overdraft. */\n    Money minus(Money other) { return new Money(Math.subtractExact(paise, same(other)), currency); }\n    /** Strictly less than, same currency. */\n    boolean lessThan(Money other) { return paise &lt; same(other); }\n    /** The other amount&#x27;s paise, after proving the currencies match. The single place the guard lives. */\n    private long same(Money other) {\n        if (!currency.equals(other.currency()))\n            throw new CurrencyMismatch(currency + &quot; and &quot; + other.currency() + &quot; do not add up&quot;);\n        return other.paise();\n    }\n    /** &quot;INR 1234.50&quot;, the minus sign in front of the number. Presentation only; the maths never sees a string. */\n    public String toString() {\n        String sign = paise &lt; 0 ? &quot;-&quot; : &quot;&quot;;\n        long a = Math.abs(paise);\n        return currency + &quot; &quot; + sign + (a / 100) + &quot;.&quot; + String.format(&quot;%02d&quot;, a % 100);\n    }\n}\n\n/** A person who may own several accounts. Only the id ever reaches an account, so a rename cannot move money. */\nrecord Customer(String id, String name) {}\n\n/**\n * One immutable ledger row: what happened, how much, and what the balance was immediately after. Immutable on\n * purpose \u2014 an audit trail you can edit is not an audit trail. The running balance is stored on the row so a\n * statement never has to re-add a year of history.\n */\nrecord Txn(long seq, String accountId, TxnType type, Money amount, Money balanceAfter,\n           long atMs, String ref, String note) {\n    /** One line of a printed statement. */\n    public String toString() {\n        return seq + &quot; &quot; + type + &quot; &quot; + amount + &quot; -&gt; &quot; + balanceAfter + (note == null ? &quot;&quot; : &quot;  (&quot; + note + &quot;)&quot;);\n    }\n}\n\n/** A period of an account&#x27;s history: the balance it started the window with, the rows, and where it ended. */\nrecord Statement(String accountId, long fromMs, long toMs, Money opening, Money closing, List&lt;Txn&gt; rows) {\n    /** The statement as text, the way a customer would read it. */\n    String print() {\n        StringBuilder sb = new StringBuilder(&quot;statement &quot; + accountId + &quot;  opening &quot; + opening + &quot;\\n&quot;);\n        for (Txn t : rows) sb.append(&quot;   &quot;).append(t).append(&quot;\\n&quot;);\n        return sb.append(&quot;   closing &quot;).append(closing).append(&quot;\\n&quot;).toString();\n    }\n}\n\n/** What a caller gets back from a transfer, and what a retry of the same transfer id gets back again. */\nrecord TransferReceipt(String transferId, String fromId, String toId, Money amount, long atMs) {}\n\n/** Where time comes from. Injected everywhere, so a test can say &quot;six months later&quot; without sleeping. */\ninterface Clock {\n    /** Milliseconds since the epoch, as this bank understands the time. */\n    long nowMs();\n}\n\n/**\n * A veto on taking money out. Given the account and the amount it either stays silent or throws RuleViolation.\n * One method, because &quot;how far down may this balance go&quot; is the sentence the interviewer will change. Rules are\n * called with the account lock already held, so a rule may read the balance and is expected to be quick.\n */\ninterface WithdrawalRule {\n    /** Say nothing, or throw RuleViolation. Called inside the lock, before anything is written. */\n    void check(Account account, Money amount, long nowMs);\n    /** Memory for a stateful rule (a daily cap), called inside the same lock only after the row was written. */\n    default void onWithdrawn(Account account, Money amount, long nowMs) {}\n}\n\n/** Savings: the balance may never fall below a floor. The one sentence savings and current disagree about. */\nfinal class MinBalanceRule implements WithdrawalRule {\n    private final Money floor;\n    /** @param floor the lowest balance this account may ever hold. */\n    MinBalanceRule(Money floor) { this.floor = floor; }\n    /** Refuse any withdrawal that would leave the balance under the floor. */\n    public void check(Account account, Money amount, long nowMs) {\n        Money after = account.balance().minus(amount);\n        if (after.lessThan(floor))\n            throw new RuleViolation(&quot;minimum balance &quot; + floor + &quot;: &quot; + amount + &quot; would leave &quot; + after);\n    }\n}\n\n/** Current: the balance may sink below zero, but only as far as the overdraft ceiling. */\nfinal class OverdraftRule implements WithdrawalRule {\n    private final Money limit;\n    /** @param limit how far below zero this account may go, as a positive amount. */\n    OverdraftRule(Money limit) { this.limit = limit; }\n    /** Refuse any withdrawal that would take the balance past minus the ceiling. */\n    public void check(Account account, Money amount, long nowMs) {\n        Money after = account.balance().minus(amount);\n        Money lowest = Money.zero(after.currency()).minus(limit);\n        if (after.lessThan(lowest))\n            throw new RuleViolation(&quot;overdraft limit &quot; + limit + &quot;: &quot; + amount + &quot; would leave &quot; + after);\n    }\n}\n\n/**\n * How much interest an account earns over a period. A separate rule from the withdrawal vetoes, because it\n * changes for a different reason: the RBI moves a rate, the product team runs a promotion. The rule is handed\n * the ACCOUNT, not a number, so the BASIS is the rule&#x27;s decision too: today&#x27;s balance, or the closing balance\n * of every day in the period read off the ledger, which is what a real savings account is paid on.\n */\ninterface InterestRule {\n    /** What this account earns over the days ending at nowMs. Never negative; zero is a normal answer. */\n    Money interest(Account account, int days, long nowMs);\n}\n\n/**\n * Simple interest at an annual rate in basis points (400 = 4.00% a year), on the balance as it stands now.\n * The easy rule to write and the one to be honest about: money that arrived yesterday is paid for the whole\n * period. DailyBalanceInterest in Extensions.java is the version a bank actually uses.\n */\nfinal class SimpleInterest implements InterestRule {\n    private final int annualBasisPoints;\n    /** @param annualBasisPoints hundredths of a percent a year: 400 is 4.00%. */\n    SimpleInterest(int annualBasisPoints) { this.annualBasisPoints = annualBasisPoints; }\n    /** The balance as it stands, for the whole period. */\n    public Money interest(Account account, int days, long nowMs) { return on(account.balance(), days); }\n    /** balance x rate x days / 365, in integer paise, rounded down; an overdrawn balance earns nothing. */\n    Money on(Money balance, int days) {\n        if (balance.paise() &lt;= 0 || days &lt;= 0) return Money.zero(balance.currency());\n        long paise = balance.paise() * annualBasisPoints * days / (10_000L * 365L);\n        return Money.of(paise, balance.currency());\n    }\n}\n\n/**\n * A festival bonus on top of whatever rule this account kind already has: it wraps a rule instead of replacing\n * it, so the base rate and the promotion stay separate and the promotion can be taken off again by removing one\n * wrapper. This is the Decorator, and it exists because the rate is one sentence and the bonus is another.\n */\nfinal class PromoInterest implements InterestRule {\n    private final InterestRule base;\n    private final InterestRule bonus;\n    /** @param base the rule this promotion adds to; @param bonusBasisPoints the extra annual rate, 50 = 0.50%. */\n    PromoInterest(InterestRule base, int bonusBasisPoints) { this(base, new SimpleInterest(bonusBasisPoints)); }\n    /** Hand in the bonus as a rule of its own when it must use the same basis as the rule it tops up. */\n    PromoInterest(InterestRule base, InterestRule bonus) { this.base = base; this.bonus = bonus; }\n    /** The base rule&#x27;s interest plus the bonus rule&#x27;s, each asked the same question. */\n    public Money interest(Account account, int days, long nowMs) {\n        return base.interest(account, days, nowMs).plus(bonus.interest(account, days, nowMs));\n    }\n}\n\n/**\n * What the bank charges for moving money. Another rule that changes for its own reasons (a pricing meeting),\n * so it is handed in rather than written into the transfer. Return null or zero for &quot;no fee&quot;. It is asked\n * before any money moves, with both locks held: keep it quick, and if it throws, nothing has happened.\n */\ninterface FeePolicy {\n    /** The fee to charge the source account for this transfer, or null for none. */\n    Money feeFor(Account from, Account to, Money amount);\n}\n\n/**\n * Something outside the account that wants to know a row was written: an SMS, an audit file, a fraud engine.\n * The account never learns what any of them are, and they are all called after the lock is released.\n */\ninterface AccountListener {\n    /** A row has just been committed to this account. Never called with the account lock held. */\n    void onPosted(Account account, Txn txn);\n}\n\n/** Prints every posting. The audit trail an operations team watches; it must never be able to break a posting. */\nfinal class AuditLog implements AccountListener {\n    private final List&lt;String&gt; lines = new CopyOnWriteArrayList&lt;&gt;();\n    /** Record the row. */\n    public void onPosted(Account account, Txn txn) { lines.add(account.id() + &quot; &quot; + txn); }\n    /** How many postings this log saw; the tests use it to prove listeners ran after the lock. */\n    int size() { return lines.size(); }\n}\n\n/** Shouts when a lot of money leaves an account. The classic &quot;alert on a large withdrawal&quot; the interviewer asks for. */\nfinal class LargeWithdrawalAlert implements AccountListener {\n    private final Money threshold;\n    private final List&lt;String&gt; alerts = new CopyOnWriteArrayList&lt;&gt;();\n    /** @param threshold the amount above which one withdrawal is worth an alert. */\n    LargeWithdrawalAlert(Money threshold) { this.threshold = threshold; }\n    /** Alert on WITHDRAW and TRANSFER_OUT rows above the threshold; ignore everything else. */\n    public void onPosted(Account account, Txn txn) {\n        if ((txn.type() == TxnType.WITHDRAW || txn.type() == TxnType.TRANSFER_OUT)\n            &amp;&amp; threshold.lessThan(txn.amount()))\n            alerts.add(&quot;ALERT &quot; + account.id() + &quot; &quot; + txn.amount() + &quot; left the account&quot;);\n    }\n    /** The alerts raised so far. */\n    List&lt;String&gt; alerts() { return alerts; }\n}\n\n/**\n * The aggregate root for one account (the one object that owns and guards all of this account&#x27;s state): one\n * balance, the ledger that explains it, one status, and ONE lock over all three. Every write goes through the\n * private post(), and post() is only ever called with the lock held, so the row and the running balance can\n * never land out of step. Withdrawal rules run inside that same hold, so\n * nobody can drain the account between &quot;yes, you have enough&quot; and the row being written. Listeners are called\n * after the lock is released. deposit, withdraw and the transfer halves are final: a subclass cannot skip a rule.\n */\nabstract class Account {\n    private final String id;\n    private final String customerId;\n    private final AccountKind kind;\n    private final String currency;\n    private final Clock clock;                                  // handed in; nothing here reads the wall clock\n    private final List&lt;AccountListener&gt; listeners;              // the bank&#x27;s list, shared, copy-on-write\n    private final List&lt;WithdrawalRule&gt; rules = new CopyOnWriteArrayList&lt;&gt;();\n    private final List&lt;Txn&gt; ledger = new ArrayList&lt;&gt;();         // append only, in time order; guarded by lock\n    private final ReentrantLock lock = new ReentrantLock();     // reentrant: a rule calls balance() inside check()\n    private Money balance;                                      // guarded by lock\n    private AccountStatus status = AccountStatus.ACTIVE;        // guarded by lock\n    private long seq = 0;                                       // guarded by lock\n    private long lastActivityMs;                                // guarded by lock\n\n    /**\n     * Open the account and write its OPENING row. The row is written but deliberately not published: the object\n     * is not fully built yet, so no listener may see it. A negative opening balance is refused.\n     */\n    Account(String id, String customerId, AccountKind kind, Money opening, Clock clock, List&lt;AccountListener&gt; listeners

3. delete:      \\&quot;&quot; + ed.text() + &quot;\\&quot;&quot;);\n        ed.undo();\n        System.out.println(&quot;   undo:        \\&quot;&quot; + ed.text() + &quot;\\&quot;  the characters are the ones that left&quot;);\n\n        // 4. a new edit clears the redo branch on purpose\n        ed.undo(); ed.undo();\n        System.out.println(&quot;4. two undos:   \\&quot;&quot; + ed.text() + &quot;\\&quot;  canRedo=&quot; + ed.canRedo());\n        ed.type(&quot;!&quot;);\n        System.out.println(&quot;   then type:   \\&quot;&quot; + ed.text() + &quot;\\&quot;  canRedo=&quot; + ed.canRedo() + &quot;  (the branch is gone)&quot;);\n\n        // 5. the cap evicts the oldest step, so &quot;unsaved&quot; cannot be derived from an empty stack\n        for (int i = 0; i &lt; 6; i++) { ed.type(&quot;x&quot;); now[0] += 5000; }        // a pause each time: six separate steps\n        System.out.println(&quot;5. cap of 4:    six more steps into a four-step history -&gt; undo steps=&quot; + ed.undoDepth()\n            + &quot;  evicted=&quot; + ed.historyEvicted());\n        while (ed.undo()) { /* wind it all the way back */ }\n        System.out.println(&quot;   undo all:    \\&quot;&quot; + ed.text() + &quot;\\&quot;  not empty: the oldest steps were thrown away&quot;);\n\n        // 6. cut, paste and replace-all: one step each\n        Editor doc = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        doc.type(&quot;the cat sat on the cat mat with a cat&quot;);\n        doc.select(4, 7);\n        doc.cut();\n        System.out.println(&quot;6. cut \\&quot;&quot; + doc.clipboard() + &quot;\\&quot;: \\&quot;&quot; + doc.text() + &quot;\\&quot;&quot;);\n        doc.moveTo(doc.text().length());\n        doc.paste();\n        System.out.println(&quot;   paste:       \\&quot;&quot; + doc.text() + &quot;\\&quot;&quot;);\n        int hits = doc.replaceAll(&quot;cat&quot;, &quot;dog&quot;);\n        System.out.println(&quot;   replaceAll:  \\&quot;&quot; + doc.text() + &quot;\\&quot;  hits=&quot; + hits + &quot;  undo steps=&quot; + doc.undoDepth());\n        doc.undo();\n        System.out.println(&quot;   one ctrl+Z:  \\&quot;&quot; + doc.text() + &quot;\\&quot;  &quot; + hits + &quot; replacements, one step&quot;);\n        doc.redo();\n        System.out.println(&quot;   redo:        \\&quot;&quot; + doc.text() + &quot;\\&quot;  redo is execute() again, not a re-search&quot;);\n\n        // 7. autosave read the published snapshot; it never took the lock\n        disk.save();\n        System.out.println(&quot;7. autosave:    version &quot; + disk.savedVersion() + &quot; on disk, dirty=&quot; + disk.isDirty()\n            + &quot;, the view saw &quot; + view.lines().size() + &quot; events&quot;);\n\n        // 8. the race, the cheap way: four threads doing length-then-insert on a raw Document\n        Document raw = new Document(new StringBuilderBuffer());\n        runRace(4, 500, i -&gt; { try { raw.insert(raw.length(), &quot;x&quot;); } catch (RuntimeException ignored) { } });\n        System.out.println(&quot;8. no lock:     wanted 2000 characters, got &quot; + raw.length()\n            + (raw.length() == 2000 ? &quot;  (lucky this run; run it again)&quot; : &quot;  (read-then-write tears)&quot;));\n\n        // 9. the same load through the Editor: one lock over mutate + record + version + snapshot\n        Editor safe = new Editor(new GapBuffer(4096), 4096, new NoMergePolicy());\n        runRace(8, 250, i -&gt; safe.append(&quot;x&quot;));\n        System.out.println(&quot;9. one lock:    &quot; + safe.text().length() + &quot; characters, &quot; + safe.undoDepth()\n            + &quot; undo steps, version &quot; + safe.version());\n        while (safe.undo()) { /* wind the whole document back */ }\n        System.out.println(&quot;   2000 undos:  length=&quot; + safe.text().length() + &quot;  (right length AND right history)&quot;);\n    }\n\n    /** threads x each calls body, all released at the same instant by one latch. */\n    static void runRace(int threads, int each, java.util.function.IntConsumer body) throws Exception {\n        ExecutorService pool = Executors.newFixedThreadPool(threads);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; fs = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; threads; t++) {\n            fs.add(pool.submit(() -&gt; {\n                go.await();\n                for (int i = 0; i &lt; each; i++) body.accept(i);\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : fs) f.get();\n        pool.shutdown();\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: a piece table -- the same TextBuffer, so exactly ONE class changes when the file gets big\n/**\n * A third buffer for documents a gap buffer cannot carry. The original text is never touched; everything typed is\n * appended to one growing add-buffer; the document is a list of pieces saying &quot;take 12 characters from the original\n * at 40, then 3 from the add-buffer at 0&quot;. An insert or a delete rewrites two or three list entries and copies no\n * characters at all, so a 10 MB file edits as fast as an empty one.\n *\n * Reads here are deliberately naive (build the string, then slice it) to keep the block short. A production one\n * walks the piece list, and the Editor&#x27;s snapshot becomes a lazy view over it instead of a copy per keystroke --\n * which is the second rung of the ladder on page 02, move 8. A rope is the other answer: O(log n) for reads AND\n * writes and no add-buffer growth, at the price of a tree to rebalance. Nothing outside this class changes.\n */\nfinal class PieceTableBuffer implements TextBuffer {\n    private enum Src { ORIGINAL, ADDED }\n    private record Piece(Src src, int start, int len) {}\n    private final String original;\n    private final StringBuilder added = new StringBuilder();\n    private final List&lt;Piece&gt; pieces = new ArrayList&lt;&gt;();\n    private int length;\n\n    /** Open a document over text that already exists. That string is never copied and never mutated again. */\n    PieceTableBuffer(String original) {\n        this.original = original == null ? &quot;&quot; : original;\n        if (!this.original.isEmpty()) pieces.add(new Piece(Src.ORIGINAL, 0, this.original.length()));\n        length = this.original.length();\n    }\n\n    public int length() { return length; }\n\n    /** Split the piece list so an edit boundary falls between two pieces; returns the index of the piece starting at at. */\n    private int splitAt(int at) {\n        int off = 0;\n        for (int i = 0; i &lt; pieces.size(); i++) {\n            Piece p = pieces.get(i);\n            if (at == off) return i;\n            if (at &lt; off + p.len()) {\n                int left = at - off;\n                pieces.set(i, new Piece(p.src(), p.start(), left));\n                pieces.add(i + 1, new Piece(p.src(), p.start() + left, p.len() - left));\n                return i + 1;\n            }\n            off += p.len();\n        }\n        return pieces.size();\n    }\n\n    public void insert(int at, String s) {\n        if (at &lt; 0 || at &gt; length) throw new IndexOutOfBoundsException(&quot;insert at &quot; + at + &quot; of &quot; + length);\n        if (s.isEmpty()) return;\n        int i = splitAt(at);\n        pieces.add(i, new Piece(Src.ADDED, added.length(), s.length()));\n        added.append(s);                                   // append-only: nothing already written ever moves\n        length += s.length();\n    }\n\n    public String delete(int at, int len) {\n        if (at &lt; 0 || len &lt; 0 || at + len &gt; length) throw new IndexOutOfBoundsException(&quot;delete &quot; + len + &quot; at &quot; + at + &quot; of &quot; + length);\n        String gone = substring(at, at + len);\n        int i = splitAt(at), j = splitAt(at + len);\n        pieces.subList(i, j).clear();                      // a delete is dropping list entries, not moving characters\n        length -= len;\n        return gone;\n    }\n\n    public String text() {\n        StringBuilder sb = new StringBuilder(length);\n        for (Piece p : pieces) {\n            CharSequence from = p.src() == Src.ORIGINAL ? original : added;\n            sb.append(from, p.start(), p.start() + p.len());\n        }\n        return sb.toString();\n    }\n    public String substring(int from, int to) { return text().substring(from, to); }\n    public int indexOf(String needle, int from) { return text().indexOf(needle, from); }\n    /** How many pieces the document is currently made of: the real memory cost of this buffer. */\n    int pieceCount() { return pieces.size(); }\n}\n\n// ---- ext: lines -- &quot;go to line 4000&quot; and &quot;draw lines 200 to 250&quot; without scanning the document\n/**\n * Where every line starts, kept up to date by the edits themselves. It wraps ANY TextBuffer instead of changing one,\n * so the Editor, the commands and the lock do not know it exists -- the same Decorator seam as PasteIsItsOwnStep,\n * this time around the storage. Because undo and redo also go through insert() and delete(), the index follows them\n * for free; there is no second code path to keep in step.\n *\n * starts[i] is the offset of the first character of line i, and starts[0] is always 0, so an empty document has one\n * line. A lookup is a binary search: O(log L). An edit shifts every start below it by one System.arraycopy: on a\n * 40,000-line file that is a 160 KB memmove, about 10 us, which is why this is the right answer up to roughly a\n * million lines. Past that the line counts belong inside the buffer&#x27;s own pieces -- a piece table or a rope carrying\n * a newline count per node -- and the shift becomes O(log n).\n */\nfinal class LineIndexedBuffer implements TextBuffer {\n    private final TextBuffer base;\n    private int[] starts = new int[16];\n    private int n = 1;                                     // starts[0] = 0: an empty document is one empty line\n\n    /** Wrap any storage. Nothing above it changes: it is still a TextBuffer. */\n    LineIndexedBuffer(TextBuffer base) {\n        this.base = Objects.requireNonNull(base);\n        String t = base.text();                            // one scan, once, when the file is opened\n        for (int i = 0; i &lt; t.length(); i++) if (t.charAt(i) == &#x27;\\n&#x27;) add(i + 1);\n    }\n    private void add(int off) { grow(n + 1); starts[n++] = off; }\n    private void grow(int need) { if (need &gt; starts.length) starts = Arrays.copyOf(starts, Math.max(need, starts.length * 2)); }\n    /** The index of the first line that starts strictly after off. */\n    private int upper(int off) {\n        int lo = 0, hi = n;\n        while (lo &lt; hi) { int mid = (lo + hi) &gt;&gt;&gt; 1; if (starts[mid] &lt;= off) lo = mid + 1; else hi = mid; }\n        return lo;\n    }\n\n    public void insert(int at, String s) {\n        base.insert(at, s);\n        int add = 0;\n        for (int i = 0; i &lt; s.length(); i++) if (s.charAt(i) == &#x27;\\n&#x27;) add++;\n        int i = upper(at);\n        grow(n + add);\n        System.arraycopy(starts, i, starts, i + add, n - i);            // one memmove: everything below the edit\n        for (int k = i + add; k &lt; n + add; k++) starts[k] += s.length();\n        int w = i;\n        for (int c = 0; c &lt; s.length(); c++) if (s.charAt(c) == &#x27;\\n&#x27;) starts[w++] = at + c + 1;\n        n += add;\n    }\n\n    public String delete(int at, int len) {\n        String gone = base.delete(at, len);\n        int i = upper(at), j = upper(at + len);                          // lines that began inside the deleted range\n        System.arraycopy(starts, j, starts, i, n - j);\n        n -= (j - i);\n        for (int k = i; k &lt; n; k++) starts[k] -= len;\n        return gone;\n    }\n\n    /** How many lines the document has. An empty document has one. */\n    int lineCount() { return n; }\n    /** The offset the given line starts at. Line numbers are zero-based here; a UI adds one. */\n    int startOfLine(int line) { return starts[Math.max(0, Math.min(line, n - 1))]; }\n    /** One past the last character of the line, not counting its newline. */\n    int endOfLine(int line) { return line + 1 &lt; n ? starts[line + 1] - 1 : length(); }\n    /** Which line an offset falls on: one binary search, no scan. */\n    int lineOf(int offset) { return Math.max(0, upper(offset) - 1); }\n    /** Line and column of an offset, which is what a status bar shows. */\n    int columnOf(int offset) { return offset - startOfLine(lineOf(offset)); }\n\n    public int length() { return base.length(); }\n    public String text() { return base.text(); }\n    public String substring(int from, int to) { return base.substring(from, to); }\n    public int indexOf(String needle, int from) { return base.indexOf(needle, from); }\n}\n\n// ---- ext: rich text -- &quot;bold this selection&quot; is an edit too, and styles are a Flyweight\n/**\n * One character style. Interned, so a million bold characters share ONE Style object and the table holds references\n * rather than copies: Flyweight, and it arrives because rich text demanded it, not because it was on a list.\n */\nrecord Style(boolean bold, boolean italic, String colour) {\n    private static final Map&lt;String, Style&gt; POOL = new ConcurrentHashMap&lt;&gt;();\n    /** The shared instance for this combination; the same arguments always give back the same object. */\n    static Style of(boolean bold, boolean italic, String colour) {\n        return POOL.computeIfAbsent(bold + &quot;/&quot; + italic + &quot;/&quot; + colour, k -&gt; new Style(bold, italic, colour));\n    }\n    /** How many distinct styles exist in the whole process. */\n    static int pooled() { return POOL.size(); }\n}\n\n/** A stretch of characters carrying one style. The text itself stays plain; styles ride alongside it. */\nrecord StyleRun(int from, int to, Style style) {}\n\n/** The styles of one document. Kept beside the buffer, so a plain-text editor pays nothing for it. */\nfinal class StyleTable {\n    private List&lt;StyleRun&gt; runs = new ArrayList&lt;&gt;();\n    /** An immutable view of the runs, newest last. */\n    List&lt;StyleRun&gt; runs() { return List.copyOf(runs); }\n    /** Replace the whole run list. Used by undo, which restores the list it saved. */\n    void set(List&lt;StyleRun&gt; newRuns) { runs = new ArrayList&lt;&gt;(newRuns); }\n    /** Add one run. */\n    void add(StyleRun r) { runs.add(r); }\n}\n\n/**\n * Bold, italic or a colour over a range, as an ordinary EditCommand: it goes through apply(), lands on the undo\n * stack, and one ctrl+Z takes the bold off again. Its memento is the run list as it was -- small, because runs are\n * ranges, not characters. It reports MACRO rather than TYPING so the merge wrapper will never fold it into a word.\n */\nfinal class StyleCommand implements EditCommand {\n    private final StyleTable table;\n    private final StyleRun run;\n    private List&lt;StyleRun&gt; before;\n    /** Apply style to [from, to) of this table. */\n    StyleCommand(StyleTable table, int from, int to, Style style) { this.table = table; this.run = new StyleRun(from, to, style); }\n    public void execute(Document doc) { before = table.runs(); table.add(run); }\n    public void undo(Document doc) { table.set(before); }\n    public String label() { return &quot;style&quot;; }\n    public EditKind kind() { return EditKind.MACRO; }\n}\n\n// ---- ext: a macro -- an arbitrary run of edits as one ctrl+Z\n/**\n * Begin and end, around anything you like: the edits are buffered instead of applied, and commit() hands the Editor\n * one CompositeCommand. ReplaceAllCommand is this same shape with the children found by a search instead of by a\n * caller, which is why adding macros needed no new machinery in the Editor, the history or the lock.\n */\nfinal class Macro {\n    private final Editor editor;\n    private final String label;\n    private final List&lt;EditCommand&gt; parts = new ArrayList&lt;&gt;();\n    /** Start recording. Nothing touches the document until commit(). */\n    Macro(Editor editor, String label) { this.editor = editor; this.label = label; }\n    /** Record an insert. */\n    Macro insert(int at, String s) { parts.add(new InsertCommand(at, s, EditKind.MACRO, 0L)); return this; }\n    /** Record a delete. */\n    Macro delete(int at, int len) { parts.add(new DeleteCommand(at, len, EditKind.MACRO)); return this; }\n    /** Apply the whole run as ONE undo step. If any child throws, the ones already applied are rolled back. */\n    long commit() { return editor.apply(new CompositeCommand(label, EditKind.MACRO, parts)); }\n}\n\n// ---- ext: undo puts the caret back -- one decorator, and no command had to learn about it\n/**\n * Undo that restores the selection, not just the text. Wraps any command: it notes where the caret and the highlight\n * were before execute, and puts them back after undo. One class, one line at the call site, and InsertCommand,\n * DeleteCommand and every composite are untouched -- the same Decorator seam PasteIsItsOwnStep uses.\n */\nfinal class RestoresSelection implements EditCommand {\n    private final EditCommand base;\n    private Selection before;\n    /** Wrap a command so its undo also restores the pre-edit selection. */\n    RestoresSelection(EditCommand base) { this.base = Objects.requireNonNull(base); }\n    public void execute(Document doc) { before = doc.selection(); base.execute(doc); }\n    public void undo(Document doc) { base.undo(doc); if (before != null) doc.select(before.anchor(), before.caret()); }\n    public String label() { return base.label(); }\n    public EditKind kind() { return base.kind(); }\n}\n\n// ---- ext: persistence -- a journal of commands, and replay rebuilds text AND history\n/** Where the journal goes. A file, a socket, a table: the editor never learns which. */\ninterface Journal {\n    /** Append one line. Called after the unlock, so a slow disk never blocks a typist. */\n    void append(String line);\n    /** Every line ever appended, oldest first. */\n    List&lt;String&gt; readAll();\n}\n\n/** A journal in memory, which is all a test needs. A real one is the same class over a file channel. */\nfinal class MemoryJournal implements Journal {\n    private final List&lt;String&gt; lines = new ArrayList&lt;&gt;();\n    public synchronized void append(String line) { lines.add(line); }\n    public synchronized List&lt;String&gt; readAll() { return List.copyOf(lines); }\n}\n\n/**\n * The only place that knows a command&#x27;s wire format. Commands were already data -- that is why persistence is a\n * codec and a replay loop rather than a redesign. An insert writes its offset and its text; a delete writes its\n * offset and its length (the characters come back from the document on replay); a composite writes its child count.\n */\nfinal class CommandCodec {\n    private CommandCodec() { }\n    /** One command as one or more lines, parents before children. */\n    static List&lt;String&gt; encode(EditCommand c) {\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        if (c instanceof InsertCommand i) out.add(&quot;I\\t&quot; + i.at() + &quot;\\t&quot; + i.kind() + &quot;\\t&quot; + esc(i.text()));\n        else if (c instanceof DeleteCommand d) out.add(&quot;D\\t&quot; + d.at() + &quot;\\t&quot; + d.len() + &quot;\\t&quot; + d.kind());\n        else if (c instanceof CompositeCommand k) {\n            List&lt;EditCommand&gt; kids = k.children();\n            out.add(&quot;C\\t&quot; + esc(k.label()) + &quot;\\t&quot; + kids.size());\n            for (EditCommand kid : kids) out.addAll(encode(kid));\n        } else throw new IllegalArgumentException(&quot;no codec for &quot; + c.getClass().getSimpleName());\n        return out;\n    }\n    /** Read one command (and its children) starting at cursor[0], advancing the cursor past what it consumed. */\n    static EditCommand decode(List&lt;String&gt; lines, int[] cursor) {\n        String[] f = lines.get(cursor[0]++).split(&quot;\\t&quot;, -1);\n        switch (f[0]) {\n            case &quot;I&quot;: return new InsertCommand(Integer.parseInt(f[1]), unesc(f[3]), EditKind.valueOf(f[2]), 0L);\n            case &quot;D&quot;: return new DeleteCommand(Integer.parseInt(f[1]), Integer.parseInt(f[2]), EditKind.valueOf(f[3]));\n            case &quot;C&quot;: {\n                int n = Integer.parseInt(f[2]);\n                List&lt;EditCommand&gt; kids = new ArrayList&lt;&gt;();\n                for (int i = 0; i &lt; n; i++) kids.add(decode(lines, cursor));\n                return new CompositeCommand(unesc(f[1]), EditKind.MACRO, kids);\n            }\n            default: throw new IllegalArgumentException(&quot;bad journal line: &quot; + String.join(&quot;\\\\t&quot;, f));\n        }\n    }\n    private static String esc(String s) { return s.replace(&quot;\\\\&quot;, &quot;\\\\\\\\&quot;).replace(&quot;\\t&quot;, &quot;\\\\t&quot;).replace(&quot;\\n&quot;, &quot;\\\\n&quot;); }\n    private static String unesc(String s) { return s.replace(&quot;\\\\n&quot;, &quot;\\n&quot;).replace(&quot;\\\\t&quot;, &quot;\\t&quot;).replace(&quot;\\\\\\\\&quot;, &quot;\\\\&quot;); }\n}\n\n/**\n * Writes every landed change to the journal. It is an ordinary listener, so it runs AFTER the unlock: a slow disk\n * never blocks the typist, and the price of that is an honest one -- if the process dies in the microsecond between\n * the unlock and the append, the last edit is lost. Moving the append inside the lock buys durability and costs\n * milliseconds per keystroke, which is why real editors do exactly this and autosave on top.\n */\nfinal class JournalListener implements EditListener {\n    private final Journal journal;\n    /** Write to this journal. */\n    JournalListener(Journal journal) { this.journal = journal; }\n    public void onEdit(EditEvent e) {\n        switch (e.kind()) {\n            case &quot;edit&quot; -&gt; CommandCodec.encode(e.command()).forEach(journal::append);\n            case &quot;undo&quot; -&gt; journal.append(&quot;U&quot;);\n            case &quot;redo&quot; -&gt; journal.append(&quot;R&quot;);\n            default -&gt; { }\n        }\n    }\n    /** Rebuild an editor from a journal: the text comes back, and so does the undo stack, because the log IS the history. */\n    static Editor replay(Journal journal) {\n        Editor ed = new Editor(new GapBuffer(), 4096, new NoMergePolicy());\n        List&lt;String&gt; lines = journal.readAll();\n        int[] cursor = { 0 };\n        while (cursor[0] &lt; lines.size()) {\n            String head = lines.get(cursor[0]);\n            if (head.equals(&quot;U&quot;)) { cursor[0]++; ed.undo(); }\n            else if (head.equals(&quot;R&quot;)) { cursor[0]++; ed.redo(); }\n            else ed.apply(CommandCodec.decode(lines, cursor));\n        }\n        return ed;\n    }\n}\n\n// ---- ext: two people at once -- why a stack cannot do it, and the one function OT adds\n/**\n * A stack can undo MY last step. It cannot undo my last step while keeping yours, because your edit moved my\n * offsets: my &quot;delete 3 characters at 40&quot; now means different characters. Two families fix it, and neither is a\n * lock. Operational transformation keeps a per-site log and rebases every incoming operation against the ones it\n * did not see -- for two inserts that whole idea is the function below. A CRDT gives every character a unique,\n * totally ordered id instead of an offset, so there is nothing to rebase, at the cost of carrying those ids\n * forever. In both, undo stops meaning &quot;pop&quot; and starts meaning &quot;emit the transformed inverse of my own operation&quot;.\n */\nfinal class Ot {\n    private Ot() { }\n    /** My insert at mine, rebased over a concurrent insert of theirLen characters at theirs. siteWins breaks the tie. */\n    static int insertOverInsert(int mine, int theirs, int theirLen, boolean siteWins) {\n        if (mine &lt; theirs || (mine == theirs &amp;&amp; siteWins)) return mine;\n        return mine + theirLen;\n    }\n    /** My insert at mine, rebased over a concurrent delete of theirLen characters at theirs. */\n    static int insertOverDelete(int mine, int theirs, int theirLen) {\n        if (mine &lt;= theirs) return mine;\n        return mine &gt;= theirs + theirLen ? mine - theirLen : theirs;     // inside the deleted range: collapse to its start\n    }\n}\n\n// ---- ext: incremental syntax highlighting -- retokenise the lines the edit touched, not the file\n/**\n * The version number in the event is what makes this cheap. On every edit it compares the new text with the text it\n * last saw, finds the first and last line that differ, and re-tokenises only those. One keystroke in a thousand-line\n * file re-tokenises one line; a paste of forty lines re-tokenises forty. It never takes the editor&#x27;s lock, because\n * the event already carries an immutable snapshot.\n */\nfinal class Highlighter implements EditListener {\n    private static final Set&lt;String&gt; KEYWORDS = Set.of(&quot;class&quot;, &quot;void&quot;, &quot;int&quot;, &quot;return&quot;, &quot;if&quot;, &quot;else&quot;, &quot;new&quot;, &quot;final&quot;);\n    private List&lt;String&gt; lines = List.of(&quot;&quot;);\n    private int retokenised, keywordsFound;\n\n    public void onEdit(EditEvent e) {\n        List&lt;String&gt; now = List.of(e.text().split(&quot;\\n&quot;, -1));\n        int lo = 0;\n        while (lo &lt; lines.size() &amp;&amp; lo &lt; now.size() &amp;&amp; lines.get(lo).equals(now.get(lo))) lo++;\n        int hi = 0;\n        while (hi &lt; lines.size() - lo &amp;&amp; hi &lt; now.size() - lo\n               &amp;&amp; lines.get(lines.size() - 1 - hi).equals(now.get(now.size() - 1 - hi))) hi++;\n        for (int i = lo; i &lt; now.size() - hi; i++) { tokenise(now.get(i)); retokenised++; }\n        lines = now;\n    }\n    private void tokenise(String line) { for (String w : line.split(&quot;\\\\W+&quot;)) if (KEYWORDS.contains(w)) keywordsFound++; }\n    /** How many lines have been re-tokenised in total; compare it with edits x lines to see what incremental bought. */\n    int retokenised() { return retokenised; }\n    /** How many lines the document currently has. */\n    int lineCount() { return lines.size(); }\n}\n\n// ---- ext: plugins -- a listener somebody else wrote, and what happens when it throws\n/** A plugin is a listener with a name, installed by a user rather than by the editor. */\ninterface Plugin {\n    /** How the plugin appears in the disabled list. */\n    String name();\n    /** Called with every edit, after the unlock. It is allowed to throw; that is the point of the host. */\n    void onEdit(EditEvent e);\n}\n\n/**\n * One listener that fans out to every installed plugin. The Editor already swallows an exception from a listener, so\n * typing is safe; the host adds the part a product needs -- a plugin that throws is counted, and after three strikes\n * it is unsubscribed and named, instead of being caught silently forever.\n */\nfinal class PluginHost implements EditListener {\n    private final Map&lt;String, Plugin&gt; live = new LinkedHashMap&lt;&gt;();\n    private final Map&lt;String, Integer&gt; strikes = new HashMap&lt;&gt;();\n    private final List&lt;String&gt; disabled = new ArrayList&lt;&gt;();\n    /** Install a plugin. It starts receiving the next edit. */\n    void install(Plugin p) { live.put(p.name(), p); }\n    public void onEdit(EditEvent e) {\n        for (Plugin p : new ArrayList&lt;&gt;(live.values())) {\n            try { p.onEdit(e); }\n            catch (RuntimeException ex) {\n                if (strikes.merge(p.name(), 1, Integer::sum) &gt;= 3) { live.remove(p.name()); disabled.add(p.name()); }\n            }\n        }\n    }\n    /** The plugins still receiving events. */\n    Set&lt;String&gt; installed() { return live.keySet(); }\n    /** The plugins that were switched off for throwing three times. */\n    List&lt;String&gt; disabled() { return List.copyOf(disabled); }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) {\n        // a piece table behind the same interface: the Editor does not change a line\n        Editor big = new Editor(new PieceTableBuffer(&quot;the quick brown fox jumps over the lazy dog&quot;), 200, new NoMergePolicy());\n        big.insertAt(4, &quot;very &quot;);\n        big.deleteRange(0, 4);\n        System.out.println(&quot;piece table:  \\&quot;&quot; + big.text() + &quot;\\&quot;&quot;);\n        big.undo(); big.undo();\n        System.out.println(&quot;  two undos:  \\&quot;&quot; + big.text() + &quot;\\&quot;  (same commands, different storage)&quot;);\n\n        // lines: go to line 200 of a 500-line file, and draw three lines, without scanning the document\n        LineIndexedBuffer lines = new LineIndexedBuffer(new GapBuffer(40000));\n        Editor src = new Editor(lines, 200, new NoMergePolicy());\n        StringBuilder body = new StringBuilder();\n        for (int i = 0; i &lt; 500; i++) body.append(&quot;line &quot;).append(i).append(&quot;\\n&quot;);\n        src.type(body.toString());\n        src.insertAt(lines.startOfLine(200), &quot;// inserted at the top of line 200\\n&quot;);   // every start below it shifts\n        System.out.println(&quot;lines:        &quot; + lines.lineCount() + &quot; lines; line 201 starts at &quot; + lines.startOfLine(201)\n            + &quot;, offset 1000 is line &quot; + lines.lineOf(1000) + &quot; column &quot; + lines.columnOf(1000));\n        System.out.println(&quot;  viewport:   \\&quot;&quot; + src.textRange(lines.startOfLine(200), lines.endOfLine(202)).replace(&quot;\\n&quot;, &quot; | &quot;) + &quot;\\&quot;&quot;);\n        src.undo();\n        System.out.println(&quot;  after undo: &quot; + lines.lineCount() + &quot; lines again (undo goes through insert/delete too)&quot;);\n\n        // rich text: bold is a command, and the styles are shared objects\n        Editor rich = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        StyleTable styles = new StyleTable();\n        rich.type(&quot;bold me please&quot;);\n        rich.apply(new StyleCommand(styles, 0, 4, Style.of(true, false, &quot;#000&quot;)));\n        rich.apply(new StyleCommand(styles, 5, 7, Style.of(true, false, &quot;#000&quot;)));   // the SAME Style instance\n        System.out.println(&quot;rich text:    runs=&quot; + styles.runs().size() + &quot;  distinct Style objects pooled=&quot; + Style.pooled()\n            + &quot;  same instance reused=&quot; + (Style.of(true, false, &quot;#000&quot;) == Style.of(true, false, &quot;#000&quot;)));\n        rich.undo();\n        System.out.println(&quot;  one ctrl+Z: runs=&quot; + styles.runs().size() + &quot;  (a style change undoes like any edit)&quot;);\n\n        // a macro: three edits, one undo step\n        Editor mac = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        mac.type(&quot;one two three&quot;);\n        int before = mac.undoDepth();\n        new Macro(mac, &quot;tidy up&quot;).delete(0, 4).insert(0, &quot;1 &quot;).insert(2, &quot;[&quot;).commit();\n        System.out.println(&quot;macro:        \\&quot;&quot; + mac.text() + &quot;\\&quot;  steps added=&quot; + (mac.undoDepth() - before));\n        mac.undo();\n        System.out.println(&quot;  one ctrl+Z: \\&quot;&quot; + mac.text() + &quot;\\&quot;  three edits came out together&quot;);\n\n        // undo that puts the caret back\n        Editor car = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        car.type(&quot;abcdef&quot;);\n        car.moveTo(2);\n        Selection was = car.selection();\n        car.apply(new RestoresSelection(new InsertCommand(2, &quot;XYZ&quot;, EditKind.PASTE, 0L)));\n        System.out.println(&quot;caret:        after paste caret=&quot; + car.selection().caret() + &quot;, was &quot; + was.caret());\n        car.undo();\n        System.out.println(&quot;  after undo: caret=&quot; + car.selection().caret() + &quot;  (the decorator put it back)&quot;);\n\n        // persistence: a journal of commands, replayed into a fresh editor\n        MemoryJournal log = new MemoryJournal();\n        Editor live = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        live.addListener(new JournalListener(log));\n        live.type(&quot;the cat sat&quot;);\n        live.replaceAll(&quot;cat&quot;, &quot;dog&quot;);\n        live.undo();\n        live.redo();\n        Editor rebuilt = JournalListener.replay(log);\n        System.out.println(&quot;journal:      &quot; + log.readAll().size() + &quot; lines -&gt; replayed \\&quot;&quot; + rebuilt.text()\n            + &quot;\\&quot;  matches=&quot; + rebuilt.text().equals(live.text()) + &quot;  undo steps=&quot; + rebuilt.undoDepth());\n\n        // two people at once: the transform, not a lock\n        System.out.println(&quot;OT:           my insert at 40, yours of 5 chars at 10 -&gt; mine becomes &quot;\n            + Ot.insertOverInsert(40, 10, 5, false) + &quot;; your delete of 5 at 10 -&gt; mine becomes &quot;\n            + Ot.insertOverDelete(40, 10, 5));\n\n        // incremental highlighting: one keystroke does not re-read the file\n        Editor code = new Editor(new GapBuffer(), 4096, new NoMergePolicy());\n        Highlighter hl = new Highlighter();\n        code.addListener(hl);\n        StringBuilder file = new StringBuilder();\n        for (int i = 0; i &lt; 200; i++) file.append(&quot;int x&quot;).append(i).append(&quot; = &quot;).append(i).append(&quot;;\\n&quot;);\n        code.type(file.toString());\n        int afterLoad = hl.retokenised();\n        for (int i = 0; i &lt; 10; i++) code.type(&quot;z&quot;);\n        System.out.println(&quot;highlighter:  &quot; + hl.lineCount() + &quot; lines; loading cost &quot; + afterLoad\n            + &quot; line tokenisations, then ten keystrokes cost &quot; + (hl.retokenised() - afterLoad)\n            + &quot; lines, not &quot; + (10 * hl.lineCount()));\n\n        // plugins: three strikes and it is out\n        Editor host = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        PluginHost plugins = new PluginHost();\n        int[] seen = { 0 };\n        plugins.install(new Plugin() {\n            public String name() { return &quot;word-count&quot;; }\n            public void onEdit(EditEvent e) { seen[0]++; }\n        });\n        plugins.install(new Plugin() {\n            public String name() { return &quot;broken-linter&quot;; }\n            public void onEdit(EditEvent e) { throw new IllegalStateException(&quot;npe in a plugin&quot;); }\n        });\n        host.addListener(plugins);\n        for (int i = 0; i &lt; 5; i++) host.type(&quot;a&quot;);\n        System.out.println(&quot;plugins:      text=\\&quot;&quot; + host.text() + &quot;\\&quot; (typing never noticed), word-count saw &quot; + seen[0]\n            + &quot; edits, disabled=&quot; + plugins.disabled());\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// targeted failure tests: each one proves a claim the design makes on page 02, move 9.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n\n    /** The incremental line index against the only source of truth there is: a fresh scan of the text. */\n    static boolean sameLines(LineIndexedBuffer idx, String text) {\n        List&lt;Integer&gt; want = new ArrayList&lt;&gt;(List.of(0));\n        for (int i = 0; i &lt; text.length(); i++) if (text.charAt(i) == &#x27;\\n&#x27;) want.add(i + 1);\n        if (idx.lineCount() != want.size()) return false;\n        for (int i = 0; i &lt; want.size(); i++) if (idx.startOfLine(i) != want.get(i)) return false;\n        return true;\n    }\n\n    public static void main(String[] args) throws Exception {\n\n        // 1. eight threads type two thousand characters at the same instant: the buffer AND the history must survive.\n        //    Two thousand characters with the wrong history is still a bug, so the test winds the whole document back.\n        Editor race = new Editor(new GapBuffer(4096), 4096, new NoMergePolicy());\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; fs = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; 8; t++) {\n            fs.add(pool.submit(() -&gt; { go.await(); for (int i = 0; i &lt; 250; i++) race.append(&quot;x&quot;); return null; }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : fs) f.get();\n        pool.shutdown();\n        check(race.text().length() == 2000, &quot;2000 concurrent appends landed: length is exactly 2000, nothing torn&quot;);\n        check(race.undoDepth() == 2000, &quot;the history agrees with the buffer: 2000 undo steps, not 1997&quot;);\n        check(race.version() == 2000, &quot;the version counter agrees too: 2000&quot;);\n        int undone = 0;\n        while (race.undo()) undone++;\n        check(undone == 2000 &amp;&amp; race.text().isEmpty(), &quot;2000 undos wind it back to an empty document&quot;);\n\n        // 2. the everyday sequence: insert, delete in the middle, undo, redo -- the text must be restored exactly\n        Editor ed = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        ed.type(&quot;hello brave new world&quot;);\n        String full = ed.text();\n        ed.deleteRange(6, 6);                                   // take out &quot;brave &quot;\n        check(ed.text().equals(&quot;hello new world&quot;), &quot;delete removed exactly the range asked for&quot;);\n        ed.undo();\n        check(ed.text().equals(full), &quot;undo put back the exact characters the delete removed, in the right place&quot;);\n        ed.redo();\n        check(ed.text().equals(&quot;hello new world&quot;), &quot;redo is execute() again: the same delete, the same result&quot;);\n        ed.undo();\n        check(ed.text().equals(full) &amp;&amp; ed.canRedo(), &quot;undo again, and redo is still available&quot;);\n\n        // 3. a new edit clears the redo branch: forgetting this is the bug that later re-applies an edit at a\n        //    vanished offset and corrupts the buffer\n        ed.moveTo(ed.text().length());                          // undo left the caret where the delete was\n        ed.type(&quot;!&quot;);\n        check(!ed.canRedo() &amp;&amp; ed.redoDepth() == 0, &quot;a new edit cleared the redo stack: history is linear on purpose&quot;);\n        check(!ed.redo(), &quot;redo after a new edit returns false rather than throwing&quot;);\n        check(ed.text().equals(full + &quot;!&quot;), &quot;the document is the new branch, not a mix of both&quot;);\n\n        // 4. the gap buffer must give the same answers as the obvious buffer, however the caret jumps about\n        TextBuffer gap = new GapBuffer(8), plain = new StringBuilderBuffer();\n        int[][] script = { {0, 0}, {0, 1}, {1, 2}, {0, 3}, {2, 4}, {1, 5} };   // (kind, arg): a walk of inserts and deletes\n        boolean same = true;\n        for (String word : List.of(&quot;alpha&quot;, &quot;beta&quot;, &quot;gamma&quot;, &quot;delta&quot;, &quot;epsilon&quot;)) {\n            for (int[] step : script) {\n                int at = Math.min(step[1] * 3, gap.length());\n                if (step[0] == 0) { gap.insert(at, word); plain.insert(at, word); }\n                else if (gap.length() &gt; at + 2) { gap.delete(at, 2); plain.delete(at, 2); }\n                if (!gap.text().equals(plain.text())) same = false;\n            }\n        }\n        check(same, &quot;the gap buffer matches a StringBuilder through 30 edits with the caret jumping backwards and forwards&quot;);\n        check(gap.indexOf(&quot;psilon&quot;, 0) == plain.indexOf(&quot;psilon&quot;, 0), &quot;find across the gap gives the same offset&quot;);\n        check(gap.substring(3, 9).equals(plain.substring(3, 9)), &quot;substring across the gap gives the same characters&quot;);\n        GapBuffer moved = new GapBuffer(8);\n        moved.insert(0, &quot;abcdef&quot;);\n        moved.moveGap(0);                                        // jump the caret to the front\n        moved.insert(0, &quot;Z&quot;);\n        moved.moveGap(moved.length());                           // and to the very end\n        moved.insert(moved.length(), &quot;Q&quot;);\n        check(moved.text().equals(&quot;Zabcdef&quot; + &quot;Q&quot;), &quot;an explicit gap move to each end leaves the text intact&quot;);\n\n        // 5. forty replacements are ONE ctrl+Z, and the redo replays them instead of searching again\n        Editor doc = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        StringBuilder src = new StringBuilder();\n        for (int i = 0; i &lt; 40; i++) src.append(&quot;the cat number &quot;).append(i).append(&quot;\\n&quot;);\n        doc.type(src.toString());\n        String beforeReplace = doc.text();\n        int depth = doc.undoDepth();\n        int hits = doc.replaceAll(&quot;cat&quot;, &quot;dog&quot;);\n        check(hits == 40, &quot;replace-all found all 40 occurrences&quot;);\n        check(doc.undoDepth() == depth + 1, &quot;40 replacements added exactly ONE undo step&quot;);\n        check(!doc.text().contains(&quot;cat&quot;) &amp;&amp; doc.text().split(&quot;dog&quot;, -1).length == 41, &quot;every hit was replaced&quot;);\n        doc.undo();\n        check(doc.text().equals(beforeReplace), &quot;one ctrl+Z undid all 40, in reverse order, back to the exact original&quot;);\n        doc.redo();\n        check(!doc.text().contains(&quot;cat&quot;), &quot;redo replayed the same 40 children: no second search, no drifted offsets&quot;);\n\n        // 6. an edit that throws must leave the buffer, the history and the version exactly as they were\n        Editor safe = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        safe.type(&quot;stable&quot;);\n        String text = safe.text();\n        long v = safe.version();\n        int steps = safe.undoDepth();\n        try { safe.insertAt(500, &quot;boom&quot;); check(false, &quot;an insert past the end must throw&quot;); }\n        catch (IndexOutOfBoundsException e) { check(true, &quot;an insert past the end throws: &quot; + e.getMessage()); }\n        check(safe.text().equals(text) &amp;&amp; safe.version() == v &amp;&amp; safe.undoDepth() == steps,\n              &quot;the failed insert changed no text, no version and added no undo step&quot;);\n        try {\n            safe.apply(new CompositeCommand(&quot;half-legal macro&quot;, EditKind.MACRO,\n                List.of(new InsertCommand(0, &quot;AAA&quot;, EditKind.MACRO, 0L), new DeleteCommand(900, 1, EditKind.MACRO))));\n            check(false, &quot;a composite whose second child is illegal must throw&quot;);\n        } catch (IndexOutOfBoundsException e) { check(true, &quot;the composite threw on its second child&quot;); }\n        check(safe.text().equals(text) &amp;&amp; safe.undoDepth() == steps,\n              &quot;the composite rolled its first child back: no half-applied macro, and nothing on the undo stack&quot;);\n        check(safe.selection().caret() == text.length(), &quot;the rollback put the caret back too: nothing half-done&quot;);\n        safe.type(&quot;!&quot;);\n        check(safe.text().equals(text + &quot;!&quot;), &quot;the editor still works after both failures: the caller just retries&quot;);\n\n        // 7. a listener that throws is not allowed to break an edit, and a SLOW listener must not hold the lock:\n        //    while one listener is being notified, a second thread must be able to take the document lock and edit.\n        Editor pub = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        int[] good = { 0 };\n        boolean[] otherThreadGotIn = { false }, armed = { true }, probed = { false };\n        pub.addListener(e -&gt; { throw new IllegalStateException(&quot;a broken view&quot;); });\n        pub.addListener(e -&gt; {\n            good[0]++;\n            if (!armed[0]) return;                              // the nested edit notifies too; only probe once\n            armed[0] = false;\n            Thread other = new Thread(() -&gt; { pub.insertAt(0, &quot;#&quot;); otherThreadGotIn[0] = true; });\n            other.start();\n            try { other.join(2000); } catch (InterruptedException ignored) { Thread.currentThread().interrupt(); }\n            probed[0] = otherThreadGotIn[0];                    // read it while we are STILL inside the notification\n        });\n        pub.type(&quot;survives&quot;);\n        check(pub.text().endsWith(&quot;survives&quot;), &quot;the edit landed even though the first listener threw&quot;);\n        check(good[0] &gt;= 1, &quot;the listener after the broken one was still called&quot;);\n        check(probed[0], &quot;a second thread edited the document WHILE a listener was running: notification really is &quot;\n              + &quot;outside the lock, so a slow plugin cannot stall another writer&quot;);\n\n        // 8. the grouping rule: typing collapses into words, a paste never collapses, and the cap evicts the oldest\n        long[] now = { 1_000_000L };\n        Editor keys = new Editor(new GapBuffer(), 3, new TypingBurstMergePolicy(600, 40));\n        keys.setClock(() -&gt; now[0]);\n        for (char c : &quot;hello&quot;.toCharArray()) { keys.type(String.valueOf(c)); now[0] += 40; }\n        check(keys.undoDepth() == 1, &quot;five keystrokes 40 ms apart are ONE undo step&quot;);\n        now[0] += 5000;                                          // a long pause ends the burst\n        keys.type(&quot;x&quot;);\n        check(keys.undoDepth() == 2, &quot;a five-second pause starts a new undo step&quot;);\n        keys.type(&quot;[a 4 KB paste]&quot;);\n        check(keys.undoDepth() == 3, &quot;a paste is its own step: the wrapper refuses to merge it, whatever the rule says&quot;);\n        keys.undo();\n        check(keys.text().equals(&quot;hellox&quot;), &quot;one ctrl+Z took the whole paste out and nothing else&quot;);\n        keys.configure(new NoMergePolicy());\n        now[0] += 10;\n        keys.type(&quot;a&quot;); keys.type(&quot;b&quot;);\n        check(keys.undoDepth() == 3 &amp;&amp; keys.historyEvicted(),\n              &quot;the rule was swapped at run time, the cap of 3 held, and the oldest step was evicted&quot;);\n        check(!keys.text().isEmpty(), &quot;with a step evicted the document can no longer wind back to empty: &quot;\n              + &quot;\\&quot;unsaved\\&quot; must come from the version, not from an empty stack&quot;);\n\n        // 9. the line index is maintained by the edits themselves, so it must survive inserts, deletes, undos and\n        //    redos: after every one of them it has to agree with a full rescan of the text, character for character\n        LineIndexedBuffer idx = new LineIndexedBuffer(new GapBuffer(64));\n        Editor lined = new Editor(idx, 500, new NoMergePolicy());\n        lined.type(&quot;alpha\\nbeta\\ngamma\\ndelta\\n&quot;);\n        Random rnd = new Random(7);\n        boolean agrees = true;\n        for (int step = 0; step &lt; 150 &amp;&amp; agrees; step++) {\n            int len = lined.text().length();\n            int at = len == 0 ? 0 : rnd.nextInt(len + 1);\n            switch (step % 5) {\n                case 0, 1 -&gt; lined.insertAt(at, &quot;x\\ny&quot;);                    // an insert that splits a line\n                case 2 -&gt; lined.insertAt(at, &quot;zz&quot;);                         // an insert inside one line\n                case 3 -&gt; { if (len &gt; at + 3) lined.deleteRange(at, 3); }   // a delete that may eat a newline\n                default -&gt; lined.undo();\n            }\n            agrees = sameLines(idx, lined.text());\n        }\n        check(agrees, &quot;the line index matched a full rescan after 150 inserts, deletes and undos&quot;);\n        check(new LineIndexedBuffer(new GapBuffer()).lineCount() == 1, &quot;an empty document is still one line, starting at 0&quot;);\n        LineIndexedBuffer ji = new LineIndexedBuffer(new GapBuffer(8192));\n        Editor nav = new Editor(ji, 200, new NoMergePolicy());\n        StringBuilder big = new StringBuilder();\n        for (int i = 0; i &lt; 400; i++) big.append(&quot;line &quot;).append(i).append(&quot;\\n&quot;);\n        nav.type(big.toString());\n        check(ji.lineCount() == 401, &quot;400 lines plus the empty last line: 401 line starts&quot;);\n        check(nav.textRange(ji.startOfLine(200), ji.endOfLine(200)).equals(&quot;line 200&quot;),\n              &quot;go to line 200 is a binary search and a substring, not a scan of the document&quot;);\n        nav.insertAt(ji.startOfLine(10), &quot;// note\\n&quot;);\n        check(nav.textRange(ji.startOfLine(201), ji.endOfLine(201)).equals(&quot;line 200&quot;),\n              &quot;an insert near the top shifted every line start below it in one memmove&quot;);\n        check(ji.lineOf(0) == 0 &amp;&amp; ji.columnOf(ji.startOfLine(50) + 3) == 3, &quot;offset to line and column is O(log L)&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures &gt; 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design a text editor. Typing, deleting, cut and paste, and the part I actually care about &mdash; undo and redo that a user can trust. One document, in memory. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (plain or rich text, and how big the document gets, come first); then type in the order of Main.java: the EditKind enum and the Clock, the Selection record, the TextBuffer interface with a StringBuilder implementation (the gap buffer can come second), the Document, the EditCommand interface with InsertCommand and DeleteCommand, the CompositeCommand, the MergePolicy with one real rule and the wrapper, the UndoManager with its two stacks and its cap, the EditEvent and EditListener, then the Editor with its lock and the order inside apply(), then a main that types, undoes, redoes, and runs eight threads through append().</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; Add find-and-replace-all. Forty hits, and the user expects ONE ctrl+Z.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing moves. The history class, the lock, the grouping rule and the listeners are untouched, and the Editor gains no machinery &mdash; replace-all is a command like any other, it just happens to be made of commands. It scans once, builds a delete and an insert per hit, and builds them from the LAST hit backwards so that replacing a short word with a long one never moves an offset it has not used yet. Executing runs the children in order; undoing runs them in reverse, because each child's offsets were computed against the document as the previous child left it. It stays re-executable, so redo replays the same forty children rather than searching again, which is what stops the offsets drifting between the two passes.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * A command made of commands: N edits, ONE undo step. Children run in order and are undone in REVERSE, because each\n * child&#x27;s offsets were computed against the document as the previous child left it. If a child throws, the ones that\n * already ran are undone before the exception leaves, so a half-applied macro cannot reach the undo stack.\n */\nclass CompositeCommand implements EditCommand {\n    private final String label;\n    private final EditKind kind;\n    /** The children, in execution order. Subclasses may fill this before the first execute(). */\n    protected final List&lt;EditCommand&gt; parts = new ArrayList&lt;&gt;();\n\n    /** An empty composite that a subclass fills in later. */\n    protected CompositeCommand(String label, EditKind kind) { this.label = label; this.kind = kind; }\n    /** A composite over a known list of children, e.g. &quot;delete the selection, then type over it&quot;. */\n    CompositeCommand(String label, EditKind kind, List&lt;EditCommand&gt; children) { this(label, kind); parts.addAll(children); }\n\n    public void execute(Document doc) {\n        Selection before = doc.selection();\n        int done = 0;\n        try { for (EditCommand c : parts) { c.execute(doc); done++; } }\n        catch (RuntimeException e) {                               // all of it or none of it\n            for (int i = done - 1; i &gt;= 0; i--) parts.get(i).undo(doc);\n            doc.select(before.anchor(), before.caret());           // the caret too: nothing half-done\n            throw e;\n        }\n    }\n    public void undo(Document doc) { for (int i = parts.size() - 1; i &gt;= 0; i--) parts.get(i).undo(doc); }\n    public String label() { return label; }\n    public EditKind kind() { return kind; }\n    /** How many child commands it holds. */\n    int size() { return parts.size(); }\n    /** The children, in execution order. A journal walks these; nothing else needs them. */\n    List&lt;EditCommand&gt; children() { return List.copyOf(parts); }\n}\n\n/**\n * Find and replace every hit as one undo step. It builds its children once, against the document as it stands, and\n * from the LAST hit backwards so that replacing a short word with a long one never moves an offset it has not used\n * yet. After that first execute it is an ordinary composite, which is what makes redo a replay rather than a re-search.\n */\nfinal class ReplaceAllCommand extends CompositeCommand {\n    private final String find;\n    private final String replacement;\n    private boolean built;\n    private int hits;\n\n    /** Replace every occurrence of find with replacement. An empty needle is refused; an empty replacement is a delete-all. */\n    ReplaceAllCommand(String find, String replacement) {\n        super(&quot;replace all \\&quot;&quot; + find + &quot;\\&quot; -&gt; \\&quot;&quot; + replacement + &quot;\\&quot;&quot;, EditKind.REPLACE);\n        if (find == null || find.isEmpty()) throw new IllegalArgumentException(&quot;nothing to find&quot;);\n        this.find = find; this.replacement = replacement == null ? &quot;&quot; : replacement;\n    }\n    public void execute(Document doc) {\n        if (!built) {\n            build(doc); built = true;\n            if (parts.isEmpty()) throw new IllegalArgumentException(&quot;no occurrences of \\&quot;&quot; + find + &quot;\\&quot;&quot;);\n        }\n        super.execute(doc);\n    }\n    /** Scan once, then create the children back to front so earlier offsets stay valid while later ones change. */\n    private void build(Document doc) {\n        List&lt;Integer&gt; at = new ArrayList&lt;&gt;();\n        for (int i = doc.indexOf(find, 0); i &gt;= 0; i = doc.indexOf(find, i + find.length())) at.add(i);\n        hits = at.size();\n        for (int k = hits - 1; k &gt;= 0; k--) {\n            parts.add(new DeleteCommand(at.get(k), find.length(), EditKind.REPLACE));\n            if (!replacement.isEmpty()) parts.add(new InsertCommand(at.get(k), replacement, EditKind.REPLACE, 0L));\n        }\n    }\n    /** How many occurrences it replaced. Valid after the first execute(). */\n    int hits() { return hits; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two threads touch the document at the same instant. Prove you cannot lose an edit, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between applying an edit and recording it. apply() does the whole thing &mdash; mutate the buffer, record the command, bump the version, publish the snapshot &mdash; inside one lock held by the Editor, so no other writer can run in that gap. The proof is deliberately not a character count: eight threads each append 250 characters through one latch, and the test then checks the length is 2000, the history has 2000 steps, the version is 2000, and 2000 undos wind the document back to empty. Two thousand characters with 1997 undo steps is still a broken editor, so the invariant being tested is that all three agree.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. eight threads type two thousand characters at the same instant: the buffer AND the history must survive.\n        //    Two thousand characters with the wrong history is still a bug, so the test winds the whole document back.\n        Editor race = new Editor(new GapBuffer(4096), 4096, new NoMergePolicy());\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; fs = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; 8; t++) {\n            fs.add(pool.submit(() -&gt; { go.await(); for (int i = 0; i &lt; 250; i++) race.append(&quot;x&quot;); return null; }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : fs) f.get();\n        pool.shutdown();\n        check(race.text().length() == 2000, &quot;2000 concurrent appends landed: length is exactly 2000, nothing torn&quot;);\n        check(race.undoDepth() == 2000, &quot;the history agrees with the buffer: 2000 undo steps, not 1997&quot;);\n        check(race.version() == 2000, &quot;the version counter agrees too: 2000&quot;);\n        int undone = 0;\n        while (race.undo()) undone++;\n        check(undone == 2000 &amp;&amp; race.text().isEmpty(), &quot;2000 undos wind it back to an empty document&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock for the whole document. Have you just serialised the editor?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No, and the answer is arithmetic: eight keystrokes a second against two microseconds of lock each is sixteen microseconds of lock in every second, and the lock is per document, so twenty open tabs never meet. The shape below is the part worth defending. Every edit method takes the lock once, builds its command inside that span, applies it, unlocks, and only then fires; <code>applyLocked</code> exists precisely so that nothing re-enters and no listener ever runs with the lock held. That is what keeps a five-millisecond repaint, a three-millisecond autosave and a plugin doing who knows what out of the two microseconds. If they push further, the ladder is: stop copying the whole document into a snapshot per edit (publish the version and the changed range, or a piece table whose snapshot is a lazy view), and past one author per document it stops being a lock problem at all.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The critical step, and the ORDER is the design. The buffer moves first: if the command throws, the history\n     * never gains a step for an edit that did not happen, and such a step would later delete characters somebody\n     * else typed. Only after the mutation succeeds do the history, the version and the snapshot move, all under one\n     * lock. The listeners are told after the unlock, each inside a try/catch, so a broken plugin cannot break typing.\n     */\n    long apply(EditCommand cmd) {\n        EditEvent ev;\n        lock.lock();\n        try { ev = applyLocked(cmd); } finally { lock.unlock(); }\n        fire(ev);                                        // then the outside world, after the unlock\n        return ev.version();\n    }\n\n    /**\n     * The three writes that must not be split, with the lock already held. Every public edit method follows the same\n     * shape: take the lock, read the caret, build the command, call this, release, THEN fire. Nothing re-enters the\n     * lock, which is what makes &quot;listeners are called outside the lock&quot; true rather than nearly true.\n     */\n    private EditEvent applyLocked(EditCommand cmd) {\n        cmd.execute(doc);                                // 1. the mutation: this is the step that can fail\n        history.record(cmd);                             // 2. only now is there something to undo\n        return publishLocked(&quot;edit&quot;, cmd);               // 3. version and snapshot, still under the lock\n    }\n\n    /** Bump the version and swap in a fresh immutable snapshot. Called with the lock held, never from outside. */\n    private EditEvent publishLocked(String kind, EditCommand cmd) {\n        long v = version.incrementAndGet();\n        snapshot = doc.text();\n        return new EditEvent(v, kind, cmd.label(), snapshot, doc.selection().caret(), cmd);\n    }\n    /** Tell every listener, one broken one at a time. A listener that throws is skipped; the edit already landed. */\n    private void fire(EditEvent ev) {\n        for (EditListener l : listeners) {\n            try { l.onEdit(ev); } catch (RuntimeException ignored) { /* a broken view is not a broken edit */ }\n        }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; An edit throws half way. What is the state of the system?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was. The order inside apply() is the answer: the lock is taken, the command executes FIRST, and only if that succeeded is it recorded. A command validates its offsets before touching a character, so an insert past the end throws with the buffer untouched, no undo step added, the version unmoved and no event published &mdash; the caller just retries. A composite goes one step further: if its third child throws, the two that already ran are undone and the caret is put back before the exception leaves, so a half-applied macro can never reach the undo stack. The order matters more than it looks: recording a command for an edit that did not happen leaves an undo step that will later delete characters somebody else typed.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 6. an edit that throws must leave the buffer, the history and the version exactly as they were\n        Editor safe = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        safe.type(&quot;stable&quot;);\n        String text = safe.text();\n        long v = safe.version();\n        int steps = safe.undoDepth();\n        try { safe.insertAt(500, &quot;boom&quot;); check(false, &quot;an insert past the end must throw&quot;); }\n        catch (IndexOutOfBoundsException e) { check(true, &quot;an insert past the end throws: &quot; + e.getMessage()); }\n        check(safe.text().equals(text) &amp;&amp; safe.version() == v &amp;&amp; safe.undoDepth() == steps,\n              &quot;the failed insert changed no text, no version and added no undo step&quot;);\n        try {\n            safe.apply(new CompositeCommand(&quot;half-legal macro&quot;, EditKind.MACRO,\n                List.of(new InsertCommand(0, &quot;AAA&quot;, EditKind.MACRO, 0L), new DeleteCommand(900, 1, EditKind.MACRO))));\n            check(false, &quot;a composite whose second child is illegal must throw&quot;);\n        } catch (IndexOutOfBoundsException e) { check(true, &quot;the composite threw on its second child&quot;); }\n        check(safe.text().equals(text) &amp;&amp; safe.undoDepth() == steps,\n              &quot;the composite rolled its first child back: no half-applied macro, and nothing on the undo stack&quot;);\n        check(safe.selection().caret() == text.length(), &quot;the rollback put the caret back too: nothing half-done&quot;);\n        safe.type(&quot;!&quot;);\n        check(safe.text().equals(text + &quot;!&quot;), &quot;the editor still works after both failures: the caller just retries&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>5 &middot; Five keystrokes should be one ctrl+Z. A four-kilobyte paste should not. Where does that rule live?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Behind a one-method interface, because there are several right answers: typing groups, a paste never does, an audited document groups nothing at all. The default rule merges only single characters, typed forward from the last one, close together in time, inside one word and up to a cap, so one undo step is never a whole paragraph. The important part is the wrapper: PasteIsItsOwnStep sits around whatever rule you hand in and refuses to merge anything that is not plain typing, so the invariant holds for rules written next year too &mdash; it is the same Decorator seam as the rest of the design. Swapping the rule at run time is one call and the stacks are untouched; only future merges change.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Decides whether two neighbouring edits collapse into ONE undo step. One method, because grouping is the rule\n * product changes most: typing groups, a paste never does, an audited document groups nothing at all.\n */\ninterface MergePolicy {\n    /** The fused command covering both, or null to keep them as two separate undo steps. */\n    EditCommand merge(EditCommand previous, EditCommand next);\n}\n\n/**\n * A human typing: single characters, forward, close together in time, inside one word, up to a cap so one undo step\n * is never a whole paragraph. Anything else -- a caret jump, a pause, a space, a paste -- starts a new step.\n */\nfinal class TypingBurstMergePolicy implements MergePolicy {\n    private final long windowMs;\n    private final int maxRun;\n    /** windowMs: the longest pause that still counts as the same burst. maxRun: the longest run in one undo step. */\n    TypingBurstMergePolicy(long windowMs, int maxRun) { this.windowMs = windowMs; this.maxRun = maxRun; }\n    public EditCommand merge(EditCommand previous, EditCommand next) {\n        if (!(previous instanceof InsertCommand p) || !(next instanceof InsertCommand n)) return null;\n        if (p.kind() != EditKind.TYPING || n.kind() != EditKind.TYPING) return null;\n        if (n.text().length() != 1) return null;                             // only a keystroke joins a run\n        if (n.at() != p.endOffset()) return null;                            // the caret jumped: a new step\n        if (n.atMs() - p.atMs() &gt; windowMs) return null;                     // a pause: a new step\n        if (p.text().length() &gt;= maxRun) return null;                        // the cap\n        if (Character.isWhitespace(p.text().charAt(p.text().length() - 1))) return null;   // a word ended\n        return p.fusedWith(n);\n    }\n}\n\n/** Never merges: every keystroke is its own undo step. What a deterministic test wants, and what an audited document wants. */\nfinal class NoMergePolicy implements MergePolicy {\n    public EditCommand merge(EditCommand previous, EditCommand next) { return null; }\n}\n\n// &quot;a 4 KB paste must never be swallowed into a word&quot; -&gt; add the rule to every policy instead of copying it -&gt; Decorator\n/**\n * The one rule no grouping policy is allowed to break, wrapped around all of them instead of copied into each: only\n * plain typing may ever merge. A paste, a replace-all or a macro is always its own undo step, including under a rule\n * somebody writes next year.\n */\nfinal class PasteIsItsOwnStep implements MergePolicy {\n    private final MergePolicy base;\n    /** Wraps any policy, present or future. The Editor applies this in configure(); nothing else needs to know. */\n    PasteIsItsOwnStep(MergePolicy base) { this.base = Objects.requireNonNull(base); }\n    public EditCommand merge(EditCommand previous, EditCommand next) {\n        if (previous.kind() != EditKind.TYPING || next.kind() != EditKind.TYPING) return null;\n        return base.merge(previous, next);\n    }\n}\n\n        // 8. the grouping rule: typing collapses into words, a paste never collapses, and the cap evicts the oldest\n        long[] now = { 1_000_000L };\n        Editor keys = new Editor(new GapBuffer(), 3, new TypingBurstMergePolicy(600, 40));\n        keys.setClock(() -&gt; now[0]);\n        for (char c : &quot;hello&quot;.toCharArray()) { keys.type(String.valueOf(c)); now[0] += 40; }\n        check(keys.undoDepth() == 1, &quot;five keystrokes 40 ms apart are ONE undo step&quot;);\n        now[0] += 5000;                                          // a long pause ends the burst\n        keys.type(&quot;x&quot;);\n        check(keys.undoDepth() == 2, &quot;a five-second pause starts a new undo step&quot;);\n        keys.type(&quot;[a 4 KB paste]&quot;);\n        check(keys.undoDepth() == 3, &quot;a paste is its own step: the wrapper refuses to merge it, whatever the rule says&quot;);\n        keys.undo();\n        check(keys.text().equals(&quot;hellox&quot;), &quot;one ctrl+Z took the whole paste out and nothing else&quot;);\n        keys.configure(new NoMergePolicy());\n        now[0] += 10;\n        keys.type(&quot;a&quot;); keys.type(&quot;b&quot;);\n        check(keys.undoDepth() == 3 &amp;&amp; keys.historyEvicted(),\n              &quot;the rule was swapped at run time, the cap of 3 held, and the oldest step was evicted&quot;);\n        check(!keys.text().isEmpty(), &quot;with a step evicted the document can no longer wind back to empty: &quot;\n              + &quot;\\&quot;unsaved\\&quot; must come from the version, not from an empty stack&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>6 &middot; The document is a ten-megabyte log file and typing has gone slow.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The buffer is behind an interface, so this is one new class. A StringBuilder copies everything after the edit on every keystroke, which is invisible at 20 KB and fatal at 10 MB. A gap buffer fixes typing but still pays one array copy when the caret jumps. A piece table fixes both: the original text is never touched, everything typed is appended to one growing buffer, and the document is a list of pieces saying which run of characters comes from where, so an insert or a delete rewrites two or three list entries and copies nothing. The second half of the answer is the snapshot: copying the whole document per edit is now the expensive part, so the piece table's snapshot becomes a lazy view and readers keep the same contract. A rope is the other answer, O(log n) for reads and writes at the price of a tree to rebalance. Commands still speak (offset, length), so exactly one class changes.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a piece table -- the same TextBuffer, so exactly ONE class changes when the file gets big\n/**\n * A third buffer for documents a gap buffer cannot carry. The original text is never touched; everything typed is\n * appended to one growing add-buffer; the document is a list of pieces saying &quot;take 12 characters from the original\n * at 40, then 3 from the add-buffer at 0&quot;. An insert or a delete rewrites two or three list entries and copies no\n * characters at all, so a 10 MB file edits as fast as an empty one.\n *\n * Reads here are deliberately naive (build the string, then slice it) to keep the block short. A production one\n * walks the piece list, and the Editor&#x27;s snapshot becomes a lazy view over it instead of a copy per keystroke --\n * which is the second rung of the ladder on page 02, move 8. A rope is the other answer: O(log n) for reads AND\n * writes and no add-buffer growth, at the price of a tree to rebalance. Nothing outside this class changes.\n */\nfinal class PieceTableBuffer implements TextBuffer {\n    private enum Src { ORIGINAL, ADDED }\n    private record Piece(Src src, int start, int len) {}\n    private final String original;\n    private final StringBuilder added = new StringBuilder();\n    private final List&lt;Piece&gt; pieces = new ArrayList&lt;&gt;();\n    private int length;\n\n    /** Open a document over text that already exists. That string is never copied and never mutated again. */\n    PieceTableBuffer(String original) {\n        this.original = original == null ? &quot;&quot; : original;\n        if (!this.original.isEmpty()) pieces.add(new Piece(Src.ORIGINAL, 0, this.original.length()));\n        length = this.original.length();\n    }\n\n    public int length() { return length; }\n\n    /** Split the piece list so an edit boundary falls between two pieces; returns the index of the piece starting at at. */\n    private int splitAt(int at) {\n        int off = 0;\n        for (int i = 0; i &lt; pieces.size(); i++) {\n            Piece p = pieces.get(i);\n            if (at == off) return i;\n            if (at &lt; off + p.len()) {\n                int left = at - off;\n                pieces.set(i, new Piece(p.src(), p.start(), left));\n                pieces.add(i + 1, new Piece(p.src(), p.start() + left, p.len() - left));\n                return i + 1;\n            }\n            off += p.len();\n        }\n        return pieces.size();\n    }\n\n    public void insert(int at, String s) {\n        if (at &lt; 0 || at &gt; length) throw new IndexOutOfBoundsException(&quot;insert at &quot; + at + &quot; of &quot; + length);\n        if (s.isEmpty()) return;\n        int i = splitAt(at);\n        pieces.add(i, new Piece(Src.ADDED, added.length(), s.length()));\n        added.append(s);                                   // append-only: nothing already written ever moves\n        length += s.length();\n    }\n\n    public String delete(int at, int len) {\n        if (at &lt; 0 || len &lt; 0 || at + len &gt; length) throw new IndexOutOfBoundsException(&quot;delete &quot; + len + &quot; at &quot; + at + &quot; of &quot; + length);\n        String gone = substring(at, at + len);\n        int i = splitAt(at), j = splitAt(at + len);\n        pieces.subList(i, j).clear();                      // a delete is dropping list entries, not moving characters\n        length -= len;\n        return gone;\n    }\n\n    public String text() {\n        StringBuilder sb = new StringBuilder(length);\n        for (Piece p : pieces) {\n            CharSequence from = p.src() == Src.ORIGINAL ? original : added;\n            sb.append(from, p.start(), p.start() + p.len());\n        }\n        return sb.toString();\n    }\n    public String substring(int from, int to) { return text().substring(from, to); }\n    public int indexOf(String needle, int from) { return text().indexOf(needle, from); }\n    /** How many pieces the document is currently made of: the real memory cost of this buffer. */\n    int pieceCount() { return pieces.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>7 &middot; Undo it after closing and reopening the file. And now the undo stack has to come back too.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The commands were already data, so persistence is a codec and a replay loop rather than a redesign. A listener encodes every landed change to one line &mdash; an insert writes its offset and its text, a delete writes its offset and its length, a composite writes its child count and then its children &mdash; and an undo or a redo writes a single letter. Startup replays the log into a fresh Editor, which rebuilds the text AND the undo stack, because replaying the log is exactly what produced them the first time. The journal is a listener, so it writes after the unlock and a slow disk never blocks a typist; the honest price is that an edit landing in the microsecond before the process dies is lost, and moving the append inside the lock buys durability at milliseconds per keystroke.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- a journal of commands, and replay rebuilds text AND history\n/** Where the journal goes. A file, a socket, a table: the editor never learns which. */\ninterface Journal {\n    /** Append one line. Called after the unlock, so a slow disk never blocks a typist. */\n    void append(String line);\n    /** Every line ever appended, oldest first. */\n    List&lt;String&gt; readAll();\n}\n\n/** A journal in memory, which is all a test needs. A real one is the same class over a file channel. */\nfinal class MemoryJournal implements Journal {\n    private final List&lt;String&gt; lines = new ArrayList&lt;&gt;();\n    public synchronized void append(String line) { lines.add(line); }\n    public synchronized List&lt;String&gt; readAll() { return List.copyOf(lines); }\n}\n\n/**\n * The only place that knows a command&#x27;s wire format. Commands were already data -- that is why persistence is a\n * codec and a replay loop rather than a redesign. An insert writes its offset and its text; a delete writes its\n * offset and its length (the characters come back from the document on replay); a composi

te writes its child count.\n */\nfinal class CommandCodec {\n    private CommandCodec() { }\n    /** One command as one or more lines, parents before children. */\n    static List&lt;String&gt; encode(EditCommand c) {\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        if (c instanceof InsertCommand i) out.add(&quot;I\\t&quot; + i.at() + &quot;\\t&quot; + i.kind() + &quot;\\t&quot; + esc(i.text()));\n        else if (c instanceof DeleteCommand d) out.add(&quot;D\\t&quot; + d.at() + &quot;\\t&quot; + d.len() + &quot;\\t&quot; + d.kind());\n        else if (c instanceof CompositeCommand k) {\n            List&lt;EditCommand&gt; kids = k.children();\n            out.add(&quot;C\\t&quot; + esc(k.label()) + &quot;\\t&quot; + kids.size());\n            for (EditCommand kid : kids) out.addAll(encode(kid));\n        } else throw new IllegalArgumentException(&quot;no codec for &quot; + c.getClass().getSimpleName());\n        return out;\n    }\n    /** Read one command (and its children) starting at cursor[0], advancing the cursor past what it consumed. */\n    static EditCommand decode(List&lt;String&gt; lines, int[] cursor) {\n        String[] f = lines.get(cursor[0]++).split(&quot;\\t&quot;, -1);\n        switch (f[0]) {\n            case &quot;I&quot;: return new InsertCommand(Integer.parseInt(f[1]), unesc(f[3]), EditKind.valueOf(f[2]), 0L);\n            case &quot;D&quot;: return new DeleteCommand(Integer.parseInt(f[1]), Integer.parseInt(f[2]), EditKind.valueOf(f[3]));\n            case &quot;C&quot;: {\n                int n = Integer.parseInt(f[2]);\n                List&lt;EditCommand&gt; kids = new ArrayList&lt;&gt;();\n                for (int i = 0; i &lt; n; i++) kids.add(decode(lines, cursor));\n                return new CompositeCommand(unesc(f[1]), EditKind.MACRO, kids);\n            }\n            default: throw new IllegalArgumentException(&quot;bad journal line: &quot; + String.join(&quot;\\\\t&quot;, f));\n        }\n    }\n    private static String esc(String s) { return s.replace(&quot;\\\\&quot;, &quot;\\\\\\\\&quot;).replace(&quot;\\t&quot;, &quot;\\\\t&quot;).replace(&quot;\\n&quot;, &quot;\\\\n&quot;); }\n    private static String unesc(String s) { return s.replace(&quot;\\\\n&quot;, &quot;\\n&quot;).replace(&quot;\\\\t&quot;, &quot;\\t&quot;).replace(&quot;\\\\\\\\&quot;, &quot;\\\\&quot;); }\n}\n\n/**\n * Writes every landed change to the journal. It is an ordinary listener, so it runs AFTER the unlock: a slow disk\n * never blocks the typist, and the price of that is an honest one -- if the process dies in the microsecond between\n * the unlock and the append, the last edit is lost. Moving the append inside the lock buys durability and costs\n * milliseconds per keystroke, which is why real editors do exactly this and autosave on top.\n */\nfinal class JournalListener implements EditListener {\n    private final Journal journal;\n    /** Write to this journal. */\n    JournalListener(Journal journal) { this.journal = journal; }\n    public void onEdit(EditEvent e) {\n        switch (e.kind()) {\n            case &quot;edit&quot; -&gt; CommandCodec.encode(e.command()).forEach(journal::append);\n            case &quot;undo&quot; -&gt; journal.append(&quot;U&quot;);\n            case &quot;redo&quot; -&gt; journal.append(&quot;R&quot;);\n            default -&gt; { }\n        }\n    }\n    /** Rebuild an editor from a journal: the text comes back, and so does the undo stack, because the log IS the history. */\n    static Editor replay(Journal journal) {\n        Editor ed = new Editor(new GapBuffer(), 4096, new NoMergePolicy());\n        List&lt;String&gt; lines = journal.readAll();\n        int[] cursor = { 0 };\n        while (cursor[0] &lt; lines.size()) {\n            String head = lines.get(cursor[0]);\n            if (head.equals(&quot;U&quot;)) { cursor[0]++; ed.undo(); }\n            else if (head.equals(&quot;R&quot;)) { cursor[0]++; ed.redo(); }\n            else ed.apply(CommandCodec.decode(lines, cursor));\n        }\n        return ed;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Two people editing the same document at once.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>This is the one to name rather than build, and naming it properly is worth more than any feature. A stack can undo my last step; it cannot undo my last step while keeping yours, because your edit moved my offsets &mdash; my \"delete three characters at forty\" now means different characters. Two families fix it. Operational transformation keeps a per-site log and rebases every incoming operation against the ones it had not seen; for two inserts that whole idea is a four-line function. A CRDT gives every character a unique, totally ordered id instead of an offset, so there is nothing to rebase, at the cost of carrying those ids forever. In both, undo stops meaning \"pop\" and starts meaning \"emit the transformed inverse of my own operation\".</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: two people at once -- why a stack cannot do it, and the one function OT adds\n/**\n * A stack can undo MY last step. It cannot undo my last step while keeping yours, because your edit moved my\n * offsets: my &quot;delete 3 characters at 40&quot; now means different characters. Two families fix it, and neither is a\n * lock. Operational transformation keeps a per-site log and rebases every incoming operation against the ones it\n * did not see -- for two inserts that whole idea is the function below. A CRDT gives every character a unique,\n * totally ordered id instead of an offset, so there is nothing to rebase, at the cost of carrying those ids\n * forever. In both, undo stops meaning &quot;pop&quot; and starts meaning &quot;emit the transformed inverse of my own operation&quot;.\n */\nfinal class Ot {\n    private Ot() { }\n    /** My insert at mine, rebased over a concurrent insert of theirLen characters at theirs. siteWins breaks the tie. */\n    static int insertOverInsert(int mine, int theirs, int theirLen, boolean siteWins) {\n        if (mine &lt; theirs || (mine == theirs &amp;&amp; siteWins)) return mine;\n        return mine + theirLen;\n    }\n    /** My insert at mine, rebased over a concurrent delete of theirLen characters at theirs. */\n    static int insertOverDelete(int mine, int theirs, int theirLen) {\n        if (mine &lt;= theirs) return mine;\n        return mine &gt;= theirs + theirLen ? mine - theirLen : theirs;     // inside the deleted range: collapse to its start\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>9 &middot; The renderer wants to repaint one line, not the file. And there is a syntax highlighter now.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The version number in the event is what makes this cheap, and it was there from the start. A listener compares the text it last saw with the text in the event, finds the first and last line that differ, and re-tokenises only those &mdash; one keystroke in a two-hundred-line file costs one line, not two hundred. It never takes the lock, because the event already carries an immutable snapshot, and a listener that jumps from version 7 to version 9 knows it missed one and can do a full pass. The Editor also exposes textRange off the same snapshot, so a viewport draws without copying the whole document.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: incremental syntax highlighting -- retokenise the lines the edit touched, not the file\n/**\n * The version number in the event is what makes this cheap. On every edit it compares the new text with the text it\n * last saw, finds the first and last line that differ, and re-tokenises only those. One keystroke in a thousand-line\n * file re-tokenises one line; a paste of forty lines re-tokenises forty. It never takes the editor&#x27;s lock, because\n * the event already carries an immutable snapshot.\n */\nfinal class Highlighter implements EditListener {\n    private static final Set&lt;String&gt; KEYWORDS = Set.of(&quot;class&quot;, &quot;void&quot;, &quot;int&quot;, &quot;return&quot;, &quot;if&quot;, &quot;else&quot;, &quot;new&quot;, &quot;final&quot;);\n    private List&lt;String&gt; lines = List.of(&quot;&quot;);\n    private int retokenised, keywordsFound;\n\n    public void onEdit(EditEvent e) {\n        List&lt;String&gt; now = List.of(e.text().split(&quot;\\n&quot;, -1));\n        int lo = 0;\n        while (lo &lt; lines.size() &amp;&amp; lo &lt; now.size() &amp;&amp; lines.get(lo).equals(now.get(lo))) lo++;\n        int hi = 0;\n        while (hi &lt; lines.size() - lo &amp;&amp; hi &lt; now.size() - lo\n               &amp;&amp; lines.get(lines.size() - 1 - hi).equals(now.get(now.size() - 1 - hi))) hi++;\n        for (int i = lo; i &lt; now.size() - hi; i++) { tokenise(now.get(i)); retokenised++; }\n        lines = now;\n    }\n    private void tokenise(String line) { for (String w : line.split(&quot;\\\\W+&quot;)) if (KEYWORDS.contains(w)) keywordsFound++; }\n    /** How many lines have been re-tokenised in total; compare it with edits x lines to see what incremental bought. */\n    int retokenised() { return retokenised; }\n    /** How many lines the document currently has. */\n    int lineCount() { return lines.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>10 &middot; The window shows 50 lines at a time. Draw lines 4000 to 4050 of a 40,000-line file, and put &quot;line 312, column 7&quot; in the status bar.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>You cannot scan for the four-thousandth newline on every repaint, so somebody has to keep an index of where each line starts. The index rides on the storage, not on the editor: LineIndexedBuffer wraps any TextBuffer and updates an int array of line starts inside insert and delete &mdash; which means undo and redo maintain it too, for free, because they go through the same two methods. Nothing above it changes: the Editor, the commands and the lock never learn it exists, which is the same Decorator seam as PasteIsItsOwnStep, this time around the storage rather than the rule. A lookup is a binary search, so offset to line and line to offset are both O(log L), and the view then asks for <code>textRange(startOfLine(4000), endOfLine(4050))</code> off the published snapshot without taking the lock. The honest cost: an edit near the top shifts every line start below it, one System.arraycopy &mdash; about ten microseconds on 40,000 lines, and the reason a million-line file wants the newline counts inside a piece table or a rope instead, where the shift becomes O(log n).</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: lines -- &quot;go to line 4000&quot; and &quot;draw lines 200 to 250&quot; without scanning the document\n/**\n * Where every line starts, kept up to date by the edits themselves. It wraps ANY TextBuffer instead of changing one,\n * so the Editor, the commands and the lock do not know it exists -- the same Decorator seam as PasteIsItsOwnStep,\n * this time around the storage. Because undo and redo also go through insert() and delete(), the index follows them\n * for free; there is no second code path to keep in step.\n *\n * starts[i] is the offset of the first character of line i, and starts[0] is always 0, so an empty document has one\n * line. A lookup is a binary search: O(log L). An edit shifts every start below it by one System.arraycopy: on a\n * 40,000-line file that is a 160 KB memmove, about 10 us, which is why this is the right answer up to roughly a\n * million lines. Past that the line counts belong inside the buffer&#x27;s own pieces -- a piece table or a rope carrying\n * a newline count per node -- and the shift becomes O(log n).\n */\nfinal class LineIndexedBuffer implements TextBuffer {\n    private final TextBuffer base;\n    private int[] starts = new int[16];\n    private int n = 1;                                     // starts[0] = 0: an empty document is one empty line\n\n    /** Wrap any storage. Nothing above it changes: it is still a TextBuffer. */\n    LineIndexedBuffer(TextBuffer base) {\n        this.base = Objects.requireNonNull(base);\n        String t = base.text();                            // one scan, once, when the file is opened\n        for (int i = 0; i &lt; t.length(); i++) if (t.charAt(i) == &#x27;\\n&#x27;) add(i + 1);\n    }\n    private void add(int off) { grow(n + 1); starts[n++] = off; }\n    private void grow(int need) { if (need &gt; starts.length) starts = Arrays.copyOf(starts, Math.max(need, starts.length * 2)); }\n    /** The index of the first line that starts strictly after off. */\n    private int upper(int off) {\n        int lo = 0, hi = n;\n        while (lo &lt; hi) { int mid = (lo + hi) &gt;&gt;&gt; 1; if (starts[mid] &lt;= off) lo = mid + 1; else hi = mid; }\n        return lo;\n    }\n\n    public void insert(int at, String s) {\n        base.insert(at, s);\n        int add = 0;\n        for (int i = 0; i &lt; s.length(); i++) if (s.charAt(i) == &#x27;\\n&#x27;) add++;\n        int i = upper(at);\n        grow(n + add);\n        System.arraycopy(starts, i, starts, i + add, n - i);            // one memmove: everything below the edit\n        for (int k = i + add; k &lt; n + add; k++) starts[k] += s.length();\n        int w = i;\n        for (int c = 0; c &lt; s.length(); c++) if (s.charAt(c) == &#x27;\\n&#x27;) starts[w++] = at + c + 1;\n        n += add;\n    }\n\n    public String delete(int at, int len) {\n        String gone = base.delete(at, len);\n        int i = upper(at), j = upper(at + len);                          // lines that began inside the deleted range\n        System.arraycopy(starts, j, starts, i, n - j);\n        n -= (j - i);\n        for (int k = i; k &lt; n; k++) starts[k] -= len;\n        return gone;\n    }\n\n    /** How many lines the document has. An empty document has one. */\n    int lineCount() { return n; }\n    /** The offset the given line starts at. Line numbers are zero-based here; a UI adds one. */\n    int startOfLine(int line) { return starts[Math.max(0, Math.min(line, n - 1))]; }\n    /** One past the last character of the line, not counting its newline. */\n    int endOfLine(int line) { return line + 1 &lt; n ? starts[line + 1] - 1 : length(); }\n    /** Which line an offset falls on: one binary search, no scan. */\n    int lineOf(int offset) { return Math.max(0, upper(offset) - 1); }\n    /** Line and column of an offset, which is what a status bar shows. */\n    int columnOf(int offset) { return offset - startOfLine(lineOf(offset)); }\n\n    public int length() { return base.length(); }\n    public String text() { return base.text(); }\n    public String substring(int from, int to) { return base.substring(from, to); }\n    public int indexOf(String needle, int from) { return base.indexOf(needle, from); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; A plugin somebody else wrote throws on every keystroke. And another one blocks for a second.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Typing does not notice either of them, and they are two different fixes. Throwing is handled by the try/catch around each listener: the broken one is skipped, the ones after it are still called, and the edit had already landed before anybody was told. Blocking is handled by <i>where</i> the notification happens &mdash; after the unlock, in a method that never re-enters the lock &mdash; so a listener that sleeps for a second delays only itself. The test proves that second claim the only honest way: from inside a listener it starts another thread that edits the same document and waits for it, and that edit must land while the notification is still running. The product answer sits one layer up: a plugin host fans out to the installed plugins and, after three strikes, unsubscribes the offender by name instead of swallowing the same exception forever.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: plugins -- a listener somebody else wrote, and what happens when it throws\n/** A plugin is a listener with a name, installed by a user rather than by the editor. */\ninterface Plugin {\n    /** How the plugin appears in the disabled list. */\n    String name();\n    /** Called with every edit, after the unlock. It is allowed to throw; that is the point of the host. */\n    void onEdit(EditEvent e);\n}\n\n/**\n * One listener that fans out to every installed plugin. The Editor already swallows an exception from a listener, so\n * typing is safe; the host adds the part a product needs -- a plugin that throws is counted, and after three strikes\n * it is unsubscribed and named, instead of being caught silently forever.\n */\nfinal class PluginHost implements EditListener {\n    private final Map&lt;String, Plugin&gt; live = new LinkedHashMap&lt;&gt;();\n    private final Map&lt;String, Integer&gt; strikes = new HashMap&lt;&gt;();\n    private final List&lt;String&gt; disabled = new ArrayList&lt;&gt;();\n    /** Install a plugin. It starts receiving the next edit. */\n    void install(Plugin p) { live.put(p.name(), p); }\n    public void onEdit(EditEvent e) {\n        for (Plugin p : new ArrayList&lt;&gt;(live.values())) {\n            try { p.onEdit(e); }\n            catch (RuntimeException ex) {\n                if (strikes.merge(p.name(), 1, Integer::sum) &gt;= 3) { live.remove(p.name()); disabled.add(p.name()); }\n            }\n        }\n    }\n    /** The plugins still receiving events. */\n    Set&lt;String&gt; installed() { return live.keySet(); }\n    /** The plugins that were switched off for throwing three times. */\n    List&lt;String&gt; disabled() { return List.copyOf(disabled); }\n}\n\n        // 7. a listener that throws is not allowed to break an edit, and a SLOW listener must not hold the lock:\n        //    while one listener is being notified, a second thread must be able to take the document lock and edit.\n        Editor pub = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        int[] good = { 0 };\n        boolean[] otherThreadGotIn = { false }, armed = { true }, probed = { false };\n        pub.addListener(e -&gt; { throw new IllegalStateException(&quot;a broken view&quot;); });\n        pub.addListener(e -&gt; {\n            good[0]++;\n            if (!armed[0]) return;                              // the nested edit notifies too; only probe once\n            armed[0] = false;\n            Thread other = new Thread(() -&gt; { pub.insertAt(0, &quot;#&quot;); otherThreadGotIn[0] = true; });\n            other.start();\n            try { other.join(2000); } catch (InterruptedException ignored) { Thread.currentThread().interrupt(); }\n            probed[0] = otherThreadGotIn[0];                    // read it while we are STILL inside the notification\n        });\n        pub.type(&quot;survives&quot;);\n        check(pub.text().endsWith(&quot;survives&quot;), &quot;the edit landed even though the first listener threw&quot;);\n        check(good[0] &gt;= 1, &quot;the listener after the broken one was still called&quot;);\n        check(probed[0], &quot;a second thread edited the document WHILE a listener was running: notification really is &quot;\n              + &quot;outside the lock, so a slow plugin cannot stall another writer&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Make &quot;bold this selection&quot; work, and make ctrl+Z take the bold off.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A style change is an edit, so it is a command: it goes through apply(), it lands on the undo stack, and one ctrl+Z reverses it. Its memento is the run list as it was, which is small because a style is a range and not a per-character attribute. The interesting part is the Style object itself: it is interned, so a million bold characters share one instance and the table holds references rather than copies &mdash; Flyweight, arriving because rich text demanded it and not because it was on a list. The one seam that is not free is EditKind: a genuine STYLE constant would be the single extra edit, and the block below reports MACRO so the merge wrapper refuses to fold a style change into a word.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: rich text -- &quot;bold this selection&quot; is an edit too, and styles are a Flyweight\n/**\n * One character style. Interned, so a million bold characters share ONE Style object and the table holds references\n * rather than copies: Flyweight, and it arrives because rich text demanded it, not because it was on a list.\n */\nrecord Style(boolean bold, boolean italic, String colour) {\n    private static final Map&lt;String, Style&gt; POOL = new ConcurrentHashMap&lt;&gt;();\n    /** The shared instance for this combination; the same arguments always give back the same object. */\n    static Style of(boolean bold, boolean italic, String colour) {\n        return POOL.computeIfAbsent(bold + &quot;/&quot; + italic + &quot;/&quot; + colour, k -&gt; new Style(bold, italic, colour));\n    }\n    /** How many distinct styles exist in the whole process. */\n    static int pooled() { return POOL.size(); }\n}\n\n/** A stretch of characters carrying one style. The text itself stays plain; styles ride alongside it. */\nrecord StyleRun(int from, int to, Style style) {}\n\n/** The styles of one document. Kept beside the buffer, so a plain-text editor pays nothing for it. */\nfinal class StyleTable {\n    private List&lt;StyleRun&gt; runs = new ArrayList&lt;&gt;();\n    /** An immutable view of the runs, newest last. */\n    List&lt;StyleRun&gt; runs() { return List.copyOf(runs); }\n    /** Replace the whole run list. Used by undo, which restores the list it saved. */\n    void set(List&lt;StyleRun&gt; newRuns) { runs = new ArrayList&lt;&gt;(newRuns); }\n    /** Add one run. */\n    void add(StyleRun r) { runs.add(r); }\n}\n\n/**\n * Bold, italic or a colour over a range, as an ordinary EditCommand: it goes through apply(), lands on the undo\n * stack, and one ctrl+Z takes the bold off again. Its memento is the run list as it was -- small, because runs are\n * ranges, not characters. It reports MACRO rather than TYPING so the merge wrapper will never fold it into a word.\n */\nfinal class StyleCommand implements EditCommand {\n    private final StyleTable table;\n    private final StyleRun run;\n    private List&lt;StyleRun&gt; before;\n    /** Apply style to [from, to) of this table. */\n    StyleCommand(StyleTable table, int from, int to, Style style) { this.table = table; this.run = new StyleRun(from, to, style); }\n    public void execute(Document doc) { before = table.runs(); table.add(run); }\n    public void undo(Document doc) { table.set(before); }\n    public String label() { return &quot;style&quot;; }\n    public EditKind kind() { return EditKind.MACRO; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Group an arbitrary run of edits into one step \u2014 a macro with a begin and an end. And put the caret back on undo.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both are small because the seams already exist. A macro buffers commands instead of applying them and hands the Editor one composite at the end; replace-all is the same shape with the children found by a search instead of by a caller, which is why macros needed no new machinery in the Editor, the history or the lock. Restoring the caret is a decorator around any command: it notes the selection before execute and puts it back after undo, so InsertCommand, DeleteCommand and every composite stay untouched. That is the second use of the same Decorator seam that PasteIsItsOwnStep uses on the grouping rule.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a macro -- an arbitrary run of edits as one ctrl+Z\n/**\n * Begin and end, around anything you like: the edits are buffered instead of applied, and commit() hands the Editor\n * one CompositeCommand. ReplaceAllCommand is this same shape with the children found by a search instead of by a\n * caller, which is why adding macros needed no new machinery in the Editor, the history or the lock.\n */\nfinal class Macro {\n    private final Editor editor;\n    private final String label;\n    private final List&lt;EditCommand&gt; parts = new ArrayList&lt;&gt;();\n    /** Start recording. Nothing touches the document until commit(). */\n    Macro(Editor editor, String label) { this.editor = editor; this.label = label; }\n    /** Record an insert. */\n    Macro insert(int at, String s) { parts.add(new InsertCommand(at, s, EditKind.MACRO, 0L)); return this; }\n    /** Record a delete. */\n    Macro delete(int at, int len) { parts.add(new DeleteCommand(at, len, EditKind.MACRO)); return this; }\n    /** Apply the whole run as ONE undo step. If any child throws, the ones already applied are rolled back. */\n    long commit() { return editor.apply(new CompositeCommand(label, EditKind.MACRO, parts)); }\n}\n\n// ---- ext: undo puts the caret back -- one decorator, and no command had to learn about it\n/**\n * Undo that restores the selection, not just the text. Wraps any command: it notes where the caret and the highlight\n * were before execute, and puts them back after undo. One class, one line at the call site, and InsertCommand,\n * DeleteCommand and every composite are untouched -- the same Decorator seam PasteIsItsOwnStep uses.\n */\nfinal class RestoresSelection implements EditCommand {\n    private final EditCommand base;\n    private Selection before;\n    /** Wrap a command so its undo also restores the pre-edit selection. */\n    RestoresSelection(EditCommand base) { this.base = Objects.requireNonNull(base); }\n    public void execute(Document doc) { before = doc.selection(); base.execute(doc); }\n    public void undo(Document doc) { base.undo(doc); if (before != null) doc.select(before.anchor(), before.caret()); }\n    public String label() { return base.label(); }\n    public EditKind kind() { return base.kind(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Where does time come from, and how do you test that two keystrokes were in the same burst?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The Editor has a Clock it was handed and stamps every insert with it; nothing else in the file reads the wall clock. A test hands in a clock that returns a fixed instant, types five characters moving it forty milliseconds each time and asserts one undo step, then moves it five seconds and asserts a second step appears. Without that seam the grouping test would either sleep or be flaky, which is the usual reason grouping rules ship untested.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Where time comes from. Injected, so a test decides whether two keystrokes were 40 ms or 40 minutes apart. */\ninterface Clock { long nowMs(); }\n\n// on the Editor: handed in, defaulted, never read from the wall clock inside a method\nprivate Clock clock = System::currentTimeMillis;\nvoid setClock(Clock c) { clock = Objects.requireNonNull(c); }\n\n// in a test: pick the instant, then move it\nlong[] now = { 1_000_000L };\nEditor keys = new Editor(new GapBuffer(), 3, new TypingBurstMergePolicy(600, 40));\nkeys.setClock(() -&gt; now[0]);\nfor (char c : &quot;hello&quot;.toCharArray()) { keys.type(String.valueOf(c)); now[0] += 40; }   // one undo step\nnow[0] += 5000;                                                                     // a pause\nkeys.type(&quot;x&quot;);                                                                     // a second step\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Which pattern is where, which SOLID letter is where, and where would a Factory or a Builder earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Pages 02 and 03 have the full tables; what an interviewer is really testing here is whether you can defend each name in one sentence and, harder, say where a pattern does <i>not</i> belong. Three are load-bearing and you should say them first: Command (a change is an object, so undo needs no copy of the document), Composite (replace-all and macros are commands made of commands, and the Editor gained no method for either) and Decorator, which is used three times over on three different things &mdash; the grouping rule, the caret restore and the line index &mdash; and is the honest answer to \"how do I add X without opening anything\". Then the ones that earned nothing. Singleton: the Editor is handed to its callers, which is why a test can build a fresh one per case. Factory: commands are built at three call sites inside the Editor, and it earns the name the day they arrive as lines from a journal instead. Builder: an insert is an offset and a string, both required, so a builder would be pure ceremony. For SOLID the one worth saying out loud is D: the buffer, the grouping rule and the clock are all handed in, which is exactly why a test can supply a clock that says last Tuesday, a rule that never merges, and a listener that throws.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Command + Memento: the change is an object, and a delete carries the smallest state that reverses it\ninterface EditCommand { void execute(Document doc); void undo(Document doc); String label(); EditKind kind(); }\npublic void execute(Document doc) { removed = doc.delete(at, len); }   // DeleteCommand: the memento is filled here\n\n// Composite: N edits, one undo step; children in order, undone in reverse\npublic void undo(Document doc) { for (int i = parts.size() - 1; i &gt;= 0; i--) parts.get(i).undo(doc); }\n\n// Strategy: the storage and the grouping rule, both handed in, never built by the Editor\nEditor(TextBuffer buffer, int historyLimit, MergePolicy policy) { ... }\n\n// Decorator, three times: around a rule, around a command, around the storage -- add behaviour, open nothing\nhistory.setPolicy(new PasteIsItsOwnStep(policy));       // no rule may ever swallow a paste\neditor.apply(new RestoresSelection(cmd));               // undo puts the caret back too\nnew Editor(new LineIndexedBuffer(new GapBuffer()), ...) // the buffer now knows where every line starts\n\n// Observer: the Editor announces; it does not know what a window is\nprivate void fire(EditEvent ev) { for (EditListener l : listeners) try { l.onEdit(ev); } catch (RuntimeException ignored) { } }\n\n// State: four history states, and the one edge where the bugs live\nvoid record(EditCommand cmd) { redoStack.clear(); /* ... then try to merge, then push, then evict ... */ }\n\n// Factory: not yet. It earns the name the day commands arrive as journal lines instead of new InsertCommand(...)\nEditCommand c = CommandCodec.decode(lines, cursor);\n\n// Builder: never here. Two required fields is a constructor\nnew InsertCommand(at, text, EditKind.TYPING, clock.nowMs());\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/** What kind of edit this is. The grouping rule and the Edit menu read it; nothing else in the system branches on it. */\nenum EditKind { TYPING, PASTE, DELETE, REPLACE, MACRO }\n\n/** Where time comes from. Injected, so a test decides whether two keystrokes were forty milliseconds or forty minutes apart. */\ninterface Clock { long nowMs(); }\n\n/**\n * Where the caret is and what is highlighted. anchor is where the drag started, caret is where it is now, so a\n * backwards selection has its caret before its anchor. Two ints and no behaviour of its own: a record, never a class with a lock.\n */\nrecord Selection(int anchor, int caret) {\n    /** The lower of the two offsets: where a delete of this selection would start. */\n    int start() { return Math.min(anchor, caret); }\n    /** The higher of the two offsets: one past the last selected character. */\n    int end() { return Math.max(anchor, caret); }\n    /** How many characters are highlighted. Zero means a bare caret. */\n    int length() { return end() - start(); }\n    /** True when nothing is highlighted, which is the normal typing case. */\n    boolean isEmpty() { return anchor == caret; }\n    /** A bare caret at one offset. */\n    static Selection at(int i) { return new Selection(i, i); }\n}\n\n// \"how big can one document get?\" -> the storage is the thing that changes -> hide it behind an interface -> Strategy\n/**\n * How the characters are stored. A StringBuilder is honest to about a megabyte, a gap buffer past that, a piece\n * table past that again, and every one of them answers exactly these six questions. Deliberately NOT thread-safe:\n * this is a data structure, not a service, and whoever owns it owns the lock.\n */\ninterface TextBuffer {\n    /** How many characters the document holds right now. */\n    int length();\n    /** Put s in so that its first character lands at offset at. Throws if at is outside [0, length()]. */\n    void insert(int at, String s);\n    /** Remove len characters at at and RETURN them. That return value is the whole reason undo needs no snapshot. */\n    String delete(int at, int len);\n    /** The whole document as one immutable String. O(n): the Editor pays it once per edit, readers never do. */\n    String text();\n    /** Characters in [from, to). Used by copy, by cut and by find. */\n    String substring(int from, int to);\n    /** The offset of the first occurrence of needle at or after from, or -1. Naive scan: fine at this size. */\n    int indexOf(String needle, int from);\n}\n\n/**\n * The obvious buffer, and the right one to write first in an interview: a StringBuilder. Every insert and delete\n * is an array copy of everything after the edit, which is invisible on a 20 KB file and fatal on a 10 MB one.\n */\nfinal class StringBuilderBuffer implements TextBuffer {\n    private final StringBuilder buf = new StringBuilder();\n    public int length() { return buf.length(); }\n    public void insert(int at, String s) { buf.insert(at, s); }\n    public String delete(int at, int len) { String gone = buf.substring(at, at + len); buf.delete(at, at + len); return gone; }\n    public String text() { return buf.toString(); }\n    public String substring(int from, int to) { return buf.substring(from, to); }\n    public int indexOf(String needle, int from) { return buf.indexOf(needle, from); }\n}\n\n/**\n * The real answer for an editor: one char array with a hole in it, and the hole is kept where the caret is. Typing\n * writes into the hole, so an insert at the caret is O(1) amortised however long the document is; the array copy is\n * paid once, when the caret jumps somewhere else and the hole has to follow it.\n */\nfinal class GapBuffer implements TextBuffer {\n    private char[] a;\n    private int gapStart, gapEnd;                      // the hole is [gapStart, gapEnd); everything else is text\n\n    /** A buffer with room for 64 characters before the first grow. */\n    GapBuffer() { this(64); }\n    /** A buffer sized for a document you already know the length of, so the first edits do not resize. */\n    GapBuffer(int capacity) { a = new char[Math.max(8, capacity)]; gapStart = 0; gapEnd = a.length; }\n\n    public int length() { return a.length - (gapEnd - gapStart); }\n    /** Logical offset i, jumping over the hole. This is the only place the gap is visible. */\n    private char raw(int i) { return i < gapStart ? a[i] : a[i + (gapEnd - gapStart)]; }\n\n    /**\n     * Move the hole to offset at. One System.arraycopy, and a typist never pays it, because after an insert at the\n     * caret the hole is already sitting exactly where the next keystroke lands.\n     */\n    void moveGap(int at) {\n        if (at == gapStart) return;\n        if (at < gapStart) { int n = gapStart - at; System.arraycopy(a, at, a, gapEnd - n, n); gapStart -= n; gapEnd -= n; }\n        else { int n = at - gapStart; System.arraycopy(a, gapEnd, a, gapStart, n); gapStart += n; gapEnd += n; }\n    }\n\n    /** Make sure the hole can hold need more characters; doubles the array and re-opens the hole in place. */\n    private void grow(int need) {\n        if (gapEnd - gapStart >= need) return;\n        int tail = a.length - gapEnd;\n        char[] b = new char[Math.max(a.length * 2, length() + need + 64)];\n        System.arraycopy(a, 0, b, 0, gapStart);\n        System.arraycopy(a, gapEnd, b, b.length - tail, tail);\n        a = b; gapEnd = b.length - tail;\n    }\n\n    public void insert(int at, String s) {\n        if (at < 0 || at > length()) throw new IndexOutOfBoundsException(\"insert at \" + at + \" of \" + length());\n        grow(s.length());\n        moveGap(at);\n        for (int i = 0; i < s.length(); i++) a[gapStart++] = s.charAt(i);\n    }\n\n    public String delete(int at, int len) {\n        if (at < 0 || len < 0 || at + len > length()) throw new IndexOutOfBoundsException(\"delete \" + len + \" at \" + at + \" of \" + length());\n        String gone = substring(at, at + len);\n        moveGap(at);\n        gapEnd += len;                                  // deleting is widening the hole: no characters move at all\n        return gone;\n    }\n\n    public String text() { return substring(0, length()); }\n\n    public String substring(int from, int to) {\n        if (from < 0 || to > length() || from > to) throw new IndexOutOfBoundsException(\"substring \" + from + \"..\" + to + \" of \" + length());\n        StringBuilder sb = new StringBuilder(to - from);\n        for (int i = from; i < to; i++) sb.append(raw(i));\n        return sb.toString();\n    }\n\n    public int indexOf(String needle, int from) {\n        int n = length(), m = needle.length();\n        if (m == 0) return Math.min(Math.max(from, 0), n);\n        for (int i = Math.max(from, 0); i + m <= n; i++) {\n            int k = 0;\n            while (k < m && raw(i + k) == needle.charAt(k)) k++;\n            if (k == m) return i;\n        }\n        return -1;\n    }\n}\n\n/**\n * The thing being edited: characters plus a caret. It has no lock and no synchronized method on purpose -- a lock\n * per method would make each call atomic and still let the read-then-write pair tear. The Editor owns both.\n */\nfinal class Document {\n    private final TextBuffer buf;\n    private Selection sel = Selection.at(0);\n\n    /** Build a document over whichever buffer was handed in. The document never names a concrete buffer. */\n    Document(TextBuffer buf) { this.buf = Objects.requireNonNull(buf); }\n\n    /** How many characters it holds. */\n    int length() { return buf.length(); }\n    /** The whole text, copied out. O(n); the Editor calls this once per edit to publish a snapshot. */\n    String text() { return buf.text(); }\n    /** Characters in [from, to). */\n    String substring(int from, int to) { return buf.substring(from, to); }\n    /** The offset of the first hit at or after from, or -1. */\n    int indexOf(String needle, int from) { return buf.indexOf(needle, from); }\n    /** Where the caret and the highlight are right now. */\n    Selection selection() { return sel; }\n\n    /** Highlight [anchor, caret]; a drag backwards is allowed, and puts the caret before the anchor. */\n    void select(int anchor, int caret) {\n        int n = length();\n        if (anchor < 0 || caret < 0 || anchor > n || caret > n) throw new IndexOutOfBoundsException(\"selection \" + anchor + \"..\" + caret + \" of \" + n);\n        sel = new Selection(anchor, caret);\n    }\n    /** Drop the highlight and put the bare caret at one offset. */\n    void moveTo(int caret) { select(caret, caret); }\n\n    /** Put s in at at; the caret lands after it, which is what a typist expects. */\n    void insert(int at, String s) { buf.insert(at, s); sel = Selection.at(at + s.length()); }\n    /** Take len characters out at at and hand them back; the caret lands where they used to be. */\n    String delete(int at, int len) { String gone = buf.delete(at, len); sel = Selection.at(at); return gone; }\n}\n\n// \"ctrl+Z must put it back\" -> keep the CHANGE, not the document -> the change becomes an object -> Command\n/**\n * One reversible edit. Two promises every implementation keeps: undo() exactly cancels the last execute(), and\n * execute() is repeatable -- which is why redo is simply execute() again, and not a third place for offsets to drift.\n */\ninterface EditCommand {\n    /** Apply the edit to the document. Must throw before touching anything if the edit is not legal here. */\n    void execute(Document doc);\n    /** Put the document back exactly as it was before the last execute(). */\n    void undo(Document doc);\n    /** What the Edit menu shows: \"Undo typing\", \"Undo replace all\". */\n    String label();\n    /** Which family this edit belongs to. The grouping rule reads it; nothing else does. */\n    EditKind kind();\n}\n\n/**\n * Characters going in. Self-inverse: it knows what it put in, so undoing it is deleting exactly that many\n * characters at exactly that offset. The timestamp is here so the grouping rule can ask \"was that the same burst?\".\n */\nfinal class InsertCommand implements EditCommand {\n    private final int at;\n    private final String text;\n    private final EditKind kind;\n    private final long atMs;\n\n    /** An insert of a non-empty string at a non-negative offset; an empty insert is rejected so it cannot occupy an undo step. */\n    InsertCommand(int at, String text, EditKind kind, long atMs) {\n        if (text == null || text.isEmpty()) throw new IllegalArgumentException(\"an empty insert is not an edit\");\n        if (at < 0) throw new IndexOutOfBoundsException(\"negative offset \" + at);\n        this.at = at; this.text = text; this.kind = kind; this.atMs = atMs;\n    }\n    public void execute(Document doc) { doc.insert(at, text); }\n    public void undo(Document doc) { doc.delete(at, text.length()); }\n    public String label() {\n        return switch (kind) { case TYPING -> \"typing\"; case PASTE -> \"paste\"; case REPLACE -> \"replace\"; default -> \"insert\"; };\n    }\n    public EditKind kind() { return kind; }\n\n    /** The offset this insert starts at. */\n    int at() { return at; }\n    /** The characters it puts in. */\n    String text() { return text; }\n    /** When it happened, from the injected clock. */\n    long atMs() { return atMs; }\n    /** One past the last character it wrote: where the next keystroke of the same burst would land. */\n    int endOffset() { return at + text.length(); }\n    /** A NEW command covering both, never a mutation -- a command already on the undo stack must not change under it. */\n    InsertCommand fusedWith(InsertCommand next) { return new InsertCommand(at, text + next.text, kind, next.atMs); }\n}\n\n/**\n * Characters coming out, and the crux of the whole design: a delete is not self-inverse, so to put characters back\n * it must have kept them. It stashes the removed string when it runs -- a memento sized to this one edit, not a\n * copy of the document. Undoing it before it ever ran is a broken life cycle, so it throws rather than inserting null.\n */\nfinal class DeleteCommand implements EditCommand {\n    private final int at;\n    private final int len;\n    private final EditKind kind;\n    private String removed;                            // filled by execute(), read by undo()\n\n    /** A delete of len characters at at. A zero-length delete is rejected so a no-op cannot occupy an undo step. */\n    DeleteCommand(int at, int len, EditKind kind) {\n        if (len <= 0) throw new IllegalArgumentException(\"an empty delete is not an edit\");\n        if (at < 0) throw new IndexOutOfBoundsException(\"negative offset \" + at);\n        this.at = at; this.len = len; this.kind = kind;\n    }\n    public void execute(Document doc) { removed = doc.delete(at, len); }\n    public void undo(Document doc) {\n        if (removed == null) throw new IllegalStateException(\"undo before execute: the memento is empty\");\n        doc.insert(at, removed);\n    }\n    public String label() { return \"delete\"; }\n    public EditKind kind() { return kind; }\n    /** The offset it deletes from. */\n    int at() { return at; }\n    /** How many characters it takes out. */\n    int len() { return len; }\n    /** What this delete took out, or null before it has run. */\n    String removed() { return removed; }\n}\n\n// \"forty replacements, one ctrl+Z\" -> a step that is made of steps -> Composite\n/**\n * A command made of commands: N edits, ONE undo step. Children run in order and are undone in REVERSE, because each\n * child's offsets were computed against the document as the previous child left it. If a child throws, the ones that\n * already ran are undone before the exception leaves, so a half-applied macro cannot reach the undo stack.\n */\nclass CompositeCommand implements EditCommand {\n    private final String label;\n    private final EditKind kind;\n    /** The children, in execution order. Subclasses may fill this before the first execute(). */\n    protected final List<EditCommand> parts = new ArrayList<>();\n\n    /** An empty composite that a subclass fills in later. */\n    protected CompositeCommand(String label, EditKind kind) { this.label = label; this.kind = kind; }\n    /** A composite over a known list of children, e.g. \"delete the selection, then type over it\". */\n    CompositeCommand(String label, EditKind kind, List<EditCommand> children) { this(label, kind); parts.addAll(children); }\n\n    public void execute(Document doc) {\n        Selection before = doc.selection();\n        int done = 0;\n        try { for (EditCommand c : parts) { c.execute(doc); done++; } }\n        catch (RuntimeException e) {                               // all of it or none of it\n            for (int i = done - 1; i >= 0; i--) parts.get(i).undo(doc);\n            doc.select(before.anchor(), before.caret());           // the caret too: nothing half-done\n            throw e;\n        }\n    }\n    public void undo(Document doc) { for (int i = parts.size() - 1; i >= 0; i--) parts.get(i).undo(doc); }\n    public String label() { return label; }\n    public EditKind kind() { return kind; }\n    /** How many child commands it holds. */\n    int size() { return parts.size(); }\n    /** The children, in execution order. A journal walks these; nothing else needs them. */\n    List<EditCommand> children() { return List.copyOf(parts); }\n}\n\n/**\n * Find and replace every hit as one undo step. It builds its children once, against the document as it stands, and\n * from the LAST hit backwards so that replacing a short word with a long one never moves an offset it has not used\n * yet. After that first execute it is an ordinary composite, which is what makes redo a replay rather than a re-search.\n */\nfinal class ReplaceAllCommand extends CompositeCommand {\n    private final String find;\n    private final String replacement;\n    private boolean built;\n    private int hits;\n\n    /** Replace every occurrence of find with replacement. An empty needle is refused; an empty replacement is a delete-all. */\n    ReplaceAllCommand(String find, String replacement) {\n        super(\"replace all \\\"\" + find + \"\\\" -> \\\"\" + replacement + \"\\\"\", EditKind.REPLACE);\n        if (find == null || find.isEmpty()) throw new IllegalArgumentException(\"nothing to find\");\n        this.find = find; this.replacement = replacement == null ? \"\" : replacement;\n    }\n    public void execute(Document doc) {\n        if (!built) {\n            build(doc); built = true;\n            if (parts.isEmpty()) throw new IllegalArgumentException(\"no occurrences of \\\"\" + find + \"\\\"\");\n        }\n        super.execute(doc);\n    }\n    /** Scan once, then create the children back to front so earlier offsets stay valid while later ones change. */\n    private void build(Document doc) {\n        List<Integer> at = new ArrayList<>();\n        for (int i = doc.indexOf(find, 0); i >= 0; i = doc.indexOf(find, i + find.length())) at.add(i);\n        hits = at.size();\n        for (int k = hits - 1; k >= 0; k--) {\n            parts.add(new DeleteCommand(at.get(k), find.length(), EditKind.REPLACE));\n            if (!replacement.isEmpty()) parts.add(new InsertCommand(at.get(k), replacement, EditKind.REPLACE, 0L));\n        }\n    }\n    /** How many occurrences it replaced. Valid after the first execute(). */\n    int hits() { return hits; }\n}\n\n// \"type five letters, expect one ctrl+Z\" -> and the right answer differs per product -> hide the rule -> Strategy\n/**\n * Decides whether two neighbouring edits collapse into ONE undo step. One method, because grouping is the rule\n * product changes most: typing groups, a paste never does, an audited document groups nothing at all.\n */\ninterface MergePolicy {\n    /** The fused command covering both, or null to keep them as two separate undo steps. */\n    EditCommand merge(EditCommand previous, EditCommand next);\n}\n\n/**\n * A human typing: single characters, forward, close together in time, inside one word, up to a cap so one undo step\n * is never a whole paragraph. Anything else -- a caret jump, a pause, a space, a paste -- starts a new step.\n */\nfinal class TypingBurstMergePolicy implements MergePolicy {\n    private final long windowMs;\n    private final int maxRun;\n    /** windowMs: the longest pause that still counts as the same burst. maxRun: the longest run in one undo step. */\n    TypingBurstMergePolicy(long windowMs, int maxRun) { this.windowMs = windowMs; this.maxRun = maxRun; }\n    public EditCommand merge(EditCommand previous, EditCommand next) {\n        if (!(previous instanceof InsertCommand p) || !(next instanceof InsertCommand n)) return null;\n        if (p.kind() != EditKind.TYPING || n.kind() != EditKind.TYPING) return null;\n        if (n.text().length() != 1) return null;                             // only a keystroke joins a run\n        if (n.at() != p.endOffset()) return null;                            // the caret jumped: a new step\n        if (n.atMs() - p.atMs() > windowMs) return null;                     // a pause: a new step\n        if (p.text().length() >= maxRun) return null;                        // the cap\n        if (Character.isWhitespace(p.text().charAt(p.text().length() - 1))) return null;   // a word ended\n        return p.fusedWith(n);\n    }\n}\n\n/** Never merges: every keystroke is its own undo step. What a deterministic test wants, and what an audited document wants. */\nfinal class NoMergePolicy implements MergePolicy {\n    public EditCommand merge(EditCommand previous, EditCommand next) { return null; }\n}\n\n// \"a 4 KB paste must never be swallowed into a word\" -> add the rule to every policy instead of copying it -> Decorator\n/**\n * The one rule no grouping policy is allowed to break, wrapped around all of them instead of copied into each: only\n * plain typing may ever merge. A paste, a replace-all or a macro is always its own undo step, including under a rule\n * somebody writes next year.\n */\nfinal class PasteIsItsOwnStep implements MergePolicy {\n    private final MergePolicy base;\n    /** Wraps any policy, present or future. The Editor applies this in configure(); nothing else needs to know. */\n    PasteIsItsOwnStep(MergePolicy base) { this.base = Objects.requireNonNull(base); }\n    public EditCommand merge(EditCommand previous, EditCommand next) {\n        if (previous.kind() != EditKind.TYPING || next.kind() != EditKind.TYPING) return null;\n        return base.merge(previous, next);\n    }\n}\n\n/**\n * Two stacks and a size cap. It knows nothing about text -- only about commands -- which is why replace-all, a macro\n * and a keystroke all travel through it unchanged. Three behaviours are the whole class: a new edit clears redo,\n * a redone command goes back on the undo stack without re-entering the grouping rule, and the oldest step is evicted.\n */\nfinal class UndoManager {\n    private final Deque<EditCommand> undoStack = new ArrayDeque<>();\n    private final Deque<EditCommand> redoStack = new ArrayDeque<>();\n    private final int limit;\n    private MergePolicy policy;\n    private boolean evicted;                            // once the oldest step is gone, \"back to the original\" is unreachable\n\n    /** limit is the number of undo STEPS kept, not characters; the grouping rule decides how much text a step is. */\n    UndoManager(int limit, MergePolicy policy) {\n        if (limit <= 0) throw new IllegalArgumentException(\"history limit must be positive\");\n        this.limit = limit; this.policy = Objects.requireNonNull(policy);\n    }\n    /** Swap the grouping rule at run time. The stacks are untouched; only future merges change. */\n    void setPolicy(MergePolicy p) { policy = Objects.requireNonNull(p); }\n\n    /**\n     * Record an edit that ALREADY happened. Redo is cleared first, because history here is linear: once you type\n     * after undoing, the abandoned branch is gone on purpose. Then the grouping rule gets one chance to fuse this\n     * edit into the step below it.\n     */\n    void record(EditCommand cmd) {\n        redoStack.clear();\n        EditCommand prev = undoStack.peek();\n        if (prev != null) {\n            EditCommand fused = policy.merge(prev, cmd);\n            if (fused != null) { undoStack.pop(); undoStack.push(fused); return; }\n        }\n        undoStack.push(cmd);\n        while (undoStack.size() > limit) { undoStack.removeLast(); evicted = true; }\n    }\n    /** Pop the last step, reverse it, and park it on the redo stack. The caller has already checked canUndo(). */\n    EditCommand undo(Document doc) { EditCommand c = undoStack.pop(); c.undo(doc); redoStack.push(c); return c; }\n    /** Pop the last undone step and execute it again. Not through record(): no merge, and redo is not cleared. */\n    EditCommand redo(Document doc) { EditCommand c = redoStack.pop(); c.execute(doc); undoStack.push(c); return c; }\n\n    /** Is there a step to reverse? */\n    boolean canUndo() { return !undoStack.isEmpty(); }\n    /** Is there a reversed step to re-apply? */\n    boolean canRedo() { return !redoStack.isEmpty(); }\n    /** How many undo steps are on the stack. */\n    int depth() { return undoStack.size(); }\n    /** How many redo steps are on the stack. */\n    int redoDepth() { return redoStack.size(); }\n    /** True once a step has been thrown away, which is why \"unsaved\" cannot be derived from an empty undo stack. */\n    boolean evicted() { return evicted; }\n    /** The top n step labels, newest first: exactly what the Edit menu renders. */\n    List<String> labels(int n) {\n        List<String> out = new ArrayList<>();\n        for (EditCommand c : undoStack) { if (out.size() == n) break; out.add(c.label()); }\n        return out;\n    }\n}\n\n/** The clipboard, in memory. One string, because a cut and a copy both end in \"hold this until somebody pastes it\". */\nfinal class Clipboard {\n    private volatile String content = \"\";\n    /** Replace what is held. Null is treated as empty. */\n    void put(String s) { content = s == null ? \"\" : s; }\n    /** What is held right now. */\n    String get() { return content; }\n    /** True when there is nothing to paste. */\n    boolean isEmpty() { return content.isEmpty(); }\n}\n\n/**\n * What every listener is handed after an edit lands. It carries the version, the new text AND the command itself, so\n * a renderer can repaint, a journal can write the change alone instead of the whole file, and a listener that missed\n * a version can see the gap. The command is immutable once executed; listeners read it, they never run it.\n */\nrecord EditEvent(long version, String kind, String label, String text, int caret, EditCommand command) {}\n\n// \"somebody repaints, somebody autosaves, somebody highlights\" -> the editor must not know any of them -> Observer\n/** Anybody who wants to know the document changed: a renderer, autosave, a syntax highlighter, a plugin, an audit log. */\ninterface EditListener {\n    /** Called after the edit has landed and the lock has been released. Must not throw; if it does, it is ignored. */\n    void onEdit(EditEvent event);\n}\n\n/** The simplest listener there is: keep a line per edit. Stands in for the view in a headless demo. */\nfinal class ConsoleRenderer implements EditListener {\n    private final List<String> lines = new ArrayList<>();\n    public void onEdit(EditEvent e) { lines.add(\"v\" + e.version() + \" \" + e.kind() + \" \" + e.label()); }\n    /** Everything it has been told, oldest first. */\n    List<String> lines() { return lines; }\n}\n\n/**\n * Autosave, and the reason readers never take the lock: it keeps the last published snapshot and version, which the\n * Editor handed it, and writes them on its own thread whenever it likes. \"Unsaved\" is a comparison of two versions,\n * never \"is the undo stack empty\" -- the stack lies as soon as the cap has evicted a step.\n */\nfinal class Autosave implements EditListener {\n    private volatile long latest, savedVersion;\n    private volatile String pending = \"\", written = \"\";\n    private volatile int writes;\n    public void onEdit(EditEvent e) { latest = e.version(); pending = e.text(); }\n    /** Is there anything to write? */\n    boolean isDirty() { return latest != savedVersion; }\n    /** Write whatever the last event published. A timer thread calls this; it never touches the editor or its lock. */\n    void save() { written = pending; savedVersion = latest; writes++; }\n    /** The text last written to disk. */\n    String written() { return written; }\n    /** The version last written to disk. */\n    long savedVersion() { return savedVersion; }\n    /** How many times save() actually ran. */\n    int writes() { return writes; }\n}\n\n/**\n * The only door into the document. It owns the buffer, the history, the clipboard, the lock, the version counter and\n * the published snapshot, and one rule holds the whole design together: the buffer, the history and the version move\n * together or not at all. Readers never take the lock; they read a volatile reference to an immutable String.\n * Every edit method has the same shape -- lock, read the caret, build the command, applyLocked, unlock, fire -- so\n * the lock is taken exactly once per edit and no listener ever runs while it is held.\n */\nfinal class Editor {\n    private final Document doc;\n    private final UndoManager history;\n    private final Clipboard clip = new Clipboard();\n    private final ReentrantLock lock = new ReentrantLock();   // explicit, so the span is visible and tryLock is there if needed\n    private final List<EditListener> listeners = new CopyOnWriteArrayList<>();\n    private final AtomicLong version = new AtomicLong();\n    private volatile String snapshot = \"\";\n    private Clock clock = System::currentTimeMillis;\n\n    /** A gap buffer, two hundred undo steps, and typing that groups into words: the sane default. */\n    Editor() { this(new GapBuffer(), 200, new TypingBurstMergePolicy(600, 40)); }\n    /** Everything handed in: the storage, how deep the history goes, and how edits group. The Editor builds none of them. */\n    Editor(TextBuffer buffer, int historyLimit, MergePolicy policy) {\n        this.doc = new Document(buffer);\n        this.history = new UndoManager(historyLimit, new PasteIsItsOwnStep(policy));\n    }\n\n    /** Hand in the grouping rule and any views. The rule is wrapped, so no rule -- including one written next year -- can swallow a paste. */\n    void configure(MergePolicy policy, EditListener... views) {\n        lock.lock();\n        try { history.setPolicy(new PasteIsItsOwnStep(policy)); } finally { lock.unlock(); }\n        listeners.addAll(Arrays.asList(views));\n    }\n    /** Hand in a clock. Nothing in this file reads the wall clock anywhere else. */\n    void setClock(Clock c) { clock = Objects.requireNonNull(c); }\n    /** Subscribe. A listener added later still sees every edit from then on. */\n    void addListener(EditListener l) { listeners.add(l); }\n\n    /**\n     * The critical step, and the ORDER is the design. The buffer moves first: if the command throws, the history\n     * never gains a step for an edit that did not happen, and such a step would later delete characters somebody\n     * else typed. Only after the mutation succeeds do the history, the version and the snapshot move, all under one\n     * lock. The listeners are told after the unlock, each inside a try/catch, so a broken plugin cannot break typing.\n     */\n    long apply(EditCommand cmd) {\n        EditEvent ev;\n        lock.lock();\n        try { ev = applyLocked(cmd); } finally { lock.unlock(); }\n        fire(ev);                                        // then the outside world, after the unlock\n        return ev.version();\n    }\n\n    /**\n     * The three writes that must not be split, with the lock already held. Every public edit method follows the same\n     * shape: take the lock, read the caret, build the command, call this, release, THEN fire. Nothing re-enters the\n     * lock, which is what makes \"listeners are called outside the lock\" true rather than nearly true.\n     */\n    private EditEvent applyLocked(EditCommand cmd) {\n        cmd.execute(doc);                                // 1. the mutation: this is the step that can fail\n        history.record(cmd);                             // 2. only now is there something to undo\n        return publishLocked(\"edit\", cmd);               // 3. version and snapshot, still under the lock\n    }\n\n    /** Bump the version and swap in a fresh immutable snapshot. Called with the lock held, never from outside. */\n    private EditEvent publishLocked(String kind, EditCommand cmd) {\n        long v = version.incrementAndGet();\n        snapshot = doc.text();\n        return new EditEvent(v, kind, cmd.label(), snapshot, doc.selection().caret(), cmd);\n    }\n    /** Tell every listener, one broken one at a time. A listener that throws is skipped; the edit already landed. */\n    private void fire(EditEvent ev) {\n        for (EditListener l : listeners) {\n            try { l.onEdit(ev); } catch (RuntimeException ignored) { /* a broken view is not a broken edit */ }\n        }\n    }\n\n    /** Type at the caret. A single character can join the burst below it; anything longer is its own step. */\n    long type(String s) {\n        EditEvent ev;\n        lock.lock();\n        try {\n            Selection sel = doc.selection();                         // read the caret and edit it in ONE span\n            EditKind kind = s.length() == 1 ? EditKind.TYPING : EditKind.PASTE;\n            ev = applyLocked(sel.isEmpty() ? new InsertCommand(sel.caret(), s, kind, clock.nowMs())\n                                           : replaceSelection(sel, s, kind));\n        } finally { lock.unlock(); }\n        fire(ev);\n        return ev.version();\n    }\n    /** Insert at an explicit offset, the way a plugin or a test drives the editor. */\n    long insertAt(int at, String s) { return apply(new InsertCommand(at, s, EditKind.TYPING, clock.nowMs())); }\n    /** Append at the end. Reading the length and inserting are ONE span of the lock: that pair must not tear. */\n    long append(String s) {\n        EditEvent ev;\n        lock.lock();\n        try { ev = applyLocked(new InsertCommand(doc.length(), s, EditKind.TYPING, clock.nowMs())); }\n        finally { lock.unlock(); }\n        fire(ev);\n        return ev.version();\n    }\n    /** Delete a range as one step. */\n    long deleteRange(int at, int len) { return apply(new DeleteCommand(at, len, EditKind.DELETE)); }\n\n    /** Backspace: the selection if there is one, otherwise one character before the caret. False at the start of the document. */\n    boolean backspace() {\n        EditEvent ev;\n        lock.lock();\n        try {\n            Selection sel = doc.selection();\n            if (sel.isEmpty() && sel.caret() == 0) return false;      // nothing before the caret: not an edit\n            ev = applyLocked(sel.isEmpty() ? new DeleteCommand(sel.caret() - 1, 1, EditKind.DELETE)\n                                           : new DeleteCommand(sel.start(), sel.length(), EditKind.DELETE));\n        } finally { lock.unlock(); }\n        fire(ev);\n        return true;\n    }\n\n    /** Highlight a range. Not an edit: it changes no characters, so it is not an undo step. */\n    void select(int anchor, int caret) { lock.lock(); try { doc.select(anchor, caret); } finally { lock.unlock(); } }\n    /** Move the bare caret. Also not an edit -- but it does end a typing burst, because the next insert is not contiguous. */\n    void moveTo(int caret) { lock.lock(); try { doc.moveTo(caret); } finally { lock.unlock(); } }\n\n    /** Copy the selection to the clipboard. Changes no text, so it is not an undo step. */\n    boolean copy() {\n        lock.lock();\n        try {\n            Selection s = doc.selection();\n            if (s.isEmpty()) return false;\n            clip.put(doc.substring(s.start(), s.end()));\n            return true;\n        } finally { lock.unlock(); }\n    }\n    /** Cut IS an edit: one delete command, so one ctrl+Z puts the whole selection back at once. */\n    boolean cut() {\n        EditEvent ev;\n        lock.lock();\n        try {\n            Selection s = doc.selection();\n            if (s.isEmpty()) return false;\n            clip.put(doc.substring(s.start(), s.end()));\n            ev = applyLocked(new DeleteCommand(s.start(), s.length(), EditKind.DELETE));\n        } finally { lock.unlock(); }\n        fire(ev);\n        return true;\n    }\n    /** Paste at the caret, replacing the selection if there is one. One step however big it is. */\n    boolean paste() {\n        EditEvent ev;\n        lock.lock();\n        try {\n            if (clip.isEmpty()) return false;\n            Selection s = doc.selection();\n            ev = applyLocked(s.isEmpty() ? new InsertCommand(s.caret(), clip.get(), EditKind.PASTE, clock.nowMs())\n                                         : replaceSelection(s, clip.get(), EditKind.PASTE));\n        } finally { lock.unlock(); }\n        fire(ev);\n        return true;\n    }\n    /** Delete the highlight and put s in its place, as ONE undo step. Used by typing over a selection and by paste. */\n    private EditCommand replaceSelection(Selection sel, String s, EditKind kind) {\n        return new CompositeCommand(\"replace selection\", EditKind.MACRO,\n            List.of(new DeleteCommand(sel.start(), sel.length(), EditKind.DELETE),\n                    new InsertCommand(sel.start(), s, kind, clock.nowMs())));\n    }\n\n    /** Replace every occurrence, as ONE undo step. The Editor gains no machinery: it is a command like any other. */\n    int replaceAll(String find, String replacement) {\n        EditEvent ev;\n        ReplaceAllCommand cmd;\n        lock.lock();\n        try {\n            if (doc.indexOf(find, 0) < 0) return 0;\n            cmd = new ReplaceAllCommand(find, replacement);\n            ev = applyLocked(cmd);\n        } finally { lock.unlock(); }\n        fire(ev);\n        return cmd.hits();\n    }\n\n    /** Reverse the last step. Returns false rather than throwing when there is nothing to undo. */\n    boolean undo() {\n        EditEvent ev;\n        lock.lock();\n        try {\n            if (!history.canUndo()) return false;\n            ev = publishLocked(\"undo\", history.undo(doc));\n        } finally { lock.unlock(); }\n        fire(ev);\n        return true;\n    }\n    /** Re-apply the last reversed step. Returns false when the redo stack is empty -- including right after a new edit. */\n    boolean redo() {\n        EditEvent ev;\n        lock.lock();\n        try {\n            if (!history.canRedo()) return false;\n            ev = publishLocked(\"redo\", history.redo(doc));\n        } finally { lock.unlock(); }\n        fire(ev);\n        return true;\n    }\n\n    /** The text, with no lock at all: a volatile reference to an immutable String that the lock swapped in. */\n    String text() { return snapshot; }\n    /** A window of the text for a viewport, off the same snapshot; the UI never copies a whole document to draw a screen. */\n    String textRange(int from, int to) {\n        String s = snapshot;\n        return s.substring(Math.max(0, Math.min(from, s.length())), Math.max(0, Math.min(to, s.length())));\n    }\n    /** How many edits have landed. A listener that jumps from 7 to 9 knows it missed one. */\n    long version() { return version.get(); }\n    /** Greys out the Edit menu. */\n    boolean canUndo() { lock.lock(); try { return history.canUndo(); } finally { lock.unlock(); } }\n    /** Greys out the Edit menu. */\n    boolean canRedo() { lock.lock(); try { return history.canRedo(); } finally { lock.unlock(); } }\n    /** How many undo steps are waiting. */\n    int undoDepth() { lock.lock(); try { return history.depth(); } finally { lock.unlock(); } }\n    /** How many redo steps are waiting. */\n    int redoDepth() { lock.lock(); try { return history.redoDepth(); } finally { lock.unlock(); } }\n    /** The top n labels for the Edit menu, newest first. */\n    List<String> undoLabels(int n) { lock.lock(); try { return history.labels(n); } finally { lock.unlock(); } }\n    /** True once the cap has thrown a step away, so \"unsaved\" must not be derived from an empty undo stack. */\n    boolean historyEvicted() { lock.lock(); try { return history.evicted(); } finally { lock.unlock(); } }\n    /** Where the caret and the highlight are. */\n    Selection selection() { lock.lock(); try { return doc.selection(); } finally { lock.unlock(); } }\n    /** What is on the clipboard. */\n    String clipboard() { return clip.get(); }\n}\n\n/** Runs the editor: a demo of every claim on page 02, then the race that proves the lock earns its keep. */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        ConsoleRenderer view = new ConsoleRenderer();\n        Autosave disk = new Autosave();\n        long[] now = { 1_700_000_000_000L };\n        Editor ed = new Editor(new GapBuffer(), 4, new TypingBurstMergePolicy(600, 40));\n        ed.configure(new TypingBurstMergePolicy(600, 40), view, disk);\n        ed.setClock(() -> now[0]);\n\n        // 1. typing collapses into words; the clock says the keystrokes were 40 ms apart\n        for (char c : \"hello world\".toCharArray()) { ed.type(String.valueOf(c)); now[0] += 40; }\n        System.out.println(\"1. typing:      \\\"\" + ed.text() + \"\\\"  undo steps=\" + ed.undoDepth() + \"  menu=\" + ed.undoLabels(3));\n\n        // 2. a paste is always its own step, whatever the grouping rule says\n        ed.type(\"[4 KB of pasted text]\");\n        System.out.println(\"2. paste:       \\\"\" + ed.text() + \"\\\"  undo steps=\" + ed.undoDepth() + \"  menu=\" + ed.undoLabels(3));\n        ed.undo();\n        System.out.println(\"   one ctrl+Z:  \\\"\" + ed.text() + \"\\\"  the paste came out in one piece\");\n\n        // 3. delete puts back exactly what it took, including from the middle\n        ed.deleteRange(5, 6);\n        System.out.println(\"3. delete:      \\\"\" + ed.text() + \"\\\"\");\n        ed.undo();\n        System.out.println(\"   undo:        \\\"\" + ed.text() + \"\\\"  the characters are the ones that left\");\n\n        // 4. a new edit clears the redo branch on purpose\n        ed.undo(); ed.undo();\n        System.out.println(\"4. two undos:   \\\"\" + ed.text() + \"\\\"  canRedo=\" + ed.canRedo());\n        ed.type(\"!\");\n        System.out.println(\"   then type:   \\\"\" + ed.text() + \"\\\"  canRedo=\" + ed.canRedo() + \"  (the branch is gone)\");\n\n        // 5. the cap evicts the oldest step, so \"unsaved\" cannot be derived from an empty stack\n        for (int i = 0; i < 6; i++) { ed.type(\"x\"); now[0] += 5000; }        // a pause each time: six separate steps\n        System.out.println(\"5. cap of 4:    six more steps into a four-step history -> undo steps=\" + ed.undoDepth()\n            + \"  evicted=\" + ed.historyEvicted());\n        while (ed.undo()) { /* wind it all the way back */ }\n        System.out.println(\"   undo all:    \\\"\" + ed.text() + \"\\\"  not empty: the oldest steps were thrown away\");\n\n        // 6. cut, paste and replace-all: one step each\n        Editor doc = new Editor(new GapBuffer(), 200, new NoMergePolicy());\n        doc.type(\"the cat sat on the cat mat with a cat\");\n        doc.select(4, 7);\n        doc.cut();\n        System.out.println(\"6. cut \\\"\" + doc.clipboard() + \"\\\": \\\"\" + doc.text() + \"\\\"\");\n        doc.moveTo(doc.text().length());\n        doc.paste();\n        System.out.println(\"   paste:       \\\"\" + doc.text() + \"\\\"\");\n        int hits = doc.replaceAll(\"cat\", \"dog\");\n        System.out.println(\"   replaceAll:  \\\"\" + doc.text() + \"\\\"  hits=\" + hits + \"  undo steps=\" + doc.undoDepth());\n        doc.undo();\n        System.out.println(\"   one ctrl+Z:  \\\"\" + doc.text() + \"\\\"  \" + hits + \" replacements, one step\");\n        doc.redo();\n        System.out.println(\"   redo:        \\\"\" + doc.text() + \"\\\"  redo is execute() again, not a re-search\");\n\n        // 7. autosave read the published snapshot; it never took the lock\n        disk.save();\n        System.out.println(\"7. autosave:    version \" + disk.savedVersion() + \" on disk, dirty=\" + disk.isDirty()\n            + \", the view saw \" + view.lines().size() + \" events\");\n\n        // 8. the race, the cheap way: four threads doing length-then-insert on a raw Document\n        Document raw = new Document(new StringBuilderBuffer());\n        runRace(4, 500, i -> { try { raw.insert(raw.length(), \"x\"); } catch (RuntimeException ignored) { } });\n        System.out.println(\"8. no lock:     wanted 2000 characters, got \" + raw.length()\n            + (raw.length() == 2000 ? \"  (lucky this run; run it again)\" : \"  (read-then-write tears)\"));\n\n        // 9. the same load through the Editor: one lock over mutate + record + version + snapshot\n        Editor safe = new Editor(new GapBuffer(4096), 4096, new NoMergePolicy());\n        runRace(8, 250, i -> safe.append(\"x\"));\n        System.out.println(\"9. one lock:    \" + safe.text().length() + \" characters, \" + safe.undoDepth()\n            + \" undo steps, version \" + safe.version());\n        while (safe.undo()) { /* wind the whole document back */ }\n        System.out.println(\"   2000 undos:  length=\" + safe.text().length() + \"  (right length AND right history)\");\n    }\n\n    /** threads x each calls body, all released at the same instant by one latch. */\n    static void runRace(int threads, int each, java.util.function.IntConsumer body) throws Exception {\n        ExecutorService pool = Executors.newFixedThreadPool(threads);\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<?>> fs = new ArrayList<>();\n        for (int t = 0; t < threads; t++) {\n            fs.add(pool.submit(() -> {\n                go.await();\n                for (int i = 0; i < each; i++) body.accept(i);\n                return null;\n            }));\n        }\n        go.countDown();\n        for (Future<?> f : fs) f.get();\n        pool.shutdown();\n    }\n}\n", "f1": "import java.util.*;\nimport java.util.concurrent.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: a piece table -- the same TextBuffer, so exactly ONE class changes when the file gets big\n/**\n * A third buffer for documents a gap buffer cannot carry. The original text is never touched; everything typed is\n * appended to one growing add-buffer; the document is a list of pieces saying \"take 12 characters from the original\n * at 40, then 3 from the add-buffer at 0\". An insert or a delete rewrites two or three list entries and copies no\n * characters at all, so a 10 MB file edits as fast as an empty one.\n *\n * Reads here are deliberately naive (build the string, then slice it) to keep the block short. A production one\n * walks the piece list, and the Editor's snapshot becomes a lazy view over it instead of a copy per keystroke --\n * which is the second rung of the ladder on page 02, move 8. A rope is the other answer: O(log n) for reads AND\n * writes and no add-buffer growth, at the price of a tree to rebalance. Nothing outside this class changes.\n */\nfinal class PieceTableBuffer implements TextBuffer {\n    private enum Src { ORIGINAL, ADDED }\n    private record

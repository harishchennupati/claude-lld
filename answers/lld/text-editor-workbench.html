er edit</text><text x=\"300.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">publish version + changed range, or a piece table whose snapshot is a view</text></g><g transform=\"translate(600 164)\"><rect width=\"600\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 more than one author is not a lock problem</text><text x=\"300.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">operational transformation or a CRDT; a stack cannot express it</text></g><text x=\"615\" y=\"228\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">say the arithmetic before you climb: a lock that is busy sixteen microseconds a second does not need a queue, a striped map or an actor</text></svg></div><div class=\"move\"><p>A fast typist is eight keystrokes a second, not eight thousand. At two microseconds of lock each, that is sixteen microseconds of lock in every second: the lock is busy about two thousandths of one per cent of the time, and two writers in one document collide roughly never. The lock is per document, so twenty open tabs never meet each other at all. Then the ladder, in the order you would climb it. First, keep the repaint and the persistence outside the lock, which this code already does. Second, stop copying the whole document on every edit: publish the version and the changed range and let readers pull <code>textRange</code>, or swap the buffer for a piece table whose snapshot is a lazy view &mdash; and because <code>TextBuffer</code> is an interface, exactly one class changes. Third, and this is the one to say out loud: past one author per document it stops being a lock problem. Two humans need operational transformation or a CRDT, and no amount of locking makes a stack able to say \"undo mine, keep yours\".</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 370\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 16)\"><rect width=\"400\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new edit after an undo leaves a stale redo stack</text></g><path d=\"M430 33 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 16)\"><rect width=\"730\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"365.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">record() clears redo first; test 3: redo returns false, the branch is gone</text></g><g transform=\"translate(30 54)\"><rect width=\"400\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a delete that did not keep what it removed</text></g><path d=\"M430 71 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 54)\"><rect width=\"730\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"365.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the command stashes it on execute; test 2: undo restores the exact characters</text></g><g transform=\"translate(30 92)\"><rect width=\"400\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the buffer moved but the history did not</text></g><path d=\"M430 109 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 92)\"><rect width=\"730\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"365.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">both inside one lock; test 1: 2000 appends, 2000 steps, 2000 undos to empty</text></g><g transform=\"translate(30 130)\"><rect width=\"400\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a 4 KB paste swallowed into a typing burst</text></g><path d=\"M430 147 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 130)\"><rect width=\"730\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"365.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the wrapper on the rule; test 8: a paste is always its own step</text></g><g transform=\"translate(30 168)\"><rect width=\"400\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an edit that threw still got an undo step</text></g><path d=\"M430 185 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 168)\"><rect width=\"730\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"365.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">record only after execute succeeded; test 6: no text, version or step changed</text></g><g transform=\"translate(30 206)\"><rect width=\"400\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a slow or throwing plugin stalls the typist</text></g><path d=\"M430 223 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 206)\"><rect width=\"730\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"365.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">fire after the unlock, in a try/catch; test 7: another thread edits mid-notify</text></g><g transform=\"translate(30 244)\"><rect width=\"400\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the gap left in the wrong place after a caret jump</text></g><path d=\"M430 261 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 244)\"><rect width=\"730\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"365.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">moveGap on every edit; test 4: 30 edits match a StringBuilder exactly</text></g><g transform=\"translate(30 282)\"><rect width=\"400\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the line index drifts from the text after an undo</text></g><path d=\"M430 299 H470\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(470 282)\"><rect width=\"730\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"365.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">it rides on insert/delete; test 9: 150 edits match a full rescan</text></g><text x=\"615\" y=\"338\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the three worst ones are silent: a stale redo stack, a history that disagrees with the buffer, and a paste swallowed into a word.</text><text x=\"615\" y=\"357\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">nothing throws, the document is simply wrong later -- which is why each of them is a test, not a comment. Nine blocks, and ALL PASS or the page does not build.</text></svg></div><div class=\"move\"><p>Sort them by how loud they are. Three of these bugs throw, and you would find them in a minute: an insert past the end, an undo before the execute, a composite whose second child is illegal. The other five are silent, and they are the ones worth testing in front of an interviewer &mdash; a stale redo stack that re-applies an edit at an offset that no longer exists, a buffer and a history that quietly disagree after a race, a four-kilobyte paste swallowed into a word, a gap left in the wrong place, an index that drifted from the text. Nothing goes wrong when they happen; the document is simply wrong later, and nobody knows which keystroke did it. So each one gets a few lines in FailureTests.java that state the claim as a sentence, and the test for the race deliberately checks three numbers rather than one: two thousand characters with 1997 undo steps is still a broken editor.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 390\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"18\" width=\"1190\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"36.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"36.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"36.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"860\" y=\"36.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"46\" width=\"1190\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"64.0\" font-size=\"11\" fill=\"var(--text)\">Command</text><text x=\"220\" y=\"64.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"310\" y=\"64.0\" font-size=\"11\" fill=\"var(--text)\">interface EditCommand { execute(doc); undo(doc); label(); }</text><text x=\"860\" y=\"64.0\" font-size=\"11\" fill=\"var(--text)\">undo without copying the document</text><rect x=\"20\" y=\"74\" width=\"1190\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"92.0\" font-size=\"11\" fill=\"var(--text)\">Memento</text><text x=\"220\" y=\"92.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"310\" y=\"92.0\" font-size=\"11\" fill=\"var(--text)\">DeleteCommand keeps `removed` when it runs</text><text x=\"860\" y=\"92.0\" font-size=\"11\" fill=\"var(--text)\">the smallest state that reverses THIS edit</text><rect x=\"20\" y=\"102\" width=\"1190\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"120.0\" font-size=\"11\" fill=\"var(--text)\">Composite</text><text x=\"220\" y=\"120.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"310\" y=\"120.0\" font-size=\"11\" fill=\"var(--text)\">ReplaceAllCommand: children in order, undone in reverse</text><text x=\"860\" y=\"120.0\" font-size=\"11\" fill=\"var(--text)\">forty replacements, one ctrl+Z</text><rect x=\"20\" y=\"130\" width=\"1190\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"148.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"148.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"148.0\" font-size=\"11\" fill=\"var(--text)\">interface TextBuffer, interface MergePolicy</text><text x=\"860\" y=\"148.0\" font-size=\"11\" fill=\"var(--text)\">a piece table is a class, not an edit</text><rect x=\"20\" y=\"158\" width=\"1190\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"176.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"176.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"176.0\" font-size=\"11\" fill=\"var(--text)\">PasteIsItsOwnStep(rule), RestoresSelection(cmd), LineIndexedBuffer(buf)</text><text x=\"860\" y=\"176.0\" font-size=\"11\" fill=\"var(--text)\">wrap a rule, a command or the storage</text><rect x=\"20\" y=\"186\" width=\"1190\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"204.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"204.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"204.0\" font-size=\"11\" fill=\"var(--text)\">fire(ev) after the unlock, inside a try/catch</text><text x=\"860\" y=\"204.0\" font-size=\"11\" fill=\"var(--text)\">the view repaints; the typist never waits</text><rect x=\"20\" y=\"214\" width=\"1190\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"232.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"220\" y=\"232.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"232.0\" font-size=\"11\" fill=\"var(--text)\">record() clears redo; undo/redo move between the stacks</text><text x=\"860\" y=\"232.0\" font-size=\"11\" fill=\"var(--text)\">the stale-redo bug cannot happen</text><rect x=\"20\" y=\"242\" width=\"1190\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"260.0\" font-size=\"11\" fill=\"var(--muted)\">Flyweight</text><text x=\"220\" y=\"260.0\" font-size=\"11\" fill=\"var(--text)\">not in Main</text><text x=\"310\" y=\"260.0\" font-size=\"11\" fill=\"var(--muted)\">Style.of(bold, italic, colour) interns; rich text is a follow-up</text><text x=\"860\" y=\"260.0\" font-size=\"11\" fill=\"var(--muted)\">a million bold characters, one object</text><rect x=\"20\" y=\"270\" width=\"1190\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"288.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"220\" y=\"288.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"288.0\" font-size=\"11\" fill=\"var(--muted)\">the Editor is handed to its callers; nothing calls getInstance()</text><text x=\"860\" y=\"288.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh Editor per case</text><rect x=\"20\" y=\"298\" width=\"1190\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"316.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"220\" y=\"316.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"316.0\" font-size=\"11\" fill=\"var(--muted)\">commands are built at three call sites inside the Editor</text><text x=\"860\" y=\"316.0\" font-size=\"11\" fill=\"var(--muted)\">earns the name when commands come from a journal</text><rect x=\"20\" y=\"326\" width=\"1190\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"344.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"220\" y=\"344.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"310\" y=\"344.0\" font-size=\"11\" fill=\"var(--muted)\">an insert is an offset and a string; both are required</text><text x=\"860\" y=\"344.0\" font-size=\"11\" fill=\"var(--muted)\">a builder here would be pure ceremony</text><text x=\"615\" y=\"375\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>Every pattern here came out of a move, which is why each can be defended in one sentence. <b>Command</b> is move 2: undo needs the last change rather than the last document, so the change became an object. <b>Memento</b> is the same move's second half: <code>DeleteCommand</code> keeps the string it removed &mdash; the smallest state that reverses this one edit, not a copy of the file. <b>Composite</b> is move 2 again: replace-all is a command made of commands, which is why forty replacements are one ctrl+Z and the Editor gained no method. <b>Strategy</b> is move 3, twice: the buffer and the grouping rule. <b>Decorator</b> is move 3's wrapper and it ends up doing three jobs: <code>PasteIsItsOwnStep</code> adds one invariant to every grouping rule, <code>RestoresSelection</code> adds a caret restore to any command, and <code>LineIndexedBuffer</code> adds a line index to any storage &mdash; three features, and not one existing class was opened. <b>Observer</b> is move 3's rule that a window must never be inside the lock. <b>State</b> is move 6, the four history states and the edge that clears redo. <b>Flyweight</b> did not earn a place in Main at all &mdash; it arrives with rich text on page 05, where <code>Style.of(...)</code> interns so a million bold characters share one object. Singleton earned nothing: the Editor is handed to its callers, so a test builds a fresh one per case. Factory is \"not yet\": commands are built at three call sites inside the Editor, and it earns the name the day they arrive as lines from a journal. Builder is \"never\" here: an insert is an offset and a string, and both are required. A pattern without a move behind it is decoration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 262\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"18\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"450\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"560\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"52\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"73.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"73.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"450\" y=\"73.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"560\" y=\"73.0\" font-size=\"11\" fill=\"var(--text)\">Document knows characters; UndoManager knows stacks and never text; the Editor knows sequencing.</text><rect x=\"20\" y=\"86\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"107.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"107.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"450\" y=\"107.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"107.0\" font-size=\"11\" fill=\"var(--text)\">ReplaceAllCommand and PieceTableBuffer are new files plus one changed line</text><rect x=\"20\" y=\"120\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"141.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"141.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"450\" y=\"141.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"560\" y=\"141.0\" font-size=\"11\" fill=\"var(--text)\">history.undo(doc) pops any command and calls undo blindly &mdash; a composite included</text><rect x=\"20\" y=\"154\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"175.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"175.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one job each</text><text x=\"450\" y=\"175.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"175.0\" font-size=\"11\" fill=\"var(--text)\">MergePolicy and EditListener have ONE method; the merge rule never learns what a Document is</text><rect x=\"20\" y=\"188\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"209.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"209.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"450\" y=\"209.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"560\" y=\"209.0\" font-size=\"11\" fill=\"var(--text)\">new Editor(buffer, limit, policy); setClock(() -&gt; t); commands take the Document as a parameter</text><text x=\"615\" y=\"248\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>The table is the check; what is worth saying out loud is the evidence behind it, and the two places this design bends its own rules on purpose. The evidence: replace-all, macros, rich text and a line index were all added without opening the Document, the UndoManager or the Editor (S and O); a composite is genuinely substitutable because it keeps both promises &mdash; execute is repeatable, undo is exact &mdash; by replaying its children in reverse (L); and every fake a test needs is a lambda, because the interfaces that matter have one method each (I and D). Now the two bends. <code>EditEvent</code> carries the command object itself, which ties a listener to the command types; a journal needs exactly that, and inventing a second event format to avoid it would be more coupling, not less. And <code>ReplaceAllCommand</code> extends <code>CompositeCommand</code> instead of holding one, which is inheritance used for reuse &mdash; honest here because it really is a composite that fills in its own children, and the day it needs to be anything else it should hold one instead. Saying where you bent a rule, and why, lands better than reciting the five letters.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 340\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a piece table, a different grouping</text></g><path d=\"M360 42 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 20)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind TextBuffer or MergePolicy, handed in</text></g><text x=\"1150\" y=\"47\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 74)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">highlighting, autosave, a plugin</text></g><path d=\"M360 96 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 74)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more EditListener; the buffer and the lock do not change</text></g><text x=\"1150\" y=\"101\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 128)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a macro: begin, record, end</text></g><path d=\"M360 150 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 128)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more command kind and one composite; record() is untouched</text></g><text x=\"1150\" y=\"155\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 182)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across things</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the caret must move with the text</text></g><path d=\"M360 204 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 182)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the caret write inside the SAME lock as the edit: all or nothing</text></g><text x=\"1150\" y=\"209\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 236)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reopen the file with its undo stack</text></g><path d=\"M360 258 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 236)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a journal of commands written after the unlock, and a replay loop</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">commands were already data, so persistence is a codec, not a redesign</text></g><text x=\"1150\" y=\"263\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"308\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and the honest one that is NOT on this list: two people on one buffer. A stack cannot say \"undo mine, keep yours\", because your edit moved my offsets.</text><text x=\"615\" y=\"327\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">That is operational transformation or a CRDT, and naming the boundary is worth more in the room than any extra feature.</text></svg></div><div class=\"move\"><p>A new rule (a piece table for a ten-megabyte file, a grouping rule that never merges, \"bold this selection\") is a new class behind an existing interface. Someone new who wants to know (incremental syntax highlighting, autosave, a third-party plugin) is one more listener; the buffer, the history and the lock do not change. A new step in a life (a macro with an explicit begin and end) is one more composite; <code>record</code> is untouched. A new invariant across things (the caret must move with the text, even when a macro fails half way) is the extra write inside the <i>same</i> lock, all or nothing. State that must outlive the process (reopen the file with its undo stack intact) is a journal of commands written after the unlock and a replay loop &mdash; and it is small precisely because commands were already data, so persistence is a codec rather than a redesign. Then say the sixth thing, which is not on the list: two people on one buffer. A stack cannot express \"undo mine, keep yours\", because your edit moved my offsets. That is operational transformation or a CRDT, and naming the boundary beats any feature you could add instead. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 860\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M130.0 184L130.0 166\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M250 309.0L256 309L256 139L250 139.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M300 60L284 60L284 104L130 104L130 112\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><path d=\"M130.0 362L130.0 380\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"136.0\" y=\"375.0\" font-size=\"10.5\" fill=\"var(--muted)\">receives</text><path d=\"M250 67.0L262 67L262 86L300 86\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M470.0 354L470.0 380\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"476.0\" y=\"371.0\" font-size=\"10.5\" fill=\"var(--muted)\">owns</text><path d=\"M300 240L292 240L292 661L300 661\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M300 160L268 160L268 troke-width=\"1.2\"/><text x=\"126.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CompositeCommand</text><line x1=\"0\" y1=\"26\" x2=\"253\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">label / kind</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">parts: List&lt;EditCommand&gt;</text><line x1=\"0\" y1=\"64\" x2=\"253\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">execute: in order, all or none</text><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">undo: in reverse</text></g><g transform=\"translate(960 700)\"><rect width=\"253\" height=\"106\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"126.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ReplaceAllCommand</text><line x1=\"0\" y1=\"26\" x2=\"253\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">find / replacement: String</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">parts: built on first execute</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">hits: int</text><line x1=\"0\" y1=\"80\" x2=\"253\" y2=\"80\" stroke=\"var(--line)\"/><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">40 hits, ONE ctrl+Z</text></g><g><path d=\"M20 838L64 838\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"842\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 838L284 838\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"842\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 838L504 838\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"842\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 838L684 838\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"842\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 838L904 838\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"842\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the Editor owns the Document, the UndoManager and the Clipboard, and they die with it. Plain arrow = references: the UndoManager holds commands it did not create and does not own. Dashed green = handed in (the buffer, the grouping rule, the clock). Dotted blue = notifies. <b>Where state lives:</b> the characters live in one TextBuffer behind the Document and nowhere else; the caret lives beside them in the same Document, which is why the lock covers both; the undo history is two deques of commands and never a single character of text; each command carries the smallest state that reverses it &mdash; an insert carries its string, a delete carries the string it removed; and the Editor holds the only lock, the version counter and the published snapshot. Notice what is <i>not</i> here: no Version or Snapshot class, because a snapshot is an immutable String and a version is a number; and no separate Redo type, because redo is <code>execute()</code> on the same command.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (nine blocks of claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/** What kind of edit this is. The grouping rule and the Edit menu read it; nothing else in the system branches on it. */\nenum EditKind { TYPING, PASTE, DELETE, REPLACE, MACRO }\n\n/** Where time comes from. Injected, so a test decides whether two keystrokes were forty milliseconds or forty minutes apart. */\ninterface Clock { long nowMs(); }\n\n/**\n * Where the caret is and what is highlighted. anchor is where the drag started, caret is where it is now, so a\n * backwards selection has its caret before its anchor. Two ints and no behaviour of its own: a record, never a class with a lock.\n */\nrecord Selection(int anchor, int caret) {\n    /** The lower of the two offsets: where a delete of this selection would start. */\n    int start() { return Math.min(anchor, caret); }\n    /** The higher of the two offsets: one past the last selected character. */\n    int end() { return Math.max(anchor, caret); }\n    /** How many characters are highlighted. Zero means a bare caret. */\n    int length() { return end() - start(); }\n    /** True when nothing is highlighted, which is the normal typing case. */\n    boolean isEmpty() { return anchor == caret; }\n    /** A bare caret at one offset. */\n    static Selection at(int i) { return new Selection(i, i); }\n}\n\n// &quot;how big can one document get?&quot; -&gt; the storage is the thing that changes -&gt; hide it behind an interface -&gt; Strategy\n/**\n * How the characters are stored. A StringBuilder is honest to about a megabyte, a gap buffer past that, a piece\n * table past that again, and every one of them answers exactly these six questions. Deliberately NOT thread-safe:\n * this is a data structure, not a service, and whoever owns it owns the lock.\n */\ninterface TextBuffer {\n    /** How many characters the document holds right now. */\n    int length();\n    /** Put s in so that its first character lands at offset at. Throws if at is outside [0, length()]. */\n    void insert(int at, String s);\n    /** Remove len characters at at and RETURN them. That return value is the whole reason undo needs no snapshot. */\n    String delete(int at, int len);\n    /** The whole document as one immutable String. O(n): the Editor pays it once per edit, readers never do. */\n    String text();\n    /** Characters in [from, to). Used by copy, by cut and by find. */\n    String substring(int from, int to);\n    /** The offset of the first occurrence of needle at or after from, or -1. Naive scan: fine at this size. */\n    int indexOf(String needle, int from);\n}\n\n/**\n * The obvious buffer, and the right one to write first in an interview: a StringBuilder. Every insert and delete\n * is an array copy of everything after the edit, which is invisible on a 20 KB file and fatal on a 10 MB one.\n */\nfinal class StringBuilderBuffer implements TextBuffer {\n    private final StringBuilder buf = new StringBuilder();\n    public int length() { return buf.length(); }\n    public void insert(int at, String s) { buf.insert(at, s); }\n    public String delete(int at, int len) { String gone = buf.substring(at, at + len); buf.delete(at, at + len); return gone; }\n    public String text() { return buf.toString(); }\n    public String substring(int from, int to) { return buf.substring(from, to); }\n    public int indexOf(String needle, int from) { return buf.indexOf(needle, from); }\n}\n\n/**\n * The real answer for an editor: one char array with a hole in it, and the hole is kept where the caret is. Typing\n * writes into the hole, so an insert at the caret is O(1) amortised however long the document is; the array copy is\n * paid once, when the caret jumps somewhere else and the hole has to follow it.\n */\nfinal class GapBuffer implements TextBuffer {\n    private char[] a;\n    private int gapStart, gapEnd;                      // the hole is [gapStart, gapEnd); everything else is text\n\n    /** A buffer with room for 64 characters before the first grow. */\n    GapBuffer() { this(64); }\n    /** A buffer sized for a document you already know the length of, so the first edits do not resize. */\n    GapBuffer(int capacity) { a = new char[Math.max(8, capacity)]; gapStart = 0; gapEnd = a.length; }\n\n    public int length() { return a.length - (gapEnd - gapStart); }\n    /** Logical offset i, jumping over the hole. This is the only place the gap is visible. */\n    private char raw(int i) { return i &lt; gapStart ? a[i] : a[i + (gapEnd - gapStart)]; }\n\n    /**\n     * Move the hole to offset at. One System.arraycopy, and a typist never pays it, because after an insert at the\n     * caret the hole is already sitting exactly where the next keystroke lands.\n     */\n    void moveGap(int at) {\n        if (at == gapStart) return;\n        if (at &lt; gapStart) { int n = gapStart - at; System.arraycopy(a, at, a, gapEnd - n, n); gapStart -= n; gapEnd -= n; }\n        else { int n = at - gapStart; System.arraycopy(a, gapEnd, a, gapStart, n); gapStart += n; gapEnd += n; }\n    }\n\n    /** Make sure the hole can hold need more characters; doubles the array and re-opens the hole in place. */\n    private void grow(int need) {\n        if (gapEnd - gapStart &gt;= need) return;\n        int tail = a.length - gapEnd;\n        char[] b = new char[Math.max(a.length * 2, length() + need + 64)];\n        System.arraycopy(a, 0, b, 0, gapStart);\n        System.arraycopy(a, gapEnd, b, b.length - tail, tail);\n        a = b; gapEnd = b.length - tail;\n    }\n\n    public void insert(int at, String s) {\n        if (at &lt; 0 || at &gt; length()) throw new IndexOutOfBoundsException(&quot;insert at &quot; + at + &quot; of &quot; + length());\n        grow(s.length());\n        moveGap(at);\n        for (int i = 0; i &lt; s.length(); i++) a[gapStart++] = s.charAt(i);\n    }\n\n    public String delete(int at, int len) {\n        if (at &lt; 0 || len &lt; 0 || at + len &gt; length()) throw new IndexOutOfBoundsException(&quot;delete &quot; + len + &quot; at &quot; + at + &quot; of &quot; + length());\n        String gone = substring(at, at + len);\n        moveGap(at);\n        gapEnd += len;                                  // deleting is widening the hole: no characters move at all\n        return gone;\n    }\n\n    public String text() { return substring(0, length()); }\n\n    public String substring(int from, int to) {\n        if (from &lt; 0 || to &gt; length() || from &gt; to) throw new IndexOutOfBoundsException(&quot;substring &quot; + from + &quot;..&quot; + to + &quot; of &quot; + length());\n        StringBuilder sb = new StringBuilder(to - from);\n        for (int i = from; i &lt; to; i++) sb.append(raw(i));\n        return sb.toString();\n    }\n\n    public int indexOf(String needle, int from) {\n        int n = length(), m = needle.length();\n        if (m == 0) return Math.min(Math.max(from, 0), n);\n        for (int i = Math.max(from, 0); i + m &lt;= n; i++) {\n            int k = 0;\n            while (k &lt; m &amp;&amp; raw(i + k) == needle.charAt(k)) k++;\n            if (k == m) return i;\n        }\n        return -1;\n    }\n}\n\n/**\n * The thing being edited: characters plus a caret. It has no lock and no synchronized method on purpose -- a lock\n * per method would make each call atomic and still let the read-then-write pair tear. The Editor owns both.\n */\nfinal class Document {\n    private final TextBuffer buf;\n    private Selection sel = Selection.at(0);\n\n    /** Build a document over whichever buffer was handed in. The document never names a concrete buffer. */\n    Document(TextBuffer buf) { this.buf = Objects.requireNonNull(buf); }\n\n    /** How many characters it holds. */\n    int length() { return buf.length(); }\n    /** The whole text, copied out. O(n); the Editor calls this once per edit to publish a snapshot. */\n    String text() { return buf.text(); }\n    /** Characters in [from, to). */\n    String substring(int from, int to) { return buf.substring(from, to); }\n    /** The offset of the first hit at or after from, or -1. */\n    int indexOf(String needle, int from) { return buf.indexOf(needle, from); }\n    /** Where the caret and the highlight are right now. */\n    Selection selection() { return sel; }\n\n    /** Highlight [anchor, caret]; a drag backwards is allowed, and puts the caret before the anchor. */\n    void select(int anchor, int caret) {\n        int n = length();\n        if (anchor &lt; 0 || caret &lt; 0 || anchor &gt; n || caret &gt; n) throw new IndexOutOfBoundsException(&quot;selection &quot; + anchor + &quot;..&quot; + caret + &quot; of &quot; + n);\n        sel = new Selection(anchor, caret);\n    }\n    /** Drop the highlight and put the bare caret at one offset. */\n    void moveTo(int caret) { select(caret, caret); }\n\n    /** Put s in at at; the caret lands after it, which is what a typist expects. */\n    void insert(int at, String s) { buf.insert(at, s); sel = Selection.at(at + s.length()); }\n    /** Take len characters out at at and hand them back; the caret lands where they used to be. */\n    String delete(int at, int len) { String gone = buf.delete(at, len); sel = Selection.at(at); return gone; }\n}\n\n// &quot;ctrl+Z must put it back&quot; -&gt; keep the CHANGE, not the document -&gt; the change becomes an object -&gt; Command\n/**\n * One reversible edit. Two promises every implementation keeps: undo() exactly cancels the last execute(), and\n * execute() is repeatable -- which is why redo is simply execute() again, and not a third place for offsets to drift.\n */\ninterface EditCommand {\n    /** Apply the edit to the document. Must throw before touching anything if the edit is not legal here. */\n    void execute(Document doc);\n    /** Put the document back exactly as it was before the last execute(). */\n    void undo(Document doc);\n    /** What the Edit menu shows: &quot;Undo typing&quot;, &quot;Undo replace all&quot;. */\n    String label();\n    /** Which family this edit belongs to. The grouping rule reads it; nothing else does. */\n    EditKind kind();\n}\n\n/**\n * Characters going in. Self-inverse: it knows what it put in, so undoing it is deleting exactly that many\n * characters at exactly that offset. The timestamp is here so the grouping rule can ask &quot;was that the same burst?&quot;.\n */\nfinal class InsertCommand implements EditCommand {\n    private final int at;\n    private final String text;\n    private final EditKind kind;\n    private final long atMs;\n\n    /** An insert of a non-empty string at a non-negative offset; an empty insert is rejected so it cannot occupy an undo step. */\n    InsertCommand(int at, String text, EditKind kind, long atMs) {\n        if (text == null || text.isEmpty()) throw new IllegalArgumentException(&quot;an empty insert is not an edit&quot;);\n        if (at &lt; 0) throw new IndexOutOfBoundsException(&quot;negative offset &quot; + at);\n        this.at = at; this.text = text; this.kind = kind; this.atMs = atMs;\n    }\n    public void execute(Document doc) { doc.insert(at, text); }\n    public void undo(Document doc) { doc.delete(at, text.length()); }\n    public String label() {\n        return switch (kind) { case TYPING -&gt; &quot;typing&quot;; case PASTE -&gt; &quot;paste&quot;; case REPLACE -&gt; &quot;replace&quot;; default -&gt; &quot;insert&quot;; };\n    }\n    public EditKind kind() { return kind; }\n\n    /** The offset this insert starts at. */\n    int at() { return at; }\n    /** The characters it puts in. */\n    String text() { return text; }\n    /** When it happened, from the injected clock. */\n    long atMs() { return atMs; }\n    /** One past the last character it wrote: where the next keystroke of the same burst would land. */\n    int endOffset() { return at + text.length(); }\n    /** A NEW command covering both, never a mutation -- a command already on the undo stack must not change under it. */\n    InsertCommand fusedWith(InsertCommand next) { return new InsertCommand(at, text + next.text, kind, next.atMs); }\n}\n\n/**\n * Characters coming out, and the crux of the whole design: a delete is not self-inverse, so to put characters back\n * it must have kept them. It stashes the removed string when it runs -- a memento sized to this one edit, not a\n * copy of the document. Undoing it before it ever ran is a broken life cycle, so it throws rather than inserting null.\n */\nfinal class DeleteCommand implements EditCommand {\n    private final int at;\n    private final int len;\n    private final EditKind kind;\n    private String removed;                            // filled by execute(), read by undo()\n\n    /** A delete of len characters at at. A zero-length delete is rejected so a no-op cannot occupy an undo step. */\n    DeleteCommand(int at, int len, EditKind kind) {\n        if (len &lt;= 0) throw new IllegalArgumentException(&quot;an empty delete is not an edit&quot;);\n        if (at &lt; 0) throw new IndexOutOfBoundsException(&quot;negative offset &quot; + at);\n        this.at = at; this.len = len; this.kind = kind;\n    }\n    public void execute(Document doc) { removed = doc.delete(at, len); }\n    public void undo(Document doc) {\n        if (removed == null) throw new IllegalStateException(&quot;undo before execute: the memento is empty&quot;);\n        doc.insert(at, removed);\n    }\n    public String label() { return &quot;delete&quot;; }\n    public EditKind kind() { return kind; }\n    /** The offset it deletes from. */\n    int at() { return at; }\n    /** How many characters it takes out. */\n    int len() { return len; }\n    /** What this delete took out, or null before it has run. */\n    String removed() { return removed; }\n}\n\n// &quot;forty replacements, one ctrl+Z&quot; -&gt; a step that is made of steps -&gt; Composite\n/**\n * A command made of commands: N edits, ONE undo step. Children run in order and are undone in REVERSE, because each\n * child&#x27;s offsets were computed against the document as the previous child left it. If a child throws, the ones that\n * already ran are undone before the exception leaves, so a half-applied macro cannot reach the undo stack.\n */\nclass CompositeCommand implements EditCommand {\n    private final String label;\n    private final EditKind kind;\n    /** The children, in execution order. Subclasses may fill this before the first execute(). */\n    protected final List&lt;EditCommand&gt; parts = new ArrayList&lt;&gt;();\n\n    /** An empty composite that a subclass fills in later. */\n    protected CompositeCommand(String label, EditKind kind) { this.label = label; this.kind = kind; }\n    /** A composite over a known list of children, e.g. &quot;delete the selection, then type over it&quot;. */\n    CompositeCommand(String label, EditKind kind, List&lt;EditCommand&gt; children) { this(label, kind); parts.addAll(children); }\n\n    public void execute(Document doc) {\n        Selection before = doc.selection();\n        int done = 0;\n        try { for (EditCommand c : parts) { c.execute(doc); done++; } }\n        catch (RuntimeException e) {                               // all of it or none of it\n            for (int i = done - 1; i &gt;= 0; i--) parts.get(i).undo(doc);\n            doc.select(before.anchor(), before.caret());           // the caret too: nothing half-done\n            throw e;\n        }\n    }\n    public void undo(Document doc) { for (int i = parts.size() - 1; i &gt;= 0; i--) parts.get(i).undo(doc); }\n    public String label() { return label; }\n    public EditKind kind() { return kind; }\n    /** How many child commands it holds. */\n    int size() { return parts.size(); }\n    /** The children, in execution order. A journal walks these; nothing else needs them. */\n    List&lt;EditCommand&gt; children() { return List.copyOf(parts); }\n}\n\n/**\n * Find and replace every hit as one undo step. It builds its children once, against the document as it stands, and\n * from the LAST hit backwards so that replacing a short word with a long one never moves an offset it has not used\n * yet. After that first execute it is an ordinary composite, which is what makes redo a replay rather than a re-search.\n */\nfinal class ReplaceAllCommand extends CompositeCommand {\n    private final String find;\n    private final String replacement;\n    private boolean built;\n    private int hits;\n\n    /** Replace every occurrence of find with replacement. An empty needle is refused; an empty replacement is a delete-all. */\n    ReplaceAllCommand(String find, String replacement) {\n        super(&quot;replace all \\&quot;&quot; + find + &quot;\\&quot; -&gt; \\&quot;&quot; + replacement + &quot;\\&quot;&quot;, EditKind.REPLACE);\n        if (find == null || find.isEmpty()) throw new IllegalArgumentException(&quot;nothing to find&quot;);\n        this.find = find; this.replacement = replacement == null ? &quot;&quot; : replacement;\n    }\n    public void execute(Document doc) {\n        if (!built) {\n            build(doc); built = true;\n            if (parts.isEmpty()) throw new IllegalArgumentException(&quot;no occurrences of \\&quot;&quot; + find + &quot;\\&quot;&quot;);\n        }\n        super.execute(doc);\n    }\n    /** Scan once, then create the children back to front so earlier offsets stay valid while later ones change. */\n    private void build(Document doc) {\n        List&lt;Integer&gt; at = new ArrayList&lt;&gt;();\n        for (int i = doc.indexOf(find, 0); i &gt;= 0; i = doc.indexOf(find, i + find.length())) at.add(i);\n        hits = at.size();\n        for (int k = hits - 1; k &gt;= 0; k--) {\n            parts.add(new DeleteCommand(at.get(k), find.length(), EditKind.REPLACE));\n            if (!replacement.isEmpty()) parts.add(new InsertCommand(at.get(k), replacement, EditKind.REPLACE, 0L));\n        }\n    }\n    /** How many occurrences it replaced. Valid after the first execute(). */\n    int hits() { return hits; }\n}\n\n// &quot;type five letters, expect one ctrl+Z&quot; -&gt; and the right answer differs per product -&gt; hide the rule -&gt; Strategy\n/**\n * Decides whether two neighbouring edits collapse into ONE undo step. One method, because grouping is the rule\n * product changes most: typing groups, a paste never does, an audited document groups nothing at all.\n */\ninterface MergePolicy {\n    /** The fused command covering both, or null to keep them as two separate undo steps. */\n    EditCommand merge(EditCommand previous, EditCommand next);\n}\n\n/**\n * A human typing: single characters, forward, close together in time, inside one word, up to a cap so one undo step\n * is never a whole paragraph. Anything else -- a caret jump, a pause, a space, a paste -- starts a new step.\n */\nfinal class TypingBurstMergePolicy implements MergePolicy {\n    private final long windowMs;\n    private final int maxRun;\n    /** windowMs: the longest pause that still counts as the same burst. maxRun: the longest run in one undo step. */\n    TypingBurstMergePolicy(long windowMs, int maxRun) { this.windowMs = windowMs; this.maxRun = maxRun; }\n    public EditCommand merge(EditCommand previous, EditCommand next) {\n        if (!(previous instanceof InsertCommand p) || !(next instanceof InsertCommand n)) return null;\n        if (p.kind() != EditKind.TYPING || n.kind() != EditKind.TYPING) return null;\n        if (n.text().length() != 1) return null;                             // only a keystroke joins a run\n        if (n.at() != p.endOffset()) return null;                            // the caret jumped: a new step\n        if (n.atMs() - p.atMs() &gt; windowMs) return null;                     // a pause: a new step\n        if (p.text().length() &gt;= maxRun) return null;                        // the cap\n        if (Character.isWhitespace(p.text().charAt(p.text().length() - 1))) return null;   // a word ended\n        return p.fusedWith(n);\n    }\n}\n\n/** Never merges: every keystroke is its own undo step. What a deterministic test wants, and what an audited document wants. */\nfinal class NoMergePolicy implements MergePolicy {\n    public EditCommand merge(EditCommand previous, EditCommand next) { return null; }\n}\n\n// &quot;a 4 KB paste must never be swallowed into a word&quot; -&gt; add the rule to every policy instead of copying it -&gt; Decorator\n/**\n * The one rule no grouping policy is allowed to break, wrapped around all of them instead of copied into each: only\n * plain typing may ever merge. A paste, a replace-all or a macro is always its own undo step, including under a rule\n * somebody writes next year.\n */\nfinal class PasteIsItsOwnStep implements MergePolicy {\n    private final MergePolicy base;\n    /** Wraps any policy, present or future. The Editor applies this in configure(); nothing else needs to know. */\n    PasteIsItsOwnStep(MergePolicy base) { this.base = Objects.requireNonNull(base); }\n    public EditCommand merge(EditCommand previous, EditCommand next) {\n        if (previous.kind() != EditKind.TYPING || next.kind() != EditKind.TYPING) return null;\n        return base.merge(previous, next);\n    }\n}\n\n/**\n * Two stacks and a size cap. It knows nothing about text -- only about commands -- which is why replace-all, a macro\n * and a keystroke all travel through it unchanged. Three behaviours are the whole class: a new edit clears redo,\n * a redone command goes back on the undo stack without re-entering the grouping rule, and the oldest step is evicted.\n */\nfinal class UndoManager {\n    private final Deque&lt;EditCommand&gt; undoStack = new ArrayDeque&lt;&gt;();\n    private final Deque&lt;EditCommand&gt; redoStack = new ArrayDeque&lt;&gt;();\n    private final int limit;\n    private MergePolicy policy;\n    private boolean evicted;                            // once the oldest step is gone, &quot;back to the original&quot; is unreachable\n\n    /** limit is the number of undo STEPS kept, not characters; the grouping rule decides how much text a step is. */\n    UndoManager(int limit, MergePolicy policy) {\n        if (limit &lt;= 0) throw new IllegalArgumentException(&quot;history limit must be positive&quot;);\n        this.limit = limit; this.policy = Objects.requireNonNull(policy);\n    }\n    /** Swap the grouping rule at run time. The stacks are untouched; only future merges change. */\n    void setPolicy(MergePolicy p) { policy = Objects.requireNonNull(p); }\n\n    /**\n     * Record an edit that ALREADY happened. Redo is cleared first, because history here is linear: once you type\n     * after undoing, the abandoned branch is gone on purpose. Then the grouping rule gets one chance to fuse this\n     * edit into the step below it.\n     */\n    void record(EditCommand cmd) {\n        redoStack.clear();\n        EditCommand prev = undoStack.peek();\n        if (prev != null) {\n            EditCommand fused = policy.merge(prev, cmd);\n            if (fused != null) { undoStack.pop(); undoStack.push(fused); return; }\n        }\n        undoStack.push(cmd);\n        while (undoStack.size() &gt; limit) { undoStack.removeLast(); evicted = true; }\n    }\n    /** Pop the last step, reverse it, and park it on the redo stack. The caller has already checked canUndo(). */\n    EditCommand undo(Document doc) { EditCommand c = undoStack.pop(); c.undo(doc); redoStack.push(c); return c; }\n    /** Pop the last undone step and execute it again. Not through record(): no merge, and redo is not cleared. */\n    EditCommand redo(Document doc) { EditCommand c = redoStack.pop(); c.execute(doc); undoStack.push(c); return c; }\n\n    /** Is there a step to reverse? */\n    boolean canUndo() { return !undoStack.isEmpty(); }\n    /** Is there a reversed step to re-apply? */\n    boolean canRedo() { return !redoStack.isEmpty(); }\n    /** How many undo steps are on the stack. */\n    int depth() { return undoStack.size(); }\n    /** How many redo steps are on the stack. */\n    int redoDepth() { return redoStack.size(); }\n    /** True once a step has been thrown away, which is why &quot;unsaved&quot; cannot be derived from an empty undo stack. */\n    boolean evicted() { return evicted; }\n    /** The top n step labels, newest first: exactly what the Edit menu renders. */\n    List&lt;String&gt; labels(int n) {\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (EditCommand c : undoStack) { if (out.size() == n) break; out.add(c.label()); }\n        return out;\n    }\n}\n\n/** The clipboard, in memory. One string, because a cut and a copy both end in &quot;hold this until somebody pastes it&quot;. */\nfinal class Clipboard {\n    private volatile String content = &quot;&quot;;\n    /** Replace what is held. Null is treated as empty. */\n    void put(String s) { content = s == null ? &quot;&quot; : s; }\n    /** What is held right now. */\n    String get() { return content; }\n    /** True when there is nothing to paste. */\n    boolean isEmpty() { return content.isEmpty(); }\n}\n\n/**\n * What every listener is handed after an edit lands. It carries the version, the new text AND the command itself, so\n * a renderer can repaint, a journal can write the change alone instead of the whole file, and a listener that missed\n * a version can see the gap. The command is immutable once executed; listeners read it, they never run it.\n */\nrecord EditEvent(long version, String kind, String label, String text, int caret, EditCommand command) {}\n\n// &quot;somebody repaints, somebody autosaves, somebody highlights&quot; -&gt; the editor must not know any of them -&gt; Observer\n/** Anybody who wants to know the document changed: a renderer, autosave, a syntax highlighter, a plugin, an audit log. */\ninterface EditListener {\n    /** Called after the edit has landed and the lock has been released. Must not throw; if it does, it is ignored. */\n    void onEdit(EditEvent event);\n}\n\n/** The simplest listener there is: keep a line per edit. Stands in for the view in a headless demo. */\nfinal class ConsoleRenderer implements EditListener {\n    private final List&lt;String&gt; lines = new ArrayList&lt;&gt;();\n    public void onEdit(EditEvent e) { lines.add(&quot;v&quot; + e.version() + &quot; &quot; + e.kind() + &quot; &quot; + e.label()); }\n    /** Everything it has been told, oldest first. */\n    List&lt;String&gt; lines() { return lines; }\n}\n\n/**\n * Autosave, and the reason readers never take the lock: it keeps the last published snapshot and version, which the\n * Editor handed it, and writes them on its own thread whenever it likes. &quot;Unsaved&quot; is a comparison of two versions,\n * never &quot;is the undo stack empty&quot; -- the stack lies as soon as the cap has evicted a step.\n */\nfinal class Autosave implements EditListener {\n    private volatile long latest, savedVersion;\n    private volatile String pending = &quot;&quot;, written = &quot;&quot;;\n    private volatile int writes;\n    public void onEdit(EditEvent e) { latest = e.version(); pending = e.text(); }\n    /** Is there anything to write? */\n    boolean isDirty() { return latest != savedVersion; }\n    /** Write whatever the last event published. A timer thread calls this; it never touches the editor or its lock. */\n    void save() { written = pending; savedVersion = latest; writes++; }\n    /** The text last written to disk. */\n    String written() { return written; }\n    /** The version last written to disk. */\n    long savedVersion() { return savedVersion; }\n    /** How many times save() actually ran. */\n    int writes() { return writes; }\n}\n\n/**\n * The only door into the document. It owns the buffer, the history, the clipboard, the lock, the version counter and\n * the published snapshot, and one rule holds the whole design together: the buffer, the history and the version move\n * together or not at all. Readers never take the lock; they read a volatile reference to an immutable String.\n * Every edit method has the same shape -- lock, read the caret, build the command, applyLocked, unlock, fire -- so\n * the lock is taken exactly once per edit and no listener ever runs while it is held.\n */\nfinal class Editor {\n    private final Document doc;\n    private final UndoManager history;\n    private final Clipboard clip = new Clipboard();\n    private final ReentrantLock lock = new ReentrantLock();   // explicit, so the span is visible and tryLock is there if needed\n    private final List&lt;EditListener&gt; listeners = new CopyOnWriteArrayList&lt;&gt;();\n    private final AtomicLong version = new AtomicLong();\n    private volatile String snapshot = &quot;&quot;;\n    private Clock clock = System::currentTimeMillis;\n\n    /** A gap buffer, two hundred undo steps, and typing that groups into words: the sane default. */\n    Editor() { this(new GapBuffer(), 200, new TypingBurstMergePolicy(600, 40)); }\n    /** Everything handed in: the storage, how deep the history goes, and how edits group. The Editor builds none of them. */\n    Editor(TextBuffer buffer, int historyLimit, MergePolicy policy) {\n        this.doc = new Document(buffer);\n        this.history = new UndoManager(historyLimit, new PasteIsItsOwnStep(policy));\n    }\n\n    /** Hand in the grouping rule and any views. The rule is wrapped, so no rule -- including one written next year -- can swallow a paste. */\n    void configure(MergePolicy policy, EditListener... views) {\n        lock.lock();\n        try { history.setPolicy(new PasteIsItsOwnStep(policy)); } finally { lock.unlock(); }\n        listeners.addAll(Arrays.asList(views));\n    }\n    /** Hand in a clock. Nothing in this file reads the wall clock anywhere else. */\n    void setClock(Clock c) { clock = Objects.requireNonNull(c); }\n    /** Subscribe. A listener added later still sees every edit from then on. */\n    void addListener(EditListener l) { listeners.add(l); }\n\n    /**\n     * The critical step, and the ORDER is the design. The buffer moves first: if the command throws, the history\n     * never gains a step for an edit that did not happen, and such a step would later delete characters somebody\n     * else typed. Only after the mutation succeeds do the history, the version and the snapshot move, all under one\n     * lock. The listeners are told after the unlock, each inside a try/catch, so a broken plugin cannot break typing.\n     */\n    long apply(EditCommand cmd) {\n        EditEvent ev;\n        lock.lock();\n        try { ev = applyLocked(cmd); } finally { lock.unlock(); }\n        fire(ev);                                        // then the outside world, after the unlock\n        return ev.version();\n    }\n\n    /**\n     * The three writes that must not be split, with the lock already held. Every public edit method follows the same\n     * shape: take the lock, read the caret, build the command, call this, release, THEN fire. Nothing re-enters the\n     * lock, which is what makes &quot;listeners are called outside the lock&quot; true rather than nearly true.\n     */\n    private EditEvent applyLocked(EditCommand cmd) {\n        cmd.execute(doc);                                // 1. the mutation: this is the step that can fail\n        history.record(cmd);                             // 2. only now is there something to undo\n        return publishLocked(&quot;edit&quot;, cmd);               // 3. version and snapshot, still under the lock\n    }\n\n    /** Bump the version and swap in a fresh immutable snapshot. Called with the lock held, never from outside. */\n    private EditEvent publishLocked(String kind, EditCommand cmd) {\n        long v = version.incrementAndGet();\n        snapshot = doc.text();\n        return new EditEvent(v, kind, cmd.label(), snapshot, doc.selection().caret(), cmd);\n    }\n    /** Tell every listener, one broken one at a time. A listener that throws is skipped; the edit already landed. */\n    private void fire(EditEvent ev) {\n        for (EditListener l : listeners) {\n            try { l.onEdit(ev); } catch (RuntimeException ignored) { /* a broken view is not a broken edit */ }\n        }\n    }\n\n    /** Type at the caret. A single character can join the burst below it; anything longer is its own step. */\n    long type(String s) {\n        EditEvent ev;\n        lock.lock();\n        try {\n            Selection sel = doc.selection();                         // read the caret and edit it in ONE span\n            EditKind kind = s.length() == 1 ? EditKind.TYPING : EditKind.PASTE;\n            ev = applyLocked(sel.isEmpty() ? new InsertCommand(sel.caret(), s, kind, clock.nowMs())\n                                           : replaceSelection(sel, s, kind));\n        } finally { lock.unlock(); }\n        fire(ev);\n        return ev.version();\n    }\n    /** Insert at an explicit offset, the way a plugin or a test drives the editor. */\n    long insertAt(int at, String s) { return apply(new InsertCommand(at, s, EditKind.TYPING, clock.nowMs())); }\n    /** Append at the end. Reading the length and inserting are ONE span of the lock: that pair must not tear. */\n    long append(String s) {\n        EditEvent ev;\n        lock.lock();\n        try { ev = applyLocked(new InsertCommand(doc.length(), s, EditKind.TYPING, clock.nowMs())); }\n        finally { lock.unlock(); }\n        fire(ev);\n        return ev.version();\n    }\n    /** Delete a range as one step. */\n    long deleteRange(int at, int len) { return apply(new DeleteCommand(at, len, EditKind.DELETE)); }\n\n    /** Backspace: the selection if there is one, otherwise one character before the caret. False at the start of the document. */\n    boolean backspace() {\n        EditEvent ev;\n        lock.lock();\n        try {\n            Selection sel = doc.selection();\n            if (sel.isEmpty() &amp;&amp; sel.caret() == 0) return false;      // nothing before the caret: not an edit\n            ev = applyLocked(sel.isEmpty() ? new DeleteCommand(sel.caret() - 1, 1, EditKind.DELETE)\n                                           : new DeleteCommand(sel.start(), sel.length(), EditKind.DELETE));\n        } finally { lock.unlock(); }\n        fire(ev);\n        return true;\n    }\n\n    /** Highlight a range. Not an edit: it changes no characters, so it is not an undo step. */\n    void select(int anchor, int caret) { lock.lock(); try { doc.select(anchor, caret); } finally { lock.unlock(); } }\n    /** Move the bare caret. Also not an edit -- but it does end a typing burst, because the next insert is not contiguous. */\n    void moveTo(int caret) { lock.lock(); try { doc.moveTo(caret); } finally { lock.unlock(); } }\n\n    /** Copy the selection to the clipboard. Changes no text, so it is not an undo step. */\n    boolean copy() {\n        lock.lock();\n        try {\n            Selection s = doc.selection();\n            if (s.isEmpty()) return false;\n            clip.put(doc.substring(s.start(), s.end()));\n            return true;\n        } finally { lock.unlock(); }\n    }\n    /** Cut IS an edit: one delete command, so one ctrl+Z puts the whole selection back at once. */\n    boolean cut() {\n        EditEvent ev;\n        lock.lock();\n        try {\n            Selection s = doc.selection();\n            if (s.isEmpty()) return false;\n            clip.put(doc.substring(s.start(), s.end()));\n            ev = applyLocked(new DeleteCommand(s.start(), s.length(), EditKind.DELETE));\n        } finally { lock.unlock(); }\n        fire(ev);\n        return true;\n    }\n    /** Paste at the caret, replacing the selection if there is one. One step however big it is. */\n    boolean paste() {\n        EditEvent ev;\n        lock.lock();\n        try {\n            if (clip.isEmpty()) return false;\n            Selection s = doc.selection();\n            ev = applyLocked(s.isEmpty() ? new InsertCommand(s.caret(), clip.get(), EditKind.PASTE, clock.nowMs())\n                                         : replaceSelection(s, clip.get(), EditKind.PASTE));\n        } finally { lock.unlock(); }\n        fire(ev);\n        return true;\n    }\n    /** Delete the highlight and put s in its place, as ONE undo step. Used by typing over a selection and by paste. */\n    private EditCommand replaceSelection(Selection sel, String s, EditKind kind) {\n        return new CompositeCommand(&quot;replace selection&quot;, EditKind.MACRO,\n            List.of(new DeleteCommand(sel.start(), sel.length(), EditKind.DELETE),\n                    new InsertCommand(sel.start(), s, kind, clock.nowMs())));\n    }\n\n    /** Replace every occurrence, as ONE undo step. The Editor gains no machinery: it is a command like any other. */\n    int replaceAll(String find, String replacement) {\n        EditEvent ev;\n        ReplaceAllCommand cmd;\n        lock.lock();\n        try {\n            if (doc.indexOf(find, 0) &lt; 0) return 0;\n            cmd = new ReplaceAllCommand(find, replacement);\n            ev = applyLocked(cmd);\n        } finally { lock.unlock(); }\n        fire(ev);\n        return cmd.hits();\n    }\n\n    /** Reverse the last step. Returns false rather than throwing when there is nothing to undo. */\n    boolean undo() {\n        EditEvent ev;\n        lock.lock();\n        try {\n            if (!history.canUndo()) return false;\n            ev = publishLocked(&quot;undo&quot;, history.undo(doc));\n        } finally { lock.unlock(); }\n        fire(ev);\n        return true;\n    }\n    /** Re-apply the last reversed step. Returns false when the redo stack is empty -- including right after a new edit. */\n    boolean redo() {\n        EditEvent ev;\n        lock.lock();\n        try {\n            if (!history.canRedo()) return false;\n            ev = publishLocked(&quot;redo&quot;, history.redo(doc));\n        } finally { lock.unlock(); }\n        fire(ev);\n        return true;\n    }\n\n    /** The text, with no lock at all: a volatile reference to an immutable String that the lock swapped in. */\n    String text() { return snapshot; }\n    /** A window of the text for a viewport, off the same snapshot; the UI never copies a whole document to draw a screen. */\n    String textRange(int from, int to) {\n        String s = snapshot;\n        return s.substring(Math.max(0, Math.min(from, s.length())), Math.max(0, Math.min(to, s.length())));\n    }\n    /** How many edits have landed. A listener that jumps from 7 to 9 knows it missed one. */\n    long version() { return version.get(); }\n    /** Greys out the Edit menu. */\n    boolean canUndo() { lock.lock(); try { return history.canUndo(); } finally { lock.unlock(); } }\n    /** Greys out the Edit menu. */\n    boolean canRedo() { lock.lock(); try { return history.canRedo(); } finally { lock.unlock(); } }\n    /** How many undo steps are waiting. */\n    int undoDepth() { lock.lock(); try { return history.depth(); } finally { lock.unlock(); } }\n    /** How many redo steps are waiting. */\n    int redoDepth() { lock.lock(); try { return history.redoDepth(); } finally { lock.unlock(); } }\n    /** The top n labels for the Edit menu, newest first. */\n    List&lt;String&gt; undoLabels(int n) { lock.lock(); try { return history.labels(n); } finally { lock.unlock(); } }\n    /** True once the cap has thrown a step away, so &quot;unsaved&quot; must not be derived from an empty undo stack. */\n    boolean historyEvicted() { lock.lock(); try { return history.evicted(); } finally { lock.unlock(); } }\n    /** Where the caret and the highlight are. */\n    Selection selection() { lock.lock(); try { return doc.selection(); } finally { lock.unlock(); } }\n    /** What is on the clipboard. */\n    String clipboard() { return clip.get(); }\n}\n\n/** Runs the editor: a demo of every claim on page 02, then the race that proves the lock earns its keep. */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        ConsoleRenderer view = new ConsoleRenderer();\n        Autosave disk = new Autosave();\n        long[] now = { 1_700_000_000_000L };\n        Editor ed = new Editor(new GapBuffer(), 4, new TypingBurstMergePolicy(600, 40));\n        ed.configure(new TypingBurstMergePolicy(600, 40), view, disk);\n        ed.setClock(() -&gt; now[0]);\n\n        // 1. typing collapses into words; the clock says the keystrokes were 40 ms apart\n        for (char c : &quot;hello world&quot;.toCharArray()) { ed.type(String.valueOf(c)); now[0] += 40; }\n        System.out.println(&quot;1. typing:      \\&quot;&quot; + ed.text() + &quot;\\&quot;  undo steps=&quot; + ed.undoDepth() + &quot;  menu=&quot; + ed.undoLabels(3));\n\n        // 2. a paste is always its own step, whatever the grouping rule says\n        ed.type(&quot;[4 KB of pasted text]&quot;);\n        System.out.println(&quot;2. paste:       \\&quot;&quot; + ed.text() + &quot;\\&quot;  undo steps=&quot; + ed.undoDepth() + &quot;  menu=&quot; + ed.undoLabels(3));\n        ed.undo();\n        System.out.println(&quot;   one ctrl+Z:  \\&quot;&quot; + ed.text() + &quot;\\&quot;  the paste came out in one piece&quot;);\n\n        // 3. delete puts back exactly what it took, including from the middle\n        ed.deleteRange(5, 6);\n        System.out.println(&quot;

<!doctype html>

<style>

.d{color:#7fa66f;font-style:italic} .right-uml{margin:0} .right-uml svg{width:100%;height:auto} .move{margin:0 22px 18px} .move h3{margin:0 0 6px;font-size:14.5px} .move p{margin:6px 0 0;line-height:1.6} .fullboard{margin:0 22px 14px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px} .fullboard svg{width:100%;height:auto;display:block} .req{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 22px 18px} .req>div{background:var(--bg3);border-radius:8px;padding:16px 20px 18px} .req b{color:var(--acc)} .req ul{margin:6px 0 0;padding-left:18px} .req li{font-size:13.5px;line-height:1.55;margin:5px 0} table.ask{margin:0 0 6px} table.ask th{font-size:12px;color:var(--acc);font-weight:600;padding:8px 10px} table.ask td{font-size:13px;line-height:1.5;padding:9px 10px} table.ask td:first-child{color:var(--text)} table.ask td:not(:first-child){color:var(--muted)} .move h3{margin-top:10px} .grade{margin:0 22px 14px;background:var(--bg3);border-left:3px solid var(--acc);padding:10px 14px;border-radius:0 6px 6px 0} .grade b{color:var(--acc)} .wrap.wide .right{display:none}
.k{color:#c792ea} .s{color:#c3e88d} .c{color:#5c6773;font-style:italic} .n{color:#f78c6c} .t{color:#82aaff}
.nav{display:flex;gap:10px;padding:0 22px 24px} .nav button{background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit} .nav button.pri{background:var(--acc);color:#04211a;border-color:var(--acc);font-weight:600}
.right h3{margin:4px 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#cd{width:100%;height:auto;display:block} .nd rect{fill:var(--bg3);stroke:var(--line);stroke-width:1.2} .nd text{fill:var(--text);font-family:var(--mono)} .nd .lb{font-size:12px} .nd .sb{font-size:9.5px;fill:var(--muted)}
.nd.iface rect{stroke-dasharray:4 3} .nd.enum rect{rx:14} .nd{opacity:0;transition:opacity .3s} .nd.seen{opacity:.45} .nd.cur{opacity:1} .nd.cur rect{stroke:var(--acc);stroke-width:1.8;fill:#12302a}
.e{fill:none;stroke:var(--line);stroke-width:1.2;opacity:0;transition:opacity .3s;color:var(--line)} .e.seen{opacity:.6} .e.cur{opacity:1;stroke:var(--acc);color:var(--acc)} .e.isa{} .e.ref{stroke-dasharray:4 3} .e.use{stroke-dasharray:1.5 3}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin:8px 0 14px;flex-wrap:wrap} .legend span::before{content:"";display:inline-block;width:22px;border-top:1.5px solid var(--muted);margin-right:5px;vertical-align:middle} .legend .own::before{} .legend .ref::before{border-top-style:dashed} .legend .use::before{border-top-style:dotted}
.pat{margin-top:10px} .pat div{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px} .pat div span:last-child{color:var(--muted)} .pat div.on{color:var(--acc)} .pat div.on span:last-child{color:var(--text)}
/* practice */
.prac{padding:0 22px}
.card{border:1px solid var(--line);border-radius:8px;background:var(--bg2);margin-bottom:16px} .card .ch{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)} .card .ch h3{margin:0;font-size:15px} .card .cb{padding:14px 16px;line-height:1.6}
.timer{margin-left:auto;font-family:var(--mono);font-size:12px;background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:4px 12px;cursor:pointer} .timer.run{background:var(--acc);color:#04211a} .timer.done{border-color:var(--err);color:var(--err)}
.kind{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:2px 6px;white-space:nowrap} .ans table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0} .ans th,.ans td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} .ans th{color:var(--muted);font-weight:500} .ans .ed{margin:10px 0} .say2{margin:8px 0 0;padding:8px 12px;background:#132a24;border-left:3px solid var(--acc);border-radius:0 6px 6px 0} .say2 b{color:var(--acc)}
.prompt{background:var(--bg3);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 6px 6px 0;font-style:italic;margin-bottom:10px}
details{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:10px} summary{cursor:pointer;color:var(--acc2);font-weight:600} a{color:var(--acc)}
.right .lock{display:none;color:var(--muted);padding:40px 10px;text-align:center;border:1px dashed var(--line);border-radius:8px} .right.locked .lock{display:block} .right.locked #cd,.right.locked .legend,.right.locked .pat,.right.locked h3:nth-of-type(2){display:none} summary small{color:var(--muted);font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} th{color:var(--text);font-weight:500;white-space:nowrap} td{color:var(--muted)}
ul.chk{list-style:none;padding:0;margin:6px 0} ul.chk li::before{content:"[ ] ";font-family:var(--mono);color:var(--muted)}
.miss textarea{width:100%;min-height:80px;background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:13px var(--mono)}
@media (max-width:1100px){.wrap{grid-template-columns:200px 1fr} .right{display:none}}

<div class="top"><h1>Text Editor</h1><span class="sub">LLD &middot; Java &middot; OpenJDK 21: demo, 9 blocks of failure tests and a 2000-edit race pass</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>
</div>
<div class="wrap">

</section>
<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design a text editor. Typing, deleting, cut and paste, and the part I actually care about &mdash; undo and redo that a user can trust. One document, in memory. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>Somebody types a character and it appears; they press ctrl+Z and it disappears. That second sentence is the whole design. If ctrl+Z means \"go back to the previous version of the document\", you are copying the whole file on every keystroke, and a ten-megabyte file kills you. So ctrl+Z has to mean \"reverse the last <i>change</i>\", which turns a change into a thing you can hold: an object that knows what it did and how to take it back. Five keystrokes should be one ctrl+Z but a four-kilobyte paste should not, so something has to decide when two edits are really one step. The document is also being watched &mdash; a renderer repaints, an autosave writes, a syntax highlighter re-colours &mdash; and none of them may sit in the way of a typist. The one thing that must always be true: the characters, the undo history and the version number agree. A buffer that moved while the history did not is the bug where the next ctrl+Z deletes the wrong characters, and nobody notices until the document is ruined.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that types, deletes, undoes, redoes and prints. The interviewer is watching for, in this order: the questions you ask before typing (plain or rich text, and how big the document gets, are the first two); which classes exist and which one owns the characters; an edit end to end from keystroke to repaint; what happens when a second thread touches the document while the first is half way through an edit; where the rule that will change (when do edits group?) lives, so a new rule is a new class and not an edit; and what the system looks like after an edit that threw. Then the twists: replace-all in one ctrl+Z, macros, drawing lines 4000 to 4050 of a huge file, a file too big for a StringBuilder, rich text, persistence, and two people at once.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 410\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"165\" y=\"61\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--acc)\">type</text><g transform=\"translate(175 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a keystroke arrives</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">at the caret, or over a selection</text></g><path d=\"M415 57 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the change becomes a command</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">it carries its own undo</text></g><path d=\"M675 57 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">under one lock, in order</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">buffer, then history, then version</text></g><path d=\"M935 57 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">then tell the views</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">after the unlock, never inside it</text></g><text x=\"165\" y=\"196\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--acc)\">ctrl+Z</text><g transform=\"translate(175 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the user presses undo</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the last STEP, not a version</text></g><path d=\"M415 192 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">pop the top command</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one step, however many edits</text></g><path d=\"M675 192 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cmd.undo(doc)</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the exact characters come back</text></g><path d=\"M935 192 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">push it onto redo</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">redo is execute() again</text></g><text x=\"165\" y=\"278\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--acc)\">cut / paste /</text><text x=\"165\" y=\"295\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--acc)\">replace all</text><g transform=\"translate(175 255)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a range, or 40 hits</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one selection, or the whole file</text></g><path d=\"M415 282 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 255)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ONE command</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">or one made of commands, in order</text></g><path d=\"M675 282 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 255)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same apply(), same lock</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the editor gains no method</text></g><path d=\"M935 282 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 255)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one ctrl+Z undoes all of it</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">children reversed, last first</text></g><path d=\"M815 84 V95\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(650 95)\"><rect width=\"330\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"165.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refused: nothing is recorded</text></g><text x=\"165\" y=\"356\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"356\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, and without taking the lock: what is the text?  which version is on screen?  can I undo, and what would it undo?</text><text x=\"615\" y=\"395\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">one writer at a time on the buffer: the characters, the history and the version move together, or none of them move</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Plain text or rich text?</td><td>Plain text; styles are a follow-up</td><td>Whether \"bold this\" is also a command on the undo stack (moves 1, 12)</td></tr><tr><td>How large can one document get?</td><td>Up to about a megabyte today, more later</td><td>The storage behind an interface: StringBuilder, gap buffer, piece table (moves 3, 5)</td></tr><tr><td>Is undo per document or per author?</td><td>One author, one document</td><td>A stack, not a transform. Two authors is a different problem entirely (moves 6, 12)</td></tr><tr><td>Undo twice, then type. Is the abandoned branch recoverable?</td><td>No: linear history</td><td>Two stacks rather than a history tree, and a new edit clears redo (move 6)</td></tr><tr><td>What closes an undo step &mdash; a pause, a space, a caret move, a paste?</td><td>A pause or a word boundary; a paste never merges</td><td>The grouping rule behind a one-method interface, and a wrapper that polices it (move 3)</td></tr><tr><td>How deep is the history, and bounded by what?</td><td>A cap on steps, not on bytes</td><td>The eviction rule, and why \"unsaved\" cannot mean \"the undo stack is empty\" (moves 5, 6)</td></tr><tr><td>Who calls this &mdash; one UI thread, or also an autosave and plugins?</td><td>More than one thread</td><td>Whether a lock is needed at all, and what it must span (moves 4, 7)</td></tr><tr><td>Two people editing the same document?</td><td>Out of scope, named</td><td>Operational transformation or a CRDT, and a stack cannot express either (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Insert text at an offset and delete a range; a caret, and a selection you can drag either way.</li>\n<li>Every change goes through ONE entry point that mutates, records and notifies &mdash; there is no second way to move a character.</li>\n<li>Undo reverses the last step; redo re-applies it; a new edit throws the redo branch away.</li>\n<li>Consecutive keystrokes collapse into word-sized steps under a swappable rule; a paste is always its own step.</li>\n<li>Cut, copy and paste, where cutting a selection is one step and one ctrl+Z puts it all back.</li>\n<li>Find and replace all &mdash; forty hits, one ctrl+Z.</li>\n<li>The Edit menu can ask: can I undo, what would it undo, and which version is on screen.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Under stray threads &mdash; an autosave, a plugin, a macro &mdash; the buffer, the history and the version move together or not at all.</li>\n<li>Undo and redo are O(1); an insert at the caret is O(1) amortised however long the document is.</li>\n<li>Readers never take the lock: a volatile snapshot plus a version number.</li>\n<li>Memory is bounded: the history has a step cap, and undo keeps the change, never a copy of the document.</li>\n<li>The storage and the grouping rule are swappable without reopening the editor or the history.</li>\n<li>Nothing half-done: an edit that throws leaves the text, the history and the caret exactly as they were.</li>\n<li>One document, one process, in memory: no files, no network, no formatting (say it; they are follow-ups).</li></ul></div></div>\n<div class=\"move\"><h3>One minute of typing, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 188\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"112\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">10:04:01  types \"hello\"</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">five keystrokes, 40 ms apart</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the rule fuses them into ONE step</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">version 5, undo depth 1</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"112\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">10:04:03  pastes 4 KB</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one insert, kind = PASTE</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the wrapper refuses to merge it</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">version 6, undo depth 2</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"112\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">10:04:09  ctrl+Z</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the 4 KB comes out in one piece</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">text is \"hello\" again</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">version 7, redo depth 1</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"112\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">10:04:11  types \" world\"</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">a new edit clears the redo stack</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the 4 KB is gone, on purpose</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">version 8, undo depth 2, redo 0</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> undo reverses the last change, not the last version, so a change is an object that carries its own inverse; a delete keeps the characters it removed, which is what makes it reversible at all; history is linear, so typing after an undo throws the branch away on purpose; the storage and the grouping rule are both handed in; one document, one process, in memory. Named as out of scope: rich text, files on disk, collaborative editing &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, elevator, BookMyShow) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On this problem move 2 is the load-bearing one: the moment a change becomes an object that carries its own inverse, undo, redo, macros, replace-all and persistence all stop being separate features.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 222\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a USER types into a DOCUMENT; every EDIT knows its own inverse; an UNDO STACK and a REDO STACK hold them; a CLIPBOARD; VIEWS watch</text><g transform=\"translate(30 110)\"><rect width=\"180\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Document</text><text x=\"90.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">characters + a caret</text></g><path d=\"M120.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(228 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TextBuffer</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">how they are stored</text></g><path d=\"M315.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(421 110)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Selection</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two ints: a record</text></g><path d=\"M503.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(604 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EditCommand</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">its own undo inside it</text></g><path d=\"M696.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(807 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">UndoManager</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two stacks and a cap</text></g><path d=\"M894.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 110)\"><rect width=\"200\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"100.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MergePolicy / View</text><text x=\"100.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: interfaces</text></g><path d=\"M1100.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a rule, or somebody who only listens</text><text x=\"615\" y=\"209\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and notice what is NOT a class: a version of the document. Keeping one per keystroke is the mistake this whole design exists to avoid.</text></svg></div><div class=\"move\"><p>Reading the paragraph again: a <b>user</b> types into a <b>document</b>; the document holds <b>characters</b> and a <b>caret</b>; each <b>edit</b> can be undone; an <b>undo stack</b> and a <b>redo stack</b> hold them; a <b>clipboard</b> holds what was cut; <b>views</b> watch. A document has characters and a caret, both of which move: a class. How those characters are stored is state too, but it is the piece most likely to be swapped, so it becomes an interface with the document holding one. An edit carries its own state &mdash; where, what, and for a delete, the characters it removed &mdash; so it is a class, and that is the whole trick: the change is a thing you can hold. A selection is two ints that never change once made: a record. The grouping rule and a view have no state of the document at all, so they are interfaces. And notice what is deliberately <i>not</i> a class: a version of the document. Keeping one per keystroke is the mistake this design exists to avoid.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 280\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 22)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">put characters in at an offset</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 43 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 22)\"><rect width=\"390\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"195.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TextBuffer  (owns the characters)</text><text x=\"195.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M820 43 H880\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(880 22)\"><rect width=\"320\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">buf.insert(at, s)</text><text x=\"160.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 74)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">remember how to take them out again</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 95 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 74)\"><rect width=\"390\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"195.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EditCommand  (owns its own inverse)</text><text x=\"195.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M820 95 H880\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(880 74)\"><rect width=\"320\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cmd.undo(doc)</text><text x=\"160.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 126)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">decide if two keystrokes are one step</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 147 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 126)\"><rect width=\"390\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"195.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MergePolicy  (owns nothing: pure)</text><text x=\"195.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M820 147 H880\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(880 126)\"><rect width=\"320\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">policy.merge(prev, next)</text><text x=\"160.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 178)\"><rect width=\"340\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">type a character</text><text x=\"170.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M370 199 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 178)\"><rect width=\"390\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"195.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Editor  (owns doc + history + lock)</text><text x=\"195.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M820 199 H880\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(880 178)\"><rect width=\"320\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">editor.type(\"h\")</text><text x=\"160.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"248\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb whose state is spread over two classes goes to the class that owns both: the Editor becomes the orchestrator</text><text x=\"615\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and REDO is not a new verb: it is execute() again, which is why the contract says every command must be repeatable</text></svg></div><div class=\"move\"><p>\"Put characters in at an offset\" touches the characters, so it belongs to the buffer: <code>buf.insert(at, s)</code>. \"Remember how to take them out again\" touches nothing but the edit itself, so it belongs to the command: <code>cmd.undo(doc)</code>, and the command is handed the document as a parameter rather than storing one, which is what later lets a stored command replay against a fresh document. \"Decide whether two keystrokes are one step\" touches no state at all: <code>policy.merge(prev, next)</code>, a pure rule. \"Type a character\" touches the buffer, the history, the version and the listeners at once; only the Editor sees all four, so it is the orchestrator. And notice what is <i>not</i> a new verb: redo. Redo is <code>execute()</code> again, which is why the contract on every command is two sentences &mdash; undo exactly cancels the last execute, and execute is repeatable. Get that second sentence and redo needs no code of its own, and no second place for offsets to drift.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 249\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 62)\"><rect width=\"220\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Editor</text><text x=\"110.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">constructor + configure(...)</text></g><path d=\"M250 107 H330 V47 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 26)\"><rect width=\"290\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TextBuffer</text><text x=\"145.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">how characters are stored</text></g><g transform=\"translate(750 26)\"><rect width=\"450\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"225.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">StringBuilderBuffer / GapBuffer / PieceTableBuffer</text><text x=\"225.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M750 47 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 107 H330 V107 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 86)\"><rect width=\"290\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MergePolicy</text><text x=\"145.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">when two edits are one step</text></g><g transform=\"translate(750 86)\"><rect width=\"450\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"225.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TypingBurstMergePolicy / NoMergePolicy</text><text x=\"225.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M750 107 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 107 H330 V167 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 146)\"><rect width=\"290\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EditListener</text><text x=\"145.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">renderer, autosave, plugin</text></g><g transform=\"translate(750 146)\"><rect width=\"450\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"225.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ConsoleRenderer, Autosave, Highlighter, a lambda</text><text x=\"225.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M750 167 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"216\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The Editor never builds one, so a piece table for a ten-megabyte file is a new class and one changed line</text><text x=\"615\" y=\"236\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one rule wraps the others: PasteIsItsOwnStep(policy) adds \"only plain typing may ever merge\" to EVERY grouping rule, including the ones written next year</text></svg></div><div class=\"move\"><p>Three things here will change and you know it before you start. How the characters are stored will change: a StringBuilder is honest to about a megabyte, a gap buffer past that, a piece table past that again &mdash; so <code>TextBuffer</code> is an interface with six methods and the Editor is handed one. When edits group will change: typing groups, a paste never does, an audited document groups nothing &mdash; so <code>MergePolicy</code> is a one-method interface. Who is told will change: a renderer today, autosave and a syntax highlighter and third party plugins tomorrow &mdash; so <code>EditListener</code> is a one-method interface. This is where the patterns come from, not the other way round: a swappable rule behind an interface is <b>Strategy</b>; a rule that wraps another rule and adds to it is <b>Decorator</b>, and here it is the one that matters &mdash; <code>PasteIsItsOwnStep</code> wraps whatever grouping rule you hand in and refuses to merge anything that is not plain typing, so a rule written next year cannot swallow a four-kilobyte paste into one ctrl+Z. An editor that announces \"something changed\" without knowing what a window is, is <b>Observer</b>. I do them; I do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 223\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 28)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the typing thread</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">buffer moves, history next</text></g><g transform=\"translate(30 112)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an autosave / a plugin</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads text() in the gap</text></g><g transform=\"translate(360 70)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the document</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">5 chars, history says 4</text></g><path d=\"M230 50 H360 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M230 134 H360 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"295\" y=\"38\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">writes</text><text x=\"295\" y=\"162\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads</text><rect x=\"600\" y=\"18\" width=\"300\" height=\"144\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"750\" y=\"43\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"750\" y=\"68\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">the buffer moved, the history</text><text x=\"750\" y=\"88\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">did not: the next ctrl+Z now</text><text x=\"750\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">deletes the wrong characters</text><text x=\"750\" y=\"140\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: all four as ONE step</text><g transform=\"translate(930 40)\"><rect width=\"270\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Editor.lock</text><text x=\"135.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">mutate + record + version + publish</text></g><text x=\"1065\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock lives where the shared state lives</text><text x=\"1065\" y=\"185\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">readers take no lock: a volatile snapshot</text><text x=\"615\" y=\"210\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the invariant spans a char array and two deques, so there is no single word to compare-and-swap: a lock here is honest, not lazy</text></svg></div><div class=\"move\"><p>An editor sounds single-threaded until you say the word autosave, and then there are two threads; add a plugin and a macro runner and there are four. Applying an edit and recording it are two writes to two different structures. A thread that slips between them leaves the buffer holding five characters and the history describing four, and they disagree <i>forever</i> &mdash; the next ctrl+Z deletes the wrong characters and the document is quietly ruined. So the critical section is not \"the buffer write\"; it is mutate the document, record the command, bump the version and publish the snapshot, as one unit, owned by the Editor. Guarding only the buffer is the half-fix that still lets a reader see text at version N beside a history describing N minus one. Two more details are deliberate. The lock is taken <i>exactly once</i> per edit: every public method &mdash; <code>type</code>, <code>append</code>, <code>cut</code>, <code>paste</code> &mdash; locks, reads the caret, builds the command, applies it and unlocks, and only then tells the listeners. Nothing re-enters, which is what makes \"the views are told outside the lock\" true rather than nearly true: get this wrong and a plugin that blocks for a second blocks every other writer for a second (there is a test for exactly that). And the Document itself has no lock and no synchronized method, because per-method locking makes each call atomic and leaves the read-then-write pair torn anyway.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 346\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">insert at the caret, again and again?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 37 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 18)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">char[] with a movable hole (gap buffer)</text><text x=\"270.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M980 37 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 18)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) amortised</text></g><g transform=\"translate(30 64)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what do I undo next?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 83 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 64)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ArrayDeque&lt;EditCommand&gt;, push/pop at the head</text><text x=\"270.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M980 83 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 64)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 110)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what do I redo next?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 129 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 110)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a second ArrayDeque, cleared by every new edit</text><text x=\"270.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M980 129 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 110)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 156)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is on screen right now?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 175 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 156)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">volatile String snapshot + AtomicLong version</text><text x=\"270.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M980 175 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 156)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), no lock</text></g><g transform=\"translate(30 202)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what does the Edit menu say?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 221 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 202)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the top k labels off the undo stack</text><text x=\"270.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M980 221 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 202)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(k)</text></g><g transform=\"translate(30 248)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">where does line 4000 start?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 267 H440\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(440 248)\"><rect width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">int[] of line starts, binary search (page 05)</text><text x=\"270.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M980 267 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 248)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(log L)</text></g><text x=\"615\" y=\"314\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the memory bound is the same idea: an undo step stores the CHANGE (an offset and a short string), never a copy of the document,</text><text x=\"615\" y=\"333\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and the step count is capped, so a long session cannot eat the heap. Once a step is evicted, \"back to the original\" is gone: say that out loud.</text></svg></div><div class=\"move\"><p>\"Insert at the caret, again and again\" is a gap buffer: one character array with a hole in it, kept where the caret is, so typing writes into the hole and costs nothing however long the document is; the array copy is paid once, when the caret jumps and the hole follows it. \"What do I undo next?\" and \"what do I redo next?\" are two deques, pushed and popped at the head, both O(1). \"What is on screen?\" is a volatile reference to an immutable String plus an <code>AtomicLong</code> version, so a renderer and an autosave read without touching the lock and cannot see a half-written document. \"What does the Edit menu say?\" is the top few labels off the undo stack, which is why <code>label()</code> was in the command contract from the first line. The memory bound is the same idea from the other end: a step stores the <i>change</i>, never a copy of the document, and the number of steps is capped &mdash; and once the oldest step is evicted the document can no longer return to its original, so the \"unsaved\" dot must come from comparing versions and not from an empty stack.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 245\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 28)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CLEAN</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">both stacks empty</text></g><path d=\"M190 50 H205\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(205 28)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CAN UNDO</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">edits, none undone</text></g><path d=\"M365 50 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 28)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BOTH</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">undone, redo waiting</text></g><g transform=\"translate(30 118)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ALL UNDONE</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">only redo is left</text></g><path d=\"M380 72 V118 H190\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"300\" y=\"112\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">undo, undo, undo</text><path d=\"M110 118 V95 H285 V72\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"278\" y=\"90\" text-anchor=\"end\" font-size=\"10.5\" fill=\"#ff6b6b\">a new edit here CLEARS redo</text><rect x=\"560\" y=\"18\" width=\"650\" height=\"192\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"885\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside apply(), and why it is this order</text><text x=\"575\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 take the lock -- once per edit; every public method builds its command inside this same span</text><text x=\"575\" y=\"87\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 cmd.execute(doc) -- the buffer moves, or it throws and nothing else happened</text><text x=\"575\" y=\"108\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 only now history.record(cmd): an undo step for an edit that DID happen</text><text x=\"575\" y=\"129\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4 bump the version, publish a fresh snapshot, release the lock</text><text x=\"575\" y=\"150\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5 then tell the listeners, each inside a try/catch</text><text x=\"575\" y=\"171\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a failed edit leaves the text, the history, the version and the caret untouched;</text><text x=\"575\" y=\"192\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a command recorded for an edit that never landed would later delete somebody else's characters</text><text x=\"615\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the edge where the bugs live: any new edit from BOTH or ALL UNDONE must CLEAR the redo stack. Forget it, and a later redo re-applies an edit at an offset that is gone.</text></svg></div><div class=\"move\"><p>The history has exactly four states, defined by whether each stack is empty: CLEAN, CAN UNDO, BOTH, and ALL UNDONE. One edge is where every bug lives: an edit arriving in BOTH or ALL UNDONE must clear the redo stack. Forget it and a later redo re-applies an edit at an offset that no longer exists; clear it on undo as well, by mistake, and redo never works at all. Writing the states down forces the other question too: what is the system after an edit that threw? The answer is an order. Take the lock; run <code>cmd.execute(doc)</code> first, because that is the step that can fail, and a command validates its offsets before it touches a character; only if the mutation succeeded does <code>history.record(cmd)</code> run, because an undo step for an edit that never happened would later delete somebody else's characters; then the version and the snapshot; then the unlock; then the listeners. A composite goes further and undoes the children that already ran, and puts the caret back, before letting the exception out: a half-applied macro must never reach the undo stack.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one document's edits happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 316\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"560\" height=\"158\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about 2 microseconds on a 20 KB file</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">insert into the gap: ~20 ns, no characters move</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">push one command onto a deque: ~20 ns</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">ask the grouping rule if it fuses: ~50 ns</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">bump an AtomicLong: ~10 ns</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">copy the document into a snapshot String: ~1.5 us  <-- 95% of it</text></g><path d=\"M590 96 H650\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"620\" y=\"86\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(650 18)\"><rect width=\"550\" height=\"158\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"275.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: milliseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the repaint: ~5 ms, after the unlock</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">autosave writing the snapshot: ~3 ms</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">a syntax highlighter re-tokenising: ~1 ms</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">a plugin doing who knows what</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">the human deciding what to type: seconds</text></g><text x=\"615\" y=\"202\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">eight threads append at the same instant (this is the actual test in FailureTests.java)</text><g transform=\"translate(30 216)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 1</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(178 216)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 2</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 2 us</text></g><g transform=\"translate(326 216)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 3</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 4 us</text></g><g transform=\"translate(474 216)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 4</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 6 us</text></g><g transform=\"translate(622 216)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 5</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 8 us</text></g><g transform=\"translate(770 216)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 6</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 10 us</text></g><g transform=\"translate(918 216)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 7</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 12 us</text></g><g transform=\"translate(1066 216)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 8</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 14 us</text></g><text x=\"615\" y=\"284\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the eighth waits fourteen microseconds and then repaints for five milliseconds: one at a time is true, and nobody can tell.</text><text x=\"615\" y=\"303\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the honest weak spot is the snapshot copy. On a 20 KB file it is 1.5 us; on a 1 MB file it is 60 us; on 10 MB it is the reason for move 8's second rung.</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself: if every keystroke takes the document's lock, is the editor now a queue? It is, for about two microseconds on a twenty-kilobyte file. Inside the lock there is an insert into the gap (about twenty nanoseconds, because no characters move), one push onto a deque, one call to the grouping rule, one atomic increment &mdash; and then the part that actually costs: copying the whole document into a fresh snapshot String, about a microsecond and a half, which is ninety-five per cent of the lock. Everything else is outside: the repaint at five milliseconds, autosave at three, a highlighter at one, a plugin doing who knows what, all after the unlock and each in a try/catch. Eight threads appending at the same instant &mdash; which is literally the first failure test &mdash; make the eighth wait about fourteen microseconds. Name the weak spot before they do: the snapshot copy is 1.5 us on 20 KB, 60 us on a megabyte, and 600 us on ten megabytes, and that is the rung you climb next.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 242\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"18\" width=\"560\" height=\"190\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per document: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"68\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a fast typist is 8 keystrokes a second, not 8000</text><text x=\"35\" y=\"93\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the locked part of one keystroke on a 20 KB file: ~2 us</text><text x=\"35\" y=\"118\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">8 x 2 us = 16 microseconds of lock in every second</text><text x=\"35\" y=\"143\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">that is 0.0016% busy: two writers collide about never</text><text x=\"35\" y=\"168\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">and the lock is per DOCUMENT, so twenty open tabs never meet</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 60)\"><rect width=\"600\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 notify and persist outside the lock</text><text x=\"300.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: listeners are called after the unlock</text></g><g transform=\"translate(600 112)\"><rect width=\"600\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 stop copying the whole document p

 addContentToFile and readContentFromFile match the problem&#x27;s example&quot;);\n        int lost18 = 0;\n        for (int round = 0; round &lt; 50; round++) {\n            LeetCode588 race18 = new LeetCode588();\n            CountDownLatch go18 = new CountDownLatch(1);\n            List&lt;Thread&gt; two = new ArrayList&lt;&gt;();\n            for (String text : List.of(&quot;A&quot;, &quot;B&quot;))\n                two.add(new Thread(() -&gt; { try { go18.await(); } catch (InterruptedException ignored) { } race18.addContentToFile(&quot;/x/y/log.txt&quot;, text); }));\n            two.forEach(Thread::start);\n            go18.countDown();\n            for (Thread t : two) t.join();\n            String body = race18.readContentFromFile(&quot;/x/y/log.txt&quot;);\n            if (!body.equals(&quot;AB&quot;) &amp;&amp; !body.equals(&quot;BA&quot;)) lost18++;\n        }\n        check(lost18 == 0, &quot;50 races of two first writers: every file ends with both texts, because create-or-append is one step&quot;);\n        FileSystem strict = new FileSystem();\n        strict.mkdir(&quot;/x&quot;);\n        int refused18 = 0;\n        try { strict.mkdir(&quot;/x&quot;); } catch (AlreadyExistsException e) { refused18++; }\n        try { strict.mkdir(&quot;/y/z&quot;); } catch (NotFoundException e) { refused18++; }\n        check(refused18 == 2 &amp;&amp; !strict.exists(&quot;/y&quot;), &quot;strict mkdir makes one level: a taken name and a missing parent both throw&quot;);\n\n        // 19. cd and pwd: absolute, relative, ~ and .., a failed cd changes nothing, and Uber&#x27;s &quot;*&quot;\n        FileSystem shfs = new FileSystem();\n        shfs.mkdirs(&quot;/home/h/docs&quot;);\n        shfs.mkdirs(&quot;/var/log&quot;);\n        shfs.putFile(&quot;/var/log/app.log&quot;, &quot;x&quot;);\n        Shell shell = new Shell(shfs, &quot;/home/h&quot;);\n        shell.cd(&quot;/var&quot;); shell.cd(&quot;log&quot;); shell.cd(&quot;../../home/./h&quot;);\n        check(shell.pwd().equals(&quot;/home/h&quot;), &quot;cd takes absolute and relative paths, and . and .. fold: &quot; + shell.pwd());\n        shell.cd(&quot;~/docs&quot;);\n        check(shell.pwd().equals(&quot;/home/h/docs&quot;), &quot;~ is the home folder: &quot; + shell.pwd());\n        shell.cd(&quot;../../../../..&quot;);\n        check(shell.pwd().equals(&quot;/&quot;), &quot;.. above the root stays at /&quot;);\n        int refused19 = 0;\n        try { shell.cd(&quot;nope&quot;); } catch (NotFoundException e) { refused19++; }\n        try { shell.cd(&quot;/var/log/app.log&quot;); } catch (NotADirectoryException e) { refused19++; }\n        check(refused19 == 2 &amp;&amp; shell.pwd().equals(&quot;/&quot;), &quot;cd to a missing path or to a file throws and leaves pwd where it was&quot;);\n        shell.cd(&quot;/home&quot;);\n        shell.cdGlob(&quot;*/docs&quot;);\n        check(shell.pwd().equals(&quot;/home/h/docs&quot;), &quot;* stood for the child folder h: /home + */docs is &quot; + shell.pwd());\n\n        // 20. du in O(1): the kept totals always equal a slow recount, with eight threads writing and a folder moving\n        SizedFolder top = new SizedFolder(&quot;&quot;, null);\n        ExecutorService pool20 = Executors.newFixedThreadPool(8);\n        List&lt;Future&lt;?&gt;&gt; jobs20 = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; 8; t++) {\n            final int n = t;\n            jobs20.add(pool20.submit(() -&gt; {\n                SizedFolder mine = top.folder(&quot;var&quot;).folder(&quot;t&quot; + n);\n                for (int i = 0; i &lt; 500; i++) mine.putFile(&quot;f&quot; + (i % 50), i);   // new files and resized ones\n                return null;\n            }));\n        }\n        for (Future&lt;?&gt; f : jobs20) f.get();\n        pool20.shutdown();\n        top.folder(&quot;var&quot;).folder(&quot;t3&quot;).moveTo(top.folder(&quot;home&quot;));\n        top.folder(&quot;var&quot;).folder(&quot;t5&quot;).deleteFile(&quot;f7&quot;);\n        check(top.du() == top.recount() &amp;&amp; top.folder(&quot;var&quot;).du() == top.folder(&quot;var&quot;).recount()\n              &amp;&amp; top.folder(&quot;home&quot;).du() == top.folder(&quot;home&quot;).recount(),\n              &quot;du read &quot; + top.du() + &quot; in O(1) and a recount agrees, at / and at both ends of a move&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design an in-memory file system. <code>mkdir -p</code>, create and read a file, append to it, list a directory, move it, delete it &mdash; and it has to stay correct when several threads use it at once. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (durability and threads first). Then type in the order of Main.java: the three enums and the Clock; the exception family; FsPath with its normalising parse; the abstract FsNode and then FileNode (bytes plus its own lock) and DirNode (a sorted map of children); the WriteRequest record and the WriteGuard interface with one implementation; NodeFilter and the watcher; the Handle; then FileSystem with its two locks, the write path in the order of move 6, and the shape operations; then a main that builds a tree and runs eight threads at one file and fifty at one directory. If the clock runs out, the one thing that must exist is FsPath, the two node classes, and FileSystem with mkdirs, putFile, append, read, ls, move and delete. Inside it: one read-write lock for the tree, one lock per file, and the guard asked before anything changes. The Handle, the watchers, find and the audit guard are the parts to describe out loud and add only if time is left.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Now no file may be over 64 bytes, and the whole volume caps at 1 KB.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One new class and one line. The rule reads numbers the write path has already computed: the resulting size of this file and of the whole volume are in the WriteRequest before anything changes. So the rule is a class that reads two fields and throws. Nothing in FileSystem changes, because all three byte writes (create, overwrite, append) funnel through one guarded step, and mkdirs, move and delete ask the same guard with their path. Rules stack without knowing about each other, which is what the second class below shows. <code>WriteGuard.allOf(new CapacityGuard(64, 1024), new ReadOnlySubtreeGuard(\"/etc\"))</code> refuses any change under <code>/etc</code> (a write, a mkdir, an mv or an rm) and a write over 64 bytes anywhere. Neither rule has heard of the other. The one thing a guard may not do is anything slow, because it runs inside a lock.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** A size rule: no file over maxFile bytes, no volume over maxTotal bytes. The whole of &quot;quota&quot; in ten lines. */\nfinal class CapacityGuard implements WriteGuard {\n    private final long maxFileBytes, maxTotalBytes;\n    CapacityGuard(long maxFileBytes, long maxTotalBytes) { this.maxFileBytes = maxFileBytes; this.maxTotalBytes = maxTotalBytes; }\n    @Override public void check(WriteRequest r) {\n        if (r.mode() != WriteMode.OVERWRITE &amp;&amp; r.mode() != WriteMode.APPEND) return;   // mkdir, move, delete add no bytes\n        if (r.resultingFileBytes() &gt; maxFileBytes)\n            throw new QuotaExceededException(r.path() + &quot; would be &quot; + r.resultingFileBytes() + &quot; bytes, max is &quot; + maxFileBytes);\n        if (r.resultingTotalBytes() &gt; maxTotalBytes)\n            throw new QuotaExceededException(&quot;volume would be &quot; + r.resultingTotalBytes() + &quot; bytes, max is &quot; + maxTotalBytes);\n    }\n}\n\n// ---- ext: a read-only subtree -- the second rule, which is how you show that rules stack\n/**\n * &quot;Now make /etc read-only.&quot; A second WriteGuard, composed with the quota through WriteGuard.allOf: neither rule\n * knows the other exists, and FileSystem is not opened to add it. Every change asks the guard, so this refuses a\n * byte write, a mkdir, a move or a delete under /etc -- and an rm -r or mv of a folder ABOVE /etc, which would\n * take /etc with it. It throws an FsException like every other refusal, so one catch handles both rules.\n */\nfinal class ReadOnlySubtreeGuard implements WriteGuard {\n    private final FsPath frozen;\n    ReadOnlySubtreeGuard(String prefix) { this.frozen = FsPath.of(prefix); }\n    @Override public void check(WriteRequest r) {\n        FsPath p = FsPath.of(r.path());\n        boolean inside = p.startsWith(frozen);\n        boolean takesItAlong = (r.mode() == WriteMode.MOVE || r.mode() == WriteMode.DELETE) &amp;&amp; frozen.startsWith(p);\n        if (inside || takesItAlong) throw new FsException(frozen + &quot; is read-only, so &quot; + p + &quot; cannot change&quot;);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two threads append to the same file at the same instant. Prove you cannot lose a byte, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading the current array and publishing the bigger one. Append does the whole read-modify-write inside that file's own lock, so no other writer can run in the gap. The proof is a count, not an argument. Eight threads released together by a latch (a gate that opens for all of them at once) each append one byte five hundred times, and the file must be exactly four thousand bytes. Run the identical workload through the unsynchronised path in Main and it loses between 1,700 and 2,900 of them, depending on the run: that number is worth saying out loud. The test also checks that the running byte counter still equals a fresh walk of the tree, because a lock that protects the bytes but not the accounting is only half a lock.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 6. eight threads appending to ONE file lose nothing, and the running total still matches a fresh walk\n        FileSystem race = new FileSystem();\n        race.putFile(&quot;/log.txt&quot;, &quot;&quot;);\n        CountDownLatch go6 = new CountDownLatch(1);\n        ExecutorService pool6 = Executors.newFixedThreadPool(8);\n        List&lt;Future&lt;?&gt;&gt; jobs6 = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; 8; t++)\n            jobs6.add(pool6.submit(() -&gt; { go6.await(); for (int i = 0; i &lt; 500; i++) race.append(&quot;/log.txt&quot;, &quot;x&quot;); return null; }));\n        go6.countDown();\n        for (Future&lt;?&gt; f : jobs6) f.get();\n        pool6.shutdown();\n        check(race.read(&quot;/log.txt&quot;).length == 4000, &quot;8 threads x 500 appends left exactly 4000 bytes: no lost update&quot;);\n        check(race.totalBytes() == race.du(&quot;/&quot;), &quot;the incremental byte count still equals a fresh du of the tree&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock for the whole tree. Have you serialised the file system?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No: there are two locks, and the busy one is not exclusive. The shape of the tree sits under a read-write lock on the file system, and the bytes of each file under that file's own lock. A byte write takes the <i>read</i> side of the namespace lock plus its own file's lock, so eight writers to eight files run in parallel, while a delete still waits for them. Only mkdir, mv, rm and create take the exclusive side, for about three tenths of a microsecond each: two thousand a second is six hundredths of one per cent busy. The ladder, cheapest first: keep slow work out of the locks (done); a read-write lock per directory, shared on the way down and exclusive only on the folder that changes (the second class below; test 15 shows <code>/var/a</code> and <code>/var/b</code> changing at once); an immutable tree with a compare-and-set on the root, so readers take no lock at all.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The one guarded step every byte write funnels through. In order: hold the name still (namespace read lock),\n     * take the file&#x27;s lock, work out the resulting sizes, reserve them on the volume counter, ask the guard, and\n     * only then publish the new array -- one reference assignment, which cannot fail half way. A refused write\n     * releases its reservation and leaves the old bytes exactly where they were.\n     */\n    private void applyWrite(String path, byte[] bytes, WriteMode mode) {\n        FsPath p = FsPath.of(path);\n        namespace.readLock().lock();\n        try {\n            FsNode n = nodeAt(p);\n            if (n.isDirectory()) throw new IsADirectoryException(path);\n            FileNode f = (FileNode) n;\n            f.lock();                                                       // order: namespace, then file. Never the reverse.\n            try {\n                long before = f.sizeLocked();\n                long after = mode == WriteMode.APPEND ? before + bytes.length : bytes.length;\n                if (after &gt; MAX_FILE_BYTES) throw new QuotaExceededException(path + &quot; would pass 2 GB, the most one byte[] can hold&quot;);\n                long delta = after - before;\n                long total = totalBytes.addAndGet(delta);                   // reserve, so two writers cannot both pass one quota\n                try { guard.check(new WriteRequest(p.toString(), mode, after, total, fileCount.get())); }\n                catch (RuntimeException e) { totalBytes.addAndGet(-delta); throw e; }\n                f.setContentLocked(mode == WriteMode.APPEND ? concat(f.contentLocked(), bytes) : bytes.clone(), clock.nowMs());\n            } finally { f.unlock(); }\n        } finally { namespace.readLock().unlock(); }\n        publish(new FsEvent(EventKind.WRITTEN, p.toString(), clock.nowMs()));\n    }\n\n// ---- ext: one namespace lock is the bottleneck -- a lock per directory, taken from the root down\n/**\n * Rung two of the ladder. Replace the single namespace lock with a read-write lock per directory. To change the\n * names inside one folder, take the READ side of every folder above it, from the root down, and the WRITE side of\n * that folder only. mkdir /var/a/x and mkdir /var/b/y then share / and /var and run at the same time, while a\n * change to /var&#x27;s own names (moving /var/a) waits for both. Everyone locks from the root down, so no two threads\n * can hold two locks in opposite orders. A move between two folders needs two write sides, which is the hard\n * part (Linux keeps one extra per-volume lock just for such renames). Real code keeps the lock on the DirNode.\n */\nfinal class StripedNamespace {\n    private final Map&lt;String, ReentrantReadWriteLock&gt; locks = new ConcurrentHashMap&lt;&gt;();\n    private ReentrantReadWriteLock lockFor(FsPath p) { return locks.computeIfAbsent(p.toString(), k -&gt; new ReentrantReadWriteLock()); }\n\n    /** Run body, which changes the names inside dir: shared locks on the way down, the exclusive one on dir. */\n    void withDirLocked(String dir, Runnable body) {\n        FsPath p = FsPath.of(dir);\n        List&lt;Lock&gt; held = new ArrayList&lt;&gt;();\n        try {\n            for (int i = 0; i &lt;= p.depth(); i++) {\n                ReentrantReadWriteLock rw = lockFor(p.prefix(i));\n                Lock l = i &lt; p.depth() ? rw.readLock() : rw.writeLock();   // parent first, always\n                l.lock();\n                held.add(l);\n            }\n            body.run();\n        } finally {\n            for (int i = held.size() - 1; i &gt;= 0; i--) held.get(i).unlock();\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>4 &middot; One thread is appending to /a/b/f.txt while another renames /a/b. What happens, and can your two locks deadlock?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing is lost and nothing is torn, because the two calls cannot overlap. An append holds the namespace <i>read</i> lock for its whole run and a rename needs the <i>write</i> side, so the rename finishes before the append resolves the path, or waits until the append has published its bytes. Either way the bytes are safe: a move changes a name in a parent's map and never touches a node's bytes. A caller that arrives after the rename gets <code>NotFoundException</code> for the old path, as on a real file system. Deadlock cannot happen: every thread takes the namespace lock before any file lock, and no thread holds two file locks at once. The test below runs four appending threads against a fifth that renames the folder back and forth; a thirty-second timeout turns a deadlock into a failed run instead of a hung one.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 10. a rename and a write at the same instant: no byte is lost, and the two locks cannot deadlock\n        FileSystem mv = new FileSystem();\n        mv.mkdirs(&quot;/a/b&quot;);\n        mv.putFile(&quot;/a/b/f.txt&quot;, &quot;&quot;);\n        AtomicInteger landed = new AtomicInteger();\n        AtomicBoolean stop = new AtomicBoolean(false);\n        CountDownLatch go10 = new CountDownLatch(1);\n        ExecutorService pool10 = Executors.newFixedThreadPool(5);\n        List&lt;Future&lt;?&gt;&gt; writers10 = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; 4; t++)\n            writers10.add(pool10.submit(() -&gt; {\n                go10.await();\n                for (int i = 0; i &lt; 500; i++) {\n                    try { mv.append(&quot;/a/b/f.txt&quot;, &quot;x&quot;); landed.incrementAndGet(); }\n                    catch (NotFoundException e) { i--; }                 // the directory is called b2 this instant: retry\n                }\n                return null;\n            }));\n        Future&lt;?&gt; renamer = pool10.submit(() -&gt; {\n            go10.await();\n            while (!stop.get()) { mv.move(&quot;/a/b&quot;, &quot;/a/b2&quot;); mv.move(&quot;/a/b2&quot;, &quot;/a/b&quot;); Thread.yield(); }\n            return null;\n        });\n        go10.countDown();\n        for (Future&lt;?&gt; f : writers10) f.get(30, TimeUnit.SECONDS);       // a deadlock here times out and fails the run\n        stop.set(true);\n        renamer.get(30, TimeUnit.SECONDS);\n        pool10.shutdown();\n        check(landed.get() == 2000 &amp;&amp; mv.read(&quot;/a/b/f.txt&quot;).length == 2000,\n              &quot;2000 appends survived a directory being renamed under them, with nothing lost and nothing torn&quot;);\n        check(mv.totalBytes() == mv.du(&quot;/&quot;), &quot;and the byte accounting still matches a fresh walk after the renames&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; The quota refuses a write half way through. What is the state of the file system?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was. The order is the answer: resolve, take the locks, work out the resulting sizes, reserve them on the volume counter, ask the guard, and only then publish. A reservation is a number moving, not bytes, so a refusal releases it and the counter reads what it read before. The bytes are published by a single reference assignment, which cannot fail half way, and it happens after every step that can say no. On a create the guard is asked before the node is linked into the tree at all. So no empty file is left behind and no inflated file count poisons later quota decisions, which is strictly better than creating it and rolling back. The failure test checks the bytes, the counter and the absence of the file, all three.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Create the file or replace its bytes. */\n    void putFile(String path, String content) { createOrWrite(path, content, WriteMode.OVERWRITE); }\n\n    /** LeetCode 588&#x27;s addContentToFile: create the file, or add to its end if it exists -- one step, so two first writers cannot wipe each other. */\n    void addContent(String path, String content) { createOrWrite(path, content, WriteMode.APPEND); }\n\n    /**\n     * The create path. It may change the shape of the tree, so it takes the write side. The order is the whole\n     * point: resolve, reserve the bytes, ask the guard, and only then create the node -- so a refused write has\n     * nothing to roll back, because nothing was ever linked in.\n     */\n    private void createOrWrite(String path, String content, WriteMode mode) {\n        byte[] bytes = content.getBytes(StandardCharsets.UTF_8);\n        FsPath p = FsPath.of(path);\n        if (p.isRoot()) throw new IsADirectoryException(&quot;/&quot;);\n        EventKind kind;\n        namespace.writeLock().lock();\n        try {\n            DirNode parent = dirAt(p.parent());\n            FsNode existing = parent.child(p.name());\n            if (existing != null &amp;&amp; existing.isDirectory()) throw new IsADirectoryException(path);\n            FileNode f = (FileNode) existing;\n            long before = f == null ? 0 : f.sizeBytes();\n            long after = mode == WriteMode.APPEND ? before + bytes.length : bytes.length;\n            if (after &gt; MAX_FILE_BYTES) throw new QuotaExceededException(path + &quot; would pass 2 GB, the most one byte[] can hold&quot;);\n            long delta = after - before;\n            long total = totalBytes.addAndGet(delta);                       // reserve first: a number moves, no bytes yet\n            long count = f == null ? fileCount.get() + 1 : fileCount.get();\n            try { guard.check(new WriteRequest(p.toString(), mode, after, total, count)); }\n            catch (RuntimeException e) { totalBytes.addAndGet(-delta); throw e; }   // release the reservation; nothing was created\n            if (f == null) { f = new FileNode(p.name(), clock.nowMs()); parent.put(f); fileCount.incrementAndGet(); kind = EventKind.CREATED; }\n            else kind = EventKind.WRITTEN;\n            f.lock();\n            try { f.setContentLocked(mode == WriteMode.APPEND ? concat(f.contentLocked(), bytes) : bytes, clock.nowMs()); }\n            finally { f.unlock(); }\n        } finally { namespace.writeLock().unlock(); }\n        publish(new FsEvent(kind, p.toString(), clock.nowMs()));\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; mv /a into /a/b/c, and rm on a directory that still has children.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both are refused, each in one line, because the path was parsed once. Moving a folder into its own subtree would leave it reachable only from itself, so the check asks: is the destination at or under the source? On strings, <code>dst.startsWith(src)</code> is wrong, because <code>/a/bc</code> starts with <code>/a/b</code>; on a list of segments it is exact. Removing a folder that has children throws unless the caller passed recursive. A move that does happen is three pointer operations inside one exclusive lock (unlink the old name, rename the node, link the new one), so nobody sees the node at neither name, and the cost is the same for three descendants or thirty thousand. A move onto a name that exists is refused (Unix <code>mv</code> would replace a file); say which you chose. Datadog turns rm -rf around: with only \"delete one file or one empty folder\", delete a tree children first, with an explicit stack so a deep tree cannot overflow the call stack.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Rename or move a node. Three pointer operations regardless of how big the subtree is: unlink the old name,\n     * rename the node, link the new name -- all inside one exclusive lock, so nobody can observe the moment when\n     * the node is at neither name. Refuses a move into the mover&#x27;s own subtree, which would orphan it.\n     */\n    void move(String from, String to) {\n        FsPath src = FsPath.of(from), dst = FsPath.of(to);\n        if (src.isRoot() || dst.isRoot()) throw new InvalidMoveException(&quot;cannot move the root&quot;);\n        namespace.writeLock().lock();\n        try {\n            DirNode srcParent = dirAt(src.parent());\n            FsNode node = srcParent.child(src.name());\n            if (node == null) throw new NotFoundException(from);\n            if (src.equals(dst)) return;                                    // it exists, and a move onto itself changes nothing\n            if (node.isDirectory() &amp;&amp; dst.startsWith(src))\n                throw new InvalidMoveException(&quot;cannot move &quot; + src + &quot; into its own subtree &quot; + dst);\n            DirNode dstParent = dirAt(dst.parent());\n            if (dstParent.child(dst.name()) != null) throw new AlreadyExistsException(to);\n            guard.check(shapeChange(src, WriteMode.MOVE));                  // the name leaves here...\n            guard.check(shapeChange(dst, WriteMode.MOVE));                  // ...and arrives here: both must be allowed\n            srcParent.remove(src.name());\n            node.rename(dst.name());\n            dstParent.put(node);\n            node.touch(clock.nowMs());\n        } finally { namespace.writeLock().unlock(); }\n        publish(new FsEvent(EventKind.MOVED, dst.toString(), src.toString(), clock.nowMs()));\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>7 &middot; They hand you LeetCode 588: ls, mkdir, addContentToFile, readContentFromFile. Then Coinbase&#x27;s stricter mkdir.</h3><button class=\"timer\" data-min=\"6\">start 6:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Three of the four calls already exist: <code>ls</code> is <code>ls</code> (a file path lists just its own name, as 588 asks), <code>mkdir</code> is <code>mkdirs</code>, and <code>readContentFromFile</code> is <code>readString</code>. The fourth, <code>addContentToFile</code>, means create the file if it is missing and add to its end if it is not, and 588 also makes the missing folders. The adapter (a thin class that maps 588's names onto ours) makes the folders, then calls <code>addContent</code>, which creates or appends in one step under the write lock. The tempting version, append, catch \"not found\", then create, lets two first writers both miss, and the second create wipes the first one's text. Test 18 races two first writers fifty times, and both texts always survive. Coinbase and LeetCode 1166 want the strict <code>mkdir</code> instead: exactly one new level, and an error if the parent is missing or the name is taken. Adobe's follow-up, \"what if the content is not text?\", is already answered, because the core stores bytes.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: LeetCode 588 -- the four calls, mapped onto the file system\n/**\n * &quot;Design In-Memory File System&quot; (LeetCode 588) as interviewers hand it out. Three calls already exist; the fourth,\n * addContentToFile, is create-or-append, and 588 also makes any missing folders on the way.\n */\nfinal class LeetCode588 {\n    private final FileSystem fs = new FileSystem();\n    /** Sorted names; a file path lists just its own name, as 588 asks. */\n    List&lt;String&gt; ls(String path) { return fs.ls(path); }\n    void mkdir(String path) { fs.mkdirs(path); }\n    /** Make the missing folders, then create-or-append in ONE locked step: never append, catch &quot;not found&quot;, then create. */\n    void addContentToFile(String filePath, String content) {\n        fs.mkdirs(FsPath.of(filePath).parent().toString());\n        fs.addContent(filePath, content);\n    }\n    String readContentFromFile(String filePath) { return fs.readString(filePath); }\n}\n\n// in FileSystem (Main.java)\n/** mkdir without -p (Coinbase&#x27;s and LeetCode 1166&#x27;s rule): exactly one new level, or an error if the parent is missing or the name is taken. */\n    void mkdir(String path) {\n        FsPath p = FsPath.of(path);\n        if (p.isRoot()) throw new AlreadyExistsException(&quot;/&quot;);\n        namespace.writeLock().lock();\n        try {\n            DirNode parent = dirAt(p.parent());                             // NotFoundException if the parent is missing\n            if (parent.child(p.name()) != null) throw new AlreadyExistsException(p.toString());\n            guard.check(shapeChange(p, WriteMode.MKDIR));\n            parent.put(new DirNode(p.name(), clock.nowMs()));\n        } finally { namespace.writeLock().unlock(); }\n        publish(new FsEvent(EventKind.CREATED, p.toString(), clock.nowMs()));\n    }\n/** LeetCode 588&#x27;s addContentToFile: create the file, or add to its end if it exists -- one step, so two first writers cannot wipe each other. */\n    void addContent(String path, String content) { createOrWrite(path, content, WriteMode.APPEND); }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Add cd and pwd: a working directory, relative paths and ~. Then Uber&#x27;s twist: a * inside cd.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The working directory belongs to a session, not to the file system, so a <code>Shell</code> owns it and turns every typed path into an absolute one before the file system sees it. A path that starts with <code>/</code> is absolute, <code>~</code> is the home folder, and anything else is glued onto the working directory. <code>FsPath</code> then folds <code>.</code> and <code>..</code> as before. <code>cd</code> checks that the target exists and is a folder, and only then moves, so a failed <code>cd</code> leaves <code>pwd</code> where it was. Say what <code>..</code> above the root does: this code stays at <code>/</code>, as Meta's reported example does, but some versions want an error, so ask. Uber lets a <code>*</code> segment stand for <code>.</code>, <code>..</code> or any child folder; <code>cdGlob</code> tries those choices in that order, depth first (one choice is followed to the end before the next is tried), and the first path that reaches a real folder wins. Symlinks inside <code>cd</code> are the symlink card's walk; test 19 covers the rest.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: cd and pwd -- a working directory, relative paths, &quot;~&quot;, and Uber&#x27;s &quot;*&quot;\n/**\n * A shell session. The one piece of state it owns is the working directory, and it turns every path the user types\n * into an absolute one before the file system sees it: &quot;/x&quot; is absolute, &quot;~&quot; is home, anything else starts at the\n * working directory. FsPath then folds &quot;.&quot; and &quot;..&quot; as before, clamping at the root.\n */\nfinal class Shell {\n    private final FileSystem fs;\n    private final FsPath home;\n    private volatile FsPath cwd = FsPath.ROOT;\n    Shell(FileSystem fs, String home) { this.fs = fs; this.home = FsPath.of(home); }\n\n    String pwd() { return cwd.toString(); }\n    /** What the user typed, as an absolute path. */\n    FsPath absolute(String typed) {\n        if (typed.startsWith(&quot;/&quot;)) return FsPath.of(typed);\n        if (typed.equals(&quot;~&quot;) || typed.startsWith(&quot;~/&quot;)) return FsPath.of(home + typed.substring(1));\n        return FsPath.of(cwd + &quot;/&quot; + typed);\n    }\n    /** Check first, then move: a cd to a missing path or to a file throws and leaves the working directory where it was. */\n    void cd(String typed) {\n        FsPath target = absolute(typed);\n        if (!fs.exists(target.toString())) throw new NotFoundException(target.toString());\n        if (!fs.isDirectory(target.toString())) throw new NotADirectoryException(target.toString());\n        cwd = target;\n    }\n    void mkdir(String typed) { fs.mkdirs(absolute(typed).toString()); }\n    List&lt;String&gt; ls() { return fs.ls(cwd.toString()); }\n\n    /**\n     * Uber&#x27;s twist: a &quot;*&quot; segment may stand for &quot;.&quot;, &quot;..&quot; or any child folder. Try those choices in that order, depth\n     * first; the first path that leads to a real folder wins. If none does, cd fails and nothing moves.\n     */\n    void cdGlob(String typed) {\n        FsPath found = firstMatch(typed.startsWith(&quot;/&quot;) ? FsPath.ROOT : cwd, typed.split(&quot;/&quot;), 0);\n        if (found == null) throw new NotFoundException(typed);\n        cwd = found;\n    }\n    private FsPath firstMatch(FsPath at, String[] segs, int i) {\n        if (i == segs.length) return at;\n        List&lt;String&gt; choices = new ArrayList&lt;&gt;();\n        if (segs[i].equals(&quot;*&quot;)) {\n            choices.addAll(List.of(&quot;.&quot;, &quot;..&quot;));\n            for (String c : fs.ls(at.toString())) if (fs.isDirectory(at.child(c).toString())) choices.add(c);\n        } else choices.add(segs[i]);\n        for (String c : choices) {\n            FsPath next = c.isEmpty() || c.equals(&quot;.&quot;) ? at : c.equals(&quot;..&quot;) ? at.parent() : at.child(c);\n            if (!fs.isDirectory(next.toString())) continue;\n            FsPath found = firstMatch(next, segs, i + 1);\n            if (found != null) return found;\n        }\n        return null;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>9 &middot; du /var must be O(1), and it must stay right while files change.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Keep the answer instead of computing it: every folder holds an <code>AtomicLong</code> of the bytes under it. A file that grows or shrinks by delta bytes adds delta to its folder and to every folder above it, so <code>du</code> is one read and a write costs O(depth) instead of nothing. In <code>FileSystem</code> that is a short loop in the write path, over the folders the walk from the root has just passed. A move takes the folder's bytes out of every old ancestor and adds them to every new one; a delete takes them out. The counters are atomic because writers to different files add to the same parent at once, and a move takes the write lock, so no write is half-counted. Google asks the same over a map of ids: keep sizes in a <code>long</code>, since gigabytes overflow an <code>int</code>, and keep a visited set if the input could contain a cycle. Test 20 checks <code>du</code> against a slow recount after eight threads write and a folder moves.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: du in O(1) -- each folder keeps the bytes under it, and every write pays O(depth)\n/**\n * &quot;du must be O(1) and stay right while files change.&quot; Each folder keeps an AtomicLong of the bytes under it. A file\n * that changes by delta bytes adds delta to its folder and to every folder above it, so du is one read and a write\n * costs O(depth). A move takes the folder&#x27;s bytes out of every old ancestor and adds them to every new one. The\n * counters are atomic because writers to different files add to the same parent at once; in the real file system a\n * move holds the namespace write lock, so no write is half-counted while it runs.\n */\nfinal class SizedFolder {\n    private final String name;\n    private volatile SizedFolder parent;\n    private final AtomicLong bytesUnder = new AtomicLong();\n    private final Map&lt;String, SizedFolder&gt; folders = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Long&gt; files = new ConcurrentHashMap&lt;&gt;();\n    SizedFolder(String name, SizedFolder parent) { this.name = name; this.parent = parent; }\n\n    SizedFolder folder(String n) { return folders.computeIfAbsent(n, k -&gt; new SizedFolder(k, this)); }\n    /** Create or resize a file here; the difference travels up to the root. O(depth). */\n    void putFile(String n, long size) { Long old = files.put(n, size); addUp(size - (old == null ? 0 : old)); }\n    void deleteFile(String n) { Long old = files.remove(n); if (old != null) addUp(-old); }\n    /** Move this folder under another: its bytes leave every old ancestor and arrive at every new one. O(depth). */\n    void moveTo(SizedFolder to) {\n        long b = bytesUnder.get();\n        parent.folders.remove(name); parent.addUp(-b);\n        parent = to; to.folders.put(name, this); to.addUp(b);\n    }\n    /** O(1): the answer is already there. */\n    long du() { return bytesUnder.get(); }\n    /** The slow answer, a walk; a test compares it with du(). */\n    long recount() {\n        long s = 0;\n        for (long f : files.values()) s += f;\n        for (SizedFolder c : folders.values()) s += c.recount();\n        return s;\n    }\n    private void addUp(long delta) { for (SizedFolder f = this; f != null; f = f.parent) f.bytesUnder.addAndGet(delta); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>10 &middot; Find every .txt over 4 KB, and then the ten biggest files under /var.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The traversal is written once and what changes is a yes/no question about one node, so there is no findByExtension, then findBySize, then findByExtensionAndSize. The predicates compose: <code>Filters.extension(\"txt\").and(Filters.largerThan(4096))</code>, and the walk runs under the namespace read lock so the tree cannot change underneath it. \"The ten biggest\" is the same single walk feeding a heap of ten entries (a heap always knows its smallest entry, so an eleventh pushes the smallest out). That is O(n log 10) time and ten slots of memory, not a sort of everything. Two more for a big tree. <code>find</code> should return a lazy iterator (one that finds the next hit only when asked) rather than collect every hit. And a listing of two hundred thousand names comes a page at a time. The fifty names after a cursor are read straight off the sorted map in O(log k + 50), and test 16 pages through 100,000 names in about 20 ms.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: millions of files -- a page of names, and top-N without sorting the tree\n/**\n * The read APIs a big tree forces. ls returns a page and a cursor instead of two hundred thousand names -- read\n * straight off the sorted map, so a page costs O(log k + n) -- and &quot;the ten biggest files under /var&quot; is the same\n * single walk folded into a bounded heap, never a sort of everything.\n */\nfinal class BigTree {\n    /** One page of a directory listing: the names after the cursor, plus the next cursor or null. */\n    record Page(List&lt;String&gt; names, String next) {}\n    static Page page(FileSystem fs, String dir, String after, int n) {\n        if (n &lt;= 0) throw new IllegalArgumentException(&quot;a page holds at least one name&quot;);\n        List&lt;String&gt; names = fs.ls(dir, after, n + 1);            // one extra name says whether another page exists\n        boolean more = names.size() &gt; n;\n        List&lt;String&gt; page = more ? names.subList(0, n) : names;\n        return new Page(List.copyOf(page), more ? page.get(n - 1) : null);\n    }\n\n    /**\n     * The n biggest files under a path, in one walk and n slots of memory. The predicate is called once per node\n     * under the read lock, so a predicate that records instead of answering is a fold over the walk; if that\n     * feels like abuse, the honest version makes walk() public and takes a visitor.\n     */\n    static List&lt;String&gt; topNBySize(FileSystem fs, String from, int n) {\n        PriorityQueue&lt;Map.Entry&lt;String, Long&gt;&gt; heap = new PriorityQueue&lt;&gt;(Map.Entry.comparingByValue());\n        fs.find(from, (path, node) -&gt; {\n            if (node.isDirectory()) return false;\n            heap.add(Map.entry(path, node.sizeBytes()));\n            if (heap.size() &gt; n) heap.poll();                       // the heap never holds more than n\n            return false;\n        });\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        while (!heap.isEmpty()) out.add(0, heap.poll().getKey());\n        return out;\n    }\n}\n\n// in DirNode (Main.java): the page is read off the sorted map\n/** Up to n names that sort after the cursor (from the start when it is null): O(log k + n), never a copy of all k. */\n    List&lt;String&gt; namesAfter(String after, int n) {\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (String s : after == null ? children.keySet() : children.tailMap(after, false).keySet()) {\n            if (out.size() == n) break;\n            out.add(s);\n        }\n        return out;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; Somebody deletes a file while I am reading it.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The reader finishes. Delete unlinks the name inside the exclusive lock: the entry leaves its parent's map, and the byte count drops at once, because the counters measure what is reachable by name. Then, outside the lock, each file that left the tree is told. A file nobody has open goes straight to FREED and releases its array. A file somebody has open goes to UNLINKED and keeps its bytes until that handle closes, at which point it goes to FREED. The handle holds the node rather than the path, which is the whole reason this works. Writing the three states down turns \"what about a reader mid-read?\" from an improvisation into a rule. The other defensible choice, refusing the delete while the file is open, is what Windows does, and it is one branch in the same place.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** A reader opened this file: the bytes must outlive an unlink until it closes. */\n    void acquire() { lock.lock(); try { openHandles++; } finally { lock.unlock(); } }\n    /** A reader closed. If the name is already gone and this was the last handle, the bytes are released now. */\n    void release() {\n        lock.lock();\n        try { if (--openHandles == 0 &amp;&amp; state == FileState.UNLINKED) { state = FileState.FREED; content = new byte[0]; } }\n        finally { lock.unlock(); }\n    }\n    /** The name left the tree. LIVE goes to UNLINKED if somebody is reading, straight to FREED if nobody is. */\n    void unlink() {\n        lock.lock();\n        try {\n            if (openHandles &gt; 0) state = FileState.UNLINKED;\n            else { state = FileState.FREED; content = new byte[0]; }\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * Delete a file, or a directory that recursive says may take its children with it. The name leaves the tree\n     * inside the lock; the bytes of any file somebody still has open survive until that reader closes.\n     */\n    void delete(String path, boolean recursive) {\n        FsPath p = FsPath.of(path);\n        if (p.isRoot()) throw new InvalidMoveException(&quot;cannot delete the root&quot;);\n        List&lt;FileNode&gt; orphans = new ArrayList&lt;&gt;();\n        namespace.writeLock().lock();\n        try {\n            DirNode parent = dirAt(p.parent());\n            FsNode node = parent.child(p.name());\n            if (node == null) throw new NotFoundException(path);\n            if (node.isDirectory() &amp;&amp; !((DirNode) node).isEmpty() &amp;&amp; !recursive) throw new DirectoryNotEmptyException(path);\n            guard.check(shapeChange(p, WriteMode.DELETE));\n            collect(node, orphans);\n            parent.remove(p.name());                                        // one pointer op; the subtree leaves with it\n            long bytes = 0;\n            for (FileNode f : orphans) bytes += f.sizeBytes();\n            totalBytes.addAndGet(-bytes);\n            fileCount.addAndGet(-orphans.size());\n        } finally { namespace.writeLock().unlock(); }\n        for (FileNode f : orphans) f.unlink();                              // LIVE -&gt; UNLINKED, or straight to FREED\n        publish(new FsEvent(EventKind.DELETED, p.toString(), clock.nowMs()));\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Support symlinks. Now make /a point at /b and /b point at /a. And hard links.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A symlink is a third kind of node holding a target path, and the path walk changes in two ways. At a link, the walk puts the target's segments in front of the ones still to walk and restarts, counting hops. After forty hops it gives up, so /a to /b to /a is an error, not a hang. And <code>..</code> moves into the walk: <code>/shortcut/..</code> is the parent of the folder the link points at, so FsPath's early clean-up of <code>..</code> is wrong once links exist (Java's <code>Path.normalize()</code> carries the same warning; test 17). Nothing else learns that links exist. Hard links are a different shape: split the bytes into an inode (the record that holds a file's bytes, apart from its names) with a count of names, and point two directory entries at it. Deleting a name lowers the count, only the last one frees the bytes, and <code>du</code> must count shared bytes once, by inode identity.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: symlinks -- a third kind of node, and the path walk takes over &quot;..&quot;\n/**\n * A name that points at another path instead of at bytes. ls, find, the guards and the watchers keep treating it\n * as a node with a name and a size. The target is kept exactly as written: its &quot;..&quot; is resolved when it is walked.\n */\nfinal class SymlinkNode extends FsNode {\n    private final String target;\n    SymlinkNode(String name, String target, long now) {\n        super(name, now);\n        if (!target.startsWith(&quot;/&quot;)) throw new FsException(&quot;a link target must be absolute here: &quot; + target);\n        this.target = target;\n    }\n    String target() { return target; }\n    @Override boolean isDirectory() { return false; }\n    /** A link is a name, not bytes; its own size is the length of the target string, as on a real file system. */\n    @Override long sizeBytes() { return target.length(); }\n}\n\n/**\n * The changed path walk. It keeps the folders it is really in on a stack, so &quot;..&quot; means the parent of the folder\n * the walk has reached: /shortcut/.. is the parent of the link&#x27;s TARGET, not the root. That is why FsPath&#x27;s early\n * folding of &quot;..&quot; has to go once links exist (Java&#x27;s Path.normalize() carries the same warning). When a segment is\n * a link, its target&#x27;s segments are put in front of the ones still to walk and the walk restarts at the root,\n * counting hops; after MAX_HOPS it gives up, so a loop (/a -&gt; /b, /b -&gt; /a) is an error instead of a hang.\n */\nfinal class SymlinkResolver {\n    static final int MAX_HOPS = 40;                                      // the same limit Linux uses\n    /** Resolve a raw absolute path through any number of links. Caller holds the namespace read lock. */\n    static FsNode resolve(DirNode root, String raw) {\n        if (raw == null || !raw.startsWith(&quot;/&quot;)) throw new FsException(&quot;path must be absolute: &quot; + raw);\n        Deque&lt;String&gt; todo = new ArrayDeque&lt;&gt;(Arrays.asList(raw.split(&quot;/&quot;)));\n        Deque&lt;FsNode&gt; where = new ArrayDeque&lt;&gt;(List.of(root));             // the folders the walk is really in\n        int hops = 0;\n        while (!todo.isEmpty()) {\n            String seg = todo.pollFirst();\n            if (seg.isEmpty()) continue;\n            if (!where.peek().isDirectory()) throw new NotADirectoryException(raw);\n            if (seg.equals(&quot;.&quot;)) continue;\n            if (seg.equals(&quot;..&quot;)) { if (where.size() &gt; 1) where.pop(); continue; }   // the real parent; clamps at the root\n            FsNode next = ((DirNode) where.peek()).child(seg);\n            if (next == null) throw new NotFoundException(raw);\n            if (next instanceof SymlinkNode link) {\n                if (++hops &gt; MAX_HOPS) throw new FsException(&quot;too many levels of symbolic links: &quot; + raw);\n                String[] target = link.target().split(&quot;/&quot;);\n                for (int j = target.length - 1; j &gt;= 0; j--) todo.addFirst(target[j]);\n                where.clear(); where.push(root);                           // an absolute target: restart at the root\n                continue;\n            }\n            where.push(next);\n        }\n        return where.peek();\n    }\n}\n\n// ---- ext: hard links -- two names, one set of bytes, one refcount\n/**\n * The bytes, split out from the name. A hard link is a second directory entry pointing at the same inode; the\n * bytes die when the last name goes, which is what the refcount counts.\n */\nfinal class Inode {\n    private final ReentrantLock lock = new ReentrantLock();\n    private byte[] content;\n    private int links = 0;\n    Inode(byte[] content) { this.content = content; }\n    void link() { lock.lock(); try { links++; } finally { lock.unlock(); } }\n    /** Drop one name. Returns true when that was the last one and the bytes were released. */\n    boolean unlink() {\n        lock.lock();\n        try { if (--links == 0) { content = new byte[0]; return true; } return false; }\n        finally { lock.unlock(); }\n    }\n    int links() { lock.lock(); try { return links; } finally { lock.unlock(); } }\n    byte[] read() { lock.lock(); try { return content.clone(); } finally { lock.unlock(); } }\n    long size() { lock.lock(); try { return content.length; } finally { lock.unlock(); } }\n}\n\n/** A directory entry that shares its bytes with any other entry pointing at the same inode. */\nfinal class LinkedFile extends FsNode {\n    private final Inode inode;\n    LinkedFile(String name, Inode inode, long now) { super(name, now); this.inode = inode; inode.link(); }\n    Inode inode() { return inode; }\n    @Override boolean isDirectory() { return false; }\n    @Override long sizeBytes() { return inode.size(); }\n    /** du must count shared bytes once, so a real du folds over a set of inode identities, not over names. */\n    static long du(Collection&lt;LinkedFile&gt; entries) {\n        Set&lt;Inode&gt; seen = Collections.newSetFromMap(new IdentityHashMap&lt;&gt;());\n        long total = 0;\n        for (LinkedFile f : entries) if (seen.add(f.inode())) total += f.inode().size();\n        return total;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; Users and permissions.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Permissions are a rule that changes, so they go behind a one-method interface exactly like the quota did. Who is asking is threaded through the API as a value rather than read from a thread local (a hidden per-thread variable), so a test can be any user. The policy here is owner plus two bits &mdash; may others read, may others write &mdash; and anything more elaborate (groups, access control lists, inherited permissions) is a different implementation of the same interface. The check sits in front of the call in a thin wrapper, so <code>FileSystem</code> does not change and never learns what a user is. A rule that needs no user, like a read-only folder, can live in <code>WriteGuard</code> instead; a per-user rule cannot, because a <code>WriteRequest</code> carries no user. The table is keyed by path to stay short; a real system keeps the owner and the bits on the node, so they move with a rename.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: users and permissions -- the rule that changes, behind one interface, checked before the call\n/** Who is asking. Threaded through the API rather than read from a thread local, so a test can be any user. */\nrecord Principal(String user, Set&lt;String&gt; groups) {\n    static Principal of(String user) { return new Principal(user, Set.of()); }\n}\n\n/** What they want to do with the path. Two verbs is enough for the owner/mode model. */\nenum Access { READ, WRITE }\n\n/** The permission rule. One method, so it composes with the other rules and a test hands in a lambda. */\n@FunctionalInterface\ninterface AccessPolicy {\n    void check(Principal who, String path, Access what);\n    AccessPolicy ALLOW_ALL = (who, path, what) -&gt; {};\n}\n\n/**\n * Owner plus mode bits, the Unix model in twenty lines: each path has an owner and two booleans (may others\n * read, may others write). Anything more elaborate -- groups, ACLs, inherited permissions -- is a different\n * implementation of the same interface.\n */\nfinal class OwnerMode implements AccessPolicy {\n    private record Entry(String owner, boolean otherRead, boolean otherWrite) {}\n    private final Map&lt;String, Entry&gt; table = new ConcurrentHashMap&lt;&gt;();\n    /** Record who owns a path and what everybody else may do with it. */\n    void chown(String path, String owner, boolean otherRead, boolean otherWrite) { table.put(path, new Entry(owner, otherRead, otherWrite)); }\n    @Override public void check(Principal who, String path, Access what) {\n        Entry e = table.get(path);\n        if (e == null || e.owner().equals(who.user())) return;                       // unowned or mine\n        boolean ok = what == Access.READ ? e.otherRead() : e.otherWrite();\n        if (!ok) throw new FsException(&quot;permission denied: &quot; + who.user() + &quot; cannot &quot; + what + &quot; &quot; + path);\n    }\n}\n\n/**\n * A thin wrapper over the file system that asks the policy first and then delegates. The file system itself does\n * not change at all; it does not know what a user is.\n */\nfinal class SecureFs {\n    private final FileSystem fs;\n    private final AccessPolicy policy;\n    SecureFs(FileSystem fs, AccessPolicy policy) { this.fs = fs; this.policy = policy; }\n    void putFile(Principal who, String path, String content) { policy.check(who, path, Access.WRITE); fs.putFile(path, content); }\n    String read(Principal who, String path) { policy.check(who, path, Access.READ); return fs.readString(path); }\n    void delete(Principal who, String path, boolean recursive) { policy.check(who, path, Access.WRITE); fs.delete(path, recursive); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>14 &middot; Make delete recoverable: trash, restore and purge.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>\"Recoverable\" means the file has states rather than a boolean, which is move 6 again. Deleting becomes a move into a hidden <code>/.trash</code> under a generated id: the name leaves the visible tree, the bytes do not move at all, and the visible listing is already correct. Restoring is the same move backwards. Purging &mdash; explicitly, or by a sweeper that walks the trash on a timer under the write lock &mdash; is the only step that actually frees memory. Every one of those steps reuses a method that already exists, which is the point: a new step in a life costs a state and a transition, not new machinery. One order matters in restore: claim the record, move the file back, and put the record back if the move fails (the old path is taken again, or its folder is gone). A failed restore then loses nothing; test 14.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: trash and restore -- delete grows a life cycle, built out of move\n/**\n * &quot;Make delete recoverable&quot; means a file has states, not a boolean. Deleting becomes a move into a hidden\n * directory: the name leaves the visible tree, the bytes survive, restoring is the move back, and purging is the\n * only thing that actually frees memory. Every step reuses a method that already exists.\n */\nfinal class Trash {\n    private record Item(String originalPath, long deletedAtMs) {}\n    private final FileSystem fs;\n    private final Map&lt;String, Item&gt; items = new ConcurrentHashMap&lt;&gt;();   // many threads delete and restore at once\n    private final AtomicLong ids = new AtomicLong();\n    Trash(FileSystem fs) { this.fs = fs; fs.mkdirs(&quot;/.trash&quot;); }\n\n    /** LIVE -&gt; TRASHED: the name moves out of the visible tree and the bytes stay exactly where they were. */\n    String delete(String path, long nowMs) {\n        String id = &quot;t&quot; + ids.incrementAndGet();\n        fs.move(path, &quot;/.trash/&quot; + id);                                  // if this throws, nothing was recorded\n        items.put(id, new Item(path, nowMs));\n        return id;\n    }\n    /**\n     * TRASHED -&gt; LIVE: the same move, backwards. Claim the record first (a second restore or a purge now finds\n     * nothing), then move; if the move fails -- the old path is taken again, or its folder is gone -- put the\n     * record back, so the file stays in the trash and can be restored later or purged.\n     */\n    void restore(String id) {\n        Item it = items.remove(id);\n        if (it == null) throw new NotFoundException(&quot;/.trash/&quot; + id);\n        try { fs.move(&quot;/.trash/&quot; + id, it.originalPath()); }\n        catch (RuntimeException e) { items.put(id, it); throw e; }\n    }\n    /** TRASHED -&gt; PURGED: the only step that frees bytes. A sweeper calls this on a timer. */\n    int purge(long olderThanMs, long nowMs) {\n        int n = 0;\n        for (Map.Entry&lt;String, Item&gt; e : items.entrySet()) {\n            if (nowMs - e.getValue().deletedAtMs() &lt; olderThanMs) continue;\n            if (!items.remove(e.getKey(), e.getValue())) continue;         // a restore claimed it first\n            fs.delete(&quot;/.trash/&quot; + e.getKey(), true);\n            n++;\n        }\n        return n;\n    }\n    List&lt;String&gt; ids() { return new ArrayList&lt;&gt;(new TreeSet&lt;&gt;(items.keySet())); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>15 &middot; A ten-megabyte log appended a line at a time, and a write at a byte offset.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One array stops being the right shape at that size, for two reasons. Every append copies the whole file, so appending a line at a time is quadratic (the copying grows with the square of the file size). And a ten-megabyte file needs ten contiguous megabytes. Replace the array with a list of fixed chunks and both go away. Appending fills the tail chunk and adds another, so an append costs only the new bytes, never a copy of the file. A write at an offset touches one chunk instead of rebuilding the file. Read, size and version keep their meaning, so nothing above the file notices. The related upgrade is the lock. A file that is read far more often than it is written wants a read-write lock. A file edited by a human wants optimistic concurrency instead, because you cannot hold a lock across thirty seconds of typing. The caller reads a version, edits, and writes back only if nobody got there first.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: random access and big files -- one byte[] becomes a list of chunks\n/**\n * Replace a file&#x27;s single array with a list of fixed chunks and three costs change: append stops copying the\n * whole file (amortised O(1) instead of O(n)), a write at an offset touches one chunk, and a ten-megabyte file\n * stops needing ten contiguous megabytes. Read, size and version keep their meaning, so nothing above notices.\n */\nfinal class ChunkedContent {\n    private final int chunkSize;\n    private final List&lt;byte[]&gt; chunks = new ArrayList&lt;&gt;();\n    private long size = 0;\n    ChunkedContent(int chunkSize) { this.chunkSize = chunkSize; }\n\n    long size() { return size; }\n    /** Amortised O(1): fill the tail chunk, then add chunks. No copy of what is already there. */\n    void append(byte[] b) {\n        int off = 0;\n        while (off &lt; b.length) {\n            int inTail = (int) (size % chunkSize);\n            if (inTail == 0) chunks.add(new byte[chunkSize]);\n            byte[] tail = chunks.get(chunks.size() - 1);\n            int n = Math.min(chunkSize - inTail, b.length - off);\n            System.arraycopy(b, off, tail, inTail, n);\n            off += n; size += n;\n        }\n    }\n    /** A write at an offset inside the file: find the chunk, write into it. O(bytes written), not O(file). */\n    void writeAt(long offset, byte[] b) {\n        if (offset + b.length &gt; size) throw new FsException(&quot;write past the end of the file&quot;);\n        int off = 0;\n        while (off &lt; b.length) {\n            long pos = offset + off;\n            byte[] chunk = chunks.get((int) (pos / chunkSize));\n            int in = (int) (pos % chunkSize);\n            int n = Math.min(chunkSize - in, b.length - off);\n            System.arraycopy(b, off, chunk, in, n);\n            off += n;\n        }\n    }\n    /** Read a window. The caller never learns how many chunks it crossed. */\n    byte[] read(long offset, int len) {\n        byte[] out = new byte[(int) Math.min(len, size - offset)];\n        for (int i = 0; i &lt; out.length; i++) {\n            long pos = offset + i;\n            out[i] = chunks.get((int) (pos / chunkSize))[(int) (pos % chunkSize)];\n        }\n        return out;\n    }\n}\n\n// ---- ext: many readers, one writer -- and the optimistic write for a human in the loop\n/**\n * A file whose bytes are under a ReadWriteLock instead of a plain lock: any number of readers at once, one\n * writer alone. Worth it when reads dominate; the plain lock in Main is the simpler default.\n *\n * compareAndWrite is the other half. You cannot hold a lock across a human editing a config for thirty seconds,\n * so the caller reads a version, edits at leisure, and writes back only if nobody else got there first.\n */\nfinal class RwFile {\n    private final ReentrantReadWriteLock lock = new ReentrantReadWriteLock();\n    private byte[] content = new byte[0];\n    private final AtomicLong version = new AtomicLong();\n\n    /** Many of these run at the same time. */\n    byte[] read() { lock.readLock().lock(); try { return content.clone(); } finally { lock.readLock().unlock(); } }\n    long version() { return version.get(); }\n    /** Optimistic: false means somebody else wrote while you were thinking, so re-read and try again. */\n    boolean compareAndWrite(long expectedVersion, byte[] bytes) {\n        lock.writeLock().lock();\n        try {\n            if (version.get() != expectedVersion) return false;\n            content = bytes.clone(); version.incrementAndGet();\n            return true;\n        } finally { lock.writeLock().unlock(); }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>16 &middot; The indexer watching /var cannot keep up with the writes. What happens to its events?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Watchers are told after the unlock, so a slow one never holds a lock, but the writer's own thread still runs the subscriber's code. <code>AsyncWatcher</code> fixes that: each event goes on its own queue and one thread drains it, so the write returns at once. The queue is <i>bounded</i>, because an unbounded one turns a slow subscriber into an out-of-memory error under a write storm. Full means drop and count: the file system never blocks on a subscriber, and <code>dropped()</code> is the number to export. So the stream is at-most-once (each event arrives once or never), and a watcher that must not miss anything reads the journal instead. A watcher on <code>/var/log</code> also hears a file moved out of it (the event carries the old path) and the delete of <code>/var</code> above it; test 12. Test 11 writes two hundred files against a blocked subscriber: the writes take a few milliseconds, 195 events are dropped, and all two hundred files exist.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a slow watcher must not freeze the namespace -- a bounded queue, and a counter for what it dropped\n/**\n * The file system hands each event to this wrapper after the unlock, on the writer&#x27;s thread (two writers may hand\n * theirs over in either order); it puts them on a queue of its own and one thread drains it, so a subscriber that\n * takes two seconds now delays only itself.\n *\n * The queue is BOUNDED on purpose. An unbounded queue turns a slow subscriber into an out-of-memory error under a\n * write storm, which is the failure nobody sees coming. Full means drop and count: the file system must never\n * block on a subscriber, so the only honest choice is to lose the notification and say how many were lost.\n * That makes the stream at-most-once -- a watcher that must not miss anything reads the journal instead.\n */\nfinal class AsyncWatcher implements FsWatcher, AutoCloseable {\n    private final BlockingQueue&lt;FsEvent&gt; queue;\n    private final Thread worker;\n    private final AtomicLong dropped = new AtomicLong();\n    private volatile boolean running = true;\n\n    AsyncWatcher(int capacity, FsWatcher delegate) {\n        this.queue = new ArrayBlockingQueue&lt;&gt;(capacity);\n        this.worker = new Thread(() -&gt; {\n            while (running || !queue.isEmpty()) {\n                try {\n                    FsEvent e = queue.poll(20, TimeUnit.MILLISECONDS);\n                    if (e != null) delegate.onEvent(e);\n                } catch (InterruptedException ie) { Thread.currentThread().interrupt(); return; }\n                catch (RuntimeException ignored) { }                    // a broken subscriber is not a failed write\n            }\n        }, &quot;fs-watcher&quot;);\n        worker.setDaemon(true);\n        worker.start();\n    }\n\n    /** Never blocks: this runs on the writer&#x27;s thread, just after the unlock. After close() it only counts. */\n    @Override public void onEvent(FsEvent e) { if (!running || !queue.offer(e)) dropped.incrementAndGet(); }\n    /** The metric worth exporting. A number above zero means the subscriber cannot keep up. */\n    long dropped() { return dropped.get(); }\n    /** Stop accepting, drain what is queued, and join the thread. */\n    @Override public void close() throws InterruptedException { running = false; worker.join(2000); }\n}\n\n        // 11. a slow subscriber must not slow the file system down, and a full queue drops instead of blocking\n        FileSystem idx = new FileSystem();\n        idx.mkdirs(&quot;/idx&quot;);\n        CountDownLatch blocked = new CountDownLatch(1);\n        AsyncWatcher async = new AsyncWatcher(4, e -&gt; { try { blocked.await(3, TimeUnit.SECONDS); } catch (InterruptedException ignored) { } });\n        idx.watch(&quot;/idx&quot;, async);\n        long startMs = System.currentTimeMillis();\n        for (int i = 0; i &lt; 200; i++) idx.putFile(&quot;/idx/f&quot; + i + &quot;.txt&quot;, &quot;x&quot;);\n        long tookMs = System.currentTimeMillis() - startMs;\n        check(tookMs &lt; 1000, &quot;200 writes finished in &quot; + tookMs + &quot; ms while the subscriber was blocked: a watcher never holds up a write&quot;);\n        check(async.dropped() &gt; 0, &quot;a full queue dropped &quot; + async.dropped() + &quot; events rather than block the writer or grow without limit&quot;);\n        blocked.countDown();\n        async.close();\n        check(idx.fileCount() == 200, &quot;and every write landed anyway: a dropped notification is never a lost file&quot;);\n\n        // 12. a watcher hears what leaves its folder: a file moved out of it, and the delete of a folder above it\n        FileSystem ws = new FileSystem();\n        ws.mkdirs(&quot;/var/log&quot;);\n        ws.mkdirs(&quot;/tmp&quot;);\n        ws.putFile(&quot;/var/log/app.log&quot;, &quot;x&quot;);\n        List&lt;FsEvent&gt; heard = new CopyOnWriteArrayList&lt;&gt;();\n        ws.watch(&quot;/var/log&quot;, heard::add);\n        ws.move(&quot;/var/log/app.log&quot;, &quot;/tmp/app.log&quot;);\n        check(heard.size() == 1 &amp;&amp; &quot;/var/log/app.log&quot;.equals(heard.get(0).from()),\n              &quot;a watcher on /var/log hears a file moved OUT of it, and the event carries the old path&quot;);\n        ws.delete(&quot;/var&quot;, true);\n        check(heard.size() == 2 &amp;&amp; heard.get(1).kind() == EventKind.DELETED,\n              &quot;and it hears /var being deleted, which took /var/log with it&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>17 &middot; Survive a restart. And where does time come from in your modified times?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A journal: every change that succeeded is written as a line &mdash; what was done, to what, with what &mdash; under one lock, so the journal's order is the order things really happened. The order is apply, then write the line: a call that is refused (no such file, over quota) throws before its line exists, so it can never come back on replay. Redis's append-only file works the same way. The only loss is a crash between applying and writing, and that caller never got an answer. Replay the lines into a fresh file system at boot and you are where you were; test 13 replays a journal after two refused calls. Time is the smaller half of the same idea. The file system is handed a <code>Clock</code> and stamps every node with it, and nothing else reads the wall clock. So a test can pin an instant, write a file, move the instant a week forward and check the exact modified times.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- a journal of every change that succeeded, and a replay that rebuilds the tree\n/** The mutations worth replaying. Reads are not in the list, which is why the journal stays small. */\nenum OpKind { MKDIRS, PUT, APPEND, MOVE, DELETE }\n\n/** One line of the journal: what was done, to what, with what. Ordered by seq. */\nrecord JournalEntry(long seq, OpKind op, String path, String arg) {}\n\n/** Where the journal lives. In memory here; a file, then a replicated log, later. */\ninterface Journal {\n    void append(JournalEntry e);\n    List&lt;JournalEntry&gt; replay();\n}\n\n/** The in-memory journal, which is enough to prove the replay is correct. */\nfinal class InMemoryJournal implements Journal {\n    private final List&lt;JournalEntry&gt; lines = new CopyOnWriteArrayList&lt;&gt;();\n    @Override public void append(JournalEntry e) { lines.add(e); }\n    @Override public List&lt;JournalEntry&gt; replay() { return List.copyOf(lines); }\n}\n\n/**\n * The file system with a journal beside it: every change that SUCCEEDED is written down, in order. Apply, then\n * journal, under one lock, so the journal&#x27;s order is the order things really happened. A refused call (no such\n * file, over quota) throws before its line is written, so it can never come back on replay. Redis&#x27;s append-only\n * file works the same way. Crash, restart, replay the journal into a fresh file system and you are where you were.\n */\nfinal class JournaledFs {\n    private final FileSystem fs;\n    private final Journal journal;\n    private final AtomicLong seq = new AtomicLong();\n    private final ReentrantLock order = new ReentrantLock();\n    JournaledFs(FileSystem fs, Journal journal) { this.fs = fs; this.journal = journal; }\n\n    void mkdirs(String path) { run(OpKind.MKDIRS, path, null, () -&gt; fs.mkdirs(path)); }\n    void putFile(String path, String content) { run(OpKind.PUT, path, content, () -&gt; fs.putFile(path, content)); }\n    void append(String path, String more) { run(OpKind.APPEND, path, more, () -&gt; fs.append(path, more)); }\n    void move(String from, String to) { run(OpKind.MOVE, from, to, () -&gt; fs.move(from, to)); }\n    void delete(String path, boolean recursive) { run(OpKind.DELETE, path, String.valueOf(recursive), () -&gt; fs.delete(path, recursive)); }\n\n    /**\n     * Apply, then journal. If the apply throws, no line is written. A crash between the two loses that one change,\n     * and its caller never got an answer, so nothing a caller was told has been lost.\n     */\n    private void run(OpKind op, String path, String arg, Runnable body) {\n        order.lock();\n        try { body.run(); journal.append(new JournalEntry(seq.incrementAndGet(), op, path, arg)); }\n        finally { order.unlock(); }\n    }\n\n    /** Rebuild a file system from the log. This is what &quot;survive a restart&quot; means. */\n    static FileSystem replay(Journal journal) {\n        FileSystem out = new FileSystem();\n        for (JournalEntry e : journal.replay()) {\n            switch (e.op()) {\n                case MKDIRS -&gt; out.mkdirs(e.path());\n                case PUT -&gt; out.putFile(e.path(), e.arg());\n                case APPEND -&gt; out.append(e.path(), e.arg());\n                case MOVE -&gt; out.move(e.path(), e.arg());\n                case DELETE -&gt; out.delete(e.path(), Boolean.parseBoolean(e.arg()));\n            }\n        }\n        return out;\n    }\n}\n\n// where time comes from: handed in, defaulted, never read from the wall clock inside a method\ninterface Clock { long nowMs(); Clock SYSTEM = System::currentTimeMillis; }\n\n// in a test: pick the instant, then move it\nlong[] now = { 1_700_000_000_000L };\nFileSystem fs = new FileSystem(() -&gt; now[0]);\nfs.putFile(&quot;/a.txt&quot;, &quot;one&quot;);\nnow[0] += 7L * 24 * 3600 * 1000;                        // a week later\nfs.append(&quot;/a.txt&quot;, &quot; two&quot;);                             // mtime is now exactly a week on\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>18 &middot; Which pattern is where, which SOLID letter is where, and when is a kind an enum rather than a subclass?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None was chosen up front; each is what a move produced, which is the only defence that survives the next question. Composite is move 1: a folder's size is the sum of its children's, and a child may be a folder. Strategy, Decorator and Observer are move 3: the rule that changes sits behind one method, <code>AuditGuard</code> wraps any rule to record what it refused, and the file system announces without knowing who listens (move 4 is why it announces after the unlock). State is move 6. For SOLID the letter worth saying is O: <code>CapacityGuard</code> and <code>ReadOnlySubtreeGuard</code> are each a new file plus one line, and <code>FileSystem</code> is never opened. Factory earns its place the day node kinds arrive as strings, say when a tree is rebuilt from a saved file; Builder never does, because a node has nothing optional. <code>WriteMode</code> is an enum because a mode is data one method branches on; a node kind is a subclass because a file and a directory answer <code>sizeBytes()</code> with different code.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">//

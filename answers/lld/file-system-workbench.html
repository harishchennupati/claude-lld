"middle\" font-size=\"12.5\" fill=\"var(--text)\">file 7</text><text x=\"68.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(1066 185)\"><rect width=\"136\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">file 8</text><text x=\"68.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><text x=\"615\" y=\"252\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">eight threads appending to ONE file: one at a time</text><g transform=\"translate(30 265)\"><rect width=\"136\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 1</text><text x=\"68.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(178 265)\"><rect width=\"136\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 2</text><text x=\"68.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0.6 us</text></g><g transform=\"translate(326 265)\"><rect width=\"136\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 3</text><text x=\"68.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 1.2 us</text></g><g transform=\"translate(474 265)\"><rect width=\"136\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 4</text><text x=\"68.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 1.8 us</text></g><g transform=\"translate(622 265)\"><rect width=\"136\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 5</text><text x=\"68.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 2.4 us</text></g><g transform=\"translate(770 265)\"><rect width=\"136\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 6</text><text x=\"68.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 3.0 us</text></g><g transform=\"translate(918 265)\"><rect width=\"136\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 7</text><text x=\"68.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 3.6 us</text></g><g transform=\"translate(1066 265)\"><rect width=\"136\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 8</text><text x=\"68.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 4.2 us</text></g><text x=\"615\" y=\"326\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the read side of the namespace lock is shared, so eight writers to eight files are genuinely parallel; only the eight sharing one file queue up</text><text x=\"615\" y=\"344\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and the eighth of those waits four microseconds &mdash; one at a time is true, and nobody can tell, because nothing slow is allowed inside a lock</text></svg></div><div class=\"move\"><p>The two cards are the answer, so only three things need saying out loud. First, the numbers are that small because of what is <i>not</i> allowed inside. The guard is defined as a quick check on a few numbers and a path; a guard that made a network call would be the one thing that breaks this design. Second, everything slow is deliberately outside. The path is parsed before any lock is taken, and the watchers are called after the unlock in a <code>try</code>/<code>catch</code>, so a subscriber that sleeps for fifty milliseconds delays nobody but itself. Third, the answer to \"is everything one at a time now?\" is no. Eight threads appending to eight different files run genuinely in parallel, because they share the read side of the namespace lock and hold eight different file locks. Only the eight sharing one file queue up, and the eighth of those waits about four microseconds &mdash; one at a time is true, and nobody can tell.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"180\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock for the shape of the tree: is it a bottleneck?</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a shape change holds the exclusive lock about 0.3 us</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a busy build machine: 2,000 mkdir / mv / rm a second</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">that is 0.6 ms of lock in every second: 0.06% busy</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">invent 100,000 a second and it is still only 3% busy</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">byte writes take the READ side, so they never queue here</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1  keep everything slow out of the locks</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: parsing before them, watchers after them</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2  a read-write lock per directory, root first</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">shared on the way down, exclusive on the folder that changes</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3  an immutable tree, root swapped by compare-and-set</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">readers take no lock at all, and a backup snapshot is free</text></g></svg></div><div class=\"move\"><p>The one lock worth arguing about is the exclusive namespace lock, because every <code>mkdir</code>, <code>mv</code> and <code>rm</code> takes it, and holds it for three tenths of a microsecond. A busy build machine churning two thousand shape changes a second therefore holds it six tenths of a millisecond in every second: six hundredths of one per cent. Invent a machine doing a hundred thousand a second and it is still only three per cent busy, and byte writes never queue there at all because they take the read side. That arithmetic is the answer. The ladder is only what you would do if the arithmetic came out differently. Rung two is the one to be able to defend: a read-write lock per directory, taken from the root down. To change the names in one folder, take the read side of every folder above it and the write side of that folder only, so <code>mkdir /var/a/x</code> and <code>mkdir /var/b/y</code> run at the same time. Everyone locks from the root down, so no two threads can hold two locks in opposite orders; the hard case is a move between two folders, which needs two write sides. Rung three is an immutable tree: a change copies the nodes on its path and swaps in the new root with one compare-and-set (a single step that replaces the root only if nobody replaced it first). Readers then take no lock, and a snapshot (a frozen copy of the whole tree, for a backup) costs nothing. Say the arithmetic before you climb: this is where candidates invent complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the hour is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 450\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 16)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">\"..\" walks above the root</text></g><path d=\"M360 34 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 16)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the path is normalised once and clamps at the root; test 2: /a/../../.. is /</text></g><g transform=\"translate(30 56)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">mv a directory into its own subtree</text></g><path d=\"M360 74 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 56)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one prefix comparison on the segments refuses it; test 3: the tree is unchanged</text></g><g transform=\"translate(30 96)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rm on a directory that has children</text></g><path d=\"M360 114 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 96)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">it throws unless recursive was asked for; test 4: nothing was freed</text></g><g transform=\"translate(30 136)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two threads append to one file</text></g><path d=\"M360 154 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 136)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the file's own lock; test 6: 8 x 500 appends leave exactly 4000 bytes</text></g><g transform=\"translate(30 176)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a write goes over the quota</text></g><path d=\"M360 194 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 176)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reserve, ask, release; test 5: no file, no bytes, no drifted counter</text></g><g transform=\"translate(30 216)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two threads create the same name</text></g><path d=\"M360 234 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 216)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one entry in the map and one increment; test 7: 51 files, not 52</text></g><g transform=\"translate(30 256)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a watcher throws</text></g><path d=\"M360 274 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 256)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">called after the unlock in a try/catch; test 8: a second writer gets through</text></g><g transform=\"translate(30 296)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rm a file somebody is reading</text></g><path d=\"M360 314 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 296)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the name goes, the bytes wait for close; test 9: the reader still reads</text></g><g transform=\"translate(30 336)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a rename lands mid-write</text></g><path d=\"M360 354 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 336)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the mover needs the write side, so it waits; test 10: 2000 appends, none lost</text></g><g transform=\"translate(30 376)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a subscriber cannot keep up</text></g><path d=\"M360 394 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 376)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a bounded queue drops and counts; test 11: 195 dropped, 200 files still written</text></g><text x=\"615\" y=\"436\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this page makes has a test: FailureTests.java runs fifty-eight of them and must print ALL PASS</text></svg></div><div class=\"move\"><p>The list is the deliverable, not this paragraph: ten things that can go wrong, and beside each one the line of code that stops it and the numbered test that proves it. Two numbers are worth saying out loud in the room. Eight threads by five hundred appends must leave exactly four thousand bytes. The identical run through the unlocked path loses between 1,700 and 2,900 of them, run to run: that gap is what the file's lock buys, stated as a number rather than a belief. And a refused write must leave three things unchanged, not one: the old bytes, the running counter, and the absence of the file. Each row is a few lines in FailureTests.java; a design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 365\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"38.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"230\" y=\"38.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"320\" y=\"38.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"880\" y=\"38.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"48\" width=\"1190\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"66.0\" font-size=\"11\" fill=\"var(--text)\">Composite</text><text x=\"230\" y=\"66.0\" font-size=\"11\" fill=\"var(--text)\">move 1</text><text x=\"320\" y=\"66.0\" font-size=\"11\" fill=\"var(--text)\">abstract class FsNode { boolean isDirectory(); long sizeBytes(); }</text><text x=\"880\" y=\"66.0\" font-size=\"11\" fill=\"var(--text)\">du and filters never ask which kind it is</text><rect x=\"20\" y=\"76\" width=\"1190\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"94.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"230\" y=\"94.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"94.0\" font-size=\"11\" fill=\"var(--text)\">interface WriteGuard { void check(WriteRequest r); }</text><text x=\"880\" y=\"94.0\" font-size=\"11\" fill=\"var(--text)\">a new rule is a new class, not an edit</text><rect x=\"20\" y=\"104\" width=\"1190\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"122.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"230\" y=\"122.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"122.0\" font-size=\"11\" fill=\"var(--text)\">new AuditGuard(WriteGuard.allOf(new CapacityGuard(64, 1024)))</text><text x=\"880\" y=\"122.0\" font-size=\"11\" fill=\"var(--text)\">every refusal recorded; no rule knows</text><rect x=\"20\" y=\"132\" width=\"1190\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"150.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"230\" y=\"150.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"150.0\" font-size=\"11\" fill=\"var(--text)\">publish(event) after every unlock, inside a try/catch</text><text x=\"880\" y=\"150.0\" font-size=\"11\" fill=\"var(--text)\">an indexer hears; the tree never waits</text><rect x=\"20\" y=\"160\" width=\"1190\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"178.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"230\" y=\"178.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"178.0\" font-size=\"11\" fill=\"var(--text)\">LIVE &rarr; UNLINKED &rarr; FREED, checked on unlink and on close</text><text x=\"880\" y=\"178.0\" font-size=\"11\" fill=\"var(--text)\">a reader mid-read cannot be broken</text><rect x=\"20\" y=\"188\" width=\"1190\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"206.0\" font-size=\"11\" fill=\"var(--text)\">Null Object</text><text x=\"230\" y=\"206.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"206.0\" font-size=\"11\" fill=\"var(--text)\">WriteGuard UNLIMITED = r -&gt; {};   AccessPolicy.ALLOW_ALL</text><text x=\"880\" y=\"206.0\" font-size=\"11\" fill=\"var(--text)\">no \"if (guard != null)\" anywhere</text><rect x=\"20\" y=\"216\" width=\"1190\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"234.0\" font-size=\"11\" fill=\"var(--text)\">Specification</text><text x=\"230\" y=\"234.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"234.0\" font-size=\"11\" fill=\"var(--text)\">extension(\"txt\").and(largerThan(4096)) -- a filter made of filters</text><text x=\"880\" y=\"234.0\" font-size=\"11\" fill=\"var(--text)\">no findByExtensionAndSize, ever</text><rect x=\"20\" y=\"244\" width=\"1190\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"262.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"230\" y=\"262.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"320\" y=\"262.0\" font-size=\"11\" fill=\"var(--muted)\">the file system is handed to its callers; nothing calls getInstance()</text><text x=\"880\" y=\"262.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh tree</text><rect x=\"20\" y=\"272\" width=\"1190\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"290.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"230\" y=\"290.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"290.0\" font-size=\"11\" fill=\"var(--muted)\">two constructors: new FileNode(name, now) and new DirNode(name, now)</text><text x=\"880\" y=\"290.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when kinds come from config</text><rect x=\"20\" y=\"300\" width=\"1190\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"318.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"230\" y=\"318.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"320\" y=\"318.0\" font-size=\"11\" fill=\"var(--muted)\">a node is a name, two timestamps and nothing optional</text><text x=\"880\" y=\"318.0\" font-size=\"11\" fill=\"var(--muted)\">there would be nothing to build</text><text x=\"615\" y=\"350\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>Read the table right to left: each shape came out of something the system had to do, which is why each name has a one-sentence defence. One entry is worth defending out loud: <code>AuditGuard</code> is the honest Decorator, because it adds \"remember what you refused\" to any rule &mdash; including rules written next year &mdash; instead of copying that line into each of them. Specification is the least-known name here: a yes/no rule object that combines with and, or and not, which is exactly what <code>NodeFilter</code> is. Then the negatives, which are what an interviewer is really testing. Singleton earned nothing: the file system is handed to its callers, so a test builds a fresh tree in one line. Factory is \"not yet\" &mdash; there are exactly two node constructors, and it earns the name the day node kinds arrive as strings, for example when a tree is rebuilt from a saved file. Builder is \"never\" on this problem: a node is a name and two timestamps, with nothing optional to build. A pattern without a move behind it is decoration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">DirNode holds names. FileNode holds bytes. FileSystem holds what a path means.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">CapacityGuard is a new file plus fs.configure(...); FileSystem is never opened</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 1</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">du and every filter call sizeBytes() on FsNode; only the walk casts</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">WriteGuard, NodeFilter, FsWatcher, Clock &mdash; a test hands in a lambda</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">new FileSystem(clock);  fs.configure(guard);  the tree builds neither</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>The table is the check, so the paragraph only needs the payoff. S is what move 2 handed you, and the practical benefit is that the race lives in one class and the path bugs in another, so you always know which file to open. O is <code>CapacityGuard</code>: a new file plus one call to <code>configure</code>, and <code>FileSystem</code> is never opened. L is that <code>sizeBytes()</code> means \"bytes underneath you\" for both kinds of node &mdash; it simply recurses for one of them &mdash; so <code>du</code> and every filter work on <code>FsNode</code> without asking which kind. Only the path walk casts to <code>DirNode</code>, after asking <code>isDirectory()</code>, because only a directory has children. I and D are the same thing said twice: four interfaces with one method each, all handed in. That is exactly why a test can give this file system a clock that says last Tuesday and a rule that refuses everything.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a quota, a read-only /etc</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new WriteGuard plus one configure line</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">allOf composes it with the rules already there</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an indexer, a log rotator, a backup</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more watcher, on its own bounded queue</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the tree, the locks and the tests do not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 3, 4</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">trash, restore, purge</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more state and one more checked move</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">delete becomes a move into /.trash; restore is the move back</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across names</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">hard links: two names, one set of bytes</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the count of names and the unlink under the SAME lock</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the bytes go when the last name goes, not the first</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">survive a restart; two machines</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a journal of every change that succeeded, written after it</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">replay at boot; then the tree itself behind a repository</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 6 + 12</text><text x=\"615\" y=\"306\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five, the node classes, the path parser and the two locks do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>The five rows are the script: before you type, say which of the five the twist is, and the interviewer knows you have seen it before. One row needs an extra sentence. A new invariant across names (hard links: two names for one set of bytes) is a count of names. The count and the unlink must happen under the <i>same</i> lock, so the bytes go when the last name goes, not the first. Symlinks are deliberately not on the list, because they are the one twist that does reach into the core. Even then only the path walk changes: it restarts from the link's target with a hop counter (so <code>/a</code> pointing at <code>/b</code> pointing at <code>/a</code> is an error, not a hang), and it takes over <code>..</code> from <code>FsPath</code>. Page 05 has the code for all of them.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 760\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M450.0 530L450 490L430 490L430 442\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M785.0 530L785 490L520 490L520 442\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M600 270L600 308L662 308L662 478L700 478L700 530\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"710\" y=\"521\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--acc)\">owns the root</text><path d=\"M240 457L270 457L270 615L300 615\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M300 60L272 60L272 73L240 73\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M300 120L280 120L280 177L240 177\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M300 90L262 90L262 255L240 255\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(- er</text></g><g transform=\"translate(945 240)\"><rect width=\"265\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">AuditGuard</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">inner: WriteGuard  (wrapped)</text><line x1=\"0\" y1=\"48\" x2=\"265\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">check(r): delegates, records</text></g><g transform=\"translate(945 340)\"><rect width=\"265\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"132.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"132.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">NodeFilter</text><line x1=\"0\" y1=\"34\" x2=\"265\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">matches(path, node): boolean</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">and / or / negate</text></g><g transform=\"translate(945 444)\"><rect width=\"265\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Filters</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">extension(ext) / largerThan(n)</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">modifiedAfter(ms) / filesOnly()</text></g><g><path d=\"M20 735L64 735\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"739\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 735L284 735\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"739\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 735L504 735\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"739\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 735L684 735\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"739\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 735L904 735\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"739\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (italic = abstract, never instantiated; dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = extends or implements: <code>FileNode</code> and <code>DirNode</code> are both <code>FsNode</code>, which is why <code>du</code> and every filter treat them identically without asking which kind; only the path walk casts, because only a directory has children. Filled diamond = owns: the file system owns the root, and the root owns everything under it. Plain arrow = references: a handle holds the node rather than the name, which is exactly why a reader survives a delete, and <code>AuditGuard</code> holds the rule it wraps. Dashed green = handed in through <code>configure()</code> or the constructor. Dotted blue = notifies. Bottom left is the failure family: every method throws one of seven subclasses of <code>FsException</code>, so a caller who does not care which catches the one base type. <b>Where state lives:</b> a file has its bytes, its version and the lock over them; a directory has its children by name and nothing else; the file system has the root, the two locks, the two counters and the handed-in rules. Notice what is <i>not</i> here: no path string inside a node, no pointer from a node back to the file system, and no <code>Size</code> class &mdash; a size is a question a node answers, and the volume total is a counter the write path moves.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it is for and what it guarantees; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (fifty-eight claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.nio.charset.StandardCharsets;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * What kind of change a guard is asked about: two ways to write bytes (replace every byte, add to the end) and three\n * ways to change the tree. Every change asks, so a read-only folder really is read-only. No byte offsets (a follow-up adds them).\n */\nenum WriteMode { OVERWRITE, APPEND, MKDIR, MOVE, DELETE }\n\n/** What happened to a path. Watchers are told after the lock is released, never inside it. */\nenum EventKind { CREATED, WRITTEN, DELETED, MOVED }\n\n/**\n * A file&#x27;s life. LIVE = reachable by name. UNLINKED = the name is gone but somebody has it open, so the bytes\n * survive. FREED = the last handle closed and the bytes were released. Nothing skips a step.\n */\nenum FileState { LIVE, UNLINKED, FREED }\n\n/** Where time comes from. Injected, so a test can stamp a node with any instant it likes. */\ninterface Clock {\n    long nowMs();\n    /** The production clock. A test hands in its own instead. */\n    Clock SYSTEM = System::currentTimeMillis;\n}\n\n// ---------------------------------------------------------------- failures, as one family\n\n/** Every failure this file system can produce. One base class, so a caller can catch the family in one line. */\nclass FsException extends RuntimeException { FsException(String m) { super(m); } }\n/** Nothing lives at that path. */\nfinal class NotFoundException extends FsException { NotFoundException(String p) { super(&quot;no such file or directory: &quot; + p); } }\n/** Something already lives at that path and this call refuses to clobber it. */\nfinal class AlreadyExistsException extends FsException { AlreadyExistsException(String p) { super(&quot;already exists: &quot; + p); } }\n/** A path walked through something that is a file, so it cannot have children. */\nfinal class NotADirectoryException extends FsException { NotADirectoryException(String p) { super(&quot;not a directory: &quot; + p); } }\n/** The path names a directory and the caller asked for bytes. */\nfinal class IsADirectoryException extends FsException { IsADirectoryException(String p) { super(&quot;is a directory: &quot; + p); } }\n/** rm on a directory that still has children, without the recursive flag. Loud on purpose. */\nfinal class DirectoryNotEmptyException extends FsException { DirectoryNotEmptyException(String p) { super(&quot;directory not empty: &quot; + p); } }\n/** A write guard said no. Thrown before a single byte moves. */\nfinal class QuotaExceededException extends FsException { QuotaExceededException(String m) { super(m); } }\n/** A move that would orphan a subtree, or move a node onto itself. */\nfinal class InvalidMoveException extends FsException { InvalidMoveException(String m) { super(m); } }\n\n// ---------------------------------------------------------------- the path, parsed exactly once\n\n/**\n * An absolute path, normalised once at the edge of the API into an immutable list of segments: empty segments and\n * &quot;.&quot; vanish, &quot;..&quot; pops, and &quot;..&quot; above the root clamps at the root. After this class no method in the system ever\n * sees a slash, which is why &quot;..&quot; cannot mean two different things in two different methods. (Folding &quot;..&quot; early is\n * right for a strict tree; once symlinks exist, &quot;..&quot; must be applied during the walk -- see Extensions.)\n */\nfinal class FsPath {\n    /** The root, &quot;/&quot;, the only path with no segments. */\n    static final FsPath ROOT = new FsPath(List.of());\n    private final List&lt;String&gt; segs;\n    private FsPath(List&lt;String&gt; segs) { this.segs = segs; }\n\n    /** Parse and normalise a raw path. Must be absolute; everything else is cleaned up rather than rejected. */\n    static FsPath of(String raw) {\n        if (raw == null || !raw.startsWith(&quot;/&quot;)) throw new FsException(&quot;path must be absolute: &quot; + raw);\n        ArrayList&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (String s : raw.split(&quot;/&quot;)) {\n            if (s.isEmpty() || s.equals(&quot;.&quot;)) continue;\n            if (s.equals(&quot;..&quot;)) { if (!out.isEmpty()) out.remove(out.size() - 1); }   // above the root clamps AT the root\n            else out.add(s);\n        }\n        return new FsPath(List.copyOf(out));\n    }\n\n    boolean isRoot() { return segs.isEmpty(); }\n    int depth() { return segs.size(); }\n    String segment(int i) { return segs.get(i); }\n    /** The last segment, or &quot;&quot; for the root. */\n    String name() { return segs.isEmpty() ? &quot;&quot; : segs.get(segs.size() - 1); }\n    /** The containing directory. The root&#x27;s parent is the root. */\n    FsPath parent() { return segs.isEmpty() ? ROOT : new FsPath(segs.subList(0, segs.size() - 1)); }\n    /** The first n segments: prefix(2) of /a/b/c is /a/b. Used to name the exact level an error happened at. */\n    FsPath prefix(int n) { return new FsPath(segs.subList(0, n)); }\n    /** This path with one more segment on the end. */\n    FsPath child(String name) { ArrayList&lt;String&gt; c = new ArrayList&lt;&gt;(segs); c.add(name); return new FsPath(List.copyOf(c)); }\n    /** True when this path is the other one or lives underneath it. This one comparison is the move-into-own-subtree check. */\n    boolean startsWith(FsPath other) {\n        if (other.segs.size() &gt; segs.size()) return false;\n        return segs.subList(0, other.segs.size()).equals(other.segs);\n    }\n    @Override public String toString() { return segs.isEmpty() ? &quot;/&quot; : &quot;/&quot; + String.join(&quot;/&quot;, segs); }\n    @Override public boolean equals(Object o) { return o instanceof FsPath p &amp;&amp; p.segs.equals(segs); }\n    @Override public int hashCode() { return segs.hashCode(); }\n}\n\n// ---------------------------------------------------------------- the tree: one base type, two shapes\n\n/**\n * Anything a path can point at. A node knows its own name and times and can answer two questions -- are you a\n * directory, and how many bytes are underneath you. It never parses a path and never points back at the file\n * system, which is what keeps the locking story short.\n */\nabstract class FsNode {\n    private String name;\n    private final long createdMs;\n    private volatile long modifiedMs;   // written under a file&#x27;s lock, read by find() without it: volatile so a reader sees a whole, current value\n    FsNode(String name, long now) { this.name = name; this.createdMs = now; this.modifiedMs = now; }\n\n    String name() { return name; }\n    /** Renaming is a namespace operation, so only the file system calls this, under the namespace write lock. */\n    void rename(String n) { this.name = n; }\n    long createdMs() { return createdMs; }\n    long modifiedMs() { return modifiedMs; }\n    void touch(long now) { modifiedMs = now; }\n\n    /** True for a directory. Asked instead of instanceof; only the path walk then casts, because only a directory has children. */\n    abstract boolean isDirectory();\n    /** Bytes underneath this node: its own for a file, the sum of its children for a directory. */\n    abstract long sizeBytes();\n}\n\n/**\n * A file: a name and one byte array, with its own lock. The bytes are what two threads fight over, so the lock\n * that protects them lives here rather than on the file system. Methods that require the caller to hold that lock\n * say Locked in their name.\n */\nfinal class FileNode extends FsNode {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final AtomicLong version = new AtomicLong();\n    private byte[] content = new byte[0];\n    private int openHandles = 0;\n    private FileState state = FileState.LIVE;\n\n    FileNode(String name, long now) { super(name, now); }\n\n    @Override boolean isDirectory() { return false; }\n    @Override long sizeBytes() { lock.lock(); try { return content.length; } finally { lock.unlock(); } }\n\n    void lock() { lock.lock(); }\n    void unlock() { lock.unlock(); }\n    /** Size while the caller already holds this file&#x27;s lock. */\n    long sizeLocked() { return content.length; }\n    /** The live array while the caller holds the lock. Never handed outside the lock. */\n    byte[] contentLocked() { return content; }\n    /** Publish new bytes: one reference assignment, so it cannot fail half way. Caller holds the lock. */\n    void setContentLocked(byte[] bytes, long now) { content = bytes; version.incrementAndGet(); touch(now); }\n    /** A copy of the bytes, taken under the lock so a reader never sees a half-written array. */\n    byte[] read() { lock.lock(); try { return content.clone(); } finally { lock.unlock(); } }\n    /** Which edit this is. A caller that wants optimistic concurrency compares it (Extensions&#x27; RwFile shows the compare-and-write). */\n    long version() { return version.get(); }\n    FileState state() { lock.lock(); try { return state; } finally { lock.unlock(); } }\n\n    /**\n     * The same read-modify-write with NO lock. It exists only so the demo can measure what the lock buys; real\n     * code goes through FileSystem.append.\n     */\n    void unsafeAppend(byte[] more, long now) {\n        byte[] old = content;\n        byte[] bigger = Arrays.copyOf(old, old.length + more.length);\n        System.arraycopy(more, 0, bigger, old.length, more.length);\n        content = bigger; touch(now);\n    }\n\n    /** A reader opened this file: the bytes must outlive an unlink until it closes. */\n    void acquire() { lock.lock(); try { openHandles++; } finally { lock.unlock(); } }\n    /** A reader closed. If the name is already gone and this was the last handle, the bytes are released now. */\n    void release() {\n        lock.lock();\n        try { if (--openHandles == 0 &amp;&amp; state == FileState.UNLINKED) { state = FileState.FREED; content = new byte[0]; } }\n        finally { lock.unlock(); }\n    }\n    /** The name left the tree. LIVE goes to UNLINKED if somebody is reading, straight to FREED if nobody is. */\n    void unlink() {\n        lock.lock();\n        try {\n            if (openHandles &gt; 0) state = FileState.UNLINKED;\n            else { state = FileState.FREED; content = new byte[0]; }\n        } finally { lock.unlock(); }\n    }\n}\n\n/**\n * A directory: a name and its children by name. A sorted map, so ls is already in order and a lookup is\n * O(log k); a hash map would be O(1) to look up but would re-sort on every ls.\n */\nfinal class DirNode extends FsNode {\n    private final TreeMap&lt;String, FsNode&gt; children = new TreeMap&lt;&gt;();\n    DirNode(String name, long now) { super(name, now); }\n\n    @Override boolean isDirectory() { return true; }\n    /** The composite: a directory&#x27;s size is the sum of what is underneath it, and a child may be a directory. */\n    @Override long sizeBytes() { long s = 0; for (FsNode c : children.values()) s += c.sizeBytes(); return s; }\n\n    FsNode child(String name) { return children.get(name); }\n    /** Link a node in under its own name. Caller holds the namespace write lock. */\n    void put(FsNode n) { children.put(n.name(), n); }\n    /** Unlink one name. Caller holds the namespace write lock. */\n    FsNode remove(String name) { return children.remove(name); }\n    boolean isEmpty() { return children.isEmpty(); }\n    int size() { return children.size(); }\n    /** Names in order. The map is already sorted, so this is a walk, not a sort. */\n    List&lt;String&gt; names() { return new ArrayList&lt;&gt;(children.keySet()); }\n    /** Up to n names that sort after the cursor (from the start when it is null): O(log k + n), never a copy of all k. */\n    List&lt;String&gt; namesAfter(String after, int n) {\n        List&lt;String&gt; out = new ArrayList&lt;&gt;();\n        for (String s : after == null ? children.keySet() : children.tailMap(after, false).keySet()) {\n            if (out.size() == n) break;\n            out.add(s);\n        }\n        return out;\n    }\n    Collection&lt;FsNode&gt; childNodes() { return children.values(); }\n}\n\n// ---------------------------------------------------------------- the one seam on the write path\n\n/**\n * Everything a rule could want to know about a change, computed before anything changes: the path, the kind of\n * change, the resulting size of this file, the resulting size of the whole volume, and how many files would exist.\n * A rule reads values, so a rule cannot be tempted to go and look at the tree. A tree change moves no bytes, so its\n * sizes are today&#x27;s.\n */\nrecord WriteRequest(String path, WriteMode mode, long resultingFileBytes, long resultingTotalBytes, long fileCount) {}\n\n/**\n * The rule that decides whether a change may happen. One method, because &quot;what is allowed&quot; is the thing that\n * changes mid-interview: a quota, a maximum file size, a read-only subtree. Byte writes ask it, and so do mkdirs,\n * move and delete. It throws to refuse; a byte write has already reserved its bytes and releases the reservation.\n */\n@FunctionalInterface\ninterface WriteGuard {\n    /** Throw to refuse. Must be quick and must never call back into the file system: it runs inside a lock. */\n    void check(WriteRequest r);\n    /** The default: everything is allowed. A Null Object, so no method needs &quot;if (guard != null)&quot;. */\n    WriteGuard UNLIMITED = r -&gt; {};\n    /** Rules combine like nodes do: all of them must pass. */\n    static WriteGuard allOf(WriteGuard... gs) { return r -&gt; { for (WriteGuard g : gs) g.check(r); }; }\n}\n\n/** A size rule: no file over maxFile bytes, no volume over maxTotal bytes. The whole of &quot;quota&quot; in ten lines. */\nfinal class CapacityGuard implements WriteGuard {\n    private final long maxFileBytes, maxTotalBytes;\n    CapacityGuard(long maxFileBytes, long maxTotalBytes) { this.maxFileBytes = maxFileBytes; this.maxTotalBytes = maxTotalBytes; }\n    @Override public void check(WriteRequest r) {\n        if (r.mode() != WriteMode.OVERWRITE &amp;&amp; r.mode() != WriteMode.APPEND) return;   // mkdir, move, delete add no bytes\n        if (r.resultingFileBytes() &gt; maxFileBytes)\n            throw new QuotaExceededException(r.path() + &quot; would be &quot; + r.resultingFileBytes() + &quot; bytes, max is &quot; + maxFileBytes);\n        if (r.resultingTotalBytes() &gt; maxTotalBytes)\n            throw new QuotaExceededException(&quot;volume would be &quot; + r.resultingTotalBytes() + &quot; bytes, max is &quot; + maxTotalBytes);\n    }\n}\n\n/**\n * A guard that wraps another guard and writes down what it refused. Same interface, one extra behaviour, so it\n * can wrap a rule written next year without that rule knowing. This is the decorator on the write path.\n */\nfinal class AuditGuard implements WriteGuard {\n    private final WriteGuard inner;\n    private final List&lt;String&gt; refused = new CopyOnWriteArrayList&lt;&gt;();\n    AuditGuard(WriteGuard inner) { this.inner = inner; }\n    @Override public void check(WriteRequest r) {\n        try { inner.check(r); }\n        catch (FsException e) { refused.add(r.path() + &quot;: &quot; + e.getMessage()); throw e; }\n    }\n    /** Every write this guard refused, newest last. */\n    List&lt;String&gt; refused() { return List.copyOf(refused); }\n}\n\n// ---------------------------------------------------------------- search: one walk, many questions\n\n/**\n * A yes/no question about one node. The traversal is written once; what changes from query to query is this\n * predicate, which is why there is no findByExtension, findBySize and findByExtensionAndSize.\n */\n@FunctionalInterface\ninterface NodeFilter {\n    boolean matches(String path, FsNode node);\n    default NodeFilter and(NodeFilter o) { return (p, n) -&gt; matches(p, n) &amp;&amp; o.matches(p, n); }\n    default NodeFilter or(NodeFilter o) { return (p, n) -&gt; matches(p, n) || o.matches(p, n); }\n    default NodeFilter negate() { return (p, n) -&gt; !matches(p, n); }\n    /** Matches everything. Useful as the start of a chain. */\n    NodeFilter ANY = (p, n) -&gt; true;\n}\n\n/** The predicates people actually ask for. Each is one line, and they combine with and / or / negate. */\nfinal class Filters {\n    static NodeFilter filesOnly() { return (p, n) -&gt; !n.isDirectory(); }\n    static NodeFilter extension(String ext) { return (p, n) -&gt; !n.isDirectory() &amp;&amp; n.name().endsWith(&quot;.&quot; + ext); }\n    static NodeFilter largerThan(long bytes) { return (p, n) -&gt; !n.isDirectory() &amp;&amp; n.sizeBytes() &gt; bytes; }\n    static NodeFilter modifiedAfter(long ms) { return (p, n) -&gt; n.modifiedMs() &gt; ms; }\n    static NodeFilter nameContains(String s) { return (p, n) -&gt; n.name().contains(s); }\n}\n\n// ---------------------------------------------------------------- watchers: told after the unlock\n\n/** One thing that happened: the path, where it came from (a move only, else null) and when. A value, so it can be queued or logged. */\nrecord FsEvent(EventKind kind, String path, String from, long atMs) {\n    /** Every event but a move has one path. */\n    FsEvent(EventKind kind, String path, long atMs) { this(kind, path, null, atMs); }\n}\n\n/** Somebody who wants to know when a subtree changes. One method, so a test is a lambda. */\n@FunctionalInterface\ninterface FsWatcher { void onEvent(FsEvent e); }\n\n// ---------------------------------------------------------------- an open file\n\n/**\n * An open file. It holds the node, not the name, which is exactly why a reader can finish reading a file that\n * somebody deleted underneath them. Read-only on purpose: writes go through the file system so the guard and the\n * byte accounting see them. Closing is what lets the bytes go.\n */\nfinal class Handle implements AutoCloseable {\n    private final String path;\n    private final FileNode node;\n    private final AtomicBoolean closed = new AtomicBoolean();\n    Handle(String path, FileNode node) { this.path = path; this.node = node; node.acquire(); }\n    /** A copy of the bytes as they are now, even if the name has already left the tree. */\n    byte[] read() { if (closed.get()) throw new FsException(&quot;handle is closed: &quot; + path); return node.read(); }\n    String readString() { return new String(read(), StandardCharsets.UTF_8); }\n    FileState state() { return node.state(); }\n    /** Release the bytes once. compareAndSet, so two threads closing the same handle cannot release it twice. */\n    @Override public void close() { if (closed.compareAndSet(false, true)) node.release(); }\n}\n\n// ---------------------------------------------------------------- the aggregate root\n\n/**\n * The one object callers touch. It owns three things the nodes deliberately do not: what a path means, who may\n * rearrange the tree, and how many bytes exist.\n *\n * Two invariants, two locks. The SHAPE of the tree (which name points at which node) is under one\n * ReentrantReadWriteLock: mkdirs, move, delete and create take the write side; everything else takes the read\n * side. The CONTENT of a file is under that file&#x27;s own lock. A byte write therefore takes the namespace READ\n * lock -- it only needs the name to stay resolved -- so writers to different files never block each other, while\n * a delete still waits for a write in flight to finish.\n *\n * The lock order is a stated rule: namespace first, then a file, never the reverse, and never two file locks at\n * once. A shape change may take a file&#x27;s lock (a delete reads each file&#x27;s size), but only after the namespace\n * lock, so every thread takes locks in the same order and a deadlock cannot form.\n */\nfinal class FileSystem {\n    /** One file is one byte[], and a Java array holds at most about 2^31 bytes. The chunked follow-up lifts this. */\n    static final long MAX_FILE_BYTES = Integer.MAX_VALUE - 8;\n    private final DirNode root;\n    private final ReentrantReadWriteLock namespace = new ReentrantReadWriteLock();\n    private final AtomicLong totalBytes = new AtomicLong(), fileCount = new AtomicLong();\n    private volatile Clock clock = Clock.SYSTEM;\n    private volatile WriteGuard guard = WriteGuard.UNLIMITED;\n    private final List&lt;Map.Entry&lt;String, FsWatcher&gt;&gt; watchers = new CopyOnWriteArrayList&lt;&gt;();\n\n    FileSystem() { this(Clock.SYSTEM); }\n    FileSystem(Clock clock) { this.clock = clock; this.root = new DirNode(&quot;&quot;, clock.nowMs()); }\n\n    /** Hand in the rule for the write path. The file system never builds one; the default allows everything. */\n    void configure(WriteGuard guard) { this.guard = guard; }\n    /** Hand in time. A test passes a clock that returns whatever instant it likes. */\n    void setClock(Clock c) { this.clock = c; }\n    /**\n     * Tell this watcher about anything that happens at or under prefix -- including a move out of it, and the delete\n     * or move of a folder above it. Called after the unlock, never inside it.\n     */\n    void watch(String prefix, FsWatcher w) { watchers.add(Map.entry(FsPath.of(prefix).toString(), w)); }\n\n    // ------------------------------------------------ shape: the write side of the namespace lock\n\n    /**\n     * mkdir -p: create every missing level and return quietly if it is all already there. Refuses when a level on\n     * the way is a file (a file cannot have children) and when the path itself is a file. The guard is asked once,\n     * before the first level is made, so a refusal leaves nothing half-built.\n     */\n    void mkdirs(String path) {\n        FsPath p = FsPath.of(path);\n        boolean made = false;\n        namespace.writeLock().lock();\n        try {\n            DirNode cur = root;\n            for (int i = 0; i &lt; p.depth(); i++) {\n                String seg = p.segment(i);\n                FsNode next = cur.child(seg);\n                if (next == null) {\n                    if (!made) guard.check(shapeChange(p, WriteMode.MKDIR));\n                    DirNode fresh = new DirNode(seg, clock.nowMs()); cur.put(fresh); next = fresh; made = true;\n                } else if (!next.isDirectory()) {\n                    if (i == p.depth() - 1) throw new AlreadyExistsException(p.toString());   // the path itself is a file\n                    throw new NotADirectoryException(p.prefix(i + 1).toString());           // name the file in the way\n                }\n                cur = (DirNode) next;\n            }\n        } finally { namespace.writeLock().unlock(); }\n        if (made) publish(new FsEvent(EventKind.CREATED, p.toString(), clock.nowMs()));   // a no-op mkdir -p is not an event\n    }\n\n    /** mkdir without -p (Coinbase&#x27;s and LeetCode 1166&#x27;s rule): exactly one new level, or an error if the parent is missing or the name is taken. */\n    void mkdir(String path) {\n        FsPath p = FsPath.of(path);\n        if (p.isRoot()) throw new AlreadyExistsException(&quot;/&quot;);\n        namespace.writeLock().lock();\n        try {\n            DirNode parent = dirAt(p.parent());                             // NotFoundException if the parent is missing\n            if (parent.child(p.name()) != null) throw new AlreadyExistsException(p.toString());\n            guard.check(shapeChange(p, WriteMode.MKDIR));\n            parent.put(new DirNode(p.name(), clock.nowMs()));\n        } finally { namespace.writeLock().unlock(); }\n        publish(new FsEvent(EventKind.CREATED, p.toString(), clock.nowMs()));\n    }\n\n    /** Create the file or replace its bytes. */\n    void putFile(String path, String content) { createOrWrite(path, content, WriteMode.OVERWRITE); }\n\n    /** LeetCode 588&#x27;s addContentToFile: create the file, or add to its end if it exists -- one step, so two first writers cannot wipe each other. */\n    void addContent(String path, String content) { createOrWrite(path, content, WriteMode.APPEND); }\n\n    /**\n     * The create path. It may change the shape of the tree, so it takes the write side. The order is the whole\n     * point: resolve, reserve the bytes, ask the guard, and only then create the node -- so a refused write has\n     * nothing to roll back, because nothing was ever linked in.\n     */\n    private void createOrWrite(String path, String content, WriteMode mode) {\n        byte[] bytes = content.getBytes(StandardCharsets.UTF_8);\n        FsPath p = FsPath.of(path);\n        if (p.isRoot()) throw new IsADirectoryException(&quot;/&quot;);\n        EventKind kind;\n        namespace.writeLock().lock();\n        try {\n            DirNode parent = dirAt(p.parent());\n            FsNode existing = parent.child(p.name());\n            if (existing != null &amp;&amp; existing.isDirectory()) throw new IsADirectoryException(path);\n            FileNode f = (FileNode) existing;\n            long before = f == null ? 0 : f.sizeBytes();\n            long after = mode == WriteMode.APPEND ? before + bytes.length : bytes.length;\n            if (after &gt; MAX_FILE_BYTES) throw new QuotaExceededException(path + &quot; would pass 2 GB, the most one byte[] can hold&quot;);\n            long delta = after - before;\n            long total = totalBytes.addAndGet(delta);                       // reserve first: a number moves, no bytes yet\n            long count = f == null ? fileCount.get() + 1 : fileCount.get();\n            try { guard.check(new WriteRequest(p.toString(), mode, after, total, count)); }\n            catch (RuntimeException e) { totalBytes.addAndGet(-delta); throw e; }   // release the reservation; nothing was created\n            if (f == null) { f = new FileNode(p.name(), clock.nowMs()); parent.put(f); fileCount.incrementAndGet(); kind = EventKind.CREATED; }\n            else kind = EventKind.WRITTEN;\n            f.lock();\n            try { f.setContentLocked(mode == WriteMode.APPEND ? concat(f.contentLocked(), bytes) : bytes, clock.nowMs()); }\n            finally { f.unlock(); }\n        } finally { namespace.writeLock().unlock(); }\n        publish(new FsEvent(kind, p.toString(), clock.nowMs()));\n    }\n\n    /**\n     * Rename or move a node. Three pointer operations regardless of how big the subtree is: unlink the old name,\n     * rename the node, link the new name -- all inside one exclusive lock, so nobody can observe the moment when\n     * the node is at neither name. Refuses a move into the mover&#x27;s own subtree, which would orphan it.\n     */\n    void move(String from, String to) {\n        FsPath src = FsPath.of(from), dst = FsPath.of(to);\n        if (src.isRoot() || dst.isRoot()) throw new InvalidMoveException(&quot;cannot move the root&quot;);\n        namespace.writeLock().lock();\n        try {\n            DirNode srcParent = dirAt(src.parent());\n            FsNode node = srcParent.child(src.name());\n            if (node == null) throw new NotFoundException(from);\n            if (src.equals(dst)) return;                                    // it exists, and a move onto itself changes nothing\n            if (node.isDirectory() &amp;&amp; dst.startsWith(src))\n                throw new InvalidMoveException(&quot;cannot move &quot; + src + &quot; into its own subtree &quot; + dst);\n            DirNode dstParent = dirAt(dst.parent());\n            if (dstParent.child(dst.name()) != null) throw new AlreadyExistsException(to);\n            guard.check(shapeChange(src, WriteMode.MOVE));                  // the name leaves here...\n            guard.check(shapeChange(dst, WriteMode.MOVE));                  // ...and arrives here: both must be allowed\n            srcParent.remove(src.name());\n            node.rename(dst.name());\n            dstParent.put(node);\n            node.touch(clock.nowMs());\n        } finally { namespace.writeLock().unlock(); }\n        publish(new FsEvent(EventKind.MOVED, dst.toString(), src.toString(), clock.nowMs()));\n    }\n\n    /**\n     * Delete a file, or a directory that recursive says may take its children with it. The name leaves the tree\n     * inside the lock; the bytes of any file somebody still has open survive until that reader closes.\n     */\n    void delete(String path, boolean recursive) {\n        FsPath p = FsPath.of(path);\n        if (p.isRoot()) throw new InvalidMoveException(&quot;cannot delete the root&quot;);\n        List&lt;FileNode&gt; orphans = new ArrayList&lt;&gt;();\n        namespace.writeLock().lock();\n        try {\n            DirNode parent = dirAt(p.parent());\n            FsNode node = parent.child(p.name());\n            if (node == null) throw new NotFoundException(path);\n            if (node.isDirectory() &amp;&amp; !((DirNode) node).isEmpty() &amp;&amp; !recursive) throw new DirectoryNotEmptyException(path);\n            guard.check(shapeChange(p, WriteMode.DELETE));\n            collect(node, orphans);\n            parent.remove(p.name());                                        // one pointer op; the subtree leaves with it\n            long bytes = 0;\n            for (FileNode f : orphans) bytes += f.sizeBytes();\n            totalBytes.addAndGet(-bytes);\n            fileCount.addAndGet(-orphans.size());\n        } finally { namespace.writeLock().unlock(); }\n        for (FileNode f : orphans) f.unlink();                              // LIVE -&gt; UNLINKED, or straight to FREED\n        publish(new FsEvent(EventKind.DELETED, p.toString(), clock.nowMs()));\n    }\n\n    // ------------------------------------------------ content: the read side plus the file&#x27;s own lock\n\n    /** Replace the bytes of a file that already exists. No shape change, so only the read side of the namespace lock. */\n    void overwrite(String path, String content) { applyWrite(path, content.getBytes(StandardCharsets.UTF_8), WriteMode.OVERWRITE); }\n\n    /** Add to the end of a file that already exists. The operation two threads can lose, which is why it is locked. */\n    void append(String path, String more) { applyWrite(path, more.getBytes(StandardCharsets.UTF_8), WriteMode.APPEND); }\n\n    /**\n     * The one guarded step every byte write funnels through. In order: hold the name still (namespace read lock),\n     * take the file&#x27;s lock, work out the resulting sizes, reserve them on the volume counter, ask the guard, and\n     * only then publish the new array -- one reference assignment, which cannot fail half way. A refused write\n     * releases its reservation and leaves the old bytes exactly where they were.\n     */\n    private void applyWrite(String path, byte[] bytes, WriteMode mode) {\n        FsPath p = FsPath.of(path);\n        namespace.readLock().lock();\n        try {\n            FsNode n = nodeAt(p);\n            if (n.isDirectory()) throw new IsADirectoryException(path);\n            FileNode f = (FileNode) n;\n            f.lock();                                                       // order: namespace, then file. Never the reverse.\n            try {\n                long before = f.sizeLocked();\n                long after = mode == WriteMode.APPEND ? before + bytes.length : bytes.length;\n                if (after &gt; MAX_FILE_BYTES) throw new QuotaExceededException(path + &quot; would pass 2 GB, the most one byte[] can hold&quot;);\n                long delta = after - before;\n                long total = totalBytes.addAndGet(delta);                   // reserve, so two writers cannot both pass one quota\n                try { guard.check(new WriteRequest(p.toString(), mode, after, total, fileCount.get())); }\n                catch (RuntimeException e) { totalBytes.addAndGet(-delta); throw e; }\n                f.setContentLocked(mode == WriteMode.APPEND ? concat(f.contentLocked(), bytes) : bytes.clone(), clock.nowMs());\n            } finally { f.unlock(); }\n        } finally { namespace.readLock().unlock(); }\n        publish(new FsEvent(EventKind.WRITTEN, p.toString(), clock.nowMs()));\n    }\n\n    // ------------------------------------------------ reads\n\n    /** The whole file, as bytes. */\n    byte[] read(String path) {\n        namespace.readLock().lock();\n        try {\n            FsNode n = nodeAt(FsPath.of(path));\n            if (n.isDirectory()) throw new IsADirectoryException(path);\n            return ((FileNode) n).read();\n        } finally { namespace.readLock().unlock(); }\n    }\n\n    /** The whole file, as text. The demo&#x27;s convenience; the core is bytes. */\n    String readString(String path) { return new String(re

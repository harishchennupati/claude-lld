ntested = service.newGame(&quot;race&quot;);\n        List&lt;Move&gt; opening = contested.legalMoves();\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;Boolean&gt;&gt; sent = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final Move mine = opening.get(i % opening.size());\n            sent.add(pool.submit(() -&gt; { go.await(); try { contested.play(mine); return true; } catch (IllegalMoveException e) { return false; } }));\n        }\n        go.countDown();\n        int accepted = 0, refused = 0;\n        for (Future&lt;Boolean&gt; f : sent) { if (f.get()) accepted++; else refused++; }\n        pool.shutdown();\n        System.out.println(&quot;50 clients, one game: accepted=&quot; + accepted + &quot; refused=&quot; + refused\n            + &quot; ply=&quot; + contested.ply() + &quot; toMove=&quot; + contested.toMove() + &quot; (must be 1, 49, 1, BLACK)&quot;);\n        if (accepted != 1 || contested.ply() != 1) throw new AssertionError(&quot;two moves landed on the same turn&quot;);\n\n        // what the lock actually costs: whole random games, timed, after a warm-up\n        for (int i = 0; i &lt; 5; i++) randomGame(service, &quot;warm&quot; + i, new Random(i));\n        long t0 = System.nanoTime(); int plies = 0;\n        for (int i = 0; i &lt; 10; i++) plies += randomGame(service, &quot;timed&quot; + i, new Random(100 + i));\n        long perMove = (System.nanoTime() - t0) / Math.max(plies, 1) / 1000;\n        System.out.println(plies + &quot; plies of random games, &quot; + perMove\n            + &quot; microseconds per move inside the lock (generate every legal move, filter it, commit, re-judge)&quot;);\n    }\n\n    /** Play a whole game at random, up to 160 plies. The generator does all the work, so this times the lock. */\n    private static int randomGame(ChessService service, String id, Random random) {\n        Game g = service.newGame(id);\n        int plies = 0;\n        while (!g.status().over() &amp;&amp; plies &lt; 160) {\n            List&lt;Move&gt; legal = g.legalMoves();\n            g.play(legal.get(random.nextInt(legal.size())));\n            plies++;\n        }\n        return plies;\n    }\n\n    /** Play a move written as &quot;e2e4&quot;, the way a coordinate-based user interface sends it. */\n    private static void play(Game game, String coords) { game.play(find(game, coords)); }\n\n    /** Find the legal move that goes from one square to another; a promotion defaults to a queen. */\n    private static Move find(Game game, String coords) {\n        Position from = Position.of(coords.substring(0, 2)), to = Position.of(coords.substring(2, 4));\n        return game.legalMoves().stream()\n            .filter(m -&gt; m.from().equals(from) &amp;&amp; m.to().equals(to))\n            .filter(m -&gt; m.promoteTo() == null || m.promoteTo() == Pieces.queen(m.moved().color))\n            .findFirst().orElseThrow(() -&gt; new IllegalMoveException(&quot;no legal move &quot; + coords));\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.function.Function;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: a fairy piece -- &quot;add a Chancellor: it moves like a rook AND a knight&quot;. One new class, one line.\n/**\n * The Chancellor rides the four straight rays and also hops the knight&#x27;s L. It touches nothing else: move\n * generation calls attacks(), and check detection asks the capability flags, so the board, the game, castling,\n * checkmate and stalemate all keep working with no edit at all. That is Open/Closed, paid out.\n */\nclass Chancellor extends Piece {\n    private static final int[][] JUMPS = { {2, 1}, {2, -1}, {-2, 1}, {-2, -1}, {1, 2}, {1, -2}, {-1, 2}, {-1, -2} };\n    Chancellor(Color color) { super(color, &#x27;C&#x27;); }\n\n    /** Rook rays until blocked, plus the eight knight squares. */\n    @Override void attacks(Board board, Position from, List&lt;Position&gt; out) {\n        for (int[] d : SlidingPiece.STRAIGHT)\n            for (int step = 1; ; step++) {\n                int r = from.row() + d[0] * step, c = from.col() + d[1] * step;\n                if (!Position.onBoard(r, c)) break;\n                out.add(Position.at(r, c));\n                if (board.at(r, c) != null) break;\n            }\n        for (int[] j : JUMPS) {\n            int r = from.row() + j[0], c = from.col() + j[1];\n            if (Position.onBoard(r, c)) out.add(Position.at(r, c));\n        }\n    }\n    @Override boolean ridesStraight() { return true; }\n    @Override boolean hopsKnight() { return true; }\n}\n// the only change at the call site, once, at start-up:\n//     Pieces.register(&#x27;C&#x27;, Chancellor::new);\n// after that &#x27;C&#x27; and &#x27;c&#x27; work in FEN, in printing and in promotion, and isAttacked finds it because it asks\n// &quot;do you ride straight lines? do you hop like a knight?&quot; instead of &quot;are you a rook?&quot;.\n\n// ---- ext: an AI opponent -- legalMoves() IS the move generator, so a search only has to consume it\n/** What a position is worth to one side. The one thing an engine&#x27;s strength actually comes from. */\ninterface Evaluator { int score(Board board, Color side); }\n\n/** The crudest honest evaluator: material only, in centipawns. Good enough to stop hanging a queen. */\nclass MaterialEvaluator implements Evaluator {\n    private static int value(char letter) {\n        return switch (Character.toUpperCase(letter)) {\n            case &#x27;P&#x27; -&gt; 100; case &#x27;N&#x27; -&gt; 320; case &#x27;B&#x27; -&gt; 330;\n            case &#x27;R&#x27; -&gt; 500; case &#x27;Q&#x27; -&gt; 900; case &#x27;C&#x27; -&gt; 850; default -&gt; 0;\n        };\n    }\n    public int score(Board board, Color side) {\n        int total = 0;\n        for (int r = 0; r &lt; 8; r++)\n            for (int c = 0; c &lt; 8; c++) {\n                Piece p = board.at(r, c);\n                if (p != null) total += (p.color == side ? 1 : -1) * value(p.symbol());\n            }\n        return total;\n    }\n}\n\n/** Whoever decides a move: a human at a screen, a random mover, a search. Handed to the loop, never built by it. */\ninterface Player { Move choose(Game game); }\n\n/** A legal move at random. Useful as the opponent in a test, and as the floor a real engine must beat. */\nclass RandomPlayer implements Player {\n    private final Random random;\n    RandomPlayer(long seed) { random = new Random(seed); }\n    public Move choose(Game game) { List&lt;Move&gt; legal = game.legalMoves(); return legal.get(random.nextInt(legal.size())); }\n}\n\n/**\n * Alpha-beta minimax over the rules layer. It never touches the pieces or the board directly: it plays a move,\n * asks for the score, and takes it back -- exactly what the legality filter already does. It searches on a COPY\n * made from the FEN, so no spectator ever sees the moves the engine is only thinking about.\n */\nclass MinimaxPlayer implements Player {\n    private final Evaluator evaluator;\n    private final int depth;\n    MinimaxPlayer(Evaluator evaluator, int depth) { this.evaluator = evaluator; this.depth = depth; }\n\n    public Move choose(Game game) {\n        Game work = Game.fromFen(&quot;search&quot;, game.fen());                  // a private copy: no observers, no shared lock\n        Color me = work.toMove();\n        Move best = null; int bestScore = Integer.MIN_VALUE;\n        for (Move m : work.legalMoves()) {\n            work.play(m);\n            int score = search(work, depth - 1, Integer.MIN_VALUE + 1, Integer.MAX_VALUE - 1, me);\n            work.undo();\n            if (score &gt; bestScore) { bestScore = score; best = m; }\n        }\n        return best;\n    }\n\n    private int search(Game g, int depth, int alpha, int beta, Color me) {\n        if (g.status().over())\n            return g.status() == GameStatus.CHECKMATE ? (g.toMove() == me ? -100_000 : 100_000) : 0;\n        if (depth == 0) return evaluator.score(g.board(), me);\n        boolean maximising = g.toMove() == me;\n        int best = maximising ? Integer.MIN_VALUE : Integer.MAX_VALUE;\n        for (Move m : g.legalMoves()) {\n            g.play(m);\n            int score = search(g, depth - 1, alpha, beta, me);\n            g.undo();\n            if (maximising) { best = Math.max(best, score); alpha = Math.max(alpha, best); }\n            else            { best = Math.min(best, score); beta  = Math.min(beta, best); }\n            if (beta &lt;= alpha) break;                                     // this branch cannot change the answer\n        }\n        return best;\n    }\n}\n\n// ---- ext: algebraic notation -- &quot;accept Nf3 and O-O&quot;. The legal-move set is the disambiguation oracle.\n/**\n * Standard algebraic notation, both directions. The trick is that neither direction needs new rules code:\n * to print a move you only have to know which OTHER legal moves would look the same, and to read one you print\n * every legal move and compare. A notation bug can therefore never become a rules bug.\n *\n * Both entry points work on a PRIVATE COPY of the game, because deciding whether a move gives check means\n * playing it -- and playing it on the live game would tell every spectator about a move nobody made.\n */\nfinal class Notation {\n    /** The move in standard notation, disambiguated against the other legal moves, with + or # if it gives one. */\n    static String san(Game game, Move move) { return sanOn(Game.fromFen(&quot;san&quot;, game.fen()), move); }\n\n    /** Read &quot;Nf3&quot;, &quot;exd5&quot;, &quot;O-O&quot;, &quot;e8=Q#&quot;: print every legal move and take the one that matches. */\n    static Move parse(Game game, String text) {\n        String wanted = text.replaceAll(&quot;[+#!?]&quot;, &quot;&quot;).trim();\n        Game probe = Game.fromFen(&quot;san&quot;, game.fen());                     // one copy, reused for every candidate\n        for (Move m : probe.legalMoves()) if (sanOn(probe, m).replaceAll(&quot;[+#]&quot;, &quot;&quot;).equals(wanted)) return m;\n        throw new IllegalMoveException(&quot;no legal move reads as &quot; + text);\n    }\n\n    /** The same, on a game the caller already knows is a throwaway copy. */\n    static String sanOn(Game game, Move move) {\n        if (move.kind() == MoveKind.CASTLE_KING) return &quot;O-O&quot; + suffix(game, move);\n        if (move.kind() == MoveKind.CASTLE_QUEEN) return &quot;O-O-O&quot; + suffix(game, move);\n        StringBuilder sb = new StringBuilder();\n        if (move.moved().isPawn()) {\n            if (move.isCapture()) sb.append((char) (&#x27;a&#x27; + move.from().col())).append(&#x27;x&#x27;);\n        } else {\n            sb.append(Character.toUpperCase(move.moved().symbol())).append(disambiguate(game, move));\n            if (move.isCapture()) sb.append(&#x27;x&#x27;);\n        }\n        sb.append(move.to());\n        if (move.promoteTo() != null) sb.append(&#x27;=&#x27;).append(Character.toUpperCase(move.promoteTo().symbol()));\n        return sb.append(suffix(game, move)).toString();\n    }\n\n    /** The file, the rank, or both -- whichever is the least that tells this move apart from its twins. */\n    private static String disambiguate(Game game, Move move) {\n        List&lt;Move&gt; twins = game.legalMoves().stream()\n            .filter(m -&gt; m.moved() == move.moved() &amp;&amp; m.to().equals(move.to()) &amp;&amp; !m.from().equals(move.from())).toList();\n        if (twins.isEmpty()) return &quot;&quot;;\n        boolean fileIsEnough = twins.stream().noneMatch(m -&gt; m.from().col() == move.from().col());\n        if (fileIsEnough) return String.valueOf((char) (&#x27;a&#x27; + move.from().col()));\n        boolean rankIsEnough = twins.stream().noneMatch(m -&gt; m.from().row() == move.from().row());\n        if (rankIsEnough) return String.valueOf((char) (&#x27;1&#x27; + move.from().row()));\n        return move.from().toString();\n    }\n\n    /** Play it, look, take it back: the only way to know whether a move gives check is to make it. */\n    private static String suffix(Game game, Move move) {\n        GameStatus after = game.play(move);\n        game.undo();\n        return after == GameStatus.CHECKMATE ? &quot;#&quot; : after == GameStatus.CHECK ? &quot;+&quot; : &quot;&quot;;\n    }\n    private Notation() {}\n}\n\n// ---- ext: PGN -- an observer that keeps the move list, and renders it on demand by replaying it\n/**\n * A spectator that writes the game down. It stores MOVES, not text, and renders the notation by replaying them\n * on a private copy -- because notation needs the position BEFORE each move, which an observer, called after\n * the move, no longer has. Storing the move list rather than the text is also what makes takeback and resume work.\n */\nclass PgnRecorder implements GameObserver {\n    private final String startFen;\n    private final List&lt;Move&gt; moves = new ArrayList&lt;&gt;();\n    PgnRecorder(String startFen) { this.startFen = startFen; }\n    public void onMove(Game game, Move move, GameStatus after) { moves.add(move); }\n\n    /** &quot;1. e4 e5 2. Nf3 Nc6 ... 1-0&quot;. Built by replaying the move list from the starting position. */\n    String pgn() {\n        Game replay = Game.fromFen(&quot;pgn&quot;, startFen);\n        StringBuilder sb = new StringBuilder();\n        int number = 1;\n        for (int i = 0; i &lt; moves.size(); i++) {\n            if (replay.toMove() == Color.WHITE) sb.append(number++).append(&quot;. &quot;);\n            sb.append(Notation.sanOn(replay, moves.get(i))).append(&#x27; &#x27;);  // `replay` is already a private copy\n            replay.play(moves.get(i));\n        }\n        return sb.append(result(replay)).toString();\n    }\n    private static String result(Game g) {\n        if (g.status() == GameStatus.CHECKMATE) return g.winner() == Color.WHITE ? &quot;1-0&quot; : &quot;0-1&quot;;\n        if (g.status().over()) return &quot;1/2-1/2&quot;;\n        return &quot;*&quot;;\n    }\n    List&lt;Move&gt; moves() { return List.copyOf(moves); }\n}\n\n// ---- ext: the chess clock -- a time control is an observer built on the injected Clock, not a rule of chess\n/**\n * The clock debits whoever just moved and adds the increment. It is an observer because the rules engine has no\n * business knowing about time: a flag-fall is a result the SERVICE records, not a status the rules produce.\n * Because the time comes from an injected Clock, a test moves an hour in one line instead of waiting an hour.\n */\nclass ChessClock implements GameObserver {\n    private final Clock clock;\n    private final long incrementMs;\n    private final long[] remaining = new long[2];\n    private long lastMs;\n    ChessClock(Clock clock, long perSideMs, long incrementMs) {\n        this.clock = clock; this.incrementMs = incrementMs;\n        remaining[0] = remaining[1] = perSideMs;\n        lastMs = clock.nowMs();\n    }\n    public void onMove(Game game, Move move, GameStatus after) {\n        Color mover = game.toMove().opponent();                          // the turn has already flipped\n        long now = clock.nowMs();\n        remaining[mover.ordinal()] -= (now - lastMs);\n        if (remaining[mover.ordinal()] &gt; 0) remaining[mover.ordinal()] += incrementMs;\n        lastMs = now;\n    }\n    long remainingMs(Color c) { return remaining[c.ordinal()]; }\n    /** Has this side already run out? */\n    boolean flagged(Color c) { return remaining[c.ordinal()] &lt;= 0; }\n    /**\n     * Would this side be out of time if its move arrived now? This is the question the SERVICE asks before it\n     * accepts a move, because a player who has gone to lunch never sends the move that would stop their clock.\n     */\n    boolean wouldFlag(Color c) { return remaining[c.ordinal()] - (clock.nowMs() - lastMs) &lt;= 0; }\n}\n\n// ---- ext: insufficient material -- one more draw rule, and therefore one more wrapper, not an edit\n/**\n * King against king, and king and a single minor piece against king, cannot be mated by anyone, so the game is\n * drawn the moment the last relevant piece leaves the board. It wraps any rule set, and it can be stacked with\n * DrawRules: each wrapper adds one rule and none of them knows the others exist.\n */\nclass InsufficientMaterial implements RuleSet {\n    private final RuleSet base;\n    InsufficientMaterial(RuleSet base) { this.base = base; }\n    public GameStatus adjudicate(Game game, boolean inCheck, boolean anyLegalMove) {\n        GameStatus decided = base.adjudicate(game, inCheck, anyLegalMove);\n        if (decided.over()) return decided;\n        return dead(game.board()) ? GameStatus.DRAW : decided;\n    }\n    /** True when neither side has enough on the board to force mate. */\n    private static boolean dead(Board board) {\n        int minors = 0;\n        for (int r = 0; r &lt; 8; r++)\n            for (int c = 0; c &lt; 8; c++) {\n                Piece p = board.at(r, c);\n                if (p == null || p.isKing()) continue;\n                char kind = Character.toUpperCase(p.symbol());\n                if (kind == &#x27;N&#x27; || kind == &#x27;B&#x27;) { minors++; if (minors &gt; 1) return false; }\n                else return false;                                        // a pawn, rook, queen: mate is possible\n            }\n        return true;\n    }\n}\n\n// ---- ext: perft -- the standard proof that a chess move generator is correct, and the speed number\n/**\n * Count the leaves of the legal-move tree. The published numbers for these positions are known to the last\n * unit, so a generator that reproduces them has castling, en passant, promotion, pins and check evasion right.\n * It is also the honest speed benchmark: everything it does is generate, apply and take back.\n */\nfinal class Perft {\n    static long count(Game game, int depth) {\n        if (depth == 0) return 1;\n        long leaves = 0;\n        for (Move m : game.legalMoves()) { game.play(m); leaves += count(game, depth - 1); game.undo(); }\n        return leaves;\n    }\n    /** Same count, split by first move: what you print when a number is wrong and you need to find out where. */\n    static Map&lt;String, Long&gt; divide(Game game, int depth) {\n        Map&lt;String, Long&gt; out = new LinkedHashMap&lt;&gt;();\n        for (Move m : game.legalMoves()) { game.play(m); out.put(m.toString(), count(game, depth - 1)); game.undo(); }\n        return out;\n    }\n    private Perft() {}\n}\n\n// ---- ext: persistence and resume -- the move list IS the save format; FEN is the snapshot\n/** What is stored for one game: where it started, and every move since. Both are needed; neither is enough. */\nrecord SavedGame(String startFen, List&lt;String&gt; moves) {}\n\n/** Somewhere to keep games. A table, a file, a key-value store: the game does not care, which is the point. */\ninterface GameRepository {\n    void save(String gameId, SavedGame saved);\n    Optional&lt;SavedGame&gt; load(String gameId);\n}\n\n/** The in-memory one, so the tests and the demo have something to talk to. */\nclass InMemoryGameRepository implements GameRepository {\n    private final Map&lt;String, SavedGame&gt; rows = new HashMap&lt;&gt;();\n    public void save(String gameId, SavedGame saved) { rows.put(gameId, saved); }\n    public Optional&lt;SavedGame&gt; load(String gameId) { return Optional.ofNullable(rows.get(gameId)); }\n}\n\n/**\n * Save after every move, and rebuild a game from what was saved. Rebuilding replays the moves through the same\n * play() every live game uses, so a resumed game cannot be in a state a played game could not reach -- and the\n * repetition counts and the fifty-move clock come back right, which a FEN snapshot alone would lose.\n */\nclass Persistence implements GameObserver {\n    private final GameRepository repository;\n    private final String gameId, startFen;\n    private final List&lt;String&gt; moves = new ArrayList&lt;&gt;();\n    Persistence(GameRepository repository, Game game) {\n        this.repository = repository; this.gameId = game.id(); this.startFen = game.fen();\n        repository.save(gameId, new SavedGame(startFen, List.of()));\n    }\n    public void onMove(Game game, Move move, GameStatus after) {\n        moves.add(move.from().toString() + move.to()\n            + (move.promoteTo() == null ? &quot;&quot; : String.valueOf(Character.toUpperCase(move.promoteTo().symbol()))));\n        repository.save(gameId, new SavedGame(startFen, List.copyOf(moves)));\n    }\n    /** Rebuild a game from storage: the starting position, then every move replayed through the rules. */\n    static Game resume(GameRepository repository, String gameId) {\n        SavedGame saved = repository.load(gameId).orElseThrow(() -&gt; new NoSuchElementException(&quot;no such game: &quot; + gameId));\n        Game game = Game.fromFen(gameId, saved.startFen());\n        for (String coords : saved.moves()) {\n            Position from = Position.of(coords.substring(0, 2)), to = Position.of(coords.substring(2, 4));\n            char promote = coords.length() &gt; 4 ? coords.charAt(4) : 0;\n            game.play(game.legalMoves().stream()\n                .filter(m -&gt; m.from().equals(from) &amp;&amp; m.to().equals(to))\n                .filter(m -&gt; promote == 0 ? m.promoteTo() == null : m.promoteTo() == Pieces.of(m.moved().color, promote))\n                .findFirst().orElseThrow(() -&gt; new IllegalMoveException(&quot;the saved move &quot; + coords + &quot; is not legal&quot;)));\n        }\n        return game;\n    }\n}\n\n// ---- ext: online play -- two servers, a reconnecting client, and the compare-and-set that makes it safe\n/**\n * The service in front of many live games. Its only addition to the in-process version is the ply the client\n * says it saw: a phone that went through a tunnel and came back sends a move computed on a stale board, and\n * play(expectedPly, move) refuses it instead of applying it. Reconnecting is then just &quot;here is the move list\n * from ply n&quot;, which is why the move list is the thing that is stored.\n */\nclass MatchService {\n    private final Map&lt;String, Game&gt; live = new HashMap&lt;&gt;();\n    private final GameRepository repository;\n    MatchService(GameRepository repository) { this.repository = repository; }\n\n    /** Start a game, wire up persistence, and keep it in memory. */\n    Game start(String gameId) {\n        Game game = Game.newGame(gameId);\n        game.addObserver(new Persistence(repository, game));\n        live.put(gameId, game);\n        return game;\n    }\n    /** A move from a client that tells us which position it was looking at. */\n    GameStatus play(String gameId, int clientSawPly, Move move) { return game(gameId).play(clientSawPly, move); }\n    /** What a reconnecting client needs: everything that happened while it was away. */\n    List&lt;Move&gt; since(String gameId, int clientSawPly) {\n        List&lt;Move&gt; all = game(gameId).history();\n        return all.subList(Math.min(clientSawPly, all.size()), all.size());\n    }\n    /** A server that was restarted rebuilds the game from storage before serving it. */\n    Game game(String gameId) {\n        return live.computeIfAbsent(gameId, id -&gt; Persistence.resume(repository, id));\n    }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) {\n        // a fairy piece: one register() call, and the whole engine accepts it\n        Pieces.register(&#x27;C&#x27;, Chancellor::new);\n        Game fairy = Game.fromFen(&quot;fairy&quot;, &quot;7k/8/8/8/8/8/8/C3K3 w - - 0 1&quot;);\n        System.out.println(&quot;chancellor on a1 has &quot; + fairy.legalMoves().stream().filter(m -&gt; m.from().equals(Position.of(&quot;a1&quot;))).count()\n            + &quot; moves (rook rays + knight hops)&quot;);\n        Game fairyCheck = Game.fromFen(&quot;fairycheck&quot;, &quot;4k3/8/3C4/8/8/8/8/4K3 w - - 0 1&quot;);\n        System.out.println(&quot;check detection needed no edit: a chancellor on d6 attacks the king on e8 -&gt; &quot;\n            + fairyCheck.board().isAttacked(Position.of(&quot;e8&quot;), Color.WHITE));\n\n        // an AI opponent: alpha-beta over the same legalMoves() a user interface uses\n        Game engineGame = Game.fromFen(&quot;ai&quot;, &quot;rnbqkbnr/ppp2ppp/8/3pp3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 0 3&quot;);\n        Player engine = new MinimaxPlayer(new MaterialEvaluator(), 3);\n        long t0 = System.nanoTime();\n        Move chosen = engine.choose(engineGame);\n        System.out.println(&quot;depth-3 search picked &quot; + chosen + &quot; in &quot; + (System.nanoTime() - t0) / 1_000_000 + &quot; ms&quot;);\n\n        // notation, both directions\n        Game note = Game.newGame(&quot;note&quot;);\n        for (String san : new String[] { &quot;e4&quot;, &quot;e5&quot;, &quot;Nf3&quot;, &quot;Nc6&quot;, &quot;Bb5&quot;, &quot;a6&quot; }) note.play(Notation.parse(note, san));\n        System.out.println(&quot;read six moves of the Ruy Lopez from text; the position is &quot; + note.fen());\n        Game twins = Game.fromFen(&quot;twins&quot;, &quot;8/8/8/3N1N2/8/4k3/8/4K3 w - - 0 1&quot;);\n        System.out.println(&quot;two knights can reach e7, so the notation disambiguates: &quot;\n            + twins.legalMoves().stream().filter(m -&gt; m.to().equals(Position.of(&quot;e7&quot;))).map(m -&gt; Notation.san(twins, m)).toList());\n\n        // PGN, written by a spectator, rendered by replaying the move list -- including the result\n        Game recorded = Game.newGame(&quot;pgn&quot;);\n        PgnRecorder recorder = new PgnRecorder(recorded.fen());\n        recorded.addObserver(recorder);\n        for (String san : new String[] { &quot;f3&quot;, &quot;e5&quot;, &quot;g4&quot;, &quot;Qh4&quot; }) recorded.play(Notation.parse(recorded, san));\n        System.out.println(&quot;pgn: &quot; + recorder.pgn());\n        Game random = Game.newGame(&quot;random&quot;);\n        PgnRecorder log = new PgnRecorder(random.fen());\n        random.addObserver(log);\n        Player white = new RandomPlayer(4), black = new RandomPlayer(9);\n        while (!random.status().over() &amp;&amp; random.ply() &lt; 10)\n            random.play((random.toMove() == Color.WHITE ? white : black).choose(random));\n        System.out.println(&quot;two random players: &quot; + log.pgn());\n\n        // the chess clock, on a clock the test controls\n        long[] now = { 1_700_000_000_000L };\n        Game timed = Game.newGame(&quot;timed&quot;);\n        timed.setClock(() -&gt; now[0]);\n        ChessClock clock = new ChessClock(() -&gt; now[0], 180_000, 2_000);   // 3 minutes each, 2 second increment\n        timed.addObserver(clock);\n        now[0] += 10_000; timed.play(Notation.parse(timed, &quot;e4&quot;));\n        now[0] += 30_000; timed.play(Notation.parse(timed, &quot;e5&quot;));\n        System.out.println(&quot;after 10s and 30s: white has &quot; + clock.remainingMs(Color.WHITE) / 1000\n            + &quot;s, black has &quot; + clock.remainingMs(Color.BLACK) / 1000 + &quot;s (both got the 2s increment)&quot;);\n        now[0] += 200_000;                                                 // White goes to lunch\n        System.out.println(&quot;white sat for 200 more seconds -&gt; the service asks before accepting: wouldFlag(WHITE)=&quot;\n            + clock.wouldFlag(Color.WHITE) + &quot;, so the SERVICE records a loss on time. The rules engine never knew&quot;\n            + &quot; there was a clock, which is why a correspondence game and a bullet game share it.&quot;);\n\n        // draw rules, stacked: repetition, fifty moves and now insufficient material\n        Game bare = Game.fromFen(&quot;bare&quot;, &quot;4k3/8/8/8/8/8/8/4K1N1 w - - 0 1&quot;);\n        bare.configure(new InsufficientMaterial(new DrawRules(new StandardRules())));\n        System.out.println(&quot;king and a knight against a bare king -&gt; &quot; + bare.status());\n\n        // perft: the numbers are published to the last unit, so this is a proof, not a smoke test\n        long t1 = System.nanoTime();\n        long leaves = Perft.count(Game.newGame(&quot;perft&quot;), 4);\n        System.out.println(&quot;perft(4) from the start = &quot; + leaves + &quot; (must be 197281) in &quot;\n            + (System.nanoTime() - t1) / 1_000_000 + &quot; ms&quot;);\n        System.out.println(&quot;perft divide(2): &quot; + Perft.divide(Game.newGame(&quot;perft&quot;), 2).entrySet().stream().limit(4).toList() + &quot; ...&quot;);\n\n        // persistence, a restarted server, and a reconnecting client\n        GameRepository repository = new InMemoryGameRepository();\n        MatchService matches = new MatchService(repository);\n        Game online = matches.start(&quot;m1&quot;);\n        matches.play(&quot;m1&quot;, 0, Notation.parse(online, &quot;e4&quot;));\n        matches.play(&quot;m1&quot;, 1, Notation.parse(online, &quot;e5&quot;));\n        try {\n            matches.play(&quot;m1&quot;, 1, Notation.parse(online, &quot;Nf3&quot;));           // a client that missed a move\n            System.out.println(&quot;a stale client was accepted -- this should not print&quot;);\n        } catch (IllegalMoveException e) { System.out.println(&quot;stale client refused: &quot; + e.getMessage()); }\n        System.out.println(&quot;what a reconnecting client missed since ply 0: &quot; + matches.since(&quot;m1&quot;, 0));\n        Game rebuilt = Persistence.resume(repository, &quot;m1&quot;);\n        System.out.println(&quot;rebuilt from storage on a fresh server: &quot; + rebuilt.fen() + &quot;  same=&quot; + rebuilt.fen().equals(online.fen()));\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// Targeted failure tests: each block proves one claim the design makes on page 02, move 9.\n// javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests   -&gt;   ALL PASS\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n\n    /** Count the leaves of the legal-move tree to `depth`. The standard chess correctness benchmark. */\n    static long perft(Game g, int depth) {\n        if (depth == 0) return 1;\n        long n = 0;\n        for (Move m : g.legalMoves()) { g.play(m); n += perft(g, depth - 1); g.undo(); }\n        return n;\n    }\n    /** Every legal move from this square. */\n    static List&lt;Move&gt; from(Game g, String square) {\n        Position p = Position.of(square);\n        return g.legalMoves().stream().filter(m -&gt; m.from().equals(p)).toList();\n    }\n    /** The legal move from one square to another, or null. */\n    static Move move(Game g, String coords) {\n        Position f = Position.of(coords.substring(0, 2)), t = Position.of(coords.substring(2, 4));\n        return g.legalMoves().stream().filter(m -&gt; m.from().equals(f) &amp;&amp; m.to().equals(t)).findFirst().orElse(null);\n    }\n    static void line(Game g, String... coords) { for (String c : coords) g.play(move(g, c)); }\n\n    public static void main(String[] args) throws Exception {\n\n        // 1. the geometry a junior gets wrong: a knight in the corner, the pawn&#x27;s double step, Black&#x27;s direction\n        Game corner = Game.fromFen(&quot;corner&quot;, &quot;N6k/8/8/8/8/8/8/K7 w - - 0 1&quot;);\n        check(from(corner, &quot;a8&quot;).size() == 2, &quot;a knight in the corner has exactly 2 moves, not 8&quot;);\n        Game open = Game.newGame(&quot;open&quot;);\n        check(open.legalMoves().size() == 20, &quot;the opening position has exactly 20 legal moves&quot;);\n        check(move(open, &quot;e2e4&quot;) != null &amp;&amp; move(open, &quot;e2e3&quot;) != null, &quot;a pawn on its own rank may step one or two&quot;);\n        line(open, &quot;e2e3&quot;, &quot;e7e6&quot;);\n        check(move(open, &quot;e3e5&quot;) == null &amp;&amp; move(open, &quot;e3e4&quot;) != null,\n              &quot;a pawn that has already moved may not take two steps&quot;);\n        check(open.legalMoves().size() == 30, &quot;White has 30 legal moves after 1.e3 e6&quot;);\n        Game black = Game.newGame(&quot;black&quot;);\n        line(black, &quot;e2e4&quot;);\n        check(move(black, &quot;e7e5&quot;) != null &amp;&amp; move(black, &quot;e7e8&quot;) == null,\n              &quot;Black&#x27;s pawns march DOWN the board, not up (nobody hardcoded +1)&quot;);\n\n        // 2. the move generator is provably correct: perft, the standard chess benchmark, on four hard positions\n        check(perft(Game.newGame(&quot;p&quot;), 1) == 20 &amp;&amp; perft(Game.newGame(&quot;p&quot;), 2) == 400,\n              &quot;perft from the start: 20 moves, 400 replies&quot;);\n        check(perft(Game.newGame(&quot;p&quot;), 3) == 8902, &quot;perft depth 3 from the start is exactly 8902&quot;);\n        Game kiwi = Game.fromFen(&quot;kiwi&quot;, &quot;r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1&quot;);\n        check(perft(kiwi, 1) == 48 &amp;&amp; perft(kiwi, 2) == 2039,\n              &quot;perft on the standard castling/pin position: 48 and 2039&quot;);\n        Game ep3 = Game.fromFen(&quot;ep3&quot;, &quot;8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1&quot;);\n        check(perft(ep3, 1) == 14 &amp;&amp; perft(ep3, 2) == 191 &amp;&amp; perft(ep3, 3) == 2812,\n              &quot;perft on the standard en-passant/discovered-check position: 14, 191, 2812&quot;);\n        Game pr4 = Game.fromFen(&quot;pr4&quot;, &quot;r3k2r/Pppp1ppp/1b3nbN/nP6/BBP1P3/q4N2/Pp1P2PP/R2Q1RK1 w kq - 0 1&quot;);\n        check(perft(pr4, 1) == 6 &amp;&amp; perft(pr4, 2) == 264, &quot;perft on the standard promotion position: 6 and 264&quot;);\n\n        // 3. you may not leave your own king in check: a pinned piece is frozen, and a king cannot walk into fire\n        Game pin = Game.fromFen(&quot;pin&quot;, &quot;4r2k/8/8/8/8/8/4B3/4K3 w - - 0 1&quot;);\n        check(pin.status() == GameStatus.ACTIVE, &quot;the bishop blocks the rook, so White is not in check&quot;);\n        check(from(pin, &quot;e2&quot;).isEmpty(), &quot;a pinned bishop has ZERO legal moves, however good they look&quot;);\n        Game walk = Game.fromFen(&quot;walk&quot;, &quot;7k/8/8/8/8/8/r7/4K3 w - - 0 1&quot;);\n        check(walk.legalMoves().size() == 2, &quot;the king has only the 2 squares off the attacked rank (Kd1, Kf1)&quot;);\n        check(walk.legalMoves().stream().noneMatch(m -&gt; m.to().equals(Position.of(&quot;e2&quot;))),\n              &quot;the king may not step onto an attacked square&quot;);\n\n        // 4. simulate on the REAL board and put it back exactly: the position must be byte-identical afterwards\n        String[] positions = {\n            &quot;rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1&quot;,\n            &quot;r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1&quot;,\n            &quot;rnbqkbnr/p1pppppp/8/1pP5/8/8/PP1PPPPP/RNBQKBNR w KQkq b6 0 3&quot;,\n            &quot;r3k2r/Pppp1ppp/1b3nbN/nP6/BBP1P3/q4N2/Pp1P2PP/R2Q1RK1 w kq - 0 1&quot;,\n            &quot;8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1&quot;,\n            &quot;4r2k/8/8/8/8/8/4B3/4K3 w - - 0 1&quot; };\n        boolean intact = true;\n        for (String fen : positions) {\n            Game g = Game.fromFen(&quot;sim&quot;, fen);\n            String before = g.fen();\n            List&lt;Move&gt; legal = g.legalMoves();                            // generation makes and unmakes every move\n            if (!before.equals(g.fen())) intact = false;\n            for (Move m : legal) { g.play(m); g.undo(); if (!before.equals(g.fen())) intact = false; }\n        }\n        check(intact, &quot;generating and taking back every legal move in 6 positions left every FEN identical&quot;);\n        Game take = Game.fromFen(&quot;take&quot;, &quot;rnbqkbnr/ppp1pppp/8/3p4/4P3/8/PPPP1PPP/RNBQKBNR w KQkq d6 0 2&quot;);\n        String beforeCapture = take.fen();\n        take.play(move(take, &quot;e4d5&quot;));\n        check(take.board().at(Position.of(&quot;d5&quot;)).color == Color.WHITE, &quot;exd5 took the black pawn&quot;);\n        take.undo();\n        check(take.fen().equals(beforeCapture), &quot;the takeback put the captured pawn back and restored the en passant square&quot;);\n\n        // 5. castling: the five conditions, and what actually moves\n        Game cast = Game.fromFen(&quot;cast&quot;, &quot;r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1&quot;);\n        check(move(cast, &quot;e1g1&quot;) != null &amp;&amp; move(cast, &quot;e1c1&quot;) != null, &quot;both castles are offered when nothing is in the way&quot;);\n        cast.play(move(cast, &quot;e1g1&quot;));\n        check(cast.board().at(Position.of(&quot;g1&quot;)).isKing() &amp;&amp; cast.board().at(Position.of(&quot;f1&quot;)) != null\n              &amp;&amp; cast.board().at(Position.of(&quot;h1&quot;)) == null, &quot;O-O moved the ROOK too: h1 is empty, f1 holds it&quot;);\n        Game through = Game.fromFen(&quot;through&quot;, &quot;r4rk1/8/8/8/8/8/8/R3K2R w KQ - 0 1&quot;);\n        check(move(through, &quot;e1g1&quot;) == null, &quot;castling is refused THROUGH an attacked square (f1)&quot;);\n        check(move(through, &quot;e1c1&quot;) != null, &quot;but the other side, which is not attacked, is still offered&quot;);\n        Game out = Game.fromFen(&quot;out&quot;, &quot;4r2k/8/8/8/8/8/8/R3K2R w KQ - 0 1&quot;);\n        check(move(out, &quot;e1g1&quot;) == null &amp;&amp; move(out, &quot;e1c1&quot;) == null, &quot;castling is refused OUT of check&quot;);\n        Game moved = Game.fromFen(&quot;moved&quot;, &quot;r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1&quot;);\n        line(moved, &quot;h1g1&quot;, &quot;a8b8&quot;, &quot;g1h1&quot;, &quot;b8a8&quot;);\n        check(move(moved, &quot;e1g1&quot;) == null, &quot;the right is gone once the rook has moved, even though it came back&quot;);\n        Game grab = Game.fromFen(&quot;grab&quot;, &quot;r3k2r/8/8/8/8/8/6B1/R3K2R w KQkq - 0 1&quot;);\n        grab.play(move(grab, &quot;g2a8&quot;));\n        check(grab.fen().contains(&quot; KQk &quot;), &quot;capturing a rook ON ITS CORNER kills that side&#x27;s right (q is gone)&quot;);\n\n        // 6. en passant: the window is exactly one ply, and the victim is not on the destination square\n        Game ep = Game.fromFen(&quot;ep&quot;, &quot;rnbqkbnr/p1pppppp/8/1pP5/8/8/PP1PPPPP/RNBQKBNR w KQkq b6 0 3&quot;);\n        Move grabPassing = move(ep, &quot;c5b6&quot;);\n        check(grabPassing != null &amp;&amp; grabPassing.kind() == MoveKind.EN_PASSANT, &quot;the en passant capture is generated&quot;);\n        check(grabPassing.capturedAt().equals(Position.of(&quot;b5&quot;)) &amp;&amp; !grabPassing.capturedAt().equals(grabPassing.to()),\n              &quot;the victim stands on b5, which is NOT the square the pawn lands on&quot;);\n        ep.play(grabPassing);\n        check(ep.board().at(Position.of(&quot;b5&quot;)) == null &amp;&amp; ep.board().at(Position.of(&quot;b6&quot;)) != null,\n              &quot;after it, b5 is empty and b6 holds the white pawn&quot;);\n        Game late = Game.fromFen(&quot;late&quot;, &quot;rnbqkbnr/p1pppppp/8/1pP5/8/8/PP1PPPPP/RNBQKBNR w KQkq b6 0 3&quot;);\n        line(late, &quot;a2a3&quot;, &quot;a7a6&quot;);\n        check(move(late, &quot;c5b6&quot;) == null, &quot;one ply later the chance is gone: the en passant square lives exactly one ply&quot;);\n\n        // 7. promotion: four choices, a king is not one of them, and a takeback turns the queen back into a pawn\n        Game promo = Game.fromFen(&quot;promo&quot;, &quot;8/P6k/8/8/8/8/7K/8 w - - 0 1&quot;);\n        List&lt;Move&gt; choices = from(promo, &quot;a7&quot;);\n        check(choices.size() == 4, &quot;a promotion fans out into exactly 4 moves, one per piece&quot;);\n        check(choices.stream().anyMatch(m -&gt; m.promoteTo() == Pieces.knight(Color.WHITE)),\n              &quot;under-promotion to a knight is among them: it is legal and occasionally winning&quot;);\n        check(choices.stream().noneMatch(m -&gt; m.promoteTo().isKing()), &quot;promoting to a king is not on the list&quot;);\n        try {\n            promo.play(Move.promotion(Position.of(&quot;a7&quot;), Position.of(&quot;a8&quot;), Pieces.pawn(Color.WHITE), null, Pieces.king(Color.WHITE)));\n            check(false, &quot;a hand-made promotion to a king must be refused&quot;);\n        } catch (IllegalMoveException e) { check(true, &quot;a hand-made promotion to a king is refused: &quot; + e.getMessage()); }\n        String beforePromo = promo.fen();\n        promo.play(choices.stream().filter(m -&gt; m.promoteTo() == Pieces.knight(Color.WHITE)).findFirst().orElseThrow());\n        check(promo.board().at(Position.of(&quot;a8&quot;)).hopsKnight(), &quot;the pawn really became a knight&quot;);\n        promo.undo();\n        check(promo.fen().equals(beforePromo) &amp;&amp; promo.board().at(Position.of(&quot;a7&quot;)).isPawn(),\n              &quot;the takeback turned the knight back into a pawn on a7&quot;);\n\n        // 8. one primitive, three endings -- and the pawn attack/move split that check detection depends on\n        Game mate = Game.newGame(&quot;mate&quot;);\n        line(mate, &quot;f2f3&quot;, &quot;e7e5&quot;, &quot;g2g4&quot;, &quot;d8h4&quot;);\n        check(mate.status() == GameStatus.CHECKMATE &amp;&amp; mate.winner() == Color.BLACK, &quot;fool&#x27;s mate is detected as CHECKMATE&quot;);\n        check(mate.legalMoves().isEmpty(), &quot;and it is detected because the side to move has no legal move at all&quot;);\n        try { mate.play(Move.quiet(Position.of(&quot;h2&quot;), Position.of(&quot;h3&quot;), Pieces.pawn(Color.WHITE))); check(false, &quot;a finished game must refuse moves&quot;); }\n        catch (IllegalMoveException e) { check(true, &quot;a finished game refuses every further move: &quot; + e.getMessage()); }\n        Game stale = Game.fromFen(&quot;stale&quot;, &quot;7k/8/6Q1/8/8/8/8/K7 b - - 0 1&quot;);\n        check(stale.status() == GameStatus.STALEMATE, &quot;the same &#x27;no legal move&#x27; with no check is STALEMATE, not a win&quot;);\n        check(stale.winner() == null, &quot;and a stalemate has no winner&quot;);\n        check(!Board.fromFen(&quot;8/8/8/8/4k3/4P3/8/4K3 b - - 0 1&quot;).inCheck(Color.BLACK),\n              &quot;a pawn directly in FRONT of the king does not give check: a pawn&#x27;s move is not its attack&quot;);\n        check(Board.fromFen(&quot;8/8/8/8/4k3/3P4/8/4K3 b - - 0 1&quot;).inCheck(Color.BLACK),\n              &quot;the same pawn one file over DOES give check, because it attacks diagonally&quot;);\n        check(Board.fromFen(&quot;8/8/8/4p3/3K4/8/8/4k3 w - - 0 1&quot;).inCheck(Color.WHITE),\n              &quot;and a BLACK pawn checks downward, because the direction comes from the colour&quot;);\n\n        // 9. two requests for one game at the same instant: exactly one may land; a broken spectator changes nothing\n        Game contested = Game.newGame(&quot;race&quot;);\n        List&lt;Move&gt; opening = contested.legalMoves();\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;Boolean&gt;&gt; sent = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final Move mine = opening.get(i % opening.size());\n            sent.add(pool.submit(() -&gt; { go.await(); try { contested.play(mine); return true; } catch (IllegalMoveException e) { return false; } }));\n        }\n        go.countDown();\n        int accepted = 0;\n        for (Future&lt;Boolean&gt; f : sent) if (f.get()) accepted++;\n        check(accepted == 1, &quot;50 clients fired at one game: exactly 1 move was accepted&quot;);\n        check(contested.ply() == 1, &quot;the history has exactly one ply, not two&quot;);\n        check(contested.toMove() == Color.BLACK, &quot;and the turn flipped exactly once&quot;);\n        // eight whole games at once: per-game locks mean they never touch each other\n        List&lt;Future&lt;Integer&gt;&gt; games = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 8; i++) {\n            final int seed = i;\n            games.add(pool.submit(() -&gt; {\n                Game g = Game.newGame(&quot;par&quot; + seed);\n                Random r = new Random(seed);\n                int plies = 0;\n                while (!g.status().over() &amp;&amp; plies &lt; 60) { List&lt;Move&gt; l = g.legalMoves(); g.play(l.get(r.nextInt(l.size()))); plies++; }\n                return g.ply();\n            }));\n        }\n        boolean allFine = true;\n        for (Future&lt;Integer&gt; f : games) if (f.get() &lt; 1) allFine = false;\n        pool.shutdown();\n        check(allFine, &quot;eight whole games played in parallel: the lock is per game, so they never wait for each other&quot;);\n        Game noisy = Game.newGame(&quot;noisy&quot;);\n        noisy.addObserver((g, m, after) -&gt; { throw new RuntimeException(&quot;the spectator&#x27;s websocket died&quot;); });\n        noisy.play(move(noisy, &quot;e2e4&quot;));\n        check(noisy.ply() == 1 &amp;&amp; noisy.board().at(Position.of(&quot;e4&quot;)) != null,\n              &quot;a spectator that throws does not break the move: it is called after the lock, in a try/catch&quot;);\n\n        // 10. the draw rules are a wrapper: the same game is a draw with them and ongoing without them\n        Game rep = Game.newGame(&quot;rep&quot;);\n        rep.configure(new DrawRules(new StandardRules()));\n        line(rep, &quot;g1f3&quot;, &quot;g8f6&quot;, &quot;f3g1&quot;, &quot;f6g8&quot;, &quot;g1f3&quot;, &quot;g8f6&quot;, &quot;f3g1&quot;, &quot;f6g8&quot;);\n        check(rep.status() == GameStatus.DRAW, &quot;the third time the same position appears is a DRAW&quot;);\n        Game noRep = Game.newGame(&quot;norep&quot;);\n        line(noRep, &quot;g1f3&quot;, &quot;g8f6&quot;, &quot;f3g1&quot;, &quot;f6g8&quot;, &quot;g1f3&quot;, &quot;g8f6&quot;, &quot;f3g1&quot;, &quot;f6g8&quot;);\n        check(noRep.status() == GameStatus.ACTIVE,\n              &quot;the identical game WITHOUT the wrapper is still ACTIVE: the rule is in the decorator, not the engine&quot;);\n        Game fifty = Game.newGame(&quot;fifty&quot;);\n        fifty.configure(new DrawRules(new StandardRules(), 6, 99));        // a 6-ply limit, so the test is not 100 moves long\n        line(fifty, &quot;g1f3&quot;, &quot;g8f6&quot;, &quot;f3g1&quot;, &quot;f6g8&quot;, &quot;g1f3&quot;, &quot;g8f6&quot;);\n        check(fifty.status() == GameStatus.DRAW, &quot;six plies with no pawn move and no capture hit the (shortened) fifty-move rule&quot;);\n        check(fifty.halfmoveClock() == 6, &quot;and the clock that measures it counted exactly six&quot;);\n        Game reset = Game.newGame(&quot;reset&quot;);\n        line(reset, &quot;e2e4&quot;);\n        check(reset.halfmoveClock() == 0, &quot;a pawn move resets that clock to zero&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design a chess game. Two players, a real board, real rules &mdash; castling, en passant, promotion &mdash; and after every move it must tell me whether that was check, checkmate or stalemate. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (full rules or geometry only, and which draw rules, first); then type in the order of Main.java: the three enums and Color's four helpers, Position, the abstract Piece with its one geometry method and its capability flags, SlidingPiece and the six pieces, the Pieces registry, Move and Undo, Board with isAttacked and FEN, the RuleSet interface with StandardRules, then Game with its lock, its legal-move filter and the order inside play, then the thin service, then a main with fifty threads.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; The interviewer invents a piece: a Chancellor, which moves like a rook AND a knight. How much of your code changes?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One new class and one line. The Chancellor extends Piece, walks the four straight rays and adds the eight knight squares, and says yes to two capability questions: do you ride straight lines, do you hop like a knight. Move generation already works, because everything calls <code>pseudoMoves</code> on the abstraction. Check detection already works, and this is the part worth pointing at: <code>isAttacked</code> walks outward from the king and asks each piece it meets what it <i>can do</i>, never what it <i>is</i>, so a chancellor sitting on a rank is found by the ray probe and one sitting on a knight square is found by the jump probe. Castling, checkmate, stalemate, FEN, printing and promotion all keep working untouched. The registry line is the only edit outside the new file.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a fairy piece -- &quot;add a Chancellor: it moves like a rook AND a knight&quot;. One new class, one line.\n/**\n * The Chancellor rides the four straight rays and also hops the knight&#x27;s L. It touches nothing else: move\n * generation calls attacks(), and check detection asks the capability flags, so the board, the game, castling,\n * checkmate and stalemate all keep working with no edit at all. That is Open/Closed, paid out.\n */\nclass Chancellor extends Piece {\n    private static final int[][] JUMPS = { {2, 1}, {2, -1}, {-2, 1}, {-2, -1}, {1, 2}, {1, -2}, {-1, 2}, {-1, -2} };\n    Chancellor(Color color) { super(color, &#x27;C&#x27;); }\n\n    /** Rook rays until blocked, plus the eight knight squares. */\n    @Override void attacks(Board board, Position from, List&lt;Position&gt; out) {\n        for (int[] d : SlidingPiece.STRAIGHT)\n            for (int step = 1; ; step++) {\n                int r = from.row() + d[0] * step, c = from.col() + d[1] * step;\n                if (!Position.onBoard(r, c)) break;\n                out.add(Position.at(r, c));\n                if (board.at(r, c) != null) break;\n            }\n        for (int[] j : JUMPS) {\n            int r = from.row() + j[0], c = from.col() + j[1];\n            if (Position.onBoard(r, c)) out.add(Position.at(r, c));\n        }\n    }\n    @Override boolean ridesStraight() { return true; }\n    @Override boolean hopsKnight() { return true; }\n}\n// the only change at the call site, once, at start-up:\n//     Pieces.register(&#x27;C&#x27;, Chancellor::new);\n// after that &#x27;C&#x27; and &#x27;c&#x27; work in FEN, in printing and in promotion, and isAttacked finds it because it asks\n// &quot;do you ride straight lines? do you hop like a knight?&quot; instead of &quot;are you a rook?&quot;.\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two requests arrive for the same game at the same instant -- a double click, or a phone retrying. Prove you cannot play two moves on one turn.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between generating the legal set and applying the chosen move. <code>play</code> does both inside one lock held by the game, so no second request can slip into that gap. The proof is not a count but the rules themselves: fifty threads wait on one latch and all fifty fire an opening move at the same game, and afterwards exactly one was accepted, the history has exactly one ply and the turn flipped exactly once. The forty-nine losers were not refused by the lock &mdash; they waited for it politely and were then refused by chess, because by the time they got in it was Black's turn and a White move is not in the legal set. The same test then plays eight whole games in parallel to show the lock is per game and they never touch.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 9. two requests for one game at the same instant: exactly one may land; a broken spectator changes nothing\n        Game contested = Game.newGame(&quot;race&quot;);\n        List&lt;Move&gt; opening = contested.legalMoves();\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;Boolean&gt;&gt; sent = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final Move mine = opening.get(i % opening.size());\n            sent.add(pool.submit(() -&gt; { go.await(); try { contested.play(mine); return true; } catch (IllegalMoveException e) { return false; } }));\n        }\n        go.countDown();\n        int accepted = 0;\n        for (Future&lt;Boolean&gt; f : sent) if (f.get()) accepted++;\n        check(accepted == 1, &quot;50 clients fired at one game: exactly 1 move was accepted&quot;);\n        check(contested.ply() == 1, &quot;the history has exactly one ply, not two&quot;);\n        check(contested.toMove() == Color.BLACK, &quot;and the turn flipped exactly once&quot;);\n        // eight whole games at once: per-game locks mean they never touch each other\n        List&lt;Future&lt;Integer&gt;&gt; games = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 8; i++) {\n            final int seed = i;\n            games.add(pool.submit(() -&gt; {\n                Game g = Game.newGame(&quot;par&quot; + seed);\n                Random r = new Random(seed);\n                int plies = 0;\n                while (!g.status().over() &amp;&amp; plies &lt; 60) { List&lt;Move&gt; l = g.legalMoves(); g.play(l.get(r.nextInt(l.size()))); plies++; }\n                return g.ply();\n            }));\n        }\n        boolean allFine = true;\n        for (Future&lt;Integer&gt; f : games) if (f.get() &lt; 1) allFine = false;\n        pool.shutdown();\n        check(allFine, &quot;eight whole games played in parallel: the lock is per game, so they never wait for each other&quot;);\n        Game noisy = Game.newGame(&quot;noisy&quot;);\n        noisy.addObserver((g, m, after) -&gt; { throw new RuntimeException(&quot;the spectator&#x27;s websocket died&quot;); });\n        noisy.play(move(noisy, &quot;e2e4&quot;));\n        check(noisy.ply() == 1 &amp;&amp; noisy.board().at(Position.of(&quot;e4&quot;)) != null,\n              &quot;a spectator that throws does not break the move: it is called after the lock, in a try/catch&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock per game. Have you just serialised your chess server?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No, and the answer is arithmetic rather than opinion. A whole <code>play</code> is about twelve microseconds; <code>Main</code> times fifteen hundred plies of random games to get that number. Blitz is a move every three seconds, so one game's lock is busy twelve microseconds in every three million &mdash; four ten-thousandths of one per cent &mdash; and a hundred thousand live games is thirty-three thousand moves a second, four tenths of one core, with no two games ever contending because the lock is per game and not per server. Then the ladder, if they push: the legal set is already generated once per ply and remembered; then test only the moves that can possibly be illegal (pinned pieces, king moves, check evasions), about ten times fewer attack questions; then bitboards, worth a hundredfold to an engine and worth nothing at all to two humans moving every three seconds.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    GameStatus play(Move move) {\n        Objects.requireNonNull(move, &quot;move&quot;);\n        GameStatus after;\n        lock.lock();\n        try { after = commit(move); } finally { lock.unlock(); }\n        publish(move, after);                                            // outside the lock: a slow spectator stalls nobody\n        return after;\n    }\n\n    /**\n     * Play a move only if the game is still at the ply the client saw. This is the same critical section with an\n     * optimistic check in front of it: a client that has been away, or a retried request, comes back with a move\n     * computed on a stale board and is refused rather than silently applied. It is the in-memory twin of\n     * &lt;code&gt;UPDATE games SET ... WHERE ply = ?&lt;/code&gt;, which is how the same guarantee is written once the game\n     * lives in a database and two servers can both hold a request for it.\n     */\n    GameStatus play(int expectedPly, Move move) {\n        Objects.requireNonNull(move, &quot;move&quot;);\n        GameStatus after;\n        lock.lock();\n        try {\n            if (history.size() != expectedPly)\n                throw new IllegalMoveException(&quot;stale board: you saw ply &quot; + expectedPly + &quot;, the game is at ply &quot; + history.size());\n            after = commit(move);\n        } finally { lock.unlock(); }\n        publish(move, after);\n        return after;\n    }\n\n    /** The critical section itself. The caller holds the lock; nothing slow and nothing external happens in here. */\n    private GameStatus commit(Move move) {\n        if (status.over()) throw new IllegalMoveException(&quot;the game is over: &quot; + status);\n        if (!legalMovesLocked().contains(move)) throw new IllegalMoveException(&quot;not a legal move: &quot; + move);\n        history.push(applyMove(move));                                   // the board edit, and its exact undo\n        toMove = toMove.opponent();\n        if (toMove == Color.WHITE) fullmove++;\n        cachedLegal = null;\n        seen.merge(board.positionKey(toMove), 1, Integer::sum);\n        return status = judge();\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; A move turns out to be illegal. What is the state of the board?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was, character for character. Nothing is written until the move has been found in the legal set, and the legal set is built by playing each candidate on the real board, asking the one question that matters, and taking it back &mdash; so the only edits that happen before a decision are edits we can reverse exactly. The undo record carries what a move quietly destroys: the captured piece and the square it actually stood on, the four castling rights, the en passant square and the fifty-move clock. That is why taking back a move is the same code as filtering for legality, and why it is the best-tested code in the file: the test generates every legal move in six positions, including one full of pins and castling rights, and checks that the FEN is identical afterwards. If they ask for redo as well, it is the same records pushed the other way &mdash; a second stack that <code>undo</code> pushes onto and <code>play</code> clears &mdash; and no new mechanism at all.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Take back the last move. The undo record holds the captured piece, the castling rights, the en passant\n     * square and the fifty-move clock, so this restores the position exactly -- the same mechanism the legality\n     * filter uses thousands of times a second, which is why it is the best-tested code in the file.\n     */\n    Move undo() {\n        lock.lock();\n        try {\n            if (history.isEmpty()) throw new IllegalStateException(&quot;no move to take back&quot;);\n            seen.merge(board.positionKey(toMove), -1, Integer::sum);\n            Undo u = history.pop();\n            undoMove(u);\n            toMove = toMove.opponent();\n            if (toMove == Color.BLACK) fullmove--;\n            cachedLegal = null;\n            status = judge();\n            return u.move();\n        } finally { lock.unlock(); }\n    }\n\n    // ---------------------------------------------------------------- the rules layer, all under the lock\n\n    private List&lt;Move&gt; legalMovesLocked() {\n        if (cachedLegal != null) return cachedLegal;\n        List&lt;Move&gt; pseudo = new ArrayList&lt;&gt;(48);\n        for (int i = 0; i &lt; 64; i++) {\n            Position from = Position.at(i / 8, i % 8);\n            Piece p = board.at(from);\n            if (p != null &amp;&amp; p.color == toMove) p.pseudoMoves(board, from, pseudo);\n        }\n        addCastles(pseudo);\n        List&lt;Move&gt; legal = new ArrayList&lt;&gt;(pseudo.size());\n        for (Move m : pseudo) {\n            Undo u = applyMove(m);                                       // play it for real...\n            boolean safe = !board.inCheck(toMove);                       // ...ask the only question that matters...\n            undoMove(u);                                                 // ...and put everything back, exactly.\n            if (safe) legal.add(m);\n        }\n        return cachedLegal = List.copyOf(legal);\n    }\n\n    /**\n     * Castling is generated here and not in King, because it is the one move whose legality depends on squares\n     * being attacked, and no piece can see the whole board. Five conditions: the right is still held, the rook\n     * is still there, the squares between are empty, and the king is not in check, does not pass through an\n     * attacked square, and does not land on one (the last is left to the ordinary filter).\n     */\n    private void addCastles(List&lt;Move&gt; out) {\n        int row = toMove == Color.WHITE ? 0 : 7;\n        Position kingSquare = Position.at(row, 4);\n        Piece king = board.at(kingSquare);\n        if (king == null || !king.isKing() || king.color != toMove) return;\n        if (board.isAttacked(kingSquare, toMove.opponent())) return;     // you may not castle out of check\n        if (board.mayCastle(toMove, true) &amp;&amp; rookAt(row, 7)\n                &amp;&amp; board.at(row, 5) == null &amp;&amp; board.at(row, 6) == null\n                &amp;&amp; !board.isAttacked(Position.at(row, 5), toMove.opponent()))\n            out.add(Move.castle(kingSquare, Position.at(row, 6), king, true));\n        if (board.mayCastle(toMove, false) &amp;&amp; rookAt(row, 0)\n                &amp;&amp; board.at(row, 1) == null &amp;&amp; board.at(row, 2) == null &amp;&amp; board.at(row, 3) == null\n                &amp;&amp; !board.isAttacked(Position.at(row, 3), toMove.opponent()))\n            out.add(Move.castle(kingSquare, Position.at(row, 2), king, false));\n    }\n    private boolean rookAt(int row, int col) {\n        Piece p = board.at(row, col);\n        return p != null &amp;&amp; p.color == toMove &amp;&amp; p.ridesStraight() &amp;&amp; !p.ridesDiagonal();\n    }\n\n    /**\n     * Edit the board, and return everything needed to put it back. This touches the squares, the king cache,\n     * the castling rights, the en passant square and the fifty-move clock -- and nothing else, so the legality\n     * filter can call it thousands of times without disturbing the turn, the history or the status.\n     */\n    private Undo applyMove(Move m) {\n        Undo undo = new Undo(m, board.enPassantTarget(), board.rights(), board.halfmoveClock());\n        Piece mover = board.remove(m.from());\n        if (m.capturedAt() != null) board.remove(m.capturedAt());        // en passant clears a DIFFERENT square\n        switch (m.kind()) {\n            case PROMOTION -&gt; board.place(m.to(), m.promoteTo());\n            case CASTLE_KING -&gt; { board.place(m.to(), mover); board.place(Position.at(m.from().row(), 5), board.remove(Position.at(m.from().row(), 7))); }\n            case CASTLE_QUEEN -&gt; { board.place(m.to(), mover); board.place(Position.at(m.from().row(), 3), board.remove(Position.at(m.from().row(), 0))); }\n            default -&gt; board.place(m.to(), mover);\n        }\n        // the en passant square is created by a double push and destroyed by literally anything else: one ply\n        board.setEnPassantTarget(m.kind() == MoveKind.DOUBLE_PAWN\n                ? Position.at((m.from().row() + m.to().row()) / 2, m.from().col()) : null);\n        if (mover.isKing()) { board.revoke(mover.color, true); board.revoke(mover.color, false); }\n        board.revokeIfCorner(m.from());                                  // a rook left its corner\n        board.revokeIfCorner(m.to());                                    // or a rook was captured on its corner\n        board.setHalfmoveClock(m.moved().isPawn() || m.isCapture() ? 0 : undo.halfmoveBefore() + 1);\n        return undo;\n    }\n\n    /** The exact mirror of applyMove. Every line here undoes one line there, in the opposite order. */\n    private void undoMove(Undo u) {\n        Move m = u.move();\n        Piece mover = board.remove(m.to());\n        if (m.kind() == MoveKind.PROMOTION) mover = Pieces.pawn(mover.color);\n        board.place(m.from(), mover);\n        if (m.kind() == MoveKind.CASTLE_KING) board.place(Position.at(m.from().row(), 7), board.remove(Position.at(m.from().row(), 5)));\n        if (m.kind() == MoveKind.CASTLE_QUEEN) board.place(Position.at(m.from().row(), 0), board.remove(Position.at(m.from().row(), 3)));\n        if (m.captured() != null) board.place(m.capturedAt(), m.captured());\n        board.setEnPassantTarget(u.enPassantBefore());\n        board.setRights(u.rightsBefore());\n        board.setHalfmoveClock(u.halfmoveBefore());\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>5 &middot; The board highlights legal squares on every click, and the search asks a hundred thousand times a second. Make &quot;is my king in check&quot; cheap.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two things, neither of them a new data structure. First, finding the king is a two-slot cache the board writes whenever a king is placed, so it is one array read instead of a sixty-four-square hunt done once per candidate move. Second, the attack question is asked from the king's square <i>outward</i>: walk the eight rays until the first piece and ask that piece what it can do, then check the eight knight offsets. At most sixty-four array reads whatever is on the board, usually about thirty, because a ray stops at the first piece it meets &mdash; against roughly eighteen hundred for the obvious version that scans all sixty-four squares and enumerates every enemy piece's attacks. And the legal set itself is generated once per ply and remembered, so a hundred clicks on the board cost one generation.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Is `target` attacked by any piece of colour `by`? Asked from the king&#x27;s square, so it walks OUTWARD:\n     * eight rays until the first piece, plus the eight knight offsets. At most 64 array reads whatever is on\n     * the board, and usually about thirty, because a ray stops at the first piece it meets.\n     *\n     * It asks each piece it finds what it CAN DO, never what it is, so a new kind of piece that rides straight\n     * lines or hops like a knight is detected here with no edit at all.\n     */\n    boolean isAttacked(Position target, Color by) {\n        for (int[] d : RAYS) {\n            boolean straight = d[0] == 0 || d[1] == 0;\n            for (int step = 1; ; step++) {\n                int r = target.row() + d[0] * step, c = target.col() + d[1] * step;\n                if (!Position.onBoard(r, c)) break;\n                Piece p = squares[r * 8 + c];\n                if (p == null) continue;\n                if (p.color == by) {\n                    if (straight ? p.ridesStraight() : p.ridesDiagonal()) return true;\n                    if (step == 1 &amp;&amp; p.stepsOne()) return true;                       // an enemy king next door\n                    // a pawn attacks FORWARD only, so it must be standing one row behind the target\n                    if (step == 1 &amp;&amp; !straight &amp;&amp; p.attacksPawnwise() &amp;&amp; d[0] == -by.forward()) return true;\n                }\n                break;                                                                // the ray is blocked either way\n            }\n        }\n        for (int[] j : KNIGHT_OFFSETS) {\n            int r = target.row() + j[0], c = target.col() + j[1];\n            if (!Position.onBoard(r, c)) continue;\n            Piece p = squares[r * 8 + c];\n            if (p != null &amp;&amp; p.color == by &amp;&amp; p.hopsKnight()) return true;\n        }\n        return false;\n    }\n    /** Is this side&#x27;s king attacked right now? The whole invariant, in one line. */\n    boolean inCheck(Color c) { return isAttacked(kingOf(c), c.opponent()); }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>6 &middot; Support draw by threefold repetition and the fifty-move rule.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Neither is a rule about the position, so neither belongs in the engine: both are facts about the history, and both go in a wrapper. <code>DrawRules</code> takes any rule set, asks it first, and if it has not already ended the game returns DRAW when the fifty-move clock is full or the current position has now been reached three times. The clock is a counter on the board that a pawn move or a capture resets. The repetition count is a map from a position key &mdash; the pieces, the side to move, the castling rights and the en passant square, but not the clocks &mdash; to how many times it has been reached, updated inside the same critical section as the move so the count and the position can never disagree. Insufficient material stacks on top as a second wrapper that knows nothing about the first. The thresholds are constructor parameters, which is why the test is six plies long instead of a hundred moves.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">class DrawRules implements RuleSet {\n    private final RuleSet base;\n    private final int halfmoveLimit, repetitionLimit;\n\n    /** Standard chess: a draw at 100 plies without a pawn move or capture, and at the third repetition. */\n    DrawRules(RuleSet base) { this(base, 100, 3); }\n    DrawRules(RuleSet base, int halfmoveLimit, int repetitionLimit) {\n        this.base = base; this.halfmoveLimit = halfmoveLimit; this.repetitionLimit = repetitionLimit;\n    }\n    public GameStatus adjudicate(Game game, boolean inCheck, boolean anyLegalMove) {\n        GameStatus decided = base.adjudicate(game, inCheck, anyLegalMove);\n        if (decided.over()) return decided;                                // checkmate beats every draw rule\n        if (game.halfmoveClock() &gt;= halfmoveLimit) return GameStatus.DRAW;\n        if (game.timesRepeated() &gt;= repetitionLimit) return GameStatus.DRAW;\n        return decided;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>7 &middot; Castling, en passant and promotion -- the three that everybody gets wrong. Where does each live, and why there?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Castling is generated in the rules layer, not in the King, because it is the one move whose legality depends on squares being attacked and no piece can see the whole board: five conditions, the right still held, the rook still there, the squares between empty, and the king neither in check nor passing through an attacked square (landing on one is caught by the ordinary filter). Its second half is in <code>applyMove</code>, which moves the rook too. En passant lives in the Pawn, and its trick is that the victim is <i>not</i> on the square the pawn lands on, so the move records a separate capture square; the target square itself is rewritten on every single ply, because that is exactly how long the chance lives. Promotion fans out into four moves at generation time rather than one move plus an assumption, so under-promotion to a knight is offered and promoting to a king is refused by construction: it is simply not in the set.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Castling is generated here and not in King, because it is the one move whose legality depends on squares\n     * being attacked, and no piece can see the whole board. Five conditions: the right is still held, the rook\n     * is still there, the squares between are empty, and the king is not in check, does not pass through an\n     * attacked square, and does not land on one (the last is left to the ordinary filter).\n     */\n    private void addCastles(List&lt;Move&gt; out) {\n        int row = toMove == Color.WHITE ? 0 : 7;\n        Position kingSquare = Position.at(row, 4);\n        Piece king = board.at(kingSquare);\n        if (king == null || !king.isKing() || king.color != toMove) return;\n        if (board.isAttacked(kingSquare, toMove.opponent())) return;     // you may not castle out of check\n        if (board.mayCastle(toMove, true) &amp;&amp; rookAt(row, 7)\n                &amp;&amp; board.at(row, 5) == null &amp;&amp; board.at(row, 6) == null\n                &amp;&amp; !board.isAttacked(Position.at(row, 5), toMove.opponent()))\n            out.add(Move.castle(kingSquare, Position.at(row, 6), king, true));\n        if (board.mayCastle(toMove, false) &amp;&amp; rookAt(row, 0)\n                &amp;&amp; board.at(row, 1) == null &amp;&amp; board.at(row, 2) == null &amp;&amp; board.at(row, 3) == null\n                &amp;&amp; !board.isAttacked(Position.at(row, 3), toMove.opponent()))\n            out.add(Move.castle(kingSquare, Position.at(row, 2), king, false));\n    }\n    private boolean rookAt(int row, int col) {\n        Piece p = board.at(row, col);\n        return p != null &amp;&amp; p.color == toMove &amp;&amp; p.ridesStraight() &amp;&amp; !p.ridesDiagonal();\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Add an engine that plays the black pieces.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The move generator already exists: <code>legalMoves</code> is exactly what a search needs, so the engine only consumes the rules layer and nothing in the board or the pieces changes. An Evaluator scores a position, a Player chooses a move, and alpha-beta minimax plays a move, recurses, and takes it back &mdash; the same apply-ask-undo the legality filter already does, so the engine is fast for exactly the reason the filter is correct. The one thing worth saying out loud: the search runs on a private copy of the game made from its FEN, because playing thousands of moves on the live game would tell every spectator about moves nobody made, and would put a search's worth of work inside the game's lock.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: an AI opponent -- legalMoves() IS the move generator, so a search only has to consume it\n/** What a position is worth to one side. The one thing an engine&#x27;s strength actually comes from. */\ninterface Evaluator { int score(Board board, Color side); }\n\n/** The crudest honest evaluator: material only, in centipawns. Good enough to stop hanging a queen. */\nclass MaterialEvaluator implements Evaluator {\n    private static int value(char letter) {\n        return switch (Character.toUpperCase(letter)) {\n            case &#x27;P&#x27; -&gt; 100; case &#x27;N&#x27; -&gt; 320; case &#x27;B&#x27; -&gt; 330;\n            case &#x27;R&#x27; -&gt; 500; case &#x27;Q&#x27; -&gt; 900; case &#x27;C&#x27; -&gt; 850; default -&gt; 0;\n        };\n    }\n    public int score(Board board, Color side) {\n        int total = 0;\n        for (int r = 0; r &lt; 8; r++)\n            for (int c = 0; c &lt; 8; c++) {\n                Piece p = board.at(r, c);\n                if (p != null) total += (p.color == side ? 1 : -1) * value(p.symbol());\n            }\n        return total;\n    }\n}\n\n/** Whoever decides a move: a human at a screen, a random mover, a search. Handed to the loop, never built by it. */\ninterface Player { Move choose(Game game); }\n\n/** A legal move at random. Useful as the opponent in a test, and as the floor a real engine must beat. */\nclass RandomPlayer implements Player {\n    private final Random random;\n    RandomPlayer(long seed) { random = new Random(seed); }\n    public Move choose(Game game) { List&lt;Move&gt; legal = game.legalMoves(); return legal.get(random.nextInt(legal.size())); }\n}\n\n/**\n * Alpha-beta minimax over the rules layer. It never touches the pieces or the board directly: it plays a move,\n * asks for the score, and takes it back -- exactly what the legality filter already does. It searches on a COPY\n * made from the FEN, so no spectator ever sees the moves the engine is only thinking about

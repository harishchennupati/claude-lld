<div class="top"><h1>Chess</h1><span class="sub">LLD &middot; Java &middot; OpenJDK 21: demo, 10 failure tests, perft to 197281 and a 50-thread race pass</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design a chess game. Two players, a real board, real rules &mdash; castling, en passant, promotion &mdash; and after every move it must tell me whether that was check, checkmate or stalemate. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>Two people take turns moving pieces on an eight by eight board. The system exists to answer one question: <i>is this move legal?</i> And that question splits in two. Part of it is local to the piece &mdash; a bishop rides diagonals, a knight jumps, a pawn is a menagerie of special cases &mdash; and part of it is global: however correct the geometry, you may never play a move that leaves your own king under attack. Three moves break the simple picture: castling moves two pieces at once, en passant captures a pawn that is not on the square you land on, and a pawn reaching the last rank turns into something else. After every move the system must say what just happened: nothing, check, checkmate, stalemate, or a draw. The invariant that everything else hangs off is this: after a legal move, the mover's own king is not attacked, and after a refused move the position is exactly what it was.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile, with a <code>main</code> that plays a real game and prints a checkmate. The interviewer watches, in this order: the questions you ask before typing (full rules or just geometry, and which draw rules, are the first two); which class owns the board; how you split geometry from king safety, because that split is the whole design; how you test a move for safety without corrupting the board; what happens when two requests arrive for the same game; where the rules that change live, so a variant is a class and not an edit; and what a refused move leaves behind. Then the twists: a made-up piece, an engine, notation, clocks, draws, and putting it on a server.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">play a move</text><g transform=\"translate(175 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a client names from and to</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">e2 to e4, plus what to promote to</text></g><path d=\"M415 57 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">generate every legal move</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">geometry first, king safety second</text></g><path d=\"M675 57 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">it is in the set: apply it</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">board, rights, en passant, clock</text></g><path d=\"M935 57 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">flip the turn, judge it</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">ACTIVE / CHECK / MATE / STALEMATE</text></g><text x=\"88\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">take it back</text><g transform=\"translate(175 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">pop the last undo record</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the history is a stack of them</text></g><path d=\"M415 192 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">put the captured piece back</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">on the square it actually stood on</text></g><path d=\"M675 192 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">restore rights, e.p., clock</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the undo record carries all three</text></g><path d=\"M935 192 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the position is identical</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the same FEN, to the character</text></g><path d=\"M555 84 V95\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(360 95)\"><rect width=\"390\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"195.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refused: the board is untouched</text></g><text x=\"88\" y=\"266\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"266\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, without replaying the game: what are my legal moves?  is my king in check?  is it over, and how?</text><text x=\"615\" y=\"303\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">two requests for one game at the same instant -- a double click, a retry, a second tab -- and exactly one move may land</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Full rules &mdash; castling, en passant, promotion, checkmate &mdash; or just piece geometry?</td><td>Full rules, plus checkmate and stalemate</td><td>Whether a move is a from/to pair or a typed object that carries its own undo (moves 1, 6)</td></tr><tr><td>Which draw rules: repetition, fifty moves, insufficient material?</td><td>Out of the base engine, added by a wrapper</td><td>The ending rules become a one-method interface, and each draw is a decorator (move 3)</td></tr><tr><td>Two humans, or must an engine search over the same code?</td><td>Both; the engine only consumes the rules</td><td>Legal-move generation is public API, and a search runs on a copy (moves 2, 12)</td></tr><tr><td>How do moves arrive &mdash; coordinates, or \"Nf3\" and \"O-O\"?</td><td>Coordinates; notation is a follow-up</td><td>Notation sits above the rules and never inside them (move 12)</td></tr><tr><td>Takeback, and a full history?</td><td>Yes, and the history is needed for the draw rules anyway</td><td>A move carries what it destroyed, so undo is exact (move 6)</td></tr><tr><td>One process and two people at one screen, or a server with two phones?</td><td>One process now; name what changes on a server</td><td>One lock per game now; a ply compare-and-set later (moves 4, 12)</td></tr><tr><td>Clocks and time controls?</td><td>Out of scope, named</td><td>Time is injected and a clock is a listener, not a rule (moves 3, 12)</td></tr><tr><td>How fast must legality be?</td><td>Human speed: a move every few seconds</td><td>Simulate and take back, not incremental attack maps (move 8)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Set up a game, from the opening position or from a FEN string.</li>\n<li>All six pieces' movement, including the three that everyone gets wrong: castling, en passant, promotion.</li>\n<li>Enumerate every legal move for the side to move &mdash; what a board highlights and what an engine searches.</li>\n<li>Play a chosen move, or refuse it; a refused move must change nothing at all.</li>\n<li>After every move, say what the position is: ongoing, check, checkmate, stalemate, draw.</li>\n<li>Take back the last move exactly, including the captured piece and the castling rights it destroyed.</li>\n<li>Keep the move history: it is the takeback stack, the save format, and what the draw rules read.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Two requests for one game must never both land: exactly one move per turn, always.</li>\n<li>Bounded, not searched: \"is this square attacked\" is at most 64 array reads, and the king is found in O(1).</li>\n<li>One generation of the legal set per ply, however many times the screen asks for it.</li>\n<li>Which rules apply &mdash; draws, variants &mdash; is swappable without touching the board or the pieces.</li>\n<li>A new kind of piece must not touch the board, the game, or check detection.</li>\n<li>Nothing half-done: a refused move leaves the position byte-identical, and the caller can simply retry.</li>\n<li>In memory, one process, no persistence (say it; a follow-up adds it).</li></ul></div></div>\n<div class=\"move\"><h3>One game, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"187\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M187 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(45 60)\"><rect width=\"285\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"142.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">19:04:11  white plays e2-e4</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">20 legal moves, e2-e4 is one of them</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the lock is held about 12 microseconds</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">en passant square e3, alive for one ply</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">clock: white 172s, black 180s</text></g><circle cx=\"482\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M482 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(340 60)\"><rect width=\"285\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"142.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">19:04:41  black plays Nb8-c6</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the en passant square is gone again</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">nothing captured: the quiet clock reads 1</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the spectators hear after the unlock</text></g><circle cx=\"777\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M777 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(635 60)\"><rect width=\"285\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"142.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">19:07:02  a double click: Bf1-c4 twice</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">both requests wait on the one game lock</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the first lands and flips the turn</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the second asks: is Bf1-c4 legal now?</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">no -- it is Black's turn. Refused.</text></g><circle cx=\"1072\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1072 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"285\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"142.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">19:23:50  white plays Qh5xf7</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">black has zero legal moves</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">and his king is attacked -> CHECKMATE</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">without the check the same position</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">would be STALEMATE: one primitive</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> full movement rules including the three special moves; checkmate and stalemate from one primitive; moves arrive as coordinates; the position is held in memory in one process, one lock per game. Named as out of scope: draw by repetition and the fifty-move rule, notation, clocks, an engine, persistence &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, elevator, Splitwise) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On chess the moves earn their keep at move 2, because the one thing that makes this problem hard -- that legality is half local to a piece and half global to the board -- is exactly what asking \"which class owns the state this verb touches\" tells you.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 225\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two PLAYERS take turns moving a PIECE from one SQUARE to another on a BOARD; the GAME says whose turn it is, whether a MOVE is legal, and whether it is over</text><g transform=\"translate(25 110)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Game</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">turn, history, status</text></g><path d=\"M107.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(205 110)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Board</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">64 squares + 3 facts</text></g><path d=\"M287.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(385 110)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Move</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what happened + its undo</text></g><path d=\"M467.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(565 110)\"><rect width=\"170\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"85.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Piece</text><text x=\"85.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">geometry: NO state</text></g><path d=\"M650.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(750 110)\"><rect width=\"155\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"77.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Position</text><text x=\"77.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two ints: a value</text></g><path d=\"M827.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(920 110)\"><rect width=\"145\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"72.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Player</text><text x=\"72.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a caller</text></g><path d=\"M992.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1080 110)\"><rect width=\"130\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"65.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Status</text><text x=\"65.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a question</text></g><path d=\"M1145.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a value, a caller, or a question answered from state that is already there</text><text x=\"615\" y=\"210\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the decision that pays for itself all page: a piece holds nothing -- no square, no \"has moved\" flag -- so twelve piece objects serve every game in the process</text></svg></div><div class=\"move\"><p>The picture is that sentence with its nouns underlined, and the boxes are the answer. Two of them are worth arguing about. A <b>board</b> is not just sixty-four squares: it also holds the three facts a naive design forgets &mdash; who may still castle, which square is capturable en passant, and how many quiet plies have passed &mdash; because every one of them changes with a move and has to be put back by a takeback. And a <b>piece holds no state at all</b>: not its square, not a \"has moved\" flag. Castling rights live on the board, where move generation can see them anyway. That single decision pays for itself all page: twelve piece objects serve every game in the process, and a takeback can never leave a piece half-restored, because there is nothing on a piece to restore.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 284\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"190\" y=\"21\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the verb</text><text x=\"615\" y=\"21\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the class that owns the state it touches</text><text x=\"1037\" y=\"21\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">so it gets the method</text><g transform=\"translate(25 32)\"><rect width=\"330\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which squares could I reach?</text></g><path d=\"M355 52 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 32)\"><rect width=\"390\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"195.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Piece  (owns geometry, no state)</text></g><path d=\"M810 52 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 32)\"><rect width=\"335\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"167.5\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">piece.pseudoMoves(board, from, out)</text></g><g transform=\"translate(25 82)\"><rect width=\"330\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is this square attacked?</text></g><path d=\"M355 102 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 82)\"><rect width=\"390\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"195.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Board  (owns the 64 squares)</text></g><path d=\"M810 102 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 82)\"><rect width=\"335\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"167.5\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">board.isAttacked(square, by)</text></g><g transform=\"translate(25 132)\"><rect width=\"330\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which of those are actually legal?</text></g><path d=\"M355 152 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"390\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"195.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Game  (owns the board AND the turn)</text></g><path d=\"M810 152 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 132)\"><rect width=\"335\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"167.5\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">game.legalMoves()</text></g><g transform=\"translate(25 182)\"><rect width=\"330\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">play this one / take it back</text></g><path d=\"M355 202 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 182)\"><rect width=\"390\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"195.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Game  (owns the history and the lock)</text></g><path d=\"M810 202 H870\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(870 182)\"><rect width=\"335\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"167.5\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">game.play(move) / game.undo()</text></g><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the whole design is in row 1 against row 3: a bishop knows it rides diagonals, but no piece can see whether the move exposes its own king,</text><text x=\"615\" y=\"269\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">so the piece produces PSEUDO-legal moves and the layer that owns the whole board filters them. Geometry below, king safety above.</text></svg></div><div class=\"move\"><p>Read the first row against the third, because that pair is the whole design. A bishop knows perfectly well that it rides diagonals, and it cannot possibly know whether riding one exposes its own king &mdash; no piece can see the whole board. So a piece produces <i>pseudo-legal</i> moves, geometry only, and the layer that owns the whole board filters them for king safety. Geometry below, king safety above. Every hard thing in chess &mdash; check, checkmate, pins, castling through an attacked square &mdash; falls out of that one line, and blurring it is the most common way a chess design collapses at minute forty.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 301\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"962\" y=\"20\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the classes that can be handed in</text><g transform=\"translate(25 62)\"><rect width=\"215\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"107.5\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Game</text><text x=\"107.5\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(rules); setClock(c)</text></g><path d=\"M240 107 H310 V52 H370\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(370 30)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RuleSet</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">when, and how, is it over?</text></g><g transform=\"translate(720 30)\"><rect width=\"485\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"242.5\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">StandardRules / DrawRules(base) / a variant</text></g><path d=\"M720 52 H660\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M240 107 H310 V108 H370\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(370 86)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">GameObserver</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who is told a move happened</text></g><g transform=\"translate(720 86)\"><rect width=\"485\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"242.5\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a spectator, the PGN writer, the chess clock</text></g><path d=\"M720 108 H660\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M240 107 H310 V164 H370\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(370 142)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where the time comes from</text></g><g transform=\"translate(720 142)\"><rect width=\"485\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"242.5\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::currentTimeMillis, or a test's fixed instant</text></g><path d=\"M720 164 H660\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(25 198)\"><rect width=\"215\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"107.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">whoever drives the game</text><text x=\"107.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">your main, or the match service</text></g><path d=\"M240 220 H370\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(370 198)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Player</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who decides the next move</text></g><g transform=\"translate(720 198)\"><rect width=\"485\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"242.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RandomPlayer / MinimaxPlayer</text><text x=\"242.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">Extensions.java: the engine on page 05</text></g><path d=\"M720 220 H660\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The game is handed the first three and never builds one; Player is held by the caller, because the game does not ask for moves.</text><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">One rule wraps the others: DrawRules(StandardRules) adds repetition and the fifty-move rule to ANY rule set, including one written next year.</text></svg></div><div class=\"move\"><p>Which endings count will change: checkmate and stalemate today, the fifty-move rule and threefold repetition the moment they ask, insufficient material after that, a variant if they are feeling playful. Who decides a move will change: a human today, a random mover in a test, an alpha-beta search by the end of the hour. Who is told will change: a spectator today, a move list, a clock, a rating update. And where time comes from must change, or a clock cannot be tested. Each becomes a one-method interface that nobody inside the game builds: three are handed to the game itself, in <code>configure()</code> and <code>setClock()</code>, and the fourth, <code>Player</code>, is held by whoever drives the game &mdash; your <code>main</code>, or the match service &mdash; because the game never asks anyone for a move, it is told one. This is where the patterns come from, not the other way round: a swappable rule behind an interface is <b>Strategy</b>; a rule that wraps another rule and adds to it is <b>Decorator</b>, and here it is the one that matters &mdash; <code>DrawRules(StandardRules)</code> adds repetition and the fifty-move rule to <i>any</i> rule set, so the same wrapper works over ordinary chess and over a variant written next year, and you can stack insufficient material on top without either knowing the other exists. A game that announces \"a move landed\" without knowing what a websocket is, is <b>Observer</b>. I do them; I do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 28)\"><rect width=\"205\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"102.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the browser tab</text><text x=\"102.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads: white to move</text></g><g transform=\"translate(25 112)\"><rect width=\"205\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"102.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the double click</text><text x=\"102.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads: white to move</text></g><g transform=\"translate(330 70)\"><rect width=\"195\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the game</text><text x=\"97.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">white to move</text></g><path d=\"M230 51 H330 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M230 135 H330 V116\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"280\" y=\"40\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"280\" y=\"168\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"565\" y=\"18\" width=\"300\" height=\"150\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"715\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"715\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both validate against the same board,</text><text x=\"715\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both apply: White moves twice in a row</text><text x=\"715\" y=\"118\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">chess is turn-based, so the race is never</text><text x=\"715\" y=\"138\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">two players -- it is two REQUESTS</text><g transform=\"translate(900 45)\"><rect width=\"305\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"152.5\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Game.lock</text><text x=\"152.5\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">validate and apply = one step</text></g><text x=\"1052\" y=\"172\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock lives where the board lives: one per GAME,</text><text x=\"1052\" y=\"191\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">so a hundred thousand games never wait for each other</text></svg></div><div class=\"move\"><p>Say out loud first that chess is turn-based, so the race is <i>never</i> two players &mdash; it is two <b>requests</b> for the same player. Both read \"White to move\", both generate the same legal set, both find their move in it, and both apply: White has now moved twice in a row and the board is quietly, permanently wrong. So validating and applying must be one step, in the class that owns the board and the turn: the game. The lock is per <i>game</i>, not per server, which is the whole trick &mdash; a hundred thousand live games take a hundred thousand different locks and never wait for each other. Anything that only listens (the websocket, the database write) is called after the lock is released, inside a try/catch, so a broken spectator cannot break chess.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers without searching.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 358\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 16)\"><rect width=\"355\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is standing on e4?</text></g><path d=\"M380 34 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 16)\"><rect width=\"510\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"255.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Piece[64], indexed row*8 + col</text></g><path d=\"M945 34 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 16)\"><rect width=\"205\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"102.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(25 58)\"><rect width=\"355\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">where is the king I must protect?</text></g><path d=\"M380 76 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 58)\"><rect width=\"510\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"255.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Position[2], written by board.place()</text></g><path d=\"M945 76 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 58)\"><rect width=\"205\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"102.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), never a scan</text></g><g transform=\"translate(25 100)\"><rect width=\"355\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is this square attacked?</text></g><path d=\"M380 118 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 100)\"><rect width=\"510\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"255.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">walk 8 rays out + 8 knight offsets</text></g><path d=\"M945 118 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 100)\"><rect width=\"205\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"102.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">&le; 64 reads, ~30 typical</text></g><g transform=\"translate(25 142)\"><rect width=\"355\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">may he still castle, on which side?</text></g><path d=\"M380 160 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 142)\"><rect width=\"510\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"255.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">boolean[4] on the board</text></g><path d=\"M945 160 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 142)\"><rect width=\"205\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"102.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(25 184)\"><rect width=\"355\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">can a pawn take en passant?</text></g><path d=\"M380 202 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 184)\"><rect width=\"510\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"255.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one square, rewritten every single ply</text></g><path d=\"M945 202 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 184)\"><rect width=\"205\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"102.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(25 226)\"><rect width=\"355\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">has this position happened three times?</text></g><path d=\"M380 244 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 226)\"><rect width=\"510\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"255.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;position key, count&gt;</text></g><path d=\"M945 244 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 226)\"><rect width=\"205\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"102.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) per ply</text></g><g transform=\"translate(25 268)\"><rect width=\"355\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what was the last move, and undo it</text></g><path d=\"M380 286 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 268)\"><rect width=\"510\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"255.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ArrayDeque&lt;Undo&gt;</text></g><path d=\"M945 286 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 268)\"><rect width=\"205\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"102.5\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) push and pop</text></g><text x=\"615\" y=\"326\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">nothing here searches. The one query the whole engine leans on -- is this square attacked -- is asked from the king's square OUTWARD,</text><text x=\"615\" y=\"345\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">so a ray stops at the first piece it meets, and the answer costs at most sixty-four array reads whatever is on the board.</text></svg></div><div class=\"move\"><p>Two rows are decisions, not data structures. \"May he still castle?\" is four booleans <i>on the board</i>, not a flag on a rook &mdash; which is also why a rook captured on its own corner correctly kills that right, with no special case written anywhere. \"Can a pawn take en passant?\" is a single square, rewritten on <i>every</i> ply, because that is exactly how long the chance lives; forgetting to clear it is the classic en passant bug. Then the query the whole engine leans on, \"is this square attacked?\", which is asked from the king's square <b>outward</b>: walk the eight rays until the first piece and ask it what it can do, then the eight knight offsets. At most sixty-four array reads whatever is on the board, usually about thirty, because a ray stops at the first piece it meets &mdash; against roughly eighteen hundred for the obvious version that scans all sixty-four squares and enumerates every enemy piece's attacks. And it asks each piece what it <i>can do</i>, never what it <i>is</i>, which is why a made-up piece that rides straight lines is detected here with no edit at all.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 338\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 30)\"><rect width=\"175\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ACTIVE</text><text x=\"87.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">moves accepted</text></g><g transform=\"translate(255 30)\"><rect width=\"175\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CHECK</text><text x=\"87.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">moves accepted</text></g><g transform=\"translate(25 112)\"><rect width=\"175\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CHECKMATE</text><text x=\"87.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">terminal</text></g><g transform=\"translate(175 178)\"><rect width=\"175\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">STALEMATE</text><text x=\"87.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">terminal</text></g><g transform=\"translate(325 112)\"><rect width=\"175\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DRAW</text><text x=\"87.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">terminal</text></g><path d=\"M200 43 H255\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M255 62 H200\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M112 72 V112\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M300 72 V178\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M412 72 V112\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"285\" y=\"264\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no legal move + in check = CHECKMATE.   no legal move, not in check = STALEMATE.</text><text x=\"285\" y=\"283\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one primitive, two endings, so the two can never drift apart.</text><text x=\"285\" y=\"306\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">every arrow is one ply, and a status always describes the side about to move:</text><text x=\"285\" y=\"324\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">ACTIVE -> CHECKMATE is White, not in check, playing the move that mates Black.</text><rect x=\"560\" y=\"20\" width=\"650\" height=\"222\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"885\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside play(), and why it is this order</text><text x=\"575\" y=\"68\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1  refuse outright if the game is already over</text><text x=\"575\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2  generate the legal set HERE: a screen that offers legal moves is a convenience, not a rule</text><text x=\"575\" y=\"112\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3  only now edit the board, and push the record that can undo that edit</text><text x=\"575\" y=\"134\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4  flip the turn, re-judge the position: the parts a caller can observe change last</text><text x=\"575\" y=\"156\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5  release the lock, and only then tell the spectators</text><text x=\"575\" y=\"178\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the board edit at step 3 is the one thing that happens before the game is committed,</text><text x=\"575\" y=\"200\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">and it is the one edit we know how to take back exactly. So a refusal at step 1 or 2</text><text x=\"575\" y=\"222\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">leaves the board, the turn and the history untouched, and the caller can simply retry.</text></svg></div><div class=\"move\"><p>ACTIVE and CHECK both still accept moves; CHECKMATE, STALEMATE and DRAW are terminal and refuse everything. Write that down and the classic bug disappears: checkmate and stalemate are not two detectors that will drift apart, they are one condition &mdash; \"the side to move has no legal move\" &mdash; split by whether that side is in check. The panel on the right is the order inside <code>play</code>, which is the part the interviewer is really asking about, and its reason is one sentence: the board edit at step 3 is the only thing that happens before the game is committed, and it is the one edit we know how to take back exactly. Which is also why generating the legal set is safe at all &mdash; it plays each candidate on the real board, asks whether the king is now attacked, and takes it back. The same mechanism as a takeback, which is why it is the best-tested code in the file.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one game's moves happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 20)\"><rect width=\"555\" height=\"126\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"277.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about 12 microseconds, measured</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">generate ~35 candidate moves from the geometry</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">for each: apply it, ask if my king is attacked, take it back</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one attack question is at most 64 array reads</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">apply the winner, push the undo record, flip the turn</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">judge the new position (which reuses that generation)</text></g><path d=\"M580 83 H645\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"612\" y=\"73\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(645 20)\"><rect width=\"560\" height=\"126\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: milliseconds to minutes</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the spectator's websocket frame: about 1 millisecond</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">writing the move to a database: about 5 milliseconds</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">an engine searching for its reply: 100 ms and up</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the human staring at the board: three seconds, or three days</text></g><text x=\"615\" y=\"176\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">eight clients press at the same instant (a double click, a retry, two tabs, a reconnect)</text><g transform=\"translate(25 190)\"><rect width=\"136\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">request 1</text><text x=\"68.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(173 190)\"><rect width=\"136\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">request 2</text><text x=\"68.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 12 us</text></g><g transform=\"translate(321 190)\"><rect width=\"136\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">request 3</text><text x=\"68.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 24 us</text></g><g transform=\"translate(469 190)\"><rect width=\"136\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">request 4</text><text x=\"68.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 36 us</text></g><g transform=\"translate(617 190)\"><rect width=\"136\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">request 5</text><text x=\"68.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 48 us</text></g><g transform=\"translate(765 190)\"><rect width=\"136\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">request 6</text><text x=\"68.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 60 us</text></g><g transform=\"translate(913 190)\"><rect width=\"136\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">request 7</text><text x=\"68.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 72 us</text></g><g transform=\"translate(1061 190)\"><rect width=\"136\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">request 8</text><text x=\"68.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 84 us</text></g><text x=\"615\" y=\"258\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the eighth waits eighty-four microseconds for the lock -- and then is refused in a microsecond, because by then it is Black's turn</text><text x=\"615\" y=\"277\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and its move is a White move, which is not in the legal set. One at a time is true, and at these numbers nobody can tell.</text></svg></div><div class=\"move\"><p>The picture lists what is inside; the number is the answer. <code>Main</code> plays fifteen hundred plies of random games and times them: about twelve microseconds for the whole of generate, filter, commit, re-judge. Everything slow is outside &mdash; the websocket frame, the database write, an engine's hundred milliseconds, a human's three seconds &mdash; because the lock is released before any of them is called. So when eight requests land at the same instant the eighth waits about eighty-four microseconds, and is then refused in one more, because by then it is Black's turn and the White move it is holding is not in the legal set. Waiting is not the cost worth worrying about here; being wrong about whose turn it is would be.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"190\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per game: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a whole play(): about 12 microseconds, measured in Main</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">blitz is a move every three seconds, per player</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">so one game's lock is busy 12 us in every 3,000,000 us</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">that is four ten-thousandths of one per cent</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">100,000 live games = 33,000 moves a second = 0.4 of one core</text><text x=\"35\" y=\"186\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">and no two games ever contend, because the lock is per game</text><text x=\"895\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"605\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"302.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1  generate the legal set once per ply</text><text x=\"302.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: the status check and the next move share it</text></g><g transform=\"translate(600 110)\"><rect width=\"605\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"302.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2  only test moves that CAN be illegal</text><text x=\"302.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">find the pins once; king moves and evasions; ~10x fewer checks</text></g><g transform=\"translate(600 162)\"><rect width=\"605\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"302.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3  bitboards: the position as twelve longs</text><text x=\"302.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a rook's attacks become one table lookup. Stockfish. ~100x</text></g><text x=\"615\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">say the arithmetic first. Rung 3 is the famous answer and the wrong one here: two humans move every three seconds, and a hundredfold</text><text x=\"615\" y=\"251\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">speed-up on a lock that is idle 99.9996% of the time buys nothing. Rung 3 is for an engine searching millions of positions, and you say so.</text></svg></div><div class=\"move\"><p>Twelve microseconds of lock against blitz, which is a move every three seconds: one game's lock is busy twelve microseconds in every three million, four ten-thousandths of one per cent. A hundred thousand live games is thirty-three thousand moves a second, four tenths of one core, and no two games ever contend because the lock is per game. That arithmetic, not the ladder, is the answer to \"does one lock scale\". The ladder is what you say next. Rung one is already in this code. Rung two is the only real algorithmic win, and it is worth knowing why it works: a move can be illegal for exactly three reasons &mdash; the piece is pinned to its king, the king itself is walking, or you are already in check &mdash; so find the pins once by walking eight rays out from the king, and the other thirty moves are legal by construction rather than by test. About ten times fewer attack questions. Rung three, bitboards, is the famous answer and the wrong one here: a hundredfold speed-up on a lock that is idle 99.9996 per cent of the time buys nothing. It is for an engine searching millions of positions a second, and you say exactly that.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 346\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(25 16)\"><rect width=\"355\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a move that leaves my own king in check</text></g><path d=\"M380 33 H425\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(425 16)\"><rect width=\"780\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">apply it, ask, take it back; test 3: a pinned bishop has ZERO legal moves</text></g><g transform=\"translate(25 56)\"><rect width=\"355\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">mutating to simulate, and not putting it back</text></g><path d=\"M380 73 H425\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(425 56)\"><rect width=\"780\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">undo is the exact mirror; test 4: the FEN is identical after generating everything</text></g><g transform=\"translate(25 96)\"><rect width=\"355\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a pawn's forward move reused as its attack</text></g><path d=\"M380 113 H425\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(425 96)\"><rect width=\"780\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">attacks() and pseudoMoves() are separate; test 8: a pawn ahead of a king is no check</text></g><g transform=\"translate(25 136)\"><rect width=\"355\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">castling out of, through, or into check</text></g><path d=\"M380 153 H425\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(425 136)\"><rect width=\"780\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"390.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">five conditions, checked in the rules layer; test 5: f1 attacked, O-O refused</text></g><g transform=\"translate(25 176)\"><rect width=\"355\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"177.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">en passant claimed one ply too late</text></g><path d=\"M380 193 H425\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(425 176)\"><rect width=\"780\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke

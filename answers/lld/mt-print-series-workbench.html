es s = new Series(n, roles.size(), sink);\n        Condition[] w = new Condition[roles.size()];\n        for (int k = 0; k &lt; w.length; k++) w[k] = lock.newCondition();\n        waits = w;\n        Crew.Result r = Crew.race(roles.size(), k -&gt; roles.get(k).name(),\n                                  me -&gt; serve(s, roles, w, me), clock, deadlineMs, this::stop);\n        if (r.error != null)\n            throw new IllegalStateException(name() + &quot;: a role threw; the counter never moved&quot;, r.error);\n        if (!r.finished)\n            throw new IllegalStateException(name() + &quot;: the series did not finish in &quot; + deadlineMs + &quot; ms&quot;);\n        if (!stopped &amp;&amp; !s.done())\n            throw new IllegalStateException(name() + &quot;: the series stalled at i = &quot; + s.i);\n        return s.text();\n    }\n\n    /** Same loop as the monitor build; only the wake at the end is aimed instead of broadcast. */\n    private void serve(Series s, List&lt;Role&gt; roles, Condition[] w, int me) throws InterruptedException {\n        Role role = roles.get(me);\n        while (true) {\n            String token;\n            int at;\n            lock.lockInterruptibly();\n            try {\n                int n = 0;\n                while (!stopped &amp;&amp; !s.done() &amp;&amp; !role.ready(s)) { w[me].await(); n++; }\n                if (n &gt; 0) { wakeups.addAndGet(n); wasted.addAndGet(n - 1L); }\n                if (stopped || s.done()) { wakeAll(); return; }\n                try {\n                    token = role.act(s);\n                    s.emit(token);\n                    at = s.i;\n                } catch (RuntimeException e) { wakeAll(); throw e; }\n                handOff(s, roles, w);\n            } finally {\n                lock.unlock();\n            }\n            observers.publish(role.name(), token, at);\n        }\n    }\n\n    /**\n     * Wakes exactly the one role the last turn made ready. A signal sent to a role that is not asleep yet is simply\n     * dropped, and that is safe: it will re-check its guard under this same lock before it decides to wait.\n     */\n    private void handOff(Series s, List&lt;Role&gt; roles, Condition[] w) {\n        if (!s.done())\n            for (int k = 0; k &lt; roles.size(); k++)\n                if (roles.get(k).ready(s)) { w[k].signal(); return; }\n        wakeAll();                                          // the run is over: everybody has to be let go\n    }\n\n    /** Signals every per-role condition. Called only when the change concerns all of them: the end of the run, or stop(). */\n    private void wakeAll() {\n        for (Condition c : waits) c.signal();\n    }\n}\n\n/**\n * Build 3, ladder rung three: no lock at all. One Semaphore per role, all empty except the one whose guard holds at\n * the start. A thread touches the blackboard only while it holds its own permit, and hands the baton on by releasing\n * the permit of whichever role the new state made ready. release/acquire is a happens-before edge, so the counter\n * written by one thread is visible to the next without a single synchronized block.\n */\nfinal class SemaphorePrinter implements SeriesPrinter {\n    private final Observers observers = new Observers();\n    private final AtomicLong wakeups = new AtomicLong();\n    private Sink sink = Sink.NONE;\n    private Clock clock = System::currentTimeMillis;\n    private long deadlineMs = 10_000;\n    private volatile boolean stopped;\n    private volatile Semaphore[] batons = new Semaphore[0];\n\n    /** Same seams again: sink, clock, deadline. */\n    void configure(Sink sink, Clock clock, long deadlineMs) {\n        this.sink = sink; this.clock = clock; this.deadlineMs = deadlineMs;\n    }\n\n    /** Registers a listener; here there is no lock to be outside of, but it is still called after the hand-off. */\n    void addObserver(StepObserver o) { observers.add(o); }\n\n    public String name() { return &quot;semaphore baton, no lock&quot;; }\n    public long wakeups() { return wakeups.get(); }\n    /** Always zero: a thread is handed the baton only when its own guard is already true. */\n    public long wastedWakeups() { return 0; }\n\n    /** Sets the flag, then gives every role a permit so that nobody is left parked on an acquire. */\n    public void stop() {\n        stopped = true;\n        for (Semaphore b : batons) b.release();\n    }\n\n    public String run(int n, List&lt;Role&gt; roles) throws InterruptedException {\n        stopped = false;\n        wakeups.set(0);\n        Series s = new Series(n, roles.size(), sink);\n        Semaphore[] b = new Semaphore[roles.size()];\n        for (int k = 0; k &lt; b.length; k++) b[k] = new Semaphore(0);\n        batons = b;\n        for (int k = 0; k &lt; b.length; k++)                  // the first baton goes to whoever is ready on an untouched series\n            if (roles.get(k).ready(s)) { b[k].release(); break; }\n        Crew.Result r = Crew.race(roles.size(), k -&gt; roles.get(k).name(),\n                                  me -&gt; serve(s, roles, b, me), clock, deadlineMs, this::stop);\n        if (r.error != null)\n            throw new IllegalStateException(name() + &quot;: a role threw&quot;, r.error);\n        if (!r.finished)\n            throw new IllegalStateException(name() + &quot;: the series did not finish in &quot; + deadlineMs + &quot; ms&quot;);\n        if (!stopped &amp;&amp; !s.done())\n            throw new IllegalStateException(name() + &quot;: the series stalled at i = &quot; + s.i + &quot; -- no role was ready to take the baton&quot;);\n        return s.text();\n    }\n\n    /** Hold the baton, act, pass it on. There is no while loop here because there is nothing to re-check: the permit IS the turn. */\n    private void serve(Series s, List&lt;Role&gt; roles, Semaphore[] b, int me) throws InterruptedException {\n        Role role = roles.get(me);\n        while (true) {\n            if (!b[me].tryAcquire(deadlineMs, TimeUnit.MILLISECONDS)) return;    // a timed acquire, so a lost baton fails instead of hanging\n            wakeups.incrementAndGet();\n            if (stopped || s.done()) { releaseAll(b); return; }\n            String token = role.act(s);\n            s.emit(token);\n            int at = s.i;\n            int next = -1;\n            if (!s.done())\n                for (int k = 0; k &lt; roles.size(); k++)\n                    if (roles.get(k).ready(s)) { next = k; break; }\n            if (next &gt;= 0) b[next].release(); else releaseAll(b);\n            observers.publish(role.name(), token, at);\n        }\n    }\n\n    /** Ends the run for everybody: one permit each, so every thread wakes, sees the state, and leaves. */\n    private void releaseAll(Semaphore[] b) {\n        for (Semaphore x : b) x.release();\n    }\n}\n\n/** Counts every token by the role that emitted it, from outside the lock: the proof that each thread printed only its own. */\nfinal class RoleTally implements StepObserver {\n    private final Map&lt;String, Integer&gt; counts = new ConcurrentHashMap&lt;&gt;();\n\n    public void onStep(String role, String token, int at) { counts.merge(role, 1, Integer::sum); }\n\n    /** How many tokens this role emitted during the run. */\n    int of(String role) { return counts.getOrDefault(role, 0); }\n\n    /** Every role and its count, for printing. */\n    Map&lt;String, Integer&gt; all() { return new TreeMap&lt;&gt;(counts); }\n}\n\n/** The demo: the three series, the many-thread race, and the arithmetic behind the ladder on page 02. */\npublic class Main {\n    /** Runs each series once, then a race that proves the order holds, then measures the three builds against each other. */\n    public static void main(String[] args) throws Exception {\n        MonitorPrinter p = new MonitorPrinter();\n        RoleTally tally = new RoleTally();\n        p.addObserver(tally);\n\n        System.out.println(&quot;== the three classic series, one engine ==&quot;);\n        System.out.println(&quot;FooBar(3)        -&gt; &quot; + p.run(3, Roles.fooBar()) + &quot;        (want foobarfoobarfoobar)&quot;);\n        System.out.println(&quot;ZeroEvenOdd(5)   -&gt; &quot; + p.run(5, Roles.zeroEvenOdd()) + &quot;         (want 0102030405)&quot;);\n        System.out.println(&quot;FizzBuzz(15)     -&gt; &quot; + p.run(15, Roles.fizzBuzz()));\n        System.out.println(&quot;RoundRobin(4,12) -&gt; &quot; + p.run(12, Roles.roundRobin(4)));\n        System.out.println(&quot;tokens by role   -&gt; &quot; + tally.all());\n\n        System.out.println();\n        System.out.println(&quot;== the race: ten threads, one latch inside run(), 2000 numbers ==&quot;);\n        MonitorPrinter race = new MonitorPrinter();\n        RoleTally who = new RoleTally();\n        race.addObserver(who);\n        String got = race.run(2000, Roles.roundRobin(10));\n        StringBuilder want = new StringBuilder();\n        for (int i = 1; i &lt;= 2000; i++) want.append(i).append(&#x27; &#x27;);\n        System.out.println(&quot;2000 numbers, 10 threads, strict order? &quot; + got.equals(want.toString()));\n        System.out.println(&quot;each thread printed exactly its own 200:  &quot; + allEqual(who, 10, 200));\n        System.out.println(&quot;wakes &quot; + race.wakeups() + &quot;, of which wasted &quot; + race.wastedWakeups()\n                           + &quot; (&quot; + String.format(&quot;%.1f&quot;, race.wastedWakeups() / 2000.0) + &quot; per token with 10 threads)&quot;);\n\n        System.out.println();\n        System.out.println(&quot;== 300 runs of FooBar(120): byte-identical every time ==&quot;);\n        String base = p.run(120, Roles.fooBar());\n        boolean stable = true;\n        for (int r = 0; r &lt; 300; r++) if (!p.run(120, Roles.fooBar()).equals(base)) stable = false;\n        System.out.println(&quot;all 300 runs identical? &quot; + stable + &quot;   (&quot; + base.length() + &quot; characters each)&quot;);\n\n        System.out.println();\n        System.out.println(&quot;== the arithmetic: what one turn costs as the crowd grows (monitor build) ==&quot;);\n        System.out.printf(&quot;%-10s %16s %14s %22s%n&quot;, &quot;threads&quot;, &quot;ns per token&quot;, &quot;wakes/token&quot;, &quot;wasted wakes/token&quot;);\n        for (int k : new int[] { 1, 2, 3, 4, 10 }) {\n            MonitorPrinter m = new MonitorPrinter();\n            List&lt;Role&gt; rr = Roles.roundRobin(k);\n            m.run(2_000, rr);                                   // warm the JIT before the reading\n            long t0 = System.nanoTime();\n            m.run(50_000, rr);\n            long ns = System.nanoTime() - t0;\n            System.out.printf(&quot;%-10d %16.0f %14.2f %22.2f%n&quot;, k, ns / 50_000.0,\n                              m.wakeups() / 50_000.0, m.wastedWakeups() / 50_000.0);\n        }\n        System.out.println(&quot;one thread never waits: that row is the cost of the lock, the guard and the append alone.&quot;);\n\n        System.out.println();\n        System.out.println(&quot;== the ladder, measured: FizzBuzz(20000) with four threads ==&quot;);\n        List&lt;SeriesPrinter&gt; builds = List.of(new MonitorPrinter(), new ConditionPrinter(), new SemaphorePrinter());\n        String reference = null;\n        for (SeriesPrinter b : builds) {\n            long t0 = System.nanoTime();\n            String out = b.run(20_000, Roles.fizzBuzz());\n            long ns = System.nanoTime() - t0;\n            if (reference == null) reference = out;\n            System.out.printf(&quot;%-34s %7.0f ns/token   wakes %7d   wasted %7d   same output: %s%n&quot;,\n                              b.name(), ns / 20_000.0, b.wakeups(), b.wastedWakeups(), out.equals(reference));\n        }\n        System.out.println();\n        System.out.println(&quot;One token is one turn: a lock, a guard test, an append and a signal.&quot;);\n        System.out.println(&quot;Unsynchronised, the four threads would read a counter another thread is writing,&quot;);\n        System.out.println(&quot;so a number would be printed twice and another skipped. One lock makes the&quot;);\n        System.out.println(&quot;check and the act a single step, and the while loop absorbs every wrong wake-up.&quot;);\n    }\n\n    /** True when every one of the k round-robin roles emitted exactly the expected number of tokens. */\n    static boolean allEqual(RoleTally tally, int k, int each) {\n        for (int j = 0; j &lt; k; j++) if (tally.of(&quot;t&quot; + j) != each) return false;\n        return true;\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n// ---- ext: an audit trail, and not one line of the engine changes\n\n/**\n * Decorator over any Role: it records who emitted what and then delegates. The turn loop, the other roles and every\n * guard stay byte-for-byte the same; the call site changes by one line per role. Because act() runs with the\n * printer&#x27;s lock held, a plain ArrayList is enough for the trail: only one thread is inside it at a time.\n */\nfinal class AuditRole implements Role {\n    private final Role inner;\n    private final List&lt;String&gt; trail;\n\n    AuditRole(Role inner, List&lt;String&gt; trail) { this.inner = inner; this.trail = trail; }\n\n    public String name() { return inner.name(); }\n    public boolean ready(Series s) { return inner.ready(s); }\n\n    /** Notes the role and the token, then lets the wrapped rule do the real work. */\n    public String act(Series s) {\n        String token = inner.act(s);\n        trail.add(inner.name() + &quot;:&quot; + token);\n        return token;\n    }\n\n    /** Wraps every role in a list, so auditing a whole series is one call. */\n    static List&lt;Role&gt; wrap(List&lt;Role&gt; roles, List&lt;String&gt; trail) {\n        List&lt;Role&gt; out = new ArrayList&lt;&gt;();\n        for (Role r : roles) out.add(new AuditRole(r, trail));\n        return out;\n    }\n}\n\n// ---- ext: two more series -- a third alternating thread, and the H2O cousin\n\n/** Series the interviewer adds after the first three. Both are new guard sets and nothing else. */\nfinal class ExtraRoles {\n    private ExtraRoles() { }\n\n    /** &quot;Add a Baz thread&quot;: the boolean flag becomes a three-value phase, and baz closes the round instead of bar. */\n    static List&lt;Role&gt; fooBarBaz() {\n        return List.of(\n            new Rule(&quot;foo&quot;, s -&gt; s.phase == 0, s -&gt; { s.phase = 1; return &quot;foo&quot;; }),\n            new Rule(&quot;bar&quot;, s -&gt; s.phase == 1, s -&gt; { s.phase = 2; return &quot;bar&quot;; }),\n            new Rule(&quot;baz&quot;, s -&gt; s.phase == 2, s -&gt; { s.phase = 0; s.i++; return &quot;baz&quot;; }));\n    }\n\n    /**\n     * Building H2O with two threads: phase counts how many hydrogens this molecule already has, so H may act while\n     * that count is below two and O only when it is exactly two. Honest caveat in the Javadoc where it belongs: the\n     * real problem has many H threads and many O threads and asks only that each group of three contains two H and\n     * one O in any order. That is a barrier, not a turn order, and is where a Semaphore(2) plus a CyclicBarrier(3)\n     * earns its place instead of a turn flag.\n     */\n    static List&lt;Role&gt; water() {\n        return List.of(\n            new Rule(&quot;H&quot;, s -&gt; s.phase &lt; 2,  s -&gt; { s.phase++; return &quot;H&quot;; }),\n            new Rule(&quot;O&quot;, s -&gt; s.phase == 2, s -&gt; { s.phase = 0; s.i++; return &quot;O&quot;; }));\n    }\n}\n\n// ---- ext: the classic synchronized / wait / notifyAll version\n\n/**\n * The same design with the language&#x27;s built-in monitor instead of a Lock: synchronized, wait and notifyAll. It is\n * the version most people write first and it is correct, with one rule that cannot be broken -- an object has only\n * ONE wait set, so notify() (singular) would hand the single wake-up to an arbitrary sleeper, very likely one whose\n * guard is still false, and the thread that could have acted stays asleep forever. That is a lost wakeup, and it is\n * why this version must say notifyAll. What it cannot do is aim a wake-up: for that you need one Condition per\n * role, which is exactly why ConditionPrinter exists.\n */\nfinal class SynchronizedPrinter implements SeriesPrinter {\n    private final Object monitor = new Object();\n    private final Observers observers = new Observers();\n    private final AtomicLong wakeups = new AtomicLong(), wasted = new AtomicLong();\n    private volatile boolean stopped;\n    private long deadlineMs = 10_000;\n\n    public String name() { return &quot;synchronized / wait / notifyAll&quot;; }\n    public long wakeups() { return wakeups.get(); }\n    public long wastedWakeups() { return wasted.get(); }\n\n    /** Registers a listener, called once the synchronized block has been left. */\n    void addObserver(StepObserver o) { observers.add(o); }\n\n    /** Sets the flag inside the monitor and wakes the whole wait set. */\n    public void stop() {\n        synchronized (monitor) { stopped = true; monitor.notifyAll(); }\n    }\n\n    public String run(int n, List&lt;Role&gt; roles) throws InterruptedException {\n        stopped = false;\n        wakeups.set(0);\n        wasted.set(0);\n        Series s = new Series(n, roles.size(), Sink.NONE);\n        Crew.Result r = Crew.race(roles.size(), k -&gt; roles.get(k).name(),\n                                  me -&gt; serve(s, roles.get(me)), System::currentTimeMillis, deadlineMs, this::stop);\n        if (r.error != null) throw new IllegalStateException(name() + &quot;: a role threw&quot;, r.error);\n        if (!r.finished || (!stopped &amp;&amp; !s.done())) throw new IllegalStateException(name() + &quot;: the series stalled&quot;);\n        return s.text();\n    }\n\n    /** The identical shape: wait in a while loop, act, wake the whole set, publish outside the monitor. */\n    private void serve(Series s, Role role) throws InterruptedException {\n        while (true) {\n            String token;\n            int at;\n            synchronized (monitor) {\n                int w = 0;\n                while (!stopped &amp;&amp; !s.done() &amp;&amp; !role.ready(s)) { monitor.wait(); w++; }\n                if (w &gt; 0) { wakeups.addAndGet(w); wasted.addAndGet(w - 1L); }\n                if (stopped || s.done()) { monitor.notifyAll(); return; }\n                token = role.act(s);\n                s.emit(token);\n                at = s.i;\n                monitor.notifyAll();        // notify() here would be a lost-wakeup bug: one wait set, t sleepers\n            }\n            observers.publish(role.name(), token, at);\n        }\n    }\n}\n\n// ---- ext: if instead of while -- the bug, shown under a storm of stray wake-ups\n\n/**\n * The single most common mistake on this problem: an if where the while belongs. A wake-up is only a hint to look\n * again -- the JVM may return from await for no reason at all (a spurious wakeup), and another thread may have\n * taken the turn in between (a stolen signal). With an if, the woken thread acts on a guard that was true when it\n * went to sleep and is false now, so a token lands out of order. ExtDemo runs this under a thread that does nothing\n * but signalAll, which makes the bug show up in seconds instead of once a month in production.\n */\nfinal class BrokenIfPrinter {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Condition turn = lock.newCondition();\n    private volatile boolean stopped;\n\n    /** A pure stray wake-up: take the lock, change nothing, wake everybody. */\n    void nudge() {\n        lock.lock();\n        try { turn.signalAll(); } finally { lock.unlock(); }\n    }\n\n    /** Stops a run that will not end on its own. */\n    void stop() {\n        lock.lock();\n        try { stopped = true; turn.signalAll(); } finally { lock.unlock(); }\n    }\n\n    /** Runs the series with the broken wait and returns whatever came out, right or wrong. */\n    String run(int n, List&lt;Role&gt; roles, long deadlineMs) throws InterruptedException {\n        stopped = false;\n        Series s = new Series(n, roles.size(), Sink.NONE);\n        Crew.race(roles.size(), k -&gt; roles.get(k).name(),\n                  me -&gt; serve(s, roles.get(me)), System::currentTimeMillis, deadlineMs, this::stop);\n        return s.text();\n    }\n\n    private void serve(Series s, Role role) throws InterruptedException {\n        while (true) {\n            lock.lockInterruptibly();\n            try {\n                if (!stopped &amp;&amp; !s.done() &amp;&amp; !role.ready(s)) turn.await();   // IF, not WHILE: the whole bug\n                if (stopped || s.done()) { turn.signalAll(); return; }\n                s.emit(role.act(s));                                         // acts even when the guard went false again\n                turn.signalAll();\n            } finally { lock.unlock(); }\n        }\n    }\n}\n\n// ---- ext: busy-waiting, and what it really costs\n\n/**\n * No waiting at all: take the lock, look, drop it, look again. It is correct -- the check and the act are still one\n * step under the lock -- and on an idle machine with fewer threads than cores it can even beat the blocking version,\n * because it never pays the two microseconds of a park and an unpark. It is still the wrong answer, and the reason\n * is the row ExtDemo prints for thirty-two threads: a spinner holds a core whether or not it has anything to do, so\n * as soon as there are more participants than cores every spinner is stealing time from the one thread that could\n * actually make progress. Thread.onSpinWait() tells the CPU what is going on but does not give the core back.\n */\nfinal class SpinPrinter {\n    private final ReentrantLock lock = new ReentrantLock();\n\n    /** Runs the series by spinning; gives up at the deadline so a demo can never hang. */\n    String run(int n, List&lt;Role&gt; roles, long deadlineMs) throws InterruptedException {\n        Series s = new Series(n, roles.size(), Sink.NONE);\n        long end = System.nanoTime() + deadlineMs * 1_000_000L;\n        Crew.race(roles.size(), k -&gt; roles.get(k).name(), me -&gt; {\n            Role role = roles.get(me);\n            while (System.nanoTime() &lt; end) {\n                lock.lock();\n                try {\n                    if (s.done()) return;\n                    if (role.ready(s)) { s.emit(role.act(s)); continue; }\n                } finally { lock.unlock(); }\n                Thread.onSpinWait();                 // burn the core until it is our turn\n            }\n        }, System::currentTimeMillis, deadlineMs + 500, () -&gt; { });\n        return s.text();\n    }\n}\n\n// ---- ext: stream it live, and keep slow output out of the lock\n\n/** The obvious sink: every token goes straight to standard output, in order, while the lock is held. */\nfinal class SystemOutSink implements Sink {\n    public void emit(String token) { System.out.print(token); }\n}\n\n/**\n * The sink for a destination that can block -- a socket, a file, a remote log. emit() only adds the token to a\n * queue, which is a few nanoseconds and is safe to do while the lock is held; one background thread does the slow\n * write afterwards. That split is the answer to &quot;what if printing is slow&quot;: decide under the lock, do the I/O\n * outside it. The order survives because the queue is FIFO and the tokens enter it under the lock.\n */\nfinal class DeferredSink implements Sink {\n    private final BlockingQueue&lt;String&gt; pending = new LinkedBlockingQueue&lt;&gt;();\n    private final Consumer&lt;String&gt; slow;\n    private final Thread drainer;\n    private volatile boolean open = true;\n\n    DeferredSink(Consumer&lt;String&gt; slow) {\n        this.slow = slow;\n        drainer = new Thread(this::drain, &quot;sink-drainer&quot;);\n        drainer.setDaemon(true);\n        drainer.start();\n    }\n\n    /** O(1) and never blocks: this is the only part that runs with the printer&#x27;s lock held. */\n    public void emit(String token) { pending.add(token); }\n\n    private void drain() {\n        try {\n            while (true) {\n                String token = pending.poll(50, TimeUnit.MILLISECONDS);\n                if (token == null) { if (!open) return; continue; }\n                slow.accept(token);\n            }\n        } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n    }\n\n    /** Waits for every queued token to reach the slow destination, with a deadline of its own. */\n    void close() throws InterruptedException { open = false; drainer.join(10_000); }\n}\n\n// ---- ext: a roster that grows while the series is running\n\n/**\n * &quot;Now let threads join and leave mid-run.&quot; The turn loop is the same; what changes is that the printer keeps its\n * thread list and lets a newcomer join under the lock. The guard set stays total because the round-robin guard is\n * (i - 1) % k == me with k read from the blackboard: bump k and exactly one guard is still true at every step.\n * The newcomer&#x27;s thread is started inside the same lock that bumps k, so the step that first belongs to it cannot\n * be reached before its thread exists -- and even if the signal arrives before it waits, it re-checks its guard\n * before deciding to sleep, so nothing is lost.\n */\nfinal class ElasticPrinter {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Condition turn = lock.newCondition();\n    private final List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n    private final Observers observers = new Observers();\n    private Series series;\n    private volatile boolean stopped;\n\n    /** Registers a listener, called after the unlock like everywhere else. */\n    void addObserver(StepObserver o) { observers.add(o); }\n\n    /** Starts the series with the roles it has today and returns at once; the threads keep running. */\n    void start(int n, List&lt;Role&gt; roles) {\n        stopped = false;\n        series = new Series(n, roles.size(), Sink.NONE);\n        lock.lock();\n        try { for (Role r : roles) spawn(r); } finally { lock.unlock(); }\n    }\n\n    /** Adds one more participant to a running series: bump k, start its thread, wake everybody -- all under the lock. */\n    void join(Role r) {\n        lock.lock();\n        try { series.k++; spawn(r); turn.signalAll(); } finally { lock.unlock(); }\n    }\n\n    private void spawn(Role r) {\n        Thread t = new Thread(() -&gt; {\n            try { serve(r); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        }, &quot;role-&quot; + r.name());\n        threads.add(t);\n        t.start();\n    }\n\n    /** Waits for the series to end and returns the sequence; a stall becomes an exception, never a hang. */\n    String await(long ms) throws InterruptedException {\n        long end = System.currentTimeMillis() + ms;\n        List&lt;Thread&gt; snapshot;\n        lock.lock();\n        try { snapshot = new ArrayList&lt;&gt;(threads); } finally { lock.unlock(); }\n        for (Thread t : snapshot) t.join(Math.max(1L, end - System.currentTimeMillis()));\n        for (Thread t : snapshot)\n            if (t.isAlive()) { stopped = true; nudge(); t.join(300); t.interrupt(); }\n        return series.text();\n    }\n\n    private void nudge() {\n        lock.lock();\n        try { turn.signalAll(); } finally { lock.unlock(); }\n    }\n\n    private void serve(Role role) throws InterruptedException {\n        Series s = series;\n        while (true) {\n            String token;\n            int at;\n            lock.lockInterruptibly();\n            try {\n                while (!stopped &amp;&amp; !s.done() &amp;&amp; !role.ready(s)) turn.await();\n                if (stopped || s.done()) { turn.signalAll(); return; }\n                token = role.act(s);\n                s.emit(token);\n                at = s.i;\n                turn.signalAll();\n            } finally { lock.unlock(); }\n            observers.publish(role.name(), token, at);\n        }\n    }\n}\n\n// ---- ext: a Phaser instead of a lock\n\n/**\n * A fourth build that uses no lock and no condition: a Phaser, which is a barrier that trips once every registered\n * party has arrived, and is the memory fence as well -- what one thread wrote before arriving is visible to all of\n * them on the other side. The catch is that a barrier alone is NOT a lock, so one token needs TWO trips of it: in\n * the first half of a round every thread only READS its guard, and in the second half only the single thread whose\n * guard was true WRITES. Fuse those halves into one phase and the readers are reading the counter while the writer\n * is incrementing it, which is a plain data race: the first version of this class did exactly that and printed\n * &quot;1fizz24buzz&quot; instead of &quot;12fizz4buzz&quot;. It is also the most wasteful build here -- every thread wakes twice per\n * token whatever happens -- and it silently requires the guards to be a partition.\n */\nfinal class PhaserPrinter implements SeriesPrinter {\n    private final Observers observers = new Observers();\n    private final AtomicLong wakeups = new AtomicLong();\n    private volatile boolean stopped;\n    private volatile Phaser phaser = new Phaser(0);\n\n    public String name() { return &quot;phaser barrier, no lock&quot;; }\n    public long wakeups() { return wakeups.get(); }\n    /** Always zero in the sense the other builds mean it: nobody re-checks a guard after a wake, everybody just arrives. */\n    public long wastedWakeups() { return 0; }\n\n    /** Registers a listener. */\n    void addObserver(StepObserver o) { observers.add(o); }\n\n    /** Ends the run: a forced termination makes every parked arrival return immediately. */\n    public void stop() { stopped = true; phaser.forceTermination(); }\n\n    public String run(int n, List&lt;Role&gt; roles) throws InterruptedException {\n        stopped = false;\n        wakeups.set(0);\n        Series s = new Series(n, roles.size(), Sink.NONE);\n        Phaser p = new Phaser(roles.size());\n        phaser = p;\n        long budget = 4L * n + 64;                        // a round budget, so a guard set that is not total cannot spin forever\n        Crew.Result r = Crew.race(roles.size(), k -&gt; roles.get(k).name(), me -&gt; {\n            Role role = roles.get(me);\n            for (long round = 0; round &lt; budget &amp;&amp; !stopped &amp;&amp; !p.isTerminated(); round++) {\n                boolean mine = !s.done() &amp;&amp; role.ready(s);   // READ half: every thread looks, nobody writes\n                p.arriveAndAwaitAdvance();                   // ... and nobody writes until everybody has looked\n                String token = null;\n                int at = 0;\n                if (mine) { token = role.act(s); s.emit(token); at = s.i; }   // WRITE half: exactly one writer\n                p.arriveAndAwaitAdvance();                   // everybody sees the new blackboard after this line\n                wakeups.addAndGet(2);                        // two barrier trips per token, per thread\n                if (token != null) observers.publish(role.name(), token, at);\n                if (s.done()) break;                         // every thread tests this at the same point, so they all leave together\n            }\n            p.arriveAndDeregister();\n        }, System::currentTimeMillis, 10_000, this::stop);\n        if (r.error != null) throw new IllegalStateException(name() + &quot;: a role threw&quot;, r.error);\n        if (!r.finished || (!stopped &amp;&amp; !s.done())) throw new IllegalStateException(name() + &quot;: the series stalled&quot;);\n        return s.text();\n    }\n}\n\n// ---- ext: fairness and starvation -- the knob people reach for, and why it is the wrong one here\n\n/**\n * A fair lock hands itself to the thread that has been queuing longest instead of to whoever happens to be running.\n * It is the usual cure for starvation, and on this problem it cures nothing, because nothing can starve: the guards\n * are a partition of the series, so every role&#x27;s turn arrives on a fixed schedule whatever order the lock is handed\n * out in. Barging only decides who wins a race that every loser was going straight back to sleep from. What fairness\n * does cost is real: every hand-off becomes a park and an unpark instead of the winner simply keeping the lock.\n */\nfinal class Fairness {\n    private Fairness() { }\n\n    /** Nanoseconds per token for a round robin of k threads, with the lock fair or not. Warms the JIT first. */\n    static double nsPerToken(boolean fair, int k, int tokens) throws InterruptedException {\n        MonitorPrinter m = new MonitorPrinter(fair);\n        List&lt;Role&gt; rr = Roles.roundRobin(k);\n        m.run(2_000, rr);\n        long t0 = System.nanoTime();\n        m.run(tokens, rr);\n        return (System.nanoTime() - t0) / (double) tokens;\n    }\n\n    /** The starvation check: over a long run every one of the k roles emitted exactly the same number of tokens. */\n    static boolean everyRoleGotItsShare(int k, int tokens) throws InterruptedException {\n        MonitorPrinter m = new MonitorPrinter(false);           // the UNFAIR lock, on purpose\n        RoleTally tally = new RoleTally();\n        m.addObserver(tally);\n        m.run(tokens, Roles.roundRobin(k));\n        for (int j = 0; j &lt; k; j++) if (tally.of(&quot;t&quot; + j) != tokens / k) return false;\n        return true;\n    }\n}\n\n// ---- ext: an interrupt while a thread is waiting\n\n/**\n * What happens when somebody cancels a thread that is parked on await(). The wait throws InterruptedException, and\n * because it throws out of a try whose finally unlocks, the lock is released on the way out -- that finally is the\n * only reason the rest of the system survives. The interrupted thread then leaves for good, so the series it was\n * part of can never finish: the remaining threads wait for a turn that will never come, the run hits its deadline,\n * and run() throws instead of hanging. The printer itself is undamaged, which is the claim check 16 makes: the very\n * same object runs a clean series immediately afterwards.\n */\nfinal class Interrupts {\n    private Interrupts() { }\n\n    /** Interrupts the live participant thread, the one Crew named &quot;role-&quot; plus the role name. False if it has already gone. */\n    static boolean interruptRole(String name) {\n        for (Thread t : Thread.getAllStackTraces().keySet())\n            if (t.isAlive() &amp;&amp; (&quot;role-&quot; + name).equals(t.getName())) { t.interrupt(); return true; }\n        return false;\n    }\n}\n\n/** Runs every extension on this page once, so the reference code is known to work and not only to compile. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        MonitorPrinter p = new MonitorPrinter();\n\n        System.out.println(&quot;== audit trail: a Decorator over Role, engine untouched ==&quot;);\n        List&lt;String&gt; trail = new ArrayList&lt;&gt;();\n        String fb = p.run(4, AuditRole.wrap(Roles.fooBar(), trail));\n        System.out.println(&quot;output &quot; + fb + &quot;   trail &quot; + trail);\n\n        System.out.println();\n        System.out.println(&quot;== two more series: the same engine, a new guard set ==&quot;);\n        System.out.println(&quot;fooBarBaz(3) -&gt; &quot; + p.run(3, ExtraRoles.fooBarBaz()));\n        System.out.println(&quot;water(3)     -&gt; &quot; + p.run(3, ExtraRoles.water()) + &quot;   (two hydrogens, then one oxygen, per molecule)&quot;);\n\n        System.out.println();\n        System.out.println(&quot;== the same answer from five different builds ==&quot;);\n        List&lt;SeriesPrinter&gt; builds = List.of(new MonitorPrinter(), new ConditionPrinter(), new SemaphorePrinter(),\n                                             new SynchronizedPrinter(), new PhaserPrinter());\n        for (SeriesPrinter b : builds)\n            System.out.printf(&quot;%-34s %s%n&quot;, b.name(), b.run(15, Roles.fizzBuzz()));\n\n        System.out.println();\n        System.out.println(&quot;== if instead of while: the bug, under a storm of stray wake-ups ==&quot;);\n        String want = p.run(60, Roles.fizzBuzz());\n        int wrong = 0, rounds = 40;\n        for (int r = 0; r &lt; rounds; r++) {\n            BrokenIfPrinter broken = new BrokenIfPrinter();\n            Thread storm = new Thread(() -&gt; { while (!Thread.currentThread().isInterrupted()) broken.nudge(); });\n            storm.setDaemon(true);\n            storm.start();\n            String got = broken.run(60, Roles.fizzBuzz(), 1_000);\n            storm.interrupt();\n            storm.join(500);\n            if (!got.equals(want)) wrong++;\n        }\n        System.out.println(&quot;the if version printed the wrong sequence in &quot; + wrong + &quot; of &quot; + rounds + &quot; rounds&quot;);\n        System.out.println(&quot;the while version, under the same storm, is byte-perfect every time (FailureTests check 5)&quot;);\n\n        System.out.println();\n        System.out.println(&quot;== busy-waiting: fine until there are more spinners than cores ==&quot;);\n        System.out.println(&quot;this machine reports &quot; + Runtime.getRuntime().availableProcessors() + &quot; processors&quot;);\n        for (int k : new int[] { 2, 4, 32 }) {\n            SpinPrinter spin = new SpinPrinter();\n            List&lt;Role&gt; rr = Roles.roundRobin(k);\n            long t0 = System.nanoTime();\n            String out = spin.run(4_000, rr, 8_000);\n            long ns = System.nanoTime() - t0;\n            MonitorPrinter block = new MonitorPrinter();\n            long t1 = System.nanoTime();\n            block.run(4_000, rr);\n            long ns2 = System.nanoTime() - t1;\n            System.out.printf(&quot;%2d threads: spinning %7.0f ns/token, blocking %7.0f ns/token, spin output complete: %s%n&quot;,\n                              k, ns / 4_000.0, ns2 / 4_000.0, out.equals(block.run(4_000, rr)));\n        }\n\n        System.out.println();\n        System.out.println(&quot;== a slow destination: inside the lock, then outside it ==&quot;);\n        MonitorPrinter slowInside = new MonitorPrinter();\n        slowInside.configure(token -&gt; sleepMs(1), System::currentTimeMillis, 20_000);\n        long t0 = System.nanoTime();\n        slowInside.run(20, Roles.fooBar());\n        System.out.printf(&quot;sink called inside the lock:   the run took %5d ms%n&quot;, (System.nanoTime() - t0) / 1_000_000);\n        List&lt;String&gt; written = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        DeferredSink deferred = new DeferredSink(token -&gt; { sleepMs(1); written.add(token); });\n        MonitorPrinter slowOutside = new MonitorPrinter();\n        slowOutside.configure(deferred, System::currentTimeMillis, 20_000);\n        long t1 = System.nanoTime();\n        String seq = slowOutside.run(20, Roles.fooBar());\n        long runMs = (System.nanoTime() - t1) / 1_000_000;\n        deferred.close();\n        System.out.printf(&quot;queued under it, flushed after: the run took %5d ms, the flush finished later%n&quot;, runMs);\n        System.out.println(&quot;order survived the deferral? &quot; + String.join(&quot;&quot;, written).equals(seq));\n\n        System.out.println();\n        System.out.println(&quot;== an unbounded stream, stopped by a signal ==&quot;);\n        MonitorPrinter live = new MonitorPrinter();\n        AtomicReference&lt;String&gt; streamed = new AtomicReference&lt;&gt;(&quot;&quot;);\n        Thread runner = new Thread(() -&gt; {\n            try { streamed.set(live.run(Integer.MAX_VALUE, Roles.fizzBuzz())); }\n            catch (Exception e) { streamed.set(&quot;FAILED &quot; + e); }\n        });\n        runner.start();\n        Thread.sleep(50);\n        live.stop();\n        runner.join(5_000);\n        System.out.println(&quot;stopped after 50 ms with &quot; + streamed.get().length() + &quot; characters emitted, &quot;\n                           + &quot;every thread finished: &quot; + !runner.isAlive());\n\n        System.out.println();\n        System.out.println(&quot;== a roster that grows while the series runs ==&quot;);\n        ElasticPrinter elastic = new ElasticPrinter();\n        CountDownLatch grow = new CountDownLatch(1);\n        elastic.addObserver((role, token, at) -&gt; { if (at &gt;= 100) grow.countDown(); });\n        List&lt;Role&gt; two = Roles.roundRobin(4);\n        elastic.start(20_000, two.subList(0, 2));\n        grow.await(5, TimeUnit.SECONDS);\n        elastic.join(two.get(2));\n        elastic.join(two.get(3));\n        String grown = elastic.await(10_000);\n        StringBuilder expected = new StringBuilder();\n        for (int i = 1; i &lt;= 20_000; i++) expected.append(i).append(&#x27; &#x27;);\n        System.out.println(&quot;started with 2 threads, grew to 4 mid-run, still in strict order: &quot;\n                           + grown.equals(expected.toString()));\n\n        System.out.println();\n        System.out.println(&quot;== fairness: the wrong knob on this problem ==&quot;);\n        for (boolean fair : new boolean[] { false, true })\n            System.out.printf(&quot;fair lock = %-5s  %6.0f ns/token%n&quot;, fair, Fairness.nsPerToken(fair, 4, 20_000));\n        System.out.println(&quot;nothing can starve either way: every role got exactly its share of 20,000 tokens &quot;\n                           + &quot;on the UNFAIR lock: &quot; + Fairness.everyRoleGotItsShare(4, 20_000));\n\n        System.out.println();\n        System.out.println(&quot;== an interrupt while a thread is waiting ==&quot;);\n        MonitorPrinter cancelled = new MonitorPrinter();\n        cancelled.configure(Sink.NONE, System::currentTimeMillis, 700);\n        Thread host = new Thread(() -&gt; {\n            try { cancelled.run(Integer.MAX_VALUE, Roles.roundRobin(3)); }\n            catch (IllegalStateException e) { System.out.println(&quot;run() ended with: &quot; + e.getMessage()); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        host.start();\n        Thread.sleep(40);\n        System.out.println(&quot;interrupted the t1 thread mid-run: &quot; + Interrupts.interruptRole(&quot;t1&quot;));\n        host.join(5_000);\n        System.out.println(&quot;the same printer still works afterwards, so the lock was released: &quot;\n                           + cancelled.run(15, Roles.fizzBuzz()).equals(&quot;12fizz4buzzfizz78fizzbuzz11fizz1314fizzbuzz&quot;));\n    }\n\n    /** Sleeps without making every caller catch the interrupt; used only to fake a slow destination. */\n    static void sleepMs(long ms) {\n        try { Thread.sleep(ms); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n/**\n * Targeted failure tests: each one proves a claim the design makes on page 02, move 9. Every wait in this file has a\n * deadline and the whole run has a watchdog, because a threading test that hangs has told you nothing: a bug has to\n * show up as a FAIL line, never as a build that never ends.\n */\npublic class FailureTests {\n    static int failures = 0;\n\n    /** Prints one line per claim and remembers whether it held. */\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what);\n        if (!ok) failures++;\n    }\n\n    /** A turn-taking test suite that hangs is a failed test suite: this daemon ends the run if one does. */\n    static void watchdog(long seconds) {\n        Thread t = new Thread(() -&gt; {\n            try { Thread.sleep(seconds * 1000); } catch (InterruptedException e) { return; }\n            System.out.println(&quot;FAIL watchdog: the tests did not finish in &quot; + seconds + &quot; s (a lost wakeup or a stall)&quot;);\n            Runtime.getRuntime().halt(2);\n        });\n        t.setDaemon(true);\n        t.start();\n    }\n\n    /** &quot;1 2 3 ... n &quot; -- what the round robin must produce, whatever the number of threads. */\n    static String counted(int n) {\n        StringBuilder b = new StringBuilder();\n        for (int i = 1; i &lt;= n; i++) b.append(i).append(&#x27; &#x27;);\n        return b.toString();\n    }\n\n    public static void main(String[] args) throws Exception {\n        watchdog(45);\n        MonitorPrinter p = new MonitorPrinter();\n\n        // 1. two threads, one flag: strict alternation, and the output is exactly the expected string.\n        String fooBar = p.run(5, Roles.fooBar());\n        check(fooBar.equals(&quot;foobarfoobarfoobarfoobarfoobar&quot;),\n              &quot;FooBar(5) is exactly foobar x5 -- two threads, strict alternation (&quot; + fooBar + &quot;)&quot;);\n\n        // 2. three threads on the same flag: zero fires before every number, parity picks the printer.\n        String zeo = p.run(5, Roles.zeroEvenOdd());\n        check(zeo.equals(&quot;0102030405&quot;), &quot;ZeroEvenOdd(5) is exactly 0102030405 -- three threads, one flag (&quot; + zeo + &quot;)&quot;);\n\n        // 3. four threads and no flag at all: the four guards partition every i, so the number IS the state machine.\n        String fizz = p.run(15, Roles.fizzBuzz());\n        check(fizz.equals(&quot;12fizz4buzzfizz78fizzbuzz11fizz1314fizzbuzz&quot;),\n              &quot;FizzBuzz(15) is exactly right with four guards and no turn flag (&quot; + fizz + &quot;)&quot;);\n\n        // 4. the race, 300 times over: the threads really do contend, and the answer is byte-identical every run,\n        //    with every token present exactly once -- nothing lost, nothing printed twice.\n        String want = &quot;foobar&quot;.repeat(120);\n        boolean stable = true;\n        RoleTally tally = new RoleTally();\n        MonitorPrinter repeat = new MonitorPrinter();\n        repeat.addObserver(tally);\n        for (int r = 0; r &lt; 300; r++) if (!repeat.run(120, Roles.fooBar()).equals(want)) stable = false;\n        check(stable, &quot;300 separate runs of FooBar(120) are byte-identical: the order is not luck&quot;);\n        check(tally.of(&quot;foo&quot;) == 300 * 120 &amp;&amp; tally.of(&quot;bar&quot;) == 300 * 120,\n              &quot;each thread emitted exactly its own 36,000 tokens -- no duplicate, no omission&quot;);\n\n        // 5. a stray wake-up cannot move a thread: a storm of signalAll lands during the run and the while loop\n        //    absorbs every one of them. wakeups() proves the storm really arrived.\n        MonitorPrinter stormed = new MonitorPrinter();\n        Thread storm = new Thread(() -&gt; { while (!Thread.currentThread().isInterrupted()) stormed.nudge(); });\n        storm.setDaemon(true);\n        storm.start();\n        String underStorm = p.run(400, Roles.fizzBuzz());\n        String stormOut = stormed.run(400, Roles.fizzBuzz());\n        storm.interrupt();\n        storm.join(2_000);\n        check(stormOut.equals(underStorm) &amp;&amp; stormed.wakeups() &gt; 400,\n              &quot;under a storm of stray wake-ups the sequence is still exact (&quot; + stormed.wakeups() + &quot; wakes for 400 tokens)&quot;);\n\n        // 6. ten threads, strict turns: the same engine with a guard set of any size.\n        String ten = p.run(600, Roles.roundRobin(10));\n        check(ten.equals(counted(600)), &quot;ten threads printed 1..600 in strict order&quot;);\n\n        // 7. the three builds are interchangeable: same series, same string, every time.\n        boolean same = true;\n        for (SeriesPrinter b : List.of(new MonitorPrinter(), new ConditionPrinter(), new SemaphorePrinter())) {\n            same &amp;= b.run(5, Roles.fooBar()).equals(&quot;foobarfoobarfoobarfoobarfoobar&quot;);\n            same &amp;= b.run(5, Roles.zeroEvenOdd()).equals(&quot;0102030405&quot;);\n            same &amp;= b.run(15, Roles.fizzBuzz()).equals(&quot;12fizz4buzzfizz78fizzbuzz11fizz1314fizzbuzz&quot;);\n        }\n        check(same, &quot;the monitor, the per-role condition and the semaphore builds return the same string for all three series&quot;);\n\n        // 8. the herd, counted: signalAll wakes threads that cannot act, an aimed signal does not.\n        MonitorPrinter herd = new MonitorPrinter();\n        ConditionPrinter aimed = new ConditionPrinter();\n        SemaphorePrinter baton = new SemaphorePrinter();\n        herd.run(4_000, Roles.fizzBuzz());\n        aimed.run(4_000, Roles.fizzBuzz());\n        baton.run(4_000, Roles.fizzBuzz());\n        check(herd.wastedWakeups() &gt; 0 &amp;&amp; aimed.wastedWakeups() == 0 &amp;&amp; baton.wastedWakeups() == 0,\n              &quot;the herd is real: signalAll wasted &quot; + herd.wastedWakeups() + &quot; wakes over 4000 tokens, an aimed signal wasted 0&quot;);\n\n        // 9. a slow listener cannot break the order, because it is called with the lock released.\n        MonitorPrinter slow = new MonitorPrinter();\n        slow.addObserver((role, token, at) -&gt; { try { Thread.sleep(1); } catch (InterruptedException e) { Thread.currentThread().interrupt(); } });\n        check(slow.run(60, Roles.fooBar()).equals(&quot;foobar&quot;.repeat(60)),\n              &quot;a listener that sleeps a millisecond per step slows only itself: the sequence is still exact&quot;);\n\n        // 10. a listener that throws on every step cannot break the run either.\n        MonitorPrinter broken = new MonitorPrinter();\n        broken.addObserver((role, token, at) -&gt; { throw new RuntimeException(&quot;the dashboard is down&quot;); });\n        check(broken.run(15, Roles.fizzBuzz()).equals(&quot;12fizz4buzzfizz78fizzbuzz11fizz1314fizzbuzz&quot;),\n              &quot;a listener that throws on every step is swallowed: the sequence is still exact&quot;);\n\n        // 11. a stall must fail, not hang: a guard set with a hole (fizzbuzz removed) reaches i = 15 with no role\n        //     able to act, and the deadline turns that into an exception in under a second.\n        MonitorPrinter holed = new MonitorPrinter();\n        holed.configure(Sink.NONE, System::currentTimeMillis, 600);\n        long t0 = System.currentTimeMillis();\n        boolean threw = false;\n        try { holed.run(15, Roles.fizzBuzz().subList(0, 3)); } catch (IllegalStateException e) { threw = true; }\n        long tookMs = System.currentTimeMillis() - t0;\n        check(threw &amp;&amp; tookMs &lt; 4_000, &quot;a guard set with a hole fails in &quot; + tookMs + &quot; ms instead of hanging for ever&quot;);\n\n        // 12. a role whose action throws must not strand the others: the run ends with an exception inside the\n        //     deadline, and exactly the turns that succeeded were published.\n        AtomicInteger published = new AtomicInteger();\n        AtomicInteger acts = new AtomicInteger();\n        MonitorPrinter fragile = new MonitorPrinter();\n        fragile.configure(Sink.NONE, System::currentTimeMillis, 800);\n        fragile.addObserver((role, token, at) -&gt; published.incrementAndGet());\n        List&lt;Role&gt; fragileRoles = List.of(\n            new Rule(&quot;foo&quot;, s -&gt; s.phase == 0, s -&gt; { s.phase = 1; return &quot;foo&quot;; }),\n            new Rule(&quot;bar&quot;, s -&gt; s.phase == 1, s -&gt; {\n                if (acts.incrementAndGet() == 5) throw new IllegalArgumentException(&quot;this role is broken&quot;);\n                s.phase = 0; s.i++; return &quot;bar&quot;;\n            }));\n        boolean threwRole = false;\n        try { fragile.run(20, fragileRoles); } catch (IllegalStateException e) { threwRole = true; }\n        check(threwRole &amp;&amp; published.get() == 9,\n              &quot;a role that throws on its fifth turn ends the run cleanly: 9 turns committed, nobody left asleep for ever&quot;);\n\n        // 13. stop() ends a long run: the threads leave, and what was printed before the signal is intact.\n        MonitorPrinter live = new MonitorPrinter();\n        AtomicReference&lt;String&gt; streamed = new AtomicReference&lt;&gt;(&quot;&quot;);\n        AtomicBoolean failed = new AtomicBoolean();\n        Thread runner = new Thread(() -&gt; {\n            try { streamed.set(live.run(Integer.MAX_VALUE, Roles.roundRobin(4))); }\n            catch (Exception e) { failed.set(true); }\n        });\n        runner.start();\n        Thread.sleep(40);\n        live.stop();\n        runner.join(5_000);\n        String prefix = streamed.get();\n        check(!failed.get() &amp;&amp; !runner.isAlive() &amp;&amp; prefix.length() &gt; 0 &amp;&amp; counted(2_000_000).startsWith(prefix),\n              &quot;stop() ended an unbounded run: &quot; + prefix.length() + &quot; characters out, every thread finished, the prefix is exact&quot;);\n\n        // 14. the edges: nothing to print, and one thing to print.\n        boolean edges = p.run(0, Roles.fooBar()).isEmpty()\n                     &amp;&amp; p.run(0, Roles.fizzBuzz()).isEmpty()\n                     &amp;&amp; p.run(1, Roles.fooBar()).equals(&quot;foobar&quot;)\n                     &amp;&amp; p.run(1, Roles.zeroEvenOdd()).equals(&quot;01&quot;)\n                     &amp;&amp; p.run(1, Roles.fizzBuzz()).equals(&quot;1&quot;);\n        check(edges, &quot;n = 0 prints nothing and every thread still exits; n = 1 is correct for all three series&quot;);\n\n        // 15. the deadline comes from the injected clock, so a test proves it without waiting for it.\n        MonitorPrinter fake = new MonitorPrinter();\n        fake.configure(Sink.NONE, new Clock() {\n            private long t = System.currentTimeMillis();\n            public long nowMs() { long now = t; t += 1_000_000; return now; }   // every reading is a thousand seconds later\n        }, 5_000);\n        long t1 = System.currentTimeMillis();\n        boolean gaveUp = false;\n        try { fake.run(200_000, Roles.fizzBuzz()); } catch (IllegalStateException e) { gaveUp = true; }\n        long fakeMs = System.currentTimeMillis() - t1;\n        check(gaveUp &amp;&amp; fakeMs &lt; 3_000,\n              &quot;a clock already past the deadline makes the printer give up in &quot; + fakeMs + &quot; ms of real time&quot;);\n\n        // 16. an interrupt while a thread is parked on await(): the finally releases the lock on the way out, so the\n        //     run fails at its deadline instead of hanging AND the very same printer is still usable afterwards.\n        MonitorPrinter cancelled = new MonitorPrinter();\n        cancelled.configure(Sink.NONE, System::currentTimeMillis, 700);\n        AtomicReference&lt;String&gt; ended = new AtomicReference&lt;&gt;(&quot;did not end&quot;);\n        Thread host = new Thread(() -&gt; {\n            try { cancelled.run(Integer.MAX_VALUE, Roles.roundRobin(3)); }\n            catch (IllegalStateException e) { ended.set(&quot;threw&quot;); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        });\n        host.start();\n        Thread.sleep(40);\n        boolean hit = Interrupts.interruptRole(&quot;t1&quot;);\n        host.join(5_000);\n        String after = cancelled.run(15, Roles.fizzBuzz());\n        check(hit &amp;&amp; &quot;threw&quot;.equals(ended.get()) &amp;&amp; !host.isAlive()\n              &amp;&amp; after.equals(&quot;12fizz4buzzfizz78fizzbuzz11fizz1314fizzbuzz&quot;),\n              &quot;a thread interrupted while waiting kills the run cleanly and leaves the lock free: the same printer runs again&quot;);\n\n        // 17. the Phaser build needs TWO barrier trips per token -- one for the reads, one for the write -- and with\n        //     them it agrees with the lock builds character for character.\n        check(new PhaserPrinter().run(15, Roles.fizzBuzz()).equals(&quot;12fizz4buzzfizz78fizzbuzz11fizz1314fizzbuzz&quot;),\n              &quot;the Phaser build, with the reads and the write in separate phases, gives the same string as the lock&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures &gt; 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Give me three threads that print 0, then 1, then 0, then 2, then 0, then 3, and so on to n &mdash; one thread only ever prints zeros, one only odd numbers, one only even. Then show me the same code doing FizzBuzz with four threads. I want working code, not a diagram. Go.\"</div>Before typing, write your six clarifying questions (one engine or three, and does the data decide the next actor, first); then type in the order of Main.java: the <code>Sink</code> and <code>Clock</code> interfaces, the <code>Series</code> blackboard with no threading in it at all, the <code>Role</code> interface and the lambda-backed <code>Rule</code>, the three guard sets in <code>Roles</code>, then <code>MonitorPrinter</code> &mdash; the lock, the condition, and <code>serve</code> with its order &mdash; then the thread starter with its latch and its deadline, then a main that runs FooBar, ZeroEvenOdd and FizzBuzz and repeats one of them three hundred times to prove the output never changes.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; Mid-round: trace which thread emitted each token. Do not touch the coordinator.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing in the engine changes, because what a participant does was already a rule handed in. This is one new class that implements <code>Role</code>, holds the role it wraps, records the name and the token, and delegates &mdash; the Decorator. The turn loop, the guards and the other roles stay byte for byte the same; the call site changes by one line per role, or by one call to <code>AuditRole.wrap</code> for the whole list. One detail worth saying out loud: <code>act</code> runs with the lock held, so the trail can be a plain <code>ArrayList</code> &mdash; only one thread is ever inside it. If you wanted the trail from outside the lock instead, that is the observer, not the decorator.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: an audit trail, and not one line of the engine changes\n\n/**\n * Decorator over any Role: it records who emitted what and then delegates. The turn loop, the other roles and every\n * guard stay byte-for-byte the same; the call site changes by one line per role. Because act() runs with the\n * printer&#x27;s lock held, a plain ArrayList is enough for the trail: only one thread is inside it at a time.\n */\nfinal class AuditRole implements Role {\n    private final Role inner;\n    private final List&lt;String&gt; trail;\n\n    AuditRole(Role inner, List&lt;String&gt; trail) { this.inner = inner; this.trail = trail; }\n\n    public String name() { return inner.name(); }\n    public boolean ready(Series s) { return inner.ready(s); }\n\n    /** Notes the role and the token, then lets the wrapped rule do the real work. */\n    public String act(Series s) {\n        String token = inner.act(s);\n        trail.add(inner.name() + &quot;:&quot; + token);\n        return token;\n    }\n\n    /** Wraps every role in a list, so auditing a whole series is one call. */\n    static List&lt;Role&gt; wrap(List&lt;Role&gt; roles, List&lt;String&gt; trail) {\n        List&lt;Role&gt; out = new ArrayList&lt;&gt;();\n        for (Role r : roles) out.add(new AuditRole(r, trail));\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>2 &middot; Why is the wait a while loop and not an if? Show me what breaks.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Because a wakeup is not a promise. Two things happen between the signal and this thread actually running: the wake was broadcast to every sleeper, so it was probably meant for somebody else, and the JVM is allowed to return from <code>await</code> for no reason at all, which is a spurious wakeup. With an <code>if</code>, the thread carries on and prints out of turn. With a <code>while</code>, it re-tests its guard and goes back to sleep, which costs one extra comparison. The picture on page 02 move 6 is the proof: the arrow from \"woken\" goes back to \"check\", never forward to \"print\". ExtDemo runs the broken version with a thread doing nothing but <code>signalAll</code>, and it printed the wrong sequence in forty rounds out of forty; the correct version under the same storm is byte-perfect, which is check 5 in FailureTests.java.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * One participant&#x27;s whole life. Wait while it is not this role&#x27;s turn, act, wake everybody, then tell the\n     * listeners with the lock released. The wait is a while loop because a wake only means &quot;look again&quot;.\n     */\n    private void serve(Series s, Role role) throws InterruptedException {\n        while (true) {\n            String token;\n            int at;\n            lock.lockInterruptibly();                       // interruptibly, so a parked role can still be cancelled\n            try {\n                int waits = 0;\n                while (!stopped &amp;&amp; !s.done() &amp;&amp; !role.ready(s)) {\n                    turn.await();                           // the lock is RELEASED while this thread sleeps\n                    waits++;\n                }\n                if (waits &gt; 0) { wakeups.addAndGet(waits); wasted.addAndGet(waits - 1L); }\n                if (stopped || s.done()) { turn.signalAll(); return; }   // wake the rest on the way out\n                try {\n                    token = role.act(s);                    // decide the token and advance the counter: one step\n                    s.emit(token);                          // the ordered record, INSIDE the lock: the order is the product\n                    at = s.i;\n                } catch (RuntimeException e) {\n                    turn.signalAll();                       // a broken role must not strand the others\n                    throw e;\n                }\n                turn.signalAll();                           // one crowd; exactly one guard is now true\n            } finally {\n                lock.unlock();                              // in a finally, always: an exception must never leave the lock held\n            }\n            observers.publish(role.name(), token, at);      // only now, outside the lock\n        }\n    }\n}\n\n// ---- ext: if instead of while -- the bug, shown under a storm of stray wake-ups\n\n/**\n * The single most common mistake on this problem: an if where the while belongs. A wake-up is only a hint to look\n * again -- the JVM may return from await for no reason at all (a spurious wakeup), and another thread may have\n * taken the turn in between (a stolen signal). With an if, the woken thread acts on a guard that was true when it\n * went to sleep and is false now, so a token lands out of order. ExtDemo runs this under a thread that does nothing\n * but signalAll, which makes the bug show up in seconds instead of once a month in production.\n */\nfinal class BrokenIfPrinter {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Condition turn = lock.newCondition();\n    private volatile boolean stopped;\n\n    /** A pure stray wake-up: take the lock, change nothing, wake everybody. */\n    void nudge() {\n        lock.lock();\n        try { turn.signalAll(); } finally { lock.unlock(); }\n    }\n\n    /** Stops a run that will not end on its own. */\n    void stop() {\n        lock.lock();\n        try { stopped = true; turn.signalAll(); } finally { lock.unlock(); }\n    }\n\n    /** Runs the series with the broken wait and returns whatever came out, right or wrong. */\n    String run(int n, List&lt;Role&gt; roles, long deadlineMs) throws InterruptedException {\n        stopped = false;\n        Series s = new Series(n, roles.size(), Sink.NONE);\n        Crew.race(roles.size(), k -&gt; roles.get(k).name(),\n                  me -&gt; serve(s, roles.get(me)), System::currentTimeMillis, deadlineMs, this::stop);\n        return s.text();\n    }\n\n    private void serve(Series s, Role role) throws InterruptedException {\n        while (true) {\n            lock.lockInterruptibly();\n            try {\n                if (!stopped &amp;&amp; !s.done() &amp;&amp; !role.ready(s)) turn.await();   // IF, not WHILE: the whole bug\n                if (stopped || s.done()) { turn.signalAll(); return; }\n                s.emit(role.act(s));                                         // acts even when the guard went false again\n                turn.signalAll();\n            } finally { lock.unlock(); }\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; Ten threads, six hundred numbers, strict order. Prove it is not luck.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The proof is a count, not an argument. Three hundred separate runs of the same series must produce byte-identical output: if the order were luck, one of the three hundred would differ. An observer counts the tokens per role from outside the lock, so a duplicate or an omission shows up as a wrong count rather than as a wrong-looking string. A second check hammers the run with a thread that does nothing but <code>signalAll</code>, which forces the stolen and spurious wakeups the while loop is there to absorb, and asserts both that the output is still exact and that the storm really landed. Every join has a deadline with a forty-five second watchdog behind it, so a lost wakeup fails the test instead of hanging the build.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 4. the race, 300 times over: the threads really do contend, and the answer is byte-identical every run,\n        //    with every token present exactly once -- nothing lost, nothing printed twice.\n        String want = &quot;foobar&quot;.repeat(120);\n        boolean stable = true;\n        RoleTally tally = new RoleTally();\n        MonitorPrinter repeat = new MonitorPrinter();\n        repeat.addObserver(tally);\n        for (int r = 0; r &lt; 300; r++) if (!repeat.run(120, Roles.fooBar()).equals(want)) stable = false;\n        check(stable, &quot;300 separate runs of FooBar(120) are byte-identical: the order is not luck&quot;);\n        check(tally.of(&quot;foo&quot;) == 300 * 120 &amp;&amp; tally.of(&quot;bar&quot;) == 300 * 120,\n              &quot;each thread emitted exactly its own 36,000 tokens -- no duplicate, no omission&quot;);\n\n        // 5. a stray wake-up cannot move a thread: a storm of signalAll lands during the run and the while loop\n        //    absorbs every one of them. wakeups() proves the storm really arrived.\n        MonitorPrinter stormed = new MonitorPrinter();\n        Thread storm = new Thread(() -&gt; { while (!Thread.currentThread().isInterrupted()) stormed.nudge(); });\n        storm.setDaemon(true);\n        storm.start();\n        String underStorm = p.run(400, Roles.fizzBuzz());\n        String stormOut = stormed.run(400, Roles.fizzBuzz());\n        storm.interrupt();\n        storm.join(2_000);\n        check(stormOut.equals(underStorm) &amp;&amp; stormed.wakeups() &gt; 400,\n              &quot;under a storm of stray wake-ups the sequence is still exact (&quot; + stormed.wakeups() + &quot; wakes for 400 tokens)&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>4 &middot; One lock, and every thread wakes on every token. Have you serialised the whole thing? What is above this?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Measure first, and the measurement says the lock is not the problem: one thread doing 50,000 turns is 65 nanoseconds a turn, because the locked part is a modulo, a comparison, an append and a signal. What costs is parking a thread and waking it again, about two microseconds a time, and the number that tracks it is wasted wakes per token. So the first fix is not architecture, it is to stop waking threads that cannot act. Rung two does exactly that: one <code>Condition</code> per role, and the thread that just printed scans the guards, finds the single role the turn made ready, and signals only that one. On FizzBuzz to 20,000 with four threads that is 32,000 wakes down to 16,000, wasted wakes to zero, and 3.4 microseconds a token down to 2.1.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Build 2, ladder rung two: the same lock, but one Condition per role. A turn ends by finding the single role whose\n * guard the turn just made true and signalling only that one, so no thread ever wakes for nothing. The cost is a\n * scan of the guards under the lock and one Condition object per participant.\n */\nfinal class ConditionPrinter implements SeriesPrinter {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Observers observers = new Observers();\n    private final AtomicLong wakeups = new AtomicLong(), wasted = new AtomicLong();\n    private Sink sink = Sink.NONE;\n    private Clock clock = System::currentTimeMillis;\n    private long deadlineMs = 10_000;\n    private volatile boolean stopped;\n    private volatile Condition[] waits = new Condition[0];\n\n    /** Same seams as the monitor build: the sink, the clock and the deadline are handed in. */\n    void configure(Sink sink, Clock clock, long deadlineMs) {\n        this.sink = sink; this.clock = clock; this.deadlineMs = deadlineMs;\n    }\n\n    /** Registers a listener, called after the unlock. */\n    void addObserver(StepObserver o) { observers.add(o); }\n\n    public String name() { return &quot;one condition per role, signal&quot;; }\n    public long wakeups() { return wakeups.get(); }\n    public long wastedWakeups() { return wasted.get(); }\n\n    /** Sets the flag under the lock and wakes every per-role condition, because a shutdown concerns all of them at once. */\n    public void stop() {\n        lock.lock();\n        try { stopped = true; wakeAll(); } finally { lock.unlock(); }\n    }\n\n    public String run(int n, List&lt;Role&gt; roles) throws InterruptedException {\n        stopped = false;\n        wakeups.set(0);\n        wasted.set(0);\n        Series s = new Series(n, roles.size(), sink);\n        Condition[] w = new Condition[roles.size()];\n        for (int k = 0; k &lt; w.length; k++) w[k] = lock.newCondition();\n        waits = w;\n        Crew.Result r = Crew.race(roles.size(), k -&gt; roles.get(k).name(),\n                                  me -&gt; serve(s, roles, w, me), clock, deadlineMs, this::stop);\n        if (r.error != null)\n            throw new IllegalStateException(name() + &quot;: a role threw; the counter never moved&quot;, r.error);\n        if (!r.finished)\n            throw new IllegalStateException(name() + &quot;: the series did not finish in &quot; + deadlineMs + &quot; ms&quot;);\n        if (!stopped &amp;&amp; !s.done())\n            throw new IllegalStateException(name() + &quot;: the series stalled at i = &quot; + s.i);\n        return s.text();\n    }\n\n    /** Same loop as the monitor build; only the wake at the end is aimed instead of broadcast. */\n    private void serve(Series s, List&lt;Role&gt; roles, Condition[] w, int me) throws InterruptedException {\n        Role role = roles.get(me);\n        while (true) {\n            String token;\n            int at;\n            lock.lockInterruptibly();\n            try {\n                int n = 0;\n                while (!stopped &amp;&amp; !s.done() &amp;&amp; !role.ready(s)) { w[me].await(); n++; }\n                if (n &gt; 0) { wakeups.addAndGet(n); wasted.addAndGet(n - 1L); }\n                if (stopped || s.done()) { wakeAll(); return; }\n                try {\n                    token = role.act(s);\n                    s.emit(token);\n                    at = s.i;\n                } catch (RuntimeException e) { wakeAll(); throw e; }\n                handOff(s, roles, w);\n            } finally {\n                lock.unlock();\n            }\n            observers.publish(role.name(), token, at);\n        }\n    }\n\n    /**\n     * Wakes exactly the one role the last turn made ready. A signal sent to a role that is not asleep yet is simply\n     * dropped, and that is safe: it will re-check its guard under this same lock before it decides to wait.\n     */\n    private void handOff(Series s, List&lt;Role&gt; roles, Condition[] w) {\n        if (!s.done())\n            for (int k = 0; k &lt; roles.size(); k++)\n                if (roles.get(k).ready(s)) { w[k].signal(); return; }\n        wakeAll();                                          // the run is over: everybody has to be let go\n    }\n\n    /** Signals every per-role condition. Called only when the change concerns all of them: the end of the run, or stop(). */\n    private void wakeAll() {\n        for (Condition c : waits) c.signal();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>5 &middot; Do it with semaphores instead. No lock at all.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One <code>Semaphore</code> per role, all of them empty except the one whose guard holds on an untouched series. A thread touches the blackboard only while it holds its own permit, so there is exactly one writer at any instant and no lock is needed. When it has printed, it works out who goes next from the new state and releases that role's permit. Two things to say out loud. First, why it is safe without <code>volatile</code> anywhere: <code>release</code> and <code>acquire</code> are a happens-before edge, so everything the previous holder wrote is visible to the next one. Second, what it gives up: nobody re-checks a guard any more, so the acting thread has to compute the successor before it lets go &mdash; which is fine here because the guards are a partition, and is the reason a naive baton version cannot do FizzBuzz, where the next actor depends on the number. The acquire is timed, so a baton that is never passed fails instead of hanging.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Build 3, ladder rung three: no lock at all. One Semaphore per role, all empty except the one whose guard holds at\n * the start. A thread touches the blackboard only while it holds its own permit, and hands the baton on by releasing\n * the permit of whichever role the new state made ready. release/acquire is a happens-before edge, so the counter\n * written by one thread is visible to the next without a single synchronized block.\n */\nfinal class SemaphorePrinter implements SeriesPrinter {\n    private final Observers observers = new Observers();\n    private final AtomicLong wakeups = new AtomicLong();\n    private Sink sink = Sink.NONE;\n    private Clock clock = System::currentTimeMillis;\n    private long deadlineMs = 10_000;\n    private volatile boolean stopped;\n    private volatile Semaphore[] batons = new Semaphore[0];\n\n    /** Same seams again: sink, clock, deadline. */\n    void configure(Sink sink, Clock clock, long deadlineMs) {\n        this.sink = sink; this.clock = clock; this.deadlineMs = deadlineMs;\n    }\n\n    /** Registers a listener; here there is no lock to be outside of, but it is still called after the hand-off. */\n    void addObserver(StepObserver o) { observers.add(o); }\n\n    public String name() { return &quot;semaphore baton, no lock&quot;; }\n    public long wakeups() { return wakeups.get(); }\n    /** Always zero: a thread is handed the baton only when its own guard is already true. */\n    public long wastedWakeups() { return 0; }\n\n    /** Sets the flag, then gives every role a permit so that nobody is left parked on an acquire. */\n    public void stop() {\n        stopped = true;\n        for (Semaphore b : batons) b.release();\n    }\n\n    public String run(int n, List&lt;Role&gt; roles) throws InterruptedException {\n        stopped = false;\n        wakeups.set(0);\n        Series s = new Series(n, roles.size(), sink);\n        Semaphore[] b = new Semaphore[roles.size()];\n        for (int k = 0; k &lt; b.length; k++) b[k] = new Semaphore(0);\n        batons = b;\n        for (int k = 0; k &lt; b.length; k++)                  // the first baton goes to whoever is ready on an untouched series\n            if (roles.get(k).ready(s)) { b[k].release(); break; }\n        Crew.Result r = Crew.race(roles.size(), k -&gt; roles.get(k).name(),\n                                  me -&gt; serve(s, roles, b, me), clock, deadlineMs, this::stop);\n        if (r.error != null)\n            throw new IllegalStateException(name() + &quot;: a role threw&quot;, r.error);\n        if (!r.finished)\n            throw new IllegalStateException(name() + &quot;: the series did not finish in &quot; + deadlineMs + &quot; ms&quot;);\n        if (!stopped &amp;&amp; !s.done())\n            throw new IllegalStateException(name() + &quot;: the series stalled at i = &quot; + s.i + &quot; -- no role was ready to take the baton&quot;);\n        return s.text();\n    }\n\n    /** Hold the baton, act, pass it on. There is no while loop here because there is nothing to re-check: the permit IS the turn. */\n    private void serve(Series s, List&lt;Role&gt; roles, Semaphore[] b, int me) throws InterruptedEx

late(1015 64)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) per role</text></g><g transform=\"translate(30 110)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who should be woken next?</text><text x=\"165.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M360 129 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 110)\"><rect width=\"570\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">nobody keeps a list: each guard answers for itself</text><text x=\"285.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M990 129 H1015\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1015 110)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) / O(t) to aim</text></g><g transform=\"translate(30 156)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who is asleep right now?</text><text x=\"165.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M360 175 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 156)\"><rect width=\"570\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the Condition's own queue of parked threads</text><text x=\"285.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M990 175 H1015\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1015 156)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) park / wake</text></g><g transform=\"translate(30 202)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what has been printed so far?</text><text x=\"165.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M360 221 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 202)\"><rect width=\"570\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one StringBuilder, appended under the lock</text><text x=\"285.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M990 221 H1015\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1015 202)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) amortised</text></g><g transform=\"translate(30 248)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many participants are there?</text><text x=\"165.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M360 267 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 248)\"><rect width=\"570\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an int k on the blackboard, read by the guards</text><text x=\"285.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M990 267 H1015\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1015 248)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">nothing scans the output, nothing allocates per turn beyond the token itself, and there is no list of waiters of our own: each Condition already keeps one</text></svg></div><div class=\"move\"><p>This system has almost no collections, and that is worth saying out loud, because the instinct is to build a queue of waiting threads and a table of who goes next. Neither exists. \"Whose turn is it?\" is one <code>int</code>, and \"is it my turn?\" is one comparison per role: <code>i % 3 == 0</code>, or <code>phase == 1</code>. \"Who should be woken next?\" needs no structure at all, because every waiter can answer it for itself &mdash; which is precisely why this design handles FizzBuzz, where the number decides the next actor and no fixed hand-off order exists. \"Who is asleep?\" is the <code>Condition</code>'s own queue of parked threads, so parking is O(1) and waking is O(1). The one field that looks like bookkeeping earns its place: <code>k</code>, the participant count, is what lets the round-robin guard read <code>(i - 1) % k</code> and therefore lets k change while the series is running. Nothing scans, nothing allocates per turn beyond the token itself.</p></div><div class=\"move\"><h3>Move 6: one turn has a life cycle, and the order of the steps inside it is the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 415\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"700\" y=\"16\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">still not my turn &rarr; sleep again: this arrow is exactly why the check is a while, not an if</text><path d=\"M890 55 V30 H520 V55\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(140 55)\"><rect width=\"150\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">serve(s, role)</text><text x=\"75.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one thread, one role</text></g><path d=\"M290 76 H300\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(300 55)\"><rect width=\"140\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take the lock</text><text x=\"70.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">interruptibly</text></g><path d=\"M440 76 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 55)\"><rect width=\"185\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">park on the condition</text><text x=\"92.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock is RELEASED</text></g><path d=\"M635 76 H655\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(655 55)\"><rect width=\"130\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"65.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">woken</text><text x=\"65.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">somebody printed</text></g><path d=\"M785 76 H805\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(805 55)\"><rect width=\"165\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check the guard again</text><text x=\"82.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">under the lock</text></g><path d=\"M970 76 H990\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(990 55)\"><rect width=\"215\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"107.5\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">print, advance, signal</text><text x=\"107.5\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">then unlock, in that order</text></g><text x=\"25\" y=\"80\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">one turn</text><text x=\"25\" y=\"140\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">the lock</text><rect x=\"300\" y=\"122\" width=\"150\" height=\"32\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"375\" y=\"143\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--text)\">held by us</text><rect x=\"450\" y=\"122\" width=\"355\" height=\"32\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-dasharray=\"5 3\"/><text x=\"627\" y=\"143\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">held by NOBODY &mdash; await() gave it up while we slept</text><rect x=\"805\" y=\"122\" width=\"400\" height=\"32\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"1005\" y=\"143\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--text)\">held by us again, re-acquired before await() returned</text><rect x=\"20\" y=\"180\" width=\"1190\" height=\"220\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"202\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside one turn, and why it is this order</text><text x=\"35\" y=\"226\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1  lock.lockInterruptibly()        so a thread that ends up parked can still be cancelled</text><text x=\"35\" y=\"246\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2  while (!done &amp;&amp; !role.ready(s)) turn.await()        while, not if: a wake means \"look again\", never \"the turn is yours\"</text><text x=\"35\" y=\"266\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3  if (done) { turn.signalAll(); return; }        the way out, and it wakes the rest on the way</text><text x=\"35\" y=\"286\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4  token = role.act(s)        the guard was re-tested one line ago, so this is the same instant</text><text x=\"35\" y=\"306\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5  s.emit(token)        the append is INSIDE the lock, because the ORDER is the product</text><text x=\"35\" y=\"326\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">6  turn.signalAll()        still under the lock, so the change and the wake cannot be separated</text><text x=\"35\" y=\"346\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">7  unlock in a finally        an exception must never leave the lock held</text><text x=\"35\" y=\"366\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">8  then the listeners, outside the lock, in a try/catch</text><text x=\"35\" y=\"392\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a role that throws at step 4 signals the others before it rethrows, so nobody is stranded, and the counter is exactly where it was &mdash; the caller sees an exception, never a hang</text></svg></div><div class=\"move\"><p>Follow one turn along the clock. It takes the lock &mdash; interruptibly, so a thread that ends up parked can still be cancelled. It finds that it is not its turn and calls <code>turn.await()</code>, which does the thing that makes the whole design work: it releases the lock while the thread sleeps, and re-acquires it before returning. Another thread prints and signals; this thread wakes up &mdash; but a wake only means \"look again\", so it re-tests its own guard. Two things make that re-test necessary: the wake was broadcast to everybody, so it was very likely meant for someone else, and the JVM is allowed to return from <code>await</code> for no reason at all, which is a spurious wakeup. That is why the wait is a <code>while</code> and never an <code>if</code>; the arrow from \"woken\" goes back to the check, not forward to the print. Only when the guard is true does it print and advance, both still inside the lock because the order of the output <i>is</i> the product, then signal everybody, then unlock in a <code>finally</code>, then tell the listeners. A role that throws at the printing step signals the others before it rethrows, so nobody is stranded, and the caller gets an exception rather than a hang.</p></div><div class=\"move\"><h3>Move 7: yes, one lock means one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 390\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"560\" height=\"140\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about sixty-five nanoseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one guard test: a modulo and a comparison</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one append to a StringBuilder, one i++</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one signalAll onto the condition's queue</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">measured: 65 ns per turn on one thread, no waiting</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">nothing in here can block. Ever.</text></g><path d=\"M590 90 H650\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"620\" y=\"80\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(650 20)\"><rect width=\"550\" height=\"140\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"275.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: microseconds to milliseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">parking and unparking a thread: about 2 us</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the listeners, after the unlock, in a try/catch</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">a slow destination: a socket, a file, a screen</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the thread's own work before its next turn</text></g><text x=\"615\" y=\"182\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one token with four threads: what signalAll actually costs, and what an aimed signal saves</text><text x=\"25\" y=\"229\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">fizz  (acts)</text><rect x=\"150\" y=\"214\" width=\"480\" height=\"22\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"390\" y=\"229\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">acts</text><rect x=\"680\" y=\"214\" width=\"480\" height=\"22\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"920\" y=\"229\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">acts</text><text x=\"25\" y=\"259\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">number</text><rect x=\"150\" y=\"244\" width=\"480\" height=\"22\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"390\" y=\"259\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#ff6b6b\">wakes, still not mine, sleeps</text><rect x=\"680\" y=\"244\" width=\"480\" height=\"22\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"920\" y=\"259\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">one aimed signal: exactly the next actor</text><text x=\"25\" y=\"289\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">buzz</text><rect x=\"150\" y=\"274\" width=\"480\" height=\"22\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"390\" y=\"289\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#ff6b6b\">wakes, still not mine, sleeps</text><rect x=\"680\" y=\"274\" width=\"480\" height=\"22\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"920\" y=\"289\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">not woken at all</text><text x=\"25\" y=\"319\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">fizzbuzz</text><rect x=\"150\" y=\"304\" width=\"480\" height=\"22\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"390\" y=\"319\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#ff6b6b\">wakes, still not mine, sleeps</text><rect x=\"680\" y=\"304\" width=\"480\" height=\"22\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"920\" y=\"319\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">not woken at all</text><text x=\"390\" y=\"206\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">signalAll: one crowd</text><text x=\"920\" y=\"206\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">one condition per role: signal</text><text x=\"615\" y=\"356\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">measured on FizzBuzz to 20,000 with four threads: signalAll made 32,000 wakes of which 16,000 were wasted, and took 3.4 us a token;</text><text x=\"615\" y=\"376\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one condition per role made 16,000 wakes, wasted none, and took 2.1 us a token. The lock is 65 ns of that. The rest is putting threads to sleep and waking them again.</text></svg></div><div class=\"move\"><p>Inside the lock there is one modulo, one comparison, one append and one signal: measured on one thread with nothing to contend with, a whole turn is about sixty-five nanoseconds. Everything expensive is outside it &mdash; the listeners, the slow destination, the thread's own work &mdash; because nothing that can block is allowed inside. So the lock is not the cost; putting a thread to sleep and waking it up again is, and that is about two microseconds each time. The picture shows why. With one shared condition, the thread that prints wakes all three of the others; one of them can act and two look, find their guard still false, and go back to sleep. On FizzBuzz to 20,000 with four threads that is 32,000 wakes of which 16,000 are wasted, and 3.4 microseconds a token; aiming the wake at the one thread the turn just made ready halves both, to 16,000 wakes and 2.1 microseconds. That is the honest answer to \"is everything now one by one\": yes, and the one-by-one part costs sixty-five nanoseconds. The rest is the hand-off.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 282\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"290\" y=\"32\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">round robin, 50,000 tokens, measured on this machine</text><rect x=\"20\" y=\"44\" width=\"540\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"62.0\" font-size=\"10.5\" fill=\"var(--acc)\">threads</text><text x=\"130\" y=\"62.0\" font-size=\"10.5\" fill=\"var(--acc)\">ns per token</text><text x=\"270\" y=\"62.0\" font-size=\"10.5\" fill=\"var(--acc)\">wakes per token</text><text x=\"420\" y=\"62.0\" font-size=\"10.5\" fill=\"var(--acc)\">wasted per token</text><rect x=\"20\" y=\"72\" width=\"540\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"90.0\" font-size=\"11\" fill=\"var(--acc)\">1</text><text x=\"130\" y=\"90.0\" font-size=\"11\" fill=\"var(--text)\">65</text><text x=\"270\" y=\"90.0\" font-size=\"11\" fill=\"var(--text)\">0</text><text x=\"420\" y=\"90.0\" font-size=\"11\" fill=\"var(--text)\">0</text><rect x=\"20\" y=\"100\" width=\"540\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"118.0\" font-size=\"11\" fill=\"var(--acc)\">2</text><text x=\"130\" y=\"118.0\" font-size=\"11\" fill=\"var(--text)\">1,800</text><text x=\"270\" y=\"118.0\" font-size=\"11\" fill=\"var(--text)\">1.0</text><text x=\"420\" y=\"118.0\" font-size=\"11\" fill=\"var(--text)\">0.0</text><rect x=\"20\" y=\"128\" width=\"540\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"146.0\" font-size=\"11\" fill=\"var(--text)\">3</text><text x=\"130\" y=\"146.0\" font-size=\"11\" fill=\"var(--text)\">2,000 - 4,000</text><text x=\"270\" y=\"146.0\" font-size=\"11\" fill=\"var(--text)\">1.0 - 2.0</text><text x=\"420\" y=\"146.0\" font-size=\"11\" fill=\"var(--text)\">0.0 - 1.0</text><rect x=\"20\" y=\"156\" width=\"540\" height=\"28\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"174.0\" font-size=\"11\" fill=\"var(--text)\">4</text><text x=\"130\" y=\"174.0\" font-size=\"11\" fill=\"var(--text)\">3,500 - 6,000</text><text x=\"270\" y=\"174.0\" font-size=\"11\" fill=\"var(--text)\">1.7 - 3.0</text><text x=\"420\" y=\"174.0\" font-size=\"11\" fill=\"var(--text)\">0.7 - 2.0</text><rect x=\"20\" y=\"184\" width=\"540\" height=\"28\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"202.0\" font-size=\"11\" fill=\"var(--text)\">10</text><text x=\"130\" y=\"202.0\" font-size=\"11\" fill=\"var(--text)\">4,000 - 8,000</text><text x=\"270\" y=\"202.0\" font-size=\"11\" fill=\"var(--text)\">2.0 - 3.7</text><text x=\"420\" y=\"202.0\" font-size=\"11\" fill=\"var(--text)\">1.0 - 2.7</text><text x=\"290\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">one thread never waits: that row is the lock, the guard and the append alone.</text><text x=\"290\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">every row below it is the price of parking a thread and waking it again.</text><text x=\"290\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">past two threads the reading swings by half run to run: read the shape.</text><text x=\"890\" y=\"32\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the ladder, in the order you would climb it</text><g transform=\"translate(600 48)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1   one lock, one condition, signalAll</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">2 to 4 threads: simplest, correct for any guard set</text></g><g transform=\"translate(600 106)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2   one condition per role, aimed signal</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no wasted wakes; 3.4 us -> 2.1 us a token at four threads</text></g><g transform=\"translate(600 164)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3   a semaphore baton, no lock at all</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the permit IS the turn; release/acquire is the memory fence</text></g><text x=\"900\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">rung 3 gives up the one thing rung 1 had: a waiter that re-checks its own</text><text x=\"900\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">guard. And it is not even faster here &mdash; 2.4 us against rung 2's 2.1 &mdash;</text><text x=\"900\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">so climb it for the idea, not for the clock.</text></svg></div><div class=\"move\"><p>Measure before you climb. A round robin of 50,000 tokens on this machine: one thread, which never waits, is 65 nanoseconds a token; two threads is 1,800. That one step is the whole lesson &mdash; nearly thirty times slower, and it is not the lock, it is the first park and unpark. Past two threads the reading swings by half from one run to the next, so read the shape rather than the digits: the curve tracks wasted wakes per token, which is zero at two threads and one to three at ten. Then the ladder, cheapest first. Rung one is what is already written: one lock, one condition, <code>signalAll</code>. Rung two keeps the lock and gives each role its own <code>Condition</code>, so the thread that just printed can find the single role whose guard is now true and signal only that one. Rung three drops the lock altogether: each role holds its own permit, and the acting thread releases the permit of whoever goes next &mdash; <code>release</code> and <code>acquire</code> are a happens-before edge, so the counter written by one thread is visible to the next without a single <code>synchronized</code> block. What rung three gives up is the thing rung one had, a waiter that re-checks for itself: somebody now has to work out who goes next before releasing. And say the unflattering part out loud, because it is the senior half of the answer &mdash; on this machine rung three is not even faster than rung two, 2.4 microseconds a token against 2.1. You climb to rung three for the idea that a permit can be a turn, not for the clock.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 352\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">if instead of while around await</text></g><path d=\"M360 37 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 18)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">re-test the guard in a loop, always; test 5 &mdash; 400 tokens under a storm of stray signals</text></g><g transform=\"translate(30 60)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">notify() on one shared wait set</text></g><path d=\"M360 79 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 60)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">notifyAll, or one Condition per role; five builds in ExtDemo return the same string</text></g><g transform=\"translate(30 102)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the append moved outside the lock</text></g><path d=\"M360 121 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 102)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">emit under the lock &mdash; the ORDER is the product; tests 1, 2, 3</text></g><g transform=\"translate(30 144)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a guard set with a hole in it</text></g><path d=\"M360 163 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 144)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the deadline turns a stall into an exception; test 11 &mdash; fails in 620 ms</text></g><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a role that throws half way through</text></g><path d=\"M360 205 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 186)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">signal the others, then rethrow; test 12 &mdash; 9 turns committed, nobody stranded</text></g><g transform=\"translate(30 228)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a waiter is interrupted while parked</text></g><path d=\"M360 247 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 228)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the finally releases the lock; test 16 &mdash; the run fails at its deadline, the printer still works</text></g><g transform=\"translate(30 270)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">nobody wakes the sleepers at the end</text></g><path d=\"M360 289 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 270)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the last turn and stop() both signalAll; tests 13 and 14</text></g><text x=\"615\" y=\"338\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">eighteen checks in FailureTests.java, every wait on a deadline and a forty-five second watchdog behind the lot: a turn-taking test that hangs is a failed turn-taking test</text></svg></div><div class=\"move\"><p>An <code>if</code> instead of a <code>while</code> around the wait, so a broadcast or spurious wakeup lets a thread print out of turn &mdash; under a thread that does nothing but <code>signalAll</code>, the broken version got the sequence wrong in forty rounds out of forty. A single <code>notify()</code> on one shared wait set, which hands the one wakeup to an arbitrary sleeper, very likely one whose guard is false, so the thread that could have acted sleeps forever. Moving the append outside the lock, which is the subtle one: the <i>decision</i> is protected but the <i>order</i> is not, and the order is the product. A guard set with a hole in it, so nobody can act and the program hangs &mdash; the deadline turns that into an exception in 620 milliseconds instead. A role that throws half way through a turn. A waiter that somebody interrupts. And a shutdown that never wakes the sleepers. Each of those is a few lines in FailureTests.java: eighteen checks, every wait on a deadline, and a forty-five second watchdog behind the lot.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 388\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"850\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Monitor object</text><text x=\"220\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">one ReentrantLock + one Condition, private to the printer</text><text x=\"850\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">the blackboard is only touched under the lock</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">interface Role { ready(s); act(s); } &mdash; one Rule per thread</text><text x=\"850\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">foo, zero and fizz are data, not branches</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Strategy again</text><text x=\"220\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">interface SeriesPrinter, five implementations</text><text x=\"850\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">the hand-off swaps; no guard changes</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">AuditRole implements Role and wraps one</text><text x=\"850\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">an audit trail with no edit to the engine</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">observers.publish(...) after the unlock, in a try/catch</text><text x=\"850\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">a dashboard can never stall a turn</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"220\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">the while loop IS the state machine of one turn</text><text x=\"850\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">a wake goes back to the check, never to the print</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">Producer-Consumer's cousin</text><text x=\"220\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">every move</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">wait for a condition, act, signal &mdash; the monitor protocol</text><text x=\"850\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">say the name: this is the shape, without a buffer</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"220\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">nearly</text><text x=\"310\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Roles.fizzBuzz() returns List.of(...) &mdash; one static method</text><text x=\"850\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the full name when a series arrives from config</text><rect x=\"20\" y=\"290\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"220\" y=\"309.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">a printer is built per run and handed its roles</text><text x=\"850\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh one per case</text><rect x=\"20\" y=\"320\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"220\" y=\"339.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"310\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">configure(sink, clock, deadline): three arguments</text><text x=\"850\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">a builder here would be pure ceremony</text><text x=\"615\" y=\"372\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>Every name in that table is the result of a move, and naming them in that order is what an interviewer is listening for: <b>monitor object</b> from move 4, <b>Strategy</b> twice from move 3, <b>Decorator</b> from the same move's <code>AuditRole</code>, <b>Observer</b> from move 4's rule that a listener is never inside the lock, and <b>State</b> from move 6, where the <code>while</code> loop literally is the state machine of one turn. Say the family name too, because interviewers notice when you do not: this is the monitor protocol, producer-consumer without a buffer. Then say what is <i>not</i> earned, which is the half most candidates skip. Factory is nearly: <code>Roles.fizzBuzz()</code> does build a family, but it is one static method returning a list, and it earns the full name the day a series arrives as a string from configuration. Singleton earned nothing, which is exactly why a test can build a fresh printer per case. Builder never: three arguments to <code>configure</code>.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"450\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"550\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"450\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"550\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Series holds the state. Role decides. The printer synchronises. Three reasons, three types.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"450\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"550\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">foobarbaz and H2O are new guard sets; serve() is not touched</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"450\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"550\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">role.ready(s); role.act(s);  never \"is this the fizz one?\" &mdash; AuditRole drops straight in</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one job each</text><text x=\"450\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"550\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">Sink, Clock and StepObserver have one method; Role has a guard and an action</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; be handed the rest</text><text x=\"450\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"550\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">configure(sink, clock, deadline): a test hands in a clock already past the deadline</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>SOLID is not a list to recite here; it is the check that the moves did their job, and the table gives each letter its one line of code. Three of them are worth saying out loud in the room. S is the split that carries everything: because the blackboard, the rule and the synchronisation are three types, the guards can be unit-tested with no threads at all. O is the one the interviewer will test on purpose: adding a baz thread, or switching to H2O, is a new guard set and one more element in a list, and <code>serve</code> is never edited. D is what makes the awkward cases testable: the printer is handed its clock, so a test can supply one whose every reading is a thousand seconds later and watch the printer give up in six milliseconds of real time.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 345\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"330\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">add a baz thread; now do H2O</text></g><path d=\"M360 44 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 20)\"><rect width=\"660\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"24.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new guard set behind Role; the turn loop is not touched</text></g><text x=\"1150\" y=\"49\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">which thread printed what</text></g><path d=\"M360 102 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"24.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AuditRole around any role, or one more observer after the unlock</text></g><text x=\"1150\" y=\"107\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 3 + 4</text><g transform=\"translate(30 136)\"><rect width=\"330\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an endless stream I can stop</text></g><path d=\"M360 160 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 136)\"><rect width=\"660\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"24.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a flag the wait loops already read, then signalAll on the way out</text></g><text x=\"1150\" y=\"165\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 194)\"><rect width=\"330\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across participants</text><text x=\"165.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">threads join and leave mid-run</text></g><path d=\"M360 218 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 194)\"><rect width=\"660\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same lock: bump k under it and start the thread inside it</text><text x=\"330.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the guard is (i - 1) % k, so exactly one is still true at every step</text></g><text x=\"1150\" y=\"223\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 4 + 5</text><g transform=\"translate(30 252)\"><rect width=\"330\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the sequence must survive a restart</text></g><path d=\"M360 276 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 252)\"><rect width=\"660\" height=\"48\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the counter becomes a committed offset in an append-only log</text><text x=\"330.0\" y=\"34.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">append, hand the turn on, commit the offset last: a crash replays one token</text></g><text x=\"1150\" y=\"281\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 6</text><text x=\"615\" y=\"330\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the lock, the condition and the while loop are untouched; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>The first three rows are read straight off the picture and take no thought: a new guard set, one more observer, one more flag that the wait loops already read. The last two are the ones worth rehearsing. Threads that join and leave mid-run work only because the guard is <code>(i - 1) % k</code> with k read from the blackboard: bump k under the lock and start the newcomer's thread inside the same critical section, and exactly one guard is still true at every step. Surviving a restart is about order, not storage: append the token and make it durable, hand the turn on, and commit the counter <i>last</i>, so a crash replays one token rather than losing one, and whoever reads the log has to tolerate a repeat. For all five twists the lock, the condition and the while loop do not move, and that is the test that the derivation was right.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 795\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d= " y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ConditionPrinter</text><line x1=\"0\" y1=\"26\" x2=\"205\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">waits: Condition[]</text><line x1=\"0\" y1=\"48\" x2=\"205\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">signal, not signalAll</text></g><g transform=\"translate(1015 300)\"><rect width=\"205\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"102.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SemaphorePrinter</text><line x1=\"0\" y1=\"26\" x2=\"205\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">batons: Semaphore[]</text><line x1=\"0\" y1=\"48\" x2=\"205\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">no lock at all</text></g><g><path d=\"M20 768L64 768\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"772\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 768L284 768\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"772\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 768L504 768\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"772\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 768L684 768\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"772\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 768L904 768\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"772\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the type name. A dashed green border means an interface; &laquo;ext&raquo; means the class lives in Extensions.java rather than in Main.java. Middle: its fields, the state it holds. Bottom: its methods, with <code>[lock held]</code> on the two calls that are only ever made from inside the critical section and <code>[after unlock]</code> on the one that must never be. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the printer owns its lock, its condition, its listener list and the <code>Series</code> it builds for each run, and they die with it. Dashed green = handed in through <code>configure()</code> or as an argument to <code>run</code>. Dotted blue = notifies. <b>Where state lives:</b> every mutable field in this design is inside <code>Series</code> or inside <code>MonitorPrinter</code>, and both are reachable only under the one lock &mdash; that is the whole safety argument, and it is why a <code>Role</code> is handed the series rather than being given fields of its own. The waiting room at the bottom is not a class either: it is the queue of parked threads the lock keeps for its <code>Condition</code>. Two more builds live in Extensions.java behind the same interface &mdash; <code>synchronized</code>/<code>wait</code>/<code>notifyAll</code> and a <code>Phaser</code> barrier &mdash; and both are on page 05.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does and what it guarantees; read only those first for the shape, then the bodies. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (eighteen checks, every wait on a deadline; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n/**\n * Where a finished token also goes, besides the ordered record kept by the Series. Handed in, so the same printer\n * can build a string for a test, write to System.out, or queue bytes for a socket without the turn loop changing.\n */\ninterface Sink {\n    /** Called with one token at a time, in order, while the printer&#x27;s lock is held: it must be fast and must not block. */\n    void emit(String token);\n    /** The default sink: the ordered record is enough, nothing else needs the token. */\n    Sink NONE = token -&gt; { };\n}\n\n/** Where &quot;now&quot; comes from, so a test can decide what the clock says instead of waiting for a deadline to pass. */\ninterface Clock {\n    /** Milliseconds since some fixed point; only differences are used. */\n    long nowMs();\n}\n\n/** Told after every finished turn, outside the lock, so a slow or broken listener can never stall the series. */\ninterface StepObserver {\n    /** role = who acted, token = what it emitted, at = the value of the counter after the turn. */\n    void onStep(String role, String token, int at);\n}\n\n/**\n * The blackboard every thread waits on: the counter, the phase flag, how many participants there are, and the\n * ordered record of what has been emitted. Nothing here is synchronized itself. Every field is touched only by a\n * thread that holds the printer&#x27;s lock (or, in the semaphore build, only by the thread holding the baton), which\n * is the whole safety argument of this design.\n */\nfinal class Series {\n    /** The last number in the series; the run ends once i has passed it. */\n    final int n;\n    /** The next number to be emitted, 1..n. Most guards are written against this. */\n    int i = 1;\n    /** Whose turn it is among roles that alternate rather than read the number: FooBar and ZeroEvenOdd use it, FizzBuzz does not. */\n    int phase = 0;\n    /** How many participants are in the round robin right now; the elastic roster in Extensions.java changes it mid-run. */\n    int k;\n    private final StringBuilder text = new StringBuilder();\n    private final Sink sink;\n\n    Series(int n, int k, Sink sink) { this.n = n; this.k = k; this.sink = sink; }\n\n    /** True once every number has been emitted. Every guard loop tests it too, so nobody waits past the end. */\n    boolean done() { return i &gt; n; }\n\n    /** Appends one token to the ordered record and forwards it to the sink. Called under the lock: the ORDER is the product. */\n    void emit(String token) { text.append(token); sink.emit(token); }\n\n    /** The whole sequence, read only after every participating thread has finished. */\n    String text() { return text.toString(); }\n}\n\n/**\n * One participating thread&#x27;s rule: when it may act, and what it emits when it does. This is the only thing that\n * differs between FooBar, ZeroEvenOdd and FizzBuzz; the turn loop never changes.\n */\ninterface Role {\n    /** The name used in the thread name and in the observer. */\n    String name();\n    /** The guard: may this role act right now? Read under the lock, and re-read after every single wake. */\n    boolean ready(Series s);\n    /** Advances the counter or the phase and returns the token the printer will emit. Runs under the lock and must not block. */\n    String act(Series s);\n}\n\n/** A Role assembled from two lambdas, so a new participant is one object rather than one file. */\nfinal class Rule implements Role {\n    private final String name;\n    private final Predicate&lt;Series&gt; guard;\n    private final Function&lt;Series, String&gt; body;\n\n    Rule(String name, Predicate&lt;Series&gt; guard, Function&lt;Series, String&gt; body) {\n        this.name = name; this.guard = guard; this.body = body;\n    }\n\n    public String name() { return name; }\n    public boolean ready(Series s) { return guard.test(s); }\n    public String act(Series s) { return body.apply(s); }\n}\n\n/**\n * The three classic series, and a round robin of any size, written as guards over the blackboard. Nothing in here\n * mentions a thread, a lock or a wait: that is the point of the split.\n */\nfinal class Roles {\n    private Roles() { }\n\n    /** Two threads alternating on the phase flag: foo prints, bar prints and closes the round. */\n    static List&lt;Role&gt; fooBar() {\n        return List.of(\n            new Rule(&quot;foo&quot;, s -&gt; s.phase == 0, s -&gt; { s.phase = 1; return &quot;foo&quot;; }),\n            new Rule(&quot;bar&quot;, s -&gt; s.phase == 1, s -&gt; { s.phase = 0; s.i++; return &quot;bar&quot;; }));\n    }\n\n    /** Three threads: zero fires before every number, then even or odd prints it, whichever matches the parity. */\n    static List&lt;Role&gt; zeroEvenOdd() {\n        return List.of(\n            new Rule(&quot;zero&quot;, s -&gt; s.phase == 0, s -&gt; { s.phase = 1; return &quot;0&quot;; }),\n            new Rule(&quot;even&quot;, s -&gt; s.phase == 1 &amp;&amp; s.i % 2 == 0, s -&gt; { s.phase = 0; return Integer.toString(s.i++); }),\n            new Rule(&quot;odd&quot;,  s -&gt; s.phase == 1 &amp;&amp; s.i % 2 == 1, s -&gt; { s.phase = 0; return Integer.toString(s.i++); }));\n    }\n\n    /** Four threads and no phase flag at all: the number itself says whose turn it is, and the four guards partition every i. */\n    static List&lt;Role&gt; fizzBuzz() {\n        return List.of(\n            new Rule(&quot;number&quot;,   s -&gt; s.i % 3 != 0 &amp;&amp; s.i % 5 != 0, s -&gt; Integer.toString(s.i++)),\n            new Rule(&quot;fizz&quot;,     s -&gt; s.i % 3 == 0 &amp;&amp; s.i % 5 != 0, s -&gt; { s.i++; return &quot;fizz&quot;; }),\n            new Rule(&quot;buzz&quot;,     s -&gt; s.i % 5 == 0 &amp;&amp; s.i % 3 != 0, s -&gt; { s.i++; return &quot;buzz&quot;; }),\n            new Rule(&quot;fizzbuzz&quot;, s -&gt; s.i % 15 == 0,                s -&gt; { s.i++; return &quot;fizzbuzz&quot;; }));\n    }\n\n    /** k threads taking strict turns: thread j prints exactly the numbers where (i - 1) % k == j. */\n    static List&lt;Role&gt; roundRobin(int k) {\n        List&lt;Role&gt; out = new ArrayList&lt;&gt;();\n        for (int j = 0; j &lt; k; j++) {\n            final int me = j;\n            out.add(new Rule(&quot;t&quot; + me,\n                             s -&gt; me &lt; s.k &amp;&amp; (s.i - 1) % s.k == me,\n                             s -&gt; Integer.toString(s.i++) + &quot; &quot;));\n        }\n        return out;\n    }\n}\n\n/** The listener list, owned by every build. Every call happens with no lock held and inside a try/catch. */\nfinal class Observers {\n    private final List&lt;StepObserver&gt; list = new CopyOnWriteArrayList&lt;&gt;();\n\n    /** Adds a listener. Safe to call while a series is running. */\n    void add(StepObserver o) { list.add(o); }\n\n    /** Called after the unlock: a slow listener only slows its own thread, and one that throws is ignored. */\n    void publish(String role, String token, int at) {\n        for (StepObserver o : list) {\n            try { o.onStep(role, token, at); } catch (RuntimeException ignored) { }\n        }\n    }\n}\n\n/**\n * Spins one thread per role, releases them all on one latch, and joins them against a deadline. A run that would\n * hang (a guard that is never true, a wake-up that never came) becomes a finished call that reports the stall, so\n * no test in this project can ever hang a build.\n */\nfinal class Crew {\n    /** The body of one participating thread, identified by its index in the role list. */\n    interface Body { void serve(int index) throws InterruptedException; }\n\n    /** What happened: did every thread finish inside the deadline, and did any of them throw? */\n    static final class Result {\n        final boolean finished;\n        final Throwable error;\n        Result(boolean finished, Throwable error) { this.finished = finished; this.error = error; }\n    }\n\n    /**\n     * Starts size threads, releases them together, and waits until the deadline. If any is still alive it calls\n     * stopper (which must wake every waiter), then interrupts, then gives up and reports finished = false.\n     */\n    static Result race(int size, IntFunction&lt;String&gt; names, Body body, Clock clock, long deadlineMs, Runnable stopper)\n            throws InterruptedException {\n        AtomicReference&lt;Throwable&gt; boom = new AtomicReference&lt;&gt;();\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Thread&gt; ts = new ArrayList&lt;&gt;();\n        for (int k = 0; k &lt; size; k++) {\n            final int me = k;\n            Thread t = new Thread(() -&gt; {\n                try { go.await(); body.serve(me); }\n                catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n                catch (Throwable e) { boom.compareAndSet(null, e); }\n            }, &quot;role-&quot; + names.apply(k));\n            ts.add(t);\n            t.start();\n        }\n        go.countDown();                                   // every thread starts on the same instant\n        long end = clock.nowMs() + deadlineMs;\n        for (Thread t : ts) t.join(Math.max(1L, end - clock.nowMs()));\n        boolean finished = true;\n        for (Thread t : ts) if (t.isAlive()) finished = false;\n        if (!finished) {\n            stopper.run();                                // the polite way out: set the flag and wake everybody\n            for (Thread t : ts) t.join(300);\n            for (Thread t : ts) t.interrupt();            // the rude way out, so the JVM can still exit\n            for (Thread t : ts) t.join(300);\n        }\n        return new Result(finished, boom.get());\n    }\n}\n\n/**\n * The contract the three builds share: run a series to n with one thread per role and hand back the sequence.\n * Swapping the build must not change a single character of the output, which is exactly what the tests check.\n */\ninterface SeriesPrinter {\n    /** Runs the series and returns the emitted sequence. Throws IllegalStateException if the threads stall instead of finishing. */\n    String run(int n, List&lt;Role&gt; roles) throws InterruptedException;\n    /** The name of this build, used when reporting the arithmetic. */\n    String name();\n    /** How many times a thread came back from a wait during the last run. */\n    long wakeups();\n    /** How many of those wakes found the guard still false: the thundering herd, counted. */\n    long wastedWakeups();\n    /** Ends a run early: every waiting thread wakes, sees the flag, and leaves. */\n    void stop();\n}\n\n/**\n * Build 1, the default: one ReentrantLock and ONE shared Condition. Every turn ends with signalAll, every waiter\n * re-checks its own guard, and exactly one of them finds it true. Correct for any guard set, including one whose\n * next actor depends on the data (FizzBuzz); the price is that t-1 threads wake for nothing on every token.\n */\nfinal class MonitorPrinter implements SeriesPrinter {\n    private final ReentrantLock lock;\n    private final Condition turn;\n    private final Observers observers = new Observers();\n    private final AtomicLong wakeups = new AtomicLong(), wasted = new AtomicLong();\n    private Sink sink = Sink.NONE;\n    private Clock clock = System::currentTimeMillis;\n    private long deadlineMs = 10_000;\n    private volatile boolean stopped;\n\n    MonitorPrinter() { this(false); }\n\n    /** fair = hand the lock out in arrival order. Slower, and only bought when one role is genuinely being starved. */\n    MonitorPrinter(boolean fair) { lock = new ReentrantLock(fair); turn = lock.newCondition(); }\n\n    /** Hands in the three things the printer must never build for itself: where tokens go, where time comes from, how long to wait. */\n    void configure(Sink sink, Clock clock, long deadlineMs) {\n        this.sink = sink; this.clock = clock; this.deadlineMs = deadlineMs;\n    }\n\n    /** Registers a listener. It is called after the unlock, never inside it. */\n    void addObserver(StepObserver o) { observers.add(o); }\n\n    public String name() { return &quot;monitor: one condition, signalAll&quot;; }\n    public long wakeups() { return wakeups.get(); }\n    public long wastedWakeups() { return wasted.get(); }\n\n    /** Sets the stop flag under the lock and wakes every waiter, so a signal can never be lost against it. */\n    public void stop() {\n        lock.lock();\n        try { stopped = true; turn.signalAll(); } finally { lock.unlock(); }\n    }\n\n    /** A pure spurious wakeup: takes the lock, changes nothing, and wakes everybody. Used by the tests to hammer the guard loop. */\n    void nudge() {\n        lock.lock();\n        try { turn.signalAll(); } finally { lock.unlock(); }\n    }\n\n    public String run(int n, List&lt;Role&gt; roles) throws InterruptedException {\n        stopped = false;\n        wakeups.set(0);\n        wasted.set(0);\n        Series s = new Series(n, roles.size(), sink);\n        Crew.Result r = Crew.race(roles.size(), k -&gt; roles.get(k).name(),\n                                  me -&gt; serve(s, roles.get(me)), clock, deadlineMs, this::stop);\n        if (r.error != null)\n            throw new IllegalStateException(name() + &quot;: a role threw; the counter never moved and nobody was stranded&quot;, r.error);\n        if (!r.finished)\n            throw new IllegalStateException(name() + &quot;: the series did not finish in &quot; + deadlineMs + &quot; ms -- a thread is still waiting&quot;);\n        if (!stopped &amp;&amp; !s.done())\n            throw new IllegalStateException(name() + &quot;: the series stalled at i = &quot; + s.i + &quot; -- no guard was true, so nobody could act&quot;);\n        return s.text();\n    }\n\n    /**\n     * One participant&#x27;s whole life. Wait while it is not this role&#x27;s turn, act, wake everybody, then tell the\n     * listeners with the lock released. The wait is a while loop because a wake only means &quot;look again&quot;.\n     */\n    private void serve(Series s, Role role) throws InterruptedException {\n        while (true) {\n            String token;\n            int at;\n            lock.lockInterruptibly();                       // interruptibly, so a parked role can still be cancelled\n            try {\n                int waits = 0;\n                while (!stopped &amp;&amp; !s.done() &amp;&amp; !role.ready(s)) {\n                    turn.await();                           // the lock is RELEASED while this thread sleeps\n                    waits++;\n                }\n                if (waits &gt; 0) { wakeups.addAndGet(waits); wasted.addAndGet(waits - 1L); }\n                if (stopped || s.done()) { turn.signalAll(); return; }   // wake the rest on the way out\n                try {\n                    token = role.act(s);                    // decide the token and advance the counter: one step\n                    s.emit(token);                          // the ordered record, INSIDE the lock: the order is the product\n                    at = s.i;\n                } catch (RuntimeException e) {\n                    turn.signalAll();                       // a broken role must not strand the others\n                    throw e;\n                }\n                turn.signalAll();                           // one crowd; exactly one guard is now true\n            } finally {\n                lock.unlock();                              // in a finally, always: an exception must never leave the lock held\n            }\n            observers.publish(role.name(), token, at);      // only now, outside the lock\n        }\n    }\n}\n\n/**\n * Build 2, ladder rung two: the same lock, but one Condition per role. A turn ends by finding the single role whose\n * guard the turn just made true and signalling only that one, so no thread ever wakes for nothing. The cost is a\n * scan of the guards under the lock and one Condition object per participant.\n */\nfinal class ConditionPrinter implements SeriesPrinter {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Observers observers = new Observers();\n    private final AtomicLong wakeups = new AtomicLong(), wasted = new AtomicLong();\n    private Sink sink = Sink.NONE;\n    private Clock clock = System::currentTimeMillis;\n    private long deadlineMs = 10_000;\n    private volatile boolean stopped;\n    private volatile Condition[] waits = new Condition[0];\n\n    /** Same seams as the monitor build: the sink, the clock and the deadline are handed in. */\n    void configure(Sink sink, Clock clock, long deadlineMs) {\n        this.sink = sink; this.clock = clock; this.deadlineMs = deadlineMs;\n    }\n\n    /** Registers a listener, called after the unlock. */\n    void addObserver(StepObserver o) { observers.add(o); }\n\n    public String name() { return &quot;one condition per role, signal&quot;; }\n    public long wakeups() { return wakeups.get(); }\n    public long wastedWakeups() { return wasted.get(); }\n\n    /** Sets the flag under the lock and wakes every per-role condition, because a shutdown concerns all of them at once. */\n    public void stop() {\n        lock.lock();\n        try { stopped = true; wakeAll(); } finally { lock.unlock(); }\n    }\n\n    public String run(int n, List&lt;Role&gt; roles) throws InterruptedException {\n        stopped = false;\n        wakeups.set(0);\n        wasted.set(0);\n        Seri

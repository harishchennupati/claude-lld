ception {\n        Role role = roles.get(me);\n        while (true) {\n            if (!b[me].tryAcquire(deadlineMs, TimeUnit.MILLISECONDS)) return;    // a timed acquire, so a lost baton fails instead of hanging\n            wakeups.incrementAndGet();\n            if (stopped || s.done()) { releaseAll(b); return; }\n            String token = role.act(s);\n            s.emit(token);\n            int at = s.i;\n            int next = -1;\n            if (!s.done())\n                for (int k = 0; k &lt; roles.size(); k++)\n                    if (roles.get(k).ready(s)) { next = k; break; }\n            if (next &gt;= 0) b[next].release(); else releaseAll(b);\n            observers.publish(role.name(), token, at);\n        }\n    }\n\n    /** Ends the run for everybody: one permit each, so every thread wakes, sees the state, and leaves. */\n    private void releaseAll(Semaphore[] b) {\n        for (Semaphore x : b) x.release();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; Write it with synchronized, wait and notify. Where exactly does notify() lose a wakeup?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The shape is identical: <code>synchronized</code> instead of <code>lock()</code>, <code>monitor.wait()</code> instead of <code>await()</code>, <code>notifyAll()</code> instead of <code>signalAll()</code>, and the same <code>while</code> around the wait. The one thing that cannot be changed is the plural. An object has exactly one wait set, so <code>notify()</code> picks an arbitrary sleeper; with four FizzBuzz threads the chance that it picks the one whose guard is now true is one in three, and when it picks wrong that thread re-checks, finds nothing, and goes back to sleep &mdash; the wakeup is spent and the thread that could have acted is never told. That is a lost wakeup and it is a hang, not a wrong answer. You cannot aim a wake-up with one wait set; that is exactly what one <code>Condition</code> per role buys, and it is why <code>ReentrantLock</code> exists.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the classic synchronized / wait / notifyAll version\n\n/**\n * The same design with the language&#x27;s built-in monitor instead of a Lock: synchronized, wait and notifyAll. It is\n * the version most people write first and it is correct, with one rule that cannot be broken -- an object has only\n * ONE wait set, so notify() (singular) would hand the single wake-up to an arbitrary sleeper, very likely one whose\n * guard is still false, and the thread that could have acted stays asleep forever. That is a lost wakeup, and it is\n * why this version must say notifyAll. What it cannot do is aim a wake-up: for that you need one Condition per\n * role, which is exactly why ConditionPrinter exists.\n */\nfinal class SynchronizedPrinter implements SeriesPrinter {\n    private final Object monitor = new Object();\n    private final Observers observers = new Observers();\n    private final AtomicLong wakeups = new AtomicLong(), wasted = new AtomicLong();\n    private volatile boolean stopped;\n    private long deadlineMs = 10_000;\n\n    public String name() { return &quot;synchronized / wait / notifyAll&quot;; }\n    public long wakeups() { return wakeups.get(); }\n    public long wastedWakeups() { return wasted.get(); }\n\n    /** Registers a listener, called once the synchronized block has been left. */\n    void addObserver(StepObserver o) { observers.add(o); }\n\n    /** Sets the flag inside the monitor and wakes the whole wait set. */\n    public void stop() {\n        synchronized (monitor) { stopped = true; monitor.notifyAll(); }\n    }\n\n    public String run(int n, List&lt;Role&gt; roles) throws InterruptedException {\n        stopped = false;\n        wakeups.set(0);\n        wasted.set(0);\n        Series s = new Series(n, roles.size(), Sink.NONE);\n        Crew.Result r = Crew.race(roles.size(), k -&gt; roles.get(k).name(),\n                                  me -&gt; serve(s, roles.get(me)), System::currentTimeMillis, deadlineMs, this::stop);\n        if (r.error != null) throw new IllegalStateException(name() + &quot;: a role threw&quot;, r.error);\n        if (!r.finished || (!stopped &amp;&amp; !s.done())) throw new IllegalStateException(name() + &quot;: the series stalled&quot;);\n        return s.text();\n    }\n\n    /** The identical shape: wait in a while loop, act, wake the whole set, publish outside the monitor. */\n    private void serve(Series s, Role role) throws InterruptedException {\n        while (true) {\n            String token;\n            int at;\n            synchronized (monitor) {\n                int w = 0;\n                while (!stopped &amp;&amp; !s.done() &amp;&amp; !role.ready(s)) { monitor.wait(); w++; }\n                if (w &gt; 0) { wakeups.addAndGet(w); wasted.addAndGet(w - 1L); }\n                if (stopped || s.done()) { monitor.notifyAll(); return; }\n                token = role.act(s);\n                s.emit(token);\n                at = s.i;\n                monitor.notifyAll();        // notify() here would be a lost-wakeup bug: one wait set, t sleepers\n            }\n            observers.publish(role.name(), token, at);\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; Why not just spin until it is my turn? It would be faster.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Sometimes it is, and that is the trap. Spinning is correct here &mdash; the guard test and the print are still one step under the lock &mdash; and on an idle machine with fewer threads than cores it can beat blocking, because it never pays the two microseconds of a park and an unpark. The measurement is the answer. With two threads on this ten-core machine you cannot tell the two apart: about 2.5 microseconds a token either way, and which one wins changes between runs. At four threads they are still inside that noise. At thirty-two threads on ten cores the gap stops being subtle, and it is there on every single run: about 50 microseconds a token spinning against about 15 blocking. A spinner holds a core whether or not it has anything to do, so as soon as there are more participants than cores every spinner is stealing time from the one thread that could make progress. <code>Thread.onSpinWait()</code> tells the CPU what is happening but does not give the core back. Say the rule: spin only when the wait is shorter than a context switch and you know the thread count.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: busy-waiting, and what it really costs\n\n/**\n * No waiting at all: take the lock, look, drop it, look again. It is correct -- the check and the act are still one\n * step under the lock -- and on an idle machine with fewer threads than cores it can even beat the blocking version,\n * because it never pays the two microseconds of a park and an unpark. It is still the wrong answer, and the reason\n * is the row ExtDemo prints for thirty-two threads: a spinner holds a core whether or not it has anything to do, so\n * as soon as there are more participants than cores every spinner is stealing time from the one thread that could\n * actually make progress. Thread.onSpinWait() tells the CPU what is going on but does not give the core back.\n */\nfinal class SpinPrinter {\n    private final ReentrantLock lock = new ReentrantLock();\n\n    /** Runs the series by spinning; gives up at the deadline so a demo can never hang. */\n    String run(int n, List&lt;Role&gt; roles, long deadlineMs) throws InterruptedException {\n        Series s = new Series(n, roles.size(), Sink.NONE);\n        long end = System.nanoTime() + deadlineMs * 1_000_000L;\n        Crew.race(roles.size(), k -&gt; roles.get(k).name(), me -&gt; {\n            Role role = roles.get(me);\n            while (System.nanoTime() &lt; end) {\n                lock.lock();\n                try {\n                    if (s.done()) return;\n                    if (role.ready(s)) { s.emit(role.act(s)); continue; }\n                } finally { lock.unlock(); }\n                Thread.onSpinWait();                 // burn the core until it is our turn\n            }\n        }, System::currentTimeMillis, deadlineMs + 500, () -&gt; { });\n        return s.text();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; The tokens go to a socket now, and it is slow. What changes, and what must not?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>What must not change is where the <i>order</i> is decided: the append to the sequence stays inside the lock, because the order is the product and two threads publishing after the unlock would publish in whatever order the scheduler liked. What changes is what \"publish\" means. A sink that writes straight through is called with the lock held, so a millisecond per token stalls every other thread: the demo's twenty-token run takes 60 milliseconds that way. The fix is to split the decision from the I/O &mdash; the sink under the lock only adds the token to a queue, which is a few nanoseconds, and one background thread does the slow write afterwards. The same twenty-token run then finishes in under a millisecond and the flush lands later, in order, because the queue is FIFO and the tokens entered it under the lock. Decide under the lock, do the I/O outside it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: stream it live, and keep slow output out of the lock\n\n/** The obvious sink: every token goes straight to standard output, in order, while the lock is held. */\nfinal class SystemOutSink implements Sink {\n    public void emit(String token) { System.out.print(token); }\n}\n\n/**\n * The sink for a destination that can block -- a socket, a file, a remote log. emit() only adds the token to a\n * queue, which is a few nanoseconds and is safe to do while the lock is held; one background thread does the slow\n * write afterwards. That split is the answer to &quot;what if printing is slow&quot;: decide under the lock, do the I/O\n * outside it. The order survives because the queue is FIFO and the tokens enter it under the lock.\n */\nfinal class DeferredSink implements Sink {\n    private final BlockingQueue&lt;String&gt; pending = new LinkedBlockingQueue&lt;&gt;();\n    private final Consumer&lt;String&gt; slow;\n    private final Thread drainer;\n    private volatile boolean open = true;\n\n    DeferredSink(Consumer&lt;String&gt; slow) {\n        this.slow = slow;\n        drainer = new Thread(this::drain, &quot;sink-drainer&quot;);\n        drainer.setDaemon(true);\n        drainer.start();\n    }\n\n    /** O(1) and never blocks: this is the only part that runs with the printer&#x27;s lock held. */\n    public void emit(String token) { pending.add(token); }\n\n    private void drain() {\n        try {\n            while (true) {\n                String token = pending.poll(50, TimeUnit.MILLISECONDS);\n                if (token == null) { if (!open) return; continue; }\n                slow.accept(token);\n            }\n        } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n    }\n\n    /** Waits for every queued token to reach the slow destination, with a deadline of its own. */\n    void close() throws InterruptedException { open = false; drainer.join(10_000); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; Add a third thread so it prints foobarbaz. Then do Building-H2O. Where does your engine stop being enough?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both are new guard sets and nothing else. Foobarbaz turns the boolean flag into a three-value phase and adds a role whose action closes the round; the turn loop is not touched. H2O reuses the same field as a count of how many hydrogens this molecule has had, so H may act while that count is below two and O only when it is exactly two, and two threads produce HHO for every molecule. Then say where the engine stops being enough, because that is the senior signal. The real H2O problem has many H threads and many O threads and does not ask for an order at all: it asks that every group of three contains two hydrogens and one oxygen, in any order. That is a barrier, not a turn, and a turn flag cannot express it &mdash; a <code>Semaphore(2)</code> for hydrogen, a <code>Semaphore(1)</code> for oxygen and a <code>CyclicBarrier(3)</code> is the shape that can.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: two more series -- a third alternating thread, and the H2O cousin\n\n/** Series the interviewer adds after the first three. Both are new guard sets and nothing else. */\nfinal class ExtraRoles {\n    private ExtraRoles() { }\n\n    /** &quot;Add a Baz thread&quot;: the boolean flag becomes a three-value phase, and baz closes the round instead of bar. */\n    static List&lt;Role&gt; fooBarBaz() {\n        return List.of(\n            new Rule(&quot;foo&quot;, s -&gt; s.phase == 0, s -&gt; { s.phase = 1; return &quot;foo&quot;; }),\n            new Rule(&quot;bar&quot;, s -&gt; s.phase == 1, s -&gt; { s.phase = 2; return &quot;bar&quot;; }),\n            new Rule(&quot;baz&quot;, s -&gt; s.phase == 2, s -&gt; { s.phase = 0; s.i++; return &quot;baz&quot;; }));\n    }\n\n    /**\n     * Building H2O with two threads: phase counts how many hydrogens this molecule already has, so H may act while\n     * that count is below two and O only when it is exactly two. Honest caveat in the Javadoc where it belongs: the\n     * real problem has many H threads and many O threads and asks only that each group of three contains two H and\n     * one O in any order. That is a barrier, not a turn order, and is where a Semaphore(2) plus a CyclicBarrier(3)\n     * earns its place instead of a turn flag.\n     */\n    static List&lt;Role&gt; water() {\n        return List.of(\n            new Rule(&quot;H&quot;, s -&gt; s.phase &lt; 2,  s -&gt; { s.phase++; return &quot;H&quot;; }),\n            new Rule(&quot;O&quot;, s -&gt; s.phase == 2, s -&gt; { s.phase = 0; s.i++; return &quot;O&quot;; }));\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Make it an endless stream I can stop, and let threads join while it is running.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two different moves. Stopping is a flag: <code>stop()</code> sets it under the lock and calls <code>signalAll</code>, because a shutdown is the one change that concerns every waiter at once, and the flag is already read inside the same wait loops, so a closing signal cannot be lost. The demo runs FizzBuzz with n at <code>Integer.MAX_VALUE</code>, stops it after fifty milliseconds, and gets back every character printed up to that moment &mdash; fifty thousand or so, a different count every run &mdash; with every thread finished. A growing roster is the other move: the printer keeps its thread list and a newcomer joins under the lock &mdash; bump the participant count and start its thread inside the same critical section. It works because the round-robin guard reads <code>(i - 1) % k</code> from the blackboard, so changing k leaves exactly one guard true at every step; and even if the signal arrives before the newcomer is asleep, it re-checks its guard before deciding to wait, so nothing is lost.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a roster that grows while the series is running\n\n/**\n * &quot;Now let threads join and leave mid-run.&quot; The turn loop is the same; what changes is that the printer keeps its\n * thread list and lets a newcomer join under the lock. The guard set stays total because the round-robin guard is\n * (i - 1) % k == me with k read from the blackboard: bump k and exactly one guard is still true at every step.\n * The newcomer&#x27;s thread is started inside the same lock that bumps k, so the step that first belongs to it cannot\n * be reached before its thread exists -- and even if the signal arrives before it waits, it re-checks its guard\n * before deciding to sleep, so nothing is lost.\n */\nfinal class ElasticPrinter {\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Condition turn = lock.newCondition();\n    private final List&lt;Thread&gt; threads = new ArrayList&lt;&gt;();\n    private final Observers observers = new Observers();\n    private Series series;\n    private volatile boolean stopped;\n\n    /** Registers a listener, called after the unlock like everywhere else. */\n    void addObserver(StepObserver o) { observers.add(o); }\n\n    /** Starts the series with the roles it has today and returns at once; the threads keep running. */\n    void start(int n, List&lt;Role&gt; roles) {\n        stopped = false;\n        series = new Series(n, roles.size(), Sink.NONE);\n        lock.lock();\n        try { for (Role r : roles) spawn(r); } finally { lock.unlock(); }\n    }\n\n    /** Adds one more participant to a running series: bump k, start its thread, wake everybody -- all under the lock. */\n    void join(Role r) {\n        lock.lock();\n        try { series.k++; spawn(r); turn.signalAll(); } finally { lock.unlock(); }\n    }\n\n    private void spawn(Role r) {\n        Thread t = new Thread(() -&gt; {\n            try { serve(r); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        }, &quot;role-&quot; + r.name());\n        threads.add(t);\n        t.start();\n    }\n\n    /** Waits for the series to end and returns the sequence; a stall becomes an exception, never a hang. */\n    String await(long ms) throws InterruptedException {\n        long end = System.currentTimeMillis() + ms;\n        List&lt;Thread&gt; snapshot;\n        lock.lock();\n        try { snapshot = new ArrayList&lt;&gt;(threads); } finally { lock.unlock(); }\n        for (Thread t : snapshot) t.join(Math.max(1L, end - System.currentTimeMillis()));\n        for (Thread t : snapshot)\n            if (t.isAlive()) { stopped = true; nudge(); t.join(300); t.interrupt(); }\n        return series.text();\n    }\n\n    private void nudge() {\n        lock.lock();\n        try { turn.signalAll(); } finally { lock.unlock(); }\n    }\n\n    private void serve(Role role) throws InterruptedException {\n        Series s = series;\n        while (true) {\n            String token;\n            int at;\n            lock.lockInterruptibly();\n            try {\n                while (!stopped &amp;&amp; !s.done() &amp;&amp; !role.ready(s)) turn.await();\n                if (stopped || s.done()) { turn.signalAll(); return; }\n                token = role.act(s);\n                s.emit(token);\n                at = s.i;\n                turn.signalAll();\n            } finally { lock.unlock(); }\n            observers.publish(role.name(), token, at);\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>11 &middot; A role throws half way through a turn, or the guard set has a hole in it. What happens then?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Neither may hang, and that is the whole answer. A role that throws is caught while the lock is still held: the printer signals the others so that nobody is stranded on a change that never came, then rethrows, and the <code>finally</code> releases the lock, so an exception can never leave the lock held. The counter is exactly where it was, so the turns that committed are intact &mdash; the test makes a role throw on its fifth turn and asserts that exactly nine turns were published. A guard set with a hole is worse, because nothing is wrong: every thread is correctly asleep and no guard is true, which is a stall, not a deadlock. The deadline catches it: every run joins its threads against a budget, and when the budget passes the printer stops them, interrupts them and throws with the value of the counter in the message. The test removes one FizzBuzz role and gets an exception in 620 milliseconds instead of a build that never ends.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 11. a stall must fail, not hang: a guard set with a hole (fizzbuzz removed) reaches i = 15 with no role\n        //     able to act, and the deadline turns that into an exception in under a second.\n        MonitorPrinter holed = new MonitorPrinter();\n        holed.configure(Sink.NONE, System::currentTimeMillis, 600);\n        long t0 = System.currentTimeMillis();\n        boolean threw = false;\n        try { holed.run(15, Roles.fizzBuzz().subList(0, 3)); } catch (IllegalStateException e) { threw = true; }\n        long tookMs = System.currentTimeMillis() - t0;\n        check(threw &amp;&amp; tookMs &lt; 4_000, &quot;a guard set with a hole fails in &quot; + tookMs + &quot; ms instead of hanging for ever&quot;);\n\n        // 12. a role whose action throws must not strand the others: the run ends with an exception inside the\n        //     deadline, and exactly the turns that succeeded were published.\n        AtomicInteger published = new AtomicInteger();\n        AtomicInteger acts = new AtomicInteger();\n        MonitorPrinter fragile = new MonitorPrinter();\n        fragile.configure(Sink.NONE, System::currentTimeMillis, 800);\n        fragile.addObserver((role, token, at) -&gt; published.incrementAndGet());\n        List&lt;Role&gt; fragileRoles = List.of(\n            new Rule(&quot;foo&quot;, s -&gt; s.phase == 0, s -&gt; { s.phase = 1; return &quot;foo&quot;; }),\n            new Rule(&quot;bar&quot;, s -&gt; s.phase == 1, s -&gt; {\n                if (acts.incrementAndGet() == 5) throw new IllegalArgumentException(&quot;this role is broken&quot;);\n                s.phase = 0; s.i++; return &quot;bar&quot;;\n            }));\n        boolean threwRole = false;\n        try { fragile.run(20, fragileRoles); } catch (IllegalStateException e) { threwRole = true; }\n        check(threwRole &amp;&amp; published.get() == 9,\n              &quot;a role that throws on its fifth turn ends the run cleanly: 9 turns committed, nobody left asleep for ever&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>12 &middot; Where does time come from, how do you test a deadline without waiting for it, and how would this survive a restart?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Time is an interface with one method, handed in through <code>configure</code>, and the deadline arithmetic is the only thing that uses it. That is why a test can supply a clock whose every reading is a thousand seconds later than the last: the budget is already gone on the first check, and the printer gives up in six milliseconds of real time instead of five seconds, which is asserted. The real parking still uses the operating system's timer, so what the fake clock proves is the arithmetic, not the sleep. Surviving a restart is the same two fields with the <code>StringBuilder</code> replaced by an append-only file: append the token and make it durable, hand the turn on, and commit the counter <i>last</i>. That order is the design &mdash; a crash between the append and the commit replays one token, so delivery is at-least-once and whoever reads the log must tolerate a repeat; exactly-once needs the token and the offset written in one transaction.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 15. the deadline comes from the injected clock, so a test proves it without waiting for it.\n        MonitorPrinter fake = new MonitorPrinter();\n        fake.configure(Sink.NONE, new Clock() {\n            private long t = System.currentTimeMillis();\n            public long nowMs() { long now = t; t += 1_000_000; return now; }   // every reading is a thousand seconds later\n        }, 5_000);\n        long t1 = System.currentTimeMillis();\n        boolean gaveUp = false;\n        try { fake.run(200_000, Roles.fizzBuzz()); } catch (IllegalStateException e) { gaveUp = true; }\n        long fakeMs = System.currentTimeMillis() - t1;\n        check(gaveUp &amp;&amp; fakeMs &lt; 3_000,\n              &quot;a clock already past the deadline makes the printer give up in &quot; + fakeMs + &quot; ms of real time&quot;);\n\n// surviving a restart: the same design, with the record made durable and the counter committed last\nvoid emitDurable(Series s, String token) throws IOException {\n    log.append(token);          // 1. the irreversible step: the token is on disk\n    log.flush();                //    ... and durable, before anything else believes it happened\n    s.i++;                      // 2. only now does the in-memory counter move\n    offsets.commit(s.i);        // 3. the offset is committed LAST\n}\n// a crash between 1 and 3 replays exactly one token on restart: at-least-once, so the reader must be idempotent.\n// exactly-once needs the token and the offset in one transaction, which is a database, not a file.\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>13 &middot; Which pattern is where, and would a Factory or a Builder earn its place?</h3><button class=\"timer\" data-min=\"4\">start 4:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None of them was chosen up front, and the order you name them in is the answer: a <b>monitor object</b> from move 4, <b>Strategy</b> twice from move 3 (the per-thread rule, and the build that hands the turn over), <b>Decorator</b> from the same move's <code>AuditRole</code>, <b>Observer</b> from move 4's rule that a listener is never inside the lock, and <b>State</b> from move 6, where the <code>while</code> loop is the state machine of one turn. The family name is the monitor protocol: producer-consumer without a buffer. Factory is nearly earned by <code>Roles</code> and fully earned the day a series name arrives from configuration; Builder never does here, because <code>configure</code> takes three arguments. Page 02 moves 10 and 11 have the whole table, SOLID included.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Monitor object (move 4): private state, one lock, and every path in takes it\nprivate final ReentrantLock lock;\nprivate final Condition turn;                   // one crowd, so every waiter re-checks its own guard\n\n// Strategy, twice (move 3): the per-thread rule, and the build that hands the turn over\ninterface Role { String name(); boolean ready(Series s); String act(Series s); }\ninterface SeriesPrinter { String run(int n, List&lt;Role&gt; roles) throws InterruptedException; }\n\n// State (move 6): the while loop IS the state machine -- a wake goes back to the check, never to the print\nwhile (!stopped &amp;&amp; !s.done() &amp;&amp; !role.ready(s)) turn.await();\n\n// Factory: nearly. It earns the full name the day this line reads Roles.of(config.get(&quot;series&quot;))\nstatic List&lt;Role&gt; fizzBuzz() { return List.of(new Rule(...), new Rule(...), new Rule(...), new Rule(...)); }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>14 &middot; Could one of these threads starve? Should the lock be fair?</h3><button class=\"timer\" data-min=\"4\">start 4:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No, and no &mdash; and knowing why is the point. Starvation means a thread that is ready to work never gets to. Here the guards are a partition of the series, so every role's turn arrives on a fixed schedule whatever order the lock is handed out in: the round-robin test proves it, with every one of the ten threads emitting exactly its own 200 tokens out of 2,000 on the ordinary unfair lock. A fair lock hands itself to the thread that has queued longest instead of to whoever happens to be running, which here only changes who wins a race that every loser was going straight back to sleep from. It normally costs throughput too, though on this problem even that is lost in the noise, because every hand-off already parks a thread. So the honest answer is that fairness fixes a problem this design cannot have &mdash; say that, rather than reaching for the knob.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: fairness and starvation -- the knob people reach for, and why it is the wrong one here\n\n/**\n * A fair lock hands itself to the thread that has been queuing longest instead of to whoever happens to be running.\n * It is the usual cure for starvation, and on this problem it cures nothing, because nothing can starve: the guards\n * are a partition of the series, so every role&#x27;s turn arrives on a fixed schedule whatever order the lock is handed\n * out in. Barging only decides who wins a race that every loser was going straight back to sleep from. What fairness\n * does cost is real: every hand-off becomes a park and an unpark instead of the winner simply keeping the lock.\n */\nfinal class Fairness {\n    private Fairness() { }\n\n    /** Nanoseconds per token for a round robin of k threads, with the lock fair or not. Warms the JIT first. */\n    static double nsPerToken(boolean fair, int k, int tokens) throws InterruptedException {\n        MonitorPrinter m = new MonitorPrinter(fair);\n        List&lt;Role&gt; rr = Roles.roundRobin(k);\n        m.run(2_000, rr);\n        long t0 = System.nanoTime();\n        m.run(tokens, rr);\n        return (System.nanoTime() - t0) / (double) tokens;\n    }\n\n    /** The starvation check: over a long run every one of the k roles emitted exactly the same number of tokens. */\n    static boolean everyRoleGotItsShare(int k, int tokens) throws InterruptedException {\n        MonitorPrinter m = new MonitorPrinter(false);           // the UNFAIR lock, on purpose\n        RoleTally tally = new RoleTally();\n        m.addObserver(tally);\n        m.run(tokens, Roles.roundRobin(k));\n        for (int j = 0; j &lt; k; j++) if (tally.of(&quot;t&quot; + j) != tokens / k) return false;\n        return true;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>15 &middot; Somebody interrupts one of these threads while it is parked. Who is left holding the lock?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nobody, and that is entirely down to the <code>finally</code>. <code>await()</code> throws <code>InterruptedException</code>, the exception leaves <code>serve</code> through the <code>finally</code> that unlocks, and the interrupted thread is gone for good. Its role's turns will now never come, so the remaining threads wait for a hand-off that never arrives &mdash; and this is where the deadline earns its keep: the run ends with an <code>IllegalStateException</code> saying a thread is still waiting, instead of a build that hangs. The printer itself is undamaged, which is the claim the test makes: the very same object runs a clean FizzBuzz immediately afterwards, which it could not do if the lock had been left held. Two details to say out loud: the wait is <code>lockInterruptibly</code>, so a thread queueing for the lock can be cancelled too, and <code>Crew</code> catches the exception and re-sets the interrupt flag rather than swallowing it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: an interrupt while a thread is waiting\n\n/**\n * What happens when somebody cancels a thread that is parked on await(). The wait throws InterruptedException, and\n * because it throws out of a try whose finally unlocks, the lock is released on the way out -- that finally is the\n * only reason the rest of the system survives. The interrupted thread then leaves for good, so the series it was\n * part of can never finish: the remaining threads wait for a turn that will never come, the run hits its deadline,\n * and run() throws instead of hanging. The printer itself is undamaged, which is the claim check 16 makes: the very\n * same object runs a clean series immediately afterwards.\n */\nfinal class Interrupts {\n    private Interrupts() { }\n\n    /** Interrupts the live participant thread, the one Crew named &quot;role-&quot; plus the role name. False if it has already gone. */\n    static boolean interruptRole(String name) {\n        for (Thread t : Thread.getAllStackTraces().keySet())\n            if (t.isAlive() &amp;&amp; (&quot;role-&quot; + name).equals(t.getName())) { t.interrupt(); return true; }\n        return false;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; What does java.util.concurrent already give you here? Would you write any of this in production?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Almost none of it, and saying so is the senior half of the answer. The order in this problem is a hand-off between named threads, and the library ships the hand-off primitives: a <code>Semaphore</code> is the baton, a <code>CountDownLatch</code> is a one-shot start gun, a <code>CyclicBarrier</code> or a <code>Phaser</code> is a re-usable meeting point, an <code>Exchanger</code> or a <code>SynchronousQueue</code> hands a value across. The <code>Phaser</code> build here is the shortest correct one on the page, and it carries the lesson worth remembering: a barrier is a fence, not a lock, so one token needs TWO trips of it &mdash; the first half of a round where every thread only reads its guard, the second where the one thread whose guard was true writes. Fuse those halves and the readers are reading the counter while the writer increments it; the first version of that class did, and printed <code>1fizz24buzz</code>. In production this whole problem is usually a single thread with a queue: you pay several microseconds a token to have four threads do what one thread could do in sixty-five.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a Phaser instead of a lock\n\n/**\n * A fourth build that uses no lock and no condition: a Phaser, which is a barrier that trips once every registered\n * party has arrived, and is the memory fence as well -- what one thread wrote before arriving is visible to all of\n * them on the other side. The catch is that a barrier alone is NOT a lock, so one token needs TWO trips of it: in\n * the first half of a round every thread only READS its guard, and in the second half only the single thread whose\n * guard was true WRITES. Fuse those halves into one phase and the readers are reading the counter while the writer\n * is incrementing it, which is a plain data race: the first version of this class did exactly that and printed\n * &quot;1fizz24buzz&quot; instead of &quot;12fizz4buzz&quot;. It is also the most wasteful build here -- every thread wakes twice per\n * token whatever happens -- and it silently requires the guards to be a partition.\n */\nfinal class PhaserPrinter implements SeriesPrinter {\n    private final Observers observers = new Observers();\n    private final AtomicLong wakeups = new AtomicLong();\n    private volatile boolean stopped;\n    private volatile Phaser phaser = new Phaser(0);\n\n    public String name() { return &quot;phaser barrier, no lock&quot;; }\n    public long wakeups() { return wakeups.get(); }\n    /** Always zero in the sense the other builds mean it: nobody re-checks a guard after a wake, everybody just arrives. */\n    public long wastedWakeups() { return 0; }\n\n    /** Registers a listener. */\n    void addObserver(StepObserver o) { observers.add(o); }\n\n    /** Ends the run: a forced termination makes every parked arrival return immediately. */\n    public void stop() { stopped = true; phaser.forceTermination(); }\n\n    public String run(int n, List&lt;Role&gt; roles) throws InterruptedException {\n        stopped = false;\n        wakeups.set(0);\n        Series s = new Series(n, roles.size(), Sink.NONE);\n        Phaser p = new Phaser(roles.size());\n        phaser = p;\n        long budget = 4L * n + 64;                        // a round budget, so a guard set that is not total cannot spin forever\n        Crew.Result r = Crew.race(roles.size(), k -&gt; roles.get(k).name(), me -&gt; {\n            Role role = roles.get(me);\n            for (long round = 0; round &lt; budget &amp;&amp; !stopped &amp;&amp; !p.isTerminated(); round++) {\n                boolean mine = !s.done() &amp;&amp; role.ready(s);   // READ half: every thread looks, nobody writes\n                p.arriveAndAwaitAdvance();                   // ... and nobody writes until everybody has looked\n                String token = null;\n                int at = 0;\n                if (mine) { token = role.act(s); s.emit(token); at = s.i; }   // WRITE half: exactly one writer\n                p.arriveAndAwaitAdvance();                   // everybody sees the new blackboard after this line\n                wakeups.addAndGet(2);                        // two barrier trips per token, per thread\n                if (token != null) observers.publish(role.name(), token, at);\n                if (s.done()) break;                         // every thread tests this at the same point, so they all leave together\n            }\n            p.arriveAndDeregister();\n        }, System::currentTimeMillis, 10_000, this::stop);\n        if (r.error != null) throw new IllegalStateException(name() + &quot;: a role threw&quot;, r.error);\n        if (!r.finished || (!stopped &amp;&amp; !s.done())) throw new IllegalStateException(name() + &quot;: the series stalled&quot;);\n        return s.text();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];

name(); }\n    public boolean ready(Series s) { return inner.ready(s); }\n\n    /** Notes the role and the token, then lets the wrapped rule do the real work. */\n    public String act(Series s) {\n        String token = inner.act(s);\n        trail.add(inner.name() + \":\" + token);\n        return token;\n    }\n\n    /** Wraps every role in a list, so auditing a whole series is one call. */\n    static List<Role> wrap(List<Role> roles, List<String> trail) {\n        List<Role> out = new ArrayList<>();\n        for (Role r : roles) out.add(new AuditRole(r, trail));\n        return out;\n    }\n}\n\n// ---- ext: two more series -- a third alternating thread, and the H2O cousin\n\n/** Series the interviewer adds after the first three. Both are new guard sets and nothing else. */\nfinal class ExtraRoles {\n    private ExtraRoles() { }\n\n    /** \"Add a Baz thread\": the boolean flag becomes a three-value phase, and baz closes the round instead of bar. */\n    static List<Role> fooBarBaz() {\n        return List.of(\n            new Rule(\"foo\", s -> s.phase == 0, s -> { s.phase = 1; return \"foo\"; }),\n            new Rule(\"bar\", s -> s.phase == 1, s -> { s.phase = 2; return \"bar\"; }),\n            new Rule(\"baz\", s -> s.phase == 2, s -> { s.phase = 0; s.i++; return \"baz\"; }));\n    }\n\n    /**\n     * Building H2O with two threads: phase counts how many hydrogens this molecule already has, so H may act while\n     * that count is below two and O only when it is exactly two. Honest caveat in the Javadoc where it belongs: the\n     * real problem has many H threads and many O threads and asks only that each group of three contains two H and\n     * one O in any order. That is a barrier, not a turn order, and is where a Semaphore(2) plus a CyclicBarrier(3)\n     * earns its place instead of a turn flag.\n     */\n    static List<Role> water() {\n        return List.of(\n            new Rule(\"H\", s -> s.phase < 2,  s -> { s.phase++; return \"H\"; }),\n            new Rule(\"O\", s -> s.phase == 2, s -> { s.phase = 0; s.i++; return \"O\"; }));\n    }\n}\n\n// ---- ext: the classic synchronized / wait / notifyAll version\n\n/**\n * The same design with the language's built-in monitor instead of a Lock: synchronized, wait and notifyAll. It is\n * the version most people write first and it is correct, with one rule that cannot be broken -- an object has only\n * ONE wait set, so notify() (singular) would hand the single wake-up to an arbitrary sleeper, very likely one whose\n * guard is still false, and the thread that could have acted stays asleep forever. That is a lost wakeup, and it is\n * why this version must say notifyAll. What it cannot do is aim a wake-up: for that you need one Condition per\n * role, which is exactly why ConditionPrinter exists.\n */\nfinal class SynchronizedPrinter implements SeriesPrinter {\n    private final Object monitor = new Object();\n    private final Observers observers = new Observers();\n    private final AtomicLong wakeups = new AtomicLong(), wasted = new AtomicLong();\n    private volatile boolean stopped;\n    private long deadlineMs = 10_000;\n\n    public String name() { return \"synchronized / wait / notifyAll\"; }\n    public long wakeups() { return wakeups.get(); }\n    public long wastedWakeups() { return wasted.get(); }\n\n    /** Registers a listener, called once the synchronized block has been left. */\n    void addObserver(StepObserver o) { observers.add(o); }\n\n    /** Sets the flag inside the monitor and wakes the whole wait set. */\n    public void stop() {\n        synchronized (monitor) { stopped = true; monitor.notifyAll(); }\n    }\n\n    public String run(int n, List<Role> roles) throws InterruptedException {\n        stopped = false;\n        wakeups.set(0);\n        wasted.set(0);\n        Series s = new Series(n, roles.size(), Sink.NONE);\n        Crew.Result r = Crew.race(roles.size(), k -> roles.get(k).name(),\n                                  me -> serve

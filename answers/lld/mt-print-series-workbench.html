<div class="top"><h1>Print in Order</h1><span class="sub">LLD &middot; multi-threading &middot; Java &middot; OpenJDK 21: demo, 18 failure tests and five builds that agree character for character</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Give me three threads that print 0, then 1, then 0, then 2, then 0, then 3, and so on to n &mdash; one thread only ever prints zeros, one only odd numbers, one only even. Then show me the same code doing FizzBuzz with four threads. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>Several threads have to write into one sequence, and the order of that sequence is the whole product. Each thread owns a part of the job &mdash; one prints zeros, one prints odd numbers, one prints even &mdash; and none of them may print until the others have printed what comes before. The threads run at the same time and the operating system decides who gets a core when, so left alone they would interleave and the output would be different on every run. Nobody may sit in a loop asking &quot;is it my turn yet&quot;, because that burns a whole CPU to wait, so a thread whose turn has not come has to go to sleep and somebody has to wake it at the right moment. The one thing that must always be true: the output is the same characters in the same order on every single run, every token is printed exactly once by exactly one thread, and when the last number is out no thread is left asleep. The same shape answers three interview favourites &mdash; FooBar, ZeroEvenOdd, FizzBuzz &mdash; which is the real thing being tested.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: a class that compiles and a <code>main</code> that starts the threads and prints a sequence you can read. The interviewer watches, in this order: the questions you ask before typing (how many threads, and does the next actor depend on the data, are the first two); which types exist and who owns which state; one turn end to end, including the waiting; the race you are defending against, named out loud; whether the wait is a <code>while</code> and not an <code>if</code>, and why; what is inside the lock and what is deliberately outside it; how every thread gets out at the end. Then the twists: add a third thread; do FizzBuzz with the same engine; do it with semaphores instead; the output goes to a slow socket; the threads join and leave mid-run; now build H2O.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 336\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"51\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">one turn</text><g transform=\"translate(150 24)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a thread arrives</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">any of the N threads</text></g><path d=\"M345 51 H370\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(370 24)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take the lock</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">interruptibly</text></g><path d=\"M565 51 H590\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(590 24)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is it my turn?</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the guard, on the counter</text></g><path d=\"M785 51 H810\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(810 24)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">print and advance</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">both inside the lock</text></g><path d=\"M1005 51 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 24)\"><rect width=\"195\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"97.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">wake the others, unlock</text><text x=\"97.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">listeners only after</text></g><path d=\"M620 78 V112\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(490 112)\"><rect width=\"400\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"200.0\" y=\"11.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">not my turn: sleep on the condition</text><text x=\"200.0\" y=\"27.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">and the lock is released while it sleeps</text></g><path d=\"M760 112 V82\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"612\" y=\"101\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--muted)\">no</text><text x=\"772\" y=\"101\" text-anchor=\"start\" font-size=\"10\" fill=\"var(--acc)\">woken &rarr; check again</text><text x=\"615\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a wake only means &quot;look again&quot;, never &quot;the turn is yours&quot; &mdash; which is why the check is a while loop and not an if</text><text x=\"88\" y=\"223\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">the end</text><g transform=\"translate(150 196)\"><rect width=\"245\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"122.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the last number is printed</text><text x=\"122.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the counter passes n</text></g><path d=\"M395 223 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 196)\"><rect width=\"245\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"122.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">done() is true for everyone</text><text x=\"122.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the same test every guard loop runs</text></g><path d=\"M665 223 H690\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(690 196)\"><rect width=\"245\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"122.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one last signalAll</text><text x=\"122.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">under the lock</text></g><path d=\"M935 223 H960\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(960 196)\"><rect width=\"245\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"122.5\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every sleeper wakes and leaves</text><text x=\"122.5\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nobody is parked at the end</text></g><text x=\"88\" y=\"288\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"150\" y=\"288\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, from any thread: what has been printed so far, and whose turn it is &mdash; one lock, one consistent answer</text><text x=\"615\" y=\"322\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">the same series run a thousand times prints the same characters in the same order; every token is printed once, by exactly one thread; and no thread is asleep when the run ends</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>One engine for all three variants, or three separate answers?</td><td>One engine</td><td>A guard plus an action behind an interface, handed in per thread (moves 1, 3)</td></tr><tr><td>Is the next actor fixed, or does the data decide it?</td><td>The data decides &mdash; FizzBuzz needs it</td><td>Guards that every waiter re-checks, instead of a hard-wired hand-off order (moves 4, 6)</td></tr><tr><td>How many threads: two, three, four, or any number?</td><td>Any number; two to four in the examples</td><td>A list of roles and one thread each, not a class per thread (moves 1, 5)</td></tr><tr><td>Is n fixed up front, or is this an endless stream I must stop?</td><td>Fixed, with a stop signal as a follow-up</td><td><code>done()</code> is <code>i &gt; n</code>, and a flag the wait loops already read (moves 6, 12)</td></tr><tr><td>Must the tokens go to <code>System.out</code> live, or may I hand back the sequence?</td><td>Hand back the sequence; the sink is swappable</td><td>A one-method <code>Sink</code>, so a test can assert characters (moves 3, 12)</td></tr><tr><td>Is fairness or starvation a requirement, or only the order?</td><td>Only the order</td><td>A non-fair lock; the guards already fix who goes next (moves 7, 8)</td></tr><tr><td>How many wakeups may I waste? Is the thread count going to grow?</td><td>Two to four now, keep the door open</td><td>One shared condition today, one per role on the ladder (moves 7, 8)</td></tr><tr><td>One JVM, in memory?</td><td>Yes</td><td>No durability yet; the append-only log is a follow-up (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>N threads share one output sequence and print it in one fixed order, from 1 to n; each thread prints only its own tokens.</li>\n<li>FooBar: two threads alternate. ZeroEvenOdd: three threads, zero before every number. FizzBuzz: four threads, the number decides.</li>\n<li>One engine serves all three: only the guards and the actions change, never the waiting.</li>\n<li>A thread that is not up yet must sleep, not spin: no thread may burn a core waiting for its turn.</li>\n<li>The run ends when the counter passes n, and every thread leaves &mdash; including the ones asleep.</li>\n<li>The sequence can be read back as a string, so a test can compare it character for character.</li>\n<li>The run can be stopped early on a signal, and what was printed before the stop stays intact.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Deterministic: the same series, run a thousand times, prints exactly the same characters.</li>\n<li>Exactly once: no token printed twice, none skipped, whatever the thread scheduler does.</li>\n<li>No deadlock and no lost wakeup: every change of the shared state is followed by a signal under the same lock.</li>\n<li>O(1) per turn: the guard is one comparison, the print is one append, the counter is one increment.</li>\n<li>The per-thread rule swaps without touching the turn loop; the destination of the tokens swaps too.</li>\n<li>A slow or broken listener can never stall or corrupt the order.</li>\n<li>One JVM, in memory, one run at a time per printer (say it; durability is a follow-up).</li></ul></div></div>\n<div class=\"move\"><h3>One run, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 0 ms   four threads start</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">FizzBuzz to 20,000, four threads</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one latch releases them together</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">i = 1: only number's guard is true</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 0-68 ms   20,000 turns</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">lock, test the guard, print, wake</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">32,000 wakes, 16,000 wasted</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">wasted = looked, not mine, slept</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 68 ms   i reaches 20,001</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the last turn signals once more</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">all four wake, all four see done()</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">each signals on the way out</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">t = 68 ms   the count</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">20,000 tokens, 90,075 characters</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">0 duplicated, 0 missing, 0 wrong</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">and the same string on every run</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> one engine for all three variants; the next actor can depend on the number, so every waiter re-checks its own guard; n is fixed and a stop signal is a follow-up; the tokens go into a sequence I hand back, and the destination is swappable; the only guarantee is order, not fairness. Named as out of scope: durability, more than one run at a time on one printer, distribution &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">The same twelve moves as every other page here, with the threading ones doing the work: the shared state and its one lock (move 4), the wait protocol &mdash; check under the lock, wait in a loop, signal after the change (move 6), what is inside the lock and what N threads at once actually cost (move 7), and the ladder from one shared condition to one per thread to no lock at all (move 8). Nothing is chosen up front, and no pattern is named before the move that produced it.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class &mdash; and on a threading problem, notice what does not.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">N THREADS print one SERIES of TOKENS; each one WAITS until it is its TURN, prints, advances the COUNTER and hands the turn on</text><g transform=\"translate(30 110)\"><rect width=\"190\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Series</text><text x=\"95.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">counter, phase, the record</text></g><path d=\"M125.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(240 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MonitorPrinter</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock and the condition</text></g><path d=\"M332.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(445 110)\"><rect width=\"180\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"90.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Role</text><text x=\"90.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a guard and an action</text></g><path d=\"M535.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(645 110)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Token</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a string, not ours</text></g><path d=\"M727.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(830 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">foo / zero / fizz</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">threads, not classes</text></g><path d=\"M917.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1025 110)\"><rect width=\"178\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"89.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the waiting room</text><text x=\"89.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock keeps it</text></g><path d=\"M1114.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a rule, a payload, a thread, or a queue of sleepers that the lock maintains for us</text></svg></div><div class=\"move\"><p>Read the sentence again: <b>N threads</b> print one <b>series</b> of <b>tokens</b>; each one <b>waits</b> until it is its <b>turn</b>, prints, advances the <b>counter</b> and hands the turn on. The counter, the turn flag and the record of what has been printed all change, and they change together, so they are one class: the <code>Series</code>, the blackboard everybody looks at. The lock and the condition also have state &mdash; who holds it, who is asleep on it &mdash; and they belong to the thing that runs the turn loop: <code>MonitorPrinter</code>. What a participant does has no state at all: it is a question (\"is it my turn?\") and an act (\"print this, advance that\"), so it is an interface, <code>Role</code>. Then the three that a threading problem tempts you to make classes and must not. The token is a string the caller wanted, not ours. A thread is not an object here: <code>foo</code> is not a class, it is a thread running one <code>Role</code>, and writing a <code>FooThread</code> is the classic wrong turn. And the waiting room is not a list you keep &mdash; it is the queue of parked threads the lock already maintains for each <code>Condition</code>, reached only through <code>await</code> and <code>signal</code>.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 345\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">hold the counter and the record</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 42 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 20)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Series  (owns i, phase, the text)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 42 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 20)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">s.i++  /  s.emit(token)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 74)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">decide whether it is my turn</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 96 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 74)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Role  (owns nothing: a pure rule)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 96 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 74)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">role.ready(s)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 128)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">print one token and advance</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 150 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 128)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Role, writing on the Series</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 150 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 128)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">role.act(s)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 182)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">sleep until somebody says look again</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 204 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 182)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MonitorPrinter  (owns the lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 204 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 182)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">turn.await() / signalAll()</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 236)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">run one participant's whole life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 258 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 236)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MonitorPrinter  (sees all three)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 258 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 236)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">serve(series, role)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">only the printer can see the blackboard AND the condition, so the printer is the orchestrator; foo is not a class, it is a thread running one Role</text><text x=\"615\" y=\"332\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and notice the verb with no class at all: waiting. It is a queue of parked threads owned by the lock, and await / signal are the only way to touch it</text></svg></div><div class=\"move\"><p>Holding the counter and the record touches <code>i</code>, <code>phase</code> and the text, so those live on the <code>Series</code>. Deciding whether it is my turn touches nothing at all &mdash; it is a question asked of the blackboard &mdash; so it is a pure rule, <code>role.ready(s)</code>, and printing is the same rule writing back, <code>role.act(s)</code>. Sleeping until somebody says look again touches the lock and its condition, so it belongs to the only object that owns them. Running one participant's whole life touches all three at once, so <code>serve(series, role)</code> lives on the printer, which is what makes the printer the orchestrator. That is also the answer to the question interviewers like here: why is there no <code>ZeroThread</code>? Because zero owns no state the design cares about. It is a thread, and its only relationship with the design is that it runs one rule.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind a one-method interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 345\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 78)\"><rect width=\"230\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"115.0\" y=\"49.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MonitorPrinter</text><text x=\"115.0\" y=\"65.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(sink, clock, deadline)</text></g><path d=\"M260 133 H330 V42 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 20)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Role</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">when may I act, what do I print</text></g><g transform=\"translate(750 20)\"><rect width=\"430\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">foo / zero / even / odd / fizz / buzz</text><text x=\"215.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one lambda pair per participant</text></g><path d=\"M750 42 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 133 H330 V96 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 74)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SeriesPrinter</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">how the turn is handed over</text></g><g transform=\"translate(750 74)\"><rect width=\"430\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Monitor / Condition / Semaphore</text><text x=\"215.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the build itself is a rule</text></g><path d=\"M750 96 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 133 H330 V150 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 128)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Sink</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where a finished token goes</text></g><g transform=\"translate(750 128)\"><rect width=\"430\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">none / System.out / a queue drained later</text><text x=\"215.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">swapped without touching the loop</text></g><path d=\"M750 150 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 133 H330 V204 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 182)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where a deadline comes from</text></g><g transform=\"translate(750 182)\"><rect width=\"430\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::currentTimeMillis, or a fake</text><text x=\"215.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a lambda is a valid implementation</text></g><path d=\"M750 204 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M260 133 H330 V258 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 236)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">StepObserver</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who wants to know</text></g><g transform=\"translate(750 236)\"><rect width=\"430\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"215.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RoleTally, a dashboard, a log line</text><text x=\"215.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">called after the unlock, never inside</text></g><path d=\"M750 258 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The printer never builds a rule, so &quot;now add a baz thread&quot; is a new guard and one more element in a list, not an edit to the turn loop</text><text x=\"615\" y=\"332\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one wrapper takes the whole interface instead: AuditRole implements Role and wraps ANY role to record who printed what &mdash; the engine never learns it is being watched</text></svg></div><div class=\"move\"><p>Five things will change, and each becomes an interface the printer is <i>given</i> rather than builds. The per-thread rule will change on the very next question &mdash; foo and bar today, zero, even and odd next, four FizzBuzz guards after that &mdash; so <code>Role</code> is the first and most important seam, and a participant is a pair of lambdas rather than a file. The other four are the same idea applied once each: <code>SeriesPrinter</code> because the interviewer will ask for semaphores, <code>Sink</code> because a test wants a string and production wants a socket, <code>Clock</code> because a test cannot afford to wait five seconds for a deadline, and <code>StepObserver</code> because somebody will want to watch. This is where the patterns are born, not announced. A swappable rule behind an interface is <b>Strategy</b>, and it is here twice over. A wrapper that adds behaviour to the whole interface is <b>Decorator</b>, and here it is <code>AuditRole</code>, which records who printed what and delegates &mdash; the engine never learns it is being watched. A printer that says \"a token landed\" without knowing what a dashboard is, is <b>Observer</b>.</p></div><div class=\"move\"><h3>Move 4: state that many threads change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 302\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"25\" y=\"62\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">thread fizz</text><text x=\"25\" y=\"132\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">thread number</text><text x=\"25\" y=\"202\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--acc)\">the counter i</text><g transform=\"translate(150 40)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reads i = 3</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">3 % 3 == 0: my turn</text></g><g transform=\"translate(560 40)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">prints fizz, i = 4</text></g><g transform=\"translate(355 110)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reads a stale i = 2</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">2 % 3 != 0: my turn too</text></g><g transform=\"translate(765 110)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">prints 2 again, i = 3</text></g><g transform=\"translate(202 180)\"><rect width=\"85\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"42.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3</text></g><g transform=\"translate(407 180)\"><rect width=\"85\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"42.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3</text></g><g transform=\"translate(612 180)\"><rect width=\"85\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"42.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">4</text></g><g transform=\"translate(817 180)\"><rect width=\"85\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"42.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3</text></g><rect x=\"140\" y=\"28\" width=\"415\" height=\"136\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"5 4\"/><text x=\"347\" y=\"20\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">the gap: both read the counter, neither saw the other</text><path d=\"M140 234 H940\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><path d=\"M244 229 V239\" stroke=\"var(--line)\"/><text x=\"244\" y=\"255\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t1</text><path d=\"M449 229 V239\" stroke=\"var(--line)\"/><text x=\"449\" y=\"255\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t2</text><path d=\"M654 229 V239\" stroke=\"var(--line)\"/><text x=\"654\" y=\"255\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t3</text><path d=\"M859 229 V239\" stroke=\"var(--line)\"/><text x=\"859\" y=\"255\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">t4</text><text x=\"965\" y=\"239\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">time &rarr;</text><g transform=\"translate(980 60)\"><rect width=\"235\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"117.5\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lock</text><text x=\"117.5\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">guard test and print: ONE step</text></g><text x=\"1210\" y=\"182\" text-anchor=\"end\" font-size=\"10.5\" fill=\"var(--muted)\">the waiting room hangs off that same lock,</text><text x=\"1210\" y=\"200\" text-anchor=\"end\" font-size=\"10.5\" fill=\"var(--muted)\">so nobody can sleep on a number that is moving</text><text x=\"615\" y=\"287\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">2 is printed twice, 3 is never printed, and the counter went backwards: the guard was true when it was read and false when it was acted on</text></svg></div><div class=\"move\"><p>Four FizzBuzz threads, no lock. The fizz thread reads <code>i = 3</code>, sees that three divides it and concludes it is its turn. The number thread is working from a value of <code>i</code> it read a moment ago, or from a copy sitting in its own core's cache, and it sees 2 &mdash; not divisible by three or five &mdash; so it concludes it is <i>its</i> turn. Both are now going to print and both are going to write the counter: 2 comes out twice, 3 never comes out at all, and the counter goes backwards. The gap is between reading the counter and acting on it, and the only fix is to make the read and the write one step. So the counter, the phase, the participant count and the output all belong to one object, and every path in and out goes through one lock &mdash; that shape has a name, the <b>monitor object</b>. The waiting room hangs off the same lock on purpose: a thread that is about to sleep tests the guard and goes to sleep <i>without</i> releasing the lock in between, which is what makes \"I checked and then I slept\" one indivisible act. Anything that only listens is called after the unlock, never inside it.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 326\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"330\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">whose turn is it right now?</text><text x=\"165.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M360 37 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"u

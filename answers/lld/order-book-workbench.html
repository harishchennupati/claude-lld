<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design the order book and matching engine for one instrument on an exchange. Members send limit and market orders; the engine matches whatever crosses, prints the trades, and lets a member cancel what has not filled. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>An exchange keeps, for each instrument, a list of the orders nobody has traded with yet: people willing to buy at a price, people willing to sell at a price. That list is the <b>book</b>. A new order arrives; if it is willing to pay at least what somebody is asking &mdash; the prices <b>cross</b> &mdash; a trade happens immediately, and what is left of the new order joins the book and waits. Which resting order gets the trade is not a detail: it is the promise the exchange sells. The promise here is <b>price-time priority</b>: the best price wins, and among orders at the same price the one that arrived first wins. A member can cancel anything that has not filled. Everything that happens is published &mdash; to the tape that prints trades, to the market-data feed that shows the top of the book, to risk. The one thing that must always be true is arithmetic: a resting order can never give up more lots than it offered, and every lot somebody bought is a lot somebody else sold.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that rests a few orders, sends a taker through them and prints the trades. The interviewer is watching for, in this order: the questions you ask before typing (how a price is represented, and whether it is price-time or pro-rata, are the first two); which classes exist and which one owns the book; an order matching end to end; what happens when two takers hit the same resting order at the same instant; where the rule that will change (who gets filled inside a price level) lives, so a pro-rata contract is a new class and not an edit; and what the book looks like after an order is refused. Then the twists: iceberg orders, stop orders, self-trade prevention, cancel-replace, surviving a crash, ten thousand symbols.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">submit</text><g transform=\"translate(175 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an order arrives</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">side, price in ticks, quantity</text></g><path d=\"M415 57 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">match while it crosses</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">best price, then arrival order</text></g><path d=\"M675 57 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">print at the maker's price</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">shrink it, drop it, prune the level</text></g><path d=\"M935 57 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rest the rest, or kill it</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">GTC rests; IOC, FOK, market do not</text></g><text x=\"88\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">cancel</text><g transform=\"translate(175 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cancel by id</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a member changes their mind</text></g><path d=\"M415 192 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">find it in one hop</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the index says which level</text></g><path d=\"M675 192 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">pull it out of its queue</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">and prune the level if it empties</text></g><path d=\"M935 192 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">tell the tape and the feed</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">after the lock, never inside it</text></g><path d=\"M555 84 V95\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(370 95)\"><rect width=\"370\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"185.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rejected or killed: the book is byte-identical</text></g><text x=\"88\" y=\"266\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"266\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, without walking the orders: what is the best bid and ask?  how deep is the book?  is order X still resting?</text><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">many members submit at the same instant: no resting order may ever fill more than it offered, and every lot bought is a lot sold</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>One instrument or many?</td><td>One book per symbol, with a thin router in front</td><td>Where the lock lives, and the whole scaling story (moves 4, 8)</td></tr><tr><td>How is a price represented?</td><td>Whole ticks in a <code>long</code>: 1500.05 is 150005</td><td>Exact comparison, cheap map keys, no rounding drift (moves 1, 5)</td></tr><tr><td>Price-time priority, or pro-rata?</td><td>Price-time now; pro-rata is coming</td><td>The allocation rule behind a one-method interface (move 3)</td></tr><tr><td>At a cross, whose price prints &mdash; resting or incoming?</td><td>The resting order's</td><td>The aggressor keeps the price improvement; the tape is reproducible (moves 2, 9)</td></tr><tr><td>Limit only, or market orders and time-in-force?</td><td>Limit and market; GTC, IOC and FOK</td><td>What happens to the remainder, and the all-or-nothing pre-check (moves 6, 9)</td></tr><tr><td>Concurrent submits, or one sequenced stream?</td><td>Concurrent</td><td>One lock per book, and the race is worth showing (moves 4, 7)</td></tr><tr><td>Self-trade prevention, iceberg, stop orders?</td><td>Out of scope, named</td><td>Each is one of the five twist moves (move 12)</td></tr><tr><td>One process and in memory, or persisted?</td><td>One process, in memory</td><td>No journal yet; a follow-up adds one (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Take an order: a side, a price in whole ticks, a quantity, a type (limit or market) and a time-in-force.</li>\n<li>Match it against the opposite side while the prices cross: best price first, arrival order inside a price.</li>\n<li>Print a trade at the <i>resting</i> order's price; shrink the maker, remove it when exhausted, prune an emptied level.</li>\n<li>Rest the remainder (good-till-cancelled) or throw it away (immediate-or-cancel, fill-or-kill, market).</li>\n<li>Fill-or-kill fills completely or does nothing at all.</li>\n<li>Cancel any resting order by id; a cancel that races a fill answers \"no\", it does not blow up.</li>\n<li>Publish every event &mdash; accepted, traded, rested, cancelled, rejected &mdash; to the tape, market data and risk.</li>\n<li>Answer the best bid and ask, and the depth of the top few levels, at any moment.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Many members submitting at once: no resting order ever fills more than it offered, and every lot bought is a lot sold.</li>\n<li>Prices are integer ticks, so comparison is exact: no <code>double</code> anywhere near the matching loop.</li>\n<li>Best price is a bounded walk of the ladder (about eight hops on a two-hundred-level book); cancel by id is O(1).</li>\n<li>The allocation rulebook is swappable per contract without touching the matching loop.</li>\n<li>One source of truth: the book, behind one lock; nothing else may touch a price level.</li>\n<li>Nothing half-done: a rejected or killed order leaves the book byte-identical and the member can retry.</li>\n<li>In memory, one process, no persistence (say it; a follow-up adds the journal).</li></ul></div></div>\n<div class=\"move\"><h3>One morning at the open, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"197\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M197 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"275\" height=\"130\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"137.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:15:00.000  the book builds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">ANA rests 200 to buy at 1499.95</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">BEN rests 300 behind her, same price</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">DEV offers 400 at 1500.05</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">ESH offers 600 at 1500.10</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">quote: 500 @ 1499.95 | 1500.05 @ 400</text></g><circle cx=\"485\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M485 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(348 60)\"><rect width=\"275\" height=\"130\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"137.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:15:00.412  FIR buys 900</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">a limit buy at 1500.10 sweeps both</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">asks: 400 at 1500.05, then 500 of ESH</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">each at the RESTING order's price</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">FIR keeps the price improvement</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">ESH still rests 100 at 1500.10</text></g><circle cx=\"773\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M773 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(636 60)\"><rect width=\"275\" height=\"130\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"137.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:15:01.006  GIR sells 300</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">both bids sit at 1499.95: time decides</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">ANA's 200 fills first, she was first</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">then 100 of BEN's 300</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">BEN's remaining 200 stays in front</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">two makers, so the tape prints two lines</text></g><circle cx=\"1061\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1061 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(924 60)\"><rect width=\"275\" height=\"130\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"137.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:15:02.310  HAR: all-or-nothing</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">fill-or-kill for 5,000 lots</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">a dry run says only 700 are there</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">so it fills nothing at all</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the book is identical, level for level</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">and the reject says why: only 700</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> prices are integer ticks and never a double; priority is price first, then arrival, and the trade prints at the resting order's price; one book and one lock per symbol, in memory, one process; the sequence number that decides arrival order is stamped by the engine inside the lock, not read from a wall clock. Named as out of scope: self-trade prevention, iceberg and stop orders, cancel-replace, persistence and replay, sharding across cores &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Twelve moves in this order, and the class diagram, the lock, the tests, the patterns and the answer to every twist fall out of them; nothing is named before the move that produced it. On this problem move 4 is the one that decides whether you pass, because the race here is not a lost update &mdash; it is an exchange printing trades against stock that was never there.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an ORDER arrives and rests at a PRICE LEVEL; the levels make a BOOK; a match prints a TRADE; an ALLOCATOR decides who fills</text><g transform=\"translate(30 110)\"><rect width=\"190\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Order</text><text x=\"95.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">side, price, qty, remaining</text></g><path d=\"M125.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(238 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PriceLevel</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one price, one FIFO queue</text></g><path d=\"M330.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(441 110)\"><rect width=\"190\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">OrderBook</text><text x=\"95.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two ladders + an id index</text></g><path d=\"M536.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(649 110)\"><rect width=\"200\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MatchingEngine</text><text x=\"100.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock, the rules, the seq</text></g><path d=\"M749.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(867 110)\"><rect width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"75.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Trade</text><text x=\"75.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a fact, never changes</text></g><path d=\"M942.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1035 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Allocator</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M1122.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state that changes, so it becomes a class.   dashed = a fact that never changes, or a rule with no state at all</text></svg></div><div class=\"move\"><p>Reading the paragraph again: an <b>order</b> arrives and rests at a <b>price level</b>; the levels stacked up make a <b>book</b>; when two orders cross, a <b>trade</b> prints; an <b>allocator</b> decides which resting order gets it. An order has a side, a price, a quantity and a remaining quantity, and that last field is the only thing matching ever changes: a class. A price level is the queue of orders sitting at one price, and it shrinks and empties: a class. The book is two ladders of those levels plus an index to find an order by id: a class. A trade is a fact &mdash; it happened, at a price, for a quantity &mdash; and nothing about it ever changes again, so it is a record. And the allocator has no state at all; it is a calculation, so it is an interface. Notice what is <i>not</i> a class: a \"market order\" is not a second kind of thing, it is an order with no price and no right to rest.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 288\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take an order and match it</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 42 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 20)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MatchingEngine  (owns the book and the lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 42 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 20)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">engine.submit(order)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 74)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">share out one price level</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 96 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 74)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Allocator  (owns nothing at all: pure)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 96 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 74)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">allocator.allocate(taker, level)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 128)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">pull a resting order out</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 150 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 128)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">OrderBook  (owns the ladders and the index)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 150 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 128)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">book.cancel(orderId)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 182)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">shrink a maker, drop it when done</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 204 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 182)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PriceLevel  (owns the queue at one price)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 204 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 182)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">level.reduce(maker, qty)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"254\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb whose state is spread over several classes goes to the one that owns all of them: that class becomes the orchestrator</text><text x=\"615\" y=\"273\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and notice what is NOT a verb: a market order is not a third flow, it is a limit order with no price and no right to rest</text></svg></div><div class=\"move\"><p>\"Share out one price level\" touches nothing: it reads a queue and a quantity and returns a plan, so it belongs to a pure rule, <code>allocator.allocate(taker, level)</code>. \"Shrink a maker and drop it when it is done\" touches the queue at one price, so it belongs to the level: <code>level.reduce(maker, qty)</code>. \"Pull a resting order out\" touches the ladder and the id index, which only the book sees: <code>book.cancel(orderId)</code>. And \"take an order and match it\" touches all of them at once, plus the sequence number and the listeners, so it belongs to the one class that owns everything: <code>engine.submit(order)</code> is the orchestrator. That is also the class that will own the lock, which is not a coincidence &mdash; the orchestrator and the lock owner are the same class for the same reason.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 245\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 60)\"><rect width=\"220\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MatchingEngine</text><text x=\"110.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(...) / addListener(...)</text></g><path d=\"M250 105 H330 V46 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Allocator</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who gets filled inside a level</text></g><g transform=\"translate(760 24)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PriceTimeAllocator / ProRataAllocator / SelfTradeGuard</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the rulebook of the contract</text></g><path d=\"M760 46 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 105 H330 V106 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 84)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BookListener</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who is told, and what about</text></g><g transform=\"translate(760 84)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ConsoleTape / TopOfBook / RiskMonitor / Journal</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">everything downstream of a fill</text></g><path d=\"M760 106 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 105 H330 V166 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 144)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what instant a trade carries</text></g><g transform=\"translate(760 144)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::currentTimeMillis, or a fixed instant</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">so a test can assert on it</text></g><path d=\"M760 166 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"212\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The engine never builds a rulebook, so a pro-rata contract is a new class and one changed line</text><text x=\"615\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one rule wraps every other rule: CheckedAllocator(rule) refuses any plan that hands out more lots than exist, including next year's rulebook</text></svg></div><div class=\"move\"><p>Who gets filled inside a price level will change: equities are first-come-first-served, but plenty of futures and options contracts hand every resting order a slice proportional to its size, and the interviewer will say so in the fiftieth minute. Who is told about a fill will change: a tape today, market data and risk and a journal tomorrow. What instant a trade carries will change the moment you try to test it. Each becomes a one-method (or all-default) interface the engine is <i>given</i> and never builds. This is where the patterns come from, not the other way round: a swappable rulebook behind an interface is <b>Strategy</b>; a rule that wraps another rule and adds a guarantee is <b>Decorator</b>, and here it is the one that matters &mdash; <code>CheckedAllocator</code> wraps every rulebook the engine is handed and throws if a plan gives a resting order more lots than it is offering, so a pro-rata class written next year cannot sell stock that does not exist. An engine that announces \"a trade printed\" without knowing what a tape is, is <b>Observer</b>. I do them; I do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">taker A</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads a1: 100 lots left</text></g><g transform=\"translate(30 110)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">taker B</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads a1: 100 lots left</text></g><g transform=\"translate(360 70)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a1 resting</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">100 lots</text></g><path d=\"M230 52 H360 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M230 132 H360 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"295\" y=\"40\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"295\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"580\" y=\"20\" width=\"300\" height=\"140\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"730\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"730\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both read 100, both take 100</text><text x=\"730\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">the venue just sold 200 lots</text><text x=\"730\" y=\"108\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">of a 100-lot order</text><text x=\"730\" y=\"138\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: read, decide and write as ONE step</text><g transform=\"translate(910 40)\"><rect width=\"290\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MatchingEngine.lock</text><text x=\"145.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the plan and the writes: one step</text></g><text x=\"1055\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock lives where the shared state lives</text><text x=\"1055\" y=\"185\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one lock per SYMBOL: INFY and TCS never wait</text></svg></div><div class=\"move\"><p>Two members hit the same resting order at the same instant. Both read that it has a hundred lots left, both decide to take a hundred, both write. The order's remaining quantity goes to minus a hundred, or to zero twice over, and the exchange has just printed two hundred lots of trade against a hundred-lot order: it sold stock that never existed, and the tape and the book now disagree forever. So reading the level, deciding the plan and writing the result must be one step, in the class that owns all of it: the engine. Note what a compare-and-swap cannot do here. A CAS makes one word atomic, and there is no single word in this invariant &mdash; one match mutates a maker, a level's queue and its cached total, the ladder, the id index and the taker. A lock, or a single writer thread, is the honest answer at this size. The lock is per <i>symbol</i>, which is the whole scaling story: INFY and TCS never wait for each other.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers fast.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 282\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is the best bid, the best ask?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 39 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 20)\"><rect width=\"500\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"250.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TreeMap&lt;price, PriceLevel&gt;, bids reversed</text><text x=\"250.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 39 H1010\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1010 20)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(log P), ~8 hops</text></g><g transform=\"translate(30 66)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who is next in line at this price?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 85 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 66)\"><rect width=\"500\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"250.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LinkedHashMap&lt;orderId, Order&gt;</text><text x=\"250.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 85 H1010\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1010 66)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), arrival order</text></g><g transform=\"translate(30 112)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">where is order X, so I can cancel it?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 131 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 112)\"><rect width=\"500\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"250.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">HashMap&lt;orderId, Order&gt; + its level</text><text x=\"250.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 131 H1010\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1010 112)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 158)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many lots rest at this price?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 177 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 158)\"><rect width=\"500\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"250.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a totalQty kept on every add and fill</text><text x=\"250.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 177 H1010\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1010 158)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), never counted</text></g><g transform=\"translate(30 204)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how deep is the book, top five?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 223 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 204)\"><rect width=\"500\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"250.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the first five entries of the ladder</text><text x=\"250.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 223 H1010\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1010 204)\"><rect width=\"190\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(5)</text></g><text x=\"615\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the two priorities are two different structures: a SORTED map for price, an INSERTION-ORDERED map for time. Mixing them into one list is the junior answer</text></svg></div><div class=\"move\"><p>There are two priorities here and they want two different structures, which is the whole trick. Price priority: \"what is the best bid?\" is a sorted map from price to level, with the bid map's comparator reversed so both ladders are read front to back; <code>firstEntry()</code> is a walk to the leftmost node, so about eight pointer hops on a two-hundred-level book, and you can cache the head if you ever need it to be free. Time priority: \"who is next in line at this price?\" is a <code>LinkedHashMap</code> keyed by order id &mdash; iteration stays arrival order, and removing from the middle is O(1), which matters because the thing a live book does most is cancel. \"Where is order X?\" is a hash map from id to order, so a cancel never scans. \"How many lots rest at this price?\" is a running total kept on the level, so a quote and a depth ladder never add a queue up. Keeping one flat list and scanning it for the best price is the junior answer, and it is O(n) on the hottest path in the building.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 215\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"110\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"55.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">NEW</text></g><g transform=\"translate(190 30)\"><rect width=\"140\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ACCEPTED</text></g><g transform=\"translate(190 105)\"><rect width=\"140\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PARTIALLY</text><text x=\"70.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">FILLED</text></g><g transform=\"translate(400 30)\"><rect width=\"120\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"60.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FILLED</text></g><g transform=\"translate(400 105)\"><rect width=\"120\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"60.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CANCELLED</text></g><g transform=\"translate(30 105)\"><rect width=\"110\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"55.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">REJECTED</text></g><path d=\"M140 49 H190\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M85 68 V105\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><path d=\"M260 68 V105\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M330 42 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M330 124 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M330 118 H350 V58 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M230 68 V88 H160 V162 H460 V143\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"275\" y=\"186\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">moveTo() refuses any move that is not drawn here</text><text x=\"275\" y=\"204\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a fill that leaves lots over just repeats PARTIALLY_FILLED</text><rect x=\"600\" y=\"16\" width=\"610\" height=\"196\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"905\" y=\"40\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order of operations when an order arrives, and why it is this order</text><text x=\"615\" y=\"64\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 take the lock, then validate: symbol, id, quantity, price on the tick -- nothing written</text><text x=\"615\" y=\"86\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 stamp the arrival sequence: one counter, inside the lock, and it IS the book's order</text><text x=\"615\" y=\"108\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 fill-or-kill only: dry-run the same walk against a COPY of the order</text><text x=\"615\" y=\"130\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4 match: the allocator decides a plan, the engine applies it, inside one lock</text><text x=\"615\" y=\"152\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5 rest the remainder or throw it away, unlock, and only then tell the tape</text><text x=\"615\" y=\"174\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a rejected or killed order leaves the book byte-identical and can be retried;</text><text x=\"615\" y=\"196\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">nothing is published until the book is consistent: the tape can never lead it</text></svg></div><div class=\"move\"><p>An order is NEW until the engine looks at it, then either REJECTED (a price off the tick, a reused id) or ACCEPTED. From there it is PARTIALLY_FILLED while it still has lots left, FILLED when it has none, or CANCELLED &mdash; by the member, or because its own time-in-force threw the remainder away. <code>moveTo()</code> refuses any move that diagram does not have, so a bug shows up as an exception rather than as a corrupt book. Writing the states down forces the question the interviewer will ask: what if the order cannot be filled? The answer is an order of operations. Take the lock, then validate, writing nothing: the reused-id check reads a set another thread can write, so it has to be inside, though the cheap field checks could run in the gateway first. Stamp an arrival sequence &mdash; one counter, incremented inside the lock, so it is both the order's place in the queue and the tape's line number. For a fill-or-kill, dry-run the same walk against a <i>copy</i> of the order, so all-or-nothing stays honest even after somebody swaps the rulebook. Then match: the allocator decides a plan, the engine applies it. Then the remainder, the unlock, and only then the tape. A rejected or killed order leaves the book byte-identical.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one symbol's orders happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 315\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"545\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"272.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about three microseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">walk the ladder to the best price: ~8 pointer hops</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">ask the allocator for a plan: 1 to 5 resting orders</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">shrink each maker, drop the ones that are done</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">prune an emptied level: one tree delete</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">about forty map and tree operations in all</text></g><path d=\"M575 95 H645\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"610\" y=\"85\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(645 20)\"><rect width=\"555\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"277.5\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: microseconds to seconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the gateway's decode and pre-trade risk: before submit()</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the tape socket and the market-data fan-out: ~50 us</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the journal write: ~5 ms, handed to a queue, never done here</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the member deciding what to send: seconds</text></g><text x=\"615\" y=\"200\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">ten gateway threads press submit at the same instant</text><g transform=\"translate(30 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gateway 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(148 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gateway 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 3 us</text></g><g transform=\"translate(266 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gateway 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 6 us</text></g><g transform=\"translate(384 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gateway 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 9 us</text></g><g transform=\"translate(502 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gateway 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 12 us</text></g><g transform=\"translate(620 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gateway 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 15 us</text></g><g transform=\"translate(738 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gateway 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 18 us</text></g><g transform=\"translate(856 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gateway 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 21 us</text></g><g transform=\"translate(974 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gateway 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 24 us</text></g><g transform=\"translate(1092 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gateway 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 27 us</text></g><text x=\"615\" y=\"283\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tenth waits twenty-seven microseconds for the lock and then fifty for its own tape line: one at a time is true,</text><text x=\"615\" y=\"301\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and nobody can tell, because nothing slow is allowed inside the critical section</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself: if every order takes the book's lock, is the exchange now a queue? It is, for about three microseconds, and only for that one symbol. Inside the lock there is a walk down the ladder to the best price (about eight pointer hops), one call to the allocator producing a plan of one to five lines, a shrink of each maker with the exhausted ones dropped, and a tree delete if a level emptied: roughly forty map and tree operations. Everything slow is outside it. The gateway's protocol decode and pre-trade risk happen before <code>submit</code> is called at all. The tape socket, the market-data fan-out and the journal all happen after the unlock, each listener inside a try/catch, so a dead socket cannot stall matching. So when ten gateway threads press submit at the same instant, the tenth waits about twenty-seven microseconds for the lock and then fifty for its own tape line.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per book: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the locked part of a marketable order: ~40 operations, about 3 us</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a hot NSE symbol at the open: about 2,000 orders a second</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">2,000 x 3 us = 6 ms of lock in every second: 0.6% busy</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">at 100,000 orders a second into ONE symbol it is 30% busy: climb</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">and the lock is per SYMBOL, so 1,200 books never meet at all</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 nothing slow inside the lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: every listener fires after the unlock</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 shard by symbol</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">Exchange already does it: one engine, one lock, per book</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 one writer thread per shard</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">orders off a queue: no lock at all, and the stream replays</text></g></svg></div><div class=\"move\"><p>Say the number before you name the ladder. Two thousand orders a second against a lock held three microseconds is six milliseconds of lock in every second: the book is busy six tenths of one per cent, and two writers collide roughly never. A hundred thousand orders a second into <i>one</i> symbol makes it thirty per cent busy, and thirty per cent is where waiting stops being free &mdash; that is the number that says climb, and you should say it out loud before you climb anything. The three rungs in the picture are in cost order, and the first two are already built: nothing slow is inside the critical section, and <code>Exchange</code> gives one lock per symbol for free, so twelve hundred books across forty cores never contend. The third rung is what real venues run &mdash; one writer thread per shard, taking orders off a ring buffer &mdash; and it deletes the lock entirely while making the stream deterministic for replay. Only who calls <code>submit</code> changes.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 390\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a later order fills before an earlier one</text></g><path d=\"M350 37 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 18)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one queue per price, in arrival order; test 1: early fills, then late</text></g><g transform=\"translate(30 60)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two takers hit the same resting order</text></g><path d=\"M350 79 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 60)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lock per book; test 7: fifty threads, lots bought == lots sold</text></g><g transform=\"translate(30 102)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an order fills more than it offered</text></g><path d=\"M350 121 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 102)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Order.take() refuses it; test 7: filled + remaining == quantity, always</text></g><g transform=\"translate(30 144)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a fill-or-kill that cannot fill in full</text></g><path d=\"M350 163 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 144)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">dry-run the walk first; test 4: the book is identical, level for level</text></g><g transform=\"translate(30 186)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a rulebook that hands out too much</text></g><path d=\"M350 205 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 186)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CheckedAllocator throws before any write; test 8: nothing moved</text></g><g transform=\"translate(30 228)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the tape socket is down</text></g><path d=\"M350 247 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 228)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">listeners fire after the unlock, in a try/catch; test 8</text></g><g transform=\"translate(30 270)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" f

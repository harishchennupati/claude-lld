ont-size=\"12.5\" fill=\"var(--text)\">a price off the tick, a reused order id</text></g><path d=\"M350 289 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 270)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">validated before a single write; test 9: the book is untouched</text></g><g transform=\"translate(30 312)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an amend-down looks like a fill to risk</text></g><path d=\"M350 331 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 312)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">shrinkTo lowers the order too; test 6: filled() stays 0</text></g><text x=\"615\" y=\"376\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a test: FailureTests.java runs nine blocks of them and must print ALL PASS</text></svg></div><div class=\"move\"><p>The table is the row-by-row version. Three of the rows are worth a sentence more. The first is the bug that gets a venue into the newspapers: a member who queued first watches a later order fill. It is not a crash, it is a silently wrong answer, which is why test 1 rests two orders at the same price and then asserts on the order id inside each printed trade. The rulebook row is the one people forget: <code>CheckedAllocator</code> throws before the first lot moves, and the test hands the engine a deliberately broken allocator to show the book came out untouched. And the amend row is the one this page got wrong on its first pass &mdash; shrinking a resting order used to leave <code>filled()</code> claiming lots that never traded, which risk and the journal would both have believed. Each of these is a few lines in FailureTests.java; a design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"230\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"320\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"870\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"230\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface Allocator { List&lt;Allocation&gt; allocate(taker, level); }</text><text x=\"870\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a pro-rata contract is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"230\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">configure() wraps every rulebook in new CheckedAllocator(a)</text><text x=\"870\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">no rulebook can overfill, ever</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"230\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"320\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">fire(events) AFTER the unlock, each listener in a try/catch</text><text x=\"870\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">a dead tape cannot stall matching</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"230\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">moveTo(next) refuses any edge the state machine does not have</text><text x=\"870\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">an illegal move throws, not corrupts</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Command</text><text x=\"230\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">the Allocation plan is decided in full before a lot moves</text><text x=\"870\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">the journal replays it exactly</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"230\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"320\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Exchange is handed to its callers; nothing calls getInstance()</text><text x=\"870\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh book in a line</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"230\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">engines.computeIfAbsent(symbol, ...) IS the registry</text><text x=\"870\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when contracts differ</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"230\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">six required fields, plus Order.limit() and Order.market()</text><text x=\"870\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">iceberg and stop fields would change that</text><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>The table is the defence, one line each. Two rows are worth more than a line. <b>Decorator</b> appears twice on the same seam: <code>CheckedAllocator</code> adds an invariant every rulebook must obey, and the self-trade guard in Extensions.java adds a business rule to the same interface &mdash; two different kinds of thing wrapping cleanly is the evidence the seam was cut in the right place. <b>Command</b> is hiding inside move 6: the allocator returns a <i>plan</i> that is decided in full before a single lot moves, and that is exactly what lets the journal replay it. The three grey rows carry as much weight as the five: Singleton earned nothing, and Factory and Builder are honest \"not yets\" with the condition stated. A pattern without a move behind it is decoration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">PriceLevel: one queue. OrderBook: sorted lookup. MatchingEngine: the flow and the lock.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">ProRataAllocator is a new file plus one configure() line</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">allocator.allocate(taker, level);  never \"is this the pro-rata one?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: every listener method defaults to a no-op</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">ConsoleTape implements onTrade and nothing else</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">engine.configure(new ProRataAllocator(1));  engine.setClock(() -&gt; t)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>SOLID is not a list to recite; it is the check that the moves did their job, and the table is the whole check. Two rows are worth saying out loud in the room. I, because it is the one most designs fail: the listener interface has six methods and every one defaults to a no-op, so the tape implements exactly one of them and a bare lambda is a legal listener. And D, because it is the one you can prove: the engine is handed its allocator and its clock rather than building them, which is exactly why a test can give it a clock that says last Tuesday and a rulebook that deliberately over-allocates.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" r -bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">stop orders, parked until triggered</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a trigger table and one more transition; the book is untouched</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across orders</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">iceberg: shown and hidden lots</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">both writes inside the SAME lock: all of it, or none of it</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\" eads a wall clock or a random number. Page 05 has the working code for all five.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1260 820\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M1090.0 480L1090.0 450\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M960 610L945 610L945 435L950 435\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1220 595L1238 595L1238 435L1220 435\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"1240\" y=\"762\" text-anchor=\"end\" font-size=\"10.5\" fill=\"var(--muted)\">CheckedAllocator wraps whatever rulebook it was handed</text><path d=\"M130.0 250L130.0 236\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M130 340 L130 320\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\"/><path d=\"M470.0 286L470.0 320\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"476.0\" y=\"307.0\" font-size=\"10.5\" fill=\"var(--muted)\">owns the book</text><path d=\"M470.0 522L470.0 560\" fill=\"no ine x1=\"0\" y1=\"80\" x2=\"340\" y2=\"80\" stroke=\"var(--line)\"/><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">add(o) / remove(id) / find(id)</text><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">reduce(maker, qty) / shrink(o, q)</text><text x=\"8\" y=\"125\" font-size=\"11.5\" fill=\"var(--text)\">queue(): List&lt;Order&gt;  arrival order</text><text x=\"8\" y=\"141\" font-size=\"11.5\" fill=\"var(--text)\">totalQty() / orderCount() / isEmpty()</text></g><g transform=\"translate(690 20)\"><rect width=\"250\" height=\"218\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Order</text><line x1=\"0\" y1=\"26\" x2=\"250\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">id / symbol / memberId</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">side / type / tif</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">limitTicks / qty: long</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">remaining: long  (mutable)</text><text x=\"8\" y=\"103\" font-size=\"11.5\" fill=\"var(--muted)\">seq: long</text><text x=\"8\" y=\"119\" font-size=\"11.5\" fill=\"var(--muted)\">status: OrderStatus</text><line x1=\"0\" y1=\"128\" x2=\"250\" y2=\"128\" stroke=\"var(--line)\"/><text x=\"8\" y=\"141\" font-size=\"11.5\" fill=\"var(--text)\">limit(...) / market(...)</text><text x=\"8\" y=\"157\" font-size=\"11.5\" fill=\"var(--text)\">take(qty) / shrinkTo(q)</text><text x=\"8\" y=\"173\" font-size=\"11.5\" fill=\"var(--text)\">moveTo(status)</text><text x=\"8\" y=\"189\" font-size=\"11.5\" fill=\"var(--text)\">filled(): long</text><text x=\"8\" y=\"205\" font-size=\"11.5\" fill=\"var(--text)\">stamp(seq)</text></g><g transform=\"translate(690 270)\"><rect width=\"250\" height=\"122\" rx=\"4\" fill=\"var(--bg3)\" stroke=\" \">LIMIT, MARKET</text></g><g transform=\"translate(960 160)\"><rect width=\"260\" height=\"50\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">TimeInForce</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">GTC, IOC, FOK</text></g><g transform=\"translate(960 230)\"><rect width=\"260\" height=\"106\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">OrderStatus</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">NEW, ACCEPTED,</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">PARTIALLY_FILLED, FILLED,</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--muted)\">CANCELLED, REJECTED</text><line x1=\"0\" y1=\"88\" x2=\"260\" y2=\"88\" stroke=\"var(--line)\"/><text x=\"8\" y=\"101\" font-size=\"11.5\" fill=\"var(--text)\">canMoveTo(next): boolean</text></g><g transform=\"translate(960 380)\"><rect width=\"260\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Allocator</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">allocate(taker, level)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">  : List&lt;Allocation&gt;</text></g><g transform=\"translate(960 480)\"><rect width=\"260\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PriceTimeAllocator</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">walk the queue in</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">arrival order until full</text></g><g transform=\"translate(960 570)\"><rect width=\"260\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CheckedAllocator</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">base: Allocator (wrapped)</text><line x1=\"0\" y1=\"48\" x2=\"260\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">allocate(...): refuses</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">a plan that overfills</text></g><g><path d=\"M20 792L64 792\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"796\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 792L284 792\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"796\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 792L504 792\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"796\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 792L684 792\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"796\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 792L904 792\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"796\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the exchange owns one engine per symbol, the engine owns the order book, the book owns its price levels. Plain arrow = references. Dashed green = handed in through <code>configure()</code> or <code>setClock()</code>. Dotted blue = notifies. <b>Where state lives:</b> a price level owns the queue at one price and the running total of what is resting there; the order book owns the two ladders and the id index and nothing else; the matching engine owns the book, the one lock, the sequence counter, the handed-in rulebook and the listeners, and it is the only class that writes anything; an order owns its own remaining quantity and its status, and the allocator owns nothing at all, which is why one instance can serve every book on the exchange. Notice what is <i>not</i> here: no Trade store, because a trade is published and gone, and no BestBid field, because the best bid is a question the ladder already answers.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (nine blocks of claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n/** Which way an order points. A buy takes from the asks; a sell takes from the bids. */\nenum Side {\n    BUY, SELL;\n    /** The side of the book this order matches against. */\n    Side opposite() { return this == BUY ? SELL : BUY; }\n}\n\n/** LIMIT names the worst price it will accept. MARKET accepts any price and never rests. */\nenum OrderType { LIMIT, MARKET }\n\n/**\n * How long the order is allowed to live. GTC rests what it could not fill; IOC takes what is\n * there and cancels the rest; FOK fills completely or does nothing at all.\n */\nenum TimeInForce { GTC, IOC, FOK }\n\n/**\n * An order&#x27;s life. The engine never sets a field directly: it calls moveTo(), which refuses an\n * illegal move, so a bug shows up as an exception instead of a corrupt book.\n */\nenum OrderStatus {\n    NEW, ACCEPTED, PARTIALLY_FILLED, FILLED, CANCELLED, REJECTED;\n    /** The legal edges of the state machine drawn on page 02, move 6. */\n    boolean canMoveTo(OrderStatus next) {\n        return switch (this) {\n            case NEW              -&gt; next == ACCEPTED || next == REJECTED;\n            case ACCEPTED         -&gt; next == PARTIALLY_FILLED || next == FILLED || next == CANCELLED;\n            case PARTIALLY_FILLED -&gt; next == PARTIALLY_FILLED || next == FILLED || next == CANCELLED;\n            default               -&gt; false;                       // FILLED, CANCELLED, REJECTED are the end\n        };\n    }\n}\n\n/**\n * Exact prices, in ticks. One tick here is one paise, so 1500.05 is 150005 and every comparison is\n * integer equality. There is no double and no BigDecimal anywhere past these two helpers.\n */\nfinal class Ticks {\n    private Ticks() {}\n    /** Parse &quot;1500.05&quot; into 150005 ticks. Used at the edge (a form, a file), never in the matching loop. */\n    static long of(String rupees) { return new java.math.BigDecimal(rupees).movePointRight(2).longValueExact(); }\n    /** Print 150005 ticks as &quot;1500.05&quot;. Presentation only. */\n    static String fmt(long ticks) {\n        String sign = ticks &lt; 0 ? &quot;-&quot; : &quot;&quot;; long a = Math.abs(ticks);\n        return sign + (a / 100) + &quot;.&quot; + String.format(&quot;%02d&quot;, a % 100);\n    }\n}\n\n/** Where time comes from. Injected, so a test can stamp a trade with any instant it likes. */\ninterface Clock { long nowMs(); }\n\n/**\n * One order. Everything is final except remaining, the status and the arrival sequence: matching\n * only ever shrinks remaining, and it does so under the book&#x27;s lock.\n */\nfinal class Order {\n    private final String id, symbol, memberId;\n    private final Side side;\n    private final OrderType type;\n    private final TimeInForce tif;\n    private final long limitTicks;\n    private long qty;                            // an amend-down lowers it; nothing else ever does\n    private long remaining, seq;\n    private OrderStatus status = OrderStatus.NEW;\n\n    Order(String id, String symbol, String memberId, Side side, OrderType type, TimeInForce tif,\n          long limitTicks, long qty) {\n        this.id = id; this.symbol = symbol; this.memberId = memberId; this.side = side;\n        this.type = type; this.tif = tif; this.limitTicks = limitTicks; this.qty = qty;\n        this.remaining = qty;\n    }\n    /** A good-till-cancelled limit order: the ordinary case, and the only kind that rests. */\n    static Order limit(String id, String symbol, String member, Side side, long priceTicks, long qty) {\n        return new Order(id, symbol, member, side, OrderType.LIMIT, TimeInForce.GTC, priceTicks, qty);\n    }\n    /** A limit order with an explicit time-in-force: GTC rests, IOC cancels the rest, FOK is all-or-nothing. */\n    static Order limit(String id, String symbol, String member, Side side, long priceTicks, long qty, TimeInForce tif) {\n        return new Order(id, symbol, member, side, OrderType.LIMIT, tif, priceTicks, qty);\n    }\n    /** A market order: it takes whatever is crossing and never rests, so its time-in-force is IOC. */\n    static Order market(String id, String symbol, String member, Side side, long qty) {\n        return new Order(id, symbol, member, side, OrderType.MARKET, TimeInForce.IOC, 0, qty);\n    }\n\n    String id() { return id; }\n    String symbol() { return symbol; }\n    String memberId() { return memberId; }\n    Side side() { return side; }\n    OrderType type() { return type; }\n    TimeInForce tif() { return tif; }\n    long limitTicks() { return limitTicks; }\n    long qty() { return qty; }\n    long remaining() { return remaining; }\n    /** How much of the order has traded. Always qty - remaining; the two never drift. */\n    long filled() { return qty - remaining; }\n    long seq() { return seq; }\n    OrderStatus status() { return status; }\n\n    /** The engine&#x27;s arrival stamp, taken inside the lock, so it IS the book&#x27;s own order of events. */\n    void stamp(long s) { seq = s; }\n    /** Move the state machine, or throw. An illegal move is a bug, not a business case. */\n    void moveTo(OrderStatus next) {\n        if (!status.canMoveTo(next))\n            throw new IllegalStateException(id + &quot;: &quot; + status + &quot; -&gt; &quot; + next + &quot; is not a legal move&quot;);\n        status = next;\n    }\n    /** Take q lots off this order. The last line of defence: nothing can fill more than it offered. */\n    void take(long q) {\n        if (q &lt;= 0) throw new IllegalStateException(id + &quot;: a fill must be positive, got &quot; + q);\n        if (q &gt; remaining) throw new IllegalStateException(id + &quot;: fill of &quot; + q + &quot; but only &quot; + remaining + &quot; left&quot;);\n        remaining -= q;\n    }\n    /**\n     * Amend down: give up lots without giving up queue place. The ORDER shrinks, not just what is\n     * left of it, so filled() still means &quot;traded&quot; -- an amend must never look like a fill to risk\n     * or to the journal. Never used to raise a quantity: that is a cancel and a new order.\n     */\n    void shrinkTo(long newRemaining) {\n        if (newRemaining &lt;= 0 || newRemaining &gt; remaining)\n            throw new IllegalArgumentException(id + &quot;: can only shrink, &quot; + remaining + &quot; -&gt; &quot; + newRemaining);\n        qty -= (remaining - newRemaining);\n        remaining = newRemaining;\n    }\n    @Override public String toString() {\n        return id + &quot; &quot; + side + &quot; &quot; + remaining + &quot;/&quot; + qty + &quot; @&quot; +\n               (type == OrderType.MARKET ? &quot;MKT&quot; : Ticks.fmt(limitTicks)) + &quot; &quot; + status;\n    }\n}\n\n/** One printed trade: what left the building. The price is always the resting order&#x27;s price. */\nrecord Trade(long seq, String symbol, long priceTicks, long qty,\n             String buyOrderId, String sellOrderId, Side takerSide, long atMs) {\n    /** One line of tape. */\n    String text() { return &quot;#&quot; + seq + &quot; &quot; + qty + &quot; @ &quot; + Ticks.fmt(priceTicks) + &quot; (&quot; + buyOrderId + &quot;/&quot; + sellOrderId + &quot;)&quot;; }\n}\n\n/** One line of an allocator&#x27;s plan: this resting order gives up this many lots. A decision, not a write. */\nrecord Allocation(String makerOrderId, long qty) {}\n\n/** The top of the book. A price of -1 means that side is empty. */\nrecord Quote(long bidTicks, long bidQty, long askTicks, long askQty) {\n    /** A one-line quote for a screen or a log. */\n    String text() {\n        return (bidQty == 0 ? &quot;--&quot; : bidQty + &quot; @ &quot; + Ticks.fmt(bidTicks)) + &quot;  |  &quot; +\n               (askQty == 0 ? &quot;--&quot; : Ticks.fmt(askTicks) + &quot; @ &quot; + askQty);\n    }\n}\n\n/** One rung of the depth ladder: a price, the lots resting there, and how many orders make it up. */\nrecord Rung(long priceTicks, long qty, int orders) {\n    /** One rung, as a screen would show it: &quot;500 @ 1499.95 (2 orders)&quot;. */\n    String text() { return qty + &quot; @ &quot; + Ticks.fmt(priceTicks) + &quot; (&quot; + orders + (orders == 1 ? &quot; order)&quot; : &quot; orders)&quot;); }\n}\n\n/** What submit() gives back: the order&#x27;s end state, what it traded, and what is left resting. */\nrecord SubmitResult(String orderId, OrderStatus status, long filledQty, long restingQty,\n                    List&lt;Trade&gt; trades, String rejectReason) {}\n\n/**\n * One price, one queue. Within a price the promise is first-come-first-served, so the queue is a\n * LinkedHashMap: iteration stays arrival order and a cancel from the middle is O(1), which is the\n * operation a live book does most.\n */\nfinal class PriceLevel {\n    private final long priceTicks;\n    private final LinkedHashMap&lt;String, Order&gt; fifo = new LinkedHashMap&lt;&gt;();\n    private long totalQty;                       // kept, never recomputed: the quote and the depth ladder read it\n\n    PriceLevel(long priceTicks) { this.priceTicks = priceTicks; }\n\n    long priceTicks() { return priceTicks; }\n    /** Lots resting at this price. O(1), because it is maintained on every add and every fill. */\n    long totalQty() { return totalQty; }\n    int orderCount() { return fifo.size(); }\n    boolean isEmpty() { return fifo.isEmpty(); }\n    /** The resting order with this id, or null. O(1). */\n    Order find(String orderId) { return fifo.get(orderId); }\n    /** The queue in arrival order, as a snapshot the allocator can walk without touching the book. */\n    List&lt;Order&gt; queue() { return new ArrayList&lt;&gt;(fifo.values()); }\n\n    /** Join the back of the queue. O(1). */\n    void add(Order o) { fifo.put(o.id(), o); totalQty += o.remaining(); }\n    /** Take q lots off a resting order and drop it from the queue when it is exhausted. O(1). */\n    void reduce(Order maker, long q) { maker.take(q); totalQty -= q; if (maker.remaining() == 0) fifo.remove(maker.id()); }\n    /** Pull an order out of the queue, wherever it is standing. O(1). */\n    Order remove(String orderId) {\n        Order o = fifo.remove(orderId);\n        if (o != null) totalQty -= o.remaining();\n        return o;\n    }\n    /** Amend a resting order down without losing its place. O(1). */\n    void shrink(Order o, long newRemaining) { totalQty -= (o.remaining() - newRemaining); o.shrinkTo(newRemaining); }\n}\n\n/**\n * One symbol&#x27;s book: two ladders of price levels sorted opposite ways, plus the index that makes\n * cancel O(1). It holds state and answers questions; it never decides anything and takes no lock.\n */\nfinal class OrderBook {\n    private final String symbol;\n    private final NavigableMap&lt;Long, PriceLevel&gt; bids = new TreeMap&lt;&gt;(Comparator.reverseOrder());  // highest first\n    private final NavigableMap&lt;Long, PriceLevel&gt; asks = new TreeMap&lt;&gt;();                           // lowest first\n    private final Map&lt;String, Order&gt; byId = new HashMap&lt;&gt;();                                       // cancel in O(1)\n\n    OrderBook(String symbol) { this.symbol = symbol; }\n\n    String symbol() { return symbol; }\n    /** The ladder for one side: bids highest-first, asks lowest-first, so both are read front to back. */\n    NavigableMap&lt;Long, PriceLevel&gt; ladder(Side side) { return side == Side.BUY ? bids : asks; }\n    /** The best price level on a side, or null. O(log P) in the number of live price levels. */\n    Map.Entry&lt;Long, PriceLevel&gt; best(Side side) { NavigableMap&lt;Long, PriceLevel&gt; l = ladder(side); return l.isEmpty() ? null : l.firstEntry(); }\n    /** Any live order by id, resting or not yet removed. O(1). */\n    Order find(String orderId) { return byId.get(orderId); }\n\n    /** Would this incoming order accept a trade at this resting price? */\n    static boolean crosses(Order taker, long restingTicks) {\n        if (taker.type() == OrderType.MARKET) return true;\n        return taker.side() == Side.BUY ? taker.limitTicks() &gt;= restingTicks : taker.limitTicks() &lt;= restingTicks;\n    }\n\n    /** Put the remainder at the back of its price queue. O(log P) to find or create the level. */\n    void rest(Order o) {\n        ladder(o.side()).computeIfAbsent(o.limitTicks(), PriceLevel::new).add(o);\n        byId.put(o.id(), o);\n    }\n    /** Pull a resting order out and prune an emptied level. Returns null if it is not resting. O(1) + O(log P). */\n    Order cancel(String orderId) {\n        Order o = byId.remove(orderId);\n        if (o == null) return null;\n        NavigableMap&lt;Long, PriceLevel&gt; lad = ladder(o.side());\n        PriceLevel level = lad.get(o.limitTicks());\n        if (level != null) { level.remove(orderId); if (level.isEmpty()) lad.remove(o.limitTicks()); }\n        return o;\n    }\n    /** Forget a maker that matching exhausted; the level already dropped it. O(1). */\n    void forget(String orderId) { byId.remove(orderId); }\n    /** Drop a level that a fill emptied. */\n    void pruneIfEmpty(Side side, long priceTicks) {\n        NavigableMap&lt;Long, PriceLevel&gt; lad = ladder(side);\n        PriceLevel level = lad.get(priceTicks);\n        if (level != null &amp;&amp; level.isEmpty()) lad.remove(priceTicks);\n    }\n    /** Lots resting on one side of the book. Used by the tests to prove nothing went missing. */\n    long totalQty(Side side) {\n        long sum = 0;\n        for (PriceLevel l : ladder(side).values()) sum += l.totalQty();\n        return sum;\n    }\n    /** Best bid and best ask with their sizes. O(log P). */\n    Quote quote() {\n        Map.Entry&lt;Long, PriceLevel&gt; b = best(Side.BUY), a = best(Side.SELL);\n        return new Quote(b == null ? -1 : b.getKey(), b == null ? 0 : b.getValue().totalQty(),\n                         a == null ? -1 : a.getKey(), a == null ? 0 : a.getValue().totalQty());\n    }\n    /** The top n rungs of one ladder, best price first. O(n). */\n    List&lt;Rung&gt; depth(Side side, int n) {\n        List&lt;Rung&gt; out = new ArrayList&lt;&gt;();\n        for (PriceLevel l : ladder(side).values()) {\n            if (out.size() == n) break;\n            out.add(new Rung(l.priceTicks(), l.totalQty(), l.orderCount()));\n        }\n        return out;\n    }\n}\n\n// &quot;this contract allocates pro-rata, not first-come-first-served&quot; -&gt; the rule goes behind an interface -&gt; Strategy\n/**\n * Who gets filled inside one price level. The exchange rulebook decides this, not the engine, so it\n * is one method handed in. It must be PURE: it decides a plan and mutates nothing.\n */\ninterface Allocator {\n    /** How the taker&#x27;s remaining lots are shared out among the orders resting at this level. */\n    List&lt;Allocation&gt; allocate(Order taker, PriceLevel level);\n}\n\n/** Price-time priority: the exchange&#x27;s default. Walk the queue in arrival order until the taker is full. */\nfinal class PriceTimeAllocator implements Allocator {\n    public List&lt;Allocation&gt; allocate(Order taker, PriceLevel level) {\n        List&lt;Allocation&gt; plan = new ArrayList&lt;&gt;();\n        long left = taker.remaining();\n        for (Order maker : level.queue()) {\n            if (left &lt;= 0) break;\n            long q = Math.min(left, maker.remaining());\n            if (q &gt; 0) { plan.add(new Allocation(maker.id(), q)); left -= q; }\n        }\n        return plan;\n    }\n}\n\n// the same move: one rule that wraps every other rule, so a rulebook written next year cannot overfill -&gt; Decorator\n/**\n * Wraps any allocator and refuses a plan that would hand out more than exists: more than the taker\n * has left, more than a maker is offering, an order that is not at this level, or the same order\n * twice. It throws BEFORE the engine applies anything, so a broken rulebook writes nothing.\n */\nfinal class CheckedAllocator implements Allocator {\n    private final Allocator base;\n    CheckedAllocator(Allocator base) { this.base = base; }\n    public List&lt;Allocation&gt; allocate(Order taker, PriceLevel level) {\n        List&lt;Allocation&gt; plan = base.allocate(taker, level);\n        long total = 0;\n        Set&lt;String&gt; seen = new HashSet&lt;&gt;();\n        for (Allocation a : plan) {\n            Order maker = level.find(a.makerOrderId());\n            if (maker == null) throw new IllegalStateException(&quot;allocator named &quot; + a.makerOrderId() + &quot;, which is not resting at &quot; + Ticks.fmt(level.priceTicks()));\n            if (!seen.add(a.makerOrderId())) throw new IllegalStateException(&quot;allocator named &quot; + a.makerOrderId() + &quot; twice in one plan&quot;);\n            if (a.qty() &lt;= 0) throw new IllegalStateException(&quot;allocator gave &quot; + a.makerOrderId() + &quot; a non-positive fill: &quot; + a.qty());\n            if (a.qty() &gt; maker.remaining()) throw new IllegalStateException(&quot;allocator gave &quot; + a.makerOrderId() + &quot; &quot; + a.qty() + &quot; lots but it is only offering &quot; + maker.remaining());\n            total += a.qty();\n        }\n        if (total &gt; taker.remaining()) throw new IllegalStateException(&quot;allocator handed out &quot; + total + &quot; lots for a taker with &quot; + taker.remaining() + &quot; left&quot;);\n        return plan;\n    }\n}\n\n// &quot;the tape wants fills, market data wants the top of book, risk wants exposure&quot; -&gt; announce, do not call -&gt; Observer\n/**\n * Everything downstream of matching. Every method has a no-op default, so a listener implements only\n * the events it cares about. Listeners are called AFTER the lock is released, each inside a try/catch.\n */\ninterface BookListener {\n    /** The order passed validation and is about to be matched. */\n    default void onAccepted(Order o) {}\n    /** A trade printed, at the resting order&#x27;s price. */\n    default void onTrade(Trade t) {}\n    /** What could not be filled is now resting in the book. */\n    default void onRested(Order o, long restingQty) {}\n    /** The order left the book, or its remainder was thrown away (IOC, FOK, market). */\n    default void onCancelled(Order o, long cancelledQty) {}\n    /** The order never entered the book: a bad price, a bad quantity, a reused id. */\n    default void onRejected(String orderId, String reason) {}\n    /** The top of the book after this event. */\n    default void onQuote(Quote q) {}\n}\n\n/** The tape: it prints trades, and nothing else. Interface segregation, in one class. */\nfinal class ConsoleTape implements BookListener {\n    private final List&lt;Trade&gt; printed = Collections.synchronizedList(new ArrayList&lt;&gt;());\n    public void onTrade(Trade t) { printed.add(t); }\n    /** Every trade this tape saw, in the order it saw them. */\n    List&lt;Trade&gt; printed() { return List.copyOf(printed); }\n}\n\n/** Market data&#x27;s level 1 feed: the last quote, readable without touching the book or its lock. */\nfinal class TopOfBook implements BookListener {\n    private volatile Quote last = new Quote(-1, 0, -1, 0);\n    public void onQuote(Quote q) { last = q; }\n    /** The most recent top of book. A read, never a lock. */\n    Quote last() { return last; }\n}\n\n/**\n * The aggregate root: one symbol&#x27;s book, one lock, one allocator, the listeners and the clock.\n * Every state change in this file happens inside submit() or cancel(), and both take this lock.\n */\nfinal class MatchingEngine {\n    private final String symbol;\n    private final OrderBook book;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final List&lt;BookListener&gt; listeners = new CopyOnWriteArrayList&lt;&gt;();\n    private final Set&lt;String&gt; usedIds = new HashSet&lt;&gt;();       // guarded by lock: a reused id is rejected\n    private final long tickSize, lotSize;\n\n    private volatile Allocator allocator = new CheckedAllocator(new PriceTimeAllocator());\n    private volatile Clock clock = System::currentTimeMillis;\n    private long seq;                                          // guarded by lock: the book&#x27;s own clock\n\n    MatchingEngine(String symbol, long tickSize, long lotSize) {\n        this.symbol = symbol; this.book = new OrderBook(symbol);\n        this.tickSize = tickSize; this.lotSize = lotSize;\n    }\n\n    /** Hand in the rulebook. The engine never builds an allocator, and always wraps it in the checker. */\n    void configure(Allocator a) { allocator = new CheckedAllocator(a); }\n    /** Hand in the clock. Tests set it; production leaves it as the wall clock. */\n    void setClock(Clock c) { clock = c; }\n    /** Add a downstream consumer: tape, market data, risk, journal. */\n    void addListener(BookListener l) { listeners.add(l); }\n\n    String symbol() { return symbol; }\n    /** Top of book, read under the lock so it is never half-updated. */\n    Quote quote() { lock.lock(); try { return book.quote(); } finally { lock.unlock(); } }\n    /** The top n rungs of one ladder. */\n    List&lt;Rung&gt; depth(Side side, int n) { lock.lock(); try { return book.depth(side, n); } finally { lock.unlock(); } }\n    /** Lots resting on one side. */\n    long restingQty(Side side) { lock.lock(); try { return book.totalQty(side); } finally { lock.unlock(); } }\n    /** A live order by id, or null if it never rested, was filled or was cancelled. */\n    Order resting(String orderId) { lock.lock(); try { return book.find(orderId); } finally { lock.unlock(); } }\n\n    /**\n     * Take an order. Everything that reads and writes the book happens inside the lock; the\n     * listeners are called after the unlock, so a slow or broken consumer cannot stall matching.\n     */\n    SubmitResult submit(Order taker) {\n        List&lt;Consumer&lt;BookListener&gt;&gt; events = new ArrayList&lt;&gt;();\n        SubmitResult result;\n        lock.lock();\n        try { result = submitLocked(taker, events); } finally { lock.unlock(); }\n        fire(events);\n        return result;\n    }\n\n    /**\n     * The critical step, in order: validate, then the fill-or-kill pre-check, then match, then decide\n     * the remainder. Nothing is written until every check has passed, so a rejected order leaves the\n     * book exactly as it was and the member can retry. All of it runs under the lock, because the\n     * duplicate-id check is a check-then-act on shared state: two gateway threads replaying the same\n     * order id must not both pass it. The cheap field checks could run in the gateway first.\n     */\n    private SubmitResult submitLocked(Order taker, List&lt;Consumer&lt;BookListener&gt;&gt; events) {\n        String bad = validate(taker);\n        if (bad != null) {                                       // 1. checks first: nothing is written yet\n            taker.moveTo(OrderStatus.REJECTED);\n            events.add(l -&gt; l.onRejected(taker.id(), bad));\n            return new SubmitResult(taker.id(), OrderStatus.REJECTED, 0, 0, List.of(), bad);\n        }\n        usedIds.add(taker.id());\n        taker.stamp(++seq);                                      // 2. the arrival stamp IS the book&#x27;s order\n        taker.moveTo(OrderStatus.ACCEPTED);\n        events.add(l -&gt; l.onAccepted(taker));\n\n        if (taker.tif() == TimeInForce.FOK) {                    // 3. all-or-nothing is decided BEFORE any write\n            long available = fillable(taker);\n            if (available &lt; taker.qty()) {\n                long killed = taker.remaining();\n                taker.moveTo(OrderStatus.CANCELLED);\n                String why = &quot;fill-or-kill: wanted &quot; + taker.qty() + &quot;, only &quot; + available + &quot; available&quot;;\n                events.add(l -&gt; l.onCancelled(taker, killed));\n                events.add(l -&gt; l.onQuote(book.quote()));\n                return new SubmitResult(taker.id(), OrderStatus.CANCELLED, 0, 0, List.of(), why);\n            }\n        }\n\n        List&lt;Trade&gt; trades = match(taker, events);               // 4. decide a plan, then apply it, level by level\n        SubmitResult out = settle(taker, trades, events);        // 5. rest the remainder, or throw it away\n        events.add(l -&gt; l.onQuote(book.quote()));\n        return out;\n    }\n\n    /**\n     * Walk the opposite ladder while it crosses: best price first, and inside a price whatever the\n     * allocator says. Each level is looked at once, so the loop always ends.\n     */\n    private List&lt;Trade&gt; match(Order taker, List&lt;Consumer&lt;BookListener&gt;&gt; events) {\n        List&lt;Trade&gt; trades = new ArrayList&lt;&gt;();\n        NavigableMap&lt;Long, PriceLevel&gt; opposite = book.ladder(taker.side().opposite());\n        Long seen = null;                                                  // the last price we looked at\n        while (taker.remaining() &gt; 0) {\n            Map.Entry&lt;Long, PriceLevel&gt; best = (seen == null) ? opposite.firstEntry() : opposite.higherEntry(seen);\n            if (best == null) break;                                       // the ladder ran out\n            if (!OrderBook.crosses(taker, best.getKey())) break;           // the price stopped crossing\n            PriceLevel level = best.getValue();\n            seen = best.getKey();\n            List&lt;Allocation&gt; plan = allocator.allocate(taker, level);      // decide: pure, mutates nothing\n            for (Allocation a : plan) {                                    // apply: the same lock, the same instant\n                Order maker = level.find(a.makerOrderId());\n                long q = a.qty();\n                level.reduce(maker, q);\n                taker.take(q);\n                if (maker.remaining() == 0) { maker.moveTo(OrderStatus.FILLED); book.forget(maker.id()); }\n                else maker.moveTo(OrderStatus.PARTIALLY_FILLED);\n                Trade t = new Trade(++seq, symbol, level.priceTicks(), q,\n                        taker.side() == Side.BUY ? taker.id() : maker.id(),\n                        taker.side() == Side.BUY ? maker.id() : taker.id(),\n                        taker.side(), clock.nowMs());\n                trades.add(t);\n                events.add(l -&gt; l.onTrade(t));\n            }\n            if (level.isEmpty()) book.pruneIfEmpty(taker.side().opposite(), seen);   // the book prunes its own ladder\n        }\n        return trades;\n    }\n\n    /**\n     * How much this order would really fill: the same walk, the same rulebook, run against a copy of\n     * the taker so the book is not touched. Fill-or-kill uses it, which is why all-or-nothing stays\n     * honest even when the allocator is changed to pro-rata or a self-trade guard.\n     */\n    private long fillable(Order taker) {\n        Order probe = new Order(taker.id(), symbol, taker.memberId(), taker.side(), taker.type(),\n                                TimeInForce.IOC, taker.limitTicks(), taker.qty());\n        NavigableMap&lt;Long, PriceLevel&gt; opposite = book.ladder(taker.side().opposite());\n        long total = 0; Long seen = null;\n        while (probe.remaining() &gt; 0) {\n            Map.Entry&lt;Long, PriceLevel&gt; best = (seen == null) ? opposite.firstEntry() : opposite.higherEntry(seen);\n            if (best == null || !OrderBook.crosses(probe, best.getKey())) break;\n            seen = best.getKey();\n            for (Allocation a : allocator.allocate(probe, best.getValue())) { probe.take(a.qty()); total += a.qty(); }\n        }\n        return total;\n    }\n\n    /** What happens to what did not fill: rest it (GTC limit) or throw it away (market, IOC, FOK). */\n    private SubmitResult settle(Order taker, List&lt;Trade&gt; trades, List&lt;Consumer&lt;BookListener&gt;&gt; events) {\n        long filled = taker.filled();\n        if (taker.remaining() == 0) {\n            taker.moveTo(OrderStatus.FILLED);\n            return new SubmitResult(taker.id(), OrderStatus.FILLED, filled, 0, List.copyOf(trades), null);\n        }\n        if (taker.type() == OrderType.MARKET || taker.tif() != TimeInForce.GTC) {\n            long killed = taker.remaining();\n            taker.moveTo(OrderStatus.CANCELLED);\n            events.add(l -&gt; l.onCancelled(taker, killed));\n            return new SubmitResult(taker.id(), OrderStatus.CANCELLED, filled, 0, List.copyOf(trades), null);\n        }\n        book.rest(taker);\n        if (filled &gt; 0) taker.moveTo(OrderStatus.PARTIALLY_FILLED);\n        long rested = taker.remaining();\n        events.add(l -&gt; l.onRested(taker, rested));\n        return new SubmitResult(taker.id(), taker.status(), filled, rested, List.copyOf(trades), null);\n    }\n\n    /**\n     * The exchange rulebook&#x27;s entry checks. All of them run before a single byte of the book changes,\n     * and all of them run under the lock: the reused-id check reads state another thread can write.\n     */\n    private String validate(Order o) {\n        if (!o.symbol().equals(symbol)) return &quot;wrong symbol: &quot; + o.symbol() + &quot; is not &quot; + symbol;\n        if (usedIds.contains(o.id())) return &quot;order id already used: &quot; + o.id();\n        if (o.qty() &lt;= 0) return &quot;quantity must be positive, got &quot; + o.qty();\n        if (o.qty() % lotSize != 0) return &quot;quantity &quot; + o.qty() + &quot; is not a multiple of the lot size &quot; + lotSize;\n        if (o.type() == OrderType.LIMIT) {\n            if (o.limitTicks() &lt;= 0) return &quot;a limit price must be positive, got &quot; + o.limitTicks();\n            if (o.limitTicks() % tickSize != 0) return &quot;price &quot; + Ticks.fmt(o.limitTicks()) + &quot; is not a multiple of the tick size &quot; + Ticks.fmt(tickSize);\n        } else if (o.tif() == TimeInForce.GTC) {\n            return &quot;a market order never rests, so it cannot be GTC&quot;;\n        }\n        return null;\n    }\n\n    /**\n     * Cancel a resting order. Returns false, not an exception, for an id that already filled, was\n     * cancelled or never existed: a cancel racing a fill is ordinary life on an exchange.\n     */\n    boolean cancel(String orderId) {\n        List&lt;Consumer&lt;BookListener&gt;&gt; events = new ArrayList&lt;&gt;();\n        boolean done;\n        lock.lock();\n        try {\n            Order o = book.cancel(orderId);\n            done = o != null;\n            if (done) {\n                long left = o.remaining();\n                o.moveTo(OrderStatus.CANCELLED);\n                events.add(l -&gt; l.onCancelled(o, left));\n                events.add(l -&gt; l.onQuote(book.quote()));\n            }\n        } finally { lock.unlock(); }\n        fire(events);\n        return done;\n    }\n\n    /**\n     * Amend a resting order down. Giving up lots keeps queue place, because the order object never\n     * leaves its queue; asking for more lots is a cancel and a new order, which loses it.\n     */\n    boolean amendDown(String orderId, long newRemaining) {\n        List&lt;Consumer&lt;BookListener&gt;&gt; events = new ArrayList&lt;&gt;();\n        boolean done = false;\n        lock.lock();\n        try {\n            Order o = book.find(orderId);\n            if (o != null &amp;&amp; newRemaining &gt; 0 &amp;&amp; newRemaining &lt; o.remaining()) {\n                PriceLevel level = book.ladder(o.side()).get(o.limitTicks());\n                level.shrink(o, newRemaining);\n                events.add(l -&gt; l.onQuote(book.quote()));\n                done = true;\n            }\n        } finally { lock.unlock(); }\n        fire(events);\n        return done;\n    }\n\n    /** Announce, after the unlock, one listener at a time. A listener that throws is logged and skipped. */\n    private void fire(List&lt;Consumer&lt;BookListener&gt;&gt; events) {\n        for (Consumer&lt;BookListener&gt; e : events)\n            for (BookListener l : listeners) {\n                try { e.accept(l); }\n                catch (RuntimeException ex) { /* a broken consumer must never break the book */ }\n            }\n    }\n}\n\n/**\n * The router in front: one engine per symbol, so two symbols never wait for each other. This is the\n * sharding knob of page 02, move 8, and it is one line.\n */\nfinal class Exchange {\n    private final Map&lt;String, MatchingEngine&gt; engines = new ConcurrentHashMap&lt;&gt;();\n    private final long tickSize, lotSize;\n    private final List&lt;BookListener&gt; defaults = new CopyOnWriteArrayList&lt;&gt;();\n\n    Exchange(long tickSize, long lotSize) { this.tickSize = tickSize; this.lotSize = lotSize; }\n\n    /** Every new book gets these listeners. */\n    void addDefaultListener(BookListener l) { defaults.add(l); }\n    /** The book for a symbol, created on first use. O(1). */\n    MatchingEngine book(String symbol) {\n        return engines.computeIfAbsent(symbol, s -&gt; {\n            MatchingEngine e = new MatchingEngine(s, tickSize, lotSize);\n            for (BookListener l : defaults) e.addListener(l);\n            return e;\n        });\n    }\n}\n\n/**\n * Proof it works: a narrated session on one book -- makers rest, a taker sweeps, price-time priority\n * decides, a fill-or-kill is refused, an IOC keeps what it got -- and then fifty threads crossing at\n * once with every lot accounted for.\n */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        Exchange exchange = new Exchange(5, 1);                       // tick 0.05, lot 1\n        ConsoleTape tape = new ConsoleTape();\n        TopOfBook l1 = new TopOfBook();\n        exchange.addDefaultListener(tape);\n        exchange.addDefaultListener(l1);\n        MatchingEngine infy = exchange.book(&quot;INFY&quot;);\n\n        // makers rest and the ladder builds: two buys at the same price, one behind the other\n        infy.submit(Order.limit(&quot;b1&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.BUY,  Ticks.of(&quot;1499.95&quot;), 200));\n        infy.submit(Order.limit(&quot;b2&quot;, &quot;INFY&quot;, &quot;BEN&quot;, Side.BUY,  Ticks.of(&quot;1499.95&quot;), 300));\n        infy.submit(Order.limit(&quot;b3&quot;, &quot;INFY&quot;, &quot;CHE&quot;, Side.BUY,  Ticks.of(&quot;1499.90&quot;), 500));\n        infy.submit(Order.limit(&quot;a1&quot;, &quot;INFY&quot;, &quot;DEV&quot;, Side.SELL, Ticks.of(&quot;1500.05&quot;), 400));\n        infy.submit(Order.limit(&quot;a2&quot;, &quot;INFY&quot;, &quot;ESH&quot;, Side.SELL, Ticks.of(&quot;1500.10&quot;), 600));\n        System.out.println(&quot;quote           &quot; + infy.quote().text());\n        System.out.println(&quot;bids            &quot; + ladder(infy.depth(Side.BUY, 3)));\n        System.out.println(&quot;asks            &quot; + ladder(infy.depth(Side.SELL, 3)));\n\n        // an aggressive buy sweeps two levels and prints at each RESTING price, never at its own\n        SubmitResult sweep = infy.submit(Order.limit(&quot;t1&quot;, &quot;INFY&quot;, &quot;FIR&quot;, Side.BUY, Ticks.of(&quot;1500.10&quot;), 900));\n        System.out.println(&quot;sweep 900       &quot; + sweep.status() + &quot;, filled &quot; + sweep.filledQty() + &quot; lots&quot;);\n        for (Trade t : sweep.trades()) System.out.println(&quot;  tape          &quot; + t.text());\n\n        // price-time priority: b1 arrived first at 1499.95, so b1 fills before b2\n        SubmitResult hit = infy.submit(Order.limit(&quot;t2&quot;, &quot;INFY&quot;, &quot;GIR&quot;, Side.SELL, Ticks.of(&quot;1499.95&quot;), 300));\n        System.out.println(&quot;sell 300        &quot; + hit.trades().get(0).text() + &quot; then &quot; + hit.trades().get(1).text()\n                + &quot;  (b1 first: it arrived first)&quot;);\n        System.out.println(&quot;b2 still rests  &quot; + infy.resting(&quot;b2&quot;));\n\n        // fill-or-kill: not enough depth, so nothing at all happens\n        long bidsBefore = infy.restingQty(Side.BUY);\n        SubmitResult fok = infy.submit(Order.limit(&quot;t3&quot;, &quot;INFY&quot;, &quot;HAR&quot;, Side.SELL, Ticks.of(&quot;1499.90&quot;), 5000, TimeInForce.FOK));\n        System.out.println(&quot;FOK 5000        &quot; + fok.status() + &quot;: &quot; + fok.rejectReason());\n        System.out.println(&quot;book untouched  &quot; + (infy.restingQty(Side.BUY) == bidsBefore) + &quot;, still &quot; + bidsBefore + &quot; lots bid&quot;);\n\n        // IOC takes what is there and throws the rest away; a market order behaves the same way\n        SubmitResult ioc = infy.submit(Order.limit(&quot;t4&quot;, &quot;INFY&quot;, &quot;IND&quot;, Side.SELL, Ticks.of(&quot;1499.90&quot;), 1000, TimeInForce.IOC));\n        System.out.println(&quot;IOC 1000        &quot; + ioc.status() + &quot;, filled &quot; + ioc.filledQty() + &quot;, rested &quot; + ioc.restingQty());\n\n        // cancel: a resting order goes in O(1); an order that already filled simply says no\n        System.out.println(&quot;cancel a2       &quot; + infy.cancel(&quot;a2&quot;));\n        System.out.println(&quot;cancel b1       &quot; + infy.cancel(&quot;b1&quot;) + &quot;  (it had already filled: false, not an exception)&quot;);\n        System.out.println(&quot;bad tick        &quot; + infy.submit(Order.limit(&quot;t5&quot;, &quot;INFY&quot;, &quot;JAY&quot;, Side.BUY, Ticks.of(&quot;1499.97&quot;), 100)).rejectReason());\n\n        // a fresh maker, and a market order that sweeps it without ever resting\n        infy.submit(Order.limit(&quot;a3&quot;, &quot;INFY&quot;, &quot;KAV&quot;, Side.SELL, Ticks.of(&quot;1500.00&quot;), 250));\n        System.out.println(&quot;quote           &quot; + l1.last().text());\n        SubmitResult mkt = infy.submit(Order.market(&quot;t6&quot;, &quot;INFY&quot;, &quot;LAL&quot;, Side.BUY, 400));\n        System.out.println(&quot;market 400      &quot; + mkt.status() + &quot;, filled &quot; + mkt.filledQty()\n                + &quot;, rested &quot; + mkt.restingQty() + &quot;  (a market order never rests)&quot;);\n        System.out.println(&quot;tape            &quot; + tape.printed().size() + &quot; trades printed&quot;);\n\n        // fifty threads crossing at one book at the same instant: every lot must be accounted for\n        MatchingEngine tcs = exchange.book(&quot;TCS&quot;);\n        List&lt;Order&gt; sentOrders = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; futures = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final int n = i;\n            futures.add(pool.submit(() -&gt; {\n                go.await();\n                Order o = Order.limit(&quot;r&quot; + n, &quot;TCS&quot;, &quot;M&quot; + (n % 5),\n                        n % 2 == 0 ? Side.BUY : Side.SELL, Ticks.of(&quot;3000.00&quot;), n % 2 == 0 ? 100 : 80);\n                sentOrders.add(o);\n                return tcs.submit(o);\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : futures) f.get();\n        pool.shutdown();\n        long bought = 0, sold = 0, sentBuy = 0, sentSell = 0, broken = 0;\n        for (Order o : sentOrders) {\n            if (o.remaining() &lt; 0 || o.filled() &gt; o.qty()) broken++;\n            if (o.side() == Side.BUY) { bought += o.filled(); sentBuy += o.qty(); }\n            else                      { sold   += o.filled(); sentSell += o.qty(); }\n        }\n        long restingBids = tcs.restingQty(Side.BUY), restingAsks = tcs.restingQty(Side.SELL);\n        System.out.println(&quot;race            50 orders at once: bought &quot; + bought + &quot;, sold &quot; + sold\n                + &quot;, resting &quot; + restingBids + &quot; bid / &quot; + restingAsks + &quot; ask&quot;);\n        if (bought != sold || broken != 0 || sentBuy - bought != restingBids || sentSell - sold != restingAsks)\n            throw new AssertionError(&quot;the book lost or invented lots: bought=&quot; + bought + &quot; sold=&quot; + sold);\n        System.out.println(&quot;conserved       every lot bought was a lot sold; sent = filled + resting on both sides&quot;);\n    }\n\n    /** The depth ladder as one readable line. */\n    private static String ladder(List&lt;Rung&gt; rungs) {\n        StringBuilder sb = new StringBuilder();\n        for (Rung r : rungs) sb.append(sb.length() == 0 ? &quot;&quot; : &quot;   &quot;).append(r.text());\n        return sb.toString();\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: pro-rata -- &quot;this contract allocates pro-rata&quot;. A NEW class and one configure line; the engine does not move.\n/**\n * Every resting order at the level gives up a slice proportional to its size, not its place in the\n * queue. The floor leaves dust, and the dust goes down the queue in arrival order, so time priority\n * is still the tie-break. Slices below minLot are dropped: a venue will not print two-lot fills.\n */\nfinal class ProRataAllocator implements Allocator {\n    private final long minLot;\n    ProRataAllocator(long minLot) { this.minLot = minLot; }\n\n    public List&lt;Allocation&gt; allocate(Order taker, PriceLevel level) {\n        long want = Math.min(taker.remaining(), level.totalQty());\n        long resting = level.totalQty();\n        Map&lt;String, Long&gt; give = new LinkedHashMap&lt;&gt;();                     // queue order, so dust is deterministic\n        long given = 0;\n        for (Order maker : level.queue()) {\n            long share = want * maker.remaining() / resting;                // floor: quantities are lots, not money\n            if (share &lt; minLot) share = 0;\n            share = Math.min(share, maker.remaining());\n            if (share &gt; 0) { give.put(maker.id(), share); given += share; }\n        }\n        for (Order maker : level.queue()) {                                 // the dust, first come first served\n            if (given == want) break;\n            long already = give.getOrDefault(maker.id(), 0L);\n            long extra = Math.min(maker.remaining() - already, want - given);\n            if (extra &gt; 0) { give.put(maker.id(), already + extra); given += extra; }\n        }\n        List&lt;Allocation&gt; plan = new ArrayList&lt;&gt;(give.size());\n        give.forEach((id, q) -&gt; plan.add(new Allocation(id, q)));\n        return plan;\n    }\n}\n// the only change at the call site:\n//   engine.configure(new ProRataAllocator(1));\n// the engine still wraps it in CheckedAllocator, so a rulebook that over-allocates is caught before any write.\n\n// ---- ext: self-trade prevention -- a member must never trade against their own resting order\n/**\n * A rule that wraps another rule: it takes the plan the real allocator made, drops the lines where\n * the maker belongs to the same member as the taker, and hands the freed lots to the next orders in\n * the queue. SKIP is the common venue default; CANCEL_NEWEST and CANCEL_OLDEST need the engine to\n * remove an order, so they belong in the engine, not in a pure allocator.\n */\nfinal class SelfTradeGuard implements Allocator {\n    private final Allocator base;\n    private final AtomicLong skipped = new AtomicLong();\n    SelfTradeGuard(Allocator base) { this.base = base; }\n    /** How many lots this guard has refused to cross. Market surveillance asks for exactly this number. */\n    long skippedLots() { return skipped.get(); }\n\n    public List&lt;Allocation&gt; allocate(Order taker, PriceLevel level) {\n        Map&lt;String, Long&gt; give = new LinkedHashMap&lt;&gt;();\n        long allocated = 0;\n        for (Allocation a : base.allocate(taker, level)) {\n            Order maker = level.find(a.makerOrderId());\n            if (maker != null &amp;&amp; maker.memberId().equals(taker.memberId())) { skipped.addAndGet(a.qty()); continue; }\n            give.put(a.makerOrderId(), a.qty());\n            allocated += a.qty();\n        }\n        long left = taker.remaining() - allocated;                          // give the freed lots to somebody else\n        for (Order maker : level.queue()) {\n            if (left == 0) break;\n            if (maker.memberId().equals(taker.memberId())) continue;\n            long already = give.getOrDefault(maker.id(), 0L);\n            long extra = Math.min(maker.remaining() - already, left);\n            if (extra &gt; 0) { give.put(maker.id(), already + extra); left -= extra; }\n        }\n        List&lt;Allocation&gt; plan = new ArrayList&lt;&gt;(give.size());\n        give.forEach((id, q) -&gt; plan.add(new Allocation(id, q)));\n        return plan;\n    }\n}\n\n// ---- ext: iceberg -- show 100 of 10,000 at a time, and refresh when the slice is gone\n/**\n * An iceberg is not a new kind of order in the book: it is a small child order that keeps coming\n * back. This listener watches for its visible slice being exhausted and sends the next one, which\n * joins the BACK of the queue -- the price a hidden order pays for hiding.\n */\nfinal class Iceberg implements BookListener {\n    private final MatchingEngine engine;\n    private final String baseId, symbol, memberId;\n    private final Side side;\n    private final long priceTicks, showQty;\n    private long hidden;\n    private volatile String visibleId;\n    private int slice;\n\n    Iceberg(MatchingEngine engine, String baseId, String symbol, String memberId, Side side,\n            long priceTicks, long totalQty, long showQty) {\n        this.engine = engine; this.baseId = baseId; this.symbol = symbol; this.memberId = memberId;\n        this.side = side; this.priceTicks = priceTicks; this.hidden = totalQty; this.showQty = showQty;\n    }\n    /** Put the first slice in the book. */\n    void start() { engine.addListener(this); showNext(); }\n    /** Lots still hidden behind the displayed slice. */\n    long hidden() { return hidden; }\n    /** The id of the slice currently resting, or null when the iceberg is done. */\n    String visibleId() { return visibleId; }\n\n    public void onTrade(Trade t) {\n        String mine = visibleId;\n        if (mine == null) return;\n        if (!mine.equals(t.buyOrderId()) &amp;&amp; !mine.equals(t.sellOrderId())) return;\n        if (engine.resting(mine) == null) showNext();                       // the slice is gone: show the next one\n    }\n    private void showNext() {\n        if (hidden &lt;= 0) { visibleId = null; return; }\n        long q = Math.min(showQty, hidden);\n        hidden -= q;\n        visibleId = baseId + &quot;#&quot; + (++slice);\n        engine.submit(Order.limit(visibleId, symbol, memberId, side, priceTicks, q));\n    }\n}\n\n// ---- ext: stop orders -- parked until the last traded price crosses a trigger, then submitted for real\n/**\n * A stop order is not in the book: it is parked in a side table and becomes an ordinary order the\n * moment a trade prints through its trigger. The table is two sorted maps, so finding everything\n * that fired is O(number fired), not O(number parked).\n */\nfinal class StopBook implements BookListener {\n    private final MatchingEngine engine;\n    private final NavigableMap&lt;Long, List&lt;Order&gt;&gt; buyStops = new TreeMap&lt;&gt;();                      // fire when last &gt;= key\n    private final NavigableMap&lt;Long, List&lt;Order&gt;&gt; sellStops = new TreeMap&lt;&gt;(Comparator.reverseOrder()); // fire when last &lt;= key\n    StopBook(MatchingEngine engine) { this.engine = engine; engine.addListener(this); }\n\n    /** Park an order until the tape prints through triggerTicks. */\n    synchronized void park(long triggerTicks, Order o) {\n        (o.side() == Side.BUY ? buyStops : sellStops).computeIfAbsent(triggerTicks, k -&gt; new ArrayList&lt;&gt;()).add(o);\n    }\n    /** How many orders are still parked. */\n    synchronized int parked() { return buyStops.values().stream().mapToInt(List::size).sum()\n                                    + sellStops.values().stream().mapToInt(List::size).sum(); }\n\n    public void onTrade(Trade t) {\n        List&lt;Order&gt; fired = new ArrayList&lt;&gt;();\n        synchronized (this) {\n            while (!buyStops.isEmpty() &amp;&amp; buyStops.firstKey() &lt;= t.priceTicks()) fired.addAll(buyStops.pollFirstEntry().getValue());\n            while (!sellStops.isEmpty() &amp;&amp; sellStops.firstKey() &gt;= t.priceTicks()) fired.addAll(sellStops.pollFirstEntry().getValue());\n        }\n        for (Order o : fired) engine.submit(o);                             // outside the book&#x27;s lock: this is a listener\n    }\n}\n\n// ---- ext: cancel-replace -- who keeps their place in the queue\n/**\n * Shrinking a resting order keeps its queue place, because the order object never leaves the queue.\n * Raising the quantity or moving the price is a cancel and a new order, and the new order joins the\n * back. Every venue works this way, and every trader is annoyed by it.\n */\nfinal class Replace {\n    /** Returns what happened, in the words a trader would use. */\n    static String replace(MatchingEngine engine, String orderId, String newId, long newPriceTicks, long newQty) {\n        Order live = engine.resting(orderId);\n        if (live == null) return &quot;gone: it filled or was already cancelled&quot;;\n        if (newPriceTicks == live.limitTicks() &amp;&amp; newQty &lt; live.remaining()\n                &amp;&amp; engine.amendDown(orderId, newQty)) return &quot;amended down, queue place kept&quot;;\n        if (!engine.cancel(orderId)) return &quot;gone: it filled while we were replacing it&quot;;\n        engine.submit(Order.limit(newId, live.symbol(), live.memberId(), live.side(), newPriceTicks, newQty));\n        return &quot;cancel and new, queue place lost&quot;;\n    }\n}\n\n// ---- ext: the journal -- every command, in order, so the book can be rebuilt exactly\n/**\n * What is written down is the COMMAND, not the book: every accepted order and every cancel, with the\n * sequence number the engine gave it. Replaying the commands into a fresh engine reproduces the same\n * trades, in the same order, because nothing in matching reads the wall clock or a random number.\n */\nfinal class Journal implements BookListener {\n    /** One recorded command. A cancel carries only the id. */\n    record Entry(long n, String kind, String orderId, String symbol, String memberId, Side side,\n                 OrderType type, TimeInForce tif, long priceTicks, long qty) {}\n    private final List&lt;Entry&gt; log = Collections.synchronizedList(new ArrayList&lt;&gt;());\n    private final AtomicLong n = new AtomicLong();\n\n    public void onAccepted(Order o) {\n        log.add(new Entry(n.incrementAndGet(), &quot;SUBMIT&quot;, o.id(), o.symbol(), o.memberId(),\n                          o.side(), o.type(), o.tif(), o.limitTicks(), o.qty()));\n    }\n    /** Called by the gateway when it asks for a cancel; the engine&#x27;s own events cannot tell a user cancel from an IOC kill. */\n    void cancelled(String orderId) { log.add(new Entry(n.incrementAndGet(), &quot;CANCEL&quot;, orderId, null, null, null, null, null, 0, 0)); }\n    /** Everything recorded, in order. */\n    List&lt;Entry&gt; log() { return List.copyOf(log); }\n\n    /** Rebuild a book from the log and return its tape. The tapes must match, trade for trade. */\n    static ConsoleTape replay(List&lt;Entry&gt; log, long tickSize, long lotSize, String symbol) {\n        MatchingEngine fresh = new MatchingEngine(symbol, tickSize, lotSize);\n        ConsoleTape tape = new ConsoleTape();\n        fresh.addListener(tape);\n        for (Entry e : log) {\n            if (e.kind().equals(&quot;CANCEL&quot;)) fresh.cancel(e.orderId());\n            else fresh.submit(new Order(e.orderId(), e.symbol(), e.memberId(), e.side(), e.type(), e.tif(), e.priceTicks(), e.qty()));\n        }\n        return tape;\n    }\n}\n\n// ---- ext: risk -- somebody new wants to know, and it costs one class\n/**\n * Per-member net position, kept from the tape. It learns which member owns which order from\n * onAccepted, then adds and subtracts as trades print. It observes; it cannot stop a trade, which is\n * why real pre-trade risk sits in front of the engine, not behind it.\n */\nfinal class RiskMonitor implements BookListener {\n    private final Map&lt;String, String&gt; memberOf = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Long&gt; position = new ConcurrentHashMap&lt;&gt;();\n    private final long limitLots;\n    private final List&lt;String&gt; alarms = Collections.synchronizedList(new ArrayList&lt;&gt;());\n    RiskMonitor(long limitLots) { this.limitLots = limitLots; }\n\n    public void onAccepted(Order o) { memberOf.put(o.id(), o.memberId()); }\n    public void onTrade(Trade t) { move(memberOf.get(t.buyOrderId()), t.qty()); move(memberOf.get(t.sellOrderId()), -t.qty()); }\n    private void move(String member, long lots) {\n        if (member == null) return;\n        long now = position.me

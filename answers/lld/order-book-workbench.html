rge(member, lots, Long::sum);\n        if (Math.abs(now) &gt; limitLots) alarms.add(member + &quot; is at &quot; + now + &quot; lots, over the &quot; + limitLots + &quot; limit&quot;);\n    }\n    /** A member&#x27;s net position in lots: positive is long. */\n    long positionOf(String member) { return position.getOrDefault(member, 0L); }\n    /** Every limit breach seen so far. */\n    List&lt;String&gt; alarms() { return List.copyOf(alarms); }\n}\n\n// ---- ext: the single writer -- the top rung of the ladder, where the lock disappears\n/**\n * One thread owns the book and takes orders off a queue, so there is no contention left to lock\n * against. The caller gets a Future instead of an answer. This is what a production venue does, and\n * the only thing that changes is who calls submit().\n */\nfinal class SingleWriter implements AutoCloseable {\n    private final MatchingEngine engine;\n    private final BlockingQueue&lt;FutureTask&lt;SubmitResult&gt;&gt; inbox = new ArrayBlockingQueue&lt;&gt;(4096);\n    private final Thread writer;\n    private volatile boolean running = true;\n\n    SingleWriter(MatchingEngine engine) {\n        this.engine = engine;\n        this.writer = new Thread(this::drain, &quot;book-writer&quot;);\n        writer.setDaemon(true);\n        writer.start();\n    }\n    /** Hand the order to the writer thread. The Future completes when the book has processed it. */\n    Future&lt;SubmitResult&gt; submit(Order o) {\n        FutureTask&lt;SubmitResult&gt; task = new FutureTask&lt;&gt;(() -&gt; engine.submit(o));\n        if (!inbox.offer(task)) throw new IllegalStateException(&quot;inbox full: back-pressure, tell the gateway to slow down&quot;);\n        return task;\n    }\n    private void drain() {\n        while (running) {\n            try { FutureTask&lt;SubmitResult&gt; t = inbox.poll(50, TimeUnit.MILLISECONDS); if (t != null) t.run(); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }\n        }\n    }\n    public void close() { running = false; writer.interrupt(); }\n}\n\n// ---- ext: the race -- what the lock is actually preventing, in eight lines\n/**\n * The gap, with the window widened to three milliseconds so it happens every time: two takers both\n * read &quot;100 lots available&quot;, both decide to take 100, and both write. The venue sold two hundred\n * lots of a hundred-lot order. This is the whole argument for the lock.\n */\nfinal class RaceDemo {\n    /** Lots sold against a single 100-lot resting order, with no lock. Returns 200. */\n    static long unguarded() throws InterruptedException { return run(null); }\n    /** The same two takers, with one lock around read-and-write. Returns 100. */\n    static long guarded() throws InterruptedException { return run(new java.util.concurrent.locks.ReentrantLock()); }\n\n    private static long run(java.util.concurrent.locks.ReentrantLock lock) throws InterruptedException {\n        long[] remaining = { 100 };\n        AtomicLong sold = new AtomicLong();\n        Runnable taker = () -&gt; {\n            if (lock != null) lock.lock();\n            try {\n                long saw = remaining[0];                                     // READ: &quot;100 available&quot;\n                if (lock == null) try { Thread.sleep(3); } catch (InterruptedException ignored) {}\n                if (saw &gt;= 100) { remaining[0] = saw - 100; sold.addAndGet(100); }   // WRITE: &quot;take 100&quot;\n            } finally { if (lock != null) lock.unlock(); }\n        };\n        Thread a = new Thread(taker), b = new Thread(taker);\n        a.start(); b.start(); a.join(); b.join();\n        return sold.get();\n    }\n}\n\n/** Runs every extension once, so the reference code on page 05 is code that has actually executed. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        long TICK = 5, LOT = 1;\n\n        // 1. pro-rata: the same level, two rulebooks, two different answers\n        for (String rule : new String[] { &quot;price-time&quot;, &quot;pro-rata&quot; }) {\n            MatchingEngine e = new MatchingEngine(&quot;NIFTY&quot;, TICK, LOT);\n            if (rule.equals(&quot;pro-rata&quot;)) e.configure(new ProRataAllocator(1));\n            e.submit(Order.limit(&quot;m1&quot;, &quot;NIFTY&quot;, &quot;ANA&quot;, Side.SELL, Ticks.of(&quot;100.00&quot;), 100));\n            e.submit(Order.limit(&quot;m2&quot;, &quot;NIFTY&quot;, &quot;BEN&quot;, Side.SELL, Ticks.of(&quot;100.00&quot;), 900));\n            SubmitResult r = e.submit(Order.limit(&quot;taker&quot;, &quot;NIFTY&quot;, &quot;CHE&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 500));\n            StringBuilder sb = new StringBuilder();\n            for (Trade t : r.trades()) sb.append(t.sellOrderId()).append(&quot;=&quot;).append(t.qty()).append(&quot; &quot;);\n            System.out.println(String.format(&quot;%-10s&quot;, rule) + &quot; a 500-lot taker against 100 + 900 resting -&gt; &quot; + sb);\n        }\n\n        // 2. self-trade prevention: the member&#x27;s own order is skipped and the lots go to somebody else\n        MatchingEngine stp = new MatchingEngine(&quot;INFY&quot;, TICK, LOT);\n        SelfTradeGuard guard = new SelfTradeGuard(new PriceTimeAllocator());\n        stp.configure(guard);\n        stp.submit(Order.limit(&quot;own&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.SELL, Ticks.of(&quot;1500.00&quot;), 300));\n        stp.submit(Order.limit(&quot;other&quot;, &quot;INFY&quot;, &quot;BEN&quot;, Side.SELL, Ticks.of(&quot;1500.00&quot;), 300));\n        SubmitResult self = stp.submit(Order.limit(&quot;mine&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.BUY, Ticks.of(&quot;1500.00&quot;), 300));\n        System.out.println(&quot;self-trade traded with &quot; + self.trades().get(0).sellOrderId() + &quot;, skipped &quot;\n                + guard.skippedLots() + &quot; of ANA&#x27;s own lots; ANA still rests &quot; + stp.resting(&quot;own&quot;).remaining());\n\n        // 3. iceberg: 1000 lots shown 100 at a time\n        MatchingEngine ice = new MatchingEngine(&quot;TCS&quot;, TICK, LOT);\n        Iceberg berg = new Iceberg(ice, &quot;ice&quot;, &quot;TCS&quot;, &quot;DEV&quot;, Side.SELL, Ticks.of(&quot;3000.00&quot;), 1000, 100);\n        berg.start();\n        System.out.println(&quot;iceberg    shows &quot; + ice.restingQty(Side.SELL) + &quot; lots, hides &quot; + berg.hidden());\n        ice.submit(Order.limit(&quot;eat&quot;, &quot;TCS&quot;, &quot;ESH&quot;, Side.BUY, Ticks.of(&quot;3000.00&quot;), 250));\n        System.out.println(&quot;iceberg    after a 250-lot buy: shown &quot; + ice.restingQty(Side.SELL)\n                + &quot;, hidden &quot; + berg.hidden() + &quot;, visible slice &quot; + berg.visibleId());\n\n        // 4. stop orders: parked until the tape prints through the trigger\n        MatchingEngine stops = new MatchingEngine(&quot;SBIN&quot;, TICK, LOT);\n        StopBook table = new StopBook(stops);\n        table.park(Ticks.of(&quot;795.00&quot;), Order.market(&quot;stop1&quot;, &quot;SBIN&quot;, &quot;FIR&quot;, Side.SELL, 50));\n        stops.submit(Order.limit(&quot;bid1&quot;, &quot;SBIN&quot;, &quot;GIR&quot;, Side.BUY, Ticks.of(&quot;799.00&quot;), 500));\n        stops.submit(Order.limit(&quot;ask1&quot;, &quot;SBIN&quot;, &quot;HAR&quot;, Side.SELL, Ticks.of(&quot;799.00&quot;), 10));\n        System.out.println(&quot;stop       a trade printed at 799.00, trigger is 795.00, still parked: &quot; + table.parked());\n        stops.cancel(&quot;bid1&quot;);                                               // the bid walks away, the price falls\n        stops.submit(Order.limit(&quot;bid2&quot;, &quot;SBIN&quot;, &quot;IND&quot;, Side.BUY, Ticks.of(&quot;794.00&quot;), 500));\n        stops.submit(Order.limit(&quot;ask2&quot;, &quot;SBIN&quot;, &quot;JAY&quot;, Side.SELL, Ticks.of(&quot;794.00&quot;), 10));\n        System.out.println(&quot;stop       a trade printed at 794.00: parked &quot; + table.parked()\n                + &quot;, and the fired 50-lot market sell left &quot; + stops.restingQty(Side.BUY) + &quot; lots bid (was 500)&quot;);\n\n        // 5. cancel-replace: shrink keeps the place, everything else loses it\n        MatchingEngine rep = new MatchingEngine(&quot;HDFC&quot;, TICK, LOT);\n        rep.submit(Order.limit(&quot;first&quot;, &quot;HDFC&quot;, &quot;KAV&quot;, Side.BUY, Ticks.of(&quot;1600.00&quot;), 500));\n        rep.submit(Order.limit(&quot;second&quot;, &quot;HDFC&quot;, &quot;LAL&quot;, Side.BUY, Ticks.of(&quot;1600.00&quot;), 500));\n        System.out.println(&quot;replace    shrink:  &quot; + Replace.replace(rep, &quot;first&quot;, &quot;first-b&quot;, Ticks.of(&quot;1600.00&quot;), 300));\n        System.out.println(&quot;replace    raise:   &quot; + Replace.replace(rep, &quot;first&quot;, &quot;first-c&quot;, Ticks.of(&quot;1600.00&quot;), 900));\n        SubmitResult who = rep.submit(Order.limit(&quot;seller&quot;, &quot;HDFC&quot;, &quot;MEE&quot;, Side.SELL, Ticks.of(&quot;1600.00&quot;), 100));\n        System.out.println(&quot;replace    the next fill went to &quot; + who.trades().get(0).buyOrderId() + &quot; (it is in front now)&quot;);\n\n        // 6. journal and replay: the same commands, the same tape\n        MatchingEngine live = new MatchingEngine(&quot;WIPRO&quot;, TICK, LOT);\n        Journal journal = new Journal();\n        ConsoleTape liveTape = new ConsoleTape();\n        live.addListener(journal); live.addListener(liveTape);\n        live.submit(Order.limit(&quot;j0&quot;, &quot;WIPRO&quot;, &quot;ANA&quot;, Side.BUY, Ticks.of(&quot;400.10&quot;), 100));\n        live.submit(Order.limit(&quot;j1&quot;, &quot;WIPRO&quot;, &quot;BEN&quot;, Side.BUY, Ticks.of(&quot;400.00&quot;), 300));\n        live.submit(Order.limit(&quot;j2&quot;, &quot;WIPRO&quot;, &quot;CHE&quot;, Side.BUY, Ticks.of(&quot;400.05&quot;), 200));\n        live.cancel(&quot;j1&quot;); journal.cancelled(&quot;j1&quot;);\n        live.submit(Order.limit(&quot;j3&quot;, &quot;WIPRO&quot;, &quot;DEV&quot;, Side.SELL, Ticks.of(&quot;399.00&quot;), 500));\n        ConsoleTape replayed = Journal.replay(journal.log(), TICK, LOT, &quot;WIPRO&quot;);\n        System.out.println(&quot;journal    &quot; + journal.log().size() + &quot; commands, live tape &quot; + liveTape.printed().size()\n                + &quot; trades, replayed tape &quot; + replayed.printed().size()\n                + &quot;, identical=&quot; + liveTape.printed().toString().equals(replayed.printed().toString()));\n\n        // 7. risk: one more listener, and nothing else changes\n        MatchingEngine risky = new MatchingEngine(&quot;ITC&quot;, TICK, LOT);\n        RiskMonitor risk = new RiskMonitor(400);\n        risky.addListener(risk);\n        risky.submit(Order.limit(&quot;s&quot;, &quot;ITC&quot;, &quot;SELLER&quot;, Side.SELL, Ticks.of(&quot;450.00&quot;), 1000));\n        risky.submit(Order.limit(&quot;b&quot;, &quot;ITC&quot;, &quot;BUYER&quot;, Side.BUY, Ticks.of(&quot;450.00&quot;), 500));\n        System.out.println(&quot;risk       BUYER is &quot; + risk.positionOf(&quot;BUYER&quot;) + &quot; lots, SELLER &quot; + risk.positionOf(&quot;SELLER&quot;)\n                + &quot;, alarms &quot; + risk.alarms());\n\n        // 8. the single writer: no contention left to lock against\n        MatchingEngine shard = new MatchingEngine(&quot;ONGC&quot;, TICK, LOT);\n        try (SingleWriter writer = new SingleWriter(shard)) {\n            List&lt;Future&lt;SubmitResult&gt;&gt; sent = new ArrayList&lt;&gt;();\n            for (int i = 0; i &lt; 20; i++)\n                sent.add(writer.submit(Order.limit(&quot;w&quot; + i, &quot;ONGC&quot;, &quot;M&quot; + i,\n                        i % 2 == 0 ? Side.BUY : Side.SELL, Ticks.of(&quot;200.00&quot;), 100)));\n            long filled = 0;\n            for (Future&lt;SubmitResult&gt; f : sent) filled += f.get(5, TimeUnit.SECONDS).filledQty();\n            System.out.println(&quot;writer     20 orders through one thread, &quot; + filled + &quot; lots filled, lock never contended&quot;);\n        }\n\n        // 9. the race the lock prevents\n        System.out.println(&quot;race       no lock: &quot; + RaceDemo.unguarded() + &quot; lots sold from a 100-lot order;  with the lock: &quot;\n                + RaceDemo.guarded());\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// targeted failure tests: each one proves a claim the design makes on page 02, move 9.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n    static MatchingEngine book(String symbol) { return new MatchingEngine(symbol, 5, 1); }   // tick 0.05, lot 1\n\n    public static void main(String[] args) throws Exception {\n\n        // 1. price-time priority: best price first, and inside a price the order that arrived first\n        MatchingEngine e1 = book(&quot;INFY&quot;);\n        e1.submit(Order.limit(&quot;early&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 100));\n        e1.submit(Order.limit(&quot;late&quot;,  &quot;INFY&quot;, &quot;BEN&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 100));\n        e1.submit(Order.limit(&quot;better&quot;,&quot;INFY&quot;, &quot;CHE&quot;, Side.BUY, Ticks.of(&quot;100.05&quot;), 100));\n        SubmitResult swept = e1.submit(Order.limit(&quot;taker&quot;, &quot;INFY&quot;, &quot;DEV&quot;, Side.SELL, Ticks.of(&quot;100.00&quot;), 250));\n        check(swept.trades().get(0).buyOrderId().equals(&quot;better&quot;), &quot;the better price is taken first, whenever it arrived&quot;);\n        check(swept.trades().get(1).buyOrderId().equals(&quot;early&quot;), &quot;inside one price, the order that arrived first fills first&quot;);\n        check(swept.trades().get(2).buyOrderId().equals(&quot;late&quot;) &amp;&amp; swept.trades().get(2).qty() == 50,\n              &quot;the last 50 lots go to the order behind it, not a lot more&quot;);\n        check(swept.trades().get(0).priceTicks() == Ticks.of(&quot;100.05&quot;),\n              &quot;the trade prints at the RESTING price, so the aggressor keeps the price improvement&quot;);\n\n        // 2. a partial fill leaves the remainder resting, and it keeps its place in the queue\n        MatchingEngine e2 = book(&quot;INFY&quot;);\n        e2.submit(Order.limit(&quot;maker&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.SELL, Ticks.of(&quot;100.00&quot;), 100));\n        SubmitResult part = e2.submit(Order.limit(&quot;big&quot;, &quot;INFY&quot;, &quot;BEN&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 300));\n        check(part.filledQty() == 100 &amp;&amp; part.restingQty() == 200, &quot;a 300-lot buy against 100 resting: 100 filled, 200 rests&quot;);\n        check(part.status() == OrderStatus.PARTIALLY_FILLED, &quot;and its state is PARTIALLY_FILLED, not FILLED&quot;);\n        check(e2.resting(&quot;big&quot;).remaining() == 200 &amp;&amp; e2.restingQty(Side.BUY) == 200, &quot;the book agrees: 200 lots bid&quot;);\n        e2.submit(Order.limit(&quot;behind&quot;, &quot;INFY&quot;, &quot;CHE&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 500));\n        SubmitResult next = e2.submit(Order.limit(&quot;seller&quot;, &quot;INFY&quot;, &quot;DEV&quot;, Side.SELL, Ticks.of(&quot;100.00&quot;), 100));\n        check(next.trades().get(0).buyOrderId().equals(&quot;big&quot;), &quot;the part-filled order is still in front of the one behind it&quot;);\n\n        // 3. a market order sweeps every crossing level, at the makers&#x27; prices, and never rests\n        MatchingEngine e3 = book(&quot;INFY&quot;);\n        e3.submit(Order.limit(&quot;a1&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.SELL, Ticks.of(&quot;100.00&quot;), 100));\n        e3.submit(Order.limit(&quot;a2&quot;, &quot;INFY&quot;, &quot;BEN&quot;, Side.SELL, Ticks.of(&quot;100.50&quot;), 100));\n        SubmitResult mkt = e3.submit(Order.market(&quot;m1&quot;, &quot;INFY&quot;, &quot;CHE&quot;, Side.BUY, 500));\n        check(mkt.trades().size() == 2, &quot;the market order swept both levels&quot;);\n        check(mkt.trades().get(0).priceTicks() == Ticks.of(&quot;100.00&quot;)\n              &amp;&amp; mkt.trades().get(1).priceTicks() == Ticks.of(&quot;100.50&quot;), &quot;it paid each maker&#x27;s own price, cheapest first&quot;);\n        check(mkt.status() == OrderStatus.CANCELLED &amp;&amp; mkt.restingQty() == 0 &amp;&amp; e3.restingQty(Side.BUY) == 0,\n              &quot;the 300 lots it could not fill were thrown away: a market order never rests&quot;);\n        check(e3.submit(Order.market(&quot;m2&quot;, &quot;INFY&quot;, &quot;DEV&quot;, Side.BUY, 100)).rejectReason() == null\n              &amp;&amp; e3.restingQty(Side.BUY) == 0, &quot;a market order into an empty book fills nothing and still rests nothing&quot;);\n\n        // 4. fill-or-kill is all or nothing, and a kill leaves the book exactly as it was\n        MatchingEngine e4 = book(&quot;INFY&quot;);\n        e4.submit(Order.limit(&quot;a1&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.SELL, Ticks.of(&quot;100.00&quot;), 100));\n        e4.submit(Order.limit(&quot;a2&quot;, &quot;INFY&quot;, &quot;BEN&quot;, Side.SELL, Ticks.of(&quot;100.05&quot;), 100));\n        List&lt;Rung&gt; before = e4.depth(Side.SELL, 10);\n        SubmitResult killed = e4.submit(Order.limit(&quot;fok&quot;, &quot;INFY&quot;, &quot;CHE&quot;, Side.BUY, Ticks.of(&quot;100.05&quot;), 500, TimeInForce.FOK));\n        check(killed.status() == OrderStatus.CANCELLED &amp;&amp; killed.filledQty() == 0, &quot;a fill-or-kill that cannot fill in full fills nothing&quot;);\n        check(killed.rejectReason().contains(&quot;only 200 available&quot;), &quot;and it says why: &quot; + killed.rejectReason());\n        check(e4.depth(Side.SELL, 10).equals(before), &quot;the book is untouched, level for level and lot for lot&quot;);\n        SubmitResult ok = e4.submit(Order.limit(&quot;fok2&quot;, &quot;INFY&quot;, &quot;DEV&quot;, Side.BUY, Ticks.of(&quot;100.05&quot;), 200, TimeInForce.FOK));\n        check(ok.status() == OrderStatus.FILLED &amp;&amp; ok.filledQty() == 200, &quot;a fill-or-kill that CAN fill in full does, in one go&quot;);\n\n        // 5. IOC takes what is there and cancels the rest\n        MatchingEngine e5 = book(&quot;INFY&quot;);\n        e5.submit(Order.limit(&quot;a1&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.SELL, Ticks.of(&quot;100.00&quot;), 120));\n        SubmitResult ioc = e5.submit(Order.limit(&quot;ioc&quot;, &quot;INFY&quot;, &quot;BEN&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 500, TimeInForce.IOC));\n        check(ioc.filledQty() == 120 &amp;&amp; ioc.restingQty() == 0, &quot;IOC took the 120 that were there and kept nothing&quot;);\n        check(ioc.status() == OrderStatus.CANCELLED &amp;&amp; e5.restingQty(Side.BUY) == 0, &quot;the 380 it could not fill are gone, not resting&quot;);\n\n        // 6. cancel and amend by id: what leaves the book, and what changes without leaving it\n        MatchingEngine e6 = book(&quot;INFY&quot;);\n        e6.submit(Order.limit(&quot;c1&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 100));\n        e6.submit(Order.limit(&quot;c2&quot;, &quot;INFY&quot;, &quot;BEN&quot;, Side.BUY, Ticks.of(&quot;99.95&quot;), 100));\n        check(e6.cancel(&quot;c1&quot;), &quot;a resting order cancels&quot;);\n        check(e6.quote().bidTicks() == Ticks.of(&quot;99.95&quot;), &quot;the emptied price level was pruned, so the top of book moved&quot;);\n        check(!e6.cancel(&quot;c1&quot;), &quot;cancelling it twice returns false, it does not throw&quot;);\n        check(!e6.cancel(&quot;never-existed&quot;), &quot;cancelling an unknown id returns false too&quot;);\n        e6.submit(Order.limit(&quot;c3&quot;, &quot;INFY&quot;, &quot;CHE&quot;, Side.SELL, Ticks.of(&quot;99.95&quot;), 100));\n        check(!e6.cancel(&quot;c2&quot;), &quot;cancelling an order that has already filled returns false: a cancel racing a fill is ordinary life&quot;);\n        check(e6.restingQty(Side.BUY) == 0 &amp;&amp; e6.restingQty(Side.SELL) == 0, &quot;and the book is empty, with nothing stuck in an index&quot;);\n        MatchingEngine e6b = book(&quot;INFY&quot;);\n        e6b.submit(Order.limit(&quot;front&quot;,  &quot;INFY&quot;, &quot;ANA&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 500));\n        e6b.submit(Order.limit(&quot;behind&quot;, &quot;INFY&quot;, &quot;BEN&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 100));\n        check(e6b.amendDown(&quot;front&quot;, 300), &quot;a resting order can be amended down&quot;);\n        check(!e6b.amendDown(&quot;front&quot;, 900), &quot;but not up: raising a quantity is a cancel and a new order, so it says no&quot;);\n        check(e6b.resting(&quot;front&quot;).filled() == 0 &amp;&amp; e6b.resting(&quot;front&quot;).qty() == 300,\n              &quot;the amend shrank the ORDER: it did not look like a 200-lot fill to risk or to the journal&quot;);\n        check(e6b.restingQty(Side.BUY) == 400, &quot;and the level total came down with it: 400 lots bid, not 600&quot;);\n        check(e6b.submit(Order.limit(&quot;s6&quot;, &quot;INFY&quot;, &quot;CHE&quot;, Side.SELL, Ticks.of(&quot;100.00&quot;), 50))\n                 .trades().get(0).buyOrderId().equals(&quot;front&quot;), &quot;and it kept its place at the front of the queue&quot;);\n\n        // 7. the race: fifty threads crossing at one book. Every lot must be accounted for.\n        MatchingEngine e7 = book(&quot;TCS&quot;);\n        ConsoleTape tape = new ConsoleTape();\n        e7.addListener(tape);\n        List&lt;Order&gt; sent = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; futures = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final int n = i;\n            futures.add(pool.submit(() -&gt; {\n                go.await();\n                Order o = Order.limit(&quot;r&quot; + n, &quot;TCS&quot;, &quot;M&quot; + (n % 5), n % 2 == 0 ? Side.BUY : Side.SELL,\n                                      Ticks.of(&quot;3000.00&quot;), n % 2 == 0 ? 100 : 80);\n                sent.add(o);\n                return e7.submit(o);\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : futures) f.get();\n        pool.shutdown();\n        long bought = 0, sold = 0, sentBuy = 0, sentSell = 0, printed = 0, liveBid = 0, liveAsk = 0;\n        boolean sane = true;\n        for (Order o : sent) {\n            if (o.remaining() &lt; 0 || o.filled() + o.remaining() != o.qty()) sane = false;\n            if (o.side() == Side.BUY) { bought += o.filled(); sentBuy += o.qty(); } else { sold += o.filled(); sentSell += o.qty(); }\n            if (e7.resting(o.id()) != null) { if (o.side() == Side.BUY) liveBid += o.remaining(); else liveAsk += o.remaining(); }\n        }\n        for (Trade t : tape.printed()) printed += t.qty();\n        check(sent.size() == 50, &quot;all fifty orders were submitted&quot;);\n        check(sane, &quot;no order ever went negative, and filled + remaining == quantity for every one of them&quot;);\n        check(bought == sold, &quot;lots bought (&quot; + bought + &quot;) == lots sold (&quot; + sold + &quot;): nothing was invented or lost&quot;);\n        check(printed == bought, &quot;the tape printed exactly those &quot; + printed + &quot; lots, no more&quot;);\n        check(sentBuy - bought == e7.restingQty(Side.BUY) &amp;&amp; sentSell - sold == e7.restingQty(Side.SELL),\n              &quot;on each side: submitted = filled + still resting&quot;);\n        check(liveBid == e7.restingQty(Side.BUY) &amp;&amp; liveAsk == e7.restingQty(Side.SELL),\n              &quot;the id index and the price ladders agree: no cached level total drifted&quot;);\n\n        // 8. a listener that throws, and an allocator that cheats, cannot corrupt the book\n        MatchingEngine e8 = book(&quot;INFY&quot;);\n        e8.addListener(new BookListener() {\n            public void onTrade(Trade t) { throw new RuntimeException(&quot;the tape socket is down&quot;); }\n            public void onQuote(Quote q) { throw new RuntimeException(&quot;market data is down too&quot;); }\n        });\n        e8.submit(Order.limit(&quot;m&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.SELL, Ticks.of(&quot;100.00&quot;), 100));\n        SubmitResult through = e8.submit(Order.limit(&quot;t&quot;, &quot;INFY&quot;, &quot;BEN&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 100));\n        check(through.status() == OrderStatus.FILLED &amp;&amp; through.trades().size() == 1,\n              &quot;the trade happened although every listener threw: listeners run after the unlock, in a try/catch&quot;);\n        MatchingEngine e9 = book(&quot;INFY&quot;);\n        e9.configure((taker, level) -&gt; List.of(new Allocation(level.queue().get(0).id(), 999_999)));  // a rulebook that overfills\n        e9.submit(Order.limit(&quot;honest&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.SELL, Ticks.of(&quot;100.00&quot;), 100));\n        List&lt;Rung&gt; untouched = e9.depth(Side.SELL, 10);\n        try {\n            e9.submit(Order.limit(&quot;victim&quot;, &quot;INFY&quot;, &quot;BEN&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 100));\n            check(false, &quot;an allocator handing out more than exists must be caught&quot;);\n        } catch (IllegalStateException ex) { check(true, &quot;CheckedAllocator caught the broken rulebook: &quot; + ex.getMessage()); }\n        check(e9.depth(Side.SELL, 10).equals(untouched) &amp;&amp; e9.resting(&quot;honest&quot;).remaining() == 100,\n              &quot;and it wrote nothing: the plan is checked before a single lot moves&quot;);\n\n        // 9. rejected orders write nothing at all, and time comes from the injected clock\n        MatchingEngine e10 = book(&quot;INFY&quot;);\n        e10.submit(Order.limit(&quot;rest&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.SELL, Ticks.of(&quot;100.00&quot;), 100));\n        List&lt;Rung&gt; asBefore = e10.depth(Side.SELL, 10);\n        check(e10.submit(Order.limit(&quot;bad1&quot;, &quot;INFY&quot;, &quot;BEN&quot;, Side.BUY, Ticks.of(&quot;100.03&quot;), 10)).status() == OrderStatus.REJECTED,\n              &quot;a price off the 0.05 tick is rejected&quot;);\n        check(e10.submit(Order.limit(&quot;bad2&quot;, &quot;INFY&quot;, &quot;BEN&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 0)).status() == OrderStatus.REJECTED,\n              &quot;a zero quantity is rejected&quot;);\n        check(e10.submit(Order.limit(&quot;rest&quot;, &quot;INFY&quot;, &quot;CHE&quot;, Side.BUY, Ticks.of(&quot;99.00&quot;), 10)).rejectReason().contains(&quot;already used&quot;),\n              &quot;a reused order id is rejected, so a retried request cannot double-submit&quot;);\n        check(e10.depth(Side.SELL, 10).equals(asBefore) &amp;&amp; e10.restingQty(Side.BUY) == 0,\n              &quot;none of the three rejections touched the book&quot;);\n        e10.setClock(() -&gt; 1_700_000_000_000L);\n        SubmitResult stamped = e10.submit(Order.limit(&quot;clocked&quot;, &quot;INFY&quot;, &quot;DEV&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 100));\n        check(stamped.trades().get(0).atMs() == 1_700_000_000_000L, &quot;the trade carries the injected instant, so a test can assert on it&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design the order book and matching engine for one instrument on an exchange. Members send limit and market orders; the engine matches whatever crosses, prints the trades, and lets a member cancel what has not filled. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (how a price is represented, and price-time versus pro-rata, come first); then type in the order of Main.java: the four enums, the Ticks helpers, Order with its <code>take</code> and <code>moveTo</code>, the records (Trade, Allocation, SubmitResult, Quote), PriceLevel, OrderBook, the Allocator interface with price-time and the checked wrapper, the BookListener interface with the tape, then MatchingEngine with its lock and the order of operations at submit, then the Exchange router, then a main that rests a ladder, sweeps it and finishes with fifty threads.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Walk me through matching one order, level by level. A 250-lot sell arrives; the book has 100 lots bid at 100.05 and two 100-lot bids at 100.00, the first of which queued earlier.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The loop takes the best price on the opposite ladder, checks it still crosses, asks the allocator who at that price gets filled, applies that plan, and then steps to the next price. Here: the best bid is 100.05 and the sell at 100.00 crosses it, so the single order there gives up 100 lots, the level empties and the book prunes it. The next price is 100.00, which still crosses; the allocator walks that level's queue in arrival order and returns 100 lots to the order that queued first and 50 to the one behind it. The taker now has nothing left, the loop ends, and three trades print &mdash; at 100.05, 100.00 and 100.00, always the <i>resting</i> order's price. Two details are the whole answer: each price is visited exactly once, because the next step is <code>higherEntry</code> of the price just looked at, so the loop cannot spin on a level the allocator declined to fill; and deciding the plan and applying it happen inside the same lock, so nothing can slip in between the decision and the write.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Walk the opposite ladder while it crosses: best price first, and inside a price whatever the\n     * allocator says. Each level is looked at once, so the loop always ends.\n     */\n    private List&lt;Trade&gt; match(Order taker, List&lt;Consumer&lt;BookListener&gt;&gt; events) {\n        List&lt;Trade&gt; trades = new ArrayList&lt;&gt;();\n        NavigableMap&lt;Long, PriceLevel&gt; opposite = book.ladder(taker.side().opposite());\n        Long seen = null;                                                  // the last price we looked at\n        while (taker.remaining() &gt; 0) {\n            Map.Entry&lt;Long, PriceLevel&gt; best = (seen == null) ? opposite.firstEntry() : opposite.higherEntry(seen);\n            if (best == null) break;                                       // the ladder ran out\n            if (!OrderBook.crosses(taker, best.getKey())) break;           // the price stopped crossing\n            PriceLevel level = best.getValue();\n            seen = best.getKey();\n            List&lt;Allocation&gt; plan = allocator.allocate(taker, level);      // decide: pure, mutates nothing\n            for (Allocation a : plan) {                                    // apply: the same lock, the same instant\n                Order maker = level.find(a.makerOrderId());\n                long q = a.qty();\n                level.reduce(maker, q);\n                taker.take(q);\n                if (maker.remaining() == 0) { maker.moveTo(OrderStatus.FILLED); book.forget(maker.id()); }\n                else maker.moveTo(OrderStatus.PARTIALLY_FILLED);\n                Trade t = new Trade(++seq, symbol, level.priceTicks(), q,\n                        taker.side() == Side.BUY ? taker.id() : maker.id(),\n                        taker.side() == Side.BUY ? maker.id() : taker.id(),\n                        taker.side(), clock.nowMs());\n                trades.add(t);\n                events.add(l -&gt; l.onTrade(t));\n            }\n            if (level.isEmpty()) book.pruneIfEmpty(taker.side().opposite(), seen);   // the book prunes its own ladder\n        }\n        return trades;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>2 &middot; Mid-round: &quot;this contract allocates pro-rata, so a 500-lot taker splits across resting size, not arrival time.&quot;</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The allocation rule is already an interface, so this is one new class and one line: <code>engine.configure(new ProRataAllocator(1))</code>. It gives each resting order a slice proportional to its size, floors the slice because lots are whole numbers, drops slices below a minimum lot, and hands the dust that flooring left down the queue in arrival order &mdash; so time priority survives as the tie-break. Against 100 and 900 lots resting, a 500-lot taker fills 100 then 400 under price-time and 50 then 450 under pro-rata. The engine's matching loop does not change one character, and that is only cheap because <code>allocate()</code> is pure: it decides a plan and mutates nothing, so the engine can check the plan before applying it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: pro-rata -- &quot;this contract allocates pro-rata&quot;. A NEW class and one configure line; the engine does not move.\n/**\n * Every resting order at the level gives up a slice proportional to its size, not its place in the\n * queue. The floor leaves dust, and the dust goes down the queue in arrival order, so time priority\n * is still the tie-break. Slices below minLot are dropped: a venue will not print two-lot fills.\n */\nfinal class ProRataAllocator implements Allocator {\n    private final long minLot;\n    ProRataAllocator(long minLot) { this.minLot = minLot; }\n\n    public List&lt;Allocation&gt; allocate(Order taker, PriceLevel level) {\n        long want = Math.min(taker.remaining(), level.totalQty());\n        long resting = level.totalQty();\n        Map&lt;String, Long&gt; give = new LinkedHashMap&lt;&gt;();                     // queue order, so dust is deterministic\n        long given = 0;\n        for (Order maker : level.queue()) {\n            long share = want * maker.remaining() / resting;                // floor: quantities are lots, not money\n            if (share &lt; minLot) share = 0;\n            share = Math.min(share, maker.remaining());\n            if (share &gt; 0) { give.put(maker.id(), share); given += share; }\n        }\n        for (Order maker : level.queue()) {                                 // the dust, first come first served\n            if (given == want) break;\n            long already = give.getOrDefault(maker.id(), 0L);\n            long extra = Math.min(maker.remaining() - already, want - given);\n            if (extra &gt; 0) { give.put(maker.id(), already + extra); given += extra; }\n        }\n        List&lt;Allocation&gt; plan = new ArrayList&lt;&gt;(give.size());\n        give.forEach((id, q) -&gt; plan.add(new Allocation(id, q)));\n        return plan;\n    }\n}\n// the only change at the call site:\n//   engine.configure(new ProRataAllocator(1));\n// the engine still wraps it in CheckedAllocator, so a rulebook that over-allocates is caught before any write.\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; Two takers hit the same resting order at the same instant. Prove you cannot sell stock that is not there.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading a resting order's remaining quantity and writing the new one. Everything from the validation through the allocator's plan to the last lot applied happens inside one lock held by the engine, so no other writer can run in that gap; <code>Order.take()</code> is the second line of defence, refusing any fill larger than what is left. The proof is arithmetic, not a count: fifty threads wait on one latch, all fifty submit crossing orders into one book, and the test then adds up the lots bought and the lots sold. They must be equal, because every trade adds the same quantity to both. It also checks that filled + remaining equals the original quantity for every order, that the tape printed exactly those lots and no more, and that the id index and the price ladders still agree &mdash; which is what catches a cached level total that drifted.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 7. the race: fifty threads crossing at one book. Every lot must be accounted for.\n        MatchingEngine e7 = book(&quot;TCS&quot;);\n        ConsoleTape tape = new ConsoleTape();\n        e7.addListener(tape);\n        List&lt;Order&gt; sent = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; futures = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final int n = i;\n            futures.add(pool.submit(() -&gt; {\n                go.await();\n                Order o = Order.limit(&quot;r&quot; + n, &quot;TCS&quot;, &quot;M&quot; + (n % 5), n % 2 == 0 ? Side.BUY : Side.SELL,\n                                      Ticks.of(&quot;3000.00&quot;), n % 2 == 0 ? 100 : 80);\n                sent.add(o);\n                return e7.submit(o);\n            }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : futures) f.get();\n        pool.shutdown();\n        long bought = 0, sold = 0, sentBuy = 0, sentSell = 0, printed = 0, liveBid = 0, liveAsk = 0;\n        boolean sane = true;\n        for (Order o : sent) {\n            if (o.remaining() &lt; 0 || o.filled() + o.remaining() != o.qty()) sane = false;\n            if (o.side() == Side.BUY) { bought += o.filled(); sentBuy += o.qty(); } else { sold += o.filled(); sentSell += o.qty(); }\n            if (e7.resting(o.id()) != null) { if (o.side() == Side.BUY) liveBid += o.remaining(); else liveAsk += o.remaining(); }\n        }\n        for (Trade t : tape.printed()) printed += t.qty();\n        check(sent.size() == 50, &quot;all fifty orders were submitted&quot;);\n        check(sane, &quot;no order ever went negative, and filled + remaining == quantity for every one of them&quot;);\n        check(bought == sold, &quot;lots bought (&quot; + bought + &quot;) == lots sold (&quot; + sold + &quot;): nothing was invented or lost&quot;);\n        check(printed == bought, &quot;the tape printed exactly those &quot; + printed + &quot; lots, no more&quot;);\n        check(sentBuy - bought == e7.restingQty(Side.BUY) &amp;&amp; sentSell - sold == e7.restingQty(Side.SELL),\n              &quot;on each side: submitted = filled + still resting&quot;);\n        check(liveBid == e7.restingQty(Side.BUY) &amp;&amp; liveAsk == e7.restingQty(Side.SELL),\n              &quot;the id index and the price ladders agree: no cached level total drifted&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>4 &middot; One lock per book. Does that scale, or have you serialised the exchange?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It scales, and the way to answer is to name what breaks first. The lock holds about forty map and tree operations, roughly three microseconds, so one book is six tenths of one per cent busy at two thousand orders a second and thirty per cent busy at a hundred thousand &mdash; and no single symbol sees a hundred thousand. What breaks first is not the lock, it is the fan-out after it: <code>fire()</code> calls every listener one at a time on the submitting thread, so one slow consumer adds its own latency to every order on that book. The fix for that is a queue per listener, not a bigger lock. For many symbols the router is the answer &mdash; one engine and one lock each, so twelve hundred books never contend &mdash; but do not give each book a thread: twelve hundred threads on forty cores is a context-switch bill. Run a small pool of writer threads with each symbol pinned to exactly one, which is the third rung of move 8 and also gives replay the deterministic stream it needs. That rung is where back-pressure becomes a real answer too: the writer's inbox is a bounded queue, and a full inbox rejects the order and tells the gateway to slow down &mdash; a far better failure than an unbounded queue quietly growing until the process dies.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the single writer -- the top rung of the ladder, where the lock disappears\n/**\n * One thread owns the book and takes orders off a queue, so there is no contention left to lock\n * against. The caller gets a Future instead of an answer. This is what a production venue does, and\n * the only thing that changes is who calls submit().\n */\nfinal class SingleWriter implements AutoCloseable {\n    private final MatchingEngine engine;\n    private final BlockingQueue&lt;FutureTask&lt;SubmitResult&gt;&gt; inbox = new ArrayBlockingQueue&lt;&gt;(4096);\n    private final Thread writer;\n    private volatile boolean running = true;\n\n    SingleWriter(MatchingEngine engine) {\n        this.engine = engine;\n        this.writer = new Thread(this::drain, &quot;book-writer&quot;);\n        writer.setDaemon(true);\n        writer.start();\n    }\n    /** Hand the order to the writer thread. The Future completes when the book has processed it. */\n    Future&lt;SubmitResult&gt; submit(Order o) {\n        FutureTask&lt;SubmitResult&gt; task = new FutureTask&lt;&gt;(() -&gt; engine.submit(o));\n        if (!inbox.offer(task)) throw new IllegalStateException(&quot;inbox full: back-pressure, tell the gateway to slow down&quot;);\n        return task;\n    }\n    private void drain() {\n        while (running) {\n            try { FutureTask&lt;SubmitResult&gt; t = inbox.poll(50, TimeUnit.MILLISECONDS); if (t != null) t.run(); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }\n        }\n    }\n    public void close() { running = false; writer.interrupt(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; A fill-or-kill arrives that the book cannot fill. What is the state of the book afterwards?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was, level for level and lot for lot. The all-or-nothing decision happens before a single lot moves: <code>fillable()</code> runs the same walk down the same ladder with the same allocator, but against a <i>copy</i> of the order, so it mutates nothing. If the copy could not have been filled completely, the real order is cancelled with a reason and the book is untouched. Doing it as a dry run of the real walk &mdash; rather than adding up level totals &mdash; is what keeps it honest when somebody swaps in pro-rata or a self-trade guard that would have skipped half the level. Everything else in submit follows the same rule: every check runs before the first write, and what comes after the checks is arithmetic that cannot fail half way. (The checks are inside the lock, because the reused-id check reads a set another thread can write; only the cheap field checks could move out to the gateway.) The alternative &mdash; match first, roll back after &mdash; is machinery you should refuse out loud.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The critical step, in order: validate, then the fill-or-kill pre-check, then match, then decide\n     * the remainder. Nothing is written until every check has passed, so a rejected order leaves the\n     * book exactly as it was and the member can retry. All of it runs under the lock, because the\n     * duplicate-id check is a check-then-act on shared state: two gateway threads replaying the same\n     * order id must not both pass it. The cheap field checks could run in the gateway first.\n     */\n    private SubmitResult submitLocked(Order taker, List&lt;Consumer&lt;BookListener&gt;&gt; events) {\n        String bad = validate(taker);\n        if (bad != null) {                                       // 1. checks first: nothing is written yet\n            taker.moveTo(OrderStatus.REJECTED);\n            events.add(l -&gt; l.onRejected(taker.id(), bad));\n            return new SubmitResult(taker.id(), OrderStatus.REJECTED, 0, 0, List.of(), bad);\n        }\n        usedIds.add(taker.id());\n        taker.stamp(++seq);                                      // 2. the arrival stamp IS the book&#x27;s order\n        taker.moveTo(OrderStatus.ACCEPTED);\n        events.add(l -&gt; l.onAccepted(taker));\n\n        if (taker.tif() == TimeInForce.FOK) {                    // 3. all-or-nothing is decided BEFORE any write\n            long available = fillable(taker);\n            if (available &lt; taker.qty()) {\n                long killed = taker.remaining();\n                taker.moveTo(OrderStatus.CANCELLED);\n                String why = &quot;fill-or-kill: wanted &quot; + taker.qty() + &quot;, only &quot; + available + &quot; available&quot;;\n                events.add(l -&gt; l.onCancelled(taker, killed));\n                events.add(l -&gt; l.onQuote(book.quote()));\n                return new SubmitResult(taker.id(), OrderStatus.CANCELLED, 0, 0, List.of(), why);\n            }\n        }\n\n        List&lt;Trade&gt; trades = match(taker, events);               // 4. decide a plan, then apply it, level by level\n        SubmitResult out = settle(taker, trades, events);        // 5. rest the remainder, or throw it away\n        events.add(l -&gt; l.onQuote(book.quote()));\n        return out;\n    }\n\n    /**\n     * Walk the opposite ladder while it crosses: best price first, and inside a price whatever the\n     * allocator says. Each level is looked at once, so the loop always ends.\n     */\n    private List&lt;Trade&gt; match(Order taker, List&lt;Consumer&lt;BookListener&gt;&gt; events) {\n        List&lt;Trade&gt; trades = new ArrayList&lt;&gt;();\n        NavigableMap&lt;Long, PriceLevel&gt; opposite = book.ladder(taker.side().opposite());\n        Long seen = null;                                                  // the last price we looked at\n        while (taker.remaining() &gt; 0) {\n            Map.Entry&lt;Long, PriceLevel&gt; best = (seen == null) ? opposite.firstEntry() : opposite.higherEntry(seen);\n            if (best == null) break;                                       // the ladder ran out\n            if (!OrderBook.crosses(taker, best.getKey())) break;           // the price stopped crossing\n            PriceLevel level = best.getValue();\n            seen = best.getKey();\n            List&lt;Allocation&gt; plan = allocator.allocate(taker, level);      // decide: pure, mutates nothing\n            for (Allocation a : plan) {                                    // apply: the same lock, the same instant\n                Order maker = level.find(a.makerOrderId());\n                long q = a.qty();\n                level.reduce(maker, q);\n                taker.take(q);\n                if (maker.remaining() == 0) { maker.moveTo(OrderStatus.FILLED); book.forget(maker.id()); }\n                else maker.moveTo(OrderStatus.PARTIALLY_FILLED);\n                Trade t = new Trade(++seq, symbol, level.priceTicks(), q,\n                        taker.side() == Side.BUY ? taker.id() : maker.id(),\n                        taker.side() == Side.BUY ? maker.id() : taker.id(),\n                        taker.side(), clock.nowMs());\n                trades.add(t);\n                events.add(l -&gt; l.onTrade(t));\n            }\n            if (level.isEmpty()) book.pruneIfEmpty(taker.side().opposite(), seen);   // the book prunes its own ladder\n        }\n        return trades;\n    }\n\n    /**\n     * How much this order would really fill: the same walk, the same rulebook, run against a copy of\n     * the taker so the book is not touched. Fill-or-kill uses it, which is why all-or-nothing stays\n     * honest even when the allocator is changed to pro-rata or a self-trade guard.\n     */\n    private long fillable(Order taker) {\n        Order probe = new Order(taker.id(), symbol, taker.memberId(), taker.side(), taker.type(),\n                                TimeInForce.IOC, taker.limitTicks(), taker.qty());\n        NavigableMap&lt;Long, PriceLevel&gt; opposite = book.ladder(taker.side().opposite());\n        long total = 0; Long seen = null;\n        while (probe.remaining() &gt; 0) {\n            Map.Entry&lt;Long, PriceLevel&gt; best = (seen == null) ? opposite.firstEntry() : opposite.higherEntry(seen);\n            if (best == null || !OrderBook.crosses(probe, best.getKey())) break;\n            seen = best.getKey();\n            for (Allocation a : allocator.allocate(probe, best.getValue())) { probe.take(a.qty()); total += a.qty(); }\n        }\n        return total;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>6 &middot; The hot path is best bid, best ask, and cancel by id. Make them fast, and say the cost of each.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Best bid is <code>firstEntry()</code> on a <code>TreeMap</code>: O(log P), about eight pointer hops on a two-hundred-level book, and cacheable if you ever need it free. Cancel is two O(1) lookups &mdash; the id index gives the order, the order's own price gives the level, and a <code>LinkedHashMap</code> removes from the middle without shifting anything &mdash; plus O(log P) to drop the level if that emptied it. That middle removal is the reason for the LinkedHashMap rather than an ArrayDeque, because cancels are the most common thing a live book does: on a real venue most orders are cancelled, not traded. Put it together and one <code>submit</code> costs O(log P) to find the first price, one step per level it eats, and one line per maker it consumes &mdash; two or three makers in practice, never the size of the book. Nothing here ever walks the orders to answer a question.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * One price, one queue. Within a price the promise is first-come-first-served, so the queue is a\n * LinkedHashMap: iteration stays arrival order and a cancel from the middle is O(1), which is the\n * operation a live book does most.\n */\nfinal class PriceLevel {\n    private final long priceTicks;\n    private final LinkedHashMap&lt;String, Order&gt; fifo = new LinkedHashMap&lt;&gt;();\n    private long totalQty;                       // kept, never recomputed: the quote and the depth ladder read it\n\n    PriceLevel(long priceTicks) { this.priceTicks = priceTicks; }\n\n    long priceTicks() { return priceTicks; }\n    /** Lots resting at this price. O(1), because it is maintained on every add and every fill. */\n    long totalQty() { return totalQty; }\n    int orderCount() { return fifo.size(); }\n    boolean isEmpty() { return fifo.isEmpty(); }\n    /** The resting order with this id, or null. O(1). */\n    Order find(String orderId) { return fifo.get(orderId); }\n    /** The queue in arrival order, as a snapshot the allocator can walk without touching the book. */\n    List&lt;Order&gt; queue() { return new ArrayList&lt;&gt;(fifo.values()); }\n\n    /** Join the back of the queue. O(1). */\n    void add(Order o) { fifo.put(o.id(), o); totalQty += o.remaining(); }\n    /** Take q lots off a resting order and drop it from the queue when it is exhausted. O(1). */\n    void reduce(Order maker, long q) { maker.take(q); totalQty -= q; if (maker.remaining() == 0) fifo.remove(maker.id()); }\n    /** Pull an order out of the queue, wherever it is standing. O(1). */\n    Order remove(String orderId) {\n        Order o = fifo.remove(orderId);\n        if (o != null) totalQty -= o.remaining();\n        return o;\n    }\n    /** Amend a resting order down without losing its place. O(1). */\n    void shrink(Order o, long newRemaining) { totalQty -= (o.remaining() - newRemaining); o.shrinkTo(newRemaining); }\n}\n\n/**\n * One symbol&#x27;s book: two ladders of price levels sorted opposite ways, plus the index that makes\n * cancel O(1). It holds state and answers questions; it never decides anything and takes no lock.\n */\nfinal class OrderBook {\n    private final String symbol;\n    private final NavigableMap&lt;Long, PriceLevel&gt; bids = new TreeMap&lt;&gt;(Comparator.reverseOrder());  // highest first\n    private final NavigableMap&lt;Long, PriceLevel&gt; asks = new TreeMap&lt;&gt;();                           // lowest first\n    private final Map&lt;String, Order&gt; byId = new HashMap&lt;&gt;();                                       // cancel in O(1)\n\n    OrderBook(String symbol) { this.symbol = symbol; }\n\n    String symbol() { return symbol; }\n    /** The ladder for one side: bids highest-first, asks lowest-first, so both are read front to back. */\n    NavigableMap&lt;Long, PriceLevel&gt; ladder(Side side) { return side == Side.BUY ? bids : asks; }\n    /** The best price level on a side, or null. O(log P) in the number of live price levels. */\n    Map.Entry&lt;Long, PriceLevel&gt; best(Side side) { NavigableMap&lt;Long, PriceLevel&gt; l = ladder(side); return l.isEmpty() ? null : l.firstEntry(); }\n    /** Any live order by id, resting or not yet removed. O(1). */\n    Order find(String orderId) { return byId.get(orderId); }\n\n    /** Would this incoming order accept a trade at this resting price? */\n    static boolean crosses(Order taker, long restingTicks) {\n        if (taker.type() == OrderType.MARKET) return true;\n        return taker.side() == Side.BUY ? taker.limitTicks() &gt;= restingTicks : taker.limitTicks() &lt;= restingTicks;\n    }\n\n    /** Put the remainder at the back of its price queue. O(log P) to find or create the level. */\n    void rest(Order o) {\n        ladder(o.side()).computeIfAbsent(o.limitTicks(), PriceLevel::new).add(o);\n        byId.put(o.id(), o);\n    }\n    /** Pull a resting order out and prune an emptied level. Returns null if it is not resting. O(1) + O(log P). */\n    Order cancel(String orderId) {\n        Order o = byId.remove(orderId);\n        if (o == null) return null;\n        NavigableMap&lt;Long, PriceLevel&gt; lad = ladder(o.side());\n        PriceLevel level = lad.get(o.limitTicks());\n        if (level != null) { level.remove(orderId); if (level.isEmpty()) lad.remove(o.limitTicks()); }\n        return o;\n    }\n    /** Forget a maker that matching exhausted; the level already dropped it. O(1). */\n    void forget(String orderId) { byId.remove(orderId); }\n    /** Drop a level that a fill emptied. */\n    void pruneIfEmpty(Side side, long priceTicks) {\n        NavigableMap&lt;Long, PriceLevel&gt; lad = ladder(side);\n        PriceLevel level = lad.get(priceTicks);\n        if (level != null &amp;&amp; level.isEmpty()) lad.remove(priceTicks);\n    }\n    /** Lots resting on one side of the book. Used by the tests to prove nothing went missing. */\n    long totalQty(Side side) {\n        long sum = 0;\n        for (PriceLevel l : ladder(side).values()) sum += l.totalQty();\n        return sum;\n    }\n    /** Best bid and best ask with their sizes. O(log P). */\n    Quote quote() {\n        Map.Entry&lt;Long, PriceLevel&gt; b = best(Side.BUY), a = best(Side.SELL);\n        return new Quote(b == null ? -1 : b.getKey(), b == null ? 0 : b.getValue().totalQty(),\n                         a == null ? -1 : a.getKey(), a == null ? 0 : a.getValue().totalQty());\n    }\n    /** The top n rungs of one ladder, best price first. O(n). */\n    List&lt;Rung&gt; depth(Side side, int n) {\n        List&lt;Rung&gt; out = new ArrayList&lt;&gt;();\n        for (PriceLevel l : ladder(side).values()) {\n            if (out.size() == n) break;\n            out.add(new Rung(l.priceTicks(), l.totalQty(), l.orderCount()));\n        }\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>7 &middot; &quot;Add iceberg orders: show a hundred lots of ten thousand at a time.&quot;</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>An iceberg is not a new kind of order in the book. It is a small child order that keeps coming back: a listener watches the tape, and when the visible slice is gone it submits the next slice at the same price. The new slice joins the <i>back</i> of the queue, which is the price a hidden order pays for hiding, and it is the behaviour real venues have. In the demo a thousand lots shown a hundred at a time takes a 250-lot buy and comes back showing fifty with seven hundred still hidden. The reference version lives entirely on top of the public API, which is the point worth making; a production engine does the refresh inside the lock instead, so that no other order can slip in between the slice emptying and the next one arriving.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: iceberg -- show 100 of 10,000 at a time, and refresh when the slice is gone\n/**\n * An iceberg is not a new kind of order in the book: it is a small child order that keeps coming\n * back. This listener watches for its visible slice being exhausted and sends the next one, which\n * joins the BACK of the queue -- the price a hidden order pays for hiding.\n */\nfinal class Iceberg implements BookListener {\n    private final MatchingEngine engine;\n    private final String baseId, symbol, memberId;\n    private final Side side;\n    private final long priceTicks, showQty;\n    private long hidden;\n    private volatile String visibleId;\n    private int slice;\n\n    Iceberg(MatchingEngine engine, String baseId, String symbol, String memberId, Side side,\n            long priceTicks, long totalQty, long showQty) {\n        this.engine = engine; this.baseId = baseId; this.symbol = symbol; this.memberId = memberId;\n        this.side = side; this.priceTicks = priceTicks; this.hidden = totalQty; this.showQty = showQty;\n    }\n    /** Put the first slice in the book. */\n    void start() { engine.addListener(this); showNext(); }\n    /** Lots still hidden behind the displayed slice. */\n    long hidden() { return hidden; }\n    /** The id of the slice currently resting, or null when the iceberg is done. */\n    String visibleId() { return visibleId; }\n\n    public void onTrade(Trade t) {\n        String mine = visibleId;\n        if (mine == null) return;\n        if (!mine.equals(t.buyOrderId()) &amp;&amp; !mine.equals(t.sellOrderId())) return;\n        if (engine.resting(mine) == null) showNext();                       // the slice is gone: show the next one\n    }\n    private void showNext() {\n        if (hidden &lt;= 0) { visibleId = null; return; }\n        long q = Math.min(showQty, hidden);\n        hidden -= q;\n        visibleId = baseId + &quot;#&quot; + (++slice);\n        engine.submit(Order.limit(visibleId, symbol, memberId, side, priceTicks, q));\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; &quot;Support stop and stop-limit orders.&quot;</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A stop order is not in the book at all; it is parked in a side table until the tape prints through its trigger price, and only then is it submitted as an ordinary market or limit order. The table is two sorted maps &mdash; buy stops fire when the last price rises to the trigger, sell stops when it falls to it &mdash; so finding everything that just fired costs the number that fired, not the number parked. The trigger is driven by a <code>BookListener</code> on trades, so it runs after the unlock and cannot recurse into a book that is mid-match. Two things to say out loud: a stop cascade can move the price further and fire more stops, which is why venues add price bands; and because stops are invisible, they are not liquidity, however much the table looks like a book.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: stop orders -- parked until the last traded price crosses a trigger, then submitted for real\n/**\n * A stop order is not in the book: it is parked in a side table and becomes an ordinary order the\n * moment a trade prints through its trigger. The table is two sorted maps, so finding everything\n * that fired is O(number fired), not O(number parked).\n */\nfinal class StopBook implements BookListener {\n    private final MatchingEngine engine;\n    private final NavigableMap&lt;Long, List&lt;Order&gt;&gt; buyStops = new TreeMap&lt;&gt;();                      // fire when last &gt;= key\n    private final NavigableMap&lt;Long, List&lt;Order&gt;&gt; sellStops = new TreeMap&lt;&gt;(Comparator.reverseOrder()); // fire when last &lt;= key\n    StopBook(MatchingEngine engine) { this.engine = engine; engine.addListener(this); }\n\n    /** Park an order until the tape prints through triggerTicks. */\n    synchronized void park(long triggerTicks, Order o) {\n        (o.side() == Side.BUY ? buyStops : sellStops).computeIfAbsent(triggerTicks, k -&gt; new ArrayList&lt;&gt;()).add(o);\n    }\n    /** How many orders are still parked. */\n    synchronized int parked() { return buyStops.values().stream().mapToInt(List::size).sum()\n                                    + sellStops.values().stream().mapToInt(List::size).sum(); }\n\n    public void onTrade(Trade t) {\n        List&lt;Order&gt; fired = new ArrayList&lt;&gt;();\n        synchronized (this) {\n            while (!buyStops.isEmpty() &amp;&amp; buyStops.firstKey() &lt;= t.priceTicks()) fired.addAll(buyStops.pollFirstEntry().getValue());\n            while (!sellStops.isEmpty() &amp;&amp; sellStops.firstKey() &gt;= t.priceTicks()) fired.addAll(sellStops.pollFirstEntry().getValue());\n        }\n        for (Order o : fired) engine.submit(o);                             // outside the book&#x27;s lock: this is a listener\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; &quot;A member must never trade against their own resting order.&quot;</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Self-trade prevention is a rule about who may fill, so it is another allocator that wraps one &mdash; the same Decorator seam the checked wrapper uses. It takes the plan the real rulebook produced, drops the lines whose maker belongs to the same member as the taker, and hands the freed lots to the next orders in the queue, counting what it skipped for surveillance. That is the SKIP policy, which is the common venue default. CANCEL_NEWEST and CANCEL_OLDEST cannot live in a pure allocator, because they remove an order from the book; they belong in the engine, consulted at the same point. The interaction worth naming: because fill-or-kill dry-runs through the same allocator, a member whose own orders make up the level gets the right answer for free.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: self-trade prevention -- a member must never trade against their own resting order\n/**\n * A rule that wraps another rule: it takes the plan the real allocator made, drops the lines where\n * the maker belongs to the same member as the taker, and hands the freed lots to the next orders in\n * the queue. SKIP is the common venue default; CANCEL_NEWEST and CANCEL_OLDEST need the engine to\n * remove an order, so they belong in the engine, not in a pure allocator.\n */\nfinal class SelfTradeGuard implements Allocator {\n    private final Allocator base;\n    private final AtomicLong skipped = new AtomicLong();\n    SelfTradeGuard(Allocator base) { this.base = base; }\n    /** How many lots this guard has refused to cross. Market surveillance asks for exactly this number. */\n    long skippedLots() { return skipped.get(); }\n\n    public List&lt;Allocation&gt; allocate(Order taker, PriceLevel level) {\n        Map&lt;String, Long&gt; give = new LinkedHashMap&lt;&gt;();\n        long allocated = 0;\n        for (Allocation a : base.allocate(taker, level)) {\n            Order maker = level.find(a.makerOrderId());\n            if (maker != null &amp;&amp; maker.memberId().equals(taker.memberId())) { skipped.addAndGet(a.qty()); continue; }\n            give.put(a.makerOrderId(), a.qty());\n            allocated += a.qty();\n        }\n        long left = taker.remaining() - allocated;                          // give the freed lots to somebody else\n        for (Order maker : level.queue()) {\n            if (left == 0) break;\n            if (maker.memberId().equals(taker.memberId())) continue;\n            long already = give.getOrDefault(maker.id(), 0L);\n            long extra = Math.min(maker.remaining() - already, left);\n            if (extra &gt; 0) { give.put(maker.id(), already + extra); left -= extra; }\n        }\n        List&lt;Allocation&gt; plan = new ArrayList&lt;&gt;(give.size());\n        give.forEach((id, q) -&gt; plan.add(new Allocation(id, q)));\n        return plan;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; A member wants to change a resting order. Do they keep their place in the queue?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Only if they are giving something up. Shrinking the quantity keeps queue place, because the order object never leaves its queue: <code>amendDown</code> lowers the remaining quantity and the level's running total in place, under the lock. Raising the quantity or moving the price is a cancel and a new order, and the new order joins the back &mdash; otherwise you could buy priority by queueing a small order early and growing it, which is exactly what the rule exists to stop. One trap worth saying out loud: shrinking must lower the order&#39;s <i>quantity</i> too, not just what is left of it, or <code>filled()</code> starts reporting lots that never traded and risk and the journal both believe it &mdash; block 6 of FailureTests asserts <code>filled() == 0</code> after an amend. The reference code returns which of the two things happened in the words a trader would use, and the demo shows the order that raised its quantity losing the next fill to the one behind it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: cancel-replace -- who keeps their place in the queue\n/**\n * Shrinking a resting order keeps its queue place, because the order object never leaves the queue.\n * Raising the quantity or moving the price is a cancel and a new order, and the new order joins the\n * back. Every venue works this way, and every trader is annoyed by it.\n */\nfinal class Replace {\n    /** Returns what happened, in the words a trader would use. */\n    static String replace(MatchingEngine engine, String orderId, String newId, long newPriceTicks, long newQty) {\n        Order live = engine.resting(orderId);\n        if (live == null) return &quot;gone: it filled or was already cancelled&quot;;\n        if (newPriceTicks == live.limitTicks() &amp;&amp; newQty &lt; live.remaining()\n                &amp;&amp; engine.amendDown(orderId, newQty)) return &quot;amended down, queue place kept&quot;;\n        if (!engine.cancel(orderId)) return &quot;gone: it filled while we were replacing it&quot;;\n        engine.submit(Order.limit(newId, live.symbol(), live.memberId(), live.side(), newPriceTicks, newQty));\n        return &quot;cancel and new, queue place lost&quot;;\n    }\n}\n\n/**\n     * Amend a resting order down. Giving up lots keeps queue place, because the order object never\n     * leaves its queue; asking for more lots is a cancel and a new order, which loses it.\n     */\n    boolean amendDown(String orderId, long newRemaining) {\n        List&lt;Consumer&lt;BookListener&gt;&gt; events = new ArrayList&lt;&gt;();\n        boolean done = false;\n        lock.lock();\n        try {\n            Order o = book.find(orderId);\n            if (o != null &amp;&amp; newRemaining &gt; 0 &amp;&amp; newRemaining &lt; o.remaining()) {\n                PriceLevel level = book.ladder(o.side()).get(o.limitTicks());\n                level.shrink(o, newRemaining);\n                events.add(l -&gt; l.onQuote(book.quote()));\n                done = true;\n            }\n        } finally { lock.unlock(); }\n        fire(events);\n        return done;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; &quot;The book must survive a crash.&quot;</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Write down the commands, not the book. Every accepted order and every cancel is journalled with the sequence number the engine gave it, and a replay feeds those commands into a fresh engine and gets the same trades, in the same order, because nothing in matching reads a wall clock or a random number &mdash; the clock is injected and only stamps a trade's timestamp, never a decision. The demo proves it: the live tape and the replayed tape are identical, trade for trade. Two things to say. The journal write must not be inside the lock, so it is a hand-off to a queue and a slow disk stalls nothing. And for the log to be replayable the commands must be recorded in the same order the engine applied them, which a single writer thread gives you for free and is the third rung of the ladder from move 8.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the journal -- every command, in order, so the book can be rebuilt exactly\n/**\n * What is written down is the COMMAND, not the book: every accepted order and every cancel, with the\n * sequence number the engine gave it. Replaying the commands into a fresh engine reproduces the same\n * trades, in the same order, because nothing in matching reads the wall clock or a random number.\n */\nfinal class Journal implements BookListener {\n    /** One recorded command. A cancel carries only the id. */\n    record Entry(long n, String kind, String orderId, String symbol, String memberId, Side side,\n                 OrderType type, TimeInForce tif, long priceTicks, long qty) {}\n    private final List&lt;Entry&gt; log = Collections.synchronizedList(new ArrayList&lt;&gt;());\n    private final AtomicLong n = new AtomicLong();\n\n    public void onAccepted(Order o) {\n        log.add(new Entry(n.incrementAndGet(), &quot;SUBMIT&quot;, o.id(), o.symbol(), o.memberId(),\n                          o.side(), o.type(), o.tif(), o.limitTicks(), o.qty()));\n    }\n    /** Called by the gateway when it asks for a cancel; the engine&#x27;s own events cannot tell a user cancel from an IOC kill. */\n    void cancelled(String orderId) { log.add(new Entry(n.incrementAndGet(), &quot;CANCEL&quot;, orderId, null, null, null, null, null, 0, 0)); }\n    /** Everything recorded, in order. */\n    List&lt;Entry&gt; log() { return List.copyOf(log); }\n\n    /** Rebuild a book from the log and return its tape. The tapes must match, trade for trade. */\n    static ConsoleTape replay(List&lt;Entry&gt; log, long tickSize, long lotSize, String symbol) {\n        MatchingEngine fresh = new MatchingEngine(symbol, tickSize, lotSize);\n        ConsoleTape tape = new ConsoleTape();\n        fresh.addListener(tape);\n        for (Entry e : log) {\n            if (e.kind().equals(&quot;CANCEL&quot;)) fresh.cancel(e.orderId());\n            else fresh.submit(new Order(e.orderId(), e.symbol(), e.memberId(), e.side(), e.type(), e.tif(), e.priceTicks(), e.qty()));\n        }\n        return tape;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Somebody new wants to know: risk, market data, surveillance. What does it cost?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One class each, and nothing else moves. The listener interface has six methods and all of them default to a no-op, so a consumer implements only what it cares about: the tape takes onTrade, the level-1 feed takes onQuote, the risk monitor takes onAccepted to learn who owns which order and onTrade to move their position. They are called after the unlock, one at a time, each inside a try/catch, so a dead socket cannot stall matching &mdash; the failure test installs a listener that throws on every event and shows the trade still happening. The honest caveat: a listener sees events after the fact, so it can alarm but it cannot stop a trade. Real pre-trade risk sits in front of the engine, in the gateway, where it can still say no. The same seam is where the numbers you will be asked for come from: time waited for the lock, time held, orders and trades a second, and how long each listener took &mdash; a listener is the only place a matching engine can be measured without slowing it down.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: risk -- somebody new wants to know, and it costs one class\n/**\n * Per-member net position, kept from the tape. It learns which member owns which order from\n * onAccepted, then adds and subtracts as trades print. It observes; it cannot stop a trade, which is\n * why real pre-trade risk sits in front of the engine, not behind it.\n */\nfinal class RiskMonitor implements BookListener {\n    private final Map&lt;String, String&gt; memberOf = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Long&gt; position = new ConcurrentHashMap&lt;&gt;();\n    private final long limitLots;\n    private final List&lt;String&gt; alarms = Collections.synchronizedList(new ArrayList&lt;&gt;());\n    RiskMonitor(long limitLots) { this.limitLots = limitLots; }\n\n    public void onAccepted(Order o) { memberOf.put(o.id(), o.memberId()); }\n    public void onTrade(Trade t) { move(memberOf.get(t.buyOrderId()), t.qty()); move(memberOf.get(t.sellOrderId()), -t.qty()); }\n    private void move(String member, long lots) {\n        if (member == null) return;\n        long now = position.merge(member, lots, Long::sum);\n        if (Math.abs(now) &gt; limitLots) alarms.add(member + &quot; is at &quot; + now + &quot; lots, over the &quot; + limitLots + &quot; limit&quot;);\n    }\n    /** A member&#x27;s net position in lots: positive is long. */\n    long positionOf(String member) { return position.getOrDefault(member, 0L); }\n    /** Every limit breach seen so far. */\n    List&lt;String&gt; alarms() { return List.copyOf(alarms); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>13 &middot; Where do the timestamp and the sequence number come from, and how do you test them?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>They come from two different places on purpose. The sequence number is the engine's own counter, incremented inside the lock, so it is both an order's place in the arrival queue and the tape's line number, and it is the reason a replay can be ordered exactly. The timestamp comes from an injected <code>Clock</code>, and nothing else in the system reads the wall clock, so a test hands in an instant and asserts on the trade that comes out. That separation is what makes time priority immune to clock skew: two orders a nanosecond apart are ordered by a counter, not by two machines' opinions of the time.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Where time comes from. Injected, so a test can stamp a trade with any instant it likes. */\ninterface Clock { long nowMs(); }\n\n// on the engine: handed in, defaulted, never read from the wall clock inside a method\nprivate volatile Clock clock = System::currentTimeMillis;\nvoid setClock(Clock c) { clock = c; }\n\n// the arrival stamp is NOT the clock: it is a counter incremented inside the lock\nprivate long seq;                                      // guarded by lock\ntaker.stamp(++seq);                                    // the order&#x27;s place in the queue\nTrade t = new Trade(++seq, symbol, level.priceTicks(), q, buyId, sellId, taker.side(), clock.nowMs());\n\n// in a test: pick the instant, then assert on the trade\nengine.setCl

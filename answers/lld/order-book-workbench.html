ock(() -&gt; 1_700_000_000_000L);\nSubmitResult r = engine.submit(Order.limit(&quot;clocked&quot;, &quot;INFY&quot;, &quot;DEV&quot;, Side.BUY, Ticks.of(&quot;100.00&quot;), 100));\nassert r.trades().get(0).atMs() == 1_700_000_000_000L;\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>14 &middot; Market orders, immediate-or-cancel, and whose price prints. Walk me through the remainder.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>What did not fill is decided in one small method. If the order has nothing left it is FILLED. If it is a market order, or its time-in-force is not good-till-cancelled, the remainder is thrown away and the order ends CANCELLED with its fills reported &mdash; a market order never rests, which is why a market order into an empty book fills nothing and leaves nothing behind. Otherwise the remainder joins the back of its price queue and the order is PARTIALLY_FILLED if anything traded. The price question is separate and is the one juniors get wrong: every trade prints at the <i>resting</i> order's price, so a buyer willing to pay 1500.10 who finds an offer at 1500.05 pays 1500.05. The aggressor earns the improvement, it is the rule on every lit venue, and it makes the tape reproducible from the commands.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** What happens to what did not fill: rest it (GTC limit) or throw it away (market, IOC, FOK). */\n    private SubmitResult settle(Order taker, List&lt;Trade&gt; trades, List&lt;Consumer&lt;BookListener&gt;&gt; events) {\n        long filled = taker.filled();\n        if (taker.remaining() == 0) {\n            taker.moveTo(OrderStatus.FILLED);\n            return new SubmitResult(taker.id(), OrderStatus.FILLED, filled, 0, List.copyOf(trades), null);\n        }\n        if (taker.type() == OrderType.MARKET || taker.tif() != TimeInForce.GTC) {\n            long killed = taker.remaining();\n            taker.moveTo(OrderStatus.CANCELLED);\n            events.add(l -&gt; l.onCancelled(taker, killed));\n            return new SubmitResult(taker.id(), OrderStatus.CANCELLED, filled, 0, List.copyOf(trades), null);\n        }\n        book.rest(taker);\n        if (filled &gt; 0) taker.moveTo(OrderStatus.PARTIALLY_FILLED);\n        long rested = taker.remaining();\n        events.add(l -&gt; l.onRested(taker, rested));\n        return new SubmitResult(taker.id(), taker.status(), filled, rested, List.copyOf(trades), null);\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Name the patterns you used. And why is the order type an enum rather than a subclass of Order, when a class per type would look cleaner?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The patterns are on page 02, move 10, each named against the move that produced it: Strategy and Decorator on the <code>Allocator</code> seam, Observer on <code>BookListener</code>, State inside <code>moveTo</code>, Command in the plan the allocator hands back. The enum question is the better one, and the answer is to count the differences. A limit order and a market order differ in exactly two behaviours &mdash; whether a price can stop them crossing, and whether the remainder is allowed to rest &mdash; and both are one line, in <code>crosses()</code> and in <code>settle()</code>. A subclass per type would spread those two lines across two files and then push every other class into asking which subclass it is holding; the enum keeps the difference where the difference is used, and a third type is one more arm of a switch. The rule for when that flips: the day a type needs its own <i>state</i> &mdash; a stop price, a display quantity, a peg offset &mdash; the enum stops paying and a subclass earns it. Factory and Builder pass the same test and fail it today: <code>computeIfAbsent</code> is already the registry, so Factory earns the name when each contract carries its own rulebook from configuration, and six required fields with two named static methods are enough until those extra fields arrive.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Would this incoming order accept a trade at this resting price? */\n    static boolean crosses(Order taker, long restingTicks) {\n        if (taker.type() == OrderType.MARKET) return true;\n        return taker.side() == Side.BUY ? taker.limitTicks() &gt;= restingTicks : taker.limitTicks() &lt;= restingTicks;\n    }\n\n// ...and the only other place the type is read, in settle(): whether the remainder may rest\nif (taker.type() == OrderType.MARKET || taker.tif() != TimeInForce.GTC) {\n    long killed = taker.remaining();\n    taker.moveTo(OrderStatus.CANCELLED);                 // a market order never rests\n    events.add(l -&gt; l.onCancelled(taker, killed));\n    return new SubmitResult(taker.id(), OrderStatus.CANCELLED, filled, 0, List.copyOf(trades), null);\n}\n\n// two lines of difference, so the difference is an enum, not a hierarchy\nenum OrderType { LIMIT, MARKET }\n\n// Factory: not yet. The registry is already here; it earns the name when contracts carry their own rulebook\nreturn engines.computeIfAbsent(symbol, s -&gt; {\n    MatchingEngine e = new MatchingEngine(s, tickSize, lotSize);\n    for (BookListener l : defaults) e.addListener(l);\n    return e;\n});\n\n// Builder: not yet. Six required fields is a constructor plus two named static factory methods\nOrder.limit(&quot;b1&quot;, &quot;INFY&quot;, &quot;ANA&quot;, Side.BUY, Ticks.of(&quot;1499.95&quot;), 200);\nOrder.market(&quot;t6&quot;, &quot;INFY&quot;, &quot;LAL&quot;, Side.BUY, 400);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n/** Which way an order points. A buy takes from the asks; a sell takes from the bids. */\nenum Side {\n    BUY, SELL;\n    /** The side of the book this order matches against. */\n    Side opposite() { return this == BUY ? SELL : BUY; }\n}\n\n/** LIMIT names the worst price it will accept. MARKET accepts any price and never rests. */\nenum OrderType { LIMIT, MARKET }\n\n/**\n * How long the order is allowed to live. GTC rests what it could not fill; IOC takes what is\n * there and cancels the rest; FOK fills completely or does nothing at all.\n */\nenum TimeInForce { GTC, IOC, FOK }\n\n/**\n * An order's life. The engine never sets a field directly: it calls moveTo(), which refuses an\n * illegal move, so a bug shows up as an exception instead of a corrupt book.\n */\nenum OrderStatus {\n    NEW, ACCEPTED, PARTIALLY_FILLED, FILLED, CANCELLED, REJECTED;\n    /** The legal edges of the state machine drawn on page 02, move 6. */\n    boolean canMoveTo(OrderStatus next) {\n        return switch (this) {\n            case NEW              -> next == ACCEPTED || next == REJECTED;\n            case ACCEPTED         -> next == PARTIALLY_FILLED || next == FILLED || next == CANCELLED;\n            case PARTIALLY_FILLED -> next == PARTIALLY_FILLED || next == FILLED || next == CANCELLED;\n            default               -> false;                       // FILLED, CANCELLED, REJECTED are the end\n        };\n    }\n}\n\n/**\n * Exact prices, in ticks. One tick here is one paise, so 1500.05 is 150005 and every comparison is\n * integer equality. There is no double and no BigDecimal anywhere past these two helpers.\n */\nfinal class Ticks {\n    private Ticks() {}\n    /** Parse \"1500.05\" into 150005 ticks. Used at the edge (a form, a file), never in the matching loop. */\n    static long of(String rupees) { return new java.math.BigDecimal(rupees).movePointRight(2).longValueExact(); }\n    /** Print 150005 ticks as \"1500.05\". Presentation only. */\n    static String fmt(long ticks) {\n        String sign = ticks < 0 ? \"-\" : \"\"; long a = Math.abs(ticks);\n        return sign + (a / 100) + \".\" + String.format(\"%02d\", a % 100);\n    }\n}\n\n/** Where time comes from. Injected, so a test can stamp a trade with any instant it likes. */\ninterface Clock { long nowMs(); }\n\n/**\n * One order. Everything is final except remaining, the status and the arrival sequence: matching\n * only ever shrinks remaining, and it does so under the book's lock.\n */\nfinal class Order {\n    private final String id, symbol, memberId;\n    private final Side side;\n    private final OrderType type;\n    private final TimeInForce tif;\n    private final long limitTicks;\n    private long qty;                            // an amend-down lowers it; nothing else ever does\n    private long remaining, seq;\n    private OrderStatus status = OrderStatus.NEW;\n\n    Order(String id, String symbol, String memberId, Side side, OrderType type, TimeInForce tif,\n          long limitTicks, long qty) {\n        this.id = id; this.symbol = symbol; this.memberId = memberId; this.side = side;\n        this.type = type; this.tif = tif; this.limitTicks = limitTicks; this.qty = qty;\n        this.remaining = qty;\n    }\n    /** A good-till-cancelled limit order: the ordinary case, and the only kind that rests. */\n    static Order limit(String id, String symbol, String member, Side side, long priceTicks, long qty) {\n        return new Order(id, symbol, member, side, OrderType.LIMIT, TimeInForce.GTC, priceTicks, qty);\n    }\n    /** A limit order with an explicit time-in-force: GTC rests, IOC cancels the rest, FOK is all-or-nothing. */\n    static Order limit(String id, String symbol, String member, Side side, long priceTicks, long qty, TimeInForce tif) {\n        return new Order(id, symbol, member, side, OrderType.LIMIT, tif, priceTicks, qty);\n    }\n    /** A market order: it takes whatever is crossing and never rests, so its time-in-force is IOC. */\n    static Order market(String id, String symbol, String member, Side side, long qty) {\n        return new Order(id, symbol, member, side, OrderType.MARKET, TimeInForce.IOC, 0, qty);\n    }\n\n    String id() { return id; }\n    String symbol() { return symbol; }\n    String memberId() { return memberId; }\n    Side side() { return side; }\n    OrderType type() { return type; }\n    TimeInForce tif() { return tif; }\n    long limitTicks() { return limitTicks; }\n    long qty() { return qty; }\n    long remaining() { return remaining; }\n    /** How much of the order has traded. Always qty - remaining; the two never drift. */\n    long filled() { return qty - remaining; }\n    long seq() { return seq; }\n    OrderStatus status() { return status; }\n\n    /** The engine's arrival stamp, taken inside the lock, so it IS the book's own order of events. */\n    void stamp(long s) { seq = s; }\n    /** Move the state machine, or throw. An illegal move is a bug, not a business case. */\n    void moveTo(OrderStatus next) {\n        if (!status.canMoveTo(next))\n            throw new IllegalStateException(id + \": \" + status + \" -> \" + next + \" is not a legal move\");\n        status = next;\n    }\n    /** Take q lots off this order. The last line of defence: nothing can fill more than it offered. */\n    void take(long q) {\n        if (q <= 0) throw new IllegalStateException(id + \": a fill must be positive, got \" + q);\n        if (q > remaining) throw new IllegalStateException(id + \": fill of \" + q + \" but only \" + remaining + \" left\");\n        remaining -= q;\n    }\n    /**\n     * Amend down: give up lots without giving up queue place. The ORDER shrinks, not just what is\n     * left of it, so filled() still means \"traded\" -- an amend must never look like a fill to risk\n     * or to the journal. Never used to raise a quantity: that is a cancel and a new order.\n     */\n    void shrinkTo(long newRemaining) {\n        if (newRemaining <= 0 || newRemaining > remaining)\n            throw new IllegalArgumentException(id + \": can only shrink, \" + remaining + \" -> \" + newRemaining);\n        qty -= (remaining - newRemaining);\n        remaining = newRemaining;\n    }\n    @Override public String toString() {\n        return id + \" \" + side + \" \" + remaining + \"/\" + qty + \" @\" +\n               (type == OrderType.MARKET ? \"MKT\" : Ticks.fmt(limitTicks)) + \" \" + status;\n    }\n}\n\n/** One printed trade: what left the building. The price is always the resting order's price. */\nrecord Trade(long seq, String symbol, long priceTicks, long qty,\n             String buyOrderId, String sellOrderId, Side takerSide, long atMs) {\n    /** One line of tape. */\n    String text() { return \"#\" + seq + \" \" + qty + \" @ \" + Ticks.fmt(priceTicks) + \" (\" + buyOrderId + \"/\" + sellOrderId + \")\"; }\n}\n\n/** One line of an allocator's plan: this resting order gives up this many lots. A decision, not a write. */\nrecord Allocation(String makerOrderId, long qty) {}\n\n/** The top of the book. A price of -1 means that side is empty. */\nrecord Quote(long bidTicks, long bidQty, long askTicks, long askQty) {\n    /** A one-line quote for a screen or a log. */\n    String text() {\n        return (bidQty == 0 ? \"--\" : bidQty + \" @ \" + Ticks.fmt(bidTicks)) + \"  |  \" +\n               (askQty == 0 ? \"--\" : Ticks.fmt(askTicks) + \" @ \" + askQty);\n    }\n}\n\n/** One rung of the depth ladder: a price, the lots resting there, and how many orders make it up. */\nrecord Rung(long priceTicks, long qty, int orders) {\n    /** One rung, as a screen would show it: \"500 @ 1499.95 (2 orders)\". */\n    String text() { return qty + \" @ \" + Ticks.fmt(priceTicks) + \" (\" + orders + (orders == 1 ? \" order)\" : \" orders)\"); }\n}\n\n/** What submit() gives back: the order's end state, what it traded, and what is left resting. */\nrecord SubmitResult(String orderId, OrderStatus status, long filledQty, long restingQty,\n                    List<Trade> trades, String rejectReason) {}\n\n/**\n * One price, one queue. Within a price the promise is first-come-first-served, so the queue is a\n * LinkedHashMap: iteration stays arrival order and a cancel from the middle is O(1), which is the\n * operation a live book does most.\n */\nfinal class PriceLevel {\n    private final long priceTicks;\n    private final LinkedHashMap<String, Order> fifo = new LinkedHashMap<>();\n    private long totalQty;                       // kept, never recomputed: the quote and the depth ladder read it\n\n    PriceLevel(long priceTicks) { this.priceTicks = priceTicks; }\n\n    long priceTicks() { return priceTicks; }\n    /** Lots resting at this price. O(1), because it is maintained on every add and every fill. */\n    long totalQty() { return totalQty; }\n    int orderCount() { return fifo.size(); }\n    boolean isEmpty() { return fifo.isEmpty(); }\n    /** The resting order with this id, or null. O(1). */\n    Order find(String orderId) { return fifo.get(orderId); }\n    /** The queue in arrival order, as a snapshot the allocator can walk without touching the book. */\n    List<Order> queue() { return new ArrayList<>(fifo.values()); }\n\n    /** Join the back of the queue. O(1). */\n    void add(Order o) { fifo.put(o.id(), o); totalQty += o.remaining(); }\n    /** Take q lots off a resting order and drop it from the queue when it is exhausted. O(1). */\n    void reduce(Order maker, long q) { maker.take(q); totalQty -= q; if (maker.remaining() == 0) fifo.remove(maker.id()); }\n    /** Pull an order out of the queue, wherever it is standing. O(1). */\n    Order remove(String orderId) {\n        Order o = fifo.remove(orderId);\n        if (o != null) totalQty -= o.remaining();\n        return o;\n    }\n    /** Amend a resting order down without losing its place. O(1). */\n    void shrink(Order o, long newRemaining) { totalQty -= (o.remaining() - newRemaining); o.shrinkTo(newRemaining); }\n}\n\n/**\n * One symbol's book: two ladders of price levels sorted opposite ways, plus the index that makes\n * cancel O(1). It holds state and answers questions; it never decides anything and takes no lock.\n */\nfinal class OrderBook {\n    private final String symbol;\n    private final NavigableMap<Long, PriceLevel> bids = new TreeMap<>(Comparator.reverseOrder());  // highest first\n    private final NavigableMap<Long, PriceLevel> asks = new TreeMap<>();                           // lowest first\n    private final Map<String, Order> byId = new HashMap<>();                                       // cancel in O(1)\n\n    OrderBook(String symbol) { this.symbol = symbol; }\n\n    String symbol() { return symbol; }\n    /** The ladder for one side: bids highest-first, asks lowest-first, so both are read front to back. */\n    NavigableMap<Long, PriceLevel> ladder(Side side) { return side == Side.BUY ? bids : asks; }\n    /** The best price level on a side, or null. O(log P) in the number of live price levels. */\n    Map.Entry<Long, PriceLevel> best(Side side) { NavigableMap<Long, PriceLevel> l = ladder(side); return l.isEmpty() ? null : l.firstEntry(); }\n    /** Any live order by id, resting or not yet removed. O(1). */\n    Order find(String orderId) { return byId.get(orderId); }\n\n    /** Would this incoming order accept a trade at this resting price? */\n    static boolean crosses(Order taker, long restingTicks) {\n        if (taker.type() == OrderType.MARKET) return true;\n        return taker.side() == Side.BUY ? taker.limitTicks() >= restingTicks : taker.limitTicks() <= restingTicks;\n    }\n\n    /** Put the remainder at the back of its price queue. O(log P) to find or create the level. */\n    void rest(Order o) {\n        ladder(o.side()).computeIfAbsent(o.limitTicks(), PriceLevel::new).add(o);\n        byId.put(o.id(), o);\n    }\n    /** Pull a resting order out and prune an emptied level. Returns null if it is not resting. O(1) + O(log P). */\n    Order cancel(String orderId) {\n        Order o = byId.remove(orderId);\n        if (o == null) return null;\n        NavigableMap<Long, PriceLevel> lad = ladder(o.side());\n        PriceLevel level = lad.get(o.limitTicks());\n        if (level != null) { level.remove(orderId); if (level.isEmpty()) lad.remove(o.limitTicks()); }\n        return o;\n    }\n    /** Forget a maker that matching exhausted; the level already dropped it. O(1). */\n    void forget(String orderId) { byId.remove(orderId); }\n    /** Drop a level that a fill emptied. */\n    void pruneIfEmpty(Side side, long priceTicks) {\n        NavigableMap<Long, PriceLevel> lad = ladder(side);\n        PriceLevel level = lad.get(priceTicks);\n        if (level != null && level.isEmpty()) lad.remove(priceTicks);\n    }\n    /** Lots resting on one side of the book. Used by the tests to prove nothing went missing. */\n    long totalQty(Side side) {\n        long sum = 0;\n        for (PriceLevel l : ladder(side).values()) sum += l.totalQty();\n        return sum;\n    }\n    /** Best bid and best ask with their sizes. O(log P). */\n    Quote quote() {\n        Map.Entry<Long, PriceLevel> b = best(Side.BUY), a = best(Side.SELL);\n        return new Quote(b == null ? -1 : b.getKey(), b == null ? 0 : b.getValue().totalQty(),\n                         a == null ? -1 : a.getKey(), a == null ? 0 : a.getValue().totalQty());\n    }\n    /** The top n rungs of one ladder, best price first. O(n). */\n    List<Rung> depth(Side side, int n) {\n        List<Rung> out = new ArrayList<>();\n        for (PriceLevel l : ladder(side).values()) {\n            if (out.size() == n) break;\n            out.add(new Rung(l.priceTicks(), l.totalQty(), l.orderCount()));\n        }\n        return out;\n    }\n}\n\n// \"this contract allocates pro-rata, not first-come-first-served\" -> the rule goes behind an interface -> Strategy\n/**\n * Who gets filled inside one price level. The exchange rulebook decides this, not the engine, so it\n * is one method handed in. It must be PURE: it decides a plan and mutates nothing.\n */\ninterface Allocator {\n    /** How the taker's remaining lots are shared out among the orders resting at this level. */\n    List<Allocation> allocate(Order taker, PriceLevel level);\n}\n\n/** Price-time priority: the exchange's default. Walk the queue in arrival order until the taker is full. */\nfinal class PriceTimeAllocator implements Allocator {\n    public List<Allocation> allocate(Order taker, PriceLevel level) {\n        List<Allocation> plan = new ArrayList<>();\n        long left = taker.remaining();\n        for (Order maker : level.queue()) {\n            if (left <= 0) break;\n            long q = Math.min(left, maker.remaining());\n            if (q > 0) { plan.add(new Allocation(maker.id(), q)); left -= q; }\n        }\n        return plan;\n    }\n}\n\n// the same move: one rule that wraps every other rule, so a rulebook written next year cannot overfill -> Decorator\n/**\n * Wraps any allocator and refuses a plan that would hand out more than exists: more than the taker\n * has left, more than a maker is offering, an order that is not at this level, or the same order\n * twice. It throws BEFORE the engine applies anything, so a broken rulebook writes nothing.\n */\nfinal class CheckedAllocator implements Allocator {\n    private final Allocator base;\n    CheckedAllocator(Allocator base) { this.base = base; }\n    public List<Allocation> allocate(Order taker, PriceLevel level) {\n        List<Allocation> plan = base.allocate(taker, level);\n        long total = 0;\n        Set<String> seen = new HashSet<>();\n        for (Allocation a : plan) {\n            Order maker = level.find(a.makerOrderId());\n            if (maker == null) throw new IllegalStateException(\"allocator named \" + a.makerOrderId() + \", which is not resting at \" + Ticks.fmt(level.priceTicks()));\n            if (!seen.add(a.makerOrderId())) throw new IllegalStateException(\"allocator named \" + a.makerOrderId() + \" twice in one plan\");\n            if (a.qty() <= 0) throw new IllegalStateException(\"allocator gave \" + a.makerOrderId() + \" a non-positive fill: \" + a.qty());\n            if (a.qty() > maker.remaining()) throw new IllegalStateException(\"allocator gave \" + a.makerOrderId() + \" \" + a.qty() + \" lots but it is only offering \" + maker.remaining());\n            total += a.qty();\n        }\n        if (total > taker.remaining()) throw new IllegalStateException(\"allocator handed out \" + total + \" lots for a taker with \" + taker.remaining() + \" left\");\n        return plan;\n    }\n}\n\n// \"the tape wants fills, market data wants the top of book, risk wants exposure\" -> announce, do not call -> Observer\n/**\n * Everything downstream of matching. Every method has a no-op default, so a listener implements only\n * the events it cares about. Listeners are called AFTER the lock is released, each inside a try/catch.\n */\ninterface BookListener {\n    /** The order passed validation and is about to be matched. */\n    default void onAccepted(Order o) {}\n    /** A trade printed, at the resting order's price. */\n    default void onTrade(Trade t) {}\n    /** What could not be filled is now resting in the book. */\n    default void onRested(Order o, long restingQty) {}\n    /** The order left the book, or its remainder was thrown away (IOC, FOK, market). */\n    default void onCancelled(Order o, long cancelledQty) {}\n    /** The order never entered the book: a bad price, a bad quantity, a reused id. */\n    default void onRejected(String orderId, String reason) {}\n    /** The top of the book after this event. */\n    default void onQuote(Quote q) {}\n}\n\n/** The tape: it prints trades, and nothing else. Interface segregation, in one class. */\nfinal class ConsoleTape implements BookListener {\n    private final List<Trade> printed = Collections.synchronizedList(new ArrayList<>());\n    public void onTrade(Trade t) { printed.add(t); }\n    /** Every trade this tape saw, in the order it saw them. */\n    List<Trade> printed() { return List.copyOf(printed); }\n}\n\n/** Market data's level 1 feed: the last quote, readable without touching the book or its lock. */\nfinal class TopOfBook implements BookListener {\n    private volatile Quote last = new Quote(-1, 0, -1, 0);\n    public void onQuote(Quote q) { last = q; }\n    /** The most recent top of book. A read, never a lock. */\n    Quote last() { return last; }\n}\n\n/**\n * The aggregate root: one symbol's book, one lock, one allocator, the listeners and the clock.\n * Every state change in this file happens inside submit() or cancel(), and both take this lock.\n */\nfinal class MatchingEngine {\n    private final String symbol;\n    private final OrderBook book;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final List<BookListener> listeners = new CopyOnWriteArrayList<>();\n    private final Set<String> usedIds = new HashSet<>();       // guarded by lock: a reused id is rejected\n    private final long tickSize, lotSize;\n\n    private volatile Allocator allocator = new CheckedAllocator(new PriceTimeAllocator());\n    private volatile Clock clock = System::currentTimeMillis;\n    private long seq;                                          // guarded by lock: the book's own clock\n\n    MatchingEngine(String symbol, long tickSize, long lotSize) {\n        this.symbol = symbol; this.book = new OrderBook(symbol);\n        this.tickSize = tickSize; this.lotSize = lotSize;\n    }\n\n    /** Hand in the rulebook. The engine never builds an allocator, and always wraps it in the checker. */\n    void configure(Allocator a) { allocator = new CheckedAllocator(a); }\n    /** Hand in the clock. Tests set it; production leaves it as the wall clock. */\n    void setClock(Clock c) { clock = c; }\n    /** Add a downstream consumer: tape, market data, risk, journal. */\n    void addListener(BookListener l) { listeners.add(l); }\n\n    String symbol() { return symbol; }\n    /** Top of book, read under the lock so it is never half-updated. */\n    Quote quote() { lock.lock(); try { return book.quote(); } finally { lock.unlock(); } }\n    /** The top n rungs of one ladder. */\n    List<Rung> depth(Side side, int n) { lock.lock(); try { return book.depth(side, n); } finally { lock.unlock(); } }\n    /** Lots resting on one side. */\n    long restingQty(Side side) { lock.lock(); try { return book.totalQty(side); } finally { lock.unlock(); } }\n    /** A live order by id, or null if it never rested, was filled or was cancelled. */\n    Order resting(String orderId) { lock.lock(); try { return book.find(orderId); } finally { lock.unlock(); } }\n\n    /**\n     * Take an order. Everything that reads and writes the book happens inside the lock; the\n     * listeners are called after the unlock, so a slow or broken consumer cannot stall matching.\n     */\n    SubmitResult submit(Order taker) {\n        List<Consumer<BookListener>> events = new ArrayList<>();\n        SubmitResult result;\n        lock.lock();\n        try { result = submitLocked(taker, events); } finally { lock.unlock(); }\n        fire(events);\n        return result;\n    }\n\n    /**\n     * The critical step, in order: validate, then the fill-or-kill pre-check, then match, then decide\n     * the remainder. Nothing is written until every check has passed, so a rejected order leaves the\n     * book exactly as it was and the member can retry. All of it runs under the lock, because the\n     * duplicate-id check is a check-then-act on shared state: two gateway threads replaying the same\n     * order id must not both pass it. The cheap field checks could run in the gateway first.\n     */\n    private SubmitResult submitLocked(Order taker, List<Consumer<BookListener>> events) {\n        String bad = validate(taker);\n        if (bad != null) {                                       // 1. checks first: nothing is written yet\n            taker.moveTo(OrderStatus.REJECTED);\n            events.add(l -> l.onRejected(taker.id(), bad));\n            return new SubmitResult(taker.id(), OrderStatus.REJECTED, 0, 0, List.of(), bad);\n        }\n        usedIds.add(taker.id());\n        taker.stamp(++seq);                                      // 2. the arrival stamp IS the book's order\n        taker.moveTo(OrderStatus.ACCEPTED);\n        events.add(l -> l.onAccepted(taker));\n\n        if (taker.tif() == TimeInForce.FOK) {                    // 3. all-or-nothing is decided BEFORE any write\n            long available = fillable(taker);\n            if (available < taker.qty()) {\n                long killed = taker.remaining();\n                taker.moveTo(OrderStatus.CANCELLED);\n                String why = \"fill-or-kill: wanted \" + taker.qty() + \", only \" + available + \" available\";\n                events.add(l -> l.onCancelled(taker, killed));\n                events.add(l -> l.onQuote(book.quote()));\n                return new SubmitResult(taker.id(), OrderStatus.CANCELLED, 0, 0, List.of(), why);\n            }\n        }\n\n        List<Trade> trades = match(taker, events);               // 4. decide a plan, then apply it, level by level\n        SubmitResult out = settle(taker, trades, events);        // 5. rest the remainder, or throw it away\n        events.add(l -> l.onQuote(book.quote()));\n        return out;\n    }\n\n    /**\n     * Walk the opposite ladder while it crosses: best price first, and inside a price whatever the\n     * allocator says. Each level is looked at once, so the loop always ends.\n     */\n    private List<Trade> match(Order taker, List<Consumer<BookListener>> events) {\n        List<Trade> trades = new ArrayList<>();\n        NavigableMap<Long, PriceLevel> opposite = book.ladder(taker.side().opposite());\n        Long seen = null;                                                  // the last price we looked at\n        while (taker.remaining() > 0) {\n            Map.Entry<Long, PriceLevel> best = (seen == null) ? opposite.firstEntry() : opposite.higherEntry(seen);\n            if (best == null) break;                                       // the ladder ran out\n            if (!OrderBook.crosses(taker, best.getKey())) break;           // the price stopped crossing\n            PriceLevel level = best.getValue();\n            seen = best.getKey();\n            List<Allocation> plan = allocator.allocate(taker, level);      // decide: pure, mutates nothing\n            for (Allocation a : plan) {                                    // apply: the same lock, the same instant\n                Order maker = level.find(a.makerOrderId());\n                long q = a.qty();\n                level.reduce(maker, q);\n                taker.take(q);\n                if (maker.remaining() == 0) { maker.moveTo(OrderStatus.FILLED); book.forget(maker.id()); }\n                else maker.moveTo(OrderStatus.PARTIALLY_FILLED);\n                Trade t = new Trade(++seq, symbol, level.priceTicks(), q,\n                        taker.side() == Side.BUY ? taker.id() : maker.id(),\n                        taker.side() == Side.BUY ? maker.id() : taker.id(),\n                        taker.side(), clock.nowMs());\n                trades.add(t);\n                events.add(l -> l.onTrade(t));\n            }\n            if (level.isEmpty()) book.pruneIfEmpty(taker.side().opposite(), seen);   // the book prunes its own ladder\n        }\n        return trades;\n    }\n\n    /**\n     * How much this order would really fill: the same walk, the same rulebook, run against a copy of\n     * the taker so the book is not touched. Fill-or-kill uses it, which is why all-or-nothing stays\n     * honest even when the allocator is changed to pro-rata or a self-trade guard.\n     */\n    private long fillable(Order taker) {\n        Order probe = new Order(taker.id(), symbol, taker.memberId(), taker.side(), taker.type(),\n                                TimeInForce.IOC, taker.limitTicks(), taker.qty());\n        NavigableMap<Long, PriceLevel> opposite = book.ladder(taker.side().opposite());\n        long total = 0; Long seen = null;\n        while (probe.remaining() > 0) {\n            Map.Entry<Long, PriceLevel> best = (seen == null) ? opposite.firstEntry() : opposite.higherEntry(seen);\n            if (best == null || !OrderBook.crosses(probe, best.getKey())) break;\n            seen = best.getKey();\n            for (Allocation a : allocator.allocate(probe, best.getValue())) { probe.take(a.qty()); total += a.qty(); }\n        }\n        return total;\n    }\n\n    /** What happens to what did not fill: rest it (GTC limit) or throw it away (market, IOC, FOK). */\n    private SubmitResult settle(Order taker, List<Trade> trades, List<Consumer<BookListener>> events) {\n        long filled = taker.filled();\n        if (taker.remaining() == 0) {\n            taker.moveTo(OrderStatus.FILLED);\n            return new SubmitResult(taker.id(), OrderStatus.FILLED, filled, 0, List.copyOf(trades), null);\n        }\n        if (taker.type() == OrderType.MARKET || taker.tif() != TimeInForce.GTC) {\n            long killed = taker.remaining();\n            taker.moveTo(OrderStatus.CANCELLED);\n            events.add(l -> l.onCancelled(taker, killed));\n            return new SubmitResult(taker.id(), OrderStatus.CANCELLED, filled, 0, List.copyOf(trades), null);\n        }\n        book.rest(taker);\n        if (filled > 0) taker.moveTo(OrderStatus.PARTIALLY_FILLED);\n        long rested = taker.remaining();\n        events.add(l -> l.onRested(taker, rested));\n        return new SubmitResult(taker.id(), taker.status(), filled, rested, List.copyOf(trades), null);\n    }\n\n    /**\n     * The exchange rulebook's entry checks. All of them run before a single byte of the book changes,\n     * and all of them run under the lock

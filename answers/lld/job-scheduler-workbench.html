ity when workers are short; the rule is handed in\n        System.out.println(&quot;10. priority among due jobs&quot;);\n        ManualClock c10 = new ManualClock(0);\n        Scheduler s10 = new Scheduler(1, c10);\n        List&lt;String&gt; order10 = new ArrayList&lt;&gt;();\n        s10.schedule(JobSpec.of(&quot;low&quot;, () -&gt; order10.add(&quot;low&quot;)).in(10).priority(1));\n        s10.schedule(JobSpec.of(&quot;high&quot;, () -&gt; order10.add(&quot;high&quot;)).in(20).priority(9));\n        s10.schedule(JobSpec.of(&quot;mid&quot;, () -&gt; order10.add(&quot;mid&quot;)).in(30).priority(5));\n        c10.set(100);\n        drive(s10, c10, 100, 1);\n        check(order10.equals(List.of(&quot;high&quot;, &quot;mid&quot;, &quot;low&quot;)), &quot;three due at once, one worker: &quot; + order10);\n        order10.clear();\n        s10.configure(Scheduler.BY_DUE);                            // a different rule, handed in\n        s10.schedule(JobSpec.of(&quot;low2&quot;, () -&gt; order10.add(&quot;low2&quot;)).in(10).priority(1));\n        s10.schedule(JobSpec.of(&quot;high2&quot;, () -&gt; order10.add(&quot;high2&quot;)).in(20).priority(9));\n        c10.set(200);\n        drive(s10, c10, 200, 1);\n        check(order10.equals(List.of(&quot;low2&quot;, &quot;high2&quot;)), &quot;with the earliest-due rule handed in: &quot; + order10);\n\n        // 11. prerequisites: a job starts only after all of them are DONE; two finishing together release it once\n        System.out.println(&quot;11. prerequisites&quot;);\n        ManualClock c11 = new ManualClock(0);\n        Scheduler s11 = new Scheduler(1, c11);\n        List&lt;String&gt; order11 = new ArrayList&lt;&gt;();\n        JobState[] deployWhenAEnded = new JobState[1];\n        s11.scheduleAll(List.of(\n                JobSpec.of(&quot;deploy&quot;, () -&gt; order11.add(&quot;deploy&quot;)).after(&quot;build-a&quot;, &quot;build-b&quot;),\n                JobSpec.of(&quot;build-a&quot;, () -&gt; order11.add(&quot;build-a&quot;)),\n                JobSpec.of(&quot;build-b&quot;, () -&gt; { deployWhenAEnded[0] = s11.status(&quot;deploy&quot;); order11.add(&quot;build-b&quot;); })));\n        drive(s11, c11, 50, 1);\n        check(order11.equals(List.of(&quot;build-a&quot;, &quot;build-b&quot;, &quot;deploy&quot;)), &quot;deploy ran last: &quot; + order11);\n        check(deployWhenAEnded[0] == JobState.BLOCKED, &quot;with one of two prerequisites done, deploy was still BLOCKED&quot;);\n        int rounds = 30, lateOrTwice = 0;\n        for (int round = 0; round &lt; rounds; round++) {\n            Scheduler r = new Scheduler(8, Clock.system());\n            r.start();\n            CyclicBarrier together = new CyclicBarrier(8);\n            AtomicLong lastEnd = new AtomicLong();\n            AtomicInteger deployRuns = new AtomicInteger();\n            long[] deployStart = new long[1];\n            List&lt;JobSpec&gt; batch = new ArrayList&lt;&gt;();\n            String[] pre = new String[8];\n            for (int p = 0; p &lt; 8; p++) {\n                pre[p] = &quot;p&quot; + p;\n                batch.add(JobSpec.of(pre[p], () -&gt; { together.await(); lastEnd.accumulateAndGet(System.nanoTime(), Math::max); }));\n            }\n            CountDownLatch deployed = new CountDownLatch(1);\n            batch.add(JobSpec.of(&quot;deploy&quot;, () -&gt; { deployStart[0] = System.nanoTime(); deployRuns.incrementAndGet(); deployed.countDown(); }).after(pre));\n            r.scheduleAll(batch);\n            deployed.await(5, TimeUnit.SECONDS);\n            r.shutdown();\n            r.awaitTermination(5_000);\n            if (deployRuns.get() != 1 || deployStart[0] &lt; lastEnd.get()) lateOrTwice++;\n        }\n        check(lateOrTwice == 0, rounds + &quot; rounds of 8 prerequisites finishing together: deploy ran exactly once each time, after all 8&quot;);\n\n        // 12. a failed prerequisite skips everything behind it; other jobs still run\n        System.out.println(&quot;12. a failed prerequisite&quot;);\n        ManualClock c12 = new ManualClock(0);\n        Scheduler s12 = new Scheduler(2, c12);\n        List&lt;String&gt; ran12 = new ArrayList&lt;&gt;();\n        s12.scheduleAll(List.of(\n                JobSpec.of(&quot;migrate&quot;, () -&gt; { throw new IllegalStateException(&quot;schema lock&quot;); }),\n                JobSpec.of(&quot;deploy&quot;, () -&gt; ran12.add(&quot;deploy&quot;)).after(&quot;migrate&quot;),\n                JobSpec.of(&quot;smoke&quot;, () -&gt; ran12.add(&quot;smoke&quot;)).after(&quot;deploy&quot;),\n                JobSpec.of(&quot;notify&quot;, () -&gt; ran12.add(&quot;notify&quot;)).after(&quot;migrate&quot;),\n                JobSpec.of(&quot;lint&quot;, () -&gt; ran12.add(&quot;lint&quot;))));\n        drive(s12, c12, 50, 1);\n        check(s12.status(&quot;migrate&quot;) == JobState.FAILED, &quot;migrate FAILED&quot;);\n        check(s12.status(&quot;deploy&quot;) == JobState.SKIPPED &amp;&amp; s12.status(&quot;smoke&quot;) == JobState.SKIPPED\n              &amp;&amp; s12.status(&quot;notify&quot;) == JobState.SKIPPED, &quot;deploy, smoke (two steps behind) and notify were SKIPPED&quot;);\n        check(ran12.equals(List.of(&quot;lint&quot;)), &quot;lint, which waits for nothing, still ran: &quot; + ran12);\n        s12.schedule(JobSpec.of(&quot;rollback-report&quot;, () -&gt; ran12.add(&quot;late&quot;)).after(&quot;migrate&quot;));\n        check(s12.status(&quot;rollback-report&quot;) == JobState.SKIPPED, &quot;a job submitted later, waiting for the failed one, is SKIPPED at once&quot;);\n\n        // 13. a batch with a cycle is refused with its path, and nothing from it is kept\n        System.out.println(&quot;13. cycles and bad prerequisites are refused at submit&quot;);\n        ManualClock c13 = new ManualClock(0);\n        Scheduler s13 = new Scheduler(1, c13);\n        String msg = &quot;&quot;;\n        try {\n            s13.scheduleAll(List.of(JobSpec.of(&quot;x&quot;, () -&gt; {}).after(&quot;z&quot;), JobSpec.of(&quot;y&quot;, () -&gt; {}).after(&quot;x&quot;),\n                                    JobSpec.of(&quot;z&quot;, () -&gt; {}).after(&quot;y&quot;), JobSpec.of(&quot;w&quot;, () -&gt; {})));\n        } catch (IllegalArgumentException e) { msg = e.getMessage(); }\n        check(msg.contains(&quot;x -&gt; z -&gt; y -&gt; x&quot;), &quot;refused with the path: &quot; + msg);\n        check(s13.status(&quot;w&quot;) == null &amp;&amp; s13.counts().values().stream().mapToInt(Integer::intValue).sum() == 0,\n              &quot;all or nothing: not even w, which had no cycle, was kept&quot;);\n        boolean unknown = false, recurring = false, self = false;\n        try { s13.schedule(JobSpec.of(&quot;a&quot;, () -&gt; {}).after(&quot;ghost&quot;)); } catch (IllegalArgumentException e) { unknown = true; }\n        s13.schedule(JobSpec.of(&quot;tick&quot;, () -&gt; {}).every(new FixedRate(1_000)));\n        try { s13.schedule(JobSpec.of(&quot;b&quot;, () -&gt; {}).after(&quot;tick&quot;)); } catch (IllegalArgumentException e) { recurring = true; }\n        try { s13.schedule(JobSpec.of(&quot;me&quot;, () -&gt; {}).after(&quot;me&quot;)); } catch (IllegalArgumentException e) { self = true; }\n        check(unknown &amp;&amp; recurring &amp;&amp; self, &quot;an unknown prerequisite, a recurring one, and a job waiting for itself are all refused&quot;);\n        List&lt;JobSpec&gt; chain = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 20_000; i++) chain.add(i == 0 ? JobSpec.of(&quot;s0&quot;, () -&gt; {}) : JobSpec.of(&quot;s&quot; + i, () -&gt; {}).after(&quot;s&quot; + (i - 1)));\n        check(s13.scheduleAll(chain).size() == 20_000, &quot;a chain of 20,000 jobs is accepted: the check is a loop, not recursion&quot;);\n        List&lt;JobSpec&gt; loop = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 20_000; i++) loop.add(JobSpec.of(&quot;q&quot; + i, () -&gt; {}).after(&quot;q&quot; + ((i + 1) % 20_000)));\n        boolean bigCycle = false;\n        try { s13.scheduleAll(loop); } catch (IllegalArgumentException e) { bigCycle = e.getMessage().startsWith(&quot;cycle&quot;); }\n        check(bigCycle, &quot;a cycle through 20,000 jobs is found without a stack overflow&quot;);\n\n        // 14. graceful shutdown: one-shots finish, recurring jobs stop, new jobs are refused\n        System.out.println(&quot;14. shutdown()&quot;);\n        Scheduler s14 = new Scheduler(2, Clock.system());\n        s14.start();\n        CountDownLatch later14 = new CountDownLatch(1);\n        AtomicInteger ticks14 = new AtomicInteger();\n        s14.schedule(JobSpec.of(&quot;later&quot;, later14::countDown).in(150));\n        s14.schedule(JobSpec.of(&quot;tick&quot;, ticks14::incrementAndGet).every(new FixedRate(10)));\n        Thread.sleep(50);\n        s14.shutdown();\n        boolean refused14 = false;\n        try { s14.schedule(() -&gt; {}, 0); } catch (RejectedExecutionException e) { refused14 = true; }\n        boolean ended14 = s14.awaitTermination(3_000);\n        check(later14.getCount() == 0 &amp;&amp; ended14, &quot;the job due in 150 ms still ran after shutdown(), then the threads ended&quot;);\n        int t14 = ticks14.get();\n        Thread.sleep(40);\n        check(ticks14.get() == t14 &amp;&amp; s14.status(&quot;tick&quot;) == JobState.CANCELLED, &quot;the recurring job stopped and is CANCELLED&quot;);\n        check(refused14, &quot;a new job after shutdown() is refused&quot;);\n\n        // 15. shutdownNow: returns what never started, interrupts what runs, ends at once\n        System.out.println(&quot;15. shutdownNow()&quot;);\n        Scheduler s15 = new Scheduler(1, Clock.system());\n        s15.start();\n        CountDownLatch sleeping = new CountDownLatch(1);\n        AtomicBoolean interrupted15 = new AtomicBoolean();\n        s15.schedule(JobSpec.of(&quot;sleeper&quot;, () -&gt; {\n            sleeping.countDown();\n            try { Thread.sleep(10_000); } catch (InterruptedException e) { interrupted15.set(true); throw e; }\n        }));\n        s15.schedule(JobSpec.of(&quot;far&quot;, () -&gt; {}).in(60_000));\n        s15.schedule(JobSpec.of(&quot;queued&quot;, () -&gt; {}).in(0));        // due, but the only worker is busy\n        s15.scheduleAll(List.of(JobSpec.of(&quot;report&quot;, () -&gt; {}).after(&quot;sleeper&quot;),        // a chain waiting behind the sleeper\n                                JobSpec.of(&quot;email&quot;, () -&gt; {}).after(&quot;report&quot;)));\n        sleeping.await();\n        long t15 = System.nanoTime();\n        List&lt;String&gt; never = s15.shutdownNow();\n        boolean ended15 = s15.awaitTermination(2_000);\n        long ms15 = (System.nanoTime() - t15) / 1_000_000;\n        check(new HashSet&lt;&gt;(never).equals(Set.of(&quot;far&quot;, &quot;queued&quot;, &quot;report&quot;, &quot;email&quot;)), &quot;it returned the four jobs that never started: &quot; + never);\n        check(interrupted15.get() &amp;&amp; ended15 &amp;&amp; ms15 &lt; 1_500, &quot;the sleeping job was interrupted and every thread ended in &quot; + ms15 + &quot; ms&quot;);\n        check(s15.status(&quot;sleeper&quot;) == JobState.CANCELLED &amp;&amp; s15.status(&quot;far&quot;) == JobState.CANCELLED\n              &amp;&amp; s15.status(&quot;report&quot;) == JobState.CANCELLED &amp;&amp; s15.status(&quot;email&quot;) == JobState.CANCELLED,\n              &quot;all of them are CANCELLED, including a chain of waiting jobs (none half-cancelled, half-skipped)&quot;);\n\n        // 16. listeners hear after the lock is released; a broken one changes nothing; the counts add up\n        System.out.println(&quot;16. listeners and counts&quot;);\n        ManualClock c16 = new ManualClock(0);\n        Scheduler s16 = new Scheduler(2, c16);\n        AtomicBoolean lockFree = new AtomicBoolean(true);\n        List&lt;RunRecord&gt; heard = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        s16.addListener(r -&gt; { throw new IllegalStateException(&quot;broken dashboard&quot;); });\n        s16.addListener(r -&gt; {\n            Thread other = new Thread(s16::counts);               // would block if the lock were still held\n            other.start();\n            try { other.join(1_000); } catch (InterruptedException e) { return; }\n            if (other.isAlive()) lockFree.set(false);\n            heard.add(r);\n        });\n        s16.schedule(JobSpec.of(&quot;ok&quot;, () -&gt; {}));\n        s16.schedule(JobSpec.of(&quot;bad&quot;, () -&gt; { throw new IOException(&quot;disk full&quot;); }));\n        s16.schedule(JobSpec.of(&quot;never&quot;, () -&gt; {}).in(1_000));\n        s16.cancel(&quot;never&quot;);\n        drive(s16, c16, 10, 1);\n        check(lockFree.get() &amp;&amp; heard.size() == 3, &quot;3 records heard, each after the lock was released, despite a listener that throws&quot;);\n        Map&lt;JobState, Integer&gt; n16 = s16.counts();\n        check(n16.get(JobState.DONE) == 1 &amp;&amp; n16.get(JobState.FAILED) == 1 &amp;&amp; n16.get(JobState.CANCELLED) == 1\n              &amp;&amp; n16.values().stream().mapToInt(Integer::intValue).sum() == 3, &quot;counts: &quot; + n16);\n\n        System.out.println(failed == 0 ? &quot;ALL PASS&quot; : failed + &quot; FAILED&quot;);\n        System.exit(failed == 0 ? 0 : 1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Build a job scheduler. A caller submits a job to run after a delay, at a given time, or again and again (every ten seconds, or ten seconds after the last run ended), and a job may have to wait for other jobs to finish first. A fixed pool of worker threads runs the jobs, and I need cancel and shutdown. I want working, thread-safe code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions; then type in the order of Main.java: Task and Clock; Trigger with FixedRate and FixedDelay; RetryPolicy with ExponentialBackoff; JobState with its ALLOWED table; JobSpec and ScheduledJob; then the Scheduler: the two heaps, the map and the lock, <code>schedule</code>, <code>pollDue</code>, the dispatcher loop with <code>awaitNanos</code> and the signal, the worker loop and <code>runJob</code>, <code>finishLocked</code> in its order, <code>cancel</code>, <code>shutdown</code>; last, a main with the race. If the clock runs out, the one thing that must exist is schedule with a delay, the dispatcher loop that decides and waits under the lock and is woken by an earlier job, workers that run jobs outside the lock, and cancel decided under the lock. Retries, recurring jobs and prerequisites come next, in that order.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>1 &middot; A job due in 10 s is being waited on. A job due in 1 s arrives. Show that it runs at 1 s, not 10, and say what a spurious wakeup does.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The dispatcher never sleeps on stale information. <code>dispatchLoop</code> holds the lock while it takes whatever is due, works out how long until the earliest job, and calls <code>awaitNanos</code> with that time; await lets go of the lock only once the thread is waiting, and takes it back before it returns. <code>schedule()</code> adds the new job under the same lock, and if the new job is now the head of the time heap it signals. So the signal can only arrive while the dispatcher is waiting: it wakes, sees the 1 s job, and sleeps again for one second. A spurious wakeup (await returning although nobody signalled, which Java allows) and a timeout both go back to the top of the same loop, which starts nothing that is not due. Test 2 puts the dispatcher to sleep towards a 5 s job, adds a 50 ms job, and measures about 55 ms; with the signal line deleted, it waits the full 5 seconds and fails.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /** How long the dispatcher may sleep: -1 = until signalled; otherwise ms until the earliest job is due. */\n    private long sleepMsLocked(long now) {\n        if (running &gt;= workers) return -1;                          // no free worker: a finishing job will signal\n        while (!byTime.isEmpty() &amp;&amp; byTime.peek().state != JobState.SCHEDULED) byTime.poll();   // drop cancelled heads\n        if (byTime.isEmpty()) return -1;                            // nothing waiting: schedule() will signal\n        return byTime.peek().dueAt - now;                           // positive: pollDueLocked took everything due\n    }\n\n    /**\n     * The dispatcher thread. Under the lock: take what is due, else decide how long to sleep and sleep in\n     * the SAME locked step (await releases the lock while it waits and takes it back on waking). A new\n     * earlier job signals it; a spurious wakeup just goes round the loop once more.\n     */\n    private void dispatchLoop() {\n        lock.lock();\n        try {\n            while (!stopNow) {\n                long now = clock.nowMs();\n                List&lt;ScheduledJob&gt; due = pollDueLocked(now);\n                if (!due.isEmpty()) { handoff.addAll(due); continue; }     // the hand-off queue never blocks\n                if (!accepting &amp;&amp; live == 0) break;                        // graceful shutdown: nothing is left\n                long sleepMs = sleepMsLocked(now);\n                if (sleepMs &lt; 0) wake.await();\n                else wake.awaitNanos(TimeUnit.MILLISECONDS.toNanos(sleepMs));\n            }\n        } catch (InterruptedException e) {\n            // nobody interrupts the dispatcher on purpose; if someone does, stop cleanly like shutdownNow\n        } finally {\n            lock.unlock();\n            for (int i = 0; i &lt; workers; i++) handoff.add(POISON);        // one stop sign per worker\n        }\n    }\n\n    /** Into the time heap as SCHEDULED; wake the dispatcher only if this job is now the earliest. */\n    private void enqueueLocked(ScheduledJob j) {\n        move(j, JobState.SCHEDULED);\n        byTime.add(j);\n        if (byTime.peek() == j) wake.signal();                     // the dispatcher may be asleep planning for a later job\n    }\n\n        // 2. the lost wakeup: an earlier job must wake a dispatcher that is asleep planning for a later one\n        System.out.println(&quot;2. an earlier job wakes the sleeping dispatcher&quot;);\n        Scheduler s2 = new Scheduler(1, Clock.system());\n        s2.start();\n        s2.schedule(() -&gt; {}, 5_000);                              // the dispatcher goes to sleep for 5 s\n        Thread.sleep(50);\n        CountDownLatch ran2 = new CountDownLatch(1);\n        long t2 = System.nanoTime();\n        s2.schedule(ran2::countDown, 50);\n        boolean woke = ran2.await(2, TimeUnit.SECONDS);\n        long ms2 = (System.nanoTime() - t2) / 1_000_000;\n        check(woke &amp;&amp; ms2 &lt; 1_000, &quot;a 50 ms job submitted while the dispatcher slept towards a 5 s job ran after &quot; + ms2 + &quot; ms&quot;);\n        s2.shutdownNow();\n        check(s2.awaitTermination(2_000), &quot;shutdownNow ended the dispatcher mid-sleep&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>2 &middot; Fixed rate or fixed delay: what is the difference, and what happens when a run takes longer than its period?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both are Trigger classes of one line each. <code>FixedRate</code> returns the planned start plus the period, so a job planned for 10:00:00, 10:00:10 and 10:00:20 keeps that rhythm however long each run takes. <code>FixedDelay</code> returns the end of the last run plus the delay, so a slow run pushes every later run back (test 6: starts at 0, 1000, 2000 against 10000, 11300, 12600 with 300 ms runs). In <code>finishLocked</code> a recurring job is put back into the time heap only after its run has ended, so two runs of one job can never overlap, even with idle workers (test 7: 25 ms runs every 5 ms, never two at once). A planned time that has already passed when the run ends is a misfire, and the job's Misfire decides: RUN_ALL runs every missed slot back to back (what the JDK does), RUN_ONCE runs one late run for all of them, SKIP waits for the next slot. Time itself comes from the injected Clock: in production <code>Clock.system()</code>, which reads System.nanoTime (monotonic: it never jumps when NTP, the service that corrects a machine's clock, moves the wall clock), and in tests a ManualClock that the job itself moves forward, so nothing sleeps.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Fixed rate: every periodMs, counted from the PLANNED start of the last run (10:00:00, 10:00:10, 10:00:20),\n * so the rhythm never drifts, however long a run takes.\n */\nrecord FixedRate(long periodMs) implements Trigger {\n    /** Refuses a period of zero or less. */\n    FixedRate { if (periodMs &lt;= 0) throw new IllegalArgumentException(&quot;period must be positive: &quot; + periodMs); }\n    /** The planned start plus one period. */\n    public long next(long plannedAt, long finishedAt) { return plannedAt + periodMs; }\n}\n\n/** Fixed delay: delayMs after the last run ENDED, so a slow run pushes every later run back. */\nrecord FixedDelay(long delayMs) implements Trigger {\n    /** Refuses a delay of zero or less. */\n    FixedDelay { if (delayMs &lt;= 0) throw new IllegalArgumentException(&quot;delay must be positive: &quot; + delayMs); }\n    /** The end of the last run plus the delay. */\n    public long next(long plannedAt, long finishedAt) { return finishedAt + delayMs; }\n}\n\n/**\n * What happens to planned runs of a recurring job that were missed: the job was still running at its next\n * planned time, every worker was busy, or the process was down. A closed list of three answers, so an enum.\n */\nenum Misfire {\n    /** Run every missed one, back to back, until caught up (what the JDK&#x27;s fixed rate does). */\n    RUN_ALL,\n    /** Run once, now, for all the missed ones; then continue from the next planned time in the future. */\n    RUN_ONCE,\n    /** Run none of the missed ones; wait for the next planned time in the future. */\n    SKIP;\n\n    /**\n     * The planned slot to run next, given the trigger&#x27;s next slot (maybe already in the past) and now; NONE\n     * means no more runs. The job starts at max(slot, now), so a slot in the past starts at once.\n     * Cost: one step per missed slot.\n     */\n    long place(Trigger t, long next, long finishedAt, long now) {\n        if (next == Trigger.NONE || next &gt;= now || this == RUN_ALL) return next;\n        long after = t.next(next, finishedAt);\n        while (after != Trigger.NONE &amp;&amp; after &gt; next &amp;&amp; after &lt; now) { next = after; after = t.next(after, finishedAt); }\n        if (this == RUN_ONCE) return next;                                   // the latest missed slot, once, now\n        return (after == Trigger.NONE || after &lt;= next) ? Trigger.NONE : after;  // SKIP: the first slot not yet past\n    }\n}\n\n        // 7. a run longer than its period: never two runs at once; the missed slots follow the Misfire rule\n        System.out.println(&quot;7. a run longer than its period&quot;);\n        Scheduler s7 = new Scheduler(4, Clock.system());\n        s7.start();\n        AtomicInteger in7 = new AtomicInteger(), most7 = new AtomicInteger(), runs7 = new AtomicInteger();\n        String id7 = s7.scheduleAtFixedRate(() -&gt; {\n            most7.accumulateAndGet(in7.incrementAndGet(), Math::max);\n            Thread.sleep(25);\n            in7.decrementAndGet();\n            runs7.incrementAndGet();\n        }, 0, 5);\n        Thread.sleep(300);\n        s7.cancel(id7);\n        s7.shutdown();\n        s7.awaitTermination(2_000);\n        check(most7.get() == 1 &amp;&amp; runs7.get() &gt;= 5, &quot;25 ms runs every 5 ms, 4 idle workers: &quot; + runs7.get() + &quot; runs, never two at once&quot;);\n        check(misfireStarts(Misfire.RUN_ALL).equals(List.of(0L, 1_000L, 3_500L, 3_600L, 4_000L)), &quot;RUN_ALL: the missed 2 s and 3 s slots run back to back at 3.5 s and 3.6 s&quot;);\n        check(misfireStarts(Misfire.RUN_ONCE).equals(List.of(0L, 1_000L, 3_500L, 4_000L)), &quot;RUN_ONCE: one run at 3.5 s stands in for both, then 4 s on time&quot;);\n        check(misfireStarts(Misfire.SKIP).equals(List.of(0L, 1_000L, 4_000L)), &quot;SKIP: nothing late; the next run is the 4 s slot&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; Prove it is thread-safe: 16 threads submit at once, 8 workers run them. Nothing lost, nothing run twice, never 9 at once.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Main's race does exactly that. Sixteen threads wait on one latch (a gate that opens for all of them at once), then each submits 500 jobs due within the next 20 ms, and eight workers run them. Every job adds one to its own counter and tracks how many jobs are running at that moment. At the end, every one of the 8,000 counters is exactly 1, the most running at one moment is 8 and never 9, and the DONE count is 8,000. It holds because every change to the heaps, the map and the states happens under the one lock, and the dispatcher hands out a job only while fewer jobs are running than there are workers. Test 5 checks the bound from the other side: 40 jobs of 20 ms on 4 workers reach 4 at once, so the pool is really used.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // the race: 16 threads submit 500 jobs each at the same instant; 8 workers run them\n        int submitters = 16, each = 500, total = submitters * each, pool = 8;\n        Scheduler race = new Scheduler(pool, real);\n        race.start();\n        AtomicIntegerArray ran = new AtomicIntegerArray(total);\n        AtomicInteger inFlight = new AtomicInteger(), mostAtOnce = new AtomicInteger();\n        CountDownLatch go = new CountDownLatch(1), finished = new CountDownLatch(total);\n        Random rnd = new Random(7);\n        for (int t2 = 0; t2 &lt; submitters; t2++) {\n            int base = t2 * each;\n            new Thread(() -&gt; {\n                try { go.await(); } catch (InterruptedException e) { return; }\n                for (int k = 0; k &lt; each; k++) {\n                    int n = base + k;\n                    race.schedule(JobSpec.of(&quot;r&quot; + n, () -&gt; {\n                        mostAtOnce.accumulateAndGet(inFlight.incrementAndGet(), Math::max);\n                        ran.incrementAndGet(n);\n                        long until = System.nanoTime() + 50_000;           // 50 microseconds of real work\n                        while (System.nanoTime() &lt; until) Thread.onSpinWait();\n                        inFlight.decrementAndGet();\n                        finished.countDown();\n                    }).in(rnd.nextInt(20)));\n                }\n            }).start();\n        }\n        go.countDown();\n        boolean all = finished.await(30, TimeUnit.SECONDS);\n        boolean exactlyOnce = all;\n        for (int n = 0; n &lt; total; n++) exactlyOnce &amp;= ran.get(n) == 1;\n        race.shutdown();\n        race.awaitTermination(5_000);\n        System.out.println(&quot;-- &quot; + submitters + &quot; threads submitted &quot; + total + &quot; jobs at once to &quot; + pool + &quot; workers&quot;);\n        System.out.println(&quot;   every job ran exactly once: &quot; + exactlyOnce + &quot;; most running at one moment: &quot;\n                + mostAtOnce.get() + &quot; (never above &quot; + pool + &quot;); DONE count &quot; + race.counts().get(JobState.DONE));\n\n        // 5. a fixed pool: never more than N at once, and all N really used\n        System.out.println(&quot;5. at most N jobs run at once&quot;);\n        Scheduler s5 = new Scheduler(4, Clock.system());\n        s5.start();\n        AtomicInteger in5 = new AtomicInteger(), most5 = new AtomicInteger();\n        CountDownLatch done5 = new CountDownLatch(40);\n        for (int i = 0; i &lt; 40; i++)\n            s5.schedule(() -&gt; {\n                most5.accumulateAndGet(in5.incrementAndGet(), Math::max);\n                Thread.sleep(20);\n                in5.decrementAndGet();\n                done5.countDown();\n            }, 0);\n        check(done5.await(10, TimeUnit.SECONDS) &amp;&amp; most5.get() == 4, &quot;40 jobs of 20 ms on 4 workers: the most at once was &quot; + most5.get());\n        s5.shutdown();\n        s5.awaitTermination(2_000);\n        ManualClock c5 = new ManualClock(0);\n        Scheduler bp = new Scheduler(2, c5);\n        bp.limitPending(10);\n        for (int i = 0; i &lt; 10; i++) bp.schedule(JobSpec.of(&quot;b&quot; + i, () -&gt; {}).in(100));\n        boolean full5 = false, again5 = true;\n        try { bp.schedule(JobSpec.of(&quot;b10&quot;, () -&gt; {})); } catch (RejectedExecutionException e) { full5 = true; }\n        drive(bp, c5, 200, 10);\n        try { bp.schedule(JobSpec.of(&quot;b11&quot;, () -&gt; {})); } catch (RejectedExecutionException e) { again5 = false; }\n        check(full5 &amp;&amp; again5, &quot;back-pressure: with a limit of 10 unfinished jobs the 11th is refused, and accepted again once they ran&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; Two prerequisites finish in the same millisecond, and another one fails. What happens to the jobs waiting on them?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Each job keeps <code>waitingFor</code>, the number of prerequisites not yet DONE, and each prerequisite keeps its <code>dependents</code>. When a job ends, <code>endLocked</code> settles its dependents inside the scheduler's lock. On DONE it counts each one down, and the finish that brings a count to zero moves that job to SCHEDULED. Two builds finishing in the same millisecond are taken one after the other by the lock, so deploy is queued exactly once; the test releases eight prerequisites through a barrier, thirty times, and deploy runs once each time, after all eight. On FAILED, CANCELLED or SKIPPED it skips every dependent and everything behind them, breadth first, and records why; a job submitted later that waits for a failed job is SKIPPED at once (test 12). Jobs that wait for nothing are untouched.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Move a job to a final state, then settle the jobs that wait for it: DONE counts each one down (the one\n     * that reaches zero is scheduled, exactly once, because this runs under the lock); any other end skips\n     * all of them, and everything behind them, breadth first.\n     */\n    private void endLocked(ScheduledJob j, JobState how, List&lt;RunRecord&gt; events) {\n        move(j, how);\n        live--;\n        if (how == JobState.DONE) {\n            for (ScheduledJob d : j.dependents)\n                if (d.state == JobState.BLOCKED &amp;&amp; --d.waitingFor == 0) enqueueLocked(d);\n        } else {\n            Deque&lt;ScheduledJob&gt; todo = new ArrayDeque&lt;&gt;(j.dependents);\n            while (!todo.isEmpty()) {\n                ScheduledJob d = todo.poll();\n                if (d.state != JobState.BLOCKED) continue;         // already skipped or cancelled\n                move(d, JobState.SKIPPED);\n                live--;\n                events.add(new RunRecord(d.id, 0, -1, clock.nowMs(),\n                        &quot;prerequisite &quot; + j.id + &quot; &quot; + how.name().toLowerCase(), JobState.SKIPPED));\n                todo.addAll(d.dependents);\n            }\n        }\n        j.dependents.clear();\n    }\n\n        int rounds = 30, lateOrTwice = 0;\n        for (int round = 0; round &lt; rounds; round++) {\n            Scheduler r = new Scheduler(8, Clock.system());\n            r.start();\n            CyclicBarrier together = new CyclicBarrier(8);\n            AtomicLong lastEnd = new AtomicLong();\n            AtomicInteger deployRuns = new AtomicInteger();\n            long[] deployStart = new long[1];\n            List&lt;JobSpec&gt; batch = new ArrayList&lt;&gt;();\n            String[] pre = new String[8];\n            for (int p = 0; p &lt; 8; p++) {\n                pre[p] = &quot;p&quot; + p;\n                batch.add(JobSpec.of(pre[p], () -&gt; { together.await(); lastEnd.accumulateAndGet(System.nanoTime(), Math::max); }));\n            }\n            CountDownLatch deployed = new CountDownLatch(1);\n            batch.add(JobSpec.of(&quot;deploy&quot;, () -&gt; { deployStart[0] = System.nanoTime(); deployRuns.incrementAndGet(); deployed.countDown(); }).after(pre));\n            r.scheduleAll(batch);\n            deployed.await(5, TimeUnit.SECONDS);\n            r.shutdown();\n            r.awaitTermination(5_000);\n            if (deployRuns.get() != 1 || deployStart[0] &lt; lastEnd.get()) lateOrTwice++;\n        }\n        check(lateOrTwice == 0, rounds + &quot; rounds of 8 prerequisites finishing together: deploy ran exactly once each time, after all 8&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; A batch of jobs forms a loop. Refuse it, and print the loop. Then: what must finish, in what order, before job X can run?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p><code>scheduleAll</code> checks before it creates anything. <code>findCycle</code> runs Kahn's algorithm over the batch: count, for each job, its prerequisites inside the batch, then keep removing jobs whose count is zero and counting down the jobs waiting for them. If every job was removed there is no loop. If some are left, each of them still waits for another one left, so walking \"waits for\" links from any of them must come back to a job already seen, and that stretch is the loop: \"x -> z -> y -> x\". The batch is refused whole, so w, which was fine, is not kept either. Brex's completion plan reads the same graph the other way: a depth-first walk from X that writes a job down only after everything it waits for, which gives yoga, coffee, toast, brainstorm. Both use their own stack and queue rather than recursion, so a 20,000-job chain cannot overflow the call stack (test 13).</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Kahn&#x27;s algorithm over the batch: keep removing jobs that wait for nothing still in the batch. Whatever\n     * cannot be removed sits on or behind a cycle; walk &quot;waits for&quot; links from one of them until a job repeats.\n     * Jobs already in the scheduler cannot close a cycle: they never wait for new ones. O(jobs + links).\n     */\n    private static List&lt;String&gt; findCycle(Map&lt;String, JobSpec&gt; batch) {\n        Map&lt;String, Integer&gt; waits = new HashMap&lt;&gt;();              // prerequisites inside the batch not yet removed\n        Map&lt;String, List&lt;String&gt;&gt; waiters = new HashMap&lt;&gt;();       // p -&gt; the batch jobs waiting for p\n        for (JobSpec s : batch.values()) {\n            int n = 0;\n            for (String p : new LinkedHashSet&lt;&gt;(s.after))\n                if (batch.containsKey(p)) { n++; waiters.computeIfAbsent(p, k -&gt; new ArrayList&lt;&gt;()).add(s.id); }\n            waits.put(s.id, n);\n        }\n        Deque&lt;String&gt; free = new ArrayDeque&lt;&gt;();\n        for (String id : batch.keySet()) if (waits.get(id) == 0) free.add(id);\n        int removed = 0;\n        while (!free.isEmpty()) {\n            String id = free.poll();\n            removed++;\n            for (String w : waiters.getOrDefault(id, List.of()))\n                if (waits.merge(w, -1, Integer::sum) == 0) free.add(w);\n        }\n        if (removed == batch.size()) return null;\n        String at = null;                                          // every job left waits for another job left\n        for (String id : batch.keySet()) if (waits.get(id) &gt; 0) { at = id; break; }\n        List&lt;String&gt; walk = new ArrayList&lt;&gt;();\n        Map&lt;String, Integer&gt; seenAt = new HashMap&lt;&gt;();\n        while (!seenAt.containsKey(at)) {\n            seenAt.put(at, walk.size());\n            walk.add(at);\n            for (String p : batch.get(at).after)\n                if (batch.containsKey(p) &amp;&amp; waits.get(p) &gt; 0) { at = p; break; }\n        }\n        List&lt;String&gt; cycle = new ArrayList&lt;&gt;(walk.subList(seenAt.get(at), walk.size()));\n        cycle.add(at);\n        return cycle;\n    }\n\n// ---- ext: completion plan -------------------------------------------------------------------------------\n/**\n * Brex&#x27;s third milestone: &quot;what must finish, in what order, before X can run?&quot; Walk X&#x27;s prerequisites\n * depth first and write a job down only after everything it waits for, so the list is a valid order that\n * ends with X. DONE jobs are left out. An explicit stack instead of recursion, so a 20,000-job chain is fine.\n */\nfinal class CompletionPlan {\n    /** Static helpers only. */\n    private CompletionPlan() {}\n    /** A valid order of every unfinished job X needs, ending with X. */\n    static List&lt;String&gt; of(Scheduler s, String id) {\n        List&lt;String&gt; plan = new ArrayList&lt;&gt;();\n        Set&lt;String&gt; seen = new HashSet&lt;&gt;(List.of(id));\n        Deque&lt;String&gt; path = new ArrayDeque&lt;&gt;(List.of(id));\n        Deque&lt;Iterator&lt;String&gt;&gt; todo = new ArrayDeque&lt;&gt;(List.of(s.prerequisitesOf(id).iterator()));\n        while (!path.isEmpty()) {\n            Iterator&lt;String&gt; it = todo.peek();\n            if (it.hasNext()) {\n                String p = it.next();\n                if (seen.add(p) &amp;&amp; s.status(p) != JobState.DONE) { path.push(p); todo.push(s.prerequisitesOf(p).iterator()); }\n            } else {\n                todo.pop();\n                plan.add(path.pop());                          // everything it waits for is already written down\n            }\n        }\n        return plan;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; The job throws. Retry it up to five times with backoff, then give up. And the worker must survive.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p><code>runJob</code> runs the task with no lock held and catches everything. An exception is a failed attempt, and so is an Error such as StackOverflowError (wrapped), so a worker thread never dies and its slot is never lost; test 9 proves it with a single worker. <code>finishLocked</code> then asks the job's RetryPolicy how long to wait. <code>ExponentialBackoff</code> answers base, twice base, four times base, up to a cap; with jitter, half of each wait is random, so a thousand jobs that failed at the same moment do not all retry in the same millisecond. After maxAttempts it answers GIVE_UP. A retry goes back into the time heap at end + wait and keeps its planned slot, so a fixed-rate job's rhythm does not shift. When the policy gives up, a one-shot job is FAILED and its dependents are skipped, while a recurring job records the failed run and carries on with its next one. The rules themselves run in a try block too: a Trigger or RetryPolicy that throws ends only its own job, FAILED, instead of leaving it stuck RUNNING (test 9). Test 8 shows four attempts at 0, 100, 300 and 700 ms, then FAILED.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /** Run one handed-out job on the calling thread, outside the lock, then settle it under the lock. */\n    void runJob(ScheduledJob j) {\n        long startedAt = clock.nowMs();\n        Exception error = null;\n        try {\n            j.task.run();\n        } catch (Exception e) {\n            error = e;\n        } catch (Throwable t) {                                    // even an Error is one failed attempt:\n            error = new ExecutionException(t);                     // the worker lives on and its slot comes back\n        }\n        List&lt;RunRecord&gt; events = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            finishLocked(j, startedAt, clock.nowMs(), error, events);\n        } finally { lock.unlock(); }\n        publish(events);                                           // after the unlock, never inside it\n    }\n\n    /**\n     * The order after every attempt, all under the lock: free the worker slot; then retry, next run, or end;\n     * then settle the jobs that wait for it; then signal the dispatcher. A job goes back into a heap only\n     * AFTER its run has ended, which is why two runs of one job can never overlap.\n     */\n    private void finishLocked(ScheduledJob j, long startedAt, long finishedAt, Exception error, List&lt;RunRecord&gt; events) {\n        running--;\n        int attempt = j.attempts;\n        String err = error == null ? null : String.valueOf(error);\n        boolean stop = stopNow || j.cancelRequested || (j.recurring() &amp;&amp; !accepting);\n        JobState next;\n        try {\n            long retryIn = (error != null &amp;&amp; !stop) ? j.retry.delayMs(attempt, error) : RetryPolicy.GIVE_UP;\n            if (retryIn &gt;= 0) {                                    // the same planned run, one more attempt\n                j.dueAt = finishedAt + retryIn;\n                next = JobState.SCHEDULED;\n            } else if (stop) {\n                next = (error == null &amp;&amp; !j.recurring()) ? JobState.DONE : JobState.CANCELLED;\n            } else if (!j.recurring()) {\n                next = error == null ? JobState.DONE : JobState.FAILED;\n            } else {                                               // a failed run is recorded; the job goes on\n                j.attempts = 0;\n                long slot = j.misfire.place(j.trigger, j.trigger.next(j.plannedAt, finishedAt), finishedAt, finishedAt);\n                if (slot == Trigger.NONE) next = JobState.DONE;\n                else { j.plannedAt = slot; j.dueAt = Math.max(slot, finishedAt); next = JobState.SCHEDULED; }\n            }\n        } catch (RuntimeException brokenRule) {                    // a Trigger or RetryPolicy that throws ends the job\n            err = (err == null ? &quot;&quot; : err + &quot;; &quot;) + &quot;rule threw &quot; + brokenRule;   // instead of stranding it RUNNING\n            next = JobState.FAILED;                                // or killing this worker\n        }\n        j.lastError = err;\n        events.add(new RunRecord(j.id, attempt, startedAt, finishedAt, err, next));\n        if (next == JobState.SCHEDULED) enqueueLocked(j);\n        else endLocked(j, next, events);\n        wake.signal();                                             // a worker is free, and the heaps changed\n    }\n\n/**\n * Exponential backoff with jitter: wait base, then 2 x base, 4 x base ..., never more than cap, and at most\n * maxAttempts attempts in all. Jitter (a random part of each wait) spreads out jobs that failed together, so\n * a thousand of them do not all retry in the same millisecond: here half of each wait is fixed, half random.\n */\nfinal class ExponentialBackoff implements RetryPolicy {\n    private final long baseMs, capMs;\n    private final int maxAttempts;\n    private final Random random;                          // null = no jitter: exact waits, for tests\n\n    ExponentialBackoff(long baseMs, long capMs, int maxAttempts, Random random) {\n        if (baseMs &lt;= 0 || capMs &lt; baseMs || maxAttempts &lt; 1) throw new IllegalArgumentException(&quot;bad backoff&quot;);\n        this.baseMs = baseMs; this.capMs = capMs; this.maxAttempts = maxAttempts; this.random = random;\n    }\n    /** base, 2 x base, 4 x base ... up to the cap; half of it random when jitter is on; GIVE_UP after maxAttempts. */\n    public long delayMs(int attempts, Exception error) {\n        if (attempts &gt;= maxAttempts) return GIVE_UP;\n        long wait = baseMs;\n        for (int i = 1; i &lt; attempts &amp;&amp; wait &lt; capMs; i++) wait *= 2;       // doubling stops at the cap: no overflow\n        wait = Math.min(wait, capMs);\n        return random == null ? wait : wait / 2 + random.nextLong(wait / 2 + 1);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>7 &middot; Cancel a job. What if the dispatcher is taking it at that very moment? What if it is already running?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p><code>cancel(id)</code> and the dispatcher both decide under the scheduler's lock, so they cannot interleave: one of them goes first. If cancel goes first, the job is still BLOCKED or SCHEDULED; it becomes CANCELLED, the jobs waiting for it are skipped, and cancel returns true. The job stays in its heap and the dispatcher drops it when it reaches the top (lazy removal, because <code>PriorityQueue.remove</code> is a scan). If the dispatcher goes first, the job is already RUNNING; cancel returns false and sets <code>cancelRequested</code>, so this run finishes but no retry and no next run follow. Test 4 races a cancelling thread against the dispatcher over 2,000 jobs: every job either ran once or was cancelled, never both and never neither, and both sides won some of the races.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Cancel a job. True if it had not started, so it never will, and the jobs waiting for it are skipped.\n     * False if it is running (this run finishes, with no retry and no next run after it) or already finished.\n     * Decided under the lock, so between cancel and the dispatcher exactly one wins.\n     */\n    boolean cancel(String id) {\n        List&lt;RunRecord&gt; events = new ArrayList&lt;&gt;();\n        boolean won = false;\n        lock.lock();\n        try {\n            ScheduledJob j = jobs.get(id);\n            if (j == null) return false;\n            if (j.state == JobState.BLOCKED || j.state == JobState.SCHEDULED) {\n                events.add(new RunRecord(j.id, j.attempts, -1, clock.nowMs(), &quot;cancelled&quot;, JobState.CANCELLED));\n                endLocked(j, JobState.CANCELLED, events);           // it stays in its heap until it reaches the top: lazy removal\n                won = true;\n            } else if (j.state == JobState.RUNNING) {\n                j.cancelRequested = true;\n            }\n        } finally { lock.unlock(); }\n        publish(events);\n        return won;\n    }\n\n        // 4. cancel racing the dispatcher, 2,000 times: for every job exactly one side wins\n        System.out.println(&quot;4. cancel races the dispatcher&quot;);\n        Scheduler s4 = new Scheduler(4, Clock.system());\n        s4.start();\n        int n4 = 2_000;\n        AtomicIntegerArray ran4 = new AtomicIntegerArray(n4);\n        boolean[] won4 = new boolean[n4];\n        Random rnd4 = new Random(4);\n        for (int i = 0; i &lt; n4; i++) { int k = i; s4.schedule(JobSpec.of(&quot;c&quot; + k, () -&gt; ran4.incrementAndGet(k)).in(rnd4.nextInt(20))); }\n        List&lt;Integer&gt; shuffled = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; n4; i++) shuffled.add(i);\n        Collections.shuffle(shuffled, rnd4);\n        Thread canceller = new Thread(() -&gt; {\n            int k = 0;\n            for (int i : shuffled) {\n                won4[i] = s4.cancel(&quot;c&quot; + i);\n                if (++k % 100 == 0) try { Thread.sleep(1); } catch (InterruptedException e) { return; }\n            }\n        });\n        canceller.start();\n        canceller.join();\n        s4.shutdown();\n        s4.awaitTermination(10_000);\n        int bad4 = 0, cancelled4 = 0, runs4 = 0;\n        for (int i = 0; i &lt; n4; i++) {\n            boolean ran = ran4.get(i) == 1;\n            if (ran4.get(i) &gt; 1 || ran == won4[i]) bad4++;\n            if (won4[i]) { cancelled4++; if (s4.status(&quot;c&quot; + i) != JobState.CANCELLED) bad4++; } else runs4++;\n        }\n        check(bad4 == 0, &quot;every job either ran once or was cancelled, never both and never neither&quot;);\n        check(cancelled4 &gt; 0 &amp;&amp; runs4 &gt; 0, &quot;both sides won some races: &quot; + cancelled4 + &quot; cancelled, &quot; + runs4 + &quot; ran&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>8 &middot; Several jobs are due and every worker is busy. Highest priority first. Won&#x27;t a low-priority job starve?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>When their time comes, due jobs move from the time heap to a second heap, <code>ready</code>, whose order is a Comparator the scheduler is handed; the default is higher priority, then earlier due time, then first come. So with one free worker the priority-9 job goes before a priority-1 job that was due earlier (test 10). Plain priority can starve: a steady stream of high-priority jobs keeps a low one waiting for ever. Aging is a different comparator, one line long: order by due time minus priority times a step, so every step of waiting is worth one level. Two waiting jobs age at the same speed, so their order never changes while they wait, which keeps the heap valid. With a 10 s step, a priority-1 job due 30 s ago goes before a priority-3 job due now, and nothing waits for ever.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /** Order of the time heap: earliest due first, then submission order. */\n    static final Comparator&lt;ScheduledJob&gt; BY_DUE =\n            Comparator.comparingLong((ScheduledJob j) -&gt; j.dueAt).thenComparingLong(j -&gt; j.seq);\n    /** The default &quot;which due job first&quot;: higher priority, then earlier due, then submission order. */\n    static final Comparator&lt;ScheduledJob&gt; HIGHEST_PRIORITY_FIRST =\n            ((Comparator&lt;ScheduledJob&gt;) (a, b) -&gt; Integer.compare(b.priority, a.priority))\n                    .thenComparingLong(j -&gt; j.dueAt).thenComparingLong(j -&gt; j.seq);\n\n    /** Hand in the rule for which due job goes first when the workers are all busy (Strategy). Safe at any time. */\n    void configure(Comparator&lt;ScheduledJob&gt; whichFirst) {\n        lock.lock();\n        try {\n            PriorityQueue&lt;ScheduledJob&gt; q = new PriorityQueue&lt;&gt;(Objects.requireNonNull(whichFirst));\n            q.addAll(ready);\n            ready = q;\n        } finally { lock.unlock(); }\n    }\n\n// ---- ext: aging -----------------------------------------------------------------------------------------\n/**\n * Priority with aging, handed to Scheduler.configure(...): every stepMs a job has been due counts as one level\n * of priority. Two waiting jobs age at the same speed, so their order never changes while they wait, which\n * keeps the heap valid. With stepMs = 10 s, a priority-1 job due 30 s ago beats a priority-3 job due now: a\n * later job overtakes it only if it became due less than (its priority - 1) x 10 s later. No starvation.\n */\nfinal class Aging {\n    /** Static helpers only. */\n    private Aging() {}\n    /** Smallest key first: dueAt minus priority x stepMs; then submission order. */\n    static Comparator&lt;ScheduledJob&gt; comparator(long stepMs) {\n        return Comparator.comparingLong((ScheduledJob j) -&gt; j.dueAt - j.priority * stepMs).thenComparingLong(j -&gt; j.seq);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; Swiggy: &#x27;design your own cron: a unix command and an epoch time&#x27;. Then: weekdays at 09:30 IST, no holidays, not all 5,000 at once.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The epoch time is <code>JobSpec.at(epochMs)</code>, already in Main; a time already past runs at once. The command is a Task like any other: <code>CommandTask</code> starts it as its own process, waits up to a time limit and kills it if it overruns (a process can be killed, a thread cannot), and treats a non-zero exit code as a failed attempt, so retries apply. The recurring part is a Trigger. <code>Cron</code> parses a crontab line (minute, hour, day of month, month, day of week) into five sets of allowed values and walks forward from the last planned start, skipping a whole month, day or hour at a time, in the job's own time zone, so 09:30 IST stays 09:30 IST. The rule change is two decorators around it, with nothing edited: <code>SkipHolidays</code> moves a run off a holiday, and <code>Spread</code> shifts every run by a fixed offset taken from the job's id (what Jenkins calls H), which spreads 5,000 jobs over ten minutes without letting any of them drift.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: cron, holidays and spreading ------------------------------------------------------------------\n/**\n * A crontab line: &quot;minute hour day-of-month month day-of-week&quot;, each field &quot;*&quot;, a number, &quot;a-b&quot;, &quot;a,b,c&quot; or\n * &quot;x/n&quot; (every n-th). next() walks forward from the last planned start, skipping a whole month, day or hour\n * at a time when that field does not match, so even &quot;29 February&quot; is found in a few thousand steps. The\n * walk happens in the job&#x27;s time zone, so &quot;30 9 * * 1-5&quot; in Asia/Kolkata means 09:30 IST on weekdays.\n * As in classic cron, when both day fields are restricted, a day matching EITHER one counts.\n */\nrecord Cron(BitSet minutes, BitSet hours, BitSet days, BitSet months, BitSet weekdays,\n            boolean anyDay, boolean anyWeekday, ZoneId zone) implements Trigger {\n    /** Parse a five-field line for a time zone; a bad field throws IllegalArgumentException. */\n    static Cron parse(String line, ZoneId zone) {\n        String[] f = line.trim().split(&quot;\\\\s+&quot;);\n        if (f.length != 5) throw new IllegalArgumentException(&quot;cron needs 5 fields: &quot; + line);\n        return new Cron(field(f[0], 0, 59), field(f[1], 0, 23), field(f[2], 1, 31), field(f[3], 1, 12),\n                        field(f[4], 0, 6), f[2].equals(&quot;*&quot;), f[4].equals(&quot;*&quot;), zone);\n    }\n    /** One field as the set of values it allows. */\n    private static BitSet field(String s, int lo, int hi) {\n        BitSet b = new BitSet();\n        for (String part : s.split(&quot;,&quot;)) {\n            int step = 1, slash = part.indexOf(&#x27;/&#x27;);\n            if (slash &gt;= 0) { step = Integer.parseInt(part.substring(slash + 1)); part = part.substring(0, slash); }\n            int a, z;\n            if (part.equals(&quot;*&quot;)) { a = lo; z = hi; }\n            else if (part.contains(&quot;-&quot;)) { a = Integer.parseInt(part.split(&quot;-&quot;)[0]); z = Integer.parseInt(part.split(&quot;-&quot;)[1]); }\n            else { a = Integer.parseInt(part); z = slash &gt;= 0 ? hi : a; }      // &quot;5/10&quot; = 5, 15, 25 ...\n            if (a &lt; lo || z &gt; hi || a &gt; z || step &lt; 1) throw new IllegalArgumentException(&quot;bad cron field &quot; + s);\n            for (int v = a; v &lt;= z; v += step) b.set(v);\n        }\n        return b;\n    }\n    /** Does this calendar day match both day fields (or either, when both are restricted)? */\n    private boolean dayMatches(ZonedDateTime t) {\n        boolean d = days.get(t.getDayOfMonth()), w = weekdays.get(t.getDayOfWeek().getValue() % 7);\n        return (anyDay || anyWeekday) ? d &amp;&amp; w : d || w;\n    }\n    /** The first matching minute strictly after plannedAt, in the job&#x27;s zone; NONE if none in about 5 years. */\n    public long next(long plannedAt, long finishedAt) {\n        ZonedDateTime t = Instant.ofEpochMilli(plannedAt).atZone(zone).truncatedTo(ChronoUnit.MINUTES).plusMinutes(1);\n        for (int steps = 0; steps &lt; 100_000; steps++) {\n            if (!months.get(t.getMonthValue())) t = t.plusMonths(1).withDayOfMonth(1).truncatedTo(ChronoUnit.DAYS);\n            else if (!dayMatches(t)) t = t.plusDays(1).truncatedTo(ChronoUnit.DAYS);\n            else if (!hours.get(t.getHour())) t = t.plusHours(1).truncatedTo(ChronoUnit.HOURS);\n            else if (!minutes.get(t.getMinute())) t = t.plusMinutes(1);\n            else return t.toInstant().toEpochMilli();\n        }\n        return NONE;\n    }\n}\n\n/**\n * Decorator: the same trigger, minus the holidays. A run that would fall on a holiday moves to the wrapped\n * trigger&#x27;s next run instead. A cron line cannot say &quot;not on Diwali&quot;; this wraps any trigger and edits none.\n */\nrecord SkipHolidays(Trigger inner, ZoneId zone, Set&lt;LocalDate&gt; holidays) implements Trigger {\n    /** The wrapped trigger&#x27;s next run that is not on a holiday (at most a year of tries, then NONE). */\n    public long next(long plannedAt, long finishedAt) {\n        long t = inner.next(plannedAt, finishedAt);\n        for (int i = 0; i &lt; 366 &amp;&amp; t != NONE; i++) {\n            if (!holidays.contains(Instant.ofEpochMilli(t).atZone(zone).toLocalDate())) return t;\n            t = inner.next(t, t);\n        }\n        return NONE;\n    }\n}\n\n/**\n * Decorator: shift every run of the wrapped trigger by a fixed offset taken from the job&#x27;s id (what Jenkins\n * calls &quot;H&quot;). 5,000 jobs written as &quot;09:30&quot; then start spread over a window instead of in one second, and\n * because the offset is the same every time, the schedule never drifts. Build it with Spread.of(id, ...).\n */\nrecord Spread(Trigger inner, long offsetMs) implements Trigger {\n    /** A spread whose offset in [0, windowMs) comes from the id&#x27;s hash: the same id, the same offset, always. */\n    static Spread of(String jobId, Trigger inner, long windowMs) {\n        return new Spread(inner, Math.floorMod(jobId.hashCode() * 0x9E3779B1L, windowMs));\n    }\n    /** The wrapped trigger&#x27;s next run after the unshifted plannedAt, shifted again. */\n    public long next(long plannedAt, long finishedAt) {\n        long t = inner.next(plannedAt - offsetMs, finishedAt);\n        return t == NONE ? NONE : t + offsetMs;\n    }\n}\n\n/**\n * Swiggy&#x27;s cron: the job is a unix command. It runs as its own process, so a time limit can really stop it\n * (destroyForcibly), which a Java thread never can. A non-zero exit code or a timeout is a failed attempt,\n * so the job&#x27;s RetryPolicy applies. Output goes to a log file, never into the scheduler&#x27;s memory.\n */\nrecord CommandTask(List&lt;String&gt; command, long timeoutMs, File log) implements Task {\n    /** Start the process, wait up to timeoutMs, kill it if it overruns; throw on a timeout or a non-zero exit. */\n    public void run() throws Exception {\n        ProcessBuilder pb = new ProcessBuilder(command).redirectErrorStream(true);\n        pb.redirectOutput(log == null ? ProcessBuilder.Redirect.DISCARD : ProcessBuilder.Redirect.appendTo(log));\n        Process p = pb.start();\n        try {\n            if (!p.waitFor(timeoutMs, TimeUnit.MILLISECONDS)) {\n                p.destroyForcibly();\n                throw new TimeoutException(command + &quot; ran longer than &quot; + timeoutMs + &quot; ms&quot;);\n            }\n            if (p.exitValue() != 0) throw new IOException(command + &quot; exited with &quot; + p.exitValue());\n        } catch (InterruptedException e) {\n            p.destroyForcibly();                               // shutdownNow: the process goes down with the job\n            throw e;\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Persist it, and run the scheduler on three machines without losing or double-running a job.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The jobs go into a table behind a repository interface, <code>JobStore</code>, and every scheduler machine polls it for due rows. Taking a job is one conditional UPDATE: set the owner and a lease (a claim that expires) only where the last lease has already run out. One row changed means this machine won; zero means another did. That is the database's compare-and-set, doing what the lock did inside one process. Finishing is conditional too: DONE only if this machine still holds the lease. A machine that dies mid-job simply lets its lease expire, and another machine runs the job again, so a job runs at least once, never exactly once, and every job must be idempotent (safe to run twice). The demo sends 300 emails through three instances with one crash: 301 runs, and the effect table keyed by job id holds 300. After a restart, missed recurring runs go through the same Misfire rule: an hour down with a 10 s job means 360 runs back to back, one run now, or none.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence and many instances ----------------------------------------------------------------\n/**\n * The jobs table behind an interface (a repository), so memory and a database are interchangeable. The\n * claim is the database&#x27;s compare-and-set: one conditional UPDATE decides which instance gets a job, the way\n * the lock did inside one process. A lease (a claim that expires) means a dead instance&#x27;s job comes back.\n */\ninterface JobStore {\n    /** INSERT INTO jobs(id, due_at, state) VALUES (?, ?, &#x27;SCHEDULED&#x27;) */\n    void add(String id, long dueAt);\n    /** SELECT id FROM jobs WHERE state = &#x27;SCHEDULED&#x27; AND due_at &amp;lt;= :now AND lease_until &amp;lt; :now ORDER BY due_at LIMIT :n */\n    List&lt;String&gt; due(long now, int limit);\n    /** UPDATE jobs SET owner = ?, lease_until = :now + lease WHERE id = ? AND state = &#x27;SCHEDULED&#x27; AND lease_until &amp;lt; :now -- 1 row = won */\n    boolean claim(String id, String owner, long now, long leaseMs);\n    /** UPDATE jobs SET state = &#x27;DONE&#x27; WHERE id = ? AND owner = ? AND lease_until &amp;gt;= :now -- 0 rows = the lease was lost */\n    boolean complete(String id, String owner, long now);\n}\n\n/** One row of the table. */\nrecord JobRow(String id, long dueAt, String state, String owner, long leaseUntil) {}\n\n/** The table in memory: ConcurrentHashMap.compute makes each conditional update atomic, like a row lock. */\nfinal class InMemoryJobStore implements JobStore {\n    private final ConcurrentHashMap&lt;String, JobRow&gt; rows = new ConcurrentHashMap&lt;&gt;();\n\n    /** A new row, never leased. */\n    public void add(String id, long dueAt) { rows.put(id, new JobRow(id, dueAt, &quot;SCHEDULED&quot;, null, Long.MIN_VALUE)); }\n    /** The due, unleased rows, earliest first (a scan here; an index on (state, due_at) in a database). */\n    public List&lt;String&gt; due(long now, int limit) {\n        return rows.values().stream().filter(r -&gt; r.state().equals(&quot;SCHEDULED&quot;) &amp;&amp; r.dueAt() &lt;= now &amp;&amp; r.leaseUntil() &lt; now)\n                .sorted(Comparator.comparingLong(JobRow::dueAt)).limit(limit).map(JobRow::id).toList();\n    }\n    /** The conditional update: only one instance can move a row from free to leased. */\n    public boolean claim(String id, String owner, long now, long leaseMs) {\n        boolean[] won = {false};\n        rows.computeIfPresent(id, (k, r) -&gt; {\n            if (!r.state().equals(&quot;SCHEDULED&quot;) || r.leaseUntil() &gt;= now) return r;\n            won[0] = true;\n            return new JobRow(k, r.dueAt(), &quot;SCHEDULED&quot;, owner, now + leaseMs);\n        });\n        return won[0];\n    }\n    /** DONE only for the instance that still holds the lease. */\n    public boolean complete(String id, String owner, long now) {\n        boolean[] ok = {false};\n        rows.computeIfPresent(id, (k, r) -&gt; {\n            if (!owner.equals(r.owner()) || r.leaseUntil() &lt; now) return r;\n            ok[0] = true;\n            return new JobRow(k, r.dueAt(), &quot;DONE&quot;, owner, r.leaseUntil());\n        });\n        return ok[0];\n    }\n}\n\n/**\n * One scheduler instance of many (three machines, one jobs table). Each poll claims due rows and runs them.\n * An instance that dies mid-run just lets its lease expire, and another instance claims the job again:\n * at-least-once, never lost. So a job must be idempotent (running it twice has the effect of running it\n * once): key its side effect by the job&#x27;s id.\n */\nfinal class Instance {\n    private final String name;\n    private final JobStore store;\n    private final Map&lt;String, Task&gt; tasks;\n    private final long leaseMs;\n\n    Instance(String name, JobStore store, Map&lt;String, Task&gt; tasks, long leaseMs) {\n        this.name = name; this.store = store; this.tasks = tasks; this.leaseMs = leaseMs;\n    }\n    /** Claim and run whatever is due now. dieBeforeDone simulates a crash after the work, before DONE is written. */\n    int pollOnce(long now, boolean dieBeforeDone) {\n        int ran = 0;\n        for (String id : store.due(now, 50)) {\n            if (!store.claim(id, name, now, leaseMs)) continue;    // another instance won this one\n            try { tasks.get(id).run(); } catch (Exception e) { continue; }   // a failed run: the lease expires, it is retried\n            if (dieBeforeDone) return ran;                        // the email went out, DONE was never written\n            store.complete(id, name, now);\n            ran++;\n        }\n        return ran;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; Not every worker can run every job: some need a GPU or 100 GB of RAM. And at most two report jobs may run at once.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Workers stop being identical, so placement becomes a decision made under one lock, like dispatch. <code>Placement</code> keeps each machine's capabilities and its free CPU and RAM, and the waiting jobs in priority order. Each waiting job goes to the fitting machine that wastes least: fewest capabilities it does not need, then least CPU and RAM left over, so the GPU machine stays free for GPU work. A job that fits nowhere yet waits, and smaller jobs behind it may go first (backfilling); a job that fits no machine at all is refused at submit. When a job ends, its resources come back and placement runs again. The per-type limit is simpler: <code>Bulkheads</code> gives each type its own small Scheduler with that many workers, so ten report jobs run at most two at a time and can never take the payment jobs' workers.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: machines with capabilities --------------------------------------------------------------------\n/** A machine jobs run on: the capabilities it has (&quot;gpu&quot;, &quot;ssd&quot;) and its size. */\nrecord Machine(String name, Set&lt;String&gt; tags, int cpus, int ramGb) {}\n/** What one job needs from a machine. */\nrecord Needs(Set&lt;String&gt; tags, int cpus, int ramGb) {}\n/** A job waiting for a machine: highest priority first, then first come. */\nrecord PendingJob(String id, Needs needs, int priority, long seq) {}\n\n/**\n * Microsoft&#x27;s and Arcesium&#x27;s version: a job may run only on a machine with every capability it needs and\n * enough free CPU and RAM. Placement runs under one lock, like dispatch: waiting jobs in priority order, each\n * on the fitting machine that wastes least (fewest capabilities it does not need, then least CPU and RAM left\n * over), so the GPU machine stays free for GPU work. A job that fits nowhere yet waits, and smaller jobs\n * behind it may go first (backfilling). A job that fits no machine at all is refused at submit.\n */\nfinal class Placement {\n    private final List&lt;Machine&gt; machines;\n    private final Map&lt;String, int[]&gt; free = new HashMap&lt;&gt;();              // machine -&gt; {cpus, ram} free now\n    private final Map&lt;String, String&gt; placedOn = new HashMap&lt;&gt;();         // job -&gt; machine\n    private final Map&lt;String, Needs&gt; needsOf = new HashMap&lt;&gt;();\n    private final PriorityQueue&lt;PendingJob&gt; waiting = new PriorityQueue&lt;&gt;(\n            Comparator.comparingInt((PendingJob p) -&gt; -p.priority()).thenComparingLong(PendingJob::seq));\n    private final ReentrantLock lock = new ReentrantLock();\n    private long seq;\n\n    Placement(List&lt;Machine&gt; machines) {\n        this.machines = List.copyOf(machines);\n        for (Machine m : machines) free.put(m.name(), new int[] {m.cpus(), m.ramGb()});\n    }\n    /** Queue a job and place whatever fits now. Returns the new placements, job -&gt; machine. */\n    Map&lt;String, String&gt; submit(String id, Needs needs, int priority) {\n        lock.lock();\n        try {\n            if (machines.stream().noneMatch(m -&gt; fits(m, needs, m.cpus(), m.ramGb())))\n                throw new IllegalArgumentException(id + &quot; fits no machine: &quot; + needs);\n            needsOf.put(id, needs);\n            waiting.add(new PendingJob(id, needs, priority, seq++));\n            return placeLocked();\n        } finally { lock.unlock(); }\n    }\n    /** A job ended: give its CPU and RAM back, then place whatever now fits. */\n    Map&lt;String, String&gt; release(String id) {\n        lock.lock();\n        try {\n            String m = placedOn.remove(id);\n            if (m == null) return Map.of();\n            Needs n = needsOf.remove(id);\n            free.get(m)[0] += n.cpus();\n            free.get(m)[1] += n.ramGb();\n            return placeLocked();\n        } finally { lock.unlock(); }\n    }\n    /** Does this machine have the capabilities, and this much CPU and RAM free? */\n    private static boolean fits(Machine m, Needs n, int freeCpu, int freeRam) {\n        return m.tags().containsAll(n.tags()) &amp;&amp; freeCpu &gt;= n.cpus() &amp;&amp; freeRam &gt;= n.ramGb();\n    }\n    /** Every waiting job, best first, onto the fitting machine that wastes least; the rest keep waiting. */\n    private Map&lt;String, String&gt; placeLocked() {\n        Map&lt;String, String&gt; placed = new LinkedHashMap&lt;&gt;();\n        List&lt;PendingJob&gt; notYet = new ArrayList&lt;&gt;();\n        while (!waiting.isEmpty()) {\n            PendingJob p = waiting.poll();\n            Machine best = null;\n            for (Machine m : machines) {\n                int[] f = free.get(m.name());\n                if (!fits(m, p.needs(), f[0], f[1])) continue;\n                if (best == null || waste(m, p.needs()) &lt; waste(best, p.needs())) best = m;\n            }\n            if (best == null) { notYet.add(p); continue; }\n            free.get(best.name())[0] -= p.needs().cpus();\n            free.get(best.name())[1] -= p.needs().ramGb();\n            placedOn.put(p.id(), best.name());\n            placed.put(p.id(), best.name());\n        }\n        waiting.addAll(notYet);\n        return placed;\n    }\n    /** How much a placement wastes: unneeded capabilities count most, then CPU left over, then RAM left over. */\n    private long waste(Machine m, Needs n) {\n        int[] f = free.get(m.name());\n        long extraTags = m.tags().stream().filter(t -&gt; !n.tags().contains(t)).count();\n        return extraTags * 1_000_000_000L + (f[0] - n.cpus()) * 100_000L + (f[1] - n.ramGb());\n    }\n}\n\n/**\n * Per-type limits (&quot;at most 2 report jobs at once, whatever else runs&quot;): a bulkhead, one small Scheduler per\n * type with that many workers, so a flood of reports can never take the workers the payment jobs need.\n * Scheduler does not change at all. The price: prerequisites cannot cross types.\n */\nfinal class Bulkheads {\n    private final Map&lt;String, Scheduler&gt; byType = new HashMap&lt;&gt;();\n\n    Bulkheads(Map&lt;String, Integer&gt; limits, Clock clock) {\n        limits.forEach((type, n) -&gt; { Scheduler s = new Scheduler(n, clock); s.start(); byType.put(type, s); });\n    }\n    /** Submit a job to its type&#x27;s own scheduler. */\n    String schedule(String type, JobSpec spec) {\n        Scheduler s = byType.get(type);\n        if (s == null) throw new IllegalArgumentException(&quot;no bulkhead for type &quot; + type);\n        return s.schedule(spec);\n    }\n    /** Graceful shutdown of every type, then wait for all of them. */\n    void shutdownAndWait(long timeoutMs) throws InterruptedException {\n        for (Scheduler s : byType.values()) s.shutdown();\n        for (Scheduler s : byType.values()) s.awaitTermination(timeoutMs);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>12 &middot; Why not just use ScheduledThreadPoolExecutor? What does the JDK already give you?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>In production, use it. ScheduledThreadPoolExecutor is this same design: a heap of tasks under one lock, a Condition to wait for the head, and worker threads (its workers take turns being the one that waits for the head, instead of a separate dispatcher). DelayQueue gives the heap and the wait on their own: its <code>take()</code> blocks until the head is due and wakes early for an earlier item, which is enough for the 25-line <code>DelayQueueScheduler</code> below. Interviewers ask you to build it anyway because the wait-and-signal protocol is the question, and because the parts around it are not in the JDK: prerequisites, retries with backoff, priority among due jobs, misfire rules. Know its traps too. A fixed-rate task that throws is cancelled silently, with the exception visible only through its future (the demo: two runs, then nothing), and java.util.Timer runs every task on one thread, which dies at the first exception. This scheduler records the failure and keeps the schedule.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: what the JDK already gives you ----------------------------------------------------------------\n/**\n * The same core on the JDK&#x27;s own parts, about 25 lines: DelayQueue is a heap whose take() blocks until the\n * head&#x27;s time has come (it does the wait-and-signal inside, and wakes early for an earlier item), and N\n * workers take from it. What it leaves you to write is the interview: cancel, retries, prerequisites, what\n * happens to missed runs, shutdown policies, and a job that throws.\n */\nfinal class DelayQueueScheduler {\n    /** One queued job: its task and when it may run; Delayed tells DelayQueue how long is left. */\n    private record Item(Runnable task, long dueNanos) implements Delayed {\n        /** How long until due. */\n        public long getDelay(TimeUnit unit) { return unit.convert(dueNanos - System.nanoTime(), TimeUnit.NANOSECONDS); }\n        /** Earlier due first. */\n        public int compareTo(Delayed o) { return Long.compare(dueNanos, ((Item) o).dueNanos); }\n    }\n    private final DelayQueue&lt;Item&gt; queue = new DelayQueue&lt;&gt;();\n    private final List&lt;Thread&gt; workers = new ArrayList&lt;&gt;();\n\n    DelayQueueScheduler(int n) {\n        for (int i = 0; i &lt; n; i++) {\n            Thread t = new Thread(() -&gt; {\n                try {\n                    while (true) {\n                        Item it = queue.take();                   // blocks until the head is due\n                        try { it.task().run(); } catch (RuntimeException e) { /* keep the worker alive */ }\n                    }\n                } catch (InterruptedException e) { /* shutdown */ }\n            });\n            workers.add(t);\n            t.start();\n        }\n    }\n    /** Run task once, delayMs from now. */\n    void schedule(Runnable task, long delayMs) { queue.add(new Item(task, System.nanoTime() + TimeUnit.MILLISECONDS.toNanos(delayMs))); }\n    /** Stop the workers; jobs still queued are dropped. */\n    void shutdownNow() { workers.forEach(Thread::interrupt); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>13 &middot; Shut it down: let queued work finish, or stop now. What happens to a job that is sleeping, or hangs for ever?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p><code>shutdown()</code> refuses new jobs and cancels the recurring ones, which would otherwise never end; one-shot jobs already accepted still run at their time, with their retries and prerequisites. When nothing is left, the dispatcher leaves its loop and puts one stop sign per worker on the hand-off queue. <code>shutdownNow()</code> cancels every job that has not started

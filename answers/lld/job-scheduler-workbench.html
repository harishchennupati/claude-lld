e, and the job runs</text></svg></div><div class=\"move\"><p>A job is BLOCKED while it waits for prerequisites, SCHEDULED while it waits for its time or a free worker, RUNNING once the dispatcher has handed it to a worker, and then DONE, FAILED, CANCELLED or SKIPPED, which it never leaves. A RUNNING job can also go back to SCHEDULED: a retry, or a recurring job's next run. The ALLOWED table in JobState is the whole state machine, and every change goes through one method, <code>move()</code>, which throws on anything else and keeps the counts right. Writing the states down forces the question the interviewer will ask: what if a ten-second job runs every five seconds? The answer is an order. After the run, <code>finishLocked</code> decides, under the lock: a retry at end + backoff (the same planned slot, one more attempt), or the next planned run, or the end. The job goes back into a heap only after its run has ended, so two runs of one job can never overlap, however short the period. Fixed rate counts the next run from the planned start and fixed delay from the end of the run. A planned time that has already passed is a misfire (a run that could not start on time), and the job's Misfire decides: run every missed one, run one for all of them now, or skip to the next. Only then are the waiting jobs settled, the dispatcher signalled and, after the unlock, the listeners told.</p></div><div class=\"move\"><h4 style=\"margin:12px 0 4px;font-size:14px;color:var(--acc2)\">Prerequisites, part 3 of 3: submitting is all or nothing</h4></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 182\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"250\" height=\"128\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the batch</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">x waits for z</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">y waits for x</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">z waits for y</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">w waits for nothing</text></g><path d=\"M280 84 H330\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(330 20)\"><rect width=\"520\" height=\"148\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">scheduleAll: every check BEFORE anything is created</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">1 duplicate ids?  2 every prerequisite known, none recurring?</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">3 a loop? Kahn: keep removing jobs that wait for nothing</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">  in the batch. Left over: x, y, z. Each still waits for one</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">  of the others, so walking 'waits for' must repeat:</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">  x -> z -> y -> x</text></g><path d=\"M850 84 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><rect x=\"900\" y=\"20\" width=\"300\" height=\"148\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"1050\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">refused, with the path:</text><text x=\"1050\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">cycle, each waits for the next:</text><text x=\"1050\" y=\"94\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">x -> z -> y -> x</text><text x=\"1050\" y=\"118\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">and w is not kept either:</text><text x=\"1050\" y=\"142\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">all or nothing</text></svg></div><div class=\"move\"><p>Submitting has an order too. <code>scheduleAll</code> checks everything before it creates anything: no duplicate ids, every prerequisite known, none of them recurring (a job cannot wait for something that never finishes), and no loop. A batch where x waits for z, z for y and y for x is refused with the message \"cycle, each waits for the next: x -> z -> y -> x\", and w, which was fine, is not kept either: a batch is all or nothing, so a caller who fixes the loop and submits again never meets half a batch. Only after every check passes are the jobs created BLOCKED, linked to what they wait for, and those that wait for nothing moved to SCHEDULED. A job whose prerequisite has already failed is SKIPPED on the spot rather than accepted and left waiting for ever. Cancel follows the same rule as failure: cancelling backup skips upload, which waited for it (Media.net's \"cancel a task and its dependents\").</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes schedule, dispatch and finish happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 314\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"540\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about half a microsecond a visit</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">schedule: a map put and one heap insert, ~0.5 us</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">dispatch: heap polls, a state write, a queue put</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">finish: a few field writes, maybe one heap insert</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">measured: ~1.5 us for all three, 250,000 jobs in heaps</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">and the rules it calls: trigger, retry, priority (pure)</text></g><path d=\"M570 95 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"605\" y=\"85\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: milliseconds to minutes</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the job's own code</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the listeners: history, metrics, a pager</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the dispatcher's sleep: await() has let go of the lock</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">a caller building its JobSpec</text></g><text x=\"615\" y=\"200\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">eight callers call schedule() at the same instant</text><g transform=\"translate(30 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">caller 1</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(178 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">caller 2</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0.5 us</text></g><g transform=\"translate(326 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">caller 3</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 1.0 us</text></g><g transform=\"translate(474 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">caller 4</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 1.5 us</text></g><g transform=\"translate(622 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">caller 5</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 2.0 us</text></g><g transform=\"translate(770 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">caller 6</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 2.5 us</text></g><g transform=\"translate(918 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">caller 7</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 3.0 us</text></g><g transform=\"translate(1066 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">caller 8</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 3.5 us</text></g><text x=\"615\" y=\"282\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the eighth waits about 3.5 microseconds and goes back to its own work; the job itself runs later, for milliseconds, on a worker</text><text x=\"615\" y=\"300\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one at a time is true, and nobody can tell, as long as no job's code ever runs inside the lock</text></svg></div><div class=\"move\"><p>The question you will be asked: if every schedule, dispatch and finish takes the same lock, is the scheduler one-at-a-time? It is, for about half a microsecond a visit. Inside the lock there is a map put, a heap insert or two heap polls, and a few field writes; measured here, all three visits for one job come to about one and a half microseconds, with 250,000 jobs in the heaps. Everything slow is outside: the job's own code, the listeners, and the dispatcher's sleep, because <code>await()</code> lets go of the lock while it waits, so a sleeping dispatcher never blocks a caller. When eight callers schedule at the same instant, the eighth waits about three and a half microseconds, then goes back to its own work, while the job runs later, for milliseconds, on a worker. One at a time is true, and nobody can tell, as long as no job's code ever runs inside the lock. The rules do run inside it (the trigger, the retry policy, the priority comparator), which is why they must be pure and fast.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">~1.5 us of lock per job: schedule + dispatch + finish</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a busy service: 50,000 jobs waiting, 2,000 runs a second</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">2,000 x 1.5 us = 3 ms of lock a second: 0.3% busy</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">8 workers, 4 ms jobs: 2,000 a second fills the WORKERS</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">the lock fills near 650,000 jobs/s; workers run out first</text><text x=\"900\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 K shards: K locks, K heaps, K dispatchers</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">job to shard hash(id) mod K; priority per shard only</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 a timing wheel instead of a heap</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">O(1) add and cancel for millions of timers (Kafka, Netty)</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 many machines, one jobs table</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">claim by a conditional UPDATE with a lease; idempotent jobs</text></g></svg></div><div class=\"move\"><p>Say the numbers first. About one and a half microseconds of lock per job, all three visits together. A busy service with 50,000 jobs waiting and 2,000 runs a second holds the lock three milliseconds in every second: 0.3% busy. The workers run out long before the lock does: at 4 ms a job, eight workers are full at 2,000 jobs a second, while the lock would only fill near 650,000. So the first answer to \"too slow\" is more workers, or a separate pool per kind of job, not a cleverer lock. Until then jobs pile up in the heaps, so the door needs back-pressure too: <code>limitPending(max)</code> refuses new jobs while max are unfinished. Then the ladder, in the order you would climb it. Rung one: K schedulers, each with its own lock, heaps and dispatcher, a job going to the shard (the slice of jobs one of them owns) hash(id) mod K; priority then holds only within a shard, and a batch with prerequisites must go to one shard. Rung two: a timing wheel instead of a heap (an array of buckets, one per tick of time, like the face of a clock), which makes adding and cancelling O(1) for millions of timers; Kafka and Netty use one. Rung three: many machines, one jobs table, each job claimed with a conditional UPDATE and a lease (a claim that expires on its own). For comparison, the JDK's own ScheduledThreadPoolExecutor is one lock around one heap.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 378\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 16)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an earlier job arrives mid-sleep</text></g><path d=\"M360 34 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 16)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">decide and wait in one locked step, signal a new head; test 2: a 50 ms job runs at ~55 ms, not 5 s</text></g><g transform=\"translate(30 58)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cancel and dispatch reach one job</text></g><path d=\"M360 76 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 58)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">both decide under the lock; test 4: 2,000 races, each job ran once or was cancelled</text></g><g transform=\"translate(30 100)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a run is longer than its period</text></g><path d=\"M360 118 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 100)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">back in the heap only after it ends; test 7: never two at once; the three misfire timings</text></g><g transform=\"translate(30 142)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a job throws, even an Error</text></g><path d=\"M360 160 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 142)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the worker catches Throwable; a broken rule fails only its own job; test 9: the worker runs on</text></g><g transform=\"translate(30 184)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two prerequisites end together</text></g><path d=\"M360 202 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 184)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">count down and test for 0 under the lock; test 11: 30 rounds, deploy runs once</text></g><g transform=\"translate(30 226)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a prerequisite fails</text></g><path d=\"M360 244 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 226)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">skip everything behind it, the rest still runs; test 12</text></g><g transform=\"translate(30 268)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a batch with a loop</text></g><path d=\"M360 286 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 268)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check it before anything is created; test 13: refused with its path, nothing kept</text></g><g transform=\"translate(30 310)\"><rect width=\"330\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">shut down with work inside</text></g><path d=\"M360 328 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 310)\"><rect width=\"790\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"395.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">shutdown() drains one-shots and stops recurring; shutdownNow() interrupts; tests 14, 15</text></g><text x=\"615\" y=\"364\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim on this page has a failure test: FailureTests.java runs sixteen of them and must print ALL PASS</text></svg></div><div class=\"move\"><p>Each row is a few lines in FailureTests.java, which runs sixteen such tests and prints ALL PASS or exits non-zero. The two worth writing in front of the interviewer are the first two. The lost wakeup: put the dispatcher to sleep towards a job five seconds away, add one for fifty milliseconds, and measure; remove the signal and the test waits the full five seconds and fails. And cancel against dispatch: 2,000 jobs, a thread cancelling them in random order while the dispatcher starts them, and afterwards every job either ran once or was cancelled, never both and never neither. The two candidates forget are the last two: a batch with a loop, and a shutdown with work still inside. Timing rows use a ManualClock and never sleep; race rows use real threads and a latch (a gate that opens for all of them at once) or a barrier.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 350\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"210\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"900\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"210\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Trigger.next(plannedAt, finishedAt); RetryPolicy.delayMs(...); the Comparator</text><text x=\"900\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a new rule is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"210\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">new SkipHolidays(Cron.parse(\"30 9 * * 1-5\", IST), IST, holidays)</text><text x=\"900\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">add to a rule instead of copying it</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"210\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"310\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">publish(events) after the unlock; RunHistory implements RunListener</text><text x=\"900\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">history and alerts never slow a job</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"210\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">JobState.ALLOWED + move(): the one place a state changes</text><text x=\"900\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">an illegal move throws</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Command</text><text x=\"210\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 1</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">a Task: work packed as an object, stored, run later, retried</text><text x=\"900\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">the scheduler never knows what a job does</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">Builder</text><text x=\"210\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">move 1</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">JobSpec.of(\"backup\", task).in(300_000).retry(r).after(\"snapshot\")</text><text x=\"900\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">six optional settings, one readable line</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">Producer-consumer</text><text x=\"210\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">move 5</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">the hand-off queue: the dispatcher puts, N workers take</text><text x=\"900\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">the workers never touch the heaps</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"210\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">every test builds its own Scheduler; nothing calls getInstance()</text><text x=\"900\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">no global state to reset</text><rect x=\"20\" y=\"290\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"210\" y=\"309.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Triggers.parse(\"cron 30 9 * * 1-5 Asia/Kolkata\") once schedules come as text</text><text x=\"900\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">today triggers arrive as objects</text><text x=\"615\" y=\"335\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>The table is the answer; each name has one sentence behind it because a move produced it. This system earns two that most LLD pages do not. Command, because a Task is exactly that: a piece of work packed into an object, so it can wait in a heap, run later on another thread, and run again after a failure. Builder, because a job really has six optional settings, and <code>JobSpec.of(\"backup\", task).in(300_000).retry(r)</code> reads better than a constructor with eight arguments. The last two rows are the absences, worth saying out loud: no Singleton, because every test builds its own scheduler, and no Factory until schedules arrive as text, which is the <code>Triggers.parse</code> in Extensions.java. A pattern without a move behind it is decoration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"560\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"560\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">ScheduledJob: one job's facts. Trigger: when next. Scheduler: the flow and the lock.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">Cron, SkipHolidays and Aging were added as classes; Scheduler was never opened</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">j.trigger.next(j.plannedAt, finishedAt);  never \"is this the cron one?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">Task, Clock, Trigger, RetryPolicy, RunListener: one method; a fake is a lambda</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"560\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">new Scheduler(4, new ManualClock(0));  spec.retry(new ExponentialBackoff(...))</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>SOLID is not a list to recite; it is the check that the moves did their job. The honest answer to \"which principles did you apply?\" is \"move 2 gave me S, move 3 gave me O, L, I and D\" rather than five definitions. The one worth showing rather than claiming is D: because the clock is handed in, a test can say \"it is now 09:30 on a Monday\" and a five-day cron schedule runs in a few milliseconds, and because the task is an interface, <code>() -&gt; { throw new IOException(); }</code> is a failing job in one line.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a cron line, holidays, aging, a time limit</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind Trigger, RetryPolicy or the comparator</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">history, metrics, a pager on FAILED</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more RunListener; the scheduler does not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">PAUSED, TIMED_OUT, WAITING_FOR_MACHINE</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new state and one row in ALLOWED</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across jobs</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">at most 2 reports at once; a GPU job</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">checked inside the same lock at dispatch, or a bulkhead</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a restart; three scheduler machines</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a jobs table behind a repository; the claim becomes</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE jobs SET owner=?, lease_until=? WHERE id=? AND lease_until &lt; now: 1 row = yours</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the heaps, the lock and the dispatcher's loop do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>Two of the five need more than the picture gives them. A new invariant across jobs has two answers. At most two report jobs at a time is a bulkhead (a separate small scheduler per kind of job, so one kind can never take another's workers), and needs no change at all. A job that needs a GPU is a placement decision made under one lock, like dispatch, and Extensions.java has both. And state that must outlive the process moves into a jobs table: every scheduler machine polls it, and taking a job becomes a conditional UPDATE with a lease (a claim that expires), the database's compare-and-set (change a row only if it still holds what you read, in one step). A machine that dies mid-job lets its lease expire and another machine runs the job again, so jobs run at least once, never exactly once, and must be idempotent (safe to run twice). For all five the heaps, the lock and the dispatcher's loop do not change; that is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 700\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M260 63.0L300 63.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"280.0\" y=\"58.0\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">calls</text><path d=\"M135.0 106L135.0 150\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker- celRequested</text><text x=\"8\" y=\"151\" font-size=\"11.5\" fill=\"var(--muted)\">after: List&lt;String&gt;</text><text x=\"8\" y=\"167\" font-size=\"11.5\" fill=\"var(--muted)\">dependents: List&lt;ScheduledJob&gt;</text><line x1=\"0\" y1=\"176\" x2=\"250\" y2=\"176\" stroke=\"var(--line)\"/><text x=\"8\" y=\"189\" font-size=\"11.5\" fill=\"var(--text)\">recurring(): boolean</text></g><g transform=\"translate(680 262)\"><rect width=\"250\" height=\"122\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">JobState</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">BLOCKED, SCHEDULED, RUNNING</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">DONE, FAILED, CANCELLED,</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--muted)\">SKIPPED</text><text x=\"8\" y=\"95\" font-size=\"11.5\" fill=\"var(--muted)\">ALLOWED: state -&gt; next states</text><line x1=\"0\" y1=\"104\" x2=\"250\" y2=\"104\" stroke=\"var(--line)\"/><text x=\"8\" y=\"117\" font-size=\"11.5\" fill=\"var(--text)\">isFinal()</text></g><g transform=\"translate(680 420)\"><rect width=\"250\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Misfire</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">RUN_ALL, RUN_ONCE, SKIP</text><line x1=\"0\" y1=\"56\" x2=\"250\" y2=\"56\" stroke=\"var(--line)\"/><text x=\"8\" y=\"69\" font-size=\"11.5\" fill=\"var(--text)\">place(t, next, ended, now)</text></g><g transform=\"translate(970 20)\"><rect width=\"240\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"120.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"120.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Trigger</text><line x1=\"0\" y1=\"34\" x2=\"240\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">NONE = -1, ONCE</text><line x1=\"0\" y1=\"56\" x2=\"240\" y2=\"56\" stroke=\"var(--line)\"/><text x=\"8\" y=\"69\" font-size=\"11.5\" fill=\"var(--text)\">next(plannedAt, finishedAt)</text></g><g transform=\"translate(970 125)\"><rect width=\"240\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FixedRate | FixedDelay</text><line x1=\"0\" y1=\"26\" x2=\"240\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">rate: plannedAt + period</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">delay: finishedAt + delay</text></g><g transform=\"translate(970 230)\"><rect width=\"240\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"120.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"120.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RetryPolicy</text><line x1=\"0\" y1=\"34\" x2=\"240\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">GIVE_UP = -1, NONE</text><line x1=\"0\" y1=\"56\" x2=\"240\" y2=\"56\" stroke=\"var(--line)\"/><text x=\"8\" y=\"69\" font-size=\"11.5\" fill=\"var(--text)\">delayMs(attempts, error)</text></g><g transform=\"translate(970 335)\"><rect width=\"240\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ExponentialBackoff</text><line x1=\"0\" y1=\"26\" x2=\"240\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">baseMs, capMs, maxAttempts</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">random: null = no jitter</text><line x1=\"0\" y1=\"64\" x2=\"240\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">delayMs: base x 2^(n-1), capped</text></g><g><path d=\"M20 675L64 675\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"679\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 675L284 675\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"679\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 675L504 675\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"679\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 675L684 675\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"679\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 675L904 675\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"679\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values; &laquo;record&raquo; = a bundle of fields that never changes). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the scheduler owns every ScheduledJob. Plain arrow = references: a caller builds a JobSpec and calls the scheduler; a job points at its state and its Misfire answer; the scheduler publishes a RunRecord for each attempt. Dashed green = handed in: the clock through the constructor, a job's Trigger and RetryPolicy on its JobSpec, and the priority rule (a JDK Comparator, so not drawn) through <code>configure()</code>. Dotted blue = notifies: the one call the scheduler makes after it has released the lock. <b>Where state lives:</b> a ScheduledJob holds one job's facts (its times, state and attempts, how many prerequisites it still waits for, and who waits for it); the Scheduler holds everything shared (the two heaps, the map, the counts, the hand-off queue and the lock), and it is the only class that changes a job's state. The dispatcher and the workers are not boxes: they are loops inside Scheduler (<code>dispatchLoop</code>, <code>workLoop</code>). The extensions on page 05 (Cron, SkipHolidays, Spread, Aging, TimeoutTask, Placement, JobStore, RunHistory) plug into these same interfaces and are not drawn.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does and what it guarantees. Read only those first for the shape, then the bodies; start with <code>dispatchLoop</code> and <code>finishLocked</code>, which are the whole interview. Each copy button copies that whole file. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (sixteen claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.time.Duration;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n// ================================================================ the job&#x27;s code, and where time comes from\n\n/** The code a job runs. A throw of any kind is one failed attempt; the job&#x27;s RetryPolicy decides what follows. */\n@FunctionalInterface\ninterface Task {\n    /** Do the work once. */\n    void run() throws Exception;\n}\n\n/**\n * Where time comes from, in milliseconds. The scheduler never reads a clock of its own, so a test can hand\n * in a ManualClock and make &quot;one hour later&quot; happen instantly.\n */\n@FunctionalInterface\ninterface Clock {\n    /** Now, in milliseconds. */\n    long nowMs();\n\n    /**\n     * The production clock: System.nanoTime, which never jumps (the wall clock does, when NTP or a person\n     * corrects it), anchored once to the wall clock so its values read as epoch milliseconds.\n     */\n    static Clock system() {\n        long anchor = System.currentTimeMillis() - System.nanoTime() / 1_000_000;\n        return () -&gt; anchor + System.nanoTime() / 1_000_000;\n    }\n}\n\n/** A clock that tests move by hand: nothing sleeps, and &quot;one hour later&quot; costs nothing. */\nfinal class ManualClock implements Clock {\n    private final AtomicLong now;\n\n    ManualClock(long startMs) { now = new AtomicLong(startMs); }\n    /** The time the test last set. */\n    public long nowMs() { return now.get(); }\n    /** Jump to a moment. */\n    void set(long ms) { now.set(ms); }\n    /** Move forward by ms. */\n    void advance(long ms) { now.addAndGet(ms); }\n}\n\n// ================================================================ the rules that change: when next, what if late, how to retry\n\n/**\n * When a job runs next. A pure function of two times: it runs inside the scheduler&#x27;s lock, so it must be fast\n * and must never call back into the scheduler. ONCE means the job does not recur.\n */\n@FunctionalInterface\ninterface Trigger {\n    /** Returned by next() when there is no next run. */\n    long NONE = -1;\n    /** A one-shot job: no next run. */\n    Trigger ONCE = (plannedAt, finishedAt) -&gt; NONE;\n\n    /** The next planned start, later than plannedAt, after a run planned for plannedAt that ended at finishedAt; or NONE. */\n    long next(long plannedAt, long finishedAt);\n}\n\n/**\n * Fixed rate: every periodMs, counted from the PLANNED start of the last run (10:00:00, 10:00:10, 10:00:20),\n * so the rhythm never drifts, however long a run takes.\n */\nrecord FixedRate(long periodMs) implements Trigger {\n    /** Refuses a period of zero or less. */\n    FixedRate { if (periodMs &lt;= 0) throw new IllegalArgumentException(&quot;period must be positive: &quot; + periodMs); }\n    /** The planned start plus one period. */\n    public long next(long plannedAt, long finishedAt) { return plannedAt + periodMs; }\n}\n\n/** Fixed delay: delayMs after the last run ENDED, so a slow run pushes every later run back. */\nrecord FixedDelay(long delayMs) implements Trigger {\n    /** Refuses a delay of zero or less. */\n    FixedDelay { if (delayMs &lt;= 0) throw new IllegalArgumentException(&quot;delay must be positive: &quot; + delayMs); }\n    /** The end of the last run plus the delay. */\n    public long next(long plannedAt, long finishedAt) { return finishedAt + delayMs; }\n}\n\n/**\n * What happens to planned runs of a recurring job that were missed: the job was still running at its next\n * planned time, every worker was busy, or the process was down. A closed list of three answers, so an enum.\n */\nenum Misfire {\n    /** Run every missed one, back to back, until caught up (what the JDK&#x27;s fixed rate does). */\n    RUN_ALL,\n    /** Run once, now, for all the missed ones; then continue from the next planned time in the future. */\n    RUN_ONCE,\n    /** Run none of the missed ones; wait for the next planned time in the future. */\n    SKIP;\n\n    /**\n     * The planned slot to run next, given the trigger&#x27;s next slot (maybe already in the past) and now; NONE\n     * means no more runs. The job starts at max(slot, now), so a slot in the past starts at once.\n     * Cost: one step per missed slot.\n     */\n    long place(Trigger t, long next, long finishedAt, long now) {\n        if (next == Trigger.NONE || next &gt;= now || this == RUN_ALL) return next;\n        long after = t.next(next, finishedAt);\n        while (after != Trigger.NONE &amp;&amp; after &gt; next &amp;&amp; after &lt; now) { next = after; after = t.next(after, finishedAt); }\n        if (this == RUN_ONCE) return next;                                   // the latest missed slot, once, now\n        return (after == Trigger.NONE || after &lt;= next) ? Trigger.NONE : after;  // SKIP: the first slot not yet past\n    }\n}\n\n/** How long to wait before the next attempt of a failed run, or GIVE_UP. Pure, like Trigger: it runs inside the lock. */\n@FunctionalInterface\ninterface RetryPolicy {\n    /** Returned by delayMs() to stop retrying. */\n    long GIVE_UP = -1;\n    /** Never retry: one attempt per run. */\n    RetryPolicy NONE = (attempts, error) -&gt; GIVE_UP;\n\n    /** The wait before attempt number attempts + 1, now that `attempts` attempts have failed; or GIVE_UP. */\n    long delayMs(int attempts, Exception error);\n}\n\n/**\n * Exponential backoff with jitter: wait base, then 2 x base, 4 x base ..., never more than cap, and at most\n * maxAttempts attempts in all. Jitter (a random part of each wait) spreads out jobs that failed together, so\n * a thousand of them do not all retry in the same millisecond: here half of each wait is fixed, half random.\n */\nfinal class ExponentialBackoff implements RetryPolicy {\n    private final long baseMs, capMs;\n    private final int maxAttempts;\n    private final Random random;                          // null = no jitter: exact waits, for tests\n\n    ExponentialBackoff(long baseMs, long capMs, int maxAttempts, Random random) {\n        if (baseMs &lt;= 0 || capMs &lt; baseMs || maxAttempts &lt; 1) throw new IllegalArgumentException(&quot;bad backoff&quot;);\n        this.baseMs = baseMs; this.capMs = capMs; this.maxAttempts = maxAttempts; this.random = random;\n    }\n    /** base, 2 x base, 4 x base ... up to the cap; half of it random when jitter is on; GIVE_UP after maxAttempts. */\n    public long delayMs(int attempts, Exception error) {\n        if (attempts &gt;= maxAttempts) return GIVE_UP;\n        long wait = baseMs;\n        for (int i = 1; i &lt; attempts &amp;&amp; wait &lt; capMs; i++) wait *= 2;       // doubling stops at the cap: no overflow\n        wait = Math.min(wait, capMs);\n        return random == null ? wait : wait / 2 + random.nextLong(wait / 2 + 1);\n    }\n}\n\n// ================================================================ a job&#x27;s life, and what a caller asks for\n\n/** The life of a job. The ALLOWED table is the whole state machine: any other move is a bug, and it throws. */\nenum JobState {\n    /** Waiting for its prerequisites to finish. */\n    BLOCKED,\n    /** Waiting for its time, or for a free worker. */\n    SCHEDULED,\n    /** Handed to a worker. */\n    RUNNING,\n    /** Finished: a one-shot that succeeded, or a recurring job whose trigger ran out. */\n    DONE,\n    /** Finished: the last attempt threw and the retry policy gave up. */\n    FAILED,\n    /** Finished: cancelled before it started, or stopped by a cancel or a shutdown while it ran. */\n    CANCELLED,\n    /** Finished without running: a prerequisite failed, was cancelled, or was itself skipped. */\n    SKIPPED;\n\n    /** The legal moves. BLOCKED and SCHEDULED can be cancelled; RUNNING goes back to SCHEDULED for a retry or the next run. */\n    static final Map&lt;JobState, Set&lt;JobState&gt;&gt; ALLOWED = new EnumMap&lt;&gt;(Map.of(\n            BLOCKED,   EnumSet.of(SCHEDULED, CANCELLED, SKIPPED),\n            SCHEDULED, EnumSet.of(RUNNING, CANCELLED),\n            RUNNING,   EnumSet.of(SCHEDULED, DONE, FAILED, CANCELLED),\n            DONE,      EnumSet.noneOf(JobState.class),\n            FAILED,    EnumSet.noneOf(JobState.class),\n            CANCELLED, EnumSet.noneOf(JobState.class),\n            SKIPPED,   EnumSet.noneOf(JobState.class)));\n\n    /** True for the four states a job never leaves. */\n    boolean isFinal() { return compareTo(DONE) &gt;= 0; }\n}\n\n/**\n * What a caller asks for, filled in with chained calls: JobSpec.of(&quot;backup&quot;, task).in(300_000).priority(5).\n * An id and a task are required and six settings are optional, which is why this is a builder and not a\n * constructor with eight arguments.\n */\nfinal class JobSpec {\n    final String id;\n    final Task task;\n    long delayMs;                                          // start this long after it is submitted...\n    long atMs = -1;                                        // ...or at this clock time, when set\n    Trigger trigger = Trigger.ONCE;\n    RetryPolicy retry = RetryPolicy.NONE;\n    Misfire misfire = Misfire.RUN_ONCE;\n    int priority;\n    final List&lt;String&gt; after = new ArrayList&lt;&gt;();\n\n    /** Use JobSpec.of(id, task). */\n    private JobSpec(String id, Task task) {\n        if (id == null || id.isBlank()) throw new IllegalArgumentException(&quot;a job needs an id&quot;);\n        this.id = id; this.task = Objects.requireNonNull(task, &quot;task&quot;);\n    }\n    /** A job with this id (unique in the scheduler) that runs this task once, now, unless told otherwise. */\n    static JobSpec of(String id, Task task) { return new JobSpec(id, task); }\n    /** Start delayMs after submission; a negative delay means now. */\n    JobSpec in(long delayMs) { this.delayMs = Math.max(0, delayMs); this.atMs = -1; return this; }\n    /** Start at this clock time, in epoch milliseconds (&quot;run this command at epoch T&quot;); a time already past means now. */\n    JobSpec at(long epochMs) { this.atMs = epochMs; return this; }\n    /** Recur by this trigger: FixedRate, FixedDelay, a daily time... */\n    JobSpec every(Trigger t) { this.trigger = Objects.requireNonNull(t); return this; }\n    /** Retry failed attempts by this policy. */\n    JobSpec retry(RetryPolicy r) { this.retry = Objects.requireNonNull(r); return this; }\n    /** What to do with the missed runs of a recurring job. */\n    JobSpec misfire(Misfire m) { this.misfire = Objects.requireNonNull(m); return this; }\n    /** Higher goes first when several jobs are due and the workers are all busy. */\n    JobSpec priority(int p) { this.priority = p; return this; }\n    /** Run only after these jobs have finished successfully: its prerequisites. */\n    JobSpec after(String... ids) { after.addAll(List.of(ids)); return this; }\n}\n\n/**\n * One job inside the scheduler: its settings, where it is in its life, and the links to the jobs that wait\n * for it. Every field that changes is read and written only under the scheduler&#x27;s lock.\n */\nfinal class ScheduledJob {\n    final String id;\n    final Task task;\n    final Trigger trigger;\n    final RetryPolicy retry;\n    final Misfire misfire;\n    final int priority;\n    final long seq;                                        // submission order: the last tie-break, first come first served\n    final List&lt;String&gt; after;                              // the ids this job waits for (its prerequisites)\n    final List&lt;ScheduledJob&gt; dependents = new ArrayList&lt;&gt;();  // the jobs that wait for this one\n    JobState state;\n    long plannedAt;                                        // the planned slot this run belongs to; a retry keeps it\n    long dueAt;                                            // when it may start: the time heap&#x27;s key\n    int attempts;                                          // attempts made for the current planned run\n    int waitingFor;                                        // prerequisites not yet DONE; 0 = free to be scheduled\n    boolean cancelRequested;                               // cancel() arrived while it ran: no retry and no next run\n    String lastError;\n\n    /** Copies the settings out of the spec, so a caller who changes the spec later changes nothing here. */\n    ScheduledJob(JobSpec s, long seq, long plannedAt) {\n        id = s.id; task = s.task; trigger = s.trigger; retry = s.retry; misfire = s.misfire;\n        priority = s.priority; this.seq = seq; after = List.copyOf(new LinkedHashSet&lt;&gt;(s.after));\n        this.plannedAt = plannedAt; this.dueAt = plannedAt;\n    }\n    /** True when the job repeats. */\n    boolean recurring() { return trigger != Trigger.ONCE; }\n}\n\n/** What one attempt did, or why a job ended without running: one line of history. error is null on success. */\nrecord RunRecord(String jobId, int attempt, long startedAt, long finishedAt, String error, JobState then) {}\n\n/**\n * Hears about every finished attempt and every job that ends without running, AFTER the scheduler&#x27;s lock is\n * released, so a slow or broken listener delays no job: history, metrics, a pager on FAILED.\n */\n@FunctionalInterface\ninterface RunListener {\n    /** Called from worker threads and callers: an implementation must be thread-safe. */\n    void onRun(RunRecord r);\n}\n\n// ================================================================ the aggregate root\n\n/**\n * The scheduler. It owns every job, two heaps (one ordered by time, one by who goes first), the counts, one\n * lock and one condition. One dispatcher thread sleeps until the earliest job is due and hands it to one of\n * N worker threads. Jobs never run on the dispatcher and never inside the lock.\n */\nfinal class Scheduler {\n    /** Order of the time heap: earliest due first, then submission order. */\n    static final Comparator&lt;ScheduledJob&gt; BY_DUE =\n            Comparator.comparingLong((ScheduledJob j) -&gt; j.dueAt).thenComparingLong(j -&gt; j.seq);\n    /** The default &quot;which due job first&quot;: higher priority, then earlier due, then submission order. */\n    static final Comparator&lt;ScheduledJob&gt; HIGHEST_PRIORITY_FIRST =\n            ((Comparator&lt;ScheduledJob&gt;) (a, b) -&gt; Integer.compare(b.priority, a.priority))\n                    .thenComparingLong(j -&gt; j.dueAt).thenComparingLong(j -&gt; j.seq);\n    /** The stop sign a worker takes off the hand-off queue when the scheduler ends. */\n    private static final ScheduledJob POISON = new ScheduledJob(JobSpec.of(&quot;poison&quot;, () -&gt; {}), -1, 0);\n\n    private final ReentrantLock lock = new ReentrantLock();\n    private final Condition wake = lock.newCondition();    // the dispatcher sleeps here; signalled when its plan may be stale\n    private final PriorityQueue&lt;ScheduledJob&gt; byTime = new PriorityQueue&lt;&gt;(BY_DUE);      // not due yet\n    private PriorityQueue&lt;ScheduledJob&gt; ready = new PriorityQueue&lt;&gt;(HIGHEST_PRIORITY_FIRST); // due, waiting for a worker\n    private final Map&lt;String, ScheduledJob&gt; jobs = new HashMap&lt;&gt;();\n    private final Map&lt;JobState, Integer&gt; counts = new EnumMap&lt;&gt;(JobState.class);\n    private final BlockingQueue&lt;ScheduledJob&gt; handoff = new LinkedBlockingQueue&lt;&gt;();     // dispatcher -&gt; workers\n    private final List&lt;Thread&gt; workerThreads = new ArrayList&lt;&gt;();\n    private final List&lt;RunListener&gt; listeners = new CopyOnWriteArrayList&lt;&gt;();\n    private final AtomicLong autoIds = new AtomicLong();\n    private final int workers;\n    private final Clock clock;\n    private Thread dispatcher;\n    private int running;                                   // handed to a worker and not finished; never above workers\n    private int live;                                      // jobs not in a final state\n    private long seq;\n    private int maxPending = Integer.MAX_VALUE;           // back-pressure: the most unfinished jobs accepted at once\n    private boolean accepting = true, stopNow;\n\n    /** A scheduler with this many worker threads, reading time from this clock. start() launches the threads. */\n    Scheduler(int workers, Clock clock) {\n        if (workers &lt; 1) throw new IllegalArgumentException(&quot;need at least one worker&quot;);\n        this.workers = workers;\n        this.clock = Objects.requireNonNull(clock);\n        for (JobState s : JobState.values()) counts.put(s, 0);\n    }\n\n    /** Hand in the rule for which due job goes first when the workers are all busy (Strategy). Safe at any time. */\n    void configure(Comparator&lt;ScheduledJob&gt; whichFirst) {\n        lock.lock();\n        try {\n            PriorityQueue&lt;ScheduledJob&gt; q = new PriorityQueue&lt;&gt;(Objects.requireNonNull(whichFirst));\n            q.addAll(ready);\n            ready = q;\n        } finally { lock.unlock(); }\n    }\n    /** Subscribe a listener: history, metrics, alerts. */\n    void addListener(RunListener l) { listeners.add(Objects.requireNonNull(l)); }\n    /**\n     * Back-pressure at the door: refuse new jobs while `max` are unfinished (blocked, waiting or running), so a\n     * flood of submissions becomes an error the caller sees, not a heap that grows until memory runs out.\n     */\n    void limitPending(int max) {\n        if (max &lt; 1) throw new IllegalArgumentException(&quot;limit must be positive&quot;);\n        lock.lock();\n        try { maxPending = max; } finally { lock.unlock(); }\n    }\n\n    /** Launch the dispatcher and the N workers. Without start(), a test drives pollDue and runJob by hand. */\n    void start() {\n        lock.lock();\n        try {\n            if (dispatcher != null) throw new IllegalStateException(&quot;already started&quot;);\n            dispatcher = new Thread(this::dispatchLoop, &quot;dispatcher&quot;);\n            for (int i = 0; i &lt; workers; i++) workerThreads.add(new Thread(this::workLoop, &quot;worker-&quot; + i));\n        } finally { lock.unlock(); }\n        dispatcher.start();\n        for (Thread t : workerThreads) t.start();\n    }\n\n    // ---------------------------------------------------------------- submitting jobs\n\n    /** Run task once, delayMs from now. Returns the job&#x27;s id. */\n    String schedule(Task task, long delayMs) {\n        return schedule(JobSpec.of(nextId(), task).in(delayMs));\n    }\n    /** Run task every periodMs, counted from each planned start; the first run after initialDelayMs. */\n    String scheduleAtFixedRate(Task task, long initialDelayMs, long periodMs) {\n        return schedule(JobSpec.of(nextId(), task).in(initialDelayMs).every(new FixedRate(periodMs)));\n    }\n    /** Run task delayMs after each run ends; the first run after initialDelayMs. */\n    String scheduleWithFixedDelay(Task task, long initialDelayMs, long delayMs) {\n        return schedule(JobSpec.of(nextId(), task).in(initialDelayMs).every(new FixedDelay(delayMs)));\n    }\n    /** Submit one job with every setting. Refused, with nothing changed, if scheduleAll would refuse it. */\n    String schedule(JobSpec spec) { return scheduleAll(List.of(spec)).get(0); }\n\n    /**\n     * Submit a batch whose jobs may wait for each other and for jobs already here. All or nothing: every check\n     * (duplicate id, unknown or recurring prerequisite, a cycle) runs BEFORE anything is created, so a refused\n     * batch leaves no trace.\n     */\n    List&lt;String&gt; scheduleAll(List&lt;JobSpec&gt; specs) {\n        List&lt;RunRecord&gt; events = new ArrayList&lt;&gt;();\n        List&lt;String&gt; ids = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            if (!accepting) throw new RejectedExecutionException(&quot;the scheduler is shut down&quot;);\n            if (specs.size() &gt; maxPending - live)\n                throw new RejectedExecutionException(&quot;full: &quot; + live + &quot; unfinished jobs, the limit is &quot; + maxPending);\n            Map&lt;String, JobSpec&gt; batch = new LinkedHashMap&lt;&gt;();\n            for (JobSpec s : specs)\n                if (jobs.containsKey(s.id) || batch.put(s.id, s) != null)\n                    throw new IllegalArgumentException(&quot;duplicate job id &quot; + s.id);\n            for (JobSpec s : specs)\n                for (String p : s.after) {\n                    JobSpec inBatch = batch.get(p);\n                    ScheduledJob old = jobs.get(p);\n                    if (inBatch == null &amp;&amp; old == null) throw new IllegalArgumentException(s.id + &quot; waits for unknown job &quot; + p);\n                    if ((inBatch != null ? inBatch.trigger : old.trigger) != Trigger.ONCE)\n                        throw new IllegalArgumentException(s.id + &quot; cannot wait for a recurring job: &quot; + p);\n                }\n            List&lt;String&gt; cycle = findCycle(batch);\n            if (cycle != null)\n                throw new IllegalArgumentException(&quot;cycle, each waits for the next: &quot; + String.join(&quot; -&gt; &quot;, cycle));\n\n            // every check passed: only now does anything change\n            long now = clock.nowMs();\n            List&lt;ScheduledJob&gt; made = new ArrayList&lt;&gt;();\n            for (JobSpec s : batch.values()) {\n                long planned = s.atMs &gt;= 0 ? s.atMs\n                             : s.delayMs &gt; Long.MAX_VALUE - now ? Long.MAX_VALUE : now + s.delayMs;   // no overflow into the past\n                ScheduledJob j = new ScheduledJob(s, seq++, planned);\n                j.dueAt = Math.max(j.plannedAt, now);\n                j.state = JobState.BLOCKED;\n                counts.merge(JobState.BLOCKED, 1, Integer::sum);\n                live++;\n                jobs.put(j.id, j);\n                made.add(j);\n                ids.add(j.id);\n            }\n            Map&lt;ScheduledJob, String&gt; doomed = new HashMap&lt;&gt;();\n            for (ScheduledJob j : made)\n                for (String p : j.after) {\n                    ScheduledJob pre = jobs.get(p);\n                    if (pre.state == JobState.DONE) continue;                // already finished: nothing to wait for\n                    if (pre.state.isFinal()) { doomed.put(j, p); continue; } // failed, cancelled or skipped: j never runs\n                    pre.dependents.add(j);\n                    j.waitingFor++;\n                }\n            for (ScheduledJob j : made) {\n                if (j.state != JobState.BLOCKED) continue;                   // skipped already, through an earlier one\n                if (doomed.containsKey(j)) {\n                    events.add(new RunRecord(j.id, 0, -1, now, &quot;prerequisite &quot; + doomed.get(j) + &quot; did not succeed&quot;, JobState.SKIPPED));\n                    endLocked(j, JobState.SKIPPED, events);\n                } else if (j.waitingFor == 0) enqueueLocked(j);\n            }\n        } finally { lock.unlock(); }\n        publish(events);\n        return ids;\n    }\n\n    /** A fresh id for the short forms of schedule. */\n    private String nextId() { return &quot;job-&quot; + autoIds.incrementAndGet(); }\n\n    /**\n     * Kahn&#x27;s algorithm over the batch: keep removing jobs that wait for nothing still in the batch. Whatever\n     * cannot be removed sits on or behind a cycle; walk &quot;waits for&quot; links from one of them until a job repeats.\n     * Jobs already in the scheduler cannot close a cycle: they never wait for new ones. O(jobs + links).\n     */\n    private static List&lt;String&gt; findCycle(Map&lt;String, JobSpec&gt; batch) {\n        Map&lt;String, Integer&gt; waits = new HashMap&lt;&gt;();              // prerequisites inside the batch not yet removed\n        Map&lt;String, List&lt;String&gt;&gt; waiters = new HashMap&lt;&gt;();       // p -&gt; the batch jobs waiting for p\n        for (JobSpec s : batch.values()) {\n            int n = 0;\n            for (String p : new LinkedHashSet&lt;&gt;(s.after))\n                if (batch.containsKey(p)) { n++; waiters.computeIfAbsent(p, k -&gt; new ArrayList&lt;&gt;()).add(s.id); }\n            waits.put(s.id, n);\n        }\n        Deque&lt;String&gt; free = new ArrayDeque&lt;&gt;();\n        for (String id : batch.keySet()) if (waits.get(id) == 0) free.add(id);\n        int removed = 0;\n        while (!free.isEmpty()) {\n            String id = free.poll();\n            removed++;\n            for (String w : waiters.getOrDefault(id, List.of()))\n                if (waits.merge(w, -1, Integer::sum) == 0) free.add(w);\n        }\n        if (removed == batch.size()) return null;\n        String at = null;                                          // every job left waits for another job left\n        for (String id : batch.keySet()) if (waits.get(id) &gt; 0) { at = id; break; }\n        List&lt;String&gt; walk = new ArrayList&lt;&gt;();\n        Map&lt;String, Integer&gt; seenAt = new HashMap&lt;&gt;();\n        while (!seenAt.containsKey(at)) {\n            seenAt.put(at, walk.size());\n            walk.add(at);\n            for (String p : batch.get(at).after)\n                if (batch.containsKey(p) &amp;&amp; waits.get(p) &gt; 0) { at = p; break; }\n        }\n        List&lt;String&gt; cycle = new ArrayList&lt;&gt;(walk.subList(seenAt.get(at), walk.size()));\n        cycle.add(at);\n        return cycle;\n    }\n\n    // ---------------------------------------------------------------- cancel, and questions\n\n    /**\n     * Cancel a job. True if it had not started, so it never will, and the jobs waiting for it are skipped.\n     * False if it is running (this r

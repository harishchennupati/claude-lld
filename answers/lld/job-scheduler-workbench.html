<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Build a job scheduler. A caller submits a job to run after a delay, at a given time, or again and again (every ten seconds, or ten seconds after the last run ended), and a job may have to wait for other jobs to finish first. A fixed pool of worker threads runs the jobs, and I need cancel and shutdown. I want working, thread-safe code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>A job is a piece of code with a time attached: send the nightly report at 02:00, retry this payment in five seconds, ping this server every ten seconds. Callers on many threads hand jobs to the scheduler and go back to their own work. The scheduler must start each job when its time comes, on one of a fixed number of worker threads, and never on the thread that watches the clock (the dispatcher). Some jobs wait for others: deploy runs only after both builds have succeeded, and if a build fails, deploy must not run at all. Jobs fail and are retried later, jobs get cancelled, and the whole thing gets shut down. The one thing that must always be true (the invariant): no accepted job is lost, and none starts before its time or its prerequisites, runs twice at the same moment, or starts after a cancel that succeeded; and no more than N jobs run at once.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that schedules a few jobs and shows them starting at the right times. The interviewer is watching for, in this order: the questions you ask before typing; which class owns the queue of jobs (a heap: a tree that always keeps the earliest job on top) and the lock; the dispatcher's wait loop, and what wakes it when an earlier job arrives (this is where most candidates lose marks); what happens when cancel and the dispatcher reach the same job at the same instant; where the rules that will change live (when a job runs next, how it is retried, which due job goes first), so a new rule is a new class; and what happens when a job throws. Then the twists: prerequisites and loops, cron lines with time zones, jobs that need a machine with a GPU, and several scheduler machines sharing one jobs table. The JDK already has <code>ScheduledThreadPoolExecutor</code>; the interviewer asks you to build it anyway, because the wait-and-signal protocol inside it is the question.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 456\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"80\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">schedule</text><g transform=\"translate(150 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">schedule(spec), any thread</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a delay, a time, or a rhythm</text></g><path d=\"M400 57 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check first, then store</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">duplicate id, unknown prereq, a loop</text></g><path d=\"M670 57 H690\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(690 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BLOCKED, or into the time heap</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the earliest due job on top</text></g><path d=\"M940 57 H960\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(960 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">new earliest? signal</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the dispatcher re-plans its sleep</text></g><text x=\"80\" y=\"186\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">dispatch</text><g transform=\"translate(150 155)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the dispatcher sleeps</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">until the earliest job is due</text></g><path d=\"M400 182 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 155)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">due, and a worker free?</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">take the best: priority, then time</text></g><path d=\"M670 182 H690\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(690 155)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">mark RUNNING, under the lock</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">from this line on, cancel() loses</text></g><path d=\"M940 182 H960\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(960 155)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a worker runs it</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">outside the lock</text></g><text x=\"80\" y=\"311\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">finish</text><g transform=\"translate(150 280)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the run ends: ok, or it threw</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">even an Error is one failed try</text></g><path d=\"M400 307 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 280)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry, next run, or the end</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">backoff; fixed rate or fixed delay</text></g><path d=\"M670 307 H690\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(690 280)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">settle the jobs waiting on it</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">DONE counts down; failure skips</text></g><path d=\"M940 307 H960\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(960 280)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">signal, then tell listeners</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">history, metrics: after the unlock</text></g><path d=\"M545 84 V96\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 96)\"><rect width=\"290\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a loop or a bad prerequisite: refused</text></g><path d=\"M545 209 V221\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 221)\"><rect width=\"290\" height=\"36\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"18.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cancelled while waiting: skipped</text></g><text x=\"80\" y=\"372\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">query</text><text x=\"150\" y=\"372\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, in O(1): status(id), how many jobs in each state; cancel(id) before the start means it never starts</text><text x=\"80\" y=\"402\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">stop</text><text x=\"150\" y=\"402\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">shutdown() lets accepted one-shot jobs finish; shutdownNow() cancels what has not started and interrupts what runs</text><text x=\"615\" y=\"440\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">many threads schedule and cancel while N workers run jobs: no job is lost or started early, none runs twice at once, none starts after a cancel that said yes</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>How many worker threads, and may jobs run at the same time?</td><td>A fixed pool of N; yes</td><td>One dispatcher, N workers, one lock (moves 1, 4, 7)</td></tr><tr><td>One-shot jobs only, or recurring? Fixed rate or fixed delay?</td><td>Both kinds and both rhythms</td><td>The Trigger rule (move 3)</td></tr><tr><td>What if a run takes longer than its period?</td><td>Never two runs at once; missed runs merge into one late run</td><td>Back in the heap only after the run ends; the Misfire rule (move 6)</td></tr><tr><td>What if a job throws? Retry?</td><td>Exponential backoff (each wait twice the last), at most 3 attempts, then FAILED</td><td>The RetryPolicy rule and the order after a run (moves 3, 6)</td></tr><tr><td>Can a job wait for other jobs? What if one fails, or they form a loop?</td><td>Yes; skip whatever depends on a failure; refuse a loop at submit</td><td>A count and a list per job, and a cycle check (moves 4, 5, 6)</td></tr><tr><td>Cancel before it starts? While it runs?</td><td>Before: it never runs. During: this run finishes, nothing follows</td><td>Cancel and dispatch both decide under the lock (moves 4, 6)</td></tr><tr><td>When jobs are due and every worker is busy, who goes first?</td><td>Higher priority, then earlier due, then first come</td><td>A second heap, ordered by a rule handed in (moves 3, 5)</td></tr><tr><td>Finish the queued work on shutdown, or stop now? One process, in memory?</td><td>Both calls exist; one process</td><td>shutdown() and shutdownNow(); a jobs table later (moves 6, 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Schedule a job to run once, after a delay or at a clock time, and get back its id.</li>\n<li>Recurring jobs: at a fixed rate (counted from each planned start) or with a fixed delay (counted from the end of each run).</li>\n<li>Run due jobs on a fixed pool of N worker threads: never on the dispatcher thread, never inside the lock.</li>\n<li>Prerequisites: a job may wait for other jobs and runs only after all of them succeeded; a failed or cancelled one skips everything behind it; a loop is refused at submit, with its path.</li>\n<li>Retries with exponential backoff and jitter (a random part of each wait, so jobs that failed together do not retry together), up to a limit, then FAILED.</li>\n<li>cancel(id): a job that has not started never will. status(id) and the count per state at any moment.</li>\n<li>When jobs are due and the workers are busy, priority decides who goes first, and that rule can change.</li>\n<li>shutdown() lets accepted one-shot jobs finish; shutdownNow() cancels what has not started and interrupts what runs (asks its thread to stop).</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Many threads submit and cancel at once: no job is lost, and none starts early, runs twice at the same time, or starts after a cancel that returned true.</li>\n<li>The dispatcher sleeps exactly until the next job is due and wakes at once for an earlier one: no polling, no lost wakeups (a signal sent before anyone waits, and so never heard).</li>\n<li>schedule and dispatch are O(log n) (a heap); cancel and status are O(1) (a map).</li>\n<li>Back-pressure (slowing or refusing callers when work arrives faster than it is done): a worker gets a job only when it is free, and new jobs are refused past a limit, so a flood fills neither memory nor a queue.</li>\n<li>The rules that change (when next, how to retry, which due job first) are swapped without opening the scheduler.</li>\n<li>A job that throws, even an Error, never kills a worker or the dispatcher and never loses a worker slot.</li>\n<li>Time comes from an injected clock, so every timing rule is tested without sleeping.</li>\n<li>In memory, one process (say it; a follow-up adds a jobs table and many machines).</li></ul></div></div>\n<div class=\"move\"><h3>One morning, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"170\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M170 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(30 60)\"><rect width=\"280\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"140.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:00:03  alert, due in 1 s</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the dispatcher sleeps until 09:00:10</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">alert is earlier: the new head</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">signal: it wakes, sleeps 1 s</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">alert runs 09:00:04; ping at :10</text></g><circle cx=\"470\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M470 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(330 60)\"><rect width=\"280\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"140.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:01:00  charge throws</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">attempt 1: gateway timeout</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">back in the heap ~1 s later (jitter)</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">attempt 2 throws: ~2 s later</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">attempt 3 works: DONE; receipt runs</text></g><circle cx=\"770\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M770 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(630 60)\"><rect width=\"280\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"140.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:02:00  two builds end at once</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">two workers finish in the same ms</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">deploy waits for 2 -> 1 -> 0</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the lock takes them one by one</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">exactly one of them queues deploy</text></g><circle cx=\"1070\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1070 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"280\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"140.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:05:00  cancel races dispatch</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">backup is due at 09:05:00.000</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">cancel arrives in the same ms</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">cancel gets the lock first: true</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the dispatcher skips it: no run</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> one scheduler, in memory, one process; N worker threads plus one dispatcher that never runs a job; times in epoch milliseconds (counted from 1 January 1970, UTC) from an injected clock; fixed rate counts from the planned start and fixed delay from the end of the run; a job goes back into the heap only after its run ends; a failure is retried with backoff, then FAILED; a failed or cancelled prerequisite skips whatever waits for it. Named as out of scope: cron lines and time zones, per-job time limits, jobs that need a GPU machine, several scheduler machines on one jobs table; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, rate limiter, a thread pool) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. Here, moves 4, 5 and 6 each end with a second part for prerequisites (jobs that wait for other jobs): the race, the shapes and the life.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class, and a thread is not a noun.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a CALLER submits a JOB for a DELAY or a RHYTHM; it may WAIT FOR other jobs; a DISPATCHER wakes; a WORKER runs it; a failure is RETRIED</text><g transform=\"translate(20 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ScheduledJob</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">task, times, state, tries</text></g><path d=\"M112 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(220 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Scheduler</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">heaps, jobs by id, the lock</text></g><path d=\"M312 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">JobSpec</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what the caller asks for</text></g><path d=\"M512 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(620 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Trigger, RetryPolicy</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a rule: an interface</text></g><path d=\"M712 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(820 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Dispatcher</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a thread: a loop inside</text></g><path d=\"M912 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1020 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Worker</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a thread: take, run, report</text></g><path d=\"M1112 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = state of its own, so a class.   dashed = a rule (move 3), or a thread: a loop inside the class that owns what it touches</text></svg></div><div class=\"move\"><p>Reading the prompt again: a <b>caller</b> submits a <b>job</b> to run after a <b>delay</b> or on a <b>rhythm</b>; it may <b>wait for</b> other jobs; a <b>dispatcher</b> wakes when one is due; a <b>worker</b> runs it; a failed run is <b>retried</b>. A job has a task, a due time, a state and a count of attempts, so it is a class: ScheduledJob. What the caller asks for (an id, a task, a delay, a rhythm, a retry rule, a priority, the jobs to wait for) is a class too, JobSpec, filled in with chained calls. The scheduler holds every job, the queue ordered by time and the lock: a class, and the only one with a lock. \"When does it run next\" and \"how long before a retry\" are rules, not things, so they become interfaces in move 3. Notice what did not become a class: the dispatcher and the workers. A thread has no state worth modelling of its own; it is a loop that runs inside the class that owns the state it touches. The scheduler owns the heap, so the dispatcher's loop and the workers' loop are private methods of Scheduler, started by <code>start()</code>.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 278\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">put a job in time order</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 42 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 20)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Scheduler  (owns the heaps + the lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 42 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 20)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">schedule(spec)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 76)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take every job that is due</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 98 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 76)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Scheduler  (the same heaps)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 98 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 76)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">pollDue(now)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">work out when it runs next</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 154 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 132)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Trigger  (touches no state: pure)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 154 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 132)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">trigger.next(planned, ended)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 188)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">run the job's own code</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 210 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 188)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a worker thread, outside the lock</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who does it: no state of its own</text></g><path d=\"M830 210 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 188)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">runJob(job) -&gt; task.run()</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"262\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb that touches the heaps goes to their owner; a verb that touches nothing becomes a pure rule, which is what makes it swappable</text></svg></div><div class=\"move\"><p>\"Put a job in time order\" changes the heap, so it belongs to whoever owns the heap: <code>schedule(spec)</code> on Scheduler. \"Take every job that is due\" reads and changes the same heap: <code>pollDue(now)</code>, also on Scheduler. \"Cancel\" changes a job's state, which only the scheduler changes, under its lock: <code>cancel(id)</code>. \"Work out when it runs next\" touches no state at all. Given the planned start and the end of the last run it returns a time, so it is a pure function (it reads its inputs and changes nothing) on the job's Trigger, and that is exactly why it can be swapped. \"Run the job's code\" is the one verb that must never happen inside the scheduler's lock, because it takes milliseconds to minutes. The worker calls <code>runJob(job)</code>, which runs the task with no lock held and only then takes the lock to record what happened.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 340\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 110)\"><rect width=\"220\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Scheduler + JobSpec</text><text x=\"110.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">handed in, never built</text></g><path d=\"M250 155 H330 V40 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 18)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Trigger</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">when it runs next</text></g><g transform=\"translate(760 18)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FixedRate / FixedDelay / Cron</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 40 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 155 H330 V94 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 72)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RetryPolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">how long before a retry</text></g><g transform=\"translate(760 72)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">NONE / ExponentialBackoff</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 94 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 155 H330 V148 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 126)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Comparator&lt;ScheduledJob&gt;</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">which due job goes first</text></g><g transform=\"translate(760 126)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">HIGHEST_PRIORITY_FIRST / BY_DUE / Aging</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 148 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 155 H330 V202 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 180)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RunListener</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who hears about each run</text></g><g transform=\"translate(760 180)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RunHistory / metrics / a pager</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 202 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 155 H330 V256 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 234)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where time comes from</text></g><g transform=\"translate(760 234)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock.system() / ManualClock</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 256 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in: per job on its JobSpec, per scheduler through configure() and the constructor. The scheduler builds none of them</text><text x=\"615\" y=\"325\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one rule can WRAP another: new SkipHolidays(Cron.parse(\"30 9 * * 1-5\", IST), IST, holidays). That wrapping is Decorator, born right here.</text></svg></div><div class=\"move\"><p>When a job runs next will change: every ten seconds today, ten seconds after the last run ended tomorrow, 09:30 on weekdays in Mumbai the day after. How long to wait before a retry will change: never, then exponential backoff, then \"not for this kind of error\". Which due job goes first when the workers are busy will change: priority today, priority with aging (a waiting job's priority slowly rising) when someone complains about starvation (a job that waits for ever because others keep going first). Who wants to hear about finished runs will grow: a history, a metrics counter, a pager for FAILED. And the clock must be one a test can move. Each becomes a one-method interface the scheduler is <i>given</i> and never builds: a job's Trigger and RetryPolicy come in on its JobSpec, the priority rule through <code>configure()</code>, listeners through <code>addListener()</code>, the clock through the constructor. The rules run inside the lock, so they must be pure and fast: a cron calculation, never a database call. This is where the patterns come from, not the other way round: a swappable rule behind an interface is <b>Strategy</b>; a rule that wraps another, like a holiday calendar around a cron line, is <b>Decorator</b>; a scheduler that tells whoever subscribed that a run ended, without knowing who they are, is <b>Observer</b>. Do them; do not announce them. What happens to missed runs is a rule too, but it has exactly three answers, so it is an enum, Misfire, not an interface.</p></div><div class=\"move\"><h3>Move 4: state that many threads change at the same time gets one owner and one lock, and deciding to sleep is part of the same step.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">caller: cancel(backup)</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads: SCHEDULED</text></g><g transform=\"translate(30 120)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the dispatcher</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads: SCHEDULED, due</text></g><g transform=\"translate(320 75)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">job backup</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">SCHEDULED</text></g><path d=\"M230 52 H320 V75\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M230 142 H320 V119\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"275\" y=\"42\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"275\" y=\"170\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"510\" y=\"18\" width=\"340\" height=\"170\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"680\" y=\"40\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the two gaps</text><text x=\"525\" y=\"64\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">1 both saw SCHEDULED: cancel says true,</text><text x=\"539\" y=\"84\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">and the dispatcher runs it anyway</text><text x=\"525\" y=\"104\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">2 it plans to sleep until 09:00:10; alert,</text><text x=\"539\" y=\"124\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">due 09:00:04, signals before it waits</text><text x=\"680\" y=\"160\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: check + act, and decide + wait, as ONE step</text><g transform=\"translate(880 40)\"><rect width=\"320\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Scheduler.lock + one Condition</text><text x=\"160.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">heaps, map, states, counts: one lock</text></g><text x=\"1040\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">await() lets go of the lock only once it is waiting</text><text x=\"1040\" y=\"185\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">listeners are called after the unlock, never inside</text></svg></div><div class=\"move\"><p>Callers on many threads schedule and cancel while the dispatcher takes due jobs and the workers report results. Two gaps open the moment any of that is not one step. The first is cancel against dispatch. The dispatcher reads \"backup is SCHEDULED and due\", a caller reads the same, marks it cancelled and returns true, and the dispatcher hands backup to a worker anyway: a cancel that said yes, and a job that ran. The second is the lost wakeup (a signal sent while nobody is waiting yet, and so heard by nobody). The dispatcher looks at the heap, sees ping due at 09:00:10 and decides to sleep ten seconds. Before it actually starts waiting, a caller adds alert for 09:00:04 and signals. Nobody was waiting, so the signal is gone, and alert runs six seconds late. So every piece of shared state (the two heaps, the map of jobs, each job's state, the counts) lives in Scheduler under one ReentrantLock. The dispatcher decides how long to sleep and starts sleeping in the same locked step, on a Condition (a waiting room tied to the lock: <code>await</code> sleeps in it, <code>signal</code> wakes one sleeper). <code>awaitNanos</code> lets go of the lock only once the thread is waiting, so a caller's signal can only arrive while the dispatcher is listening. Anyone who only listens (history, metrics) is called after the lock is released.</p></div><div class=\"move\"><h4 style=\"margin:12px 0 4px;font-size:14px;color:var(--acc2)\">Prerequisites, part 1 of 3: two prerequisites finishing at the same instant</h4></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">build-a ends</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">on worker 1</text></g><g transform=\"translate(30 120)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">build-b ends</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">on worker 2, same ms</text></g><g transform=\"translate(320 75)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">deploy</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waitingFor = 2</text></g><path d=\"M230 52 H320 V75\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M230 142 H320 V119\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"275\" y=\"42\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">count - 1</text><text x=\"275\" y=\"170\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">count - 1</text><rect x=\"510\" y=\"18\" width=\"340\" height=\"170\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"680\" y=\"40\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"525\" y=\"64\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">both read 2 and both write 1:</text><text x=\"539\" y=\"84\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">deploy waits for ever</text><text x=\"525\" y=\"104\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">or both see 0:</text><text x=\"539\" y=\"124\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">deploy is queued twice</text><text x=\"680\" y=\"160\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: count down and test for 0 under the lock</text><g transform=\"translate(880 40)\"><rect width=\"320\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">endLocked(), under the lock</text><text x=\"160.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the two finishes go one after the other</text></g><text x=\"1040\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">exactly one of them sees 0 and queues deploy</text></svg></div><div class=\"move\"><p>The same gap has a third form once jobs wait for jobs. Deploy waits for build-a and build-b, so it keeps a count, waitingFor, which starts at 2. The two builds end in the same millisecond on two workers, and each does count = count - 1. Without the lock, both can read 2 and both write 1, and deploy waits for ever; or both see the count reach 0, and deploy is queued twice. With the decrement and the \"is it zero now?\" check inside the scheduler's lock, the two finishes happen one after the other, and exactly one of them sees 0 and queues deploy. Test 11 runs this thirty times, with eight prerequisites released by a barrier (a gate that lets all eight finish at the same instant).</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1) or O(log n).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 16)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which job is due next?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 35 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 16)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PriorityQueue by dueAt: look at the head</text><text x=\"260.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 35 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 16)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) peek, O(log n) add</text></g><g transform=\"translate(30 62)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">of the due ones, which goes first?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 81 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 62)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a second PriorityQueue, its order handed in</text><text x=\"260.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 81 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 62)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(log n)</text></g><g transform=\"translate(30 108)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">this job, by id? (cancel, status)</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 127 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 108)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">HashMap&lt;id, ScheduledJob&gt;</text><text x=\"260.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 127 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 108)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 154)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take a cancelled job out of a heap?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 173 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 154)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">no: mark it CANCELLED, drop it at the top</text><text x=\"260.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 173 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 154)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), not O(n)</text></g><g transform=\"translate(30 200)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many waiting, running, failed?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 219 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 200)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EnumMap&lt;JobState, Integer&gt;, kept by move()</text><text x=\"260.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 219 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 200)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 246)\"><rect width=\"350\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"175.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">give a due job to a worker?</text><text x=\"175.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M380 265 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 246)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LinkedBlockingQueue: the dispatcher puts, workers take</text><text x=\"260.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M950 265 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 246)\"><rect width=\"200\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><text x=\"615\" y=\"306\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">not one of these is a scan, and every scan would have been inside the lock</text></svg></div><div class=\"move\"><p>\"Which job is due next?\" is a heap (a tree kept so that the smallest item is always on top) ordered by due time: peek at the head in O(1), add or remove in O(log n), 17 steps for 100,000 jobs. \"Of the due ones, which goes first?\" is a second question with a different answer, so it gets a second heap, ordered by the rule handed in (priority by default). A job moves from the first heap to the second when its time comes. \"This job, by id\" is a map, for cancel and status. \"Take a cancelled job out of the heap\" is the trap: <code>PriorityQueue.remove(job)</code> is a scan, O(n), inside the lock. So a cancelled job is only marked CANCELLED and stays where it is, and the dispatcher drops it when it reaches the top (lazy removal). \"How many are waiting, running, failed\" is seven numbers kept up to date by the one method that changes a state. The hand-off to the workers is a queue the dispatcher puts into and the workers take from, and the dispatcher hands out only as many jobs as there are free workers: the queue never holds more than N, and the rest wait in the ready heap, where priority still decides who goes next. The map keeps finished jobs so that status(id) can answer; a long-running scheduler keeps only a recent window of them.</p></div><div class=\"move\"><h4 style=\"margin:12px 0 4px;font-size:14px;color:var(--acc2)\">Prerequisites, part 2 of 3: one number and one list per job</h4></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 210\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 26)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">build-a</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">DONE</text></g><g transform=\"translate(30 116)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">build-b</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">RUNNING</text></g><g transform=\"translate(290 71)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">deploy</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waitingFor 1</text></g><g transform=\"translate(540 71)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">smoke</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waitingFor 1</text></g><g transform=\"translate(290 150)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lint</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waitingFor 0: due</text></g><path d=\"M210 48 H250 V82 H290\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M210 138 H250 V104 H290\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M470 93 H540\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"130\" y=\"190\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">arrows: dependents lists</text><g transform=\"translate(760 26)\"><rect width=\"440\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">may deploy start yet?  O(1)</text><text x=\"220.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">int waitingFor: 0 means yes</text></g><g transform=\"translate(760 84)\"><rect width=\"440\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who waits for build-b?  O(k), once, at its end</text><text x=\"220.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">List dependents on build-b</text></g><g transform=\"translate(760 142)\"><rect width=\"440\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is there a loop in this batch?  O(jobs + links), once</text><text x=\"220.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">Kahn's count at submit, then a walk</text></g></svg></div><div class=\"move\"><p>Prerequisites add three questions. \"May this job start yet?\" is one number per job, waitingFor, the count of prerequisites not yet DONE: zero means yes. \"Who is waiting for me?\" is a list on each job, dependents, walked once when the job ends: a success counts each one down, any other end skips each one and everything behind it. \"Is there a loop in this batch?\" is asked once, at submit, with Kahn's algorithm (keep removing jobs that wait for nothing still in the batch; any that are left sit on or behind a loop), then a walk along \"waits for\" links from a leftover job until one repeats, which prints the loop. Both are plain loops, not recursion, so a chain of 20,000 jobs cannot overflow the call stack.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 248\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 40)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BLOCKED</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits for prerequisites</text></g><g transform=\"translate(215 40)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SCHEDULED</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits for time, a worker</text></g><g transform=\"translate(400 40)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RUNNING</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">handed to a worker</text></g><path d=\"M190 62 H215\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M375 62 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M480 40 V20 H295 V40\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"388\" y=\"15\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">retry, or the next run</text><g transform=\"translate(30 150)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SKIPPED</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a prerequisite failed</text></g><g transform=\"translate(215 150)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CANCELLED</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">cancel, or shutdown</text></g><g transform=\"translate(400 150)\"><rect width=\"160\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DONE | FAILED</text><text x=\"80.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">ok, or gave up</text></g><path d=\"M110 84 V150\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M295 84 V150\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M480 84 V150\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M430 84 V110 H330 V150\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"380\" y=\"104\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">cancel mid-run</text><rect x=\"600\" y=\"16\" width=\"610\" height=\"190\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"905\" y=\"40\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order after every run, inside finishLocked, and why</text><text x=\"615\" y=\"64\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 free the worker slot: running - 1</text><text x=\"615\" y=\"86\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 failed, attempts left? back in the heap at end + backoff, same slot</text><text x=\"615\" y=\"108\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 recurring? next planned time; if already past, Misfire decides</text><text x=\"615\" y=\"130\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4 otherwise DONE, or FAILED</text><text x=\"615\" y=\"152\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5 DONE counts the waiting jobs down; any other end skips them</text><text x=\"615\" y=\"174\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">6 signal the dispatcher; tell the listeners after the unlock</text><text x=\"905\" y=\"198\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">a job is back in a heap only AFTER its run ended: two runs never overlap</text><text x=\"615\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the dispatcher marks a job RUNNING under the lock before any worker sees it: from that line on, cancel() returns fals

, including whole chains waiting on prerequisites, returns their ids, and interrupts the workers; a job that is sleeping, waiting or blocked on I/O gets InterruptedException and ends CANCELLED (test 15: done in milliseconds). Java cannot force a thread to stop, so a job that never blocks and never checks for interrupts runs to its end. A per-job time limit has the same limit: <code>TimeoutTask</code> arms a watchdog (another scheduler) that interrupts the worker when time is up, and a small lock makes sure a late watchdog cannot interrupt the next job on that worker. Code that must really be killable runs as a process.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Graceful: refuse new jobs. One-shot jobs already accepted still run at their time, with their retries\n     * and prerequisites; recurring jobs stop after the run in progress. The threads end when nothing is left.\n     */\n    void shutdown() {\n        List&lt;RunRecord&gt; events = new ArrayList&lt;&gt;();\n        lock.lock();\n        try {\n            accepting = false;\n            for (ScheduledJob j : jobs.values())\n                if (j.recurring() &amp;&amp; j.state == JobState.SCHEDULED) {\n                    events.add(new RunRecord(j.id, j.attempts, -1, clock.nowMs(), &quot;shutdown&quot;, JobState.CANCELLED));\n                    endLocked(j, JobState.CANCELLED, events);\n                }\n            wake.signal();\n        } finally { lock.unlock(); }\n        publish(events);\n    }\n\n    /**\n     * Now: refuse new jobs, cancel every job that has not started and return their ids, and interrupt the\n     * workers so a running job that waits or sleeps stops early. Java cannot force a thread to stop: a job\n     * that ignores interrupts runs to its end, and nothing follows it.\n     */\n    List&lt;String&gt; shutdownNow() {\n        List&lt;RunRecord&gt; events = new ArrayList&lt;&gt;();\n        List&lt;String&gt; neverStarted = new ArrayList&lt;&gt;();\n        List&lt;Thread&gt; toInterrupt;\n        lock.lock();\n        try {\n            accepting = false;\n            stopNow = true;\n            long now = clock.nowMs();\n            List&lt;ScheduledJob&gt; notStarted = new ArrayList&lt;&gt;();\n            handoff.drainTo(notStarted);                           // handed out, but no worker has picked them up\n            for (ScheduledJob j : jobs.values())\n                if (j.state == JobState.BLOCKED || j.state == JobState.SCHEDULED) notStarted.add(j);\n            for (ScheduledJob j : notStarted) {\n                if (j == POISON) { handoff.add(POISON); continue; } // a stop sign stays: a worker still needs it\n                if (j.state == JobState.RUNNING) running--;        // it was handed out but never ran\n                neverStarted.add(j.id);\n                events.add(new RunRecord(j.id, j.attempts, -1, now, &quot;shutdownNow&quot;, JobState.CANCELLED));\n                move(j, JobState.CANCELLED);                       // directly, not through endLocked: every waiting job\n                live--;                                            // is being cancelled here, so none is left to skip\n            }\n            wake.signal();\n            toInterrupt = new ArrayList&lt;&gt;(workerThreads);\n        } finally { lock.unlock(); }\n        for (Thread t : toInterrupt) t.interrupt();\n        publish(events);\n        return neverStarted;\n    }\n\n    /** Wait up to timeoutMs (real time) for the dispatcher and every worker to end. True if they all did. */\n    boolean awaitTermination(long timeoutMs) throws InterruptedException {\n        List&lt;Thread&gt; all = new ArrayList&lt;&gt;();\n        lock.lock();\n        try { if (dispatcher != null) all.add(dispatcher); all.addAll(workerThreads); } finally { lock.unlock(); }\n        long deadline = System.nanoTime() + TimeUnit.MILLISECONDS.toNanos(timeoutMs);\n        for (Thread t : all)\n            if (!t.join(Duration.ofNanos(deadline - System.nanoTime()))) return false;\n        return true;\n    }\n}\n\n// ---- ext: timeouts --------------------------------------------------------------------------------------\n/**\n * A time limit per job. Java cannot kill a thread, so a timeout is a polite interrupt: a watchdog (our own\n * Scheduler) interrupts the worker when time is up; the job sees InterruptedException in its sleep, wait\n * or blocking read, and the attempt fails with a TimeoutException, so the RetryPolicy applies. The guard\n * makes &quot;time is up&quot; and &quot;the run ended&quot; exclusive, so a late watchdog never interrupts the NEXT job on that\n * worker. A job that never blocks and never checks for interrupts cannot be stopped: run it as a process.\n */\nfinal class TimeoutTask implements Task {\n    private final Task inner;\n    private final long limitMs;\n    private final Scheduler watchdog;\n\n    TimeoutTask(Task inner, long limitMs, Scheduler watchdog) { this.inner = inner; this.limitMs = limitMs; this.watchdog = watchdog; }\n    /** Run the inner task with a watchdog armed; turn the watchdog&#x27;s interrupt into a TimeoutException. */\n    public void run() throws Exception {\n        Thread me = Thread.currentThread();\n        Object guard = new Object();\n        boolean[] endedOrFired = {false, false};                  // {the run ended, the watchdog fired}\n        String dog = watchdog.schedule(() -&gt; {\n            synchronized (guard) { if (!endedOrFired[0]) { endedOrFired[1] = true; me.interrupt(); } }\n        }, limitMs);\n        try {\n            inner.run();\n        } catch (Exception e) {\n            synchronized (guard) {\n                if (endedOrFired[1]) {\n                    TimeoutException t = new TimeoutException(&quot;ran longer than &quot; + limitMs + &quot; ms&quot;);\n                    t.initCause(e);\n                    throw t;\n                }\n            }\n            throw e;                                              // a real failure, or shutdownNow&#x27;s interrupt\n        } finally {\n            synchronized (guard) { endedOrFired[0] = true; }\n            watchdog.cancel(dog);\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>14 &middot; Ten thousand jobs a second through one lock: does it scale? And what if jobs arrive faster than the workers run them?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Say the numbers. Measured here, one job costs about one and a half microseconds of lock for all three visits, with 250,000 jobs in the heaps, so ten thousand jobs a second is 15 ms of lock in every second: 1.5% busy. The workers run out long before: ten thousand jobs of 4 ms each need forty workers, not a better lock. Until there are enough, jobs pile up, and back-pressure keeps that safe: a worker gets a job only when it is free, and <code>limitPending(max)</code> makes schedule() throw RejectedExecutionException once max jobs are unfinished, an error the caller can see and retry later instead of an OutOfMemoryError (test 5). If submitting threads really do queue on the lock, rung one is K schedulers, each with its own lock, heaps and dispatcher, a job going to the shard hash(id) mod K. It has two costs: priority holds only inside a shard, and a batch with prerequisites must go to one shard, routed by one key. Rung two is a timing wheel (a bucket for each tick of time, the Kafka and Netty answer for millions of timers), and rung three is many machines on one jobs table.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /**\n     * Back-pressure at the door: refuse new jobs while `max` are unfinished (blocked, waiting or running), so a\n     * flood of submissions becomes an error the caller sees, not a heap that grows until memory runs out.\n     */\n    void limitPending(int max) {\n        if (max &lt; 1) throw new IllegalArgumentException(&quot;limit must be positive&quot;);\n        lock.lock();\n        try { maxPending = max; } finally { lock.unlock(); }\n    }\n\n// ---- ext: sharding --------------------------------------------------------------------------------------\n/**\n * Rung 1 of the ladder: K independent schedulers; a job goes to shard hash(key) mod K. K locks, K heaps, K\n * dispatchers, so submitting threads rarely meet. The price: priority holds only inside a shard, and a\n * batch with prerequisites must go to one shard, so it is routed by one key.\n */\nfinal class ShardedScheduler {\n    private final Scheduler[] shards;\n    private final ConcurrentHashMap&lt;String, Scheduler&gt; home = new ConcurrentHashMap&lt;&gt;();   // job id -&gt; its shard, for cancel\n\n    ShardedScheduler(int k, int workersEach, Clock clock) {\n        shards = new Scheduler[k];\n        for (int i = 0; i &lt; k; i++) { shards[i] = new Scheduler(workersEach, clock); shards[i].start(); }\n    }\n    /** The shard for a routing key. */\n    private Scheduler shardFor(String key) { return shards[Math.floorMod(key.hashCode(), shards.length)]; }\n    /** One job, routed by its own id. */\n    String schedule(JobSpec spec) { return scheduleAll(spec.id, List.of(spec)).get(0); }\n    /** A batch that may have prerequisites, all to the shard of one routing key. */\n    List&lt;String&gt; scheduleAll(String routingKey, List&lt;JobSpec&gt; batch) {\n        Scheduler s = shardFor(routingKey);\n        List&lt;String&gt; ids = s.scheduleAll(batch);\n        for (String id : ids) home.put(id, s);\n        return ids;\n    }\n    /** Cancel on the job&#x27;s own shard. */\n    boolean cancel(String id) { Scheduler s = home.get(id); return s != null &amp;&amp; s.cancel(id); }\n    /** Graceful shutdown of every shard, then wait. */\n    void shutdownAndWait(long timeoutMs) throws InterruptedException {\n        for (Scheduler s : shards) s.shutdown();\n        for (Scheduler s : shards) s.awaitTermination(timeoutMs);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>15 &middot; The dashboard asks &#x27;how many jobs are waiting, running, failed?&#x27; and &#x27;what happened to job X?&#x27; a thousand times a second.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p><code>counts()</code> copies seven numbers that <code>move()</code> keeps right on every state change, so it never counts anything; <code>status(id)</code> is one map lookup. Both hold the lock for well under a microsecond, so a thousand calls a second cost about a millisecond of lock. The history is a listener, so the scheduler does not change: <code>RunHistory</code> keeps the last N run records and the latest one per job, both bounded so memory cannot grow for ever, and it has its own small lock because listeners are called from many worker threads at once, after the scheduler's lock is released. The same stream of records feeds metrics, or a pager on FAILED.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">    /** A job&#x27;s state, or null for an unknown id. O(1). */\n    JobState status(String id) {\n        lock.lock();\n        try { ScheduledJob j = jobs.get(id); return j == null ? null : j.state; } finally { lock.unlock(); }\n    }\n    /** How many jobs are in each state, as one consistent snapshot. O(number of states). */\n    Map&lt;JobState, Integer&gt; counts() {\n        lock.lock();\n        try { return new EnumMap&lt;&gt;(counts); } finally { lock.unlock(); }\n    }\n    /** The ids a job waits for, or an empty list for an unknown id. */\n    List&lt;String&gt; prerequisitesOf(String id) {\n        lock.lock();\n        try { ScheduledJob j = jobs.get(id); return j == null ? List.of() : j.after; } finally { lock.unlock(); }\n    }\n\n// ---- ext: history ---------------------------------------------------------------------------------------\n/**\n * Media.net&#x27;s &quot;history&quot;: the last N run records, and the latest record per job (&quot;what happened to job X?&quot;).\n * A listener, so the scheduler does not change. It is called from many worker threads after the lock, so it\n * has its own small lock. Bounded: the oldest record and the least recently seen job fall off.\n */\nfinal class RunHistory implements RunListener {\n    private final int capacity;\n    private final ArrayDeque&lt;RunRecord&gt; recent = new ArrayDeque&lt;&gt;();\n    private final LinkedHashMap&lt;String, RunRecord&gt; latest;\n\n    RunHistory(int capacity) {\n        this.capacity = capacity;\n        this.latest = new LinkedHashMap&lt;&gt;(16, 0.75f, true) {\n            @Override protected boolean removeEldestEntry(Map.Entry&lt;String, RunRecord&gt; e) { return size() &gt; RunHistory.this.capacity; }\n        };\n    }\n    /** Keep the record; O(1). */\n    public synchronized void onRun(RunRecord r) {\n        if (recent.size() == capacity) recent.removeFirst();\n        recent.addLast(r);\n        latest.put(r.jobId(), r);\n    }\n    /** The last n records, oldest first. */\n    synchronized List&lt;RunRecord&gt; last(int n) {\n        List&lt;RunRecord&gt; all = new ArrayList&lt;&gt;(recent);\n        return all.subList(Math.max(0, all.size() - n), all.size());\n    }\n    /** The latest record for one job, or null. O(1). */\n    synchronized RunRecord latest(String jobId) { return latest.get(jobId); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Which pattern is where, and why did each one earn its place?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Each one is what a move produced. Strategy is move 3: when a job runs next, how it is retried and which due job goes first are rules that change, so each sits behind a one-method interface the scheduler is handed. Decorator is SkipHolidays and Spread, which wrap a Trigger instead of replacing it. Observer is move 4's rule that listeners are told after the lock, never inside it. State is move 6: the ALLOWED table and <code>move()</code>. Command is the Task itself: work packed as an object that can wait, run later and run again. Builder is JobSpec, because a job has six optional settings. Producer-consumer is the hand-off queue between the dispatcher and the workers. Two you should not claim: no Singleton, because every test builds its own scheduler, and no Factory until schedules arrive as text.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: rules behind one-method interfaces, handed in, never built\ninterface Trigger { long next(long plannedAt, long finishedAt); }\ninterface RetryPolicy { long delayMs(int attempts, Exception error); }\nscheduler.configure(Aging.comparator(10_000));            // which due job goes first\n\n// Decorator: wrap a rule instead of replacing it\nTrigger t = Spread.of(&quot;nightly-report&quot;, new SkipHolidays(Cron.parse(&quot;30 9 * * 1-5&quot;, IST), IST, holidays), 600_000);\n\n// Observer: told after the unlock; the scheduler never knows who listens\ninterface RunListener { void onRun(RunRecord r); }\npublish(events);                                          // AFTER lock.unlock()\n\n// State: the life as a table; any other move throws\nif (!JobState.ALLOWED.get(j.state).contains(to)) throw new IllegalStateException(...);\n\n// Command: a job&#x27;s work as an object: stored, run later, run again\ninterface Task { void run() throws Exception; }\n\n// Builder: six optional settings, one readable line\nJobSpec.of(&quot;backup&quot;, task).in(300_000).retry(new ExponentialBackoff(1_000, 60_000, 5, rnd)).after(&quot;snapshot&quot;);\n\n// Producer-consumer: the dispatcher puts, N workers take\nhandoff.addAll(due);             // dispatcher, under the lock\nScheduledJob j = handoff.take(); // worker, then runJob(j) outside the lock\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>17 &middot; Which SOLID letter is where in this code?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>S: each class has one reason to change. A ScheduledJob changes when a job's facts change, a Trigger when the rhythm rule does, the Scheduler when the flow or the locking does. O: cron, holidays, spreading and aging were each a new class, and Scheduler was never opened. L: <code>j.trigger.next(...)</code> works for every Trigger, and nothing asks which one it got. I: Task, Clock, Trigger, RetryPolicy and RunListener each have one method, so a fake for a test is one lambda. D: the scheduler depends on those interfaces and is handed the implementations, which is exactly why a test can hand it a clock that says \"Monday 09:30\" and a task that always throws.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// S: one reason to change each\nfinal class ScheduledJob { /* one job&#x27;s facts */ }    record FixedRate(long periodMs) implements Trigger { /* when next */ }\nfinal class Scheduler { /* the heaps, the lock, the flow */ }\n// O: new behaviour = new classes; Scheduler never opened\nspec.every(new SkipHolidays(Cron.parse(&quot;30 9 * * 1-5&quot;, IST), IST, holidays));\n// L: any trigger drops in; nobody asks which one it is\nlong next = j.trigger.next(j.plannedAt, finishedAt);\n// I: one method per interface, so a fake is a lambda\nTask failing = () -&gt; { throw new IOException(&quot;disk full&quot;); };    Clock frozen = () -&gt; 0L;\n// D: depend on interfaces; implementations handed in, tests hand in fakes\nScheduler s = new Scheduler(4, new ManualClock(0));    s.configure(Scheduler.BY_DUE);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>18 &middot; Misfire is an enum and Trigger is an interface. Why the difference? And where would a Factory pay?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>An enum when the list is closed and each answer is data; an interface when new kinds keep coming and each carries its own logic. Misfire has exactly three answers to one question (run all, run once, skip), and the logic for all three is ten lines in one method, so an enum is enough. Triggers keep coming (fixed rate, fixed delay, a cron line, holidays, spreading, business days), and each works out time in its own way, so Trigger is an interface and each kind a class. JobState is an enum for the same reason as Misfire, with the ALLOWED table as its data. A Factory pays once schedules stop being objects in code and arrive as text, from a config file or an API: <code>Triggers.parse</code> turns \"every 10s\" or \"cron 30 9 * * 1-5 Asia/Kolkata\" into the right Trigger, and a new kind is one more case there, not a change in every caller.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * What happens to planned runs of a recurring job that were missed: the job was still running at its next\n * planned time, every worker was busy, or the process was down. A closed list of three answers, so an enum.\n */\nenum Misfire {\n    /** Run every missed one, back to back, until caught up (what the JDK&#x27;s fixed rate does). */\n    RUN_ALL,\n    /** Run once, now, for all the missed ones; then continue from the next planned time in the future. */\n    RUN_ONCE,\n    /** Run none of the missed ones; wait for the next planned time in the future. */\n    SKIP;\n\n    /**\n     * The planned slot to run next, given the trigger&#x27;s next slot (maybe already in the past) and now; NONE\n     * means no more runs. The job starts at max(slot, now), so a slot in the past starts at once.\n     * Cost: one step per missed slot.\n     */\n    long place(Trigger t, long next, long finishedAt, long now) {\n        if (next == Trigger.NONE || next &gt;= now || this == RUN_ALL) return next;\n        long after = t.next(next, finishedAt);\n        while (after != Trigger.NONE &amp;&amp; after &gt; next &amp;&amp; after &lt; now) { next = after; after = t.next(after, finishedAt); }\n        if (this == RUN_ONCE) return next;                                   // the latest missed slot, once, now\n        return (after == Trigger.NONE || after &lt;= next) ? Trigger.NONE : after;  // SKIP: the first slot not yet past\n    }\n}\n\n// ---- ext: schedules from text ----------------------------------------------------------------------------\n/**\n * Factory: once schedules arrive as text (a config file, an API field), one place turns text into a Trigger.\n * A new kind is one more case here, and no caller changes. Accepts &quot;every 10s&quot;, &quot;after-each 30s&quot; (fixed\n * delay), &quot;cron 30 9 * * 1-5 Asia/Kolkata&quot;.\n */\nfinal class Triggers {\n    /** Static helpers only. */\n    private Triggers() {}\n    /** Parse one schedule, or throw IllegalArgumentException naming what was wrong. */\n    static Trigger parse(String text) {\n        String[] w = text.trim().split(&quot;\\\\s+&quot;);\n        return switch (w[0]) {\n            case &quot;every&quot; -&gt; new FixedRate(millis(w[1]));\n            case &quot;after-each&quot; -&gt; new FixedDelay(millis(w[1]));\n            case &quot;cron&quot; -&gt; {\n                if (w.length != 7) throw new IllegalArgumentException(&quot;cron needs 5 fields and a zone: &quot; + text);\n                yield Cron.parse(String.join(&quot; &quot;, Arrays.copyOfRange(w, 1, 6)), ZoneId.of(w[6]));\n            }\n            default -&gt; throw new IllegalArgumentException(&quot;unknown schedule: &quot; + text);\n        };\n    }\n    /** &quot;500ms&quot;, &quot;10s&quot;, &quot;5m&quot;, &quot;2h&quot; as milliseconds. */\n    static long millis(String s) {\n        if (s.endsWith(&quot;ms&quot;)) return Long.parseLong(s.substring(0, s.length() - 2));\n        long n = Long.parseLong(s.substring(0, s.length() - 1));\n        return switch (s.charAt(s.length() - 1)) {\n            case &#x27;s&#x27; -&gt; n * 1_000; case &#x27;m&#x27; -&gt; n * 60_000; case &#x27;h&#x27; -&gt; n * 3_600_000;\n            default -&gt; throw new IllegalArgumentException(&quot;bad duration &quot; + s);\n        };\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];

   /**\n     * The planned slot to run next, given the trigger's next slot (maybe already in the past) and now; NONE\n     * means no more runs. The job starts at max(slot, now), so a slot in the past starts at once.\n     * Cost: one step per missed slot.\n     */\n    long place(Trigger t, long next, long finishedAt, long now) {\n        if (next == Trigger.NONE || next >= now || this == RUN_ALL) return next;\n        long after = t.next(next, finishedAt);\n        while (after != Trigger.NONE && after > next && after < now) { next = after; after = t.next(after, finishedAt); }\n        if (this == RUN_ONCE) return next;                                   // the latest missed slot, once, now\n        return (after == Trigger.NONE || after <= next) ? Trigger.NONE : after;  // SKIP: the first slot not yet past\n    }\n}\n\n/** How long to wait before the next attempt of a failed run, or GIVE_UP. Pure, like Trigger: it runs inside the lock. */\n@FunctionalInterface\ninterface RetryPolicy {\n    /** Returned by delayMs() to stop retrying. */\n    long GIVE_UP = -1;\n    /** Never retry: one attempt per run. */\n    RetryPolicy NONE = (attempts, error) -> GIVE_UP;\n\n    /** The wait before attempt number attempts + 1, now that `attempts` attempts have failed; or GIVE_UP. */\n    long delayMs(int attempts, Exception error);\n}\n\n/**\n * Exponential backoff with jitter: wait base, then 2 x base, 4 x base ..., never more than cap, and at most\n * maxAttempts attempts in all. Jitter (a random part of each wait) spreads out jobs that failed together, so\n * a thousand of them do not all retry in the same millisecond: here half of each wait is fixed, half random.\n */\nfinal class ExponentialBackoff implements RetryPolicy {\n    private final long baseMs, capMs;\n    private final int maxAttempts;\n    private final Random random;                          // null = no jitter: exact waits, for tests\n\n    ExponentialBackoff(long baseMs, long capMs, int maxAttempts, Random ra \nimport java.util.concurrent.locks.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist; nothing here edits Main.java.\n\n// ---- ext: cron, holidays and spreading ------------------------------------------------------------------\n/**\n * A crontab line: \"minute hour day-of-month month day-of-week\", each field \"*\", a number, \"a-b\", \"a,b,c\" or\n * \"x/n\" (every n-th). next() walks forward from the last planned start, skipping a whole month, day or hour\n * at a time when that field does not match, so even \"29 February\" is found in a few thousand steps. The\n * walk happens in the job's time zone, so \"30 9 * * 1-5\" in Asia/Kolkata means 09:30 IST on weekdays.\n * As in classic cron, when both day fields are restricted, a day matching EITHER one counts.\n */\nrecord Cron(BitSet minutes, BitSet hours, BitSet days, BitSet months, BitSet weekdays,\n            boolean anyDay, boolean anyWeekday, ZoneId zone) implements Trigger {\n    /** Parse a five-field line for a time zone; a bad field throws IllegalArgumentException. */\n    static Cron parse(String line, ZoneId zone) {\n        String[] f = line.trim().split(\"\\\\s+\");\n        if (f.length != 5) throw new IllegalArgumentException(\"cron needs 5 fields: \" + line);\n        return new Cron(field(f[0], 0, 59), field(f[1], 0, 23), field(f[2], 1, 31), field(f[3], 1, 12),\n                        field(f[4], 0, 6), f[2].equals(\"*\"), f[4].equals(\"*\"), zone);\n    }\n    /** One field as the set of values it allows. */\n    private static BitSet field(String s, int lo, int hi) {\n        BitSet b = new BitSet();\n        for (String part : s.split(\",\")) {\n            int step = 1, slash = part.indexOf('/');\n            if (slash >= 0) { step = Integer.parseInt(part.substring(slash + 1)); part = part.substring(0, slash); }\n            int a, z;\n            if (part.equals(\"*\")) { a = lo; z = hi; }\n            else if (part.contains(\"-\")) { a = Integer.parseInt(part ng, String> placedOn = new HashMap<>();         // job -> machine\n    private final Map<String, Needs> needsOf = new HashMap<>();\n    private final PriorityQueue<PendingJob> waiting = new PriorityQueue<>(\n            Comparator.comparingInt((PendingJob p) -> -p.priority()).thenComparingLong(PendingJob::seq));\n    private final ReentrantLock lock = new ReentrantLock();\n    private long seq;\n\n    Placement(List<Machine> machines) {\n        this.machines = List.copyOf(machines);\n        for (Machine m : machines) free.put(m.name(), new int[] {m.cpus(), m.ramGb()});\n    }\n    /** Queue a job and place whatever fits now. Returns the new placements, job -> machine. */\n    Map<String, String> submit(String id, Needs needs, int priority) {\n        lock.lock();\n        try {\n            if (machines.stream().noneMatch(m -> fits(m, needs, m.cpus(), m.ramGb())))\n                throw new IllegalArgumentException(id + \" fits no machine: \" + needs);\n            needsOf.put(id, needs);\n            waiting.add(new PendingJob(id, needs, priority, seq++));\n            return placeLocked();\n        } finally { lock.unlock(); }\n    }\n    /** A job ended: give its CPU and RAM back, then place whatever now fits. */\n    Map<String, String> release(String id) {\n        lock.lock();\n        try {\n            String m = placedOn.remove(id);\n            if (m == null) return Map.of();\n            Needs n = needsOf.remove(id);\n            free.get(m)[0] += n.cpus();\n            free.get(m)[1] += n.ramGb();\n            return placeLocked();\n        } finally { lock.unlock(); }\n    }\n    /** Does this machine have the capabilities, and this much CPU and RAM free? */\n    private static boolean fits(Machine m, Needs n, int freeCpu, int freeRam) {\n        return m.tags().containsAll(n.tags()) && freeCpu >= n.cpus() && freeRam >= n.ramGb();\n    }\n    /** Every waiting job, best first, onto the fitting machine that wastes least; the rest keep waiting. */\n    private Map<String, String> placeLocked() {\n        Map<String, String> placed = new LinkedHashMap<>();\n        List<PendingJob> notYet = new ArrayList<>();\n        while (!waiting.isEmpty()) {\n            PendingJob p = waiting.poll();\n            Machine best = null;\n            for (Machine m : machines) {\n                int[] f = free.get(m.name());\n                if (!fits(m, p.needs(), f[0], f[1])) continue;\n                if (best == null || waste(m, p.needs()) < waste(best, p.needs())) best = m;\n            }\n            if (best == null) { notYet.add(p); continue; }\n            free.get(best.name())[0] -= p.needs().cpus();\n            free.get(best.name())[1] -= p.needs().ramGb();\n            placedOn.put(p.id(), best.name());\n            placed.put(p.id(), best.name());\n        }\n        waiting.addAll(notYet);\n        return placed;\n    }\n    /** How much a placement wastes: unneeded capabilities count most, then CPU left over, then RAM left over. */\n    private long waste(Machine m, Needs n) {\n        int[] f = free.get(m.name());\n        long extraTags = m.tags().stream().filter(t -> !n.tags().contains(t)).count();\n        return extraTags * 1_000_000_000L + (f[0] - n.cpus()) * 100_000L + (f[1] - n.ramGb());\n    }\n}\n\n/**\n * Per-type limits (\"at most 2 report jobs at once, whatever else runs\"): a bulkhead, one small Scheduler per\n * type with that many workers, so a flood of reports can never take the workers the payment jobs need.\n * Scheduler does not change at all. The price: prerequisites cannot cross types.\n */\nfinal class Bulkheads {\n    private final Map<String, Scheduler> byType = new HashMap<>();\n\n    Bulkheads(Map<String, Integer> limits, Clock clock) {\n        limits.forEach((type, n) -> { Scheduler s = new Scheduler(n, clock); s.start(); byType.put(type, s); });\n    }\n    /** Submit a job to its type's own scheduler. */\n    String schedule(String type, JobSpec spec) {\n        Scheduler s = byType. \n    public void add(String id, long dueAt) { rows.put(id, new JobRow(id, dueAt, \"SCHEDULED\", null, Long.MIN_VALUE)); }\n    /** The due, unleased rows, earliest first (a scan here; an index on (state, due_at) in a database). */\n    public List<String> due(long now, int limit) {\n        return rows.values().stream().filter(r -> r.state().equals(\"SCHEDULED\") && r.dueAt() <= now && r.leaseUntil() < now)\n                .sorted(Comparator.comparingLong(JobRow::dueAt)).limit(limit).map(JobRow::id).toList();\n    }\n    /** The conditional update: only one instance can move a row from free to leased. */\n    public boolean claim(String id, String owner, long now, long leaseMs) {\n        boolean[] won = {false};\n        rows.computeIfPresent(id, (k, r) -> {\n            if (!r.state().equals(\"SCHEDULED\") || r.leaseUntil() >= now) return r;\n            won[0] = true;\n            return new JobRow(k, r.dueAt(), \"SCHEDULED\", owner, now + leaseMs);\n        });\n        return won[0];\n    }\n    /** DONE only for the instance that still holds the lease. */\n    public boolean complete(String id, String owner, long now) {\n        boolean[] ok = {false};\n        rows.computeIfPresent(id, (k, r) -> {\n            if (!owner.equals(r.owner()) || r.leaseUntil() < now) return r;\n            ok[0] = true;\n            return new JobRow(k, r.dueAt(), \"DONE\", owner, r.leaseUntil());\n        });\n        return ok[0];\n    }\n}\n\n/**\n * One scheduler instance of many (three machines, one jobs table). Each poll claims due rows and runs them.\n * An instance that dies mid-run just lets its lease expire, and another instance claims the job again:\n * at-least-once, never lost. So a job must be idempotent (running it twice has the effect of running it\n * once): key its side effect by the job's id.\n */\nfinal class Instance {\n    private final String name;\n    private final JobStore store;\n    private final Map<String, Task> tasks;\n    private final long lease      latest.put(r.jobId(), r);\n    }\n    /** The last n records, oldest first. */\n    synchronized List<RunRecord> last(int n) {\n        List<RunRecord> all = new ArrayList<>(recent);\n        return all.subList(Math.max(0, all.size() - n), all.size());\n    }\n    /** The latest record for one job, or null. O(1). */\n    synchronized RunRecord latest(String jobId) { return latest.get(jobId); }\n}\n\n// ---- ext: what the JDK already gives you ----------------------------------------------------------------\n/**\n * The same core on the JDK's own parts, about 25 lines: DelayQueue is a heap whose take() blocks until the\n * head's time has come (it does the wait-and-signal inside, and wakes early for an earlier item), and N\n * workers take from it. What it leaves you to write is the interview: cancel, retries, prerequisites, what\n * happens to missed runs, shutdown policies, and a job that throws.\n */\nfinal class DelayQueueScheduler {\n    /** One queued job: its task and when it may run; Delayed tells DelayQueue how long is left. */\n    private record Item(Runnable task, long dueNanos) implements Delayed {\n        /** How long until due. */\n        public long getDelay(TimeUnit unit) { return unit.convert(dueNanos - System.nanoTime(), TimeUnit.NANOSECONDS); }\n        /** Earlier due first. */\n        public int compareTo(Delayed o) { return Long.compare(dueNanos, ((Item) o).dueNanos); }\n    }\n    private final DelayQueue<Item> queue = new DelayQueue<>();\n    private final List<Thread> workers = new ArrayList<>();\n\n    DelayQueueScheduler(int n) {\n        for (int i = 0; i < n; i++) {\n            Thread t = new Thread(() -> {\n                try {\n                    while (true) {\n                        Item it = queue.take();                   // blocks until the head is due\n                        try { it.task().run(); } catch (RuntimeException e) { /* keep the worker alive */ }\n                    }\n                } catch (Interrupted  starts.add(c.nowMs()); c.advance(starts.size() == 2 ? 2_500 : 100); })\n                .every(new FixedRate(1_000)).misfire(m));\n        drive(s, c, 4_000, 50);\n        return starts;\n    }\n\n    public static void main(String[] args) throws Exception {\n        // 1. due order: jobs leave in time order, and never before their time\n        System.out.println(\"1. due order\");\n        ManualClock c1 = new ManualClock(0);\n        Scheduler s1 = new Scheduler(1, c1);\n        List<String> order1 = new ArrayList<>();\n        s1.schedule(JobSpec.of(\"c\", () -> order1.add(\"c\")).in(300));\n        s1.schedule(JobSpec.of(\"a\", () -> order1.add(\"a\")).in(100));\n        s1.schedule(JobSpec.of(\"b\", () -> order1.add(\"b\")).in(200));\n        s1.schedule(JobSpec.of(\"b2\", () -> order1.add(\"b2\")).in(200));\n        check(s1.pollDue(99).isEmpty(), \"at 99 ms nothing is due: the earliest job is for 100 ms\");\n        drive(s1, c1, 400, 1);\n        check(order1.equals(List.of(\"a\", \"b\", \"b2\", \"c\")), \"they ran in time order, equal times first-come first-served: \" + order1);\n\n        // 2. the lost wakeup: an earlier job must wake a dispatcher that is asleep planning for a later one\n        System.out.println(\"2. an earlier job wakes the sleeping dispatcher\");\n        Scheduler s2 = new Scheduler(1, Clock.system());\n        s2.start();\n        s2.schedule(() -> {}, 5_000);                              // the dispatcher goes to sleep for 5 s\n        Thread.sleep(50);\n        CountDownLatch ran2 = new CountDownLatch(1);\n        long t2 = System.nanoTime();\n        s2.schedule(ran2::countDown, 50);\n        boolean woke = ran2.await(2, TimeUnit.SECONDS);\n        long ms2 = (System.nanoTime() - t2) / 1_000_000;\n        check(woke && ms2 < 1_000, \"a 50 ms job submitted while the dispatcher slept towards a 5 s job ran after \" + ms2 + \" ms\");\n        s2.shutdownNow();\n        check(s2.awaitTermination(2_000), \"shutdownNow ended the dispatcher mid-sleep\");\n\n        // 3. cancel: before it starts it never runs, and its dependents are skipped; once running, cancel loses\n        System.out.println(\"3. cancel before and during a run\");\n        ManualClock c3 = new ManualClock(0);\n        Scheduler s3 = new Scheduler(1, c3);\n        AtomicInteger ran3 = new AtomicInteger();\n        s3.schedule(JobSpec.of(\"backup\", ran3::incrementAndGet).in(100));\n        s3.schedule(JobSpec.of(\"upload\", ran3::incrementAndGet).after(\"backup\"));\n        check(s3.cancel(\"backup\"), \"cancel before its time returns true\");\n        drive(s3, c3, 500, 10);\n        check(ran3.get() == 0 && s3.status(\"backup\") == JobState.CANCELLED, \"the cancelled job never ran\");\n        check(s3.status(\"upload\") == JobState.SKIPPED, \"the job waiting for it was skipped, not left waiting for ever\");\n        int[] tries3 = {0};\n        s3.schedule(JobSpec.of(\"pay\", () -> { tries3[0]++; throw new IOException(\"bank down\"); })\n                .retry(new ExponentialBackoff(10, 100, 5, null)));\n        List<ScheduledJob> taken = s3.pollDue(c3.nowMs());          // the dispatcher got there first\n        check(!s3.cancel(\"pay\"), \"cancel after the dispatcher took it returns false: exactly one of the two wins\");\n        for (ScheduledJob j : taken) s3.runJob(j);\n        drive(s3, c3, c3.nowMs() + 500, 10);\n        check(tries3[0] == 1 && s3.status(\"pay\") == JobState.CANCELLED, \"the running job finished its attempt, and no retry followed\");\n\n        // 4. cancel racing the dispatcher, 2,000 times: for every job exactly one side wins\n        System.out.println(\"4. cancel races the dispatcher\");\n        Scheduler s4 = new Scheduler(4, Clock.system());\n        s4.start();\n        int n4 = 2_000;\n        AtomicIntegerArray ran4 = new AtomicIntegerArray(n4);\n        boolean[] won4 = new boolean[n4];\n        Random rnd4 = new Random(4);\n        for (int i = 0; i < n4; i++) { int k = i; s4.schedule(JobSpec.of(\"c\" + k, () -> ran4.incrementAndGet(k)).in(rnd4.nextInt(20))); }\n        List<Integer> shuffled = new ArrayList<>();\n        for (int i = 0; i < n4; i++) shuffled.add(i);\n        Collections.shuffle(shuffled, rnd4);\n        Thread canceller = new Thread(() -> {\n            int k = 0;\n            for (int i : shuffled) {\n                won4[i] = s4.cancel(\"c\" + i);\n                if (++k % 100 == 0) try { Thread.sleep(1); } catch (InterruptedException e) { return; }\n            }\n        });\n        canceller.start();\n        canceller.join();\n        s4.shutdown();\n        s4.awaitTermination(10_000);\n        int bad4 = 0, cancelled4 = 0, runs4 = 0;\n        for (int i = 0; i < n4; i++) {\n            boolean ran = ran4.get(i) == 1;\n            if (ran4.get(i) > 1 || ran == won4[i]) bad4++;\n            if (won4[i]) { cancelled4++; if (s4.status(\"c\" + i) != JobState.CANCELLED) bad4++; } else runs4++;\n        }\n        check(bad4 == 0, \"every job either ran once or was cancelled, never both and never neither\");\n        check(cancelled4 > 0 && runs4 > 0, \"both sides won some races: \" + cancelled4 + \" cancelled, \" + runs4 + \" ran\");\n\n        // 5. a fixed pool: never more than N at once, and all N really used\n        System.out.println(\"5. at most N jobs run at once\");\n        Scheduler s5 = new Scheduler(4, Clock.system());\n        s5.start();\n        AtomicInteger in5 = new AtomicInteger(), most5 = new AtomicInteger();\n        CountDownLatch done5 = new CountDownLatch(40);\n        for (int i = 0; i < 40; i++)\n            s5.schedule(() -> {\n                most5.accumulateAndGet(in5.incrementAndGet(), Math::max);\n                Thread.sleep(20);\n                in5.decrementAndGet();\n                done5.countDown();\n            }, 0);\n        check(done5.await(10, TimeUnit.SECONDS) && most5.get() == 4, \"40 jobs of 20 ms on 4 workers: the most at once was \" + most5.get());\n        s5.shutdown();\n        s5.awaitTermination(2_000);\n        ManualClock c5 = new ManualClock(0);\n        Scheduler bp = new Scheduler(2, c5);\n        bp.limitPending(10);\n        for (int i = 0; i < 10; i++) bp.schedule(JobSpec.of(\"b\" + i, () -> {}).in(100));\n        boolean full5 = false, again5 = true;\n        try { bp.schedule(JobSpec.of(\"b10\", () -> {})); } catch (RejectedExecutionException e) { full5 = true; }\n        drive(bp, c5, 200, 10);\n        try { bp.schedule(JobSpec.of(\"b11\", () -> {})); } catch (RejectedExecutionException e) { again5 = false; }\n        check(full5 && again5, \"back-pressure: with a limit of 10 unfinished jobs the 11th is refused, and accepted again once they ran\");\n\n        // 6. fixed rate counts from the planned start; fixed delay from the end of the run\n        System.out.println(\"6. fixed rate and fixed delay, with a ManualClock\");\n        ManualClock c6 = new ManualClock(0);\n        Scheduler s6 = new Scheduler(1, c6);\n        List<Long> rate6 = new ArrayList<>(), delay6 = new ArrayList<>();\n        s6.schedule(JobSpec.of(\"rate\", () -> { rate6.add(c6.nowMs()); c6.advance(300); }).every(new FixedRate(1_000)));\n        drive(s6, c6, 2_900, 50);\n        s6.cancel(\"rate\");\n        c6.set(10_000);\n        s6.schedule(JobSpec.of(\"delay\", () -> { delay6.add(c6.nowMs()); c6.advance(300); }).every(new FixedDelay(1_000)));\n        drive(s6, c6, 12_900, 50);\n        check(rate6.equals(List.of(0L, 1_000L, 2_000L)), \"fixed rate 1 s with 300 ms runs starts at \" + rate6 + \": no drift\");\n        check(delay6.equals(List.of(10_000L, 11_300L, 12_600L)), \"fixed delay 1 s starts at \" + delay6 + \": 1 s after each end\");\n\n        // 7. a run longer than its period: never two runs at once; the missed slots follow the Misfire rule\n        System.out.println(\"7. a run longer than its period\");\n        Scheduler s7 = new Scheduler(4, Clock.system());\n        s7.start();\n        AtomicInteger in7 = new AtomicInteger(), most7 = new AtomicInteger(), runs7 = new AtomicInteger();\n        String id7 = s7.scheduleAtFixedRate(() -> {\n            most7.accumulateAndGet(in7.incrementAndGet(), Math::max);\n            Thread.sleep(25);\n            in7.decrementAndGet();\n            runs7.incrementAndGet();\n        }, 0, 5);\n        Thread.sleep(300);\n        s7.cancel(id7);\n        s7.shutdown();\n        s7.awaitTermination(2_000);\n        check(most7.get() == 1 && runs7.get() >= 5, \"25 ms runs every 5 ms, 4 idle workers: \" + runs7.get() + \" runs, never two at once\");\n        check(misfireStarts(Misfire.RUN_ALL).equals(List.of(0L, 1_000L, 3_500L, 3_600L, 4_000L)), \"RUN_ALL: the missed 2 s and 3 s slots run back to back at 3.5 s and 3.6 s\");\n        check(misfireStarts(Misfire.RUN_ONCE).equals(List.of(0L, 1_000L, 3_500L, 4_000L)), \"RUN_ONCE: one run at 3.5 s stands in for both, then 4 s on time\");\n        check(misfireStarts(Misfire.SKIP).equals(List.of(0L, 1_000L, 4_000L)), \"SKIP: nothing late; the next run is the 4 s slot\");\n\n        // 8. retries: exponential backoff, then FAILED; jitter stays inside its bounds\n        System.out.println(\"8. retries with backoff\");\n        ManualClock c8 = new ManualClock(0);\n        Scheduler s8 = new Scheduler(1, c8);\n        List<Long> at8 = new ArrayList<>();\n        s8.schedule(JobSpec.of(\"flaky\", () -> { at8.add(c8.nowMs()); throw new IOException(\"down\"); })\n                .retry(new ExponentialBackoff(100, 10_000, 4, null)));\n        int[] tries8 = {0};\n        s8.schedule(JobSpec.of(\"sometimes\", () -> { if (++tries8[0] < 3) throw new IOException(\"busy\"); })\n                .retry(new ExponentialBackoff(100, 10_000, 4, null)));\n        drive(s8, c8, 2_000, 10);\n        check(at8.equals(List.of(0L, 100L, 300L, 700L)), \"four attempts at \" + at8 + \": waits of 100, 200, 400 ms\");\n        check(s8.status(\"flaky\") == JobState.FAILED, \"after the fourth failure it is FAILED, not retried again\");\n        check(tries8[0] == 3 && s8.status(\"sometimes\") == JobState.DONE, \"a job that fails twice then works ends DONE after 3 attempts\");\n        ExponentialBackoff jit = new ExponentialBackoff(100, 1_000, 10, new Random(1));\n        boolean inBounds = true;\n        for (int k = 1; k <= 9; k++)\n            for (int r = 0; r < 200; r++) {\n                long full = Math.min(1_000, 100L << (k - 1)), w = jit.delayMs(k, null);\n                inBounds &= w >= full / 2 && w <= full;\n            }\n        check(inBounds, \"with jitter every wait lies between half and all of 100, 200, 400 ..., capped at 1,000\");\n        check(jit.delayMs(10, null) == RetryPolicy.GIVE_UP, \"the tenth failure of a 10-attempt policy gives up\");\n\n        // 9. a job that throws, even an Error, kills neither its worker nor the dispatcher\n        System.out.println(\"9. a throwing job\");\n        Scheduler s9 = new Scheduler(1, Clock.system());\n        s9.start();\n        s9.schedule(JobSpec.of(\"boom\", () -> { throw new IllegalStateException(\"boom\"); }));\n        s9.schedule(JobSpec.of(\"overflow\", () -> { throw new StackOverflowError(); }));\n        CountDownLatch after9 = new CountDownLatch(1);\n        s9.schedule(JobSpec.of(\"after\", after9::countDown).in(20));\n        check(after9.await(2, TimeUnit.SECONDS), \"after an exception and an Error, the only worker still runs the next job\");\n        check(s9.status(\"boom\") == JobState.FAILED && s9.status(\"overflow\") == JobState.FAILED, \"both throwers are FAILED, with their errors recorded\");\n        CountDownLatch after9b = new CountDownLatch(1);\n        s9.schedule(JobSpec.of(\"bad-rule\", () -> {}).every((planned, ended) -> { throw new IllegalStateException(\"bad trigger\"); }));\n        s9.schedule(JobSpec.of(\"after-rule\", after9b::countDown).in(20));\n        check(after9b.await(2, TimeUnit.SECONDS) && s9.status(\"bad-rule\") == JobState.FAILED,\n              \"a Trigger that throws ends its job FAILED; it neither strands the job RUNNING nor kills the worker\");\n        s9.shutdown();\n        s9.awaitTermination(2_000);\n\n        // 10. which due job first: higher priority when workers are short; the rule is handed in\n        System.out.println(\"10. priority among due jobs\");\n        ManualClock c10 = new ManualClock(0);\n        Scheduler s10 = new Scheduler(1, c10);\n        List<String> order10 = new ArrayList<>();\n        s10.schedule(JobSpec.of(\"low\", () -> order10.add(\"low\")).in(10).priority(1));\n        s10.schedule(JobSpec.of(\"high\", () -> order10.add(\"high\")).in(20).priority(9));\n        s10.schedule(JobSpec.of(\"mid\", () -> order10.add(\"mid\")).in(30).priority(5));\n        c10.set(100);\n        drive(s10, c10, 100, 1);\n        check(order10.equals(List.of(\"high\", \"mid\", \"low\")), \"three due at once, one worker: \" + order10);\n        order10.clear();\n        s10.configure(Scheduler.BY_DUE);                            // a different rule, handed in\n        s10.schedule(JobSpec.of(\"low2\", () -> order10.add(\"low2\")).in(10).priority(1));\n        s10.schedule(JobSpec.of(\"high2\", () -> order10.add(\"high2\")).in(20).priority(9));\n        c10.set(200);\n        drive(s10, c10, 200, 1);\n        check(order10.equals(List.of(\"low2\", \"high2\")), \"with the earliest-due rule handed in: \" + order10);\n\n        // 11. prerequisites: a job starts only after all of them are DONE; two finishing together release it once\n        System.out.println(\"11. prerequisites\");\n        ManualClock c11 = new ManualClock(0);\n        Scheduler s11 = new Scheduler(1, c11);\n        List<String> order11 = new ArrayList<>();\n        JobState[] deployWhenAEnded = new JobState[1];\n        s11.scheduleAll(List.of(\n                JobSpec.of(\"deploy\", () -> order11.add(\"deploy\")).after(\"build-a\", \"build-b\"),\n                JobSpec.of(\"build-a\", () -> order11.add(\"build-a\")),\n                JobSpec.of(\"build-b\", () -> { deployWhenAEnded[0] = s11.status(\"deploy\"); order11.add(\"build-b\"); })));\n        drive(s11, c11, 50, 1);\n        check(order11.equals(List.of(\"build-a\", \"build-b\", \"deploy\")), \"deploy ran last: \" + order11);\n        check(deployWhenAEnded[0] == JobState.BLOCKED, \"with one of two prerequisites done, deploy was still BLOCKED\");\n        int rounds = 30, lateOrTwice = 0;\n        for (int round = 0; round < rounds; round++) {\n            Scheduler r = new Scheduler(8, Clock.system());\n            r.start();\n            CyclicBarrier together = new CyclicBarrier(8);\n            AtomicLong lastEnd = new AtomicLong();\n            AtomicInteger deployRuns = new AtomicInteger();\n            long[] deployStart = new long[1];\n            List<JobSpec> batch = new ArrayList<>();\n            String[] pre = new String[8];\n            for (int p = 0; p < 8; p++) {\n                pre[p] = \"p\" + p;\n                batch.add(JobSpec.of(pre[p], () -> { together.await(); lastEnd.accumulateAndGet(System.nanoTime(), Math::max); }));\n            }\n            CountDownLatch deployed = new CountDownLatch(1);\n            batch.add(JobSpec.of(\"deploy\", () -> { deployStart[0] = System.nanoTime(); deployRuns.incrementAndGet(); deployed.countDown(); }).after(pre));\n            r.scheduleAll(batch);\n            deployed.await(5, TimeUnit.SECONDS);\n            r.shutdown();\n            r.awaitTermination(5_000);\n            if (deployRuns.get() != 1 || deployStart[0] < lastEnd.get()) lateOrTwice++;\n        }\n        check(lateOrTwice == 0, rounds + \" rounds of 8 prerequisites finishing together: deploy ran exactly once each time, after all 8\");\n\n        // 12. a failed prerequisite skips everything behind it; other jobs still run\n        System.out.println(\"12. a failed prerequisite\");\n        ManualClock c12 = new ManualClock(0);\n        Scheduler s12 = new Scheduler(2, c12);\n        List<String> ran12 = new ArrayList<>();\n        s12.scheduleAll(List.of(\n                JobSpec.of(\"migrate\", () -> { throw new IllegalStateException(\"schema lock\"); }),\n                JobSpec.of(\"deploy\", () -> ran12.add(\"deploy\")).after(\"migrate\"),\n                JobSpec.of(\"smoke\", () -> ran12.add(\"smoke\")).after(\"deploy\"),\n                JobSpec.of(\"notify\", () -> ran12.add(\"notify\")).after(\"migrate\"),\n                JobSpec.of(\"lint\", () -> ran12.add(\"lint\"))));\n        drive(s12, c12, 50, 1);\n        check(s12.status(\"migrate\") == JobState.FAILED, \"migrate FAILED\");\n        check(s12.status(\"deploy\") == JobState.SKIPPED && s12.status(\"smoke\") == JobState.SKIPPED\n              && s12.status(\"notify\") == JobState.SKIPPED, \"deploy, smoke (two steps behind) and notify were SKIPPED\");\n        check(ran12.equals(List.of(\"lint\")), \"lint, which waits for nothing, still ran: \" + ran12);\n        s12.schedule(JobSpec.of(\"rollback-report\", () -> ran12.add(\"late\")).after(\"migrate\"));\n        check(s12.status(\"rollback-report\") == JobState.SKIPPED, \"a job submitted later, waiting for the failed one, is SKIPPED at once\");\n\n        // 13. a batch with a cycle is refused with its path, and nothing from it is kept\n        System.out.println(\"13. cycles and bad prerequisites are refused at submit\");\n        ManualClock c13 = new ManualClock(0);\n        Scheduler s13 = new Scheduler(1, c13);\n        String msg = \"\";\n        try {\n            s13.scheduleAll(List.of(JobSpec.of(\"x\", () -> {}).after(\"z\"), JobSpec.of(\"y\", () -> {}).after(\"x\"),\n                                    JobSpec.of(\"z\", () -> {}).after(\"y\"), JobSpec.of(\"w\", () -> {})));\n        } catch (IllegalArgumentException e) { msg = e.getMessage(); }\n        check(msg.contains(\"x -> z -> y -> x\"), \"refused with the path: \" + msg);\n        check(s13.status(\"w\") == null && s13.counts().values().stream().mapToInt(Integer::intValue).sum() == 0,\n              \"all or nothing: not even w, which had no cycle, was kept\");\n        boolean unknown = false, recurring = false, self = false;\n        try { s13.schedule(JobSpec.of(\"a\", () -> {}).after(\"ghost\")); } catch (IllegalArgumentException e) { unknown = true; }\n        s13.schedule(JobSpec.of(\"tick\", () -> {}).every(new FixedRate(1_000)));\n        try { s13.schedule(JobSpec.of(\"b\", () -> {}).after(\"tick\")); } catch (IllegalArgumentException e) { recurring = true; }\n        try { s13.schedule(JobSpec.of(\"me\", () -> {}).after(\"me\")); } catch (IllegalArgumentException e) { self = true; }\n        check(unknown && recurring && self, \"an unknown prerequisite, a recurring one, and a job waiting for itself are all refused\");\n        List<JobSpec> chain = new ArrayList<>();\n        for (int i = 0; i < 20_000; i++) chain.add(i == 0 ? JobSpec.of(\"s0\", () -> {}) : JobSpec.of(\"s\" + i, () -> {}).after(\"s\" + (i - 1)));\n        check(s13.scheduleAll(chain).size() == 20_000, \"a chain of 20,000 jobs is accepted: the check is a loop, not recursion\");\n        List<JobSpec> loop = new ArrayList<>();\n        for (int i = 0; i < 20_000; i++) loop.add(JobSpec.of(\"q\" + i, () -> {}).after(\"q\" + ((i + 1) % 20_000)));\n        boolean bigCycle = false;\n        try { s13.scheduleAll(loop); } catch (IllegalArgumentException e) { bigCycle = e.getMessage().startsWith(\"cycle\"); }\n        check(bigCycle, \"a cycle through 20,000 jobs is found without a stack overflow\");\n\n        // 14. graceful shutdown: one-shots finish, recurring jobs stop, new jobs are refused\n        System.out.println(\"14. shutdown()\");\n        Scheduler s14 = new Scheduler(2, Clock.system());\n        s14.start();\n        CountDownLatch later14 = new CountDownLatch(1);\n        AtomicInteger ticks14 = new AtomicInteger();\n        s14.schedule(JobSpec.of(\"later\", later14::countDown).in(150));\n        s14.schedule(JobSpec.of(\"tick\", ticks14::incrementAndGet).every(new FixedRate(10)));\n        Thread.sleep(50);\n        s14.shutdown();\n        boolean refused14 = false;\n        try { s14.schedule(() -> {}, 0); } catch (RejectedExecutionException e) { refused14 = true; }\n        boolean ended14 = s14.awaitTermination(3_000);\n        check(later14.getCount() == 0 && ended14, \"the job due in 150 ms still ran after shutdown(), then the threads ended\");\n        int t14 = ticks14.get();\n        Thread.sleep(40);\n        check(ticks14.get() == t14 && s14.status(\"tick\") == JobState.CANCELLED, \"the recurring job stopped and is CANCELLED\");\n        check(refused14, \"a new job after shutdown() is refused\");\n\n        // 15. shutdownNow: returns what never started, interrupts what runs, ends at once\n        System.out.println(\"15. shutdownNow()\");\n        Scheduler s15 = new Scheduler(1, Clock.system());\n        s15.start();\n        CountDownLatch sleeping = new CountDownLatch(1);\n        AtomicBoolean interrupted15 = new AtomicBoolean();\n        s15.schedule(JobSpec.of(\"sleeper\", () -> {\n            sleeping.countDown();\n            try { Thread.sleep(10_000); } catch (InterruptedException e) { interrupted15.set(true); throw e; }\n        }));\n        s15.schedule(JobSpec.of(\"far\", () -> {}).in(60_000));\n        s15.schedule(JobSpec.of(\"queued\", () -> {}).in(0));        // due, but the only worker is busy\n        s15.scheduleAll(List.of(JobSpec.of(\"report\", () -> {}).after(\"sleeper\"),        // a chain waiting behind the sleeper\n                                JobSpec.of(\"email\", () -> {}).after(\"report\")));\n        sleeping.await();\n        long t15 = System.nanoTime();\n        List<String> never = s15.shutdownNow();\n        boolean ended15 = s15.awaitTermination(2_000);\n        long ms15 = (System.nanoTime() - t15) / 1_000_000;\n        check(new HashSet<>(never).equals(Set.of(\"far\", \"queued\", \"report\", \"email\")), \"it returned the four jobs that never started: \" + never);\n        check(interrupted15.get() && ended15 && ms15 < 1_500, \"the sleeping job was interrupted and every thread ended in \" + ms15 + \" ms\");\n        check(s15.status(\"sleeper\") == JobState.CANCELLED && s15.status(\"far\") == JobState.CANCELLED\n              && s15.status(\"report\") == JobState.CANCELLED && s15.status(\"email\") == JobState.CANCELLED,\n              \"all of them are CANCELLED, including a chain of waiting jobs (none half-cancelled, half-skipped)\");\n\n        // 16. listeners hear after the lock is released; a broken one changes nothing; the counts add up\n        System.out.println(\"16. listeners and counts\");\n        ManualClock c16 = new ManualClock(0);\n        Scheduler s16 = new Scheduler(2, c16);\n        AtomicBoolean lockFree = new AtomicBoolean(true);\n        List<RunRecord> heard = Collections.synchronizedList(new ArrayList<>());\n        s16.addListener(r -> { throw new IllegalStateException(\"broken dashboard\"); });\n        s16.addListener(r -> {\n            Thread other = new Thread(s16::counts);               // would block if the lock were still held\n            other.start();\n            try { other.join(1_000); } catch (InterruptedException e) { return; }\n            if (other.isAlive()) lockFree.set(false);\n            heard.add(r);\n        });\n        s16.schedule(JobSpec.of(\"ok\", () -> {}));\n        s16.schedule(JobSpec.of(\"bad\", () -> { throw new IOException(\"disk full\"); }));\n        s16.schedule(JobSpec.of(\"never\", () -> {}).in(1_000));\n        s16.cancel(\"never\");\n        drive(s16, c16, 10, 1);\n        check(lockFree.get() && heard.size() == 3, \"3 records heard, each after the lock was released, despite a listener that throws\");\n        Map<JobState, Integer> n16 = s16.counts();\n        check(n16.get(JobState.DONE) == 1 && n16.get(JobState.FAILED) == 1 && n16.get(JobState.CANCELLED) == 1\n              && n16.values().stream().mapToInt(Integer::intValue).sum() == 3, \"counts: \" + n16);\n\n        System.out.println(failed == 0 ? \"ALL PASS\" : failed + \" FAILED\");\n        System.exit(failed == 0 ? 0 : 1);\n    }\n}\n"};
function wireCopy(root){root.querySelectorAll('button.copy').forEach(b=>{b.onclick=()=>{const key=b.dataset.key;const txt=key?RAW[key]:b.closest('.ed').querySelector('code').textContent;navigator.clipboard.writeText(txt).then(()=>{b.textContent='copied';setTimeout(()=>b.textContent='copy',1500);});};});}
const KW=/\b(abstract|boolean|break|case|catch|class|continue|default|do|double|else|enum|extends|final|finally|for|if|implements|import|int|interface|long|new|null|package|private|protected|public|return|static|super|switch|synchronized|this|throw|throws|try|void|while|var|record|true|false)\b/g;
const TY=/\b([A-Z][A-Za-z0-9]*)\b/g;
function hl(src){let inDoc=false;return src.split('\n').map((l,i)=>{let e=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const t=e.trim();let out;if(inDoc||t.startsWith('/**')){out='<span class="d">'+e+'</span>';if(t.startsWith('/**'))inDoc=!t.endsWith('*/');else if(t.endsWith('*/'))inDoc=false;}else{const parts=e.split(/(\/\/.*$|"(?:[^"\\]|\\.)*")/);out=parts.map((p,j)=>j%2?(p.startsWith('//')?'<span class="c">'+p+'</span>':'<span class="s">'+p+'</span>'):p.replace(KW,'<span class="k">$1</span>').replace(TY,'<span class="t">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>')).join('');}return '<span class="ln">'+(i+1)+'</span>'+out;}).join('\n');}
let cur=parseInt(localStorage.getItem('job-scheduler.step')||'1',10);
const side=document.getElementById('side'),study=document.getElementById('study');
function classesSoFar_unused(n){const out=[];STEPS.filter(s=>s.id<=n&&s.code).forEach(s=>{(s.code.match(/(?:class|interface|enum)\s+([A-Z]\w*)/g)||[]).forEach(m=>out.push({name:m.split(/\s+/)[1],step:s.id}));});return out;}
function render(){
  side.innerHTML='';let g='';STEPS.forEach(s=>{if(s.stage!==g){g=s.stage;side.insertAdjacentHTML('beforeend','<div class="grp">'+g+'</div>');}side.insertAdjacentHTML('beforeend','<div class="st'+(s.id===cur?' on':s.id<cur?' done':'')+'" data-id="'+s.id+'"><span class="n">'+String(s.id).padStart(2,'0')+'</span><span>'+s.title+'</span></div>');});
  const s=STEPS[cur-1];
  study.innerHTML='<div class="hdr"><span class="stage">'+s.stage+'</span><h2>'+String(s.id).padStart(2,'0')+' &middot; '+s.title+'</h2></div>'+(s.think?'<div class="think">'+s.think+'</div>':'')+(s.body||'')+(s.code?'<div class="ed"><div class="tab"><b>'+(s.file||'Main.java')+'</b><button class="copy" data-src="ed">copy</button></div><pre><code class="java">'+hl(s.code)+'</code></pre></div>':'')+'<div class="nav"><button id="prev">&larr; prev</button><button id="next" class="pri">next &rarr;</button></div>';
  study.querySelectorAll('pre code.java').forEach(el=>{el.innerHTML=hl(el.textContent);});wireCopy(study);wireTimers(study);const miss=document.getElementById('miss');if(miss){try{miss.value=localStorage.getItem('job-scheduler.miss')||'';}catch(e){}miss.addEventListener('input',()=>{try{localStorage.setItem('job-scheduler.miss',miss.value);}catch(e){}});}
  document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
  document.querySelector('.wrap').classList.toggle('wide',!!s.wide);document.querySelector('.wrap').classList.toggle('code',!!s.code);localStorage.setItem('job-scheduler.step',cur);study.scrollIntoView();
}
function go(n){if(n<1||n>STEPS.length)return;cur=n;setMode('study');render();}
side.addEventListener('click',e=>{const t=e.target.closest('.st');if(t)go(+t.dataset.id);});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
const main=document.getElementById('main');
function setMode(m){}
function wireTimers(root){root.querySelectorAll('button.timer[data-min]').forEach(b=>{const total=+b.dataset.min*60;let left=total,id=null;const show=()=>{b.textContent=(id?'':'start ')+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');};b.onclick=()=>{if(id){clearInterval(id);id=null;b.classList.remove('run');show();return;}if(left<=0)left=total;b.classList.remove('done');b.classList.add('run');id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;b.classList.remove('run');b.classList.add('done');b.textContent='time -- open the fold';}},1000);show();};show();});}
render();
</script></body></html>

lder) {\n        lock.lock();\n        try { sweep(); return holds.remove(holder) != null; } finally { lock.unlock(); }\n    }\n    /** Put back every unit whose hold has run out. Called on every entry point, under the lock; no timer thread needed. */\n    private void sweep() {\n        long now = clock.nowMs();\n        Iterator<Map.Entry<String, Hold>> it = holds.entrySet().iterator();\n        while (it.hasNext()) {\n            Hold h = it.next().getValue();\n            if (h.expiresAtMs() <= now) { inventory.slot(h.code()).refill(1); it.remove(); }\n        }\n    }\n}\n\n// ---- ext: a coin slot per panel ----------------------------------------------------------------------\n/**\n * The machine in Main.java has ONE coin slot, so one escrow list is the whole truth: the coins inside it\n * belong to whoever is standing there. A machine with two coin slots needs one escrow PER panel, or panel\n * one's twenty rupees pays for panel two's Coke. Only the money in flight splits: the stock and the float\n * stay behind the machine's single lock, because the thing being fought over is the last unit, not the coins.\n */\nfinal class PanelEscrow {\n    private final Map<String, List<Coin>> byPanel = new HashMap<>();\n    private final ReentrantLock lock = new ReentrantLock();\n\n    /** Push a coin in at one panel. */\n    void insert(String panel, Coin c) {\n        lock.lock();\n        try { byPanel.computeIfAbsent(panel, p -> new ArrayList<>()).add(c); } finally { lock.unlock(); }\n    }\n    /** What that panel is holding, in paise. */\n    int paise(String panel) {\n        lock.lock();\n        try { return Coin.total(byPanel.getOrDefault(panel, List.of())); } finally { lock.unlock(); }\n    }\n    /** Take that panel's coins out to pay with. Every other panel's money is untouched. */\n    List<Coin> take(String panel) {\n        lock.lock();\n        try { List<Coin> c = byPanel.remove(panel); return c == null ? List.of() : List.copyOf(c); }\n        finally { lock.unlock(); }\n    }\n}\n\n// ---- ext: operator console ---------------------------------------------------------------------------\n/** What an operator is allowed to do, separate from the customer's four buttons. */\ninterface OperatorConsole {\n    /** Every column's count. */\n    Map<String, Integer> stock();\n    /** What the coin float is worth, in paise. */\n    int cashPaise();\n    /** Refill a column; returns how many went in. */\n    int restock(String code, int n);\n}\n\n/** The operator role, implemented by delegating to the machine's existing reads and refills. */\nfinal class MachineConsole implements OperatorConsole {\n    private final VendingMachine vm;\n\n    MachineConsole(VendingMachine vm) { this.vm = vm; }\n    /** Every column's count. */\n    public Map<String, Integer> stock() { return vm.stockCounts(); }\n    /** What the coin float is worth. */\n    public int cashPaise() { return vm.floatPaise(); }\n    /** Refill a column. */\n    public int restock(String code, int n) { return vm.restock(code, n); }\n}\n\n/** Telemetry: counts sales per column from the same events the screen listens to. Read-side only. */\nfinal class Telemetry implements MachineObserver {\n    final Map<String, Integer> salesPerSlot = Collections.synchronizedMap(new TreeMap<>());   // two sales can report at once\n    /** Count a sale. */\n    public void onEvent(MachineEvent e) {\n        if (e.kind().equals(\"SOLD\")) salesPerSlot.merge(e.slotCode(), 1, Integer::sum);\n    }\n}\n\n/** Pages the operator when the float drops below the floor where change starts failing. */\nfinal class LowCashAlert implements MachineObserver {\n    private final int floorPaise;\n    final List<String> alerts = Collections.synchronizedList(new ArrayList<>());\n\n    LowCashAlert(int floorPaise) { this.floorPaise = floorPaise; }\n    /** Raise one alert per event that crosses the floor. */\n    public void onEvent(MachineEvent e) {\n        if (e.floatPaise() < floorPaise) alerts.add(\"float below \" + Main.rs(floorPaise) + \": \" + Main.rs(e.floatPaise()));\n    }\n}\n\n// ---- ext: persistence --------------------------------------------------------------------------------\n/** Everything about a machine worth surviving a power cut. */\nrecord MachineSnapshot(Map<Coin, Integer> coins, Map<String, Integer> stock) {}\n\n/**\n * The seam that makes the machine outlive its process. The machine's flow does not change: the maps it\n * writes under the lock are simply loaded at boot and saved after each commit.\n */\ninterface MachineRepository {\n    /** Write the whole snapshot for one machine. */\n    void save(String machineId, MachineSnapshot snap);\n    /** Read it back, or null when this machine has never been saved. */\n    MachineSnapshot load(String machineId);\n}\n\n/**\n * The in-memory implementation, which is all a test needs. The database version replaces the slot\n * decrement with a conditional update, which is the same idea as the lock:\n *   UPDATE slot SET qty = qty - 1 WHERE machine = ? AND code = ? AND qty > 0;\n *   -- 1 row updated = you got the unit, 0 rows = another machine's terminal got it\n */\nfinal class InMemoryMachineRepository implements MachineRepository {\n    private final Map<String, MachineSnapshot> rows = new HashMap<>();\n\n    /** Store a copy so a later mutation cannot change what was saved. */\n    public void save(String machineId, MachineSnapshot snap) {\n        rows.put(machineId, new MachineSnapshot(new EnumMap<>(snap.coins()), new TreeMap<>(snap.stock())));\n    }\n    /** Read it back. */\n    public MachineSnapshot load(String machineId) { return rows.get(machineId); }\n}\n\n// ---- ext: motor outside the lock ---------------------------------------------------------------------\n/**\n * Rung one of the ladder: get the two-second motor out of the critical section. The unit is RESERVED under\n * a very short lock, the coil turns with the lock released, and a second short section either commits the\n * reservation or puts it back. Nobody can oversell, and two columns no longer wait for each other.\n */\nfinal class ReservingColumn {\n    private final String code;\n    private final Dispenser motor;\n    private final ReentrantLock lock = new ReentrantLock();\n    private int qty;\n    private int reserved;\n\n    ReservingColumn(String code, int qty, Dispenser motor) { this.code = code; this.qty = qty; this.motor = motor; }\n    /** Reserve, drop outside the lock, then commit or give the reservation back. */\n    boolean sell() {\n        lock.lock();\n        try {\n            if (qty - reserved <= 0) return false;\n            reserved++;                                   // ~0.2 us of lock, not two seconds\n        } finally { lock.unlock(); }\n        boolean dropped;\n        try { dropped = motor.drop(code); } catch (RuntimeException jam) { dropped = false; }\n        lock.lock();\n        try {\n            reserved--;\n            if (dropped) qty--;\n            return dropped;\n        } finally { lock.unlock(); }\n    }\n    /** What is left, reservations included. */\n    int available() { lock.lock(); try { return qty - reserved; } finally { lock.unlock(); } }\n}\n\n// ---- ext: a claim without a lock ---------------------------------------------------------------------\n/**\n * Rung three: the count itself decides the winner, with no lock at all. compareAndSet is the hardware's\n * version of \"read and write as one step\", and it is exactly what the SQL conditional update does.\n */\nfinal class CasColumn {\n    private final AtomicInteger qty;\n\n    CasColumn(int qty) { this.qty = new AtomicInteger(qty); }\n    /** Take one unit, or false when there is none. Losers of a race simply try again. */\n    boolean claim() {\n        while (true) {\n            int n = qty.get();\n            if (n == 0) return false;\n            if (qty.compareAndSet(n, n - 1)) return true;\n        }\n    }\n    /** Put a unit back after a jam. */\n    void giveBack() { qty.incrementAndGet(); }\n    /** What is left. */\n    int left() { return qty.get(); }\n}\n\n// ---- ext: a mode with behaviour of its own -----------------------------------------------------------\n/**\n * When a mode stops being \"which actions are legal\" and grows behaviour of its own, promote the row in the\n * table to a class. This is the shape: each mode answers for itself and names the mode it returns to.\n */\ninterface Mode {\n    /** The name shown on the screen. */\n    String label();\n    /** Is this action legal here? */\n    boolean allows(Action a);\n    /** The mode after this action. */\n    Mode after(Action a);\n}\n\n/** Out of service, with a memory: it knows which mode to hand back to, and it still lets a customer cancel. */\nfinal class MaintenanceMode implements Mode {\n    private final Mode resumeTo;\n\n    MaintenanceMode(Mode resumeTo) { this.resumeTo = resumeTo; }\n    /** The name shown on the screen. */\n    public String label() { return \"OUT OF SERVICE\"; }\n    /** Only the coin return works: never strand a customer who already paid. */\n    public boolean allows(Action a) { return a == Action.CANCEL || a == Action.COLLECT || a == Action.SERVICE; }\n    /** SERVICE hands back to the mode this one interrupted; everything else stays here. */\n    public Mode after(Action a) { return a == Action.SERVICE ? resumeTo : this; }\n}\n\n/** The ordinary idle mode, so MaintenanceMode has something to resume to. */\nfinal class IdleMode implements Mode {\n    /** The name shown on the screen. */\n    public String label() { return \"INSERT COIN\"; }\n    /** Everything except selecting, which needs money first. */\n    public boolean allows(Action a) { return a != Action.SELECT; }\n    /** Idle stays idle unless an operator takes the machine away. */\n    public Mode after(Action a) { return this; }\n}\n\n// ---- ext: columns from config ------------------------------------------------------------------------\n/**\n * Where a Factory finally pays: columns that arrive as strings from a planogram file, so adding a product\n * is a line of configuration and not a line of code.\n */\nfinal class SlotFactory {\n    /** \"A1|LAY|Lays|2000|8|3\" -> a Slot with that code, product, capacity and starting count. */\n    static Slot fromConfig(String line) {\n        String[] p = line.split(\"\\\\|\");\n        return new Slot(p[0], new Product(p[1], p[2], Integer.parseInt(p[3])),\n                        Integer.parseInt(p[4]), Integer.parseInt(p[5]));\n    }\n}\n\n/** Runs every extension once, so the page's follow-up code is code that has actually executed. */\nclass ExtDemo {\n    /** A tiny inventory for the extensions that do not need a whole machine. */\n    static Inventory shelf() {\n        Inventory inv = new Inventory();\n        inv.addSlot(SlotFactory.fromConfig(\"A1|LAY|Lays|2000|8|2\"));\n        inv.addSlot(SlotFactory.fromConfig(\"A2|COK|Coke|3500|8|1\"));\n        return inv;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(\"-- card payment: charge, then drop, then take the stock down\");\n        Inventory inv = shelf();\n        CardTerminal good = new CardTerminal() {\n            public boolean charge(String saleId, int paise) { return true; }\n            public boolean refund(String saleId) { System.out.println(\"   refunded \" + saleId + \" to the card\"); return true; }\n        };\n        CardCheckout ok = new CardCheckout(inv, new Motor(), good);\n        System.out.println(\"   \" + ok.buy(\"A1\", 2000).status() + \"; A1 left \" + inv.slot(\"A1\").qty());\n\n        System.out.println(\"-- the motor jams AFTER the card was charged: the money goes back, stock untouched\");\n        CardCheckout jam = new CardCheckout(inv, code -> false, good);\n        System.out.println(\"   \" + jam.buy(\"A1\", 2000).status() + \"; A1 left \" + inv.slot(\"A1\").qty());\n\n        System.out.println(\"-- the exact-change lamp: ask before the customer commits\");\n        VendingMachine vm = Main.stocked();\n        ChangeAdvisor advisor = new ChangeAdvisor(new BackoffChange());\n        System.out.println(\"   B1 with Rs 30 (Rs 5 change needed): \" + advisor.canComplete(vm, \"B1\", List.of(Coin.R20, Coin.R10)));\n        VendingMachine bare = new VendingMachine();\n        bare.addSlot(new Slot(\"B1\", new Product(\"DMK\", \"Dairy Milk\", 2500), 8, 3));\n        System.out.println(\"   B1 with Rs 40 on an empty float: \" + advisor.canComplete(bare, \"B1\", List.of(Coin.R20, Coin.R20)));\n\n        System.out.println(\"-- non-canonical change: the DP finds what greedy misses\");\n        Map<Coin, Integer> lopsided = new EnumMap<>(Map.of(Coin.R5, 1, Coin.R2, 3));\n        System.out.println(\"   greedy: \" + new GreedyChange().plan(lopsided, 600)\n                           + \"   backoff: \" + new BackoffChange().plan(lopsided, 600)\n                           + \"   dp: \" + new DpChange().plan(lopsided, 600));\n\n        System.out.println(\"-- hold and pay, with an expiry driven by the injected clock\");\n        long[] now = { 1_000_000L };\n        Inventory held = shelf();\n        HoldDesk desk = new HoldDesk(held, () -> now[0], 30_000);\n        System.out.println(\"   hold A2: \" + (desk.hold(\"A2\", \"ravi\") != null) + \"; A2 left \" + held.slot(\"A2\").qty());\n        System.out.println(\"   a second customer can hold A2: \" + (desk.hold(\"A2\", \"meera\") != null));\n        now[0] += 31_000;                                  // thirty-one seconds later, no sleeping\n        System.out.println(\"   ravi pays after the expiry: \" + desk.pay(\"ravi\") + \"; A2 back to \" + held.slot(\"A2\").qty());\n\n        System.out.println(\"-- two coin slots: one escrow per panel, so two customers' money never mixes\");\n        PanelEscrow wallets = new PanelEscrow();\n        wallets.insert(\"P1\", Coin.R20); wallets.insert(\"P2\", Coin.R10); wallets.insert(\"P1\", Coin.R10);\n        System.out.println(\"   P1 holds \" + Main.rs(wallets.paise(\"P1\")) + \", P2 holds \" + Main.rs(wallets.paise(\"P2\")));\n        VendingMachine shared = Main.stocked();\n        System.out.println(\"   P1 buys B1 with its own coins: \" + shared.purchase(\"B1\", wallets.take(\"P1\")).item().name()\n                           + \"; P2 still holds \" + Main.rs(wallets.paise(\"P2\")));\n\n        System.out.println(\"-- the operator console and telemetry, off the same events\");\n        Telemetry tele = new Telemetry();\n        LowCashAlert cash = new LowCashAlert(15_000);\n        vm.addObserver(tele);\n        vm.addObserver(cash);\n        vm.purchase(\"A1\", List.of(Coin.R20));\n        vm.purchase(\"B1\", List.of(Coin.R20, Coin.R10));\n        OperatorConsole console = new MachineConsole(vm);\n        System.out.println(\"   sales \" + tele.salesPerSlot + \"; stock \" + console.stock()\n                           + \"; cash \" + Main.rs(console.cashPaise()) + \"; alert: \" + cash.alerts.get(cash.alerts.size() - 1));\n        System.out.println(\"   restock A1 by 5: \" + console.restock(\"A1\", 5) + \" went in -> \" + console.stock());\n\n        System.out.println(\"-- persistence: save the float and the counts, load them back\");\n        MachineRepository repo = new InMemoryMachineRepository();\n        repo.save(\"VM-01\", new MachineSnapshot(vm.floatSnapshot(), vm.stockCounts()));\n        MachineSnapshot back = repo.load(\"VM-01\");\n        System.out.println(\"   loaded stock \" + back.stock() + \", coins \" + back.coins());\n\n        System.out.println(\"-- rung one: the motor outside the lock\");\n        ReservingColumn col = new ReservingColumn(\"A1\", 1, new Motor());\n        System.out.println(\"   first sell \" + col.sell() + \", second sell \" + col.sell() + \", left \" + col.available());\n        ReservingColumn jammed = new ReservingColumn(\"A1\", 1, code -> false);\n        System.out.println(\"   a jam gives the reservation back: sold \" + jammed.sell() + \", left \" + jammed.available());\n\n        System.out.println(\"-- rung three: the count decides the winner, no lock\");\n        CasColumn cas = new CasColumn(1);\n        System.out.println(\"   claim \" + cas.claim() + \", claim again \" + cas.claim() + \", left \" + cas.left());\n\n        System.out.println(\"-- a mode that grew behaviour becomes a class\");\n        Mode mode = new MaintenanceMode(new IdleMode());\n        System.out.println(\"   \" + mode.label() + \": insert allowed \" + mode.allows(Action.INSERT)\n                           + \", cancel allowed \" + mode.allows(Action.CANCEL)\n                           + \", after service -> \" + mode.after(Action.SERVICE).label());\n    }\n}\n", "f2": "import java.util.*;\nimport java.util.concurrent.*;\n\n/**\n * Fourteen claims the design makes, each proven by a few lines. Run it with\n * javac Main.java Extensions.java FailureTests.java && java FailureTests\n * It prints ALL PASS, or the first failure and a non-zero exit code.\n */\npublic class FailureTests {\n    static int failed = 0;\n\n    /** Record one claim. Prints ok or FAIL with the claim's name. */\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? \"  ok   \" : \"  FAIL \") + what);\n        if (!ok) failed++;\n    }\n\n    /** A machine with one column and a float big enough to make change. */\n    static VendingMachine machine(int qty) {\n        VendingMachine vm = new VendingMachine();\n        vm.addSlot(new Slot(\"B1\", new Product(\"DMK\", \"Dairy Milk\", 2500), 8, qty));\n        vm.loadFloat(Coin.R1, 10);\n        vm.loadFloat(Coin.R2, 10);\n        vm.loadFloat(Coin.R5, 6);\n        vm.loadFloat(Coin.R10, 4);\n        return vm;\n    }\n\n    public static void main(String[] args) throws Exception {\n        // 1. two terminals press for the last unit: exactly one item leaves, and no paise is lost\n        System.out.println(\"1. forty panels, one unit left\");\n        VendingMachine race = machine(1);\n        int floatBefore = race.floatPaise();\n        int panels = 40;\n        CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(panels);\n        List<Outcome> out = Collections.synchronizedList(new ArrayList<>());\n        for (int i = 0; i < panels; i++)\n            new Thread(() -> {\n                try { go.await(); out.add(race.purchase(\"B1\", List.of(Coin.R20, Coin.R10))); }\n                catch (Exception e) { /* counted as no sale */ }\n                finally { done.countDown(); }\n            }).start();\n        go.countDown();\n        done.await();\n        long sold = out.stream().filter(o -> o.item() != null).count();\n        int handedBack = out.stream().filter(o -> o.item() == null).mapToInt(Outcome::paise).sum();\n        check(sold == 1, \"exactly one panel got the item, \" + (panels - 1) + \" were refused\");\n        check(race.qty(\"B1\") == 0, \"the column ended at zero, never below\");\n        check(handedBack == (panels - 1) * 3000, \"every refused panel got its whole Rs 30 back\");\n        check(race.floatPaise() == floatBefore + 2500, \"the float grew by exactly one price, Rs 25\");\n\n        // 2. the float cannot make change: refuse, refund in full, touch nothing\n        System.out.println(\"2. the float cannot make change\");\n        VendingMachine lop = new VendingMachine();\n        lop.addSlot(new Slot(\"B1\", new Product(\"DMK\", \"Dairy Milk\", 2500), 8, 3));\n        lop.loadFloat(Coin.R10, 1);                                   // Rs 15 change is impossible\n        lop.insertCoin(Coin.R20);\n        lop.insertCoin(Coin.R20);\n        Outcome refused = lop.select(\"B1\");\n        check(refused.status() == Status.NO_CHANGE, \"the sale is refused, not half done\");\n        check(Coin.total(refused.coins()) == 4000, \"the whole Rs 40 is refunded\");\n        check(lop.qty(\"B1\") == 3, \"stock is exactly what it was\");\n        check(lop.floatPaise() == 1000, \"the float is exactly what it was\");\n        check(lop.state() == MachineState.IDLE, \"the machine is idle again\");\n\n        // 3. the coin return hands back exactly the coins that went in\n        System.out.println(\"3. cancel\");\n        VendingMachine cancel = machine(1);\n        cancel.insertCoin(Coin.R10);\n        cancel.insertCoin(Coin.R2);\n        cancel.insertCoin(Coin.R2);\n        List<Coin> back = cancel.cancel();\n        check(back.equals(List.of(Coin.R10, Coin.R2, Coin.R2)), \"the same three coins, same denominations\");\n        check(cancel.escrowPaise() == 0, \"nothing is left in escrow\");\n        check(cancel.collect().paise() == 1400, \"and the same Rs 14 is in the tray\");\n\n        // 4. the motor jams: nothing dispensed, everything refunded, no stock lost\n        System.out.println(\"4. the motor jams\");\n        VendingMachine jam = machine(3);\n        jam.configure(new ListPrice(), new BackoffChange(), code -> false);\n        int floatWas = jam.floatPaise();\n        jam.insertCoin(Coin.R20);\n        jam.insertCoin(Coin.R10);\n        Outcome jammed = jam.select(\"B1\");\n        check(jammed.status() == Status.JAMMED, \"the press reports a jam\");\n        check(Coin.total(jammed.coins()) == 3000, \"the whole Rs 30 is refunded\");\n        check(jam.qty(\"B1\") == 3, \"no unit was taken off the coil\");\n        check(jam.floatPaise() == floatWas, \"the float never moved\");\n\n        // 5. restocking, and the pager that fires when a column hits zero\n        System.out.println(\"5. restock and the empty-column alert\");\n        VendingMachine stock = machine(1);\n        RestockAlert pager = new RestockAlert();\n        stock.addObserver(pager);\n        stock.purchase(\"B1\", List.of(Coin.R20, Coin.R10));\n        check(stock.qty(\"B1\") == 0, \"the last unit sold\");\n        check(pager.empty.equals(List.of(\"B1\")), \"the pager was told which column is empty\");\n        check(stock.restock(\"B1\", 5) == 5 && stock.qty(\"B1\") == 5, \"restock puts five back\");\n        check(stock.restock(\"B1\", 100) == 3, \"and it never goes past the column's capacity of 8\");\n\n        // 6. screens and pagers: told after the unlock, so a broken or slow one cannot hold a sale up\n        System.out.println(\"6. screens and pagers\");\n        VendingMachine noisy = machine(2);\n        noisy.addObserver(e -> { throw new RuntimeException(\"screen is dead\"); });\n        Outcome still = noisy.purchase(\"B1\", List.of(Coin.R20, Coin.R10));\n        check(still.item() != null, \"the item still dropped\");\n        check(noisy.qty(\"B1\") == 1, \"and the stock still moved\");\n        final boolean[] readable = { false };                         // a screen that asks the machine from its own thread\n        noisy.addObserver(e -> {\n            FutureTask<Integer> ask = new FutureTask<>(() -> noisy.qty(\"B1\"));\n            new Thread(ask).start();\n            try { readable[0] = ask.get(1, TimeUnit.SECONDS) == 0; } catch (Exception x) { readable[0] = false; }\n        });\n        noisy.purchase(\"B1\", List.of(Coin.R20, Coin.R10));\n        check(readable[0], \"even a one-step purchase tells its screens after the unlock: they can read the machine\");\n        RestockAlert busyPager = new RestockAlert();                  // after the unlock means in parallel\n        java.io.PrintStream screen = System.out;\n        System.setOut(new java.io.PrintStream(java.io.OutputStream.nullOutputStream()));\n        Thread[] sellers = new Thread[8];\n        for (int i = 0; i < sellers.length; i++)\n            (sellers[i] = new Thread(() -> { for (int k = 0; k < 20_000; k++) busyPager.onEvent(new MachineEvent(\"SOLD\", \"A1\", 0, 0)); })).start();\n        for (Thread s : sellers) s.join();\n        System.setOut(screen);\n        check(busyPager.empty.size() == 160_000, \"eight sales reporting at once: the pager keeps all 160,000 alerts\");\n\n        // 7. an action that the current mode does not allow is refused, loudly\n        System.out.println(\"7. illegal moves\");\n        VendingMachine strict = machine(2);\n        final boolean[] refusedInsert = { false }, refusedSelect = { false };\n        strict.configure(new ListPrice(), new BackoffChange(), code -> {     // a coin pushed in mid-drop\n            try { strict.insertCoin(Coin.R1); } catch (IllegalStateException e) { refusedInsert[0] = true; }\n            try { strict.select(\"B1\"); }       catch (IllegalStateException e) { refusedSelect[0] = true; }\n            return true;\n        });\n        strict.purchase(\"B1\", List.of(Coin.R20, Coin.R10));\n        check(refusedInsert[0], \"a coin pushed in while the flap is open is refused\");\n        check(refusedSelect[0], \"so is a second press of the button\");\n        boolean threw = false;\n        try { machine(1).select(\"B1\"); } catch (IllegalStateException e) { threw = true; }\n        check(threw, \"pressing a slot with no money in is refused\");\n        boolean empty = false;\n        try { machine(1).collect(); } catch (IllegalStateException e) { empty = true; }\n        check(empty, \"taking from an empty tray is refused, not a silent null\");\n\n        // 8. the price comes from the injected clock, so happy hour is testable at any hour\n        System.out.println(\"8. time is handed in\");\n        VendingMachine hh = machine(3);\n        long[] now = { at(10, 0) };\n        hh.setClock(() -> now[0]);\n        hh.configure(new HappyHourDiscount(new ListPrice(), () -> now[0], 16, 18, 20), new BackoffChange(), new Motor());\n        check(hh.priceOf(\"B1\") == 2500, \"at 10:00 the column costs its list price, Rs 25\");\n        now[0] = at(16, 30);\n        check(hh.priceOf(\"B1\") == 2000, \"at 16:30 the same column costs Rs 20\");\n        hh.insertCoin(Coin.R20);\n        Outcome cheap = hh.select(\"B1\");\n        check(cheap.status() == Status.SOLD && cheap.paise() == 0, \"Rs 20 buys it outright during happy hour\");\n\n        // 9. he feeds a coin in and walks away: after thirty seconds the money is his again, not the machine's\n        System.out.println(\"9. money left inside comes back by itself\");\n        VendingMachine left = machine(3);\n        long[] t = { at(12, 0) };\n        left.setClock(() -> t[0]);\n        left.insertCoin(Coin.R20);\n        check(left.escrowPaise() == 2000, \"Rs 20 sits in escrow while he is standing there\");\n        t[0] += 31_000;                                               // thirty-one seconds later, no sleeping\n        left.insertCoin(Coin.R1);                                     // the next touch sweeps before it runs\n        check(left.escrowPaise() == 100, \"the abandoned Rs 20 is out of the escrow\");\n        check(left.qty(\"B1\") == 3 && left.floatPaise() == 10000, \"no stock and no float moved while it sat there\");\n        check(Coin.total(left.collect().coins()) == 2000, \"and all Rs 20 of it is waiting in the tray\");\n        VendingMachine slow = machine(3);                             // but a customer still feeding coins is not cut off\n        slow.setClock(() -> t[0]);\n        slow.insertCoin(Coin.R20);\n        t[0] += 20_000;\n        slow.insertCoin(Coin.R10);                                    // twenty seconds later: this coin restarts the clock\n        t[0] += 11_000;                                               // thirty-one seconds after the FIRST coin\n        boolean stillHis;\n        try { stillHis = slow.select(\"B1\").sold(); } catch (IllegalStateException cutOff) { stillHis = false; }\n        check(stillHis, \"coins at 0 s and 20 s, a press at 31 s: it sells, because the timer runs from the last touch\");\n\n        // 10. two sales and nobody reaches in: the tray keeps both items instead of overwriting the first\n        System.out.println(\"10. the tray keeps what nobody took\");\n        VendingMachine bin = machine(3);\n        bin.insertCoin(Coin.R20); bin.insertCoin(Coin.R10); bin.select(\"B1\");\n        bin.insertCoin(Coin.R20); bin.insertCoin(Coin.R10); bin.select(\"B1\");\n        Outcome both = bin.collect();\n        check(both.items().size() == 2, \"two bars are waiting, not one\");\n        check(Coin.total(both.coins()) == 1000, \"with both lots of change, Rs 10 in all\");\n        check(bin.qty(\"B1\") == 1, \"and the column went down by exactly two\");\n\n        // 11. a one-step buyer (a phone, a kiosk) never spends the coins of the customer standing at the machine\n        System.out.println(\"11. whose money is in the escrow\");\n        VendingMachine shared = machine(3);\n        shared.insertCoin(Coin.R20);                                  // he is standing there with Rs 20 in\n        boolean phoneRefused = false;\n        try { shared.purchase(\"B1\", List.of(Coin.R20, Coin.R10)); } catch (IllegalStateException busy) { phoneRefused = true; }\n        check(phoneRefused, \"a phone purchase is refused while his coins are in\");\n        check(shared.escrowPaise() == 2000 && shared.qty(\"B1\") == 3, \"his Rs 20 is still his, and no unit moved\");\n        shared.cancel();\n        shared.collect();\n        check(shared.purchase(\"B1\", List.of(Coin.R20, Coin.R10)).item() != null, \"once he has his coins back, the phone buys\");\n\n        // 12. a discount still leaves a price that coins can pay\n        System.out.println(\"12. prices stay in whole rupees\");\n        VendingMachine odd = machine(3);\n        odd.setClock(() -> at(16, 30));\n        odd.configure(new HappyHourDiscount(new ListPrice(), () -> at(16, 30), 16, 18, 15), new BackoffChange(), new Motor());\n        check(odd.priceOf(\"B1\") == 2100, \"15% off Rs 25 is Rs 21, not Rs 21.25, which no coin could pay\");\n        odd.insertCoin(Coin.R20);\n        odd.insertCoin(Coin.R5);\n        Outcome oddSale = odd.select(\"B1\");\n        check(oddSale.sold() && oddSale.paise() == 400, \"so Rs 25 buys it, with Rs 4 change\");\n\n        // 13. the operator cannot push a count below zero, and can close a machine somebody walked away from\n        System.out.println(\"13. the operator's inputs\");\n        VendingMachine op = machine(3);\n        boolean stockRefused = false, floatRefused = false;\n        try { op.restock(\"B1\", -5); } catch (IllegalArgumentException e) { stockRefused = true; }\n        try { op.loadFloat(Coin.R10, -9); } catch (IllegalArgumentException e) { floatRefused = true; }\n        check(stockRefused && floatRefused && op.qty(\"B1\") == 3 && op.floatPaise() == 10000,\n              \"a negative restock or float load is refused, and nothing moves\");\n        long[] shift = { at(9, 0) };\n        op.setClock(() -> shift[0]);\n        op.insertCoin(Coin.R10);                                      // somebody puts Rs 10 in and walks off\n        shift[0] += 60_000;\n        try { op.setService(true); } catch (IllegalStateException e) { /* checked below */ }\n        check(op.state() == MachineState.OUT_OF_SERVICE && op.collect().paise() == 1000,\n              \"a minute later the operator can close it, and the Rs 10 is in the tray\");\n\n        // 14. the follow-ups keep their own promises: a hold loses no unit, a card never keeps money for nothing\n        System.out.println(\"14. follow-ups\");\n        Inventory shelf = new Inventory();\n        shelf.addSlot(new Slot(\"A1\", new Product(\"LAY\", \"Lays\", 2000), 8, 2));\n        shelf.addSlot(new Slot(\"A2\", new Product(\"COK\", \"Coke\", 3500), 8, 1));\n        long[] wall = { 0 };\n        HoldDesk desk = new HoldDesk(shelf, () -> wall[0], 30_000);\n        desk.hold(\"A2\", \"ravi\");\n        desk.hold(\"A1\", \"ravi\");                                      // he changes his mind\n        check(shelf.slot(\"A2\").qty() == 1, \"a second hold by the same customer gives the first unit back\");\n        wall[0] += 31_000;\n        desk.hold(\"A1\", \"meera\");                                     // the next touch sweeps the expired hold\n        check(shelf.slot(\"A1\").qty() == 1 && shelf.slot(\"A2\").qty() == 1, \"after the expiry no unit is lost\");\n        Map<String, Integer> bank = new HashMap<>();                  // what each sale id has taken from the customer\n        CardTerminal lostReply = new CardTerminal() {\n            public boolean charge(String id, int paise) { bank.merge(id, paise, Integer::sum); throw new RuntimeException(\"timeout\"); }\n            public boolean refund(String id) { bank.remove(id); return true; }\n        };\n        Outcome unknown = new CardCheckout(shelf, new Motor(), lostReply).buy(\"A1\", 2000);\n        check(!unknown.sold() && bank.isEmpty() && shelf.slot(\"A1\").qty() == 1,\n              \"the charge went through but the reply timed out: refunded by its sale id, nothing dropped\");\n        CardTerminal bankDown = new CardTerminal() {\n            public boolean charge(String id, int paise) { return true; }\n            public boolean refund(String id) { return false; }\n        };\n        CardCheckout stuck = new CardCheckout(shelf, code -> false, bankDown);\n        stuck.buy(\"A1\", 2000);\n        check(stuck.refundsToRetry.size() == 1, \"a refund that fails is kept for a retry, not forgotten\");\n\n        System.out.println(failed == 0 ? \"ALL PASS\" : failed + \" FAILED\");\n        if (failed > 0) System.exit(1);\n    }\n\n    /** A fixed moment on 15 September 2026 in Kolkata, so the tests never depend on when they run. */\n    static long at(int hour, int minute) {\n        return java.time.LocalDateTime.of(2026, 9, 15, hour, minute)\n                 .atZone(java.time.ZoneId.of(\"Asia/Kolkata\")).toInstant().toEpochMilli();\n    }\n}\n"};

const KW=/\b(abstract|boolean|break|case|catch|class|continue|default|do|double|else|enum|extends|final|finally|for|if|implements|import|int|interface|long|new|null|package|private|protected|public|return|static|super|switch|synchronized|this|throw|throws|try|void|while|var|record|true|false)\b/g;
const TY=/\b([A-Z][A-Za-z0-9]*)\b/g;
function hl(src){let inDoc=false;return src.split('\n').map((l,i)=>{let e=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const t=e.trim();let out;if(inDoc||t.startsWith('/**')){out='<span class="d">'+e+'</span>';if(t.startsWith('/**'))inDoc=!t.endsWith('*/');else if(t.endsWith('*/'))inDoc=false;}else{const parts=e.split(/(\/\/.*$|"(?:[^"\\]|\\.)*")/);out=parts.map((p,j)=>j%2?(p.startsWith('//')?'<span class="c">'+p+'</span>':'<span class="s">'+p+'</span>'):p.replace(KW,'<span class="k">$1</span>').replace(TY,'<span class="t">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>')).join('');}return '<span class="ln">'+(i+1)+'</span>'+out;}).join('\n');}
let cur=parseInt(localStorage.getItem('vending.step')||'1',10);
const side=document.getElementById('side'),study=document.getElementById('study');
function classesSoFar_unused(n){const out=[];STEPS.filter(s=>s.id<=n&&s.code).forEach(s=>{(s.code.match(/(?:class|interface|enum)\s+([A-Z]\w*)/g)||[]).forEach(m=>out.push({name:m.split(/\s+/)[1],step:s.id}));});return out;}
function render(){
  side.innerHTML='';let g='';STEPS.forEach(s=>{if(s.stage!==g){g=s.stage;side.insertAdjacentHTML('beforeend','<div class="grp">'+g+'</div>');}side.insertAdjacentHTML('beforeend','<div class="st'+(s.id===cur?' on':s.id<cur?' done':'')+'" data-id="'+s.id+'"><span class="n">'+String(s.id).padStart(2,'0')+'</span><span>'+s.title+'</span></div>');});
  const s=STEPS[cur-1];
  study.innerHTML='<div class="hdr"><span class="stage">'+s.stage+'</span><h2>'+String(s.id).padStart(2,'0')+' &middot; '+s.title+'</h2></div>'+(s.think?'<div class="think">'+s.think+'</div>':'')+(s.body||'')+(s.code?'<div class="ed"><div class="tab"><b>'+(s.file||'Main.java')+'</b><button class="copy" data-src="ed">copy</button></div><pre><code class="java">'+hl(s.code)+'</code></pre></div>':'')+'<div class="nav"><button id="prev">&larr; prev</button><button id="next" class="pri">next &rarr;</button></div>';
  study.querySelectorAll('pre code.java').forEach(el=>{el.innerHTML=hl(el.textContent);});wireCopy(study);wireTimers(study);const miss=document.getElementById('miss');if(miss){try{miss.value=localStorage.getItem('vending.miss')||'';}catch(e){}miss.addEventListener('input',()=>{try{localStorage.setItem('vending.miss',miss.value);}catch(e){}});}
  document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
  document.querySelector('.wrap').classList.toggle('wide',!!s.wide);document.querySelector('.wrap').classList.toggle('code',!!s.code);localStorage.setItem('vending.step',cur);study.scrollIntoView();
}
function go(n){if(n<1||n>STEPS.length)return;cur=n;setMode('study');render();}
side.addEventListener('click',e=>{const t=e.target.closest('.st');if(t)go(+t.dataset.id);});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
const main=document.getElementById('main');
function setMode(m){}
function wireTimers(root){root.querySelectorAll('button.timer[data-min]').forEach(b=>{const total=+b.dataset.min*60;let left=total,id=null;const show=()=>{b.textContent=(id?'':'start ')+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');};b.onclick=()=>{if(id){clearInterval(id);id=null;b.classList.remove('run');show();return;}if(left<=0)left=total;b.classList.remove('done');b.classList.add('run');id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;b.classList.remove('run');b.classList.add('done');b.textContent='time -- open the fold';}},1000);show();};show();});}
render();
</script></body></html>

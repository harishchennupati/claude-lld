"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 108)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is the whole float worth?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 127 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 108)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">sum over 5 denominations</text><text x=\"260.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 127 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 108)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(5)</text></g><g transform=\"translate(30 154)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is this button legal right now?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 173 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 154)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EnumMap&lt;State, EnumSet&lt;Action&gt;&gt;</text><text x=\"260.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 173 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 154)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 200)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what has this customer put in?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 219 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 200)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">List&lt;Coin&gt; escrow, appended</text><text x=\"260.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 219 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 200)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) add</text></g><g transform=\"translate(30 246)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is waiting in the tray?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 265 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 246)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">List&lt;Product&gt; items + List&lt;Coin&gt; coins</text><text x=\"260.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 265 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 246)\"><rect width=\"170\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) add</text></g><text x=\"615\" y=\"302\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the escrow is a LIST of coins, not a total, because the coin return owes you the same coins back, not the same amount</text><text x=\"615\" y=\"320\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tray is a list for a related reason: two sales before anybody reaches in must leave two bars in the bin, not one</text></svg></div><div class=\"move\"><p>\"What is behind A1?\": a map from code to slot. \"How many five-rupee coins do we hold?\": an <code>EnumMap</code> from coin to count, which is an array index, not a hash. \"Is this button legal right now?\": a table from mode to the set of allowed actions, so legality is a lookup and not an if-chain. \"What has this customer put in?\": a <i>list</i> of coins, not a total &mdash; the coin return owes you the same coins back, not the same amount, and a total cannot tell you which coins those were. Every scan avoided here is a question not fumbled in the concurrency round, because the scan would have been inside the lock.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"165\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">IDLE</text><text x=\"82.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">insert coin</text></g><g transform=\"translate(225 30)\"><rect width=\"165\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">HAS_MONEY</text><text x=\"82.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">escrow > 0</text></g><g transform=\"translate(420 30)\"><rect width=\"165\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DISPENSING</text><text x=\"82.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the flap is open</text></g><path d=\"M195 52 H225\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M390 52 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(30 150)\"><rect width=\"165\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"82.5\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">OUT_OF_SERVICE</text><text x=\"82.5\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">entered only from IDLE</text></g><path d=\"M60 74 V150\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M290 74 V92 H150 V74\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"300\" y=\"96\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--acc)\">coin return, or a 30 s timeout</text><path d=\"M502 74 V124 H112 V74\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"490\" y=\"118\" text-anchor=\"end\" font-size=\"10.5\" fill=\"var(--acc)\">commit, or refund</text><rect x=\"620\" y=\"20\" width=\"590\" height=\"190\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"915\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order inside sell() (select's body), and why</text><text x=\"635\" y=\"68\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 three refusals that touch nothing: no such code, sold out, too little money</text><text x=\"635\" y=\"92\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 prove the change from float + escrow -- a PURE plan; the float is not touched</text><text x=\"635\" y=\"116\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 turn the motor: the one act that cannot be taken back</text><text x=\"635\" y=\"140\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4 only now: count -1, escrow into the float, change out, both into the tray</text><text x=\"635\" y=\"164\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a refusal or a jam leaves stock, float and escrow exactly as they were;</text><text x=\"635\" y=\"188\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the money is never kept for an item that did not fall</text><text x=\"615\" y=\"235\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">an illegal action THROWS (a press with no money in, a phone buy while coins are in); a refused sale RETURNS a reason (sold out, too little, no change)</text></svg></div><div class=\"move\"><p>The machine is IDLE until a coin drops, HAS_MONEY while the escrow is not empty, DISPENSING while the flap is open, and OUT_OF_SERVICE when an operator takes it away. The table lets the operator do that only when nobody's coins are in, so nobody who paid is stranded. A phone's one-step purchase is also legal only in IDLE: coins in the escrow belong to the customer standing there, and must never pay for the phone's Coke. There are two ways out of HAS_MONEY without a sale: the coin return, and thirty seconds with no coin and no press, after which the coins go to the tray. Every button sweeps an expired escrow before it runs, so that timeout costs no timer thread and nothing to get wrong. Writing the modes down forces the question the interviewer will ask: what if the motor jams with my money inside? The answer is an order. Refuse for free first (no such code, sold out, too little money) without touching a paise. Then prove the change from float plus escrow with a pure function that mutates nothing. Then turn the motor, the one act that cannot be taken back. Only when the item has fallen does anything commit: count down one, escrow into the float, change out of the float, both into the tray. While the motor turns, another thread simply waits for the lock. DISPENSING stops a call that comes back in on the same thread, because the lock is re-entrant (the thread holding it may take it again). One more distinction worth saying aloud: an illegal action throws, because it is a bug or a broken panel, while a refused sale returns a reason, because it is a normal Tuesday.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes sales happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 314\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"540\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one map lookup for the slot: ~0.1 us</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the price rule: one call, ~0.1 us</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the change plan over 5 denominations: ~1 us</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">about ten EnumMap and list writes: ~0.3 us</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">and the MOTOR: about 2 SECONDS</text><text x=\"14\" y=\"126\" font-size=\"10.5\" fill=\"var(--muted)\">that last line is the whole problem</text></g><path d=\"M570 95 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"605\" y=\"85\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the screen and the pager: after the unlock</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">telemetry and the low-cash alert: after too</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the customer choosing and fishing for coins: seconds</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">a broken listener cannot stall a sale</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">rung one of the ladder moves the motor out here</text></g><text x=\"615\" y=\"200\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">eight panels press in the same second</text><g transform=\"translate(30 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">panel 1</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 s</text></g><g transform=\"translate(178 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">panel 2</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 2 s</text></g><g transform=\"translate(326 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">panel 3</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 4 s</text></g><g transform=\"translate(474 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">panel 4</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 6 s</text></g><g transform=\"translate(622 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">panel 5</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 8 s</text></g><g transform=\"translate(770 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">panel 6</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 10 s</text></g><g transform=\"translate(918 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">panel 7</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 12 s</text></g><g transform=\"translate(1066 214)\"><rect width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"68.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">panel 8</text><text x=\"68.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 14 s</text></g><text x=\"615\" y=\"282\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">unlike most designs, here the queue is VISIBLE: the eighth panel waits fourteen seconds, because a two-second motor runs inside the lock.</text><text x=\"615\" y=\"300\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one machine has one or two panels, so today nobody notices; a bank of machines on one stock service would, which is what the ladder is for.</text></svg></div><div class=\"move\"><p>Inside the lock there is a map lookup, one call to the price rule, a change plan over five denominations and about ten small writes: something like one and a half microseconds. Then there is the motor, which takes about two seconds, and it is inside the lock too. That is unusual and worth saying out loud: in most designs the lock is invisible, and here it is not. If eight panels pressed in the same second the eighth would wait fourteen seconds. A real machine has one keypad and maybe a card reader, so nobody notices. But the moment you put a bank of machines behind one stock service, this is the first thing that breaks. That is why the next move's ladder starts by getting the motor out of the critical section (the code that runs while the lock is held).</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per machine: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">everything except the motor: ~1.5 us of lock per sale</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a busy station machine: 300 sales a day, one every 5 minutes</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the motor at 2 s x 300 = 600 s of lock in 86,400 s: 0.7% busy</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">two presses inside the same 2 s window: a handful at the evening peak</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">the weak spot is not the lock, it is the 2 seconds inside it</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 the motor outside the lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reserve the unit, drop, then commit or put it back</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 a lock per column</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two panels on different columns never wait</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 the count itself decides</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">compareAndSet, or UPDATE slot SET qty=qty-1 WHERE qty&gt;0</text></g></svg></div><div class=\"move\"><p>A busy station machine sells about three hundred items a day, one every five minutes. Hold the two-second motor up against that: six hundred seconds of lock out of eighty-six thousand four hundred, so the lock is busy 0.7% of the day. Two presses inside the same two-second window happen a handful of times at the evening peak. Nobody is waiting, so nothing needs building yet. Then name the ladder, in the order you would climb it. Rung one takes the motor out of the lock: reserve the unit in a very short section, drop with the lock released, then commit or put the reservation back in a second short section. Rung two is a lock per column, so two panels on different columns never wait. Rung three lets the count itself decide the winner with a compare-and-set (write the new count only if it still holds the value you read, in one hardware step). For a shared stock service that is <code>UPDATE slot SET qty = qty - 1 WHERE qty &gt; 0</code>. Say the arithmetic first: climbing the ladder without it is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 347\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two panels press for the last unit</text></g><path d=\"M350 37 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 18)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one lock round the whole sale; test 1: 40 threads, one item out, the float grew by one price</text></g><g transform=\"translate(30 60)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the float cannot make Rs 15</text></g><path d=\"M350 79 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 60)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">prove the change before anything moves; test 2: full refund, stock and float untouched</text></g><g transform=\"translate(30 102)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the motor jams with the money inside</text></g><path d=\"M350 121 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 102)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">commit only after the item falls; test 4: Rs 30 back, no unit lost</text></g><g transform=\"translate(30 144)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a coin or a press arrives mid-drop</text></g><path d=\"M350 163 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 144)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">another thread waits for the lock; the same thread is refused by DISPENSING; test 7</text></g><g transform=\"translate(30 186)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the screen throws, or is slow</text></g><path d=\"M350 205 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 186)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish after the unlock in a try/catch; test 6: the sale completes, the screen can read</text></g><g transform=\"translate(30 228)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a phone buys while his coins are in</text></g><path d=\"M350 247 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 228)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PURCHASE is legal only in IDLE; test 11: the phone is refused, his Rs 20 untouched</text></g><g transform=\"translate(30 270)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">he pays, walks off, and never comes back</text></g><path d=\"M350 289 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 270)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">30 s after his last coin or press, the escrow goes to the tray, which keeps every item; tests 9, 10</text></g><text x=\"615\" y=\"334\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a failure test: FailureTests.java runs fourteen of them and must print ALL PASS</text></svg></div><div class=\"move\"><p>Each row of that table is a few lines in FailureTests.java, which runs fourteen such tests and prints ALL PASS or exits non-zero. The race is the one worth writing in front of the interviewer. Forty threads wait on one latch (a gate that opens for all of them at once); one item comes out, thirty-nine buyers get full refunds, and the float grows by exactly one price. Those four assertions prove the stock invariant and the money invariant together. The row a second terminal adds is the phone that must never spend the coins of the man at the keypad. The two that candidates forget are the last row: money nobody came back for, and an item nobody took. Losing either one is losing a customer's money or a customer's chocolate, however clean the class diagram is.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"230\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"320\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"870\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"230\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface ChangeStrategy { List&lt;Coin&gt; plan(available, amount); }</text><text x=\"870\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a new change algorithm is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"230\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">new HappyHourDiscount(new ListPrice(), clock, 16, 18, 20)</text><text x=\"870\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">add to a price rule instead of copying it</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"230\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"320\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">publish(event) after the unlock, inside a try/catch</text><text x=\"870\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">the screen hears; the sale never waits</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"230\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">ALLOWED: EnumMap&lt;MachineState, EnumSet&lt;Action&gt;&gt;</text><text x=\"870\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">an illegal button cannot do anything</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Dependency injection</text><text x=\"230\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Dispenser handed in, never built: the real motor, or code -&gt; false</text><text x=\"870\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">a jam is testable in one line</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"230\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"320\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">panels are HANDED the machine; nothing calls getInstance()</text><text x=\"870\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">every test builds a fresh machine</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"230\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">SlotFactory.fromConfig(\"A1|LAY|Lays|2000|8|3\") once columns come from a file</text><text x=\"870\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">today the columns arrive already typed</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"230\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"320\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">a slot has four fields and every one is required</text><text x=\"870\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">a pattern without a move is decoration</text><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>The table is the answer; each name has one sentence behind it because a move produced it. The bottom three rows are the absences, and those are worth saying out loud. Singleton did not earn a place: panels are handed the machine, which is why every test can build a fresh one and no test has to reset anything global. Factory has not earned one yet, because the columns arrive already typed. It earns one the moment they arrive as strings from a planogram file (the operator's list of which product sits in which column): that is the <code>SlotFactory</code> in Extensions.java. Builder never will: a slot has four fields and all four are required. A pattern without a move behind it is decoration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Slot: its count. CoinBox: the coins. The machine: the flow and the lock.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">DpChange is a new file plus one line in configure()</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">changeRule.plan(pool, due);  never \"is this the greedy one?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">PricingStrategy, ChangeStrategy, Dispenser, MachineObserver, Clock: one method each</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">vm.configure(new HappyHourDiscount(...), new BackoffChange(), new Motor())</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>The table is the answer; the thing to say with it is that not one of these was aimed at. Every letter is a line that already existed because a move produced it, so the honest reply to \"which SOLID principles did you apply?\" is \"move 2 gave me S, move 3 gave me O, L, I and D\" rather than five definitions. The one worth demonstrating instead of claiming is I: because every interface here has exactly one method, a fake for a test is a lambda, and <code>code -&gt; false</code> is a jammed motor in nine characters.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a bounded-DP change maker, loyalty pricing</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind the existing interface plus one configure line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">telemetry, a low-cash pager, a planogram service</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer; the sale path does not change at all</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">out of service, reserved, refunding</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more row in the ALLOWED table (a class once the mode grows behaviour)</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across items</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a combo: two columns, both or neither</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">both claims inside the SAME lock: all or nothing</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a power cut; a bank of machines sharing stock</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the counts and the float behind a repository; the decrement becomes</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE slot SET qty = qty - 1 WHERE code = ? AND qty &gt; 0  -- 0 rows means another terminal got it</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the slot, the coin box and the tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>Two of the five need more than the picture gives them. Sometimes a mode grows behaviour of its own: out of service has to remember which mode to hand back to, and still let a paid customer press the coin return. Then that row is promoted to a class, the <code>MaintenanceMode</code> in Extensions.java. And when the state has to outlive the process, the counts and the float go behind a repository (an interface with save and load). The lock-protected <code>qty--</code> then becomes a conditional update where the count is still positive. That is the database's compare-and-set: one atomic step (nothing can run between its read and its write) decides the winner, the same idea as the lock one layer down. For all five the slot, the coin box and the tests do not change; that is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 950\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M64.0 250L80 224\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M176.0 250L165 224\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1070.0 110L1070.0 74\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1000.0 200L1000.0 74\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M940 237.0L922 237.0L922 59.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" mar \"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Outcome</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">status: Status</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">items: List&lt;Product&gt;</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">coins: List&lt;Coin&gt;</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">paise: int</text><line x1=\"0\" y1=\"96\" x2=\"230\" y2=\"96\" stroke=\"var(--line)\"/><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">item(): the first, or null</text></g><g transform=\"translate(660 290)\"><rect width=\"230\" height=\"82\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"115.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Status</text><line x1=\"0\" y1=\"34\" x2=\"230\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">SOLD, SOLD_OUT, UNKNOWN_SLOT</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">NEED_MORE, NO_CHANGE,</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--muted)\">JAMMED, COLLECTED</text></g><g transform=\"translate(660 396)\"><rect width=\"230\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"115.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">MachineState</text><line x1=\"0\" y1=\"34\" x2=\"230\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">IDLE, HAS_MONEY</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">DISPENSING, OUT_OF_SERVICE</text></g><g transform=\"translate(660 482)\"><rect width=\"230\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"115.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Action</text><line x1=\"0\" y1=\"34\" x2=\"230\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">INSERT, SELECT, CANCEL</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">COLLECT, SERVICE, PURCHASE</text></g><g transform=\"translate(660 566)\"><rect width=\"230\" height=\"50\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Legal</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">ALLOWED: State &rarr; Set&lt;Action&gt;</text></g><g transform=\"translate(660 640)\"><rect width=\"230\" height=\"82\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Product</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">sku: String</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">name: String</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">listPaise: int</text></g><g transform=\"translate(940 20)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PricingStrategy</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">priceOf(s: Slot): int</text></g><g transform=\"translate(940 110)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ListPrice</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">priceOf(s): s.product.listPaise</text></g><g transform=\"translate(940 200)\"><rect width=\"260\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">HappyHourDiscount</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">base: PricingStrategy</text><line x1=\"0\" y1=\"48\" x2=\"260\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">priceOf(s): base less off%, whole Rs</text></g><g transform=\"translate(940 320)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ChangeStrategy</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">plan(available, amount): List&lt;Coin&gt;</text></g><g transform=\"translate(940 410)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">GreedyChange</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">plan: biggest first, one pass</text></g><g transform=\"translate(940 500)\"><rect width=\"260\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">BackoffChange</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">plan: greedy, then put one back</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">null = it cannot be made</text></g><g transform=\"translate(940 620)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"130.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"130.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Dispenser</text><line x1=\"0\" y1=\"34\" x2=\"260\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">drop(slotCode): boolean</text></g><g transform=\"translate(940 710)\"><rect width=\"260\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Motor</text><line x1=\"0\" y1=\"26\" x2=\"260\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">drop(code) &rarr; true</text></g><g><path d=\"M20 920L64 920\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"924\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 920L284 920\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"924\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 920L504 920\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"924\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 920L684 920\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"924\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 920L904 920\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"924\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the machine owns the inventory, the coin box and the tray, and an inventory owns its slots. Plain arrow = references: a slot points at a product, the coin box counts coins. Dashed green = handed in through <code>configure()</code> or <code>setClock()</code>. Dotted blue = notifies: the one call the machine makes after it has released the lock, and the two small boxes under MachineObserver are the only two listeners in Main.java, the screen and the operator's pager. The plain arrows out of the machine are what it returns (an Outcome) and what it publishes (a MachineEvent), and the arrow from HappyHourDiscount back to PricingStrategy is one price rule wrapping another. <b>Where state lives:</b> a slot has its count; the coin box has how many of each coin; the tray has a <i>list</i> of items and a list of coins, because it keeps everything until somebody reaches in; the machine has all three plus the escrow, the moment of the customer's last coin or press, the mode and the one lock, and it is the only class that writes to more than one of them. Everything on the right-hand column is handed in and could be replaced without opening the machine. On the next page this diagram is worth keeping in a second tab while you read the code.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does and what it guarantees. Read only those first for the shape, then the bodies; start with <code>VendingMachine.sell</code>, the thirty lines behind <code>select</code>, which is the whole interview. Each copy button copies that whole file. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (fourteen claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\nimport java.time.*;\n\n/**\n * The coins and notes the machine accepts. Each is worth a fixed number of paise (100 paise = one rupee),\n * so all money in this file is an int and never a double.\n */\nenum Coin {\n    R1(100), R2(200), R5(500), R10(1000), R20(2000);\n    final int paise;\n    Coin(int paise) { this.paise = paise; }\n    /** What a handful of coins is worth, in paise. */\n    static int total(Collection&lt;Coin&gt; coins) {\n        int sum = 0;\n        for (Coin c : coins) sum += c.paise;\n        return sum;\n    }\n    /** The denominations from biggest to smallest: the order change-making walks. */\n    static List&lt;Coin&gt; descending() {\n        List&lt;Coin&gt; all = new ArrayList&lt;&gt;(List.of(values()));\n        all.sort((a, b) -&gt; b.paise - a.paise);\n        return all;\n    }\n}\n\n/**\n * A catalogue entry: what the thing is and what it lists for. Slots point at products; a product can sit\n * in many machines, so it is referenced, never owned.\n */\nrecord Product(String sku, String name, int listPaise) {}\n\n/**\n * One column of the machine: the code you press, the product behind it, and how many are left. The count\n * is only ever read or written under the machine&#x27;s lock.\n */\nfinal class Slot {\n    final String code;\n    final Product product;\n    final int capacity;\n    private int qty;                                   // guarded by VendingMachine.lock\n\n    Slot(String code, Product product, int capacity, int qty) {\n        this.code = code; this.product = product; this.capacity = capacity; this.qty = qty;\n    }\n    /** How many are left. Under the machine&#x27;s lock. */\n    int qty() { return qty; }\n    /** Take one off the coil. Called only after the item has physically dropped, so it can never lose stock. */\n    void takeOne() {\n        if (qty &lt;= 0) throw new IllegalStateException(&quot;slot &quot; + code + &quot; is empty&quot;);\n        qty--;\n    }\n    /** Operator refill, capped by the column&#x27;s capacity. Returns how many actually went in; a negative n is refused. */\n    int refill(int n) {\n        if (n &lt; 0) throw new IllegalArgumentException(&quot;cannot refill &quot; + n + &quot; into &quot; + code);\n        int room = Math.min(n, capacity - qty);\n        qty += room;\n        return room;\n    }\n}\n\n/**\n * All the slots, keyed by the code on the keypad, so &quot;what is behind A1?&quot; is one map lookup. Owned by the\n * machine and guarded by its lock.\n */\nfinal class Inventory {\n    private final Map&lt;String, Slot&gt; slots = new HashMap&lt;&gt;();\n\n    /** Install a column. Setup and operator only. */\n    void addSlot(Slot s) { slots.put(s.code, s); }\n    /** The slot behind a code, or null when no such code exists. O(1). */\n    Slot slot(String code) { return slots.get(code); }\n    /** Every slot&#x27;s remaining count, for an operator screen. */\n    Map&lt;String, Integer&gt; counts() {\n        Map&lt;String, Integer&gt; out = new TreeMap&lt;&gt;();\n        for (Slot s : slots.values()) out.put(s.code, s.qty());\n        return out;\n    }\n}\n\n/**\n * The coin float: how many of each denomination the machine is holding to give as change. An EnumMap, so\n * every count is one array index. Owned by the machine and guarded by its lock.\n */\nfinal class CoinBox {\n    private final Map&lt;Coin, Integer&gt; counts = new EnumMap&lt;&gt;(Coin.class);\n\n    CoinBox() { for (Coin c : Coin.values()) counts.put(c, 0); }\n    /** Operator load. Setup and refill only; a negative n is refused, so no count can go below zero. */\n    void load(Coin c, int n) {\n        if (n &lt; 0) throw new IllegalArgumentException(&quot;cannot load &quot; + n + &quot; x &quot; + c);\n        counts.merge(c, n, Integer::sum);\n    }\n    /** Absorb coins into the float. Called on a committed sale, never before. */\n    void deposit(Collection&lt;Coin&gt; coins) { for (Coin c : coins) counts.merge(c, 1, Integer::sum); }\n    /** Pay coins out of the float. Throws if a coin is not there, which would mean the plan was stale. */\n    void withdraw(Collection&lt;Coin&gt; coins) {\n        for (Coin c : coins) {\n            int n = counts.get(c);\n            if (n == 0) throw new IllegalStateException(&quot;float has no &quot; + c);\n            counts.put(c, n - 1);\n        }\n    }\n    /** How many of one denomination are in the float. O(1). */\n    int count(Coin c) { return counts.get(c); }\n    /** What the float is worth, in paise. O(number of denominations) = O(5). */\n    int totalPaise() {\n        int sum = 0;\n        for (Map.Entry&lt;Coin, Integer&gt; e : counts.entrySet()) sum += e.getKey().paise * e.getValue();\n        return sum;\n    }\n    /** A copy of the counts, for an operator screen. */\n    Map&lt;Coin, Integer&gt; snapshot() { return new EnumMap&lt;&gt;(counts); }\n    /**\n     * A copy of float PLUS the coins still in escrow: everything change could be made from. Pure, so the\n     * machine can ask &quot;could I make this change?&quot; without ever touching the float.\n     */\n    Map&lt;Coin, Integer&gt; poolWith(Collection&lt;Coin&gt; escrow) {\n        Map&lt;Coin, Integer&gt; pool = new EnumMap&lt;&gt;(counts);\n        for (Coin c : escrow) pool.merge(c, 1, Integer::sum);\n        return pool;\n    }\n}\n\n/** How a press of a slot ended. The display shows this; it is not an error unless the machine says so. */\nenum Status { SOLD, SOLD_OUT, UNKNOWN_SLOT, NEED_MORE, NO_CHANGE, JAMMED, COLLECTED }\n\n/**\n * What a press produced: the outcome, whatever is now waiting in the tray, the coins that came with it, and\n * a number whose meaning depends on the status (NEED_MORE: how much is still short; everything else: the\n * paise in the coins). Items is a LIST because the tray keeps everything until somebody reaches in.\n */\nrecord Outcome(Status status, List&lt;Product&gt; items, List&lt;Coin&gt; coins, int paise) {\n    /** True only when an item actually dropped. */\n    boolean sold() { return status == Status.SOLD; }\n    /** The first item, or null when nothing dropped: the shorthand every caller and test wants. */\n    Product item() { return items.isEmpty() ? null : items.get(0); }\n}\n\n/**\n * The bin behind the flap: everything waiting for the customer&#x27;s hand. Items and their change after a sale,\n * refunded coins after a cancel, a refusal or a timed-out escrow. It KEEPS them: a second sale never\n * overwrites the bar the last customer forgot. Owned by the machine, guarded by its lock.\n */\nfinal class Tray {\n    private final List&lt;Product&gt; items = new ArrayList&lt;&gt;();\n    private final List&lt;Coin&gt; coins = new ArrayList&lt;&gt;();\n\n    /** Drop a sold item and its change in, on top of anything already waiting. */\n    void put(Product p, List&lt;Coin&gt; change) { items.add(p); coins.addAll(change); }\n    /** Drop coins in with no item: a cancel, a refusal, or an escrow that timed out. */\n    void putCoins(List&lt;Coin&gt; back) { coins.addAll(back); }\n    /** Nothing to pick up. */\n    boolean isEmpty() { return items.isEmpty() &amp;&amp; coins.isEmpty(); }\n    /** Empty the whole bin into the customer&#x27;s hand. Throws when there is nothing there. */\n    Outcome take() {\n        if (isEmpty()) throw new IllegalStateException(&quot;the tray is empty&quot;);\n        Outcome o = new Outcome(Status.COLLECTED, List.copyOf(items), List.copyOf(coins), Coin.total(coins));\n        items.clear(); coins.clear();\n        return o;\n    }\n}\n\n/** The four modes the machine can be in. A mode decides which actions are legal, nothing else. */\nenum MachineState { IDLE, HAS_MONEY, DISPENSING, OUT_OF_SERVICE }\n\n/** Everything a customer or an operator can do to the machine. PURCHASE is the one-step buy: coins and press together. */\nenum Action { INSERT, SELECT, CANCEL, COLLECT, SERVICE, PURCHASE }\n\n/**\n * Which actions are legal in which mode: a table, not an if-chain, so a new mode is one more row and no\n * existing line is edited. Anything not in the row is refused loudly. PURCHASE is only in the IDLE row:\n * while a walk-up customer&#x27;s coins are in, a one-step buyer is refused instead of spending them.\n */\nfinal class Legal {\n    static final Map&lt;MachineState, Set&lt;Action&gt;&gt; ALLOWED = new EnumMap&lt;&gt;(MachineState.class);\n    static {\n        ALLOWED.put(MachineState.IDLE,           EnumSet.of(Action.INSERT, Action.CANCEL, Action.COLLECT, Action.SERVICE, Action.PURCHASE));\n        ALLOWED.put(MachineState.HAS_MONEY,      EnumSet.of(Action.INSERT, Action.SELECT, Action.CANCEL, Action.COLLECT));\n        ALLOWED.put(MachineState.DISPENSING,     EnumSet.noneOf(Action.class));\n        ALLOWED.put(MachineState.OUT_OF_SERVICE, EnumSet.of(Action.CANCEL, Action.COLLECT, Action.SERVICE));\n    }\n    private Legal() {}\n}\n\n/** Where time comes from. Handed in, so a test can say &quot;16:30 on a Tuesday&quot; and prices are replayable. */\ninterface Clock { long nowMs(); }\n\n/** What a slot costs right now. Behind an interface because it WILL change mid-round: offers, happy hour. */\ninterface PricingStrategy { int priceOf(Slot s); }\n\n/** The plain rule: the price printed on the column. */\nfinal class ListPrice implements PricingStrategy {\n    /** The product&#x27;s list price, in paise. */\n    public int priceOf(Slot s) { return s.product.listPaise(); }\n}\n\n/**\n * A rule that WRAPS another rule instead of replacing it: the wrapped price, minus a percentage, between\n * two hours of the day. The hour comes from the handed-in clock, never from the wall clock.\n */\nfinal class HappyHourDiscount implements PricingStrategy {\n    private final PricingStrategy base;\n    private final Clock clock;\n    private final int fromHour, toHour, offPercent;\n    private final ZoneId zone = ZoneId.of(&quot;Asia/Kolkata&quot;);\n\n    HappyHourDiscount(PricingStrategy base, Clock clock, int fromHour, int toHour, int offPercent) {\n        if (offPercent &lt; 0 || offPercent &gt; 100) throw new IllegalArgumentException(&quot;discount of &quot; + offPercent + &quot;%&quot;);\n        this.base = base; this.clock = clock; this.fromHour = fromHour; this.toHour = toHour; this.offPercent = offPercent;\n    }\n    /**\n     * The base price, less the discount when the clock says we are inside the window, rounded DOWN to a\n     * whole rupee: the smallest coin is Rs 1, so a price like Rs 21.25 could never be paid or changed.\n     */\n    public int priceOf(Slot s) {\n        int price = base.priceOf(s);\n        int hour = Instant.ofEpochMilli(clock.nowMs()).atZone(zone).getHour();\n        if (hour &lt; fromHour || hour &gt;= toHour) return price;\n        int cut = price - (price * offPercent) / 100;\n        return cut - cut % Coin.R1.paise;                    // 15% off Rs 25 is Rs 21, in the customer&#x27;s favour\n    }\n}\n\n/**\n * How change is made. Given what coins are available and how much is owed, hand back a list of coins, or\n * null when it cannot be done. PURE: it never touches the float, so a refusal costs nothing.\n */\ninterface ChangeStrategy { List&lt;Coin&gt; plan(Map&lt;Coin, Integer&gt; available, int amountPaise); }\n\n/** Biggest coin first, one pass, no going back. Fast, and enough while the float is well stocked. */\nfinal class GreedyChange implements ChangeStrategy {\n    /** One pass biggest-first; null when the remainder cannot be finished. */\n    public List&lt;Coin&gt; plan(Map&lt;Coin, Integer&gt; available, int amountPaise) {\n        List&lt;Coin&gt; out = new ArrayList&lt;&gt;();\n        int left = amountPaise;\n        for (Coin c : Coin.descending()) {\n            int take = Math.min(available.getOrDefault(c, 0), left / c.paise);\n            for (int i = 0; i &lt; take; i++) out.add(c);\n            left -= take * c.paise;\n        }\n        return left == 0 ? List.copyOf(out) : null;\n    }\n}\n\n/**\n * Biggest coin first, but it puts a coin back and tries again when the tail dead-ends. This is the default:\n * a real float is lopsided, and greedy alone refuses sales the machine could complete.\n */\nfinal class BackoffChange implements ChangeStrategy {\n    /** A list of coins worth exactly the amount, or null when no combination of what is there adds up. */\n    public List&lt;Coin&gt; plan(Map&lt;Coin, Integer&gt; available, int amountPaise) {\n        List&lt;Coin&gt; out = new ArrayList&lt;&gt;();\n        return fill(Coin.descending(), 0, available, amountPaise, out) ? List.copyOf(out) : null;\n    }\n    /** Take as many of coin i as fit, then fewer, then fewer: the first tail that reaches zero wins. */\n    private boolean fill(List&lt;Coin&gt; denoms, int i, Map&lt;Coin, Integer&gt; have, int left, List&lt;Coin&gt; out) {\n        if (left == 0) return true;\n        if (i == denoms.size()) return false;\n        Coin c = denoms.get(i);\n        int max = Math.min(have.getOrDefault(c, 0), left / c.paise);\n        for (int k = max; k &gt;= 0; k--) {\n            for (int j = 0; j &lt; k; j++) out.add(c);\n            if (fill(denoms, i + 1, have, left - k * c.paise, out)) return true;\n            for (int j = 0; j &lt; k; j++) out.remove(out.size() - 1);\n        }\n        return false;\n    }\n}\n\n/**\n * The motor behind a column: it turns the coil and the item falls. The one irreversible thing the machine\n * does, and the one thing that can fail physically. Handed in, so tests can jam it.\n */\ninterface Dispenser { boolean drop(String slotCode); }\n\n/** The real motor. In this model it always turns. */\nfinal class Motor implements Dispenser {\n    /** Turn the coil behind a code; true when the item fell. */\n    public boolean drop(String slotCode) { return true; }\n}\n\n/** Something worth telling a screen or an operator about, taken as a snapshot inside the lock. */\nrecord MachineEvent(String kind, String slotCode, int qtyLeft, int floatPaise) {}\n\n/**\n * Anyone who wants to hear what the machine did. Called after the lock is released, never inside it, on\n * whichever thread made the sale, so two calls can overlap: an observer keeps its own state thread-safe.\n */\ninterface MachineObserver { void onEvent(MachineEvent e); }\n\n/** The screen on the front. Prints what happened. */\nfinal class Display implements MachineObserver {\n    /** Show the event. */\n    public void onEvent(MachineEvent e) {\n        System.out.println(&quot;   [display] &quot; + e.kind() + &quot; &quot; + e.slotCode() + &quot;, &quot; + e.qtyLeft()\n                           + &quot; left, float &quot; + Main.rs(e.floatPaise()));\n    }\n}\n\n/** The operator&#x27;s pager: it only cares about a column that just hit zero. */\nfinal class RestockAlert implements MachineObserver {\n    final List&lt;String&gt; empty = Collections.synchronizedList(new ArrayList&lt;&gt;());   // two sales can report at once\n    /** Record and print a column that just ran out. */\n    public void onEvent(MachineEvent e) {\n        if (e.qtyLeft() == 0 &amp;&amp; e.kind().equals(&quot;SOLD&quot;)) {\n            empty.add(e.slotCode());\n            System.out.println(&quot;   [restock alert] &quot; + e.slotCode() + &quot; is empty&quot;);\n        }\n    }\n}\n\n/**\n * The machine: the only owner of the slots, the coin float, the escrow and the tray, and the only holder\n * of the lock that guards them. Every entry point is one critical section, and nothing is committed until\n * the item has physically dropped.\n */\nfinal class VendingMachine {\n    /** How long coins may sit unspent after the customer&#x27;s last coin or press, before the machine hands them back. */\n    static final long ESCROW_TIMEOUT_MS = 30_000;\n\n    private final Inventory inventory = new Inventory();\n    private final CoinBox coinBox = new CoinBox();\n    private final Tray tray = new Tray();\n    private final List&lt;Coin&gt; escrow = new ArrayList&lt;&gt;();          // what this customer has put in, not yet ours\n    private long lastTouchMs;                                     // when this customer last pushed a coin or pressed a code\n    private final ReentrantLock lock = new ReentrantLock();\n    private final List&lt;MachineObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n    private MachineState state = MachineState.

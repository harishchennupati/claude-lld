 item has fallen, commit -- stock down one, escrow into the float, change out of the float, both\n     * into the tray. A refusal or a jam leaves every count exactly as it was. The sale&#x27;s event goes into\n     * events, for the caller to publish once the lock is released.\n     */\n    private Outcome sell(String code, List&lt;MachineEvent&gt; events) {\n        expireEscrow();\n        require(Action.SELECT);\n        lastTouchMs = clock.nowMs();                         // a press restarts the thirty seconds too\n        Slot s = inventory.slot(code);\n        int paid = Coin.total(escrow);\n\n        if (s == null)      return new Outcome(Status.UNKNOWN_SLOT, List.of(), List.of(), paid);\n        if (s.qty() == 0)   return new Outcome(Status.SOLD_OUT, List.of(), List.of(), paid);\n        int price = pricing.priceOf(s);\n        if (paid &lt; price)   return new Outcome(Status.NEED_MORE, List.of(), List.of(), price - paid);\n\n        List&lt;Coin&gt; change = changeRule.plan(coinBox.poolWith(escrow), paid - price);   // pure: nothing moves\n        if (change == null) {\n            List&lt;Coin&gt; back = refundToTray();\n            return new Outcome(Status.NO_CHANGE, List.of(), back, paid);\n        }\n\n        state = MachineState.DISPENSING;                     // the flap is open: nothing else may run until it shuts\n        boolean dropped;\n        try { dropped = motor.drop(code); } catch (RuntimeException jam) { dropped = false; }\n        if (!dropped) {\n            List&lt;Coin&gt; back = refundToTray();\n            return new Outcome(Status.JAMMED, List.of(), back, paid);\n        }\n\n        s.takeOne();                                         // from here down: field writes that cannot fail\n        coinBox.deposit(escrow);\n        escrow.clear();\n        coinBox.withdraw(change);\n        tray.put(s.product, change);\n        state = MachineState.IDLE;\n        events.add(new MachineEvent(&quot;SOLD&quot;, code, s.qty(), coinBox.totalPaise()));\n        return new Outcome(Status.SOLD, List.of(s.product), change, Coin.total(change));\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; It cannot make change. What happens, can you warn before they pay, and is greedy even the right algorithm?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The change rule is a pure function: given a copy of the float plus the coins in escrow and the amount owed, it returns the coins or null. When it returns null the machine refuses the sale, drops the whole escrow into the tray and goes back to idle, having touched neither the count nor the float. Warning first is the same function asked earlier: the advisor copies the float, adds the coins the customer is about to pay with, and asks whether the change could be made. That is the \"exact change only\" lamp on a real machine, and it is safe to run because it changes nothing. And no, greedy alone is not right. It gives the fewest coins only with canonical denominations (sets like 1, 2, 5, 10, 20, where biggest-first is always best) and unlimited coins, while a real float is lopsided. Asked for six rupees from one five and three twos it takes the five, cannot finish, and reports the change impossible &mdash; refusing a sale the machine could have made. The default rule starts greedy and, when the tail dead-ends, puts a coin back and tries again; because it tries every count of every coin, it never refuses change that exists. The drop-in below is a bounded subset-sum (which of the coins actually in the float add up to exactly the change?). It finds the same sales at a predictable cost, O(coins x amount), which matters only when five denominations become twenty.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: exact change lamp --------------------------------------------------------------------------\n/**\n * The &quot;exact change only&quot; lamp. Asks the change rule, against a copy of the float, whether a sale could be\n * completed BEFORE the customer commits. Pure: it cannot corrupt the float even if it is wrong.\n */\nfinal class ChangeAdvisor {\n    private final ChangeStrategy rule;\n\n    ChangeAdvisor(ChangeStrategy rule) { this.rule = rule; }\n    /** Would this column sell, if the customer paid with these coins? */\n    boolean canComplete(VendingMachine vm, String code, List&lt;Coin&gt; wouldPay) {\n        int price = vm.priceOf(code);\n        if (price &lt; 0 || vm.qty(code) &lt;= 0) return false;\n        int paid = Coin.total(wouldPay);\n        if (paid &lt; price) return false;\n        Map&lt;Coin, Integer&gt; pool = vm.floatSnapshot();\n        for (Coin c : wouldPay) pool.merge(c, 1, Integer::sum);\n        return rule.plan(pool, paid - price) != null;\n    }\n}\n\n// ---- ext: bounded change DP --------------------------------------------------------------------------\n/**\n * Exact change as a bounded subset-sum over the coins actually in the float. It finds the same sales as\n * BackoffChange (both find change whenever change exists), but at a predictable cost, O(coins x amount),\n * where back-off&#x27;s worst case grows with every denomination added. Drops into configure(): same interface.\n */\nfinal class DpChange implements ChangeStrategy {\n    /** A combination that adds up exactly, or null. O(coins x amount), which at a float this size is nothing. */\n    public List&lt;Coin&gt; plan(Map&lt;Coin, Integer&gt; available, int amountPaise) {\n        List&lt;Coin&gt; pool = new ArrayList&lt;&gt;();\n        for (Coin c : Coin.descending())\n            for (int i = 0; i &lt; available.getOrDefault(c, 0); i++) pool.add(c);\n        int n = pool.size();\n        boolean[][] reach = new boolean[n + 1][amountPaise + 1];\n        reach[0][0] = true;\n        for (int i = 0; i &lt; n; i++)\n            for (int a = 0; a &lt;= amountPaise; a++)\n                if (reach[i][a]) {\n                    reach[i + 1][a] = true;\n                    int with = a + pool.get(i).paise;\n                    if (with &lt;= amountPaise) reach[i + 1][with] = true;\n                }\n        if (!reach[n][amountPaise]) return null;\n        List&lt;Coin&gt; out = new ArrayList&lt;&gt;();\n        int a = amountPaise;\n        for (int i = n; i &gt; 0; i--) {\n            if (reach[i - 1][a]) continue;               // this coin was not needed\n            out.add(pool.get(i - 1));\n            a -= pool.get(i - 1).paise;\n        }\n        return List.copyOf(out);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>7 &middot; He feeds Rs 20 in and walks away. And the customer before him never took his chocolate.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two different leaks, and losing either one means losing somebody's property. Money first: the machine remembers when the customer last pushed a coin or pressed a code, and every button sweeps before it runs. So thirty seconds with no coin and no press puts the whole escrow in the tray, and a press after that is simply a press with no money in, refused like any other illegal button. A customer still feeding coins is never cut off, because each coin restarts the thirty seconds. No timer thread is needed, because the sweep happens on the next touch, and the test does not sleep, because the thirty seconds come from the injected clock. The item is the second leak: the tray holds a <i>list</i> of items, not one item, so the next sale drops its bar on top of the one nobody collected instead of silently replacing it. That is exactly what the bin in a real machine does. Test 9 moves the clock thirty-one seconds and finds the twenty rupees in the tray. It also shows that coins at 0 and 20 seconds with a press at 31 still sell. Test 10 sells twice with nobody reaching in and finds two bars.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Push a coin into the slot. It sits in escrow: it is not the machine&#x27;s money until a sale commits. */\n    void insertCoin(Coin c) {\n        lock.lock();\n        try {\n            expireEscrow();\n            require(Action.INSERT);\n            escrow.add(c);\n            lastTouchMs = clock.nowMs();                     // every coin restarts the thirty seconds\n            state = MachineState.HAS_MONEY;\n        } finally { lock.unlock(); }\n    }\n\n/**\n     * Money is never held for ever. Thirty seconds after the customer&#x27;s last coin or press, the coins go to\n     * the tray before the next button runs, so a press after that is a press with no money in. Every button\n     * calls this under the lock, which is why there is no timer thread and no sweeper to get wrong.\n     */\n    private void expireEscrow() {\n        if (!escrow.isEmpty() &amp;&amp; clock.nowMs() - lastTouchMs &gt;= ESCROW_TIMEOUT_MS) refundToTray();\n    }\n\n/**\n * The bin behind the flap: everything waiting for the customer&#x27;s hand. Items and their change after a sale,\n * refunded coins after a cancel, a refusal or a timed-out escrow. It KEEPS them: a second sale never\n * overwrites the bar the last customer forgot. Owned by the machine, guarded by its lock.\n */\nfinal class Tray {\n    private final List&lt;Product&gt; items = new ArrayList&lt;&gt;();\n    private final List&lt;Coin&gt; coins = new ArrayList&lt;&gt;();\n\n    /** Drop a sold item and its change in, on top of anything already waiting. */\n    void put(Product p, List&lt;Coin&gt; change) { items.add(p); coins.addAll(change); }\n    /** Drop coins in with no item: a cancel, a refusal, or an escrow that timed out. */\n    void putCoins(List&lt;Coin&gt; back) { coins.addAll(back); }\n    /** Nothing to pick up. */\n    boolean isEmpty() { return items.isEmpty() &amp;&amp; coins.isEmpty(); }\n    /** Empty the whole bin into the customer&#x27;s hand. Throws when there is nothing there. */\n    Outcome take() {\n        if (isEmpty()) throw new IllegalStateException(&quot;the tray is empty&quot;);\n        Outcome o = new Outcome(Status.COLLECTED, List.copyOf(items), List.copyOf(coins), Coin.total(coins));\n        items.clear(); coins.clear();\n        return o;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Take a card, not just coins.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The order is the same, with one swap: the card charge becomes the first irreversible step. Check the column has stock, charge the card, turn the motor, and only then take the unit off the coil. A card brings two cases coins cannot: the motor jams after the money moved, or the charge times out and nobody knows whether money moved. Both end in a refund, the compensating action (an undo that runs after the fact), sent with the sale's id. That id is an idempotency key (a unique id per sale, so a retried charge is taken once, and a refund undoes exactly that charge, or nothing if nothing was taken). A refund that fails goes on a retry list instead of being forgotten. Like the motor, the charge runs inside the lock, which is fine for one card reader. This sketch has its own stock and lock; on the coin machine it must run under the machine's one lock, or a card buyer and a coin buyer could both take the last unit.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: card payment -------------------------------------------------------------------------------\n/**\n * A card or UPI terminal. Both calls carry the sale&#x27;s id, an idempotency key (a unique id for this sale,\n * so a charge that is retried is taken once, and a refund knows exactly which charge it undoes).\n */\ninterface CardTerminal {\n    /** Charge once per sale id; a retry with the same id is not a second charge. False means declined. */\n    boolean charge(String saleId, int paise);\n    /** Give back whatever this sale id took. Taking nothing means nothing to give back, so it is safe to call to be sure. */\n    boolean refund(String saleId);\n}\n\n/**\n * Buying with a card instead of coins. Exactly the same ORDER as VendingMachine.select, with the card\n * charge as the first irreversible step: check stock, charge, drop, and only then take the stock down.\n * A card brings two cases coins cannot: the motor jams after the money moved, and the charge times out so\n * nobody knows whether money moved. Both end in refund(saleId), the compensating action, which undoes the\n * charge if it happened and does nothing if it did not. A refund that fails is kept for a retry, never\n * dropped. A sketch with its own inventory and lock: on the coin machine it must run under the machine&#x27;s lock.\n */\nfinal class CardCheckout {\n    private final Inventory inventory;\n    private final Dispenser motor;\n    private final CardTerminal card;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final AtomicInteger nextSale = new AtomicInteger();\n    /** Sale ids whose refund failed; a retry job calls refund(id) again until it returns true. */\n    final List&lt;String&gt; refundsToRetry = new CopyOnWriteArrayList&lt;&gt;();\n\n    CardCheckout(Inventory inventory, Dispenser motor, CardTerminal card) {\n        this.inventory = inventory; this.motor = motor; this.card = card;\n    }\n    /** One tap-and-press. Nothing is committed until the item has fallen; a jam or an unknown charge is refunded. */\n    Outcome buy(String code, int pricePaise) {\n        String saleId = &quot;sale-&quot; + nextSale.incrementAndGet();\n        lock.lock();\n        try {\n            Slot s = inventory.slot(code);\n            if (s == null)    return new Outcome(Status.UNKNOWN_SLOT, List.of(), List.of(), 0);\n            if (s.qty() == 0) return new Outcome(Status.SOLD_OUT, List.of(), List.of(), 0);\n            boolean charged;\n            try { charged = card.charge(saleId, pricePaise); }\n            catch (RuntimeException timeout) { refund(saleId); charged = false; }    // unknown: undo it, drop nothing\n            if (!charged) return new Outcome(Status.NEED_MORE, List.of(), List.of(), pricePaise);\n            boolean dropped;\n            try { dropped = motor.drop(code); } catch (RuntimeException jam) { dropped = false; }\n            if (!dropped) {\n                refund(saleId);                          // the compensating action: the money goes back\n                return new Outcome(Status.JAMMED, List.of(), List.of(), pricePaise);\n            }\n            s.takeOne();\n            return new Outcome(Status.SOLD, List.of(s.product), List.of(), pricePaise);\n        } finally { lock.unlock(); }\n    }\n    /** Refund by sale id; one that fails or times out goes on the retry list instead of being forgotten. */\n    private void refund(String saleId) {\n        boolean ok;\n        try { ok = card.refund(saleId); } catch (RuntimeException down) { ok = false; }\n        if (!ok) refundsToRetry.add(saleId);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; &quot;Hold my Coke, I will pay in thirty seconds.&quot;</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A hold takes the unit out of stock the moment it is made, so nobody else can buy it, and it carries the time it expires, computed from the injected clock. One hold per customer: a second hold gives his first unit back, so no unit can leak. Every entry point sweeps first: any hold whose time has passed puts its unit straight back into the column. Paying a live hold just removes it; paying an expired one returns false, and the unit is already back on sale. Because time is handed in, the test moves the clock thirty-one seconds forward instead of sleeping. It is the same sweep-on-touch trick the abandoned escrow uses, applied to stock instead of money.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: hold and pay -------------------------------------------------------------------------------\n/** A unit held for one customer until a moment in time. */\nrecord Hold(String code, String holder, long expiresAtMs) {}\n\n/**\n * &quot;Hold my Coke, I will pay in thirty seconds.&quot; A hold takes the unit out of stock immediately, so nobody\n * else can buy it, and a sweep puts it back the moment the hold expires. Time comes from the same injected\n * clock as everything else, so the test does not sleep.\n */\nfinal class HoldDesk {\n    private final Inventory inventory;\n    private final Clock clock;\n    private final long ttlMs;\n    private final Map&lt;String, Hold&gt; holds = new HashMap&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n\n    HoldDesk(Inventory inventory, Clock clock, long ttlMs) {\n        this.inventory = inventory; this.clock = clock; this.ttlMs = ttlMs;\n    }\n    /** Reserve one unit for a named holder, or null when the column is empty. One hold each: a new one returns the old unit. */\n    Hold hold(String code, String holder) {\n        lock.lock();\n        try {\n            sweep();\n            Slot s = inventory.slot(code);\n            if (s == null || s.qty() == 0) return null;\n            Hold old = holds.remove(holder);              // his earlier hold, if any: its unit goes back first\n            if (old != null) inventory.slot(old.code()).refill(1);\n            s.takeOne();                                  // out of stock from this instant: no double sell\n            Hold h = new Hold(code, holder, clock.nowMs() + ttlMs);\n            holds.put(holder, h);\n            return h;\n        } finally { lock.unlock(); }\n    }\n    /** Pay for a live hold. False when it had already expired and the unit went back. */\n    boolean pay(String holder) {\n        lock.lock();\n        try { sweep(); return holds.remove(holder) != null; } finally { lock.unlock(); }\n    }\n    /** Put back every unit whose hold has run out. Called on every entry point, under the lock; no timer thread needed. */\n    private void sweep() {\n        long now = clock.nowMs();\n        Iterator&lt;Map.Entry&lt;String, Hold&gt;&gt; it = holds.entrySet().iterator();\n        while (it.hasNext()) {\n            Hold h = it.next().getValue();\n            if (h.expiresAtMs() &lt;= now) { inventory.slot(h.code()).refill(1); it.remove(); }\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Persist the float and the counts. Then: a bank of machines shares one stock service.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The counts and the float go behind a repository interface with save and load, and the in-memory implementation is all a test needs. The sale path does not change, because the machine still writes the same maps under the same lock. For a shared service the interesting line is the decrement: what is a lock-protected <code>qty--</code> here becomes <code>UPDATE slot SET qty = qty - 1 WHERE code = ? AND qty &gt; 0</code>, and zero rows updated means another terminal got the last one. That is the database's compare-and-set, and it is the same idea as the lock: one atomic step decides the winner.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence --------------------------------------------------------------------------------\n/** Everything about a machine worth surviving a power cut. */\nrecord MachineSnapshot(Map&lt;Coin, Integer&gt; coins, Map&lt;String, Integer&gt; stock) {}\n\n/**\n * The seam that makes the machine outlive its process. The machine&#x27;s flow does not change: the maps it\n * writes under the lock are simply loaded at boot and saved after each commit.\n */\ninterface MachineRepository {\n    /** Write the whole snapshot for one machine. */\n    void save(String machineId, MachineSnapshot snap);\n    /** Read it back, or null when this machine has never been saved. */\n    MachineSnapshot load(String machineId);\n}\n\n/**\n * The in-memory implementation, which is all a test needs. The database version replaces the slot\n * decrement with a conditional update, which is the same idea as the lock:\n *   UPDATE slot SET qty = qty - 1 WHERE machine = ? AND code = ? AND qty &gt; 0;\n *   -- 1 row updated = you got the unit, 0 rows = another machine&#x27;s terminal got it\n */\nfinal class InMemoryMachineRepository implements MachineRepository {\n    private final Map&lt;String, MachineSnapshot&gt; rows = new HashMap&lt;&gt;();\n\n    /** Store a copy so a later mutation cannot change what was saved. */\n    public void save(String machineId, MachineSnapshot snap) {\n        rows.put(machineId, new MachineSnapshot(new EnumMap&lt;&gt;(snap.coins()), new TreeMap&lt;&gt;(snap.stock())));\n    }\n    /** Read it back. */\n    public MachineSnapshot load(String machineId) { return rows.get(machineId); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>11 &middot; The operator dashboard polls counts and cash a thousand times a second and wants low-stock alerts. No slowing the sale.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both halves are already there. A column's count is one map lookup and the float's worth is a sum over five denominations; only the full stock screen copies every column, a few dozen entries. A read holds the lock for well under a microsecond, so a sale never notices it, and it is never torn (read halfway through a sale's writes). The catch runs the other way: while a motor turns inside the lock, a poll waits up to two seconds. That is one more reason for rung one of the ladder, or for a dashboard that keeps its own copy from the events instead of polling. The alerts are listeners on the one small event every commit publishes after the lock is released, inside a try/catch: the pager records a column that hit zero, the low-cash watcher a float under its floor, a telemetry sink the sales per column. Two sales can report at once, so each keeps a thread-safe list or map. The dashboard itself is a separate role interface (an interface cut for one kind of user) over those reads, so an operator screen can never press the customer's buttons.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Which mode the machine is in. */\n    MachineState state() { lock.lock(); try { return state; } finally { lock.unlock(); } }\n    /** What this customer has put in and not yet spent, in paise. */\n    int escrowPaise() { lock.lock(); try { return Coin.total(escrow); } finally { lock.unlock(); } }\n    /** What the float is worth, in paise. */\n    int floatPaise() { lock.lock(); try { return coinBox.totalPaise(); } finally { lock.unlock(); } }\n    /** A copy of the float&#x27;s counts, for an operator screen or a &quot;can you make change?&quot; check. */\n    Map&lt;Coin, Integer&gt; floatSnapshot() { lock.lock(); try { return coinBox.snapshot(); } finally { lock.unlock(); } }\n    /** How many are left in a column. One map lookup. */\n    int qty(String code) {\n        lock.lock();\n        try { Slot s = inventory.slot(code); return s == null ? -1 : s.qty(); } finally { lock.unlock(); }\n    }\n    /** What a column costs right now, after whatever pricing rule is installed. */\n    int priceOf(String code) {\n        lock.lock();\n        try { Slot s = inventory.slot(code); return s == null ? -1 : pricing.priceOf(s); } finally { lock.unlock(); }\n    }\n    /** Every column&#x27;s count, for an operator screen: a copy of every column, so O(columns), a few dozen. */\n    Map&lt;String, Integer&gt; stockCounts() { lock.lock(); try { return inventory.counts(); } finally { lock.unlock(); } }\n\n// ---- ext: operator console ---------------------------------------------------------------------------\n/** What an operator is allowed to do, separate from the customer&#x27;s four buttons. */\ninterface OperatorConsole {\n    /** Every column&#x27;s count. */\n    Map&lt;String, Integer&gt; stock();\n    /** What the coin float is worth, in paise. */\n    int cashPaise();\n    /** Refill a column; returns how many went in. */\n    int restock(String code, int n);\n}\n\n/** The operator role, implemented by delegating to the machine&#x27;s existing reads and refills. */\nfinal class MachineConsole implements OperatorConsole {\n    private final VendingMachine vm;\n\n    MachineConsole(VendingMachine vm) { this.vm = vm; }\n    /** Every column&#x27;s count. */\n    public Map&lt;String, Integer&gt; stock() { return vm.stockCounts(); }\n    /** What the coin float is worth. */\n    public int cashPaise() { return vm.floatPaise(); }\n    /** Refill a column. */\n    public int restock(String code, int n) { return vm.restock(code, n); }\n}\n\n/** Telemetry: counts sales per column from the same events the screen listens to. Read-side only. */\nfinal class Telemetry implements MachineObserver {\n    final Map&lt;String, Integer&gt; salesPerSlot = Collections.synchronizedMap(new TreeMap&lt;&gt;());   // two sales can report at once\n    /** Count a sale. */\n    public void onEvent(MachineEvent e) {\n        if (e.kind().equals(&quot;SOLD&quot;)) salesPerSlot.merge(e.slotCode(), 1, Integer::sum);\n    }\n}\n\n/** Pages the operator when the float drops below the floor where change starts failing. */\nfinal class LowCashAlert implements MachineObserver {\n    private final int floorPaise;\n    final List&lt;String&gt; alerts = Collections.synchronizedList(new ArrayList&lt;&gt;());\n\n    LowCashAlert(int floorPaise) { this.floorPaise = floorPaise; }\n    /** Raise one alert per event that crosses the floor. */\n    public void onEvent(MachineEvent e) {\n        if (e.floatPaise() &lt; floorPaise) alerts.add(&quot;float below &quot; + Main.rs(floorPaise) + &quot;: &quot; + Main.rs(e.floatPaise()));\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>12 &middot; Where does time come from, and how do you test happy hour at midnight?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The machine is handed a <code>Clock</code>, a one-method interface, and the price rule reads that clock rather than the wall. A test hands in a clock that returns a fixed moment, asks for the price at ten in the morning, moves the same variable to half past four and asks again. The escrow timeout and the hold desk read the same clock, which is why both of those tests move time forward instead of sleeping. Nothing in this codebase calls <code>System.currentTimeMillis</code> except the default the machine starts with.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// 8. the price comes from the injected clock, so happy hour is testable at any hour\n        System.out.println(&quot;8. time is handed in&quot;);\n        VendingMachine hh = machine(3);\n        long[] now = { at(10, 0) };\n        hh.setClock(() -&gt; now[0]);\n        hh.configure(new HappyHourDiscount(new ListPrice(), () -&gt; now[0], 16, 18, 20), new BackoffChange(), new Motor());\n        check(hh.priceOf(&quot;B1&quot;) == 2500, &quot;at 10:00 the column costs its list price, Rs 25&quot;);\n        now[0] = at(16, 30);\n        check(hh.priceOf(&quot;B1&quot;) == 2000, &quot;at 16:30 the same column costs Rs 20&quot;);\n        hh.insertCoin(Coin.R20);\n        Outcome cheap = hh.select(&quot;B1&quot;);\n        check(cheap.status() == Status.SOLD &amp;&amp; cheap.paise() == 0, &quot;Rs 20 buys it outright during happy hour&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>13 &middot; Which pattern is where, and why did each one earn its place?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Each one is what a move produced, so name the move and then the line. Strategy is move 3: the price, the change algorithm and the motor are all things that will change, so each sits behind a one-method interface the machine is handed in <code>configure</code>. Decorator is the price rule below, which wraps the old price rule instead of replacing it. Observer is move 4's rule that a screen must never be inside the lock: the machine announces what happened and never learns who is listening. State is move 6: a table from mode to the actions that mode allows, checked before every action. The two worth saying without being asked are the absences. There is no Singleton, because panels are handed the machine and every test builds a fresh one, and no Factory until columns arrive from a planogram file as strings.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * A rule that WRAPS another rule instead of replacing it: the wrapped price, minus a percentage, between\n * two hours of the day. The hour comes from the handed-in clock, never from the wall clock.\n */\nfinal class HappyHourDiscount implements PricingStrategy {\n    private final PricingStrategy base;\n    private final Clock clock;\n    private final int fromHour, toHour, offPercent;\n    private final ZoneId zone = ZoneId.of(&quot;Asia/Kolkata&quot;);\n\n    HappyHourDiscount(PricingStrategy base, Clock clock, int fromHour, int toHour, int offPercent) {\n        if (offPercent &lt; 0 || offPercent &gt; 100) throw new IllegalArgumentException(&quot;discount of &quot; + offPercent + &quot;%&quot;);\n        this.base = base; this.clock = clock; this.fromHour = fromHour; this.toHour = toHour; this.offPercent = offPercent;\n    }\n    /**\n     * The base price, less the discount when the clock says we are inside the window, rounded DOWN to a\n     * whole rupee: the smallest coin is Rs 1, so a price like Rs 21.25 could never be paid or changed.\n     */\n    public int priceOf(Slot s) {\n        int price = base.priceOf(s);\n        int hour = Instant.ofEpochMilli(clock.nowMs()).atZone(zone).getHour();\n        if (hour &lt; fromHour || hour &gt;= toHour) return price;\n        int cut = price - (price * offPercent) / 100;\n        return cut - cut % Coin.R1.paise;                    // 15% off Rs 25 is Rs 21, in the customer&#x27;s favour\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Which SOLID letter is where in this code?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Not one of them was aimed at; each is a line some move already produced, which is the only convincing way to answer. D and I are the block below: the machine is handed its rules and never builds one, and every interface here has exactly one method, so a fake is a lambda and <code>code -&gt; false</code> is a jammed motor. O is the same line seen from the other side &mdash; happy hour and the DP change maker were each a new file plus one changed argument, and VendingMachine was never opened. L is <code>changeRule.plan(pool, due)</code>: the machine never asks which implementation it got. S is the class list itself: a slot tracks its count, the coin box the coins, the tray what is waiting, the machine the flow and the lock.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Hand in the rules. The machine never builds one itself, so a new offer or a new change algorithm is\n     * a new file and this one line. Under the lock, so a rule switched on a running machine is seen whole.\n     */\n    void configure(PricingStrategy p, ChangeStrategy c, Dispenser d) {\n        lock.lock();\n        try { pricing = p; changeRule = c; motor = d; } finally { lock.unlock(); }\n    }\n    /** Tests and replays hand in their own clock. */\n    void setClock(Clock c) { lock.lock(); try { clock = c; } finally { lock.unlock(); } }\n    /** Subscribe a screen, a pager, a telemetry sink. */\n    void addObserver(MachineObserver o) { observers.add(o); }\n    /** Install a column. */\n    void addSlot(Slot s) { lock.lock(); try { inventory.addSlot(s); } finally { lock.unlock(); } }\n\n/**\n * The motor behind a column: it turns the coil and the item falls. The one irreversible thing the machine\n * does, and the one thing that can fail physically. Handed in, so tests can jam it.\n */\ninterface Dispenser { boolean drop(String slotCode); }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; An enum of modes, or a class per mode? And where would a Factory pay?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>An enum plus a table, until a mode grows behaviour of its own. Four modes whose entire job is \"which buttons are legal here\" are data: one row each, and a new mode is one more row with nothing edited. Promote a row to a class the moment its mode has to remember something: out of service knowing which mode to hand back to, and still allowing the coin return so a paid customer is never stranded. Factory pays when columns stop being typed in code and start arriving as lines in a planogram file: one parser instead of a growing switch.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a mode with behaviour of its own -----------------------------------------------------------\n/**\n * When a mode stops being &quot;which actions are legal&quot; and grows behaviour of its own, promote the row in the\n * table to a class. This is the shape: each mode answers for itself and names the mode it returns to.\n */\ninterface Mode {\n    /** The name shown on the screen. */\n    String label();\n    /** Is this action legal here? */\n    boolean allows(Action a);\n    /** The mode after this action. */\n    Mode after(Action a);\n}\n\n/** Out of service, with a memory: it knows which mode to hand back to, and it still lets a customer cancel. */\nfinal class MaintenanceMode implements Mode {\n    private final Mode resumeTo;\n\n    MaintenanceMode(Mode resumeTo) { this.resumeTo = resumeTo; }\n    /** The name shown on the screen. */\n    public String label() { return &quot;OUT OF SERVICE&quot;; }\n    /** Only the coin return works: never strand a customer who already paid. */\n    public boolean allows(Action a) { return a == Action.CANCEL || a == Action.COLLECT || a == Action.SERVICE; }\n    /** SERVICE hands back to the mode this one interrupted; everything else stays here. */\n    public Mode after(Action a) { return a == Action.SERVICE ? resumeTo : this; }\n}\n\n/** The ordinary idle mode, so MaintenanceMode has something to resume to. */\nfinal class IdleMode implements Mode {\n    /** The name shown on the screen. */\n    public String label() { return &quot;INSERT COIN&quot;; }\n    /** Everything except selecting, which needs money first. */\n    public boolean allows(Action a) { return a != Action.SELECT; }\n    /** Idle stays idle unless an operator takes the machine away. */\n    public Mode after(Action a) { return this; }\n}\n\n// ---- ext: columns from config ------------------------------------------------------------------------\n/**\n * Where a Factory finally pays: columns that arrive as strings from a planogram file, so adding a product\n * is a line of configuration and not a line of code.\n */\nfinal class SlotFactory {\n    /** &quot;A1|LAY|Lays|2000|8|3&quot; -&gt; a Slot with that code, product, capacity and starting count. */\n    static Slot fromConfig(String line) {\n        String[] p = line.split(&quot;\\\\|&quot;);\n        return new Slot(p[0], new Product(p[1], p[2], Integer.parseInt(p[3])),\n                        Integer.parseInt(p[4]), Integer.parseInt(p[5]));\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\nimport java.time.*;\n\n/**\n * The coins and notes the machine accepts. Each is worth a fixed number of paise (100 paise = one rupee),\n * so all money in this file is an int and never a double.\n */\nenum Coin {\n    R1(100), R2(200), R5(500), R10(1000), R20(2000);\n    final int paise;\n    Coin(int paise) { this.paise = paise; }\n    /** What a handful of coins is worth, in paise. */\n    static int total(Collection<Coin> coins) {\n        int sum = 0;\n        for (Coin c : coins) sum += c.paise;\n        return sum;\n    }\n    /** The denominations from biggest to smallest: the order change-making walks. */\n    static List<Coin> descending() {\n        List<Coin> all = new ArrayList<>(List.of(values()));\n        all.sort((a, b) -> b.paise - a.paise);\n        return all;\n    }\n}\n\n/**\n * A catalogue entry: what the thing is and what it lists for. Slots point at products; a product can sit\n * in many machines, so it is referenced, never owned.\n */\nrecord Product(String sku, String name, int listPaise) {}\n\n/**\n * One column of the machine: the code you press, the product behind it, and how many are left. The count\n * is only ever read or written under the machine's lock.\n */\nfinal class Slot {\n    final String code;\n    final Product product;\n    final int capacity;\n    private int qty;                                   // guarded by VendingMachine.lock\n\n    Slot(String code, Product product, int capacity, int qty) {\n        this.code = code; this.product = product; this.capacity = capacity; this.qty = qty;\n    }\n    /** How many are left. Under the machine's lock. */\n    int qty() { return qty; }\n    /** Take one off the coil. Called only after the item has physically dropped, so it can never lose stock. */\n    void takeOne() {\n        if (qty <= 0) throw new IllegalStateException(\"slot \" + code + \" is empty\");\n        qty--;\n    }\n    /** Operator refill, capped by the column's capacity. Returns how many actually went in; a negative n is refused. */\n    int refill(int n) {\n        if (n < 0) throw new IllegalArgumentException(\"cannot refill \" + n + \" into \" + code);\n        int room = Math.min(n, capacity - qty);\n        qty += room;\n        return room;\n    }\n}\n\n/**\n * All the slots, keyed by the code on the keypad, so \"what is behind A1?\" is one map lookup. Owned by the\n * machine and guarded by its lock.\n */\nfinal class Inventory {\n    private final Map<String, Slot> slots = new HashMap<>();\n\n    /** Install a column. Setup and operator only. */\n    void addSlot(Slot s) { slots.put(s.code, s); }\n    /** The slot behind a code, or null when no such code exists. O(1). */\n    Slot slot(String code) { return slots.get(code); }\n    /** Every slot's remaining count, for an operator screen. */\n    Map<String, Integer> counts() {\n        Map<String, Integer> out = new TreeMap<>();\n        for (Slot s : slots.values()) out.put(s.code, s.qty());\n        return out;\n    }\n}\n\n/**\n * The coin float: how many of each denomination the machine is holding to give as change. An EnumMap, so\n * every count is one array index. Owned by the machine and guarded by its lock.\n */\nfinal class CoinBox {\n    private final Map<Coin, Integer> counts = new EnumMap<>(Coin.class);\n\n    CoinBox() { for (Coin c : Coin.values()) counts.put(c, 0); }\n    /** Operator load. Setup and refill only; a negative n is refused, so no count can go below zero. */\n    void load(Coin c, int n) {\n        if (n < 0) throw new IllegalArgumentException(\"cannot load \" + n + \" x \" + c);\n        counts.merge(c, n, Integer::sum);\n    }\n    /** Absorb coins into the float. Called on a committed sale, never before. */\n    void deposit(Collection<Coin> coins) { for (Coin c : coins) counts.merge(c, 1, Integer::sum); }\n    /** Pay coins out of the float. Throws if a coin is not there, which would mean the plan was stale. */\n    void withdraw(Collection<Coin> coins) {\n        for (Coin c : coins) {\n            int n = counts.get(c);\n            if (n == 0) throw new IllegalStateException(\"float has no \" + c);\n            counts.put(c, n - 1);\n        }\n    }\n    /** How many of one denomination are in the float. O(1). */\n    int count(Coin c) { return counts.get(c); }\n    /** What the float is worth, in paise. O(number of denominations) = O(5). */\n    int totalPaise() {\n        int sum = 0;\n        for (Map.Entry<Coin, Integer> e : counts.entrySet()) sum += e.getKey().paise * e.getValue();\n        return sum;\n    }\n    /** A copy of the counts, for an operator screen. */\n    Map<Coin, Integer> snapshot() { return new EnumMap<>(counts); }\n    /**\n     * A copy of float PLUS the coins still in escrow: everything change could be made from. Pure, so the\n     * machine can ask \"could I make this change?\" without ever touching the float.\n     */\n    Map<Coin, Integer> poolWith(Collection<Coin> escrow) {\n        Map<Coin, Integer> pool = new EnumMap<>(counts);\n        for (Coin c : escrow) pool.merge(c, 1, Integer::sum);\n        return pool;\n    }\n}\n\n/** How a press of a slot ended. The display shows this; it is not an error unless the machine says so. */\nenum Status { SOLD, SOLD_OUT, UNKNOWN_SLOT, NEED_MORE, NO_CHANGE, JAMMED, COLLECTED }\n\n/**\n * What a press produced: the outcome, whatever is now waiting in the tray, the coins that came with it, and\n * a number whose meaning depends on the status (NEED_MORE: how much is still short; everything else: the\n * paise in the coins). Items is a LIST because the tray keeps everything until somebody reaches in.\n */\nrecord Outcome(Status status, List<Product> items, List<Coin> coins, int paise) {\n    /** True only when an item actually dropped. */\n    boolean sold() { return status == Status.SOLD; }\n    /** The first item, or null when nothing dropped: the shorthand every caller and test wants. */\n    Product item() { return items.isEmpty() ? null : items.get(0); }\n}\n\n/**\n * The bin behind the flap: everything waiting for the customer's hand. Items and their change after a sale,\n * refunded coins after a cancel, a refusal or a timed-out escrow. It KEEPS them: a second sale never\n * overwrites the bar the last customer forgot. Owned by the machine, guarded by its lock.\n */\nfinal class Tray {\n    private final List<Product> items = new ArrayList<>();\n    private final List<Coin> coins = new ArrayList<>();\n\n    /** Drop a sold item and its change in, on top of anything already waiting. */\n    void put(Product p, List<Coin> change) { items.add(p); coins.addAll(change); }\n    /** Drop coins in with no item: a cancel, a refusal, or an escrow that timed out. */\n    void putCoins(List<Coin> back) { coins.addAll(back); }\n    /** Nothing to pick up. */\n    boolean isEmpty() { return items.isEmpty() && coins.isEmpty(); }\n    /** Empty the whole bin into the customer's hand. Throws when there is nothing there. */\n    Outcome take() {\n        if (isEmpty()) throw new IllegalStateException(\"the tray is empty\");\n        Outcome o = new Outcome(Status.COLLECTED, List.copyOf(items), List.copyOf(coins), Coin.total(coins));\n        items.clear(); coins.clear();\n        return o;\n    }\n}\n\n/** The four modes the machine can be in. A mode decides which actions are legal, nothing else. */\nenum MachineState { IDLE, HAS_MONEY, DISPENSING, OUT_OF_SERVICE }\n\n/** Everything a customer or an operator can do to the machine. PURCHASE is the one-step buy: coins and press together. */\nenum Action { INSERT, SELECT, CANCEL, COLLECT, SERVICE, PURCHASE }\n\n/**\n * Which actions are legal in which mode: a table, not an if-chain, so a new mode is one more row and no\n * existing line is edited. Anything not in the row is refused loudly. PURCHASE is only in the IDLE row:\n * while a walk-up customer's coins are in, a one-step buyer is refused instead of spending them.\n */\nfinal class Legal {\n    static final Map<MachineState, Set<Action>> ALLOWED = new EnumMap<>(MachineState.class);\n    static {\n        ALLOWED.put(MachineState.IDLE,           EnumSet.of(Action.INSERT, Action.CANCEL, Action.COLLECT, Action.SERVICE, Action.PURCHASE));\n        ALLOWED.put(MachineState.HAS_MONEY,      EnumSet.of(Action.INSERT, Action.SELECT, Action.CANCEL, Action.COLLECT));\n        ALLOWED.put(MachineState.DISPENSING,     EnumSet.noneOf(Action.class));\n        ALLOWED.put(MachineState.OUT_OF_SERVICE, EnumSet.of(Action.CANCEL, Action.COLLECT, Action.SERVICE));\n    }\n    private Legal() {}\n}\n\n/** Where time comes from. Handed in, so a test can say \"16:30 on a Tuesday\" and prices are replayable. */\ninterface Clock { long nowMs(); }\n\n/** What a slot costs right now. Behind an interface because it WILL change mid-round: offers, happy hour. */\ninterface PricingStrategy { int priceOf(Slot s); }\n\n/** The plain rule: the price printed on the column. */\nfinal class ListPrice implements PricingStrategy {\n    /** The product's list price, in paise. */\n    public int priceOf(Slot s) { return s.product.listPaise(); }\n}\n\n/**\n * A rule that WRAPS another rule instead of replacing it: the wrapped price, minus a percentage, between\n * two hours of the day. The hour comes from the handed-in clock, never from the wall clock.\n */\nfinal class HappyHourDiscount implements PricingStrategy {\n    private final PricingStrategy base;\n    private final Clock clock;\n    private final int fromHour, toHour, offPercent;\n    private final ZoneId zone = ZoneId.of(\"Asia/Kolkata\");\n\n    HappyHourDiscount(PricingStrategy base, Clock clock, int fromHour, int toHour, int offPercent) {\n        if (offPercent < 0 || offPercent > 100) throw new IllegalArgumentException(\"discount of \" + offPercent + \"%\");\n        this.base = base; this.clock = clock; this.fromHour = fromHour; this.toHour = toHour; this.offPercent = offPercent;\n    }\n    /**\n     * The base price, less the discount when the clock says we are inside the window, rounded DOWN to a\n     * whole rupee: the smallest coin is Rs 1, so a price like Rs 21.25 could never be paid or changed.\n     */\n    public int priceOf(Slot s) {\n        int price = base.priceOf(s);\n        int hour = Instant.ofEpochMilli(clock.nowMs()).atZone(zone).getHour();\n        if (hour < fromHour || hour >= toHour) return price;\n        int cut = price - (price * offPercent) / 100;\n        return cut - cut % Coin.R1.paise;                    // 15% off Rs 25 is Rs 21, in the customer's favour\n    }\n}\n\n/**\n * How change is made. Given what coins are available and how much is owed, hand back a list of coins, or\n * null when it cannot be done. PURE: it never touches the float, so a refusal costs nothing.\n */\ninterface ChangeStrategy { List<Coin> plan(Map<Coin, Integer> available, int amountPaise); }\n\n/** Biggest coin first, one pass, no going back. Fast, and enough while the float is well stocked. */\nfinal class GreedyChange implements ChangeStrategy {\n    /** One pass biggest-first; null when the remainder cannot be finished. */\n    public List<Coin> plan(Map<Coin, Integer> available, int amountPaise) {\n        List<Coin> out = new ArrayList<>();\n        int left = amountPaise;\n        for (Coin c : Coin.descending()) {\n            int take = Math.min(available.getOrDefault(c, 0), left / c.paise);\n            for (int i = 0; i < take; i++) out.add(c);\n            left -= take * c.paise;\n        }\n        return left == 0 ? List.copyOf(out) : null;\n    }\n}\n\n/**\n * Biggest coin first, but it puts a coin back and tries again when the tail dead-ends. This is the default:\n * a real float is lopsided, and greedy alone refuses sales the machine could complete.\n */\nfinal class BackoffChange implements ChangeStrategy {\n    /** A list of coins worth exactly the amount, or null when no combination of what is there adds up. */\n    public List<Coin> plan(Map<Coin, Integer> available, int amountPaise) {\n        List<Coin> out = new ArrayList<>();\n        return fill(Coin.descending(), 0, available, amountPaise, out) ? List.copyOf(out) : null;\n    }\n    /** Take as many of coin i as fit, then fewer, then fewer: the first tail that reaches zero wins. */\n    private boolean fill(List<Coin> denoms, int i, Map<Coin, Integer> have, int left, List<Coin> out) {\n        if (left == 0) return true;\n        if (i == denoms.size()) return false;\n        Coin c = denoms.get(i);\n        int max = Math.min(have.getOrDefault(c, 0), left / c.paise);\n        for (int k = max; k >= 0; k--) {\n            for (int j = 0; j < k; j++) out.add(c);\n            if (fill(denoms, i + 1, have, left - k * c.paise, out)) return true;\n            for (int j = 0; j < k; j++) out.remove(out.size() - 1);\n        }\n        return false;\n    }\n}\n\n/**\n * The motor behind a column: it turns the coil and the item falls. The one irreversible thing the machine\n * does, and the one thing that can fail physically. Handed in, so tests can jam it.\n */\ninterface Dispenser { boolean drop(String slotCode); }\n\n/** The real motor. In this model it always turns. */\nfinal class Motor implements Dispenser {\n    /** Turn the coil behind a code; true when the item fell. */\n    public boolean drop(String slotCode) { return true; }\n}\n\n/** Something worth telling a screen or an operator about, taken as a snapshot inside the lock. */\nrecord MachineEvent(String kind, String slotCode, int qtyLeft, int floatPaise) {}\n\n/**\n * Anyone who wants to hear what the machine did. Called after the lock is released, never inside it, on\n * whichever thread made the sale, so two calls can overlap: an observer keeps its own state thread-safe.\n */\ninterface MachineObserver { void onEvent(MachineEvent e); }\n\n/** The screen on the front. Prints what happened. */\nfinal class Display implements MachineObserver {\n    /** Show the event. */\n    public void onEvent(MachineEvent e) {\n        System.out.println(\"   [display] \" + e.kind() + \" \" + e.slotCode() + \", \" + e.qtyLeft()\n                           + \" left, float \" + Main.rs(e.floatPaise()));\n    }\n}\n\n/** The operator's pager: it only cares about a column that just hit zero. */\nfinal class RestockAlert implements MachineObserver {\n    final List<String> empty = Collections.synchronizedList(new ArrayList<>());   // two sales can report at once\n    /** Record and print a column that just ran out. */\n    public void onEvent(MachineEvent e) {\n        if (e.qtyLeft() == 0 && e.kind().equals(\"SOLD\")) {\n            empty.add(e.slotCode());\n            System.out.println(\"   [restock alert] \" + e.slotCode() + \" is empty\");\n        }\n    }\n}\n\n/**\n * The machine: the only owner of the slots, the coin float, the escrow and the tray, and the only holder\n * of the lock that guards them. Every entry point is one critical section, and nothing is committed until\n * the item has physically dropped.\n */\nfinal class VendingMachine {\n    /** How long coins may sit unspent after the customer's last coin or press, before the machine hands them back. */\n    static final long ESCROW_TIMEOUT_MS = 30_000;\n\n    private final Inventory inventory = new Inventory();\n    private final CoinBox coinBox = new CoinBox();\n    private final Tray tray = new Tray();\n    private final List<Coin> escrow = new ArrayList<>();          // what this customer has put in, not yet ours\n    private long lastTouchMs;                                     // when this customer last pushed a coin or pressed a code\n    private final ReentrantLock lock = new ReentrantLock();\n    private final List<MachineObserver> observers = new CopyOnWriteArrayList<>();\n    private MachineState state = MachineState.IDLE;\n    private PricingStrategy pricing = new ListPrice();\n    private ChangeStrategy changeRule = new BackoffChange();\n    private Dispenser motor = new Motor();\n    private Clock clock = System::currentTimeMillis;\n\n    /**\n     * Hand in the rules. The machine never builds one itself, so a new offer or a new change algorithm is\n     * a new file and this one line. Under the lock, so a rule switched on a running machine is seen whole.\n     */\n    void configure(PricingStrategy p, ChangeStrategy c, Dispenser d) {\n        lock.lock();\n        try { pricing = p; changeRule = c; motor = d; } finally { lock.unlock(); }\n    }\n    /** Tests and replays hand in their own clock. */\n    void setClock(Clock c) { lock.lock(); try { clock = c; } finally { lock.unlock(); } }\n    /** Subscribe a screen, a pager, a telemetry sink. */\n    void addObserver(MachineObserver o) { observers.add(o); }\n    /** Install a column. */\n    void addSlot(Slot s) { lock.lock(); try { inventory.addSlot(s); } finally { lock.unlock(); } }\n\n    // ---------------- the customer's four buttons ----------------\n\n    /** Push a coin into the slot. It sits in escrow: it is not the machine's money until a sale commits. */\n    void insertCoin(Coin c) {\n        lock.lock();\n        try {\n            expireEscrow();\n            require(Action.INSERT);\n            escrow.add(c);\n            lastTouchMs = clock.nowMs();                     // every coin restarts the thirty seconds\n            state = MachineState.HAS_MONEY;\n        } finally { lock.unlock(); }\n    }\n\n    /** Press a slot: take the lock, run the sale (sell, just below), and tell the observers only after the unlock. */\n    Outcome select(String code) {\n        List<MachineEvent> events = new ArrayList<>();\n        Outcome out;\n        lock.lock();\n        try { out = sell(code, events); } finally { lock.unlock(); }\n        publish(events);                                     // the screen hears AFTER the lock\n        return out;\n    }\n\n    /**\n     * THE critical step; the caller holds the lock. In this order: refuse for a reason that touches\n     * nothing (no such code, sold out, not enough money); prove the change can be made from float plus\n     * escrow WITHOUT touching the float; only then turn the motor, the one irreversible act; and only when\n     * the item has fallen, commit -- stock down one, escrow into the float, change out of the float, both\n     * into the tray. A refusal or a jam leaves every count exactly as it was. The sale's event goes into\n     * events, for the caller to publish once the lock is released.\n     */\n    private Outcome sell(String code, List<MachineEvent> events) {\n        expireEscrow();\n        require(Action.SELECT);\n        lastTouchMs = clock.nowMs();                         // a press restarts the thirty seconds too\n        Slot s = inventory.slot(code);\n        int paid = Coin.total(escrow);\n\n        if (s == null)      return new Outcome(Status.UNKNOWN_SLOT, List.of(), List.of(), paid);\n        if (s.qty() == 0)   return new Outcome(Status.SOLD_OUT, List.of(), List.of(), paid);\n        int price = pricing.priceOf(s);\n        if (paid < price)   return new Outcome(Status.NEED_MORE, List.of(), List.of(), price - paid);\n\n        List<Coin> change = changeRule.plan(coinBox.poolWith(escrow), paid - price);   // pure: nothing moves\n        if (change == null) {\n            List<Coin> back = refundToTray();\n            return new Outcome(Status.NO_CHANGE, List.of(), back, paid);\n        }\n\n        state = MachineState.DISPENSING;                     // the flap is open: nothing else may run until it shuts\n        boolean dropped;\n        try { dropped = motor.drop(code); } catch (RuntimeException jam) { dropped = false; }\n        if (!dropped) {\n            List<Coin> back = refundToTray();\n            return new Outcome(Status.JAMMED, List.of(), back, paid);\n        }\n\n        s.takeOne();                                         // from here down: field writes that cannot fail\n        coinBox.deposit(escrow);\n        escrow.clear();\n        coinBox.withdraw(change);\n        tray.put(s.product, change);\n        state = MachineState.IDLE;\n        events.add(new MachineEvent(\"SOLD\", code, s.qty(), coinBox.totalPaise()));\n        return new Outcome(Status.SOLD, List.of(s.product), change, Coin.total(change));\n    }\n\n    /** Coin return: exactly the coins this customer put in go to the tray, and the list is handed back. */\n    List<Coin> cancel() {\n        lock.lock();\n        try {\n            expireEscrow();\n            require(Action.CANCEL);\n            return refundToTray();\n        } finally { lock.unlock(); }\n    }\n\n    /** Empty the tray into the customer's hand. Throws when there is nothing to take. */\n    Outcome collect() {\n        lock.lock();\n        try {\n            expireEscrow();\n            require(Action.COLLECT);\n            return tray.take();\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * One buyer's whole transaction as a single locked step: their coins go in, the slot is pressed, and\n     * the tray is emptied before any other terminal can touch a count. This is what a phone app, a kiosk or\n     * the race test calls. Legal only in IDLE: while a walk-up customer's coins are in escrow it is refused,\n     * because spending them would hand one customer's money to another.\n     */\n    Outcome purchase(String code, List<Coin> paid) {\n        List<MachineEvent> events = new ArrayList<>();\n        Outcome o;\n        lock.lock();\n        try {\n            expireEscrow();\n            require(Action.PURCHASE);                       // somebody else's coins are in: refuse, never spend them\n            for (Coin c : paid) insertCoin(c);              // re-entrant: this thread already holds the lock\n            o = sell(code, events);\n            if (!o.sold()) cancel();                        // a one-shot buyer never leaves money behind\n            if (!tray.isEmpty()) o = collect();\n        } finally { lock.unlock(); }\n        publish(events);                                    // after the OUTER unlock, never inside it\n        return o;\n    }\n\n    // ---------------- the operator ----------------\n\n    /** Refill a column. Returns how many went in; the rest did not fit. */\n    int restock(String code, int n) {\n        int added;\n        MachineEvent event;\n        lock.lock();\n        try {\n            Slot s = inventory.slot(code);\n            if (s == null) throw new NoSuchElementException(\"no slot \" + code);\n            added = s.refill(n);\n            event = new MachineEvent(\"RESTOCKED\", code, s.qty(), coinBox.totalPaise());\n        } finally { lock.unlock(); }\n        publish(List.of(event));\n        return added;\n    }\n    /** Put change into the float. */\n    void loadFloat(Coin c, int n) {\n        lock.lock();\n        try { coinBox.load(c, n); } finally { lock.unlock(); }\n    }\n    /**\n     * Take the machine out of service, or put it back. Refused while a customer has money in (SERVICE is not\n     * in the HAS_MONEY row), so nobody is stranded mid-sale; an escrow abandoned for thirty seconds is swept first.\n     */\n    void setService(boolean outOfService) {\n        lock.lock();\n        try {\n            expireEscrow();\n            require(Action.SERVICE);\n            state = outOfService ? MachineState.OUT_OF_SERVICE : MachineState.IDLE;\n        } finally { lock.unlock(); }\n    }\n\n    // ---------------- the reads ----------------\n\n    /** Which mode the machine is in. */\n    MachineState state() { lock.lock(); try { return state; } finally { lock.unlock(); } }\n    /** What this customer has put in and not yet spent, in paise. */\n    int escrowPaise() { lock.lock(); try { return Coin.total(escrow); } finally { lock.unlock(); } }\n    /** What the float is worth, in paise. */\n    int floatPaise() { lock.lock(); try { return coinBox.totalPaise(); } finally { lock.unlock(); } }\n    /** A copy of the float's counts, for an operator screen or a \"can you make change?\" check. */\n    Map<Coin, Integer> floatSnapshot() { lock.lock(); try { return coinBox.snapshot(); } finally { lock.unlock(); } }\n    /** How many are left in a column. One map lookup. */\n    int qty(String code) {\n        lock.lock();\n        try { Slot s = inventory.slot(code); return s == null ? -1 : s.qty(); } finally { lock.unlock(); }\n    }\n    /** What a column costs right now, after whatever pricing rule is installed. */\n    int priceOf(String code) {\n        lock.lock();\n        try { Slot s = inventory.slot(code); return s == null ? -1 : pricing.priceOf(s); } finally { lock.unlock(); }\n    }\n    /** Every column's count, for an operator screen: a copy of every column, so O(columns), a few dozen. */\n    Map<String, Integer> stockCounts() { lock.lock(); try { return inventory.counts(); } finally { lock.unlock(); } }\n\n    // ---------------- the private helpers ----------------\n\n    /**\n     * Money is never held for ever. Thirty seconds after the customer's last coin or press, the coins go to\n     * the tray before the next button runs, so a press after that is a press with no money in. Every button\n     * calls this under the lock, which is why there is no timer thread and no sweeper to get wrong.\n     */\n    private void expireEscrow() {\n        if (!escrow.isEmpty() && clock.nowMs() - lastTouchMs >= ESCROW_TIMEOUT_MS) refundToTray();\n    }\n    /** Refuse an action the current mode does not allow, by name, so the failure is obvious. */\n    private void require(Action a) {\n        if (!Legal.ALLOWED.get(state).contains(a))\n            throw new IllegalStateException(a + \" is not allowed while \" + state);\n    }\n    /** Move the whole escrow to the tray and go back to idle. The only way money leaves unspent. */\n    private List<Coin> refundToTray() {\n        List<Coin> back = List.copyOf(escrow);\n        escrow.clear();\n        tray.putCoins(back);\n        if (state != MachineState.OUT_OF_SERVICE) state = MachineState.IDLE;\n        return back;\n    }\n    /** Tell everyone who subscribed, outside the lock, catching anything they throw. */\n    private void publish(List<MachineEvent> events) {\n        for (MachineEvent e : events)\n            for (MachineObserver o : observers) {\n                try { o.onEvent(e); } catch (RuntimeException ex) { System.err.println(\"[observer failed] \" + ex.getMessage()); }\n            }\n    }\n}\n\n/**\n * The front panel: the coin slot and the keypad. It remembers nothing of its own, it only calls the\n * machine. A second panel that pays and presses in one step (buy) changes nothing about the design; a\n * second COIN SLOT would, because each slot needs its own escrow (Extensions: PanelEscrow).\n */\nfinal class FrontPanel {\n    private final String id;\n    private final VendingMachine machine;\n\n    FrontPanel(String id, VendingMachine machine) { this.id = id; this.machine = machine; }\n    /** Which panel this is, for logs. */\n    String id() { return id; }\n    /** Push a coin in. */\n    void insert(Coin c) { machine.insertCoin(c); }\n    /** Press a slot. */\n    Outcome press(String code) { return machine.select(code); }\n    /** Pay and press in one go, as a phone app or a kiosk does. Refused while a walk-up customer's coins are in. */\n    Outcome buy(String code, List<Coin> coins) { return machine.purchase(code, coins); }\n}\n\n/** Runs a demo of the machine, then a many-thread race for the last item in a column. */\npublic class Main {\n    /** Paise printed as rupees. */\n    static String rs(int paise) { return \"Rs \" + (paise / 100) + \".\" + String.format(\"%02d\", paise % 100); }\n\n    /** A machine stocked the way the page describes it: three columns and a small float. */\n    static VendingMachine stocked() {\n        VendingMachine vm = new VendingMachine();\n        vm.addSlot(new Slot(\"A1\", new Product(\"LAY\", \"Lays\", 2000), 8, 3));\n        vm.addSlot(new Slot(\"A2\", new Product(\"COK\", \"Coke\", 3500), 8, 2));\n        vm.addSlot(new Slot(\"B1\", new Product(\"DMK\", \"Dairy Milk\", 2500), 8, 3));\n        vm.loadFloat(Coin.R1, 10);\n        vm.loadFloat(Coin.R2, 10);\n        vm.loadFloat(Coin.R5, 6);\n        vm.loadFloat(Coin.R10, 4);\n        return vm;\n    }\n\n    public static void main(String[] args) throws Exception {\n        VendingMachine vm = stocked();\n        RestockAlert pager = new RestockAlert();\n        vm.addObserver(new Display());\n        vm.addObserver(pager);\n\n        System.out.println(\"-- a normal sale: Dairy Milk at \" + rs(2500) + \", paid with Rs 30\");\n        vm.insertCoin(Coin.R20);\n        vm.insertCoin(Coin.R10);\n        Outcome sale = vm.select(\"B1\");\n        System.out.println(\"   \" + sale.status() + \" \" + sale.item().name() + \", change \" + sale.coins()\n                           + \" = \" + rs(sale.paise()) + \"; B1 left \" + vm.qty(\"B1\"));\n        System.out.println(\"   tray -> \" + vm.collect().item().name());\n\n        System.out.println(\"-- not enough money, then the coin return\");\n        vm.insertCoin(Coin.R10);\n        Outcome short_ = vm.select(\"A2\");\n        System.out.println(\"   \" + short_.status() + \": \" + rs(short_.paise()) + \" more needed; escrow still \"\n                           + rs(vm.escrowPaise()));\n        System.out.println(\"   cancel gives back \" + vm.cancel() + \"; escrow \" + rs(vm.escrowPaise()));\n        vm.collect();\n\n        System.out.println(\"-- he feeds a coin in and walks away: the money comes back by itself\");\n        VendingMachine walked = stocked();\n        long[] t = { LocalDateTime.of(2026, 9, 15, 12, 0).atZone(ZoneId.of(\"Asia/Kolkata\")).toInstant().toEpochMilli() };\n        walked.setClock(() -> t[0]);\n        walked.insertCoin(Coin.R20);\n        t[0] += 31_000;                                              // thirty-one seconds later\n        walked.insertCoin(Coin.R1);                                  // the next touch sweeps first\n        System.out.println(\"   escrow is now \" + rs(walked.escrowPaise()) + \"; the abandoned \"\n                           + rs(Coin.total(walked.collect().coins())) + \" is waiting in the tray\");\n\n        System.out.println(\"-- the float cannot make change: refuse, refund, stock untouched\");\n        VendingMachine lop = new VendingMachine();\n        lop.addSlot(new Slot(\"B1\", new Product(\"DMK\", \"Dairy Milk\", 2500), 8, 3));\n        lop.loadFloat(Coin.R10, 1);                                  // Rs 10 only: Rs 15 change is impossible\n        lop.insertCoin(Coin.R20);\n        lop.insertCoin(Coin.R20);\n        Outcome refused = lop.select(\"B1\");\n        System.out.println(\"   \" + refused.status() + \", refunded \" + refused.coins() + \"; B1 left \"\n                           + lop.qty(\"B1\") + \"; float \" + rs(lop.floatPaise()));\n        lop.collect();\n\n        System.out.println(\"-- greedy alone would refuse this sale; backing off finds the coins\");\n        Map<Coin, Integer> lopsided = new EnumMap<>(Map.of(Coin.R5, 1, Coin.R2, 3));\n        System.out.println(\"   greedy for \" + rs(600) + \" from {R5 x1, R2 x3}: \" + new GreedyChange().plan(lopsided, 600));\n        System.out.println(\"   backoff for \" + rs(600) + \" from {R5 x1, R2 x3}: \" + new BackoffChange().plan(lopsided, 600));\n\n        System.out.println(\"-- happy hour: the same column, priced by the injected clock\");\n        VendingMachine hh = stocked();\n        long fourThirty = LocalDateTime.of(2026, 9, 15, 16, 30).atZone(ZoneId.of(\"Asia/Kolkata\")).toInstant().toEpochMilli();\n        hh.setClock(() -> fourThirty);\n        hh.configure(new HappyHourDiscount(new ListPrice(), () -> fourThirty, 16, 18, 20), new BackoffChange(), new Motor());\n        System.out.println(\"   B1 lists at \" + rs(2500) + \", at 16:30 it costs \" + rs(hh.priceOf(\"B1\")));\n\n        // the race: forty panels press for the last Lays at the same instant\n        VendingMachine last = stocked();\n        while (last.qty(\"A1\") > 1) last.purchase(\"A1\", List.of(Coin.R20));    // burn down to one\n        last.addObserver(pager);\n        System.out.println(\"-- forty panels press A1 at the same instant, \" + last.qty(\"A1\") + \" left\");\n        int panels = 40;\n        CountDownLatch go = new CountDownLatch(1);\n        CountDownLatch done = new CountDownLatch(panels);\n        List<Outcome> results = Collections.synchronizedList(new ArrayList<>());\n        int floatBefore = last.floatPaise();\n        for (int i = 0; i < panels; i++) {\n            final FrontPanel panel = new FrontPanel(\"P\" + i, last);\n            new Thread(() -> {\n                try { go.await(); results.add(panel.buy(\"A1\", List.of(Coin.R20))); }\n                catch (Exception e) { results.add(new Outcome(Status.JAMMED, List.of(), List.of(), 0)); }\n                finally { done.countDown(); }\n            }).start();\n        }\n        go.countDown();\n        done.await();\n        long sold = results.stream().filter(o -> o.item() != null).count();\n        long handedBack = results.stream().filter(o -> o.item() == null).mapToInt(Outcome::paise).sum();\n        System.out.println(\"   items dispensed: \" + sold + \" (must be 1); refused: \" + (panels - sold)\n                           + \"; money handed back \" + rs((int) handedBack));\n        System.out.println(\"   A1 left \" + last.qty(\"A1\") + \"; float grew by \"\n                           + rs(last.floatPaise() - floatBefore) + \" (exactly one price)\");\n        System.out.println(\"   restock alerts: \" + pager.empty);\n    }\n}\n", "f1": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist; nothing here edits Main.java.\n\n// ---- ext: card payment -------------------------------------------------------------------------------\n/**\n * A card or UPI terminal. Both calls carry the sale's id, an idempotency key (a unique id for this sale,\n * so a charge that is retried is taken once, and a refund knows exactly which charge it undoes).\n */\ninterface CardTerminal {\n    /** Charge once per sale id; a retry with the same id is not a second charge. False means declined. */\n    boolean charge(String saleId, int paise);\n    /** Give back whatever this sale id took. Taking nothing means nothing to give back, so it is safe to call to be sure. */\n    boolean refund(String saleId);\n}\n\n/**\n * Buying with a card instead of coins. Exactly the same ORDER as VendingMachine.select, with the card\n * charge as the first irreversible step: check stock, charge, drop, and only then take the stock down.\n * A card brings two cases coins cannot: the motor jams after the money moved, and the charge times out so\n * nobody knows whether money moved. Both end in refund(saleId), the compensating action, which undoes the\n * charge if it happened and does nothing if it did not. A refund that fails is kept for a retry, never\n * dropped. A sketch with its own inventory and lock: on the coin machine it must run under the machine's lock.\n */\nfinal class CardCheckout {\n    private final Inventory inventory;\n    private final Dispenser motor;\n    private final CardTerminal card;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final AtomicInteger nextSale = new AtomicInteger();\n    /** Sale ids whose refund failed; a retry job calls refund(id) again until it returns true. */\n    final List<String> refundsToRetry = new CopyOnWriteArrayList<>();\n\n    CardCheckout(Inventory inventory, Dispenser motor, CardTerminal card) {\n        this.inventory = inventory; this.motor = motor; this.card = card;\n    }\n    /** One tap-and-press. Nothing is committed until the item has fallen; a jam or an unknown charge is refunded. */\n    Outcome buy(String code, int pricePaise) {\n        String saleId = \"sale-\" + nextSale.incrementAndGet();\n        lock.lock();\n        try {\n            Slot s = inventory.slot(code);\n            if (s == null)    return new Outcome(Status.UNKNOWN_SLOT, List.of(), List.of(), 0);\n            if (s.qty() == 0) return new Outcome(Status.SOLD_OUT, List.of(), List.of(), 0);\n            boolean charged;\n            try { charged = card.charge(saleId, pricePaise); }\n            catch (RuntimeException timeout) { refund(saleId); charged = false; }    // unknown: undo it, drop nothing\n            if (!charged) return new Outcome(Status.NEED_MORE, List.of(), List.of(), pricePaise);\n            boolean dropped;\n            try { dropped = motor.drop(code); } catch (RuntimeException jam) { dropped = false; }\n            if (!dropped) {\n                refund(saleId);                          // the compensating action: the money goes back\n                return new Outcome(Status.JAMMED, List.of(), List.of(), pricePaise);\n            }\n            s.takeOne();\n            return new Outcome(Status.SOLD, List.of(s.product), List.of(), pricePaise);\n        } finally { lock.unlock(); }\n    }\n    /** Refund by sale id; one that fails or times out goes on the retry list instead of being forgotten. */\n    private void refund(String saleId) {\n        boolean ok;\n        try { ok = card.refund(saleId); } catch (RuntimeException down) { ok = false; }\n        if (!ok) refundsToRetry.add(saleId);\n    }\n}\n\n// ---- ext: exact change lamp --------------------------------------------------------------------------\n/**\n * The \"exact change only\" lamp. Asks the change rule, against a copy of the float, whether a sale could be\n * completed BEFORE the customer commits. Pure: it cannot corrupt the float even if it is wrong.\n */\nfinal class ChangeAdvisor {\n    private final ChangeStrategy rule;\n\n    ChangeAdvisor(ChangeStrategy rule) { this.rule = rule; }\n    /** Would this column sell, if the customer paid with these coins? */\n    boolean canComplete(VendingMachine vm, String code, List<Coin> wouldPay) {\n        int price = vm.priceOf(code);\n        if (price < 0 || vm.qty(code) <= 0) return false;\n        int paid = Coin.total(wouldPay);\n        if (paid < price) return false;\n        Map<Coin, Integer> pool = vm.floatSnapshot();\n        for (Coin c : wouldPay) pool.merge(c, 1, Integer::sum);\n        return rule.plan(pool, paid - price) != null;\n    }\n}\n\n// ---- ext: bounded change DP --------------------------------------------------------------------------\n/**\n * Exact change as a bounded subset-sum over the coins actually in the float. It finds the same sales as\n * BackoffChange (both find change whenever change exists), but at a predictable cost, O(coins x amount),\n * where back-off's worst case grows with every denomination added. Drops into configure(): same interface.\n */\nfinal class DpChange implements ChangeStrategy {\n    /** A combination that adds up exactly, or null. O(coins x amount), which at a float this size is nothing. */\n    public List<Coin> plan(Map<Coin, Integer> available, int amountPaise) {\n        List<Coin> pool = new ArrayList<>();\n        for (Coin c : Coin.descending())\n            for (int i = 0; i < available.getOrDefault(c, 0); i++) pool.add(c);\n        int n = pool.size();\n        boolean[][] reach = new boolean[n + 1][amountPaise + 1];\n        reach[0][0] = true;\n        for (int i = 0; i < n; i++)\n            for (int a = 0; a <= amountPaise; a++)\n                if (reach[i][a]) {\n                    reach[i + 1][a] = true;\n                    int with = a + pool.get(i).paise;\n                    if (with <= amountPaise) reach[i + 1][with] = true;\n                }\n        if (!reach[n][amountPaise]) return null;\n        List<Coin> out = new ArrayList<>();\n        int a = amountPaise;\n        for (int i = n; i > 0; i--) {\n            if (reach[i - 1][a]) continue;               // this coin was not needed\n            out.add(pool.get(i - 1));\n            a -= pool.get(i - 1).paise;\n        }\n        return List.copyOf(out);\n    }\n}\n\n// ---- ext: hold and pay -------------------------------------------------------------------------------\n/** A unit held for one customer until a moment in time. */\nrecord Hold(String code, String holder, long expiresAtMs) {}\n\n/**\n * \"Hold my Coke, I will pay in thirty seconds.\" A hold takes the unit out of stock immediately, so nobody\n * else can buy it, and a sweep puts it back the moment the hold expires. Time comes from the same injected\n * clock as everything else, so the test does not sleep.\n */\nfinal class HoldDesk {\n    private final Inventory inventory;\n    private final Clock clock;\n    private final long ttlMs;\n    private final Map<String, Hold> holds = new HashMap<>();\n    private final ReentrantLock lock = new ReentrantLock();\n\n    HoldDesk(Inventory inventory, Clock clock, long ttlMs) {\n        this.inventory = inventory; this.clock = clock; this.ttlMs = ttlMs;\n    }\n    /** Reserve one unit for a named holder, or null when the column is empty. One hold each: a new one returns the old unit. */\n    Hold hold(String code, String holder) {\n        lock.lock();\n        try {\n            sweep();\n            Slot s = inventory.slot(code);\n            if (s == null || s.qty() == 0) return null;\n            Hold old = holds.remove(holder);              // his earlier hold, if any: its unit goes back first\n            if (old != null) inventory.slot(old.code()).refill(1);\n            s.takeOne();                                  // out of stock from this instant: no double sell\n            Hold h = new Hold(code, holder, clock.nowMs() + ttlMs);\n            holds.put(holder, h);\n            return h;\n        } finally { lock.unlock(); }\n    }\n    /** Pay for a live hold. False when it had already expired and the unit went back. */\n    boolean pay(String ho

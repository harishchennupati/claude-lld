.k{color:#c792ea} .s{color:#c3e88d} .c{color:#5c6773;font-style:italic} .n{color:#f78c6c} .t{color:#82aaff}
.nav{display:flex;gap:10px;padding:0 22px 24px} .nav button{background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit} .nav button.pri{background:var(--acc);color:#04211a;border-color:var(--acc);font-weight:600}

#cd{width:100%;height:auto;display:block} .nd rect{fill:var(--bg3);stroke:var(--line);stroke-width:1.2} .nd text{fill:var(--text);font-family:var(--mono)} .nd .lb{font-size:12px} .nd .sb{font-size:9.5px;fill:var(--muted)}

.prompt{background:var(--bg3);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 6px 6px 0;font-style:italic;margin-bottom:10px}

.right .lock{display:none;color:var(--muted);padding:40px 10px;text-align:center;border:1px dashed var(--line);border-radius:8px} .right.locked .lock{display:block} .right.locked #cd,.right.locked .legend,.right.locked .pat,.right.locked h3:nth-of-type(2){display:none} summary small{color:var(--muted);font-weight:400}

ul.chk{list-style:none;padding:0;margin:6px 0} ul.chk li::before{content:"[ ] ";font-family:var(--mono);color:var(--muted)}

<div class="top"><h1>Vending Machine</h1><span class="sub">LLD &middot; Java &middot; OpenJDK 21 &middot; demo, 14 failure tests and a 40-thread race pass</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design a vending machine. Several columns of products with prices and counts, coins in, the item and the change out, and a coin return button. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>A box on a wall with a few columns of snacks. Each column has a code you press, one product and a count of how many are left. You push coins in one at a time; they sit inside the machine in escrow (held, but still yours) until something is sold. You press a code, and the machine either drops the item with your change, or tells you why it will not: no such code, that column is empty, you are short, or it cannot make your change from the coins it is holding. A coin return button gives you back exactly the coins you put in, right up to the moment the item falls. If you wander off with money still inside, the machine returns it half a minute after your last coin rather than keeping it. An operator refills the columns and the coin float (the coins the machine keeps for giving change). The one thing that must always be true (the invariant) is that money and stock stay in step. A unit leaves the machine only when it has been paid for, and every paise that went in comes back as change or a refund, or stays in the float.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that buys something and prints the change. The interviewer is watching for, in this order: the questions you ask before typing (money first or select first, and what happens when change is impossible, are the first two); which classes exist and which one owns the counts and which one owns the coins; a sale end to end; what happens when two panels press for the last unit; where the rules that will change (the price, the change algorithm) live, so a change is a new class and not an edit; and what the machine looks like after the motor jams with your money inside. Then the twists: cards, an exact-change lamp, holding an item, operator alerts, a bank of machines sharing stock.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 340\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">buy</text><g transform=\"translate(150 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">coins go into the slot</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">they sit in escrow, not ours yet</text></g><path d=\"M400 57 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press A1: prove the sale</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">stock, price and change, all proven</text></g><path d=\"M670 57 H690\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(690 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the motor turns</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the one act that cannot be undone</text></g><path d=\"M940 57 H960\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(960 30)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">commit: stock, float, tray</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">kept in the tray until you take them</text></g><text x=\"88\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">coin return</text><g transform=\"translate(150 165)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">press coin return</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">any time before the item drops</text></g><path d=\"M400 192 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 165)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the escrow, coin for coin</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the same coins, not the same total</text></g><path d=\"M670 192 H690\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(690 165)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">into the tray</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the machine keeps nothing</text></g><path d=\"M940 192 H960\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(960 165)\"><rect width=\"250\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">back to idle</text><text x=\"125.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">ready for the next customer</text></g><path d=\"M545 84 V95\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(330 95)\"><rect width=\"430\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"215.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">sold out, too little, or no change: nothing moves</text></g><text x=\"88\" y=\"262\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"150\" y=\"262\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, without counting anything: how many are left in A1?  what is the float worth?  what does B1 cost right now?</text><text x=\"88\" y=\"292\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">operator</text><text x=\"150\" y=\"292\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">refill a column, top up the coin float, take the machine out of service (never while a customer's coins are in)</text><text x=\"615\" y=\"324\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">a keypad and a phone can press at the same instant: one unit is sold once, and every paise that goes in comes out as change, a refund, or the float</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>How many columns, and does each one carry its own price and count?</td><td>Several; yes, both</td><td>A Slot class and a map by code (moves 1, 5)</td></tr><tr><td>Coins only, or card too? And does the machine give change?</td><td>Coins now, change yes, card later</td><td>A coin box with a float, and change behind an interface (move 3)</td></tr><tr><td>Money first then select, or select then pay?</td><td>Money first; the coins sit in escrow</td><td>Two of the four modes, and what the coin return means (move 6)</td></tr><tr><td>What happens when exact change cannot be made?</td><td>Refuse and refund everything</td><td>The change is proven before anything moves (move 6)</td></tr><tr><td>One keypad, or can a card reader and a phone press at the same time? Do they share the coin slot?</td><td>Two can press; one coin slot</td><td>One lock in the machine, ONE escrow, and a phone may buy only while that escrow is empty (moves 4, 6)</td></tr><tr><td>Can the motor fail after the money is inside?</td><td>Yes, and the money must come back</td><td>The drop is the irreversible step; commit after it (moves 6, 9)</td></tr><tr><td>Are operator actions in scope: restock, refill the float, alerts?</td><td>Yes, and one screen listens</td><td>An observer plus two operator methods (moves 3, 12)</td></tr><tr><td>One machine in memory, or a bank of machines on a shared service?</td><td>One machine, one process</td><td>No repository (a save-and-load interface) yet; a follow-up adds one (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Coins go in one at a time and sit in escrow until a sale commits.</li>\n<li>Press a slot code: sell when there is stock, the money covers the price, and exact change can be made.</li>\n<li>Refuse with a reason &mdash; unknown code, sold out, not enough money &mdash; without touching the money.</li>\n<li>Refund everything when exact change cannot be made from the float plus the escrow.</li>\n<li>Coin return any time before the item drops: the same coins back, not the same total. Thirty seconds after the last coin or press, the machine hands them back by itself.</li>\n<li>The item and its change land in a tray that keeps them until somebody reaches in: a second sale never overwrites the bar the last customer forgot.</li>\n<li>Operator: restock a column, refill the coin float, take the machine out of service.</li>\n<li>The price is a rule that can change (happy hour) without touching the machine.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Two buyers at the same instant: a unit is sold once, no paise appears or disappears, and one customer's coins never pay for another's item.</li>\n<li>Money is exact: integer paise, never a <code>double</code>.</li>\n<li>\"How many are left?\" and \"what is the float worth?\" are O(1), never a count of anything.</li>\n<li>The price rule and the change algorithm are swappable without opening the machine.</li>\n<li>One source of truth for stock and for cash: the machine's slots and coin box, behind one lock.</li>\n<li>Nothing half-done: a refusal or a jam leaves stock, float and escrow exactly as they were.</li>\n<li>In memory, one process, no persistence (say it; a follow-up adds it).</li></ul></div></div>\n<div class=\"move\"><h3>One evening, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">17:02  Rs 30 for a Dairy Milk</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">escrow: Rs 20 + Rs 10 = Rs 30</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">Rs 5 change is proven first</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the motor turns, then stock 3 -> 2</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">float 100 -> 125; bar + Rs 5 out</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">17:05  Rs 10 for a Rs 35 Coke</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">Rs 25 short, so nothing happens</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">not one paise of the escrow moves</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">coin return gives that Rs 10 back</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">17:09  a second machine</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">its float is one Rs 10 coin</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">Rs 40 in; Rs 15 change: impossible</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">refused; Rs 40 to the tray, stock 3</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">17:30  two phones, one Lays left</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">both read '1 left' at one instant</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the lock lets exactly one through</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one item out; loser gets Rs 20 back</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">A1 hits 0 and the pager fires</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> money is integer paise, never a double; inserted coins sit in escrow and become the machine's only when a sale commits; the change is proven from float plus escrow before anything moves; the motor turning is the irreversible step, so stock goes down after it and never before; money is never held for ever, so an escrow nobody comes back for goes to the tray; one machine, one lock, in memory, one process. Named as out of scope: cards and UPI, holding an item until you pay, a bank of machines on a shared stock service, persistence &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, elevator, Splitwise) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a CUSTOMER pushes COINS into a MACHINE; a SLOT holds a PRODUCT and a COUNT; the COIN BOX makes CHANGE; the TRAY holds what you take</text><g transform=\"translate(20 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Slot</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">code, product, count</text></g><path d=\"M112 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(220 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CoinBox</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">how many of each coin</text></g><path d=\"M312 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Tray</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what is waiting to be taken</text></g><path d=\"M512 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(620 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">VendingMachine</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">slots, float, escrow, lock</text></g><path d=\"M712 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(820 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Coin</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a fixed list of values: enum</text></g><path d=\"M912 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1020 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Front panel</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: a thin caller</text></g><path d=\"M1112 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a fixed list of values, or a caller</text></svg></div><div class=\"move\"><p>Reading the paragraph again: a <b>customer</b> pushes <b>coins</b> into a <b>machine</b>; a <b>slot</b> holds a <b>product</b> and a <b>count</b>; the <b>coin box</b> makes <b>change</b>; the item and the change land in a <b>tray</b>. A slot has a code, a product and a count, so it is a class. The coin box has how many of each coin it holds: a class. The tray has whatever is waiting to be picked up: a class. The machine holds all of those plus the coins this customer has pushed in so far: a class, and the only one with a lock. A coin is a fixed list of values with a price in paise, so it is an enum, not a class. A product is a catalogue entry the slot points at. The front panel remembers nothing, so it is a thin caller: a phone that pays and presses in one step changes no class. A second coin slot would, because each slot needs its own escrow; that is follow-up 4.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 245\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take a unit off the coil</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 46 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 24)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Slot  (owns the count)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 46 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">slot.takeOne()</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 80)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">pay change out of the float</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 102 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 80)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CoinBox  (owns the coin counts)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 102 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 80)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">box.withdraw(coins)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 136)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">sell: press a slot</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 158 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 136)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">VendingMachine  (owns both, plus the lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 158 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">machine.select(code)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb whose state is spread over two classes goes to the class that owns both: that class becomes the orchestrator</text><text x=\"615\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">\"sell\" touches the count, the float, the escrow and the tray, so it belongs to the machine and to nothing smaller</text></svg></div><div class=\"move\"><p>\"Take a unit off the coil\" (the spiral that holds a column) changes the slot's count, so <code>slot.takeOne()</code>. \"Pay change out of the float\" changes the coin box's counts, so <code>box.withdraw(coins)</code>. \"Sell\" touches the count, the float, the escrow and the tray at once, and only the machine sees all four, so <code>machine.select(code)</code>. When a verb's state is spread over several classes it goes to the class that owns them all, and that class becomes the orchestrator (the one class that runs the flow and calls the others). That is how small dumb models and one busy machine appear without planning them. The rest fall out the same way: the coin return touches the escrow, which belongs to the machine, so <code>machine.cancel()</code>; emptying the bin touches what is waiting, which belongs to the tray, so <code>tray.take()</code>; refilling touches a count, so <code>slot.refill(n)</code>, with <code>machine.restock(code, n)</code> in front of it to take the lock. Note what did not become a verb: \"make change\" touches nothing at all, which is why it can be a pure function and a swappable rule.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 310\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 80)\"><rect width=\"220\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">VendingMachine</text><text x=\"110.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(price, change, motor)</text></g><path d=\"M250 130 H330 V42 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 20)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PricingStrategy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">list price, happy hour, loyalty</text></g><g transform=\"translate(760 20)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ListPrice / HappyHourDiscount</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 42 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 130 H330 V100 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 78)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ChangeStrategy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">greedy, back-off, a bounded DP</text></g><g transform=\"translate(760 78)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">GreedyChange / BackoffChange / DpChange</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 100 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 130 H330 V158 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Dispenser</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the motor; a test one that jams</text></g><g transform=\"translate(760 136)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Motor / a jamming stub</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 158 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 130 H330 V216 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 194)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MachineObserver</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">screen, restock pager, telemetry</text></g><g transform=\"translate(760 194)\"><rect width=\"440\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"220.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Display / RestockAlert / Telemetry</text><text x=\"220.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 216 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"275\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The machine never builds a rule, so a new change algorithm is a new class and one changed line</text><text x=\"615\" y=\"295\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one price rule WRAPS another: new HappyHourDiscount(new ListPrice(), clock, 16, 18, 20). That wrapping is Decorator, born right here.</text></svg></div><div class=\"move\"><p>The price will change (list price today, happy hour on Friday). How change is made will change (greedy, biggest coin first, today; a lopsided float or odd denominations tomorrow). The motor is a physical thing a test has to be able to jam. And somebody will want to be told when a column empties. Each becomes a one-method interface the machine is <i>given</i> in <code>configure()</code>, never builds itself. This is where the patterns come from, not the other way round: a swappable rule behind an interface is <b>Strategy</b>; a rule that wraps another rather than replacing it &mdash; <code>new HappyHourDiscount(new ListPrice(), clock, 16, 18, 20)</code> &mdash; is <b>Decorator</b>; a machine that announces \"A1 is empty\" without knowing whether anyone is listening is <b>Observer</b>. Do them; do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"210\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"105.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">keypad</text><text x=\"105.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads A1: 1 left</text></g><g transform=\"translate(30 110)\"><rect width=\"210\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"105.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">card reader</text><text x=\"105.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads A1: 1 left</text></g><g transform=\"translate(360 70)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">slot A1</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">count = 1</text></g><path d=\"M240 52 H360 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M240 132 H360 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"300\" y=\"40\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"300\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"590\" y=\"20\" width=\"290\" height=\"140\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"735\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"735\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both saw 1, both take one:</text><text x=\"735\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">two items out, one paid for</text><text x=\"735\" y=\"130\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: read and write as ONE step</text><g transform=\"translate(910 40)\"><rect width=\"290\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">VendingMachine.lock</text><text x=\"145.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">check, drop, commit = one step</text></g><text x=\"1055\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock lives where the shared state lives</text><text x=\"1055\" y=\"185\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the screen is told AFTER the unlock, never inside</text></svg></div><div class=\"move\"><p>A modern machine has a keypad, a card reader and a phone app, and all three can press for the last packet of Lays in the same instant. Between \"I read that A1 has one left\" and \"I took it\" another caller can take it; that gap is where two items leave and one is paid for. So the check, the drop and the commit must be one step under one lock, in the class that owns the counts, the float and the escrow: the machine. Anything that only listens is called after the lock is released, inside a try/catch, so a dead screen cannot stall a sale. Here that is the screen, the restock pager and a telemetry sink that counts sales for the operator. After the unlock also means two sales can report at the same moment, so a listener keeps its own list thread-safe.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 334\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 16)\"><rect width=\"360\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is behind A1?</text><text x=\"180.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 35 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 16)\"><rect width=\"520\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-w

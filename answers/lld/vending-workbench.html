IDLE;\n    private PricingStrategy pricing = new ListPrice();\n    private ChangeStrategy changeRule = new BackoffChange();\n    private Dispenser motor = new Motor();\n    private Clock clock = System::currentTimeMillis;\n\n    /**\n     * Hand in the rules. The machine never builds one itself, so a new offer or a new change algorithm is\n     * a new file and this one line. Under the lock, so a rule switched on a running machine is seen whole.\n     */\n    void configure(PricingStrategy p, ChangeStrategy c, Dispenser d) {\n        lock.lock();\n        try { pricing = p; changeRule = c; motor = d; } finally { lock.unlock(); }\n    }\n    /** Tests and replays hand in their own clock. */\n    void setClock(Clock c) { lock.lock(); try { clock = c; } finally { lock.unlock(); } }\n    /** Subscribe a screen, a pager, a telemetry sink. */\n    void addObserver(MachineObserver o) { observers.add(o); }\n    /** Install a column. */\n    void addSlot(Slot s) { lock.lock(); try { inventory.addSlot(s); } finally { lock.unlock(); } }\n\n    // ---------------- the customer&#x27;s four buttons ----------------\n\n    /** Push a coin into the slot. It sits in escrow: it is not the machine&#x27;s money until a sale commits. */\n    void insertCoin(Coin c) {\n        lock.lock();\n        try {\n            expireEscrow();\n            require(Action.INSERT);\n            escrow.add(c);\n            lastTouchMs = clock.nowMs();                     // every coin restarts the thirty seconds\n            state = MachineState.HAS_MONEY;\n        } finally { lock.unlock(); }\n    }\n\n    /** Press a slot: take the lock, run the sale (sell, just below), and tell the observers only after the unlock. */\n    Outcome select(String code) {\n        List&lt;MachineEvent&gt; events = new ArrayList&lt;&gt;();\n        Outcome out;\n        lock.lock();\n        try { out = sell(code, events); } finally { lock.unlock(); }\n        publish(events);                                     // the screen hears AFTER the lock\n        return out;\n    }\n\n    /**\n     * THE critical step; the caller holds the lock. In this order: refuse for a reason that touches\n     * nothing (no such code, sold out, not enough money); prove the change can be made from float plus\n     * escrow WITHOUT touching the float; only then turn the motor, the one irreversible act; and only when\n     * the item has fallen, commit -- stock down one, escrow into the float, change out of the float, both\n     * into the tray. A refusal or a jam leaves every count exactly as it was. The sale&#x27;s event goes into\n     * events, for the caller to publish once the lock is released.\n     */\n    private Outcome sell(String code, List&lt;MachineEvent&gt; events) {\n        expireEscrow();\n        require(Action.SELECT);\n        lastTouchMs = clock.nowMs();                         // a press restarts the thirty seconds too\n        Slot s = inventory.slot(code);\n        int paid = Coin.total(escrow);\n\n        if (s == null)      return new Outcome(Status.UNKNOWN_SLOT, List.of(), List.of(), paid);\n        if (s.qty() == 0)   return new Outcome(Status.SOLD_OUT, List.of(), List.of(), paid);\n        int price = pricing.priceOf(s);\n        if (paid &lt; price)   return new Outcome(Status.NEED_MORE, List.of(), List.of(), price - paid);\n\n        List&lt;Coin&gt; change = changeRule.plan(coinBox.poolWith(escrow), paid - price);   // pure: nothing moves\n        if (change == null) {\n            List&lt;Coin&gt; back = refundToTray();\n            return new Outcome(Status.NO_CHANGE, List.of(), back, paid);\n        }\n\n        state = MachineState.DISPENSING;                     // the flap is open: nothing else may run until it shuts\n        boolean dropped;\n        try { dropped = motor.drop(code); } catch (RuntimeException jam) { dropped = false; }\n        if (!dropped) {\n            List&lt;Coin&gt; back = refundToTray();\n            return new Outcome(Status.JAMMED, List.of(), back, paid);\n        }\n\n        s.takeOne();                                         // from here down: field writes that cannot fail\n        coinBox.deposit(escrow);\n        escrow.clear();\n        coinBox.withdraw(change);\n        tray.put(s.product, change);\n        state = MachineState.IDLE;\n        events.add(new MachineEvent(&quot;SOLD&quot;, code, s.qty(), coinBox.totalPaise()));\n        return new Outcome(Status.SOLD, List.of(s.product), change, Coin.total(change));\n    }\n\n    /** Coin return: exactly the coins this customer put in go to the tray, and the list is handed back. */\n    List&lt;Coin&gt; cancel() {\n        lock.lock();\n        try {\n            expireEscrow();\n            require(Action.CANCEL);\n            return refundToTray();\n        } finally { lock.unlock(); }\n    }\n\n    /** Empty the tray into the customer&#x27;s hand. Throws when there is nothing to take. */\n    Outcome collect() {\n        lock.lock();\n        try {\n            expireEscrow();\n            require(Action.COLLECT);\n            return tray.take();\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * One buyer&#x27;s whole transaction as a single locked step: their coins go in, the slot is pressed, and\n     * the tray is emptied before any other terminal can touch a count. This is what a phone app, a kiosk or\n     * the race test calls. Legal only in IDLE: while a walk-up customer&#x27;s coins are in escrow it is refused,\n     * because spending them would hand one customer&#x27;s money to another.\n     */\n    Outcome purchase(String code, List&lt;Coin&gt; paid) {\n        List&lt;MachineEvent&gt; events = new ArrayList&lt;&gt;();\n        Outcome o;\n        lock.lock();\n        try {\n            expireEscrow();\n            require(Action.PURCHASE);                       // somebody else&#x27;s coins are in: refuse, never spend them\n            for (Coin c : paid) insertCoin(c);              // re-entrant: this thread already holds the lock\n            o = sell(code, events);\n            if (!o.sold()) cancel();                        // a one-shot buyer never leaves money behind\n            if (!tray.isEmpty()) o = collect();\n        } finally { lock.unlock(); }\n        publish(events);                                    // after the OUTER unlock, never inside it\n        return o;\n    }\n\n    // ---------------- the operator ----------------\n\n    /** Refill a column. Returns how many went in; the rest did not fit. */\n    int restock(String code, int n) {\n        int added;\n        MachineEvent event;\n        lock.lock();\n        try {\n            Slot s = inventory.slot(code);\n            if (s == null) throw new NoSuchElementException(&quot;no slot &quot; + code);\n            added = s.refill(n);\n            event = new MachineEvent(&quot;RESTOCKED&quot;, code, s.qty(), coinBox.totalPaise());\n        } finally { lock.unlock(); }\n        publish(List.of(event));\n        return added;\n    }\n    /** Put change into the float. */\n    void loadFloat(Coin c, int n) {\n        lock.lock();\n        try { coinBox.load(c, n); } finally { lock.unlock(); }\n    }\n    /**\n     * Take the machine out of service, or put it back. Refused while a customer has money in (SERVICE is not\n     * in the HAS_MONEY row), so nobody is stranded mid-sale; an escrow abandoned for thirty seconds is swept first.\n     */\n    void setService(boolean outOfService) {\n        lock.lock();\n        try {\n            expireEscrow();\n            require(Action.SERVICE);\n            state = outOfService ? MachineState.OUT_OF_SERVICE : MachineState.IDLE;\n        } finally { lock.unlock(); }\n    }\n\n    // ---------------- the reads ----------------\n\n    /** Which mode the machine is in. */\n    MachineState state() { lock.lock(); try { return state; } finally { lock.unlock(); } }\n    /** What this customer has put in and not yet spent, in paise. */\n    int escrowPaise() { lock.lock(); try { return Coin.total(escrow); } finally { lock.unlock(); } }\n    /** What the float is worth, in paise. */\n    int floatPaise() { lock.lock(); try { return coinBox.totalPaise(); } finally { lock.unlock(); } }\n    /** A copy of the float&#x27;s counts, for an operator screen or a &quot;can you make change?&quot; check. */\n    Map&lt;Coin, Integer&gt; floatSnapshot() { lock.lock(); try { return coinBox.snapshot(); } finally { lock.unlock(); } }\n    /** How many are left in a column. One map lookup. */\n    int qty(String code) {\n        lock.lock();\n        try { Slot s = inventory.slot(code); return s == null ? -1 : s.qty(); } finally { lock.unlock(); }\n    }\n    /** What a column costs right now, after whatever pricing rule is installed. */\n    int priceOf(String code) {\n        lock.lock();\n        try { Slot s = inventory.slot(code); return s == null ? -1 : pricing.priceOf(s); } finally { lock.unlock(); }\n    }\n    /** Every column&#x27;s count, for an operator screen: a copy of every column, so O(columns), a few dozen. */\n    Map&lt;String, Integer&gt; stockCounts() { lock.lock(); try { return inventory.counts(); } finally { lock.unlock(); } }\n\n    // ---------------- the private helpers ----------------\n\n    /**\n     * Money is never held for ever. Thirty seconds after the customer&#x27;s last coin or press, the coins go to\n     * the tray before the next button runs, so a press after that is a press with no money in. Every button\n     * calls this under the lock, which is why there is no timer thread and no sweeper to get wrong.\n     */\n    private void expireEscrow() {\n        if (!escrow.isEmpty() &amp;&amp; clock.nowMs() - lastTouchMs &gt;= ESCROW_TIMEOUT_MS) refundToTray();\n    }\n    /** Refuse an action the current mode does not allow, by name, so the failure is obvious. */\n    private void require(Action a) {\n        if (!Legal.ALLOWED.get(state).contains(a))\n            throw new IllegalStateException(a + &quot; is not allowed while &quot; + state);\n    }\n    /** Move the whole escrow to the tray and go back to idle. The only way money leaves unspent. */\n    private List&lt;Coin&gt; refundToTray() {\n        List&lt;Coin&gt; back = List.copyOf(escrow);\n        escrow.clear();\n        tray.putCoins(back);\n        if (state != MachineState.OUT_OF_SERVICE) state = MachineState.IDLE;\n        return back;\n    }\n    /** Tell everyone who subscribed, outside the lock, catching anything they throw. */\n    private void publish(List&lt;MachineEvent&gt; events) {\n        for (MachineEvent e : events)\n            for (MachineObserver o : observers) {\n                try { o.onEvent(e); } catch (RuntimeException ex) { System.err.println(&quot;[observer failed] &quot; + ex.getMessage()); }\n            }\n    }\n}\n\n/**\n * The front panel: the coin slot and the keypad. It remembers nothing of its own, it only calls the\n * machine. A second panel that pays and presses in one step (buy) changes nothing about the design; a\n * second COIN SLOT would, because each slot needs its own escrow (Extensions: PanelEscrow).\n */\nfinal class FrontPanel {\n    private final String id;\n    private final VendingMachine machine;\n\n    FrontPanel(String id, VendingMachine machine) { this.id = id; this.machine = machine; }\n    /** Which panel this is, for logs. */\n    String id() { return id; }\n    /** Push a coin in. */\n    void insert(Coin c) { machine.insertCoin(c); }\n    /** Press a slot. */\n    Outcome press(String code) { return machine.select(code); }\n    /** Pay and press in one go, as a phone app or a kiosk does. Refused while a walk-up customer&#x27;s coins are in. */\n    Outcome buy(String code, List&lt;Coin&gt; coins) { return machine.purchase(code, coins); }\n}\n\n/** Runs a demo of the machine, then a many-thread race for the last item in a column. */\npublic class Main {\n    /** Paise printed as rupees. */\n    static String rs(int paise) { return &quot;Rs &quot; + (paise / 100) + &quot;.&quot; + String.format(&quot;%02d&quot;, paise % 100); }\n\n    /** A machine stocked the way the page describes it: three columns and a small float. */\n    static VendingMachine stocked() {\n        VendingMachine vm = new VendingMachine();\n        vm.addSlot(new Slot(&quot;A1&quot;, new Product(&quot;LAY&quot;, &quot;Lays&quot;, 2000), 8, 3));\n        vm.addSlot(new Slot(&quot;A2&quot;, new Product(&quot;COK&quot;, &quot;Coke&quot;, 3500), 8, 2));\n        vm.addSlot(new Slot(&quot;B1&quot;, new Product(&quot;DMK&quot;, &quot;Dairy Milk&quot;, 2500), 8, 3));\n        vm.loadFloat(Coin.R1, 10);\n        vm.loadFloat(Coin.R2, 10);\n        vm.loadFloat(Coin.R5, 6);\n        vm.loadFloat(Coin.R10, 4);\n        return vm;\n    }\n\n    public static void main(String[] args) throws Exception {\n        VendingMachine vm = stocked();\n        RestockAlert pager = new RestockAlert();\n        vm.addObserver(new Display());\n        vm.addObserver(pager);\n\n        System.out.println(&quot;-- a normal sale: Dairy Milk at &quot; + rs(2500) + &quot;, paid with Rs 30&quot;);\n        vm.insertCoin(Coin.R20);\n        vm.insertCoin(Coin.R10);\n        Outcome sale = vm.select(&quot;B1&quot;);\n        System.out.println(&quot;   &quot; + sale.status() + &quot; &quot; + sale.item().name() + &quot;, change &quot; + sale.coins()\n                           + &quot; = &quot; + rs(sale.paise()) + &quot;; B1 left &quot; + vm.qty(&quot;B1&quot;));\n        System.out.println(&quot;   tray -&gt; &quot; + vm.collect().item().name());\n\n        System.out.println(&quot;-- not enough money, then the coin return&quot;);\n        vm.insertCoin(Coin.R10);\n        Outcome short_ = vm.select(&quot;A2&quot;);\n        System.out.println(&quot;   &quot; + short_.status() + &quot;: &quot; + rs(short_.paise()) + &quot; more needed; escrow still &quot;\n                           + rs(vm.escrowPaise()));\n        System.out.println(&quot;   cancel gives back &quot; + vm.cancel() + &quot;; escrow &quot; + rs(vm.escrowPaise()));\n        vm.collect();\n\n        System.out.println(&quot;-- he feeds a coin in and walks away: the money comes back by itself&quot;);\n        VendingMachine walked = stocked();\n        long[] t = { LocalDateTime.of(2026, 9, 15, 12, 0).atZone(ZoneId.of(&quot;Asia/Kolkata&quot;)).toInstant().toEpochMilli() };\n        walked.setClock(() -&gt; t[0]);\n        walked.insertCoin(Coin.R20);\n        t[0] += 31_000;                                              // thirty-one seconds later\n        walked.insertCoin(Coin.R1);                                  // the next touch sweeps first\n        System.out.println(&quot;   escrow is now &quot; + rs(walked.escrowPaise()) + &quot;; the abandoned &quot;\n                           + rs(Coin.total(walked.collect().coins())) + &quot; is waiting in the tray&quot;);\n\n        System.out.println(&quot;-- the float cannot make change: refuse, refund, stock untouched&quot;);\n        VendingMachine lop = new VendingMachine();\n        lop.addSlot(new Slot(&quot;B1&quot;, new Product(&quot;DMK&quot;, &quot;Dairy Milk&quot;, 2500), 8, 3));\n        lop.loadFloat(Coin.R10, 1);                                  // Rs 10 only: Rs 15 change is impossible\n        lop.insertCoin(Coin.R20);\n        lop.insertCoin(Coin.R20);\n        Outcome refused = lop.select(&quot;B1&quot;);\n        System.out.println(&quot;   &quot; + refused.status() + &quot;, refunded &quot; + refused.coins() + &quot;; B1 left &quot;\n                           + lop.qty(&quot;B1&quot;) + &quot;; float &quot; + rs(lop.floatPaise()));\n        lop.collect();\n\n        System.out.println(&quot;-- greedy alone would refuse this sale; backing off finds the coins&quot;);\n        Map&lt;Coin, Integer&gt; lopsided = new EnumMap&lt;&gt;(Map.of(Coin.R5, 1, Coin.R2, 3));\n        System.out.println(&quot;   greedy for &quot; + rs(600) + &quot; from {R5 x1, R2 x3}: &quot; + new GreedyChange().plan(lopsided, 600));\n        System.out.println(&quot;   backoff for &quot; + rs(600) + &quot; from {R5 x1, R2 x3}: &quot; + new BackoffChange().plan(lopsided, 600));\n\n        System.out.println(&quot;-- happy hour: the same column, priced by the injected clock&quot;);\n        VendingMachine hh = stocked();\n        long fourThirty = LocalDateTime.of(2026, 9, 15, 16, 30).atZone(ZoneId.of(&quot;Asia/Kolkata&quot;)).toInstant().toEpochMilli();\n        hh.setClock(() -&gt; fourThirty);\n        hh.configure(new HappyHourDiscount(new ListPrice(), () -&gt; fourThirty, 16, 18, 20), new BackoffChange(), new Motor());\n        System.out.println(&quot;   B1 lists at &quot; + rs(2500) + &quot;, at 16:30 it costs &quot; + rs(hh.priceOf(&quot;B1&quot;)));\n\n        // the race: forty panels press for the last Lays at the same instant\n        VendingMachine last = stocked();\n        while (last.qty(&quot;A1&quot;) &gt; 1) last.purchase(&quot;A1&quot;, List.of(Coin.R20));    // burn down to one\n        last.addObserver(pager);\n        System.out.println(&quot;-- forty panels press A1 at the same instant, &quot; + last.qty(&quot;A1&quot;) + &quot; left&quot;);\n        int panels = 40;\n        CountDownLatch go = new CountDownLatch(1);\n        CountDownLatch done = new CountDownLatch(panels);\n        List&lt;Outcome&gt; results = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        int floatBefore = last.floatPaise();\n        for (int i = 0; i &lt; panels; i++) {\n            final FrontPanel panel = new FrontPanel(&quot;P&quot; + i, last);\n            new Thread(() -&gt; {\n                try { go.await(); results.add(panel.buy(&quot;A1&quot;, List.of(Coin.R20))); }\n                catch (Exception e) { results.add(new Outcome(Status.JAMMED, List.of(), List.of(), 0)); }\n                finally { done.countDown(); }\n            }).start();\n        }\n        go.countDown();\n        done.await();\n        long sold = results.stream().filter(o -&gt; o.item() != null).count();\n        long handedBack = results.stream().filter(o -&gt; o.item() == null).mapToInt(Outcome::paise).sum();\n        System.out.println(&quot;   items dispensed: &quot; + sold + &quot; (must be 1); refused: &quot; + (panels - sold)\n                           + &quot;; money handed back &quot; + rs((int) handedBack));\n        System.out.println(&quot;   A1 left &quot; + last.qty(&quot;A1&quot;) + &quot;; float grew by &quot;\n                           + rs(last.floatPaise() - floatBefore) + &quot; (exactly one price)&quot;);\n        System.out.println(&quot;   restock alerts: &quot; + pager.empty);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist; nothing here edits Main.java.\n\n// ---- ext: card payment -------------------------------------------------------------------------------\n/**\n * A card or UPI terminal. Both calls carry the sale&#x27;s id, an idempotency key (a unique id for this sale,\n * so a charge that is retried is taken once, and a refund knows exactly which charge it undoes).\n */\ninterface CardTerminal {\n    /** Charge once per sale id; a retry with the same id is not a second charge. False means declined. */\n    boolean charge(String saleId, int paise);\n    /** Give back whatever this sale id took. Taking nothing means nothing to give back, so it is safe to call to be sure. */\n    boolean refund(String saleId);\n}\n\n/**\n * Buying with a card instead of coins. Exactly the same ORDER as VendingMachine.select, with the card\n * charge as the first irreversible step: check stock, charge, drop, and only then take the stock down.\n * A card brings two cases coins cannot: the motor jams after the money moved, and the charge times out so\n * nobody knows whether money moved. Both end in refund(saleId), the compensating action, which undoes the\n * charge if it happened and does nothing if it did not. A refund that fails is kept for a retry, never\n * dropped. A sketch with its own inventory and lock: on the coin machine it must run under the machine&#x27;s lock.\n */\nfinal class CardCheckout {\n    private final Inventory inventory;\n    private final Dispenser motor;\n    private final CardTerminal card;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final AtomicInteger nextSale = new AtomicInteger();\n    /** Sale ids whose refund failed; a retry job calls refund(id) again until it returns true. */\n    final List&lt;String&gt; refundsToRetry = new CopyOnWriteArrayList&lt;&gt;();\n\n    CardCheckout(Inventory inventory, Dispenser motor, CardTerminal card) {\n        this.inventory = inventory; this.motor = motor; this.card = card;\n    }\n    /** One tap-and-press. Nothing is committed until the item has fallen; a jam or an unknown charge is refunded. */\n    Outcome buy(String code, int pricePaise) {\n        String saleId = &quot;sale-&quot; + nextSale.incrementAndGet();\n        lock.lock();\n        try {\n            Slot s = inventory.slot(code);\n            if (s == null)    return new Outcome(Status.UNKNOWN_SLOT, List.of(), List.of(), 0);\n            if (s.qty() == 0) return new Outcome(Status.SOLD_OUT, List.of(), List.of(), 0);\n            boolean charged;\n            try { charged = card.charge(saleId, pricePaise); }\n            catch (RuntimeException timeout) { refund(saleId); charged = false; }    // unknown: undo it, drop nothing\n            if (!charged) return new Outcome(Status.NEED_MORE, List.of(), List.of(), pricePaise);\n            boolean dropped;\n            try { dropped = motor.drop(code); } catch (RuntimeException jam) { dropped = false; }\n            if (!dropped) {\n                refund(saleId);                          // the compensating action: the money goes back\n                return new Outcome(Status.JAMMED, List.of(), List.of(), pricePaise);\n            }\n            s.takeOne();\n            return new Outcome(Status.SOLD, List.of(s.product), List.of(), pricePaise);\n        } finally { lock.unlock(); }\n    }\n    /** Refund by sale id; one that fails or times out goes on the retry list instead of being forgotten. */\n    private void refund(String saleId) {\n        boolean ok;\n        try { ok = card.refund(saleId); } catch (RuntimeException down) { ok = false; }\n        if (!ok) refundsToRetry.add(saleId);\n    }\n}\n\n// ---- ext: exact change lamp --------------------------------------------------------------------------\n/**\n * The &quot;exact change only&quot; lamp. Asks the change rule, against a copy of the float, whether a sale could be\n * completed BEFORE the customer commits. Pure: it cannot corrupt the float even if it is wrong.\n */\nfinal class ChangeAdvisor {\n    private final ChangeStrategy rule;\n\n    ChangeAdvisor(ChangeStrategy rule) { this.rule = rule; }\n    /** Would this column sell, if the customer paid with these coins? */\n    boolean canComplete(VendingMachine vm, String code, List&lt;Coin&gt; wouldPay) {\n        int price = vm.priceOf(code);\n        if (price &lt; 0 || vm.qty(code) &lt;= 0) return false;\n        int paid = Coin.total(wouldPay);\n        if (paid &lt; price) return false;\n        Map&lt;Coin, Integer&gt; pool = vm.floatSnapshot();\n        for (Coin c : wouldPay) pool.merge(c, 1, Integer::sum);\n        return rule.plan(pool, paid - price) != null;\n    }\n}\n\n// ---- ext: bounded change DP --------------------------------------------------------------------------\n/**\n * Exact change as a bounded subset-sum over the coins actually in the float. It finds the same sales as\n * BackoffChange (both find change whenever change exists), but at a predictable cost, O(coins x amount),\n * where back-off&#x27;s worst case grows with every denomination added. Drops into configure(): same interface.\n */\nfinal class DpChange implements ChangeStrategy {\n    /** A combination that adds up exactly, or null. O(coins x amount), which at a float this size is nothing. */\n    public List&lt;Coin&gt; plan(Map&lt;Coin, Integer&gt; available, int amountPaise) {\n        List&lt;Coin&gt; pool = new ArrayList&lt;&gt;();\n        for (Coin c : Coin.descending())\n            for (int i = 0; i &lt; available.getOrDefault(c, 0); i++) pool.add(c);\n        int n = pool.size();\n        boolean[][] reach = new boolean[n + 1][amountPaise + 1];\n        reach[0][0] = true;\n        for (int i = 0; i &lt; n; i++)\n            for (int a = 0; a &lt;= amountPaise; a++)\n                if (reach[i][a]) {\n                    reach[i + 1][a] = true;\n                    int with = a + pool.get(i).paise;\n                    if (with &lt;= amountPaise) reach[i + 1][with] = true;\n                }\n        if (!reach[n][amountPaise]) return null;\n        List&lt;Coin&gt; out = new ArrayList&lt;&gt;();\n        int a = amountPaise;\n        for (int i = n; i &gt; 0; i--) {\n            if (reach[i - 1][a]) continue;               // this coin was not needed\n            out.add(pool.get(i - 1));\n            a -= pool.get(i - 1).paise;\n        }\n        return List.copyOf(out);\n    }\n}\n\n// ---- ext: hold and pay -------------------------------------------------------------------------------\n/** A unit held for one customer until a moment in time. */\nrecord Hold(String code, String holder, long expiresAtMs) {}\n\n/**\n * &quot;Hold my Coke, I will pay in thirty seconds.&quot; A hold takes the unit out of stock immediately, so nobody\n * else can buy it, and a sweep puts it back the moment the hold expires. Time comes from the same injected\n * clock as everything else, so the test does not sleep.\n */\nfinal class HoldDesk {\n    private final Inventory inventory;\n    private final Clock clock;\n    private final long ttlMs;\n    private final Map&lt;String, Hold&gt; holds = new HashMap&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n\n    HoldDesk(Inventory inventory, Clock clock, long ttlMs) {\n        this.inventory = inventory; this.clock = clock; this.ttlMs = ttlMs;\n    }\n    /** Reserve one unit for a named holder, or null when the column is empty. One hold each: a new one returns the old unit. */\n    Hold hold(String code, String holder) {\n        lock.lock();\n        try {\n            sweep();\n            Slot s = inventory.slot(code);\n            if (s == null || s.qty() == 0) return null;\n            Hold old = holds.remove(holder);              // his earlier hold, if any: its unit goes back first\n            if (old != null) inventory.slot(old.code()).refill(1);\n            s.takeOne();                                  // out of stock from this instant: no double sell\n            Hold h = new Hold(code, holder, clock.nowMs() + ttlMs);\n            holds.put(holder, h);\n            return h;\n        } finally { lock.unlock(); }\n    }\n    /** Pay for a live hold. False when it had already expired and the unit went back. */\n    boolean pay(String holder) {\n        lock.lock();\n        try { sweep(); return holds.remove(holder) != null; } finally { lock.unlock(); }\n    }\n    /** Put back every unit whose hold has run out. Called on every entry point, under the lock; no timer thread needed. */\n    private void sweep() {\n        long now = clock.nowMs();\n        Iterator&lt;Map.Entry&lt;String, Hold&gt;&gt; it = holds.entrySet().iterator();\n        while (it.hasNext()) {\n            Hold h = it.next().getValue();\n            if (h.expiresAtMs() &lt;= now) { inventory.slot(h.code()).refill(1); it.remove(); }\n        }\n    }\n}\n\n// ---- ext: a coin slot per panel ----------------------------------------------------------------------\n/**\n * The machine in Main.java has ONE coin slot, so one escrow list is the whole truth: the coins inside it\n * belong to whoever is standing there. A machine with two coin slots needs one escrow PER panel, or panel\n * one&#x27;s twenty rupees pays for panel two&#x27;s Coke. Only the money in flight splits: the stock and the float\n * stay behind the machine&#x27;s single lock, because the thing being fought over is the last unit, not the coins.\n */\nfinal class PanelEscrow {\n    private final Map&lt;String, List&lt;Coin&gt;&gt; byPanel = new HashMap&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n\n    /** Push a coin in at one panel. */\n    void insert(String panel, Coin c) {\n        lock.lock();\n        try { byPanel.computeIfAbsent(panel, p -&gt; new ArrayList&lt;&gt;()).add(c); } finally { lock.unlock(); }\n    }\n    /** What that panel is holding, in paise. */\n    int paise(String panel) {\n        lock.lock();\n        try { return Coin.total(byPanel.getOrDefault(panel, List.of())); } finally { lock.unlock(); }\n    }\n    /** Take that panel&#x27;s coins out to pay with. Every other panel&#x27;s money is untouched. */\n    List&lt;Coin&gt; take(String panel) {\n        lock.lock();\n        try { List&lt;Coin&gt; c = byPanel.remove(panel); return c == null ? List.of() : List.copyOf(c); }\n        finally { lock.unlock(); }\n    }\n}\n\n// ---- ext: operator console ---------------------------------------------------------------------------\n/** What an operator is allowed to do, separate from the customer&#x27;s four buttons. */\ninterface OperatorConsole {\n    /** Every column&#x27;s count. */\n    Map&lt;String, Integer&gt; stock();\n    /** What the coin float is worth, in paise. */\n    int cashPaise();\n    /** Refill a column; returns how many went in. */\n    int restock(String code, int n);\n}\n\n/** The operator role, implemented by delegating to the machine&#x27;s existing reads and refills. */\nfinal class MachineConsole implements OperatorConsole {\n    private final VendingMachine vm;\n\n    MachineConsole(VendingMachine vm) { this.vm = vm; }\n    /** Every column&#x27;s count. */\n    public Map&lt;String, Integer&gt; stock() { return vm.stockCounts(); }\n    /** What the coin float is worth. */\n    public int cashPaise() { return vm.floatPaise(); }\n    /** Refill a column. */\n    public int restock(String code, int n) { return vm.restock(code, n); }\n}\n\n/** Telemetry: counts sales per column from the same events the screen listens to. Read-side only. */\nfinal class Telemetry implements MachineObserver {\n    final Map&lt;String, Integer&gt; salesPerSlot = Collections.synchronizedMap(new TreeMap&lt;&gt;());   // two sales can report at once\n    /** Count a sale. */\n    public void onEvent(MachineEvent e) {\n        if (e.kind().equals(&quot;SOLD&quot;)) salesPerSlot.merge(e.slotCode(), 1, Integer::sum);\n    }\n}\n\n/** Pages the operator when the float drops below the floor where change starts failing. */\nfinal class LowCashAlert implements MachineObserver {\n    private final int floorPaise;\n    final List&lt;String&gt; alerts = Collections.synchronizedList(new ArrayList&lt;&gt;());\n\n    LowCashAlert(int floorPaise) { this.floorPaise = floorPaise; }\n    /** Raise one alert per event that crosses the floor. */\n    public void onEvent(MachineEvent e) {\n        if (e.floatPaise() &lt; floorPaise) alerts.add(&quot;float below &quot; + Main.rs(floorPaise) + &quot;: &quot; + Main.rs(e.floatPaise()));\n    }\n}\n\n// ---- ext: persistence --------------------------------------------------------------------------------\n/** Everything about a machine worth surviving a power cut. */\nrecord MachineSnapshot(Map&lt;Coin, Integer&gt; coins, Map&lt;String, Integer&gt; stock) {}\n\n/**\n * The seam that makes the machine outlive its process. The machine&#x27;s flow does not change: the maps it\n * writes under the lock are simply loaded at boot and saved after each commit.\n */\ninterface MachineRepository {\n    /** Write the whole snapshot for one machine. */\n    void save(String machineId, MachineSnapshot snap);\n    /** Read it back, or null when this machine has never been saved. */\n    MachineSnapshot load(String machineId);\n}\n\n/**\n * The in-memory implementation, which is all a test needs. The database version replaces the slot\n * decrement with a conditional update, which is the same idea as the lock:\n *   UPDATE slot SET qty = qty - 1 WHERE machine = ? AND code = ? AND qty &gt; 0;\n *   -- 1 row updated = you got the unit, 0 rows = another machine&#x27;s terminal got it\n */\nfinal class InMemoryMachineRepository implements MachineRepository {\n    private final Map&lt;String, MachineSnapshot&gt; rows = new HashMap&lt;&gt;();\n\n    /** Store a copy so a later mutation cannot change what was saved. */\n    public void save(String machineId, MachineSnapshot snap) {\n        rows.put(machineId, new MachineSnapshot(new EnumMap&lt;&gt;(snap.coins()), new TreeMap&lt;&gt;(snap.stock())));\n    }\n    /** Read it back. */\n    public MachineSnapshot load(String machineId) { return rows.get(machineId); }\n}\n\n// ---- ext: motor outside the lock ---------------------------------------------------------------------\n/**\n * Rung one of the ladder: get the two-second motor out of the critical section. The unit is RESERVED under\n * a very short lock, the coil turns with the lock released, and a second short section either commits the\n * reservation or puts it back. Nobody can oversell, and two columns no longer wait for each other.\n */\nfinal class ReservingColumn {\n    private final String code;\n    private final Dispenser motor;\n    private final ReentrantLock lock = new ReentrantLock();\n    private int qty;\n    private int reserved;\n\n    ReservingColumn(String code, int qty, Dispenser motor) { this.code = code; this.qty = qty; this.motor = motor; }\n    /** Reserve, drop outside the lock, then commit or give the reservation back. */\n    boolean sell() {\n        lock.lock();\n        try {\n            if (qty - reserved &lt;= 0) return false;\n            reserved++;                                   // ~0.2 us of lock, not two seconds\n        } finally { lock.unlock(); }\n        boolean dropped;\n        try { dropped = motor.drop(code); } catch (RuntimeException jam) { dropped = false; }\n        lock.lock();\n        try {\n            reserved--;\n            if (dropped) qty--;\n            return dropped;\n        } finally { lock.unlock(); }\n    }\n    /** What is left, reservations included. */\n    int available() { lock.lock(); try { return qty - reserved; } finally { lock.unlock(); } }\n}\n\n// ---- ext: a claim without a lock ---------------------------------------------------------------------\n/**\n * Rung three: the count itself decides the winner, with no lock at all. compareAndSet is the hardware&#x27;s\n * version of &quot;read and write as one step&quot;, and it is exactly what the SQL conditional update does.\n */\nfinal class CasColumn {\n    private final AtomicInteger qty;\n\n    CasColumn(int qty) { this.qty = new AtomicInteger(qty); }\n    /** Take one unit, or false when there is none. Losers of a race simply try again. */\n    boolean claim() {\n        while (true) {\n            int n = qty.get();\n            if (n == 0) return false;\n            if (qty.compareAndSet(n, n - 1)) return true;\n        }\n    }\n    /** Put a unit back after a jam. */\n    void giveBack() { qty.incrementAndGet(); }\n    /** What is left. */\n    int left() { return qty.get(); }\n}\n\n// ---- ext: a mode with behaviour of its own -----------------------------------------------------------\n/**\n * When a mode stops being &quot;which actions are legal&quot; and grows behaviour of its own, promote the row in the\n * table to a class. This is the shape: each mode answers for itself and names the mode it returns to.\n */\ninterface Mode {\n    /** The name shown on the screen. */\n    String label();\n    /** Is this action legal here? */\n    boolean allows(Action a);\n    /** The mode after this action. */\n    Mode after(Action a);\n}\n\n/** Out of service, with a memory: it knows which mode to hand back to, and it still lets a customer cancel. */\nfinal class MaintenanceMode implements Mode {\n    private final Mode resumeTo;\n\n    MaintenanceMode(Mode resumeTo) { this.resumeTo = resumeTo; }\n    /** The name shown on the screen. */\n    public String label() { return &quot;OUT OF SERVICE&quot;; }\n    /** Only the coin return works: never strand a customer who already paid. */\n    public boolean allows(Action a) { return a == Action.CANCEL || a == Action.COLLECT || a == Action.SERVICE; }\n    /** SERVICE hands back to the mode this one interrupted; everything else stays here. */\n    public Mode after(Action a) { return a == Action.SERVICE ? resumeTo : this; }\n}\n\n/** The ordinary idle mode, so MaintenanceMode has something to resume to. */\nfinal class IdleMode implements Mode {\n    /** The name shown on the screen. */\n    public String label() { return &quot;INSERT COIN&quot;; }\n    /** Everything except selecting, which needs money first. */\n    public boolean allows(Action a) { return a != Action.SELECT; }\n    /** Idle stays idle unless an operator takes the machine away. */\n    public Mode after(Action a) { return this; }\n}\n\n// ---- ext: columns from config ------------------------------------------------------------------------\n/**\n * Where a Factory finally pays: columns that arrive as strings from a planogram file, so adding a product\n * is a line of configuration and not a line of code.\n */\nfinal class SlotFactory {\n    /** &quot;A1|LAY|Lays|2000|8|3&quot; -&gt; a Slot with that code, product, capacity and starting count. */\n    static Slot fromConfig(String line) {\n        String[] p = line.split(&quot;\\\\|&quot;);\n        return new Slot(p[0], new Product(p[1], p[2], Integer.parseInt(p[3])),\n                        Integer.parseInt(p[4]), Integer.parseInt(p[5]));\n    }\n}\n\n/** Runs every extension once, so the page&#x27;s follow-up code is code that has actually executed. */\nclass ExtDemo {\n    /** A tiny inventory for the extensions that do not need a whole machine. */\n    static Inventory shelf() {\n        Inventory inv = new Inventory();\n        inv.addSlot(SlotFactory.fromConfig(&quot;A1|LAY|Lays|2000|8|2&quot;));\n        inv.addSlot(SlotFactory.fromConfig(&quot;A2|COK|Coke|3500|8|1&quot;));\n        return inv;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(&quot;-- card payment: charge, then drop, then take the stock down&quot;);\n        Inventory inv = shelf();\n        CardTerminal good = new CardTerminal() {\n            public boolean charge(String saleId, int paise) { return true; }\n            public boolean refund(String saleId) { System.out.println(&quot;   refunded &quot; + saleId + &quot; to the card&quot;); return true; }\n        };\n        CardCheckout ok = new CardCheckout(inv, new Motor(), good);\n        System.out.println(&quot;   &quot; + ok.buy(&quot;A1&quot;, 2000).status() + &quot;; A1 left &quot; + inv.slot(&quot;A1&quot;).qty());\n\n        System.out.println(&quot;-- the motor jams AFTER the card was charged: the money goes back, stock untouched&quot;);\n        CardCheckout jam = new CardCheckout(inv, code -&gt; false, good);\n        System.out.println(&quot;   &quot; + jam.buy(&quot;A1&quot;, 2000).status() + &quot;; A1 left &quot; + inv.slot(&quot;A1&quot;).qty());\n\n        System.out.println(&quot;-- the exact-change lamp: ask before the customer commits&quot;);\n        VendingMachine vm = Main.stocked();\n        ChangeAdvisor advisor = new ChangeAdvisor(new BackoffChange());\n        System.out.println(&quot;   B1 with Rs 30 (Rs 5 change needed): &quot; + advisor.canComplete(vm, &quot;B1&quot;, List.of(Coin.R20, Coin.R10)));\n        VendingMachine bare = new VendingMachine();\n        bare.addSlot(new Slot(&quot;B1&quot;, new Product(&quot;DMK&quot;, &quot;Dairy Milk&quot;, 2500), 8, 3));\n        System.out.println(&quot;   B1 with Rs 40 on an empty float: &quot; + advisor.canComplete(bare, &quot;B1&quot;, List.of(Coin.R20, Coin.R20)));\n\n        System.out.println(&quot;-- non-canonical change: the DP finds what greedy misses&quot;);\n        Map&lt;Coin, Integer&gt; lopsided = new EnumMap&lt;&gt;(Map.of(Coin.R5, 1, Coin.R2, 3));\n        System.out.println(&quot;   greedy: &quot; + new GreedyChange().plan(lopsided, 600)\n                           + &quot;   backoff: &quot; + new BackoffChange().plan(lopsided, 600)\n                           + &quot;   dp: &quot; + new DpChange().plan(lopsided, 600));\n\n        System.out.println(&quot;-- hold and pay, with an expiry driven by the injected clock&quot;);\n        long[] now = { 1_000_000L };\n        Inventory held = shelf();\n        HoldDesk desk = new HoldDesk(held, () -&gt; now[0], 30_000);\n        System.out.println(&quot;   hold A2: &quot; + (desk.hold(&quot;A2&quot;, &quot;ravi&quot;) != null) + &quot;; A2 left &quot; + held.slot(&quot;A2&quot;).qty());\n        System.out.println(&quot;   a second customer can hold A2: &quot; + (desk.hold(&quot;A2&quot;, &quot;meera&quot;) != null));\n        now[0] += 31_000;                                  // thirty-one seconds later, no sleeping\n        System.out.println(&quot;   ravi pays after the expiry: &quot; + desk.pay(&quot;ravi&quot;) + &quot;; A2 back to &quot; + held.slot(&quot;A2&quot;).qty());\n\n        System.out.println(&quot;-- two coin slots: one escrow per panel, so two customers&#x27; money never mixes&quot;);\n        PanelEscrow wallets = new PanelEscrow();\n        wallets.insert(&quot;P1&quot;, Coin.R20); wallets.insert(&quot;P2&quot;, Coin.R10); wallets.insert(&quot;P1&quot;, Coin.R10);\n        System.out.println(&quot;   P1 holds &quot; + Main.rs(wallets.paise(&quot;P1&quot;)) + &quot;, P2 holds &quot; + Main.rs(wallets.paise(&quot;P2&quot;)));\n        VendingMachine shared = Main.stocked();\n        System.out.println(&quot;   P1 buys B1 with its own coins: &quot; + shared.purchase(&quot;B1&quot;, wallets.take(&quot;P1&quot;)).item().name()\n                           + &quot;; P2 still holds &quot; + Main.rs(wallets.paise(&quot;P2&quot;)));\n\n        System.out.println(&quot;-- the operator console and telemetry, off the same events&quot;);\n        Telemetry tele = new Telemetry();\n        LowCashAlert cash = new LowCashAlert(15_000);\n        vm.addObserver(tele);\n        vm.addObserver(cash);\n        vm.purchase(&quot;A1&quot;, List.of(Coin.R20));\n        vm.purchase(&quot;B1&quot;, List.of(Coin.R20, Coin.R10));\n        OperatorConsole console = new MachineConsole(vm);\n        System.out.println(&quot;   sales &quot; + tele.salesPerSlot + &quot;; stock &quot; + console.stock()\n                           + &quot;; cash &quot; + Main.rs(console.cashPaise()) + &quot;; alert: &quot; + cash.alerts.get(cash.alerts.size() - 1));\n        System.out.println(&quot;   restock A1 by 5: &quot; + console.restock(&quot;A1&quot;, 5) + &quot; went in -&gt; &quot; + console.stock());\n\n        System.out.println(&quot;-- persistence: save the float and the counts, load them back&quot;);\n        MachineRepository repo = new InMemoryMachineRepository();\n        repo.save(&quot;VM-01&quot;, new MachineSnapshot(vm.floatSnapshot(), vm.stockCounts()));\n        MachineSnapshot back = repo.load(&quot;VM-01&quot;);\n        System.out.println(&quot;   loaded stock &quot; + back.stock() + &quot;, coins &quot; + back.coins());\n\n        System.out.println(&quot;-- rung one: the motor outside the lock&quot;);\n        ReservingColumn col = new ReservingColumn(&quot;A1&quot;, 1, new Motor());\n        System.out.println(&quot;   first sell &quot; + col.sell() + &quot;, second sell &quot; + col.sell() + &quot;, left &quot; + col.available());\n        ReservingColumn jammed = new ReservingColumn(&quot;A1&quot;, 1, code -&gt; false);\n        System.out.println(&quot;   a jam gives the reservation back: sold &quot; + jammed.sell() + &quot;, left &quot; + jammed.available());\n\n        System.out.println(&quot;-- rung three: the count decides the winner, no lock&quot;);\n        CasColumn cas = new CasColumn(1);\n        System.out.println(&quot;   claim &quot; + cas.claim() + &quot;, claim again &quot; + cas.claim() + &quot;, left &quot; + cas.left());\n\n        System.out.println(&quot;-- a mode that grew behaviour becomes a class&quot;);\n        Mode mode = new MaintenanceMode(new IdleMode());\n        System.out.println(&quot;   &quot; + mode.label() + &quot;: insert allowed &quot; + mode.allows(Action.INSERT)\n                           + &quot;, cancel allowed &quot; + mode.allows(Action.CANCEL)\n                           + &quot;, after service -&gt; &quot; + mode.after(Action.SERVICE).label());\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n/**\n * Fourteen claims the design makes, each proven by a few lines. Run it with\n * javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests\n * It prints ALL PASS, or the first failure and a non-zero exit code.\n */\npublic class FailureTests {\n    static int failed = 0;\n\n    /** Record one claim. Prints ok or FAIL with the claim&#x27;s name. */\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? &quot;  ok   &quot; : &quot;  FAIL &quot;) + what);\n        if (!ok) failed++;\n    }\n\n    /** A machine with one column and a float big enough to make change. */\n    static VendingMachine machine(int qty) {\n        VendingMachine vm = new VendingMachine();\n        vm.addSlot(new Slot(&quot;B1&quot;, new Product(&quot;DMK&quot;, &quot;Dairy Milk&quot;, 2500), 8, qty));\n        vm.loadFloat(Coin.R1, 10);\n        vm.loadFloat(Coin.R2, 10);\n        vm.loadFloat(Coin.R5, 6);\n        vm.loadFloat(Coin.R10, 4);\n        return vm;\n    }\n\n    public static void main(String[] args) throws Exception {\n        // 1. two terminals press for the last unit: exactly one item leaves, and no paise is lost\n        System.out.println(&quot;1. forty panels, one unit left&quot;);\n        VendingMachine race = machine(1);\n        int floatBefore = race.floatPaise();\n        int panels = 40;\n        CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(panels);\n        List&lt;Outcome&gt; out = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        for (int i = 0; i &lt; panels; i++)\n            new Thread(() -&gt; {\n                try { go.await(); out.add(race.purchase(&quot;B1&quot;, List.of(Coin.R20, Coin.R10))); }\n                catch (Exception e) { /* counted as no sale */ }\n                finally { done.countDown(); }\n            }).start();\n        go.countDown();\n        done.await();\n        long sold = out.stream().filter(o -&gt; o.item() != null).count();\n        int handedBack = out.stream().filter(o -&gt; o.item() == null).mapToInt(Outcome::paise).sum();\n        check(sold == 1, &quot;exactly one panel got the item, &quot; + (panels - 1) + &quot; were refused&quot;);\n        check(race.qty(&quot;B1&quot;) == 0, &quot;the column ended at zero, never below&quot;);\n        check(handedBack == (panels - 1) * 3000, &quot;every refused panel got its whole Rs 30 back&quot;);\n        check(race.floatPaise() == floatBefore + 2500, &quot;the float grew by exactly one price, Rs 25&quot;);\n\n        // 2. the float cannot make change: refuse, refund in full, touch nothing\n        System.out.println(&quot;2. the float cannot make change&quot;);\n        VendingMachine lop = new VendingMachine();\n        lop.addSlot(new Slot(&quot;B1&quot;, new Product(&quot;DMK&quot;, &quot;Dairy Milk&quot;, 2500), 8, 3));\n        lop.loadFloat(Coin.R10, 1);                                   // Rs 15 change is impossible\n        lop.insertCoin(Coin.R20);\n        lop.insertCoin(Coin.R20);\n        Outcome refused = lop.select(&quot;B1&quot;);\n        check(refused.status() == Status.NO_CHANGE, &quot;the sale is refused, not half done&quot;);\n        check(Coin.total(refused.coins()) == 4000, &quot;the whole Rs 40 is refunded&quot;);\n        check(lop.qty(&quot;B1&quot;) == 3, &quot;stock is exactly what it was&quot;);\n        check(lop.floatPaise() == 1000, &quot;the float is exactly what it was&quot;);\n        check(lop.state() == MachineState.IDLE, &quot;the machine is idle again&quot;);\n\n        // 3. the coin return hands back exactly the coins that went in\n        System.out.println(&quot;3. cancel&quot;);\n        VendingMachine cancel = machine(1);\n        cancel.insertCoin(Coin.R10);\n        cancel.insertCoin(Coin.R2);\n        cancel.insertCoin(Coin.R2);\n        List&lt;Coin&gt; back = cancel.cancel();\n        check(back.equals(List.of(Coin.R10, Coin.R2, Coin.R2)), &quot;the same three coins, same denominations&quot;);\n        check(cancel.escrowPaise() == 0, &quot;nothing is left in escrow&quot;);\n        check(cancel.collect().paise() == 1400, &quot;and the same Rs 14 is in the tray&quot;);\n\n        // 4. the motor jams: nothing dispensed, everything refunded, no stock lost\n        System.out.println(&quot;4. the motor jams&quot;);\n        VendingMachine jam = machine(3);\n        jam.configure(new ListPrice(), new BackoffChange(), code -&gt; false);\n        int floatWas = jam.floatPaise();\n        jam.insertCoin(Coin.R20);\n        jam.insertCoin(Coin.R10);\n        Outcome jammed = jam.select(&quot;B1&quot;);\n        check(jammed.status() == Status.JAMMED, &quot;the press reports a jam&quot;);\n        check(Coin.total(jammed.coins()) == 3000, &quot;the whole Rs 30 is refunded&quot;);\n        check(jam.qty(&quot;B1&quot;) == 3, &quot;no unit was taken off the coil&quot;);\n        check(jam.floatPaise() == floatWas, &quot;the float never moved&quot;);\n\n        // 5. restocking, and the pager that fires when a column hits zero\n        System.out.println(&quot;5. restock and the empty-column alert&quot;);\n        VendingMachine stock = machine(1);\n        RestockAlert pager = new RestockAlert();\n        stock.addObserver(pager);\n        stock.purchase(&quot;B1&quot;, List.of(Coin.R20, Coin.R10));\n        check(stock.qty(&quot;B1&quot;) == 0, &quot;the last unit sold&quot;);\n        check(pager.empty.equals(List.of(&quot;B1&quot;)), &quot;the pager was told which column is empty&quot;);\n        check(stock.restock(&quot;B1&quot;, 5) == 5 &amp;&amp; stock.qty(&quot;B1&quot;) == 5, &quot;restock puts five back&quot;);\n        check(stock.restock(&quot;B1&quot;, 100) == 3, &quot;and it never goes past the column&#x27;s capacity of 8&quot;);\n\n        // 6. screens and pagers: told after the unlock, so a broken or slow one cannot hold a sale up\n        System.out.println(&quot;6. screens and pagers&quot;);\n        VendingMachine noisy = machine(2);\n        noisy.addObserver(e -&gt; { throw new RuntimeException(&quot;screen is dead&quot;); });\n        Outcome still = noisy.purchase(&quot;B1&quot;, List.of(Coin.R20, Coin.R10));\n        check(still.item() != null, &quot;the item still dropped&quot;);\n        check(noisy.qty(&quot;B1&quot;) == 1, &quot;and the stock still moved&quot;);\n        final boolean[] readable = { false };                         // a screen that asks the machine from its own thread\n        noisy.addObserver(e -&gt; {\n            FutureTask&lt;Integer&gt; ask = new FutureTask&lt;&gt;(() -&gt; noisy.qty(&quot;B1&quot;));\n            new Thread(ask).start();\n            try { readable[0] = ask.get(1, TimeUnit.SECONDS) == 0; } catch (Exception x) { readable[0] = false; }\n        });\n        noisy.purchase(&quot;B1&quot;, List.of(Coin.R20, Coin.R10));\n        check(readable[0], &quot;even a one-step purchase tells its screens after the unlock: they can read the machine&quot;);\n        RestockAlert busyPager = new RestockAlert();                  // after the unlock means in parallel\n        java.io.PrintStream screen = System.out;\n        System.setOut(new java.io.PrintStream(java.io.OutputStream.nullOutputStream()));\n        Thread[] sellers = new Thread[8];\n        for (int i = 0; i &lt; sellers.length; i++)\n            (sellers[i] = new Thread(() -&gt; { for (int k = 0; k &lt; 20_000; k++) busyPager.onEvent(new MachineEvent(&quot;SOLD&quot;, &quot;A1&quot;, 0, 0)); })).start();\n        for (Thread s : sellers) s.join();\n        System.setOut(screen);\n        check(busyPager.empty.size() == 160_000, &quot;eight sales reporting at once: the pager keeps all 160,000 alerts&quot;);\n\n        // 7. an action that the current mode does not allow is refused, loudly\n        System.out.println(&quot;7. illegal moves&quot;);\n        VendingMachine strict = machine(2);\n        final boolean[] refusedInsert = { false }, refusedSelect = { false };\n        strict.configure(new ListPrice(), new BackoffChange(), code -&gt; {     // a coin pushed in mid-drop\n            try { strict.insertCoin(Coin.R1); } catch (IllegalStateException e) { refusedInsert[0] = true; }\n            try { strict.select(&quot;B1&quot;); }       catch (IllegalStateException e) { refusedSelect[0] = true; }\n            return true;\n        });\n        strict.purchase(&quot;B1&quot;, List.of(Coin.R20, Coin.R10));\n        check(refusedInsert[0], &quot;a coin pushed in while the flap is open is refused&quot;);\n        check(refusedSelect[0], &quot;so is a second press of the button&quot;);\n        boolean threw = false;\n        try { machine(1).select(&quot;B1&quot;); } catch (IllegalStateException e) { threw = true; }\n        check(threw, &quot;pressing a slot with no money in is refused&quot;);\n        boolean empty = false;\n        try { machine(1).collect(); } catch (IllegalStateException e) { empty = true; }\n        check(empty, &quot;taking from an empty tray is refused, not a silent null&quot;);\n\n        // 8. the price comes from the injected clock, so happy hour is testable at any hour\n        System.out.println(&quot;8. time is handed in&quot;);\n        VendingMachine hh = machine(3);\n        long[] now = { at(10, 0) };\n        hh.setClock(() -&gt; now[0]);\n        hh.configure(new HappyHourDiscount(new ListPrice(), () -&gt; now[0], 16, 18, 20), new BackoffChange(), new Motor());\n        check(hh.priceOf(&quot;B1&quot;) == 2500, &quot;at 10:00 the column costs its list price, Rs 25&quot;);\n        now[0] = at(16, 30);\n        check(hh.priceOf(&quot;B1&quot;) == 2000, &quot;at 16:30 the same column costs Rs 20&quot;);\n        hh.insertCoin(Coin.R20);\n        Outcome cheap = hh.select(&quot;B1&quot;);\n        check(cheap.status() == Status.SOLD &amp;&amp; cheap.paise() == 0, &quot;Rs 20 buys it outright during happy hour&quot;);\n\n        // 9. he feeds a coin in and walks away: after thirty seconds the money is his again, not the machine&#x27;s\n        System.out.println(&quot;9. money left inside comes back by itself&quot;);\n        VendingMachine left = machine(3);\n        long[] t = { at(12, 0) };\n        left.setClock(() -&gt; t[0]);\n        left.insertCoin(Coin.R20);\n        check(left.escrowPaise() == 2000, &quot;Rs 20 sits in escrow while he is standing there&quot;);\n        t[0] += 31_000;                                               // thirty-one seconds later, no sleeping\n        left.insertCoin(Coin.R1);                                     // the next touch sweeps before it runs\n        check(left.escrowPaise() == 100, &quot;the abandoned Rs 20 is out of the escrow&quot;);\n        check(left.qty(&quot;B1&quot;) == 3 &amp;&amp; left.floatPaise() == 10000, &quot;no stock and no float moved while it sat there&quot;);\n        check(Coin.total(left.collect().coins()) == 2000, &quot;and all Rs 20 of it is waiting in the tray&quot;);\n        VendingMachine slow = machine(3);                             // but a customer still feeding coins is not cut off\n        slow.setClock(() -&gt; t[0]);\n        slow.insertCoin(Coin.R20);\n        t[0] += 20_000;\n        slow.insertCoin(Coin.R10);                                    // twenty seconds later: this coin restarts the clock\n        t[0] += 11_000;                                               // thirty-one seconds after the FIRST coin\n        boolean stillHis;\n        try { stillHis = slow.select(&quot;B1&quot;).sold(); } catch (IllegalStateException cutOff) { stillHis = false; }\n        check(stillHis, &quot;coins at 0 s and 20 s, a press at 31 s: it sells, because the timer runs from the last touch&quot;);\n\n        // 10. two sales and nobody reaches in: the tray keeps both items instead of overwriting the first\n        System.out.println(&quot;10. the tray keeps what nobody took&quot;);\n        VendingMachine bin = machine(3);\n        bin.insertCoin(Coin.R20); bin.insertCoin(Coin.R10); bin.select(&quot;B1&quot;);\n        bin.insertCoin(Coin.R20); bin.insertCoin(Coin.R10); bin.select(&quot;B1&quot;);\n        Outcome both = bin.collect();\n        check(both.items().size() == 2, &quot;two bars are waiting, not one&quot;);\n        check(Coin.total(both.coins()) == 1000, &quot;with both lots of change, Rs 10 in all&quot;);\n        check(bin.qty(&quot;B1&quot;) == 1, &quot;and the column went down by exactly two&quot;);\n\n        // 11. a one-step buyer (a phone, a kiosk) never spends the coins of the customer standing at the machine\n        System.out.println(&quot;11. whose money is in the escrow&quot;);\n        VendingMachine shared = machine(3);\n        shared.insertCoin(Coin.R20);                                  // he is standing there with Rs 20 in\n        boolean phoneRefused = false;\n        try { shared.purchase(&quot;B1&quot;, List.of(Coin.R20, Coin.R10)); } catch (IllegalStateException busy) { phoneRefused = true; }\n        check(phoneRefused, &quot;a phone purchase is refused while his coins are in&quot;);\n        check(shared.escrowPaise() == 2000 &amp;&amp; shared.qty(&quot;B1&quot;) == 3, &quot;his Rs 20 is still his, and no unit moved&quot;);\n        shared.cancel();\n        shared.collect();\n        check(shared.purchase(&quot;B1&quot;, List.of(Coin.R20, Coin.R10)).item() != null, &quot;once he has his coins back, the phone buys&quot;);\n\n        // 12. a discount still leaves a price that coins can pay\n        System.out.println(&quot;12. prices stay in whole rupees&quot;);\n        VendingMachine odd = machine(3);\n        odd.setClock(() -&gt; at(16, 30));\n        odd.configure(new HappyHourDiscount(new ListPrice(), () -&gt; at(16, 30), 16, 18, 15), new BackoffChange(), new Motor());\n        check(odd.priceOf(&quot;B1&quot;) == 2100, &quot;15% off Rs 25 is Rs 21, not Rs 21.25, which no coin could pay&quot;);\n        odd.insertCoin(Coin.R20);\n        odd.insertCoin(Coin.R5);\n        Outcome oddSale = odd.select(&quot;B1&quot;);\n        check(oddSale.sold() &amp;&amp; oddSale.paise() == 400, &quot;so Rs 25 buys it, with Rs 4 change&quot;);\n\n        // 13. the operator cannot push a count below zero, and can close a machine somebody walked away from\n        System.out.println(&quot;13. the operator&#x27;s inputs&quot;);\n        VendingMachine op = machine(3);\n        boolean stockRefused = false, floatRefused = false;\n        try { op.restock(&quot;B1&quot;, -5); } catch (IllegalArgumentException e) { stockRefused = true; }\n        try { op.loadFloat(Coin.R10, -9); } catch (IllegalArgumentException e) { floatRefused = true; }\n        check(stockRefused &amp;&amp; floatRefused &amp;&amp; op.qty(&quot;B1&quot;) == 3 &amp;&amp; op.floatPaise() == 10000,\n              &quot;a negative restock or float load is refused, and nothing moves&quot;);\n        long[] shift = { at(9, 0) };\n        op.setClock(() -&gt; shift[0]);\n        op.insertCoin(Coin.R10);                                      // somebody puts Rs 10 in and walks off\n        shift[0] += 60_000;\n        try { op.setService(true); } catch (IllegalStateException e) { /* checked below */ }\n        check(op.state() == MachineState.OUT_OF_SERVICE &amp;&amp; op.collect().paise() == 1000,\n              &quot;a minute later the operator can close it, and the Rs 10 is in the tray&quot;);\n\n        // 14. the follow-ups keep their own promises: a hold loses no unit, a card never keeps money for nothing\n        System.out.println(&quot;14. follow-ups&quot;);\n        Inventory shelf = new Inventory();\n        shelf.addSlot(new Slot(&quot;A1&quot;, new Product(&quot;LAY&quot;, &quot;Lays&quot;, 2000), 8, 2));\n        shelf.addSlot(new Slot(&quot;A2&quot;, new Product(&quot;COK&quot;, &quot;Coke&quot;, 3500), 8, 1));\n        long[] wall = { 0 };\n        HoldDesk desk = new HoldDesk(shelf, () -&gt; wall[0], 30_000);\n        desk.hold(&quot;A2&quot;, &quot;ravi&quot;);\n        desk.hold(&quot;A1&quot;, &quot;ravi&quot;);                                      // he changes his mind\n        check(shelf.slot(&quot;A2&quot;).qty() == 1, &quot;a second hold by the same customer gives the first unit back&quot;);\n        wall[0] += 31_000;\n        desk.hold(&quot;A1&quot;, &quot;meera&quot;);                                     // the next touch sweeps the expired hold\n        check(shelf.slot(&quot;A1&quot;).qty() == 1 &amp;&amp; shelf.slot(&quot;A2&quot;).qty() == 1, &quot;after the expiry no unit is lost&quot;);\n        Map&lt;String, Integer&gt; bank = new HashMap&lt;&gt;();                  // what each sale id has taken from the customer\n        CardTerminal lostReply = new CardTerminal() {\n            public boolean charge(String id, int paise) { bank.merge(id, paise, Integer::sum); throw new RuntimeException(&quot;timeout&quot;); }\n            public boolean refund(String id) { bank.remove(id); return true; }\n        };\n        Outcome unknown = new CardCheckout(shelf, new Motor(), lostReply).buy(&quot;A1&quot;, 2000);\n        check(!unknown.sold() &amp;&amp; bank.isEmpty() &amp;&amp; shelf.slot(&quot;A1&quot;).qty() == 1,\n              &quot;the charge went through but the reply timed out: refunded by its sale id, nothing dropped&quot;);\n        CardTerminal bankDown = new CardTerminal() {\n            public boolean charge(String id, int paise) { return true; }\n            public boolean refund(String id) { return false; }\n        };\n        CardCheckout stuck = new CardCheckout(shelf, code -&gt; false, bankDown);\n        stuck.buy(&quot;A1&quot;, 2000);\n        check(stuck.refundsToRetry.size() == 1, &quot;a refund that fails is kept for a retry, not forgotten&quot;);\n\n        System.out.println(failed == 0 ? &quot;ALL PASS&quot; : failed + &quot; FAILED&quot;);\n        if (failed &gt; 0) System.exit(1);\n    }\n\n    /** A fixed moment on 15 September 2026 in Kolkata, so the tests never depend on when they run. */\n    static long at(int hour, int minute) {\n        return java.time.LocalDateTime.of(2026, 9, 15, hour, minute)\n                 .atZone(java.time.ZoneId.of(&quot;Asia/Kolkata&quot;)).toInstant().toEpochMilli();\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design a vending machine. Several columns of products with prices and counts, coins in, the item and the change out, and a coin return button. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions; then type in the order of Main.java: the enums and the money (Coin, Product, Slot), the two owners (Inventory, CoinBox), the tray and the outcome, the mode and action table, the five one-method interfaces (clock, price, change, motor, observer) with one implementation each, the machine with its lock and the order inside <code>sell</code>, the one-step <code>purchase</code> that is legal only when idle, the front panel, and a main with the race.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Happy hour: twenty percent off between four and six, without touching VendingMachine.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The price is already an interface, so happy hour is one new class that wraps the list price: it asks the wrapped rule for the price, reads the hour from the handed-in clock, and takes twenty percent off inside the window. It rounds the result down to a whole rupee, because Rs 1 is the smallest coin. Fifteen percent off Rs 25 is Rs 21.25, which no coin could pay, so it sells at Rs 21. The machine does not change; the only edit is the line where the price rule is handed in. Because the hour comes from the clock and not from the wall, a test can make any minute of any day four-thirty.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * A rule that WRAPS another rule instead of replacing it: the wrapped price, minus a percentage, between\n * two hours of the day. The hour comes from the handed-in clock, never from the wall clock.\n */\nfinal class HappyHourDiscount implements PricingStrategy {\n    private final PricingStrategy base;\n    private final Clock clock;\n    private final int fromHour, toHour, offPercent;\n    private final ZoneId zone = ZoneId.of(&quot;Asia/Kolkata&quot;);\n\n    HappyHourDiscount(PricingStrategy base, Clock clock, int fromHour, int toHour, int offPercent) {\n        if (offPercent &lt; 0 || offPercent &gt; 100) throw new IllegalArgumentException(&quot;discount of &quot; + offPercent + &quot;%&quot;);\n        this.base = base; this.clock = clock; this.fromHour = fromHour; this.toHour = toHour; this.offPercent = offPercent;\n    }\n    /**\n     * The base price, less the discount when the clock says we are inside the window, rounded DOWN to a\n     * whole rupee: the smallest coin is Rs 1, so a price like Rs 21.25 could never be paid or changed.\n     */\n    public int priceOf(Slot s) {\n        int price = base.priceOf(s);\n        int hour = Instant.ofEpochMilli(clock.nowMs()).atZone(zone).getHour();\n        if (hour &lt; fromHour || hour &gt;= toHour) return price;\n        int cut = price - (price * offPercent) / 100;\n        return cut - cut % Coin.R1.paise;                    // 15% off Rs 25 is Rs 21, in the customer&#x27;s favour\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two panels press for the last unit at the same instant. Prove it cannot oversell, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading \"B1 has one left\" and writing \"B1 has none\". The whole sale &mdash; the checks, the change plan, the motor, the commit &mdash; happens inside one lock, so no other panel can run in that gap. The proof: forty threads wait on one latch, the latch opens, and all forty buy the last unit. The test then counts four things: exactly one item left the machine, the column ended at zero and never below, every one of the thirty-nine losers got its whole thirty rupees back, and the float grew by exactly one price. The last two assertions are the money invariant, which is the one most candidates never state.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// 1. two terminals press for the last unit: exactly one item leaves, and no paise is lost\n        System.out.println(&quot;1. forty panels, one unit left&quot;);\n        VendingMachine race = machine(1);\n        int floatBefore = race.floatPaise();\n        int panels = 40;\n        CountDownLatch go = new CountDownLatch(1), done = new CountDownLatch(panels);\n        List&lt;Outcome&gt; out = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        for (int i = 0; i &lt; panels; i++)\n            new Thread(() -&gt; {\n                try { go.await(); out.add(race.purchase(&quot;B1&quot;, List.of(Coin.R20, Coin.R10))); }\n                catch (Exception e) { /* counted as no sale */ }\n                finally { done.countDown(); }\n            }).start();\n        go.countDown();\n        done.await();\n        long sold = out.stream().filter(o -&gt; o.item() != null).count();\n        int handedBack = out.stream().filter(o -&gt; o.item() == null).mapToInt(Outcome::paise).sum();\n        check(sold == 1, &quot;exactly one panel got the item, &quot; + (panels - 1) + &quot; were refused&quot;);\n        check(race.qty(&quot;B1&quot;) == 0, &quot;the column ended at zero, never below&quot;);\n        check(handedBack == (panels - 1) * 3000, &quot;every refused panel got its whole Rs 30 back&quot;);\n        check(race.floatPaise() == floatBefore + 2500, &quot;the float grew by exactly one price, Rs 25&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock for the whole machine, with a two-second motor inside it. Does that scale?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Everything except the motor is about one and a half microseconds of lock per sale: a map lookup, one price call, a change plan over five denominations and ten small writes. The motor is two seconds and it runs inside the lock, which is the honest weak spot. Still, at three hundred sales a day that is six hundred seconds of lock out of eighty-six thousand, 0.7% busy, and a real machine has one keypad, so nobody ever waits. It stops being fine the moment a bank of machines shares one stock service. Rung one takes the motor out: reserve the unit under a very short lock, drop with the lock released, then commit or give the reservation back. Rung two is a lock per column, and rung three lets the count itself decide with a compare-and-set, which is what the database's conditional update does for a shared service.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: motor outside the lock ---------------------------------------------------------------------\n/**\n * Rung one of the ladder: get the two-second motor out of the critical section. The unit is RESERVED under\n * a very short lock, the coil turns with the lock released, and a second short section either commits the\n * reservation or puts it back. Nobody can oversell, and two columns no longer wait for each other.\n */\nfinal class ReservingColumn {\n    private final String code;\n    private final Dispenser motor;\n    private final ReentrantLock lock = new ReentrantLock();\n    private int qty;\n    private int reserved;\n\n    ReservingColumn(String code, int qty, Dispenser motor) { this.code = code; this.qty = qty; this.motor = motor; }\n    /** Reserve, drop outside the lock, then commit or give the reservation back. */\n    boolean sell() {\n        lock.lock();\n        try {\n            if (qty - reserved &lt;= 0) return false;\n            reserved++;                                   // ~0.2 us of lock, not two seconds\n        } finally { lock.unlock(); }\n        boolean dropped;\n        try { dropped = motor.drop(code); } catch (RuntimeException jam) { dropped = false; }\n        lock.lock();\n        try {\n            reserved--;\n            if (dropped) qty--;\n            return dropped;\n        } finally { lock.unlock(); }\n    }\n    /** What is left, reservations included. */\n    int available() { lock.lock(); try { return qty - reserved; } finally { lock.unlock(); } }\n}\n\n// ---- ext: a claim without a lock ---------------------------------------------------------------------\n/**\n * Rung three: the count itself decides the winner, with no lock at all. compareAndSet is the hardware&#x27;s\n * version of &quot;read and write as one step&quot;, and it is exactly what the SQL conditional update does.\n */\nfinal class CasColumn {\n    private final AtomicInteger qty;\n\n    CasColumn(int qty) { this.qty = new AtomicInteger(qty); }\n    /** Take one unit, or false when there is none. Losers of a race simply try again. */\n    boolean claim() {\n        while (true) {\n            int n = qty.get();\n            if (n == 0) return false;\n            if (qty.compareAndSet(n, n - 1)) return true;\n        }\n    }\n    /** Put a unit back after a jam. */\n    void giveBack() { qty.incrementAndGet(); }\n    /** What is left. */\n    int left() { return qty.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>4 &middot; Two panels, and both of them take coins. Whose money is inside the machine?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>In Main.java the escrow is one list on the machine, which is the honest model of the thing on the wall: there is one coin slot, so the coins inside belong to whoever is standing at it. A phone or a kiosk pays and presses in one step with <code>purchase(code, coins)</code>. It takes the lock, feeds that caller's coins in, presses, and empties the tray before any other terminal can run, so one buyer's whole transaction is atomic rather than interleaved with another's. The calls inside take the same lock again, which a <code>ReentrantLock</code> allows. And it is legal only in IDLE: while a walk-up customer's coins are in, the phone is refused, because otherwise his twenty rupees would pay for the phone's Coke (test 11). If the machine really does have two coin slots, the escrow becomes one list per panel, and every call carries a panel id &mdash; the class below. The stock and the float stay behind the machine's single lock either way, because what two customers fight over is the last unit, not each other's coins.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * One buyer&#x27;s whole transaction as a single locked step: their coins go in, the slot is pressed, and\n     * the tray is emptied before any other terminal can touch a count. This is what a phone app, a kiosk or\n     * the race test calls. Legal only in IDLE: while a walk-up customer&#x27;s coins are in escrow it is refused,\n     * because spending them would hand one customer&#x27;s money to another.\n     */\n    Outcome purchase(String code, List&lt;Coin&gt; paid) {\n        List&lt;MachineEvent&gt; events = new ArrayList&lt;&gt;();\n        Outcome o;\n        lock.lock();\n        try {\n            expireEscrow();\n            require(Action.PURCHASE);                       // somebody else&#x27;s coins are in: refuse, never spend them\n            for (Coin c : paid) insertCoin(c);              // re-entrant: this thread already holds the lock\n            o = sell(code, events);\n            if (!o.sold()) cancel();                        // a one-shot buyer never leaves money behind\n            if (!tray.isEmpty()) o = collect();\n        } finally { lock.unlock(); }\n        publish(events);                                    // after the OUTER unlock, never inside it\n        return o;\n    }\n\n// ---- ext: a coin slot per panel ----------------------------------------------------------------------\n/**\n * The machine in Main.java has ONE coin slot, so one escrow list is the whole truth: the coins inside it\n * belong to whoever is standing there. A machine with two coin slots needs one escrow PER panel, or panel\n * one&#x27;s twenty rupees pays for panel two&#x27;s Coke. Only the money in flight splits: the stock and the float\n * stay behind the machine&#x27;s single lock, because the thing being fought over is the last unit, not the coins.\n */\nfinal class PanelEscrow {\n    private final Map&lt;String, List&lt;Coin&gt;&gt; byPanel = new HashMap&lt;&gt;();\n    private final ReentrantLock lock = new ReentrantLock();\n\n    /** Push a coin in at one panel. */\n    void insert(String panel, Coin c) {\n        lock.lock();\n        try { byPanel.computeIfAbsent(panel, p -&gt; new ArrayList&lt;&gt;()).add(c); } finally { lock.unlock(); }\n    }\n    /** What that panel is holding, in paise. */\n    int paise(String panel) {\n        lock.lock();\n        try { return Coin.total(byPanel.getOrDefault(panel, List.of())); } finally { lock.unlock(); }\n    }\n    /** Take that panel&#x27;s coins out to pay with. Every other panel&#x27;s money is untouched. */\n    List&lt;Coin&gt; take(String panel) {\n        lock.lock();\n        try { List&lt;Coin&gt; c = byPanel.remove(panel); return c == null ? List.of() : List.copyOf(c); }\n        finally { lock.unlock(); }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; The motor jams after the money is in. What is the state of the machine, and show me the code.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing is half done. <code>sell</code>, the body of <code>select</code>, proves everything first &mdash; stock, price, and that the change can be made &mdash; while touching no counts at all, then turns the motor. If the motor returns false or throws, the whole escrow goes to the tray, the mode goes back to idle, and the column and the float are exactly what they were: not one unit lost, not one paise moved. Only after the item has fallen does anything commit, and from that point on every step is a field write that cannot fail. The failure test jams the motor with a one-line lambda and checks all four numbers afterwards.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Press a slot: take the lock, run the sale (sell, just below), and tell the observers only after the unlock. */\n    Outcome select(String code) {\n        List&lt;MachineEvent&gt; events = new ArrayList&lt;&gt;();\n        Outcome out;\n        lock.lock();\n        try { out = sell(code, events); } finally { lock.unlock(); }\n        publish(events);                                     // the screen hears AFTER the lock\n        return out;\n    }\n\n    /**\n     * THE critical step; the caller holds the lock. In this order: refuse for a reason that touches\n     * nothing (no such code, sold out, not enough money); prove the change can be made from float plus\n     * escrow WITHOUT touching the float; only then turn the motor, the one irreversible act; and only when\n     * the

 &quot; via &quot; + acquirer)\n                 + (capturedPaise &gt; 0 ? &quot; captured &quot; + Money.fmt(capturedPaise) : &quot;&quot;)\n                 + (refundedPaise &gt; 0 ? &quot; refunded &quot; + Money.fmt(refundedPaise) : &quot;&quot;)\n                 + (reason.isEmpty() ? &quot;&quot; : &quot; (&quot; + reason + &quot;)&quot;);\n        } finally { lock.unlock(); }\n    }\n}\n\n/**\n * The gateway. It owns the registries, sequences one payment end to end, and decides no policy: routing, fees,\n * retries, risk rules, listeners and the clock are all handed in.\n *\n * The order at a payment IS the design, and it is this: claim the idempotency key with one putIfAbsent, which is\n * the compare-and-set that makes a retried request safe; run the risk rules and pick the route, both pure and both\n * outside every lock; take the payment&#x27;s lock only long enough to move CREATED to PENDING, which claims the right\n * to call the acquirer; call the acquirer OUTSIDE the lock with a timeout, because that is the irreversible step\n * and nothing slow may sit inside a lock; take the lock again to record what it said; release; then tell the\n * merchant. Nothing is ever written as success before the acquirer says success, so a timeout leaves a payment\n * that says &quot;ask again&quot; instead of a payment that lies.\n */\nclass PaymentService {\n    private final Map&lt;String, Merchant&gt; merchants = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Payment&gt; byId = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Payment&gt; byKey = new ConcurrentHashMap&lt;&gt;();          // idempotency key -&gt; the one attempt\n    private final Map&lt;String, List&lt;Payment&gt;&gt; byMerchant = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Refund&gt; refundsById = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Refund&gt; refundsByKey = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, List&lt;Refund&gt;&gt; refundsByPayment = new ConcurrentHashMap&lt;&gt;();\n    private final Set&lt;String&gt; unresolved = ConcurrentHashMap.newKeySet();          // payments whose outcome is UNKNOWN\n    private final List&lt;PaymentProcessor&gt; processors = new CopyOnWriteArrayList&lt;&gt;();\n    private final Map&lt;String, PaymentProcessor&gt; byAcquirer = new ConcurrentHashMap&lt;&gt;();\n    private final List&lt;PaymentListener&gt; listeners = new CopyOnWriteArrayList&lt;&gt;();\n    private final AtomicLong nextId = new AtomicLong(1);\n\n    private volatile RoutingPolicy routing = (t, c, paise, all) -&gt; {\n        List&lt;PaymentProcessor&gt; able = new ArrayList&lt;&gt;();\n        for (PaymentProcessor p : all) if (p.supports(t, c)) able.add(p);\n        return able;\n    };\n    private volatile FeePolicy fees = (paise, type, acquirer) -&gt; 0;\n    private volatile RetryPolicy retries = new RetrySafeFailuresOnly(2);\n    private volatile List&lt;RiskRule&gt; riskRules = List.of();\n    private volatile Clock clock = System::currentTimeMillis;\n\n    /** Hand in the policy. The gateway never builds a rule, which is why a test can hand it a broken one. */\n    void configure(RoutingPolicy routing, FeePolicy fees, RetryPolicy retries, List&lt;RiskRule&gt; riskRules) {\n        this.routing = routing; this.fees = fees; this.retries = retries; this.riskRules = List.copyOf(riskRules);\n    }\n    /** Tests hand in a fixed clock, so &quot;seven days old&quot; is whatever the test says it is. */\n    void setClock(Clock c) { clock = c; }\n    /** Add an acquirer. Order does not matter: the routing policy decides who is tried and in what order. */\n    void addProcessor(PaymentProcessor p) { processors.add(p); byAcquirer.put(p.name(), p); }\n    /** Subscribe a listener. Setup only; listeners are called after every lock is released. */\n    void addListener(PaymentListener l) { listeners.add(l); }\n    /** Register a merchant. O(1). */\n    void register(Merchant m) { merchants.put(m.id(), m); }\n    /** The merchant, or an error. O(1). */\n    Merchant merchant(String id) {\n        Merchant m = merchants.get(id);\n        if (m == null) throw new NoSuchElementException(&quot;no such merchant: &quot; + id);\n        return m;\n    }\n    /** One payment by our id. O(1). */\n    Payment payment(String id) {\n        Payment p = byId.get(id);\n        if (p == null) throw new NoSuchElementException(&quot;no such payment: &quot; + id);\n        return p;\n    }\n    /** The one attempt behind an idempotency key, if there is one. O(1). */\n    Payment byKey(String idemKey) { return byKey.get(idemKey); }\n    /** One refund by our id. O(1). */\n    Refund refundById(String id) {\n        Refund r = refundsById.get(id);\n        if (r == null) throw new NoSuchElementException(&quot;no such refund: &quot; + id);\n        return r;\n    }\n    /** Every payment of one merchant, newest last. O(1) to find the list, never a scan of every payment. */\n    List&lt;Payment&gt; paymentsOf(String merchantId) { return List.copyOf(byMerchant.getOrDefault(merchantId, List.of())); }\n    /** Every refund of one payment. O(1) to find the list. */\n    List&lt;Refund&gt; refundsOf(String paymentId) { return List.copyOf(refundsByPayment.getOrDefault(paymentId, List.of())); }\n    /** The payments whose outcome we do not know. Maintained as they happen, so the job never scans. */\n    Set&lt;String&gt; unresolved() { return Set.copyOf(unresolved); }\n\n    /**\n     * Take a payment. Idempotent by key: the same key always yields the very same Payment object, whatever happened\n     * to it, so a retried HTTP request cannot charge twice. Never throws for a business outcome -- a decline, a\n     * risk refusal and a missing route all come back as a Payment you can read the state of.\n     */\n    Payment pay(String idemKey, String merchantId, long paise, Currency currency, PaymentMethod method) {\n        if (paise &lt;= 0) throw new IllegalArgumentException(&quot;amount must be positive: &quot; + paise);\n        merchant(merchantId);                                            // unknown merchant is a caller error\n        Payment seen = byKey.get(idemKey);\n        if (seen != null) return seen;                                   // fast path: an obvious retry, no id burned\n        long now = clock.nowMs();\n\n        Payment fresh = new Payment(&quot;pay_&quot; + nextId.getAndIncrement(), idemKey, merchantId, paise, currency, method, now);\n        Payment prior = byKey.putIfAbsent(idemKey, fresh);               // THE compare-and-set: one key, one attempt\n        if (prior != null) return prior;\n        byId.put(fresh.id(), fresh);\n        byMerchant.computeIfAbsent(merchantId, k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(fresh);\n\n        try {\n            for (RiskRule r : riskRules) r.check(merchantId, paise, method, now);   // pure, no lock, no network\n        } catch (PaymentRejected refusal) {\n            fresh.settle(PaymentState.FAILED, &quot;&quot;, refusal.getMessage(), now);\n            publish(fresh);\n            return fresh;\n        }\n        List&lt;PaymentProcessor&gt; route = routing.route(method.type(), currency, paise, processors);\n        if (route.isEmpty()) {\n            fresh.settle(PaymentState.FAILED, &quot;&quot;, &quot;no acquirer takes &quot; + method.type() + &quot; in &quot; + currency, now);\n            publish(fresh);\n            return fresh;\n        }\n        authorizeAlong(fresh, route);\n        publish(fresh);\n        return fresh;\n    }\n\n    /**\n     * Walk the route until one acquirer answers. A ProcessorUnavailable means the call never left the building, so\n     * the claim is handed back and the next acquirer is tried. A ProcessorTimeout means the opposite: the money may\n     * have moved, so we stop, mark the payment UNKNOWN and let the status query settle it. That single distinction\n     * is the difference between a gateway and a double-charging machine.\n     */\n    private void authorizeAlong(Payment p, List&lt;PaymentProcessor&gt; route) {\n        RuntimeException last = null;\n        for (int i = 0; i &lt; route.size(); i++) {\n            PaymentProcessor acquirer = route.get(i);\n            long fee = fees.feeFor(p.paise(), p.method().type(), acquirer);\n            long now = clock.nowMs();\n            if (!p.claim(PaymentState.CREATED, PaymentState.PENDING, acquirer.name(), fee, p.id(), now)) return;\n            try {\n                ProcessorResult r = acquirer.authorize(p.id(), p.paise(), p.currency(), p.method());  // OUTSIDE the lock\n                switch (r.outcome()) {\n                    case CAPTURED -&gt; p.settle(PaymentState.CAPTURED, r.ref(), &quot;&quot;, clock.nowMs());\n                    case AUTHORIZED -&gt; p.settle(PaymentState.AUTHORIZED, r.ref(), &quot;&quot;, clock.nowMs());\n                    default -&gt; p.settle(PaymentState.FAILED, r.ref(), r.reason(), clock.nowMs());\n                }\n                return;\n            } catch (ProcessorTimeout t) {\n                p.markUnknown(&quot;timeout at &quot; + acquirer.name() + &quot;: &quot; + t.getMessage(), clock.nowMs());\n                unresolved.add(p.id());\n                return;                                                  // never fail over after a timeout\n            } catch (ProcessorUnavailable u) {\n                last = u;\n                p.revertClaim(acquirer.name() + &quot; unavailable: &quot; + u.getMessage(), clock.nowMs());\n                if (!retries.retry(i + 1, u)) break;\n            }\n        }\n        p.settle(PaymentState.FAILED, &quot;&quot;, last == null ? &quot;no acquirer accepted it&quot; : last.getMessage(), clock.nowMs());\n    }\n\n    /**\n     * Move an authorized payment&#x27;s money. The same shape as pay(): claim AUTHORIZED to PENDING under the lock, call\n     * the acquirer outside it, record the answer. A declined capture does NOT void the authorization -- the claim\n     * is handed back and the merchant may try again before the authorization expires.\n     */\n    Payment capture(String paymentId) {\n        Payment p = payment(paymentId);\n        PaymentProcessor acquirer = byAcquirer.get(p.acquirer());\n        if (acquirer == null) return p;\n        String key = p.id() + &quot;:cap&quot;;\n        if (!p.claim(PaymentState.AUTHORIZED, PaymentState.PENDING, acquirer.name(), p.feePaise(), key, clock.nowMs()))\n            return p;                                                    // not authorized, or someone already has it\n        try {\n            ProcessorResult r = acquirer.capture(key, p.acquirerRef(), p.paise());   // OUTSIDE the lock\n            if (r.outcome() == Outcome.CAPTURED) p.settle(PaymentState.CAPTURED, r.ref(), &quot;&quot;, clock.nowMs());\n            else p.revertClaim(r.reason(), clock.nowMs());\n        } catch (ProcessorTimeout t) {\n            p.markUnknown(&quot;capture timeout at &quot; + acquirer.name(), clock.nowMs());\n            unresolved.add(p.id());\n        } catch (ProcessorUnavailable u) {\n            p.revertClaim(acquirer.name() + &quot; unavailable: &quot; + u.getMessage(), clock.nowMs());\n        }\n        publish(p);\n        return p;\n    }\n\n    /**\n     * Send some of a captured payment back. Reserve-then-settle: the amount is promised under the payment&#x27;s lock\n     * BEFORE the acquirer is called, and turned into a fact only when the acquirer says yes. A single counter\n     * updated after the call would let two refunds decided from the same read together exceed what was captured.\n     * Idempotent by its own key, like every other write.\n     */\n    Refund refund(String refundKey, String paymentId, long paise) {\n        if (paise &lt;= 0) throw new IllegalArgumentException(&quot;refund must be positive: &quot; + paise);\n        Payment p = payment(paymentId);\n        Refund seen = refundsByKey.get(refundKey);\n        if (seen != null) return seen;\n        long now = clock.nowMs();\n        Refund fresh = new Refund(&quot;rfnd_&quot; + nextId.getAndIncrement(), refundKey, paymentId, paise, now);\n        Refund prior = refundsByKey.putIfAbsent(refundKey, fresh);\n        if (prior != null) return prior;\n        refundsById.put(fresh.id(), fresh);\n        refundsByPayment.computeIfAbsent(paymentId, k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(fresh);\n\n        if (!p.reserveRefund(paise)) {                                    // check and write as ONE step\n            fresh.fail(&quot;cannot refund &quot; + Money.fmt(paise) + &quot; of &quot; + p.id() + &quot;: it is &quot; + p.state()\n                     + &quot; with &quot; + Money.fmt(p.refundablePaise()) + &quot; refundable&quot;);\n            return fresh;\n        }\n        PaymentProcessor acquirer = byAcquirer.get(p.acquirer());\n        try {\n            ProcessorResult r = acquirer.refund(fresh.id(), p.acquirerRef(), paise);  // OUTSIDE the lock\n            if (r.outcome() == Outcome.REFUNDED) { p.settleRefund(paise, clock.nowMs()); fresh.succeed(r.ref()); }\n            else { p.releaseRefund(paise); fresh.fail(r.reason()); }\n        } catch (ProcessorTimeout t) {\n            fresh.unknown(&quot;timeout at &quot; + acquirer.name());               // the reservation STAYS held\n        } catch (ProcessorUnavailable u) {\n            p.releaseRefund(paise); fresh.fail(u.getMessage());\n        }\n        publish(p);\n        return fresh;\n    }\n\n    /**\n     * An acquirer calls us back. Delivery is at-least-once and out of order, and neither matters: this is the same\n     * settle() the response path uses, so a duplicate loses on rank and a late &quot;authorized&quot; after a capture is\n     * dropped. Returns true if the report changed anything.\n     */\n    boolean handleWebhook(String paymentId, PaymentState reported, String acquirerRef, long atMs) {\n        Payment p = byId.get(paymentId);\n        if (p == null) return false;                                      // a callback for something we never sent\n        if (reported.outcomeRank() == 0) return false;                    // a webhook only ever reports an outcome\n        boolean changed = p.settle(reported, acquirerRef, &quot;&quot;, atMs);\n        if (changed) { unresolved.remove(paymentId); publish(p); }\n        return changed;\n    }\n\n    /**\n     * The only honest way out of an UNKNOWN: ask the acquirer what happened to the exact key we sent. NOT_FOUND\n     * means it never saw the request, so the claim is handed back (a capture) or the payment fails (an authorize).\n     * Safe to call as often as you like -- settle() is rank-guarded, so a second answer changes nothing.\n     */\n    boolean resolveUnknown(String paymentId) {\n        Payment p = payment(paymentId);\n        if (p.state() != PaymentState.UNKNOWN) { unresolved.remove(paymentId); return false; }\n        PaymentProcessor acquirer = byAcquirer.get(p.acquirer());\n        if (acquirer == null) return false;\n        ProcessorResult r;\n        try { r = acquirer.statusOf(p.inFlightKey()); }\n        catch (RuntimeException e) { return false; }                      // still down: the job will come back\n        long now = clock.nowMs();\n        boolean settled = switch (r.outcome()) {\n            case CAPTURED -&gt; p.settle(PaymentState.CAPTURED, r.ref(), &quot;&quot;, now);\n            case AUTHORIZED -&gt; p.settle(PaymentState.AUTHORIZED, r.ref(), &quot;&quot;, now);\n            case DECLINED, NOT_FOUND -&gt; p.claimedFrom() == PaymentState.CREATED\n                    ? p.settle(PaymentState.FAILED, &quot;&quot;, &quot;the acquirer never took it: &quot; + r.reason(), now)\n                    : p.revertClaim(&quot;the capture never reached the acquirer&quot;, now);\n            default -&gt; false;\n        };\n        if (settled) { unresolved.remove(paymentId); publish(p); }\n        return settled;\n    }\n\n    /**\n     * The job that closes the books. It finishes every payment whose outcome has been unknown for longer than\n     * staleMs by asking the acquirer, then checks the one invariant that must hold for every payment: you can\n     * never have sent back more than you took. Returns the number of payments it settled.\n     */\n    int reconcile(long staleMs) {\n        int settled = 0;\n        long now = clock.nowMs();\n        for (String id : List.copyOf(unresolved)) {\n            Payment p = byId.get(id);\n            if (p != null &amp;&amp; now - p.lastChangeMs() &gt;= staleMs &amp;&amp; resolveUnknown(id)) settled++;\n        }\n        for (Payment p : byId.values()) {\n            if (p.capturedPaise() &gt; p.paise())\n                throw new IllegalStateException(p.id() + &quot; captured more than it took&quot;);\n            if (p.refundedPaise() + p.refundReservedPaise() &gt; p.capturedPaise())\n                throw new IllegalStateException(p.id() + &quot; refunded more than it captured&quot;);\n        }\n        return settled;\n    }\n\n    /**\n     * What this merchant is owed: everything captured, less everything refunded, less our fees. O(k) over that\n     * merchant&#x27;s own payments off the index, never a scan of the whole gateway.\n     */\n    long settlementOf(String merchantId) {\n        long total = 0;\n        for (Payment p : byMerchant.getOrDefault(merchantId, List.of())) {\n            if (p.capturedPaise() == 0) continue;\n            total += p.capturedPaise() - p.refundedPaise() - p.feePaise();\n        }\n        return total;\n    }\n\n    /** Tell every listener, outside every lock, and survive one that throws. */\n    private void publish(Payment p) {\n        PaymentEvent e = new PaymentEvent(p.id(), p.merchantId(), p.state(), p.paise(), p.capturedPaise(),\n                                          p.refundedPaise(), p.acquirer(), p.reason(), clock.nowMs());\n        for (PaymentListener l : listeners) {\n            try { l.onEvent(e); } catch (RuntimeException ex) { System.err.println(&quot;[listener failed] &quot; + ex.getMessage()); }\n        }\n    }\n}\n\n/**\n * Proof it works: a card payment authorized then captured, a UPI payment captured in one step, a retried request,\n * a decline, a failover when the primary acquirer is down, a timeout that becomes UNKNOWN and is then closed by\n * the status query, partial refunds up to the cap and one paise past it, an out-of-order webhook -- and then fifty\n * threads sending the SAME idempotency key at once, with exactly one charge at the acquirer.\n */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        long[] now = { 1_700_000_000_000L };\n        Clock clock = () -&gt; now[0];\n\n        CardAcquirer hdfc = new CardAcquirer(&quot;HDFC&quot;, 180, Currency.INR, Currency.USD);\n        CardAcquirer axis = new CardAcquirer(&quot;AXIS&quot;, 220, Currency.INR);\n        UpiSwitch npci = new UpiSwitch(&quot;NPCI&quot;, 0);\n\n        PaymentService gw = new PaymentService();\n        gw.setClock(clock);\n        gw.addProcessor(new CircuitBreaker(hdfc, 3, 30_000, clock));\n        gw.addProcessor(new CircuitBreaker(axis, 3, 30_000, clock));\n        gw.addProcessor(new CircuitBreaker(npci, 3, 30_000, clock));\n        gw.configure(new PreferredRouting(Map.of(PaymentMethodType.CARD, List.of(&quot;HDFC&quot;, &quot;AXIS&quot;),\n                                                 PaymentMethodType.UPI, List.of(&quot;NPCI&quot;))),\n                     new BpsFee(Money.rupees(&quot;2.00&quot;)),\n                     new RetrySafeFailuresOnly(2),\n                     List.of(new AmountCapRule(Map.of(PaymentMethodType.CARD, Money.rupees(&quot;200000.00&quot;)))));\n\n        Merchant shop = new Merchant(&quot;m_chai&quot;, &quot;Chai Point&quot;, &quot;https://chaipoint.example/hooks&quot;);\n        gw.register(shop);\n        MerchantWebhook hooks = new MerchantWebhook((url, e) -&gt; true, 3);\n        hooks.register(shop);\n        gw.addListener(hooks);\n        AuditLog audit = new AuditLog();\n        gw.addListener(audit);\n\n        PaymentMethod card = new PaymentMethod(PaymentMethodType.CARD, &quot;tok_visa_9f21&quot;, &quot;**** 1111&quot;);\n        PaymentMethod upi  = new PaymentMethod(PaymentMethodType.UPI, &quot;harish@okhdfc&quot;, &quot;harish@okhdfc&quot;);\n\n        // a card payment: authorize reserves, capture moves it\n        Payment p1 = gw.pay(&quot;ord-1001&quot;, &quot;m_chai&quot;, Money.rupees(&quot;1000.00&quot;), Currency.INR, card);\n        System.out.println(&quot;authorized: &quot; + p1);\n        gw.capture(p1.id());\n        System.out.println(&quot;captured:   &quot; + p1 + &quot;  fee &quot; + Money.fmt(p1.feePaise()));\n\n        // UPI has no auth/capture split; the flow does not notice\n        Payment p2 = gw.pay(&quot;ord-1002&quot;, &quot;m_chai&quot;, Money.rupees(&quot;240.00&quot;), Currency.INR, upi);\n        System.out.println(&quot;upi:        &quot; + p2);\n\n        // the same request twice (a phone on a bad network): one charge, the same payment back\n        Payment again = gw.pay(&quot;ord-1001&quot;, &quot;m_chai&quot;, Money.rupees(&quot;1000.00&quot;), Currency.INR, card);\n        System.out.println(&quot;retry of ord-1001 returned the same payment: &quot; + (again == p1)\n            + &quot;, HDFC saw &quot; + hdfc.calls() + &quot; requests (one authorize, one capture -- the retry made none)&quot;);\n\n        // a decline is an answer, not a failure: FAILED, nothing captured\n        hdfc.mode(VendorMode.DECLINE);\n        Payment p3 = gw.pay(&quot;ord-1003&quot;, &quot;m_chai&quot;, Money.rupees(&quot;500.00&quot;), Currency.INR, card);\n        System.out.println(&quot;declined:   &quot; + p3);\n        hdfc.mode(VendorMode.HEALTHY);\n\n        // the primary acquirer refuses the connection: nothing was charged, so the route fails over to AXIS\n        hdfc.mode(VendorMode.DOWN);\n        Payment p4 = gw.pay(&quot;ord-1004&quot;, &quot;m_chai&quot;, Money.rupees(&quot;750.00&quot;), Currency.INR, card);\n        System.out.println(&quot;failover:   &quot; + p4);\n        hdfc.mode(VendorMode.HEALTHY);\n\n        // the acquirer takes the money and then the socket dies: UNKNOWN, and NOT retried\n        npci.mode(VendorMode.TIMEOUT_CHARGED);\n        Payment p5 = gw.pay(&quot;ord-1005&quot;, &quot;m_chai&quot;, Money.rupees(&quot;99.00&quot;), Currency.INR, upi);\n        System.out.println(&quot;timeout:    &quot; + p5 + &quot;   unresolved=&quot; + gw.unresolved());\n        npci.mode(VendorMode.HEALTHY);\n        now[0] += 60_000;                                   // an hour of the job&#x27;s patience, in one line\n        System.out.println(&quot;reconciled &quot; + gw.reconcile(30_000) + &quot; payment(s); now: &quot; + p5);\n\n        // refunds: part of it, the rest of it, then one paise too far\n        System.out.println(&quot;refund 300: &quot; + gw.refund(&quot;rf-1&quot;, p1.id(), Money.rupees(&quot;300.00&quot;)) + &quot; -&gt; &quot; + p1.state());\n        System.out.println(&quot;refund 700: &quot; + gw.refund(&quot;rf-2&quot;, p1.id(), Money.rupees(&quot;700.00&quot;)) + &quot; -&gt; &quot; + p1.state());\n        System.out.println(&quot;one paise more: &quot; + gw.refund(&quot;rf-3&quot;, p1.id(), 1));\n\n        // a webhook that arrives late and out of order is dropped on rank\n        boolean changed = gw.handleWebhook(p1.id(), PaymentState.AUTHORIZED, &quot;hdfc_late&quot;, now[0]);\n        System.out.println(&quot;late &#x27;authorized&#x27; webhook after a refund changed anything: &quot; + changed + &quot;, still &quot; + p1.state());\n\n        System.out.println(&quot;settlement for &quot; + shop.name() + &quot;: &quot; + Money.fmt(gw.settlementOf(&quot;m_chai&quot;)));\n        System.out.println(&quot;webhooks delivered: &quot; + hooks.delivered() + &quot;, audit lines: &quot; + audit.events().size());\n\n        // fifty threads, one idempotency key, at the same instant: exactly one charge\n        CardAcquirer solo = new CardAcquirer(&quot;SOLO&quot;, 200, Currency.INR);\n        PaymentService busy = new PaymentService();\n        busy.setClock(clock);\n        busy.addProcessor(solo);\n        busy.configure(new PreferredRouting(Map.of(PaymentMethodType.CARD, List.of(&quot;SOLO&quot;))),\n                       new BpsFee(0), new RetrySafeFailuresOnly(2), List.of());\n        busy.register(new Merchant(&quot;m_x&quot;, &quot;X&quot;, &quot;https://x.example/hooks&quot;));\n\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;String&gt;&gt; sent = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            sent.add(pool.submit(() -&gt; {\n                go.await();\n                return busy.pay(&quot;ord-RACE&quot;, &quot;m_x&quot;, Money.rupees(&quot;1000.00&quot;), Currency.INR, card).id();\n            }));\n        }\n        go.countDown();\n        Set&lt;String&gt; ids = new HashSet&lt;&gt;();\n        for (Future&lt;String&gt; f : sent) ids.add(f.get(10, TimeUnit.SECONDS));\n        pool.shutdown();\n        System.out.println(&quot;50 threads, one key: distinct payments=&quot; + ids.size()\n            + &quot;, requests that reached the acquirer=&quot; + solo.calls()\n            + &quot;, state=&quot; + busy.byKey(&quot;ord-RACE&quot;).state());\n        if (ids.size() != 1 || solo.calls() != 1) throw new AssertionError(&quot;the customer was charged more than once&quot;);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n// Reference code for every follow-up on page 05. Each block is one twist, and each is small on purpose:\n// a twist that needs a big block means the derivation on page 02 went wrong.\n\n// ---- ext: 3-D Secure -- a pause in the middle of the life, and the resume that ends it\n/** A challenge the shopper must pass before the gateway will even try the acquirer. A URL and a one-time code. */\nrecord StepUpChallenge(String challengeId, String idemKey, String redirectUrl, String expectedOtp, long expiresMs) { }\n\n/**\n * &quot;Cards over five thousand need an OTP.&quot; The whole change is a pause between the request and the authorize call,\n * so it sits in front of the gateway and nothing inside PaymentService moves.\n *\n * Inside the state machine the honest version is one more constant, PENDING_AUTH, with CREATED -&gt; PENDING_AUTH -&gt;\n * AUTHORIZED | FAILED in the transition table -- two rows, and pay() returns before the acquirer is called. Here\n * the challenge lives beside the gateway so the enum on page 03 stays exactly as it is drawn.\n */\nclass StepUpDesk {\n    private final PaymentService gateway; private final long thresholdPaise; private final Clock clock;\n    private final Map&lt;String, StepUpChallenge&gt; open = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicLong nextId = new AtomicLong(1);\n\n    StepUpDesk(PaymentService gateway, long thresholdPaise, Clock clock) {\n        this.gateway = gateway; this.thresholdPaise = thresholdPaise; this.clock = clock;\n    }\n    /**\n     * Small card payments and every UPI payment go straight through. A big card payment comes back as a challenge\n     * instead of a payment: nothing has been claimed, nothing has been charged, and the idempotency key is still free.\n     */\n    Object pay(String idemKey, String merchantId, long paise, Currency currency, PaymentMethod method) {\n        if (method.type() != PaymentMethodType.CARD || paise &lt;= thresholdPaise)\n            return gateway.pay(idemKey, merchantId, paise, currency, method);\n        StepUpChallenge c = new StepUpChallenge(&quot;chal_&quot; + nextId.getAndIncrement(), idemKey,\n                &quot;https://3ds.example/&quot; + idemKey, &quot;123456&quot;, clock.nowMs() + 300_000);\n        open.put(c.challengeId(), c);\n        return c;\n    }\n    /**\n     * The shopper typed the code. A wrong or expired code refuses and leaves the key free to try again; a right one\n     * enters the ordinary flow, which is why the whole of pay() -- idempotency, routing, the claim -- is unchanged.\n     */\n    Payment resume(String challengeId, String otp, String merchantId, long paise, Currency currency, PaymentMethod method) {\n        StepUpChallenge c = open.get(challengeId);\n        if (c == null) throw new PaymentRejected(&quot;no such challenge: &quot; + challengeId);\n        if (clock.nowMs() &gt; c.expiresMs()) { open.remove(challengeId); throw new PaymentRejected(&quot;the OTP page expired&quot;); }\n        if (!c.expectedOtp().equals(otp)) throw new PaymentRejected(&quot;wrong OTP&quot;);\n        open.remove(challengeId);\n        return gateway.pay(c.idemKey(), merchantId, paise, currency, method);\n    }\n    /** How many shoppers are mid-OTP right now. A real one would expire these on a timer. */\n    int openChallenges() { return open.size(); }\n}\n\n// ---- ext: partial capture -- ship half the order today, the rest on Friday\n/**\n * &quot;Capture four hundred of the thousand you authorized.&quot; It is the mirror of the refund pair that is already in\n * Main: a reserved counter and a settled counter, moved under the same lock, with the acquirer call between them.\n *\n * In Payment that is two more long fields, captureReserved and captureSettled, plus a PARTIALLY_CAPTURED self-loop\n * in the transition table; refunds then check against captureSettled instead of the full amount. This desk keeps\n * that book beside the payment so Main stays as page 03 draws it, and it enforces the same two rules: the captures\n * never add up past what was authorized, and nothing is written until the acquirer says yes.\n */\nclass PartialCaptureDesk {\n    private final Map&lt;String, long[]&gt; captured = new ConcurrentHashMap&lt;&gt;();   // paymentId -&gt; { settled paise }\n    private final PaymentProcessor acquirer;\n    PartialCaptureDesk(PaymentProcessor acquirer) { this.acquirer = acquirer; }\n\n    /** Capture part of an authorization. Returns the paise actually captured, or zero if it was refused. */\n    synchronized long capture(Payment p, long paise) {\n        long already = captured.computeIfAbsent(p.id(), k -&gt; new long[1])[0];\n        if (paise &lt;= 0 || already + paise &gt; p.paise()) return 0;              // the check and the write are one step\n        ProcessorResult r = acquirer.capture(p.id() + &quot;:cap&quot; + already, p.acquirerRef(), paise);\n        if (r.outcome() != Outcome.CAPTURED) return 0;                        // refused: the book is untouched\n        captured.get(p.id())[0] = already + paise;\n        return paise;\n    }\n    /** How much of this authorization has actually moved. */\n    long capturedOf(String paymentId) { return captured.getOrDefault(paymentId, new long[1])[0]; }\n}\n\n// ---- ext: least-cost routing -- &quot;stop routing by relationship, always take the cheapest healthy acquirer&quot;\n/**\n * A new routing rule is a new class and one line in configure(). Nothing in PaymentService is opened: it asks the\n * policy for a list and tries them in order, and it has never known why the order is what it is.\n */\nclass LeastCostRouting implements RoutingPolicy {\n    public List&lt;PaymentProcessor&gt; route(PaymentMethodType type, Currency currency, long paise, List&lt;PaymentProcessor&gt; all) {\n        List&lt;PaymentProcessor&gt; able = new ArrayList&lt;&gt;();\n        for (PaymentProcessor p : all) if (p.supports(type, currency)) able.add(p);\n        able.sort(Comparator.comparingLong(PaymentProcessor::feeBps));        // cheapest first, the rest as failover\n        return able;\n    }\n}\n\n// ---- ext: the card-testing rule -- one class that is both a rule and a listener\n/**\n * &quot;Card testing hit us over the weekend: block a token after three declines in a minute.&quot; It looks like it touches\n * the risk check, the failure path and the wiring. It touches none of them. The risk chain already asks every rule\n * the same question and the listener bus already announces every failure, so the new rule is one class that\n * implements both interfaces and one line that registers it twice.\n */\nclass CardTestingRule implements RiskRule, PaymentListener {\n    private final PaymentService gateway; private final int maxDeclines; private final long windowMs;\n    private final Map&lt;String, Deque&lt;Long&gt;&gt; declines = new ConcurrentHashMap&lt;&gt;();\n\n    CardTestingRule(PaymentService gateway, int maxDeclines, long windowMs) {\n        this.gateway = gateway; this.maxDeclines = maxDeclines; this.windowMs = windowMs;\n    }\n    /** The rule half: count this token&#x27;s recent declines and refuse if there are too many. Reads only. */\n    public void check(String merchantId, long paise, PaymentMethod method, long nowMs) {\n        Deque&lt;Long&gt; recent = declines.get(method.token());\n        if (recent == null) return;\n        synchronized (recent) {\n            while (!recent.isEmpty() &amp;&amp; nowMs - recent.peekFirst() &gt; windowMs) recent.pollFirst();\n            if (recent.size() &gt;= maxDeclines)\n                throw new PaymentRejected(&quot;card testing: &quot; + recent.size() + &quot; declines in &quot; + (windowMs / 1000) + &quot;s&quot;);\n        }\n    }\n    /**\n     * The listener half: a payment an ACQUIRER declined adds a timestamp to that token&#x27;s window. A payment this\n     * rule itself refused has no acquirer on it, which is how the rule avoids counting its own refusals.\n     */\n    public void onEvent(PaymentEvent e) {\n        if (e.state() != PaymentState.FAILED || e.acquirer().isEmpty()) return;\n        String token = gateway.payment(e.paymentId()).method().token();\n        Deque&lt;Long&gt; recent = declines.computeIfAbsent(token, k -&gt; new ArrayDeque&lt;&gt;());\n        synchronized (recent) { recent.addLast(e.atMs()); }\n    }\n    /** How many declines this token has inside the window right now. For a fraud screen. */\n    int declinesFor(String token) {\n        Deque&lt;Long&gt; recent = declines.get(token);\n        return recent == null ? 0 : recent.size();\n    }\n}\n\n// ---- ext: tokenisation -- the card number never enters the gateway at all\n/**\n * PCI scope, in one class. The vault is the only thing that has ever seen a card number; it hands back a token and\n * a display string, and everything downstream -- Payment, the audit log, the merchant webhook, the database --\n * holds only those. Nothing in Main needs a redaction rule because nothing in Main ever had the number.\n */\nclass CardVault {\n    private final Map&lt;String, String&gt; pans = new ConcurrentHashMap&lt;&gt;();       // token -&gt; PAN, inside the vault only\n    private final AtomicLong nextId = new AtomicLong(1);\n\n    /** Swap a card number for a token. The only method in the system that takes a PAN as an argument. */\n    PaymentMethod tokenise(String pan) {\n        if (pan == null || pan.length() &lt; 12) throw new IllegalArgumentException(&quot;not a card number&quot;);\n        String token = &quot;tok_&quot; + nextId.getAndIncrement();\n        pans.put(token, pan);\n        return new PaymentMethod(PaymentMethodType.CARD, token, &quot;**** &quot; + pan.substring(pan.length() - 4));\n    }\n    /** Only the acquirer adapter, inside the vault&#x27;s blast radius, ever asks for this. */\n    String panFor(String token) { return pans.get(token); }\n}\n\n// ---- ext: chargebacks -- the issuer takes the money back forty days later\n/** One dispute: the issuer pulled this much back, on this day, for this reason. Linked to a payment, never inside it. */\nrecord Chargeback(String id, String paymentId, long paise, String reasonCode, long atMs) { }\n\n/**\n * A chargeback is not a refund: the money is already gone when we hear about it, so there is nothing to call the\n * acquirer about. It is a fact to record and subtract from what the merchant is owed. The payment&#x27;s own state is\n * untouched, which is why the ledger and the settlement job read this book as well as the payments.\n */\nclass ChargebackDesk {\n    private final PaymentService gateway;\n    private final Map&lt;String, List&lt;Chargeback&gt;&gt; byMerchant = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Chargeback&gt; byPayment = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicLong nextId = new AtomicLong(1);\n    ChargebackDesk(PaymentService gateway) { this.gateway = gateway; }\n\n    /** Record a dispute. Refuses a second one on the same payment: an issuer pulls the money back once. */\n    Chargeback raise(String paymentId, long paise, String reasonCode, long atMs) {\n        Payment p = gateway.payment(paymentId);\n        if (paise &gt; p.capturedPaise() - p.refundedPaise())\n            throw new PaymentRejected(&quot;a chargeback cannot exceed what is still held: &quot;\n                + Money.fmt(p.capturedPaise() - p.refundedPaise()));\n        Chargeback c = new Chargeback(&quot;cb_&quot; + nextId.getAndIncrement(), paymentId, paise, reasonCode, atMs);\n        if (byPayment.putIfAbsent(paymentId, c) != null) throw new PaymentRejected(paymentId + &quot; is already disputed&quot;);\n        byMerchant.computeIfAbsent(p.merchantId(), k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(c);\n        return c;\n    }\n    /** What this merchant has lost to disputes. Subtracted from the payout. */\n    long disputedPaise(String merchantId) {\n        long total = 0;\n        for (Chargeback c : byMerchant.getOrDefault(merchantId, List.of())) total += c.paise();\n        return total;\n    }\n}\n\n// ---- ext: settlement -- what actually leaves our bank account for the merchant at the end of the day\n/** One day&#x27;s payout: what was captured, less refunds, less our fees, less disputes. The number the merchant sees. */\nrecord Payout(String merchantId, long grossPaise, long refundedPaise, long feePaise, long disputedPaise, long netPaise) { }\n\n/**\n * The end-of-day sweep. It reads the merchant&#x27;s own payment list off the index, so a merchant with a thousand\n * payments costs a thousand reads and a merchant with none costs nothing: it never scans the whole gateway.\n */\nclass SettlementJob {\n    private final PaymentService gateway; private final ChargebackDesk disputes;\n    SettlementJob(PaymentService gateway, ChargebackDesk disputes) { this.gateway = gateway; this.disputes = disputes; }\n\n    /** Build today&#x27;s payout for one merchant. */\n    Payout payoutFor(String merchantId) {\n        long gross = 0, refunded = 0, fee = 0;\n        for (Payment p : gateway.paymentsOf(merchantId)) {\n            if (p.capturedPaise() == 0) continue;                            // authorized but never captured\n            gross += p.capturedPaise(); refunded += p.refundedPaise(); fee += p.feePaise();\n        }\n        long disputed = disputes.disputedPaise(merchantId);\n        return new Payout(merchantId, gross, refunded, fee, disputed, gross - refunded - fee - disputed);\n    }\n}\n\n// ---- ext: the double-entry ledger -- another listener, and the gateway does not change\n/** One immutable line of the books: money in or out of one account, as part of one payment. */\nrecord LedgerLine(String paymentId, String account, long signedPaise, String memo) { }\n\n/**\n * Every movement written twice, so the books always add up to zero. It is a listener, which is the whole point:\n * accounting arrived after the design and cost one class and one addListener call. It is fed events, not payments,\n * so it cannot change a payment even by accident.\n *\n * An event carries running totals, not the movement -- capturedPaise and refundedPaise are &quot;how much in all so far&quot;.\n * So the ledger posts the DIFFERENCE between the total in the event and the total already on the books. That one\n * decision buys three things at once: a replayed event posts a difference of zero, an event that arrives out of\n * order carries an older and therefore smaller total and posts nothing, and a third partial refund posts only its\n * own hundred rupees instead of the running total all over again.\n */\nclass DoubleEntryLedger implements PaymentListener {\n    private final List&lt;LedgerLine&gt; lines = new CopyOnWriteArrayList&lt;&gt;();\n    private final Map&lt;String, long[]&gt; posted = new ConcurrentHashMap&lt;&gt;();    // paymentId -&gt; {captured, refunded} on the books\n\n    public void onEvent(PaymentEvent e) {\n        long[] onBooks = posted.computeIfAbsent(e.paymentId(), k -&gt; new long[2]);\n        synchronized (onBooks) {                                             // two events for one payment, one at a time\n            long captured = e.capturedPaise() - onBooks[0];\n            if (captured &gt; 0) {\n                lines.add(new LedgerLine(e.paymentId(), &quot;acquirer_receivable&quot;, captured, &quot;capture&quot;));\n                lines.add(new LedgerLine(e.paymentId(), &quot;merchant_payable&quot;, -captured, &quot;capture&quot;));\n                onBooks[0] = e.capturedPaise();\n            }\n            long refunded = e.refundedPaise() - onBooks[1];\n            if (refunded &gt; 0) {\n                lines.add(new LedgerLine(e.paymentId(), &quot;merchant_payable&quot;, refunded, &quot;refund&quot;));\n                lines.add(new LedgerLine(e.paymentId(), &quot;acquirer_receivable&quot;, -refunded, &quot;refund&quot;));\n                onBooks[1] = e.refundedPaise();\n            }\n        }\n    }\n    /** The books must always sum to zero. If they do not, a posting was written one-sided. */\n    long imbalance() {\n        long sum = 0;\n        for (LedgerLine l : lines) sum += l.signedPaise();\n        return sum;\n    }\n    /** Every line, oldest first. */\n    List&lt;LedgerLine&gt; lines() { return List.copyOf(lines); }\n}\n\n// ---- ext: persistence -- the claim becomes a conditional UPDATE, and the webhook becomes an outbox row\n/**\n * What a database gives us for free. Each method is the row-level version of something the in-memory gateway does\n * with a map or a lock, which is the point: the design does not change shape when it grows a database.\n */\ninterface PaymentRepository {\n    /** INSERT ... ON CONFLICT (idempotency_key) DO NOTHING. False means somebody else owns this key. */\n    boolean insertIfAbsent(String idemKey, String paymentId, long paise);\n    /** UPDATE payments SET state = ? WHERE id = ? AND state = ?. The database&#x27;s own compare-and-set. */\n    boolean claim(String paymentId, PaymentState from, PaymentState to);\n    /** UPDATE payments SET state = ? WHERE id = ? AND rank_reached &lt; ?. Rank in the WHERE clause, not in the code. */\n    boolean settle(String paymentId, PaymentState outcome, int rank);\n    /** What the row says now. */\n    PaymentState stateOf(String paymentId);\n}\n\n/** An in-memory stand-in that obeys exactly the contract above, so the shape can be demonstrated without a server. */\nclass InMemoryPaymentRepository implements PaymentRepository {\n    private record Row(String paymentId, long paise, PaymentState state, int rank) { }\n    private final Map&lt;String, Row&gt; rows = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, String&gt; keys = new ConcurrentHashMap&lt;&gt;();      // the unique index on idempotency_key\n\n    public synchronized boolean insertIfAbsent(String idemKey, String paymentId, long paise) {\n        if (keys.putIfAbsent(idemKey, paymentId) != null) return false;\n        rows.put(paymentId, new Row(paymentId, paise, PaymentState.CREATED, 0));\n        return true;\n    }\n    public synchronized boolean claim(String paymentId, PaymentState from, PaymentState to) {\n        Row r = rows.get(paymentId);\n        if (r == null || r.state() != from) return false;                    // the WHERE clause did not match: 0 rows\n        rows.put(paymentId, new Row(paymentId, r.paise(), to, r.rank()));\n        return true;\n    }\n    public synchronized boolean settle(String paymentId, PaymentState outcome, int rank) {\n        Row r = rows.get(paymentId);\n        if (r == null || rank &lt;= r.rank() || !r.state().canGoTo(outcome)) return false;\n        rows.put(paymentId, new Row(paymentId, r.paise(), outcome, rank));\n        return true;\n    }\n    public PaymentState stateOf(String paymentId) {\n        Row r = rows.get(paymentId);\n        return r == null ? null : r.state();\n    }\n}\n\n/**\n * The merchant webhook, once there are two servers. Writing the outbox row in the same transaction as the payment\n * is what makes delivery exactly-as-often-as-the-payment-happened: no payment without a row, no row without a\n * payment. A worker drains it, and because the row carries the payment id and state, a double delivery is the same\n * at-least-once problem the merchant already handles.\n */\nclass Outbox {\n    private final Deque&lt;PaymentEvent&gt; pending = new ConcurrentLinkedDeque&lt;&gt;();\n    private final AtomicInteger delivered = new AtomicInteger();\n\n    /** Written inside the payment&#x27;s transaction, so it cannot be lost and cannot exist on its own. */\n    void enqueue(PaymentEvent e) { pending.addLast(e); }\n    /** The worker: take rows and post them, leaving the ones that fail for the next run. */\n    int drain(WebhookEndpoint endpoint, String url, int max) {\n        int sent = 0;\n        for (int i = 0; i &lt; max; i++) {\n            PaymentEvent e = pending.pollFirst();\n            if (e == null) break;\n            if (endpoint.post(url, e)) { delivered.incrementAndGet(); sent++; }\n            else { pending.addFirst(e); break; }                              // still down: stop, keep the order\n        }\n        return sent;\n    }\n    /** How many rows are still waiting. */\n    int depth() { return pending.size(); }\n    /** How many have gone out. */\n    int delivered() { return delivered.get(); }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) {\n        long[] now = { 1_700_000_000_000L };\n        Clock clock = () -&gt; now[0];\n        CardAcquirer hdfc = new CardAcquirer(&quot;HDFC&quot;, 180, Currency.INR);\n        CardAcquirer axis = new CardAcquirer(&quot;AXIS&quot;, 120, Currency.INR);\n        PaymentService gw = new PaymentService();\n        gw.setClock(clock);\n        gw.addProcessor(hdfc); gw.addProcessor(axis);\n        gw.register(new Merchant(&quot;m_shop&quot;, &quot;Shop&quot;, &quot;https://shop.example/hooks&quot;));\n\n        // least-cost routing: AXIS is cheaper, so it goes first -- one new class, one line in configure()\n        gw.configure(new LeastCostRouting(), new BpsFee(0), new RetrySafeFailuresOnly(2), List.of());\n        CardVault vault = new CardVault();\n        PaymentMethod card = vault.tokenise(&quot;4111111111111111&quot;);\n        System.out.println(&quot;tokenised: &quot; + card + &quot;  (the gateway never sees the number)&quot;);\n        Payment cheap = gw.pay(&quot;k-1&quot;, &quot;m_shop&quot;, Money.rupees(&quot;1000.00&quot;), Currency.INR, card);\n        System.out.println(&quot;least cost picked: &quot; + cheap.acquirer() + &quot; at &quot; + axis.feeBps() + &quot; bp&quot;);\n\n        // 3-D Secure: a big card payment comes back as a challenge, and the OTP resumes the ordinary flow\n        StepUpDesk step = new StepUpDesk(gw, Money.rupees(&quot;5000.00&quot;), clock);\n        Object small = step.pay(&quot;k-2&quot;, &quot;m_shop&quot;, Money.rupees(&quot;400.00&quot;), Currency.INR, card);\n        System.out.println(&quot;small payment went straight through: &quot; + (small instanceof Payment));\n        Object big = step.pay(&quot;k-3&quot;, &quot;m_shop&quot;, Money.rupees(&quot;9000.00&quot;), Currency.INR, card);\n        StepUpChallenge chal = (StepUpChallenge) big;\n        System.out.println(&quot;big payment paused at: &quot; + chal.redirectUrl());\n        try { step.resume(chal.challengeId(), &quot;000000&quot;, &quot;m_shop&quot;, Money.rupees(&quot;9000.00&quot;), Currency.INR, card); }\n        catch (PaymentRejected e) { System.out.println(&quot;wrong OTP: &quot; + e.getMessage()); }\n        Object big2 = step.pay(&quot;k-3&quot;, &quot;m_shop&quot;, Money.rupees(&quot;9000.00&quot;), Currency.INR, card);\n        Payment stepped = step.resume(((StepUpChallenge) big2).challengeId(), &quot;123456&quot;, &quot;m_shop&quot;,\n                                      Money.rupees(&quot;9000.00&quot;), Currency.INR, card);\n        System.out.println(&quot;after the OTP: &quot; + stepped.state() + &quot; &quot; + Money.fmt(stepped.paise()));\n\n        // partial capture: four hundred today, the rest never; the captures can never add up past the authorization\n        PartialCaptureDesk partial = new PartialCaptureDesk(axis);\n        System.out.println(&quot;captured 400 of 1000: &quot; + Money.fmt(partial.capture(cheap, Money.rupees(&quot;400.00&quot;))));\n        System.out.println(&quot;then tried 700 more: &quot; + Money.fmt(partial.capture(cheap, Money.rupees(&quot;700.00&quot;)))\n            + &quot; (refused; still &quot; + Money.fmt(partial.capturedOf(cheap.id())) + &quot; captured)&quot;);\n\n        // the card-testing rule: one class, registered as a rule and as a listener, nothing else edited\n        PaymentService guarded = new PaymentService();\n        CardTestingRule testing = new CardTestingRule(guarded, 3, 60_000);\n        guarded.setClock(clock);\n        guarded.addProcessor(hdfc);\n        guarded.configure(new LeastCostRouting(), new BpsFee(0), new RetrySafeFailuresOnly(1), List.of(testing));\n        guarded.addListener(testing);\n        guarded.register(new Merchant(&quot;m_t&quot;, &quot;T&quot;, &quot;https://t.example/hooks&quot;));\n        hdfc.mode(VendorMode.DECLINE);\n        for (int i = 1; i &lt;= 4; i++) {\n            Payment p = guarded.pay(&quot;t-&quot; + i, &quot;m_t&quot;, Money.rupees(&quot;10.00&quot;), Currency.INR, card);\n            System.out.println(&quot;  attempt &quot; + i + &quot;: &quot; + p.state() + &quot; (&quot; + p.reason() + &quot;)&quot;);\n        }\n        hdfc.mode(VendorMode.HEALTHY);\n        System.out.println(&quot;declines counted for the token: &quot; + testing.declinesFor(card.token())\n            + &quot; (the fourth attempt never reached an acquirer)&quot;);\n\n        // the double-entry ledger and the settlement job, both bolted on afterwards\n        DoubleEntryLedger books = new DoubleEntryLedger();\n        PaymentService counted = new PaymentService();\n        counted.setClock(clock);\n        counted.addProcessor(new UpiSwitch(&quot;NPCI&quot;, 0));\n        counted.configure(new LeastCostRouting(), new BpsFee(Money.rupees(&quot;2.00&quot;)), new RetrySafeFailuresOnly(1), List.of());\n        counted.addListener(books);\n        counted.register(new Merchant(&quot;m_u&quot;, &quot;U&quot;, &quot;https://u.example/hooks&quot;));\n        PaymentMethod upi = new PaymentMethod(PaymentMethodType.UPI, &quot;a@okaxis&quot;, &quot;a@okaxis&quot;);\n        Payment u1 = counted.pay(&quot;u-1&quot;, &quot;m_u&quot;, Money.rupees(&quot;1000.00&quot;), Currency.INR, upi);\n        counted.refund(&quot;ur-1&quot;, u1.id(), Money.rupees(&quot;250.00&quot;));\n        counted.refund(&quot;ur-2&quot;, u1.id(), Money.rupees(&quot;250.00&quot;));            // a SECOND partial: its own two lines\n        books.onEvent(new PaymentEvent(u1.id(), &quot;m_u&quot;, PaymentState.PARTIALLY_REFUNDED,\n                                       u1.paise(), u1.capturedPaise(), u1.refundedPaise(), &quot;NPCI&quot;, &quot;&quot;, now[0]));\n        ChargebackDesk disputes = new ChargebackDesk(counted);\n        disputes.raise(u1.id(), Money.rupees(&quot;100.00&quot;), &quot;10.4 fraud&quot;, now[0] + 40L * 86_400_000L);\n        Payout payout = new SettlementJob(counted, disputes).payoutFor(&quot;m_u&quot;);\n        System.out.println(&quot;payout: gross &quot; + Money.fmt(payout.grossPaise()) + &quot; refunds &quot; + Money.fmt(payout.refundedPaise())\n            + &quot; fees &quot; + Money.fmt(payout.feePaise()) + &quot; disputes &quot; + Money.fmt(payout.disputedPaise())\n            + &quot; net &quot; + Money.fmt(payout.netPaise()));\n        long booked = 0;\n        for (LedgerLine l : books.lines()) if (l.account().equals(&quot;merchant_payable&quot;) &amp;&amp; l.signedPaise() &gt; 0) booked += l.signedPaise();\n        System.out.println(&quot;ledger lines: &quot; + books.lines().size() + &quot; (2 for the capture, 2 for each partial refund,&quot;\n            + &quot; 0 for the replayed event), refunds on the books: &quot; + Money.fmt(booked)\n            + &quot;, imbalance: &quot; + books.imbalance() + &quot; (must be 0)&quot;);\n        if (books.imbalance() != 0 || booked != u1.refundedPaise() || books.lines().size() != 6)\n            throw new AssertionError(&quot;the books do not agree with the payments&quot;);\n\n        // persistence: the same claim, as a conditional UPDATE, and the outbox that replaces the in-line webhook\n        PaymentRepository repo = new InMemoryPaymentRepository();\n        System.out.println(&quot;insert with a fresh key: &quot; + repo.insertIfAbsent(&quot;ord-77&quot;, &quot;pay_77&quot;, Money.rupees(&quot;500.00&quot;)));\n        System.out.println(&quot;insert with the same key: &quot; + repo.insertIfAbsent(&quot;ord-77&quot;, &quot;pay_78&quot;, Money.rupees(&quot;500.00&quot;)));\n        System.out.println(&quot;first claim wins:  &quot; + repo.claim(&quot;pay_77&quot;, PaymentState.CREATED, PaymentState.PENDING));\n        System.out.println(&quot;second claim loses: &quot; + repo.claim(&quot;pay_77&quot;, PaymentState.CREATED, PaymentState.PENDING));\n        System.out.println(&quot;settle CAPTURED: &quot; + repo.settle(&quot;pay_77&quot;, PaymentState.CAPTURED, 2)\n            + &quot;, a replayed AUTHORIZED after it: &quot; + repo.settle(&quot;pay_77&quot;, PaymentState.AUTHORIZED, 1)\n            + &quot;, row is &quot; + repo.stateOf(&quot;pay_77&quot;));\n\n        Outbox outbox = new Outbox();\n        boolean[] merchantUp = { false };\n        WebhookEndpoint endpoint = (url, e) -&gt; merchantUp[0];\n        outbox.enqueue(new PaymentEvent(&quot;pay_77&quot;, &quot;m_shop&quot;, PaymentState.CAPTURED, 50000, 50000, 0, &quot;AXIS&quot;, &quot;&quot;, now[0]));\n        outbox.enqueue(new PaymentEvent(&quot;pay_77&quot;, &quot;m_shop&quot;, PaymentState.REFUNDED, 50000, 50000, 50000, &quot;AXIS&quot;, &quot;&quot;, now[0]));\n        System.out.println(&quot;merchant down, drained &quot; + outbox.drain(endpoint, &quot;u&quot;, 10) + &quot;, depth &quot; + outbox.depth());\n        merchantUp[0] = true;\n        System.out.println(&quot;merchant back, drained &quot; + outbox.drain(endpoint, &quot;u&quot;, 10) + &quot;, depth &quot; + outbox.depth());\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// targeted failure tests: each one proves a claim the design makes on page 02, move 9.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n\n    static final long[] NOW = { 1_700_000_000_000L };\n    static final PaymentMethod CARD = new PaymentMethod(PaymentMethodType.CARD, &quot;tok_visa_1&quot;, &quot;**** 1111&quot;);\n    static final PaymentMethod UPI  = new PaymentMethod(PaymentMethodType.UPI, &quot;a@okhdfc&quot;, &quot;a@okhdfc&quot;);\n\n    /** A gateway wired to the acquirers it is given, with no risk rules and a fee of zero. */\n    static PaymentService gatewayOver(PaymentProcessor... acquirers) {\n        PaymentService gw = new PaymentService();\n        gw.setClock(() -&gt; NOW[0]);\n        List&lt;String&gt; order = new ArrayList&lt;&gt;();\n        for (PaymentProcessor p : acquirers) { gw.addProcessor(p); order.add(p.name()); }\n        gw.configure(new PreferredRouting(Map.of(PaymentMethodType.CARD, order, PaymentMethodType.UPI, order)),\n                     new BpsFee(0), new RetrySafeFailuresOnly(3), List.of());\n        gw.register(new Merchant(&quot;m1&quot;, &quot;Shop&quot;, &quot;https://shop.example/hooks&quot;));\n        return gw;\n    }\n\n    public static void main(String[] args) throws Exception {\n        // 1. fifty threads send the SAME idempotency key at the same instant -- the retry storm that makes every\n        //    payments post-mortem. Exactly one request may reach the acquirer, and all fifty callers must get back\n        //    the very same payment. The putIfAbsent on the key is the whole of it.\n        CardAcquirer solo = new CardAcquirer(&quot;SOLO&quot;, 200, Currency.INR);\n        PaymentService busy = gatewayOver(solo);\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;String&gt;&gt; sent = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            sent.add(pool.submit(() -&gt; {\n                go.await();\n                return busy.pay(&quot;ord-RACE&quot;, &quot;m1&quot;, Money.rupees(&quot;1000.00&quot;), Currency.INR, CARD).id();\n            }));\n        }\n        go.countDown();\n        Set&lt;String&gt; ids = new HashSet&lt;&gt;();\n        for (Future&lt;String&gt; f : sent) ids.add(f.get(10, TimeUnit.SECONDS));\n        check(ids.size() == 1, &quot;fifty retries of one key produced one payment (&quot; + ids.size() + &quot;)&quot;);\n        check(solo.calls() == 1, &quot;exactly one request reached the acquirer (&quot; + solo.calls() + &quot;)&quot;);\n        check(busy.byKey(&quot;ord-RACE&quot;).state() == PaymentState.AUTHORIZED, &quot;and that one payment is AUTHORIZED&quot;);\n\n        // 2. the acquirer takes the money and then the socket dies. The payment must NOT be recorded as a success,\n        //    must NOT be retried and must NOT be failed over -- the only honest state is &quot;I do not know&quot;.\n        CardAcquirer flaky = new CardAcquirer(&quot;FLAKY&quot;, 200, Currency.INR);\n        CardAcquirer spare = new CardAcquirer(&quot;SPARE&quot;, 200, Currency.INR);\n        PaymentService t2 = gatewayOver(flaky, spare);\n        flaky.mode(VendorMode.TIMEOUT_CHARGED);\n        Payment lost = t2.pay(&quot;ord-2&quot;, &quot;m1&quot;, Money.rupees(&quot;700.00&quot;), Currency.INR, CARD);\n        check(lost.state() == PaymentState.UNKNOWN, &quot;a timeout leaves the payment UNKNOWN, not FAILED and not captured&quot;);\n        check(lost.capturedPaise() == 0, &quot;nothing is recorded as captured while the outcome is unknown&quot;);\n        check(flaky.calls() == 1 &amp;&amp; spare.calls() == 0, &quot;one call was made, and a timeout never fails over to the next acquirer&quot;);\n        t2.pay(&quot;ord-2&quot;, &quot;m1&quot;, Money.rupees(&quot;700.00&quot;), Currency.INR, CARD);         // the client retries the HTTP call\n        check(flaky.calls() == 1, &quot;a client retry of an unknown payment makes no second call (&quot; + flaky.calls() + &quot;)&quot;);\n        check(t2.unresolved().contains(lost.id()), &quot;the payment is on the reconciliation job&#x27;s list&quot;);\n\n        // 3. the only honest way out of an UNKNOWN: ask the acquirer about the exact key we sent. It answers in\n        //    both directions -- it took the money, or it never saw the request -- and the payment lands accordingly.\n        flaky.mode(VendorMode.HEALTHY);                                            // the status API is up again\n        NOW[0] += 60_000;\n        int settled = t2.reconcile(30_000);\n        check(settled == 1 &amp;&amp; lost.state() == PaymentState.AUTHORIZED,\n              &quot;the status query resolved the unknown payment to &quot; + lost.state());\n        check(flaky.calls() == 1, &quot;asking about a charge is not a second charge (&quot; + flaky.calls() + &quot;)&quot;);\n        check(t2.unresolved().isEmpty(), &quot;and it is off the job&#x27;s list&quot;);\n\n        UpiSwitch gone = new UpiSwitch(&quot;GONE&quot;, 0);\n        PaymentService t3 = gatewayOver(gone);\n        gone.mode(VendorMode.TIMEOUT_LOST);\n        Payment vanished = t3.pay(&quot;ord-3&quot;, &quot;m1&quot;, Money.rupees(&quot;99.00&quot;), Currency.INR, UPI);\n        check(vanished.state() == PaymentState.UNKNOWN, &quot;a request that died on the way out is UNKNOWN too&quot;);\n        gone.mode(VendorMode.HEALTHY);\n        NOW[0] += 60_000;\n        t3.reconcile(30_000);\n        check(vanished.state() == PaymentState.FAILED &amp;&amp; vanished.capturedPaise() == 0,\n              &quot;the acquirer never saw it, so it settles as FAILED with nothing captured&quot;);\n\n        // 4. a refund may never exceed what was actually captured, and a refusal must reserve nothing -- otherwise\n        //    the next honest refund is refused for a reservation that was never released.\n        CardAcquirer ok4 = new CardAcquirer(&quot;OK4&quot;, 200, Currency.INR);\n        PaymentService t4 = gatewayOver(ok4);\n        Payment big = t4.pay(&quot;ord-4&quot;, &quot;m1&quot;, Money.rupees(&quot;1000.00&quot;), Currency.INR, CARD);\n        t4.capture(big.id());\n        Refund tooMuch = t4.refund(&quot;rf-a&quot;, big.id(), Money.rupees(&quot;1200.00&quot;));\n        check(tooMuch.state() == RefundState.FAILED, &quot;a refund over the captured amount is refused: &quot; + tooMuch.failureReason());\n        check(big.refundedPaise() == 0 &amp;&amp; big.refundReservedPaise() == 0, &quot;and it reserved nothing&quot;);\n        Refund good = t4.refund(&quot;rf-b&quot;, big.id(), Money.rupees(&quot;1000.00&quot;));\n        check(good.state() == RefundState.SUCCEEDED &amp;&amp; big.state() == PaymentState.REFUNDED,\n              &quot;the full amount still refunds afterwards&quot;);\n        Refund replay = t4.refund(&quot;rf-b&quot;, big.id(), Money.rupees(&quot;1000.00&quot;));\n        check(replay == good &amp;&amp; big.refundedPaise() == Money.rupees(&quot;1000.00&quot;),\n              &quot;a retried refund key returns the same refund and moves the money once&quot;);\n        Payment authOnly = t4.pay(&quot;ord-4b&quot;, &quot;m1&quot;, Money.rupees(&quot;500.00&quot;), Currency.INR, CARD);\n        check(t4.refund(&quot;rf-c&quot;, authOnly.id(), 100).state() == RefundState.FAILED,\n              &quot;an authorized-but-not-captured payment cannot be refunded&quot;);\n\n        // 5. twenty support agents refund a hundred rupees each, at the same instant, against a thousand-rupee\n        //    capture. Exactly ten may win. A single counter written AFTER the acquirer call would let more through,\n        //    because they would all have been decided from the same read; reserve-then-settle is why they cannot.\n        CardAcquirer ok5 = new CardAcquirer(&quot;OK5&quot;, 200, Currency.INR);\n        PaymentService t5 = gatewayOver(ok5);\n        Payment pot = t5.pay(&quot;ord-5&quot;, &quot;m1&quot;, Money.rupees(&quot;1000.00&quot;), Currency.INR, CARD);\n        t5.capture(pot.id());\n        CountDownLatch go5 = new CountDownLatch(1);\n        List&lt;Future&lt;RefundState&gt;&gt; tries = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 20; i++) {\n            final int n = i;\n            tries.add(pool.submit(() -&gt; {\n                go5.await();\n                return t5.refund(&quot;rf5-&quot; + n, pot.id(), Money.rupees(&quot;100.00&quot;)).state();\n            }));\n        }\n        go5.countDown();\n        int won = 0;\n        for (Future&lt;RefundState&gt; f : tries) if (f.get(10, TimeUnit.SECONDS) == RefundState.SUCCEEDED) won++;\n        check(won == 10, &quot;exactly ten of twenty concurrent refunds succeeded (&quot; + won + &quot;)&quot;);\n        check(pot.refundedPaise() == Money.rupees(&quot;1000.00&quot;), &quot;and they add up to exactly what was captured&quot;);\n        check(pot.refundReservedPaise() == 0, &quot;every losing refund gave its reservation back&quot;);\n        check(pot.state() == PaymentState.REFUNDED, &quot;the payment is REFUNDED, not over-refunded&quot;);\n        pool.shutdown();\n\n        // 6. acquirer callbacks are at-least-once and out of order. A duplicate, and a report of something older\n        //    than what we already know, must both change nothing -- and one that IS news must land.\n        CardAcquirer ok6 = new CardAcquirer(&quot;OK6&quot;, 200, Currency.INR);\n        PaymentService t6 = gatewayOver(ok6);\n        Payment w = t6.pay(&quot;ord-6&quot;, &quot;m1&quot;, Money.rupees(&quot;600.00&quot;), Currency.INR, CARD);\n        t6.capture(w.id());\n        check(!t6.handleWebhook(w.id(), PaymentState.AUTHORIZED, &quot;ref&quot;, NOW[0]),\n              &quot;a late &#x27;authorized&#x27; after a capture is dropped on rank&quot;);\n        check(!t6.handleWebhook(w.id(), PaymentState.CAPTURED, &quot;ref&quot;, NOW[0]), &quot;a duplicate &#x27;captured&#x27; is dropped too&quot;);\n        check(!t6.handleWebhook(w.id(), PaymentState.PENDING, &quot;ref&quot;, NOW[0]), &quot;&#x27;pending&#x27; is not an outcome and is ignored&quot;);\n        t6.refund(&quot;rf6&quot;, w.id(), Money.rupees(&quot;200.00&quot;));\n        check(w.state() == PaymentState.PARTIALLY_REFUNDED &amp;&amp; !t6.handleWebhook(w.id(), PaymentState.CAPTURED, &quot;ref&quot;, NOW[0]),\n              &quot;a &#x27;captured&#x27; arriving after a partial refund is dropped and the state holds&quot;);\n        CardAcquirer ok6b = new CardAcquirer(&quot;OK6B&quot;, 200, Currency.INR);\n        PaymentService t6b = gatewayOver(ok6b);\n        ok6b.mode(VendorMode.TIMEOUT_CHARGED);\n        Payment race = t6b.pay(&quot;ord-6b&quot;, &quot;m1&quot;, Money.rupees(&quot;300.00&quot;), Currency.INR, CARD);\n        check(t6b.handleWebhook(race.id(), PaymentState.AUTHORIZED, &quot;ok6b_ref&quot;, NOW[0]) &amp;&amp; race.state() == PaymentState.AUTHORIZED,\n              &quot;a webhook that beats the status query closes the unknown payment&quot;);\n        check(t6b.unresolved().isEmpty(), &quot;and takes it off the reconciliation list&quot;);\n\n        // 7. the primary acquirer refuses the connection. Nothing was charged, so failing over is safe and must\n        //    happen; the same test proves the opposite case -- a timeout is never failed over.\n        CardAcquirer down = new CardAcquirer(&quot;DOWN&quot;, 180, Currency.INR);\n        CardAcquirer backup = new CardAcquirer(&quot;BACKUP&quot;, 220, Currency.INR);\n        PaymentService t7 = gatewayOver(down, backup);\n        down.mode(VendorMode.DOWN);\n        Payment over = t7.pay(&quot;ord-7&quot;, &quot;m1&quot;, Money.rupees(&quot;800.00&quot;), Currency.INR, CARD);\n        check(over.state() == PaymentState.AUTHORIZED &amp;&amp; over.acquirer().equals(&quot;BACKUP&quot;),\n              &quot;an unreachable acquirer fails over to the next one (&quot; + over.acquirer() + &quot;)&quot;);\n        check(down.calls() == 0 &amp;&amp; backup.calls() == 1, &quot;the dead acquirer was never charged and the backup once&quot;);\n        down.mode(VendorMode.TIMEOUT_CHARGED);\n        Payment noFailover = t7.pay(&quot;ord-7b&quot;, &quot;m1&quot;, Money.rupees(&quot;800.00&quot;), Currency.INR, CARD);\n        check(noFailover.state() == PaymentState.UNKNOWN &amp;&amp; backup.calls() == 1,\n              &quot;a timeout at the primary is NOT failed over: the money may already have moved&quot;);\n        CircuitBreaker breaker = new CircuitBreaker(down, 2, 30_000, () -&gt; NOW[0]);\n        try { breaker.authorize(&quot;x1&quot;, 100, Currency.INR, CARD); } catch (RuntimeException e) { /* first failure */ }\n        try { breaker.authorize(&quot;x2&quot;, 100, Currency.INR, CARD); } catch (RuntimeException e) { /* second: it trips */ }\n        check(breaker.open(), &quot;the circuit breaker wrapped around a failing acquirer is open&quot;);\n\n        // 8. a merchant&#x27;s webhook endpoint is down, or their handler throws. Neither may touch the money.\n        CardAcquirer ok8 = new CardAcquirer(&quot;OK8&quot;, 200, Currency.INR);\n        PaymentService t8 = gatewayOver(ok8);\n        t8.addListener(e -&gt; { throw new RuntimeException(&quot;merchant handler blew up&quot;); });\n        MerchantWebhook hooks = new MerchantWebhook((url, e) -&gt; false, 3);\n        hooks.register(new Merchant(&quot;m1&quot;, &quot;Shop&quot;, &quot;https://shop.example/hooks&quot;));\n        t8.addListener(hooks);\n        Payment safe = t8.pay(&quot;ord-8&quot;, &quot;m1&quot;, Money.rupees(&quot;450.00&quot;), Currency.INR, CARD);\n        t8.capture(safe.id());\n        check(safe.state() == PaymentState.CAPTURED &amp;&amp; safe.capturedPaise() == Money.rupees(&quot;450.00&quot;),\n              &quot;the payment captured although a listener threw and the merchant&#x27;s endpoint was down&quot;);\n        check(hooks.delivered() == 0 &amp;&amp; hooks.dropped() &gt; 0,\n              &quot;the webhook gave up after its retries and counted it (&quot; + hooks.dropped() + &quot; dropped)&quot;);\n        check(t8.reconcile(0) == 0, &quot;the books still balance: nothing captured more than it took, nothing over-refunded&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design a payment gateway. A merchant server sends us an amount, a payment method and an idempotency key; we pick an acquirer, authorize, capture, and later refund. Retries, timeouts and out-of-order callbacks are the normal case, not the edge case. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (the money type and auth-versus-capture first); then type in the order of Main.java: Currency and Money, PaymentMethodType and the PaymentMethod record, PaymentState with its transition table and its ranks, the Clock and the three exceptions (a rule's refusal, and the two an acquirer can throw), ProcessorResult and the PaymentProcessor interface with one acquirer behind it, the four rule interfaces with one implementation each, the listener and its two implementations, Refund, then Payment with its private lock and its claim / settle pair, then PaymentService with the order at pay(), then a main with fifty threads on one idempotency key.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; Cards over five thousand rupees now need 3-D Secure: an OTP page in the middle of the payment.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>This is a new step in a life, which is move 6. The honest version inside the machine is one more constant, PENDING_AUTH, and two rows in the transition table: CREATED goes to PENDING_AUTH, and PENDING_AUTH goes to AUTHORIZED or FAILED; <code>pay()</code> returns before the acquirer is called and a new <code>resume(id, token)</code> re-enters the ordinary flow. The reference code puts the challenge in front of the gateway instead, so the enum on page 03 stays exactly as it is drawn: a big card payment comes back as a challenge rather than a payment, nothing has been claimed, nothing has been charged, and the merchant's idempotency key is still free. A wrong or expired OTP refuses and leaves the key free to try again; a right one calls <code>pay()</code> with that same key, so idempotency, routing and the claim are all untouched.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: 3-D Secure -- a pause in the middle of the life, and the resume that ends it\n/** A challenge the shopper must pass before the gateway will even try the acquirer. A URL and a one-time code. */\nrecord StepUpChallenge(String challengeId, String idemKey, String redirectUrl, String expectedOtp, long expiresMs) { }\n\n/**\n * &quot;Cards over five thousand need an OTP.&quot; The whole change is a pause between the request and the authorize call,\n * so it sits in front of the gateway and nothing inside PaymentService moves.\n *\n * Inside the state machine the honest version is one more constant, PENDING_AUTH, with CREATED -&gt; PENDING_AUTH -&gt;\n * AUTHORIZED | FAILED in the transition table -- two rows, and pay() returns before the acquirer is called. Here\n * the challenge lives beside the gateway so the enum on page 03 stays exactly as it is drawn.\n */\nclass StepUpDesk {\n    private final PaymentService gateway; private final long thresholdPaise; private final Clock clock;\n    private final Map&lt;String, StepUpChallenge&gt; open = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicLong nextId = new AtomicLong(1);\n\n    StepUpDesk(PaymentService gateway, long thresholdPaise, Clock clock) {\n        this.gateway = gateway; this.thresholdPaise = thresholdPaise; this.clock = clock;\n    }\n    /**\n     * Small card payments and every UPI payment go straight through. A big card payment comes back as a challenge\n     * instead of a payment: nothing has been claimed, nothing has been charged, and the idempotency key is still free.\n     */\n    Object pay(String idemKey, String merchantId, long paise, Currency currency, PaymentMethod method) {\n        if (method.type() != PaymentMethodType.CARD || paise &lt;= thresholdPaise)\n            return gateway.pay(idemKey, merchantId, paise, currency, method);\n        StepUpChallenge c = new StepUpChallenge(&quot;chal_&quot; + nextId.getAndIncrement(), idemKey,\n                &quot;https://3ds.example/&quot; + idemKey, &quot;123456&quot;, clock.nowMs() + 300_000);\n        open.put(c.challengeId(), c);\n        return c;\n    }\n    /**\n     * The shopper typed the code. A wrong or expired code refuses and leaves the key free to try again; a right one\n     * enters the ordinary flow, which is why the whole of pay() -- idempotency, routing, the claim -- is unchanged.\n     */\n    Payment resume(String challengeId, String otp, String merchantId, long paise, Currency currency, PaymentMethod method) {\n        StepUpChallenge c = open.get(challengeId);\n        if (c == null) throw new PaymentRejected(&quot;no such challenge: &quot; + challengeId);\n        if (clock.nowMs() &gt; c.expiresMs()) { open.remove(challengeId); throw new PaymentRejected(&quot;the OTP page expired&quot;); }\n        if (!c.expectedOtp().equals(otp)) throw new PaymentRejected(&quot;wrong OTP&quot;);\n        open.remove(challengeId);\n        return gateway.pay(c.idemKey(), merchantId, paise, currency, method);\n    }\n    /** How many shoppers are mid-OTP right now. A real one would expire these on a timer. */\n    int openChallenges() { return open.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Fifty retries of the same request hit us at the same instant. Prove the customer is charged once, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>There are two races, and the test kills both. The first is which request is the request at all: the merchant's idempotency key goes into the map with one <code>putIfAbsent</code>, so exactly one thread creates the payment and the other forty-nine get that same object back. Under a true simultaneous storm the losers do build an object and take an id number first &mdash; ids are cheap and are never shown to the merchant &mdash; but only one of those objects is ever in the map, and only that one thread goes on. The second race is which thread may open a socket: <code>claim(CREATED, PENDING)</code> is a compare-and-set under the payment's own lock, so even if two threads somehow reached it only one proceeds. The proof is not a count of successes but a count at the vendor: the fake acquirer counts every request that reaches it, fifty threads wait on one latch, and afterwards the test asserts one distinct payment id and exactly one call.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Take a payment. Idempotent by key: the same key always yields the very same Payment object, whatever happened\n     * to it, so a retried HTTP request cannot charge twice. Never throws for a business outcome -- a decline, a\n     * risk refusal and a missing route all come back as a Payment you can read the state of.\n     */\n    Payment pay(String idemKey, String merchantId, long paise, Currency currency, PaymentMethod method) {\n        if (paise &lt;= 0) throw new IllegalArgumentException(&quot;amount must be positive: &quot; + paise);\n        merchant(merchantId);                                            // unknown merchant is a caller error\n        Payment seen = byKey.get(idemKey);\n        if (seen != null) return seen;                                   // fast path: an obvious retry, no id burned\n        long now = clock.nowMs();\n\n        Payment fresh = new Payment(&quot;pay_&quot; + nextId.getAndIncrement(), idemKey, merchantId, paise, currency, method, now);\n        Payment prior = byKey.putIfAbsent(idemKey, fresh);               // THE compare-and-set: one key, one attempt\n        if (prior != null) return prior;\n        byId.put(fresh.id(), fresh);\n        byMerchant.computeIfAbsent(merchantId, k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(fresh);\n\n        try {\n            for (RiskRule r : riskRules) r.check(merchantId, paise, method, now);   // pure, no lock, no network\n        } catch (PaymentRejected refusal) {\n            fresh.settle(PaymentState.FAILED, &quot;&quot;, refusal.getMessage(), now);\n            publish(fresh);\n            return fresh;\n        }\n        List&lt;PaymentProcessor&gt; route = routing.route(method.type(), currency, paise, processors);\n        if (route.isEmpty()) {\n            fresh.settle(PaymentState.FAILED, &quot;&quot;, &quot;no acquirer takes &quot; + method.type() + &quot; in &quot; + currency, now);\n            publish(fresh);\n            return fresh;\n        }\n        authorizeAlong(fresh, route);\n        publish(fresh);\n        return fresh;\n    }\n\n        // 1. fifty threads send the SAME idempotency key at the same instant -- the retry storm that makes every\n        //

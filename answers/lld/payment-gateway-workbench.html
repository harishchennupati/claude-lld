    payments post-mortem. Exactly one request may reach the acquirer, and all fifty callers must get back\n        //    the very same payment. The putIfAbsent on the key is the whole of it.\n        CardAcquirer solo = new CardAcquirer(&quot;SOLO&quot;, 200, Currency.INR);\n        PaymentService busy = gatewayOver(solo);\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;String&gt;&gt; sent = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            sent.add(pool.submit(() -&gt; {\n                go.await();\n                return busy.pay(&quot;ord-RACE&quot;, &quot;m1&quot;, Money.rupees(&quot;1000.00&quot;), Currency.INR, CARD).id();\n            }));\n        }\n        go.countDown();\n        Set&lt;String&gt; ids = new HashSet&lt;&gt;();\n        for (Future&lt;String&gt; f : sent) ids.add(f.get(10, TimeUnit.SECONDS));\n        check(ids.size() == 1, &quot;fifty retries of one key produced one payment (&quot; + ids.size() + &quot;)&quot;);\n        check(solo.calls() == 1, &quot;exactly one request reached the acquirer (&quot; + solo.calls() + &quot;)&quot;);\n        check(busy.byKey(&quot;ord-RACE&quot;).state() == PaymentState.AUTHORIZED, &quot;and that one payment is AUTHORIZED&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>3 &middot; The acquirer takes the money and then the socket dies. What is the state of the system, and what do you do next?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Not FAILED, and not captured: UNKNOWN. That is the only honest answer, because the money may or may not have moved and nothing in the response tells you which. Three things follow, and they are the whole difference between a gateway and a double-charging machine. The payment is not retried, because retrying a call that may already have charged is how a customer pays twice. It is not failed over to the next acquirer, for the same reason &mdash; note the code distinguishes a timeout from a refused connection, which provably never reached the vendor and IS safe to fail over. And the payment's id goes into a set the reconciliation job reads, so nobody has to scan. The job asks <code>statusOf</code> about the exact key we sent and settles it in whichever direction the vendor says, including \"I never saw that request\".</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Walk the route until one acquirer answers. A ProcessorUnavailable means the call never left the building, so\n     * the claim is handed back and the next acquirer is tried. A ProcessorTimeout means the opposite: the money may\n     * have moved, so we stop, mark the payment UNKNOWN and let the status query settle it. That single distinction\n     * is the difference between a gateway and a double-charging machine.\n     */\n    private void authorizeAlong(Payment p, List&lt;PaymentProcessor&gt; route) {\n        RuntimeException last = null;\n        for (int i = 0; i &lt; route.size(); i++) {\n            PaymentProcessor acquirer = route.get(i);\n            long fee = fees.feeFor(p.paise(), p.method().type(), acquirer);\n            long now = clock.nowMs();\n            if (!p.claim(PaymentState.CREATED, PaymentState.PENDING, acquirer.name(), fee, p.id(), now)) return;\n            try {\n                ProcessorResult r = acquirer.authorize(p.id(), p.paise(), p.currency(), p.method());  // OUTSIDE the lock\n                switch (r.outcome()) {\n                    case CAPTURED -&gt; p.settle(PaymentState.CAPTURED, r.ref(), &quot;&quot;, clock.nowMs());\n                    case AUTHORIZED -&gt; p.settle(PaymentState.AUTHORIZED, r.ref(), &quot;&quot;, clock.nowMs());\n                    default -&gt; p.settle(PaymentState.FAILED, r.ref(), r.reason(), clock.nowMs());\n                }\n                return;\n            } catch (ProcessorTimeout t) {\n                p.markUnknown(&quot;timeout at &quot; + acquirer.name() + &quot;: &quot; + t.getMessage(), clock.nowMs());\n                unresolved.add(p.id());\n                return;                                                  // never fail over after a timeout\n            } catch (ProcessorUnavailable u) {\n                last = u;\n                p.revertClaim(acquirer.name() + &quot; unavailable: &quot; + u.getMessage(), clock.nowMs());\n                if (!retries.retry(i + 1, u)) break;\n            }\n        }\n        p.settle(PaymentState.FAILED, &quot;&quot;, last == null ? &quot;no acquirer accepted it&quot; : last.getMessage(), clock.nowMs());\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>4 &middot; One lock per payment. Does that scale, or have you serialised the gateway?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It scales, and the answer is arithmetic: the locked part is about five field operations, roughly four hundred nanoseconds, taken twice per payment, and no two payments share a lock. Two thousand payments a second is therefore two thousand independent locks each busy for under a microsecond, and the only real contention is a retry storm on one payment &mdash; fifty threads, twenty microseconds in total. The contrast is the sentence to say out loud: a lock held <i>around</i> the two-hundred-and-fifty-millisecond acquirer call would cap the whole gateway at four payments a second. What makes that impossible here is structural rather than careful: the lock is private to <code>Payment</code>, and every method on that class takes it and gives it back before returning, so the flow is never handed a lock it could hold across the wire.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * THE compare-and-set. Move from `expected` to `claimed` if and only if the payment is still in `expected`, and\n     * remember what we claimed from and under which key. Exactly one caller can win; everyone else gets false and\n     * opens no socket. This is the whole of &quot;the customer is charged once&quot;.\n     */\n    boolean claim(PaymentState expected, PaymentState claimed, String acquirerName, long fee, String callKey, long nowMs) {\n        lock.lock();\n        try {\n            if (state != expected || !state.canGoTo(claimed)) return false;\n            claimedFrom = state; state = claimed;\n            acquirer = acquirerName; feePaise = fee; inFlightKey = callKey; lastChangeMs = nowMs;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * The ONE method that records an outcome, used by the acquirer&#x27;s answer and by its webhook alike -- which is\n     * why an out-of-order webhook costs nothing. It applies only if the outcome is a legal next move AND its rank\n     * beats the highest rank this payment has reached. A duplicate, a late &quot;authorized&quot; after a capture and a\n     * replayed callback are all silently dropped. Returns true if anything changed.\n     */\n    boolean settle(PaymentState outcome, String ref, String why, long nowMs) {\n        lock.lock();\n        try {\n            if (outcome.outcomeRank() &lt;= rankReached) return false;      // a report of an older truth\n            if (!state.canGoTo(outcome)) return false;                   // an edge that does not exist\n            state = outcome; rankReached = outcome.outcomeRank(); lastChangeMs = nowMs;\n            if (!ref.isEmpty()) acquirerRef = ref;\n            reason = why;\n            if (outcome == PaymentState.CAPTURED) capturedPaise = paise;\n            claimedFrom = state; inFlightKey = &quot;&quot;;\n            return true;\n        } finally { lock.unlock(); }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; The merchant refunds three hundred, then eight hundred, on a thousand-rupee payment, from two tabs at once.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One of them is refused, and the refused one leaves nothing behind. The trap is a single counter written after the acquirer answers: both tabs read \"a thousand refundable\", both call the vendor, and the merchant has refunded eleven hundred of a thousand. So the amount is reserved <i>before</i> the call: under the payment's lock the code checks captured minus refunded minus already-reserved and adds to the reservation in the same step, which is why the second tab is refused on the read the first tab has already changed. When the vendor says yes the reservation becomes a settled refund and the payment moves to PARTIALLY_REFUNDED or REFUNDED; when it says no, or the call never left, the reservation is handed straight back. A refund whose call timed out is the one case where the reservation is deliberately kept, because the money may be on its way.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Promise this much of the captured money to a refund that is about to be attempted. The check and the write\n     * are one step under the lock, which is the point: two refunds decided from the same read would together\n     * exceed what was captured. Returns false if there is not enough left.\n     */\n    boolean reserveRefund(long amount) {\n        lock.lock();\n        try {\n            if (state != PaymentState.CAPTURED &amp;&amp; state != PaymentState.PARTIALLY_REFUNDED) return false;\n            if (amount &lt;= 0 || capturedPaise - refundedPaise - refundReservedPaise &lt; amount) return false;\n            refundReservedPaise += amount;\n            return true;\n        } finally { lock.unlock(); }\n    }\n    /** The refund was refused or never left: give the promise back so the money can be refunded by someone else. */\n    void releaseRefund(long amount) {\n        lock.lock();\n        try { refundReservedPaise -= amount; } finally { lock.unlock(); }\n    }\n    /** The acquirer sent it back: turn the promise into a fact and move the payment along its life. */\n    void settleRefund(long amount, long nowMs) {\n        lock.lock();\n        try {\n            refundReservedPaise -= amount; refundedPaise += amount; lastChangeMs = nowMs;\n            PaymentState next = refundedPaise &gt;= capturedPaise ? PaymentState.REFUNDED : PaymentState.PARTIALLY_REFUNDED;\n            if (state.canGoTo(next)) { state = next; rankReached = Math.max(rankReached, next.outcomeRank()); }\n        } finally { lock.unlock(); }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>6 &middot; The acquirer&#x27;s webhook arrives an hour late, out of order, and then arrives again.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None of that needs new code, because the webhook path and the response path are the same method. Every outcome carries a rank &mdash; authorized and failed rank one, captured two, partially refunded three, refunded four &mdash; and the payment remembers the highest rank it has ever reached. A report is applied only if its rank beats that number and the move is legal in the transition table, so a duplicate loses on equality, an \"authorized\" arriving after a capture loses on rank, and a \"captured\" arriving after a partial refund loses on both. The rank is deliberately separate from the state, which is what lets a claim move the state backwards (AUTHORIZED to PENDING for a capture) without opening a hole for a stale callback. And when the news IS new, it lands: a webhook that beats the status query closes an UNKNOWN payment and takes it off the reconciliation list.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The ONE method that records an outcome, used by the acquirer&#x27;s answer and by its webhook alike -- which is\n     * why an out-of-order webhook costs nothing. It applies only if the outcome is a legal next move AND its rank\n     * beats the highest rank this payment has reached. A duplicate, a late &quot;authorized&quot; after a capture and a\n     * replayed callback are all silently dropped. Returns true if anything changed.\n     */\n    boolean settle(PaymentState outcome, String ref, String why, long nowMs) {\n        lock.lock();\n        try {\n            if (outcome.outcomeRank() &lt;= rankReached) return false;      // a report of an older truth\n            if (!state.canGoTo(outcome)) return false;                   // an edge that does not exist\n            state = outcome; rankReached = outcome.outcomeRank(); lastChangeMs = nowMs;\n            if (!ref.isEmpty()) acquirerRef = ref;\n            reason = why;\n            if (outcome == PaymentState.CAPTURED) capturedPaise = paise;\n            claimedFrom = state; inFlightKey = &quot;&quot;;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n/**\n     * An acquirer calls us back. Delivery is at-least-once and out of order, and neither matters: this is the same\n     * settle() the response path uses, so a duplicate loses on rank and a late &quot;authorized&quot; after a capture is\n     * dropped. Returns true if the report changed anything.\n     */\n    boolean handleWebhook(String paymentId, PaymentState reported, String acquirerRef, long atMs) {\n        Payment p = byId.get(paymentId);\n        if (p == null) return false;                                      // a callback for something we never sent\n        if (reported.outcomeRank() == 0) return false;                    // a webhook only ever reports an outcome\n        boolean changed = p.settle(reported, acquirerRef, &quot;&quot;, atMs);\n        if (changed) { unresolved.remove(paymentId); publish(p); }\n        return changed;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>7 &middot; Our primary acquirer is flapping. Route around it, during the incident, without a deploy.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Two pieces, and neither touches the flow. The routing policy is an interface that returns a <i>list</i>, best first, and the tail of that list is the failover plan; swapping PreferredRouting for LeastCostRouting is a new class and one line in configure, and the field is volatile so it can be swapped live. The circuit breaker is the other half: it is a PaymentProcessor that holds a PaymentProcessor, counts consecutive failures, and after the threshold fails every call instantly as ProcessorUnavailable &mdash; which the router already reads as \"try the next one\" &mdash; then half-opens after the cool-off. Because it reports the wrapped acquirer's own name, routing and the stored acquirer name never learn it exists.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * A circuit breaker wrapped around ANY acquirer. It is a PaymentProcessor that holds a PaymentProcessor, so a\n * vendor written next year gets breaking for free and no vendor adapter has ever heard of it.\n *\n * After `threshold` consecutive failures it trips: every call fails instantly as ProcessorUnavailable, which the\n * router reads as &quot;try the next one&quot;. After the cool-off it lets one call through and closes on the first success.\n */\nclass CircuitBreaker implements PaymentProcessor {\n    private interface Call { ProcessorResult run(); }\n    private final PaymentProcessor inner; private final int threshold; private final long coolOffMs;\n    private final Clock clock;\n    private final AtomicInteger consecutiveFailures = new AtomicInteger();\n    private volatile long openedAtMs = 0;\n\n    CircuitBreaker(PaymentProcessor inner, int threshold, long coolOffMs, Clock clock) {\n        this.inner = inner; this.threshold = threshold; this.coolOffMs = coolOffMs; this.clock = clock;\n    }\n    /** The wrapped acquirer&#x27;s own name, so routing and the stored processor name do not know the wrapper exists. */\n    public String name() { return inner.name(); }\n    public boolean supports(PaymentMethodType t, Currency c) { return inner.supports(t, c); }\n    public long feeBps() { return inner.feeBps(); }\n    public boolean capturesOnAuthorize() { return inner.capturesOnAuthorize(); }\n    public ProcessorResult authorize(String k, long paise, Currency c, PaymentMethod m) { return guard(() -&gt; inner.authorize(k, paise, c, m)); }\n    public ProcessorResult capture(String k, String ref, long paise) { return guard(() -&gt; inner.capture(k, ref, paise)); }\n    public ProcessorResult refund(String k, String ref, long paise) { return guard(() -&gt; inner.refund(k, ref, paise)); }\n    public ProcessorResult statusOf(String k) { return inner.statusOf(k); }      // asking is always allowed\n    /** True while the breaker is open. Exposed for a health screen; the flow never asks. */\n    boolean open() {\n        if (openedAtMs == 0) return false;\n        if (clock.nowMs() - openedAtMs &lt; coolOffMs) return true;\n        openedAtMs = 0; consecutiveFailures.set(0);                     // half-open: let the next call decide\n        return false;\n    }\n    private ProcessorResult guard(Call c) {\n        if (open()) throw new ProcessorUnavailable(inner.name() + &quot;: circuit is open&quot;);\n        try {\n            ProcessorResult r = c.run();\n            consecutiveFailures.set(0);\n            return r;\n        } catch (ProcessorUnavailable | ProcessorTimeout e) {\n            if (consecutiveFailures.incrementAndGet() &gt;= threshold) openedAtMs = clock.nowMs();\n            throw e;\n        }\n    }\n}\n\n// ---- ext: least-cost routing -- &quot;stop routing by relationship, always take the cheapest healthy acquirer&quot;\n/**\n * A new routing rule is a new class and one line in configure(). Nothing in PaymentService is opened: it asks the\n * policy for a list and tries them in order, and it has never known why the order is what it is.\n */\nclass LeastCostRouting implements RoutingPolicy {\n    public List&lt;PaymentProcessor&gt; route(PaymentMethodType type, Currency currency, long paise, List&lt;PaymentProcessor&gt; all) {\n        List&lt;PaymentProcessor&gt; able = new ArrayList&lt;&gt;();\n        for (PaymentProcessor p : all) if (p.supports(type, currency)) able.add(p);\n        able.sort(Comparator.comparingLong(PaymentProcessor::feeBps));        // cheapest first, the rest as failover\n        return able;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Support partial capture: ship half the order today and the rest on Friday.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It is the exact mirror of the refund pair that already exists, which is the point of the answer. Payment grows two more long fields, a reserved and a settled capture amount, moved under the same lock with the acquirer call between them, plus a PARTIALLY_CAPTURED self-loop in the transition table; refunds then check against the settled capture instead of the full amount. The two rules are the same two rules: the captures can never add up past what was authorized, and nothing is written until the acquirer says yes. The reference code keeps that book beside the payment so Main stays as page 03 draws it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: partial capture -- ship half the order today, the rest on Friday\n/**\n * &quot;Capture four hundred of the thousand you authorized.&quot; It is the mirror of the refund pair that is already in\n * Main: a reserved counter and a settled counter, moved under the same lock, with the acquirer call between them.\n *\n * In Payment that is two more long fields, captureReserved and captureSettled, plus a PARTIALLY_CAPTURED self-loop\n * in the transition table; refunds then check against captureSettled instead of the full amount. This desk keeps\n * that book beside the payment so Main stays as page 03 draws it, and it enforces the same two rules: the captures\n * never add up past what was authorized, and nothing is written until the acquirer says yes.\n */\nclass PartialCaptureDesk {\n    private final Map&lt;String, long[]&gt; captured = new ConcurrentHashMap&lt;&gt;();   // paymentId -&gt; { settled paise }\n    private final PaymentProcessor acquirer;\n    PartialCaptureDesk(PaymentProcessor acquirer) { this.acquirer = acquirer; }\n\n    /** Capture part of an authorization. Returns the paise actually captured, or zero if it was refused. */\n    synchronized long capture(Payment p, long paise) {\n        long already = captured.computeIfAbsent(p.id(), k -&gt; new long[1])[0];\n        if (paise &lt;= 0 || already + paise &gt; p.paise()) return 0;              // the check and the write are one step\n        ProcessorResult r = acquirer.capture(p.id() + &quot;:cap&quot; + already, p.acquirerRef(), paise);\n        if (r.outcome() != Outcome.CAPTURED) return 0;                        // refused: the book is untouched\n        captured.get(p.id())[0] = already + paise;\n        return paise;\n    }\n    /** How much of this authorization has actually moved. */\n    long capturedOf(String paymentId) { return captured.getOrDefault(paymentId, new long[1])[0]; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; Card testing hit us over the weekend: hundreds of tiny payments on stolen cards. Block a token after three declines in a minute, by Monday.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It looks like three changes &mdash; the risk check, the failure path and the wiring &mdash; and it is one class. The risk chain already asks every rule the same question before anything is claimed, and the listener bus already announces every payment that failed, so <code>CardTestingRule</code> implements both interfaces and is registered twice: once in <code>configure()</code> as a rule, once with <code>addListener</code>. The rule half counts that token's declines inside a sixty-second window and throws <code>PaymentRejected</code>, which <code>pay()</code> turns into a FAILED payment with no acquirer name on it and no socket opened. The listener half adds a timestamp only for payments an <i>acquirer</i> declined &mdash; it checks that the event carries an acquirer name &mdash; which is how the rule avoids counting its own refusals and locking a card out forever. The window is pruned on read, so there is no timer and no cleanup job, and the timestamps come from the injected clock, so the test moves time instead of sleeping for a minute.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the card-testing rule -- one class that is both a rule and a listener\n/**\n * &quot;Card testing hit us over the weekend: block a token after three declines in a minute.&quot; It looks like it touches\n * the risk check, the failure path and the wiring. It touches none of them. The risk chain already asks every rule\n * the same question and the listener bus already announces every failure, so the new rule is one class that\n * implements both interfaces and one line that registers it twice.\n */\nclass CardTestingRule implements RiskRule, PaymentListener {\n    private final PaymentService gateway; private final int maxDeclines; private final long windowMs;\n    private final Map&lt;String, Deque&lt;Long&gt;&gt; declines = new ConcurrentHashMap&lt;&gt;();\n\n    CardTestingRule(PaymentService gateway, int maxDeclines, long windowMs) {\n        this.gateway = gateway; this.maxDeclines = maxDeclines; this.windowMs = windowMs;\n    }\n    /** The rule half: count this token&#x27;s recent declines and refuse if there are too many. Reads only. */\n    public void check(String merchantId, long paise, PaymentMethod method, long nowMs) {\n        Deque&lt;Long&gt; recent = declines.get(method.token());\n        if (recent == null) return;\n        synchronized (recent) {\n            while (!recent.isEmpty() &amp;&amp; nowMs - recent.peekFirst() &gt; windowMs) recent.pollFirst();\n            if (recent.size() &gt;= maxDeclines)\n                throw new PaymentRejected(&quot;card testing: &quot; + recent.size() + &quot; declines in &quot; + (windowMs / 1000) + &quot;s&quot;);\n        }\n    }\n    /**\n     * The listener half: a payment an ACQUIRER declined adds a timestamp to that token&#x27;s window. A payment this\n     * rule itself refused has no acquirer on it, which is how the rule avoids counting its own refusals.\n     */\n    public void onEvent(PaymentEvent e) {\n        if (e.state() != PaymentState.FAILED || e.acquirer().isEmpty()) return;\n        String token = gateway.payment(e.paymentId()).method().token();\n        Deque&lt;Long&gt; recent = declines.computeIfAbsent(token, k -&gt; new ArrayDeque&lt;&gt;());\n        synchronized (recent) { recent.addLast(e.atMs()); }\n    }\n    /** How many declines this token has inside the window right now. For a fraud screen. */\n    int declinesFor(String token) {\n        Deque&lt;Long&gt; recent = declines.get(token);\n        return recent == null ? 0 : recent.size();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>10 &middot; Show me this merchant&#x27;s settlement for the day, and every payment whose outcome we still do not know.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No new structure, only indexes maintained as payments land. Payments are in a map keyed by merchant, so a merchant's day is O(1) to find and O(k) to add up over their own payments, never a scan of the gateway; the settlement is captured minus refunded minus our fee, and note that a fully refunded payment still leaves the fee behind, which is what a real gateway does. The unknown payments are a set written the moment a call times out and cleared the moment one is resolved, so the reconciliation job reads a handful of rows rather than every payment ever taken. The query an interviewer usually adds next is \"show me authorizations older than seven days\", and it is the same move &mdash; one more index at the one choke point where state changes &mdash; but what you do with them is the interesting half. An expired hold has to be voided locally, and <code>settle()</code> will refuse to do it: FAILED and AUTHORIZED have the same rank, which is exactly what stops a late \"declined\" webhook from cancelling a good authorization. So a void is its own four-line method beside <code>markUnknown</code>, using the AUTHORIZED-to-FAILED edge the table already has; the acquirer stays the source of truth, so a capture that really did happen can still arrive afterwards and win on rank.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * What this merchant is owed: everything captured, less everything refunded, less our fees. O(k) over that\n     * merchant&#x27;s own payments off the index, never a scan of the whole gateway.\n     */\n    long settlementOf(String merchantId) {\n        long total = 0;\n        for (Payment p : byMerchant.getOrDefault(merchantId, List.of())) {\n            if (p.capturedPaise() == 0) continue;\n            total += p.capturedPaise() - p.refundedPaise() - p.feePaise();\n        }\n        return total;\n    }\n\n// ---- ext: settlement -- what actually leaves our bank account for the merchant at the end of the day\n/** One day&#x27;s payout: what was captured, less refunds, less our fees, less disputes. The number the merchant sees. */\nrecord Payout(String merchantId, long grossPaise, long refundedPaise, long feePaise, long disputedPaise, long netPaise) { }\n\n/**\n * The end-of-day sweep. It reads the merchant&#x27;s own payment list off the index, so a merchant with a thousand\n * payments costs a thousand reads and a merchant with none costs nothing: it never scans the whole gateway.\n */\nclass SettlementJob {\n    private final PaymentService gateway; private final ChargebackDesk disputes;\n    SettlementJob(PaymentService gateway, ChargebackDesk disputes) { this.gateway = gateway; this.disputes = disputes; }\n\n    /** Build today&#x27;s payout for one merchant. */\n    Payout payoutFor(String merchantId) {\n        long gross = 0, refunded = 0, fee = 0;\n        for (Payment p : gateway.paymentsOf(merchantId)) {\n            if (p.capturedPaise() == 0) continue;                            // authorized but never captured\n            gross += p.capturedPaise(); refunded += p.refundedPaise(); fee += p.feePaise();\n        }\n        long disputed = disputes.disputedPaise(merchantId);\n        return new Payout(merchantId, gross, refunded, fee, disputed, gross - refunded - fee - disputed);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>11 &middot; Finance says the numbers must add up on their own. Where are the books, and what is one payment&#x27;s double entry?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Every movement is written twice, once positive and once negative, so the sum of every line ever written is zero; if it is not zero, somebody wrote one side of a movement. A capture of a thousand rupees writes +1000.00 to <code>acquirer_receivable</code> (money the acquirer now owes us) and &minus;1000.00 to <code>merchant_payable</code> (money we now owe the merchant), and a refund writes the mirror of that. The class is a <code>PaymentListener</code> and nothing else changed: accounting arrived after the design and cost one class and one <code>addListener</code> line, and because it is fed events rather than payments it cannot change a payment even by accident. The one trap is that an event carries running totals rather than the movement, so the ledger posts the <i>difference</i> between the total in the event and the total already on its books: a replayed event posts zero, an event that arrives out of order carries an older and smaller total and posts nothing, and a third partial refund posts only its own hundred rupees. <code>ExtDemo</code> proves it &mdash; six lines for one capture and two partial refunds, nothing for the replayed event, and an imbalance of zero.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the double-entry ledger -- another listener, and the gateway does not change\n/** One immutable line of the books: money in or out of one account, as part of one payment. */\nrecord LedgerLine(String paymentId, String account, long signedPaise, String memo) { }\n\n/**\n * Every movement written twice, so the books always add up to zero. It is a listener, which is the whole point:\n * accounting arrived after the design and cost one class and one addListener call. It is fed events, not payments,\n * so it cannot change a payment even by accident.\n *\n * An event carries running totals, not the movement -- capturedPaise and refundedPaise are &quot;how much in all so far&quot;.\n * So the ledger posts the DIFFERENCE between the total in the event and the total already on the books. That one\n * decision buys three things at once: a replayed event posts a difference of zero, an event that arrives out of\n * order carries an older and therefore smaller total and posts nothing, and a third partial refund posts only its\n * own hundred rupees instead of the running total all over again.\n */\nclass DoubleEntryLedger implements PaymentListener {\n    private final List&lt;LedgerLine&gt; lines = new CopyOnWriteArrayList&lt;&gt;();\n    private final Map&lt;String, long[]&gt; posted = new ConcurrentHashMap&lt;&gt;();    // paymentId -&gt; {captured, refunded} on the books\n\n    public void onEvent(PaymentEvent e) {\n        long[] onBooks = posted.computeIfAbsent(e.paymentId(), k -&gt; new long[2]);\n        synchronized (onBooks) {                                             // two events for one payment, one at a time\n            long captured = e.capturedPaise() - onBooks[0];\n            if (captured &gt; 0) {\n                lines.add(new LedgerLine(e.paymentId(), &quot;acquirer_receivable&quot;, captured, &quot;capture&quot;));\n                lines.add(new LedgerLine(e.paymentId(), &quot;merchant_payable&quot;, -captured, &quot;capture&quot;));\n                onBooks[0] = e.capturedPaise();\n            }\n            long refunded = e.refundedPaise() - onBooks[1];\n            if (refunded &gt; 0) {\n                lines.add(new LedgerLine(e.paymentId(), &quot;merchant_payable&quot;, refunded, &quot;refund&quot;));\n                lines.add(new LedgerLine(e.paymentId(), &quot;acquirer_receivable&quot;, -refunded, &quot;refund&quot;));\n                onBooks[1] = e.refundedPaise();\n            }\n        }\n    }\n    /** The books must always sum to zero. If they do not, a posting was written one-sided. */\n    long imbalance() {\n        long sum = 0;\n        for (LedgerLine l : lines) sum += l.signedPaise();\n        return sum;\n    }\n    /** Every line, oldest first. */\n    List&lt;LedgerLine&gt; lines() { return List.copyOf(lines); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Persist it. And now there are two servers.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Every guard in the in-memory version has a one-line database twin, which is why the shape does not change. The idempotency map becomes a unique index on the key with INSERT ... ON CONFLICT DO NOTHING. The claim becomes UPDATE payments SET state = 'PENDING' WHERE id = ? AND state = 'CREATED', and \"zero rows updated\" is exactly what <code>claim()</code> returning false means today. The rank guard becomes another WHERE clause, rank_reached &lt; ?. And the merchant webhook, which today runs after the unlock, becomes an outbox row written inside the same transaction as the payment and drained by a worker: no payment without a row, no row without a payment, and a double delivery is the at-least-once problem merchants already handle.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- the claim becomes a conditional UPDATE, and the webhook becomes an outbox row\n/**\n * What a database gives us for free. Each method is the row-level version of something the in-memory gateway does\n * with a map or a lock, which is the point: the design does not change shape when it grows a database.\n */\ninterface PaymentRepository {\n    /** INSERT ... ON CONFLICT (idempotency_key) DO NOTHING. False means somebody else owns this key. */\n    boolean insertIfAbsent(String idemKey, String paymentId, long paise);\n    /** UPDATE payments SET state = ? WHERE id = ? AND state = ?. The database&#x27;s own compare-and-set. */\n    boolean claim(String paymentId, PaymentState from, PaymentState to);\n    /** UPDATE payments SET state = ? WHERE id = ? AND rank_reached &lt; ?. Rank in the WHERE clause, not in the code. */\n    boolean settle(String paymentId, PaymentState outcome, int rank);\n    /** What the row says now. */\n    PaymentState stateOf(String paymentId);\n}\n\n/** An in-memory stand-in that obeys exactly the contract above, so the shape can be demonstrated without a server. */\nclass InMemoryPaymentRepository implements PaymentRepository {\n    private record Row(String paymentId, long paise, PaymentState state, int rank) { }\n    private final Map&lt;String, Row&gt; rows = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, String&gt; keys = new ConcurrentHashMap&lt;&gt;();      // the unique index on idempotency_key\n\n    public synchronized boolean insertIfAbsent(String idemKey, String paymentId, long paise) {\n        if (keys.putIfAbsent(idemKey, paymentId) != null) return false;\n        rows.put(paymentId, new Row(paymentId, paise, PaymentState.CREATED, 0));\n        return true;\n    }\n    public synchronized boolean claim(String paymentId, PaymentState from, PaymentState to) {\n        Row r = rows.get(paymentId);\n        if (r == null || r.state() != from) return false;                    // the WHERE clause did not match: 0 rows\n        rows.put(paymentId, new Row(paymentId, r.paise(), to, r.rank()));\n        return true;\n    }\n    public synchronized boolean settle(String paymentId, PaymentState outcome, int rank) {\n        Row r = rows.get(paymentId);\n        if (r == null || rank &lt;= r.rank() || !r.state().canGoTo(outcome)) return false;\n        rows.put(paymentId, new Row(paymentId, r.paise(), outcome, rank));\n        return true;\n    }\n    public PaymentState stateOf(String paymentId) {\n        Row r = rows.get(paymentId);\n        return r == null ? null : r.state();\n    }\n}\n\n/**\n * The merchant webhook, once there are two servers. Writing the outbox row in the same transaction as the payment\n * is what makes delivery exactly-as-often-as-the-payment-happened: no payment without a row, no row without a\n * payment. A worker drains it, and because the row carries the payment id and state, a double delivery is the same\n * at-least-once problem the merchant already handles.\n */\nclass Outbox {\n    private final Deque&lt;PaymentEvent&gt; pending = new ConcurrentLinkedDeque&lt;&gt;();\n    private final AtomicInteger delivered = new AtomicInteger();\n\n    /** Written inside the payment&#x27;s transaction, so it cannot be lost and cannot exist on its own. */\n    void enqueue(PaymentEvent e) { pending.addLast(e); }\n    /** The worker: take rows and post them, leaving the ones that fail for the next run. */\n    int drain(WebhookEndpoint endpoint, String url, int max) {\n        int sent = 0;\n        for (int i = 0; i &lt; max; i++) {\n            PaymentEvent e = pending.pollFirst();\n            if (e == null) break;\n            if (endpoint.post(url, e)) { delivered.incrementAndGet(); sent++; }\n            else { pending.addFirst(e); break; }                              // still down: stop, keep the order\n        }\n        return sent;\n    }\n    /** How many rows are still waiting. */\n    int depth() { return pending.size(); }\n    /** How many have gone out. */\n    int delivered() { return delivered.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; A chargeback lands forty days later. And compliance asks where the card number is stored.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A chargeback is not a refund: the money is already gone when the issuer tells us, so there is nothing to call the acquirer about. It is a fact to record against the payment and subtract from what the merchant is owed, which makes it a second book the settlement job reads &mdash; and it is refused if it exceeds what is still held, and refused twice on the same payment, because an issuer pulls the money back once. The card number question is already answered: nowhere. PaymentMethod carries a token and a display string, the vault is the only class whose methods ever take a PAN, and so nothing downstream &mdash; the payment, the audit log, the merchant webhook, the future database &mdash; needs a redaction rule, because it never had the number to redact.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: chargebacks -- the issuer takes the money back forty days later\n/** One dispute: the issuer pulled this much back, on this day, for this reason. Linked to a payment, never inside it. */\nrecord Chargeback(String id, String paymentId, long paise, String reasonCode, long atMs) { }\n\n/**\n * A chargeback is not a refund: the money is already gone when we hear about it, so there is nothing to call the\n * acquirer about. It is a fact to record and subtract from what the merchant is owed. The payment&#x27;s own state is\n * untouched, which is why the ledger and the settlement job read this book as well as the payments.\n */\nclass ChargebackDesk {\n    private final PaymentService gateway;\n    private final Map&lt;String, List&lt;Chargeback&gt;&gt; byMerchant = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, Chargeback&gt; byPayment = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicLong nextId = new AtomicLong(1);\n    ChargebackDesk(PaymentService gateway) { this.gateway = gateway; }\n\n    /** Record a dispute. Refuses a second one on the same payment: an issuer pulls the money back once. */\n    Chargeback raise(String paymentId, long paise, String reasonCode, long atMs) {\n        Payment p = gateway.payment(paymentId);\n        if (paise &gt; p.capturedPaise() - p.refundedPaise())\n            throw new PaymentRejected(&quot;a chargeback cannot exceed what is still held: &quot;\n                + Money.fmt(p.capturedPaise() - p.refundedPaise()));\n        Chargeback c = new Chargeback(&quot;cb_&quot; + nextId.getAndIncrement(), paymentId, paise, reasonCode, atMs);\n        if (byPayment.putIfAbsent(paymentId, c) != null) throw new PaymentRejected(paymentId + &quot; is already disputed&quot;);\n        byMerchant.computeIfAbsent(p.merchantId(), k -&gt; new CopyOnWriteArrayList&lt;&gt;()).add(c);\n        return c;\n    }\n    /** What this merchant has lost to disputes. Subtracted from the payout. */\n    long disputedPaise(String merchantId) {\n        long total = 0;\n        for (Chargeback c : byMerchant.getOrDefault(merchantId, List.of())) total += c.paise();\n        return total;\n    }\n}\n\n// ---- ext: tokenisation -- the card number never enters the gateway at all\n/**\n * PCI scope, in one class. The vault is the only thing that has ever seen a card number; it hands back a token and\n * a display string, and everything downstream -- Payment, the audit log, the merchant webhook, the database --\n * holds only those. Nothing in Main needs a redaction rule because nothing in Main ever had the number.\n */\nclass CardVault {\n    private final Map&lt;String, String&gt; pans = new ConcurrentHashMap&lt;&gt;();       // token -&gt; PAN, inside the vault only\n    private final AtomicLong nextId = new AtomicLong(1);\n\n    /** Swap a card number for a token. The only method in the system that takes a PAN as an argument. */\n    PaymentMethod tokenise(String pan) {\n        if (pan == null || pan.length() &lt; 12) throw new IllegalArgumentException(&quot;not a card number&quot;);\n        String token = &quot;tok_&quot; + nextId.getAndIncrement();\n        pans.put(token, pan);\n        return new PaymentMethod(PaymentMethodType.CARD, token, &quot;**** &quot; + pan.substring(pan.length() - 4));\n    }\n    /** Only the acquirer adapter, inside the vault&#x27;s blast radius, ever asks for this. */\n    String panFor(String token) { return pans.get(token); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Where does time come from, and how do you test a rule about the last sixty seconds?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The gateway has a Clock it was handed and stamps every state change with it; nothing in the system reads the wall clock inside a method. A test hands in a clock that returns a fixed instant, makes a payment time out, moves the instant forward by a minute and runs the reconciliation job, and can then assert that the job's staleness rule fired exactly when it should have. The same seam is what makes the circuit breaker's cool-off and the card-testing rule's sixty-second window testable without a single sleep: both are given a now, never asked to find one.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Where time comes from. Injected, so a test can put the clock anywhere it likes and move it. */\ninterface Clock { long nowMs(); }\n\n// on the gateway: handed in, defaulted, never read from the wall clock inside a method\nprivate volatile Clock clock = System::currentTimeMillis;\nvoid setClock(Clock c) { clock = c; }\n\n// in a test: pick the instant, then move it\nlong[] now = { 1_700_000_000_000L };\ngw.setClock(() -&gt; now[0]);\nacquirer.mode(VendorMode.TIMEOUT_CHARGED);\nPayment p = gw.pay(&quot;ord-2&quot;, &quot;m1&quot;, Money.rupees(&quot;700.00&quot;), Currency.INR, CARD);   // UNKNOWN\nacquirer.mode(VendorMode.HEALTHY);\nnow[0] += 60_000;                                      // a minute later\ngw.reconcile(30_000);                                  // only now is it stale enough to chase\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Which pattern is where, which SOLID letter is where, and where would a Factory or a Builder earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Moves 10 and 11 named them; this is the version that survives being argued with, which is what the question is really for. <b>Strategy</b>: routing, fees, retries and risk are one-method interfaces the gateway is handed, so a cost-based route is a new file and one line in <code>configure()</code>. <i>\"Then why is PaymentProcessor not a Strategy as well?\"</i> Because it is a port to somebody else's computer rather than a rule of ours, and each implementation behind it is an <b>Adapter</b> for one vendor's dialect. <i>\"Why is CircuitBreaker a Decorator and not a subclass of each acquirer?\"</i> Because a subclass has to be written once per vendor and again for every vendor added later, while the wrapper reports the wrapped acquirer's own <code>name()</code>, so routing and the stored acquirer name never learn it exists. <b>Observer</b> is what keeps a merchant's slow server outside the lock; <b>State</b> is the transition table plus the rank. <b>Factory</b> earns its place the day acquirers arrive as strings from configuration &mdash; the map is already the registry &mdash; and <b>Builder</b> never does here: five fields, all of them required. SOLID in one line each: S is move 2, O is <code>LeastCostRouting</code>, L is that the flow asks <code>capturesOnAuthorize()</code> and never which vendor it got, I is the one-method interfaces with <code>PaymentProcessor</code> as the honest exception because a vendor is wide, and D is <code>configure()</code> and <code>setClock()</code> &mdash; which is exactly why a test can hand in an acquirer that takes the money and then times out.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: a rule behind an interface, handed in, never built by the gateway\ninterface RoutingPolicy { List&lt;PaymentProcessor&gt; route(PaymentMethodType t, Currency c, long paise, List&lt;PaymentProcessor&gt; all); }\nvoid configure(RoutingPolicy routing, FeePolicy fees, RetryPolicy retries, List&lt;RiskRule&gt; riskRules) { ... }\n\n// Adapter: one class per vendor dialect; the gateway never learns a vendor&#x27;s names\nclass CardAcquirer implements PaymentProcessor { ... }      // auth then capture\nclass UpiSwitch    implements PaymentProcessor { ... }      // capturesOnAuthorize() == true\n\n// Decorator: a processor that HOLDS a processor, so the behaviour applies to vendors written next year\ngw.addProcessor(new CircuitBreaker(hdfc, 3, 30_000, clock));\npublic String name() { return inner.name(); }               // routing never learns the wrapper exists\n\n// Observer: the gateway announces; it does not know what a merchant&#x27;s server is\ninterface PaymentListener { void onEvent(PaymentEvent e); }\nfor (PaymentListener l : listeners) try { l.onEvent(e); } catch (RuntimeException ex) { /* log */ }\n\n// State: the life as data -- the legality table and the rank, checked on every single write\nif (outcome.outcomeRank() &lt;= rankReached) return false;     // a report of an older truth\nif (!state.canGoTo(outcome)) return false;                  // an edge that does not exist\n\n// Factory: not yet. The registry is already here; it earns the name when acquirers come from config strings\nMap&lt;String, PaymentProcessor&gt; byAcquirer = new ConcurrentHashMap&lt;&gt;();\n\n// Builder: never here. Five required fields is a constructor\nnew Payment(id, idemKey, merchantId, paise, currency, method, createdMs);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/** The currencies this gateway settles in. One currency per payment, always; FX is a follow-up, not a special case. */\nenum Currency { INR, USD }\n\n/** Exact money, in paise (a hundredth of a rupee). There is no double in this file; these helpers are the only boundary. */\nfinal class Money {\n    /** Parse \"1234.50\" into 123450 paise, exactly. Used at the edge (a form, a JSON body), never inside the arithmetic. */\n    static long rupees(String amount) { return new java.math.BigDecimal(amount).movePointRight(2).longValueExact(); }\n    /** Print 123450 paise as \"1234.50\". Presentation only. */\n    static String fmt(long paise) {\n        String sign = paise < 0 ? \"-\" : \"\"; long a = Math.abs(paise);\n        return sign + (a / 100) + \".\" + String.format(\"%02d\", a % 100);\n    }\n    /** Basis points of an amount: 200 bp = 2%. Integer arithmetic, rounded down, so a fee can never invent a paise. */\n    static long bps(long paise, long basisPoints) { return paise * basisPoints / 10_000; }\n}\n\n/** What the customer paid with. The gateway routes on this and logs it; it never branches on it to move money. */\nenum PaymentMethodType { CARD, UPI, NETBANKING }\n\n/**\n * The instrument, already tokenised. There is no card number anywhere in this file: the gateway holds a token the\n * vault gave it and a display string safe to print. That is the whole of PCI scope in one record.\n */\nrecord PaymentMethod(PaymentMethodType type, String token, String display) {\n    @Override public String toString() { return type + \" \" + display; }\n}\n\n/** Who is being paid. An id, a name and where to call back when something happens to one of their payments. */\nrecord Merchant(String id, String name, String webhookUrl) { }\n\n/**\n * A payment's life, written down once as data instead of scattered as if-statements.\n *\n * Two things live here. canGoTo() is the legality table: capturing a declined payment is not a bug to catch later,\n * it is an edge that does not exist. outcomeRank() is the ordering: acquirer webhooks arrive late, twice and out of\n * order, so every outcome gets a rank and a report that does not beat the highest rank reached is dropped.\n */\nenum PaymentState {\n    CREATED, PENDING, AUTHORIZED, CAPTURED, PARTIALLY_REFUNDED, REFUNDED, FAILED, UNKNOWN;\n\n    private static final Map<PaymentState, Set<PaymentState>> NEXT = new EnumMap<>(PaymentState.class);\n    static {\n        NEXT.put(CREATED,            EnumSet.of(PENDING, FAILED));\n        // PENDING -> CREATED and UNKNOWN -> AUTHORIZED are the un-claim edges: the call provably never reached the\n        // acquirer, so the claim is handed back and the payment is exactly where it was.\n        NEXT.put(PENDING,            EnumSet.of(AUTHORIZED, CAPTURED, FAILED, UNKNOWN, CREATED));\n        NEXT.put(AUTHORIZED,         EnumSet.of(PENDING, CAPTURED, FAILED));\n        NEXT.put(UNKNOWN,            EnumSet.of(AUTHORIZED, CAPTURED, FAILED, CREATED));\n        NEXT.put(CAPTURED,           EnumSet.of(PARTIALLY_REFUNDED, REFUNDED));\n        NEXT.put(PARTIALLY_REFUNDED, EnumSet.of(PARTIALLY_REFUNDED, REFUNDED));\n        NEXT.put(REFUNDED,           EnumSet.noneOf(PaymentState.class));\n        NEXT.put(FAILED,             EnumSet.noneOf(PaymentState.class));\n    }\n\n    /** Is this move legal at all? Asked before every state change, by the response path and the webhook path alike. */\n    boolean canGoTo(PaymentState next) { return NEXT.get(this).contains(next); }\n\n    /**\n     * How far along the payment this outcome is. CREATED, PENDING and UNKNOWN are not outcomes at all, so they rank\n     * zero: they say \"a call is in flight\", never \"this is what happened\". A webhook is applied only if its rank\n     * beats the highest rank the payment has ever reached, which is what makes duplicates and reordering free.\n     */\n    int outcomeRank() {\n        return switch (this) {\n            case CREATED, PENDING, UNKNOWN -> 0;\n            case AUTHORIZED, FAILED -> 1;\n            case CAPTURED -> 2;\n            case PARTIALLY_REFUNDED -> 3;\n            case REFUNDED -> 4;\n        };\n    }\n}\n\n/** A refund's life. UNKNOWN means the acquirer was called and never answered; the reservation stays until it does. */\nenum RefundState { PENDING, SUCCEEDED, FAILED, UNKNOWN }\n\n/** Where time comes from. Injected, so a test can put the clock anywhere it likes and move it. */\ninterface Clock { long nowMs(); }\n\n/** A rule refused this payment before anything was attempted. Nothing was charged and nothing was written. */\nclass PaymentRejected extends RuntimeException {\n    PaymentRejected(String reason) { super(reason); }\n}\n\n/**\n * The acquirer was called and never answered. THE dangerous failure: the money may or may not have moved, so the\n * payment becomes UNKNOWN, no second call is made and no other acquirer is tried. Only the status API settles it.\n */\nclass ProcessorTimeout extends RuntimeException {\n    ProcessorTimeout(String reason) { super(reason); }\n}\n\n/**\n * The call never left the building -- a refused connection, an open circuit, a rejected request. Nothing was\n * charged, so this one is safe: the claim is handed back and the next acquirer on the route is tried.\n */\nclass ProcessorUnavailable extends RuntimeException {\n    ProcessorUnavailable(String reason) { super(reason); }\n}\n\n/** What an acquirer says happened. NOT_FOUND is the status API's way of saying \"I never saw that request\". */\nenum Outcome { AUTHORIZED, CAPTURED, DECLINED, REFUNDED, NOT_FOUND }\n\n/** One answer from an acquirer: what happened, the acquirer's own reference, and why if it said no. */\nrecord ProcessorResult(Outcome outcome, String ref, String reason) {\n    /** A successful answer with the acquirer's reference on it. */\n    static ProcessorResult ok(Outcome o, String ref) { return new ProcessorResult(o, ref, \"\"); }\n    /** A refusal, with the acquirer's reason attached so the merchant can be told something useful. */\n    static ProcessorResult no(Outcome o, String reason) { return new ProcessorResult(o, \"\", reason); }\n}\n\n/**\n * One acquirer, behind our vocabulary. Every vendor speaks a different dialect; each implementation is the adapter\n * that translates exactly one of them, so the gateway never learns a vendor's names.\n *\n * The contract that matters: every call takes OUR idempotency key, so calling twice with the same key charges once\n * at their end too, and statusOf(key) answers what happened to it. That is what makes an UNKNOWN recoverable.\n */\ninterface PaymentProcessor {\n    /** The acquirer's name, used by routing and stored on the payment so a retry goes back to the same one. */\n    String name();\n    /** Can this acquirer take this method in this currency? Asked by routing, never by the payment flow. */\n    boolean supports(PaymentMethodType type, Currency currency);\n    /** What this acquirer charges, in basis points. 200 bp = 2%. Read by the fee policy and by cost-based routing. */\n    long feeBps();\n    /** True for rails with no auth/capture split (UPI): authorize() already moved the money. */\n    boolean capturesOnAuthorize();\n    /** Reserve the money. Throws ProcessorTimeout (unknown) or ProcessorUnavailable (nothing happened). */\n    ProcessorResult authorize(String idemKey, long paise, Currency currency, PaymentMethod method);\n    /** Move the reserved money. Same two failure modes, same meaning. */\n    ProcessorResult capture(String idemKey, String acquirerRef, long paise);\n    /** Send money back. Same two failure modes. */\n    ProcessorResult refund(String idemKey, String acquirerRef, long paise);\n    /** What happened to the request we sent under this key? The only honest way out of an UNKNOWN. */\n    ProcessorResult statusOf(String idemKey);\n}\n\n/** What the simulated vendor does next. A test sets it; a real HTTP client would simply succeed or fail. */\nenum VendorMode {\n    /** Everything works. */                                                           HEALTHY,\n    /** The acquirer says no (bad card, no funds). A business outcome, not a failure. */ DECLINE,\n    /** The connection is refused: nothing was charged, so failing over is safe. */      DOWN,\n    /** The acquirer did the work and then the socket died. The expensive one. */        TIMEOUT_CHARGED,\n    /** The request died before the acquirer saw it, and we cannot tell the difference. */ TIMEOUT_LOST\n}\n\n/**\n * A card acquirer, simulated. It remembers what it did per idempotency key, which is what a real acquirer does and\n * the reason we pass our own id down as the key: asking twice never charges twice, at either end.\n */\nclass CardAcquirer implements PaymentProcessor {\n    private final String name; private final long feeBps; private final EnumSet<Currency> currencies;\n    private final Map<String, ProcessorResult> byKey = new ConcurrentHashMap<>();\n    private final AtomicInteger calls = new AtomicInteger();\n    private volatile VendorMode mode = VendorMode.HEALTHY;\n\n    CardAcquirer(String name, long feeBps, Currency... currencies) {\n        this.name = name; this.feeBps = feeBps;\n        this.currencies = EnumSet.copyOf(Arrays.asList(currencies));\n    }\n    public String name() { return name; }\n    public long feeBps() { return feeBps; }\n    public boolean capturesOnAuthorize() { return false; }\n    public boolean supports(PaymentMethodType type, Currency c) {\n        return (type == PaymentMethodType.CARD || type == PaymentMethodType.NETBANKING) && currencies.contains(c);\n    }\n    /** Point the vendor at a failure mode. Tests only. */\n    void mode(VendorMode m) { mode = m; }\n    /** How many requests actually reached this vendor. The number the race test asserts on. */\n    int calls() { return calls.get(); }\n\n    public ProcessorResult authorize(String idemKey, long paise, Currency c, PaymentMethod method) {\n        return call(idemKey, Outcome.AUTHORIZED, \"declined by issuer\");\n    }\n    public ProcessorResult capture(String idemKey, String acquirerRef, long paise) {\n        return call(idemKey, Outcome.CAPTURED, \"capture refused: authorization expired\");\n    }\n    public ProcessorResult refund(String idemKey, String acquirerRef, long paise) {\n        return call(idemKey, Outcome.REFUNDED, \"refund refused by issuer\");\n    }\n    public ProcessorResult statusOf(String idemKey) {\n        ProcessorResult seen = byKey.get(idemKey);\n        return seen != null ? seen : ProcessorResult.no(Outcome.NOT_FOUND, name + \" never saw \" + idemKey);\n    }\n\n    /** One vendor round trip, with the vendor's own idempotency in front of it and the failure modes behind it. */\n    private ProcessorResult call(String idemKey, Outcome success, String declineReason) {\n        if (mode == VendorMode.DOWN) throw new ProcessorUnavailable(name + \" refused the connection\");\n        ProcessorResult seen = byKey.get(idemKey);\n        if (seen != null) return seen;                                  // the vendor's own idempotency, not ours\n        calls.incrementAndGet();\n        if (mode == VendorMode.TIMEOUT_LOST) throw new ProcessorTimeout(name + \" did not answer in 3000 ms\");\n        if (mode == VendorMode.DECLINE) {\n            ProcessorResult no = ProcessorResult.no(Outcome.DECLINED, declineReason);\n            byKey.put(idemKey, no); return no;\n        }\n        ProcessorResult yes = ProcessorResult.ok(success, name.toLowerCase() + \"_\" + idemKey);\n        byKey.put(idemKey, yes);                                        // the work is done...\n        if (mode == VendorMode.TIMEOUT_CHARGED) throw new ProcessorTimeout(name + \" did not answer in 3000 ms\");\n        return yes;                                                     // ...and only now do we get to hear about it\n    }\n}\n\n/**\n * A UPI switch. Different rail, different shape: there is no authorize-then-capture, the money moves in one step.\n * The gateway never learns this -- it asks capturesOnAuthorize() and the flow is otherwise identical.\n */\nclass UpiSwitch implements PaymentProcessor {\n    private final String name; private final long feeBps;\n    private final Map<String, ProcessorResult> byKey = new ConcurrentHashMap<>();\n    private final AtomicInteger calls = new AtomicInteger();\n    private volatile VendorMode mode = VendorMode.HEALTHY;\n\n    UpiSwitch(String name, long feeBps) { this.name = name; this.feeBps = feeBps; }\n    public String name() { return name; }\n    public long feeBps() { return feeBps; }\n    public boolean capturesOnAuthorize() { return true; }\n    public boolean supports(PaymentMethodType type, Currency c) { return type == PaymentMethodType.UPI && c == Currency.INR; }\n    /** Point the switch at a failure mode. Tests only. */\n    void mode(VendorMode m) { mode = m; }\n    /** How many requests actually reached this vendor. */\n    int calls() { return calls.get(); }\n\n    /** On UPI the collect request IS the capture, so this returns CAPTURED and there is nothing left to do. */\n    public ProcessorResult authorize(String idemKey, long paise, Currency c, PaymentMethod method) {\n        return collect(idemKey, Outcome.CAPTURED, \"collect request declined by the payer's bank\");\n    }\n    /** Already captured. Called only if someone captures a UPI payment by mistake; it is a no-op, not an error. */\n    public ProcessorResult capture(String idemKey, String acquirerRef, long paise) {\n        return ProcessorResult.ok(Outcome.CAPTURED, acquirerRef);\n    }\n    public ProcessorResult refund(String idemKey, String acquirerRef, long paise) {\n        return collect(idemKey, Outcome.REFUNDED, \"refund declined by the payer's bank\");\n    }\n    public ProcessorResult statusOf(String idemKey) {\n        ProcessorResult seen = byKey.get(idemKey);\n        return seen != null ? seen : ProcessorResult.no(Outcome.NOT_FOUND, name + \" never saw \" + idemKey);\n    }\n    private ProcessorResult collect(String idemKey, Outcome success, String declineReason) {\n        if (mode == VendorMode.DOWN) throw new ProcessorUnavailable(name + \" is not reachable\");\n        ProcessorResult seen = byKey.get(idemKey);\n        if (seen != null) return seen;\n        calls.incrementAndGet();\n        if (mode == VendorMode.TIMEOUT_LOST) throw new ProcessorTimeout(name + \" did not answer in 3000 ms\");\n        if (mode == VendorMode.DECLINE) {\n            ProcessorResult no = ProcessorResult.no(Outcome.DECLINED, declineReason);\n            byKey.put(idemKey, no); return no;\n        }\n        ProcessorResult yes = ProcessorResult.ok(success, name.toLowerCase() + \"_\" + idemKey);\n        byKey.put(idemKey, yes);\n        if (mode == VendorMode.TIMEOUT_CHARGED) throw new ProcessorTimeout(name + \" did not answer in 3000 ms\");\n        return yes;\n    }\n}\n\n/**\n * A circuit breaker wrapped around ANY acquirer. It is a PaymentProcessor that holds a PaymentProcessor, so a\n * vendor written next year gets breaking for free and no vendor adapter has ever heard of it.\n *\n * After `threshold` consecutive failures it trips: every call fails instantly as ProcessorUnavailable, which the\n * router reads as \"try the next one\". After the cool-off it lets one call through and closes on the first success.\n */\nclass CircuitBreaker implements PaymentProcessor {\n    private interface Call { ProcessorResult run(); }\n    private final PaymentProcessor inner; private final int threshold; private final long coolOffMs;\n    private final Clock clock;\n    private final AtomicInteger consecutiveFailures = new AtomicInteger();\n    private volatile long openedAtMs = 0;\n\n    CircuitBreaker(PaymentProcessor inner, int threshold, long coolOffMs, Clock clock) {\n        this.inner = inner; this.threshold = threshold; this.coolOffMs = coolOffMs; this.clock = clock;\n    }\n    /** The wrapped acquirer's own name, so routing and the stored processor name do not know the wrapper exists. */\n    public String name() { return inner.name(); }\n    public boolean supports(PaymentMethodType t, Currency c) { return inner.supports(t, c); }\n    public long feeBps() { return inner.feeBps(); }\n    public boolean capturesOnAuthorize() { return inner.capturesOnAuthorize(); }\n    public ProcessorResult authorize(String k, long paise, Currency c, PaymentMethod m) { return guard(() -> inner.authorize(k, paise, c, m)); }\n    public ProcessorResult capture(String k, String ref, long paise) { return guard(() -> inner.capture(k, ref, paise)); }\n    public ProcessorResult refund(String k, String ref, long paise) { return guard(() -> inner.refund(k, ref, paise)); }\n    public ProcessorResult statusOf(String k) { return inner.statusOf(k); }      // asking is always allowed\n    /** True while the breaker is open. Exposed for a health screen; the flow never asks. */\n    boolean open() {\n        if (openedAtMs == 0) return false;\n        if (clock.nowMs() - openedAtMs < coolOffMs) return true;\n        openedAtMs = 0; consecutiveFailures.set(0);                     // half-open: let the next call decide\n        return false;\n    }\n    private ProcessorResult guard(Call c) {\n        if (open()) throw new ProcessorUnavailable(inner.name() + \": circuit is open\");\n        try {\n            ProcessorResult r = c.run();\n            consecutiveFailures.set(0);\n            return r;\n        } catch (ProcessorUnavailable | ProcessorTimeout e) {\n            if (consecutiveFailures.incrementAndGet() >= threshold) openedAtMs = clock.nowMs();\n            throw e;\n        }\n    }\n}\n\n/**\n * Which acquirers may take this payment, best first. The whole list is returned rather than one acquirer, because\n * the tail of it IS the failover plan. Swapped live during an incident; the gateway never builds one.\n */\ninterface RoutingPolicy {\n    /** The acquirers that can take this payment, in the order they should be tried. Empty means nobody can. */\n    List<PaymentProcessor> route(PaymentMethodType type, Currency currency, long paise, List<PaymentProcessor> all);\n}\n\n/** Route by relationship: a preferred acquirer per method, then anyone else who supports it, as the failover tail. */\nclass PreferredRouting implements RoutingPolicy {\n    private final Map<PaymentMethodType, List<String>> preferred;\n    PreferredRouting(Map<PaymentMethodType, List<String>> preferred) {\n        this.preferred = new EnumMap<>(preferred);\n    }\n    public List<PaymentProcessor> route(PaymentMethodType type, Currency currency, long paise, List<PaymentProcessor> all) {\n        List<String> order = preferred.getOrDefault(type, List.of());\n        List<PaymentProcessor> able = new ArrayList<>();\n        for (PaymentProcessor p : all) if (p.supports(type, currency)) able.add(p);\n        able.sort(Comparator.comparingInt(p -> {\n            int i = order.indexOf(p.name());\n            return i < 0 ? order.size() : i;                            // unlisted acquirers sit at the back\n        }));\n        return able;\n    }\n}\n\n/** What we charge the merchant for this payment. The rule most likely to change on a Friday afternoon. */\ninterface FeePolicy {\n    /** The fee in paise, taken out of what the merchant is settled. Never taken out of what the customer pays. */\n    long feeFor(long paise, PaymentMethodType type, PaymentProcessor acquirer);\n}\n\n/** A flat paise charge plus the acquirer's own basis points. Integer arithmetic, rounded down. */\nclass BpsFee implements FeePolicy {\n    private final long flatPaise;\n    BpsFee(long flatPaise) { this.flatPaise = flatPaise; }\n    public long feeFor(long paise, PaymentMethodType type, PaymentProcessor acquirer) {\n        return flatPaise + Money.bps(paise, acquirer.feeBps());\n    }\n}\n\n/** When a failed acquirer call may be tried again on the next acquirer in the route. */\ninterface RetryPolicy {\n    /** True to try the next acquirer. Called with the number of acquirers tried so far and the failure. */\n    boolean retry(int attemptsSoFar, RuntimeException failure);\n}\n\n/**\n * The only safe retry policy: retry a call that provably never reached the acquirer, never one that timed out.\n * A timeout means the money may already have moved, and retrying it is how a customer gets charged twice.\n */\nclass RetrySafeFailuresOnly implements RetryPolicy {\n    private final int maxAttempts;\n    RetrySafeFailuresOnly(int maxAttempts) { this.maxAttempts = maxAttempts; }\n    public boolean retry(int attemptsSoFar, RuntimeException failure) {\n        return failure instanceof ProcessorUnavailable && attemptsSoFar < maxAttempts;\n    }\n}\n\n/** One check run before a payment is attempted. It may read anything; it must write nothing. Refuses by throwing. */\ninterface RiskRule {\n    /** Throw PaymentRejected to refuse. Runs outside every lock, before a single acquirer is called. */\n    void check(String merchantId, long paise, PaymentMethod method, long nowMs);\n}\n\n/** A ceiling per method: cards over the cap need a step-up, which is a follow-up, so today they are refused. */\nclass AmountCapRule implements RiskRule {\n    private final Map<PaymentMethodType, Long> caps;\n    AmountCapRule(Map<PaymentMethodType, Long> caps) { this.caps = new EnumMap<>(caps); }\n    public void check(String merchantId, long paise, PaymentMethod method, long nowMs) {\n        Long cap = caps.get(method.type());\n        if (cap != null && paise > cap)\n            throw new PaymentRejected(\"over the \" + method.type() + \" cap: \" + Money.fmt(paise) + \" > \" + Money.fmt(cap));\n    }\n}\n\n/** What happened to a payment, as a value. Listeners get this, never the Payment, so they cannot change it. */\nrecord PaymentEvent(String paymentId, String merchantId, PaymentState state, long paise, long capturedPaise,\n                    long refundedPaise, String acquirer, String reason, long atMs) {\n    @Override public String toString() {\n        return paymentId + \" \" + state + \" \" + Money.fmt(paise) + (acquirer.isEmpty() ? \"\" : \" via \" + acquirer)\n             + (reason.isEmpty() ? \"\" : \" (\" + reason + \")\");\n    }\n}\n\n/** Someone who wants to know a payment moved. Called AFTER every lock is released, never inside one. */\ninterface PaymentListener {\n    /** Told about every state change. Must not throw; if it does, the gateway swallows it and carries on. */\n    void onEvent(PaymentEvent e);\n}\n\n/** How a webhook actually leaves the building. Handed in so a test can make the network fail on demand. */\ninterface WebhookEndpoint {\n    /** True if the merchant's server accepted it. */\n    boolean post(String url, PaymentEvent e);\n}\n\n/**\n * The merchant's callback, with retries. Delivery is at-least-once: it retries a refused POST up to maxAttempts and\n * then gives up and counts it, because a merchant's slow server must never hold up a payment.\n */\nclass MerchantWebhook implements PaymentListener {\n    private final Map<String, String> urls = new ConcurrentHashMap<>();\n    private final WebhookEndpoint endpoint; private final int maxAttempts;\n    private final AtomicInteger delivered = new AtomicInteger(), dropped = new AtomicInteger();\n\n    MerchantWebhook(WebhookEndpoint endpoint, int maxAttempts) { this.endpoint = endpoint; this.maxAttempts = maxAttempts; }\n    /** Where this merchant wants to be called. Setup only. */\n    void register(Merchant m) { urls.put(m.id(), m.webhookUrl()); }\n    /** How many callbacks the merchants accepted. */\n    int delivered() { return delivered.get(); }\n    /** How many were given up on after maxAttempts. */\n    int dropped() { return dropped.get(); }\n\n    public void onEvent(PaymentEvent e) {\n        String url = urls.get(e.merchantId());\n        if (url == null) return;\n        for (int attempt = 1; attempt <= maxAttempts; attempt++) {\n            if (endpoint.post(url, e)) { delivered.incrementAndGet(); return; }\n        }\n        dropped.incrementAndGet();\n    }\n}\n\n/** The audit trail: every event, in order, appended and never edited. The cheapest listener there is. */\nclass AuditLog implements PaymentListener {\n    private final List<PaymentEvent> events = new CopyOnWriteArrayList<>();\n    public void onEvent(PaymentEvent e) { events.add(e); }\n    /** Every event ever seen, oldest first. */\n    List<PaymentEvent> events() { return List.copyOf(events); }\n    /** Every event for one payment, oldest first. O(n) over the log; a real one would be indexed. */\n    List<PaymentEvent> of(String paymentId) {\n        List<PaymentEvent> out = new ArrayList<>();\n        for (PaymentEvent e : events) if (e.paymentId().equals(paymentId)) out.add(e);\n        return out;\n    }\n}\n\n/** One attempt to send money back, linked to the payment it belongs to. A refund is a transaction, not a field. */\nclass Refund {\n    private final String id, idemKey, paymentId; private final long paise, createdMs;\n    private volatile RefundState state = RefundState.PENDING;\n    private volatile String acquirerRef = \"\", failureReason = \"\";\n\n    Refund(String id, String idemKey, String paymentId, long paise, long createdMs) {\n        this.id = id; this.idemKey = idemKey; this.paymentId = paymentId; this.paise = paise; this.createdMs = createdMs;\n    }\n    String id() { return id; }\n    String idemKey() { return idemKey; }\n    String paymentId() { return paymentId; }\n    long paise() { return paise; }\n    long createdMs() { return createdMs; }\n    RefundState state() { return state; }\n    String acquirerRef() { return acquirerRef; }\n    String failureReason() { return failureReason; }\n    /** The acquirer sent the money back. */\n    void succeed(String ref) { this.acquirerRef = ref; this.state = RefundState.SUCCEEDED; }\n    /** Refused, and the payment's reservation has been handed back. */\n    void fail(String reason) { this.failureReason = reason; this.state = RefundState.FAILED; }\n    /** The acquirer never answered. The reservation STAYS held until the status query settles it. */\n    void unknown(String reason) { this.failureReason = reason; this.state = RefundState.UNKNOWN; }\n    @Override public String toString() {\n        return id + \" \" + Money.fmt(paise) + \" of \" + paymentId + \" \" + state\n             + (failureReason.isEmpty() ? \"\" : \" (\" + failureReason + \")\");\n    }\n}\n\n/**\n * One payment, and the only thing in the system that may change a payment's state. It owns its state, its money\n * and its OWN lock: two payments never wait for each other, and the same payment's fifty retries are serialised\n * for half a microsecond each.\n *\n * The lock is private and every method here takes it and gives it back before returning. That is deliberate: the\n * flow in PaymentService cannot hold a lock across a network call because it is never handed one.\n */\nclass Payment {\n    private final String id, idemKey, merchantId;\n    private final long paise; private final Currency currency; private final PaymentMethod method;\n    private final long createdMs;\n    private final ReentrantLock lock = new ReentrantLock();\n\n    private PaymentState state = PaymentState.CREATED;   // guarded by lock\n    private PaymentState claimedFrom = PaymentState.CREATED;  // guarded by lock: what the in-flight claim came from\n    private int rankReached = 0;                         // guarded by lock: only ever grows\n    private String acquirer = \"\", acquirerRef = \"\", inFlightKey = \"\", reason = \"\";   // guarded by lock\n    private long feePaise, capturedPaise, refundedPaise, refundReservedPaise, lastChangeMs;  // guarded by lock\n\n    Payment(String id, String idemKey, String merchantId, long paise, Currency currency, PaymentMethod method, long createdMs) {\

ht=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per payment: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the locked part of a payment: ~5 field operations, about 0.4 us</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a payment takes it twice: the claim and the record, 0.8 us in all</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a busy Indian gateway: 2,000 payments a second at a sale peak</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">no two payments share a lock, so that is 2,000 separate locks</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">contention is per payment: 50 retries of ONE key, ~20 us total</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1  keep the acquirer call outside the lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: no lock ever spans the wire</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2  swap the lock for one AtomicReference CAS</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the same claim; the losers fail in nanoseconds</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3  beyond one process: the row is the lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE ... WHERE state = ?, plus a unique index on the key</text></g><text x=\"615\" y=\"222\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">the design that fails is the one that holds a lock AROUND the 250 ms call: that caps the whole gateway at four payments a second</text></svg></div><div class=\"move\"><p>A busy Indian gateway at a sale peak takes two thousand payments a second. Each takes its own payment's lock twice &mdash; once to claim, once to record &mdash; for about four hundred nanoseconds a time, and no two payments share a lock, so that is two thousand independent locks each busy for under a microsecond. The only contention that exists is the retry storm on one payment: fifty threads, twenty microseconds in all, and forty-nine of them never reach the lock because they lost the idempotency key first. Now say the number that matters most, by contrast: a lock held <i>around</i> the two-hundred-and-fifty-millisecond acquirer call would cap the entire gateway at four payments a second, and preventing exactly that is why this move exists. The ladder is in the picture; the rung worth explaining is the last one, where the row itself becomes the lock &mdash; <code>UPDATE payments SET state = 'PENDING' WHERE id = ? AND state = 'CREATED'</code> updates one row or none, which is the same compare-and-set, and a unique index on the idempotency key does what <code>putIfAbsent</code> does today.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 385\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the same request arrives fifty times</text></g><path d=\"M370 37 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 18)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one putIfAbsent on the key; test 1: fifty threads, one charge</text></g><g transform=\"translate(30 60)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the acquirer never answers</text></g><path d=\"M370 79 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 60)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">UNKNOWN, no retry, no failover; test 2: one call, nothing captured</text></g><g transform=\"translate(30 102)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">and nobody ever closes that payment</text></g><path d=\"M370 121 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 102)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">statusOf on the exact key we sent; test 3: it resolves both ways</text></g><g transform=\"translate(30 144)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a refund larger than the capture</text></g><path d=\"M370 163 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 144)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reserve under the lock; test 4: refused, and it reserves nothing</text></g><g transform=\"translate(30 186)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two refunds decided from one read</text></g><path d=\"M370 205 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 186)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reserve-then-settle; test 5: twenty threads, exactly ten win</text></g><g transform=\"translate(30 228)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a webhook arrives late, and twice</text></g><path d=\"M370 247 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 228)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the rank and the legality table; test 6: both are dropped</text></g><g transform=\"translate(30 270)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the primary acquirer is unreachable</text></g><path d=\"M370 289 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 270)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">fail over, but never after a timeout; test 7: the backup takes it</text></g><g transform=\"translate(30 312)\"><rect width=\"340\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"170.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the merchant's endpoint is down</text></g><path d=\"M370 331 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 312)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">publish after the unlock, in a try/catch; test 8: it still captures</text></g><text x=\"615\" y=\"372\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a failure test: FailureTests.java runs eight of them and must print ALL PASS</text></svg></div><div class=\"move\"><p>The picture is the list, and a design that cannot show its tests is only a claim. Three of the eight rows are where candidates are actually lost. A refund larger than what was captured must be refused <i>and</i> must reserve nothing, or the next honest refund is refused for a ghost. Two refunds decided from the same read must not both win: twenty threads refunding a hundred each against a thousand, and exactly ten may succeed. And the acquirer that never answers must be neither retried nor failed over, because either one is how a customer pays twice &mdash; the test asserts that exactly one call was made and that nothing was recorded as captured. Each row is a few lines in FailureTests.java, and the page you are reading refuses to build unless all eight of them pass.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 355\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"230\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"320\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"860\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"230\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface RoutingPolicy { List&lt;PaymentProcessor&gt; route(...); }</text><text x=\"860\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a cost-based route is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Adapter</text><text x=\"230\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">class CardAcquirer implements PaymentProcessor</text><text x=\"860\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">one vendor's dialect, translated in one file</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"230\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">new CircuitBreaker(acquirer, 3, 30_000, clock)</text><text x=\"860\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">a vendor written next year gets breaking free</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"230\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">publish(p) after the unlock, inside a try/catch</text><text x=\"860\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">the merchant hears; the payment never waits</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"230\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">PaymentState.canGoTo(next)  +  outcomeRank()</text><text x=\"860\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">a late webhook cannot rewind a payment</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Template Method</text><text x=\"230\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"320\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">the flow is one method; the rules are handed in</text><text x=\"860\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">subclassing the gateway is how it rots</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"230\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"320\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">the gateway is handed to its callers</text><text x=\"860\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh PaymentService</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"230\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">the method-to-acquirer list IS the registry</text><text x=\"860\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when acquirers come from config</text><rect x=\"20\" y=\"290\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"230\" y=\"309.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"320\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">a payment has five fields and all five are required</text><text x=\"860\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">it would be ceremony, not a design</text><text x=\"615\" y=\"340\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>The table is the answer; the paragraph is for the rows that get argued with. Decorator is the loudest name on this problem and the one to say first: <code>CircuitBreaker</code> is a processor that <i>holds</i> a processor, so \"stop sending traffic to a flapping acquirer\" reaches vendors written next year without touching one of them, and because the wrapper reports the wrapped acquirer's own <code>name()</code>, routing and the stored acquirer name never learn it exists. The four grey rows earn their place as much as the five white ones: naming a pattern you did <i>not</i> use is how you show you were choosing rather than decorating. Template Method earned nothing here because the flow is one method with its rules handed in, and subclassing a gateway to change routing is how gateways rot; Factory is \"not yet\" rather than \"no\", because the method-to-acquirer map is already the registry and it earns the name the day acquirers arrive as strings from configuration. Say them in the order the moves produced them, never as a list you memorised.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Payment guards its own state; the service sequences; an acquirer class translates one vendor</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">LeastCostRouting is a new file plus one line in configure(); pay() is untouched</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody asks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">the UPI switch captures on authorize and the flow never notices: it asks capturesOnAuthorize()</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">seven one-method interfaces: routing, fees, retries, risk, listener, webhook endpoint, clock</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; the implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">configure(...) and setClock(): a test hands in an acquirer that always times out</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>SOLID is not a list to recite; it is the check that the moves did their job, and the table is the whole answer. Two letters are worth defending out loud on this problem. I says keep interfaces small: seven of the eight here have exactly one method, so a fake for a test is a lambda &mdash; and the eighth, <code>PaymentProcessor</code>, has eight methods because a vendor is wide, which is worth saying rather than pretending otherwise. D says depend on interfaces and be handed the implementations, and the reason to care is not tidiness: it is that a test can hand this gateway an acquirer that takes the money and then times out, which is the one scenario you cannot produce any other way.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">cost-based routing, a new price</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind the interface plus one configure line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the ledger, the fraud desk, payouts</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more listener; the flow and the lock do not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">3-D Secure: an OTP in the middle</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more state and two rows in the transition table</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across items</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a merchant's daily refund cap</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the check and the writes inside the SAME lock: all or nothing</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">persist it; two servers</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the claim becomes a conditional UPDATE, the key a unique index</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE payments SET state = 'PENDING' WHERE id = ? AND state = 'CREATED'</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the Payment class, its lock and the eight tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (route by cost, a new price, a new risk check) is a new class behind an existing interface plus one line in configure. Someone new who wants to know (a double-entry ledger, a fraud desk, the payouts job) is one more listener, and the flow and the lock do not change. A new step in a life (3-D Secure, an OTP page between the request and the authorize) is one more state and two rows in the transition table. A new invariant across items (a merchant's daily refund cap) is the check and the writes inside the <i>same</i> lock, all or nothing. State that must outlive the process is the claim becoming a conditional <code>UPDATE</code>, the idempotency key becoming a unique index, and the merchant webhook becoming an outbox row written in the same transaction as the payment. For all five, the Payment class, its lock and the eight failure tests do not change &mdash; which is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 985\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M122. nchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"132.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PaymentProcessor</text><line x1=\"0\" y1=\"34\" x2=\"265\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">name() / feeBps()</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">supports(type, currency)</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--text)\">capturesOnAuthorize()</text><text x=\"8\" y=\"95\" font-size=\"11.5\" fill=\"var(--text)\">authorize(key, paise, cur, m)</text><text x=\"8\" y=\"111\" font-size=\"11.5\" fill=\"var(--text)\">capture / refund(key, ref, p)</text><text x=\"8\" y=\"127\" font-size=\"11.5\" fill=\"var(--text)\">statusOf(key): Result</text></g><g transform=\"translate(955 175)\"><rect width=\"265\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CardAcquirer</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">byKey: the vendor's own</text><line x1=\"0\" y1=\"48\" x2=\"265\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">authorize: AUTHORIZED</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">capture: CAPTURED</text></g><g transform=\"translate(955 286)\"><rect width=\"265\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">UpiSwitch</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">authorize: CAPTURED</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">capturesOnAuthorize = true</text></g><g transform=\"translate(955 377)\"><rect width=\"265\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CircuitBreaker</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">inner: PaymentProcessor</text><line x1=\"0\" y1=\"48\" x2=\"265\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">trips after n failures</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">then ProcessorUnavailable</text></g><g transform=\"translate(955 490)\"><rect width=\"265\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"132.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"132.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RoutingPolicy</text><line x1=\"0\" y1=\"34\" x2=\"265\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">route(type, cur, paise, all)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">  : List&lt;PaymentProcessor&gt;</text></g><g transform=\"translate(955 581)\"><rect width=\"265\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PreferredRouting</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">a preferred acquirer per method</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">the rest are the failover tail</text></g><g transform=\"translate(955 672)\"><rect width=\"265\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"132.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"132.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FeePolicy</text><line x1=\"0\" y1=\"34\" x2=\"265\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">feeFor(paise, type, acq)</text></g><g transform=\"translate(955 747)\"><rect width=\"265\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"132.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">BpsFee</text><line x1=\"0\" y1=\"26\" x2=\"265\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">flat + the acquirer's bps</text></g><g transform=\"translate(10 862)\"><rect width=\"225\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"112.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PaymentRejected</text><line x1=\"0\" y1=\"26\" x2=\"225\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">a rule said no:</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">nothing was tried</text></g><g transform=\"translate(285 862)\"><rect width=\"345\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"172.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ProcessorTimeout</text><line x1=\"0\" y1=\"26\" x2=\"345\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">no answer: the money MAY have moved</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">-> UNKNOWN, no retry, no failover</text></g><g transform=\"translate(665 862)\"><rect width=\"255\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"127.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ProcessorUnavailable</text><line x1=\"0\" y1=\"26\" x2=\"255\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">it never left the building</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">-> un-claim, try the next one</text></g><g transform=\"translate(955 862)\"><rect width=\"265\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"132.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"132.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">WebhookEndpoint</text><line x1=\"0\" y1=\"34\" x2=\"265\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">post(url, e): boolean  (a seam)</text></g><g><path d=\"M20 958L64 958\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"962\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 958L284 958\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"962\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 958L504 958\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"962\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 958L684 958\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"962\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 958L904 958\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"962\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the service owns every payment and every refund. Plain arrow = references. Dashed green = handed in through <code>configure()</code> or <code>setClock()</code>. Dotted blue = notifies. <b>The columns.</b> Left: everything the gateway is <i>given</i> &mdash; listeners, the risk rule, the retry rule, the clock. Centre: the aggregate root and what it owns. Right of centre: the enums and the value records, which hold no behaviour. Far right: the acquirers behind one port, plus the two rules that are about acquirers. <b>The bottom row</b> has no arrows because nobody owns it: three exceptions, which are how a call ends when it does not return a result, and the one seam the merchant's server sits behind. <code>ProcessorTimeout</code> and <code>ProcessorUnavailable</code> are the two most important types on this page &mdash; one means \"the money may have moved\", the other means \"it never left\" &mdash; and telling them apart is what stops a retry from charging twice. <code>VendorMode</code> is the only box that is not production code: it is the knob the two fake acquirers expose so a test can make one decline, go down, or take the money and then time out. <b>Where state lives:</b> <code>Payment</code> owns its state, its rank, its fee, its captured amount, its two refund counters and its own private lock &mdash; and it is the only class in the system that may change any of them. <code>PaymentService</code> owns the registries and the order of operations and nothing else; it holds no lock at all, which is why it cannot hold one across a network call. An acquirer holds no state of ours. Notice what is <i>not</i> here: no card number anywhere, because <code>PaymentMethod</code> carries a token; and no Fee class, because a fee is a number a rule computes and the payment stores.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does and what it guarantees; read only those first for the shape, then the bodies for the mechanics &mdash; and read <code>Payment.claim</code> and <code>Payment.settle</code> twice, because everything else on this page is arrangement. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (eight claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/** The currencies this gateway settles in. One currency per payment, always; FX is a follow-up, not a special case. */\nenum Currency { INR, USD }\n\n/** Exact money, in paise (a hundredth of a rupee). There is no double in this file; these helpers are the only boundary. */\nfinal class Money {\n    /** Parse &quot;1234.50&quot; into 123450 paise, exactly. Used at the edge (a form, a JSON body), never inside the arithmetic. */\n    static long rupees(String amount) { return new java.math.BigDecimal(amount).movePointRight(2).longValueExact(); }\n    /** Print 123450 paise as &quot;1234.50&quot;. Presentation only. */\n    static String fmt(long paise) {\n        String sign = paise &lt; 0 ? &quot;-&quot; : &quot;&quot;; long a = Math.abs(paise);\n        return sign + (a / 100) + &quot;.&quot; + String.format(&quot;%02d&quot;, a % 100);\n    }\n    /** Basis points of an amount: 200 bp = 2%. Integer arithmetic, rounded down, so a fee can never invent a paise. */\n    static long bps(long paise, long basisPoints) { return paise * basisPoints / 10_000; }\n}\n\n/** What the customer paid with. The gateway routes on this and logs it; it never branches on it to move money. */\nenum PaymentMethodType { CARD, UPI, NETBANKING }\n\n/**\n * The instrument, already tokenised. There is no card number anywhere in this file: the gateway holds a token the\n * vault gave it and a display string safe to print. That is the whole of PCI scope in one record.\n */\nrecord PaymentMethod(PaymentMethodType type, String token, String display) {\n    @Override public String toString() { return type + &quot; &quot; + display; }\n}\n\n/** Who is being paid. An id, a name and where to call back when something happens to one of their payments. */\nrecord Merchant(String id, String name, String webhookUrl) { }\n\n/**\n * A payment&#x27;s life, written down once as data instead of scattered as if-statements.\n *\n * Two things live here. canGoTo() is the legality table: capturing a declined payment is not a bug to catch later,\n * it is an edge that does not exist. outcomeRank() is the ordering: acquirer webhooks arrive late, twice and out of\n * order, so every outcome gets a rank and a report that does not beat the highest rank reached is dropped.\n */\nenum PaymentState {\n    CREATED, PENDING, AUTHORIZED, CAPTURED, PARTIALLY_REFUNDED, REFUNDED, FAILED, UNKNOWN;\n\n    private static final Map&lt;PaymentState, Set&lt;PaymentState&gt;&gt; NEXT = new EnumMap&lt;&gt;(PaymentState.class);\n    static {\n        NEXT.put(CREATED,            EnumSet.of(PENDING, FAILED));\n        // PENDING -&gt; CREATED and UNKNOWN -&gt; AUTHORIZED are the un-claim edges: the call provably never reached the\n        // acquirer, so the claim is handed back and the payment is exactly where it was.\n        NEXT.put(PENDING,            EnumSet.of(AUTHORIZED, CAPTURED, FAILED, UNKNOWN, CREATED));\n        NEXT.put(AUTHORIZED,         EnumSet.of(PENDING, CAPTURED, FAILED));\n        NEXT.put(UNKNOWN,            EnumSet.of(AUTHORIZED, CAPTURED, FAILED, CREATED));\n        NEXT.put(CAPTURED,           EnumSet.of(PARTIALLY_REFUNDED, REFUNDED));\n        NEXT.put(PARTIALLY_REFUNDED, EnumSet.of(PARTIALLY_REFUNDED, REFUNDED));\n        NEXT.put(REFUNDED,           EnumSet.noneOf(PaymentState.class));\n        NEXT.put(FAILED,             EnumSet.noneOf(PaymentState.class));\n    }\n\n    /** Is this move legal at all? Asked before every state change, by the response path and the webhook path alike. */\n    boolean canGoTo(PaymentState next) { return NEXT.get(this).contains(next); }\n\n    /**\n     * How far along the payment this outcome is. CREATED, PENDING and UNKNOWN are not outcomes at all, so they rank\n     * zero: they say &quot;a call is in flight&quot;, never &quot;this is what happened&quot;. A webhook is applied only if its rank\n     * beats the highest rank the payment has ever reached, which is what makes duplicates and reordering free.\n     */\n    int outcomeRank() {\n        return switch (this) {\n            case CREATED, PENDING, UNKNOWN -&gt; 0;\n            case AUTHORIZED, FAILED -&gt; 1;\n            case CAPTURED -&gt; 2;\n            case PARTIALLY_REFUNDED -&gt; 3;\n            case REFUNDED -&gt; 4;\n        };\n    }\n}\n\n/** A refund&#x27;s life. UNKNOWN means the acquirer was called and never answered; the reservation stays until it does. */\nenum RefundState { PENDING, SUCCEEDED, FAILED, UNKNOWN }\n\n/** Where time comes from. Injected, so a test can put the clock anywhere it likes and move it. */\ninterface Clock { long nowMs(); }\n\n/** A rule refused this payment before anything was attempted. Nothing was charged and nothing was written. */\nclass PaymentRejected extends RuntimeException {\n    PaymentRejected(String reason) { super(reason); }\n}\n\n/**\n * The acquirer was called and never answered. THE dangerous failure: the money may or may not have moved, so the\n * payment becomes UNKNOWN, no second call is made and no other acquirer is tried. Only the status API settles it.\n */\nclass ProcessorTimeout extends RuntimeException {\n    ProcessorTimeout(String reason) { super(reason); }\n}\n\n/**\n * The call never left the building -- a refused connection, an open circuit, a rejected request. Nothing was\n * charged, so this one is safe: the claim is handed back and the next acquirer on the route is tried.\n */\nclass ProcessorUnavailable extends RuntimeException {\n    ProcessorUnavailable(String reason) { super(reason); }\n}\n\n/** What an acquirer says happened. NOT_FOUND is the status API&#x27;s way of saying &quot;I never saw that request&quot;. */\nenum Outcome { AUTHORIZED, CAPTURED, DECLINED, REFUNDED, NOT_FOUND }\n\n/** One answer from an acquirer: what happened, the acquirer&#x27;s own reference, and why if it said no. */\nrecord ProcessorResult(Outcome outcome, String ref, String reason) {\n    /** A successful answer with the acquirer&#x27;s reference on it. */\n    static ProcessorResult ok(Outcome o, String ref) { return new ProcessorResult(o, ref, &quot;&quot;); }\n    /** A refusal, with the acquirer&#x27;s reason attached so the merchant can be told something useful. */\n    static ProcessorResult no(Outcome o, String reason) { return new ProcessorResult(o, &quot;&quot;, reason); }\n}\n\n/**\n * One acquirer, behind our vocabulary. Every vendor speaks a different dialect; each implementation is the adapter\n * that translates exactly one of them, so the gateway never learns a vendor&#x27;s names.\n *\n * The contract that matters: every call takes OUR idempotency key, so calling twice with the same key charges once\n * at their end too, and statusOf(key) answers what happened to it. That is what makes an UNKNOWN recoverable.\n */\ninterface PaymentProcessor {\n    /** The acquirer&#x27;s name, used by routing and stored on the payment so a retry goes back to the same one. */\n    String name();\n    /** Can this acquirer take this method in this currency? Asked by routing, never by the payment flow. */\n    boolean supports(PaymentMethodType type, Currency currency);\n    /** What this acquirer charges, in basis points. 200 bp = 2%. Read by the fee policy and by cost-based routing. */\n    long feeBps();\n    /** True for rails with no auth/capture split (UPI): authorize() already moved the money. */\n    boolean capturesOnAuthorize();\n    /** Reserve the money. Throws ProcessorTimeout (unknown) or ProcessorUnavailable (nothing happened). */\n    ProcessorResult authorize(String idemKey, long paise, Currency currency, PaymentMethod method);\n    /** Move the reserved money. Same two failure modes, same meaning. */\n    ProcessorResult capture(String idemKey, String acquirerRef, long paise);\n    /** Send money back. Same two failure modes. */\n    ProcessorResult refund(String idemKey, String acquirerRef, long paise);\n    /** What happened to the request we sent under this key? The only honest way out of an UNKNOWN. */\n    ProcessorResult statusOf(String idemKey);\n}\n\n/** What the simulated vendor does next. A test sets it; a real HTTP client would simply succeed or fail. */\nenum VendorMode {\n    /** Everything works. */                                                           HEALTHY,\n    /** The acquirer says no (bad card, no funds). A business outcome, not a failure. */ DECLINE,\n    /** The connection is refused: nothing was charged, so failing over is safe. */      DOWN,\n    /** The acquirer did the work and then the socket died. The expensive one. */        TIMEOUT_CHARGED,\n    /** The request died before the acquirer saw it, and we cannot tell the difference. */ TIMEOUT_LOST\n}\n\n/**\n * A card acquirer, simulated. It remembers what it did per idempotency key, which is what a real acquirer does and\n * the reason we pass our own id down as the key: asking twice never charges twice, at either end.\n */\nclass CardAcquirer implements PaymentProcessor {\n    private final String name; private final long feeBps; private final EnumSet&lt;Currency&gt; currencies;\n    private final Map&lt;String, ProcessorResult&gt; byKey = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicInteger calls = new AtomicInteger();\n    private volatile VendorMode mode = VendorMode.HEALTHY;\n\n    CardAcquirer(String name, long feeBps, Currency... currencies) {\n        this.name = name; this.feeBps = feeBps;\n        this.currencies = EnumSet.copyOf(Arrays.asList(currencies));\n    }\n    public String name() { return name; }\n    public long feeBps() { return feeBps; }\n    public boolean capturesOnAuthorize() { return false; }\n    public boolean supports(PaymentMethodType type, Currency c) {\n        return (type == PaymentMethodType.CARD || type == PaymentMethodType.NETBANKING) &amp;&amp; currencies.contains(c);\n    }\n    /** Point the vendor at a failure mode. Tests only. */\n    void mode(VendorMode m) { mode = m; }\n    /** How many requests actually reached this vendor. The number the race test asserts on. */\n    int calls() { return calls.get(); }\n\n    public ProcessorResult authorize(String idemKey, long paise, Currency c, PaymentMethod method) {\n        return call(idemKey, Outcome.AUTHORIZED, &quot;declined by issuer&quot;);\n    }\n    public ProcessorResult capture(String idemKey, String acquirerRef, long paise) {\n        return call(idemKey, Outcome.CAPTURED, &quot;capture refused: authorization expired&quot;);\n    }\n    public ProcessorResult refund(String idemKey, String acquirerRef, long paise) {\n        return call(idemKey, Outcome.REFUNDED, &quot;refund refused by issuer&quot;);\n    }\n    public ProcessorResult statusOf(String idemKey) {\n        ProcessorResult seen = byKey.get(idemKey);\n        return seen != null ? seen : ProcessorResult.no(Outcome.NOT_FOUND, name + &quot; never saw &quot; + idemKey);\n    }\n\n    /** One vendor round trip, with the vendor&#x27;s own idempotency in front of it and the failure modes behind it. */\n    private ProcessorResult call(String idemKey, Outcome success, String declineReason) {\n        if (mode == VendorMode.DOWN) throw new ProcessorUnavailable(name + &quot; refused the connection&quot;);\n        ProcessorResult seen = byKey.get(idemKey);\n        if (seen != null) return seen;                                  // the vendor&#x27;s own idempotency, not ours\n        calls.incrementAndGet();\n        if (mode == VendorMode.TIMEOUT_LOST) throw new ProcessorTimeout(name + &quot; did not answer in 3000 ms&quot;);\n        if (mode == VendorMode.DECLINE) {\n            ProcessorResult no = ProcessorResult.no(Outcome.DECLINED, declineReason);\n            byKey.put(idemKey, no); return no;\n        }\n        ProcessorResult yes = ProcessorResult.ok(success, name.toLowerCase() + &quot;_&quot; + idemKey);\n        byKey.put(idemKey, yes);                                        // the work is done...\n        if (mode == VendorMode.TIMEOUT_CHARGED) throw new ProcessorTimeout(name + &quot; did not answer in 3000 ms&quot;);\n        return yes;                                                     // ...and only now do we get to hear about it\n    }\n}\n\n/**\n * A UPI switch. Different rail, different shape: there is no authorize-then-capture, the money moves in one step.\n * The gateway never learns this -- it asks capturesOnAuthorize() and the flow is otherwise identical.\n */\nclass UpiSwitch implements PaymentProcessor {\n    private final String name; private final long feeBps;\n    private final Map&lt;String, ProcessorResult&gt; byKey = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicInteger calls = new AtomicInteger();\n    private volatile VendorMode mode = VendorMode.HEALTHY;\n\n    UpiSwitch(String name, long feeBps) { this.name = name; this.feeBps = feeBps; }\n    public String name() { return name; }\n    public long feeBps() { return feeBps; }\n    public boolean capturesOnAuthorize() { return true; }\n    public boolean supports(PaymentMethodType type, Currency c) { return type == PaymentMethodType.UPI &amp;&amp; c == Currency.INR; }\n    /** Point the switch at a failure mode. Tests only. */\n    void mode(VendorMode m) { mode = m; }\n    /** How many requests actually reached this vendor. */\n    int calls() { return calls.get(); }\n\n    /** On UPI the collect request IS the capture, so this returns CAPTURED and there is nothing left to do. */\n    public ProcessorResult authorize(String idemKey, long paise, Currency c, PaymentMethod method) {\n        return collect(idemKey, Outcome.CAPTURED, &quot;collect request declined by the payer&#x27;s bank&quot;);\n    }\n    /** Already captured. Called only if someone captures a UPI payment by mistake; it is a no-op, not an error. */\n    public ProcessorResult capture(String idemKey, String acquirerRef, long paise) {\n        return ProcessorResult.ok(Outcome.CAPTURED, acquirerRef);\n    }\n    public ProcessorResult refund(String idemKey, String acquirerRef, long paise) {\n        return collect(idemKey, Outcome.REFUNDED, &quot;refund declined by the payer&#x27;s bank&quot;);\n    }\n    public ProcessorResult statusOf(String idemKey) {\n        ProcessorResult seen = byKey.get(idemKey);\n        return seen != null ? seen : ProcessorResult.no(Outcome.NOT_FOUND, name + &quot; never saw &quot; + idemKey);\n    }\n    private ProcessorResult collect(String idemKey, Outcome success, String declineReason) {\n        if (mode == VendorMode.DOWN) throw new ProcessorUnavailable(name + &quot; is not reachable&quot;);\n        ProcessorResult seen = byKey.get(idemKey);\n        if (seen != null) return seen;\n        calls.incrementAndGet();\n        if (mode == VendorMode.TIMEOUT_LOST) throw new ProcessorTimeout(name + &quot; did not answer in 3000 ms&quot;);\n        if (mode == VendorMode.DECLINE) {\n            ProcessorResult no = ProcessorResult.no(Outcome.DECLINED, declineReason);\n            byKey.put(idemKey, no); return no;\n        }\n        ProcessorResult yes = ProcessorResult.ok(success, name.toLowerCase() + &quot;_&quot; + idemKey);\n        byKey.put(idemKey, yes);\n        if (mode == VendorMode.TIMEOUT_CHARGED) throw new ProcessorTimeout(name + &quot; did not answer in 3000 ms&quot;);\n        return yes;\n    }\n}\n\n/**\n * A circuit breaker wrapped around ANY acquirer. It is a PaymentProcessor that holds a PaymentProcessor, so a\n * vendor written next year gets breaking for free and no vendor adapter has ever heard of it.\n *\n * After `threshold` consecutive failures it trips: every call fails instantly as ProcessorUnavailable, which the\n * router reads as &quot;try the next one&quot;. After the cool-off it lets one call through and closes on the first success.\n */\nclass CircuitBreaker implements PaymentProcessor {\n    private interface Call { ProcessorResult run(); }\n    private final PaymentProcessor inner; private final int threshold; private final long coolOffMs;\n    private final Clock clock;\n    private final AtomicInteger consecutiveFailures = new AtomicInteger();\n    private volatile long openedAtMs = 0;\n\n    CircuitBreaker(PaymentProcessor inner, int threshold, long coolOffMs, Clock clock) {\n        this.inner = inner; this.threshold = threshold; this.coolOffMs = coolOffMs; this.clock = clock;\n    }\n    /** The wrapped acquirer&#x27;s own name, so routing and the stored processor name do not know the wrapper exists. */\n    public String name() { return inner.name(); }\n    public boolean supports(PaymentMethodType t, Currency c) { return inner.supports(t, c); }\n    public long feeBps() { return inner.feeBps(); }\n    public boolean capturesOnAuthorize() { return inner.capturesOnAuthorize(); }\n    public ProcessorResult authorize(String k, long paise, Currency c, PaymentMethod m) { return guard(() -&gt; inner.authorize(k, paise, c, m)); }\n    public ProcessorResult capture(String k, String ref, long paise) { return guard(() -&gt; inner.capture(k, ref, paise)); }\n    public ProcessorResult refund(String k, String ref, long paise) { return guard(() -&gt; inner.refund(k, ref, paise)); }\n    public ProcessorResult statusOf(String k) { return inner.statusOf(k); }      // asking is always allowed\n    /** True while the breaker is open. Exposed for a health screen; the flow never asks. */\n    boolean open() {\n        if (openedAtMs == 0) return false;\n        if (clock.nowMs() - openedAtMs &lt; coolOffMs) return true;\n        openedAtMs = 0; consecutiveFailures.set(0);                     // half-open: let the next call decide\n        return false;\n    }\n    private ProcessorResult guard(Call c) {\n        if (open()) throw new ProcessorUnavailable(inner.name() + &quot;: circuit is open&quot;);\n        try {\n            ProcessorResult r = c.run();\n            consecutiveFailures.set(0);\n            return r;\n        } catch (ProcessorUnavailable | ProcessorTimeout e) {\n            if (consecutiveFailures.incrementAndGet() &gt;= threshold) openedAtMs = clock.nowMs();\n            throw e;\n        }\n    }\n}\n\n/**\n * Which acquirers may take this payment, best first. The whole list is returned rather than one acquirer, because\n * the tail of it IS the failover plan. Swapped live during an incident; the gateway never builds one.\n */\ninterface RoutingPolicy {\n    /** The acquirers that can take this payment, in the order they should be tried. Empty means nobody can. */\n    List&lt;PaymentProcessor&gt; route(PaymentMethodType type, Currency currency, long paise, List&lt;PaymentProcessor&gt; all);\n}\n\n/** Route by relationship: a preferred acquirer per method, then anyone else who supports it, as the failover tail. */\nclass PreferredRouting implements RoutingPolicy {\n    private final Map&lt;PaymentMethodType, List&lt;String&gt;&gt; preferred;\n    PreferredRouting(Map&lt;PaymentMethodType, List&lt;String&gt;&gt; preferred) {\n        this.preferred = new EnumMap&lt;&gt;(preferred);\n    }\n    public List&lt;PaymentProcessor&gt; route(PaymentMethodType type, Currency currency, long paise, List&lt;PaymentProcessor&gt; all) {\n        List&lt;String&gt; order = preferred.getOrDefault(type, List.of());\n        List&lt;PaymentProcessor&gt; able = new ArrayList&lt;&gt;();\n        for (PaymentProcessor p : all) if (p.supports(type, currency)) able.add(p);\n        able.sort(Comparator.comparingInt(p -&gt; {\n            int i = order.indexOf(p.name());\n            return i &lt; 0 ? order.size() : i;                            // unlisted acquirers sit at the back\n        }));\n        return able;\n    }\n}\n\n/** What we charge the merchant for this payment. The rule most likely to change on a Friday afternoon. */\ninterface FeePolicy {\n    /** The fee in paise, taken out of what the merchant is settled. Never taken out of what the customer pays. */\n    long feeFor(long paise, PaymentMethodType type, PaymentProcessor acquirer);\n}\n\n/** A flat paise charge plus the acquirer&#x27;s own basis points. Integer arithmetic, rounded down. */\nclass BpsFee implements FeePolicy {\n    private final long flatPaise;\n    BpsFee(long flatPaise) { this.flatPaise = flatPaise; }\n    public long feeFor(long paise, PaymentMethodType type, PaymentProcessor acquirer) {\n        return flatPaise + Money.bps(paise, acquirer.feeBps());\n    }\n}\n\n/** When a failed acquirer call may be tried again on the next acquirer in the route. */\ninterface RetryPolicy {\n    /** True to try the next acquirer. Called with the number of acquirers tried so far and the failure. */\n    boolean retry(int attemptsSoFar, RuntimeException failure);\n}\n\n/**\n * The only safe retry policy: retry a call that provably never reached the acquirer, never one that timed out.\n * A timeout means the money may already have moved, and retrying it is how a customer gets charged twice.\n */\nclass RetrySafeFailuresOnly implements RetryPolicy {\n    private final int maxAttempts;\n    RetrySafeFailuresOnly(int maxAttempts) { this.maxAttempts = maxAttempts; }\n    public boolean retry(int attemptsSoFar, RuntimeException failure) {\n        return failure instanceof ProcessorUnavailable &amp;&amp; attemptsSoFar &lt; maxAttempts;\n    }\n}\n\n/** One check run before a payment is attempted. It may read anything; it must write nothing. Refuses by throwing. */\ninterface RiskRule {\n    /** Throw PaymentRejected to refuse. Runs outside every lock, before a single acquirer is called. */\n    void check(String merchantId, long paise, PaymentMethod method, long nowMs);\n}\n\n/** A ceiling per method: cards over the cap need a step-up, which is a follow-up, so today they are refused. */\nclass AmountCapRule implements RiskRule {\n    private final Map&lt;PaymentMethodType, Long&gt; caps;\n    AmountCapRule(Map&lt;PaymentMethodType, Long&gt; caps) { this.caps = new EnumMap&lt;&gt;(caps); }\n    public void check(String merchantId, long paise, PaymentMethod method, long nowMs) {\n        Long cap = caps.get(method.type());\n        if (cap != null &amp;&amp; paise &gt; cap)\n            throw new PaymentRejected(&quot;over the &quot; + method.type() + &quot; cap: &quot; + Money.fmt(paise) + &quot; &gt; &quot; + Money.fmt(cap));\n    }\n}\n\n/** What happened to a payment, as a value. Listeners get this, never the Payment, so they cannot change it. */\nrecord PaymentEvent(String paymentId, String merchantId, PaymentState state, long paise, long capturedPaise,\n                    long refundedPaise, String acquirer, String reason, long atMs) {\n    @Override public String toString() {\n        return paymentId + &quot; &quot; + state + &quot; &quot; + Money.fmt(paise) + (acquirer.isEmpty() ? &quot;&quot; : &quot; via &quot; + acquirer)\n             + (reason.isEmpty() ? &quot;&quot; : &quot; (&quot; + reason + &quot;)&quot;);\n    }\n}\n\n/** Someone who wants to know a payment moved. Called AFTER every lock is released, never inside one. */\ninterface PaymentListener {\n    /** Told about every state change. Must not throw; if it does, the gateway swallows it and carries on. */\n    void onEvent(PaymentEvent e);\n}\n\n/** How a webhook actually leaves the building. Handed in so a test can make the network fail on demand. */\ninterface WebhookEndpoint {\n    /** True if the merchant&#x27;s server accepted it. */\n    boolean post(String url, PaymentEvent e);\n}\n\n/**\n * The merchant&#x27;s callback, with retries. Delivery is at-least-once: it retries a refused POST up to maxAttempts and\n * then gives up and counts it, because a merchant&#x27;s slow server must never hold up a payment.\n */\nclass MerchantWebhook implements PaymentListener {\n    private final Map&lt;String, String&gt; urls = new ConcurrentHashMap&lt;&gt;();\n    private final WebhookEndpoint endpoint; private final int maxAttempts;\n    private final AtomicInteger delivered = new AtomicInteger(), dropped = new AtomicInteger();\n\n    MerchantWebhook(WebhookEndpoint endpoint, int maxAttempts) { this.endpoint = endpoint; this.maxAttempts = maxAttempts; }\n    /** Where this merchant wants to be called. Setup only. */\n    void register(Merchant m) { urls.put(m.id(), m.webhookUrl()); }\n    /** How many callbacks the merchants accepted. */\n    int delivered() { return delivered.get(); }\n    /** How many were given up on after maxAttempts. */\n    int dropped() { return dropped.get(); }\n\n    public void onEvent(PaymentEvent e) {\n        String url = urls.get(e.merchantId());\n        if (url == null) return;\n        for (int attempt = 1; attempt &lt;= maxAttempts; attempt++) {\n            if (endpoint.post(url, e)) { delivered.incrementAndGet(); return; }\n        }\n        dropped.incrementAndGet();\n    }\n}\n\n/** The audit trail: every event, in order, appended and never edited. The cheapest listener there is. */\nclass AuditLog implements PaymentListener {\n    private final List&lt;PaymentEvent&gt; events = new CopyOnWriteArrayList&lt;&gt;();\n    public void onEvent(PaymentEvent e) { events.add(e); }\n    /** Every event ever seen, oldest first. */\n    List&lt;PaymentEvent&gt; events() { return List.copyOf(events); }\n    /** Every event for one payment, oldest first. O(n) over the log; a real one would be indexed. */\n    List&lt;PaymentEvent&gt; of(String paymentId) {\n        List&lt;PaymentEvent&gt; out = new ArrayList&lt;&gt;();\n        for (PaymentEvent e : events) if (e.paymentId().equals(paymentId)) out.add(e);\n        return out;\n    }\n}\n\n/** One attempt to send money back, linked to the payment it belongs to. A refund is a transaction, not a field. */\nclass Refund {\n    private final String id, idemKey, paymentId; private final long paise, createdMs;\n    private volatile RefundState state = RefundState.PENDING;\n    private volatile String acquirerRef = &quot;&quot;, failureReason = &quot;&quot;;\n\n    Refund(String id, String idemKey, String paymentId, long paise, long createdMs) {\n        this.id = id; this.idemKey = idemKey; this.paymentId = paymentId; this.paise = paise; this.createdMs = createdMs;\n    }\n    String id() { return id; }\n    String idemKey() { return idemKey; }\n    String paymentId() { return paymentId; }\n    long paise() { return paise; }\n    long createdMs() { return createdMs; }\n    RefundState state() { return state; }\n    String acquirerRef() { return acquirerRef; }\n    String failureReason() { return failureReason; }\n    /** The acquirer sent the money back. */\n    void succeed(String ref) { this.acquirerRef = ref; this.state = RefundState.SUCCEEDED; }\n    /** Refused, and the payment&#x27;s reservation has been handed back. */\n    void fail(String reason) { this.failureReason = reason; this.state = RefundState.FAILED; }\n    /** The acquirer never answered. The reservation STAYS held until the status query settles it. */\n    void unknown(String reason) { this.failureReason = reason; this.state = RefundState.UNKNOWN; }\n    @Override public String toString() {\n        return id + &quot; &quot; + Money.fmt(paise) + &quot; of &quot; + paymentId + &quot; &quot; + state\n             + (failureReason.isEmpty() ? &quot;&quot; : &quot; (&quot; + failureReason + &quot;)&quot;);\n    }\n}\n\n/**\n * One payment, and the only thing in the system that may change a payment&#x27;s state. It owns its state, its money\n * and its OWN lock: two payments never wait for each other, and the same payment&#x27;s fifty retries are serialised\n * for half a microsecond each.\n *\n * The lock is private and every method here takes it and gives it back before returning. That is deliberate: the\n * flow in PaymentService cannot hold a lock across a network call because it is never handed one.\n */\nclass Payment {\n    private final String id, idemKey, merchantId;\n    private final long paise; private final Currency currency; private final PaymentMethod method;\n    private final long createdMs;\n    private final ReentrantLock lock = new ReentrantLock();\n\n    private PaymentState state = PaymentState.CREATED;   // guarded by lock\n    private PaymentState claimedFrom = PaymentState.CREATED;  // guarded by lock: what the in-flight claim came from\n    private int rankReached = 0;                         // guarded by lock: only ever grows\n    private String acquirer = &quot;&quot;, acquirerRef = &quot;&quot;, inFlightKey = &quot;&quot;, reason = &quot;&quot;;   // guarded by lock\n    private long feePaise, capturedPaise, refundedPaise, refundReservedPaise, lastChangeMs;  // guarded by lock\n\n    Payment(String id, String idemKey, String merchantId, long paise, Currency currency, PaymentMethod method, long createdMs) {\n        this.id = id; this.idemKey = idemKey; this.merchantId = merchantId; this.paise = paise;\n        this.currency = currency; this.method = method; this.createdMs = createdMs; this.lastChangeMs = createdMs;\n    }\n    String id() { return id; }\n    String idemKey() { return idemKey; }\n    String merchantId() { return merchantId; }\n    long paise() { return paise; }\n    Currency currency() { return currency; }\n    PaymentMethod method() { return method; }\n    long createdMs() { return createdMs; }\n\n    /** The state, read under the lock so nobody sees it half-written. O(1). */\n    PaymentState state() { lock.lock(); try { return state; } finally { lock.unlock(); } }\n    /** The acquirer that holds this payment. A capture or a refund must go back to the same one. */\n    String acquirer() { lock.lock(); try { return acquirer; } finally { lock.unlock(); } }\n    /** The acquirer&#x27;s own reference for this payment, needed by capture and refund. */\n    String acquirerRef() { lock.lock(); try { return acquirerRef; } finally { lock.unlock(); } }\n    /** The key the in-flight call was sent under. The status query asks about exactly this key. */\n    String inFlightKey() { lock.lock(); try { return inFlightKey; } finally { lock.unlock(); } }\n    /** What the in-flight claim moved away from, so a call that never happened can be un-claimed exactly. */\n    PaymentState claimedFrom() { lock.lock(); try { return claimedFrom; } finally { lock.unlock(); } }\n    /** Why it failed, or an empty string. */\n    String reason() { lock.lock(); try { return reason; } finally { lock.unlock(); } }\n    /** What we charge the merchant for this payment. */\n    long feePaise() { lock.lock(); try { return feePaise; } finally { lock.unlock(); } }\n    /** How much has actually moved. Zero until the payment is captured. */\n    long capturedPaise() { lock.lock(); try { return capturedPaise; } finally { lock.unlock(); } }\n    /** How much has been sent back and settled. */\n    long refundedPaise() { lock.lock(); try { return refundedPaise; } finally { lock.unlock(); } }\n    /** How much is promised to in-flight refunds but not yet settled. */\n    long refundReservedPaise() { lock.lock(); try { return refundReservedPaise; } finally { lock.unlock(); } }\n    /** What may still be refunded: captured minus settled minus reserved. The cap every refund is checked against. */\n    long refundablePaise() {\n        lock.lock();\n        try { return capturedPaise - refundedPaise - refundReservedPaise; } finally { lock.unlock(); }\n    }\n    /** When the state last changed. Used by the reconciliation job to find calls that have been in flight too long. */\n    long lastChangeMs() { lock.lock(); try { return lastChangeMs; } finally { lock.unlock(); } }\n\n    /**\n     * THE compare-and-set. Move from `expected` to `claimed` if and only if the payment is still in `expected`, and\n     * remember what we claimed from and under which key. Exactly one caller can win; everyone else gets false and\n     * opens no socket. This is the whole of &quot;the customer is charged once&quot;.\n     */\n    boolean claim(PaymentState expected, PaymentState claimed, String acquirerName, long fee, String callKey, long nowMs) {\n        lock.lock();\n        try {\n            if (state != expected || !state.canGoTo(claimed)) return false;\n            claimedFrom = state; state = claimed;\n            acquirer = acquirerName; feePaise = fee; inFlightKey = callKey; lastChangeMs = nowMs;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * The ONE method that records an outcome, used by the acquirer&#x27;s answer and by its webhook alike -- which is\n     * why an out-of-order webhook costs nothing. It applies only if the outcome is a legal next move AND its rank\n     * beats the highest rank this payment has reached. A duplicate, a late &quot;authorized&quot; after a capture and a\n     * replayed callback are all silently dropped. Returns true if anything changed.\n     */\n    boolean settle(PaymentState outcome, String ref, String why, long nowMs) {\n        lock.lock();\n        try {\n            if (outcome.outcomeRank() &lt;= rankReached) return false;      // a report of an older truth\n            if (!state.canGoTo(outcome)) return false;                   // an edge that does not exist\n            state = outcome; rankReached = outcome.outcomeRank(); lastChangeMs = nowMs;\n            if (!ref.isEmpty()) acquirerRef = ref;\n            reason = why;\n            if (outcome == PaymentState.CAPTURED) capturedPaise = paise;\n            claimedFrom = state; inFlightKey = &quot;&quot;;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * The call was made and never answered. The payment becomes UNKNOWN, the claim is NOT handed back (so nothing\n     * retries it blindly) and the rank is untouched (so the acquirer&#x27;s eventual webhook still counts). Only the\n     * status query or the reconciliation job may move it on from here.\n     */\n    boolean markUnknown(String why, long nowMs) {\n        lock.lock();\n        try {\n            if (!state.canGoTo(PaymentState.UNKNOWN)) return false;\n            state = PaymentState.UNKNOWN; reason = why; lastChangeMs = nowMs;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * Hand the claim back. Legal only when the call provably never reached the acquirer, or when the status query\n     * has confirmed it never happened: the payment returns to exactly the state it was claimed from.\n     */\n    boolean revertClaim(String why, long nowMs) {\n        lock.lock();\n        try {\n            if (!state.canGoTo(claimedFrom)) return false;\n            state = claimedFrom; reason = why; inFlightKey = &quot;&quot;; lastChangeMs = nowMs;\n            return true;\n        } finally { lock.unlock(); }\n    }\n\n    /**\n     * Promise this much of the captured money to a refund that is about to be attempted. The check and the write\n     * are one step under the lock, which is the point: two refunds decided from the same read would together\n     * exceed what was captured. Returns false if there is not enough left.\n     */\n    boolean reserveRefund(long amount) {\n        lock.lock();\n        try {\n            if (state != PaymentState.CAPTURED &amp;&amp; state != PaymentState.PARTIALLY_REFUNDED) return false;\n            if (amount &lt;= 0 || capturedPaise - refundedPaise - refundReservedPaise &lt; amount) return false;\n            refundReservedPaise += amount;\n            return true;\n        } finally { lock.unlock(); }\n    }\n    /** The refund was refused or never left: give the promise back so the money can be refunded by someone else. */\n    void releaseRefund(long amount) {\n        lock.lock();\n        try { refundReservedPaise -= amount; } finally { lock.unlock(); }\n    }\n    /** The acquirer sent it back: turn the promise into a fact and move the payment along its life. */\n    void settleRefund(long amount, long nowMs) {\n        lock.lock();\n        try {\n            refundReservedPaise -= amount; refundedPaise += amount; lastChangeMs = nowMs;\n            PaymentState next = refundedPaise &gt;= capturedPaise ? PaymentState.REFUNDED : PaymentState.PARTIALLY_REFUNDED;\n            if (state.canGoTo(next)) { state = next; rankReached = Math.max(rankReached, next.outcomeRank()); }\n        } finally { lock.unlock(); }\n    }\n\n    @Override public String toString() {\n        lock.lock();\n        try {\n            return id + &quot; &quot; + Money.fmt(paise) + &quot; &quot; + currency + &quot; &quot; + method + &quot; &quot; + state\n                 + (acquirer.isEmpty() ? &quot;&quot; :

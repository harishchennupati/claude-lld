.k{color:#c792ea} .s{color:#c3e88d} .c{color:#5c6773;font-style:italic} .n{color:#f78c6c} .t{color:#82aaff}
.nav{display:flex;gap:10px;padding:0 22px 24px} .nav button{background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit} .nav button.pri{background:var(--acc);color:#04211a;border-color:var(--acc);font-weight:600}

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design a payment gateway. A merchant server sends us an amount, a payment method and an idempotency key; we pick an acquirer, authorize, capture, and later refund. Retries, timeouts and out-of-order callbacks are the normal case, not the edge case. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>A shopper taps Pay. The merchant's server calls us with an amount, a card or a UPI handle, and a key of their own choosing so they can call us again safely. We pick an acquirer &mdash; the bank or switch that actually moves the money &mdash; and ask it to authorize, which only reserves the money; a later capture is what moves it. Afterwards the merchant may refund some or all of what was captured. Everything interesting happens because the acquirer is a computer somewhere else: it takes a quarter of a second to answer, it sometimes answers twice, it sometimes answers through a webhook an hour later, and it sometimes takes the money and never answers at all. The one thing that must always be true is that a customer is charged exactly once per request and never refunded more than was taken; and the one state nobody wants to write down &mdash; \"I called them and I do not know what happened\" &mdash; is the state that makes that possible.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that pays, captures, refunds and then runs a retry storm. The interviewer is watching for, in this order: the questions you ask before typing (the money type and auth-versus-capture are the first two); which classes exist and which one owns a payment's state; a payment end to end; what happens when fifty retries of one request arrive at the same instant; where the rules that will change (routing, fees, retries, risk) live, so a new acquirer is a new class and not an edit; what happens when the acquirer never answers &mdash; that single question separates this round from every other LLD. Then the twists: 3-D Secure, partial capture, chargebacks, settlement, tokenisation, persistence.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"55\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">pay</text><g transform=\"translate(175 24)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">claim the key</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one putIfAbsent: one attempt</text></g><path d=\"M415 51 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 24)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">claim the payment</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">CREATED to PENDING, under its lock</text></g><path d=\"M675 51 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 24)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">call the acquirer</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">outside the lock, with a timeout</text></g><path d=\"M935 51 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 24)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">record what it said</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">AUTHORIZED / CAPTURED / UNKNOWN</text></g><text x=\"88\" y=\"171\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">capture</text><g transform=\"translate(175 140)\"><rect width=\"330\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">claim it again</text><text x=\"165.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">AUTHORIZED to PENDING, the same lock</text></g><path d=\"M505 167 H525\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(525 140)\"><rect width=\"330\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">call the acquirer</text><text x=\"165.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">outside the lock, with a timeout</text></g><path d=\"M855 167 H875\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(875 140)\"><rect width=\"330\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CAPTURED, or the claim back</text><text x=\"165.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a refused capture keeps the hold</text></g><text x=\"88\" y=\"235\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">refund</text><g transform=\"translate(175 204)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is left to refund?</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">captured - refunded - reserved</text></g><path d=\"M415 231 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 204)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reserve it</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the check and the write, one step</text></g><path d=\"M675 231 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 204)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">call the acquirer</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">outside the lock, again</text></g><path d=\"M935 231 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 204)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">turn it into a fact</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">PARTIALLY_REFUNDED or REFUNDED</text></g><text x=\"88\" y=\"299\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">late news</text><g transform=\"translate(175 268)\"><rect width=\"330\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a webhook, or the status query</text><text x=\"165.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">about the exact key we sent</text></g><path d=\"M505 295 H525\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(525 268)\"><rect width=\"330\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is it legal, and is it news?</text><text x=\"165.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the transition table, then the rank</text></g><path d=\"M855 295 H875\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(875 268)\"><rect width=\"330\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">apply it once, or drop it</text><text x=\"165.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a duplicate changes nothing</text></g><path d=\"M555 78 V88\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(355 88)\"><rect width=\"450\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"225.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">declined or unknown: nothing is recorded as captured</text></g><text x=\"88\" y=\"352\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"352\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment: what is payment pay_1?   what did this merchant take today?   whose outcome do we still not know?</text><text x=\"615\" y=\"384\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">fifty retries of the same request land at once: the acquirer must be called exactly once, and nothing may be written as captured before it answers</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Am I the gateway routing to acquirers, or the acquirer itself?</td><td>The gateway; acquirers are outbound</td><td><code>PaymentProcessor</code> is a port with adapters, not the thing I build (moves 1, 3)</td></tr><tr><td>How is money represented, and one currency or many?</td><td>Integer paise plus a currency; one per payment</td><td><code>long</code>, never <code>double</code>; no currency ever mixes (move 1)</td></tr><tr><td>Auth then capture, or one shot? Partial captures?</td><td>Auth then capture; full capture for now</td><td>Two states rather than one boolean, and a claim before each call (moves 6, 12)</td></tr><tr><td>Who supplies the idempotency key, and what does a repeat mean?</td><td>The merchant; a repeat returns the first answer</td><td>One <code>putIfAbsent</code> is the whole retry story (moves 4, 5)</td></tr><tr><td>When the acquirer times out, may I call it again?</td><td>No &mdash; ask its status API instead</td><td>An UNKNOWN state and a reconciliation job (moves 6, 9)</td></tr><tr><td>Do acquirers call us back, and can callbacks arrive out of order?</td><td>Yes, at least once, out of order</td><td>A rank on every outcome, checked before every write (moves 6, 5)</td></tr><tr><td>Refunds: partial, many of them, and who caps them?</td><td>Many partials, capped at what was captured</td><td>Reserve-then-settle rather than one counter (moves 4, 9)</td></tr><tr><td>One process and in memory, or a database and many servers?</td><td>One process, in memory</td><td>No repository yet; every guard has a SQL twin (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Take a payment: a merchant, an amount, a method and the merchant's idempotency key.</li>\n<li>Route it to an acquirer that supports the method and the currency, with a failover list behind it.</li>\n<li>Authorize, then capture &mdash; and collapse the two on rails that have no split (UPI).</li>\n<li>Refund a captured payment, in full or in slices, never more than was captured.</li>\n<li>Accept the acquirer's webhooks, which arrive late, twice and out of order.</li>\n<li>Resolve a payment whose outcome is unknown, by asking the acquirer about the exact request we sent.</li>\n<li>Tell the merchant what happened, and tell them again if their server was down.</li>\n<li>Read a payment by our id or by their key, and a merchant's settlement for the day.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Fifty retries of one request must produce exactly one charge at the acquirer.</li>\n<li>No lock is ever held across a network call, so a slow acquirer cannot queue the gateway.</li>\n<li>Money is exact: integer paise with a currency, never a double.</li>\n<li>Lookup by payment id and by idempotency key are O(1); nothing scans every payment.</li>\n<li>Routing, fees, retry and risk rules are swappable without editing the flow.</li>\n<li>Nothing half-done: a refusal or a timeout leaves the payment exactly as it was, and the caller can retry.</li>\n<li>In memory, one process, no database (say it; every guard here has an obvious SQL twin).</li></ul></div></div>\n<div class=\"move\"><h3>One morning, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:12  card, Rs.1,000</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">ord-1001 claims the key</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">HDFC authorizes: AUTHORIZED</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">fee 20.00 = 18.00 at 180 bp + 2.00</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">no money has moved yet</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:12  the phone retries</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the same key, 50 ms later</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">putIfAbsent loses: no second call</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the very same payment comes back</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">11:30  UPI, Rs.99</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">NPCI takes it, then times out</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">state UNKNOWN, not FAILED</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one row on the job's list</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">11:31  the job asks NPCI</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">statusOf(pay_5) says: captured</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the payment settles CAPTURED</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">asking is not a second charge</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> money is integer paise with a currency, never a double; the merchant's idempotency key decides everything, and a repeat of it returns the first answer whatever that answer was; authorize and capture are separate because card rails are; a timeout is not a failure, it is an unknown, and it is resolved by asking rather than by calling again; one process, in memory. Named as out of scope: 3-D Secure, partial capture, chargebacks, settlement files, tokenisation, persistence &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, Splitwise, BookMyShow) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On this problem moves 4 and 6 carry the round, because the irreversible step is somebody else's computer: everything here is about what you write down before you call it, and what you write down when it does not answer.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a MERCHANT takes a PAYMENT with a PAYMENT METHOD; an ACQUIRER moves the money; a REFUND sends some back; a WEBHOOK reports it late</text><g transform=\"translate(30 110)\"><rect width=\"170\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Payment</text><text x=\"85.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">amount, state, refunds</text></g><path d=\"M115.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(228 110)\"><rect width=\"180\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Refund</text><text x=\"90.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">its own amount and state</text></g><path d=\"M318.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(436 110)\"><rect width=\"210\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"105.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PaymentService</text><text x=\"105.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the registries and the flow</text></g><path d=\"M541.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(676 110)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Merchant</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an id and a URL</text></g><path d=\"M756.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(866 110)\"><rect width=\"170\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"85.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Acquirer</text><text x=\"85.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M951.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1056 110)\"><rect width=\"155\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"77.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Method</text><text x=\"77.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a token: a record</text></g><path d=\"M1133.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state that changes, so it becomes a class.   dashed = an id, a value, an interface, or a question answered by a method</text></svg></div><div class=\"move\"><p>Reading the paragraph again: a <b>merchant</b> takes a <b>payment</b> from a shopper with a <b>payment method</b>; an <b>acquirer</b> moves the money; a <b>refund</b> sends some of it back; a <b>webhook</b> reports what happened, late. A payment has an amount, a state, an acquirer, a fee and two refund counters, all of which change: a class, and the most important one on the page. A refund has its own amount and its own life, so it is a class too, not a number on the payment &mdash; you cannot audit a number. The service has the registries and the flow: a class. A merchant is an id, a name and a URL that never move, so it is a record. A payment method is a token and a display string, which is the whole of PCI scope: there is no card number anywhere in the code. And an acquirer has no state of ours at all &mdash; it is a connection to somebody else &mdash; so it is an interface with one adapter per vendor. Notice what is <i>not</i> a class: a fee. It is a number a rule computes, stored on the payment.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take a payment</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 46 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 24)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PaymentService (owns the registries)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 46 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">pay(key, merchant, amount, ...)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 80)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">claim the right to call</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 102 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 80)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Payment (owns its state and its lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 102 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 80)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">claim(CREATED, PENDING)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 136)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">move the money</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 158 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 136)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PaymentProcessor (owns the wire)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 158 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">authorize / capture / refund</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 192)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">send money back</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 214 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 192)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Payment (owns the two counters)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 214 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 192)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reserveRefund / settleRefund</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the flow touches state in two classes at once, so it goes to the one that owns both registries: PaymentService is the orchestrator</text><text x=\"615\" y=\"287\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and notice what is NOT a new verb: a capture. It is the same claim, the same call, the same record, one state further along</text></svg></div><div class=\"move\"><p>\"Take a payment\" touches the idempotency map, the payment registry and the merchant index, and only the service sees all three, so <code>pay(...)</code> is the orchestrator. \"Claim the right to call the acquirer\" touches exactly one payment's state, so it belongs to the payment: <code>claim(CREATED, PENDING)</code>. \"Move the money\" touches nothing of ours at all &mdash; it is somebody else's computer &mdash; so it belongs to the acquirer port: <code>authorize</code>, <code>capture</code>, <code>refund</code>. \"Send money back\" touches the payment's two refund counters, so <code>reserveRefund</code> and <code>settleRefund</code> live there. And notice what is not a new verb: a capture. It is the same claim, the same call and the same record, one state further along, which is why the code for it is nine lines and why a UPI payment that has no capture step does not need a special case.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 345\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 100)\"><rect width=\"220\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PaymentService</text><text x=\"110.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(...) hands them all in</text></g><path d=\"M250 145 H330 V46 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RoutingPolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who to call, and in what order</text></g><g transform=\"translate(760 24)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PreferredRouting / LeastCostRouting</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 46 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 145 H330 V100 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 78)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FeePolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what the merchant is charged</text></g><g transform=\"translate(760 78)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BpsFee: a flat paise plus basis points</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 100 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 145 H330 V154 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 132)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RetryPolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">when a failed call may be retried</text></g><g transform=\"translate(760 132)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RetrySafeFailuresOnly: never a timeout</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 154 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 145 H330 V208 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 186)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RiskRule</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">refuse before anything is tried</text></g><g transform=\"translate(760 186)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AmountCapRule / CardTestingRule</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 208 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 145 H330 V262 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 240)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PaymentListener</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who is told a payment moved</text></g><g transform=\"translate(760 240)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MerchantWebhook / AuditLog / the ledger</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 262 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"308\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the green dashed arrows = handed in. The gateway never builds a rule, so a new acquirer or a new price is a new class and one changed line</text><text x=\"615\" y=\"328\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one wrapper is not a rule at all: CircuitBreaker(acquirer) IS a PaymentProcessor holding a PaymentProcessor &mdash; that is where Decorator is born</text></svg></div><div class=\"move\"><p>Four things will change, and you can name them before they are asked. <i>Who to call</i>: today by relationship, tomorrow by cost, and during an incident by whoever is still up. <i>What we charge</i>: a flat fee plus basis points today, something else next quarter. <i>When a failed call may be tried again</i>: and getting this one wrong is how customers get charged twice. <i>What to refuse before we try at all</i>: an amount cap today, a card-testing rule the Monday after a bad weekend. Each becomes a one-method interface the gateway is <i>given</i> in <code>configure()</code> and never builds, which is <b>Strategy</b>. A gateway that announces \"this payment moved\" without knowing what a merchant's server is, is <b>Observer</b>. Each acquirer class translating one vendor's dialect into ours is <b>Adapter</b>. And the one that earns its place loudest here is <b>Decorator</b>: <code>CircuitBreaker</code> <i>is</i> a <code>PaymentProcessor</code> that <i>holds</i> a <code>PaymentProcessor</code>, so \"stop sending traffic to a flapping acquirer\" is a wrapper, not an edit in every vendor class. I do them; I do not announce them.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry #1</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads state = CREATED</text></g><g transform=\"translate(30 110)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry #2</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads state = CREATED</text></g><g transform=\"translate(350 70)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">pay_1.state</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">CREATED</text></g><path d=\"M220 52 H350 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M220 132 H350 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"285\" y=\"40\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"285\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"580\" y=\"20\" width=\"300\" height=\"140\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"730\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"730\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both read CREATED, both call</text><text x=\"730\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">the customer is charged twice</text><text x=\"730\" y=\"130\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: read and write as ONE step</text><g transform=\"translate(910 40)\"><rect width=\"290\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Payment.lock</text><text x=\"145.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">claim, then call, then record</text></g><text x=\"1055\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock is per PAYMENT, not per gateway:</text><text x=\"1055\" y=\"185\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two payments never wait for each other</text></svg></div><div class=\"move\"><p>A shopper's phone loses signal and retries. The merchant's queue redelivers. Their HTTP client times out at two seconds and fires again. Three threads read the payment as CREATED, all three believe they may call the acquirer, and the customer is charged three times &mdash; the single most common production incident in payments. So reading the state and writing it must be one step, in the class that owns it: the payment. There are two claims in front of two different gaps: <code>putIfAbsent</code> on the merchant's idempotency key decides which request is the request at all, and <code>claim(CREATED, PENDING)</code> decides which thread may open a socket. The lock is per <i>payment</i>, which is the whole trick: two payments never wait for each other, and the retries of one payment that do reach the lock are serialised for half a microsecond each. The same move covers refunds &mdash; the check \"is there enough left?\" and the write \"reserve it\" happen under one lock, before the acquirer is called.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 315\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"400\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">have I seen this idempotency key?</text><text x=\"200.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M430 40 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 20)\"><rect width=\"540\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;key, Payment&gt;.putIfAbsent</text><text x=\"270.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 40 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 20)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 64)\"><rect width=\"400\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is payment pay_1?</text><text x=\"200.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M430 84 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 64)\"><rect width=\"540\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;id, Payment&gt;</text><text x=\"270.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 84 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 64)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 108)\"><rect width=\"400\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what did this merchant take today?</text><text x=\"200.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M430 128 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 108)\"><rect width=\"540\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;merchantId, List&lt;Payment&gt;&gt;</text><text x=\"270.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 128 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 108)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) + O(k)</text></g><g transform=\"translate(30 152)\"><rect width=\"400\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">whose outcome do we not know?</text><text x=\"200.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M430 172 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 152)\"><rect width=\"540\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a Set&lt;id&gt;, written as it happens</text><text x=\"270.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 172 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 152)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(u), no scan</text></g><g transform=\"translate(30 196)\"><rect width=\"400\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">have I seen this refund key?</text><text x=\"200.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M430 216 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 196)\"><rect width=\"540\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;key, Refund&gt;</text><text x=\"270.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 216 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 196)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 240)\"><rect width=\"400\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is this move legal, and is it news?</text><text x=\"200.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M430 260 H460\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(460 240)\"><rect width=\"540\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an EnumMap of edges, plus a rank</text><text x=\"270.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M1000 260 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 240)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><text x=\"615\" y=\"300\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">nothing here ever re-reads the payments to answer a question, which is the mistake that makes a real gateway slow exactly when a sale starts</text></svg></div><div class=\"move\"><p>Three of those six rows are ordinary maps. Three are worth saying out loud. The idempotency key is not a lookup followed by a put &mdash; it is a single <code>putIfAbsent</code>, because a lookup followed by a put is the very race it was there to prevent. \"Whose outcome do we not know?\" is a set of ids written the moment a call times out, not a query run later: the moment you catch yourself planning to scan for unknown payments, the round is already lost, and this way the reconciliation job reads a handful of rows instead of every payment ever taken. And the two questions asked on every single write &mdash; is this move legal, and is this news or old news? &mdash; are an <code>EnumMap</code> of allowed edges and one integer rank per state: two array lookups and a comparison, with no branching and nothing to keep in sync.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 468\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(20 60)\"><rect width=\"130\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"65.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CREATED</text><text x=\"65.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nothing claimed</text></g><g transform=\"translate(185 60)\"><rect width=\"130\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"65.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PENDING</text><text x=\"65.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a call is out</text></g><g transform=\"translate(350 60)\"><rect width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AUTHORIZED</text><text x=\"75.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">money reserved</text></g><g transform=\"translate(535 60)\"><rect width=\"140\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CAPTURED</text><text x=\"70.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">money moved</text></g><g transform=\"translate(710 60)\"><rect width=\"200\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PARTIALLY_REFUNDED</text><text x=\"100.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">some sent back</text></g><g transform=\"translate(945 60)\"><rect width=\"140\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"70.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">REFUNDED</text><text x=\"70.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">all sent back</text></g><path d=\"M150 80 H185\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M315 80 H350\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M500 80 H535\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M675 80 H710\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M910 80 H945\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(185 140)\"><rect width=\"130\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"65.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">UNKNOWN</text><text x=\"65.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no answer</text></g><g transform=\"translate(350 140)\"><rect width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"75.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FAILED</text><text x=\"75.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">declined, or voided</text></g><path d=\"M250 100 V140\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M425 100 V140\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M315 160 H350\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M425 60 V34 H250 V60\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"355\" y=\"26\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">a capture claims it back to PENDING</text><path d=\"M215 60 V46 H85 V60\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"128\" y=\"40\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">un-claimed: the call never left</text><path d=\"M810 60 V38 H880 V60\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"845\" y=\"32\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">another partial</text><path d=\"M250 180 V205 H605 V100\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M515 205 V120 H500\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"430\" y=\"226\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">statusOf(the key we sent) settles it: CAPTURED, AUTHORIZED, or FAILED if the acquirer never saw it</text><rect x=\"20\" y=\"242\" width=\"1190\" height=\"212\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"266\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order when a payment is taken, and why it is exactly this order</text><text x=\"35\" y=\"290\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1  claim the idempotency key with one putIfAbsent -- nothing charged, and no retry can get past here</text><text x=\"35\" y=\"312\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2  risk rules, routing and pricing: pure, no lock, no network, nothing written</text><text x=\"35\" y=\"334\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3  take the payment's lock, move CREATED to PENDING, release it -- that is the claim</text><text x=\"35\" y=\"356\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4  call the acquirer OUTSIDE the lock, with a timeout: this is the irreversible step</text><text x=\"35\" y=\"378\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5  take the lock again and write what it said: AUTHORIZED, CAPTURED, FAILED -- or UNKNOWN if it never answered</text><text x=\"35\" y=\"400\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">6  release, then tell the merchant, in a try/catch, so a broken webhook cannot break a payment</text><text x=\"35\" y=\"422\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a timeout leaves a payment that says \"ask again\", never one that says \"paid\"; the status query and the job close it</text><text x=\"35\" y=\"444\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a refusal writes nothing at all, and the merchant's key is still theirs to retry with</text></svg></div><div class=\"move\"><p>A payment is CREATED when the key is claimed, PENDING while a call is out, AUTHORIZED when the money is reserved, CAPTURED when it moves, PARTIALLY_REFUNDED and then REFUNDED as it goes back, FAILED if it was refused &mdash; and UNKNOWN when we called and got nothing back. That last one is the state juniors leave out and the state the whole round is about. Two of the arrows point backwards, and they are the other two everyone forgets: a capture takes an AUTHORIZED payment back to PENDING while its call is out, and a call that provably never left the building hands the claim back to exactly where it started. That is why the rank is a second number and not the state itself &mdash; the state is allowed to move backwards, the rank never is, so a stale webhook still cannot rewind a payment that has moved on. Writing the machine down forces the order, and the order is this: claim the merchant's key with one <code>putIfAbsent</code>; run the risk rules and pick the route, which are pure and touch no lock; take the payment's lock just long enough to move CREATED to PENDING and let go; call the acquirer <i>outside</i> the lock with a timeout, because that is the irreversible step; take the lock again and write down what it said; release, then tell the merchant inside a try/catch. Nothing is ever recorded as captured before the acquirer says captured. A timeout therefore leaves a payment that says \"ask again\", which <code>statusOf(the key we sent)</code> can answer in either direction: it took the money, or it never saw the request.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one payment's calls happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"540\" height=\"132\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: about half a microsecond</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one EnumSet check: is this move legal?</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one rank compare: is this news, or old news?</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one enum write and three long writes</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">roughly five field operations, and that is all</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">the lock is per PAYMENT, never per gateway</text></g><path d=\"M570 86 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"605\" y=\"76\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"132\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: milliseconds to seconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the card authorize: about 250 ms</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the UPI collect: about 120 ms</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the merchant webhook: about 40 ms, after unlock</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the shopper typing an OTP: 20 seconds</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">the database write: about 5 ms (a follow-up)</text></g><text x=\"615\" y=\"176\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">fifty retries of one idempotency key at the same instant</text><g transform=\"translate(30 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wins the key</text></g><g transform=\"translate(148 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no socket</text></g><g transform=\"translate(266 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no socket</text></g><g transform=\"translate(384 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no socket</text></g><g transform=\"translate(502 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no socket</text></g><g transform=\"translate(620 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no socket</text></g><g transform=\"translate(738 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no socket</text></g><g transform=\"translate(856 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no socket</text></g><g transform=\"translate(974 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no socket</text></g><g transform=\"translate(1092 190)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">retry 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no socket</text></g><text x=\"615\" y=\"258\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">ten of the fifty drawn: the winner spends 250 ms on the network, the other forty-nine lose the putIfAbsent in about a hundred nanoseconds and open no socket at all</text><text x=\"615\" y=\"276\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one at a time is true, and it lasts half a microsecond, because nothing slow is ever allowed inside the lock</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself: if every payment takes a lock, is the gateway now a queue? It is, for about half a microsecond, and only for the retries of that one payment. Inside the lock there is one <code>EnumSet</code> membership check, one integer comparison against the rank reached, one enum write and three long writes: roughly five field operations. Everything slow is outside it, deliberately &mdash; the card authorize at about two hundred and fifty milliseconds, the UPI collect at a hundred and twenty, the merchant's webhook at forty, the shopper typing an OTP for twenty seconds. The lock is private to <code>Payment</code> and every method on that class takes it and gives it back before returning, which is not tidiness: it makes it <i>impossible</i> for the flow to hold a lock across the wire, because the flow is never handed one. So when fifty retries arrive at the same instant, one wins the key in about a hundred nanoseconds and forty-nine lose in about the same, having opened no socket at all.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 240\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeig

       // the leaky bucket as a meter: GCRA must agree with the token bucket on the burst\n        RateLimiter g = new RateLimiter();\n        ManualClock gc = new ManualClock(0);\n        g.configure(new Gcra(), new FlatRules(new Rule(10, 1_000L, 5)), gc);\n        int burst = 0;\n        while (g.allow(&quot;k&quot;).allowed()) burst++;\n        gc.advance(100);\n        System.out.println(&quot;gcra: burst admitted &quot; + burst + &quot;, one more after 100ms -&gt; &quot; + g.allow(&quot;k&quot;).allowed());\n\n        // credits: 5 a second, and up to 3 unused permits saved for a busy second\n        ManualClock cc = new ManualClock(0);\n        RateLimiter credits = new RateLimiter();\n        credits.configure(new CreditWindow(), new FlatRules(new Rule(5, 1_000L, 8)), cc);\n        int first = passed(credits, 10);                                 // a new key: 5 + a full bank of 3\n        cc.advance(1_000);\n        int busyAfterBusy = passed(credits, 10);                         // the last second saved nothing\n        cc.advance(2_000);\n        int afterQuiet = passed(credits, 10);                            // a quiet second saved 3\n        System.out.println(&quot;credits: first second &quot; + first + &quot;, busy after busy &quot; + busyAfterBusy\n                         + &quot;, busy after a quiet second &quot; + afterQuiet + &quot; (of 10 tried each time)&quot;);\n\n        // the hit counter: 4 threads, 100,000 hits in one second, counted in 300 slots\n        HitCounter hc = new HitCounter();\n        ExecutorService four = Executors.newFixedThreadPool(4);\n        for (int t = 0; t &lt; 4; t++) four.submit(() -&gt; { for (int i = 0; i &lt; 25_000; i++) hc.hit(100); });\n        four.shutdown();\n        four.awaitTermination(10, TimeUnit.SECONDS);\n        System.out.println(&quot;hit counter: at second 100 -&gt; &quot; + hc.getHits(100) + &quot;, at 399 -&gt; &quot; + hc.getHits(399)\n                         + &quot;, at 400 -&gt; &quot; + hc.getHits(400));\n    }\n\n    /** Try n calls on one key at the current instant and count the ones admitted. */\n    static int passed(Limiter limiter, int n) {\n        int ok = 0;\n        for (int i = 0; i &lt; n; i++) if (limiter.allow(&quot;acme&quot;, 1).allowed()) ok++;\n        return ok;\n    }\n\n    /** Fire n threads at one key at the same instant and count how many were admitted. */\n    static int hammer(Limiter limiter, int n) throws Exception {\n        CountDownLatch start = new CountDownLatch(1), done = new CountDownLatch(n);\n        AtomicInteger admitted = new AtomicInteger();\n        ExecutorService pool = Executors.newFixedThreadPool(32);\n        for (int i = 0; i &lt; n; i++) pool.submit(() -&gt; {\n            try { start.await(); if (limiter.allow(&quot;hot&quot;, 1).allowed()) admitted.incrementAndGet(); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            finally { done.countDown(); }\n        });\n        start.countDown();\n        done.await();\n        pool.shutdown();\n        return admitted.get();\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n/**\n * One targeted test per claim the design makes on page 02. Each block is a failure a reviewer found on some\n * rate limiter somewhere; all of them must now pass. Run: javac Main.java Extensions.java FailureTests.java\n * &amp;amp;&amp;amp; java FailureTests\n */\npublic class FailureTests {\n    static int failures = 0;\n    /** Print one claim and remember whether it held. */\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what);\n        if (!ok) failures++;\n    }\n    /** Try n calls of cost 1 on one key at the current instant; count the ones admitted. */\n    static int admitted(Limiter l, String key, int n) {\n        int ok = 0;\n        for (int i = 0; i &lt; n; i++) if (l.allow(key, 1).allowed()) ok++;\n        return ok;\n    }\n\n    public static void main(String[] args) throws Exception {\n\n        // 1. burst then refill, on an injected clock: no Thread.sleep anywhere in this suite\n        ManualClock clock = new ManualClock(0);\n        RateLimiter limiter = new RateLimiter();\n        limiter.configure(new TokenBucket(), new FlatRules(new Rule(5, 1_000L, 5)), clock);\n        int burst = 0;\n        for (int i = 0; i &lt; 5; i++) if (limiter.allow(&quot;acme&quot;).allowed()) burst++;\n        Decision sixth = limiter.allow(&quot;acme&quot;);\n        check(burst == 5, &quot;the burst of five is admitted&quot;);\n        check(!sixth.allowed(), &quot;the sixth call in the same millisecond is refused&quot;);\n        check(sixth.retryAfterMs() == 200, &quot;it is told to come back in &quot; + sixth.retryAfterMs() + &quot;ms, not to retry now&quot;);\n        clock.advance(200);\n        check(limiter.allow(&quot;acme&quot;).allowed(), &quot;200ms later exactly one permit exists, and it is granted&quot;);\n        check(!limiter.allow(&quot;acme&quot;).allowed(), &quot;and only one: the second call at that instant is refused&quot;);\n\n        // 2. the fixed window doubles the limit at the boundary; the sliding counter does not\n        ManualClock fw = new ManualClock(0);\n        RateLimiter fixed = new RateLimiter();\n        fixed.configure(new FixedWindow(), new FlatRules(new Rule(5, 1_000L, 5)), fw);\n        fw.advance(900);\n        int before = 0;\n        for (int i = 0; i &lt; 5; i++) if (fixed.allow(&quot;k&quot;).allowed()) before++;\n        fw.advance(100);                                    // the first millisecond of the next window\n        int after = 0;\n        for (int i = 0; i &lt; 5; i++) if (fixed.allow(&quot;k&quot;).allowed()) after++;\n        check(before + after == 10, &quot;fixed window: &quot; + (before + after) + &quot; calls in 100ms on a limit of 5 per second&quot;);\n\n        ManualClock sw = new ManualClock(0);\n        RateLimiter sliding = new RateLimiter();\n        sliding.configure(new SlidingWindowCounter(), new FlatRules(new Rule(5, 1_000L, 5)), sw);\n        sw.advance(900);\n        int sBefore = 0;\n        for (int i = 0; i &lt; 5; i++) if (sliding.allow(&quot;k&quot;).allowed()) sBefore++;\n        sw.advance(100);\n        int sAfter = 0;\n        for (int i = 0; i &lt; 5; i++) if (sliding.allow(&quot;k&quot;).allowed()) sAfter++;\n        check(sBefore == 5 &amp;&amp; sAfter == 0, &quot;sliding counter: &quot; + (sBefore + sAfter) + &quot; over the same boundary&quot;);\n\n        // 3. a hundred threads, one key, one instant: exactly the limit gets through\n        ManualClock frozen = new ManualClock(0);\n        RateLimiter hot = new RateLimiter();\n        hot.configure(new TokenBucket(), new FlatRules(new Rule(50, 1_000L, 50)), frozen);\n        CountDownLatch start = new CountDownLatch(1), done = new CountDownLatch(100);\n        AtomicInteger admitted = new AtomicInteger();\n        ExecutorService pool = Executors.newFixedThreadPool(32);\n        for (int i = 0; i &lt; 100; i++) pool.submit(() -&gt; {\n            try { start.await(); if (hot.allow(&quot;hot&quot;).allowed()) admitted.incrementAndGet(); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            finally { done.countDown(); }\n        });\n        start.countDown();\n        done.await();\n        pool.shutdown();\n        check(admitted.get() == 50, &quot;100 threads on one key, limit 50: exactly &quot; + admitted.get() + &quot; admitted&quot;);\n        check(hot.remaining(&quot;hot&quot;) == 0, &quot;and the bucket is empty afterwards, not negative&quot;);\n\n        // 4. a key nobody has seen starts with a full burst, and keys never share a budget\n        check(limiter.remaining(&quot;never-seen&quot;) == 5, &quot;an unknown key reports a full burst without being created&quot;);\n        check(limiter.size() == 1, &quot;and asking about it did not create a state for it&quot;);\n        RateLimiter two = new RateLimiter();\n        ManualClock tc = new ManualClock(0);\n        two.configure(new TokenBucket(), new FlatRules(new Rule(5, 1_000L, 5)), tc);\n        for (int i = 0; i &lt; 5; i++) two.allow(&quot;alice&quot;);\n        check(!two.allow(&quot;alice&quot;).allowed() &amp;&amp; two.allow(&quot;bob&quot;).allowed(), &quot;alice is out of permits; bob is untouched&quot;);\n\n        // 5. a clock that goes backwards must not mint permits\n        ManualClock back = new ManualClock(10_000);\n        RateLimiter b = new RateLimiter();\n        b.configure(new TokenBucket(), new FlatRules(new Rule(5, 1_000L, 5)), back);\n        for (int i = 0; i &lt; 5; i++) b.allow(&quot;k&quot;);\n        back.advance(-5_000);                               // NTP drags the wall clock back five seconds\n        check(!b.allow(&quot;k&quot;).allowed(), &quot;no permit is minted while the clock is behind&quot;);\n        back.advance(5_000);                                // and back to where it was\n        check(!b.allow(&quot;k&quot;).allowed(), &quot;and none is minted for the time the clock travelled twice&quot;);\n        back.advance(200);\n        check(b.allow(&quot;k&quot;).allowed(), &quot;real elapsed time still mints normally afterwards&quot;);\n\n        // 6. the sweeper drops only idle keys, and dropping one loses nothing\n        ManualClock sc = new ManualClock(0);\n        RateLimiter sweepable = new RateLimiter();\n        sweepable.configure(new TokenBucket(), new FlatRules(new Rule(5, 1_000L, 5)), sc);\n        for (int i = 0; i &lt; 5; i++) sweepable.allow(&quot;idle&quot;);\n        sc.advance(90_000);\n        sweepable.allow(&quot;live&quot;);\n        check(sweepable.sweepIdle(60_000) == 1 &amp;&amp; sweepable.size() == 1, &quot;the idle key is dropped, the live one is kept&quot;);\n        check(sweepable.remaining(&quot;idle&quot;) == 5, &quot;the dropped key is back at a full burst - which it had refilled to anyway&quot;);\n        check(sweepable.remaining(&quot;live&quot;) == 4, &quot;the live key kept the permit it spent&quot;);\n\n        // 7. a metrics listener that throws cannot break a decision\n        ManualClock oc = new ManualClock(0);\n        RateLimiter obs = new RateLimiter();\n        obs.configure(new TokenBucket(), new FlatRules(new Rule(3, 1_000L, 3)), oc);\n        obs.addObserver((k, d) -&gt; { throw new RuntimeException(&quot;the metrics sidecar is down&quot;); });\n        MetricsCounter good = new MetricsCounter();\n        obs.addObserver(good);\n        int through = 0;\n        for (int i = 0; i &lt; 5; i++) if (obs.allow(&quot;k&quot;).allowed()) through++;\n        check(through == 3, &quot;three admitted although the first listener throws on every call&quot;);\n        check(good.allowed() == 3 &amp;&amp; good.refused() == 2, &quot;and the listener after the broken one still heard all five&quot;);\n\n        // 8. permits are never minted: a refund stops at the burst, and a lowered burst clamps the bucket down\n        ManualClock rc = new ManualClock(0);\n        RateLimiter r = new RateLimiter();\n        r.configure(new TokenBucket(), new FlatRules(new Rule(5, 1_000L, 5)), rc);\n        for (int i = 0; i &lt; 5; i++) r.allow(&quot;k&quot;);\n        r.refund(&quot;k&quot;, 3);\n        check(r.remaining(&quot;k&quot;) == 3, &quot;three permits given back after three calls that never happened&quot;);\n        r.refund(&quot;k&quot;, 100);\n        check(r.remaining(&quot;k&quot;) == 5, &quot;a refund of a hundred still leaves the burst of five, not a hundred&quot;);\n        TierRules live = new TierRules(Rule.perMinute(600, 100));\n        RateLimiter sale = new RateLimiter();\n        sale.configure(new TokenBucket(), live, new ManualClock(0));\n        check(sale.allow(&quot;acme&quot;).remaining() == 99, &quot;a key on a 600-a-minute plan starts at a burst of 100&quot;);\n        live.setRule(Tier.FREE, Rule.perMinute(60, 10));    // ops lowers the plan while the process runs\n        check(sale.allow(&quot;acme&quot;).remaining() == 9, &quot;the burst drops to 10 on the next decision, and the held tokens drop with it&quot;);\n\n        // 9. the leaky bucket is not a different answer: GCRA admits exactly what the token bucket admits,\n        //    at 10 a second (100 ms a permit) and at 3 a second (333 1/3 ms, where any rounding would show)\n        for (Rule same : List.of(new Rule(10, 1_000L, 5), new Rule(3, 1_000L, 3))) {\n            ManualClock tbc = new ManualClock(0), gc = new ManualClock(0);\n            RateLimiter tb = new RateLimiter(), gcra = new RateLimiter();\n            tb.configure(new TokenBucket(), new FlatRules(same), tbc);\n            gcra.configure(new Gcra(), new FlatRules(same), gc);\n            StringBuilder tbRun = new StringBuilder(), gcraRun = new StringBuilder();\n            for (long jump : new long[] { 0, 100, 234, 332, 1, 1_000 }) {   // the clock jumps, then 8 calls at once\n                tbc.advance(jump); gc.advance(jump);\n                for (int i = 0; i &lt; 8; i++) {\n                    tbRun.append(tb.allow(&quot;k&quot;).allowed() ? &#x27;1&#x27; : &#x27;0&#x27;);\n                    gcraRun.append(gcra.allow(&quot;k&quot;).allowed() ? &#x27;1&#x27; : &#x27;0&#x27;);\n                }\n            }\n            check(tbRun.toString().equals(gcraRun.toString()), &quot;gcra admits the same calls as the token bucket at &quot;\n                  + same.permits() + &quot; a second: &quot; + tbRun + &quot; vs &quot; + gcraRun);\n        }\n\n        // 10. a call bigger than the whole bucket is refused for good; a refusal says what is really left\n        RateLimiter big = new RateLimiter();\n        big.configure(new TokenBucket(), new FlatRules(new Rule(5, 1_000L, 5)), new ManualClock(0));\n        Decision huge = big.allow(&quot;k&quot;, 6);\n        check(!huge.allowed() &amp;&amp; huge.retryAfterMs() == Decision.NEVER,\n              &quot;a call costing 6 on a burst of 5 is refused for good, not told to wait&quot;);\n        big.allow(&quot;k&quot;, 2);\n        Decision heavy = big.allow(&quot;k&quot;, 4);\n        check(!heavy.allowed() &amp;&amp; heavy.remaining() == 3, &quot;a refused call of 4 reports the 3 permits really left, not 0&quot;);\n\n        // 11. an unknown key answers what a new key would have, whatever the algorithm\n        RateLimiter perMin = new RateLimiter();\n        perMin.configure(new FixedWindow(), new FlatRules(Rule.perMinute(60, 10)), new ManualClock(0));\n        long unseen = perMin.remaining(&quot;never-seen&quot;);\n        perMin.allow(&quot;seen&quot;);\n        check(unseen == 60 &amp;&amp; perMin.remaining(&quot;seen&quot;) == 59, &quot;fixed window, 60 a minute: an unseen key has 60, not the burst of 10&quot;);\n\n        // 12. Retry-After is the shortest wait that works, for the sliding counter and for the log\n        ManualClock cc = new ManualClock(500);\n        RateLimiter counter = new RateLimiter();\n        counter.configure(new SlidingWindowCounter(), new FlatRules(new Rule(10, 1_000L, 10)), cc);\n        admitted(counter, &quot;k&quot;, 10);                                    // this window is full at 500 ms\n        long wait = counter.allow(&quot;k&quot;).retryAfterMs();\n        cc.advance(wait - 1);\n        boolean early = counter.allow(&quot;k&quot;).allowed();\n        cc.advance(1);\n        check(wait == 600 &amp;&amp; !early &amp;&amp; counter.allow(&quot;k&quot;).allowed(),\n              &quot;sliding counter: told to wait &quot; + wait + &quot;ms; 1ms sooner is refused, at &quot; + wait + &quot;ms it is admitted&quot;);\n        ManualClock lc = new ManualClock(0);\n        RateLimiter log = new RateLimiter();\n        log.configure(new SlidingWindowLog(), new FlatRules(new Rule(3, 1_000L, 3)), lc);\n        log.allow(&quot;k&quot;); lc.advance(100); log.allow(&quot;k&quot;); lc.advance(100); log.allow(&quot;k&quot;);   // stamps at 0, 100, 200\n        long waitTwo = log.allow(&quot;k&quot;, 2).retryAfterMs();               // a call of 2 needs the two oldest gone\n        lc.advance(waitTwo);\n        check(waitTwo == 900 &amp;&amp; log.allow(&quot;k&quot;, 2).allowed(), &quot;sliding log: a call costing 2 waits &quot; + waitTwo + &quot;ms, for the second-oldest stamp&quot;);\n\n        // 13. the sweeper deletes a key between a caller&#x27;s lookup and its lock: the caller&#x27;s permit is not lost\n        ManualClock rc2 = new ManualClock(0);\n        RateLimiter swept = new RateLimiter();\n        swept.configure(new TokenBucket(), new FlatRules(new Rule(5, 1_000L, 5)), rc2);\n        swept.allow(&quot;k&quot;);\n        rc2.advance(90_000);                                           // &quot;k&quot; has been idle for 90 s\n        KeyState old = swept.stateOf(&quot;k&quot;);\n        old.lock.lock();                                               // hold k&#x27;s lock, so the caller stops at it\n        Thread caller = new Thread(() -&gt; swept.allow(&quot;k&quot;));\n        caller.start();\n        long giveUp = System.nanoTime() + 5_000_000_000L;\n        while (!old.lock.hasQueuedThreads() &amp;&amp; System.nanoTime() &lt; giveUp) Thread.onSpinWait();   // it found k, waits\n        swept.sweepIdle(60_000);                                       // same thread, and the lock is re-entrant\n        old.lock.unlock();\n        caller.join();\n        check(swept.remaining(&quot;k&quot;) == 4, &quot;a key swept while a caller waited on its lock: the caller retried on a new state&quot;);\n\n        // 14. compare-and-set: a thread that read the clock before another thread&#x27;s swap mints nothing\n        ManualClock stale = new ManualClock(1_000);\n        CasBucket cas = new CasBucket(new Rule(5, 1_000L, 5), stale);\n        admitted(cas, &quot;k&quot;, 4);                                         // 1 left, measured at 1000 ms\n        stale.advance(-1_000);                                         // this caller&#x27;s clock reading is older\n        cas.allow(&quot;k&quot;, 1);                                             // it takes the last permit\n        stale.advance(1_000);                                          // back at 1000 ms: no real time has passed\n        check(admitted(cas, &quot;k&quot;, 5) == 0, &quot;compare-and-set bucket: a stale clock read does not move the bucket&#x27;s time back&quot;);\n\n        // 15. twelve pods, one Redis: time comes from the server, so a pod whose clock is wrong changes nothing\n        ManualClock server = new ManualClock(0);\n        RedisLike shared = new RedisLike(server);\n        Rule fleet = new Rule(5, 1_000L, 5);\n        Limiter podA = new RedisTokenBucket(shared, fleet), podB = new RedisTokenBucket(shared, fleet);\n        admitted(podA, &quot;acme&quot;, 5);\n        server.advance(200);                                           // one permit&#x27;s worth of real time\n        check(podB.allow(&quot;acme&quot;, 1).allowed() &amp;&amp; !podA.allow(&quot;acme&quot;, 1).allowed(),\n              &quot;Redis&#x27;s clock: 200ms later exactly one permit exists for the whole fleet, whichever pod asks&quot;);\n\n        // 16. credits (Atlassian&#x27;s follow-up): unused permits carry over, capped at burst - permits\n        ManualClock wc = new ManualClock(0);\n        RateLimiter credit = new RateLimiter();\n        credit.configure(new CreditWindow(), new FlatRules(new Rule(5, 1_000L, 8)), wc);   // 5 a second, 3 saved at most\n        int fresh = admitted(credit, &quot;k&quot;, 10);                         // a new key: 5 plus a full bank of 3\n        wc.advance(1_000);\n        int afterBusy = admitted(credit, &quot;k&quot;, 10);                     // the last second left nothing to save\n        wc.advance(2_000);\n        int afterQuiet = admitted(credit, &quot;k&quot;, 10);                    // a quiet second saved 5, capped at 3\n        check(fresh == 8 &amp;&amp; afterBusy == 5 &amp;&amp; afterQuiet == 8,\n              &quot;credits: &quot; + fresh + &quot; in a first second, &quot; + afterBusy + &quot; after a busy one, &quot; + afterQuiet + &quot; after a quiet one&quot;);\n\n        // 17. the hit counter: every hit from four threads counted, forgotten 300 s later, late hits dropped\n        HitCounter hc = new HitCounter();\n        Thread[] hitters = new Thread[4];\n        for (int t = 0; t &lt; 4; t++) { hitters[t] = new Thread(() -&gt; { for (int i = 0; i &lt; 25_000; i++) hc.hit(100); }); hitters[t].start(); }\n        for (Thread t : hitters) t.join();\n        check(hc.getHits(100) == 100_000 &amp;&amp; hc.getHits(399) == 100_000 &amp;&amp; hc.getHits(400) == 0,\n              &quot;hit counter: 100,000 hits from 4 threads all counted, and gone 300 s later&quot;);\n        hc.hit(400); hc.hit(100);                                      // 400 takes over slot 100; a late hit for 100\n        check(hc.getHits(400) == 1, &quot;a hit that arrives after its slot moved on is dropped, not added to the new second&quot;);\n\n        System.out.println(failures == 0 ? &quot;\\nALL PASS&quot; : &quot;\\n&quot; + failures + &quot; FAILED&quot;);\n        if (failures &gt; 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Build me a rate limiter. It sits in front of our API. Given a key (a tenant, an API key), it says whether this call may go through right now. And it has to be right when a hundred threads ask about the same key at the same instant. I want working code, not a diagram. Go.\"</div>Before typing, write your six clarifying questions. Then type in this order. The Clock interface, with a manual one for tests. The Rule and Decision records. KeyState with its own lock, holding just the tokens and the instant they were measured. The RateLimitAlgorithm interface, and TokenBucket behind it. RuleResolver with a flat implementation. RateLimiter: its map, the find-and-lock helper, and the charge-then-admit order in <code>allow</code>. The filter that turns a Decision into a 429. And a main that fires a hundred threads at one key on a frozen clock. That is the must-write core. The rest of Main.java (three window algorithms, tiers, observers, refund, the sweeper) is follow-up material: write it when they ask.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Ops doubles a tenant&#x27;s limit during a sale, and a new tenant must ramp up instead of starting at full speed. No restart.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The limits already live behind <code>RuleResolver</code>, so neither change opens the limiter. TierRules keeps each tier's rule in an AtomicReference (a holder whose value is swapped in one step), so <code>setRule</code> takes effect on the next decision and never in the middle of one. That is why <code>allow</code> reads the rule exactly once, into a local. The subtlety is lowering a limit: a bucket may hold more tokens than the new burst allows. So the refill caps the tokens at the current burst every time, before any charge; otherwise you would grant permits the new policy says do not exist. The ramp is a wrapper round the same interface. WarmUpRules remembers when it first saw a key and scales the rule's numbers from a tenth up to the whole limit over 30 seconds, leaving the tier rules underneath untouched.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * A rule per tier, held in a live reference so ops can raise a limit during a sale without a restart. The\n * limiter reads it once per call, so a change takes effect on the next decision and never inside one.\n */\nclass TierRules implements RuleResolver {\n    private final Map&lt;String, Tier&gt; tierOf = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;Tier, AtomicReference&lt;Rule&gt;&gt; rules = new EnumMap&lt;&gt;(Tier.class);\n    /** Starts every tier on the same rule; callers then raise the ones they sell. */\n    TierRules(Rule defaultRule) {\n        for (Tier t : Tier.values()) rules.put(t, new AtomicReference&lt;&gt;(defaultRule));\n    }\n    /** Put a key on a plan. Unknown keys are FREE. */\n    void assign(String key, Tier tier) { tierOf.put(key, tier); }\n    /** Change a tier&#x27;s rule while the process runs. The next decision sees it; the current one does not. */\n    void setRule(Tier tier, Rule rule) { rules.get(tier).set(rule); }\n    public Rule ruleFor(String key) { return rules.get(tierOf.getOrDefault(key, Tier.FREE)).get(); }\n}\n\n// in allow(): the rule is read ONCE into a local, so one decision never sees two rules\nRule rule = rules.ruleFor(key);\n\n// in TokenBucket: the cap is applied on every refill, so a lowered burst bites at once\n/**\n     * Bring tokens and lastRefillMs to nowMs as one step. Elapsed time is the only source of new permits, so\n     * there is no timer and no background thread: an idle bucket costs nothing until someone asks about it.\n     * A clock that went backwards mints nothing, and the measurement point is not moved back either. The\n     * cap is applied every time, so a burst that ops lowered live pulls the held tokens down at once.\n     */\n    private void refill(KeyState s, Rule rule, long nowMs) {\n        long elapsed = nowMs - s.lastRefillMs;\n        if (elapsed &gt; 0) {\n            s.tokens += elapsed * rule.perMs();\n            s.lastRefillMs = nowMs;\n        }\n        s.tokens = Math.min(rule.burst(), s.tokens);\n    }\n\n// ---- ext: warm-up, for the cold cache behind you\n/**\n * Wraps any rule source and scales the permits up from a tenth to the full limit over the warm-up period,\n * measured from the first time each key was seen. Wraps rather than replaces: the tier rules underneath are\n * untouched, which is the same Decorator move as surge pricing on a parking lot.\n */\nclass WarmUpRules implements RuleResolver {\n    private final RuleResolver base;\n    private final long warmUpMs;\n    private final Clock clock;\n    private final Map&lt;String, Long&gt; firstSeen = new ConcurrentHashMap&lt;&gt;();\n    WarmUpRules(RuleResolver base, long warmUpMs, Clock clock) { this.base = base; this.warmUpMs = warmUpMs; this.clock = clock; }\n    public Rule ruleFor(String key) {\n        Rule r = base.ruleFor(key);\n        long now = clock.nowMs();\n        long since = now - firstSeen.computeIfAbsent(key, k -&gt; now);\n        if (since &gt;= warmUpMs) return r;\n        double f = Math.max(0.1, (double) since / warmUpMs);            // a tenth, rising to the whole limit\n        return new Rule(Math.max(1, (long) (r.permits() * f)), r.windowMs(), Math.max(1, (long) (r.burst() * f)));\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; A hundred threads hit one key at its limit at the same instant. Prove that exactly the limit gets through.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading \"one token left\" and writing \"zero\". In this design the refill, the check and the charge happen inside one lock, on the key's own state, so no other thread can run in the gap. The proof: 100 threads wait on one latch (a gate that opens for every waiting thread at once), with the clock frozen so no permit can be minted mid-race. The latch opens, every thread calls allow for the same key, and the test counts the admissions. Exactly 50 on a limit of 50, and the bucket ends at zero, not below it. The clock must be frozen for the count to be exact: with a live clock the answer is 50 or a few more, and the test proves nothing.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 3. a hundred threads, one key, one instant: exactly the limit gets through\n        ManualClock frozen = new ManualClock(0);\n        RateLimiter hot = new RateLimiter();\n        hot.configure(new TokenBucket(), new FlatRules(new Rule(50, 1_000L, 50)), frozen);\n        CountDownLatch start = new CountDownLatch(1), done = new CountDownLatch(100);\n        AtomicInteger admitted = new AtomicInteger();\n        ExecutorService pool = Executors.newFixedThreadPool(32);\n        for (int i = 0; i &lt; 100; i++) pool.submit(() -&gt; {\n            try { start.await(); if (hot.allow(&quot;hot&quot;).allowed()) admitted.incrementAndGet(); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            finally { done.countDown(); }\n        });\n        start.countDown();\n        done.await();\n        pool.shutdown();\n        check(admitted.get() == 50, &quot;100 threads on one key, limit 50: exactly &quot; + admitted.get() + &quot; admitted&quot;);\n        check(hot.remaining(&quot;hot&quot;) == 0, &quot;and the bucket is empty afterwards, not negative&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock per key. Does that scale, or have you just moved the bottleneck? What about a single hot key?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It scales, and the answer is arithmetic, not opinion. Move 8 has the sums: the hottest of 5,000 keys holds its lock for about 10 microseconds in every second, and no other key touches that lock. The bottleneck did not move to the map either, because a ConcurrentHashMap needs no lock around it. The interesting half of the question is one genuinely hot key: one tenant carrying all the traffic. Even there, measured with 100 threads arriving together, the slowest waited about 15 microseconds in front of 2 milliseconds of work it was gating. That never shows up in a latency graph (a chart of how long requests take). If it ever did, rung one of the ladder removes the lock rather than splitting it. Hold the whole bucket as one immutable value and swap it with compare-and-set, so a thread that loses recomputes against the winner's value instead of sleeping. ExtDemo prints the real cost of that: 200 threads, exactly 50 admitted, and how many swaps were lost and redone. OpenAI's 2026 version hands you a limiter with the read-check-write bug and asks you to fix it, then make it faster. The lock is the fix; compare-and-set is the speed-up.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The critical step, in this order: read the rule once and the clock once, so the whole decision sees one\n     * policy and one instant; then, under this key&#x27;s lock only, refill from elapsed time and charge. Nothing\n     * is admitted before it is charged - a permit spent can be refunded, a request admitted cannot be recalled.\n     * Observers are told afterwards, outside the lock. A call bigger than the whole bucket is refused for good\n     * first: a Retry-After for it would send the client round a retry loop that can never succeed.\n     */\n    public Decision allow(String key, long cost) {\n        if (cost &lt;= 0) throw new IllegalArgumentException(&quot;cost must be &gt; 0&quot;);\n        RateLimitAlgorithm algo = this.algo;                        // read once, like the rule and the clock\n        Rule rule = rules.ruleFor(key);\n        if (cost &gt; algo.capacity(rule)) {                           // no wait can ever make room for this call\n            Decision never = Decision.never(remaining(key), &quot;costs more than this key can ever hold&quot;);\n            publish(key, never);\n            return never;\n        }\n        long now = clock.nowMs();\n        KeyState s = lockState(key, rule, now);\n        Decision d;\n        try {\n            d = algo.tryAcquire(s, rule, cost, now);\n            s.lastSeenMs = now;\n        } finally {\n            s.lock.unlock();\n        }\n        publish(key, d);\n        return d;\n    }\n\n// ---- ext: rung one of the ladder: the same bucket with no lock at all, using compare-and-set\n/**\n * The whole bucket as one immutable value in an AtomicReference. Refill-and-deduct becomes compare-and-set:\n * compute the new value from the one you read, and swap it in only if the reference still holds what you read.\n * A thread that loses recomputes against the winner&#x27;s value and tries again. No lock and no thread put to\n * sleep, and it cannot livelock (spin forever with nobody getting through): somebody wins every round. One\n * trap: a thread may have read the clock before another thread&#x27;s swap, so the measured-at instant only ever\n * moves forward - moving it back would let the next caller mint the same milliseconds twice.\n */\nclass CasBucket implements Limiter {\n    /** The pair that must move together: permits, and the instant they were measured at. */\n    record Snap(double tokens, long atMs) { }\n    private final ConcurrentHashMap&lt;String, AtomicReference&lt;Snap&gt;&gt; keys = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicLong retries = new AtomicLong();\n    private final Rule rule;\n    private final Clock clock;\n    CasBucket(Rule rule, Clock clock) { this.rule = rule; this.clock = clock; }\n    public Decision allow(String key, long cost) {\n        if (cost &gt; rule.burst()) return Decision.never(0, &quot;costs more than this key can ever hold&quot;);\n        AtomicReference&lt;Snap&gt; ref = keys.computeIfAbsent(key,\n                k -&gt; new AtomicReference&lt;&gt;(new Snap(rule.burst(), clock.nowMs())));\n        while (true) {\n            long now = clock.nowMs();\n            Snap cur = ref.get();\n            long elapsed = Math.max(0, now - cur.atMs());\n            double tokens = Math.min(rule.burst(), cur.tokens() + elapsed * rule.perMs());\n            if (tokens &lt; cost)\n                return Decision.deny((long) Math.floor(tokens), (long) Math.ceil((cost - tokens) / rule.perMs()), &quot;no permits&quot;);\n            long measuredAt = Math.max(now, cur.atMs());                          // never backwards\n            if (ref.compareAndSet(cur, new Snap(tokens - cost, measuredAt)))      // the whole decision, one swap\n                return Decision.allow((long) Math.floor(tokens - cost));\n            retries.incrementAndGet();                                            // somebody else won; redo the sums\n        }\n    }\n    /** How often a thread lost the swap and recomputed: the measurable price of many threads on one key. */\n    long retries() { return retries.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; The limiter said yes, and then the call never happened \u2014 the downstream service threw, or a later check refused it. What happens to the permit?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It is given back. The order inside allow is charge first, then admit, because admitting is the irreversible half; that leaves exactly one thing to undo, and <code>refund</code> is it. A refund refills from elapsed time first, then adds the permits back, capped at the burst, so it can never mint budget that was not earned. An unknown key is ignored rather than created. Call it once, straight after the failed call: two refunds give back twice, and a late one returns a permit that time has already returned. The place this really shows up is layered limits: a tenant budget and a global budget, charged in order. When the global one refuses, the tenant is refunded at once; otherwise the tenant loses permits for a request nobody served. The demo checks that exact number: 3 admitted through a global budget of 3, and the tenant still holding 7 of its 10.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Give permits back for a call that was admitted and then never made - the downstream call threw, or a\n     * later layer refused it. This is the compensating step that keeps the budget honest; it can never push a\n     * bucket above its burst, and an unknown key is ignored rather than created. Same removed-state check as\n     * allow(): a refund paid into a state the sweeper just deleted would vanish. Call it once, straight after\n     * the failed call: two refunds give back twice, and a late one returns a permit that time already returned.\n     */\n    void refund(String key, long cost) {\n        if (cost &lt;= 0) return;\n        Rule rule = rules.ruleFor(key);\n        long now = clock.nowMs();\n        while (true) {\n            KeyState s = keys.get(key);\n            if (s == null) return;                            // never seen, or already swept: nothing to give back\n            s.lock.lock();\n            try {\n                if (s.removed) continue;                      // swept between the lookup and the lock: look again\n                algo.refund(s, rule, cost, now);\n                s.lastSeenMs = now;\n                return;\n            } finally { s.lock.unlock(); }\n        }\n    }\n\n// ---- ext: layered limits: per key AND a global budget, with a refund when a later layer refuses\n/**\n * Two invariants at once: this tenant may spend 600 a minute, and the whole service may spend 10,000 a minute.\n * Every layer is charged in order, and if a later layer refuses, the earlier ones are refunded - otherwise a\n * tenant loses permits for a request that never happened. That refund is the compensating step of this design.\n * Per user AND per endpoint is the same class: two layers, keyed by user and by user plus route.\n */\nclass LayeredLimiter implements Limiter {\n    /** One budget: its name for the error, the limiter that holds it, and how the key maps into it. */\n    record Layer(String name, RateLimiter limiter, Function&lt;String, String&gt; keyOf) { }\n    private final List&lt;Layer&gt; layers;\n    LayeredLimiter(List&lt;Layer&gt; layers) { this.layers = List.copyOf(layers); }\n    public Decision allow(String key, long cost) {\n        List&lt;Layer&gt; charged = new ArrayList&lt;&gt;();\n        for (Layer l : layers) {\n            Decision d = l.limiter().allow(l.keyOf().apply(key), cost);\n            if (!d.allowed()) {\n                for (Layer c : charged) c.limiter().refund(c.keyOf().apply(key), cost);   // give back, in full, at once\n                return new Decision(false, d.remaining(), d.retryAfterMs(), l.name() + &quot; limit&quot;);   // that layer&#x27;s wait\n            }\n            charged.add(l);\n        }\n        return Decision.allow(layers.get(0).limiter().remaining(layers.get(0).keyOf().apply(key)));\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>5 &middot; A dashboard asks &quot;how many permits are left&quot; a thousand times a second, and there are ten million keys. Show me both.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The read is O(1) and needs no new structure: the bucket already holds the tokens and when they were measured, so the answer is a refill and a floor, under the key's lock. A read that refills is still a write, which is why it takes the lock. An unknown key answers what a new key would have and is deliberately not created, so a monitoring sweep cannot fill the map. Memory is the real question: about 340 bytes a key, 3.4 GB at 10 million. So a scheduled task calls sweepIdle, which drops keys nobody has asked about for a while. Saying why that loses nothing is the senior move. A key idle long enough to be full again is the same as a fresh key, and that takes one window when the burst is no bigger than the window's permits. Two traps come with it. Deleting a key while another thread is deciding on it would swallow a spent permit, so the state is marked removed under the lock and that caller fetches again. And a client that never repeats a key can fill the map faster than the sweeper drains it. So the map also gets a hard maximum, past which an unknown key is refused: a limiter that runs out of memory is worse than one that is strict.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * How many permits this key has right now, charging nothing. O(1). An unknown key answers what a new key\n     * would have (a full burst, for the bucket) and is deliberately not created. No removed-state retry here\n     * on purpose: a read that lands on a state the sweeper has just deleted answers from that state&#x27;s own\n     * numbers, which at worst is fewer permits than the key&#x27;s next call will find.\n     */\n    long remaining(String key) {\n        Rule rule = rules.ruleFor(key);\n        long now = clock.nowMs();\n        KeyState s = keys.get(key);\n        if (s == null) return algo.remaining(new KeyState(key, rule, now), rule, now);   // a throwaway new state\n        s.lock.lock();\n        try { return algo.remaining(s, rule, now); } finally { s.lock.unlock(); }\n    }\n\n/**\n     * Forget keys nobody has asked about for idleMs. Lossless when idleMs is long enough for an idle key to be\n     * full again - for the bucket, burst divided by the refill rate, which is one window when the burst is no\n     * bigger than the permits, as on every plan here - because then a fresh state is the same state. Never\n     * called on the request path: a scheduled task runs it, taking each key&#x27;s lock only while it checks it.\n     */\n    int sweepIdle(long idleMs) {\n        long now = clock.nowMs();\n        int removed = 0;\n        for (Map.Entry&lt;String, KeyState&gt; e : keys.entrySet()) {\n            KeyState s = e.getValue();\n            if (now - s.lastSeenMs &lt; idleMs) continue;\n            s.lock.lock();\n            try {\n                if (now - s.lastSeenMs &gt;= idleMs &amp;&amp; keys.remove(e.getKey(), s)) { s.removed = true; removed++; }\n            } finally { s.lock.unlock(); }\n        }\n        return removed;\n    }\n\n/**\n     * Find or create this key&#x27;s state and return it LOCKED. The loop closes the one race the map creates: the\n     * sweeper can delete a state between the lookup and the lock, and a permit spent on a deleted state would\n     * be lost, so a caller that finds a removed state simply fetches again.\n     */\n    private KeyState lockState(String key, Rule rule, long now) {\n        while (true) {\n            KeyState s = keys.computeIfAbsent(key, k -&gt; new KeyState(k, rule, now));\n            s.lock.lock();\n            if (!s.removed) return s;\n            s.lock.unlock();\n        }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>6 &middot; Which rate-limiting algorithms do you know, and which one would you actually ship?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Five names, three real ideas. The token bucket, which this code ships, holds permits that refill with elapsed time. It is O(1) in time and memory, and it lets a client burst up to a stored depth, which is how API plans are sold: 600 a minute, burst 100. The leaky bucket is not a different answer. As a <i>meter</i> (water drains at the steady rate, each call pours in its cost, overflow is refused) it is the same arithmetic upside down. GCRA keeps it as one moment per key, and block 9 of FailureTests shows it admitting the identical calls, even at 3 a second. The <i>queue</i> reading of \"leaky bucket\" behaves differently: it delays calls instead of refusing them, which is shaping, not limiting. The window family is about accuracy at the edge. The fixed window is one counter and can pass twice the limit in an instant at the boundary. The sliding counter adds one more counter and is close on real traffic, and the log is exact at the price of one timestamp per permit. So pick by endpoint, not by fashion: token bucket at the front door, sliding window log on login, where five a minute has to mean five.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// the menu, and what each one costs. P permits per window W, burst B.\n//\n//  algorithm                state per key          time    burst?  exact?  where it belongs\n//  ----------------------------------------------------------------------------------------------\n//  token bucket             2 numbers              O(1)    yes     yes     the default: public APIs\n//  leaky bucket (meter)     1 moment  -- Gcra      O(1)    yes     yes     same admissions, whole-number sums\n//  leaky bucket (queue)     a queue of callers     O(1)    no      yes     shaping, not limiting\n//  fixed window             1 counter + a stamp    O(1)    yes     NO      never alone: 2x at the boundary\n//  sliding window counter   2 counters + a stamp   O(1)    yes     almost  Cloudflare&#x27;s edge: 0.003% wrong\n//  sliding window log       P timestamps           O(k)    yes     yes     login, OTP: 5 a minute means 5\n//\n// Ship the token bucket, and say why in one line: O(1) in time AND memory, and its worst instant is a burst\n// you chose, never a whole extra window. Burst is a knob separate from rate: the shape a plan is sold in.\n\n        // 9. the leaky bucket is not a different answer: GCRA admits exactly what the token bucket admits,\n        //    at 10 a second (100 ms a permit) and at 3 a second (333 1/3 ms, where any rounding would show)\n        for (Rule same : List.of(new Rule(10, 1_000L, 5), new Rule(3, 1_000L, 3))) {\n            ManualClock tbc = new ManualClock(0), gc = new ManualClock(0);\n            RateLimiter tb = new RateLimiter(), gcra = new RateLimiter();\n            tb.configure(new TokenBucket(), new FlatRules(same), tbc);\n            gcra.configure(new Gcra(), new FlatRules(same), gc);\n            StringBuilder tbRun = new StringBuilder(), gcraRun = new StringBuilder();\n            for (long jump : new long[] { 0, 100, 234, 332, 1, 1_000 }) {   // the clock jumps, then 8 calls at once\n                tbc.advance(jump); gc.advance(jump);\n                for (int i = 0; i &lt; 8; i++) {\n                    tbRun.append(tb.allow(&quot;k&quot;).allowed() ? &#x27;1&#x27; : &#x27;0&#x27;);\n                    gcraRun.append(gcra.allow(&quot;k&quot;).allowed() ? &#x27;1&#x27; : &#x27;0&#x27;);\n                }\n            }\n            check(tbRun.toString().equals(gcraRun.toString()), &quot;gcra admits the same calls as the token bucket at &quot;\n                  + same.permits() + &quot; a second: &quot; + tbRun + &quot; vs &quot; + gcraRun);\n        }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>7 &middot; Someone spends their whole minute at 11:59:59 and their whole next minute at 12:00:00. Show me the bug and the fix.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A fixed window is a counter plus the window it belongs to. Windows sit on an absolute grid (they reset on the second, the minute, the hour), so a client that knows the boundary can spend twice the limit across it. The test proves it: 10 calls through in 100 milliseconds on a limit of 5 a second. The O(1) answer is the sliding window counter: count this window exactly, and add a share of the previous window, weighted by how much of it is still inside the last 60 seconds. Just after the boundary the previous window counts almost in full, so the same burst is refused. It assumes the previous window's calls were spread evenly. On real traffic that is close: Cloudflare, which runs it at its edge, measured 0.003% of requests decided wrongly. A client that packs its calls into the end of a window can still get near twice the limit over a sliding minute. When that matters, use the exact answer, a timestamp per permit in a deque; it costs memory in proportion to the limit, so keep it for a login endpoint. The token bucket has no grid, so no boundary: the most it lets through in one instant is the burst, a number you chose.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The O(1) answer to the boundary: count this window exactly and charge a share of the previous one, weighted\n * by how much of it is still inside the last `window` milliseconds. Two counters per key. It assumes the\n * previous window&#x27;s calls were spread evenly: on real traffic that is close (Cloudflare, which runs it,\n * measured 0.003% of requests decided wrongly), but a client that packs the end of a window can still get\n * near twice the limit over a sliding minute. When that matters, use the log below.\n */\nclass SlidingWindowCounter implements RateLimitAlgorithm {\n    public Decision tryAcquire(KeyState s, Rule rule, long cost, long nowMs) {\n        FixedWindow.roll(s, rule, nowMs);\n        double estimated = estimate(s, rule, nowMs);\n        if (estimated + cost &lt;= rule.permits() + 1e-9) {           // a hair of slack for rounding in the weight\n            s.currentCount += cost;\n            return Decision.allow(Math.max(0, (long) Math.floor(rule.permits() - (estimated + cost) + 1e-9)));\n        }\n        return Decision.deny(Math.max(0, (long) Math.floor(rule.permits() - estimated + 1e-9)),\n                             waitMs(s, rule, cost, nowMs), &quot;window full&quot;);\n    }\n    public void refund(KeyState s, Rule rule, long cost, long nowMs) {\n        FixedWindow.roll(s, rule, nowMs);\n        s.currentCount = Math.max(0, s.currentCount - cost);\n    }\n    public long remaining(KeyState s, Rule rule, long nowMs) {\n        FixedWindow.roll(s, rule, nowMs);\n        return Math.max(0, (long) Math.floor(rule.permits() - estimate(s, rule, nowMs) + 1e-9));\n    }\n    public long capacity(Rule rule) { return rule.permits(); }\n    /** This window&#x27;s exact count plus the previous window&#x27;s count times the fraction still in range. */\n    private double estimate(KeyState s, Rule rule, long nowMs) {\n        double into = nowMs - s.windowStartMs;\n        double weight = Math.min(1.0, Math.max(0.0, (rule.windowMs() - into) / (double) rule.windowMs()));\n        return s.previousCount * weight + s.currentCount;\n    }\n    /**\n     * The shortest wait after which this call fits. If this window still has room, wait until the previous\n     * window&#x27;s share has faded enough; if it has none, wait for the next window, where this window&#x27;s count\n     * becomes the share that fades.\n     */\n    private long waitMs(KeyState s, Rule rule, long cost, long nowMs) {\n        double w = rule.windowMs(), into = nowMs - s.windowStartMs;\n        long room = rule.permits() - s.currentCount - cost;\n        if (room &gt;= 0) return (long) Math.ceil(w * (1 - room / (double) s.previousCount) - into);\n        return (long) Math.ceil(w - into + w * (1 - (rule.permits() - cost) / (double) s.currentCount));\n    }\n    public String name() { return &quot;sliding window counter&quot;; }\n}\n\n        // 2. the fixed window doubles the limit at the boundary; the sliding counter does not\n        ManualClock fw = new ManualClock(0);\n        RateLimiter fixed = new RateLimiter();\n        fixed.configure(new FixedWindow(), new FlatRules(new Rule(5, 1_000L, 5)), fw);\n        fw.advance(900);\n        int before = 0;\n        for (int i = 0; i &lt; 5; i++) if (fixed.allow(&quot;k&quot;).allowed()) before++;\n        fw.advance(100);                                    // the first millisecond of the next window\n        int after = 0;\n        for (int i = 0; i &lt; 5; i++) if (fixed.allow(&quot;k&quot;).allowed()) after++;\n        check(before + after == 10, &quot;fixed window: &quot; + (before + after) + &quot; calls in 100ms on a limit of 5 per second&quot;);\n\n        ManualClock sw = new ManualClock(0);\n        RateLimiter sliding = new RateLimiter();\n        sliding.configure(new SlidingWindowCounter(), new FlatRules(new Rule(5, 1_000L, 5)), sw);\n        sw.advance(900);\n        int sBefore = 0;\n        for (int i = 0; i &lt; 5; i++) if (sliding.allow(&quot;k&quot;).allowed()) sBefore++;\n        sw.advance(100);\n        int sAfter = 0;\n        for (int i = 0; i &lt; 5; i++) if (sliding.allow(&quot;k&quot;).allowed()) sAfter++;\n        check(sBefore == 5 &amp;&amp; sAfter == 0, &quot;sliding counter: &quot; + (sBefore + sAfter) + &quot; over the same boundary&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Atlassian&#x27;s version: each customer may make X requests per Y seconds, and a customer who does not use all of them keeps the rest as credits, up to a maximum. Add it, and keep it thread-safe.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It is a new algorithm behind the same interface, so nothing else opens. It runs under the same per-key lock as every other algorithm, so it is thread-safe for free. CreditWindow is a fixed window of <i>permits</i> per window plus a bank of saved credits. At each new window, whatever the ended windows left unused goes into the bank, capped at burst minus permits; a quiet window saves all of it. A call that finds this window full spends a credit instead of being refused. So Rule(5, 1 second, 8) means 5 a second plus up to 3 saved. The test runs three seconds. 8 get through in the first, because a new key starts with a full bank, as a new bucket starts full. Then 5 in a busy second after a busy one, and 8 again after a quiet second. Say the link out loud: this is the token bucket's burst, earned one whole window at a time instead of continuously.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: credits: a quiet window&#x27;s unused permits carry over, up to a cap (Atlassian&#x27;s follow-up)\n/**\n * Atlassian&#x27;s version of the prompt: each customer may make X calls per Y seconds, and whatever a window leaves\n * unused is saved as credits, up to a cap, for a later busy window. Here X is permits, Y is the window, and the\n * cap is burst - permits, so Rule(5, 1s, 8) means 5 a second plus up to 3 saved. The credits live in\n * KeyState.tokens (a saved permit is a token) and this window&#x27;s count where FixedWindow keeps it. A new key\n * starts with a full bank, the way a new bucket starts full. It is the token bucket&#x27;s burst, earned one whole\n * window at a time instead of continuously.\n */\nclass CreditWindow implements RateLimitAlgorithm {\n    public Decision tryAcquire(KeyState s, Rule rule, long cost, long nowMs) {\n        roll(s, rule, nowMs);\n        long room = Math.max(0, rule.permits() - s.currentCount), credits = (long) s.tokens;\n        if (cost &lt;= room + credits) {\n            long fromCredits = Math.max(0, cost - room);           // this window&#x27;s room first, then the savings\n            s.currentCount += cost - fromCredits;\n            s.tokens -= fromCredits;\n            return Decision.allow(room + credits - cost);\n        }\n        // wait for the next window, plus as many quiet windows as it takes to save what a big call still lacks\n        long saved = Math.min(cap(rule), credits + room), lacking = Math.max(0, cost - rule.permits() - saved);\n        long windows = 1 + (lacking + rule.permits() - 1) / rule.permits();\n        return Decision.deny(room + credits, s.windowStartMs + windows * rule.windowMs() - nowMs, &quot;window full, no credits&quot;);\n    }\n    public void refund(KeyState s, Rule rule, long cost, long nowMs) {\n        roll(s, rule, nowMs);\n        long back = Math.min(cost, s.currentCount);                 // undo this window&#x27;s count first\n        s.currentCount -= back;\n        s.tokens = Math.min(cap(rule), s.tokens + (cost - back));\n    }\n    public long remaining(KeyState s, Rule rule, long nowMs) {\n        roll(s, rule, nowMs);\n        return Math.max(0, rule.permits() - s.currentCount) + (long) s.tokens;\n    }\n    public long capacity(Rule rule) { return rule.permits() + cap(rule); }\n    /** The most credits a key may hold: whatever the burst allows beyond one window. */\n    private static long cap(Rule rule) { return Math.max(0, rule.burst() - rule.permits()); }\n    /** At a new window, save what the ended windows left unused, up to the cap. A quiet window saves all of it. */\n    private static void roll(KeyState s, Rule rule, long nowMs) {\n        long w = rule.windowMs(), aligned = Math.floorDiv(nowMs, w) * w;\n        long ended = (aligned - s.windowStartMs) / w;\n        if (ended &gt; 0) {\n            s.tokens += Math.max(0, rule.permits() - s.currentCount) + (double) (ended - 1) * rule.permits();\n            s.currentCount = 0;\n            s.windowStartMs = aligned;\n        }\n        s.tokens = Math.min(cap(rule), s.tokens);                   // also trims a new key&#x27;s bank to the cap\n    }\n    public String name() { return &quot;credit window&quot;; }\n}\n\n        // 16. credits (Atlassian&#x27;s follow-up): unused permits carry over, capped at burst - permits\n        ManualClock wc = new ManualClock(0);\n        RateLimiter credit = new RateLimiter();\n        credit.configure(new CreditWindow(), new FlatRules(new Rule(5, 1_000L, 8)), wc);   // 5 a second, 3 saved at most\n        int fresh = admitted(credit, &quot;k&quot;, 10);                         // a new key: 5 plus a full bank of 3\n        wc.advance(1_000);\n        int afterBusy = admitted(credit, &quot;k&quot;, 10);                     // the last second left nothing to save\n        wc.advance(2_000);\n        int afterQuiet = admitted(credit, &quot;k&quot;, 10);                    // a quiet second saved 5, capped at 3\n        check(fresh == 8 &amp;&amp; afterBusy == 5 &amp;&amp; afterQuiet == 8,\n              &quot;credits: &quot; + fresh + &quot; in a first second, &quot; + afterBusy + &quot; after a busy one, &quot; + afterQuiet + &quot; after a quiet one&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; LeetCode 362: hit(timestamp) records a hit, getHits(timestamp) returns the hits in the past 5 minutes. Then: what if there are millions of hits a second, from many threads?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The first answer is the sliding window log from Main.java: a queue of timestamps; drop the old ones, count what is left. The follow-up breaks it, because a million hits a second means a million timestamps a second in memory. The fix keeps 300 slots, one per second of the window. Each slot remembers which second it is counting and how many hits it saw, and a newer second that lands on the slot resets it. Memory is 300 slots whatever the traffic, and getHits is one pass over them. For many threads, one lock around both methods is enough, because each holds it for a few field writes. If that lock ever shows up, each slot becomes one small value swapped with compare-and-set, so a reset and a hit on the same slot cannot interleave. The test fires 100,000 hits from 4 threads, gets all of them back, and gets 0 three hundred seconds later. Databricks asks the same shape as load metrics on a key-value store: average puts and gets per second over the last 5 minutes. LeetCode 359, the Logger Rate Limiter, is the smallest case: a map from each message to the second it may next be printed.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the hit counter (LeetCode 362): hits in the last 300 seconds, at any rate\n/**\n * The same problem asked as an API: hit(second) records a hit, getHits(second) counts the last 300 seconds.\n * The first answer is the sliding window log, a queue of timestamps. The follow-up, &quot;what if there are a\n * million hits a second?&quot;, is why this one keeps 300 slots instead: one per second, each holding which second\n * it counts and how many hits it saw. Memory stays 300 slots whatever the traffic, and a read is one pass over\n * them. One lock, held for a few field writes, makes it safe for many threads. LeetCode 359, the Logger Rate\n * Limiter, is the smallest case: a map from each message to the second it may next be printed.\n */\nclass HitCounter {\n    private static final int SECONDS = 300;\n    private final long[] second = new long[SECONDS], hits = new long[SECONDS];\n    private final ReentrantLock lock = new ReentrantLock();\n    /** One hit at this second. A slot still holding an older second is reused; a hit older than its slot is dropped. */\n    void hit(long sec) {\n        int i = Math.floorMod(sec, SECONDS);\n        lock.lock();\n        try {\n            if (second[i] &gt; sec) return;                               // too old: this slot has moved on\n            if (second[i] &lt; sec) { second[i] = sec; hits[i] = 0; }     // a new second takes over the slot\n            hits[i]++;\n        } finally { lock.unlock(); }\n    }\n    /** Hits in the 300 seconds ending at this one: from sec - 299 up to sec. */\n    long getHits(long sec) {\n        lock.lock();\n        try {\n            long total = 0;\n            for (int i = 0; i &lt; SECONDS; i++) if (second[i] &lt;= sec &amp;&amp; sec - second[i] &lt; SECONDS) total += hits[i];\n            return total;\n        } finally { lock.unlock(); }\n    }\n}\n\n        // 17. the hit counter: every hit from four threads counted, forgotten 300 s later, late hits dropped\n        HitCounter hc = new HitCounter();\n        Thread[] hitters = new Thread[4];\n        for (int t = 0; t &lt; 4; t++) { hitters[t] = new Thread(() -&gt; { for (int i = 0; i &lt; 25_000; i++) hc.hit(100); }); hitters[t].start(); }\n        for (Thread t : hitters) t.join();\n        check(hc.getHits(100) == 100_000 &amp;&amp; hc.getHits(399) == 100_000 &amp;&amp; hc.getHits(400) == 0,\n              &quot;hit counter: 100,000 hits from 4 threads all counted, and gone 300 s later&quot;);\n        hc.hit(400); hc.hit(100);                                      // 400 takes over slot 100; a late hit for 100\n        check(hc.getHits(400) == 1, &quot;a hit that arrives after its slot moved on is dropped, not added to the new second&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; We run twelve pods. Right now each one grants the full limit, so the tenant gets twelve times what they pay for. Fix it.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The interface survives; only an implementation is added. A Redis-backed limiter runs the same refill-and-deduct as one Lua script (a small program Redis runs as one step). Redis runs commands one at a time on a single thread, so the script is the fleet's version of the per-key lock. The read and the write both happen on the server, so twelve pods have no gap to race in. The script also reads the time from Redis itself, so pods whose clocks disagree still share one clock. The reference code models Redis with a map behind one lock, with the real script in the comment above it. The demo runs two pods against one budget of 50 and admits 50, not 100. Three more things to say out loud. Keep a local bucket in front as a cheap first filter, so most refusals never leave the pod. The key's TTL (time to live: Redis deletes the key by itself when it runs out) is the sweeper, so eviction comes free. And decide now whether a Redis outage fails open (let every call through) or fails closed (refuse every call), or it will be decided for you at three in the morning.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: twelve pods, one budget: the distributed limiter\n/**\n * A stand-in for Redis: a map plus one lock, because a single-threaded server IS a lock every client shares.\n * The method below is the Lua script, a small program Redis runs as one step with no other command in\n * between. Running it on the server makes refill-and-deduct atomic (one step nobody can see half-done) across\n * twelve pods, exactly as the per-key lock does across threads inside one pod. The script reads the time from\n * Redis itself, so twelve pods whose clocks disagree still share one clock, and its timestamp only moves forward.\n *\n * &lt;pre&gt;\n * -- KEYS[1] = the key   ARGV: burst, perMs, cost\n * local t      = redis.call(&#x27;TIME&#x27;)                     -- the server&#x27;s clock, not the pod&#x27;s\n * local now    = t[1] * 1000 + math.floor(t[2] / 1000)\n * local burst, perMs, cost = tonumber(ARGV[1]), tonumber(ARGV[2]), tonumber(ARGV[3])\n * local b      = redis.call(&#x27;HMGET&#x27;, KEYS[1], &#x27;tokens&#x27;, &#x27;ts&#x27;)\n * local tokens = tonumber(b[1]) or burst\n * local ts     = tonumber(b[2]) or now\n * if now &amp;gt; ts then tokens = math.min(burst, tokens + (now - ts) * perMs); ts = now end\n * local ok = tokens &amp;gt;= cost\n * if ok then tokens = tokens - cost end\n * redis.call(&#x27;HSET&#x27;, KEYS[1], &#x27;tokens&#x27;, tokens, &#x27;ts&#x27;, ts)\n * redis.call(&#x27;PEXPIRE&#x27;, KEYS[1], 120000)             -- TTL: Redis deletes an idle key by itself\n * if ok then return math.floor(tokens) end\n * return -math.ceil((cost - tokens) / perMs)          -- refused: minus the wait in ms\n * &lt;/pre&gt;\n */\nclass RedisLike {\n    private final Map&lt;String, double[]&gt; store = new HashMap&lt;&gt;();     // key -&gt; { tokens, measuredAtMs }\n    private final ReentrantLock singleThread = new ReentrantLock();  // Redis&#x27;s one thread, modelled\n    private final Clock serverClock;                                  // redis.call(&#x27;TIME&#x27;)\n    RedisLike(Clock serverClock) { this.serverClock = serverClock; }\n    /**\n     * The script above, in Java: refill from the server&#x27;s elapsed time and deduct, as one indivisible step.\n     * Returns the permits left (zero or more) when admitted, or minus the wait in ms when refused.\n     */\n    long takeToken(String key, double burst, double perMs, long cost) {\n        singleThread.lock();\n        try {\n            long now = serverClock.nowMs();\n            double[] st = store.computeIfAbsent(key, k -&gt; new double[] { burst, now });\n            if (now &gt; st[1]) { st[0] = Math.min(burst, st[0] + (now - st[1]) * perMs); st[1] = now; }\n            if (st[0] &gt;= cost) { st[0] -= cost; return (long) Math.floor(st[0]); }\n            return -(long) Math.ceil((cost - st[0]) / perMs);\n        } finally { singleThread.unlock(); }\n    }\n}\n\n/**\n * The same interface, backed by the shared server, so twelve pods enforce one budget instead of twelve. The\n * price is a network hop on every request - so keep the local bucket in front of it as a cheap first filter,\n * and decide out loud what happens when Redis is down: fail open (let every call through) or fail closed\n * (refuse every call).\n */\nclass RedisTokenBucket implements Limiter {\n    private final RedisLike redis;\n    private final Rule rule;\n    RedisTokenBucket(RedisLike redis, Rule rule) { this.redis = redis; this.rule = rule; }\n    public Decision allow(String key, long cost) {\n        if (cost &gt; rule.burst()) return Decision.never(0, &quot;costs more than this key can ever hold&quot;);\n        long r = redis.takeToken(key, rule.burst(), rule.perMs(), cost);\n        return r &gt;= 0 ? Decision.allow(r) : Decision.deny(0, -r, &quot;fleet limit&quot;);\n    }\n}\n\n        // 15. twelve pods, one Redis: time comes from the server, so a pod whose clock is wrong changes nothing\n        ManualClock server = new ManualClock(0);\n        RedisLike shared = new RedisLike(server);\n        Rule fleet = new Rule(5, 1_000L, 5);\n        Limiter podA = new RedisTokenBucket(shared, fleet), podB = new RedisTokenBucket(shared, fleet);\n        admitted(podA, &quot;acme&quot;, 5);\n        server.advance(200);                                           // one permit&#x27;s worth of real time\n        check(podB.allow(&quot;acme&quot;, 1).allowed() &amp;&amp; !podA.allow(&quot;acme&quot;, 1).allowed(),\n              &quot;Redis&#x27;s clock: 200ms later exactly one permit exists for the whole fleet, whichever pod asks&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; Different limits per endpoint, and a search costs more than a ping.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both are smaller than they look. \"A limit per endpoint\" is a different key: tenant plus route. The map grows by the number of routes, and not one class changes. Per user <i>and</i> per endpoint at once is two layers in LayeredLimiter, keyed by user and by user plus route. \"A search costs more\" is the cost argument that has been on <code>allow</code> since the first line, read from a small table of route to permits. A refusal for a cost of five waits long enough to have earned five, not one. And a call that costs more than the whole bucket is refused for good (Retry-After: never), because no wait would ever make room: the client must split it. Cloudflare (2025) and Cursor (2026) ask the composed version: several rules at once, such as global, per path, per user plus path, and even a byte budget. A request counts against no rule unless every rule admits it. That is LayeredLimiter with one layer per rule. A byte budget is the cost argument with the body size as the cost, and the refund on a refusal makes the rules all-or-nothing. The thing worth flagging is the number of keys: tenants times routes is what the sweeper now has to keep up with.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a limit per endpoint, and a heavy endpoint that costs more than one permit\n/**\n * Two questions that look big and are not. &quot;Different limits per endpoint&quot; is a different key - tenant plus\n * route - so the map grows by the number of routes and nothing else changes. &quot;A search costs more than a\n * ping&quot; is the cost argument that has been on allow() all along, read from a table.\n */\nclass Endpoints {\n    private final Map&lt;String, Long&gt; cost = new ConcurrentHashMap&lt;&gt;();\n    /** Say what one call to this route is worth in permits. */\n    void price(String route, long permits) { cost.put(route, permits); }\n    /** What this route costs; anything unpriced costs one. */\n    long costOf(String route) { return cost.getOrDefault(route, 1L); }\n    /** The key a decision is made against: one budget per tenant per route. */\n    static String key(String tenant, String route) { return tenant + &quot;:&quot; + route; }\n}\n\n        // 10. a call bigger than the whole bucket is refused for good; a refusal says what is really left\n        RateLimiter big = new RateLimiter();\n        big.configure(new TokenBucket(), new FlatRules(new Rule(5, 1_000L, 5)), new ManualClock(0));\n        Decision huge = big.allow(&quot;k&quot;, 6);\n        check(!huge.allowed() &amp;&amp; huge.retryAfterMs() == Decision.NEVER,\n              &quot;a call costing 6 on a burst of 5 is refused for good, not told to wait&quot;);\n        big.allow(&quot;k&quot;, 2);\n        Decision heavy = big.allow(&quot;k&quot;, 4);\n        check(!heavy.allowed() &amp;&amp; heavy.remaining() == 3, &quot;a refused call of 4 reports the 3 permits really left, not 0&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Before we switch this on for a live tenant, ops wants a week of evidence that it will not break them. Give them that without refusing one request.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Shadow mode, and it is a wrapper, not a change. <code>ShadowLimiter</code> takes any Limiter, runs the real algorithm and charges the real permits. Then it throws the refusal away and admits everything, while counting what it would have blocked. A week of that count on a dashboard answers \"what will this break?\" with evidence instead of a guess. Switching it on for real is one wiring line, <code>new ShadowLimiter(limiter)</code> becoming <code>limiter</code>, and no class is opened to do it. The detail worth saying: it charges the permits for real, so the number it reports is the number you will get. It is not an estimate from a parallel bucket that has drifted away from the live one.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: shadow mode, so a new limit can be measured for a week before it blocks anyone\n/**\n * Wraps any limiter, runs the real algorithm, charges the real permits - and then admits everything anyway,\n * counting what it would have blocked. The answer to &quot;we ship to a live tenant tomorrow and I cannot reject\n * real traffic on day one&quot;: turn the count into a dashboard, and flip one wiring line when it looks right.\n */\nclass ShadowLimiter implements Limiter {\n    private final Limiter delegate;\n    private final AtomicLong observed = new AtomicLong(), wouldHaveBlocked = new AtomicLong();\n    ShadowLimiter(Limiter delegate) { this.delegate = delegate; }\n    public Decision allow(String key, long cost) {\n        Decision d = delegate.allow(key, cost);\n        observed.incrementAndGet();\n        if (!d.allowed()) wouldHaveBlocked.incrementAndGet();\n        return Decision.allow(d.remaining());                 // shadow mode: nobody is actually refused\n    }\n    /** How many calls went through the limiter. */\n    long observed() { return observed.get(); }\n    /** How many of them the real limit would have refused. The number that decides whether to switch it on. */\n    long wouldHaveBlocked() { return wouldHaveBlocked.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>13 &middot; A nightly batch job would rather wait for a permit than fail. Give it that, and tell me where you would refuse to offer it.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The decision already carries the answer: <code>retryAfterMs</code> is the shortest wait after which the call fits, if nobody else spends first. So waiting is a loop around the same call and needs no new state anywhere. <code>WaitingLimiter</code> takes a timeout the caller chose, asks, and on a refusal sleeps exactly the retry-after the limiter reported, instead of polling on a fixed interval. At the deadline it returns false rather than waiting forever, which is the half people forget, and it gives up at once on a call that can never fit. This is back-pressure: the caller is slowed down instead of failed. Plaid's version also bounds how many may wait: put a Semaphore (a counter of free slots) of N in front, and a caller that cannot get a slot is refused at once. Where I would refuse to offer it is a web request. A thread held under load is how a service falls over: the queue in front of the limiter becomes the outage. So this is for batch jobs and queue consumers, and the web tier keeps failing fast with a 429.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: back-pressure: wait for a permit until a deadline instead of failing fast\n/**\n * Back-pressure means slowing a caller down instead of failing it. Some callers - a batch job, a queue\n * consumer - would rather wait than fail. Retry-After already says how long the wait is, so waiting is a\n * loop around the same decision, bounded by a timeout the caller sets. Never offer this to a web request: a\n * held thread under load is how a service falls over.\n */\nclass WaitingLimiter {\n    private final Limiter delegate;\n    WaitingLimiter(Limiter delegate) { this.delegate = delegate; }\n    /**\n     * Try until the permit arrives or timeoutMs has passed; true if admitted. Sleeps exactly the retry-after the\n     * limiter reported, never a fixed poll interval, and gives up at once on a call that can never fit. The\n     * deadline is kept on System.nanoTime, which a correction to the wall clock cannot move.\n     */\n    boolean acquire(String key, long cost, long timeoutMs) throws InterruptedException {\n        long deadline = System.nanoTime() + timeoutMs * 1_000_000L;\n        while (true) {\n            Decision d = delegate.allow(key, cost);\n            if (d.allowed()) return true;\n            if (d.retryAfterMs() == Decision.NEVER) return false;\n            long leftMs = (deadline - System.nanoTime()) / 1_000_000L;\n            if (leftMs &lt;= 0) return false;\n            Thread.sleep(Math.min(d.retryAfterMs(), leftMs));\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>14 &middot; Where does t

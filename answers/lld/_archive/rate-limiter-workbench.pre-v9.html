<div class="top"><h1>Rate Limiter</h1><span class="sub">LLD &middot; Java &middot; OpenJDK 21: the demo, 17 failure-test blocks and a 100-thread race pass</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Build me a rate limiter. It sits in front of our API. Given a key (a tenant, an API key), it says whether this call may go through right now. And it has to be right when a hundred threads ask about the same key at the same instant. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>A service wants to stop one noisy client from eating everybody else's capacity. In front of every request sits one call: <code>allow(key)</code>. It must answer in microseconds with three things: yes or no; how many permits (one call's worth of budget each) the key has left; and, on a no, how long to wait before trying again. The budget is a rule: so many permits per window, with a burst (how many may be spent at one instant). Different keys are on different plans. Hundreds of threads serve requests for the same key at the same moment, so the one thing that must never happen is admitting more calls than the rule allows. Everything else in this design exists to make that one sentence true cheaply.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that spends a burst, gets refused, waits, and is allowed again. The interviewer watches for these, in order. First, the questions you ask before typing: per process or per fleet, what the key is, fail or wait. Then which classes exist and which one owns which state, and <code>allow</code> working end to end. Then a hundred threads on one key at its limit. Then where the rules that will change live (the algorithm, the limit per tier, where time comes from), so a change is a new class and not an edit. Last, what happens when the answer was yes but the call never happened. Then the twists: the fixed-window boundary, twelve pods sharing one budget, ten million keys, unused permits saved as credits.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 348\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">allow</text><g transform=\"translate(175 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a call arrives with a key</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">acme, cost 1 permit</text></g><path d=\"M415 57 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the rule for that key</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">PRO: 600 a minute, burst 100</text></g><path d=\"M675 57 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refill, then charge</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">under this key's lock only</text></g><path d=\"M935 57 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">admitted</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">X-RateLimit-Remaining: 99</text></g><text x=\"88\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">refund</text><g transform=\"translate(175 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a permit was charged</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">and then the call never happened</text></g><path d=\"M415 192 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">give exactly that back</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">same key, same lock</text></g><path d=\"M675 192 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">never above the burst</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a refund may not mint</text></g><path d=\"M935 192 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the budget is honest again</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">remaining 5 of 100</text></g><path d=\"M815 84 V95\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(660 95)\"><rect width=\"310\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"155.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refused: 429, Retry-After 100ms</text></g><text x=\"88\" y=\"262\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"262\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, charging nothing: how many permits are left for this key?  how many calls were allowed and refused?</text><text x=\"88\" y=\"292\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">sweep</text><text x=\"175\" y=\"292\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">on a schedule, never on the request path: forget every key nobody has asked about for a whole window</text><text x=\"615\" y=\"332\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">thousands of keys at once, a hundred threads on one key: never one permit more than the rule allows</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr>\n<tr><td>Per process, or one budget for the whole fleet?</td><td>One JVM, the guard in front of one service</td><td>A map in memory now; Redis behind the same interface later (moves 1, 12)</td></tr>\n<tr><td>What is the key &mdash; tenant, user, API key, IP? How many at peak?</td><td>API key, about five thousand at peak</td><td>The map, and whether idle keys must be evicted (moves 5, 9)</td></tr>\n<tr><td>On a refusal, does the caller fail or wait?</td><td>Fail fast, and be told when to come back</td><td>The return type is a Decision, not a boolean; waiting is a follow-up (move 2)</td></tr>\n<tr><td>Are bursts allowed, or must the rate be smooth?</td><td>Bursts up to the limit are fine</td><td>Token bucket with a burst knob, not a leaky bucket (move 3)</td></tr>\n<tr><td>Same limit for everyone?</td><td>No: a rule per tier, changeable live</td><td>The rules are handed in and read once per call (moves 3, 6)</td></tr>\n<tr><td>Exact at the window edge, or is approximate acceptable?</td><td>Approximate at the front door, exact on login</td><td>Four algorithms behind one interface (moves 3, 5)</td></tr>\n<tr><td>Does every request cost one permit?</td><td>No: a search costs more than a ping</td><td>A cost argument on allow() from the first line (move 2)</td></tr>\n<tr><td>Does a refused call count against the limit?</td><td>No: a refused call is charged nothing</td><td>Charge only on yes, inside the lock (moves 4, 6)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li><code>allow(key)</code> answers in microseconds: yes or no, how many permits are left, and when to come back.</li>\n<li>At most <i>permits</i> per <i>window</i> for a key, and at most <i>burst</i> of them at one instant.</li>\n<li>A rule per key, resolved at call time and changeable while the process runs (a plan upgrade, a sale).</li>\n<li>Four algorithms behind one interface. Token bucket: a bucket of permits that refills at a steady rate. Fixed window: a counter that resets every window. Sliding window counter: this window's count plus a fading share of the last one. Sliding window log: one timestamp per call.</li>\n<li>A heavy request may cost several permits. One that costs more than the whole bucket is refused for good, not told to wait.</li>\n<li>Permits can be given back for a call that was admitted and then never made.</li>\n<li>Counters of what was allowed and what was refused.</li>\n<li>Keys nobody uses any more are forgotten.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Never admit more than the rule allows, whatever the thread count. That is the invariant: the one rule that must hold at every instant.</li>\n<li>O(1) time and memory per decision (the exact log excepted); no scan, and no timer or background thread per key.</li>\n<li>Keys never wait for each other: one lock per key, not one lock for the limiter.</li>\n<li>The algorithm and the limits are swappable without opening the limiter.</li>\n<li>One source of truth per key: the permits, and the instant they were measured at, changed together.</li>\n<li>Time is handed in, so every test is instant and repeatable.</li>\n<li>In memory, one process (say it); bounded memory as keys come and go.</li></ul></div></div>\n<div class=\"move\"><h3>One afternoon, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">12:00:00.000  first call</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">PRO plan: 600 a minute, burst 100</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">a key nobody has seen: full burst</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">allowed, remaining 99</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">one map entry now exists</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">12:00:00.400  120 calls</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">99 left + 4 minted, capped at 100</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">100 allowed, 20 refused</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">each refusal: Retry-After 100ms</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">remaining 0</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">12:00:02.400  the retries</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the client honoured Retry-After</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">1 permit at +100ms, 19 more by +2s</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">all 20 retries allowed</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">nobody was dropped, only delayed</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">12:01:32  the sweeper runs</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">idle 90s; one window is 60s</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">it had refilled to 100 anyway</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the key is deleted: ~340 bytes back</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">a fresh key is the same key</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> one process, in memory; the key is an API key, about five thousand at peak; a refusal is immediate and carries a retry-after; bursts up to the limit are allowed; time is handed in. Named as out of scope: a shared budget across pods, waiting instead of failing, per-endpoint keys, warm-up, credits; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, elevator, BookMyShow). The class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order. Nothing is chosen up front, and nothing is named before the move that produced it. On this problem two moves carry extra weight. Move 4, because the lock goes on the key and not on the limiter. And move 6, because the order is charge-then-admit, and a permit is the only thing that can be given back.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a CALLER asks: may this KEY spend a COST of PERMITS right now? apply the RULE, keep a BUCKET per key, answer with a DECISION</text><g transform=\"translate(30 110)\"><rect width=\"155\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"77.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Caller</text><text x=\"77.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a filter: no state</text></g><path d=\"M107 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(202 110)\"><rect width=\"155\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"77.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Key</text><text x=\"77.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a String: the map key</text></g><path d=\"M279 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(374 110)\"><rect width=\"155\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"77.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Rule</text><text x=\"77.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">permits, window, burst</text></g><path d=\"M451 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(546 110)\"><rect width=\"155\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"77.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Bucket = KeyState</text><text x=\"77.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">tokens + when measured</text></g><path d=\"M623 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(718 110)\"><rect width=\"155\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"77.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Decision</text><text x=\"77.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">yes, left, retry-after</text></g><path d=\"M795 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 110)\"><rect width=\"155\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"77.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Algorithm</text><text x=\"77.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a rule: an interface</text></g><path d=\"M967 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1062 110)\"><rect width=\"155\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"77.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Remaining</text><text x=\"77.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a question: a method</text></g><path d=\"M1139 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = has its own state, so it becomes a class.   dashed = no state of its own: a caller, an interface, or a method</text></svg></div><div class=\"move\"><p>Reading the prompt again: a <b>caller</b> asks whether this <b>key</b> may spend a <b>cost</b> of <b>permits</b> right now; apply the <b>rule</b>; keep a <b>bucket</b> per key; answer with a <b>decision</b>. A rule has three numbers (permits, window, burst) that travel together, so it is a class: a record. A bucket has permits and the instant they were measured at, and neither number means anything without the other, so it is a class. It ends up holding the window counters and the lock as well, so the code calls it <code>KeyState</code>: everything one key owns. A decision has four fields a caller needs, so it is a class too, not a bare boolean. The caller keeps nothing of its own, so it is a thin caller, not a model. The key is a String. The algorithm has no state of its own; it only works on somebody else's bucket, which is exactly what an interface is. \"How many are left\" is a question I answer, so it is a method.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 230\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">may this key spend one permit?</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 46 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 24)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">KeyState  (owns tokens and the instant)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 46 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">algo.tryAcquire(s, rule, cost, now)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the sums, handed the state (move 3)</text></g><g transform=\"translate(30 80)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many permits are left?</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 102 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 80)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">KeyState  (same state, nothing charged)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 102 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 80)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">algo.remaining(s, rule, now)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the sums, handed the state</text></g><g transform=\"translate(30 136)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">find this key, lock it, decide</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 158 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 136)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RateLimiter  (owns the map and the clock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 158 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">limiter.allow(key, cost)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"215\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the state is per key, so the class that owns it is per key too: one KeyState each, and one RateLimiter over all of them</text></svg></div><div class=\"move\"><p>\"May this key spend one permit\" changes the tokens and the instant they were measured at. Both live on the bucket, so their owner is KeyState, and by this move's rule the method would be <code>keyState.tryAcquire(...)</code>. Move 3 adds one twist: the sums are the part that will change, so they go to an algorithm object that is handed the state, <code>algo.tryAcquire(s, rule, cost, now)</code>. The state still has one owner; only the arithmetic is swappable. \"How many are left\" reads the same two fields and charges nothing, so it sits beside it. \"Find this key's state, lock it, decide, then tell the listeners\" touches the map, the clock, the rules and the listeners at once. Only the limiter sees all four, so that is <code>limiter.allow(key, cost)</code>. The pattern worth saying aloud: the state here is <i>per key</i>, so the class that owns it is per key too. One KeyState each, and one RateLimiter over all of them.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 80)\"><rect width=\"220\" height=\"110\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"49.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RateLimiter</text><text x=\"110.0\" y=\"65.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(algo, rules, clock)</text></g><path d=\"M250 135 H330 V46 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RateLimitAlgorithm</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a bucket today, a window tomorrow</text></g><g transform=\"translate(760 24)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TokenBucket | FixedWindow | SlidingWindow x2</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 46 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 135 H330 V106 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 84)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RuleResolver</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">flat today, a rule per tier tomorrow</text></g><g transform=\"translate(760 84)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FlatRules | TierRules | WarmUpRules</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 106 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 135 H330 V166 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 144)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the machine's, or a test's</text></g><g transform=\"translate(760 144)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SystemClock | ManualClock</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 166 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 135 H330 V226 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 204)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LimiterObserver</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">who wants to know what was decided</text></g><g transform=\"translate(760 204)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">MetricsCounter | a 429 audit log</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 226 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"275\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed = handed in. The limiter never builds these, so a new algorithm is a new class and one changed line</text></svg></div><div class=\"move\"><p>Four things will change. The algorithm: token bucket today, and they will ask for a sliding window the moment you mention the boundary. The limits: flat today, a rule per tier tomorrow, raised live during a sale. Where time comes from: the machine's clock in production, a clock the test sets in a test. And who wants to know what was decided: metrics today, a 429 audit log tomorrow. Each becomes an interface the limiter is <i>given</i> in <code>configure()</code> and never builds. This is where the patterns are born, not announced. A swappable rule behind an interface is <b>Strategy</b>. A wrapper that adds to an existing rule instead of replacing it is <b>Decorator</b>: shadow mode over a real limiter, or a warm-up over a rule source. A limiter that announces every decision without knowing what a metric is, is <b>Observer</b>.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 218\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 1</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads: 1 token left</text></g><g transform=\"translate(30 110)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">thread 2</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads: 1 token left</text></g><g transform=\"translate(350 70)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">acme's bucket</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">tokens = 1</text></g><path d=\"M220 52 H350 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M220 132 H350 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"285\" y=\"42\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"285\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"580\" y=\"20\" width=\"270\" height=\"140\" rx=\"6\" fill=\"none\" stroke=\"#f38ba8\" stroke-dasharray=\"4 3\"/><text x=\"715\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#f38ba8\">the gap</text><text x=\"715\" y=\"72\" text-anchor=\"middle\" font-size=\"11\" fill=\"#f38ba8\">both saw 1, both deduct:</text><text x=\"715\" y=\"94\" text-anchor=\"middle\" font-size=\"11\" fill=\"#f38ba8\">two calls on a budget of one</text><text x=\"715\" y=\"132\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: all three as ONE step</text><g transform=\"translate(880 40)\"><rect width=\"320\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">KeyState.lock</text><text x=\"160.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one lock per KEY, not one per limiter</text></g><text x=\"615\" y=\"182\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the lock lives on the state it protects, so two keys never wait for each other</text><text x=\"615\" y=\"202\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the metrics listener is called after the unlock, never inside it</text></svg></div><div class=\"move\"><p>Two threads serving the same tenant both read \"one token left\", both decide yes, both write zero: one permit, two calls. That gap between the read and the write is the whole bug, and it is the one the interviewer is really asking about. So refill, check and charge must be one step under one lock. The important choice is <i>where that lock lives</i>: on the key's state, not on the limiter. A lock on the limiter would make five thousand unrelated tenants queue behind each other for no reason. A lock per key means two keys never wait for each other at all. The map that hands out the states is a ConcurrentHashMap, which is safe to share without a lock around it: reads take no lock, and a write locks only its own slot. Anything that only listens (metrics, an audit log) is called after the unlock, never inside it.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 310\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the state for this key?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 40 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 20)\"><rect width=\"490\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"245.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ConcurrentHashMap&lt;String, KeyState&gt;</text><text x=\"245.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M940 40 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 20)\"><rect width=\"200\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), no global lock</text></g><g transform=\"translate(30 70)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many permits right now?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 90 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 70)\"><rect width=\"490\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"245.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two numbers: tokens + the instant measured</text><text x=\"245.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M940 90 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 70)\"><rect width=\"200\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), no list</text></g><g transform=\"translate(30 120)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many in the last minute, exactly?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 140 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 120)\"><rect width=\"490\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"245.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ArrayDeque&lt;Long&gt;: a timestamp per permit</text><text x=\"245.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M940 140 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 120)\"><rect width=\"200\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(k), ~17 KB a key</text></g><g transform=\"translate(30 170)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which rule for this key?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 190 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 170)\"><rect width=\"490\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"245.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">map key&rarr;Tier, then EnumMap&lt;Tier, Rule&gt;</text><text x=\"245.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M940 190 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 170)\"><rect width=\"200\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 220)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which keys are idle?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 240 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 220)\"><rect width=\"490\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"245.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">lastSeenMs on each state, one pass</text><text x=\"245.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M940 240 H1000\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1000 220)\"><rect width=\"200\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(n), off the hot path</text></g><text x=\"615\" y=\"295\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the only shape here that is not O(1) is the exact one, and its price is memory: one timestamp for every permit</text></svg></div><div class=\"move\"><p>\"The state for this key\": a ConcurrentHashMap from key to KeyState, one lookup, no global lock. \"How many permits right now\": two numbers on that state, the tokens and the instant they were measured. The answer is computed from elapsed time, which is why there is no timer and no thread topping buckets up. \"How many calls in the last minute, exactly\": a deque (a double-ended queue: add at the back, drop from the front) holding one timestamp per permit. That is the only shape here that is not O(1), and its price is memory. Each timestamp is a boxed Long, an object of about 30 bytes, so a key on 600 a minute holds about 17 KB. Say that out loud, and say when you would pay it: a login endpoint at five a minute, never the public API. \"Which rule for this key\": a map to the tier, then an EnumMap of tier to rule. \"Which keys are idle\": a lastSeen stamp on each state and one pass over the map, run by a scheduled task, never on the request path.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 40)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FRESH</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">full burst, on first sight</text></g><g transform=\"translate(260 40)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SPENDING</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">tokens going down</text></g><g transform=\"translate(490 40)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">THROTTLED</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">0 left; Retry-After</text></g><g transform=\"translate(260 120)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">IDLE</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">untouched: swept</text></g><path d=\"M220 62 H260\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M450 62 H490\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M585 40 V16 H355 V40\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"470\" y=\"32\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">time refills it</text><path d=\"M355 84 V120\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"372\" y=\"106\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">nobody calls for a window</text><g transform=\"translate(720 20)\"><rect width=\"490\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"245.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the order inside allow(), and why it is this order</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">1 read the rule once, read the clock once</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">2 lock THIS key; refill from elapsed time</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">3 charge, and only then admit</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">4 unlock, then tell the listeners</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">a permit spent can be refunded; a request admitted cannot be recalled</text></g><text x=\"615\" y=\"205\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">charge before you admit is this system's 'take the money before you commit'. The refund is the compensating step when the call never happened.</text></svg></div><div class=\"move\"><p>A key's life is short and worth drawing. It is FRESH, with a full burst, the first time it is seen; SPENDING as tokens go down; THROTTLED at zero, with a retry-after; back to SPENDING as time refills it. It is IDLE when nobody has asked for a whole window, and then the sweeper deletes it. None of these states is stored: each is just what the numbers say, so there is no status field to keep in step. Writing the life down forces the order inside <code>allow</code>. Read the rule once and the clock once, so one decision sees one policy and one instant. Then take this key's lock, refill from elapsed time, charge, unlock, and only then tell the listeners. The rule that matters is <b>charge before you admit</b>. It mirrors taking the money before committing a booking, because here the irreversible thing is letting the request through. A permit spent can be given back; a request admitted cannot be recalled. That is what <code>refund</code> is: the compensating step (an action that undoes an earlier one) for a call that was allowed and then never made.</p></div><div class=\"move\"><h3>Move 7: yes, one key's calls happen one at a time. Ask for how long, and what is inside the lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 305\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"540\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the lock: tens of nanoseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one subtraction: now, minus the last measurement</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one multiply and a min: the refill</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">one compare and one subtract: the charge</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">two field writes: the tokens, and the instant</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">nothing slow: no I/O, no logging, no waiting</text></g><path d=\"M570 95 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"605\" y=\"85\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside the lock: everything else</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">reading the rule and the clock: before the lock is taken</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the metrics listener: after the unlock, in a try/catch</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the request this call gates: about 2 milliseconds</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">one whole uncontended allow(), measured: 11 nanoseconds</text></g><text x=\"615\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">a hundred threads press on ONE key at the same instant (measured, 35 runs)</text><g transform=\"translate(30 222)\"><rect width=\"270\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the work inside the lock</text><text x=\"135.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">tens of nanoseconds</text></g><path d=\"M300 244 H328\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(328 222)\"><rect width=\"270\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">waking the next waiting thread</text><text x=\"135.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a few microseconds each</text></g><path d=\"M598 244 H626\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(626 222)\"><rect width=\"270\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the slowest of the 100 threads</text><text x=\"135.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">~15 us; ~100 us in the worst run</text></g><path d=\"M896 244 H924\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(924 222)\"><rect width=\"270\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"135.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the request it was gating</text><text x=\"135.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">~2,000 us</text></g><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one by one is true: what the queue costs is the hand-offs, and the slowest thread waits under 1% of its own request</text></svg></div><div class=\"move\"><p>Inside the lock: a subtraction, a multiply and a min, a compare, a subtract, and two field writes. That is tens of nanoseconds; a whole uncontended <code>allow()</code>, lookup and lock included, measured 11 nanoseconds on a laptop with JDK 21. The rule and the clock are read before the lock, the listeners are told after it, and the request being gated takes about 2 milliseconds. So what does a queue of 100 threads on one key cost? Mostly hand-offs, not work: waking a thread that went to sleep waiting for the lock takes a few microseconds. Measured, the slowest of 100 threads spent about 15 microseconds inside <code>allow()</code>, and about 100 in the worst of 35 runs. Against a 2-millisecond request, nobody can see it. It only breaks if something slow gets inside the lock, such as a log line or a network hop, which is why the listeners are told after the unlock.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">a lock per key: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">20,000 requests a second, spread over 5,000 API keys</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the hottest key: 500 a second, ~20 ns of lock each</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">that key's lock is busy 10 us in every 1,000,000 us</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">keys never share a lock, so the other 4,999 never wait</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"#ff6b6b\">memory: ~340 bytes a key: 5,000 = 1.7 MB, 10 million = 3.4 GB</text><text x=\"880\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 compare-and-set instead of the lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the bucket is one immutable value; a loser recomputes</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 split one hot key into eight stripes</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">each stripe gets an eighth of the limit: cheap, approximate</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 move the budget out of the process</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one Redis script, or a lease of 100 permits per pod</text></g></svg></div><div class=\"move\"><p>20,000 requests a second across 5,000 API keys. The hottest key sees 500 a second at about 20 nanoseconds of lock each, so its lock is busy 10 microseconds in every second: one part in a hundred thousand. The other 4,999 keys never touch it. Time is not the problem here; memory is. A key costs about 340 bytes (measured: the map entry, the KeyState, its lock and its empty deque), so 1.7 MB at 5,000 keys and 3.4 GB at 10 million. That number is the whole reason the sweeper exists. Then the ladder, cheapest first. One: hold the bucket as one immutable value and swap it with compare-and-set (write the new value only if the old one is still there). There is no lock, and a thread that loses simply recomputes. Two: split one hot key into eight stripes, each with an eighth of the limit; cheap, and a few percent approximate. Three: only then move the budget out of the process, into one Redis script, or hand each pod a lease of 100 permits to spend locally. Do the arithmetic before you climb; without it, two of those rungs are complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 310\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"290\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two threads read '1 left'</text><text x=\"145.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">both admit: one permit, two calls</text></g><path d=\"M320 39 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 20)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refill and charge inside one per-key lock; test: 100 threads, exactly 50 admitted</text></g><g transform=\"translate(30 64)\"><rect width=\"290\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a burst either side of the edge</text><text x=\"145.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">twice the limit in 100 ms</text></g><path d=\"M320 83 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 64)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the sliding counter weights the previous window; test: 10 through vs 5 through</text></g><g transform=\"translate(30 108)\"><rect width=\"290\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">NTP drags the clock back 5 s</text><text x=\"145.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">five seconds of free permits</text></g><path d=\"M320 127 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 108)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">elapsed of zero or less mints nothing; test: the clock goes back, then forward</text></g><g transform=\"translate(30 152)\"><rect width=\"290\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a call costs more than the bucket</text><text x=\"145.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">told to wait; retries forever</text></g><path d=\"M320 171 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 152)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refuse it for good: Retry-After never; test: a call of 6 on a burst of 5</text></g><g transform=\"translate(30 196)\"><rect width=\"290\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ten million keys, nothing evicted</text><text x=\"145.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">3.4 GB, then out of memory</text></g><path d=\"M320 215 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 196)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">sweepIdle drops keys idle for a window; test: idle dropped, live kept</text></g><g transform=\"translate(30 240)\"><rect width=\"290\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the sweeper deletes a key mid-call</text><text x=\"145.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a permit spent and then lost</text></g><path d=\"M320 259 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 240)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">mark it removed under the lock, fetch again; test: hold the lock, sweep, check</text></g><text x=\"615\" y=\"296\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this derivation makes has a test: FailureTests.java runs 17 blocks of checks and must print ALL PASS</text></svg></div><div class=\"move\"><p>This table is the answer to \"what would you test?\", and every row of it is a few lines in <code>FailureTests.java</code>, not a promise. Three rows are worth rehearsing. The race, because a limiter that is wrong under load is not a limiter: 100 threads, a frozen clock, exactly 50 admitted. The clock, because anyone who reached for the wall clock has this bug. When NTP (the service that keeps the machine's clock in sync) drags it back five seconds, elapsed time of zero or less must mint nothing. Nothing may be minted for the stretch the clock travels twice, either. And the last row, the one almost nobody finds: the sweeper deleting a key between another thread's lookup and its lock, which would silently swallow a spent permit. The fix is three lines: mark the state removed under the lock, and make the caller fetch again. The test holds the key's lock on purpose, so the caller stops at it, and then sweeps from the same thread. That works because the lock is re-entrant: a thread that already holds it may take it again.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"820\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface RateLimitAlgorithm { Decision tryAcquire(...); }  via configure()</text><text x=\"820\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">swap the algorithm without opening the limiter</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">ShadowLimiter(Limiter delegate);  WarmUpRules(RuleResolver base)</text><text x=\"820\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">add a dry run or a ramp without copying a rule</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=

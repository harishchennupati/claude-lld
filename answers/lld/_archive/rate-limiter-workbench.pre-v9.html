\"129.0\" font-size=\"11\" fill=\"var(--text)\">publish(key, d) after the unlock; MetricsCounter implements it</text><text x=\"820\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">metrics without knowing what a metric is</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Value object</text><text x=\"220\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 1</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">record Rule(permits, windowMs, burst);  record Decision(...)</text><text x=\"820\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">one Rule shared by a whole tier; nothing to lock</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--muted)\">State</text><text x=\"220\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">not earned</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--muted)\">a key's states are just its numbers: no status field, no state classes</text><text x=\"820\" y=\"189.0\" font-size=\"11\" fill=\"var(--muted)\">the life is drawn in move 6, not coded</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"220\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">earns it when algorithms arrive as config strings: Map&lt;String, Supplier&gt;</text><text x=\"820\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">say 'not yet, and here is what would make me'</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton, Builder</text><text x=\"220\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">one limiter per process is a wiring fact, not a class</text><text x=\"820\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">a getInstance would make every test share state</text><text x=\"615\" y=\"275\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>Every pattern here came out of a move, which is why each can be defended in one sentence. Strategy is move 3: the algorithm sits behind a one-call interface, so a sliding window is a new class and one changed line. Decorator is the same move used twice: shadow mode wraps a whole limiter and swallows the refusals, and the warm-up rule wraps a rule source and scales its numbers by the key's age. Neither copies the thing it changes. Observer is move 3 as well, kept outside the lock by move 4: the limiter announces each decision after the unlock and does not know what a metric is. The records are value objects (immutable data, compared by what it contains), so one Rule can be shared by a whole tier and nothing about it needs locking. State is worth naming as <i>not</i> earned. The life in move 6 is real, but a key's state is just its numbers, so there is no status field and no class per state. Factory has not earned a place yet; it earns one the day algorithms arrive as strings from configuration and a registry maps \"token_bucket\" to a constructor. Singleton earns nothing at all: one limiter per process is a fact about wiring, and a static getInstance would make every test share a bucket.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">TokenBucket does token arithmetic; RateLimiter owns keys and locks; TierRules owns policy</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">shadow mode, layered limits and credits are new classes; nothing was reopened</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">Gcra replaces TokenBucket and admits the same calls; wrappers take any Limiter</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces, so a fake is a lambda</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">limiter.configure(new TokenBucket(), rules, () -&gt; 1_000L) in a test</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">the tests hand in a ManualClock and a listener that always throws</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>S: each class has one reason to change. TokenBucket changes when token arithmetic changes, RateLimiter when the key lifecycle does, TierRules when the plans do, MetricsCounter when counting does, and nobody does two of those. O: the late requirements (shadow mode, a second global budget, credits) each arrived as a new class and one wiring line; no existing class was opened for them. L: an implementation drops in and nobody checks which. Gcra takes TokenBucket's place and FailureTests shows it admitting the very same calls, and ShadowLimiter or WaitingLimiter wrap any Limiter without an <code>instanceof</code>. I: Clock, RuleResolver and LimiterObserver have one method each, so a fake in a test is a lambda. D: the limiter depends on interfaces and is handed the implementations. That is exactly why a test can hand it a clock that jumps 200 milliseconds and a listener that always throws.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a leaky bucket, credits, a plan per customer</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" h ranslate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one Redis script does refill-and-deduct: the fleet's compare-and-set</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">EVAL bucket.lua 1 acme 100 0.01 1  -- one round trip, one step, Redis's own clock</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 5 + this one</text><text x=\"615\" y=\"310\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the limiter and its tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>Say which of the five it is before you type; that sentence is most of the answer, and the table above has the other half. Only two of them need real thought here. The first is a new invariant across keys: this tenant <i>and</i> the whole service. Both budgets are charged in order, and the first must be refunded when the second refuses; otherwise a tenant loses permits for a request nobody served. The second is state that must outlive the process: twelve pods, one budget. The bucket moves into Redis, and one script does refill-and-deduct on the server. Redis runs commands one at a time on a single thread, so that thread is the fleet's version of this key's lock: the same idea, one layer out. For all five, the limiter and its tests do not change; that is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 900\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTr t x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">FREE, PRO, ENTERPRISE</text></g><g transform=\"translate(930 20)\"><rect width=\"290\" height=\"118\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"145.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RateLimitAlgorithm</text><line x1=\"0\" y1=\"34\" x2=\"290\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">tryAcquire(s, rule, cost, now)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">refund(s, rule, cost, now)</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--text)\">remaining(s, rule, now): long</text><text x=\"8\" y=\"95\" font-size=\"11.5\" fill=\"var(--text)\">capacity(rule): long</text><text x=\"8\" y=\"111\" font-size=\"11.5\" fill=\"var(--text)\">name(): String</text></g><g transform=\"translate(930 162)\"><rect width=\"290\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"145.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">TokenBucket</text><line x1=\"0\" y1=\"26\" x2=\"290\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">refill by elapsed, then charge</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">O(1) time and memory</text></g><g transform=\"translate(930 272)\"><rect width=\"290\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"145.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FixedWindow | SlidingCounter</text><line x1=\"0\" y1=\"26\" x2=\"290\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">a counter per window on a grid</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">the counter weights the last one</text></g><g transform=\"translate(930 382)\"><rect width=\"290\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"145.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">SlidingWindowLog</text><line x1=\"0\" y1=\"26\" x2=\"290\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">a timestamp per permit: exact</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">O(k) time, ~30 bytes a permit</text></g><g transform=\"translate(930 530)\"><rect width=\"290\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"145.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RuleResolver</text><line x1=\"0\" y1=\"34\" x2=\"290\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">ruleFor(key): Rule</text></g><g transform=\"translate(930 614)\"><rect width=\"290\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"145.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FlatRules</text><line x1=\"0\" y1=\"26\" x2=\"290\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">one rule for everybody</text></g><g transform=\"translate(930 698)\"><rect width=\"290\" height=\"122\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"145.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">TierRules</text><line x1=\"0\" y1=\"26\" x2=\"290\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">tierOf: Map&lt;String, Tier&gt;</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">rules: EnumMap&lt;Tier, Rule&gt;</text><line x1=\"0\" y1=\"64\" x2=\"290\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">assign(key, tier)</text><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">setRule(tier, rule)  -- live</text><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">ruleFor(key): Rule</text></g><g><path d=\"M20 872L64 872\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"876\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 872L284 872\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"876\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 872L504 872\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"876\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 872L684 872\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"876\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 872L904 872\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"876\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;record&raquo; = a small immutable value; &laquo;enum&raquo; = a fixed list). Middle: its fields, the state it holds. Bottom: its methods. Everything outside the grey dashed frame at the bottom is <code>Main.java</code>. The seven boxes inside it are <code>Extensions.java</code>, drawn to show that page 05's code hangs off three interfaces. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the limiter owns one KeyState per key and is the only thing that deletes one. Plain arrow = references or returns. Dashed green = handed in through <code>configure()</code>. Dotted blue = notifies, after the unlock. <b>Where state lives:</b> everything mutable is in KeyState: the tokens, the instant they were measured at, the window counters, the log, and the lock that guards all of them. The RateLimiter holds only the map of those states plus the three things it was handed. Rule and Decision are immutable, so they are shared freely and never locked. The algorithms hold no state at all. They are handed a KeyState and a Rule and do arithmetic on them, which is why one instance serves every key in the process.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read the green comments above each class and method first. They say what the thing is for and what it guarantees, which is the whole shape of the system in two minutes; then read the bodies for the mechanics. Each copy button copies that whole file. <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> must print ALL PASS, and <code>java Main</code> runs the demo and the hundred-thread race.</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * Where &quot;now&quot; comes from. Every rule in a rate limiter is a statement about elapsed time, so time is the one\n * input that must never be hard-wired: it is handed in, and a test can then move it by hand.\n */\ninterface Clock {\n    /** Milliseconds. Only differences matter here, so the origin may be arbitrary. */\n    long nowMs();\n}\n\n/**\n * Production time. Uses System.nanoTime rather than the wall clock: only elapsed time matters, and nanoTime\n * cannot jump backwards when NTP corrects the machine&#x27;s clock.\n */\nclass SystemClock implements Clock {\n    /** Milliseconds from a fixed but arbitrary origin, never going backwards. */\n    public long nowMs() { return System.nanoTime() / 1_000_000L; }\n}\n\n/**\n * Test time: the test sets it and advances it. &quot;200 milliseconds later&quot; becomes one line that runs\n * instantly, instead of a Thread.sleep(200) in a suite nobody keeps.\n */\nclass ManualClock implements Clock {\n    private volatile long t;\n    /** Starts at the given instant. */\n    ManualClock(long startMs) { this.t = startMs; }\n    /** The instant this clock was last told about. */\n    public long nowMs() { return t; }\n    /** Move forward by ms; a negative value moves backwards, which one failure test does on purpose. */\n    void advance(long ms) { t += ms; }\n}\n\n/**\n * Which plan a key is on. A tier is a row of numbers, not behaviour, so it is an enum and not a subclass:\n * adding ENTERPRISE_PLUS is one constant and one row in the rule map.\n */\nenum Tier { FREE, PRO, ENTERPRISE }\n\n/**\n * The policy, as data: how many permits, over how long a window, and how many may be spent at one instant.\n * permits/windowMs is the steady rate; burst is the depth of the bucket. Two different knobs: burst 100 lets\n * a client empty its minute in a millisecond, burst 5 forces it to trickle.\n */\nrecord Rule(long permits, long windowMs, long burst) {\n    /** Rejects a rule that cannot be enforced, so a bad config fails at startup and not at three in the morning. */\n    Rule {\n        if (permits &lt;= 0)  throw new IllegalArgumentException(&quot;permits must be &gt; 0&quot;);\n        if (windowMs &lt;= 0) throw new IllegalArgumentException(&quot;window must be &gt; 0&quot;);\n        if (burst &lt;= 0)    throw new IllegalArgumentException(&quot;burst must be &gt; 0&quot;);\n    }\n    /** Permits added per elapsed millisecond. The token bucket&#x27;s whole refill rule. */\n    double perMs() { return (double) permits / (double) windowMs; }\n    /** N permits per second, burst N. */\n    static Rule perSecond(long n) { return new Rule(n, 1_000L, n); }\n    /** N permits per minute with an explicit burst, which is how real API plans are written. */\n    static Rule perMinute(long n, long burst) { return new Rule(n, 60_000L, burst); }\n}\n\n/**\n * The answer to one call. Never a bare boolean: a caller told only &quot;no&quot; can only retry immediately, which is\n * the worst thing it can do under load. remaining fills X-RateLimit-Remaining, retryAfterMs fills Retry-After.\n */\nrecord Decision(boolean allowed, long remaining, long retryAfterMs, String reason) {\n    /** retryAfterMs for a call that no wait can help: it costs more than this key can ever hold. */\n    static final long NEVER = -1L;\n    /** Admitted, with the permits left afterwards. */\n    static Decision allow(long remaining) { return new Decision(true, remaining, 0L, &quot;ok&quot;); }\n    /** Refused, with the shortest wait after which this call fits if nobody else spends first; never zero. */\n    static Decision deny(long remaining, long retryAfterMs, String reason) {\n        return new Decision(false, remaining, Math.max(1L, retryAfterMs), reason);\n    }\n    /** Refused for good: the call is bigger than the whole bucket, so the caller must split it, not wait. */\n    static Decision never(long remaining, String reason) { return new Decision(false, remaining, NEVER, reason); }\n}\n\n/**\n * Everything one key owns: the bucket, the window counters, the log, and the lock that guards them. This is\n * the aggregate of this system - the smallest group of fields that must be read and written as one step.\n * There is one of these per key, so two keys never wait for each other. An algorithm added later keeps its\n * numbers in these same fields (Gcra and CreditWindow in Extensions.java say which), so this class is not\n * reopened for it; one that needs a new kind of state would add a field here.\n */\nclass KeyState {\n    /** One lock per key, not one lock for the limiter: the whole scalability story is this field. */\n    final ReentrantLock lock = new ReentrantLock();\n    final String key;\n    double tokens;                                     // token bucket: permits available right now\n    long lastRefillMs;                                 // ... measured at this instant; the pair means nothing apart\n    long windowStartMs;                                // fixed and sliding counter: start of the current window\n    long currentCount;                                 // ... permits spent inside it\n    long previousCount;                                // ... and inside the window before it\n    final ArrayDeque&lt;Long&gt; log = new ArrayDeque&lt;&gt;();   // sliding window log: one timestamp per permit spent\n    long lastSeenMs;                                   // the sweeper&#x27;s input: when this key was last asked about\n    boolean removed;                                   // set by the sweeper under the lock; see RateLimiter.lockState\n\n    /** A key nobody has seen before starts with a full burst, so a new tenant&#x27;s first request is not refused. */\n    KeyState(String key, Rule rule, long nowMs) {\n        this.key = key;\n        this.tokens = rule.burst();\n        this.lastRefillMs = nowMs;\n        this.windowStartMs = Math.floorDiv(nowMs, rule.windowMs()) * rule.windowMs();\n        this.lastSeenMs = nowMs;\n    }\n}\n\n/**\n * The rule that decides, behind one interface. Swapping a token bucket for a sliding window is a new class\n * and one changed wiring line; this file&#x27;s limiter is never opened for it.\n */\ninterface RateLimitAlgorithm {\n    /**\n     * Decide and charge one call. Always invoked with the key&#x27;s lock held, so an implementation may read and\n     * write the state freely. It must charge before it returns true: nothing may be admitted on credit.\n     */\n    Decision tryAcquire(KeyState s, Rule rule, long cost, long nowMs);\n    /** Give permits back for a call that was admitted and then never made. Never above the burst. */\n    void refund(KeyState s, Rule rule, long cost, long nowMs);\n    /** How many permits are available now, charging nothing. Still a write: it brings the state up to date. */\n    long remaining(KeyState s, Rule rule, long nowMs);\n    /** The most one call can ever cost under this rule: the burst for a bucket, the permits for a window. */\n    long capacity(Rule rule);\n    /** A name for metrics and for the demo output. */\n    String name();\n}\n\n/**\n * The default. A bucket refills at permits/window and holds at most burst; a call takes cost tokens or is\n * refused. Constant time, constant memory, and it tolerates bursts, which is what real API traffic looks like.\n */\nclass TokenBucket implements RateLimitAlgorithm {\n    public Decision tryAcquire(KeyState s, Rule rule, long cost, long nowMs) {\n        refill(s, rule, nowMs);\n        if (s.tokens &gt;= cost) {\n            s.tokens -= cost;                                    // charge first, then admit\n            return Decision.allow((long) Math.floor(s.tokens));\n        }\n        double missing = cost - s.tokens;\n        long waitMs = (long) Math.ceil(missing / rule.perMs());   // exactly when enough permits exist\n        return Decision.deny((long) Math.floor(s.tokens), waitMs, &quot;no permits&quot;);\n    }\n    public void refund(KeyState s, Rule rule, long cost, long nowMs) {\n        refill(s, rule, nowMs);\n        s.tokens = Math.min(rule.burst(), s.tokens + cost);       // giving back may never exceed the burst\n    }\n    public long remaining(KeyState s, Rule rule, long nowMs) {\n        refill(s, rule, nowMs);\n        return (long) Math.floor(s.tokens);\n    }\n    public long capacity(Rule rule) { return rule.burst(); }\n    /**\n     * Bring tokens and lastRefillMs to nowMs as one step. Elapsed time is the only source of new permits, so\n     * there is no timer and no background thread: an idle bucket costs nothing until someone asks about it.\n     * A clock that went backwards mints nothing, and the measurement point is not moved back either. The\n     * cap is applied every time, so a burst that ops lowered live pulls the held tokens down at once.\n     */\n    private void refill(KeyState s, Rule rule, long nowMs) {\n        long elapsed = nowMs - s.lastRefillMs;\n        if (elapsed &gt; 0) {\n            s.tokens += elapsed * rule.perMs();\n            s.lastRefillMs = nowMs;\n        }\n        s.tokens = Math.min(rule.burst(), s.tokens);\n    }\n    public String name() { return &quot;token bucket&quot;; }\n}\n\n/**\n * A counter that resets on the hour, the minute, the second. Four lines, and wrong at the boundary: a client\n * can spend a full window just before the reset and a full window just after, so twice the limit passes in an\n * instant. Kept here because interviewers ask for it by name, and because the failure test proves the flaw.\n */\nclass FixedWindow implements RateLimitAlgorithm {\n    public Decision tryAcquire(KeyState s, Rule rule, long cost, long nowMs) {\n        roll(s, rule, nowMs);\n        if (s.currentCount + cost &lt;= rule.permits()) {\n            s.currentCount += cost;\n            return Decision.allow(rule.permits() - s.currentCount);\n        }\n        return Decision.deny(rule.permits() - s.currentCount, s.windowStartMs + rule.windowMs() - nowMs, &quot;window full&quot;);\n    }\n    public void refund(KeyState s, Rule rule, long cost, long nowMs) {\n        roll(s, rule, nowMs);\n        s.currentCount = Math.max(0, s.currentCount - cost);\n    }\n    public long remaining(KeyState s, Rule rule, long nowMs) {\n        roll(s, rule, nowMs);\n        return Math.max(0, rule.permits() - s.currentCount);\n    }\n    public long capacity(Rule rule) { return rule.permits(); }\n    /**\n     * Move to the window containing nowMs, remembering the one just before it. Windows sit on an absolute\n     * grid - they reset on the second, the minute, the hour - which is exactly why a client can predict the\n     * boundary and spend twice its limit across it.\n     */\n    static void roll(KeyState s, Rule rule, long nowMs) {\n        long w = rule.windowMs();\n        long aligned = Math.floorDiv(nowMs, w) * w;\n        long steps = (aligned - s.windowStartMs) / w;\n        if (steps &lt;= 0) return;                           // same window, or the clock went backwards\n        s.previousCount = (steps == 1) ? s.currentCount : 0;\n        s.currentCount = 0;\n        s.windowStartMs = aligned;\n    }\n    public String name() { return &quot;fixed window&quot;; }\n}\n\n/**\n * The O(1) answer to the boundary: count this window exactly and charge a share of the previous one, weighted\n * by how much of it is still inside the last `window` milliseconds. Two counters per key. It assumes the\n * previous window&#x27;s calls were spread evenly: on real traffic that is close (Cloudflare, which runs it,\n * measured 0.003% of requests decided wrongly), but a client that packs the end of a window can still get\n * near twice the limit over a sliding minute. When that matters, use the log below.\n */\nclass SlidingWindowCounter implements RateLimitAlgorithm {\n    public Decision tryAcquire(KeyState s, Rule rule, long cost, long nowMs) {\n        FixedWindow.roll(s, rule, nowMs);\n        double estimated = estimate(s, rule, nowMs);\n        if (estimated + cost &lt;= rule.permits() + 1e-9) {           // a hair of slack for rounding in the weight\n            s.currentCount += cost;\n            return Decision.allow(Math.max(0, (long) Math.floor(rule.permits() - (estimated + cost) + 1e-9)));\n        }\n        return Decision.deny(Math.max(0, (long) Math.floor(rule.permits() - estimated + 1e-9)),\n                             waitMs(s, rule, cost, nowMs), &quot;window full&quot;);\n    }\n    public void refund(KeyState s, Rule rule, long cost, long nowMs) {\n        FixedWindow.roll(s, rule, nowMs);\n        s.currentCount = Math.max(0, s.currentCount - cost);\n    }\n    public long remaining(KeyState s, Rule rule, long nowMs) {\n        FixedWindow.roll(s, rule, nowMs);\n        return Math.max(0, (long) Math.floor(rule.permits() - estimate(s, rule, nowMs) + 1e-9));\n    }\n    public long capacity(Rule rule) { return rule.permits(); }\n    /** This window&#x27;s exact count plus the previous window&#x27;s count times the fraction still in range. */\n    private double estimate(KeyState s, Rule rule, long nowMs) {\n        double into = nowMs - s.windowStartMs;\n        double weight = Math.min(1.0, Math.max(0.0, (rule.windowMs() - into) / (double) rule.windowMs()));\n        return s.previousCount * weight + s.currentCount;\n    }\n    /**\n     * The shortest wait after which this call fits. If this window still has room, wait until the previous\n     * window&#x27;s share has faded enough; if it has none, wait for the next window, where this window&#x27;s count\n     * becomes the share that fades.\n     */\n    private long waitMs(KeyState s, Rule rule, long cost, long nowMs) {\n        double w = rule.windowMs(), into = nowMs - s.windowStartMs;\n        long room = rule.permits() - s.currentCount - cost;\n        if (room &gt;= 0) return (long) Math.ceil(w * (1 - room / (double) s.previousCount) - into);\n        return (long) Math.ceil(w - into + w * (1 - (rule.permits() - cost) / (double) s.currentCount));\n    }\n    public String name() { return &quot;sliding window counter&quot;; }\n}\n\n/**\n * The exact one: keep a timestamp per permit spent and drop the ones older than the window. No boundary error\n * at all, and the price is memory - one boxed Long per permit, about 30 bytes, so 17 KB for a key on 600 a\n * minute - and O(k) work per call to drop what expired. Right for a login endpoint at five per minute; wrong\n * for a public API at six hundred per minute per key.\n */\nclass SlidingWindowLog implements RateLimitAlgorithm {\n    public Decision tryAcquire(KeyState s, Rule rule, long cost, long nowMs) {\n        evict(s, rule, nowMs);\n        if (s.log.size() + cost &lt;= rule.permits()) {\n            for (long i = 0; i &lt; cost; i++) s.log.addLast(nowMs);\n            return Decision.allow(rule.permits() - s.log.size());\n        }\n        long need = s.log.size() + cost - rule.permits();          // how many old stamps must expire first\n        Iterator&lt;Long&gt; it = s.log.iterator();\n        long expiresAt = nowMs;\n        for (long i = 0; i &lt; need; i++) expiresAt = it.next();      // the need-th oldest decides the wait\n        return Decision.deny(Math.max(0, rule.permits() - s.log.size()), expiresAt + rule.windowMs() - nowMs, &quot;window full&quot;);\n    }\n    public void refund(KeyState s, Rule rule, long cost, long nowMs) {\n        evict(s, rule, nowMs);\n        for (long i = 0; i &lt; cost &amp;&amp; !s.log.isEmpty(); i++) s.log.pollLast();\n    }\n    public long remaining(KeyState s, Rule rule, long nowMs) {\n        evict(s, rule, nowMs);\n        return Math.max(0, rule.permits() - s.log.size());\n    }\n    public long capacity(Rule rule) { return rule.permits(); }\n    /**\n     * Drop every timestamp that has fallen out of the trailing window. One call may drop many, but each stamp\n     * is added once and dropped once, so the work averages out to O(1) per permit (amortised).\n     */\n    private void evict(KeyState s, Rule rule, long nowMs) {\n        long cutoff = nowMs - rule.windowMs();\n        while (!s.log.isEmpty() &amp;&amp; s.log.peekFirst() &lt;= cutoff) s.log.pollFirst();\n    }\n    public String name() { return &quot;sliding window log&quot;; }\n}\n\n/** Which rule applies to a key. One method, handed in, so &quot;PRO gets ten times FREE&quot; is config, not an if. */\ninterface RuleResolver {\n    /** The rule for this key right now. Read once per decision, so one decision never sees two rules. */\n    Rule ruleFor(String key);\n}\n\n/** Everybody gets the same rule. The default, and what a first version ships with. */\nclass FlatRules implements RuleResolver {\n    private final Rule rule;\n    FlatRules(Rule rule) { this.rule = rule; }\n    public Rule ruleFor(String key) { return rule; }\n}\n\n/**\n * A rule per tier, held in a live reference so ops can raise a limit during a sale without a restart. The\n * limiter reads it once per call, so a change takes effect on the next decision and never inside one.\n */\nclass TierRules implements RuleResolver {\n    private final Map&lt;String, Tier&gt; tierOf = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;Tier, AtomicReference&lt;Rule&gt;&gt; rules = new EnumMap&lt;&gt;(Tier.class);\n    /** Starts every tier on the same rule; callers then raise the ones they sell. */\n    TierRules(Rule defaultRule) {\n        for (Tier t : Tier.values()) rules.put(t, new AtomicReference&lt;&gt;(defaultRule));\n    }\n    /** Put a key on a plan. Unknown keys are FREE. */\n    void assign(String key, Tier tier) { tierOf.put(key, tier); }\n    /** Change a tier&#x27;s rule while the process runs. The next decision sees it; the current one does not. */\n    void setRule(Tier tier, Rule rule) { rules.get(tier).set(rule); }\n    public Rule ruleFor(String key) { return rules.get(tierOf.getOrDefault(key, Tier.FREE)).get(); }\n}\n\n/**\n * The one call everything in front of the service implements: may this key spend `cost` permits now? It is\n * the seam the follow-ups hang off - a dry-run wrapper, a second global budget, a Redis-backed one - and it\n * is why none of them has to open the limiter.\n */\ninterface Limiter {\n    /**\n     * Decide and charge. Must never block, and a refusal always carries a usable retry-after - or NEVER, for a\n     * call bigger than the whole bucket, which no wait can help.\n     */\n    Decision allow(String key, long cost);\n    /** One permit, the common case. */\n    default Decision allow(String key) { return allow(key, 1); }\n}\n\n/** Anyone who wants to know what was decided. Called after the lock is released, never inside it. */\ninterface LimiterObserver {\n    /** One decision happened for one key. Must not throw; if it does, the limiter swallows it. */\n    void onDecision(String key, Decision d);\n}\n\n/** Allowed and refused counters: the observer every service actually ships. */\nclass MetricsCounter implements LimiterObserver {\n    private final AtomicLong allowed = new AtomicLong(), refused = new AtomicLong();\n    public void onDecision(String key, Decision d) { (d.allowed() ? allowed : refused).incrementAndGet(); }\n    /** How many calls were admitted since startup. */\n    long allowed() { return allowed.get(); }\n    /** How many calls were refused since startup. */\n    long refused() { return refused.get(); }\n}\n\n/**\n * The front door. Holds one KeyState per key and hands each decision to the algorithm it was configured with.\n * What it guarantees: never more than the rule allows for a key, whatever the thread count; O(1) time and\n * memory per call (the sliding log excepted); no timer, no background refill; nothing slow inside a lock.\n */\nclass RateLimiter implements Limiter {\n    private final ConcurrentHashMap&lt;String, KeyState&gt; keys = new ConcurrentHashMap&lt;&gt;();\n    private final List&lt;LimiterObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n    private volatile RateLimitAlgorithm algo = new TokenBucket();\n    private volatile RuleResolver rules = new FlatRules(Rule.perSecond(5));\n    private volatile Clock clock = new SystemClock();\n\n    /** Hand in the three things that change: how to decide, what the limits are, and where time comes from. */\n    void configure(RateLimitAlgorithm algo, RuleResolver rules, Clock clock) {\n        this.algo = algo; this.rules = rules; this.clock = clock;\n    }\n    /** Add a listener. It hears about every decision, after the lock, and may not influence one. */\n    void addObserver(LimiterObserver o) { observers.add(o); }\n\n    /** One permit for this key. */\n    public Decision allow(String key) { return allow(key, 1); }\n\n    /**\n     * The critical step, in this order: read the rule once and the clock once, so the whole decision sees one\n     * policy and one instant; then, under this key&#x27;s lock only, refill from elapsed time and charge. Nothing\n     * is admitted before it is charged - a permit spent can be refunded, a request admitted cannot be recalled.\n     * Observers are told afterwards, outside the lock. A call bigger than the whole bucket is refused for good\n     * first: a Retry-After for it would send the client round a retry loop that can never succeed.\n     */\n    public Decision allow(String key, long cost) {\n        if (cost &lt;= 0) throw new IllegalArgumentException(&quot;cost must be &gt; 0&quot;);\n        RateLimitAlgorithm algo = this.algo;                        // read once, like the rule and the clock\n        Rule rule = rules.ruleFor(key);\n        if (cost &gt; algo.capacity(rule)) {                           // no wait can ever make room for this call\n            Decision never = Decision.never(remaining(key), &quot;costs more than this key can ever hold&quot;);\n            publish(key, never);\n            return never;\n        }\n        long now = clock.nowMs();\n        KeyState s = lockState(key, rule, now);\n        Decision d;\n        try {\n            d = algo.tryAcquire(s, rule, cost, now);\n            s.lastSeenMs = now;\n        } finally {\n            s.lock.unlock();\n        }\n        publish(key, d);\n        return d;\n    }\n\n    /**\n     * Give permits back for a call that was admitted and then never made - the downstream call threw, or a\n     * later layer refused it. This is the compensating step that keeps the budget honest; it can never push a\n     * bucket above its burst, and an unknown key is ignored rather than created. Same removed-state check as\n     * allow(): a refund paid into a state the sweeper just deleted would vanish. Call it once, straight after\n     * the failed call: two refunds give back twice, and a late one returns a permit that time already returned.\n     */\n    void refund(String key, long cost) {\n        if (cost &lt;= 0) return;\n        Rule rule = rules.ruleFor(key);\n        long now = clock.nowMs();\n        while (true) {\n            KeyState s = keys.get(key);\n            if (s == null) return;                            // never seen, or already swept: nothing to give back\n            s.lock.lock();\n            try {\n                if (s.removed) continue;                      // swept between the lookup and the lock: look again\n                algo.refund(s, rule, cost, now);\n                s.lastSeenMs = now;\n                return;\n            } finally { s.lock.unlock(); }\n        }\n    }\n\n    /**\n     * How many permits this key has right now, charging nothing. O(1). An unknown key answers what a new key\n     * would have (a full burst, for the bucket) and is deliberately not created. No removed-state retry here\n     * on purpose: a read that lands on a state the sweeper has just deleted answers from that state&#x27;s own\n     * numbers, which at worst is fewer permits than the key&#x27;s next call will find.\n     */\n    long remaining(String key) {\n        Rule rule = rules.ruleFor(key);\n        long now = clock.nowMs();\n        KeyState s = keys.get(key);\n        if (s == null) return algo.remaining(new KeyState(key, rule, now), rule, now);   // a throwaway new state\n        s.lock.lock();\n        try { return algo.remaining(s, rule, now); } finally { s.lock.unlock(); }\n    }\n\n    /**\n     * Forget keys nobody has asked about for idleMs. Lossless when idleMs is long enough for an idle key to be\n     * full again - for the bucket, burst divided by the refill rate, which is one window when the burst is no\n     * bigger than the permits, as on every plan here - because then a fresh state is the same state. Never\n     * called on the request path: a scheduled task runs it, taking each key&#x27;s lock only while it checks it.\n     */\n    int sweepIdle(long idleMs) {\n        long now = clock.nowMs();\n        int removed = 0;\n        for (Map.Entry&lt;String, KeyState&gt; e : keys.entrySet()) {\n            KeyState s = e.getValue();\n            if (now - s.lastSeenMs &lt; idleMs) continue;\n            s.lock.lock();\n            try {\n                if (now - s.lastSeenMs &gt;= idleMs &amp;&amp; keys.remove(e.getKey(), s)) { s.removed = true; removed++; }\n            } finally { s.lock.unlock(); }\n        }\n        return removed;\n    }\n\n    /** How many keys are held right now. The number the sweeper exists to bound. */\n    int size() { return keys.size(); }\n\n    /** This key&#x27;s live state, or null. Only for a test that holds a key&#x27;s lock on purpose; never on the request path. */\n    KeyState stateOf(String key) { return keys.get(key); }\n\n    /**\n     * Find or create this key&#x27;s state and return it LOCKED. The loop closes the one race the map creates: the\n     * sweeper can delete a state between the lookup and the lock, and a permit spent on a deleted state would\n     * be lost, so a caller that finds a removed state simply fetches again.\n     */\n    private KeyState lockState(String key, Rule rule, long now) {\n        while (true) {\n            KeyState s = keys.computeIfAbsent(key, k -&gt; new KeyState(k, rule, now));\n            s.lock.lock();\n            if (!s.removed) return s;\n            s.lock.unlock();\n        }\n    }\n\n    /** Tell the listeners, after the unlock, each in its own try/catch: a broken listener is not an outage. */\n    private void publish(String key, Decision d) {\n        for (LimiterObserver o : observers) {\n            try { o.onDecision(key, d); } catch (RuntimeException ignored) { }\n        }\n    }\n}\n\n/**\n * The caller: a web filter. It owns no state of its own, which is why it is not a model but a thin caller.\n * Its whole job is turning a Decision into what a client sees: 200, or 429 with the headers that tell the\n * client when to come back.\n */\nclass ApiFilter {\n    private final Limiter limiter;\n    ApiFilter(Limiter limiter) { this.limiter = limiter; }\n    /** The status code this request would get. */\n    int handle(String apiKey, long cost) { return limiter.allow(apiKey, cost).allowed() ? 200 : 429; }\n    /** The response headers for a decision, the way a client library reads them. */\n    static String headers(Decision d) {\n        String wait = d.retryAfterMs() == Decision.NEVER ? &quot;never (split the call)&quot; : d.retryAfterMs() + &quot;ms&quot;;\n        return &quot;X-RateLimit-Remaining: &quot; + d.remaining()\n             + (d.allowed() ? &quot;&quot; : &quot; | Retry-After: &quot; + wait + &quot; | reason: &quot; + d.reason());\n    }\n}\n\n/** Runs the system: a demo of every flow, then a hundred threads on one key proving the invariant. */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        // ---------------- demo: one tenant, one afternoon, on a clock we control\n        ManualClock clock = new ManualClock(0);\n        TierRules rules = new TierRules(Rule.perMinute(60, 10));      // FREE: 60/min, burst 10\n        rules.setRule(Tier.PRO, Rule.perMinute(600, 100));            // PRO:  600/min, burst 100\n        rules.assign(&quot;acme&quot;, Tier.PRO);\n        RateLimiter limiter = new RateLimiter();\n        MetricsCounter metrics = new MetricsCounter();\n        limiter.configure(new TokenBucket(), rules, clock);\n        limiter.addObserver(metrics);\n        ApiFilter filter = new ApiFilter(limiter);\n\n        System.out.println(&quot;algorithm: token bucket | acme is PRO: 600/min, burst 100 | 10 permits a second&quot;);\n        Decision first = limiter.allow(&quot;acme&quot;);\n        System.out.println(&quot;first call ever          -&gt; &quot; + first.allowed() + &quot;  &quot; + ApiFilter.headers(first));\n\n        clock.advance(400);                                            // 0.4 s later: 4 permits minted\n        int ok = 0, blocked = 0; Decision last = first;\n        for (int i = 0; i &lt; 120; i++) { last = limiter.allow(&quot;acme&quot;); if (last.allowed()) ok++; else blocked++; }\n        System.out.println(&quot;a script fires 120 calls -&gt; allowed &quot; + ok + &quot;, refused &quot; + blocked\n                         + &quot;  &quot; + ApiFilter.headers(last));\n\n        clock.advance(last.retryAfterMs());                            // the client honours Retry-After\n        System.out.println(&quot;retry after &quot; + last.retryAfterMs() + &quot;ms          -&gt; &quot; + limiter.allow(&quot;acme&quot;).allowed());\n\n        clock.advance(1_900);                                          // 19 more permits minted\n        int retried = 0;\n        for (int i = 0; i &lt; 19; i++) if (limiter.allow(&quot;acme&quot;).allowed()) retried++;\n        System.out.println(&quot;19 queued retries        -&gt; allowed &quot; + retried + &quot;, remaining &quot; + limiter.remaining(&quot;acme&quot;));\n\n        clock.advance(500);                                            // 5 more permits\n        Decision heavy = limiter.allow(&quot;acme&quot;, 5);                     // one heavy endpoint costs five\n        System.out.println(&quot;a heavy endpoint costs 5 -&gt; &quot; + heavy.allowed() + &quot;, remaining &quot;\n                         + limiter.remaining(&quot;acme&quot;) + &quot; | an unseen FREE key starts at &quot;\n                         + limiter.remaining(&quot;newcomer&quot;));\n        limiter.refund(&quot;acme&quot;, 5);                                     // ... and then the call never happened\n        System.out.println(&quot;that call never happened -&gt; refunded, remaining &quot; + limiter.remaining(&quot;acme&quot;));\n        Decision batch = limiter.allow(&quot;acme&quot;, 150);                   // bigger than the whole burst of 100\n        System.out.println(&quot;a batch that costs 150   -&gt; &quot; + batch.allowed() + &quot;  &quot; + ApiFilter.headers(batch));\n\n        System.out.println(&quot;HTTP status through the filter: &quot; + filter.handle(&quot;acme&quot;, 1)\n                         + &quot; | keys held: &quot; + limiter.size());\n        clock.advance(90_000);                                         // idle for more than one window\n        System.out.println(&quot;sweeper drops idle keys  -&gt; removed &quot; + limiter.sweepIdle(60_000)\n                         + &quot;, keys held &quot; + limiter.size());\n        System.out.println(&quot;metrics: allowed &quot; + metrics.allowed() + &quot;, refused &quot; + metrics.refused());\n\n        // ---------------- the race: a hundred threads, one key, one instant, a budget of fifty\n        ManualClock frozen = new ManualClock(0);                       // frozen, so no permit is minted mid-race\n        RateLimiter hot = new RateLimiter();\n        hot.configure(new TokenBucket(), new FlatRules(new Rule(50, 1_000L, 50)), frozen);\n        int threads = 100;\n        CountDownLatch start = new CountDownLatch(1), done = new CountDownLatch(threads);\n        AtomicInteger admitted = new AtomicInteger();\n        ExecutorService pool = Executors.newFixedThreadPool(32);\n        for (int i = 0; i &lt; threads; i++) pool.submit(() -&gt; {\n            try { start.await(); if (hot.allow(&quot;hot-key&quot;).allowed()) admitted.incrementAndGet(); }\n            catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n            finally { done.countDown(); }\n        });\n        start.countDown();\n        done.await();\n        pool.shutdown();\n        System.out.println(&quot;\\n100 threads, one key, limit 50 -&gt; admitted &quot; + admitted.get()\n                         + &quot;, refused &quot; + (threads - admitted.get()) + &quot;, remaining &quot; + hot.remaining(&quot;hot-key&quot;));\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n// ---- ext: the bug, reproduced. Read, check, write on a shared counter, and call it atomic.\n/**\n * What everybody writes first: a counter per key, no lock. Two threads read &quot;one left&quot;, both decide yes,\n * both write zero, and two requests go through a budget of one. The demo runs it so the number is real.\n */\nclass UnsafeLimiter implements Limiter {\n    private final Map&lt;String, long[]&gt; spent = new ConcurrentHashMap&lt;&gt;();\n    private final long permits;\n    UnsafeLimiter(long permits) { this.permits = permits; }\n    /** Deliberately wrong: the read, the check and the write are three steps with a gap between them. */\n    public Decision allow(String key, long cost) {\n        long[] c = spent.computeIfAbsent(key, k -&gt; new long[1]);\n        long seen = c[0];                    // read ...\n        if (seen + cost &lt;= permits) {        // ... check ...\n            Thread.onSpinWait();             // ... the gap, widened here so the bug shows on every run\n            c[0] = seen + cost;              // ... write, over whatever another thread wrote in between\n            return Decision.allow(permits - c[0]);\n        }\n        return Decision.deny(0, 1, &quot;window full&quot;);\n    }\n}\n\n// ---- ext: rung one of the ladder: the same bucket with no lock at all, using compare-and-set\n/**\n * The whole bucket as one immutable value in an AtomicReference. Refill-and-deduct becomes compare-and-set:\n * compute the new value from the one you read, and swap it in only if the reference still holds what you read.\n * A thread that loses recomputes against the winner&#x27;s value and tries again. No lock and no thread put to\n * sleep, and it cannot livelock (spin forever with nobody getting through): somebody wins every round. One\n * trap: a thread may have read the clock before another thread&#x27;s swap, so the measured-at instant only ever\n * moves forward - moving it back would let the next caller mint the same milliseconds twice.\n */\nclass CasBucket implements Limiter {\n    /** The pair that must move together: permits, and the instant they were measured at. */\n    record Snap(double tokens, long atMs) { }\n    private final ConcurrentHashMap&lt;String, AtomicReference&lt;Snap&gt;&gt; keys = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicLong retries = new AtomicLong();\n    private final Rule rule;\n    private final Clock clock;\n    CasBucket(Rule rule, Clock clock) { this.rule = rule; this.clock = clock; }\n    public Decision allow(String key, long cost) {\n        if (cost &gt; rule.burst()) return Decision.never(0, &quot;costs more than this key can ever hold&quot;);\n        AtomicReference&lt;Snap&gt; ref = keys.computeIfAbsent(key,\n                k -&gt; new AtomicReference&lt;&gt;(new Snap(rule.burst(), clock.nowMs())));\n        while (true) {\n            long now = clock.nowMs();\n            Snap cur = ref.get();\n            long elapsed = Math.max(0, now - cur.atMs());\n            double tokens = Math.min(rule.burst(), cur.tokens() + elapsed * rule.perMs());\n            if (tokens &lt; cost)\n                return Decision.deny((long) Math.floor(tokens), (long) Math.ceil((cost - tokens) / rule.perMs()), &quot;no permits&quot;);\n            long measuredAt = Math.max(now, cur.atMs());                          // never backwards\n            if (ref.compareAndSet(cur, new Snap(tokens - cost, measuredAt)))      // the whole decision, one swap\n                return Decision.allow((long) Math.floor(tokens - cost));\n            retries.incrementAndGet();                                            // somebody else won; redo the sums\n        }\n    }\n    /** How often a thread lost the swap and recomputed: the measurable price of many threads on one key. */\n    long retries() { return retries.get(); }\n}\n\n// ---- ext: shadow mode, so a new limit can be measured for a week before it blocks anyone\n/**\n * Wraps any limiter, runs the real algorithm, charges the real permits - and then admits everything anyway,\n * counting what it would have blocked. The answer to &quot;we ship to a live tenant tomorrow and I cannot reject\n * real traffic on day one&quot;: turn the count into a dashboard, and flip one wiring line when it looks right.\n */\nclass ShadowLimiter implements Limiter {\n    private final Limiter delegate;\n    private final AtomicLong observed = new AtomicLong(), wouldHaveBlocked = new AtomicLong();\n    ShadowLimiter(Limiter delegate) { this.delegate = delegate; }\n    public Decision allow(String key, long cost) {\n        Decision d = delegate.allow(key, cost);\n        observed.incrementAndGet();\n        if (!d.allowed()) wouldHaveBlocked.incrementAndGet();\n        return Decision.allow(d.remaining());                 // shadow mode: nobody is actually refused\n    }\n    /** How many calls went through the limiter. */\n    long observed() { return observed.get(); }\n    /** How many of them the real limit would have refused. The number that decides whether to switch it on. */\n    long wouldHaveBlocked() { return wouldHaveBlocked.get(); }\n}\n\n// ---- ext: layered limits: per key AND a global budget, with a refund when a later layer refuses\n/**\n * Two invariants at once: this tenant may spend 600 a minute, and the whole service may spend 10,000 a minute.\n * Every layer is charged in order, and if a later layer refuses, the earlier ones are refunded - otherwise a\n * tenant loses permits for a request that never happened. That refund is the compensating step of this design.\n * Per user AND per endpoint is the same class: two layers, keyed by user and by user plus route.\n */\nclass LayeredLimiter implements Limiter {\n    /** One budget: its name for the error, the limiter that holds it, and how the key maps into it. */\n    record Layer(String name, RateLimiter limiter, Function&lt;String, String&gt; keyOf) { }\n    private final List&lt;Layer&gt; layers;\n    LayeredLimiter(List&lt;Layer&gt; layers) { this.layers = List.copyOf(layers); }\n    public Decision allow(String key, long cost) {\n        List&lt;Layer&gt; charged = new ArrayList&lt;&gt;();\n        for (Layer l : layers) {\n            Decision d = l.limiter().allow(l.keyOf().apply(key), cost);\n            if (!d.allowed()) {\n                for (Layer c : charged) c.limiter().refund(c.keyOf().apply(key), cost);   // give back, in full, at once\n                return new Decision(false, d.remaining(), d.retryAfterMs(), l.name() + &quot; limit&quot;);   // that layer&#x27;s wait\n            }\n            charged.add(l);\n        }\n        return Decision.allow(layers.get(0).limiter().remaining(layers.get(0).keyOf().apply(key)));\n    }\n}\n\n// ---- ext: back-pressure: wait for a permit until a deadline instead of failing fast\n/**\n * Back-pressure means slowing a caller down instead of failing it. Some callers - a batch job, a queue\n * consumer - would rather wait than fail. Retry-After already says how long the wait is, so waiting is a\n * loop around the same decision, bounded by a timeout the caller sets. Never offer this to a web request: a\n * held thread under load is how a service falls over.\n */\nclass WaitingLimiter {\n    private final Limiter delegate;\n    WaitingLimiter(Limiter delegate) { this.delegate = delegate; }\n    /**\n     * Try until the permit arrives or timeoutMs has passed; true if admitted. Sleeps exactly the retry-after the\n     * limiter reported, never a fixed poll interval, and gives up at once on a call that can never fit. The\n     * deadline is kept on System.nanoTime, which a correction to the wall clock cannot move.\n     */\n    boolean acquire(String key, long cost, long timeoutMs) throws InterruptedException {\n        long deadline = System.nanoTime() + timeoutMs * 1_000_000L;\n        while (true) {\n            Decision d = delegate.allow(key, cost);\n            if (d.allowed()) return true;\n            if (d.retryAfterMs() == Decision.NEVER) return false;\n            long leftMs = (deadline - System.nanoTime()) / 1_000_000L;\n            if (leftMs &lt;= 0) return false;\n            Thread.sleep(Math.min(d.retryAfterMs(), leftMs));\n        }\n    }\n}\n\n// ---- ext: twelve pods, one budget: the distributed limiter\n/**\n * A stand-in for Redis: a map plus one lock, because a single-threaded server IS a lock every client shares.\n * The method below is the Lua script, a small program Redis runs as one step with no other command in\n * between. Running it on the server makes refill-and-deduct atomic (one step nobody can see half-done) across\n * twelve pods, exactly as the per-key lock does across threads inside one pod. The script reads the time from\n * Redis itself, so twelve pods whose clocks disagree still share one clock, and its timestamp only moves forward.\n *\n * &lt;pre&gt;\n * -- KEYS[1] = the key   ARGV: burst, perMs, cost\n * local t      = redis.call(&#x27;TIME&#x27;)                     -- the server&#x27;s clock, not the pod&#x27;s\n * local now    = t[1] * 1000 + math.floor(t[2] / 1000)\n * local burst, perMs, cost = tonumber(ARGV[1]), tonumber(ARGV[2]), tonumber(ARGV[3])\n * local b      = redis.call(&#x27;HMGET&#x27;, KEYS[1], &#x27;tokens&#x27;, &#x27;ts&#x27;)\n * local tokens = tonumber(b[1]) or burst\n * local ts     = tonumber(b[2]) or now\n * if now &amp;gt; ts then tokens = math.min(burst, tokens + (now - ts) * perMs); ts = now end\n * local ok = tokens &amp;gt;= cost\n * if ok then tokens = tokens - cost end\n * redis.call(&#x27;HSET&#x27;, KEYS[1], &#x27;tokens&#x27;, tokens, &#x27;ts&#x27;, ts)\n * redis.call(&#x27;PEXPIRE&#x27;, KEYS[1], 120000)             -- TTL: Redis deletes an idle key by itself\n * if ok then return math.floor(tokens) end\n * return -math.ceil((cost - tokens) / perMs)          -- refused: minus the wait in ms\n * &lt;/pre&gt;\n */\nclass RedisLike {\n    private final Map&lt;String, double[]&gt; store = new HashMap&lt;&gt;();     // key -&gt; { tokens, measuredAtMs }\n    private final ReentrantLock singleThread = new ReentrantLock();  // Redis&#x27;s one thread, modelled\n    private final Clock serverClock;                                  // redis.call(&#x27;TIME&#x27;)\n    RedisLike(Clock serverClock) { this.serverClock = serverClock; }\n    /**\n     * The script above, in Java: refill from the server&#x27;s elapsed time and deduct, as one indivisible step.\n     * Returns the permits left (zero or more) when admitted, or minus the wait in ms when refused.\n     */\n    long takeToken(String key, double burst, double perMs, long cost) {\n        singleThread.lock();\n        try {\n            long now = serverClock.nowMs();\n            double[] st = store.computeIfAbsent(key, k -&gt; new double[] { burst, now });\n            if (now &gt; st[1]) { st[0] = Math.min(burst, st[0] + (now - st[1]) * perMs); st[1] = now; }\n            if (st[0] &gt;= cost) { st[0] -= cost; return (long) Math.floor(st[0]); }\n            return -(long) Math.ceil((cost - st[0]) / perMs);\n        } finally { singleThread.unlock(); }\n    }\n}\n\n/**\n * The same interface, backed by the shared server, so twelve pods enforce one budget instead of twelve. The\n * price is a network hop on every request - so keep the local bucket in front of it as a cheap first filter,\n * and decide out loud what happens when Redis is down: fail open (let every call through) or fail closed\n * (refuse every call).\n */\nclass RedisTokenBucket implements Limiter {\n    private final RedisLike redis;\n    private final Rule rule;\n    RedisTokenBucket(RedisLike redis, Rule rule) { this.redis = redis; this.rule = rule; }\n    public Decision allow(String key, long cost) {\n        if (cost &gt; rule.burst()) return Decision.never(0, &quot;costs more than this key can ever hold&quot;);\n        long r = redis.takeToken(key, rule.burst(), rule.perMs(), cost);\n        return r &gt;= 0 ? Decision.allow(r) : Decision.deny(0, -r, &quot;fleet limit&quot;);\n    }\n}\n\n// ---- ext: a limit per endpoint, and a heavy endpoint that costs more than one permit\n/**\n * Two questions that look big and are not. &quot;Different limits per endpoint&quot; is a different key - tenant plus\n * route - so the map grows by the number of routes and nothing else changes. &quot;A search costs more than a\n * ping&quot; is the cost argument that has been on allow() all along, read from a table.\n */\nclass Endpoints {\n    private final Map&lt;String, Long&gt; cost = new ConcurrentHashMap&lt;&gt;();\n    /** Say what one call to this route is worth in permits. */\n    void price(String route, long permits) { cost.put(route, permits); }\n    /** What this route costs; anything unpriced costs one. */\n    long costOf(String route) { return cost.getOrDefault(route, 1L); }\n    /** The key a decision is made against: one budget per tenant per route. */\n    static String key(String tenant, String route) { return tenant + &quot;:&quot; + route; }\n}\n\n// ---- ext: warm-up, for the cold cache behind you\n/**\n * Wraps any rule source and scales the permits up from a tenth to the full limit over the warm-up period,\n * measured from the first time each key was seen. Wraps rather than replaces: the tier rules underneath are\n * untouched, which is the same Decorator move as surge pricing on a parking lot.\n */\nclass WarmUpRules implements RuleResolver {\n    private final RuleResolver base;\n    private final long warmUpMs;\n    private final Clock clock;\n    private final Map&lt;String, Long&gt; firstSeen = new ConcurrentHashMap&lt;&gt;();\n    WarmUpRules(RuleResolver base, long warmUpMs, Clock clock) { this.base = base; this.warmUpMs = warmUpMs; this.clock = clock; }\n    public Rule ruleFor(String key) {\n        Rule r = base.ruleFor(key);\n        long now = clock.nowMs();\n        long since = now - firstSeen.computeIfAbsent(key, k -&gt; now);\n        if (since &gt;= warmUpMs) return r;\n        double f = Math.max(0.1, (double) since / warmUpMs);            // a tenth, rising to the whole limit\n        return new Rule(Math.max(1, (long) (r.permits() * f)), r.windowMs(), Math.max(1, (long) (r.burst() * f)));\n    }\n}\n\n// ---- ext: the leaky bucket, properly: GCRA keeps one moment per key where the token bucket keeps two numbers\n/**\n * A leaky bucket used as a meter is the token bucket turned upside down: water drains out at the steady rate,\n * each call pours its cost in, and a call that would overflow is refused. GCRA (the generic cell rate\n * algorithm, which the redis-cell module runs) keeps that bucket as one moment: when it will have drained\n * empty. A call pushes that moment one interval later per permit (an interval is windowMs / permits) and is\n * admitted if the moment stays within burst intervals of now. To keep every sum exact, time is counted in\n * units of 1/permits of a millisecond, so an interval is exactly windowMs units even at 3 a second (333 1/3\n * ms each). The moment is kept as whole milliseconds in lastRefillMs plus leftover units in currentCount,\n * which a new KeyState already holds as &quot;now&quot; and 0. The other reading of &quot;leaky bucket&quot;, a queue that lets\n * calls out at a fixed pace, delays calls instead of refusing them; WaitingLimiter above is the nearest thing.\n */\nclass Gcra implements RateLimitAlgorithm {\n    public Decision tryAcquire(KeyState s, Rule rule, long cost, long nowMs) {\n        long interval = rule.windowMs(), now = nowMs * rule.permits();\n        long empty = Math.max(emptyAt(s, rule), now);             // when the bucket will have drained\n        long next = empty + cost * interval;                      // ... once this call has poured in its cost\n        long limit = now + rule.burst() * interval;               // the most it may hold, as a moment\n        if (next &gt; limit)\n            return Decision.deny(Math.max(0, (limit - empty) / interval),\n                                 Math.ceilDiv(next - limit, rule.permits()), &quot;no permits&quot;);\n        s.lastRefillMs = Math.floorDiv(next, rule.permits());\n        s.currentCount = Math.floorMod(next, rule.permits());\n        return Decision.allow((limit - next) / interval);\n    }\n    public void refund(KeyState s, Rule rule, long cost, long nowMs) {\n        long back = Math.max(nowMs * rule.permits(), emptyAt(s, rule) - cost * rule.windowMs());\n        s.lastRefillMs = Math.floorDiv(back, rule.permits());\n        s.currentCount = Math.floorMod(back, rule.permits());\n    }\n    public long remaining(KeyState s, Rule rule, long nowMs) {\n        long now = nowMs * rule.permits();\n        return Math.max(0, (now + rule.burst() * rule.windowMs() - Math.max(emptyAt(s, rule), now)) / rule.windowMs());\n    }\n    public long capacity(Rule rule) { return rule.burst(); }\n    /** The drained-empty moment, in units of 1/permits of a millisecond. */\n    private static long emptyAt(KeyState s, Rule rule) { return s.lastRefillMs * rule.permits() + s.currentCount; }\n    public String name() { return &quot;gcra&quot;; }\n}\n\n// ---- ext: credits: a quiet window&#x27;s unused permits carry over, up to a cap (Atlassian&#x27;s follow-up)\n/**\n * Atlassian&#x27;s version of the prompt: each customer may make X calls per Y seconds, and whatever a window leaves\n * unused is saved as credits, up to a cap, for a later busy window. Here X is permits, Y is the window, and the\n * cap is burst - permits, so Rule(5, 1s, 8) means 5 a second plus up to 3 saved. The credits live in\n * KeyState.tokens (a saved permit is a token) and this window&#x27;s count where FixedWindow keeps it. A new key\n * starts with a full bank, the way a new bucket starts full. It is the token bucket&#x27;s burst, earned one whole\n * window at a time instead of continuously.\n */\nclass CreditWindow implements RateLimitAlgorithm {\n    public Decision tryAcquire(KeyState s, Rule rule, long cost, long nowMs) {\n        roll(s, rule, nowMs);\n        long room = Math.max(0, rule.permits() - s.currentCount), credits = (long) s.tokens;\n        if (cost &lt;= room + credits) {\n            long fromCredits = Math.max(0, cost - room);           // this window&#x27;s room first, then the savings\n            s.currentCount += cost - fromCredits;\n            s.tokens -= fromCredits;\n            return Decision.allow(room + credits - cost);\n        }\n        // wait for the next window, plus as many quiet windows as it takes to save what a big call still lacks\n        long saved = Math.min(cap(rule), credits + room), lacking = Math.max(0, cost - rule.permits() - saved);\n        long windows = 1 + (lacking + rule.permits() - 1) / rule.permits();\n        return Decision.deny(room + credits, s.windowStartMs + windows * rule.windowMs() - nowMs, &quot;window full, no credits&quot;);\n    }\n    public void refund(KeyState s, Rule rule, long cost, long nowMs) {\n        roll(s, rule, nowMs);\n        long back = Math.min(cost, s.currentCount);                 // undo this window&#x27;s count first\n        s.currentCount -= back;\n        s.tokens = Math.min(cap(rule), s.tokens + (cost - back));\n    }\n    public long remaining(KeyState s, Rule rule, long nowMs) {\n        roll(s, rule, nowMs);\n        return Math.max(0, rule.permits() - s.currentCount) + (long) s.tokens;\n    }\n    public long capacity(Rule rule) { return rule.permits() + cap(rule); }\n    /** The most credits a key may hold: whatever the burst allows beyond one window. */\n    private static long cap(Rule rule) { return Math.max(0, rule.burst() - rule.permits()); }\n    /** At a new window, save what the ended windows left unused, up to the cap. A quiet window saves all of it. */\n    private static void roll(KeyState s, Rule rule, long nowMs) {\n        long w = rule.windowMs(), aligned = Math.floorDiv(nowMs, w) * w;\n        long ended = (aligned - s.windowStartMs) / w;\n        if (ended &gt; 0) {\n            s.tokens += Math.max(0, rule.permits() - s.currentCount) + (double) (ended - 1) * rule.permits();\n            s.currentCount = 0;\n            s.windowStartMs = aligned;\n        }\n        s.tokens = Math.min(cap(rule), s.tokens);                   // also trims a new key&#x27;s bank to the cap\n    }\n    public String name() { return &quot;credit window&quot;; }\n}\n\n// ---- ext: the hit counter (LeetCode 362): hits in the last 300 seconds, at any rate\n/**\n * The same problem asked as an API: hit(second) records a hit, getHits(second) counts the last 300 seconds.\n * The first answer is the sliding window log, a queue of timestamps. The follow-up, &quot;what if there are a\n * million hits a second?&quot;, is why this one keeps 300 slots instead: one per second, each holding which second\n * it counts and how many hits it saw. Memory stays 300 slots whatever the traffic, and a read is one pass over\n * them. One lock, held for a few field writes, makes it safe for many threads. LeetCode 359, the Logger Rate\n * Limiter, is the smallest case: a map from each message to the second it may next be printed.\n */\nclass HitCounter {\n    private static final int SECONDS = 300;\n    private final long[] second = new long[SECONDS], hits = new long[SECONDS];\n    private final ReentrantLock lock = new ReentrantLock();\n    /** One hit at this second. A slot still holding an older second is reused; a hit older than its slot is dropped. */\n    void hit(long sec) {\n        int i = Math.floorMod(sec, SECONDS);\n        lock.lock();\n        try {\n            if (second[i] &gt; sec) return;                               // too old: this slot has moved on\n            if (second[i] &lt; sec) { second[i] = sec; hits[i] = 0; }     // a new second takes over the slot\n            hits[i]++;\n        } finally { lock.unlock(); }\n    }\n    /** Hits in the 300 seconds ending at this one: from sec - 299 up to sec. */\n    long getHits(long sec) {\n        lock.lock();\n        try {\n            long total = 0;\n            for (int i = 0; i &lt; SECONDS; i++) if (second[i] &lt;= sec &amp;&amp; sec - second[i] &lt; SECONDS) total += hits[i];\n            return total;\n        } finally { lock.unlock(); }\n    }\n}\n\n/** Runs every extension above, so each block on page 05 is code that has actually executed. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        // the bug, reproduced: no lock, a budget of 50, 200 threads\n        UnsafeLimiter buggy = new UnsafeLimiter(50);\n        System.out.println(&quot;unsafe read-check-write, 200 threads -&gt; admitted &quot; + hammer(buggy, 200) + &quot; on a budget of 50&quot;);\n\n        // rung one: the same bucket with compare-and-set instead of a lock\n        CasBucket cas = new CasBucket(new Rule(50, 1_000L, 50), new ManualClock(0));\n        System.out.println(&quot;compare-and-set bucket, 200 threads -&gt; admitted &quot; + hammer(cas, 200)\n                         + &quot;, lost swaps and recomputed &quot; + cas.retries() + &quot; times&quot;);\n\n        // shadow mode: the real algorithm, nothing refused\n        ManualClock clock = new ManualClock(0);\n        RateLimiter real = new RateLimiter();\n        real.configure(new TokenBucket(), new FlatRules(new Rule(5, 1_000L, 5)), clock);\n        ShadowLimiter shadow = new ShadowLimiter(real);\n        int refused = 0;\n        for (int i = 0; i &lt; 20; i++) if (!shadow.allow(&quot;acme&quot;, 1).allowed()) refused++;\n        System.out.println(&quot;shadow mode: saw &quot; + shadow.observed() + &quot;, would have blocked &quot;\n                         + shadow.wouldHaveBlocked() + &quot;, actually refused &quot; + refused);\n\n        // layered: per tenant AND a global budget, with the refund when the global one refuses\n        RateLimiter perTenant = new RateLimiter(), global = new RateLimiter();\n        perTenant.configure(new TokenBucket(), new FlatRules(new Rule(10, 1_000L, 10)), clock);\n        global.configure(new TokenBucket(), new FlatRules(new Rule(3, 1_000L, 3)), clock);\n        LayeredLimiter layered = new LayeredLimiter(List.of(\n                new LayeredLimiter.Layer(&quot;tenant&quot;, perTenant, k -&gt; k),\n                new LayeredLimiter.Layer(&quot;global&quot;, global, k -&gt; &quot;ALL&quot;)));\n        int ok = 0;\n        for (int i = 0; i &lt; 6; i++) if (layered.allow(&quot;acme&quot;, 1).allowed()) ok++;\n        System.out.println(&quot;layered (tenant 10, global 3)     -&gt; admitted &quot; + ok\n                         + &quot;, tenant permits left &quot; + perTenant.remaining(&quot;acme&quot;) + &quot; (7 only if the refunds happened)&quot;);\n\n        // back-pressure: wait for the permit instead of failing\n        RateLimiter slow = new RateLimiter();\n        slow.configure(new TokenBucket(), new FlatRules(new Rule(20, 1_000L, 1)), new SystemClock());\n        WaitingLimiter waiting = new WaitingLimiter(slow);\n        slow.allow(&quot;batch&quot;);                                            // spend the only permit\n        long t0 = System.nanoTime();\n        boolean got = waiting.acquire(&quot;batch&quot;, 1, 500);\n        System.out.println(&quot;back-pressure: waited &quot; + (System.nanoTime() - t0) / 1_000_000 + &quot;ms, admitted &quot; + got);\n\n        // twelve pods, one budget, one clock: the server&#x27;s\n        RedisLike redis = new RedisLike(new ManualClock(0));\n        Rule fleetRule = new Rule(50, 1_000L, 50);\n        Limiter pod1 = new RedisTokenBucket(redis, fleetRule), pod2 = new RedisTokenBucket(redis, fleetRule);\n        int fleet = 0;\n        for (int i = 0; i &lt; 40; i++) { if (pod1.allow(&quot;acme&quot;, 1).allowed()) fleet++; if (pod2.allow(&quot;acme&quot;, 1).allowed()) fleet++; }\n        System.out.println(&quot;two pods, one Redis budget of 50  -&gt; admitted &quot; + fleet + &quot; (per-process would be 100)&quot;);\n\n        // per-endpoint keys and weighted cost\n        Endpoints ep = new Endpoints();\n        ep.price(&quot;/search&quot;, 5);\n        RateLimiter routed = new RateLimiter();\n        routed.configure(new TokenBucket(), new FlatRules(new Rule(10, 1_000L, 10)), clock);\n        routed.allow(Endpoints.key(&quot;acme&quot;, &quot;/search&quot;), ep.costOf(&quot;/search&quot;));\n        System.out.println(&quot;per route: /search costs &quot; + ep.costOf(&quot;/search&quot;) + &quot; -&gt; key &quot;\n                         + Endpoints.key(&quot;acme&quot;, &quot;/search&quot;) + &quot; has &quot; + routed.remaining(Endpoints.key(&quot;acme&quot;, &quot;/search&quot;))\n                         + &quot; left, /ping has &quot; + routed.remaining(Endpoints.key(&quot;acme&quot;, &quot;/ping&quot;)));\n\n        // warm-up: a new key starts at a tenth of its limit\n        ManualClock warmClock = new ManualClock(0);\n        WarmUpRules warm = new WarmUpRules(new FlatRules(Rule.perMinute(600, 100)), 30_000L, warmClock);\n        long atStart = warm.ruleFor(&quot;fresh&quot;).permits();\n        warmClock.advance(30_000);\n        System.out.println(&quot;warm-up over 30s: permits at t=0 &quot; + atStart + &quot;, at t=30s &quot; + warm.ruleFor(&quot;fresh&quot;).permits());\n\n

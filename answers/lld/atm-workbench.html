<div class="top"><h1>ATM</h1><span class="sub">LLD &middot; Java &middot; OpenJDK 21 &middot; 18 failure scenarios, 53 checks, a 40-machine race &middot; reserve, debit, push</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design an ATM. A customer puts in a card, types a PIN, and takes cash out; the machine holds the notes and the bank holds the money. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>A box on a wall with money in it: a customer puts a card in, types a PIN and asks for an amount. The machine must then find an exact combination of the notes in its cassettes (the locked trays of notes inside it), get the bank to take that money off the account, and push the notes out. Two owners hold the two halves. The <b>bank</b> owns the balance: the machine can neither see it nor lock it, and a phone may be spending the same account at the same moment. The <b>machine</b> owns the notes. The one thing that must always be true is that those two stories agree: never hand out money that was not debited, and never debit money that cannot be handed out. Every way this goes wrong &mdash; an empty cassette, a declined card, a jammed note path, a bank that simply does not answer, a customer who walks off mid-visit &mdash; has to end with the customer no worse off than before.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that withdraws cash and shows what happens when it cannot. The interviewer is watching for, in this order: the questions you ask before typing (who owns the balance is the first one); which classes exist and which one owns which state; a withdrawal end to end; what happens when two terminals hit the same account at the same instant; where the rules that will change (which notes, what limit, who is told) live, so a change is a new class and not an edit; and the order of operations at the moment money moves, because that order is the whole answer. Then the twists: a daily cap, a lopsided drawer, a jam, a bank timeout, a customer who walks away, deposits, persistence.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 358\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">withdraw</text><g transform=\"translate(175 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">card in, PIN right</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">three wrong on the card: kept</text></g><path d=\"M415 57 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reserve the notes</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an exact combination, or refuse</text></g><path d=\"M675 57 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ask the bank to debit</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one key, one debit, ever</text></g><path d=\"M935 57 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">push the notes</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a jam is credited back</text></g><text x=\"88\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">deposit</text><g transform=\"translate(175 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">card in, PIN right</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the same visit</text></g><path d=\"M415 192 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">count the notes</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the reader counts; nobody types</text></g><path d=\"M675 192 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ask the bank to credit</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">its own key, one credit</text></g><path d=\"M935 192 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">receipt, audit log</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">after the lock, never inside</text></g><path d=\"M555 84 V95\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 95)\"><rect width=\"350\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"175.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">no combination of notes: refused here</text></g><text x=\"88\" y=\"256\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"256\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any moment, without touching the cassettes: what is the balance?  which rows did the bank never answer?</text><text x=\"88\" y=\"284\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">give up</text><text x=\"175\" y=\"284\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">nobody has touched the screen for forty-five seconds: take the card back, without ever cutting into a withdrawal</text><text x=\"615\" y=\"322\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">the accent box is the step that decides: it is the only one that cannot be undone, so everything reversible happens before it</text><text x=\"615\" y=\"342\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">many machines share one account: the balance may never go below zero, and the drawer must always agree with what was debited</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>One machine, or the whole network of them?</td><td>One machine, many of them, one bank behind</td><td>The machine owns the cash and the session; the bank owns the balance (moves 1, 4)</td></tr><tr><td>Which notes, and must the amount come out exactly?</td><td>2000 / 500 / 200 / 100; exact or nothing</td><td>An <code>EnumMap</code> cassette and a note rule that backs off (moves 3, 5)</td></tr><tr><td>How many wrong PINs, and then what?</td><td>Three in a row on the same card, then the machine keeps it</td><td>The bank counts per card, so taking the card out buys no fresh tries (moves 2, 6)</td></tr><tr><td>What if the notes jam after the bank has debited?</td><td>Credit it back, automatically</td><td>Reserve before debit, and a reversal: one credit that undoes the debit (move 6)</td></tr><tr><td>What if the bank does not answer at all?</td><td>Dispense nothing; settle it later</td><td>A third answer, TIMEOUT, an UNKNOWN row, and a reversal sent later (moves 6, 9)</td></tr><tr><td>Daily limits, fees, more than one currency?</td><td>A per-transaction rule now, a daily cap as a follow-up</td><td>The rule behind an interface; the cap wraps the bank (moves 3, 12)</td></tr><tr><td>Deposits: does the machine count the cash?</td><td>Yes: its note reader counts it; an envelope machine is a follow-up</td><td>The credit is what was counted, never a typed number (moves 2, 12)</td></tr><tr><td>How long before the machine gives up on a customer who walks away?</td><td>Forty-five quiet seconds, then it takes the card back</td><td>A watchdog thread that waits on the machine's own lock (moves 7, 8)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Take a card and check the PIN; after three wrong PINs in a row on that card, on any machine, keep the card.</li>\n<li>Withdraw cash: an exact combination of the notes actually in the cassettes, or a refusal.</li>\n<li>Show the balance; take cash in and credit exactly what the note reader counted.</li>\n<li>Every withdrawal attempt is one row in a journal (the machine's own record), written <i>before</i> the bank is asked and never deleted.</li>\n<li>A withdrawal that fails after the money left the account is credited back automatically.</li>\n<li>A withdrawal the bank never answered dispenses nothing and is reconciled later: the bank is asked to reverse it, which gives the money back only if the debit landed.</li>\n<li>If nobody touches the screen for forty-five seconds, the machine takes the card back by itself.</li>\n<li>Give the card back, reset, and be ready for the next customer.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Many machines share one account: the balance may never go below zero and no debit may be lost.</li>\n<li>The cash that left the drawer must always equal the money that left the account.</li>\n<li>Whole rupees, never a <code>double</code>: a rounding error in a dispenser is a real cash difference.</li>\n<li>\"How many 500s are left?\" and \"has this key been applied?\" are O(1). The key is an idempotency key: the bank applies each key at most once, so a retry cannot take the money twice.</li>\n<li>The note rule, the amount rule and the listeners are swappable without touching the machine.</li>\n<li>Nothing half-done: a refusal leaves the cassette and the balance exactly as they were.</li>\n<li>In memory, one process per machine, no persistence (say it; a follow-up adds it).</li></ul></div></div>\n<div class=\"move\"><h3>One morning, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"130\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:10  ACC-1 asks for 2,700</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">balance 10,000</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">drawer 2000x2 500x4 200x3 100x5</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">reserved 2000 + 500 + 200 = 3 notes</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">debit ok, only then pushed</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">balance 7,300, drawer down 3 notes</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"130\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">09:20  the same card asks 2,750</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">not a multiple of 100</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">refused before anything moved</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">balance still 7,300</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"130\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">11:40  drawer is 500x1, 200x3</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">600 asked; greed dead-ends on the 500</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">backs off and pays 200 x 3 = 600</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the machine pays what it can pay</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"130\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">16:05  the link to the bank dies</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">debit sent, no answer at all</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">nothing dispensed; row = UNKNOWN</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">reconciled at 18:00, balance intact</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> the bank owns the balance and the machine owns the notes, so the one step that checks the balance and takes the money belongs to the bank, and the machine never reads a balance and then writes it; the bank also counts wrong PINs, per card; whole rupees, never a double; an amount is paid exactly or refused; a withdrawal reserves the notes before it asks for the money; one process, in memory, one machine per object. Named as out of scope: more than one currency, transfers, PIN change. Envelope deposits and persistence are follow-ups on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, elevator, Splitwise) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On this problem the moves earn their keep in move 4 and move 6, because the invariant (the rule that must always hold) spans two owners: the money is the bank's and the notes are the machine's, and they must always tell the same story.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a CARD starts a SESSION; the BANK owns the BALANCE; the CASSETTES hold NOTES; a WITHDRAWAL is one attempt; a RULE picks the notes</text><g transform=\"translate(30 110)\"><rect width=\"165\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"82.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Card</text><text x=\"82.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a number, an account</text></g><path d=\"M112.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(215 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Session</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where the visit has got to</text></g><path d=\"M302.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 110)\"><rect width=\"185\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"92.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Withdrawal</text><text x=\"92.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">amount, notes, state, key</text></g><path d=\"M502.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(615 110)\"><rect width=\"175\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"87.5\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CashDispenser</text><text x=\"87.5\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the note counts</text></g><path d=\"M702.5 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(810 110)\"><rect width=\"180\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"90.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BankService</text><text x=\"90.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the balance: not ours</text></g><path d=\"M900.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1010 110)\"><rect width=\"190\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"95.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Note rule</text><text x=\"95.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M1105.0 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state here: a value, an interface, or somebody else's data</text></svg></div><div class=\"move\"><p>Reading the paragraph again: a <b>card</b> starts a <b>session</b>; the <b>bank</b> owns the <b>balance</b>; the <b>cassettes</b> hold <b>notes</b>; a <b>withdrawal</b> is one attempt at moving money; a <b>rule</b> decides which notes come out. A session has a card and a place in the visit, which changes: a class. A withdrawal has an amount, the notes reserved for it, a status and an idempotency key: a class, and the row an operator reconciles from. The cassettes have counts that change: a class with its own lock. A card is a number and an account id and nothing that moves, so it is a value. And the balance is the one that matters: it is not ours. The machine never holds a balance, so the class that appears is <code>BankService</code>, an interface, because the thing behind it is somebody else's process. The count of wrong PINs is not ours either: it belongs to the card, and the card is the bank's.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 301\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">pick the notes for an amount</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 46 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 24)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">NoteSelection  (owns nothing: pure)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 46 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">rule.select(stock, amount)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 80)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">take money off an account</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 102 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 80)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BankService  (owns the balance)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 102 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 80)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">bank.debit(acct, amt, key)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 136)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">count the wrong PINs</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 158 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 136)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">BankService  (owns the card's record)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 158 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">bank.authenticate(card, pin)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 192)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">run one withdrawal end to end</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 214 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 192)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ATM  (owns the session, journal, lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 214 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 192)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">atm.withdraw(amount)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"269\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a verb whose state is spread over two owners goes to the one that can see both: the machine calls the others in order, and stores no money</text><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and \"deposit\" is not a second machine: the note reader counts the cash, and the bank credits what was counted</text></svg></div><div class=\"move\"><p>\"Pick the notes for an amount\" touches no state at all &mdash; it reads a stock map and an amount and returns a plan &mdash; so it belongs to a pure rule, <code>rule.select(stock, amount)</code>. \"Take money off an account\" touches the balance, which lives at the bank, so it belongs to the bank: <code>bank.debit(acct, amount, key)</code>. \"Count the wrong PINs\" touches the card's record, which is the bank's too, so the bank counts: if the visit counted, a thief could take the card out after two wrong tries and put it back for three fresh ones. \"Run one withdrawal end to end\" touches the session, the journal, the cassettes and the bank; only the machine can see all four, so <code>atm.withdraw(amount)</code> is the orchestrator (the one that calls the others, in order), and it stores not a single rupee. A deposit is not a second machine either: the note reader counts the cash, and the bank credits what was counted, under the deposit's own key.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 245\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 60)\"><rect width=\"220\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ATM</text><text x=\"110.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(policy, selection)</text></g><path d=\"M250 105 H330 V46 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">NoteSelection</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">fewest notes, ration the 2000s</text></g><g transform=\"translate(760 24)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FewestNotes / RationBigNotes</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 46 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 105 H330 V106 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 84)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">WithdrawalPolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a minimum, a ceiling, a multiple</text></g><g transform=\"translate(760 84)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AmountRules / a daily rule</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 106 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 105 H330 V166 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 144)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">AtmObserver</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">receipt, audit, low cash, fraud</text></g><g transform=\"translate(760 144)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ReceiptPrinter / AuditLog</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 166 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"212\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The machine never builds a rule, so a new note rule is a new class and one changed line</text><text x=\"615\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one rule wraps a collaborator instead of a rule: DailyCap wraps the BankService, so \"cap it at 20,000 a day\" touches no ATM code at all</text></svg></div><div class=\"move\"><p>Which notes come out will change: fewest today, \"stop giving out 2000s before noon\" tomorrow. What is allowed will change: a minimum, a ceiling, a multiple, a fee, a daily cap. Who is told will change: a receipt today, an audit log and a fraud feed later. Each becomes a one-method interface the machine is <i>given</i> in <code>configure()</code> and never builds. This is where the patterns come from, not the other way round: a swappable rule behind an interface is <b>Strategy</b>; a machine that announces \"a withdrawal happened\" without knowing what a printer is, is <b>Observer</b>. And the <b>Decorator</b> here is the one worth remembering, because it wraps a collaborator rather than a rule: <code>DailyCap</code> implements <code>BankService</code>, holds a real bank inside it, counts what an account has taken today and returns DECLINED over the cap. \"Cap withdrawals at twenty thousand a day\" is then a new file and one wiring line, and the machine does not learn a new word.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one atomic step.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the machine in the mall</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads balance 500</text></g><g transform=\"translate(30 110)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the netbanking app</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads balance 500</text></g><g transform=\"translate(360 70)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ACC-9 balance</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">500</text></g><path d=\"M230 52 H360 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M230 132 H360 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"295\" y=\"40\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><text x=\"295\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">read</text><rect x=\"590\" y=\"20\" width=\"290\" height=\"140\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"735\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"735\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both read 500, both subtract 500</text><text x=\"735\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">the account ends at minus 500</text><text x=\"735\" y=\"130\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: read and subtract as ONE step</text><g transform=\"translate(910 40)\"><rect width=\"290\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"145.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">bank.debit(acct, amt, key)</text><text x=\"145.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">compare-and-set, or read again</text></g><text x=\"1055\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the machine cannot lock a balance it does not own</text><text x=\"1055\" y=\"185\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">so the owner of the number does the atomic step</text></svg></div><div class=\"move\"><p>A machine in a mall and a netbanking session both read the balance as five hundred, both subtract five hundred, and both write: the account ends at minus five hundred and the bank is short. The fix is the same as always &mdash; the read and the write have to be one step &mdash; but the twist on this problem is that the machine <i>cannot</i> do it. It does not own the balance; it cannot lock a number in another process. So the atomic step (one step that nobody can cut into) is pushed to the owner: <code>bank.debit(...)</code> runs a compare-and-set loop on the account's balance. Compare-and-set means: read the number, decide, and write it back only if nobody changed it in between. A debit that loses the race reads the fresh number and decides again, instead of overwriting somebody. What the machine <i>does</i> own &mdash; the cassette counts, the session, the journal &mdash; gets a lock of its own, and anything that only listens (the receipt, the audit log) is called after that lock is released, never inside it.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 255\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is this account's balance?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 40 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 20)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;account, AtomicLong&gt;</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 40 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 20)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 70)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many 500s are left?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 90 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 70)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EnumMap&lt;Note, Integer&gt;</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 90 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 70)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 120)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">has this key already been applied?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 140 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 120)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;key, BankReply&gt;</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 140 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 120)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 170)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which rows did the bank not answer?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 190 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 170)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">List&lt;Withdrawal&gt;, append only</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 190 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 170)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(all rows)</text></g><text x=\"615\" y=\"240\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">nothing re-reads the day's transactions to answer a balance: the balance IS the number, and the key map is what makes a retry safe</text></svg></div><div class=\"move\"><p>\"What is this account's balance?\" is a map from account to a single <code>AtomicLong</code>: one number, one writer, no history to walk. \"How many 500s are left?\" is an <code>EnumMap</code> from note to count, which is an array behind the scenes, so a count is an array index and the whole cassette is four entries. \"Has this key already been applied?\" is a map from idempotency key to the answer that was given, and it is what makes a retried request safe rather than a second debit. \"Which rows did the bank never answer?\" is a scan of the journal, which keeps every attempt and is never pruned: O(n) over all rows, about 30,000 after a year at eighty a day. That is well under a millisecond, for a question an operator asks a few times a day, so it earns no index of its own.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the ORDER of operations is the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 245\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"170\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PENDING</text><text x=\"85.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nothing asked yet</text></g><g transform=\"translate(240 30)\"><rect width=\"170\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DEBITED</text><text x=\"85.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the money left</text></g><g transform=\"translate(450 30)\"><rect width=\"170\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DISPENSED</text><text x=\"85.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the customer has it</text></g><g transform=\"translate(30 120)\"><rect width=\"170\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">REFUSED</text><text x=\"85.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nothing moved</text></g><g transform=\"translate(240 120)\"><rect width=\"170\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">REVERSED</text><text x=\"85.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">jammed, credited back</text></g><g transform=\"translate(450 120)\"><rect width=\"170\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">UNKNOWN</text><text x=\"85.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no answer; reconcile</text></g><path d=\"M200 52 H240\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M410 52 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M115 74 V120\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M325 74 V120\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M200 63 H222 V186 H535 V168\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><rect x=\"660\" y=\"20\" width=\"550\" height=\"190\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"935\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order at the moment money moves, and why it is this order</text><text x=\"675\" y=\"68\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1 write the row, then check the amount rule: nothing reserved yet</text><text x=\"675\" y=\"91\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2 RESERVE the notes: choose a combination and take it out of the cassette</text><text x=\"675\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">3 ask the bank to debit, with this row's key</text><text x=\"675\" y=\"137\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4 only now push the notes; a jam is credited back under a second key</text><text x=\"675\" y=\"160\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a refusal at 1 or 2 has moved no money at all: the customer can ask for less;</text><text x=\"675\" y=\"183\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a bank that never answers dispenses nothing; the row is reversed later</text><text x=\"615\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">six states and one rule: reserve what is reversible first, and do the irreversible thing last. The journal row is written before the bank is asked.</text></svg></div><div class=\"move\"><p>There are two life cycles. The visit is IDLE &rarr; CARD_INSERTED &rarr; AUTHENTICATED &rarr; TRANSACTION &rarr; DISPENSING and back, held in a table of allowed moves so an action in the wrong place is refused by a lookup rather than by a wall of if-statements. The money has its own: PENDING, then REFUSED (nothing moved), DEBITED (the money left the account), DISPENSED (the customer is holding it), REVERSED (it jammed and we credited it back) or UNKNOWN (nobody knows yet whether money moved). Writing them down forces the order, and the order is the whole answer. Write the journal row first, then check the amount rule: a refused amount leaves a REFUSED row and touches nothing else. Then <i>reserve</i> the notes &mdash; choose a combination and take it out of the cassette in one step &mdash; because a reservation is reversible and a debit is not, and because an empty cassette must be discovered before an account is touched. Then ask the bank, with this row's key. Only then push the notes; if the hardware jams, reverse the debit (one credit, under the row's key plus \"-rev\") and mark the row REVERSED. And if the bank does not answer, or the call throws, dispense nothing and leave the row UNKNOWN: a timeout is not a no, it is \"nobody knows yet\", and handing out cash on a guess is how a machine loses real money.</p></div><div class=\"move\"><h3>Move 7: yes, the machine's lock makes its customers go one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 357\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"540\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the machine's lock: about three seconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the journal row and the amount rule: about a microsecond</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">reserve the notes: the dispenser's own lock, ~2 us</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the bank round trip over the network: about a second</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">pushing the notes into the slot: about two seconds</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">so nearly all of it is waiting for the bank and the motor</text></g><path d=\"M570 95 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"605\" y=\"85\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"150\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside it: the rest of the visit</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the customer reading the screen: about 20 seconds</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">typing the PIN and the amount: about 10 seconds</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the receipt printer: about 300 ms, after the unlock</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">one whole visit: about 45 seconds</text></g><text x=\"615\" y=\"200\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">ten terminals hit ONE account at the same instant: the bank is the only thing they share</text><g transform=\"translate(30 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">terminal 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wins on try 1</text></g><g transform=\"translate(148 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">terminal 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wins on try 2</text></g><g transform=\"translate(266 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">terminal 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wins on try 3</text></g><g transform=\"translate(384 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">terminal 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wins on try 4</text></g><g transform=\"translate(502 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">terminal 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wins on try 5</text></g><g transform=\"translate(620 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">terminal 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wins on try 6</text></g><g transform=\"translate(738 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">terminal 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wins on try 7</text></g><g transform=\"translate(856 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">terminal 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wins on try 8</text></g><g transform=\"translate(974 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">terminal 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wins on try 9</text></g><g transform=\"translate(1092 215)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">terminal 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">wins on try 10</text></g><text x=\"615\" y=\"283\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">at worst the tenth loses the compare-and-set nine times, reading the fresh balance each time: microseconds in all, and nobody waits for a lock</text><text x=\"615\" y=\"301\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">inside one machine there is no queue at all, because a machine serves one customer, which is what a machine is</text><text x=\"615\" y=\"325\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the one thread that is NOT a customer is the watchdog: it calls ejectCard(), which wants the same lock, so it waits out those three seconds</text><text x=\"615\" y=\"343\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">instead of taking the card back between the debit and the push -- safe, but it is the reason rung 1 of the next move exists</text></svg></div><div class=\"move\"><p>Inside the machine's lock there is the journal row, the amount rule and a reserve on the dispenser's own lock, about two microseconds in all &mdash; and two slow things: the bank round trip, about a second, and the notes being pushed into the slot, about two seconds. So the lock is held for about three seconds, and nearly all of it is waiting for the bank and the motor. That sounds bad until you notice what a machine is: one customer, standing there, for about forty-five seconds. Nobody else is in the queue. The screen, the typing and the receipt are outside the lock anyway. The place where things really do arrive at the same instant is the bank, and there the answer is the compare-and-set: ten terminals hitting one account need microseconds between them, because each loser simply reads the fresh balance and tries again. One thread in this system is not a customer: the watchdog that takes the card back when somebody walks away. It calls <code>ejectCard()</code>, which wants the same lock, so if a withdrawal is in flight the watchdog waits for it rather than ejecting a card in the gap between the debit and the notes. That is the right answer, and it costs the watchdog about three seconds of waiting; when the bank is slow, it waits as long as the bank does. That is why the next move has a rung 1.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock per machine: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a visit is about 45 seconds; a busy machine does ~80 a day</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the lock is held ~3 s a withdrawal, 80 times: 240 seconds</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">240 s out of 86,400 s: the lock is busy 0.3% of the day</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">and there is only ever one customer standing at one machine</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the bank: ~900 debits a second nationwide, one compare-and-set each</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 the bank call and the push outside the lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a state guards the gap, so the watchdog never waits on the bank or the motor</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 one balance per account, which it already is</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the compare-and-set scales with accounts, not machines; only hot accounts meet</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 beyond one process: the row becomes the lock</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE account SET balance = balance - ? WHERE id = ? AND balance &gt;= ?</text></g></svg></div><div class=\"move\"><p>A busy machine does about eighty withdrawals a day. At about three seconds of lock each, that is 240 seconds of a day: the lock is busy less than three tenths of one per cent of the time, and only ever against one customer who is not there twice. At the bank the number that matters is different: forty thousand machines busy at peak, each finishing a visit every forty-five seconds, is roughly nine hundred debits a second. Each one is a compare-and-set on its own account's number, which is tens of nanoseconds of work. Then the ladder, cheapest first. One: move the bank call and the push out of the machine's lock, holding it only for the reservation and the state writes, with a state that says a withdrawal is in flight. You do not need this for throughput (withdrawals per second); you need it because of the watchdog in move 7, which cannot take a card back while the bank is thinking. Two: nothing, because the balances are already one atomic number per account, so the cost grows with hot accounts and not with machines. Three: when the balance stops being an <code>AtomicLong</code> and becomes a row, the compare-and-set becomes <code>UPDATE account SET balance = balance - ? WHERE id = ? AND balance &gt;= ?</code>: one row updated means paid, zero rows means declined. Say the arithmetic first; climbing the ladder without it is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 408\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"300\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">wrong PINs on one card</text></g><path d=\"M330 37 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 18)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the bank counts per card; tests 1 and 13: out and back in buys no fresh tries</text></g><g transform=\"translate(30 60)\"><rect width=\"300\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the drawer cannot make the amount</text></g><path d=\"M330 79 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 60)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refused BEFORE the bank is asked; test 2: the bank saw zero calls</text></g><g transform=\"translate(30 102)\"><rect width=\"300\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the bank declines after reserving</text></g><path d=\"M330 121 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 102)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every reserved note goes back; test 3: the cassette counts are identical</text></g><g transform=\"translate(30 144)\"><rect width=\"300\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the note path jams after the debit</text></g><path d=\"M330 163 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 144)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reversed under a second key; tests 4 and 15: even when the credit-back fails</text></g><g transform=\"translate(30 186)\"><rect width=\"300\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the bank never answers, or throws</text></g><path d=\"M330 205 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 186)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">dispense nothing, row = UNKNOWN; tests 5 and 14: reversed later, never re-debited</text></g><g transform=\"translate(30 228)\"><rect width=\"300\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two machines want the same last 500</text></g><path d=\"M330 247 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 228)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the bank's compare-and-set is the only writer; test 9: twenty of forty paid</text></g><g transform=\"translate(30 270)\"><rect width=\"300\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/>

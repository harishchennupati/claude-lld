; + getClass().getSimpleName());\n    }\n}\n/** Nothing in the slot. The only legal move is to put a card in. */\nclass IdleState implements AtmState {\n    public AtmState insertCard(StateMachine m, Card c) { m.card = c; return new HasCardState(); }\n}\n/** A card is in. A PIN or a cancel, nothing else; when the bank says BLOCKED the machine keeps the card. */\nclass HasCardState implements AtmState {\n    public AtmState enterPin(StateMachine m, String pin) {\n        PinCheck r = m.bank.authenticate(m.card.number, pin);\n        if (r == PinCheck.OK) return new AuthedState();\n        if (r == PinCheck.WRONG) throw new IllegalArgumentException(&quot;wrong PIN, try again&quot;);\n        m.card = null;                                                   // BLOCKED: the card stays inside\n        throw new CardRetained(&quot;too many wrong PINs: card retained&quot;);\n    }\n    public AtmState ejectCard(StateMachine m) { m.card = null; return new IdleState(); }\n}\n/**\n * The PIN was right. Money can move, in the same order as the table version: reserve, debit, push. This is a\n * sketch of the LIFE CYCLE, not a second money path -- it has no journal, no TIMEOUT branch and no\n * reversal, because those belong to ATM.doWithdraw. Compare the two for shape, and copy that one.\n */\nclass AuthedState implements AtmState {\n    public AtmState withdraw(StateMachine m, long amount) {\n        EnumMap&lt;Note, Integer&gt; plan = m.cash.reserve(amount);\n        if (plan == null) throw new IllegalStateException(&quot;the cassettes cannot make &quot; + amount);\n        String key = &quot;sm-&quot; + m.card.accountId + &quot;-&quot; + amount + &quot;-&quot; + System.nanoTime();\n        if (m.bank.debit(m.card.accountId, amount, key) != BankReply.OK) {\n            m.cash.release(plan);\n            throw new IllegalStateException(&quot;the bank declined&quot;);\n        }\n        m.cash.push(plan);\n        return this;\n    }\n    public AtmState ejectCard(StateMachine m) { m.card = null; return new IdleState(); }\n}\n/** The context. It holds the current state and forwards; it contains no &quot;if state ==&quot; anywhere. */\nclass StateMachine {\n    AtmState state = new IdleState();\n    Card card;\n    final BankService bank;\n    final CashDispenser cash;\n    StateMachine(BankService bank, CashDispenser cash) { this.bank = bank; this.cash = cash; }\n    void insertCard(Card c)      { state = state.insertCard(this, c); }\n    void enterPin(String pin) {\n        try { state = state.enterPin(this, pin); }\n        catch (CardRetained e) { state = new IdleState(); throw e; }     // the card is kept; the machine is free again\n    }\n    void withdraw(long amount)   { state = state.withdraw(this, amount); }\n    void ejectCard()             { state = state.ejectCard(this); }\n    String where()               { return state.getClass().getSimpleName(); }\n}\n\n// ---- ext: mini-statement -- a second listener, not a change to the machine\n/** Keeps the last few money events per account. It is an observer, so the ATM never learns it exists. */\nclass MiniStatement implements AtmObserver {\n    private final int keep;\n    private final Map&lt;String, Deque&lt;String&gt;&gt; lines = new ConcurrentHashMap&lt;&gt;();\n    MiniStatement(int keep) { this.keep = keep; }\n    public void onEvent(AtmEvent e) {\n        if (e.amount == 0) return;\n        Deque&lt;String&gt; d = lines.computeIfAbsent(e.accountId, a -&gt; new ArrayDeque&lt;&gt;());\n        synchronized (d) {\n            d.addFirst(e.kind + &quot; &quot; + e.amount + (e.txn == null ? &quot;&quot; : &quot; &quot; + e.txn.state));\n            while (d.size() &gt; keep) d.removeLast();\n        }\n    }\n    /** The last few lines for one account, newest first. */\n    List&lt;String&gt; of(String accountId) {\n        Deque&lt;String&gt; d = lines.get(accountId);\n        if (d == null) return List.of();\n        synchronized (d) { return new ArrayList&lt;&gt;(d); }\n    }\n}\n\n// ---- ext: the drawer is running low -- a second listener, and the machine still learns nothing\n/**\n * Pages an operator when the cash left in the machine drops under a floor. It is an AtmObserver, so it is\n * added with addObserver and the ATM never learns it exists, and it runs after the lock is released, so a\n * slow pager cannot hold up a customer. It alerts on the CROSSING, not on every event, so one empty drawer\n * is one page and not a page per withdrawal; a refill that lifts the cash back over the floor re-arms it.\n */\nclass LowCashAlert implements AtmObserver {\n    private final CashDispenser dispenser;\n    private final long floor;\n    private volatile boolean raised;\n    final List&lt;String&gt; alerts = new CopyOnWriteArrayList&lt;&gt;();\n    LowCashAlert(CashDispenser dispenser, long floor) { this.dispenser = dispenser; this.floor = floor; }\n    public void onEvent(AtmEvent e) {\n        long left = dispenser.cash();\n        if (left &lt; floor &amp;&amp; !raised) { raised = true; alerts.add(e.atmId + &quot;: &quot; + left + &quot; left, below &quot; + floor + &quot; -- refill&quot;); }\n        if (left &gt;= floor) raised = false;                               // refilled: arm it again\n    }\n}\n\n// ---- ext: a deposit the machine cannot count -- an envelope, verified the next morning\n/** Where an envelope is in its life: in the bin, counted, or found empty. */\nenum EnvelopeState { ACCEPTED, VERIFIED, REJECTED }\n/**\n * The customer types an amount and posts an envelope. The balance does not move: the machine has no idea\n * what is inside. A human counts it the next morning and the credit happens then, once, under the\n * envelope&#x27;s own key, so a re-run of the morning job cannot pay twice.\n */\nclass EnvelopeDeposit {\n    final String accountId, key;\n    final long claimed;\n    EnvelopeState state = EnvelopeState.ACCEPTED;\n    long verified;\n    EnvelopeDeposit(String accountId, long claimed, String key) { this.accountId = accountId; this.claimed = claimed; this.key = key; }\n    /** The morning count. Credits what was actually in the envelope, not what the customer typed. */\n    void verify(BankService bank, long actual) {\n        if (state != EnvelopeState.ACCEPTED) throw new IllegalStateException(&quot;already &quot; + state);\n        verified = actual;\n        state = actual &gt; 0 ? EnvelopeState.VERIFIED : EnvelopeState.REJECTED;\n        if (actual &gt; 0) bank.credit(accountId, actual, key);\n    }\n}\n\n// ---- ext: state that must outlive the process -- the journal behind a repository\n/**\n * The journal, moved out of the machine. claim() is the interesting one: it must refuse a key that is\n * already there, which is what makes a machine that rebooted mid-transaction safe to restart.\n */\ninterface WithdrawalRepository {\n    /** Write the row before the bank is asked. False means this key already exists. */\n    boolean claim(Withdrawal w);\n    /** Write the outcome. */\n    void update(Withdrawal w);\n    /** Every row whose outcome nobody knows, for an operator or a start-up task. */\n    List&lt;Withdrawal&gt; unresolved();\n}\n/** One process, one map. In SQL it is the same two statements, shown below the class. */\nclass InMemoryWithdrawalRepository implements WithdrawalRepository {\n    private final Map&lt;String, Withdrawal&gt; byKey = new ConcurrentHashMap&lt;&gt;();\n    public boolean claim(Withdrawal w) { return byKey.putIfAbsent(w.key, w) == null; }\n    public void update(Withdrawal w)   { byKey.put(w.key, w); }\n    public List&lt;Withdrawal&gt; unresolved() {\n        List&lt;Withdrawal&gt; out = new ArrayList&lt;&gt;();\n        for (Withdrawal w : byKey.values()) if (w.state == TxnState.UNKNOWN) out.add(w);\n        return out;\n    }\n}\n// the same two steps in SQL, where the database does what the lock and the CAS did here:\n//   INSERT INTO withdrawal (key, account, amount, state) VALUES (?, ?, ?, &#x27;PENDING&#x27;);   -- duplicate key = already tried\n//   UPDATE account SET balance = balance - ? WHERE id = ? AND balance &gt;= ?;             -- 1 row = paid, 0 rows = declined\n\n// ---- ext: the customer walked away -- a watchdog that takes the card back\n/**\n * A customer put a card in and wandered off. A watchdog thread takes the card back after a quiet period, and\n * every customer action calls touch() to restart the countdown. The interesting part is not the timer, it is\n * the lock: ejectCard() takes the machine&#x27;s own lock, the same one a withdrawal holds, so the watchdog can\n * never cut in between the debit and the push -- it queues behind the withdrawal and ejects afterwards. The\n * price of that safety is that the watchdog waits for as long as the machine holds the lock, and the machine\n * holds it across the bank round trip and the push; that is exactly what rung 1 of the ladder in move 8 buys.\n */\nclass SessionWatchdog {\n    private final ATM atm;\n    private final long quietMs;\n    private final ScheduledExecutorService timer;\n    private ScheduledFuture&lt;?&gt; pending;\n    final AtomicInteger fired = new AtomicInteger();                      // how often it gave up on a customer\n    SessionWatchdog(ATM atm, long quietMs, ScheduledExecutorService timer) {\n        this.atm = atm; this.quietMs = quietMs; this.timer = timer;\n    }\n    /** Start, or restart, the countdown. A screen touch, a PIN digit, a withdrawal: all of them call this. */\n    synchronized void touch() {\n        if (pending != null) pending.cancel(false);\n        pending = timer.schedule(this::giveUp, quietMs, TimeUnit.MILLISECONDS);\n    }\n    /** The visit ended by itself, so stop the countdown. */\n    synchronized void disarm() { if (pending != null) pending.cancel(false); pending = null; }\n    /** Deliberately NOT synchronized on this watchdog: it may block on the ATM&#x27;s lock, and touch() must not. */\n    private void giveUp() {\n        fired.incrementAndGet();\n        try { atm.ejectCard(); } catch (RuntimeException ignored) { }      // waits for a withdrawal in flight\n    }\n}\n\n/** Runs every extension once so the file is proof rather than prose. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        InMemoryBank core = new InMemoryBank();\n        core.open(&quot;ACC-1&quot;, 100_000);\n        core.issueCard(&quot;4111-1111&quot;, &quot;1234&quot;);\n        Clock clock = () -&gt; 1_757_000_000_000L;                       // a fixed &quot;today&quot;\n\n        // 1. the daily cap: a new class around the bank; the ATM and the states do not change\n        DailyCap capped = new DailyCap(core, 20_000, clock, ZoneId.of(&quot;Asia/Kolkata&quot;));\n        CashDispenser cash = new CashDispenser(new WorkingFeeder());\n        cash.refill(Note.N2000, 20); cash.refill(Note.N500, 20); cash.refill(Note.N200, 20); cash.refill(Note.N100, 20);\n        ATM atm = new ATM(&quot;ATM-X&quot;, capped, cash);\n        atm.setClock(clock);\n        MiniStatement mini = new MiniStatement(3);\n        atm.addObserver(mini);\n        atm.insertCard(new Card(&quot;4111-1111&quot;, &quot;ACC-1&quot;));\n        atm.enterPin(&quot;1234&quot;);\n        atm.withdraw(15_000);\n        try { atm.withdraw(10_000); }\n        catch (WithdrawalFailed f) { System.out.println(&quot;daily cap: &quot; + f.getMessage() + &quot;; cash still in machine &quot; + cash.cash()); }\n        System.out.println(&quot;under the cap: &quot; + atm.withdraw(5_000).notes);\n        System.out.println(&quot;mini-statement: &quot; + mini.of(&quot;ACC-1&quot;));\n        atm.ejectCard();\n\n        // 2. a second note rule: the 2000s are held back below 5,000\n        CashDispenser d2 = new CashDispenser(new WorkingFeeder());\n        d2.refill(Note.N2000, 5); d2.refill(Note.N500, 10);\n        d2.setSelection(new RationBigNotes(5_000));\n        System.out.println(&quot;2000 with the big notes rationed: &quot; + d2.reserve(2_000)\n            + &quot;; 6000 above the threshold: &quot; + d2.reserve(6_000));\n        CashDispenser lc = new CashDispenser(new WorkingFeeder());\n        lc.refill(Note.N500, 1); lc.refill(Note.N200, 3);\n        lc.setSelection(new GreedyOnly());\n        System.out.println(&quot;LeetCode 2241&#x27;s rule, 600 from 500x1 + 200x3: &quot; + lc.reserve(600) + &quot; (refused, as that spec says)&quot;);\n\n        // 3. the dispenser jams after the debit: the account is credited back, the notes go to the retract bin\n        core.open(&quot;ACC-2&quot;, 10_000);\n        CashDispenser jam = new CashDispenser(new JammingFeeder(1));\n        jam.refill(Note.N500, 4);\n        ATM atm2 = new ATM(&quot;ATM-J&quot;, core, jam);\n        atm2.setClock(clock);\n        atm2.insertCard(new Card(&quot;4111-1111&quot;, &quot;ACC-2&quot;));\n        atm2.enterPin(&quot;1234&quot;);\n        try { atm2.withdraw(1_000); }\n        catch (WithdrawalFailed f) { System.out.println(&quot;jam: &quot; + f.w.state + &quot; -&gt; balance back to &quot; + core.balance(&quot;ACC-2&quot;) + &quot;, retracted notes &quot; + jam.retracted()); }\n        atm2.ejectCard();\n\n        // 4. the bank never answers: nothing is dispensed, and the row is reconciled afterwards\n        FlakyBank flaky = new FlakyBank(core);\n        flaky.next(BankReply.TIMEOUT);\n        core.open(&quot;ACC-3&quot;, 10_000);\n        CashDispenser d3 = new CashDispenser(new WorkingFeeder());\n        d3.refill(Note.N500, 4);\n        ATM atm3 = new ATM(&quot;ATM-T&quot;, flaky, d3);\n        atm3.setClock(clock);\n        atm3.insertCard(new Card(&quot;4111-1111&quot;, &quot;ACC-3&quot;));\n        atm3.enterPin(&quot;1234&quot;);\n        try { atm3.withdraw(1_000); } catch (WithdrawalFailed f) { System.out.println(&quot;timeout: &quot; + f.w.state + &quot;, cash in machine still &quot; + d3.cash()); }\n        List&lt;Withdrawal&gt; open = atm3.unresolved();\n        System.out.println(&quot;unresolved rows: &quot; + open.size() + &quot; -&gt; settled &quot; + new Reconciler(core).settle(open)\n            + &quot;: &quot; + open.get(0).state + &quot; (&quot; + open.get(0).note + &quot;), balance &quot; + core.balance(&quot;ACC-3&quot;));\n\n        // 5. the same life cycle as state objects: an illegal move is not implemented, so it throws\n        StateMachine sm = new StateMachine(core, cash);\n        System.out.println(&quot;state objects: start in &quot; + sm.where());\n        try { sm.enterPin(&quot;1234&quot;); } catch (IllegalStateException e) { System.out.println(&quot;  &quot; + e.getMessage()); }\n        sm.insertCard(new Card(&quot;4111-1111&quot;, &quot;ACC-1&quot;));\n        sm.enterPin(&quot;1234&quot;);\n        sm.withdraw(1_000);\n        System.out.println(&quot;  withdrew 1000 in &quot; + sm.where() + &quot;; balance &quot; + core.balance(&quot;ACC-1&quot;));\n        sm.ejectCard();\n\n        // 6. an envelope deposit: the balance moves only when a human has counted it\n        EnvelopeDeposit env = new EnvelopeDeposit(&quot;ACC-2&quot;, 5_000, &quot;ENV-1&quot;);\n        long before = core.balance(&quot;ACC-2&quot;);\n        env.verify(core, 4_500);\n        System.out.println(&quot;envelope: claimed &quot; + env.claimed + &quot;, counted &quot; + env.verified + &quot;, &quot; + env.state\n            + &quot;, balance &quot; + before + &quot; -&gt; &quot; + core.balance(&quot;ACC-2&quot;));\n\n        // 7. the journal behind a repository: the same key cannot be claimed twice\n        WithdrawalRepository repo = new InMemoryWithdrawalRepository();\n        Withdrawal w = new Withdrawal(1, &quot;ATM-X&quot;, &quot;ACC-1&quot;, 500, clock.nowMs());\n        System.out.println(&quot;repo claim: &quot; + repo.claim(w) + &quot;, claim again: &quot; + repo.claim(w));\n\n        // 8. the customer walked away: the watchdog takes the card back after a quiet 50 ms\n        ScheduledExecutorService timer = Executors.newSingleThreadScheduledExecutor();\n        SessionWatchdog dog = new SessionWatchdog(atm2, 50, timer);\n        atm2.insertCard(new Card(&quot;4111-1111&quot;, &quot;ACC-2&quot;));\n        dog.touch();\n        while (atm2.state() != SessionState.IDLE) Thread.sleep(10);\n        System.out.println(&quot;watchdog fired &quot; + dog.fired.get() + &quot; time; the machine is &quot; + atm2.state());\n        timer.shutdown();\n\n        // 9. the drawer runs low: one more observer, and the ATM does not learn a new word\n        core.open(&quot;ACC-4&quot;, 100_000);\n        CashDispenser thin = new CashDispenser(new WorkingFeeder());\n        thin.refill(Note.N500, 6);                                    // 3,000 in the drawer\n        ATM atm4 = new ATM(&quot;ATM-L&quot;, core, thin);\n        atm4.setClock(clock);\n        LowCashAlert low = new LowCashAlert(thin, 2_000);\n        atm4.addObserver(low);\n        atm4.insertCard(new Card(&quot;4111-1111&quot;, &quot;ACC-4&quot;));\n        atm4.enterPin(&quot;1234&quot;);\n        atm4.withdraw(500); atm4.withdraw(1_000); atm4.withdraw(500);  // 2,500 -&gt; 1,500 -&gt; 1,000\n        System.out.println(&quot;low cash: &quot; + low.alerts);\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.time.*;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n/**\n * One test per claim the design makes. Each one reproduces a failure an ATM actually has in the field -- a\n * retained card, a PIN guessed across visits, an empty cassette, a decline, a jam, a bank that never\n * answers or throws, a customer who walks away mid-visit, a drawer running dry -- and proves the code ends\n * in a state where the customer has lost nothing and the cash in the machine still matches the money that\n * left the accounts.\n */\npublic class FailureTests {\n    static int failures = 0;\n    /** Print one line per claim and remember how many were wrong. */\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what);\n        if (!ok) failures++;\n    }\n    static final Clock CLOCK = () -&gt; 1_757_000_000_000L;      // a fixed &quot;today&quot;, so nothing depends on the wall clock\n\n    /** A machine with its own cassettes, wired to the bank handed in. */\n    static ATM machine(String id, BankService bank, NoteFeeder feeder, int[] counts) {\n        CashDispenser d = new CashDispenser(feeder);\n        Note[] all = Note.values();\n        for (int i = 0; i &lt; counts.length; i++) d.refill(all[i], counts[i]);\n        ATM a = new ATM(id, bank, d);\n        a.setClock(CLOCK);\n        a.configure(new AmountRules(100, 25_000, 100), new FewestNotes());\n        return a;\n    }\n\n    public static void main(String[] args) throws Exception {\n        InMemoryBank core = new InMemoryBank();\n        core.issueCard(&quot;CARD-1&quot;, &quot;1234&quot;);\n\n        // 1. three wrong PINs retain the card: the visit ends and nothing is left in the slot\n        core.issueCard(&quot;CARD-LOCK&quot;, &quot;1234&quot;);                          // its own card: the bank blocks the card itself\n        core.open(&quot;A1&quot;, 10_000);\n        ATM m1 = machine(&quot;T1&quot;, core, new WorkingFeeder(), new int[] { 2, 4, 3, 5 });\n        m1.insertCard(new Card(&quot;CARD-LOCK&quot;, &quot;A1&quot;));\n        for (int i = 0; i &lt; 2; i++)\n            try { m1.enterPin(&quot;0000&quot;); check(false, &quot;a wrong PIN must be refused&quot;); } catch (IllegalArgumentException e) { }\n        boolean retained = false;\n        try { m1.enterPin(&quot;0000&quot;); } catch (CardRetained e) { retained = true; }\n        check(retained, &quot;the third wrong PIN retains the card&quot;);\n        check(m1.state() == SessionState.IDLE, &quot;after a retained card the machine is IDLE, not holding a session&quot;);\n        try { m1.balance(); check(false, &quot;a balance enquiry with no card must be refused&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;an action with no card is refused: &quot; + e.getMessage()); }\n\n        // 2. the cassettes cannot make the amount: refused BEFORE the bank is asked\n        core.open(&quot;A2&quot;, 10_000);\n        FlakyBank watch = new FlakyBank(core);\n        ATM m2 = machine(&quot;T2&quot;, watch, new WorkingFeeder(), new int[] { 0, 1, 0, 0 });   // one 500 note, nothing else\n        m2.insertCard(new Card(&quot;CARD-1&quot;, &quot;A2&quot;));\n        m2.enterPin(&quot;1234&quot;);\n        Withdrawal w2 = null;\n        try { m2.withdraw(1_000); check(false, &quot;must refuse&quot;); } catch (WithdrawalFailed f) { w2 = f.w; }\n        check(w2.state == TxnState.REFUSED, &quot;an amount the cassettes cannot make is REFUSED: &quot; + w2.note);\n        check(watch.debits.get() == 0, &quot;the bank was never asked, so no money moved&quot;);\n        check(core.balance(&quot;A2&quot;) == 10_000, &quot;the balance is untouched&quot;);\n\n        // 3. the bank declines after the notes were reserved: every note goes back\n        core.open(&quot;A3&quot;, 500);\n        ATM m3 = machine(&quot;T3&quot;, core, new WorkingFeeder(), new int[] { 0, 4, 0, 0 });    // 2,000 in 500s\n        m3.insertCard(new Card(&quot;CARD-1&quot;, &quot;A3&quot;));\n        m3.enterPin(&quot;1234&quot;);\n        Withdrawal w3 = null;\n        try { m3.withdraw(1_000); check(false, &quot;must refuse&quot;); } catch (WithdrawalFailed f) { w3 = f.w; }\n        check(w3.state == TxnState.REFUSED, &quot;a declined debit dispenses nothing: &quot; + w3.note);\n        check(core.balance(&quot;A3&quot;) == 500, &quot;the balance is exactly what it was&quot;);\n        check(m3.state() == SessionState.AUTHENTICATED, &quot;the customer is still in the session and can ask for less&quot;);\n        Withdrawal ok3 = m3.withdraw(500);\n        check(ok3.state == TxnState.DISPENSED &amp;&amp; core.balance(&quot;A3&quot;) == 0, &quot;a smaller amount then works: &quot; + ok3.notes);\n\n        // 4. the dispenser jams AFTER the debit: the account is credited back, the notes are retracted\n        core.open(&quot;A4&quot;, 10_000);\n        CashDispenser jam = new CashDispenser(new JammingFeeder(1));\n        jam.refill(Note.N500, 4);\n        ATM m4 = new ATM(&quot;T4&quot;, core, jam);\n        m4.setClock(CLOCK);\n        m4.insertCard(new Card(&quot;CARD-1&quot;, &quot;A4&quot;));\n        m4.enterPin(&quot;1234&quot;);\n        Withdrawal w4 = null;\n        try { m4.withdraw(1_000); check(false, &quot;a jam must be reported&quot;); } catch (WithdrawalFailed f) { w4 = f.w; }\n        check(w4.state == TxnState.REVERSED, &quot;a jam after the debit is REVERSED, not swallowed&quot;);\n        check(core.balance(&quot;A4&quot;) == 10_000, &quot;the customer got nothing and was charged nothing&quot;);\n        check(jam.retracted() == 2 &amp;&amp; jam.cash() == 1_000, &quot;the two stuck notes are in the retract bin, not back in the cassette&quot;);\n\n        // 5. the bank never answers: dispense nothing, record UNKNOWN, reverse it later -- never debit to &quot;ask&quot;\n        core.open(&quot;A5&quot;, 10_000);\n        FlakyBank slow = new FlakyBank(core);\n        slow.next(BankReply.TIMEOUT);                                 // the request was lost before the bank saw it\n        ATM m5 = machine(&quot;T5&quot;, slow, new WorkingFeeder(), new int[] { 0, 4, 0, 0 });\n        m5.insertCard(new Card(&quot;CARD-1&quot;, &quot;A5&quot;));\n        m5.enterPin(&quot;1234&quot;);\n        Withdrawal w5 = null;\n        try { m5.withdraw(1_000); check(false, &quot;a timeout must not look like success&quot;); } catch (WithdrawalFailed f) { w5 = f.w; }\n        check(w5.state == TxnState.UNKNOWN, &quot;a bank that does not answer leaves the row UNKNOWN&quot;);\n        check(core.balance(&quot;A5&quot;) == 10_000, &quot;nothing was debited while nobody knew&quot;);\n        check(m5.unresolved().size() == 1, &quot;the row is waiting for reconciliation&quot;);\n        new Reconciler(core).settle(m5.unresolved());\n        check(w5.state == TxnState.REFUSED &amp;&amp; core.balance(&quot;A5&quot;) == 10_000,\n              &quot;reconciliation finds the debit never landed and says so, without debiting to find out: &quot; + w5.state);\n        check(core.debit(&quot;A5&quot;, 1_000, w5.key) == BankReply.DECLINED &amp;&amp; core.balance(&quot;A5&quot;) == 10_000,\n              &quot;and the lost request, turning up late under the same key, can no longer take the money&quot;);\n        core.open(&quot;A5b&quot;, 10_000);                                     // the dangerous kind: it landed, the answer was lost\n        ATM m5b = machine(&quot;T5b&quot;, new FlakyBank(core).landsButTimesOut(), new WorkingFeeder(), new int[] { 0, 4, 0, 0 });\n        m5b.insertCard(new Card(&quot;CARD-1&quot;, &quot;A5b&quot;));\n        m5b.enterPin(&quot;1234&quot;);\n        try { m5b.withdraw(1_000); } catch (WithdrawalFailed ignored) { }\n        check(core.balance(&quot;A5b&quot;) == 9_000 &amp;&amp; m5b.unresolved().size() == 1, &quot;the money left, nothing was dispensed, the row is UNKNOWN&quot;);\n        new Reconciler(core).settle(m5b.journal());                   // handed EVERY row: it touches only the UNKNOWN one\n        check(core.balance(&quot;A5b&quot;) == 10_000 &amp;&amp; m5b.unresolved().isEmpty(), &quot;the reversal gives it back, exactly once&quot;);\n\n        // 6. note selection is exact, and backs off a drawer greed alone cannot pay from\n        CashDispenser odd = new CashDispenser(new WorkingFeeder());\n        odd.refill(Note.N500, 1); odd.refill(Note.N200, 3);\n        EnumMap&lt;Note, Integer&gt; plan = odd.reserve(600);\n        long sum = 0;\n        for (Map.Entry&lt;Note, Integer&gt; e : plan.entrySet()) sum += (long) e.getKey().value * e.getValue();\n        check(sum == 600 &amp;&amp; plan.get(Note.N200) == 3, &quot;600 from {500x1, 200x3} backs off the 500 and pays 200x3&quot;);\n        check(odd.count(Note.N500) == 1 &amp;&amp; odd.count(Note.N200) == 0, &quot;only the notes in the plan left the cassettes&quot;);\n        CashDispenser few = new CashDispenser(new WorkingFeeder());\n        few.refill(Note.N2000, 5); few.refill(Note.N500, 10); few.refill(Note.N100, 10);\n        check(few.reserve(2_600).equals(new EnumMap&lt;&gt;(Map.of(Note.N2000, 1, Note.N500, 1, Note.N100, 1))),\n              &quot;2,600 is three notes, not thirteen&quot;);\n        check(few.reserve(50) == null, &quot;an amount no combination can make is refused, not approximated&quot;);\n        CashDispenser lc = new CashDispenser(new WorkingFeeder());\n        lc.refill(Note.N500, 1); lc.refill(Note.N200, 3);\n        lc.setSelection(new GreedyOnly());\n        check(lc.reserve(600) == null &amp;&amp; lc.cash() == 1_100, &quot;LeetCode 2241&#x27;s rule (largest first, never step back) refuses that 600&quot;);\n\n        // 7. a receipt printer that throws cannot break a withdrawal\n        core.open(&quot;A7&quot;, 10_000);\n        ATM m7 = machine(&quot;T7&quot;, core, new WorkingFeeder(), new int[] { 0, 4, 0, 0 });\n        m7.addObserver(e -&gt; { throw new RuntimeException(&quot;printer out of paper&quot;); });\n        AuditLog audit = new AuditLog();\n        m7.addObserver(audit);\n        m7.insertCard(new Card(&quot;CARD-1&quot;, &quot;A7&quot;));\n        m7.enterPin(&quot;1234&quot;);\n        Withdrawal w7 = m7.withdraw(1_000);\n        check(w7.state == TxnState.DISPENSED &amp;&amp; core.balance(&quot;A7&quot;) == 9_000, &quot;the withdrawal succeeds although the printer threw&quot;);\n        check(audit.count(&quot;WITHDRAW&quot;) == 1, &quot;the listener after the broken one still heard about it&quot;);\n\n        // 8. the same idempotency key moves money exactly once\n        core.open(&quot;A8&quot;, 10_000);\n        BankReply first = core.debit(&quot;A8&quot;, 1_000, &quot;KEY-8&quot;);\n        BankReply again = core.debit(&quot;A8&quot;, 1_000, &quot;KEY-8&quot;);\n        check(first == BankReply.OK &amp;&amp; again == BankReply.OK &amp;&amp; core.balance(&quot;A8&quot;) == 9_000,\n              &quot;a retried debit under the same key returns the first answer and charges once&quot;);\n\n        // 9. forty machines, one account: the balance never goes below zero and the cash adds up\n        core.open(&quot;RACE&quot;, 10_000);\n        int machines = 40;\n        List&lt;ATM&gt; fleet = new ArrayList&lt;&gt;();\n        List&lt;CashDispenser&gt; drawers = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; machines; i++) {\n            CashDispenser d = new CashDispenser(new WorkingFeeder());\n            d.refill(Note.N500, 2);\n            drawers.add(d);\n            ATM a = new ATM(&quot;R&quot; + i, core, d);\n            a.setClock(CLOCK);\n            fleet.add(a);\n        }\n        ExecutorService pool = Executors.newFixedThreadPool(machines);\n        CountDownLatch go = new CountDownLatch(1);\n        AtomicInteger paid = new AtomicInteger();\n        AtomicLong handedOut = new AtomicLong();\n        for (ATM a : fleet) pool.submit(() -&gt; {\n            a.insertCard(new Card(&quot;CARD-1&quot;, &quot;RACE&quot;));\n            a.enterPin(&quot;1234&quot;);\n            go.await();\n            try { handedOut.addAndGet(a.withdraw(500).amount); paid.incrementAndGet(); } catch (WithdrawalFailed ignored) { }\n            return null;\n        });\n        go.countDown();\n        pool.shutdown();\n        pool.awaitTermination(20, TimeUnit.SECONDS);\n        long stillInDrawers = 0;\n        for (CashDispenser d : drawers) stillInDrawers += d.cash();\n        check(paid.get() == 20, &quot;exactly twenty of forty machines paid out, not twenty-one: &quot; + paid.get());\n        check(core.balance(&quot;RACE&quot;) == 0, &quot;the balance landed exactly on zero and never went below it&quot;);\n        check(handedOut.get() == 10_000 &amp;&amp; stillInDrawers == 40_000 - 10_000,\n              &quot;the cash that left the drawers equals the money that left the account&quot;);\n\n        // 10. a decorator must not break idempotency: the same key twice is a retry, not a second withdrawal\n        core.open(&quot;A10&quot;, 100_000);\n        DailyCap cap = new DailyCap(core, 20_000, CLOCK, ZoneId.of(&quot;Asia/Kolkata&quot;));\n        check(cap.debit(&quot;A10&quot;, 15_000, &quot;K10&quot;) == BankReply.OK, &quot;15,000 is under the 20,000 daily cap&quot;);\n        check(cap.debit(&quot;A10&quot;, 15_000, &quot;K10&quot;) == BankReply.OK,\n              &quot;the SAME key again gives the same answer; the cap does not count a retry twice and decline it&quot;);\n        check(core.balance(&quot;A10&quot;) == 85_000, &quot;and the money moved exactly once&quot;);\n        check(cap.debit(&quot;A10&quot;, 10_000, &quot;K10-b&quot;) == BankReply.DECLINED, &quot;a genuinely new 10,000 is over the cap&quot;);\n\n        // 11. the watchdog takes the card back, and it cannot cut into a withdrawal already in flight\n        core.open(&quot;A11&quot;, 10_000);\n        FlakyBank slowLink = new FlakyBank(core).slowBy(400);         // the bank takes 400 ms to answer\n        ATM m11 = machine(&quot;T11&quot;, slowLink, new WorkingFeeder(), new int[] { 0, 4, 0, 0 });\n        ScheduledExecutorService clockThread = Executors.newSingleThreadScheduledExecutor();\n        SessionWatchdog dog = new SessionWatchdog(m11, 50, clockThread);\n        m11.insertCard(new Card(&quot;CARD-1&quot;, &quot;A11&quot;));\n        m11.enterPin(&quot;1234&quot;);\n        dog.touch();                                                  // the customer goes quiet: 50 ms to live\n        Withdrawal w11 = m11.withdraw(1_000);                         // ... while a 400 ms bank call is running\n        check(w11.state == TxnState.DISPENSED &amp;&amp; core.balance(&quot;A11&quot;) == 9_000,\n              &quot;the watchdog woke up mid-withdrawal and the withdrawal still finished whole&quot;);\n        long deadline = System.currentTimeMillis() + 3_000;\n        while (m11.state() != SessionState.IDLE &amp;&amp; System.currentTimeMillis() &lt; deadline) Thread.sleep(10);\n        check(dog.fired.get() == 1 &amp;&amp; m11.state() == SessionState.IDLE,\n              &quot;and the card came out the moment the lock was free, not in the middle of the money&quot;);\n        clockThread.shutdownNow();\n\n        // 12. the drawer runs low: one more observer hears it, and the ATM did not learn a new word\n        core.open(&quot;A12&quot;, 100_000);\n        CashDispenser thin = new CashDispenser(new WorkingFeeder());\n        thin.refill(Note.N500, 6);                                    // 3,000 in the drawer\n        ATM m12 = new ATM(&quot;T12&quot;, core, thin);\n        m12.setClock(CLOCK);\n        LowCashAlert low = new LowCashAlert(thin, 2_000);\n        m12.addObserver(low);\n        m12.insertCard(new Card(&quot;CARD-1&quot;, &quot;A12&quot;));\n        m12.enterPin(&quot;1234&quot;);\n        m12.withdraw(500);                                            // 2,500 left: still above the floor\n        check(low.alerts.isEmpty(), &quot;no page while the drawer is above the floor&quot;);\n        m12.withdraw(1_000);                                          // 1,500 left: under it\n        check(low.alerts.size() == 1, &quot;one page the moment the drawer crosses the floor: &quot; + low.alerts);\n        m12.withdraw(500);                                            // 1,000 left: still under it\n        check(low.alerts.size() == 1, &quot;and it does not page again on every withdrawal after that&quot;);\n\n        // 13. wrong PINs are counted on the CARD: taking it out after two does not buy fresh tries\n        core.issueCard(&quot;CARD-13&quot;, &quot;1234&quot;);\n        core.open(&quot;A13&quot;, 10_000);\n        ATM m13 = machine(&quot;T13&quot;, core, new WorkingFeeder(), new int[] { 0, 4, 0, 0 });\n        m13.insertCard(new Card(&quot;CARD-13&quot;, &quot;A13&quot;));\n        for (int i = 0; i &lt; 2; i++) try { m13.enterPin(&quot;0000&quot;); } catch (IllegalArgumentException e) { }\n        m13.ejectCard();                                              // out, and straight back in\n        m13.insertCard(new Card(&quot;CARD-13&quot;, &quot;A13&quot;));\n        boolean kept = false;\n        try { m13.enterPin(&quot;0000&quot;); } catch (CardRetained e) { kept = true; } catch (IllegalArgumentException e) { }\n        check(kept, &quot;the third wrong PIN keeps the card, although it was taken out and put back after two&quot;);\n        ATM next13 = machine(&quot;T13b&quot;, core, new WorkingFeeder(), new int[] { 0, 4, 0, 0 });\n        next13.insertCard(new Card(&quot;CARD-13&quot;, &quot;A13&quot;));\n        boolean keptAgain = false;\n        try { next13.enterPin(&quot;1234&quot;); } catch (CardRetained e) { keptAgain = true; }\n        check(keptAgain, &quot;a blocked card is kept by the next machine too, even with the right PIN&quot;);\n\n        // 14. the link dies in the middle of a debit: an exception is treated as &quot;nobody knows&quot;, and nothing leaks\n        core.open(&quot;A14&quot;, 10_000);\n        CashDispenser d14 = new CashDispenser(new WorkingFeeder());\n        d14.refill(Note.N500, 4);\n        ATM m14 = new ATM(&quot;T14&quot;, new FlakyBank(core).linkDownFor(1), d14);\n        m14.setClock(CLOCK);\n        m14.insertCard(new Card(&quot;CARD-1&quot;, &quot;A14&quot;));\n        m14.enterPin(&quot;1234&quot;);\n        Withdrawal w14 = null;\n        try { m14.withdraw(1_000); } catch (WithdrawalFailed f) { w14 = f.w; } catch (RuntimeException e) { }\n        check(w14 != null &amp;&amp; w14.state == TxnState.UNKNOWN &amp;&amp; m14.unresolved().size() == 1,\n              &quot;a bank call that throws leaves an UNKNOWN row the reconciler can see, not a crash and a PENDING row&quot;);\n        check(d14.cash() == 2_000 &amp;&amp; m14.state() == SessionState.AUTHENTICATED,\n              &quot;every reserved note is back in the cassette, and the customer is still in the session&quot;);\n\n        // 15. the notes jam AND the credit-back cannot reach the bank: the row must not look settled\n        core.open(&quot;A15&quot;, 10_000);\n        FlakyBank cut = new FlakyBank(core);\n        CashDispenser d15 = new CashDispenser(notes -&gt; { cut.linkDownFor(1); throw new RuntimeException(&quot;jam, and the link drops&quot;); });\n        d15.refill(Note.N500, 4);\n        ATM m15 = new ATM(&quot;T15&quot;, cut, d15);\n        m15.setClock(CLOCK);\n        m15.insertCard(new Card(&quot;CARD-1&quot;, &quot;A15&quot;));\n        m15.enterPin(&quot;1234&quot;);\n        Withdrawal w15 = null;\n        try { m15.withdraw(1_000); } catch (WithdrawalFailed f) { w15 = f.w; } catch (RuntimeException e) { }\n        check(w15 != null &amp;&amp; w15.state == TxnState.UNKNOWN &amp;&amp; core.balance(&quot;A15&quot;) == 9_000,\n              &quot;debited, nothing dispensed, credit-back unconfirmed: the row says UNKNOWN, not DEBITED&quot;);\n        new Reconciler(core).settle(m15.unresolved());\n        new Reconciler(core).settle(List.of(w15));                    // a second run finds nothing left to do\n        check(w15.state == TxnState.REVERSED &amp;&amp; core.balance(&quot;A15&quot;) == 10_000, &quot;the reconciler gives the money back, once&quot;);\n\n        // 16. a deposit is what the note reader counted: nothing counted is nothing credited\n        core.open(&quot;A16&quot;, 10_000);\n        ATM m16 = machine(&quot;T16&quot;, core, new WorkingFeeder(), new int[] { 0, 4, 0, 0 });\n        m16.insertCard(new Card(&quot;CARD-1&quot;, &quot;A16&quot;));\n        m16.enterPin(&quot;1234&quot;);\n        check(m16.deposit(new EnumMap&lt;&gt;(Map.of(Note.N500, 3, Note.N100, 2))) == 1_700 &amp;&amp; core.balance(&quot;A16&quot;) == 11_700,\n              &quot;three 500s and two 100s credit exactly 1,700&quot;);\n        int refusedDeposits = 0;\n        try { m16.deposit(new EnumMap&lt;&gt;(Map.of(Note.N500, -1))); } catch (IllegalArgumentException e) { refusedDeposits++; }\n        try { m16.deposit(new EnumMap&lt;&gt;(Note.class)); } catch (IllegalArgumentException e) { refusedDeposits++; }\n        check(refusedDeposits == 2 &amp;&amp; core.balance(&quot;A16&quot;) == 11_700, &quot;a negative count or an empty tray is refused, and the balance does not move&quot;);\n\n        // 17. the daily cap counts the bank&#x27;s LOCAL day, and a jammed withdrawal does not eat the limit\n        ZoneId india = ZoneId.of(&quot;Asia/Kolkata&quot;);\n        long[] now = { ZonedDateTime.of(2026, 9, 26, 5, 0, 0, 0, india).toInstant().toEpochMilli() };   // 05:00 in Mumbai\n        core.open(&quot;A17&quot;, 100_000);\n        DailyCap local = new DailyCap(core, 20_000, () -&gt; now[0], india);\n        check(local.debit(&quot;A17&quot;, 15_000, &quot;K17-a&quot;) == BankReply.OK, &quot;15,000 at 05:00&quot;);\n        now[0] += 3_600_000;                                          // 06:00: a UTC day rolled over at 05:30, this one did not\n        check(local.debit(&quot;A17&quot;, 10_000, &quot;K17-b&quot;) == BankReply.DECLINED, &quot;10,000 more at 06:00 the same morning is over the cap&quot;);\n        now[0] += 19 * 3_600_000;                                     // 01:00 the next night: a new local day\n        check(local.debit(&quot;A17&quot;, 10_000, &quot;K17-c&quot;) == BankReply.OK, &quot;after midnight in Mumbai the limit is fresh&quot;);\n        core.open(&quot;A17j&quot;, 100_000);\n        CashDispenser d17 = new CashDispenser(new JammingFeeder(1));\n        d17.refill(Note.N2000, 20); d17.refill(Note.N500, 20);\n        ATM m17 = new ATM(&quot;T17&quot;, new DailyCap(core, 20_000, () -&gt; now[0], india), d17);\n        m17.setClock(() -&gt; now[0]);\n        m17.insertCard(new Card(&quot;CARD-1&quot;, &quot;A17j&quot;));\n        m17.enterPin(&quot;1234&quot;);\n        try { m17.withdraw(15_000); } catch (WithdrawalFailed jammed) { }\n        Withdrawal w17 = null;\n        try { w17 = m17.withdraw(10_000); } catch (WithdrawalFailed f) { }\n        check(w17 != null &amp;&amp; w17.state == TxnState.DISPENSED, &quot;a jammed 15,000 was reversed, so it does not count: 10,000 more is paid&quot;);\n\n        // 18. the state-object version: a kept card leaves the machine idle and ready for the next customer\n        core.issueCard(&quot;CARD-18&quot;, &quot;1234&quot;);\n        StateMachine sm = new StateMachine(core, new CashDispenser(new WorkingFeeder()));\n        sm.insertCard(new Card(&quot;CARD-18&quot;, &quot;A1&quot;));\n        for (int i = 0; i &lt; 3; i++) try { sm.enterPin(&quot;0000&quot;); } catch (RuntimeException e) { }\n        boolean ready = true;\n        try { sm.insertCard(new Card(&quot;CARD-1&quot;, &quot;A1&quot;)); } catch (IllegalStateException e) { ready = false; }\n        check(ready &amp;&amp; sm.where().equals(&quot;HasCardState&quot;), &quot;after the card is kept the state machine is IDLE and takes the next card&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design an ATM. A customer puts in a card, types a PIN, and takes cash out; the machine holds the notes and the bank holds the money. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions; then type in the order of Main.java: the enums (Note largest first, the two life cycles, BankReply, PinCheck), Card and Session, the Withdrawal row with its key, the BankService interface with its compare-and-set implementation, NoteSelection with the backing-off picker, the CashDispenser with its own lock, the ATM with its lock and the reserve &rarr; debit &rarr; push order, and a main with the forty-machine race. If the hour runs short, the core that must be typed is the debit with its key, the reserve &rarr; debit &rarr; push order with its three failure branches, and the race; the listeners, the deposit and the Javadoc can be one line each, or said aloud. Some rounds hand you the interfaces and the model classes and ask only for the driver (Uber, 2025): that is the ATM class and its main, and the order inside <code>doWithdraw</code> is what gets graded.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; Now cap withdrawals at 20,000 a day. Do it without touching the ATM.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The machine was never handed an <code>InMemoryBank</code>; it was handed a <code>BankService</code>. So the cap is a new class that implements the same interface, holds the real bank inside it, and counts what each account has taken today before delegating. Over the cap it returns DECLINED, which is a path the machine already knows: it puts every reserved note back and tells the customer. The check and the debit happen under that account's own lock, so two machines cannot both squeeze past the limit, and other accounts never wait. \"Today\" is the bank's local day, read from the injected clock in the bank's time zone: a UTC day would roll over at half past five in the morning in Mumbai. A reversal gives its amount back to the day, so a jam does not eat the customer's limit. Now the line that is easy to miss and that an interviewer will go looking for: <b>a decorator on a money path must not break idempotency</b>. If the same key arrives twice it is a retry of a withdrawal that already happened, not a new one, so it goes straight through to the bank, which answers with what it did the first time. Without that line the retry is measured against the cap again, comes back DECLINED, and the machine is told no about money that really left the account. Tests 10 and 17 prove the retry, the local midnight and the jam.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: &quot;cap withdrawals at 20,000 a day&quot; -- a new class that wraps the bank, nothing else moves\n/**\n * A daily ceiling, counted where the money actually moves. It wraps a BankService, so the ATM, the states\n * and the dispenser are untouched: an over-cap debit returns DECLINED, which is a path the machine already\n * handles by putting every note back. &quot;A day&quot; is the bank&#x27;s LOCAL day: midnight in Mumbai, not in London.\n * The counter only moves for a key it has not counted before, and money that is reversed is given back to\n * the day, so neither a retry nor a jam eats the customer&#x27;s limit.\n */\nclass DailyCap implements BankService {\n    private final BankService base;\n    private final long cap;\n    private final Clock clock;\n    private final ZoneId zone;                                                 // where &quot;today&quot; is decided\n    private final Map&lt;String, long[]&gt; spent = new ConcurrentHashMap&lt;&gt;();       // account -&gt; {day, total today}; also its lock\n    private final Set&lt;String&gt; counted = ConcurrentHashMap.newKeySet();         // keys already counted against a day\n    DailyCap(BankService base, long cap, Clock clock, ZoneId zone) {\n        this.base = base; this.cap = cap; this.clock = clock; this.zone = zone;\n    }\n    public PinCheck authenticate(String cardNumber, String pin) { return base.authenticate(cardNumber, pin); }\n    public long balance(String accountId) { return base.balance(accountId); }\n    public void credit(String accountId, long amount, String key) { base.credit(accountId, amount, key); }\n    /** Today&#x27;s date in the bank&#x27;s time zone, as a number: a new number means a fresh limit. */\n    private long today() { return Instant.ofEpochMilli(clock.nowMs()).atZone(zone).toLocalDate().toEpochDay(); }\n    /**\n     * Checking the cap and taking the money happen under the ACCOUNT&#x27;s own lock, so two machines cannot both\n     * squeeze past the limit, and other accounts never wait. The first line inside is the one that is easy to\n     * get wrong: a key this decorator has already counted is a RETRY of a withdrawal that already happened,\n     * not a new one, so it goes straight through to the bank, which answers with what it did the first time.\n     * Without that line the retry would be measured against the cap a second time and come back DECLINED --\n     * and the machine would be told &quot;no&quot; about money that had actually left the account.\n     */\n    public BankReply debit(String accountId, long amount, String key) {\n        long[] s = spent.computeIfAbsent(accountId, a -&gt; new long[] { today(), 0 });\n        synchronized (s) {\n            if (counted.contains(key)) return base.debit(accountId, amount, key);  // a retry: the bank has the answer\n            long day = today();\n            if (s[0] != day) { s[0] = day; s[1] = 0; }                             // a new local day, a fresh limit\n            if (s[1] + amount &gt; cap) return BankReply.DECLINED;\n            BankReply r = base.debit(accountId, amount, key);\n            if (r == BankReply.OK &amp;&amp; counted.add(key)) s[1] += amount;\n            return r;\n        }\n    }\n    /** A reversal: money that went back no longer counts against today&#x27;s limit. */\n    public boolean reverse(String accountId, long amount, String key) {\n        boolean back = base.reverse(accountId, amount, key);\n        long[] s = spent.get(accountId);\n        if (back &amp;&amp; s != null) synchronized (s) { if (counted.remove(key) &amp;&amp; s[0] == today()) s[1] -= amount; }\n        return back;\n    }\n}\n\n        // 10. a decorator must not break idempotency: the same key twice is a retry, not a second withdrawal\n        core.open(&quot;A10&quot;, 100_000);\n        DailyCap cap = new DailyCap(core, 20_000, CLOCK, ZoneId.of(&quot;Asia/Kolkata&quot;));\n        check(cap.debit(&quot;A10&quot;, 15_000, &quot;K10&quot;) == BankReply.OK, &quot;15,000 is under the 20,000 daily cap&quot;);\n        check(cap.debit(&quot;A10&quot;, 15_000, &quot;K10&quot;) == BankReply.OK,\n              &quot;the SAME key again gives the same answer; the cap does not count a retry twice and decline it&quot;);\n        check(core.balance(&quot;A10&quot;) == 85_000, &quot;and the money moved exactly once&quot;);\n        check(cap.debit(&quot;A10&quot;, 10_000, &quot;K10-b&quot;) == BankReply.DECLINED, &quot;a genuinely new 10,000 is over the cap&quot;);\n\n        // 17. the daily cap counts the bank&#x27;s LOCAL day, and a jammed withdrawal does not eat the limit\n        ZoneId india = ZoneId.of(&quot;Asia/Kolkata&quot;);\n        long[] now = { ZonedDateTime.of(2026, 9, 26, 5, 0, 0, 0, india).toInstant().toEpochMilli() };   // 05:00 in Mumbai\n        core.open(&quot;A17&quot;, 100_000);\n        DailyCap local = new DailyCap(core, 20_000, () -&gt; now[0], india);\n        check(local.debit(&quot;A17&quot;, 15_000, &quot;K17-a&quot;) == BankReply.OK, &quot;15,000 at 05:00&quot;);\n        now[0] += 3_600_000;                                          // 06:00: a UTC day rolled over at 05:30, this one did not\n        check(local.debit(&quot;A17&quot;, 10_000, &quot;K17-b&quot;) == BankReply.DECLINED, &quot;10,000 more at 06:00 the same morning is over the cap&quot;);\n        now[0] += 19 * 3_600_000;                                     // 01:00 the next night: a new local day\n        check(local.debit(&quot;A17&quot;, 10_000, &quot;K17-c&quot;) == BankReply.OK, &quot;after midnight in Mumbai the limit is fresh&quot;);\n        core.open(&quot;A17j&quot;, 100_000);\n        CashDispenser d17 = new CashDispenser(new JammingFeeder(1));\n        d17.refill(Note.N2000, 20); d17.refill(Note.N500, 20);\n        ATM m17 = new ATM(&quot;T17&quot;, new DailyCap(core, 20_000, () -&gt; now[0], india), d17);\n        m17.setClock(() -&gt; now[0]);\n        m17.insertCard(new Card(&quot;CARD-1&quot;, &quot;A17j&quot;));\n        m17.enterPin(&quot;1234&quot;);\n        try { m17.withdraw(15_000); } catch (WithdrawalFailed jammed) { }\n        Withdrawal w17 = null;\n        try { w17 = m17.withdraw(10_000); } catch (WithdrawalFailed f) { }\n        check(w17 != null &amp;&amp; w17.state == TxnState.DISPENSED, &quot;a jammed 15,000 was reversed, so it does not count: 10,000 more is paid&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two terminals, one account, five hundred rupees left in it. Prove they cannot both get it.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The machine cannot fix this, because it does not own the balance and cannot lock a number in another process. The fix lives at the bank: <code>debit</code> reads the balance, refuses if it is too small, and only writes with a compare-and-set; if somebody else got in between the read and the write, the compare-and-set fails and the loop reads the fresh balance and decides again. The proof is the race in <code>main</code>: forty machines, one account with ten thousand, everybody asking for five hundred at one latch. Exactly twenty are paid, the balance lands on zero and never goes below it, and the cash that left the drawers equals the money that left the account. Say the general version out loud, because it is the point of the whole question: <b>reading a number and then acting on it is not a check</b>. <code>balance()</code> is a courtesy for the screen: it is already stale by the time the customer has read it. The only thing that decides whether there is enough money is the debit itself, which compares and subtracts in one step. That is why the code never asks the bank \"is there 500 in there?\" before asking it to take 500.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * A stand-in for the bank&#x27;s core, written the way the real one has to behave: the balance is one\n * AtomicLong per account and the only writer is a compare-and-set loop, so two terminals debiting the same\n * account at the same instant can never both see the old balance. The key map is the idempotency record.\n * The wrong-PIN counts live here too, one per card, because the card is the bank&#x27;s and not the visit&#x27;s.\n */\nclass InMemoryBank implements BankService {\n    static final int PIN_LIMIT = 3;                                            // wrong PINs in a row before a card is blocked\n    private final Map&lt;String, AtomicLong&gt; balances = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, String&gt; pins = new ConcurrentHashMap&lt;&gt;();       // card number -&gt; PIN\n    private final Map&lt;String, Integer&gt; wrongPins = new ConcurrentHashMap&lt;&gt;(); // card number -&gt; wrong PINs in a row\n    private final Map&lt;String, BankReply&gt; applied = new ConcurrentHashMap&lt;&gt;(); // idempotency key -&gt; what happened\n    final AtomicInteger casRetries = new AtomicInteger();                     // how often a debit lost the race\n\n    /** Open an account with a starting balance, in whole rupees. */\n    void open(String accountId, long rupees) { balances.put(accountId, new AtomicLong(rupees)); }\n    /** Attach a card number and its PIN to an account. */\n    void issueCard(String cardNumber, String pin) { pins.put(cardNumber, pin); }\n\n    /**\n     * Check the PIN and count per CARD in one step: compute runs one caller at a time for the same card. A\n     * right PIN resets the count; once the count reaches the limit, even the right PIN answers BLOCKED.\n     */\n    public PinCheck authenticate(String cardNumber, String pin) {\n        int wrong = wrongPins.compute(cardNumber, (card, n) -&gt; {\n            int before = n == null ? 0 : n;\n            if (before &gt;= PIN_LIMIT) return before;                           // blocked stays blocked\n            return pin.equals(pins.get(card)) ? 0 : before + 1;\n        });\n        if (wrong == 0) return PinCheck.OK;\n        return wrong &gt;= PIN_LIMIT ? PinCheck.BLOCKED : PinCheck.WRONG;\n    }\n    public long balance(String accountId) { return balances.get(accountId).get(); }\n\n    /**\n     * Check-and-subtract as one step. computeIfAbsent runs the body at most once per key, so a retried\n     * request returns the first answer instead of debiting twice -- and two threads arriving with the SAME\n     * key queue behind each other inside the map, so even a simultaneous retry cannot double-debit.\n     * Different keys run side by side; they only wait for each other in the rare case that they share a\n     * bucket of the map.\n     */\n    public BankReply debit(String accountId, long amount, String key) {\n        if (amount &lt;= 0) return BankReply.DECLINED;                          // a &quot;debit&quot; of -500 would be a credit\n        return applied.computeIfAbsent(key, k -&gt; cas(accountId, -amount));\n    }\n    /** Put money in, once per key. A credit of zero or less is a bug in the caller, never a deposit. */\n    public void credit(String accountId, long amount, String key) {\n        if (amount &lt;= 0) throw new IllegalArgumentException(&quot;a credit must be positive, not &quot; + amount);\n        applied.computeIfAbsent(key, k -&gt; cas(accountId, amount));\n    }\n\n    /**\n     * The reversal. putIfAbsent, in one step, either finds the debit&#x27;s answer or plants a DECLINED in its\n     * place. So a debit that was lost on the way and turns up later finds that DECLINED and moves nothing.\n     */\n    public boolean reverse(String accountId, long amount, String key) {\n        BankReply first = applied.putIfAbsent(key, BankReply.DECLINED);\n        if (first != BankReply.OK) return false;                              // it never landed: nothing to give back\n        credit(accountId, amount, key + &quot;-rev&quot;);                               // it landed: give it back, once\n        return true;\n    }\n\n    /** The single writer of a balance: read, decide, compare-and-set, and retry against the FRESH value. */\n    private BankReply cas(String accountId, long delta) {\n        AtomicLong bal = balances.get(accountId);\n        if (bal == null) return BankReply.DECLINED;\n        for (;;) {\n            long now = bal.get();\n            if (now + delta &lt; 0) return BankReply.DECLINED;          // a balance never goes negative\n            if (bal.compareAndSet(now, now + delta)) return BankReply.OK;\n            casRetries.incrementAndGet();                            // somebody else got in: read again\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; Every withdrawal takes the machine&#x27;s lock, and holds it across a bank call. Is that a bottleneck?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It is held for about three seconds: about one for the bank round trip and two for pushing the notes out. That sounds alarming until you say what a machine is: one customer, standing in front of it, for about forty-five seconds. Eighty withdrawals a day is 240 seconds of lock in 86,400 &mdash; less than three tenths of one per cent &mdash; and there is never a second customer to block. The place where things really do arrive together is the bank, and nobody there waits for a lock: one compare-and-set per account. The one caller that does get blocked is not a customer at all but the watchdog, and that is rung 1 of the ladder: move the bank call and the push outside the machine's lock, so a card can be taken back while they run. Rung 2 is nothing, because the balances are already one atomic number per account; rung 3 is past one process, where the row becomes the lock: <code>UPDATE ... WHERE balance &gt;= ?</code>.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // the race: forty machines, one account with 10,000 left, everyone asking for 500\n        bank.open(&quot;ACC-RACE&quot;, 10_000);\n        int machines = 40;\n        List&lt;ATM&gt; fleet = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; machines; i++) {\n            CashDispenser d = new CashDispenser(new WorkingFeeder());\n            d.refill(Note.N500, 2);\n            ATM a = new ATM(&quot;ATM-R&quot; + i, bank, d);\n            fleet.add(a);\n        }\n        ExecutorService pool = Executors.newFixedThreadPool(machines);   // all forty really at once\n        CountDownLatch go = new CountDownLatch(1);\n        AtomicInteger paid = new AtomicInteger(), refused = new AtomicInteger();\n        AtomicLong handedOut = new AtomicLong();\n        for (ATM a : fleet) {\n            pool.submit(() -&gt; {\n                a.insertCard(new Card(&quot;4111-1111&quot;, &quot;ACC-RACE&quot;));\n                a.enterPin(&quot;1234&quot;);\n                go.await();\n                try { Withdrawal x = a.withdraw(500); paid.incrementAndGet(); handedOut.addAndGet(x.amount); }\n                catch (WithdrawalFailed f) { refused.incrementAndGet(); }\n                a.ejectCard();\n                return null;\n            });\n        }\n        go.countDown();\n        pool.shutdown();\n        pool.awaitTermination(10, TimeUnit.SECONDS);\n        System.out.println(&quot;race: &quot; + paid.get() + &quot; paid, &quot; + refused.get() + &quot; refused, &quot;\n            + handedOut.get() + &quot; handed out, balance &quot; + bank.balance(&quot;ACC-RACE&quot;));\n        if (paid.get() != 20 || bank.balance(&quot;ACC-RACE&quot;) != 0)\n            throw new AssertionError(&quot;the bank is not the single writer!&quot;);\n\n        // the same race with no machine around it, so the compare-and-set is the only thing in the way\n        bank.open(&quot;ACC-CAS&quot;, 10_000);\n        ExecutorService raw = Executors.newFixedThreadPool(32);\n        AtomicInteger won = new AtomicInteger();\n        for (int i = 0; i &lt; 200; i++) {\n            final int n = i;\n            raw.submit(() -&gt; { if (bank.debit(&quot;ACC-CAS&quot;, 100, &quot;cas-&quot; + n) == BankReply.OK) won.incrementAndGet(); });\n        }\n        raw.shutdown();\n        raw.awaitTermination(10, TimeUnit.SECONDS);\n        System.out.println(&quot;bank alone: &quot; + won.get() + &quot; of 200 debits of 100 got through, balance &quot;\n            + bank.balance(&quot;ACC-CAS&quot;) + &quot;, debits that lost the race and read again: &quot; + bank.casRetries.get());\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; The notes jam after the bank has already debited. What is the state of the system, and show me the code.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The money has left the account and the customer has nothing, which is the only genuinely dangerous state in an ATM, so it is handled rather than hoped about. <code>push</code> throws a <code>HardwareFault</code>; the machine reverses the debit &mdash; the bank credits the amount back once, under the row's key plus \"-rev\" &mdash; marks the row REVERSED and reports it. If that credit-back cannot reach the bank either, the row is marked UNKNOWN instead of being left looking settled, and the reconciler reverses it later under the same key, so it can never be paid back twice (test 15). The reserved notes are <i>not</i> pretended back into the cassette &mdash; they are physically stuck, so they are counted into the retract bin, and the cash in the machine still adds up. The row stays in the journal forever, which is what the operator reads in the morning.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Take cash out. The order is the design: write the row and check the rule, RESERVE the notes, ask the\n     * bank to debit with an idempotency key, and only then push the notes. A refusal at either of the first\n     * two steps has moved no money at all; a jam after the debit is reversed (one credit, under a second key);\n     * a bank that never answers dispenses nothing and leaves an UNKNOWN row for the reconciler.\n     */\n    Withdrawal withdraw(long amount) {\n        Withdrawal w;\n        lock.lock();\n        try { w = doWithdraw(amount); } finally { lock.unlock(); }\n        publish(new AtmEvent(id, &quot;WITHDRAW&quot;, w.accountId, amount, clock.nowMs(), w));   // after the unlock\n        if (w.state != TxnState.DISPENSED) throw new WithdrawalFailed(w);\n        return w;\n    }\n\n    /** The withdrawal itself, always called with the lock held. It never throws for a business outcome. */\n    private Withdrawal doWithdraw(long amount) {\n        require(SessionState.AUTHENTICATED);\n        Withdrawal w = new Withdrawal(SEQ.incrementAndGet(), id, session.card.accountId, amount, clock.nowMs());\n        journal.add(w);                                             // written BEFORE the bank is asked\n\n        String no = policy.refuse(w.accountId, amount, clock.nowMs());\n        if (no != null) return w.refuse(no);                        // nothing has been touched\n\n        to(SessionState.TRANSACTION);\n        EnumMap&lt;Note, Integer&gt; plan = dispenser.reserve(amount);    // reserve BEFORE the debit\n        if (plan == null) { to(SessionState.AUTHENTICATED); return w.refuse(&quot;the cassettes cannot make &quot; + amount); }\n        w.notes = plan;\n\n        BankReply reply;\n        try { reply = bank.debit(w.accountId, amount, w.key); }    // the irreversible step\n        catch (RuntimeException e) { reply = BankReply.TIMEOUT; }  // a call that throws is not a &quot;no&quot; either\n        if (reply == BankReply.DECLINED) {\n            dispenser.release(plan);                                // every note goes back\n            to(SessionState.AUTHENTICATED);\n            return w.refuse(&quot;the bank declined&quot;);\n        }\n        if (reply == BankReply.TIMEOUT) {\n            dispenser.release(plan);                                // hand out nothing while nobody knows\n            to(SessionState.AUTHENTICATED);\n            w.state = TxnState.UNKNOWN;\n            w.note = &quot;the bank did not answer; this row is for reconciliation&quot;;\n            return w;\n        }\n\n        w.state = TxnState.DEBITED;                                 // the money has left the account\n        to(SessionState.DISPENSING);\n        try {\n            dispenser.push(plan);\n            w.state = TxnState.DISPENSED;\n        } catch (HardwareFault f) {\n            try {\n                bank.reverse(w.accountId, amount, w.key);           // give it back: one credit, under key + &quot;-rev&quot;\n                w.state = TxnState.REVERSED;\n                w.note = &quot;dispenser jammed (&quot; + f.getMessage() + &quot;); the account was credited back&quot;;\n            } catch (RuntimeException e) {                          // the give-back did not get through either\n                w.state = TxnState.UNKNOWN;\n                w.note = &quot;dispenser jammed and the credit-back was not confirmed; the reconciler will reverse it&quot;;\n            }\n        }\n        to(SessionState.AUTHENTICATED);\n        return w;\n    }\n\n        // 4. the dispenser jams AFTER the debit: the account is credited back, the notes are retracted\n        core.open(&quot;A4&quot;, 10_000);\n        CashDispenser jam = new CashDispenser(new JammingFeeder(1));\n        jam.refill(Note.N500, 4);\n        ATM m4 = new ATM(&quot;T4&quot;, core, jam);\n        m4.setClock(CLOCK);\n        m4.insertCard(new Card(&quot;CARD-1&quot;, &quot;A4&quot;));\n        m4.enterPin(&quot;1234&quot;);\n        Withdrawal w4 = null;\n        try { m4.withdraw(1_000); check(false, &quot;a jam must be reported&quot;); } catch (WithdrawalFailed f) { w4 = f.w; }\n        check(w4.state == TxnState.REVERSED, &quot;a jam after the debit is REVERSED, not swallowed&quot;);\n        check(core.balance(&quot;A4&quot;) == 10_000, &quot;the customer got nothing and was charged nothing&quot;);\n        check(jam.retracted() == 2 &amp;&amp; jam.cash() == 1_000, &quot;the two stuck notes are in the retract bin, not back in the cassette&quot;);\n\n        // 15. the notes jam AND the credit-back cannot reach the bank: the row must not look settled\n        core.open(&quot;A15&quot;, 10_000);\n        FlakyBank cut = new FlakyBank(core);\n        CashDispenser d15 = new CashDispenser(notes -&gt; { cut.linkDownFor(1); throw new RuntimeException(&quot;jam, and the link drops&quot;); });\n        d15.refill(Note.N500, 4);\n        ATM m15 = new ATM(&quot;T15&quot;, cut, d15);\n        m15.setClock(CLOCK);\n        m15.insertCard(new Card(&quot;CARD-1&quot;, &quot;A15&quot;));\n        m15.enterPin(&quot;1234&quot;);\n        Withdrawal w15 = null;\n        try { m15.withdraw(1_000); } catch (WithdrawalFailed f) { w15 = f.w; } catch (RuntimeException e) { }\n        check(w15 != null &amp;&amp; w15.state == TxnState.UNKNOWN &amp;&amp; core.balance(&quot;A15&quot;) == 9_000,\n              &quot;debited, nothing dispensed, credit-back unconfirmed: the row says UNKNOWN, not DEBITED&quot;);\n        new Reconciler(core).settle(m15.unresolved());\n        new Reconciler(core).settle(List.of(w15));                    // a second run finds nothing left to do\n        check(w15.state == TxnState.REVERSED &amp;&amp; core.balance(&quot;A15&quot;) == 10_000, &quot;the reconciler gives the money back, once&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; The bank does not answer at all. The link is down. What do you do?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A timeout is not a no. Nobody knows whether the debit landed, so the machine dispenses nothing, puts the reserved notes back, and marks the row UNKNOWN rather than guessing; a bank call that throws is treated the same way (test 14). Later a reconciler sends a <b>reversal</b> for that row's key. If the debit landed, the bank gives the money back once; if it never landed, the bank marks the key as dead, so the lost request cannot land if it turns up late. What the reconciler must never do is \"ask\" by debiting again: if the first debit never landed, that question takes the money now. The key is written into the journal row before the bank is asked, so the row always carries what the reversal needs. In India this is a rule, not a nicety: the RBI gives a bank five days after a failed withdrawal to put the money back, then &#8377;100 a day in compensation to the customer. <b>Reconciliation</b> means matching the machine's journal against the bank's ledger (its own record of every debit and credit). Neither is edited to match the other: settling a row adds a new fact, a reversal, and never rewrites an old one.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: reconciling the rows the bank never answered\n/**\n * What an operator (or a start-up task) does with an UNKNOWN row: it sends a REVERSAL for the row&#x27;s key.\n * If the debit landed, the bank gives the money back once; if it never landed, the bank marks the key dead,\n * so the lost request cannot land if it turns up late. It never &quot;asks&quot; by debiting again: if the first\n * debit never landed, that question would take the money now.\n */\nclass Reconciler {\n    private final BankService bank;\n    Reconciler(BankService bank) { this.bank = bank; }\n    /** Settle every UNKNOWN row it is given; any other row is left alone. Returns how many were settled. */\n    int settle(List&lt;Withdrawal&gt; rows) {\n        int done = 0;\n        for (Withdrawal w : rows) {\n            if (w.state != TxnState.UNKNOWN) continue;                         // never reverse a row that paid out\n            try {\n                if (bank.reverse(w.accountId, w.amount, w.key)) {\n                    w.state = TxnState.REVERSED;\n                    w.note = &quot;reconciled: the debit had landed and nothing was dispensed, so it was reversed&quot;;\n                } else {\n                    w.state = TxnState.REFUSED;\n                    w.note = &quot;reconciled: the debit never landed, and now it never can&quot;;\n                }\n                done++;\n            } catch (RuntimeException linkStillDown) { }                      // stays UNKNOWN: try again next run\n        }\n        return done;\n    }\n}\n\n/**\n     * The reversal. putIfAbsent, in one step, either finds the debit&#x27;s answer or plants a DECLINED in its\n     * place. So a debit that was lost on the way and turns up later finds that DECLINED and moves nothing.\n     */\n    public boolean reverse(String accountId, long amount, String key) {\n        BankReply first = applied.putIfAbsent(key, BankReply.DECLINED);\n        if (first != BankReply.OK) return false;                              // it never landed: nothing to give back\n        credit(accountId, amount, key + &quot;-rev&quot;);                               // it landed: give it back, once\n        return true;\n    }\n\n        // 5. the bank never answers: dispense nothing, record UNKNOWN, reverse it later -- never debit to &quot;ask&quot;\n        core.open(&quot;A5&quot;, 10_000);\n        FlakyBank slow = new FlakyBank(core);\n        slow.next(BankReply.TIMEOUT);                                 // the request was lost before the bank saw it\n        ATM m5 = machine(&quot;T5&quot;, slow, new WorkingFeeder(), new int[] { 0, 4, 0, 0 });\n        m5.insertCard(new Card(&quot;CARD-1&quot;, &quot;A5&quot;));\n        m5.enterPin(&quot;1234&quot;);\n        Withdrawal w5 = null;\n        try { m5.withdraw(1_000); check(false, &quot;a timeout must not look like success&quot;); } catch (WithdrawalFailed f) { w5 = f.w; }\n        check(w5.state == TxnState.UNKNOWN, &quot;a bank that does not answer leaves the row UNKNOWN&quot;);\n        check(core.balance(&quot;A5&quot;) == 10_000, &quot;nothing was debited while nobody knew&quot;);\n        check(m5.unresolved().size() == 1, &quot;the row is waiting for reconciliation&quot;);\n        new Reconciler(core).settle(m5.unresolved());\n        check(w5.state == TxnState.REFUSED &amp;&amp; core.balance(&quot;A5&quot;) == 10_000,\n              &quot;reconciliation finds the debit never landed and says so, without debiting to find out: &quot; + w5.state);\n        check(core.debit(&quot;A5&quot;, 1_000, w5.key) == BankReply.DECLINED &amp;&amp; core.balance(&quot;A5&quot;) == 10_000,\n              &quot;and the lost request, turning up late under the same key, can no longer take the money&quot;);\n        core.open(&quot;A5b&quot;, 10_000);                                     // the dangerous kind: it landed, the answer was lost\n        ATM m5b = machine(&quot;T5b&quot;, new FlakyBank(core).landsButTimesOut(), new WorkingFeeder(), new int[] { 0, 4, 0, 0 });\n        m5b.insertCard(new Card(&quot;CARD-1&quot;, &quot;A5b&quot;));\n        m5b.enterPin(&quot;1234&quot;);\n        try { m5b.withdraw(1_000); } catch (WithdrawalFailed ignored) { }\n        check(core.balance(&quot;A5b&quot;) == 9_000 &amp;&amp; m5b.unresolved().size() == 1, &quot;the money left, nothing was dispensed, the row is UNKNOWN&quot;);\n        new Reconciler(core).settle(m5b.journal());                   // handed EVERY row: it touches only the UNKNOWN one\n        check(core.balance(&quot;A5b&quot;) == 10_000 &amp;&amp; m5b.unresolved().isEmpty(), &quot;the reversal gives it back, exactly once&quot;);\n\n        // 14. the link dies in the middle of a debit: an exception is treated as &quot;nobody knows&quot;, and nothing leaks\n        core.open(&quot;A14&quot;, 10_000);\n        CashDispenser d14 = new CashDispenser(new WorkingFeeder());\n        d14.refill(Note.N500, 4);\n        ATM m14 = new ATM(&quot;T14&quot;, new FlakyBank(core).linkDownFor(1), d14);\n        m14.setClock(CLOCK);\n        m14.insertCard(new Card(&quot;CARD-1&quot;, &quot;A14&quot;));\n        m14.enterPin(&quot;1234&quot;);\n        Withdrawal w14 = null;\n        try { m14.withdraw(1_000); } catch (WithdrawalFailed f) { w14 = f.w; } catch (RuntimeException e) { }\n        check(w14 != null &amp;&amp; w14.state == TxnState.UNKNOWN &amp;&amp; m14.unresolved().size() == 1,\n              &quot;a bank call that throws leaves an UNKNOWN row the reconciler can see, not a crash and a PENDING row&quot;);\n        check(d14.cash() == 2_000 &amp;&amp; m14.state() == SessionState.AUTHENTICATED,\n              &quot;every reserved note is back in the cassette, and the customer is still in the session&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; Three wrong PINs. And what if the thief takes the card out after two and puts it back?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The count lives at the bank, per card, not on the visit. If the visit counted, a thief could take the card out after two wrong tries and put it back for three fresh ones, as often as he liked. So <code>authenticate</code> answers OK, WRONG or BLOCKED, and the bank keeps the count in one atomic step per card: <code>compute</code> on a concurrent map runs one caller at a time for the same key. A right PIN resets the count; a blocked card is refused even with the right PIN, on every machine. On BLOCKED the machine moves the visit to EJECTED and then IDLE without giving the card back: it is in the capture bin. Everything after that is refused by the state check, which names the state it happened in. Test 13 takes the card out after two wrong PINs, puts it back, and proves the third wrong one still keeps it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Try a PIN. The bank counts the wrong ones per card; when it answers BLOCKED the machine keeps the card:\n     * the session ends and the state goes back to IDLE with nothing in the slot to hand back.\n     */\n    void enterPin(String pin) {\n        PinCheck r;\n        lock.lock();\n        try {\n            require(SessionState.CARD_INSERTED);\n            r = bank.authenticate(session.card.number, pin);\n            if (r == PinCheck.OK) to(SessionState.AUTHENTICATED);\n            if (r == PinCheck.BLOCKED) {\n                to(SessionState.EJECTED);                 // the card goes into the capture bin, not the slot\n                to(SessionState.IDLE);\n            }\n        } finally { lock.unlock(); }\n        if (r == PinCheck.BLOCKED) {\n            publish(new AtmEvent(id, &quot;CARD_RETAINED&quot;, &quot;&quot;, 0, clock.nowMs(), null));\n            throw new CardRetained(&quot;too many wrong PINs on this card: the card has been retained&quot;);\n        }\n        if (r == PinCheck.WRONG) throw new IllegalArgumentException(&quot;wrong PIN, try again&quot;);\n    }\n\n/**\n     * Check the PIN and count per CARD in one step: compute runs one caller at a time for the same card. A\n     * right PIN resets the count; once the count reaches the limit, even the right PIN answers BLOCKED.\n     */\n    public PinCheck authenticate(String cardNumber, String pin) {\n        int wrong = wrongPins.compute(cardNumber, (card, n) -&gt; {\n            int before = n == null ? 0 : n;\n            if (before &gt;= PIN_LIMIT) return before;                           // blocked stays blocked\n            return pin.equals(pins.get(card)) ? 0 : before + 1;\n        });\n        if (wrong == 0) return PinCheck.OK;\n        return wrong &gt;= PIN_LIMIT ? PinCheck.BLOCKED : PinCheck.WRONG;\n    }\n\n        // 13. wrong PINs are counted on the CARD: taking it out after two does not buy fresh tries\n        core.issueCard(&quot;CARD-13&quot;, &quot;1234&quot;);\n        core.open(&quot;A13&quot;, 10_000);\n        ATM m13 = machine(&quot;T13&quot;, core, new WorkingFeeder(), new int[] { 0, 4, 0, 0 });\n

<text x=\"150.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the customer walks away mid-withdrawal</text></g><path d=\"M330 289 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 270)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the watchdog waits for the machine's lock; test 11: it cannot cut in</text></g><g transform=\"translate(30 312)\"><rect width=\"300\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a deposit of nothing, or of -500</text></g><path d=\"M330 331 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 312)\"><rect width=\"820\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the credit is what the reader counted; test 16: refused, balance unmoved</text></g><text x=\"615\" y=\"376\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and the rest: a printer that throws (test 7), one key charged once (8), a cap asked the same key twice (10), a low-cash floor (12),</text><text x=\"615\" y=\"394\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">note rules (6), local midnight and a jam against the cap (17), the state-object sketch (18). FailureTests.java runs 53 checks and must print ALL PASS.</text></svg></div><div class=\"move\"><p>Three wrong PINs (the card is captured and the visit ends; because the bank counts per card, taking it out and putting it back buys no fresh tries). A drawer that cannot make the amount (refused before the bank is asked, which the test proves by counting the calls the bank received: zero). A decline after the notes were reserved (every note goes back, and the cassette counts afterwards are identical). A jam after the debit (a reversal under a second key; the notes are counted into the retract bin, a sealed box inside the machine, rather than pretended back into the cassette, so the cash in the machine still adds up; and if even the credit-back fails, the row says UNKNOWN, never settled). A bank that never answers, or a call that throws (nothing dispensed, the row left UNKNOWN; later a reconciler sends a reversal for the <i>same</i> key, which gives the money back if the debit landed and makes sure it can never land if it did not). The race: forty machines, one account with ten thousand in it, everybody asking for five hundred &mdash; exactly twenty are paid, the balance lands on zero, and the cash that left the drawers equals the money that left the account. Two more only a running program finds. A customer who walks away while the bank is thinking: the watchdog waits for the lock, so the card comes out after the notes and never instead of them. A daily cap asked the same idempotency key twice: a retry is not a second withdrawal, so it must be let straight through, or the machine is told no about money that really left. A design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 388\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"850\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface NoteSelection { select(stock, amount): plan }</text><text x=\"850\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a new note rule is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">interface WithdrawalPolicy { refuse(acct, amt, now): String }</text><text x=\"850\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">limits and fees become configuration</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">class DailyCap implements BankService { base.debit(...) }</text><text x=\"850\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">\"cap it at 20,000 a day\" touches no ATM code</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">publish(e) AFTER the unlock, each listener in a try/catch</text><text x=\"850\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">the receipt hears; the money flow never waits</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"220\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Transitions.ALLOWED: SessionState &rarr; the moves it may make</text><text x=\"850\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">an illegal action is refused by a table lookup</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">Command</text><text x=\"220\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">the Withdrawal row: its amount, its notes and its key</text><text x=\"850\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">the reversal is that row with the sign flipped</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Chain of Responsibility</text><text x=\"220\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not earned</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">the back-off walks Note.values() in order, in one method</text><text x=\"850\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">it earns links when a link carries its own policy</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"220\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">the machine is HANDED its bank and its dispenser</text><text x=\"850\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds forty fresh ATMs in a loop</text><rect x=\"20\" y=\"290\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"220\" y=\"309.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Note.values() is already the registry of denominations</text><text x=\"850\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when notes come from config</text><rect x=\"20\" y=\"320\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"220\" y=\"339.0\" font-size=\"11\" fill=\"var(--text)\">never</text><text x=\"310\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">a withdrawal has one field the customer chose: the amount</text><text x=\"850\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">there is nothing to build</text><text x=\"615\" y=\"374\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence, and the empty rows are as useful as the full ones</text></svg></div><div class=\"move\"><p>The table is the answer; what it cannot show is why four names are missing. Chain of Responsibility is the interesting refusal, because it is the classic ATM answer: one handler per denomination, each passing the remainder down the chain. The textbook chain is pure greed: each link takes all it can and passes the rest on, so it refuses the 600 on page 05. This code walks <code>Note.values()</code> in one method and can step back: four fewer classes and a right answer. The chain earns its links the day a link carries a policy of its own. Singleton earned nothing: the machine is handed its bank and its dispenser, which is exactly how a test builds forty of them in a loop, and a static instance would make that impossible. Factory not yet: <code>Note</code> is already the registry of denominations, and a factory earns its place the day they arrive from a config file. Builder never: the customer chooses one field, the amount. Saying why a pattern is absent is worth more in the room than naming one that is there, because it shows the names are conclusions and not decoration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">CashDispenser: the notes. ATM: the flow and the lock. The bank: the balance.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">DailyCap is a new file plus one wiring line; the ATM never opened</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">rule.select(stock, amount);  never \"is this the rationing one?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">NoteSelection, WithdrawalPolicy, AtmObserver, NoteFeeder, Clock</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">new ATM(id, bank, dispenser);  atm.setClock(() -&gt; fixedMs)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>Read the table as five questions with a yes already written in. The one that actually pays here is D: the machine is handed a <code>BankService</code> and a <code>Clock</code>, both interfaces, and its dispenser is handed a <code>NoteFeeder</code>. That is the only reason the failure tests can give it a bank that times out on demand, a feeder that jams once and a clock stuck on a Tuesday. If a letter has no line in the code next to it, the move that should have produced it did not happen &mdash; that is what this table is for, not recital.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">ration the 2000s, a fee, a limit</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind NoteSelection or WithdrawalPolicy, one wiring line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">mini-statement, low-cash alert, fraud</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more observer; the order at the critical step does not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an envelope waiting to be counted</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more state and one more row in the ALLOWED table</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across owners</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">cash and balance must always agree</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reserve, then debit, then reverse on a jam: one order, all or nothing</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the machine rebooted mid-withdrawal</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the journal behind a repository; claiming a key becomes an INSERT</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE account SET balance = balance - ? WHERE id = ? AND balance &gt;= ?</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the ATM, the dispenser and the tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>The value of the table is the sentence you say before you type: \"that is a new rule, so it is a new class behind <code>NoteSelection</code> and one wiring line\". Two rows are worth spelling out. The last one is the real change of shape: once the journal must outlive the process it goes behind a repository, claiming a key becomes an <code>INSERT</code> that a duplicate key rejects, and the debit becomes <code>UPDATE account SET balance = balance - ? WHERE id = ? AND balance &gt;= ?</code> &mdash; the database doing exactly the atomic step the compare-and-set did in memory. The fourth is the one people skip: an invariant that spans two owners is not a new class at all, it is the order, and the order is already reserve, debit, reverse. For all five, the ATM, the dispenser and the tests do not change; that is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 972\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M320 207.0L280 99.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M320 207.0L280 400.0\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><path d=\"M490.0 364L490.0 410\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><t chor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ReceiptPrinter | AuditLog</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">onEvent -&gt; print / keep</text></g><g transform=\"translate(995 220)\"><rect width=\"230\" height=\"50\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">WithdrawalFailed</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">w: Withdrawal</text></g><g transform=\"translate(995 300)\"><rect width=\"230\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">the other failures</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">CardRetained: the card is kept</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">HardwareFault: the notes jammed</text></g><g transform=\"translate(995 405)\"><rect width=\"230\" height=\"50\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"115.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">BankReply</text><line x1=\"0\" y1=\"34\" x2=\"230\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">OK, DECLINED, TIMEOUT</text></g><g transform=\"translate(995 490)\"><rect width=\"230\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Transitions</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">ALLOWED: SessionState &rarr;</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">  the moves it may make</text></g><g transform=\"translate(995 580)\"><rect width=\"230\" height=\"50\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"115.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">PinCheck</text><line x1=\"0\" y1=\"34\" x2=\"230\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">OK, WRONG, BLOCKED</text></g><g><path d=\"M20 932L64 932\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"936\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 932L284 932\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"936\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 932L504 932\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"936\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 932L684 932\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"936\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 932L904 932\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"936\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the machine owns the visit, the journal and the cassettes. Plain arrow = references. Dashed green = handed in and never built here. Dotted blue = notifies, and it leaves the ATM from the top to say what it means: the listeners are called after the lock is released. <b>Where state lives:</b> the <i>bank</i> has the balances, the applied-keys map and the wrong-PIN count per card, and it is the only writer of a balance; the <i>CashDispenser</i> has the note counts, the retract bin and its own lock; the <i>ATM</i> has one visit, one lock and an append-only journal, and it owns no money at all. The two enums on the left are the two life cycles &mdash; one for the visit, one for the money &mdash; and the Transitions box on the right is the table that says which move may follow which. BankReply and PinCheck, on the right, are the two kinds of answer the bank gives. Card and AtmEvent have no arrows because they are values: they are passed around and never changed. <b>What is here and what is not.</b> Every class in Main.java is on this page, so this is the whole list of what you type in the hour; the one exception is marked with an asterisk, because JammingFeeder is a test double from Extensions.java and is drawn only to show that the feeder really is a seam. Everything else in Extensions.java &mdash; DailyCap, RationBigNotes, GreedyOnly, MiniStatement, LowCashAlert, the Reconciler, the repository, the watchdog &mdash; is an answer to a follow-up on page 05, and every one of them plugs into a box that is already on this diagram without changing it.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it is for and what it guarantees; read only those first for the shape, then the bodies for the mechanics, and read <code>doWithdraw</code> last and slowly, because its order is the design. Each copy button copies that whole file. Below Main.java: Extensions.java (every follow-up's reference code, plus an <code>ExtDemo</code> main that runs them) and FailureTests.java (fifty-three claims proven across eighteen scenarios; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/**\n * The note denominations this machine stocks, declared LARGEST FIRST so the enum&#x27;s own order is the order\n * the note picker tries them in. Whole rupees only: cash can never have a rounding error.\n */\nenum Note {\n    N2000(2000), N500(500), N200(200), N100(100);\n    final int value;\n    Note(int value) { this.value = value; }\n}\n\n/**\n * Where the machine is in one customer&#x27;s visit. Every public method names the states it is legal in, and\n * the ALLOWED table below names which move may follow which; everything else throws.\n */\nenum SessionState { IDLE, CARD_INSERTED, AUTHENTICATED, TRANSACTION, DISPENSING, EJECTED }\n\n/**\n * The life of ONE withdrawal attempt. PENDING is the moment before the bank is asked. Everything after it\n * is a fact about money: REFUSED (nothing moved), DEBITED (money left the account), DISPENSED (the customer\n * is holding it), REVERSED (it jammed, so we credited it back), UNKNOWN (nobody knows yet whether money\n * moved: the bank never answered, or a give-back was not confirmed; the reconciler settles it).\n */\nenum TxnState { PENDING, REFUSED, DEBITED, DISPENSED, REVERSED, UNKNOWN }\n\n/** What the bank says to a debit. TIMEOUT is not a &quot;no&quot;: it means nobody knows yet, so do not dispense. */\nenum BankReply { OK, DECLINED, TIMEOUT }\n\n/**\n * What the bank says to a PIN. The bank counts wrong PINs per CARD, across every visit and every machine, so\n * taking the card out and putting it back buys no fresh tries. BLOCKED means: keep the card.\n */\nenum PinCheck { OK, WRONG, BLOCKED }\n\n/** Time, handed in rather than read, so a test can put the machine on any day at any hour. */\ninterface Clock { long nowMs(); }\n\n/** The plastic: the number on the front and the account it resolves to. Immutable; it holds no money. */\nfinal class Card {\n    final String number, accountId;\n    Card(String number, String accountId) { this.number = number; this.accountId = accountId; }\n}\n\n/**\n * Which session moves are legal. A table, not a chain of if-statements, so a new step in the visit is one\n * more row and every illegal move is rejected for free.\n */\nfinal class Transitions {\n    static final Map&lt;SessionState, Set&lt;SessionState&gt;&gt; ALLOWED = new EnumMap&lt;&gt;(Map.of(\n        SessionState.IDLE,          EnumSet.of(SessionState.CARD_INSERTED),\n        SessionState.CARD_INSERTED, EnumSet.of(SessionState.AUTHENTICATED, SessionState.EJECTED),\n        SessionState.AUTHENTICATED, EnumSet.of(SessionState.TRANSACTION, SessionState.EJECTED),\n        SessionState.TRANSACTION,   EnumSet.of(SessionState.DISPENSING, SessionState.AUTHENTICATED, SessionState.EJECTED),\n        SessionState.DISPENSING,    EnumSet.of(SessionState.AUTHENTICATED, SessionState.EJECTED),\n        SessionState.EJECTED,       EnumSet.of(SessionState.IDLE)));\n}\n\n/**\n * One customer&#x27;s visit: the card in the slot and where the visit has got to. A fresh Session is built on\n * every card insertion. The count of wrong PINs is deliberately NOT here: it belongs to the card, so the\n * bank keeps it (see PinCheck).\n */\nfinal class Session {\n    final String id;\n    final Card card;                                  // null only for the idle session\n    final long startedMs;\n    SessionState state;\n    Session(String id, Card card, long startedMs, SessionState state) {\n        this.id = id; this.card = card; this.startedMs = startedMs; this.state = state;\n    }\n}\n\n/**\n * One row in the machine&#x27;s journal: everything known about one withdrawal attempt. It is written before\n * the bank is asked and never deleted, so an operator always has a row to reconcile from (in memory here;\n * on disk once the journal is persisted, page 05). The key is the idempotency key: the bank applies one key\n * exactly once.\n */\nfinal class Withdrawal {\n    final int id;\n    final String atmId, accountId, key;\n    final long amount, startedMs;\n    EnumMap&lt;Note, Integer&gt; notes = new EnumMap&lt;&gt;(Note.class);   // the reserved plan; empty until reserved\n    volatile TxnState state = TxnState.PENDING;                 // volatile: a reconciler may settle it from another thread\n    volatile String note = &quot;&quot;;                                   // why, in English, for the receipt\n    Withdrawal(int id, String atmId, String accountId, long amount, long startedMs) {\n        this.id = id; this.atmId = atmId; this.accountId = accountId; this.amount = amount;\n        this.startedMs = startedMs; this.key = atmId + &quot;-&quot; + id;\n    }\n    /** Mark this attempt as &quot;no money moved, and here is why&quot;. Returns this so callers can `return w.refuse(..)`. */\n    Withdrawal refuse(String why) { state = TxnState.REFUSED; note = why; return this; }\n    /** How many notes of each denomination were handed over (or reserved). */\n    int noteCount() { int n = 0; for (int c : notes.values()) n += c; return n; }\n    public String toString() { return &quot;#&quot; + id + &quot; &quot; + amount + &quot; &quot; + state + (note.isEmpty() ? &quot;&quot; : &quot; (&quot; + note + &quot;)&quot;); }\n}\n\n/** Thrown when a withdrawal did not end with cash in the customer&#x27;s hand. Carries the journal row. */\nclass WithdrawalFailed extends RuntimeException {\n    final Withdrawal w;\n    WithdrawalFailed(Withdrawal w) { super(w.state + &quot;: &quot; + w.note); this.w = w; }\n}\n\n/** Thrown when three wrong PINs have been entered: the card is inside the machine and stays there. */\nclass CardRetained extends RuntimeException {\n    CardRetained(String msg) { super(msg); }\n}\n\n/** The dispenser hardware failed with the notes half out of the slot. */\nclass HardwareFault extends RuntimeException {\n    HardwareFault(String msg) { super(msg); }\n}\n\n/**\n * Something worth telling a receipt printer or an audit log about. A value, not a callback, so a listener\n * can be added without the ATM knowing what it does.\n */\nfinal class AtmEvent {\n    final String atmId, kind, accountId;\n    final long amount, atMs;\n    final Withdrawal txn;                            // null for card events\n    AtmEvent(String atmId, String kind, String accountId, long amount, long atMs, Withdrawal txn) {\n        this.atmId = atmId; this.kind = kind; this.accountId = accountId; this.amount = amount;\n        this.atMs = atMs; this.txn = txn;\n    }\n}\n\n/** Anyone who wants to know what the machine did. Called AFTER the lock is released. */\ninterface AtmObserver { void onEvent(AtmEvent e); }\n\n/** Prints a slip. Deliberately trivial: it must never be able to affect a transaction. */\nclass ReceiptPrinter implements AtmObserver {\n    public void onEvent(AtmEvent e) {\n        if (e.txn != null) System.out.println(&quot;   [receipt] &quot; + e.atmId + &quot; &quot; + e.txn);\n    }\n}\n\n/** Keeps every event in memory, which is what an auditor reads afterwards. */\nclass AuditLog implements AtmObserver {\n    final List&lt;AtmEvent&gt; events = new CopyOnWriteArrayList&lt;&gt;();\n    public void onEvent(AtmEvent e) { events.add(e); }\n    int count(String kind) { int n = 0; for (AtmEvent e : events) if (e.kind.equals(kind)) n++; return n; }\n}\n\n/**\n * Everything the machine cannot do by itself. The one load-bearing method is debit: it must check the\n * balance and subtract it as ONE indivisible step, and it must apply the same key at most once.\n */\ninterface BankService {\n    /** Check a PIN. The bank counts wrong ones per card, on every machine; a right PIN resets the count. */\n    PinCheck authenticate(String cardNumber, String pin);\n    /** The current balance, for a balance enquiry. */\n    long balance(String accountId);\n    /** Take the money if it is there, as one step. The same key twice moves money once. */\n    BankReply debit(String accountId, long amount, String key);\n    /** Put money in (a deposit). The same key twice moves money once. */\n    void credit(String accountId, long amount, String key);\n    /**\n     * Undo the debit made under this key if it landed, and make sure it can never land later. True means the\n     * money went back. Safe to send again and again: the give-back is one credit, under key + &quot;-rev&quot;.\n     */\n    boolean reverse(String accountId, long amount, String key);\n}\n\n/**\n * A stand-in for the bank&#x27;s core, written the way the real one has to behave: the balance is one\n * AtomicLong per account and the only writer is a compare-and-set loop, so two terminals debiting the same\n * account at the same instant can never both see the old balance. The key map is the idempotency record.\n * The wrong-PIN counts live here too, one per card, because the card is the bank&#x27;s and not the visit&#x27;s.\n */\nclass InMemoryBank implements BankService {\n    static final int PIN_LIMIT = 3;                                            // wrong PINs in a row before a card is blocked\n    private final Map&lt;String, AtomicLong&gt; balances = new ConcurrentHashMap&lt;&gt;();\n    private final Map&lt;String, String&gt; pins = new ConcurrentHashMap&lt;&gt;();       // card number -&gt; PIN\n    private final Map&lt;String, Integer&gt; wrongPins = new ConcurrentHashMap&lt;&gt;(); // card number -&gt; wrong PINs in a row\n    private final Map&lt;String, BankReply&gt; applied = new ConcurrentHashMap&lt;&gt;(); // idempotency key -&gt; what happened\n    final AtomicInteger casRetries = new AtomicInteger();                     // how often a debit lost the race\n\n    /** Open an account with a starting balance, in whole rupees. */\n    void open(String accountId, long rupees) { balances.put(accountId, new AtomicLong(rupees)); }\n    /** Attach a card number and its PIN to an account. */\n    void issueCard(String cardNumber, String pin) { pins.put(cardNumber, pin); }\n\n    /**\n     * Check the PIN and count per CARD in one step: compute runs one caller at a time for the same card. A\n     * right PIN resets the count; once the count reaches the limit, even the right PIN answers BLOCKED.\n     */\n    public PinCheck authenticate(String cardNumber, String pin) {\n        int wrong = wrongPins.compute(cardNumber, (card, n) -&gt; {\n            int before = n == null ? 0 : n;\n            if (before &gt;= PIN_LIMIT) return before;                           // blocked stays blocked\n            return pin.equals(pins.get(card)) ? 0 : before + 1;\n        });\n        if (wrong == 0) return PinCheck.OK;\n        return wrong &gt;= PIN_LIMIT ? PinCheck.BLOCKED : PinCheck.WRONG;\n    }\n    public long balance(String accountId) { return balances.get(accountId).get(); }\n\n    /**\n     * Check-and-subtract as one step. computeIfAbsent runs the body at most once per key, so a retried\n     * request returns the first answer instead of debiting twice -- and two threads arriving with the SAME\n     * key queue behind each other inside the map, so even a simultaneous retry cannot double-debit.\n     * Different keys run side by side; they only wait for each other in the rare case that they share a\n     * bucket of the map.\n     */\n    public BankReply debit(String accountId, long amount, String key) {\n        if (amount &lt;= 0) return BankReply.DECLINED;                          // a &quot;debit&quot; of -500 would be a credit\n        return applied.computeIfAbsent(key, k -&gt; cas(accountId, -amount));\n    }\n    /** Put money in, once per key. A credit of zero or less is a bug in the caller, never a deposit. */\n    public void credit(String accountId, long amount, String key) {\n        if (amount &lt;= 0) throw new IllegalArgumentException(&quot;a credit must be positive, not &quot; + amount);\n        applied.computeIfAbsent(key, k -&gt; cas(accountId, amount));\n    }\n\n    /**\n     * The reversal. putIfAbsent, in one step, either finds the debit&#x27;s answer or plants a DECLINED in its\n     * place. So a debit that was lost on the way and turns up later finds that DECLINED and moves nothing.\n     */\n    public boolean reverse(String accountId, long amount, String key) {\n        BankReply first = applied.putIfAbsent(key, BankReply.DECLINED);\n        if (first != BankReply.OK) return false;                              // it never landed: nothing to give back\n        credit(accountId, amount, key + &quot;-rev&quot;);                               // it landed: give it back, once\n        return true;\n    }\n\n    /** The single writer of a balance: read, decide, compare-and-set, and retry against the FRESH value. */\n    private BankReply cas(String accountId, long delta) {\n        AtomicLong bal = balances.get(accountId);\n        if (bal == null) return BankReply.DECLINED;\n        for (;;) {\n            long now = bal.get();\n            if (now + delta &lt; 0) return BankReply.DECLINED;          // a balance never goes negative\n            if (bal.compareAndSet(now, now + delta)) return BankReply.OK;\n            casRetries.incrementAndGet();                            // somebody else got in: read again\n        }\n    }\n}\n\n/**\n * The rule that turns an amount into a set of notes. Behind an interface because it is the first thing an\n * interviewer changes: fewest notes today, &quot;ration the 2000s&quot; tomorrow.\n */\ninterface NoteSelection {\n    /** The notes to hand over, or null if this stock cannot make exactly this amount. */\n    EnumMap&lt;Note, Integer&gt; select(EnumMap&lt;Note, Integer&gt; stock, long amount);\n}\n\n/**\n * Fewest notes first, with a back-off. Pure greed is wrong: 600 from {500 x 1, 200 x 3, 100 x 0} dead-ends\n * on the 500, while 200 x 3 pays it exactly. So each denomination tries its greediest count first and then\n * steps down. Being exhaustive, it finds a combination whenever one exists; and because it walks the notes\n * largest first and takes as many of each as it can, on 2000/500/200/100 the first combination it finds is\n * also the fewest-note one. The search stays small: each count is capped by the cassette AND by the amount\n * (at most 12 notes of 2000 in 25,000), and an amount bigger than the whole drawer is refused before any\n * search. For a denomination set where greed-first is not optimal, swap the body for a bounded coin-change\n * table; the interface does not move.\n */\nclass FewestNotes implements NoteSelection {\n    public EnumMap&lt;Note, Integer&gt; select(EnumMap&lt;Note, Integer&gt; stock, long amount) {\n        long inDrawer = 0;\n        for (Map.Entry&lt;Note, Integer&gt; e : stock.entrySet()) inDrawer += (long) e.getKey().value * e.getValue();\n        if (amount &gt; inDrawer) return null;                          // more than the whole drawer: do not search\n        EnumMap&lt;Note, Integer&gt; plan = new EnumMap&lt;&gt;(Note.class);\n        return pick(Note.values(), 0, stock, amount, plan) ? plan : null;\n    }\n    private boolean pick(Note[] notes, int i, Map&lt;Note, Integer&gt; stock, long left, EnumMap&lt;Note, Integer&gt; plan) {\n        if (left == 0) return true;\n        if (i == notes.length) return false;\n        Note n = notes[i];\n        int most = (int) Math.min(left / n.value, stock.getOrDefault(n, 0));\n        for (int take = most; take &gt;= 0; take--) {                   // greedy first, then back off\n            if (take &gt; 0) plan.put(n, take); else plan.remove(n);\n            if (pick(notes, i + 1, stock, left - (long) take * n.value, plan)) return true;\n        }\n        plan.remove(n);\n        return false;\n    }\n}\n\n/** The hardware that physically pushes notes into the slot. An interface so a test can jam it. */\ninterface NoteFeeder { void feed(EnumMap&lt;Note, Integer&gt; notes); }\n\n/** The working feeder: it always succeeds. */\nclass WorkingFeeder implements NoteFeeder { public void feed(EnumMap&lt;Note, Integer&gt; notes) { } }\n\n/**\n * The cassettes and the note pusher. It owns the note counts and its own lock, because reserving notes\n * (choose a combination AND subtract it) has to be one step or a refill thread could invalidate the plan\n * between the two halves. Nothing slow ever happens inside this lock.\n */\nclass CashDispenser {\n    private final EnumMap&lt;Note, Integer&gt; stock = new EnumMap&lt;&gt;(Note.class);\n    private final ReentrantLock lock = new ReentrantLock();\n    private final NoteFeeder feeder;\n    private NoteSelection selection = new FewestNotes();\n    private int retracted;                                            // notes that jammed and went to the bin\n\n    CashDispenser(NoteFeeder feeder) { this.feeder = feeder; for (Note n : Note.values()) stock.put(n, 0); }\n    /** The picking rule, handed in. The dispenser never builds one. */\n    void setSelection(NoteSelection s) { selection = s; }\n    /** Load notes into a cassette. Takes the lock: a refill may happen while a customer is at the machine. */\n    void refill(Note n, int howMany) { lock.lock(); try { stock.merge(n, howMany, Integer::sum); } finally { lock.unlock(); } }\n    /** How many of this note are in the cassette. */\n    int count(Note n) { lock.lock(); try { return stock.get(n); } finally { lock.unlock(); } }\n    /** All the money still inside the cassettes. */\n    long cash() { lock.lock(); try { long t = 0; for (Note n : Note.values()) t += (long) stock.get(n) * n.value; return t; } finally { lock.unlock(); } }\n    /** How many notes ended up in the retract bin after a jam. */\n    int retracted() { lock.lock(); try { return retracted; } finally { lock.unlock(); } }\n\n    /**\n     * Choose the notes for this amount AND take them out of the cassettes, as one step. Returns null when\n     * no combination of the notes in stock makes exactly this amount -- and that answer arrives BEFORE the\n     * bank is asked, which is the whole point of reserving.\n     */\n    EnumMap&lt;Note, Integer&gt; reserve(long amount) {\n        lock.lock();\n        try {\n            EnumMap&lt;Note, Integer&gt; plan = selection.select(stock, amount);\n            if (plan == null) return null;\n            for (Map.Entry&lt;Note, Integer&gt; e : plan.entrySet()) stock.merge(e.getKey(), -e.getValue(), Integer::sum);\n            return plan;\n        } finally { lock.unlock(); }\n    }\n\n    /** Put a reservation back, note for note. Used when the bank says no after the notes were reserved. */\n    void release(EnumMap&lt;Note, Integer&gt; plan) {\n        lock.lock();\n        try { for (Map.Entry&lt;Note, Integer&gt; e : plan.entrySet()) stock.merge(e.getKey(), e.getValue(), Integer::sum); }\n        finally { lock.unlock(); }\n    }\n\n    /**\n     * Hand the reserved notes to the customer. If the hardware jams the notes are NOT put back in the\n     * cassette -- they are physically stuck, so they are counted into the retract bin and the cash in the\n     * machine still adds up.\n     */\n    void push(EnumMap&lt;Note, Integer&gt; plan) {\n        try {\n            feeder.feed(plan);\n        } catch (RuntimeException e) {\n            lock.lock();\n            try { for (int c : plan.values()) retracted += c; } finally { lock.unlock(); }\n            throw new HardwareFault(e.getMessage());\n        }\n    }\n}\n\n/**\n * A rule about the amount itself, checked before anything is touched. One method, handed in, so &quot;minimum\n * 100&quot;, &quot;multiples of 100&quot; and &quot;no more than 25,000 a go&quot; are configuration and not an edit.\n */\ninterface WithdrawalPolicy {\n    /** null means allowed; any other string is the reason the customer is shown. */\n    String refuse(String accountId, long amount, long nowMs);\n}\n\n/** The everyday rule: a minimum, a per-transaction ceiling, and a multiple of the smallest note. */\nclass AmountRules implements WithdrawalPolicy {\n    private final long min, max, step;\n    AmountRules(long min, long max, long step) { this.min = min; this.max = max; this.step = step; }\n    public String refuse(String accountId, long amount, long nowMs) {\n        if (amount &lt; min)      return &quot;the minimum is &quot; + min;\n        if (amount &gt; max)      return &quot;the most in one go is &quot; + max;\n        if (amount % step != 0) return &quot;amounts must be a multiple of &quot; + step;\n        return null;\n    }\n}\n\n/**\n * One machine. It owns the session, the journal and one lock; it is handed the bank, the dispenser, the\n * clock and the rules, and it builds none of them. Every public method takes the lock, checks the session\n * is in a state where the action is legal, and tells the listeners only after the lock is released.\n */\nclass ATM {\n    private static final AtomicInteger SEQ = new AtomicInteger();\n    final String id;\n    private final BankService bank;\n    private final CashDispenser dispenser;\n    private final ReentrantLock lock = new ReentrantLock();\n    private final List&lt;AtmObserver&gt; observers = new CopyOnWriteArrayList&lt;&gt;();\n    private final List&lt;Withdrawal&gt; journal = new ArrayList&lt;&gt;();                 // read and written under the lock\n    private Clock clock = System::currentTimeMillis;\n    private WithdrawalPolicy policy = new AmountRules(100, 25_000, 100);\n    private Session session;\n\n    ATM(String id, BankService bank, CashDispenser dispenser) {\n        this.id = id; this.bank = bank; this.dispenser = dispenser;\n        this.session = new Session(id + &quot;-0&quot;, null, 0, SessionState.IDLE);\n    }\n    /** Hand in the rules. The machine never constructs a rule of its own. */\n    void configure(WithdrawalPolicy policy, NoteSelection selection) {\n        this.policy = policy; dispenser.setSelection(selection);\n    }\n    /** Hand in time, so a test can decide what &quot;today&quot; is. */\n    void setClock(Clock c) { this.clock = c; }\n    /** Add a listener. It is called after the lock is released and its exceptions are swallowed. */\n    void addObserver(AtmObserver o) { observers.add(o); }\n    /** Where the visit has got to. */\n    SessionState state() { lock.lock(); try { return session.state; } finally { lock.unlock(); } }\n    /** Every withdrawal attempt this machine has made, oldest first. Never pruned. */\n    List&lt;Withdrawal&gt; journal() { lock.lock(); try { return List.copyOf(journal); } finally { lock.unlock(); } }\n    /** The rows whose outcome nobody knows. An operator reconciles these. A scan of every row, asked rarely. */\n    List&lt;Withdrawal&gt; unresolved() {\n        lock.lock();\n        try {\n            List&lt;Withdrawal&gt; out = new ArrayList&lt;&gt;();\n            for (Withdrawal w : journal) if (w.state == TxnState.UNKNOWN) out.add(w);\n            return out;\n        } finally { lock.unlock(); }\n    }\n\n    /** Take a card and start a visit. Legal only when the machine is idle. */\n    void insertCard(Card card) {\n        lock.lock();\n        try {\n            require(SessionState.IDLE);\n            session = new Session(id + &quot;-&quot; + SEQ.incrementAndGet(), card, clock.nowMs(), SessionState.IDLE);\n            to(SessionState.CARD_INSERTED);\n        } finally { lock.unlock(); }\n        publish(new AtmEvent(id, &quot;CARD_IN&quot;, card.accountId, 0, clock.nowMs(), null));\n    }\n\n    /**\n     * Try a PIN. The bank counts the wrong ones per card; when it answers BLOCKED the machine keeps the card:\n     * the session ends and the state goes back to IDLE with nothing in the slot to hand back.\n     */\n    void enterPin(String pin) {\n        PinCheck r;\n        lock.lock();\n        try {\n            require(SessionState.CARD_INSERTED);\n            r = bank.authenticate(session.card.number, pin);\n            if (r == PinCheck.OK) to(SessionState.AUTHENTICATED);\n            if (r == PinCheck.BLOCKED) {\n                to(SessionState.EJECTED);                 // the card goes into the capture bin, not the slot\n                to(SessionState.IDLE);\n            }\n        } finally { lock.unlock(); }\n        if (r == PinCheck.BLOCKED) {\n            publish(new AtmEvent(id, &quot;CARD_RETAINED&quot;, &quot;&quot;, 0, clock.nowMs(), null));\n            throw new CardRetained(&quot;too many wrong PINs on this card: the card has been retained&quot;);\n        }\n        if (r == PinCheck.WRONG) throw new IllegalArgumentException(&quot;wrong PIN, try again&quot;);\n    }\n\n    /** The balance on the card&#x27;s account. Legal only once the PIN was right. */\n    long balance() {\n        lock.lock();\n        try { require(SessionState.AUTHENTICATED); return bank.balance(session.card.accountId); }\n        finally { lock.unlock(); }\n    }\n\n    /**\n     * Pay cash in. The amount is what the note reader COUNTED, never a number the customer typed: a machine\n     * that credits a typed amount pays out for an empty tray. The notes drop into the deposit bin; the money\n     * side is one credit at the bank, under this deposit&#x27;s own key. Returns the amount credited.\n     */\n    long deposit(EnumMap&lt;Note, Integer&gt; counted) {\n        long amount = 0;\n        for (Map.Entry&lt;Note, Integer&gt; e : counted.entrySet()) {\n            if (e.getValue() &lt; 0) throw new IllegalArgumentException(&quot;a note count cannot be negative&quot;);\n            amount += (long) e.getKey().value * e.getValue();\n        }\n        if (amount == 0) throw new IllegalArgumentException(&quot;nothing was counted, so nothing is credited&quot;);\n        String account;\n        lock.lock();\n        try {\n            require(SessionState.AUTHENTICATED);\n            account = session.card.accountId;\n            bank.credit(account, amount, id + &quot;-dep-&quot; + SEQ.incrementAndGet());\n        } finally { lock.unlock(); }\n        publish(new AtmEvent(id, &quot;DEPOSIT&quot;, account, amount, clock.nowMs(), null));\n        return amount;\n    }\n\n    /**\n     * Take cash out. The order is the design: write the row and check the rule, RESERVE the notes, ask the\n     * bank to debit with an idempotency key, and only then push the notes. A refusal at either of the first\n     * two steps has moved no money at all; a jam after the debit is reversed (one credit, under a second key);\n     * a bank that never answers dispenses nothing and leaves an UNKNOWN row for the reconciler.\n     */\n    Withdrawal withdraw(long amount) {\n        Withdrawal w;\n        lock.lock();\n        try { w = doWithdraw(amount); } finally { lock.unlock(); }\n        publish(new AtmEvent(id, &quot;WITHDRAW&quot;, w.accountId, amount, clock.nowMs(), w));   // after the unlock\n        if (w.state != TxnState.DISPENSED) throw new WithdrawalFailed(w);\n        return w;\n    }\n\n    /** The withdrawal itself, always called with the lock held. It never throws for a business outcome. */\n    private Withdrawal doWithdraw(long amount) {\n        require(SessionState.AUTHENTICATED);\n        Withdrawal w = new Withdrawal(SEQ.incrementAndGet(), id, session.card.accountId, amount, clock.nowMs());\n        journal.add(w);                                             // written BEFORE the bank is asked\n\n        String no = policy.refuse(w.accountId, amount, clock.nowMs());\n        if (no != null) return w.refuse(no);                        // nothing has been touched\n\n        to(SessionState.TRANSACTION);\n        EnumMap&lt;Note, Integer&gt; plan = dispenser.reserve(amount);    // reserve BEFORE the debit\n        if (plan == null) { to(SessionState.AUTHENTICATED); return w.refuse(&quot;the cassettes cannot make &quot; + amount); }\n        w.notes = plan;\n\n        BankReply reply;\n        try { reply = bank.debit(w.accountId, amount, w.key); }    // the irreversible step\n        catch (RuntimeException e) { reply = BankReply.TIMEOUT; }  // a call that throws is not a &quot;no&quot; either\n        if (reply == BankReply.DECLINED) {\n            dispenser.release(plan);                                // every note goes back\n            to(SessionState.AUTHENTICATED);\n            return w.refuse(&quot;the bank declined&quot;);\n        }\n        if (reply == BankReply.TIMEOUT) {\n            dispenser.release(plan);                                // hand out nothing while nobody knows\n            to(SessionState.AUTHENTICATED);\n            w.state = TxnState.UNKNOWN;\n            w.note = &quot;the bank did not answer; this row is for reconciliation&quot;;\n            return w;\n        }\n\n        w.state = TxnState.DEBITED;                                 // the money has left the account\n        to(SessionState.DISPENSING);\n        try {\n            dispenser.push(plan);\n            w.state = TxnState.DISPENSED;\n        } catch (HardwareFault f) {\n            try {\n                bank.reverse(w.accountId, amount, w.key);           // give it back: one credit, under key + &quot;-rev&quot;\n                w.state = TxnState.REVERSED;\n                w.note = &quot;dispenser jammed (&quot; + f.getMessage() + &quot;); the account was credited back&quot;;\n            } catch (RuntimeException e) {                          // the give-back did not get through either\n                w.state = TxnState.UNKNOWN;\n                w.note = &quot;dispenser jammed and the credit-back was not confirmed; the reconciler will reverse it&quot;;\n            }\n        }\n        to(SessionState.AUTHENTICATED);\n        return w;\n    }\n\n    /** Give the card back and end the visit. */\n    void ejectCard() {\n        String account;\n        lock.lock();\n        try {\n            if (session.state == SessionState.IDLE) return;\n            account = session.card == null ? &quot;&quot; : session.card.accountId;\n            to(SessionState.EJECTED);\n            to(SessionState.IDLE);\n        } finally { lock.unlock(); }\n        publish(new AtmEvent(id, &quot;CARD_OUT&quot;, account, 0, clock.nowMs(), null));\n    }\n\n    /** Refuse an action that this state does not allow, naming the state it happened in. */\n    private void require(SessionState wanted) {\n        if (session.state != wanted)\n            throw new IllegalStateException(&quot;illegal here: the machine is &quot; + session.state + &quot;, not &quot; + wanted);\n    }\n    /** Move the session on, but only along an edge the table allows. */\n    private void to(SessionState next) {\n        if (!Transitions.ALLOWED.get(session.state).contains(next))\n            throw new IllegalStateException(&quot;illegal move &quot; + session.state + &quot; -&gt; &quot; + next);\n        session.state = next;\n    }\n    /** Tell the listeners. Always outside the lock, and a listener that throws is its own problem. */\n    private void publish(AtmEvent e) {\n        for (AtmObserver o : observers) {\n            try { o.onEvent(e); } catch (RuntimeException ignored) { }\n        }\n    }\n}\n\n/**\n * Proof it works: a happy withdrawal and a deposit, the wrong-PIN lockout that survives taking the card out,\n * a lopsided drawer that greed alone could not pay, and forty machines racing for one account&#x27;s last rupees\n * with exactly the right number of winners and a balance that never goes below zero.\n */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        InMemoryBank bank = new InMemoryBank();\n        bank.open(&quot;ACC-1&quot;, 10_000);\n        bank.issueCard(&quot;4111-1111&quot;, &quot;1234&quot;);\n        bank.issueCard(&quot;4111-2222&quot;, &quot;1234&quot;);                 // a second card, for the wrong-PIN demo\n\n        CashDispenser cash = new CashDispenser(new WorkingFeeder());\n        cash.refill(Note.N2000, 2); cash.refill(Note.N500, 4); cash.refill(Note.N200, 3); cash.refill(Note.N100, 5);\n        ATM atm = new ATM(&quot;ATM-01&quot;, bank, cash);\n        atm.configure(new AmountRules(100, 25_000, 100), new FewestNotes());\n        AuditLog audit = new AuditLog();\n        atm.addObserver(new ReceiptPrinter());\n        atm.addObserver(audit);\n\n        Card card = new Card(&quot;4111-1111&quot;, &quot;ACC-1&quot;);\n        atm.insertCard(card);\n        atm.enterPin(&quot;1234&quot;);\n        System.out.println(&quot;balance: &quot; + atm.balance());\n        Withdrawal w = atm.withdraw(2700);\n        System.out.println(&quot;dispensed &quot; + w.notes + &quot; = &quot; + w.noteCount() + &quot; notes; balance now &quot; + atm.balance());\n        try { atm.withdraw(2750); } catch (WithdrawalFailed f) { System.out.println(&quot;expected: &quot; + f.getMessage()); }\n        long in = atm.deposit(new EnumMap&lt;&gt;(Map.of(Note.N500, 2, Note.N100, 3)));\n        System.out.println(&quot;deposited &quot; + in + &quot;, counted by the note reader; balance now &quot; + atm.balance());\n        atm.ejectCard();\n\n        // wrong PINs are counted on the CARD: taking it out after two does not buy fresh tries\n        Card other = new Card(&quot;4111-2222&quot;, &quot;ACC-1&quot;);\n        atm.insertCard(other);\n        for (int i = 1; i &lt;= 2; i++) {\n            try { atm.enterPin(&quot;0000&quot;); } catch (IllegalArgumentException e) { System.out.println(&quot;try &quot; + i + &quot;: &quot; + e.getMessage()); }\n        }\n        atm.ejectCard();                                     // out, and straight back in\n        atm.insertCard(other);\n        try { atm.enterPin(&quot;0000&quot;); }\n        catch (CardRetained e) { System.out.println(&quot;try 3, after putting the card back: &quot; + e.getMessage()); }\n        System.out.println(&quot;machine is &quot; + atm.state() + &quot; with the card in the capture bin&quot;);\n\n        // a lopsided drawer: 600 from {500 x 1, 200 x 3} -- greed alone dead-ends on the 500\n        CashDispenser odd = new CashDispenser(new WorkingFeeder());\n        odd.refill(Note.N500, 1); odd.refill(Note.N200, 3);\n        ATM atm2 = new ATM(&quot;ATM-02&quot;, bank, odd);\n        bank.open(&quot;ACC-2&quot;, 5_000);\n        atm2.insertCard(new Card(&quot;4111-1111&quot;, &quot;ACC-2&quot;));\n        atm2.enterPin(&quot;1234&quot;);\n        System.out.println(&quot;600 from a lopsided drawer: &quot; + atm2.withdraw(600).notes);\n        atm2.ejectCard();\n\n        // the race: forty machines, one account with 10,000 left, everyone asking for 500\n        bank.open(&quot;ACC-RACE&quot;, 10_000);\n        int machines = 40;\n        List&lt;ATM&gt; fleet = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; machines; i++) {\n            CashDispenser d = new CashDispenser(new WorkingFeeder());\n            d.refill(Note.N500, 2);\n            ATM a = new ATM(&quot;ATM-R&quot; + i, bank, d);\n            fleet.add(a);\n        }\n        ExecutorService pool = Executors.newFixedThreadPool(machines);   // all forty really at once\n        CountDownLatch go = new CountDownLatch(1);\n        AtomicInteger paid = new AtomicInteger(), refused = new AtomicInteger();\n        AtomicLong handedOut = new AtomicLong();\n        for (ATM a : fleet) {\n            pool.submit(() -&gt; {\n                a.insertCard(new Card(&quot;4111-1111&quot;, &quot;ACC-RACE&quot;));\n                a.enterPin(&quot;1234&quot;);\n                go.await();\n                try { Withdrawal x = a.withdraw(500); paid.incrementAndGet(); handedOut.addAndGet(x.amount); }\n                catch (WithdrawalFailed f) { refused.incrementAndGet(); }\n                a.ejectCard();\n                return null;\n            });\n        }\n        go.countDown();\n        pool.shutdown();\n        pool.awaitTermination(10, TimeUnit.SECONDS);\n        System.out.println(&quot;race: &quot; + paid.get() + &quot; paid, &quot; + refused.get() + &quot; refused, &quot;\n            + handedOut.get() + &quot; handed out, balance &quot; + bank.balance(&quot;ACC-RACE&quot;));\n        if (paid.get() != 20 || bank.balance(&quot;ACC-RACE&quot;) != 0)\n            throw new AssertionError(&quot;the bank is not the single writer!&quot;);\n\n        // the same race with no machine around it, so the compare-and-set is the only thing in the way\n        bank.open(&quot;ACC-CAS&quot;, 10_000);\n        ExecutorService raw = Executors.newFixedThreadPool(32);\n        AtomicInteger won = new AtomicInteger();\n        for (int i = 0; i &lt; 200; i++) {\n            final int n = i;\n            raw.submit(() -&gt; { if (bank.debit(&quot;ACC-CAS&quot;, 100, &quot;cas-&quot; + n) == BankReply.OK) won.incrementAndGet(); });\n        }\n        raw.shutdown();\n        raw.awaitTermination(10, TimeUnit.SECONDS);\n        System.out.println(&quot;bank alone: &quot; + won.get() + &quot; of 200 debits of 100 got through, balance &quot;\n            + bank.balance(&quot;ACC-CAS&quot;) + &quot;, debits that lost the race and read again: &quot; + bank.casRetries.get());\n        System.out.println(&quot;audit rows: &quot; + audit.events.size() + &quot;, withdrawals seen: &quot; + audit.count(&quot;WITHDRAW&quot;));\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.time.*;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n// ---- ext: a bank you can break on purpose, because nobody can make a real one time out to order\n/**\n * Wraps a real bank and lets a test script the next answers. A forced DECLINED or TIMEOUT never reaches\n * the real bank at all, so the balance is untouched. The two nastier failures are separate: a debit that\n * LANDS but whose answer is lost, and a link that throws instead of answering.\n */\nclass FlakyBank implements BankService {\n    private final BankService base;\n    private final Deque&lt;BankReply&gt; scripted = new ArrayDeque&lt;&gt;();   // forced answers, oldest first\n    private long delayMs;                                           // how long the link takes to answer\n    private int lostAnswers;                                        // debits that land, but the answer is lost\n    private int linkDown;                                           // calls that throw before reaching the bank\n    final AtomicInteger debits = new AtomicInteger(), credits = new AtomicInteger();\n    FlakyBank(BankService base) { this.base = base; }\n    /** Force the next debit to answer this, without reaching the bank. */\n    FlakyBank next(BankReply r) { scripted.add(r); return this; }\n    /** The next debit reaches the bank and lands, but the machine hears TIMEOUT: the dangerous timeout. */\n    FlakyBank landsButTimesOut() { lostAnswers++; return this; }\n    /** The next few calls that move money throw, the way a dead network link does. */\n    FlakyBank linkDownFor(int calls) { linkDown = calls; return this; }\n    /** Make every debit take this long, so a test can have a bank call genuinely in flight. */\n    FlakyBank slowBy(long ms) { delayMs = ms; return this; }\n    public PinCheck authenticate(String cardNumber, String pin) { return base.authenticate(cardNumber, pin); }\n    public long balance(String accountId) { return base.balance(accountId); }\n    public void credit(String accountId, long amount, String key) { link(); credits.incrementAndGet(); base.credit(accountId, amount, key); }\n    public boolean reverse(String accountId, long amount, String key) { link(); return base.reverse(accountId, amount, key); }\n    public BankReply debit(String accountId, long amount, String key) {\n        debits.incrementAndGet();\n        link();\n        if (delayMs &gt; 0) try { Thread.sleep(delayMs); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n        BankReply forced = scripted.poll();\n        if (forced != null &amp;&amp; forced != BankReply.OK) return forced;      // no money moves\n        BankReply r = base.debit(accountId, amount, key);\n        if (lostAnswers &gt; 0) { lostAnswers--; return BankReply.TIMEOUT; } // it landed; the machine never hears\n        return r;\n    }\n    /** Throw if the link is down for this call. */\n    private void link() { if (linkDown &gt; 0) { linkDown--; throw new RuntimeException(&quot;the link to the bank is down&quot;); } }\n}\n\n// ---- ext: a dispenser that jams, so the reversal path can be tested\n/** Jams the first few pushes. The ATM turns a jam into a reversal, not a lost customer. */\nclass JammingFeeder implements NoteFeeder {\n    private int jamsLeft;\n    JammingFeeder(int jams) { this.jamsLeft = jams; }\n    public void feed(EnumMap&lt;Note, Integer&gt; notes) {\n        if (jamsLeft-- &gt; 0) throw new RuntimeException(&quot;note path blocked&quot;);\n    }\n}\n\n// ---- ext: &quot;cap withdrawals at 20,000 a day&quot; -- a new class that wraps the bank, nothing else moves\n/**\n * A daily ceiling, counted where the money actually moves. It wraps a BankService, so the ATM, the states\n * and the dispenser are untouched: an over-cap debit returns DECLINED, which is a path the machine already\n * handles by putting every note back. &quot;A day&quot; is the bank&#x27;s LOCAL day: midnight in Mumbai, not in London.\n * The counter only moves for a key it has not counted before, and money that is reversed is given back to\n * the day, so neither a retry nor a jam eats the customer&#x27;s limit.\n */\nclass DailyCap implements BankService {\n    private final BankService base;\n    private final long cap;\n    private final Clock clock;\n    private final ZoneId zone;                                                 // where &quot;today&quot; is decided\n    private final Map&lt;String, long[]&gt; spent = new ConcurrentHashMap&lt;&gt;();       // account -&gt; {day, total today}; also its lock\n    private final Set&lt;String&gt; counted = ConcurrentHashMap.newKeySet();         // keys already counted against a day\n    DailyCap(BankService base, long cap, Clock clock, ZoneId zone) {\n        this.base = base; this.cap = cap; this.clock = clock; this.zone = zone;\n    }\n    public PinCheck authenticate(String cardNumber, String pin) { return base.authenticate(cardNumber, pin); }\n    public long balance(String accountId) { return base.balance(accountId); }\n    public void credit(String accountId, long amount, String key) { base.credit(accountId, amount, key); }\n    /** Today&#x27;s date in the bank&#x27;s time zone, as a number: a new number means a fresh limit. */\n    private long today() { return Instant.ofEpochMilli(clock.nowMs()).atZone(zone).toLocalDate().toEpochDay(); }\n    /**\n     * Checking the cap and taking the money happen under the ACCOUNT&#x27;s own lock, so two machines cannot both\n     * squeeze past the limit, and other accounts never wait. The first line inside is the one that is easy to\n     * get wrong: a key this decorator has already counted is a RETRY of a withdrawal that already happened,\n     * not a new one, so it goes straight through to the bank, which answers with what it did the first time.\n     * Without that line the retry would be measured against the cap a second time and come back DECLINED --\n     * and the machine would be told &quot;no&quot; about money that had actually left the account.\n     */\n    public BankReply debit(String accountId, long amount, String key) {\n        long[] s = spent.computeIfAbsent(accountId, a -&gt; new long[] { today(), 0 });\n        synchronized (s) {\n            if (counted.contains(key)) return base.debit(accountId, amount, key);  // a retry: the bank has the answer\n            long day = today();\n            if (s[0] != day) { s[0] = day; s[1] = 0; }                             // a new local day, a fresh limit\n            if (s[1] + amount &gt; cap) return BankReply.DECLINED;\n            BankReply r = base.debit(accountId, amount, key);\n            if (r == BankReply.OK &amp;&amp; counted.add(key)) s[1] += amount;\n            return r;\n        }\n    }\n    /** A reversal: money that went back no longer counts against today&#x27;s limit. */\n    public boolean reverse(String accountId, long amount, String key) {\n        boolean back = base.reverse(accountId, amount, key);\n        long[] s = spent.get(accountId);\n        if (back &amp;&amp; s != null) synchronized (s) { if (counted.remove(key) &amp;&amp; s[0] == today()) s[1] -= amount; }\n        return back;\n    }\n}\n\n// ---- ext: a second note rule proves the interface: keep the big notes for the big withdrawals\n/**\n * Fewest notes, except that the 2000s are held back below a threshold so a morning of 500s does not empty\n * the one cassette that makes large amounts possible. If the small notes cannot make the amount it falls\n * back to the plain rule rather than refusing cash the machine is holding.\n */\nclass RationBigNotes implements NoteSelection {\n    private final NoteSelection base = new FewestNotes();\n    private final long threshold;\n    RationBigNotes(long threshold) { this.threshold = threshold; }\n    public EnumMap&lt;Note, Integer&gt; select(EnumMap&lt;Note, Integer&gt; stock, long amount) {\n        if (amount &gt;= threshold) return base.select(stock, amount);\n        EnumMap&lt;Note, Integer&gt; withoutBig = new EnumMap&lt;&gt;(stock);\n        withoutBig.put(Note.N2000, 0);\n        EnumMap&lt;Note, Integer&gt; plan = base.select(withoutBig, amount);\n        return plan != null ? plan : base.select(stock, amount);\n    }\n}\n\n// ---- ext: LeetCode 2241&#x27;s rule -- largest notes first, and never step back\n/**\n * The rule LeetCode 2241 (&quot;Design an ATM Machine&quot;) specifies: take as many of each note as fit, largest\n * first, and if that does not come out exact, refuse. So 600 from {500 x 1, 200 x 3} is REFUSED there,\n * although 200 x 3 would pay it. If the prompt says this, it is the spec: one more NoteSelection.\n */\nclass GreedyOnly implements NoteSelection {\n    public EnumMap&lt;Note, Integer&gt; select(EnumMap&lt;Note, Integer&gt; stock, long amount) {\n        EnumMap&lt;Note, Integer&gt; plan = new EnumMap&lt;&gt;(Note.class);\n        long left = amount;\n        for (Note n : Note.values()) {                                // largest first: the enum&#x27;s order\n            int take = (int) Math.min(left / n.value, stock.getOrDefault(n, 0));\n            if (take &gt; 0) { plan.put(n, take); left -= (long) take * n.value; }\n        }\n        return left == 0 ? plan : null;                               // no stepping back: exact or refused\n    }\n}\n\n// ---- ext: reconciling the rows the bank never answered\n/**\n * What an operator (or a start-up task) does with an UNKNOWN row: it sends a REVERSAL for the row&#x27;s key.\n * If the debit landed, the bank gives the money back once; if it never landed, the bank marks the key dead,\n * so the lost request cannot land if it turns up late. It never &quot;asks&quot; by debiting again: if the first\n * debit never landed, that question would take the money now.\n */\nclass Reconciler {\n    private final BankService bank;\n    Reconciler(BankService bank) { this.bank = bank; }\n    /** Settle every UNKNOWN row it is given; any other row is left alone. Returns how many were settled. */\n    int settle(List&lt;Withdrawal&gt; rows) {\n        int done = 0;\n        for (Withdrawal w : rows) {\n            if (w.state != TxnState.UNKNOWN) continue;                         // never reverse a row that paid out\n            try {\n                if (bank.reverse(w.accountId, w.amount, w.key)) {\n                    w.state = TxnState.REVERSED;\n                    w.note = &quot;reconciled: the debit had landed and nothing was dispensed, so it was reversed&quot;;\n                } else {\n                    w.state = TxnState.REFUSED;\n                    w.note = &quot;reconciled: the debit never landed, and now it never can&quot;;\n                }\n                done++;\n            } catch (RuntimeException linkStillDown) { }                      // stays UNKNOWN: try again next run\n        }\n        return done;\n    }\n}\n\n// ---- ext: the same life cycle written as state objects instead of a table\n/**\n * The alternative to the ALLOWED table: one class per situation. Every action defaults to throwing, so a\n * concrete state only writes the moves it actually allows and every other move is rejected by construction.\n * Same guarantee, more classes; the table is smaller, this reads better once a state carries real work.\n */\ninterface AtmState {\n    default AtmState insertCard(StateMachine m, Card c) { return illegal(&quot;insertCard&quot;); }\n    default AtmState enterPin(StateMachine m, String pin) { return illegal(&quot;enterPin&quot;); }\n    default AtmState withdraw(StateMachine m, long amount) { return illegal(&quot;withdraw&quot;); }\n    default AtmState ejectCard(StateMachine m) { return illegal(&quot;ejectCard&quot;); }\n    /** The default for every move a state does not allow: refuse, and name the state it happened in. */\n    private AtmState illegal(String action) {\n        throw new IllegalStateException(action + &quot; is illegal in &quot

h a sharper lookup; blocks are what real grid engines use, because a block id is one shift.\n */\nfinal class BlockRangeIndex {\n    /** The side of one block, in cells. Bigger blocks mean fewer entries and longer scans. */\n    static final int BLOCK = 64;\n    /** One range, and the formula that reads it. */\n    record RangeEdge(Rect area, CellRef formula) { }\n    private final Map&lt;Long, List&lt;RangeEdge&gt;&gt; byBlock = new HashMap&lt;&gt;();\n    private int entries;\n\n    /** File that this formula reads every cell of that rectangle. */\n    void add(CellRef formula, Rect r) {\n        for (int br = r.r1() / BLOCK; br &lt;= r.r2() / BLOCK; br++)\n            for (int bc = r.c1() / BLOCK; bc &lt;= r.c2() / BLOCK; bc++) {\n                byBlock.computeIfAbsent(key(br, bc), k -&gt; new ArrayList&lt;&gt;()).add(new RangeEdge(r, formula));\n                entries++;\n            }\n    }\n    /** Which formulas read this cell through a range: one map lookup, then a test per range in that block. */\n    Set&lt;CellRef&gt; readersOf(CellRef c) {\n        Set&lt;CellRef&gt; out = new LinkedHashSet&lt;&gt;();\n        for (RangeEdge e : byBlock.getOrDefault(key(c.row() / BLOCK, c.col() / BLOCK), List.of()))\n            if (e.area().covers(c)) out.add(e.formula());\n        return out;\n    }\n    /** How many entries the index holds: the number to compare with one edge per cell. */\n    int entries() { return entries; }\n    private static long key(int br, int bc) { return ((long) br &lt;&lt; 32) ^ (bc &amp; 0xffffffffL); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>8 &middot; I copy =A1+B1 down the column. What does the copy say, and what is $A$1 for?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A copy is the same tree with every reference moved by the distance the formula moved: <code>=A1+B1</code> pasted one row down is <code>=A2+B2</code>, and filling a column is that copy done n times. The dollars are the opt-out. An anchored row or column does not move, which is how a whole column of formulas can point at one tax-rate cell. They are two booleans on the reference node; the parser reads them and the printer puts them back, so a round trip through the tree keeps them. Note what they do <i>not</i> do: an anchored reference still moves when a row is inserted above it, because that box really did move. A copy and a structural edit are different questions, and they are different methods in the code.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: copy a formula -- relative references move with it, $-anchored ones do not, and the tree makes that one line\n/**\n * The formula as text again. Needed the moment anything rewrites a formula -- a copy, an inserted row --\n * because the sheet stores what the user typed and the formula bar has to show the new version.\n * A round trip preserves meaning, not keystrokes: &quot;=-A1&quot; comes back as &quot;=0-A1&quot;, and only the brackets the\n * precedence actually needs are printed.\n */\nfinal class Formula {\n    /** The tree as a formula the parser would read back, leading &quot;=&quot; included. */\n    static String text(Expr e) { return &quot;=&quot; + write(e); }\n\n    /** One address, with its anchors put back: A1, $A1, A$1, $A$1. */\n    static String a1(Ref r) {\n        String s = r.ref().a1();\n        int k = 0;\n        while (k &lt; s.length() &amp;&amp; Character.isLetter(s.charAt(k))) k++;\n        return (r.absCol() ? &quot;$&quot; : &quot;&quot;) + s.substring(0, k) + (r.absRow() ? &quot;$&quot; : &quot;&quot;) + s.substring(k);\n    }\n\n    /**\n     * The same tree, as it would read pasted dRow down and dCol right: an unanchored part moves by the\n     * distance the formula moved, an anchored one does not, and a reference pushed off the grid is #REF!.\n     */\n    static Expr copyShift(Expr e, int dRow, int dCol) {\n        if (e instanceof Ref r) {\n            int row = r.absRow() ? r.ref().row() : r.ref().row() + dRow;\n            int col = r.absCol() ? r.ref().col() : r.ref().col() + dCol;\n            if (row &lt; 0 || col &lt; 0) return new Lit(new Err(&quot;#REF!&quot;));       // dragged off the top or the left edge\n            return new Ref(new CellRef(row, col), r.absRow(), r.absCol());\n        }\n        if (e instanceof RangeRef rr) {\n            Expr a = copyShift(rr.from(), dRow, dCol), b = copyShift(rr.to(), dRow, dCol);\n            if (!(a instanceof Ref x) || !(b instanceof Ref y)) return new Lit(new Err(&quot;#REF!&quot;));\n            return new RangeRef(x, y);\n        }\n        if (e instanceof Bin b) return new Bin(b.op(), copyShift(b.left(), dRow, dCol), copyShift(b.right(), dRow, dCol));\n        if (e instanceof Call c) {\n            List&lt;Expr&gt; args = new ArrayList&lt;&gt;();\n            for (Expr a : c.args()) args.add(copyShift(a, dRow, dCol));\n            return new Call(c.name(), args);\n        }\n        return e;                                                           // a literal copies unchanged\n    }\n\n    private static String write(Expr e) {\n        if (e instanceof Lit l) return l.value() instanceof Text t ? &quot;\\&quot;&quot; + t.s() + &quot;\\&quot;&quot; : l.value().display();\n        if (e instanceof Ref r) return a1(r);\n        if (e instanceof RangeRef rr) return a1(rr.from()) + &quot;:&quot; + a1(rr.to());\n        if (e instanceof Bin b) return side(b.left(), prec(b.op()), false) + b.op() + side(b.right(), prec(b.op()), true);\n        if (e instanceof Call c) {\n            StringBuilder sb = new StringBuilder(c.name()).append(&quot;(&quot;);\n            for (int k = 0; k &lt; c.args().size(); k++) sb.append(k == 0 ? &quot;&quot; : &quot;,&quot;).append(write(c.args().get(k)));\n            return sb.append(&quot;)&quot;).toString();\n        }\n        return &quot;&quot;;\n    }\n    private static int prec(String op) { return switch (op) { case &quot;*&quot;, &quot;/&quot; -&gt; 3; case &quot;+&quot;, &quot;-&quot;, &quot;&amp;&quot; -&gt; 2; default -&gt; 1; }; }\n    /** Brackets only where dropping them would change the meaning: a weaker operator under a stronger one. */\n    private static String side(Expr e, int parent, boolean right) {\n        String s = write(e);\n        boolean needs = e instanceof Bin b &amp;&amp; (prec(b.op()) &lt; parent || (right &amp;&amp; prec(b.op()) == parent));\n        return needs ? &quot;(&quot; + s + &quot;)&quot; : s;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; Insert a row above row 2. What happens to =SUM(A1:A3), and to a formula that pointed into the row I deleted?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>This is the operation that is not a cell edit: the cells move and the formulas have to be rewritten in the same breath, because a total that still says <code>=SUM(A1:A3)</code> after a row was inserted is adding the wrong three boxes &mdash; quietly, which is the worst kind of wrong. The rewrite walks the tree and moves every reference in it, then prints the tree back out as the new formula text; that is the pay-off for parsing once and keeping the tree instead of the string. Two rules the interviewer is listening for. A range that merely <i>spanned</i> the deleted row shrinks rather than breaking: <code>=SUM(A1:A10)</code> with row 5 gone is <code>=SUM(A1:A9)</code>. Only a reference that pointed <i>into</i> the deleted row becomes <code>#REF!</code>, in the formula bar as well as in the box &mdash; which is why the parser can read <code>#REF!</code> back: an error is a value, so it is also something you can have in a formula. And because forty formulas move together, in a product this is one method on the sheet holding the write lock for the whole rewrite, not the loop over the public API shown here.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: insert and delete a row -- the one edit that is not a cell edit: it moves cells AND rewrites formulas\n/**\n * One structural edit: insert a blank row at `at`, or delete the row at `at`. It knows two things -- where a\n * cell ends up, and what a formula says afterwards -- and both are needed, because inserting a row above a\n * total and not rewriting the total&#x27;s formula is how a spreadsheet quietly starts printing the wrong number.\n * Rows are 0-based here, the way CellRef counts them.\n */\nrecord RowOp(int at, int delta) {\n    /** Insert a blank row, pushing that row and everything below it down. */\n    static RowOp insert(int row0) { return new RowOp(row0, +1); }\n    /** Delete a row, pulling everything below it up. */\n    static RowOp delete(int row0) { return new RowOp(row0, -1); }\n\n    /** Where this cell ends up, or null if this operation deleted it. */\n    CellRef move(CellRef c) {\n        if (delta &gt; 0) return c.row() &gt;= at ? new CellRef(c.row() + 1, c.col()) : c;\n        if (c.row() == at) return null;\n        return c.row() &gt; at ? new CellRef(c.row() - 1, c.col()) : c;\n    }\n\n    /**\n     * The same formula, said about the moved grid. A single reference into a deleted row becomes the value\n     * #REF!; a range that merely spanned the deleted row shrinks by one, which is what Excel does and what\n     * the user expects: =SUM(A1:A10) with row 5 gone is =SUM(A1:A9), not an error.\n     * The dollar anchors are deliberately ignored here: $A$5 still moves, because that box really did move.\n     */\n    Expr rewrite(Expr e) {\n        if (e instanceof Ref r) {\n            CellRef to = move(r.ref());\n            return to == null ? new Lit(new Err(&quot;#REF!&quot;)) : new Ref(to, r.absRow(), r.absCol());\n        }\n        if (e instanceof RangeRef rr) {\n            CellRef a = rr.from().ref(), b = rr.to().ref();\n            int r1 = Math.min(a.row(), b.row()), r2 = Math.max(a.row(), b.row());\n            if (delta &lt; 0 &amp;&amp; r1 == r2 &amp;&amp; r1 == at) return new Lit(new Err(&quot;#REF!&quot;));   // the range WAS that row\n            return new RangeRef(new Ref(endpoint(a, r1), rr.from().absRow(), rr.from().absCol()),\n                                new Ref(endpoint(b, r1), rr.to().absRow(), rr.to().absCol()));\n        }\n        if (e instanceof Bin b) return new Bin(b.op(), rewrite(b.left()), rewrite(b.right()));\n        if (e instanceof Call c) {\n            List&lt;Expr&gt; args = new ArrayList&lt;&gt;();\n            for (Expr a : c.args()) args.add(rewrite(a));\n            return new Call(c.name(), args);\n        }\n        return e;\n    }\n    private CellRef endpoint(CellRef c, int firstRow) {\n        if (delta &gt; 0) return c.row() &gt;= at ? new CellRef(c.row() + 1, c.col()) : c;\n        if (c.row() &gt; at) return new CellRef(c.row() - 1, c.col());\n        if (c.row() == at &amp;&amp; c.row() != firstRow) return new CellRef(c.row() - 1, c.col());\n        return c;                                                            // the top of the range stays put\n    }\n}\n\n/**\n * The toolbar operations, over the sheet&#x27;s public API and nothing else. Note what they are: many cells\n * changed at once, so in a product this is ONE method on the sheet holding the write lock for the whole\n * thing. Done from outside, as here, a reader could catch the grid halfway rewritten.\n */\nfinal class GridEditor {\n    /** Insert a blank row above the 1-based row number, the way the toolbar button does. */\n    static void insertRow(Sheet s, int row1) { apply(s, RowOp.insert(row1 - 1)); }\n    /** Delete the 1-based row. Its cells go, and anything that pointed INTO it reads #REF!. */\n    static void deleteRow(Sheet s, int row1) { apply(s, RowOp.delete(row1 - 1)); }\n\n    /** Copy one cell to another address, shifting its relative references by the distance it moved. */\n    static void copy(Sheet s, String from, String to) {\n        String raw = s.raw(from);\n        if (!raw.startsWith(&quot;=&quot;)) { s.set(to, raw); return; }\n        CellRef f = CellRef.parse(from), t = CellRef.parse(to);\n        s.set(to, Formula.text(Formula.copyShift(Parser.parseInput(raw), t.row() - f.row(), t.col() - f.col())));\n    }\n    /** Drag the corner handle down n rows: the same copy, n times. */\n    static void fillDown(Sheet s, String from, int n) {\n        CellRef f = CellRef.parse(from);\n        for (int k = 1; k &lt;= n; k++) copy(s, from, new CellRef(f.row() + k, f.col()).a1());\n    }\n\n    private static void apply(Sheet s, RowOp op) {\n        Map&lt;CellRef, String&gt; before = new LinkedHashMap&lt;&gt;();\n        for (CellRef c : s.addresses()) before.put(c, s.raw(c.a1()));\n        Map&lt;CellRef, String&gt; after = new LinkedHashMap&lt;&gt;();\n        for (Map.Entry&lt;CellRef, String&gt; e : before.entrySet()) {\n            CellRef to = op.move(e.getKey());\n            if (to == null) continue;                                        // that cell was in the deleted row\n            String raw = e.getValue();\n            after.put(to, raw.startsWith(&quot;=&quot;) ? Formula.text(op.rewrite(Parser.parseInput(raw))) : raw);\n        }\n        for (CellRef c : before.keySet()) s.clear(c.a1());                   // no edges left, so no order to get wrong\n        for (Map.Entry&lt;CellRef, String&gt; e : after.entrySet()) s.set(e.getKey().a1(), e.getValue());\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; Undo and redo.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing in the sheet changes, because the sheet already keeps the raw text of every cell. An edit records the text that was there before it; undo is a second <code>set()</code> with that old text, and every dependent recomputes for free because it is an ordinary edit going through the ordinary path. Redo is the same with the new text. A fresh edit clears the redo stack, as every editor does. That is the Command pattern arriving after the fact rather than being designed in: the command object is a record of three strings, and the sheet never learns it exists. The honest limit is that an undo of an edit that has since been overwritten by a collaborator replays over their work, which is where a real product needs operational transforms.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: undo and redo -- the edit is already reversible, because the sheet keeps the raw text of every cell\n/** One typed edit, and the text that was there before it. Its own undo: replay `before` through set(). */\nrecord EditCommand(String a1, String before, String after) { }\n\n/** An undo stack over the sheet. Nothing in Main.java changes: undo is a second set() with the old text. */\nfinal class EditHistory {\n    private final Sheet sheet;\n    private final Deque&lt;EditCommand&gt; undo = new ArrayDeque&lt;&gt;(), redo = new ArrayDeque&lt;&gt;();\n    EditHistory(Sheet sheet) { this.sheet = sheet; }\n    /** Type, and remember what was there. A new edit clears the redo stack, as every editor does. */\n    void type(String a1, String text) {\n        String before = sheet.raw(a1);\n        sheet.set(a1, text);\n        undo.push(new EditCommand(a1, before, text));\n        redo.clear();\n    }\n    /** Put the previous text back. Dependents recompute for free, because it is an ordinary edit. */\n    boolean undo() {\n        if (undo.isEmpty()) return false;\n        EditCommand c = undo.pop();\n        sheet.set(c.a1(), c.before());\n        redo.push(c);\n        return true;\n    }\n    /** Re-apply the edit that was just undone. */\n    boolean redo() {\n        if (redo.isEmpty()) return false;\n        EditCommand c = redo.pop();\n        sheet.set(c.a1(), c.after());\n        undo.push(c);\n        return true;\n    }\n    /** How deep the undo stack is. */\n    int depth() { return undo.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; Show #CYCLE! in every cell of the loop instead of refusing the edit, the way Google Sheets does.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The detection does not change at all &mdash; the exception already carries the loop it found, cell by cell. What changes is only the reaction, so that becomes a policy object: one implementation rethrows, which is Excel and the sheet's own behaviour; the other records the loop and tells the caller to paint #CYCLE!. The editor the UI calls picks one. The reason not to bake the second behaviour into the sheet is the invariant it would cost: the graph is always acyclic today, which is exactly what lets the cycle check be one cheap walk instead of a full search. Accepting cycles means the topological pass has to exclude the marked cells, and iterative-calculation mode &mdash; where Excel deliberately runs a loop a hundred times &mdash; is a third policy over the same detected loop.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the cycle policy -- Excel refuses the edit, Sheets paints #CYCLE! on the loop. Same detection, two policies.\n/** What the product does when an edit would make a loop. The detection never changes; only this does. */\ninterface CyclePolicy {\n    /** Called with the loop the sheet found. Returns what the user should see in the cell they were typing in. */\n    String onCycle(List&lt;CellRef&gt; loop);\n}\n/** Excel&#x27;s behaviour, and the sheet&#x27;s own: refuse the edit and leave the sheet exactly as it was. */\nfinal class RefuseCycle implements CyclePolicy {\n    public String onCycle(List&lt;CellRef&gt; loop) { throw new CircularReferenceException(loop); }\n}\n/** Google Sheets&#x27; behaviour: accept it and mark every cell on the loop, leaving unrelated cells alone. */\nfinal class MarkCycle implements CyclePolicy {\n    private final Set&lt;CellRef&gt; marked = new LinkedHashSet&lt;&gt;();\n    public String onCycle(List&lt;CellRef&gt; loop) { marked.addAll(loop); return &quot;#CYCLE!&quot;; }\n    /** The cells currently known to be on a loop; a display layer paints these #CYCLE!. */\n    Set&lt;CellRef&gt; marked() { return marked; }\n}\n/** The editor the UI calls. The sheet keeps its one honest behaviour; the policy decides what the product shows. */\nfinal class PolicyEditor {\n    private final Sheet sheet;\n    private final CyclePolicy policy;\n    PolicyEditor(Sheet sheet, CyclePolicy policy) { this.sheet = sheet; this.policy = policy; }\n    /** Type into a cell. Returns what the cell now displays, which for a refused loop is the policy&#x27;s answer. */\n    String type(String a1, String text) {\n        try { sheet.set(a1, text); return sheet.get(a1).display(); }\n        catch (CircularReferenceException e) { return policy.onCycle(e.path()); }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Multiple sheets, and formulas like =Sales!A1+2.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Widen the key. The dependency graph never mentions a cell, only addresses that can be compared for equality, so cycles, dirty sets and topological order are untouched by going from (row, col) to (sheet, row, col) &mdash; the extension proves that by running the identical algorithm over a workbook address. The parser learns one thing: a <code>Name!</code> prefix before an address. The cells map takes the wider key. What does get harder is not the engine but the product: one lock per sheet stops working the moment a formula crosses sheets, so either the workbook takes one lock, or you lock sheets in a fixed order by name to avoid a deadlock.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a workbook -- the graph never mentions a Cell, only keys, so widening the key is the whole change\n/** An address in a workbook: which sheet, then the cell. Equal-comparable, which is all the graph ever needed. */\nrecord Addr(String sheet, CellRef ref) {\n    @Override public String toString() { return sheet + &quot;!&quot; + ref; }\n}\n\n/**\n * DependencyGraph from Main.java with the key made a type parameter. Nothing about cycles, dirty sets or\n * topological order mentioned a cell, which is the proof that a workbook is a wider key and a parser change.\n */\nfinal class Deps&lt;K&gt; {\n    private final Map&lt;K, Set&lt;K&gt;&gt; precedents = new HashMap&lt;&gt;();\n    private final Map&lt;K, Set&lt;K&gt;&gt; dependents = new HashMap&lt;&gt;();\n    /** Point a key at the keys it reads, removing its old edges first. */\n    void setPrecedents(K k, Set&lt;K&gt; refs) {\n        for (K old : precedents.getOrDefault(k, Set.of())) {\n            Set&lt;K&gt; d = dependents.get(old);\n            if (d != null) { d.remove(k); if (d.isEmpty()) dependents.remove(old); }\n        }\n        if (refs.isEmpty()) precedents.remove(k); else precedents.put(k, new LinkedHashSet&lt;&gt;(refs));\n        for (K p : refs) dependents.computeIfAbsent(p, x -&gt; new LinkedHashSet&lt;&gt;()).add(k);\n    }\n    /** Everything that would recompute if this key changed. Also the set a new precedent must not be in. */\n    Set&lt;K&gt; affectedBy(K from) {\n        Set&lt;K&gt; seen = new LinkedHashSet&lt;&gt;();\n        Deque&lt;K&gt; q = new ArrayDeque&lt;&gt;();\n        seen.add(from); q.add(from);\n        while (!q.isEmpty()) { K c = q.poll(); for (K d : dependents.getOrDefault(c, Set.&lt;K&gt;of())) if (seen.add(d)) q.add(d); }\n        return seen;\n    }\n    /** Would pointing this key at those precedents make a loop? The same one-walk test as the sheet&#x27;s. */\n    boolean wouldCycle(K k, Set&lt;K&gt; refs) {\n        Set&lt;K&gt; affected = affectedBy(k);\n        for (K p : refs) if (affected.contains(p)) return true;\n        return false;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>13 &middot; Recalculate lazily instead of eagerly. Which would you build, and why?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Eager, and here is the trade rather than a preference. Lazy means an edit only marks the affected cells dirty and computes nothing; a read computes what it needs and memoises. It is cheaper when you edit a lot and read a little, and the extension shows it: after an edit to the head of a twenty-cell chain, reading the fifth cell evaluates five cells and not twenty. But a grid is the other shape &mdash; every scroll reads hundreds of cells and repaints them &mdash; so lazy moves the cost onto exactly the operation that happens most, and it needs memoise-plus-invalidate, which is the same graph with more moving parts and a harder thread-safety story (a read now mutates the cache). Eager pays once, while the write lock is already held, and leaves reads as one hash lookup.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: lazy evaluation -- dirty flags and compute-on-read, and the honest reason the eager sheet is the default\n/**\n * The other evaluation strategy: an edit marks the affected cells dirty and computes nothing; a read computes\n * what it needs and memoises it. Cheap when you edit a lot and read a little, which is not what a grid does.\n */\nfinal class LazySheet {\n    private final Map&lt;CellRef, Expr&gt; formulas = new HashMap&lt;&gt;();\n    private final Map&lt;CellRef, Value&gt; cache = new HashMap&lt;&gt;();\n    private final DependencyGraph graph = new DependencyGraph();\n    private final Evaluator evaluator;\n    private int evaluations;\n    LazySheet(FunctionRegistry functions) { this.evaluator = new Evaluator(functions); }\n\n    /** Type into a cell: rewire the edges, drop the cached values of everything affected, and stop. */\n    void set(String a1, String text) {\n        CellRef r = CellRef.parse(a1);\n        Expr e = Parser.parseInput(text);\n        Set&lt;CellRef&gt; refs = new LinkedHashSet&lt;&gt;();\n        e.collectRefs(refs);\n        graph.setPrecedents(r, refs);\n        formulas.put(r, e);\n        for (CellRef d : graph.affectedBy(r)) cache.remove(d);        // dirty, not recomputed\n    }\n    /** Read a cell, computing it and everything under it that is dirty, once each. */\n    Value get(String a1) { return value(CellRef.parse(a1)); }\n    private Value value(CellRef r) {\n        Value v = cache.get(r);\n        if (v != null) return v;\n        Expr e = formulas.get(r);\n        if (e == null) return Blank.IT;\n        evaluations++;\n        Value out = evaluator.eval(e, this::value);                   // memoised recursion is the invalidate-plus-cache\n        cache.put(r, out);\n        return out;\n    }\n    /** How many cells have actually been evaluated. The number that makes the trade-off visible. */\n    int evaluations() { return evaluations; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>14 &middot; Persist it. And now there are two servers.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The cells go behind a repository interface and the sheet's code does not change, only what it was handed. The interesting part is the write. In memory the lock makes read-check-write one step; across two servers the database does the same job with a version column: <code>UPDATE cells SET raw = ?, version = version + 1 WHERE a1 = ? AND version = ?</code>. A writer reads version 3, computes, and writes only if the row is still at version 3; if a second server got there first the update affects zero rows and the caller re-reads and retries. That is optimistic locking, and it is the same compare-then-write the lock performed, moved into the database. The recalculation itself stays wherever the graph is, which is the real design question a follow-up would push on: one server owns a sheet, or the graph lives in the database too.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- a repository and a conditional UPDATE, so two servers cannot silently lose an edit\n/**\n * Where cells live when they must outlive the process. save() is the whole design: it writes only if the\n * stored version is the one the caller read, which is the database doing what the sheet&#x27;s lock does in memory.\n *\n * UPDATE cells SET raw = ?, version = version + 1 WHERE sheet = ? AND a1 = ? AND version = ?\n */\ninterface CellRepository {\n    /** Write the text if nobody else has written since `expectedVersion`. False means you must re-read and retry. */\n    boolean save(String sheetId, String a1, String raw, int expectedVersion);\n    /** The stored text, or &quot;&quot; if nothing is stored. */\n    String load(String sheetId, String a1);\n    /** The stored version, 0 if nothing is stored. Read it, then pass it back to save(). */\n    int version(String sheetId, String a1);\n}\n\n/** The in-memory stand-in, with exactly the semantics of the conditional UPDATE above. */\nfinal class InMemoryCellRepository implements CellRepository {\n    private final Map&lt;String, String[]&gt; rows = new ConcurrentHashMap&lt;&gt;();      // key -&gt; { raw, version }\n    private static String key(String s, String a1) { return s + &quot;!&quot; + a1; }\n    public synchronized boolean save(String sheetId, String a1, String raw, int expectedVersion) {\n        String[] row = rows.get(key(sheetId, a1));\n        int v = row == null ? 0 : Integer.parseInt(row[1]);\n        if (v != expectedVersion) return false;                               // somebody else got there first\n        rows.put(key(sheetId, a1), new String[] { raw, String.valueOf(v + 1) });\n        return true;\n    }\n    public String load(String sheetId, String a1) { String[] r = rows.get(key(sheetId, a1)); return r == null ? &quot;&quot; : r[0]; }\n    public int version(String sheetId, String a1) { String[] r = rows.get(key(sheetId, a1)); return r == null ? 0 : Integer.parseInt(r[1]); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>15 &middot; Where does time come from, and how do you test =NOW()?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The sheet is handed a <code>Clock</code>, and that is the only thing in the system that knows what time it is: NOW() reads it, and every committed edit is stamped with it. A test hands in a clock that returns a fixed instant, types <code>=NOW()</code> and can assert the exact number. The same seam answers the harder half of the question: a volatile function's answer changes with no cell changing, so something has to re-post it &mdash; a tick that types each volatile cell's own text back into it, which recomputes it and everything that reads it through the ordinary path. Move the injected clock forward a minute, tick, and the dependents move.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: volatile functions -- NOW() changes with no cell changing, so something must re-post it on a tick\n/** The cells whose answer moves on its own. A timer re-types their own text, which recomputes their dependents. */\nfinal class VolatileCells {\n    private final Set&lt;String&gt; watched = new LinkedHashSet&lt;&gt;();\n    /** Register a cell whose formula is volatile: NOW(), RAND(), TODAY(). */\n    void watch(String a1) { watched.add(a1); }\n    /** One recalculation tick: re-post each volatile cell&#x27;s own text through the ordinary edit path. */\n    void tick(Sheet sheet) { for (String a1 : watched) sheet.set(a1, sheet.raw(a1)); }\n    /** How many volatile cells are being watched. A sheet with thousands of them is the reason Excel warns about NOW(). */\n    int size() { return watched.size(); }\n}\n\n// ---- ext: copy a formula -- relative references move with it, $-anchored ones do not, and the tree makes that one line\n/**\n * The formula as text again. Needed the moment anything rewrites a formula -- a copy, an inserted row --\n * because the sheet stores what the user typed and the formula bar has to show the new version.\n * A round trip preserves meaning, not keystrokes: &quot;=-A1&quot; comes back as &quot;=0-A1&quot;, and only the brackets the\n * precedence actually needs are printed.\n */\nfinal class Formula {\n    /** The tree as a formula the parser would read back, leading &quot;=&quot; included. */\n    static String text(Expr e) { return &quot;=&quot; + write(e); }\n\n    /** One address, with its anchors put back: A1, $A1, A$1, $A$1. */\n    static String a1(Ref r) {\n        String s = r.ref().a1();\n        int k = 0;\n        while (k &lt; s.length() &amp;&amp; Character.isLetter(s.charAt(k))) k++;\n        return (r.absCol() ? &quot;$&quot; : &quot;&quot;) + s.substring(0, k) + (r.absRow() ? &quot;$&quot; : &quot;&quot;) + s.substring(k);\n    }\n\n    /**\n     * The same tree, as it would read pasted dRow down and dCol right: an unanchored part moves by the\n     * distance the formula moved, an anchored one does not, and a reference pushed off the grid is #REF!.\n     */\n    static Expr copyShift(Expr e, int dRow, int dCol) {\n        if (e instanceof Ref r) {\n            int row = r.absRow() ? r.ref().row() : r.ref().row() + dRow;\n            int col = r.absCol() ? r.ref().col() : r.ref().col() + dCol;\n            if (row &lt; 0 || col &lt; 0) return new Lit(new Err(&quot;#REF!&quot;));       // dragged off the top or the left edge\n            return new Ref(new CellRef(row, col), r.absRow(), r.absCol());\n        }\n        if (e instanceof RangeRef rr) {\n            Expr a = copyShift(rr.from(), dRow, dCol), b = copyShift(rr.to(), dRow, dCol);\n            if (!(a instanceof Ref x) || !(b instanceof Ref y)) return new Lit(new Err(&quot;#REF!&quot;));\n            return new RangeRef(x, y);\n        }\n        if (e instanceof Bin b) return new Bin(b.op(), copyShift(b.left(), dRow, dCol), copyShift(b.right(), dRow, dCol));\n        if (e instanceof Call c) {\n            List&lt;Expr&gt; args = new ArrayList&lt;&gt;();\n            for (Expr a : c.args()) args.add(copyShift(a, dRow, dCol));\n            return new Call(c.name(), args);\n        }\n        return e;                                                           // a literal copies unchanged\n    }\n\n    private static String write(Expr e) {\n        if (e instanceof Lit l) return l.value() instanceof Text t ? &quot;\\&quot;&quot; + t.s() + &quot;\\&quot;&quot; : l.value().display();\n        if (e instanceof Ref r) return a1(r);\n        if (e instanceof RangeRef rr) return a1(rr.from()) + &quot;:&quot; + a1(rr.to());\n        if (e instanceof Bin b) return side(b.left(), prec(b.op()), false) + b.op() + side(b.right(), prec(b.op()), true);\n        if (e instanceof Call c) {\n            StringBuilder sb = new StringBuilder(c.name()).append(&quot;(&quot;);\n            for (int k = 0; k &lt; c.args().size(); k++) sb.append(k == 0 ? &quot;&quot; : &quot;,&quot;).append(write(c.args().get(k)));\n            return sb.append(&quot;)&quot;).toString();\n        }\n        return &quot;&quot;;\n    }\n    private static int prec(String op) { return switch (op) { case &quot;*&quot;, &quot;/&quot; -&gt; 3; case &quot;+&quot;, &quot;-&quot;, &quot;&amp;&quot; -&gt; 2; default -&gt; 1; }; }\n    /** Brackets only where dropping them would change the meaning: a weaker operator under a stronger one. */\n    private static String side(Expr e, int parent, boolean right) {\n        String s = write(e);\n        boolean needs = e instanceof Bin b &amp;&amp; (prec(b.op()) &lt; parent || (right &amp;&amp; prec(b.op()) == parent));\n        return needs ? &quot;(&quot; + s + &quot;)&quot; : s;\n    }\n}\n\n// ---- ext: insert and delete a row -- the one edit that is not a cell edit: it moves cells AND rewrites formulas\n/**\n * One structural edit: insert a blank row at `at`, or delete the row at `at`. It knows two things -- where a\n * cell ends up, and what a formula says afterwards -- and both are needed, because inserting a row above a\n * total and not rewriting the total&#x27;s formula is how a spreadsheet quietly starts printing the wrong number.\n * Rows are 0-based here, the way CellRef counts them.\n */\nrecord RowOp(int at, int delta) {\n    /** Insert a blank row, pushing that row and everything below it down. */\n    static RowOp insert(int row0) { return new RowOp(row0, +1); }\n    /** Delete a row, pulling everything below it up. */\n    static RowOp delete(int row0) { return new RowOp(row0, -1); }\n\n    /** Where this cell ends up, or null if this operation deleted it. */\n    CellRef move(CellRef c) {\n        if (delta &gt; 0) return c.row() &gt;= at ? new CellRef(c.row() + 1, c.col()) : c;\n        if (c.row() == at) return null;\n        return c.row() &gt; at ? new CellRef(c.row() - 1, c.col()) : c;\n    }\n\n    /**\n     * The same formula, said about the moved grid. A single reference into a deleted row becomes the value\n     * #REF!; a range that merely spanned the deleted row shrinks by one, which is what Excel does and what\n     * the user expects: =SUM(A1:A10) with row 5 gone is =SUM(A1:A9), not an error.\n     * The dollar anchors are deliberately ignored here: $A$5 still moves, because that box really did move.\n     */\n    Expr rewrite(Expr e) {\n        if (e instanceof Ref r) {\n            CellRef to = move(r.ref());\n            return to == null ? new Lit(new Err(&quot;#REF!&quot;)) : new Ref(to, r.absRow(), r.absCol());\n        }\n        if (e instanceof RangeRef rr) {\n            CellRef a = rr.from().ref(), b = rr.to().ref();\n            int r1 = Math.min(a.row(), b.row()), r2 = Math.max(a.row(), b.row());\n            if (delta &lt; 0 &amp;&amp; r1 == r2 &amp;&amp; r1 == at) return new Lit(new Err(&quot;#REF!&quot;));   // the range WAS that row\n            return new RangeRef(new Ref(endpoint(a, r1), rr.from().absRow(), rr.from().absCol()),\n                                new Ref(endpoint(b, r1), rr.to().absRow(), rr.to().absCol()));\n        }\n        if (e instanceof Bin b) return new Bin(b.op(), rewrite(b.left()), rewrite(b.right()));\n        if (e instanceof Call c) {\n            List&lt;Expr&gt; args = new ArrayList&lt;&gt;();\n            for (Expr a : c.args()) args.add(rewrite(a));\n            return new Call(c.name(), args);\n        }\n        return e;\n    }\n    private CellRef endpoint(CellRef c, int firstRow) {\n        if (delta &gt; 0) return c.row() &gt;= at ? new CellRef(c.row() + 1, c.col()) : c;\n        if (c.row() &gt; at) return new CellRef(c.row() - 1, c.col());\n        if (c.row() == at &amp;&amp; c.row() != firstRow) return new CellRef(c.row() - 1, c.col());\n        return c;                                                            // the top of the range stays put\n    }\n}\n\n/**\n * The toolbar operations, over the sheet&#x27;s public API and nothing else. Note what they are: many cells\n * changed at once, so in a product this is ONE method on the sheet holding the write lock for the whole\n * thing. Done from outside, as here, a reader could catch the grid halfway rewritten.\n */\nfinal class GridEditor {\n    /** Insert a blank row above the 1-based row number, the way the toolbar button does. */\n    static void insertRow(Sheet s, int row1) { apply(s, RowOp.insert(row1 - 1)); }\n    /** Delete the 1-based row. Its cells go, and anything that pointed INTO it reads #REF!. */\n    static void deleteRow(Sheet s, int row1) { apply(s, RowOp.delete(row1 - 1)); }\n\n    /** Copy one cell to another address, shifting its relative references by the distance it moved. */\n    static void copy(Sheet s, String from, String to) {\n        String raw = s.raw(from);\n        if (!raw.startsWith(&quot;=&quot;)) { s.set(to, raw); return; }\n        CellRef f = CellRef.parse(from), t = CellRef.parse(to);\n        s.set(to, Formula.text(Formula.copyShift(Parser.parseInput(raw), t.row() - f.row(), t.col() - f.col())));\n    }\n    /** Drag the corner handle down n rows: the same copy, n times. */\n    static void fillDown(Sheet s, String from, int n) {\n        CellRef f = CellRef.parse(from);\n        for (int k = 1; k &lt;= n; k++) copy(s, from, new CellRef(f.row() + k, f.col()).a1());\n    }\n\n    private static void apply(Sheet s, RowOp op) {\n        Map&lt;CellRef, String&gt; before = new LinkedHashMap&lt;&gt;();\n        for (CellRef c : s.addresses()) before.put(c, s.raw(c.a1()));\n        Map&lt;CellRef, String&gt; after = new LinkedHashMap&lt;&gt;();\n        for (Map.Entry&lt;CellRef, String&gt; e : before.entrySet()) {\n            CellRef to = op.move(e.getKey());\n            if (to == null) continue;                                        // that cell was in the deleted row\n            String raw = e.getValue();\n            after.put(to, raw.startsWith(&quot;=&quot;) ? Formula.text(op.rewrite(Parser.parseInput(raw))) : raw);\n        }\n        for (CellRef c : before.keySet()) s.clear(c.a1());                   // no edges left, so no order to get wrong\n        for (Map.Entry&lt;CellRef, String&gt; e : after.entrySet()) s.set(e.getKey().a1(), e.getValue());\n    }\n}\n\n// ---- ext: a range is one edge, not a thousand -- blocks, so =SUM(A1:A1000) does not put a thousand edges in the graph\n/** A rectangle of addresses, the way a formula writes a range. */\nrecord Rect(int r1, int c1, int r2, int c2) {\n    /** Is this address inside the rectangle? */\n    boolean covers(CellRef c) { return c.row() &gt;= r1 &amp;&amp; c.row() &lt;= r2 &amp;&amp; c.col() &gt;= c1 &amp;&amp; c.col() &lt;= c2; }\n}\n\n/**\n * The other way to hold a range&#x27;s dependency. The graph in Main.java gives =SUM(A1:A1000) one edge per cell,\n * so a hundred such formulas are a hundred thousand edges to build and walk. Here a range is filed once per\n * 64x64 block it overlaps -- sixteen entries instead of a thousand -- and &quot;who reads A500?&quot; is one block\n * lookup plus a containment test on the few ranges filed in that block. An interval tree or an R-tree is the\n * same idea with a sharper lookup; blocks are what real grid engines use, because a block id is one shift.\n */\nfinal class BlockRangeIndex {\n    /** The side of one block, in cells. Bigger blocks mean fewer entries and longer scans. */\n    static final int BLOCK = 64;\n    /** One range, and the formula that reads it. */\n    record RangeEdge(Rect area, CellRef formula) { }\n    private final Map&lt;Long, List&lt;RangeEdge&gt;&gt; byBlock = new HashMap&lt;&gt;();\n    private int entries;\n\n    /** File that this formula reads every cell of that rectangle. */\n    void add(CellRef formula, Rect r) {\n        for (int br = r.r1() / BLOCK; br &lt;= r.r2() / BLOCK; br++)\n            for (int bc = r.c1() / BLOCK; bc &lt;= r.c2() / BLOCK; bc++) {\n                byBlock.computeIfAbsent(key(br, bc), k -&gt; new ArrayList&lt;&gt;()).add(new RangeEdge(r, formula));\n                entries++;\n            }\n    }\n    /** Which formulas read this cell through a range: one map lookup, then a test per range in that block. */\n    Set&lt;CellRef&gt; readersOf(CellRef c) {\n        Set&lt;CellRef&gt; out = new LinkedHashSet&lt;&gt;();\n        for (RangeEdge e : byBlock.getOrDefault(key(c.row() / BLOCK, c.col() / BLOCK), List.of()))\n            if (e.area().covers(c)) out.add(e.formula());\n        return out;\n    }\n    /** How many entries the index holds: the number to compare with one edge per cell. */\n    int entries() { return entries; }\n    private static long key(int br, int bc) { return ((long) br &lt;&lt; 32) ^ (bc &amp; 0xffffffffL); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Which pattern is where, which SOLID letter is where, and where would a Factory or a Builder earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None of the patterns was chosen up front; each is what a move produced. Composite is move 1: a formula nests, so a node holds nodes. Interpreter is move 2: one case per node kind walking that tree. Strategy is move 3: which functions exist is the rule that changes. Template Method is the same move's base class, with IF and COUNT declining it because they must see the errors it swallows. Observer is move 4's rule that a screen is never inside the lock. State is move 6, with REFUSED as a real state. Command did not earn a place in Main.java but is one line away, because the raw text is already the undo. For SOLID: S is move 2 (parser, evaluator, graph, sheet, one job each); O is MEDIAN and IFERROR, new files plus one line; L is that the evaluator calls <code>f.apply</code> and never asks which function it got; I is three one-method seams; D is <code>configure()</code> plus the <code>ValueSource</code>. Factory earns its place the day function names arrive from configuration, because the registry is already the thing. Visitor earns its place the day someone outside this file adds a node kind; until then <code>sealed</code> makes five cases in one method exhaustive and the compiler checks them. Builder earns nothing here: a cell is three fields the sheet sets together, and a formula is built by a parser.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Composite: a formula nests, so a node holds nodes\nsealed interface Expr permits Lit, Ref, RangeRef, Bin, Call { void collectRefs(Set&lt;CellRef&gt; out); }\n\n// Interpreter: one case per node kind, and no switch on formula text anywhere\nValue eval(Expr e, ValueSource src) { if (e instanceof Bin b) return binary(b, src); /* ... */ }\n\n// Strategy + the registry that will one day be a Factory\ninterface SheetFunction { String name(); Value apply(List&lt;Value&gt; args); }\nnew FunctionRegistry().register(new SumFunction()).register(new MedianFunction());\n\n// Template Method: the shared plumbing, written once, with a documented opt-out\nabstract class NumericFunction implements SheetFunction { protected abstract Value reduce(List&lt;Double&gt; nums); }\nfinal class IfFunction implements SheetFunction { /* declines the base: it must SEE an error */ }\n\n// Observer: announced after the unlock, in a try/catch, so a broken chart cannot undo an edit\nprivate void publish(List&lt;CellChange&gt; changes) { /* for each listener: try { ... } catch (RuntimeException ignored) {} */ }\n\n// State: the edit&#x27;s life, with REFUSED as a real state rather than an accident\n// TYPED -&gt; PARSED -&gt; (cycle check) -&gt; COMMITTED, or REFUSED with nothing written\n\n// Factory: not yet. The registry already is one; it earns the name when names come from config\nMap&lt;String, SheetFunction&gt; fromConfig = Map.of(&quot;SUM&quot;, new SumFunction(), &quot;MEDIAN&quot;, new MedianFunction());\n\n// Builder: never here. A cell is three fields the sheet sets together\ncells.computeIfAbsent(ref, Cell::new).bind(text, tree);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n/** Where time comes from. Injected, so NOW() and the edit stamps are whatever a test says they are. */\ninterface Clock { long nowMs(); }\n\n/**\n * One cell's address. \"A1\" to a human, (row 0, col 0) to the code. A record, so two addresses for the same\n * box are equal and hash the same, which is what lets the whole dependency graph be keyed by address.\n */\nrecord CellRef(int row, int col) implements Comparable<CellRef> {\n    /** Parse \"A1\", \"bc12\". Throws IllegalArgumentException on anything else, so a typo never becomes an address. */\n    static CellRef parse(String s) {\n        String t = s.trim();\n        int i = 0, c = 0;\n        while (i < t.length() && Character.isLetter(t.charAt(i))) { c = c * 26 + (Character.toUpperCase(t.charAt(i)) - 'A' + 1); i++; }\n        if (i == 0 || i == t.length()) throw new IllegalArgumentException(\"bad cell reference: \" + s);\n        int r;\n        try { r = Integer.parseInt(t.substring(i)); } catch (NumberFormatException e) { throw new IllegalArgumentException(\"bad row: \" + s); }\n        if (r <= 0) throw new IllegalArgumentException(\"bad row: \" + s);\n        return new CellRef(r - 1, c - 1);\n    }\n    /** Back to \"A1\" for printing, the formula bar, and error messages. */\n    String a1() {\n        StringBuilder sb = new StringBuilder();\n        int c = col + 1;\n        while (c > 0) { sb.append((char) ('A' + (c - 1) % 26)); c = (c - 1) / 26; }\n        return sb.reverse().append(row + 1).toString();\n    }\n    @Override public int compareTo(CellRef o) { return row != o.row ? Integer.compare(row, o.row) : Integer.compare(col, o.col); }\n    @Override public String toString() { return a1(); }\n}\n\n// \"a cell can hold #DIV/0!\" -> an error is a VALUE, not an exception -> one bad cell cannot abort a recalc pass\n/**\n * What a cell holds. Sealed, so the four ve when the formula is COPIED to another box. They change nothing else -- an anchored\n * reference still moves when a row is inserted above it, because the box it points at really did move.\n */\nrecord Ref(CellRef ref, boolean absRow, boolean absCol) implements Expr {\n    /** A plain, unanchored reference: what \"A1\" means. */\n    Ref(CellRef ref) { this(ref, false, false); }\n    public void collectRefs(Set<CellRef> out) { out.add(ref); }\n}\n/** A rectangle, \"A1:B3\" or \"$A$1:$A$10\". Expanded to its cells here, which is why functions never learn that ranges exist. */\nrecord RangeRef(Ref from, Ref to) implements Expr {\n    /** The cap that stops =SUM(A1:A100000) materialising a hundred thousand addresses on a keystroke. */\n    static final int MAX_CELLS = 20_000;\n    /** Every address in the rectangle, row by row. Throws if the rectangle is bigger than the cap. */\n    List<CellRef> cells() {\n        int r1 = Math.min(from.ref().row(), to.ref().row()), r2 = Math.max(from.ref().row(), to.ref().row());\n        int c1 = Math.min(from.ref().col(), to.ref().col()), c2 = Math.max(from.ref().col(), to.ref().col());\n        long n = (long) (r2 - r1 + 1) * (c2 - c1 + 1);\n        if (n > MAX_CELLS) throw new IllegalArgumentException(\"range too large: \" + n + \" cells\");\n        List<CellRef> out = new ArrayList<>();\n        for (int r = r1; r <= r2; r++) for (int c = c1; c <= c2; c++) out.add(new CellRef(r, c));\n        return out;\n    }\n    public void collectRefs(Set<CellRef> out) { out.addAll(cells()); }\n}\n/** A binary operator: plus, minus, times, divide, join, and the comparisons. Reads whatever its two sides read. */\nrecord Bin(String op, Expr left, Expr right) implements Expr {\n    public void collectRefs(Set<CellRef> out) { left.collectRefs(out); right.collectRefs(out); }\n}\n/** A function call, \"SUM(A1:A3, 2)\". Holds its argument nodes, so it is a node holding nodes: Composite. */\nrecord Call(String name, List<Expr> args) implements Expr {\n    public void collectRefs(Set<CellRef> out) { for (Expr a : args) a.collectRefs(out); }\n}\n\n/**\n * The only class in the file that touches characters. Recursive descent: precedence is just the order the\n * methods call each other. A syntax error throws here and the sheet turns it into a #PARSE! value.\n */\nfinal class Parser {\n    private final String src;\n    private int i;\n    private Parser(String src) { this.src = src; }\n\n    /** What the user typed, as a tree. No leading \"=\" means a literal: a number if it parses, otherwise text. */\n    static Expr parseInput(String raw) {\n        if (raw == null || raw.isBlank()) return new Lit(Blank.IT);\n        if (raw.startsWith(\"=\")) {\n            Parser p = new Parser(raw.substring(1));\n            Expr e = p.expr();\n            p.ws();\n            if (p.i < p.src.length()) throw new IllegalArgumentException(\"trailing input at \" + p.i);\n            return e;\n        }\n        try { return new Lit(new Num(Double.parseDouble(raw.trim()))); }\n        catch (NumberFormatException nfe) { return new Lit(new Text(raw)); }\n    }\n\n    private static final String[] CMP = { \"<=\", \">=\", \"<>\", \"<\", \">\", \"=\" };\n\n    /** Lowest precedence: one optional comparison over an additive expression. */\n    private Expr expr() {\n        Expr l = additive();\n        ws();\n        for (String op : CMP) if (src.startsWith(op, i)) { i += op.length(); return new Bin(op, l, additive()); }\n        return l;\n    }\n    private Expr additive() {\n        Expr l = multiplicative();\n        while (true) {\n            ws();\n            char c = at(i);\n            if (c == '+' || c == '-' || c == '&') { i++; l = new Bin(String.valueOf(c), l, multiplicative()); } else return l;\n        }\n    }\n    private Expr multiplicative() {\n        Expr l = unary();\n        while (true) {\n            ws();\n            char c = at(i);\n            if (c == '*' || c == '/') { i++; l = new Bin(String.valueOf(c), l, unary()); } else return l;\n        }\n    }\n    private Expr unary() {\n        ws();\n        if (at(i) == '-') { i++; return new Bin(\"-\", new Lit(new Num(0)), unary()); }\n        if (at(i) == '+') { i++; return unary(); }\n        return primary();\n    }\n    private Expr primary() {\n        ws();\n        char c = at(i);\n        if (c == '(') { i++; Expr e = expr(); ws(); expect(')'); return e; }\n        if (c == '\"') {\n            i++;\n            StringBuilder sb = new StringBuilder();\n            while (i < src.length() && src.charAt(i) != '\"') sb.append(src.charAt(i++));\n            expect('\"');\n            return new Lit(new Text(sb.toString()));\n        }\n        if (Character.isDigit(c) || c == '.') return new Lit(new Num(number()));\n        if (c == '#') {                                            // an error typed as a literal: #REF!, #DIV/0!\n            int s = i++;\n            while (i < src.length() && (Character.isLetterOrDigit(src.charAt(i)) || src.charAt(i) == '/' || src.charAt(i) == '?')) i++;\n            if (at(i) == '!') i++;\n            return new Lit(new Err(src.substring(s, i)));          // an error is a value, so it is also a literal\n        }\n        if (c == '$') return range(address());                     // an anchored address can only be an address\n        if (Character.isLetter(c)) {\n            int save = i, s = i;\n            while (i < src.length() && (Character.isLetterOrDigit(src.charAt(i)) || src.charAt(i) == '_')) i++;\n            String word = src.substring(s, i);\n            ws();\n            if (at(i) == '(') {                                    // a function call\n                i++;\n                List<Expr> args = new ArrayList<>();\n                ws();\n                if (at(i) != ')') { args.add(expr()); ws(); while (at(i) == ',') { i++; args.add(expr()); ws(); } }\n                expect(')');\n                return new Call(word.toUpperCase(), args);\n            }\n            i = save;                                              // not a call, so read it again as an address\n            return range(address());\n        }\n        throw new IllegalArgumentException(\"unexpected '\" + c + \"' at \" + i);\n    }\n    /** One address, with the optional dollar anchors: A1, $A1, A$1, $A$1. */\n    private Ref address() {\n        boolean absCol = false, absRow = false;\n        if (at(i) == '$') { absCol = true; i++; }\n        int s = i;\n        while (i < src.length() && Character.isLetter(src.charAt(i))) i++;\n        String col = src.substring(s, i);\n        if (at(i) == '$') { absRow = true; i++; }\n        int s2 = i;\n        while (i < src.length() && Character.isDigit(src.charAt(i))) i++;\n        return new Ref(CellRef.parse(col + src.substring(s2, i)), absRow, absCol);\n    }\n    /** An address, or the rectangle it starts if a colon follows. */\n    private Expr range(Ref first) {\n        if (at(i) != ':') return first;\n        i++;\n        return new RangeRef(first, address());\n    }\n    private double number() {\n        int s = i;\n        while (i < src.length() && (Character.isDigit(src.charAt(i)) || src.charAt(i) == '.')) i++;\n        return Double.parseDouble(src.substring(s, i));\n    }\n    private void ws() { while (i < src.length() && Character.isWhitespace(src.charAt(i))) i++; }\n    private char at(int k) { return k < src.length() ? src.charAt(k) : '\\0'; }\n    private void expect(char c) { if (at(i) != c) throw new IllegalArgumentException(\"expected '\" + c + \"' at \" + i); i++; }\n}\n\n// \"now add MEDIAN\" is the follow-up everyone gets -> one object per function in a registry -> Strategy\n/**\n * One spreadsheet function. Two methods: what it is called, and what it does to already-evaluated arguments.\n * The contract is that it returns a Value and never throws; a bad argument comes back as an Err.\n */\ninterface SheetFunction {\n    /** The name as it appears in a formula, upper case. */\n    String name();\n    /** Apply to the evaluated arguments. Ranges have already been flattened into individual values. */\n    Value apply(List<Value> args);\n}\n\n/**\n * The plumbing most functions share: an error argument poisons the result, blanks are skipped, numeric text\n * is coerced, and text that is not a number is skipped like a blank -- so a header row does not break the\n * column total under it. A function that needs to SEE errors or blanks (IF, COUNT) declines this base class.\n */\nabstract class NumericFunction implements SheetFunction {\n    public Value apply(List<Value> args) {\n        List<Double> nums = new ArrayList<>();\n        for (Value v : args) {\n            if (v instanceof Err e) return e;                      // one bad argument, one error out: propagation\n            if (v instanceof Blank) continue;\n            if (v instanceof Num n) { nums.add(n.v()); continue; }\n            if (v instanceof Text t) {\n                try { nums.add(Double.parseDouble(t.s().trim())); }\n                catch (NumberFormatException nfe) { /* a label in the range, not a number: skip it */ }\n            }\n        }\n        if (nums.isEmpty() && needsAtLeastOne()) return new Err(\"#VALUE!\");\n        return reduce(nums);\n    }\n    /** Whether an empty argument list is an error. SUM says no (an empty sum is 0); AVERAGE says yes. */\n    protected boolean needsAtLeastOne() { return true; }\n    /** The actual arithmetic, once the arguments are clean numbers. */\n    protected abstract Value reduce(List<Double> nums);\n}\n\n/** SUM: adds the numbers, treats blanks as nothing, returns 0 over an empty range. */\nfinal class SumFunction extends NumericFunction {\n    public String name() { return \"SUM\"; }\n    @Override protected boolean needsAtLeastOne() { return false; }\n    protected Value reduce(List<Double> n) { double s = 0; for (double d : n) s += d; return new Num(s); }\n}\n/** AVERAGE: the mean of the numeric arguments. #VALUE! over nothing, because there is no mean of nothing. */\nfinal class AverageFunction extends NumericFunction {\n    public String name() { return \"AVERAGE\"; }\n    protected Value reduce(List<Double> n) { double s = 0; for (double d : n) s += d; return new Num(s / n.size()); }\n}\n/** MIN of the numeric arguments. */\nfinal class MinFunction extends NumericFunction {\n    public String name() { return \"MIN\"; }\n    protected Value reduce(List<Double> n) { double m = n.get(0); for (double d : n) m = Math.min(m, d); return new Num(m); }\n}\n/** MAX of the numeric arguments. */\nfinal class MaxFunction extends NumericFunction {\n    public String name() { return \"MAX\"; }\n    protected Value reduce(List<Double> n) { double m = n.get(0); for (double d : n) m = Math.max(m, d); return new Num(m); }\n}\n/** COUNT declines the numeric base class on purpose: it must see blanks and errors to not count them. */\nfinal class CountFunction implements SheetFunction {\n    public String name() { return \"COUNT\"; }\n    public Value apply(List<Value> args) {\n        long n = 0;\n        for (Value v : args) if (v instanceof Num) n++;\n        return new Num(n);\n    }\n}\n/** IF also declines the base class: it must see an error argument to choose a branch rather than propagate it. */\nfinal class IfFunction implements SheetFunction {\n    public String name() { return \"IF\"; }\n    public Value apply(List<Value> args) {\n        if (args.size() != 3) return new Err(\"#VALUE!\");\n        Value c = args.get(0);\n        if (c instanceof Err e) return e;\n        Double d = Evaluator.num(c);\n        if (d == null) return new Err(\"#VALUE!\");\n        return d != 0 ? args.get(1) : args.get(2);\n    }\n}\n/** NOW(): the one function whose answer changes without any cell changing. It reads the injected clock, never the wall clock. */\nfinal class NowFunction implements SheetFunction {\n    private final Clock clock;\n    NowFunction(Clock clock) { this.clock = clock; }\n    public String name() { return \"NOW\"; }\n    public Value apply(List<Value> args) { return new Num(clock.nowMs()); }\n}\n\n/**\n * Name to function. The one place a new function is added, which is why \"add MEDIAN\" is a new class plus one\n * line here and no engine file is opened.\n */\nfinal class FunctionRegistry {\n    private final Map<String, SheetFunction> byName = new HashMap<>();\n    /** Add or replace a function. Returns this, so a registry can be built in one expression. */\n    FunctionRegistry register(SheetFunction f) { byName.put(f.name().toUpperCase(), f); return this; }\n    /** The function with this name, or null, which the evaluator turns into #NAME?. */\n    SheetFunction lookup(String name) { return byName.get(name.toUpperCase()); }\n    /** Every registered name, sorted. For a help panel, and for the demo. */\n    Set<String> names() { return new TreeSet<>(byName.keySet()); }\n    /** The seven built-ins. NOW needs the clock, which is why the registry is built with one. */\n    static FunctionRegistry standard(Clock clock) {\n        return new FunctionRegistry().register(new SumFunction()).register(new AverageFunction())\n                .register(new MinFunction()).register(new MaxFunction()).register(new CountFunction())\n                .register(new IfFunction()).register(new NowFunction(clock));\n    }\n}\n\n/**\n * Where a value comes from when the evaluator meets a reference. One method, so the evaluator never sees the\n * sheet's map, its graph or its lock, and a test can hand it a lambda over a HashMap.\n */\n@FunctionalInterface\ninterface ValueSource {\n    /** The current value of that address. Blank if nobody typed there. */\n    Value valueOf(CellRef ref);\n}\n\n// \"walk the tree and produce a value\" -> one method per node kind -> Interpreter\n/**\n * Turns a tree into a value. Holds a registry and nothing else; everything it reads arrives through the\n * ValueSource it is handed, which is what makes it unit-testable without a sheet.\n */\nfinal class Evaluator {\n    private final FunctionRegistry functions;\n    Evaluator(FunctionRegistry functions) { this.functions = functions; }\n\n    /** Evaluate one node. Never throws: every failure becomes an Err value. */\n    Value eval(Expr e, ValueSource src) {\n        if (e instanceof Lit l) return l.value();\n        if (e instanceof Ref r) return src.valueOf(r.ref());\n        if (e instanceof RangeRef rr) {                            // a range on its own is not a value\n            List<CellRef> cs = rr.cells();\n            return cs.size() == 1 ? src.valueOf(cs.get(0)) : new Err(\"#VALUE!\");\n        }\n        if (e instanceof Bin b) return binary(b, src);\n        if (e instanceof Call c) {\n            SheetFunction f = functions.lookup(c.name());\n            if (f == null) return new Err(\"#NAME?\");\n            List<Value> args = new ArrayList<>();\n            for (Expr a : c.args()) {\n                if (a instanceof RangeRef rr) for (CellRef cr : rr.cells()) args.add(src.valueOf(cr));\n                else args.add(eval(a, src));\n            }\n            try { return f.apply(args); }\n            catch (RuntimeException ex) { return new Err(\"#VALUE!\"); }   // a function written next year cannot take the sheet down\n        }\n        return new Err(\"#VALUE!\");\n    }\n\n    private Value binary(Bin b, ValueSource src) {\n        Value l = eval(b.left(), src), r = eval(b.right(), src);\n        if (l instanceof Err e) return e;\n        if (r instanceof Err e) return e;\n        String op = b.op();\n        if (op.equals(\"&\")) return new Text(l.display() + r.display());\n        if (op.equals(\"=\")) return bool(same(l, r));\n        if (op.equals(\"<>\")) return bool(!same(l, r));\n        Double x = num(l), y = num(r);\n        if (x == null || y == null) return new Err(\"#VALUE!\");\n        return switch (op) {\n            case \"+\" -> new Num(x + y);\n            case \"-\" -> new Num(x - y);\n            case

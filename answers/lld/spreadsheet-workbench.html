.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Kahn over the affected set; test 4: [A1, A3, C1, B1, C2, B2], once each</text></g><g transform=\"translate(30 130)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one #DIV/0! kills the whole pass</text></g><path d=\"M350 147 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 130)\"><rect width=\"800\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">an error is a VALUE; test 6: the unrelated cell still recomputed</text></g><g transform=\"translate(30 168)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a rewired formula keeps its old edge</text></g><path d=\"M350 185 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 168)\"><rect width=\"800\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">delete the old edges first; test 7: D1 drops out of the pass</text></g><g transform=\"translate(30 206)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a chart that throws breaks the edit</text></g><path d=\"M350 223 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 206)\"><rect width=\"800\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">listeners after the unlock, each in a try/catch; test 8</text></g><g transform=\"translate(30 244)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">=SUM(A1:Z10000) on a keystroke</text></g><path d=\"M350 261 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 244)\"><rect width=\"800\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a cap, checked before the lock; test 5: nothing was written</text></g><g transform=\"translate(30 282)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a row is inserted above a total</text></g><path d=\"M350 299 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 282)\"><rect width=\"800\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">every formula below it is rewritten, tree not text; test 9: =SUM(A1:A3) becomes =SUM(A1:A4)</text></g><text x=\"615\" y=\"338\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a test: FailureTests.java runs nine blocks and must print ALL PASS</text></svg></div><div class=\"move\"><p>Two people typing into one cell (the whole read-modify-write inside one lock; the test lands on exactly 2000). A formula that reads itself, directly or round a chain of six (the dry run before any write; the test checks the sheet is byte-identical afterwards, down to the edge count). A cell computed before its inputs (Kahn's over the affected set; the test asserts the recalculation order and that every cell appears exactly once). One #DIV/0! killing a pass that was updating forty unrelated cells (an error is a value; the test shows the unrelated cell recomputed in the same pass, and that the error heals when its precedent is fixed). A rewired formula that keeps its old edge (the test points a cell away from A1 and checks it drops out of A1's recalculation). A chart that throws (listeners after the unlock, in a try/catch). A fat-fingered <code>=SUM(A1:Z10000)</code> (a cap, checked before the lock, so nothing was written). And the quiet one: a row inserted above a total, after which <code>=SUM(A1:A3)</code> is adding the wrong three boxes unless every formula below the insertion is rewritten &mdash; the test inserts a row and asserts that the formula changed and the value did not. Each of these is a few lines in FailureTests.java; a design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 380\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"210\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"300\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"830\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Composite</text><text x=\"210\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 1</text><text x=\"300\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">sealed interface Expr permits Lit, Ref, RangeRef, Bin, Call</text><text x=\"830\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a nested formula is the same code as a flat one</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Interpreter</text><text x=\"210\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"300\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Value eval(Expr e, ValueSource src)  -- one case per node kind</text><text x=\"830\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">no switch on formula text, ever</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"210\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">interface SheetFunction { Value apply(List&lt;Value&gt; args); }</text><text x=\"830\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">MEDIAN is a class and one register() line</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Template Method</text><text x=\"210\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"300\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">abstract NumericFunction.reduce(List&lt;Double&gt;), which IF declines</text><text x=\"830\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">error handling written once, and opt-out-able</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"210\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"300\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">publish(changes) after the unlock, inside a try/catch</text><text x=\"830\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">the screen hears; the sheet never waits for it</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"210\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"300\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">TYPED &rarr; PARSED &rarr; COMMITTED, or REFUSED with nothing written</text><text x=\"830\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">an edit cannot half-happen</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Command</text><text x=\"210\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">a follow-up</text><text x=\"300\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">the raw text IS the undo; EditCommand promotes it to a stack</text><text x=\"830\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">undo is a second set() with the old text</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"210\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"300\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">FunctionRegistry is already the registry, one line per function</text><text x=\"830\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when functions come from config</text><rect x=\"20\" y=\"290\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">Visitor</text><text x=\"210\" y=\"309.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"300\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">five cases in one eval method; sealed makes the compiler check them</text><text x=\"830\" y=\"309.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name when outsiders add node kinds</text><rect x=\"20\" y=\"320\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton / Builder</text><text x=\"210\" y=\"339.0\" font-size=\"11\" fill=\"var(--text)\">never here</text><text x=\"300\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">the sheet is handed to its callers; a cell is three fields set together</text><text x=\"830\" y=\"339.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh Sheet in one line</text><text x=\"615\" y=\"365\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence</text></svg></div><div class=\"move\"><p>Every pattern on this page came out of a move, which is why each can be defended in one sentence. Composite is move 1: a formula nests, so a node holds nodes, and <code>=SUM(A1:A3)*2+IF(B1&gt;0,1,2)</code> runs through exactly the same code as <code>=A1</code>. Interpreter is move 2: one case per node kind walking that tree, which is why there is no switch on formula text anywhere. Strategy is move 3: which functions exist is the rule that changes. Template Method is the same move's base class, and IF and COUNT decline it because they need to see what it swallows. Observer is move 4's rule that a screen must never be inside the lock. State is move 6, with REFUSED as a real state rather than an accident. The greyed rows are the honest ones. Command is one line away, because the sheet already keeps the raw text of every cell, so undo is a second <code>set()</code> with the old text. Factory is not earned because the registry already <i>is</i> one, and it takes the name the day function names arrive from configuration. Visitor is not earned because the five node kinds sit under a <code>sealed</code> interface, so five cases in one method are already exhaustive and the compiler says so; it earns its place when people outside this file start adding node kinds. Singleton and Builder earn nothing here at all. A pattern without a move behind it is decoration.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"450\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"560\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"450\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"560\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">Parser makes trees. Evaluator makes values. The graph knows edges. The sheet runs the edit.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"450\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">MedianFunction and IfErrorFunction are new files plus one register() line each</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"450\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">f.apply(args);  the evaluator never asks \"is this the IF one?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one job each</text><text x=\"450\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"560\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">ValueSource, ChangeListener and Clock are one method each, so a test hands in a lambda</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"450\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"560\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">sheet.configure(registry, clock);  evaluator.eval(expr, this::read)  -- never the sheet itself</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>SOLID is not a list to recite; it is the check that the moves did their job. S came from move 2: the parser changes when the grammar does, the evaluator when the semantics do, the graph when the edges do, the sheet when the transaction does, and nobody does two of those. O is MEDIAN and IFERROR: a new file and one register line, never an opened engine. L is that the evaluator calls <code>f.apply(args)</code> and never asks \"is this the IF one?\". I is three seam interfaces with one method each, so a fake for a test is a lambda. D is why a test can evaluate a formula against a HashMap with no sheet in sight, and pin NOW() to last Tuesday.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">MEDIAN, VLOOKUP, IFERROR</text></g><path d=\"M350 46 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 24)\"><rect width=\"670\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"335.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind SheetFunction plus one register() line</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a chart, an autosave, another screen</text></g><path d=\"M350 100 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 78)\"><rect width=\"670\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"335.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more ChangeListener; the lock and the graph do not change</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 132)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">paint #CYCLE! instead of refusing</text></g><path d=\"M350 154 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 132)\"><rect width=\"670\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"335.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a policy object over the loop the check already found</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across cells</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">insert a row: forty formulas move</text></g><path d=\"M350 208 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 186)\"><rect width=\"670\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"335.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the rewrite and the writes inside the SAME write lock: all or nothing</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">persist it; two servers</text></g><path d=\"M350 262 H410\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(410 240)\"><rect width=\"670\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"335.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cells behind a repository, and the write becomes</text><text x=\"335.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE cells SET raw = ?, version = version + 1 WHERE a1 = ? AND version = ?</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the parser, the graph, the topological order and the tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (MEDIAN, VLOOKUP, IFERROR) is a new class behind <code>SheetFunction</code> plus one register line. Someone new who wants to know (a chart, an autosave, a collaborator's screen) is one more <code>ChangeListener</code>; the lock and the graph do not change. A new step in a life (paint #CYCLE! on the loop instead of refusing the edit) is a policy object over the loop the check already found &mdash; the detection is identical, only the reaction differs. A new invariant across cells is the interesting one here, because inserting a row is exactly that: forty formulas have to be rewritten together, so the rewrite and the writes belong inside the <i>same</i> write lock, all or nothing, or a reader sees half a grid. State that must outlive the process (persist it; two servers) is the cells behind a repository interface, and the write becomes <code>UPDATE cells SET raw = ?, version = version + 1 WHERE a1 = ? AND version = ?</code>: the database performing the same compare-then-write the lock did in memory. And the workbook twist &mdash; <code>=Sales!A1+2</code> &mdash; is the cheapest of the lot, because the graph never mentions a cell, only keys: widen the key from (row, col) to (sheet, row, col) and the cycle check, the dirty set and the topological order are untouched. For all of them the parser, the graph and the tests stay as they are; that is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 760\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox =\"var(--text)\">setValue(v)</text></g><g transform=\"translate(290 470)\"><rect width=\"330\" height=\"138\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"165.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DependencyGraph</text><line x1=\"0\" y1=\"26\" x2=\"330\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">precedents: Map&lt;ref, Set&lt;ref&gt;&gt;</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">dependents: Map&lt;ref, Set&lt;ref&gt;&gt;</text><line x1=\"0\" y1=\"64\" x2=\"330\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">setPrecedents(cell, refs)</text><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">affectedBy(ref): Set&lt;ref&gt;</text><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">topoOrder(dirty): List&lt;ref&gt;</text><text x=\"8\" y=\"125\" font-size=\"11.5\" fill=\"var(--text)\">path(from, to) / edgeCount()</text></g><g transform=\"translate(660 20)\"><rect width=\"245\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"122.5\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"122.5\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Expr</text><line x1=\"0\" y1=\"34\" x2=\"245\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">collectRefs(Set&lt;CellRef&gt;)</text></g><g transform=\"translate(660 100)\"><rect width=\"245\" height=\"106\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"122.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Lit &middot; Ref &middot; RangeRef</text><line x1=\"0\" y1=\"26\" x2=\"245\" 3.5\" font-weight=\"600\" fill=\"var(--text)\" font-style=\"italic\">NumericFunction</text><line x1=\"0\" y1=\"26\" x2=\"275\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">apply(args): propagates Err</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--text)\">reduce(List&lt;Double&gt;): Value</text></g><g transform=\"translate(945 235)\"><rect width=\"275\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"137.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Sum &middot; Average &middot; Min &middot; Max</text><line x1=\"0\" y1=\"26\" x2=\"275\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">they extend the base class</text><line x1=\"0\" y1=\"48\" x2=\"275\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">reduce(nums)</text></g><g transform=\"translate(945 350)\"><rect width=\"275\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"137.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Count &middot; If &middot; Now</text><line x1=\"0\" y1=\"26\" x2=\"275\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">they decline it: they must</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">SEE errors and blanks</text><line x1=\"0\" y1=\"64\" x2=\"275\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">apply(args)</text></g><g transform=\"translate(945 480)\"><rect width=\"275\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"137.5\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FunctionRegistry</text><line x1=\"0\" y1=\"26\" x2=\"275\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">byName: Map&lt;String, fn&gt;</text><line x1=\"0\" y1=\"48\" x2=\"275\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">register(f) / lookup(name)</text><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">standard(clock)</text></g><g><path d=\"M20 732L64 732\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"736\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 732L284 732\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"736\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 732L504 732\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"736\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 732L684 732\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"736\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 732L904 732\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"736\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; <i>italic</i> = abstract). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements or extends. Filled diamond = owns: the sheet owns every cell and owns the graph. Plain arrow = references: a cell points at its tree and its cached value. Dashed green = handed in, which here means the evaluator is given a <code>ValueSource</code> and never the sheet itself. Dotted blue = notifies. <b>Where state lives:</b> the sheet has the cells map, the graph, the one read-write lock, the handed-in registry and clock, and the listeners; a cell has its raw text, its parsed tree and its cached value; the graph has the two edge maps and nothing else, and it stores <i>addresses</i> rather than cells, which is why an edge to a cell nobody has typed into yet is perfectly legal. The tree hanging off each cell is not just read but rewritten: inserting a row walks it and moves every reference, which is the pay-off for parsing once instead of keeping the formula as a string. Notice what is <i>not</i> here: no Formula class separate from the tree, because the tree is the formula; no Grid or Row class, because the grid is sparse and a blank cell is the absence of a map entry; and no Recalculator, because recalculation is the second half of one method on the sheet.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (nine blocks of claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\nimport java.util.function.*;\n\n/** Where time comes from. Injected, so NOW() and the edit stamps are whatever a test says they are. */\ninterface Clock { long nowMs(); }\n\n/**\n * One cell&#x27;s address. &quot;A1&quot; to a human, (row 0, col 0) to the code. A record, so two addresses for the same\n * box are equal and hash the same, which is what lets the whole dependency graph be keyed by address.\n */\nrecord CellRef(int row, int col) implements Comparable&lt;CellRef&gt; {\n    /** Parse &quot;A1&quot;, &quot;bc12&quot;. Throws IllegalArgumentException on anything else, so a typo never becomes an address. */\n    static CellRef parse(String s) {\n        String t = s.trim();\n        int i = 0, c = 0;\n        while (i &lt; t.length() &amp;&amp; Character.isLetter(t.charAt(i))) { c = c * 26 + (Character.toUpperCase(t.charAt(i)) - &#x27;A&#x27; + 1); i++; }\n        if (i == 0 || i == t.length()) throw new IllegalArgumentException(&quot;bad cell reference: &quot; + s);\n        int r;\n        try { r = Integer.parseInt(t.substring(i)); } catch (NumberFormatException e) { throw new IllegalArgumentException(&quot;bad row: &quot; + s); }\n        if (r &lt;= 0) throw new IllegalArgumentException(&quot;bad row: &quot; + s);\n        return new CellRef(r - 1, c - 1);\n    }\n    /** Back to &quot;A1&quot; for printing, the formula bar, and error messages. */\n    String a1() {\n        StringBuilder sb = new StringBuilder();\n        int c = col + 1;\n        while (c &gt; 0) { sb.append((char) (&#x27;A&#x27; + (c - 1) % 26)); c = (c - 1) / 26; }\n        return sb.reverse().append(row + 1).toString();\n    }\n    @Override public int compareTo(CellRef o) { return row != o.row ? Integer.compare(row, o.row) : Integer.compare(col, o.col); }\n    @Override public String toString() { return a1(); }\n}\n\n// &quot;a cell can hold #DIV/0!&quot; -&gt; an error is a VALUE, not an exception -&gt; one bad cell cannot abort a recalc pass\n/**\n * What a cell holds. Sealed, so the four possibilities are a closed set the compiler can check: a number,\n * text, an error code, or blank. An error being a value is the decision the whole design rests on.\n */\nsealed interface Value permits Num, Text, Err, Blank {\n    /** What the grid would paint in the box. */\n    String display();\n}\n/** A number. Every arithmetic result is one of these; booleans are 1 and 0. */\nrecord Num(double v) implements Value {\n    public String display() { return v == Math.rint(v) &amp;&amp; !Double.isInfinite(v) ? String.valueOf((long) v) : String.valueOf(v); }\n}\n/** Text. Also what a formula returns when the join operator glues two things together. */\nrecord Text(String s) implements Value { public String display() { return s; } }\n/** An error, carrying the code the user sees: #DIV/0!, #VALUE!, #NAME?, #REF!, #PARSE!. It caches and propagates like any other value. */\nrecord Err(String code) implements Value { public String display() { return code; } }\n/** An empty box. A cell nobody has typed into is not in the map at all; reading it gives this. */\nenum Blank implements Value { IT; public String display() { return &quot;&quot;; } }\n\n// &quot;=SUM(A1:A3)*2 must be obeyed again whenever A1 moves&quot; -&gt; parse once, keep the tree -&gt; Composite\n/**\n * A parsed formula: a tree of nodes, each of which can hold nodes. Sealed, so the evaluator&#x27;s five cases are\n * the whole grammar. The tree knows which cells it reads, which is where the dependency edges come from.\n */\nsealed interface Expr permits Lit, Ref, RangeRef, Bin, Call {\n    /** Add every cell this node (and everything under it) reads into out. This IS the precedent set. */\n    void collectRefs(Set&lt;CellRef&gt; out);\n}\n/** A constant: a typed number, a quoted string, or a stored error. Reads nothing. */\nrecord Lit(Value value) implements Expr { public void collectRefs(Set&lt;CellRef&gt; out) { } }\n/**\n * One cell reference, &quot;A1&quot;. Reads exactly one cell. The two flags are the dollar signs in $A$1: an anchored\n * part does not move when the formula is COPIED to another box. They change nothing else -- an anchored\n * reference still moves when a row is inserted above it, because the box it points at really did move.\n */\nrecord Ref(CellRef ref, boolean absRow, boolean absCol) implements Expr {\n    /** A plain, unanchored reference: what &quot;A1&quot; means. */\n    Ref(CellRef ref) { this(ref, false, false); }\n    public void collectRefs(Set&lt;CellRef&gt; out) { out.add(ref); }\n}\n/** A rectangle, &quot;A1:B3&quot; or &quot;$A$1:$A$10&quot;. Expanded to its cells here, which is why functions never learn that ranges exist. */\nrecord RangeRef(Ref from, Ref to) implements Expr {\n    /** The cap that stops =SUM(A1:A100000) materialising a hundred thousand addresses on a keystroke. */\n    static final int MAX_CELLS = 20_000;\n    /** Every address in the rectangle, row by row. Throws if the rectangle is bigger than the cap. */\n    List&lt;CellRef&gt; cells() {\n        int r1 = Math.min(from.ref().row(), to.ref().row()), r2 = Math.max(from.ref().row(), to.ref().row());\n        int c1 = Math.min(from.ref().col(), to.ref().col()), c2 = Math.max(from.ref().col(), to.ref().col());\n        long n = (long) (r2 - r1 + 1) * (c2 - c1 + 1);\n        if (n &gt; MAX_CELLS) throw new IllegalArgumentException(&quot;range too large: &quot; + n + &quot; cells&quot;);\n        List&lt;CellRef&gt; out = new ArrayList&lt;&gt;();\n        for (int r = r1; r &lt;= r2; r++) for (int c = c1; c &lt;= c2; c++) out.add(new CellRef(r, c));\n        return out;\n    }\n    public void collectRefs(Set&lt;CellRef&gt; out) { out.addAll(cells()); }\n}\n/** A binary operator: plus, minus, times, divide, join, and the comparisons. Reads whatever its two sides read. */\nrecord Bin(String op, Expr left, Expr right) implements Expr {\n    public void collectRefs(Set&lt;CellRef&gt; out) { left.collectRefs(out); right.collectRefs(out); }\n}\n/** A function call, &quot;SUM(A1:A3, 2)&quot;. Holds its argument nodes, so it is a node holding nodes: Composite. */\nrecord Call(String name, List&lt;Expr&gt; args) implements Expr {\n    public void collectRefs(Set&lt;CellRef&gt; out) { for (Expr a : args) a.collectRefs(out); }\n}\n\n/**\n * The only class in the file that touches characters. Recursive descent: precedence is just the order the\n * methods call each other. A syntax error throws here and the sheet turns it into a #PARSE! value.\n */\nfinal class Parser {\n    private final String src;\n    private int i;\n    private Parser(String src) { this.src = src; }\n\n    /** What the user typed, as a tree. No leading &quot;=&quot; means a literal: a number if it parses, otherwise text. */\n    static Expr parseInput(String raw) {\n        if (raw == null || raw.isBlank()) return new Lit(Blank.IT);\n        if (raw.startsWith(&quot;=&quot;)) {\n            Parser p = new Parser(raw.substring(1));\n            Expr e = p.expr();\n            p.ws();\n            if (p.i &lt; p.src.length()) throw new IllegalArgumentException(&quot;trailing input at &quot; + p.i);\n            return e;\n        }\n        try { return new Lit(new Num(Double.parseDouble(raw.trim()))); }\n        catch (NumberFormatException nfe) { return new Lit(new Text(raw)); }\n    }\n\n    private static final String[] CMP = { &quot;&lt;=&quot;, &quot;&gt;=&quot;, &quot;&lt;&gt;&quot;, &quot;&lt;&quot;, &quot;&gt;&quot;, &quot;=&quot; };\n\n    /** Lowest precedence: one optional comparison over an additive expression. */\n    private Expr expr() {\n        Expr l = additive();\n        ws();\n        for (String op : CMP) if (src.startsWith(op, i)) { i += op.length(); return new Bin(op, l, additive()); }\n        return l;\n    }\n    private Expr additive() {\n        Expr l = multiplicative();\n        while (true) {\n            ws();\n            char c = at(i);\n            if (c == &#x27;+&#x27; || c == &#x27;-&#x27; || c == &#x27;&amp;&#x27;) { i++; l = new Bin(String.valueOf(c), l, multiplicative()); } else return l;\n        }\n    }\n    private Expr multiplicative() {\n        Expr l = unary();\n        while (true) {\n            ws();\n            char c = at(i);\n            if (c == &#x27;*&#x27; || c == &#x27;/&#x27;) { i++; l = new Bin(String.valueOf(c), l, unary()); } else return l;\n        }\n    }\n    private Expr unary() {\n        ws();\n        if (at(i) == &#x27;-&#x27;) { i++; return new Bin(&quot;-&quot;, new Lit(new Num(0)), unary()); }\n        if (at(i) == &#x27;+&#x27;) { i++; return unary(); }\n        return primary();\n    }\n    private Expr primary() {\n        ws();\n        char c = at(i);\n        if (c == &#x27;(&#x27;) { i++; Expr e = expr(); ws(); expect(&#x27;)&#x27;); return e; }\n        if (c == &#x27;&quot;&#x27;) {\n            i++;\n            StringBuilder sb = new StringBuilder();\n            while (i &lt; src.length() &amp;&amp; src.charAt(i) != &#x27;&quot;&#x27;) sb.append(src.charAt(i++));\n            expect(&#x27;&quot;&#x27;);\n            return new Lit(new Text(sb.toString()));\n        }\n        if (Character.isDigit(c) || c == &#x27;.&#x27;) return new Lit(new Num(number()));\n        if (c == &#x27;#&#x27;) {                                            // an error typed as a literal: #REF!, #DIV/0!\n            int s = i++;\n            while (i &lt; src.length() &amp;&amp; (Character.isLetterOrDigit(src.charAt(i)) || src.charAt(i) == &#x27;/&#x27; || src.charAt(i) == &#x27;?&#x27;)) i++;\n            if (at(i) == &#x27;!&#x27;) i++;\n            return new Lit(new Err(src.substring(s, i)));          // an error is a value, so it is also a literal\n        }\n        if (c == &#x27;$&#x27;) return range(address());                     // an anchored address can only be an address\n        if (Character.isLetter(c)) {\n            int save = i, s = i;\n            while (i &lt; src.length() &amp;&amp; (Character.isLetterOrDigit(src.charAt(i)) || src.charAt(i) == &#x27;_&#x27;)) i++;\n            String word = src.substring(s, i);\n            ws();\n            if (at(i) == &#x27;(&#x27;) {                                    // a function call\n                i++;\n                List&lt;Expr&gt; args = new ArrayList&lt;&gt;();\n                ws();\n                if (at(i) != &#x27;)&#x27;) { args.add(expr()); ws(); while (at(i) == &#x27;,&#x27;) { i++; args.add(expr()); ws(); } }\n                expect(&#x27;)&#x27;);\n                return new Call(word.toUpperCase(), args);\n            }\n            i = save;                                              // not a call, so read it again as an address\n            return range(address());\n        }\n        throw new IllegalArgumentException(&quot;unexpected &#x27;&quot; + c + &quot;&#x27; at &quot; + i);\n    }\n    /** One address, with the optional dollar anchors: A1, $A1, A$1, $A$1. */\n    private Ref address() {\n        boolean absCol = false, absRow = false;\n        if (at(i) == &#x27;$&#x27;) { absCol = true; i++; }\n        int s = i;\n        while (i &lt; src.length() &amp;&amp; Character.isLetter(src.charAt(i))) i++;\n        String col = src.substring(s, i);\n        if (at(i) == &#x27;$&#x27;) { absRow = true; i++; }\n        int s2 = i;\n        while (i &lt; src.length() &amp;&amp; Character.isDigit(src.charAt(i))) i++;\n        return new Ref(CellRef.parse(col + src.substring(s2, i)), absRow, absCol);\n    }\n    /** An address, or the rectangle it starts if a colon follows. */\n    private Expr range(Ref first) {\n        if (at(i) != &#x27;:&#x27;) return first;\n        i++;\n        return new RangeRef(first, address());\n    }\n    private double number() {\n        int s = i;\n        while (i &lt; src.length() &amp;&amp; (Character.isDigit(src.charAt(i)) || src.charAt(i) == &#x27;.&#x27;)) i++;\n        return Double.parseDouble(src.substring(s, i));\n    }\n    private void ws() { while (i &lt; src.length() &amp;&amp; Character.isWhitespace(src.charAt(i))) i++; }\n    private char at(int k) { return k &lt; src.length() ? src.charAt(k) : &#x27;\\0&#x27;; }\n    private void expect(char c) { if (at(i) != c) throw new IllegalArgumentException(&quot;expected &#x27;&quot; + c + &quot;&#x27; at &quot; + i); i++; }\n}\n\n// &quot;now add MEDIAN&quot; is the follow-up everyone gets -&gt; one object per function in a registry -&gt; Strategy\n/**\n * One spreadsheet function. Two methods: what it is called, and what it does to already-evaluated arguments.\n * The contract is that it returns a Value and never throws; a bad argument comes back as an Err.\n */\ninterface SheetFunction {\n    /** The name as it appears in a formula, upper case. */\n    String name();\n    /** Apply to the evaluated arguments. Ranges have already been flattened into individual values. */\n    Value apply(List&lt;Value&gt; args);\n}\n\n/**\n * The plumbing most functions share: an error argument poisons the result, blanks are skipped, numeric text\n * is coerced, and text that is not a number is skipped like a blank -- so a header row does not break the\n * column total under it. A function that needs to SEE errors or blanks (IF, COUNT) declines this base class.\n */\nabstract class NumericFunction implements SheetFunction {\n    public Value apply(List&lt;Value&gt; args) {\n        List&lt;Double&gt; nums = new ArrayList&lt;&gt;();\n        for (Value v : args) {\n            if (v instanceof Err e) return e;                      // one bad argument, one error out: propagation\n            if (v instanceof Blank) continue;\n            if (v instanceof Num n) { nums.add(n.v()); continue; }\n            if (v instanceof Text t) {\n                try { nums.add(Double.parseDouble(t.s().trim())); }\n                catch (NumberFormatException nfe) { /* a label in the range, not a number: skip it */ }\n            }\n        }\n        if (nums.isEmpty() &amp;&amp; needsAtLeastOne()) return new Err(&quot;#VALUE!&quot;);\n        return reduce(nums);\n    }\n    /** Whether an empty argument list is an error. SUM says no (an empty sum is 0); AVERAGE says yes. */\n    protected boolean needsAtLeastOne() { return true; }\n    /** The actual arithmetic, once the arguments are clean numbers. */\n    protected abstract Value reduce(List&lt;Double&gt; nums);\n}\n\n/** SUM: adds the numbers, treats blanks as nothing, returns 0 over an empty range. */\nfinal class SumFunction extends NumericFunction {\n    public String name() { return &quot;SUM&quot;; }\n    @Override protected boolean needsAtLeastOne() { return false; }\n    protected Value reduce(List&lt;Double&gt; n) { double s = 0; for (double d : n) s += d; return new Num(s); }\n}\n/** AVERAGE: the mean of the numeric arguments. #VALUE! over nothing, because there is no mean of nothing. */\nfinal class AverageFunction extends NumericFunction {\n    public String name() { return &quot;AVERAGE&quot;; }\n    protected Value reduce(List&lt;Double&gt; n) { double s = 0; for (double d : n) s += d; return new Num(s / n.size()); }\n}\n/** MIN of the numeric arguments. */\nfinal class MinFunction extends NumericFunction {\n    public String name() { return &quot;MIN&quot;; }\n    protected Value reduce(List&lt;Double&gt; n) { double m = n.get(0); for (double d : n) m = Math.min(m, d); return new Num(m); }\n}\n/** MAX of the numeric arguments. */\nfinal class MaxFunction extends NumericFunction {\n    public String name() { return &quot;MAX&quot;; }\n    protected Value reduce(List&lt;Double&gt; n) { double m = n.get(0); for (double d : n) m = Math.max(m, d); return new Num(m); }\n}\n/** COUNT declines the numeric base class on purpose: it must see blanks and errors to not count them. */\nfinal class CountFunction implements SheetFunction {\n    public String name() { return &quot;COUNT&quot;; }\n    public Value apply(List&lt;Value&gt; args) {\n        long n = 0;\n        for (Value v : args) if (v instanceof Num) n++;\n        return new Num(n);\n    }\n}\n/** IF also declines the base class: it must see an error argument to choose a branch rather than propagate it. */\nfinal class IfFunction implements SheetFunction {\n    public String name() { return &quot;IF&quot;; }\n    public Value apply(List&lt;Value&gt; args) {\n        if (args.size() != 3) return new Err(&quot;#VALUE!&quot;);\n        Value c = args.get(0);\n        if (c instanceof Err e) return e;\n        Double d = Evaluator.num(c);\n        if (d == null) return new Err(&quot;#VALUE!&quot;);\n        return d != 0 ? args.get(1) : args.get(2);\n    }\n}\n/** NOW(): the one function whose answer changes without any cell changing. It reads the injected clock, never the wall clock. */\nfinal class NowFunction implements SheetFunction {\n    private final Clock clock;\n    NowFunction(Clock clock) { this.clock = clock; }\n    public String name() { return &quot;NOW&quot;; }\n    public Value apply(List&lt;Value&gt; args) { return new Num(clock.nowMs()); }\n}\n\n/**\n * Name to function. The one place a new function is added, which is why &quot;add MEDIAN&quot; is a new class plus one\n * line here and no engine file is opened.\n */\nfinal class FunctionRegistry {\n    private final Map&lt;String, SheetFunction&gt; byName = new HashMap&lt;&gt;();\n    /** Add or replace a function. Returns this, so a registry can be built in one expression. */\n    FunctionRegistry register(SheetFunction f) { byName.put(f.name().toUpperCase(), f); return this; }\n    /** The function with this name, or null, which the evaluator turns into #NAME?. */\n    SheetFunction lookup(String name) { return byName.get(name.toUpperCase()); }\n    /** Every registered name, sorted. For a help panel, and for the demo. */\n    Set&lt;String&gt; names() { return new TreeSet&lt;&gt;(byName.keySet()); }\n    /** The seven built-ins. NOW needs the clock, which is why the registry is built with one. */\n    static FunctionRegistry standard(Clock clock) {\n        return new FunctionRegistry().register(new SumFunction()).register(new AverageFunction())\n                .register(new MinFunction()).register(new MaxFunction()).register(new CountFunction())\n                .register(new IfFunction()).register(new NowFunction(clock));\n    }\n}\n\n/**\n * Where a value comes from when the evaluator meets a reference. One method, so the evaluator never sees the\n * sheet&#x27;s map, its graph or its lock, and a test can hand it a lambda over a HashMap.\n */\n@FunctionalInterface\ninterface ValueSource {\n    /** The current value of that address. Blank if nobody typed there. */\n    Value valueOf(CellRef ref);\n}\n\n// &quot;walk the tree and produce a value&quot; -&gt; one method per node kind -&gt; Interpreter\n/**\n * Turns a tree into a value. Holds a registry and nothing else; everything it reads arrives through the\n * ValueSource it is handed, which is what makes it unit-testable without a sheet.\n */\nfinal class Evaluator {\n    private final FunctionRegistry functions;\n    Evaluator(FunctionRegistry functions) { this.functions = functions; }\n\n    /** Evaluate one node. Never throws: every failure becomes an Err value. */\n    Value eval(Expr e, ValueSource src) {\n        if (e instanceof Lit l) return l.value();\n        if (e instanceof Ref r) return src.valueOf(r.ref());\n        if (e instanceof RangeRef rr) {                            // a range on its own is not a value\n            List&lt;CellRef&gt; cs = rr.cells();\n            return cs.size() == 1 ? src.valueOf(cs.get(0)) : new Err(&quot;#VALUE!&quot;);\n        }\n        if (e instanceof Bin b) return binary(b, src);\n        if (e instanceof Call c) {\n            SheetFunction f = functions.lookup(c.name());\n            if (f == null) return new Err(&quot;#NAME?&quot;);\n            List&lt;Value&gt; args = new ArrayList&lt;&gt;();\n            for (Expr a : c.args()) {\n                if (a instanceof RangeRef rr) for (CellRef cr : rr.cells()) args.add(src.valueOf(cr));\n                else args.add(eval(a, src));\n            }\n            try { return f.apply(args); }\n            catch (RuntimeException ex) { return new Err(&quot;#VALUE!&quot;); }   // a function written next year cannot take the sheet down\n        }\n        return new Err(&quot;#VALUE!&quot;);\n    }\n\n    private Value binary(Bin b, ValueSource src) {\n        Value l = eval(b.left(), src), r = eval(b.right(), src);\n        if (l instanceof Err e) return e;\n        if (r instanceof Err e) return e;\n        String op = b.op();\n        if (op.equals(&quot;&amp;&quot;)) return new Text(l.display() + r.display());\n        if (op.equals(&quot;=&quot;)) return bool(same(l, r));\n        if (op.equals(&quot;&lt;&gt;&quot;)) return bool(!same(l, r));\n        Double x = num(l), y = num(r);\n        if (x == null || y == null) return new Err(&quot;#VALUE!&quot;);\n        return switch (op) {\n            case &quot;+&quot; -&gt; new Num(x + y);\n            case &quot;-&quot; -&gt; new Num(x - y);\n            case &quot;*&quot; -&gt; new Num(x * y);\n            case &quot;/&quot; -&gt; y == 0 ? new Err(&quot;#DIV/0!&quot;) : new Num(x / y);\n            case &quot;&lt;&quot; -&gt; bool(x &lt; y);\n            case &quot;&gt;&quot; -&gt; bool(x &gt; y);\n            case &quot;&lt;=&quot; -&gt; bool(x &lt;= y);\n            case &quot;&gt;=&quot; -&gt; bool(x &gt;= y);\n            default -&gt; new Err(&quot;#VALUE!&quot;);\n        };\n    }\n    private static boolean same(Value a, Value b) {\n        Double x = num(a), y = num(b);\n        return x != null &amp;&amp; y != null ? x.doubleValue() == y.doubleValue() : a.display().equals(b.display());\n    }\n    /** A value as a number, or null if it is not one. Blank is 0; numeric text is coerced; an error is not a number. */\n    static Double num(Value v) {\n        if (v instanceof Num n) return n.v();\n        if (v instanceof Blank) return 0.0;\n        if (v instanceof Text t) { try { return Double.parseDouble(t.s().trim()); } catch (NumberFormatException e) { return null; } }\n        return null;\n    }\n    private static Value bool(boolean b) { return new Num(b ? 1 : 0); }\n}\n\n/**\n * One box. Three fields: what the user typed (the formula bar, and what an undo replays), the parsed tree,\n * and the cached value. The cache is why a read is one hash lookup and never evaluates anything.\n */\nfinal class Cell {\n    private final CellRef ref;\n    private String raw = &quot;&quot;;\n    private Expr expr = new Lit(Blank.IT);\n    private Value value = Blank.IT;\n    Cell(CellRef ref) { this.ref = ref; }\n    /** The address of this cell. */\n    CellRef ref() { return ref; }\n    /** What the user typed, verbatim. */\n    String raw() { return raw; }\n    /** The parsed tree of what the user typed. */\n    Expr expr() { return expr; }\n    /** The last computed value. Reads return this; nothing evaluates on a read. */\n    Value value() { return value; }\n    /** Store new text and its tree together, so the two can never disagree. */\n    void bind(String raw, Expr expr) { this.raw = raw; this.expr = expr; }\n    /** Store a freshly computed value. Only the sheet&#x27;s recalculation pass calls this. */\n    void setValue(Value v) { this.value = v; }\n}\n\n/**\n * Who reads whom, in both directions. Precedents (what this cell reads) answer &quot;would this edit make a\n * loop?&quot;; dependents (who reads this cell) answer &quot;who has to be recomputed?&quot;. It stores addresses only,\n * never Cell objects, so an edge to a cell nobody has typed into yet is perfectly legal.\n */\nfinal class DependencyGraph {\n    private final Map&lt;CellRef, Set&lt;CellRef&gt;&gt; precedents = new HashMap&lt;&gt;();\n    private final Map&lt;CellRef, Set&lt;CellRef&gt;&gt; dependents = new HashMap&lt;&gt;();\n\n    /** What this cell reads. */\n    Set&lt;CellRef&gt; precedentsOf(CellRef c) { return precedents.getOrDefault(c, Set.of()); }\n    /** Who reads this cell. */\n    Set&lt;CellRef&gt; dependentsOf(CellRef c) { return dependents.getOrDefault(c, Set.of()); }\n\n    /**\n     * Everything that would have to be recomputed if this cell changed: itself, then forward over dependents.\n     * One walk, two jobs -- it is also the set a new precedent must not be in, or the edit makes a loop.\n     */\n    Set&lt;CellRef&gt; affectedBy(CellRef from) {\n        Set&lt;CellRef&gt; seen = new LinkedHashSet&lt;&gt;();\n        Deque&lt;CellRef&gt; q = new ArrayDeque&lt;&gt;();\n        seen.add(from); q.add(from);\n        while (!q.isEmpty()) { CellRef c = q.poll(); for (CellRef d : dependentsOf(c)) if (seen.add(d)) q.add(d); }\n        return seen;\n    }\n\n    /**\n     * Point this cell at a new set of precedents. Old edges are removed first: the classic leak is a stale\n     * edge, where a cell keeps being recomputed by a cell it no longer reads.\n     */\n    void setPrecedents(CellRef cell, Set&lt;CellRef&gt; refs) {\n        for (CellRef old : precedentsOf(cell)) {\n            Set&lt;CellRef&gt; d = dependents.get(old);\n            if (d != null) { d.remove(cell); if (d.isEmpty()) dependents.remove(old); }\n        }\n        if (refs.isEmpty()) precedents.remove(cell); else precedents.put(cell, new LinkedHashSet&lt;&gt;(refs));\n        for (CellRef p : refs) dependents.computeIfAbsent(p, k -&gt; new LinkedHashSet&lt;&gt;()).add(cell);\n    }\n\n    /**\n     * Kahn&#x27;s algorithm restricted to the dirty set: each cell comes out exactly once, after every precedent\n     * of it that is also dirty. That is a correctness property, not a speed-up -- out of order, a cell reads\n     * a stale input. Throws if the set is not acyclic, which the cycle check has already made impossible.\n     */\n    List&lt;CellRef&gt; topoOrder(Set&lt;CellRef&gt; dirty) {\n        Map&lt;CellRef, Integer&gt; indeg = new HashMap&lt;&gt;();\n        for (CellRef c : dirty) { int n = 0; for (CellRef p : precedentsOf(c)) if (dirty.contains(p)) n++; indeg.put(c, n); }\n        Deque&lt;CellRef&gt; q = new ArrayDeque&lt;&gt;();\n        for (CellRef c : dirty) if (indeg.get(c) == 0) q.add(c);\n        List&lt;CellRef&gt; out = new ArrayList&lt;&gt;(dirty.size());\n        while (!q.isEmpty()) {\n            CellRef c = q.poll();\n            out.add(c);\n            for (CellRef d : dependentsOf(c)) if (dirty.contains(d) &amp;&amp; indeg.merge(d, -1, Integer::sum) == 0) q.add(d);\n        }\n        if (out.size() != dirty.size()) throw new IllegalStateException(&quot;the graph is not a DAG&quot;);\n        return out;\n    }\n\n    /** The chain of reads from `from` to `to` over dependents, for a readable cycle message. */\n    List&lt;CellRef&gt; path(CellRef from, CellRef to) {\n        Map&lt;CellRef, CellRef&gt; parent = new HashMap&lt;&gt;();\n        Deque&lt;CellRef&gt; q = new ArrayDeque&lt;&gt;();\n        q.add(from); parent.put(from, null);\n        while (!q.isEmpty()) {\n            CellRef c = q.poll();\n            if (c.equals(to)) break;\n            for (CellRef d : dependentsOf(c)) if (!parent.containsKey(d)) { parent.put(d, c); q.add(d); }\n        }\n        LinkedList&lt;CellRef&gt; out = new LinkedList&lt;&gt;();\n        for (CellRef c = to; c != null; c = parent.get(c)) out.addFirst(c);\n        return out;\n    }\n\n    /** How many edges the graph holds. A test uses it to prove a rejected edit left no trace. */\n    int edgeCount() { int n = 0; for (Set&lt;CellRef&gt; s : precedents.values()) n += s.size(); return n; }\n}\n\n/** Thrown when an edit would make a cell depend on itself. Carries the loop, so the message names the cells. */\nfinal class CircularReferenceException extends RuntimeException {\n    private final List&lt;CellRef&gt; path;\n    CircularReferenceException(List&lt;CellRef&gt; path) { super(&quot;circular reference: &quot; + join(path)); this.path = List.copyOf(path); }\n    /** The cells in the loop, in reading order. */\n    List&lt;CellRef&gt; path() { return path; }\n    private static String join(List&lt;CellRef&gt; p) {\n        StringBuilder sb = new StringBuilder();\n        for (CellRef c : p) { if (sb.length() &gt; 0) sb.append(&quot; -&gt; &quot;); sb.append(c); }\n        return sb.toString();\n    }\n}\n\n/** One cell moved: where, from what, to what. What a listener is told, after the lock is released. */\nrecord CellChange(CellRef ref, Value before, Value after) { }\n\n// &quot;the screen must repaint when a total changes&quot; -&gt; announce, without knowing what a screen is -&gt; Observer\n/** Anybody who wants to know that a value moved: a repaint, an autosave, a chart. One method, so a lambda works. */\n@FunctionalInterface\ninterface ChangeListener {\n    /** Called once per changed cell, after the edit has been committed and the lock released. */\n    void onChange(CellChange change);\n}\n\n/**\n * The sheet: the one object that owns the cells, the graph and the lock. Every edit is a transaction --\n * parse, cycle-check, commit the edges, recompute the affected subgraph -- and nothing is written until\n * every check has passed, so a rejected edit leaves the sheet exactly as it was.\n */\nfinal class Sheet {\n    private final Map&lt;CellRef, Cell&gt; cells = new HashMap&lt;&gt;();\n    private final Set&lt;CellRef&gt; removed = new HashSet&lt;&gt;();          // addresses deleted out of the grid: reads give #REF!\n    private final DependencyGraph graph = new DependencyGraph();\n    private final List&lt;ChangeListener&gt; listeners = new CopyOnWriteArrayList&lt;&gt;();\n    private final ReentrantReadWriteLock lock = new ReentrantReadWriteLock();\n    private Evaluator evaluator;\n    private Clock clock;\n    private long edits, lastEditMs;\n\n    /** A bare sheet with no functions. Use standard(), or configure() with your own registry. */\n    Sheet() { configure(new FunctionRegistry(), System::currentTimeMillis); }\n    /** A sheet with the seven built-in functions and the wall clock. */\n    static Sheet standard() { return standard(System::currentTimeMillis); }\n    /** A sheet with the built-ins and the clock you hand in, which is how a test pins NOW(). */\n    static Sheet standard(Clock clock) {\n        Sheet s = new Sheet();\n        s.configure(FunctionRegistry.standard(clock), clock);\n        return s;\n    }\n    /** Hand in the rules: which functions exist, and where time comes from. The sheet never builds either. */\n    void configure(FunctionRegistry functions, Clock clock) {\n        this.evaluator = new Evaluator(functions);\n        this.clock = clock;\n    }\n    /** Add a listener. Copy-on-write, so a repaint can subscribe while an edit is running. */\n    void addListener(ChangeListener l) { listeners.add(l); }\n\n    // ---------------- reads: one hash lookup, never an evaluation ----------------\n    /** The value in that box. O(1): the cached value, computed when something it reads last changed. */\n    Value get(String a1) { return get(CellRef.parse(a1)); }\n    /** The value at that address. */\n    Value get(CellRef ref) { lock.readLock().lock(); try { return read(ref); } finally { lock.readLock().unlock(); } }\n    /** What the user typed there: the formula bar, not the value. */\n    String raw(String a1) {\n        lock.readLock().lock();\n        try { Cell c = cells.get(CellRef.parse(a1)); return c == null ? &quot;&quot; : c.raw(); }\n        finally { lock.readLock().unlock(); }\n    }\n    /** How many boxes have ever been typed into. The grid is sparse: blanks cost nothing. */\n    int cellCount() { lock.readLock().lock(); try { return cells.size(); } finally { lock.readLock().unlock(); } }\n    /**\n     * Every address that has been typed into, in reading order. What a save, a repaint of the whole grid, or\n     * a structural edit (insert a row) walks; the grid is sparse, so this is the typed cells, not the plane.\n     */\n    List&lt;CellRef&gt; addresses() {\n        lock.readLock().lock();\n        try { List&lt;CellRef&gt; out = new ArrayList&lt;&gt;(cells.keySet()); Collections.sort(out); return out; }\n        finally { lock.readLock().unlock(); }\n    }\n    /** How many read-edges the graph holds. Used by a test to prove a refused edit changed nothing. */\n    int edgeCount() { lock.readLock().lock(); try { return graph.edgeCount(); } finally { lock.readLock().unlock(); } }\n    /** When the last committed edit happened, by the injected clock. */\n    long lastEditMs() { lock.readLock().lock(); try { return lastEditMs; } finally { lock.readLock().unlock(); } }\n    /** How many edits have been committed. */\n    long edits() { lock.readLock().lock(); try { return edits; } finally { lock.readLock().unlock(); } }\n\n    // ---------------- the one write path ----------------\n    /**\n     * Type text into a cell. Returns the cells that were recomputed, in the order they were recomputed, which\n     * is the proof that only the affected subgraph ran and that it ran in dependency order.\n     * Throws CircularReferenceException if the edit would make a loop, having written nothing.\n     */\n    List&lt;String&gt; set(String a1, String text) {\n        CellRef ref = CellRef.parse(a1);\n        Prepared p = prepare(text);                                 // 1. parse OUTSIDE the lock: it can throw\n        List&lt;CellChange&gt; changes = new ArrayList&lt;&gt;();\n        List&lt;String&gt; order;\n        lock.writeLock().lock();\n        try { order = commit(ref, p, changes); }\n        finally { lock.writeLock().unlock(); }\n        publish(changes);                                           // 5. the listeners hear AFTER the unlock\n        return order;\n    }\n\n    /**\n     * Read a number out of a cell, change it, and write it back -- as ONE step under ONE lock. get() then\n     * set() is two steps, and two typists in that gap lose an increment. This is the whole concurrency fix.\n     */\n    List&lt;String&gt; update(String a1, DoubleUnaryOperator f) {\n        CellRef ref = CellRef.parse(a1);\n        List&lt;CellChange&gt; changes = new ArrayList&lt;&gt;();\n        List&lt;String&gt; order;\n        lock.writeLock().lock();\n        try {\n            Double cur = Evaluator.num(read(ref));\n            if (cur == null) throw new IllegalStateException(a1 + &quot; is not a number: &quot; + read(ref).display());\n            order = commit(ref, prepare(new Num(f.applyAsDouble(cur)).display()), changes);\n        } finally { lock.writeLock().unlock(); }\n        publish(changes);\n        return order;\n    }\n\n    /** Empty the box: it becomes blank, and everything that reads it recomputes with a blank. */\n    List&lt;String&gt; clear(String a1) { return set(a1, &quot;&quot;); }\n\n    /**\n     * Take the address out of the grid altogether, as deleting a column does. Anything still pointing at it\n     * reads #REF!, until somebody types into that address again, which heals every dependent.\n     */\n    List&lt;String&gt; deleteCell(String a1) {\n        CellRef ref = CellRef.parse(a1);\n        List&lt;CellChange&gt; changes = new ArrayList&lt;&gt;();\n        List&lt;String&gt; order = new ArrayList&lt;&gt;();\n        lock.writeLock().lock();\n        try {\n            Set&lt;CellRef&gt; affected = graph.affectedBy(ref);\n            graph.setPrecedents(ref, Set.of());\n            cells.remove(ref);\n            removed.add(ref);\n            edits++; lastEditMs = clock.nowMs();\n            recompute(graph.topoOrder(affected), order, changes);\n        } finally { lock.writeLock().unlock(); }\n        publish(changes);\n        return order;\n    }\n\n    // ---------------- the transaction, step by step ----------------\n    /** Text, its tree, and the cells that tree reads. Computed before the lock is taken: this part can throw. */\n    private record Prepared(String text, Expr expr, Set&lt;CellRef&gt; refs) { }\n\n    private Prepared prepare(String text) {\n        Expr parsed;\n        try { parsed = Parser.parseInput(text); }\n        catch (RuntimeException syntax) { parsed = new Lit(new Err(&quot;#PARSE!&quot;)); }   // a typo is a value, not a crash\n        Set&lt;CellRef&gt; refs = new LinkedHashSet&lt;&gt;();\n        parsed.collectRefs(refs);                                   // a range over the cap throws here: the sheet is untouched\n        return new Prepared(text, parsed, refs);\n    }\n\n    /** Steps 2 to 4, with the write lock held. Returns the recalculation order; fills `changes` for the listeners. */\n    private List&lt;String&gt; commit(CellRef ref, Prepared p, List&lt;CellChange&gt; changes) {\n        Set&lt;CellRef&gt; affected = graph.affectedBy(ref);              // 2. one walk: the dirty set AND the cycle test\n        for (CellRef pre : p.refs())\n            if (affected.contains(pre))                             //    a new precedent that already reads me is a loop\n                throw new CircularReferenceException(closed(graph.path(ref, pre), ref));\n        graph.setPrecedents(ref, p.refs());                         // 3. only now commit: edges, then text and tree\n        removed.remove(ref);\n        cells.computeIfAbsent(ref, Cell::new).bind(p.text(), p.expr());\n        edits++; lastEditMs = clock.nowMs();\n        List&lt;String&gt; order = new ArrayList&lt;&gt;(affected.size());\n        recompute(graph.topoOrder(affected), order, changes);       // 4. each affected cell once, after its inputs\n        return order;\n    }\n\n    private void recompute(List&lt;CellRef&gt; order, List&lt;String&gt; names, List&lt;CellChange&gt; changes) {\n        for (CellRef c : order) {\n            Cell cell = cells.get(c);\n            if (cell == null) continue;                             // an address somebody points at but nobody typed into\n            names.add(c.a1());\n            Value before = cell.value();\n            Value after = evaluator.eval(cell.expr(), this::read);\n            if (!after.equals(before)) { cell.setValue(after); changes.add(new CellChange(c, before, after)); }\n        }\n    }\n\n    /** The value at an address, with the lock already held. Deleted addresses are #REF!, untyped ones are blank. */\n    private Value read(CellRef ref) {\n        if (removed.contains(ref)) return new Err(&quot;#REF!&quot;);\n        Cell c = cells.get(ref);\n        return c == null ? Blank.IT : c.value();\n    }\n\n    /** Tell the listeners, each in its own try/catch, so a broken repaint cannot break an edit that already happened. */\n    private void publish(List&lt;CellChange&gt; changes) {\n        for (CellChange c : changes)\n            for (ChangeListener l : listeners) {\n                try { l.onChange(c); } catch (RuntimeException ignored) { /* a listener is never allowed to fail an edit */ }\n            }\n    }\n\n    private static List&lt;CellRef&gt; closed(List&lt;CellRef&gt; path, CellRef start) {\n        List&lt;CellRef&gt; out = new ArrayList&lt;&gt;(path);\n        out.add(start);\n        return out;\n    }\n}\n\n/** The demo: the model, an edit rippling in order, a refused cycle, errors as values, and the race made visible. */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        Sheet sheet = Sheet.standard();\n\n        System.out.println(&quot;1. MODEL -- literals, formulas, a range, a branch, an error&quot;);\n        sheet.set(&quot;A1&quot;, &quot;10&quot;); sheet.set(&quot;A2&quot;, &quot;20&quot;); sheet.set(&quot;A3&quot;, &quot;=A1+A2&quot;);\n        sheet.set(&quot;B1&quot;, &quot;=SUM(A1:A3)&quot;); sheet.set(&quot;B2&quot;, &quot;=IF(B1&gt;50,\\&quot;BIG\\&quot;,\\&quot;SMALL\\&quot;)&quot;);\n        sheet.set(&quot;C1&quot;, &quot;=A1/0&quot;); sheet.set(&quot;C2&quot;, &quot;=SUM(C1,1)&quot;);\n        for (String r : new String[] { &quot;A3&quot;, &quot;B1&quot;, &quot;B2&quot;, &quot;C1&quot;, &quot;C2&quot; })\n            System.out.println(&quot;   &quot; + r + &quot;  &quot; + pad(sheet.raw(r)) + &quot; -&gt; &quot; + sheet.get(r).display());\n        System.out.println(&quot;   cells stored = &quot; + sheet.cellCount() + &quot;, read-edges = &quot; + sheet.edgeCount() + &quot; (the grid is sparse)&quot;);\n\n        System.out.println(&quot;2. EDIT A1 -&gt; 25: only the affected cells recompute, and in dependency order&quot;);\n        System.out.println(&quot;   recalc order = &quot; + sheet.set(&quot;A1&quot;, &quot;25&quot;));\n        System.out.println(&quot;   A3=&quot; + sheet.get(&quot;A3&quot;).display() + &quot;  B1=&quot; + sheet.get(&quot;B1&quot;).display()\n                + &quot;  B2=&quot; + sheet.get(&quot;B2&quot;).display() + &quot;   (A2 never appeared, and is still &quot; + sheet.get(&quot;A2&quot;).display() + &quot;)&quot;);\n\n        System.out.println(&quot;3. CYCLE: A1 = =A3 is refused, and the sheet is untouched&quot;);\n        String rawBefore = sheet.raw(&quot;A1&quot;); int edgesBefore = sheet.edgeCount();\n        try { sheet.set(&quot;A1&quot;, &quot;=A3&quot;); }\n        catch (CircularReferenceException e) { System.out.println(&quot;   &quot; + e.getMessage()); }\n        System.out.println(&quot;   A1 raw=&quot; + sheet.raw(&quot;A1&quot;) + &quot; value=&quot; + sheet.get(&quot;A1&quot;).display()\n                + &quot;  unchanged=&quot; + rawBefore.equals(sheet.raw(&quot;A1&quot;)) + &quot;  edges=&quot; + sheet.edgeCount() + &quot; (was &quot; + edgesBefore + &quot;)&quot;);\n\n        System.out.println(&quot;4. BAD INPUT is a value, not a crash -- and it heals&quot;);\n        sheet.set(&quot;D1&quot;, &quot;=1+&quot;); sheet.set(&quot;D2&quot;, &quot;=NOPE(1)&quot;);\n        sheet.set(&quot;E1&quot;, &quot;hello&quot;); sheet.set(&quot;E2&quot;, &quot;=E1*2&quot;);\n        System.out.println(&quot;   D1=&quot; + sheet.get(&quot;D1&quot;).display() + &quot;  D2=&quot; + sheet.get(&quot;D2&quot;).display()\n                + &quot;  E2=&quot; + sheet.get(&quot;E2&quot;).display());\n        sheet.set(&quot;E1&quot;, &quot;7&quot;);\n        System.out.println(&quot;   after E1 = 7, E2 = &quot; + sheet.get(&quot;E2&quot;).display() + &quot; (the error was a cached value, and it went away)&quot;);\n\n        System.out.println(&quot;5. DELETE a referenced cell -&gt; #REF!, and typing into it again heals the dependents&quot;);\n        sheet.deleteCell(&quot;A2&quot;);\n        System.out.println(&quot;   A3=&quot; + sheet.get(&quot;A3&quot;).display() + &quot;  B1=&quot; + sheet.get(&quot;B1&quot;).display());\n        sheet.set(&quot;A2&quot;, &quot;20&quot;);\n        System.out.println(&quot;   A2 back -&gt; A3=&quot; + sheet.get(&quot;A3&quot;).display() + &quot;  B1=&quot; + sheet.get(&quot;B1&quot;).display());\n\n        System.out.println(&quot;6. LISTENERS hear after the unlock, and a broken one is harmless&quot;);\n        List&lt;String&gt; heard = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        sheet.addListener(c -&gt; { throw new RuntimeException(&quot;a broken chart&quot;); });\n        sheet.addListener(c -&gt; heard.add(c.ref() + &quot;:&quot; + c.before().display() + &quot;-&gt;&quot; + c.after().display()));\n        sheet.set(&quot;A1&quot;, &quot;30&quot;);\n        System.out.println(&quot;   &quot; + heard);\n\n        System.out.println(&quot;7. COST of one edit, measured: these are the numbers page 02 quotes&quot;);\n        Sheet small = Sheet.standard();\n        small.set(&quot;A1&quot;, &quot;10&quot;); small.set(&quot;A2&quot;, &quot;20&quot;); small.set(&quot;A3&quot;, &quot;=A1+A2&quot;); small.set(&quot;B1&quot;, &quot;=A3*2&quot;);\n        System.out.println(&quot;   three cells recomputed:  &quot; + perEdit(small, 50_000) + &quot; us inside the write lock&quot;);\n        Sheet column = Sheet.standard();\n        column.set(&quot;A1&quot;, &quot;1&quot;);\n        for (int i = 1; i &lt;= 100; i++) column.set(&quot;B&quot; + i, &quot;=A1+&quot; + i);\n        System.out.println(&quot;   a hundred-cell column:   &quot; + perEdit(column, 20_000) + &quot; us inside the write lock&quot;);\n        Sheet one = Sheet.standard();\n        one.set(&quot;A1&quot;, &quot;5&quot;);\n        for (int i = 0; i &lt; 200_000; i++) one.get(&quot;A1&quot;);\n        long t0 = System.nanoTime();\n        for (int i = 0; i &lt; 1_000_000; i++) one.get(&quot;A1&quot;);\n        System.out.println(&quot;   and one read:            &quot; + (System.nanoTime() - t0) / 1_000_000 + &quot; ns (a hash lookup under the read lock)&quot;);\n\n        System.out.println(&quot;8. THE RACE: eight typists, 250 increments each, on one cell&quot;);\n        System.out.println(&quot;   get() then set()  -&gt; D1 = &quot; + increments(false) + &quot;   (should be 2000)&quot;);\n        System.out.println(&quot;   update(), one lock -&gt; D1 = &quot; + increments(true) + &quot;   (should be 2000)&quot;);\n\n        System.out.println(&quot;9. THE RACE, the other shape: fifty threads, fifty different cells, one total&quot;);\n        Sheet big = Sheet.standard();\n        for (int i = 1; i &lt;= 50; i++) big.set(&quot;A&quot; + i, &quot;0&quot;);\n        big.set(&quot;B1&quot;, &quot;=SUM(A1:A50)&quot;);\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; fs = new ArrayList&lt;&gt;();\n        for (int i = 1; i &lt;= 50; i++) {\n            final int n = i;\n            fs.add(pool.submit(() -&gt; { go.await(); return big.set(&quot;A&quot; + n, String.valueOf(n)); }));\n        }\n        go.countDown();\n        for (Future&lt;?&gt; f : fs) f.get();\n        pool.shutdown();\n        double total = ((Num) big.get(&quot;B1&quot;)).v();\n        System.out.println(&quot;   B1 = &quot; + big.get(&quot;B1&quot;).display() + &quot; (must be 1275); every formula consistent = &quot; + (total == 1275));\n        if (total != 1275) throw new AssertionError(&quot;the sheet lost an update&quot;);\n    }\n\n    /** Microseconds for one edit of A1, after a warm-up long enough that the JIT has compiled the write path. */\n    private static double perEdit(Sheet s, int n) {\n        for (int

.k{color:#c792ea} .s{color:#c3e88d} .c{color:#5c6773;font-style:italic} .n{color:#f78c6c} .t{color:#82aaff}
.nav{display:flex;gap:10px;padding:0 22px 24px} .nav button{background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit} .nav button.pri{background:var(--acc);color:#04211a;border-color:var(--acc);font-weight:600}

.nd.iface rect{stroke-dasharray:4 3} .nd.enum rect{rx:14} .nd{opacity:0;transition:opacity .3s} .nd.seen{opacity:.45} .nd.cur{opacity:1} .nd.cur rect{stroke:var(--acc);stroke-width:1.8;fill:#12302a}

.kind{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:2px 6px;white-space:nowrap} .ans table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0} .ans th,.ans td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} .ans th{color:var(--muted);font-weight:500} .ans .ed{margin:10px 0} .say2{margin:8px 0 0;padding:8px 12px;background:#132a24;border-left:3px solid var(--acc);border-radius:0 6px 6px 0} .say2 b{color:var(--acc)}
.prompt{background:var(--bg3);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 6px 6px 0;font-style:italic;margin-bottom:10px}
details{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:10px} summary{cursor:pointer;color:var(--acc2);font-weight:600} a{color:var(--acc)}

<div class="top"><h1>Spreadsheet</h1><span class="sub">LLD &middot; Java &middot; OpenJDK 21: demo, 9 failure-test blocks and two races pass</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Design a spreadsheet. A user types into a cell by its address &mdash; \"A1\" &mdash; and what they type is either a value or a formula like <code>=SUM(A1:A3)*2</code>. When a cell changes, everything that reads it has to change too. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>A grid of boxes. Each box is named by an address like B7, and holds either something the user typed &mdash; a number, some text &mdash; or an instruction: a formula that reads other boxes and produces a number. The instruction has to be obeyed <i>again</i> every time one of the boxes it reads changes, which is the whole product: somebody types 25 into one box and a total three screens away moves on its own. Formulas nest and chain, so one edit can move a hundred boxes, and they have to move in the right order &mdash; a cell computed before its inputs shows a number that was true a moment ago and is now a lie. A formula can also be wrong: divide by zero, add a word to a number, or, worst of all, read itself. Several people can be typing into the same sheet at the same moment, so the one thing that must always be true is that a reader never sees a total that disagrees with the cells under it.</p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: classes that compile and run, with a <code>main</code> that types into a few cells and prints the values that changed. The interviewer is watching for, in this order: the questions you ask before typing (what a cell can hold, and what happens to a circular reference, are the first two); which classes exist and which one owns the cells; one edit end to end; what happens when two people type at the same instant; where the rule that will change (which functions exist) lives, so MEDIAN is a new class and not an edit; and what the sheet looks like after an edit that had to be refused. Then the twists: inserting a row, copying a formula down, undo, #CYCLE! instead of a refusal, a million cells, persistence.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 348\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"88\" y=\"61\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">type</text><g transform=\"translate(175 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">somebody types into B3</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a number, text, or =B1+B2</text></g><path d=\"M415 57 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">parse it into a tree</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the tree knows what it reads</text></g><path d=\"M675 57 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">would this make a loop?</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one walk, before any write</text></g><path d=\"M935 57 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 30)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">recompute what it affects</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">in order, each cell once</text></g><text x=\"88\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">delete</text><g transform=\"translate(175 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a cell leaves the grid</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a column was removed</text></g><path d=\"M415 192 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the address is gone</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">not blanked: gone</text></g><path d=\"M675 192 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">everyone pointing at it</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads #REF!, not a silent 0</text></g><path d=\"M935 192 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 165)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">type there again</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">every dependent heals</text></g><path d=\"M815 84 V95\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(650 95)\"><rect width=\"340\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"170.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a loop: not one cell is written</text></g><text x=\"88\" y=\"266\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><text x=\"175\" y=\"266\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">get(\"B7\") -- the cached value, evaluating nothing.   raw(\"B7\") -- the text the user typed.   addresses() -- every box that has one.</text><text x=\"88\" y=\"296\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">bump</text><text x=\"175\" y=\"296\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">update(\"C1\", v -&gt; v + 1) -- read the number, change it, write it back, inside ONE lock. get() then set() is two steps.</text><text x=\"615\" y=\"332\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">several people type at once: parse, cycle-check, commit and recompute are ONE step, or two typists lose each other's work</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Which formulas &mdash; arithmetic and a few functions, or the whole Excel grammar?</td><td><code>+ - * / &amp;</code>, comparisons, and SUM / AVERAGE / MIN / MAX / COUNT / IF</td><td>The size of the parser, and the function registry (moves 2, 3)</td></tr><tr><td>What can a cell hold? Only numbers?</td><td>A number, text, blank, or an error code</td><td>Errors are values, not exceptions &mdash; the decision everything rests on (moves 1, 9)</td></tr><tr><td>Recalculate automatically on every edit, or on a button?</td><td>Automatically, and synchronously</td><td>The dependency graph and the topological order (moves 5, 6)</td></tr><tr><td>A circular reference: refuse the edit, or paint #CYCLE! on the loop?</td><td>Refuse it, like Excel</td><td>The check runs as a dry run, before anything is written (move 6)</td></tr><tr><td>Can two people type into one sheet at the same time?</td><td>Yes</td><td>One lock per sheet, around the <i>whole</i> edit (moves 4, 7)</td></tr><tr><td>Thousands of cells, or millions?</td><td>Sparse: only the boxes somebody touched are stored</td><td>A map, not an array; blank is the absence of an entry (move 5)</td></tr><tr><td>Inserting and deleting rows, and dragging a formula down a column?</td><td>Yes, and <code>$A$1</code> stays put when a formula is copied</td><td>Whether a formula is a tree you can rewrite or a string you cannot (moves 1, 12)</td></tr><tr><td>A workbook with <code>=Sales!A1</code>, persistence, a real collaborative merge?</td><td>Out of scope, named</td><td>Each is one of the five twist moves (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li>Type a literal into a cell by address: a number, some text, or nothing.</li>\n<li>Type a formula: <code>=A1+B2*2</code>, <code>=SUM(A1:A10)</code>, <code>=IF(B1&gt;50,\"BIG\",\"SMALL\")</code>.</li>\n<li>Every cell that reads a changed cell updates by itself, at once.</li>\n<li>Read a cell's value, and read the text the user typed there.</li>\n<li>Refuse an edit that would make a cell depend on itself, and name the cells in the loop.</li>\n<li>A broken cell shows #DIV/0!, #VALUE!, #NAME?, #REF! or #PARSE! and does not break its neighbours.</li>\n<li>Delete a cell, clear a cell, and add a new function without opening the engine.</li>\n<li>Insert a row, delete a row, and copy a formula down a column: every formula that moves still means the same thing.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Several people typing at once: no edit may be lost, and nobody may read a total that disagrees with the cells under it.</li>\n<li>Reading a cell is O(1): the value is cached, and a read never evaluates anything.</li>\n<li>An edit costs what it affects, not the size of the sheet.</li>\n<li>Every affected cell is recomputed exactly once, and after everything it reads.</li>\n<li>New functions and new policies are new classes, never edits to the engine.</li>\n<li>Nothing half-done: a refused edit leaves the same cells, the same values and the same number of edges.</li>\n<li>In memory, one process, no persistence (say it; a follow-up adds it).</li></ul></div></div>\n<div class=\"move\"><h3>One afternoon, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">14:02  B7 = =SUM(B1:B6)</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">B1..B6 are blank except B2 = 40</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">B7 = 40, and six read-edges appear</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">two cells stored: the grid is sparse</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">14:05  B2 = 120</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the affected set is {B2, B7}</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">B1 and B3..B6 are never evaluated</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">recalc order = [B2, B7];  B7 = 120</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">14:06  B7 = =B7+1</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the forward walk finds B7 reads B7</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">circular reference: B7 -> B7</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">same text, same value, same edges</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">14:07  two typists on C1</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">both would read 10 and write 11</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the write lock makes it one step</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the run: 2000 with update(), ~1100 without</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> a cell holds a number, text, blank or an error, and an error is a <i>value</i> so one broken cell cannot abort the recalculation of forty others; a formula is parsed once into a tree and kept, because it has to be obeyed again; recalculation walks a dependency graph, not the sheet; a circular reference is refused before anything is written; the grid is sparse and in memory, one process. Named as out of scope: persistence, several sheets, real collaborative merging, lazy recalculation &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD (parking lot, elevator, Splitwise) and the class diagram, the lock, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On this problem moves 5 and 6 are the ones that decide whether you pass: the two edge maps, and the order in which one edit parses, checks, commits and recomputes.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 225\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a USER types into a CELL at an ADDRESS; the text is a VALUE or a FORMULA; a formula reads other cells, so a SHEET must know who reads whom</text><g transform=\"translate(10 110)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CellRef</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">an address: (row, col)</text></g><path d=\"M90 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(184 110)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Cell</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">raw, tree, cached value</text></g><path d=\"M264 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(358 110)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Value</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">number|text|err|blank</text></g><path d=\"M438 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(532 110)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Expr</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the formula, parsed once</text></g><path d=\"M612 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(706 110)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DependencyGraph</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads, both directions</text></g><path d=\"M786 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(880 110)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Sheet</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">cells, graph, one lock</text></g><path d=\"M960 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1054 110)\"><rect width=\"160\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"80.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SheetFunction</text><text x=\"80.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M1134 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it holds state of its own, so it becomes a class.   dashed = a plain value, or a calculation with no state at all</text><text x=\"615\" y=\"210\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and one noun did NOT become a class: the recalculated total. It is a cached value on a cell, not a thing to store twice.</text></svg></div><div class=\"move\"><p>Reading the paragraph again: a <b>user</b> types into a <b>cell</b> at an <b>address</b>; what they typed is a <b>value</b> or a <b>formula</b>; a formula reads other cells, so the <b>sheet</b> has to know <b>who reads whom</b>. A cell holds three things that all change &mdash; the text the user typed, the parsed formula, and the last computed value &mdash; so it is a class. An address is two numbers that never change once made, so it is a record, and being a record it is equal and hashes the same for the same box, which is what lets the whole graph be keyed by address. A value is a closed set of four: number, text, error, blank &mdash; and an <i>error is a value</i>, not an exception, which is the decision the rest of the design leans on. A formula is a tree with state, so a class. Who-reads-whom is two maps that change on every edit, so a class of its own. A function has no state at all, so it is an interface. One noun did not become a class: the recalculated total, which is a cached value on a cell and not a thing to store twice.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">turn text into a tree</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M350 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Parser  (owns no state: pure)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M820 46 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 24)\"><rect width=\"310\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Parser.parseInput(text)</text><text x=\"155.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 80)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">turn a tree into a value</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M350 102 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 80)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Evaluator  (owns the registry)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M820 102 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 80)\"><rect width=\"310\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eval(expr, valueSource)</text><text x=\"155.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 136)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">know who reads whom</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M350 158 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 136)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">DependencyGraph  (owns two maps)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M820 158 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 136)\"><rect width=\"310\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">graph.affectedBy(ref)</text><text x=\"155.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 192)\"><rect width=\"320\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">type into a cell</text><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M350 214 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 192)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Sheet  (owns cells, graph, lock)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M820 214 H890\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(890 192)\"><rect width=\"310\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"155.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">sheet.set(\"B3\", \"120\")</text><text x=\"155.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the verb whose state is spread over three classes goes to the one that owns all three: the sheet is the orchestrator</text><text x=\"615\" y=\"287\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and \"recalculate\" is not a fifth verb: it is the second half of set(), which is exactly why an edit can never half-happen</text></svg></div><div class=\"move\"><p>\"Turn text into a tree\" touches nothing at all: characters in, nodes out, so it belongs to a pure <code>Parser</code> and is a static method. \"Turn a tree into a value\" needs the function registry and a way to look up a cell, so it belongs to an <code>Evaluator</code> &mdash; and the way it looks up a cell is a one-method <code>ValueSource</code> handed in, not the sheet, which is why the evaluator can be unit-tested with a HashMap. \"Know who reads whom\" touches the two edge maps, so it belongs to the thing that owns them: <code>graph.affectedBy(ref)</code>. \"Type into a cell\" touches the cells map, the graph and the lock at once; only the sheet sees all three, so <code>sheet.set(\"B3\", \"120\")</code> is the orchestrator. And notice what is <i>not</i> a fifth verb: recalculate. It is the second half of <code>set</code>, which is exactly why an edit can never half-happen &mdash; there is no way to call it on its own.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 340\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 84)\"><rect width=\"220\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Sheet</text><text x=\"110.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(functions, clock)</text></g><path d=\"M250 129 H330 V46 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 24)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SheetFunction</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">SUM, AVERAGE, MIN, MAX, COUNT, IF</text></g><g transform=\"translate(730 24)\"><rect width=\"480\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SumFunction / IfFunction / MedianFunction / IfErrorFunction</text><text x=\"240.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what can be handed in</text></g><path d=\"M730 46 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 129 H330 V106 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 84)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ValueSource</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where a reference's value comes from</text></g><g transform=\"translate(730 84)\"><rect width=\"480\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the sheet passes this::read; a test passes a HashMap lambda</text><text x=\"240.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what can be handed in</text></g><path d=\"M730 106 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 129 H330 V166 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 144)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ChangeListener</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a repaint, an autosave, a chart</text></g><g transform=\"translate(730 144)\"><rect width=\"480\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">any lambda, called after the unlock, in a try/catch</text><text x=\"240.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what can be handed in</text></g><path d=\"M730 166 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 129 H330 V226 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 204)\"><rect width=\"290\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"145.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"145.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">where NOW() gets the time</text></g><g transform=\"translate(730 204)\"><rect width=\"480\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"240.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">System::currentTimeMillis, or () -&gt; 1_700_000_000_000L</text><text x=\"240.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">what can be handed in</text></g><path d=\"M730 226 H690\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"288\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The sheet never builds a function, so MEDIAN is a new class and one register() line</text><text x=\"615\" y=\"308\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one base class holds what functions share: NumericFunction propagates errors and skips blanks, so SUM and MIN never write that code.</text><text x=\"615\" y=\"328\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">IF and COUNT decline it on purpose &mdash; they must SEE an error or a blank to do their job. That is the Template Method, and its opt-out.</text></svg></div><div class=\"move\"><p>Four things will change under you: which functions exist (SUM today, MEDIAN in four minutes), where a reference's value comes from (the real sheet in production, a HashMap in a unit test), who is told that a cell moved (a repaint today, an autosave and a chart later), and where time comes from, the moment somebody writes <code>=NOW()</code>. Each becomes a one-method interface the sheet is <i>given</i> in <code>configure()</code> and never builds. This is where the patterns come from, not the other way round: a swappable rule behind an interface is <b>Strategy</b>; a sheet that announces \"this cell moved\" without knowing what a screen is, is <b>Observer</b>. And there is a second, quieter one here. Most functions want the same plumbing &mdash; an error argument comes straight back out, blanks are skipped, numeric text is coerced &mdash; so that lives once in an abstract <code>NumericFunction</code> and SUM only writes the arithmetic: <b>Template Method</b>. IF and COUNT decline it deliberately, because they are the two that must <i>see</i> an error or a blank to do their job. A base class with a documented opt-out is a design, not an accident.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 255\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 30)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Ravi types</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads C1 = 10</text></g><g transform=\"translate(30 110)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Meera types</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">reads C1 = 10</text></g><g transform=\"translate(350 70)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">C1 = 10</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">then both write 11</text></g><path d=\"M220 52 H350 V70\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M220 132 H350 V114\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"285\" y=\"40\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">get()</text><text x=\"285\" y=\"160\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">get()</text><rect x=\"580\" y=\"20\" width=\"290\" height=\"140\" rx=\"6\" fill=\"none\" stroke=\"#ff6b6b\" stroke-dasharray=\"4 3\"/><text x=\"725\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ff6b6b\">the gap</text><text x=\"725\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">both read 10, both write 11</text><text x=\"725\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">one increment simply vanishes</text><text x=\"725\" y=\"115\" text-anchor=\"middle\" font-size=\"11\" fill=\"#ff6b6b\">a real run: about 1100 of 2000</text><text x=\"725\" y=\"145\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--text)\">fix: read and write as ONE step</text><g transform=\"translate(900 40)\"><rect width=\"300\" height=\"100\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"44.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Sheet: the write lock</text><text x=\"150.0\" y=\"60.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">parse, check, commit, recompute</text></g><text x=\"1050\" y=\"165\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the lock lives where the shared state lives</text><text x=\"615\" y=\"195\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one lock per SHEET, not per cell: an edit publishes many cells at once, and a reader who saw half of them</text><text x=\"615\" y=\"215\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">would be looking at an arithmetically impossible sheet &mdash; a total that disagrees with the column under it</text><text x=\"615\" y=\"240\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and it is a READ-write lock, because a repaint reads hundreds of cells and computes nothing: readers never wait for each other</text></svg></div><div class=\"move\"><p>Two collaborators type into the same cell. Both read ten, both add one, both write eleven: one increment simply vanishes, and nobody notices, because eleven is a perfectly plausible number. The code in this page measures it &mdash; eight threads adding one to a cell two hundred and fifty times each lands somewhere near 1100 instead of 2000 when the read and the write are two calls. So reading a cell and writing it must be one step, in the class that owns the cells: the sheet. And the lock is around the <i>whole edit</i>, not one cell, which is the part candidates get wrong. One edit publishes many cells; a reader allowed in halfway through would see a total that disagrees with the column under it, an arithmetically impossible sheet. Finally, it is a read-<i>write</i> lock rather than a plain one, for a reason particular to this problem: a repaint reads hundreds of cells and computes nothing, so readers must be able to run together and only the rare writer is exclusive.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"400\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what is in B7, right now?</text><text x=\"200.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M430 37 H480\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(480 18)\"><rect width=\"490\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"245.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;CellRef, Cell&gt;, sparse</text><text x=\"245.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 37 H1020\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1020 18)\"><rect width=\"180\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 64)\"><rect width=\"400\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">who has to recompute when B7 moves?</text><text x=\"200.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M430 83 H480\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(480 64)\"><rect width=\"490\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"245.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">dependents: Map&lt;ref, Set&lt;ref&gt;&gt;</text><text x=\"245.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 83 H1020\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1020 64)\"><rect width=\"180\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(affected)</text></g><g transform=\"translate(30 110)\"><rect width=\"400\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what does B7 read?</text><text x=\"200.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M430 129 H480\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(480 110)\"><rect width=\"490\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"245.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">precedents: Map&lt;ref, Set&lt;ref&gt;&gt;</text><text x=\"245.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 129 H1020\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1020 110)\"><rect width=\"180\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 156)\"><rect width=\"400\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">which function is called SUM?</text><text x=\"200.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M430 175 H480\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(480 156)\"><rect width=\"490\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"245.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Map&lt;String, SheetFunction&gt;</text><text x=\"245.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 175 H1020\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1020 156)\"><rect width=\"180\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 202)\"><rect width=\"400\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">in what order do they recompute?</text><text x=\"200.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M430 221 H480\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(480 202)\"><rect width=\"490\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"245.0\" y=\"13.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Kahn over the affected set only</text><text x=\"245.0\" y=\"29.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 221 H1020\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1020 202)\"><rect width=\"180\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(D + edges)</text></g><text x=\"615\" y=\"265\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the two edge maps are written by ONE method, and it deletes the old edges before adding the new ones.</text><text x=\"615\" y=\"285\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">Forget that and you get the classic leak: a cell that keeps recomputing off a cell it no longer reads.</text></svg></div><div class=\"move\"><p>\"What is in B7?\" is a map from address to cell, and it is sparse &mdash; a real sheet is mostly empty, so a blank cell is the absence of an entry rather than an allocated object. A Cell is a handful of fields, call it a hundred bytes, so a hundred thousand typed cells is about ten megabytes and the million blank ones around them cost nothing. \"Who has to recompute when B7 moves?\" is a map from address to the set of addresses that read it. \"What does B7 read?\" is the same map the other way round. Keeping both directions is the decision that makes an edit cheap: deriving the dependents on demand would mean scanning every formula in the sheet on every keystroke, which is how an edit becomes O(cells) instead of O(affected). The one subtlety, and the classic leak: the two edge maps are written by a single method, and it deletes the old edges before it adds the new ones. Forget that and a cell that used to read A1 keeps being recomputed every time A1 changes, forever, quietly.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 258\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"180\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TYPED</text><text x=\"90.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">text in the box</text></g><path d=\"M210 45 H265\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(265 24)\"><rect width=\"180\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">PARSED</text><text x=\"90.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a tree, and its reads</text></g><path d=\"M355 66 V108\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(265 108)\"><rect width=\"180\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">COMMITTED</text><text x=\"90.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">edges, then values</text></g><path d=\"M265 45 V180 H216\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(30 160)\"><rect width=\"180\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"90.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">REFUSED</text><text x=\"90.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the loop: nothing written</text></g><path d=\"M445 118 H495 V146 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"505\" y=\"168\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">a precedent changed -&gt; recompute, not re-parse</text><rect x=\"530\" y=\"16\" width=\"680\" height=\"140\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"870\" y=\"38\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the order of one edit, and why it is this order</text><text x=\"545\" y=\"62\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">1  parse the text into a tree -- outside the lock, and nothing has been written</text><text x=\"545\" y=\"82\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">2  take the write lock; walk FORWARD from the cell over dependents: one walk</text><text x=\"545\" y=\"102\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--acc)\">3  is any new precedent in that set? then it is a loop: throw. Nothing was touched</text><text x=\"545\" y=\"122\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">4  only now commit: rewire the edges, then store the text and the tree</text><text x=\"545\" y=\"142\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--text)\">5  recompute that same set in topological order, once each; unlock; then tell the listeners</text><text x=\"615\" y=\"222\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">the walk that finds the cycle IS the dirty set, because changing what a cell READS cannot change who reads IT.</text><text x=\"615\" y=\"244\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">So there is nothing to roll back: a refused edit leaves the same cells, the same values and the same number of edges.</text></svg></div><div class=\"move\"><p>One edit goes TYPED, then PARSED, then either COMMITTED or REFUSED &mdash; and the interesting transition is the one candidates skip: parsing succeeding does not mean the edit is accepted, because the cycle check sits between them. Writing the states down forces the order. Parse the text into a tree first, outside the lock, because parsing is the part that can throw and nothing may be written when it does. Take the write lock. Walk forward from the edited cell over the dependents map to get everything that would have to recompute. Now the check: if any cell the new formula reads is already <i>in</i> that set, then that cell reads this one and this one is about to read it &mdash; a loop &mdash; so throw, having touched nothing. Only then commit: rewire the edges, store the text and the tree, recompute that same set in topological order, unlock, and tell the listeners. Two things are worth saying out loud. The walk that finds the cycle <i>is</i> the dirty set, because changing what a cell reads cannot change who reads it. And because the check is a dry run, there is no rollback anywhere in this code: a refused edit leaves the same cells, the same values and the same number of edges, which is a test you can run.</p></div><div class=\"move\"><h3>Move 7: yes, the lock makes one sheet's edits happen one at a time. Ask for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 330\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"560\" height=\"168\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside the write lock: about one microsecond</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">one forward walk over dependents: the affected set</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one set lookup per new precedent: the cycle test</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">rewire: delete the old edges, add the new ones</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">Kahn over the affected set, then one eval per cell</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">a typical edit affects three cells: 0.9 us measured</text><text x=\"14\" y=\"126\" font-size=\"10.5\" fill=\"var(--muted)\">a hundred-cell column: 11.5 us measured</text></g><path d=\"M590 104 H650\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"620\" y=\"94\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--acc)\">unlock</text><g transform=\"translate(650 20)\"><rect width=\"550\" height=\"168\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"275.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside it: milliseconds, or human time</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">parsing the text: done BEFORE the lock is taken</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">the repaint: a few ms, after the unlock</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the database write: about 5 ms (a follow-up)</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">the person typing: 200 ms between keystrokes</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">and every READ: they hold the read lock, together</text></g><text x=\"615\" y=\"216\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">ten collaborators press a key at the same instant</text><g transform=\"translate(30 231)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">typist 1</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0 us</text></g><g transform=\"translate(148 231)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">typist 2</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 0.9 us</text></g><g transform=\"translate(266 231)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">typist 3</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 1.8 us</text></g><g transform=\"translate(384 231)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">typist 4</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 2.7 us</text></g><g transform=\"translate(502 231)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">typist 5</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 3.6 us</text></g><g transform=\"translate(620 231)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">typist 6</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 4.5 us</text></g><g transform=\"translate(738 231)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">typist 7</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 5.4 us</text></g><g transform=\"translate(856 231)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">typist 8</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 6.3 us</text></g><g transform=\"translate(974 231)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">typist 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 7.2 us</text></g><g transform=\"translate(1092 231)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">typist 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 8.1 us</text></g><text x=\"615\" y=\"299\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tenth typist waits eight microseconds for the lock and then a few milliseconds for the screen to repaint:</text><text x=\"615\" y=\"317\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one at a time is true, and nobody can tell, because nothing slow is allowed inside the lock</text></svg></div><div class=\"move\"><p>The question you will be asked, and should ask yourself: if every edit takes the sheet's lock, is the spreadsheet now a queue? It is, for about a microsecond. Inside the lock there is one forward walk over the dependents map, one set lookup per cell the new formula reads, a rewire that deletes a few edges and adds a few, Kahn's algorithm over the affected set, and one evaluation per affected cell. The code measures it and prints it: an edit that affects three cells takes 0.9 microseconds, and a hundred-cell column takes 11.5. Everything slow is outside. Parsing happens before the lock is taken, deliberately, because it is the part that throws. The repaint happens after the unlock, in a try/catch, so a chart that blows up cannot undo an edit that already happened. And reads do not queue at all: they take the read lock and run together. So when ten collaborators press a key at the same instant, the tenth waits about eight microseconds for the lock and then a few milliseconds for its own screen to repaint.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 240\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"205\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one lock on the whole sheet: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a typical edit (three affected cells): 0.9 us, printed by Main</text><text x=\"35\" y=\"90\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a person types about five characters a second</text><text x=\"35\" y=\"114\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">ten collaborators = 50 edits a second = 45 us of lock a second</text><text x=\"35\" y=\"138\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">that is 0.005% busy; two writers collide about never</text><text x=\"35\" y=\"162\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">even 1000 edits a second is 0.9 ms of lock in every second</text><text x=\"35\" y=\"186\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">repaints do not wait at all, and one read costs 25 ns</text><text x=\"35\" y=\"210\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the number that would hurt is a 100,000-cell recalculation: 11 ms</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 parse and repaint outside the lock</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">already done: the listeners hear after the unlock</text></g><g transform=\"translate(600 114)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 publish an immutable snapshot</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one volatile reference; readers take no lock at all</text></g><g transform=\"translate(600 170)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 a row per cell, with a version column</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE ... WHERE version = ?, so two servers cannot lose an edit</text></g></svg></div><div class=\"move\"><p>A person types about five characters a second. Ten collaborators in one sheet is fifty edits a second, against a lock held for nine tenths of a microsecond: forty-five microseconds of lock in every second, five thousandths of one per cent. Even an imaginary thousand edits a second is under a millisecond of lock per second. And the reads &mdash; the overwhelming majority of what a grid does, since every scroll repaints hundreds of cells &mdash; hold the read lock and never wait for each other at all. The number that would actually hurt is not contention, it is one edit that dirties a hundred thousand cells: about eleven milliseconds, and every reader waits. Then the ladder, in the order you would climb it: keep parsing and repainting outside the lock, which this code already does; publish an immutable map of values behind one volatile reference, so readers take no lock whatsoever and the writer rebuilds the changed slice; and beyond one process, give each cell a row with a version column and make the write <code>UPDATE ... WHERE version = ?</code>, which is the database doing the same compare-then-write the lock did. Say the arithmetic first: climbing the ladder without it is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 352\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 16)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">two people type into one cell</text></g><path d=\"M350 33 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 16)\"><rect width=\"800\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the whole read-modify-write inside one write lock; test 2: exactly 2000</text></g><g transform=\"translate(30 54)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a formula that reads itself</text></g><path d=\"M350 71 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 54)\"><rect width=\"800\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the dry-run walk before any write; test 3: the sheet is byte-identical</text></g><g transform=\"translate(30 92)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a cell computed before its inputs</text></g><path d=\"M350 109 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 92)\"><rect width=\"800\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"17

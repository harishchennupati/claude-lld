 i = 0; i &lt; n; i++) s.set(&quot;A1&quot;, String.valueOf(i));\n        long t0 = System.nanoTime();\n        for (int i = 0; i &lt; n; i++) s.set(&quot;A1&quot;, String.valueOf(i));\n        return Math.round((System.nanoTime() - t0) / (double) n) / 1000.0;\n    }\n\n    /** Eight threads adding 1 to D1, 250 times each. Compound is get-then-set; otherwise one locked update(). */\n    private static String increments(boolean atomic) throws Exception {\n        Sheet s = Sheet.standard();\n        s.set(&quot;D1&quot;, &quot;0&quot;);\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; fs = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; 8; t++) fs.add(pool.submit(() -&gt; {\n            go.await();\n            for (int k = 0; k &lt; 250; k++) {\n                if (atomic) s.update(&quot;D1&quot;, v -&gt; v + 1);\n                else s.set(&quot;D1&quot;, new Num(Evaluator.num(s.get(&quot;D1&quot;)) + 1).display());   // two steps, and a gap between them\n            }\n            return null;\n        }));\n        go.countDown();\n        for (Future&lt;?&gt; f : fs) f.get();\n        pool.shutdown();\n        return s.get(&quot;D1&quot;).display();\n    }\n\n    private static String pad(String s) { return (s + &quot;                &quot;).substring(0, 16); }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>Extensions.java</b><button class=\"copy\" data-key=\"f1\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// The reference code for every follow-up on page 05. Each block is one twist an interviewer adds; none of them\n// opens Main.java. ExtDemo at the bottom runs all of them, so none can rot.\n\n// ---- ext: a new function -- MEDIAN is one class and one register() line. This is the axis the design exists for.\n/** MEDIAN of the numeric arguments. Extends the base class, so it gets error propagation and blank-skipping free. */\nfinal class MedianFunction extends NumericFunction {\n    public String name() { return &quot;MEDIAN&quot;; }\n    protected Value reduce(List&lt;Double&gt; n) {\n        List&lt;Double&gt; s = new ArrayList&lt;&gt;(n);\n        Collections.sort(s);\n        int m = s.size();\n        return new Num(m % 2 == 1 ? s.get(m / 2) : (s.get(m / 2 - 1) + s.get(m / 2)) / 2);\n    }\n}\n\n/** VLOOKUP over a flattened range: the first column is keys, the rest are columns of answers. */\nfinal class VlookupFunction implements SheetFunction {\n    private final int width;\n    /** width = how many columns the flattened table has, because a range arrives as a flat list of values. */\n    VlookupFunction(int width) { this.width = width; }\n    public String name() { return &quot;VLOOKUP&quot;; }\n    public Value apply(List&lt;Value&gt; args) {\n        if (args.size() &lt; 3) return new Err(&quot;#VALUE!&quot;);\n        Value key = args.get(0);\n        Double col = Evaluator.num(args.get(args.size() - 1));\n        if (col == null) return new Err(&quot;#VALUE!&quot;);\n        List&lt;Value&gt; table = args.subList(1, args.size() - 1);\n        for (int r = 0; r + width &lt;= table.size(); r += width)\n            if (table.get(r).display().equals(key.display())) return table.get(r + col.intValue() - 1);\n        return new Err(&quot;#N/A&quot;);\n    }\n}\n\n// ---- ext: IFERROR -- the one function that must SEE an error, so it declines the propagating base class\n/** IFERROR(value, fallback): the only function allowed to swallow an error, which is why it is not a NumericFunction. */\nfinal class IfErrorFunction implements SheetFunction {\n    public String name() { return &quot;IFERROR&quot;; }\n    public Value apply(List&lt;Value&gt; args) {\n        if (args.size() != 2) return new Err(&quot;#VALUE!&quot;);\n        return args.get(0) instanceof Err ? args.get(1) : args.get(0);\n    }\n}\n\n// ---- ext: the cycle policy -- Excel refuses the edit, Sheets paints #CYCLE! on the loop. Same detection, two policies.\n/** What the product does when an edit would make a loop. The detection never changes; only this does. */\ninterface CyclePolicy {\n    /** Called with the loop the sheet found. Returns what the user should see in the cell they were typing in. */\n    String onCycle(List&lt;CellRef&gt; loop);\n}\n/** Excel&#x27;s behaviour, and the sheet&#x27;s own: refuse the edit and leave the sheet exactly as it was. */\nfinal class RefuseCycle implements CyclePolicy {\n    public String onCycle(List&lt;CellRef&gt; loop) { throw new CircularReferenceException(loop); }\n}\n/** Google Sheets&#x27; behaviour: accept it and mark every cell on the loop, leaving unrelated cells alone. */\nfinal class MarkCycle implements CyclePolicy {\n    private final Set&lt;CellRef&gt; marked = new LinkedHashSet&lt;&gt;();\n    public String onCycle(List&lt;CellRef&gt; loop) { marked.addAll(loop); return &quot;#CYCLE!&quot;; }\n    /** The cells currently known to be on a loop; a display layer paints these #CYCLE!. */\n    Set&lt;CellRef&gt; marked() { return marked; }\n}\n/** The editor the UI calls. The sheet keeps its one honest behaviour; the policy decides what the product shows. */\nfinal class PolicyEditor {\n    private final Sheet sheet;\n    private final CyclePolicy policy;\n    PolicyEditor(Sheet sheet, CyclePolicy policy) { this.sheet = sheet; this.policy = policy; }\n    /** Type into a cell. Returns what the cell now displays, which for a refused loop is the policy&#x27;s answer. */\n    String type(String a1, String text) {\n        try { sheet.set(a1, text); return sheet.get(a1).display(); }\n        catch (CircularReferenceException e) { return policy.onCycle(e.path()); }\n    }\n}\n\n// ---- ext: undo and redo -- the edit is already reversible, because the sheet keeps the raw text of every cell\n/** One typed edit, and the text that was there before it. Its own undo: replay `before` through set(). */\nrecord EditCommand(String a1, String before, String after) { }\n\n/** An undo stack over the sheet. Nothing in Main.java changes: undo is a second set() with the old text. */\nfinal class EditHistory {\n    private final Sheet sheet;\n    private final Deque&lt;EditCommand&gt; undo = new ArrayDeque&lt;&gt;(), redo = new ArrayDeque&lt;&gt;();\n    EditHistory(Sheet sheet) { this.sheet = sheet; }\n    /** Type, and remember what was there. A new edit clears the redo stack, as every editor does. */\n    void type(String a1, String text) {\n        String before = sheet.raw(a1);\n        sheet.set(a1, text);\n        undo.push(new EditCommand(a1, before, text));\n        redo.clear();\n    }\n    /** Put the previous text back. Dependents recompute for free, because it is an ordinary edit. */\n    boolean undo() {\n        if (undo.isEmpty()) return false;\n        EditCommand c = undo.pop();\n        sheet.set(c.a1(), c.before());\n        redo.push(c);\n        return true;\n    }\n    /** Re-apply the edit that was just undone. */\n    boolean redo() {\n        if (redo.isEmpty()) return false;\n        EditCommand c = redo.pop();\n        sheet.set(c.a1(), c.after());\n        undo.push(c);\n        return true;\n    }\n    /** How deep the undo stack is. */\n    int depth() { return undo.size(); }\n}\n\n// ---- ext: lazy evaluation -- dirty flags and compute-on-read, and the honest reason the eager sheet is the default\n/**\n * The other evaluation strategy: an edit marks the affected cells dirty and computes nothing; a read computes\n * what it needs and memoises it. Cheap when you edit a lot and read a little, which is not what a grid does.\n */\nfinal class LazySheet {\n    private final Map&lt;CellRef, Expr&gt; formulas = new HashMap&lt;&gt;();\n    private final Map&lt;CellRef, Value&gt; cache = new HashMap&lt;&gt;();\n    private final DependencyGraph graph = new DependencyGraph();\n    private final Evaluator evaluator;\n    private int evaluations;\n    LazySheet(FunctionRegistry functions) { this.evaluator = new Evaluator(functions); }\n\n    /** Type into a cell: rewire the edges, drop the cached values of everything affected, and stop. */\n    void set(String a1, String text) {\n        CellRef r = CellRef.parse(a1);\n        Expr e = Parser.parseInput(text);\n        Set&lt;CellRef&gt; refs = new LinkedHashSet&lt;&gt;();\n        e.collectRefs(refs);\n        graph.setPrecedents(r, refs);\n        formulas.put(r, e);\n        for (CellRef d : graph.affectedBy(r)) cache.remove(d);        // dirty, not recomputed\n    }\n    /** Read a cell, computing it and everything under it that is dirty, once each. */\n    Value get(String a1) { return value(CellRef.parse(a1)); }\n    private Value value(CellRef r) {\n        Value v = cache.get(r);\n        if (v != null) return v;\n        Expr e = formulas.get(r);\n        if (e == null) return Blank.IT;\n        evaluations++;\n        Value out = evaluator.eval(e, this::value);                   // memoised recursion is the invalidate-plus-cache\n        cache.put(r, out);\n        return out;\n    }\n    /** How many cells have actually been evaluated. The number that makes the trade-off visible. */\n    int evaluations() { return evaluations; }\n}\n\n// ---- ext: a workbook -- the graph never mentions a Cell, only keys, so widening the key is the whole change\n/** An address in a workbook: which sheet, then the cell. Equal-comparable, which is all the graph ever needed. */\nrecord Addr(String sheet, CellRef ref) {\n    @Override public String toString() { return sheet + &quot;!&quot; + ref; }\n}\n\n/**\n * DependencyGraph from Main.java with the key made a type parameter. Nothing about cycles, dirty sets or\n * topological order mentioned a cell, which is the proof that a workbook is a wider key and a parser change.\n */\nfinal class Deps&lt;K&gt; {\n    private final Map&lt;K, Set&lt;K&gt;&gt; precedents = new HashMap&lt;&gt;();\n    private final Map&lt;K, Set&lt;K&gt;&gt; dependents = new HashMap&lt;&gt;();\n    /** Point a key at the keys it reads, removing its old edges first. */\n    void setPrecedents(K k, Set&lt;K&gt; refs) {\n        for (K old : precedents.getOrDefault(k, Set.of())) {\n            Set&lt;K&gt; d = dependents.get(old);\n            if (d != null) { d.remove(k); if (d.isEmpty()) dependents.remove(old); }\n        }\n        if (refs.isEmpty()) precedents.remove(k); else precedents.put(k, new LinkedHashSet&lt;&gt;(refs));\n        for (K p : refs) dependents.computeIfAbsent(p, x -&gt; new LinkedHashSet&lt;&gt;()).add(k);\n    }\n    /** Everything that would recompute if this key changed. Also the set a new precedent must not be in. */\n    Set&lt;K&gt; affectedBy(K from) {\n        Set&lt;K&gt; seen = new LinkedHashSet&lt;&gt;();\n        Deque&lt;K&gt; q = new ArrayDeque&lt;&gt;();\n        seen.add(from); q.add(from);\n        while (!q.isEmpty()) { K c = q.poll(); for (K d : dependents.getOrDefault(c, Set.&lt;K&gt;of())) if (seen.add(d)) q.add(d); }\n        return seen;\n    }\n    /** Would pointing this key at those precedents make a loop? The same one-walk test as the sheet&#x27;s. */\n    boolean wouldCycle(K k, Set&lt;K&gt; refs) {\n        Set&lt;K&gt; affected = affectedBy(k);\n        for (K p : refs) if (affected.contains(p)) return true;\n        return false;\n    }\n}\n\n// ---- ext: persistence -- a repository and a conditional UPDATE, so two servers cannot silently lose an edit\n/**\n * Where cells live when they must outlive the process. save() is the whole design: it writes only if the\n * stored version is the one the caller read, which is the database doing what the sheet&#x27;s lock does in memory.\n *\n * UPDATE cells SET raw = ?, version = version + 1 WHERE sheet = ? AND a1 = ? AND version = ?\n */\ninterface CellRepository {\n    /** Write the text if nobody else has written since `expectedVersion`. False means you must re-read and retry. */\n    boolean save(String sheetId, String a1, String raw, int expectedVersion);\n    /** The stored text, or &quot;&quot; if nothing is stored. */\n    String load(String sheetId, String a1);\n    /** The stored version, 0 if nothing is stored. Read it, then pass it back to save(). */\n    int version(String sheetId, String a1);\n}\n\n/** The in-memory stand-in, with exactly the semantics of the conditional UPDATE above. */\nfinal class InMemoryCellRepository implements CellRepository {\n    private final Map&lt;String, String[]&gt; rows = new ConcurrentHashMap&lt;&gt;();      // key -&gt; { raw, version }\n    private static String key(String s, String a1) { return s + &quot;!&quot; + a1; }\n    public synchronized boolean save(String sheetId, String a1, String raw, int expectedVersion) {\n        String[] row = rows.get(key(sheetId, a1));\n        int v = row == null ? 0 : Integer.parseInt(row[1]);\n        if (v != expectedVersion) return false;                               // somebody else got there first\n        rows.put(key(sheetId, a1), new String[] { raw, String.valueOf(v + 1) });\n        return true;\n    }\n    public String load(String sheetId, String a1) { String[] r = rows.get(key(sheetId, a1)); return r == null ? &quot;&quot; : r[0]; }\n    public int version(String sheetId, String a1) { String[] r = rows.get(key(sheetId, a1)); return r == null ? 0 : Integer.parseInt(r[1]); }\n}\n\n// ---- ext: lock-free readers -- an immutable snapshot behind one volatile reference, rebuilt as edits land\n/**\n * A read path that takes no lock at all: every edit publishes a new immutable map, and readers follow one\n * volatile reference. A million cells being repainted never wait for a typist.\n */\nfinal class SnapshotView {\n    private volatile Map&lt;CellRef, Value&gt; view = Map.of();\n    /** Subscribe to a sheet. Each committed change is merged into a fresh immutable map and published. */\n    SnapshotView(Sheet sheet) { sheet.addListener(this::merge); }\n    private synchronized void merge(CellChange c) {\n        Map&lt;CellRef, Value&gt; next = new HashMap&lt;&gt;(view);\n        next.put(c.ref(), c.after());\n        view = Map.copyOf(next);                                              // one volatile write publishes the whole map\n    }\n    /** Read with no lock. At most one edit behind, because listeners run after the write lock is released. */\n    Value get(String a1) { return view.getOrDefault(CellRef.parse(a1), Blank.IT); }\n    /** How many cells the current snapshot holds. */\n    int size() { return view.size(); }\n}\n\n// ---- ext: volatile functions -- NOW() changes with no cell changing, so something must re-post it on a tick\n/** The cells whose answer moves on its own. A timer re-types their own text, which recomputes their dependents. */\nfinal class VolatileCells {\n    private final Set&lt;String&gt; watched = new LinkedHashSet&lt;&gt;();\n    /** Register a cell whose formula is volatile: NOW(), RAND(), TODAY(). */\n    void watch(String a1) { watched.add(a1); }\n    /** One recalculation tick: re-post each volatile cell&#x27;s own text through the ordinary edit path. */\n    void tick(Sheet sheet) { for (String a1 : watched) sheet.set(a1, sheet.raw(a1)); }\n    /** How many volatile cells are being watched. A sheet with thousands of them is the reason Excel warns about NOW(). */\n    int size() { return watched.size(); }\n}\n\n// ---- ext: copy a formula -- relative references move with it, $-anchored ones do not, and the tree makes that one line\n/**\n * The formula as text again. Needed the moment anything rewrites a formula -- a copy, an inserted row --\n * because the sheet stores what the user typed and the formula bar has to show the new version.\n * A round trip preserves meaning, not keystrokes: &quot;=-A1&quot; comes back as &quot;=0-A1&quot;, and only the brackets the\n * precedence actually needs are printed.\n */\nfinal class Formula {\n    /** The tree as a formula the parser would read back, leading &quot;=&quot; included. */\n    static String text(Expr e) { return &quot;=&quot; + write(e); }\n\n    /** One address, with its anchors put back: A1, $A1, A$1, $A$1. */\n    static String a1(Ref r) {\n        String s = r.ref().a1();\n        int k = 0;\n        while (k &lt; s.length() &amp;&amp; Character.isLetter(s.charAt(k))) k++;\n        return (r.absCol() ? &quot;$&quot; : &quot;&quot;) + s.substring(0, k) + (r.absRow() ? &quot;$&quot; : &quot;&quot;) + s.substring(k);\n    }\n\n    /**\n     * The same tree, as it would read pasted dRow down and dCol right: an unanchored part moves by the\n     * distance the formula moved, an anchored one does not, and a reference pushed off the grid is #REF!.\n     */\n    static Expr copyShift(Expr e, int dRow, int dCol) {\n        if (e instanceof Ref r) {\n            int row = r.absRow() ? r.ref().row() : r.ref().row() + dRow;\n            int col = r.absCol() ? r.ref().col() : r.ref().col() + dCol;\n            if (row &lt; 0 || col &lt; 0) return new Lit(new Err(&quot;#REF!&quot;));       // dragged off the top or the left edge\n            return new Ref(new CellRef(row, col), r.absRow(), r.absCol());\n        }\n        if (e instanceof RangeRef rr) {\n            Expr a = copyShift(rr.from(), dRow, dCol), b = copyShift(rr.to(), dRow, dCol);\n            if (!(a instanceof Ref x) || !(b instanceof Ref y)) return new Lit(new Err(&quot;#REF!&quot;));\n            return new RangeRef(x, y);\n        }\n        if (e instanceof Bin b) return new Bin(b.op(), copyShift(b.left(), dRow, dCol), copyShift(b.right(), dRow, dCol));\n        if (e instanceof Call c) {\n            List&lt;Expr&gt; args = new ArrayList&lt;&gt;();\n            for (Expr a : c.args()) args.add(copyShift(a, dRow, dCol));\n            return new Call(c.name(), args);\n        }\n        return e;                                                           // a literal copies unchanged\n    }\n\n    private static String write(Expr e) {\n        if (e instanceof Lit l) return l.value() instanceof Text t ? &quot;\\&quot;&quot; + t.s() + &quot;\\&quot;&quot; : l.value().display();\n        if (e instanceof Ref r) return a1(r);\n        if (e instanceof RangeRef rr) return a1(rr.from()) + &quot;:&quot; + a1(rr.to());\n        if (e instanceof Bin b) return side(b.left(), prec(b.op()), false) + b.op() + side(b.right(), prec(b.op()), true);\n        if (e instanceof Call c) {\n            StringBuilder sb = new StringBuilder(c.name()).append(&quot;(&quot;);\n            for (int k = 0; k &lt; c.args().size(); k++) sb.append(k == 0 ? &quot;&quot; : &quot;,&quot;).append(write(c.args().get(k)));\n            return sb.append(&quot;)&quot;).toString();\n        }\n        return &quot;&quot;;\n    }\n    private static int prec(String op) { return switch (op) { case &quot;*&quot;, &quot;/&quot; -&gt; 3; case &quot;+&quot;, &quot;-&quot;, &quot;&amp;&quot; -&gt; 2; default -&gt; 1; }; }\n    /** Brackets only where dropping them would change the meaning: a weaker operator under a stronger one. */\n    private static String side(Expr e, int parent, boolean right) {\n        String s = write(e);\n        boolean needs = e instanceof Bin b &amp;&amp; (prec(b.op()) &lt; parent || (right &amp;&amp; prec(b.op()) == parent));\n        return needs ? &quot;(&quot; + s + &quot;)&quot; : s;\n    }\n}\n\n// ---- ext: insert and delete a row -- the one edit that is not a cell edit: it moves cells AND rewrites formulas\n/**\n * One structural edit: insert a blank row at `at`, or delete the row at `at`. It knows two things -- where a\n * cell ends up, and what a formula says afterwards -- and both are needed, because inserting a row above a\n * total and not rewriting the total&#x27;s formula is how a spreadsheet quietly starts printing the wrong number.\n * Rows are 0-based here, the way CellRef counts them.\n */\nrecord RowOp(int at, int delta) {\n    /** Insert a blank row, pushing that row and everything below it down. */\n    static RowOp insert(int row0) { return new RowOp(row0, +1); }\n    /** Delete a row, pulling everything below it up. */\n    static RowOp delete(int row0) { return new RowOp(row0, -1); }\n\n    /** Where this cell ends up, or null if this operation deleted it. */\n    CellRef move(CellRef c) {\n        if (delta &gt; 0) return c.row() &gt;= at ? new CellRef(c.row() + 1, c.col()) : c;\n        if (c.row() == at) return null;\n        return c.row() &gt; at ? new CellRef(c.row() - 1, c.col()) : c;\n    }\n\n    /**\n     * The same formula, said about the moved grid. A single reference into a deleted row becomes the value\n     * #REF!; a range that merely spanned the deleted row shrinks by one, which is what Excel does and what\n     * the user expects: =SUM(A1:A10) with row 5 gone is =SUM(A1:A9), not an error.\n     * The dollar anchors are deliberately ignored here: $A$5 still moves, because that box really did move.\n     */\n    Expr rewrite(Expr e) {\n        if (e instanceof Ref r) {\n            CellRef to = move(r.ref());\n            return to == null ? new Lit(new Err(&quot;#REF!&quot;)) : new Ref(to, r.absRow(), r.absCol());\n        }\n        if (e instanceof RangeRef rr) {\n            CellRef a = rr.from().ref(), b = rr.to().ref();\n            int r1 = Math.min(a.row(), b.row()), r2 = Math.max(a.row(), b.row());\n            if (delta &lt; 0 &amp;&amp; r1 == r2 &amp;&amp; r1 == at) return new Lit(new Err(&quot;#REF!&quot;));   // the range WAS that row\n            return new RangeRef(new Ref(endpoint(a, r1), rr.from().absRow(), rr.from().absCol()),\n                                new Ref(endpoint(b, r1), rr.to().absRow(), rr.to().absCol()));\n        }\n        if (e instanceof Bin b) return new Bin(b.op(), rewrite(b.left()), rewrite(b.right()));\n        if (e instanceof Call c) {\n            List&lt;Expr&gt; args = new ArrayList&lt;&gt;();\n            for (Expr a : c.args()) args.add(rewrite(a));\n            return new Call(c.name(), args);\n        }\n        return e;\n    }\n    private CellRef endpoint(CellRef c, int firstRow) {\n        if (delta &gt; 0) return c.row() &gt;= at ? new CellRef(c.row() + 1, c.col()) : c;\n        if (c.row() &gt; at) return new CellRef(c.row() - 1, c.col());\n        if (c.row() == at &amp;&amp; c.row() != firstRow) return new CellRef(c.row() - 1, c.col());\n        return c;                                                            // the top of the range stays put\n    }\n}\n\n/**\n * The toolbar operations, over the sheet&#x27;s public API and nothing else. Note what they are: many cells\n * changed at once, so in a product this is ONE method on the sheet holding the write lock for the whole\n * thing. Done from outside, as here, a reader could catch the grid halfway rewritten.\n */\nfinal class GridEditor {\n    /** Insert a blank row above the 1-based row number, the way the toolbar button does. */\n    static void insertRow(Sheet s, int row1) { apply(s, RowOp.insert(row1 - 1)); }\n    /** Delete the 1-based row. Its cells go, and anything that pointed INTO it reads #REF!. */\n    static void deleteRow(Sheet s, int row1) { apply(s, RowOp.delete(row1 - 1)); }\n\n    /** Copy one cell to another address, shifting its relative references by the distance it moved. */\n    static void copy(Sheet s, String from, String to) {\n        String raw = s.raw(from);\n        if (!raw.startsWith(&quot;=&quot;)) { s.set(to, raw); return; }\n        CellRef f = CellRef.parse(from), t = CellRef.parse(to);\n        s.set(to, Formula.text(Formula.copyShift(Parser.parseInput(raw), t.row() - f.row(), t.col() - f.col())));\n    }\n    /** Drag the corner handle down n rows: the same copy, n times. */\n    static void fillDown(Sheet s, String from, int n) {\n        CellRef f = CellRef.parse(from);\n        for (int k = 1; k &lt;= n; k++) copy(s, from, new CellRef(f.row() + k, f.col()).a1());\n    }\n\n    private static void apply(Sheet s, RowOp op) {\n        Map&lt;CellRef, String&gt; before = new LinkedHashMap&lt;&gt;();\n        for (CellRef c : s.addresses()) before.put(c, s.raw(c.a1()));\n        Map&lt;CellRef, String&gt; after = new LinkedHashMap&lt;&gt;();\n        for (Map.Entry&lt;CellRef, String&gt; e : before.entrySet()) {\n            CellRef to = op.move(e.getKey());\n            if (to == null) continue;                                        // that cell was in the deleted row\n            String raw = e.getValue();\n            after.put(to, raw.startsWith(&quot;=&quot;) ? Formula.text(op.rewrite(Parser.parseInput(raw))) : raw);\n        }\n        for (CellRef c : before.keySet()) s.clear(c.a1());                   // no edges left, so no order to get wrong\n        for (Map.Entry&lt;CellRef, String&gt; e : after.entrySet()) s.set(e.getKey().a1(), e.getValue());\n    }\n}\n\n// ---- ext: a range is one edge, not a thousand -- blocks, so =SUM(A1:A1000) does not put a thousand edges in the graph\n/** A rectangle of addresses, the way a formula writes a range. */\nrecord Rect(int r1, int c1, int r2, int c2) {\n    /** Is this address inside the rectangle? */\n    boolean covers(CellRef c) { return c.row() &gt;= r1 &amp;&amp; c.row() &lt;= r2 &amp;&amp; c.col() &gt;= c1 &amp;&amp; c.col() &lt;= c2; }\n}\n\n/**\n * The other way to hold a range&#x27;s dependency. The graph in Main.java gives =SUM(A1:A1000) one edge per cell,\n * so a hundred such formulas are a hundred thousand edges to build and walk. Here a range is filed once per\n * 64x64 block it overlaps -- sixteen entries instead of a thousand -- and &quot;who reads A500?&quot; is one block\n * lookup plus a containment test on the few ranges filed in that block. An interval tree or an R-tree is the\n * same idea with a sharper lookup; blocks are what real grid engines use, because a block id is one shift.\n */\nfinal class BlockRangeIndex {\n    /** The side of one block, in cells. Bigger blocks mean fewer entries and longer scans. */\n    static final int BLOCK = 64;\n    /** One range, and the formula that reads it. */\n    record RangeEdge(Rect area, CellRef formula) { }\n    private final Map&lt;Long, List&lt;RangeEdge&gt;&gt; byBlock = new HashMap&lt;&gt;();\n    private int entries;\n\n    /** File that this formula reads every cell of that rectangle. */\n    void add(CellRef formula, Rect r) {\n        for (int br = r.r1() / BLOCK; br &lt;= r.r2() / BLOCK; br++)\n            for (int bc = r.c1() / BLOCK; bc &lt;= r.c2() / BLOCK; bc++) {\n                byBlock.computeIfAbsent(key(br, bc), k -&gt; new ArrayList&lt;&gt;()).add(new RangeEdge(r, formula));\n                entries++;\n            }\n    }\n    /** Which formulas read this cell through a range: one map lookup, then a test per range in that block. */\n    Set&lt;CellRef&gt; readersOf(CellRef c) {\n        Set&lt;CellRef&gt; out = new LinkedHashSet&lt;&gt;();\n        for (RangeEdge e : byBlock.getOrDefault(key(c.row() / BLOCK, c.col() / BLOCK), List.of()))\n            if (e.area().covers(c)) out.add(e.formula());\n        return out;\n    }\n    /** How many entries the index holds: the number to compare with one edge per cell. */\n    int entries() { return entries; }\n    private static long key(int br, int bc) { return ((long) br &lt;&lt; 32) ^ (bc &amp; 0xffffffffL); }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) {\n        // a new function: one class, one register line, nothing else opened\n        FunctionRegistry fns = FunctionRegistry.standard(System::currentTimeMillis)\n                .register(new MedianFunction()).register(new IfErrorFunction()).register(new VlookupFunction(2));\n        Sheet sheet = new Sheet();\n        sheet.configure(fns, System::currentTimeMillis);\n        sheet.set(&quot;A1&quot;, &quot;1&quot;); sheet.set(&quot;A2&quot;, &quot;9&quot;); sheet.set(&quot;A3&quot;, &quot;4&quot;);\n        sheet.set(&quot;B1&quot;, &quot;=MEDIAN(A1:A3)&quot;);\n        System.out.println(&quot;MEDIAN(1,9,4) = &quot; + sheet.get(&quot;B1&quot;).display());\n\n        // IFERROR: the function that looks at an error instead of propagating it\n        sheet.set(&quot;C1&quot;, &quot;=A1/0&quot;);\n        sheet.set(&quot;C2&quot;, &quot;=IFERROR(C1,0)&quot;);\n        System.out.println(&quot;C1 = &quot; + sheet.get(&quot;C1&quot;).display() + &quot;, IFERROR(C1,0) = &quot; + sheet.get(&quot;C2&quot;).display());\n\n        // VLOOKUP over a two-column table\n        sheet.set(&quot;E1&quot;, &quot;pen&quot;); sheet.set(&quot;F1&quot;, &quot;30&quot;); sheet.set(&quot;E2&quot;, &quot;book&quot;); sheet.set(&quot;F2&quot;, &quot;250&quot;);\n        sheet.set(&quot;G1&quot;, &quot;=VLOOKUP(\\&quot;book\\&quot;,E1:F2,2)&quot;);\n        System.out.println(&quot;VLOOKUP(book) = &quot; + sheet.get(&quot;G1&quot;).display());\n\n        // the cycle policy: the sheet always refuses; the product decides what to show\n        PolicyEditor refuses = new PolicyEditor(sheet, new RefuseCycle());\n        MarkCycle mark = new MarkCycle();\n        PolicyEditor marks = new PolicyEditor(sheet, mark);\n        System.out.println(&quot;marking policy on A1 = =B1: &quot; + marks.type(&quot;A1&quot;, &quot;=B1&quot;) + &quot; marked=&quot; + mark.marked());\n        try { refuses.type(&quot;A1&quot;, &quot;=B1&quot;); }\n        catch (CircularReferenceException e) { System.out.println(&quot;refusing policy: &quot; + e.getMessage()); }\n        System.out.println(&quot;either way A1 is still &quot; + sheet.raw(&quot;A1&quot;) + &quot; = &quot; + sheet.get(&quot;A1&quot;).display());\n\n        // undo and redo, with no change to the sheet at all\n        EditHistory hist = new EditHistory(sheet);\n        hist.type(&quot;A1&quot;, &quot;5&quot;); hist.type(&quot;A1&quot;, &quot;6&quot;);\n        System.out.println(&quot;after two edits B1 = &quot; + sheet.get(&quot;B1&quot;).display() + &quot; (median of 6, 9, 4)&quot;);\n        hist.undo(); hist.undo();\n        System.out.println(&quot;after two undos A1 = &quot; + sheet.raw(&quot;A1&quot;) + &quot;, B1 = &quot; + sheet.get(&quot;B1&quot;).display());\n        hist.redo();\n        System.out.println(&quot;after one redo  A1 = &quot; + sheet.raw(&quot;A1&quot;) + &quot;, depth = &quot; + hist.depth());\n\n        // lazy: an edit computes nothing, a read computes only what it needs\n        LazySheet lazy = new LazySheet(FunctionRegistry.standard(System::currentTimeMillis));\n        lazy.set(&quot;A1&quot;, &quot;1&quot;);\n        for (int i = 2; i &lt;= 20; i++) lazy.set(&quot;A&quot; + i, &quot;=A&quot; + (i - 1) + &quot;+1&quot;);\n        lazy.set(&quot;A1&quot;, &quot;100&quot;);\n        System.out.println(&quot;lazy: after editing A1, A5 = &quot; + lazy.get(&quot;A5&quot;).display()\n                + &quot; and only &quot; + lazy.evaluations() + &quot; cells were ever evaluated (eager would have done 20)&quot;);\n\n        // a workbook: the same graph code, with the key widened to (sheet, cell)\n        Deps&lt;Addr&gt; book = new Deps&lt;&gt;();\n        Addr salesA1 = new Addr(&quot;Sales&quot;, CellRef.parse(&quot;A1&quot;)), summaryB2 = new Addr(&quot;Summary&quot;, CellRef.parse(&quot;B2&quot;));\n        book.setPrecedents(summaryB2, Set.of(salesA1));\n        System.out.println(&quot;workbook: editing &quot; + salesA1 + &quot; affects &quot; + book.affectedBy(salesA1)\n                + &quot;; &quot; + salesA1 + &quot; = &quot; + summaryB2 + &quot; would cycle = &quot; + book.wouldCycle(salesA1, Set.of(summaryB2)));\n\n        // persistence: two servers read the same version; exactly one write wins\n        CellRepository repo = new InMemoryCellRepository();\n        repo.save(&quot;s1&quot;, &quot;A1&quot;, &quot;10&quot;, 0);\n        int seen = repo.version(&quot;s1&quot;, &quot;A1&quot;);\n        boolean first = repo.save(&quot;s1&quot;, &quot;A1&quot;, &quot;20&quot;, seen);\n        boolean second = repo.save(&quot;s1&quot;, &quot;A1&quot;, &quot;30&quot;, seen);\n        System.out.println(&quot;repository: first writer &quot; + first + &quot;, second writer &quot; + second\n                + &quot;, stored = &quot; + repo.load(&quot;s1&quot;, &quot;A1&quot;) + &quot; v&quot; + repo.version(&quot;s1&quot;, &quot;A1&quot;));\n\n        // lock-free readers\n        Sheet live = Sheet.standard();\n        SnapshotView snap = new SnapshotView(live);\n        live.set(&quot;A1&quot;, &quot;3&quot;); live.set(&quot;A2&quot;, &quot;=A1*7&quot;);\n        System.out.println(&quot;snapshot (no lock taken): A2 = &quot; + snap.get(&quot;A2&quot;).display() + &quot;, &quot; + snap.size() + &quot; cells published&quot;);\n\n        // volatile functions: nothing changed, but NOW() must change\n        long[] now = { 1_700_000_000_000L };\n        Sheet timed = Sheet.standard(() -&gt; now[0]);\n        timed.set(&quot;A1&quot;, &quot;=NOW()&quot;);\n        timed.set(&quot;A2&quot;, &quot;=A1+0&quot;);\n        VolatileCells vol = new VolatileCells();\n        vol.watch(&quot;A1&quot;);\n        String before = timed.get(&quot;A2&quot;).display();\n        now[0] += 60_000;\n        vol.tick(timed);\n        System.out.println(&quot;volatile: A2 was &quot; + before + &quot;, after a tick a minute later it is &quot; + timed.get(&quot;A2&quot;).display());\n\n        // copy a formula: the relative half moves, the $-anchored half does not\n        Sheet grid = Sheet.standard();\n        grid.set(&quot;A1&quot;, &quot;2&quot;); grid.set(&quot;B1&quot;, &quot;3&quot;); grid.set(&quot;A2&quot;, &quot;20&quot;); grid.set(&quot;B2&quot;, &quot;30&quot;);\n        grid.set(&quot;C1&quot;, &quot;=A1+B1&quot;);\n        GridEditor.copy(grid, &quot;C1&quot;, &quot;C2&quot;);\n        System.out.println(&quot;copy C1 down: &quot; + grid.raw(&quot;C2&quot;) + &quot; = &quot; + grid.get(&quot;C2&quot;).display());\n        grid.set(&quot;D1&quot;, &quot;=$A$1+B1&quot;);\n        GridEditor.copy(grid, &quot;D1&quot;, &quot;D2&quot;);\n        System.out.println(&quot;copy an anchored one: &quot; + grid.raw(&quot;D2&quot;) + &quot; = &quot; + grid.get(&quot;D2&quot;).display());\n\n        // insert a row: every formula below it is rewritten, so the totals still mean the same thing\n        Sheet ledger = Sheet.standard();\n        ledger.set(&quot;A1&quot;, &quot;10&quot;); ledger.set(&quot;A2&quot;, &quot;20&quot;); ledger.set(&quot;A3&quot;, &quot;30&quot;); ledger.set(&quot;B1&quot;, &quot;=SUM(A1:A3)&quot;);\n        GridEditor.insertRow(ledger, 2);\n        System.out.println(&quot;after inserting a row at 2: B1 is &quot; + ledger.raw(&quot;B1&quot;) + &quot; = &quot; + ledger.get(&quot;B1&quot;).display()\n                + &quot;, and A2 is now &quot; + (ledger.raw(&quot;A2&quot;).isEmpty() ? &quot;blank&quot; : ledger.raw(&quot;A2&quot;)));\n        GridEditor.deleteRow(ledger, 2);\n        System.out.println(&quot;after deleting it again:    B1 is &quot; + ledger.raw(&quot;B1&quot;) + &quot; = &quot; + ledger.get(&quot;B1&quot;).display());\n        ledger.set(&quot;C1&quot;, &quot;=A2*10&quot;);\n        GridEditor.deleteRow(ledger, 2);\n        System.out.println(&quot;deleting the row C1 pointed INTO: &quot; + ledger.raw(&quot;C1&quot;) + &quot; = &quot; + ledger.get(&quot;C1&quot;).display());\n\n        // a range as blocks instead of one edge per cell\n        Sheet wide = Sheet.standard();\n        wide.set(&quot;B1&quot;, &quot;=SUM(A1:A1000)&quot;);\n        BlockRangeIndex idx = new BlockRangeIndex();\n        idx.add(CellRef.parse(&quot;B1&quot;), new Rect(0, 0, 999, 0));\n        System.out.println(&quot;a 1000-cell range: &quot; + wide.edgeCount() + &quot; edges in the plain graph, &quot;\n                + idx.entries() + &quot; entries as blocks; readers of A500 = &quot; + idx.readersOf(CellRef.parse(&quot;A500&quot;)));\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// Targeted failure tests: each block proves one claim the design makes on page 02, move 9.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n    static double numOf(Sheet s, String a1) { Double d = Evaluator.num(s.get(a1)); return d == null ? Double.NaN : d; }\n\n    public static void main(String[] args) throws Exception {\n\n        // 1. fifty threads write fifty DIFFERENT cells that all feed one total: no edit may be lost, and\n        //    when the dust settles the total must equal the cells, or the sheet is arithmetically impossible.\n        Sheet grid = Sheet.standard();\n        for (int i = 1; i &lt;= 50; i++) grid.set(&quot;A&quot; + i, &quot;0&quot;);\n        grid.set(&quot;B1&quot;, &quot;=SUM(A1:A50)&quot;);\n        grid.set(&quot;B2&quot;, &quot;=B1*2&quot;);\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; fs = new ArrayList&lt;&gt;();\n        for (int i = 1; i &lt;= 50; i++) {\n            final int n = i;\n            fs.add(pool.submit(() -&gt; { go.await(); return grid.set(&quot;A&quot; + n, String.valueOf(n)); }));\n        }\n        go.countDown();\n        int landed = 0;\n        for (Future&lt;?&gt; f : fs) { f.get(); landed++; }\n        check(landed == 50, &quot;50 concurrent edits to 50 different cells all landed&quot;);\n        double sum = 0;\n        for (int i = 1; i &lt;= 50; i++) sum += numOf(grid, &quot;A&quot; + i);\n        check(sum == 1275, &quot;every individual cell holds what its thread wrote: 1 + 2 + ... + 50 = &quot; + (long) sum);\n        check(numOf(grid, &quot;B1&quot;) == 1275, &quot;the total is consistent with the cells it reads: B1 = &quot; + grid.get(&quot;B1&quot;).display());\n        check(numOf(grid, &quot;B2&quot;) == 2550, &quot;and the formula that reads the total is consistent too: B2 = &quot; + grid.get(&quot;B2&quot;).display());\n\n        // 2. eight typists on ONE cell. get() then set() is two steps with a gap; update() is one step\n        //    under one write lock. Only the boundary of the critical section changes.\n        check(increments(true) == 2000, &quot;update(): 8 threads x 250 increments = exactly 2000&quot;);\n        long lossy = increments(false);\n        check(lossy &lt;= 2000, &quot;get() then set(): &quot; + lossy + &quot; of 2000 (the gap between the two calls loses edits)&quot;);\n        pool.shutdown();\n\n        // 3. a circular reference is refused, and the sheet is byte-identical afterwards: same text, same\n        //    values, same number of cells, same number of edges. A rejected edit leaves no trace at all.\n        Sheet s = Sheet.standard();\n        s.set(&quot;A1&quot;, &quot;10&quot;); s.set(&quot;A2&quot;, &quot;20&quot;); s.set(&quot;A3&quot;, &quot;=A1+A2&quot;); s.set(&quot;B1&quot;, &quot;=SUM(A1:A3)&quot;);\n        String rawBefore = s.raw(&quot;A1&quot;);\n        String valuesBefore = s.get(&quot;A1&quot;).display() + &quot;|&quot; + s.get(&quot;A3&quot;).display() + &quot;|&quot; + s.get(&quot;B1&quot;).display();\n        int cellsBefore = s.cellCount(), edgesBefore = s.edgeCount();\n        try { s.set(&quot;A1&quot;, &quot;=A3&quot;); check(false, &quot;an edit that makes a loop must be refused&quot;); }\n        catch (CircularReferenceException e) { check(e.path().size() &gt;= 3, &quot;cycle refused and named: &quot; + e.getMessage()); }\n        check(s.raw(&quot;A1&quot;).equals(rawBefore), &quot;the refused edit did not change the cell&#x27;s text&quot;);\n        check(valuesBefore.equals(s.get(&quot;A1&quot;).display() + &quot;|&quot; + s.get(&quot;A3&quot;).display() + &quot;|&quot; + s.get(&quot;B1&quot;).display()),\n                &quot;the refused edit did not change a single value&quot;);\n        check(s.cellCount() == cellsBefore &amp;&amp; s.edgeCount() == edgesBefore,\n                &quot;and it did not leave a stray cell or a stray edge: &quot; + s.cellCount() + &quot; cells, &quot; + s.edgeCount() + &quot; edges&quot;);\n        try { s.set(&quot;A9&quot;, &quot;=A9&quot;); check(false, &quot;a cell that reads itself must be refused too&quot;); }\n        catch (CircularReferenceException e) { check(true, &quot;a self-reference is refused: &quot; + e.getMessage()); }\n\n        // 4. one edit recomputes the affected subgraph only, each cell exactly once, after its inputs.\n        s.set(&quot;C1&quot;, &quot;=A1/2&quot;); s.set(&quot;C2&quot;, &quot;=C1+1&quot;); s.set(&quot;B2&quot;, &quot;=IF(B1&gt;50,\\&quot;BIG\\&quot;,\\&quot;SMALL\\&quot;)&quot;);\n        List&lt;String&gt; order = s.set(&quot;A1&quot;, &quot;25&quot;);\n        check(order.get(0).equals(&quot;A1&quot;), &quot;the edited cell comes first: &quot; + order);\n        check(new HashSet&lt;&gt;(order).size() == order.size(), &quot;every cell appears exactly once: &quot; + order);\n        check(!order.contains(&quot;A2&quot;), &quot;A2 does not read A1, so it never re-evaluated&quot;);\n        Map&lt;String, List&lt;String&gt;&gt; reads = Map.of(&quot;A3&quot;, List.of(&quot;A1&quot;, &quot;A2&quot;), &quot;B1&quot;, List.of(&quot;A1&quot;, &quot;A2&quot;, &quot;A3&quot;),\n                &quot;B2&quot;, List.of(&quot;B1&quot;), &quot;C1&quot;, List.of(&quot;A1&quot;), &quot;C2&quot;, List.of(&quot;C1&quot;));\n        check(inDependencyOrder(order, reads), &quot;every cell was recomputed after everything it reads: &quot; + order);\n        check(numOf(s, &quot;A3&quot;) == 45 &amp;&amp; numOf(s, &quot;B1&quot;) == 90 &amp;&amp; numOf(s, &quot;C2&quot;) == 13.5,\n                &quot;and the answers are right: A3=&quot; + s.get(&quot;A3&quot;).display() + &quot; B1=&quot; + s.get(&quot;B1&quot;).display() + &quot; C2=&quot; + s.get(&quot;C2&quot;).display());\n\n        // 5. a range: SUM over it, blanks skipped, COUNT counts only numbers -- and a range past the cap is\n        //    refused before the lock is taken, so a fat-fingered =SUM(A1:Z10000) cannot stall the sheet.\n        Sheet r = Sheet.standard();\n        r.set(&quot;A1&quot;, &quot;5&quot;); r.set(&quot;A2&quot;, &quot;7&quot;); r.set(&quot;A4&quot;, &quot;hello&quot;);\n        r.set(&quot;B1&quot;, &quot;=SUM(A1:A5)&quot;); r.set(&quot;B2&quot;, &quot;=COUNT(A1:A5)&quot;); r.set(&quot;B3&quot;, &quot;=AVERAGE(A1:A2)&quot;);\n        check(numOf(r, &quot;B1&quot;) == 12, &quot;SUM over a five-cell range with blanks and a label in it = 12&quot;);\n        check(numOf(r, &quot;B2&quot;) == 2, &quot;COUNT sees the blanks and the text and counts neither: &quot; + r.get(&quot;B2&quot;).display());\n        check(numOf(r, &quot;B3&quot;) == 6, &quot;AVERAGE of 5 and 7 = &quot; + r.get(&quot;B3&quot;).display());\n        int before = r.cellCount();\n        try { r.set(&quot;C1&quot;, &quot;=SUM(A1:Z10000)&quot;); check(false, &quot;a range past the cap must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;a 260,000-cell range is refused: &quot; + e.getMessage()); }\n        check(r.cellCount() == before, &quot;and the refused monster range wrote nothing&quot;);\n\n        // 6. an error is a value: it caches, it propagates, it does not abort the recalculation of unrelated\n        //    cells in the same pass, and it heals the moment its precedent is fixed.\n        Sheet e = Sheet.standard();\n        e.set(&quot;A1&quot;, &quot;10&quot;);\n        e.set(&quot;C1&quot;, &quot;=A1/B9&quot;); e.set(&quot;C2&quot;, &quot;=SUM(C1,1)&quot;); e.set(&quot;D1&quot;, &quot;=A1+1&quot;);\n        check(e.get(&quot;C1&quot;).display().equals(&quot;#DIV/0!&quot;), &quot;dividing by a blank cell is #DIV/0!, a value, not an exception&quot;);\n        check(e.get(&quot;C2&quot;).display().equals(&quot;#DIV/0!&quot;), &quot;and it propagates into everything that reads it&quot;);\n        List&lt;String&gt; pass = e.set(&quot;A1&quot;, &quot;20&quot;);\n        check(numOf(e, &quot;D1&quot;) == 21, &quot;the unrelated cell in the SAME pass still recomputed: D1 = &quot; + e.get(&quot;D1&quot;).display());\n        check(pass.contains(&quot;C1&quot;) &amp;&amp; pass.contains(&quot;D1&quot;), &quot;the error cell did not abort the pass: &quot; + pass);\n        e.set(&quot;B9&quot;, &quot;2&quot;);\n        check(numOf(e, &quot;C1&quot;) == 10 &amp;&amp; numOf(e, &quot;C2&quot;) == 11, &quot;fixing the precedent heals both cells: C1=&quot; + e.get(&quot;C1&quot;).display());\n\n        // 7. deleting a referenced cell gives #REF! and typing into it again heals; and a rewired formula\n        //    really drops its old edge, so the classic leak -- recomputing forever off a cell you no longer read.\n        Sheet d = Sheet.standard();\n        d.set(&quot;A1&quot;, &quot;5&quot;); d.set(&quot;B1&quot;, &quot;=A1*2&quot;); d.set(&quot;D1&quot;, &quot;=A1&quot;);\n        check(numOf(d, &quot;B1&quot;) == 10, &quot;B1 reads A1 and is 10&quot;);\n        d.deleteCell(&quot;A1&quot;);\n        check(d.get(&quot;B1&quot;).display().equals(&quot;#REF!&quot;), &quot;deleting the cell they point at gives #REF!, not a silent zero&quot;);\n        d.set(&quot;A1&quot;, &quot;7&quot;);\n        check(numOf(d, &quot;B1&quot;) == 14, &quot;typing into that address again heals every dependent: B1 = &quot; + d.get(&quot;B1&quot;).display());\n        d.set(&quot;D1&quot;, &quot;=Z9&quot;);                                        // D1 no longer reads A1\n        List&lt;String&gt; after = d.set(&quot;A1&quot;, &quot;9&quot;);\n        check(!after.contains(&quot;D1&quot;), &quot;the old edge is gone: editing A1 no longer recomputes D1. Order = &quot; + after);\n        check(after.contains(&quot;B1&quot;), &quot;and the edge that is still real survived: B1 recomputed&quot;);\n\n        // 8. a listener that throws cannot break an edit that already happened, and text where a number\n        //    belongs is a #VALUE! cell rather than an exception out of the engine.\n        Sheet n = Sheet.standard();\n        List&lt;String&gt; heard = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        n.addListener(c -&gt; { throw new RuntimeException(&quot;a chart that blew up&quot;); });\n        n.addListener(c -&gt; heard.add(c.ref().a1()));\n        n.set(&quot;A1&quot;, &quot;3&quot;);\n        n.set(&quot;A2&quot;, &quot;=A1*2&quot;);\n        check(numOf(n, &quot;A2&quot;) == 6, &quot;the edits landed although the first listener threw every time&quot;);\n        check(heard.contains(&quot;A1&quot;) &amp;&amp; heard.contains(&quot;A2&quot;), &quot;and the second listener still heard them: &quot; + heard);\n        n.set(&quot;A1&quot;, &quot;hello&quot;);\n        check(n.get(&quot;A2&quot;).display().equals(&quot;#VALUE!&quot;), &quot;text where a number belongs is a #VALUE! cell, not a crash&quot;);\n        check(n.get(&quot;A1&quot;).display().equals(&quot;hello&quot;), &quot;and the text cell itself is perfectly fine&quot;);\n        n.set(&quot;A1&quot;, &quot;4&quot;);\n        check(numOf(n, &quot;A2&quot;) == 8, &quot;and it heals: A2 = &quot; + n.get(&quot;A2&quot;).display());\n        long[] fixed = { 1_700_000_000_000L };\n        Sheet t = Sheet.standard(() -&gt; fixed[0]);\n        t.set(&quot;A1&quot;, &quot;=NOW()&quot;);\n        t.set(&quot;A2&quot;, &quot;=A1+0&quot;);\n        check(numOf(t, &quot;A1&quot;) == 1_700_000_000_000L, &quot;time is injected: NOW() is whatever the test&#x27;s clock says&quot;);\n        check(t.lastEditMs() == fixed[0], &quot;and the edit stamp comes from the same injected clock&quot;);\n        fixed[0] += 60_000;\n        t.set(&quot;A1&quot;, &quot;=NOW()&quot;);\n        check(numOf(t, &quot;A2&quot;) == 1_700_000_060_000L, &quot;re-posting a volatile cell a minute later moves it and its dependents&quot;);\n\n        // 9. a structural edit: inserting a row must rewrite every formula below it, or the sheet quietly\n        //    prints the wrong total; deleting a row must shrink a range that spanned it and say #REF! only\n        //    where a formula really pointed INTO it. And a copied formula moves its relative references only.\n        Sheet g = Sheet.standard();\n        g.set(&quot;A1&quot;, &quot;10&quot;); g.set(&quot;A2&quot;, &quot;20&quot;); g.set(&quot;A3&quot;, &quot;30&quot;);\n        g.set(&quot;B1&quot;, &quot;=SUM(A1:A3)&quot;); g.set(&quot;C1&quot;, &quot;=A2*10&quot;);\n        check(numOf(g, &quot;B1&quot;) == 60 &amp;&amp; numOf(g, &quot;C1&quot;) == 200, &quot;before: B1 = 60 and C1 = 200&quot;);\n        GridEditor.insertRow(g, 2);\n        check(g.raw(&quot;B1&quot;).equals(&quot;=SUM(A1:A4)&quot;), &quot;inserting a row grew the range with it: B1 is now &quot; + g.raw(&quot;B1&quot;));\n        check(g.raw(&quot;C1&quot;).equals(&quot;=A3*10&quot;), &quot;and the single reference followed the cell it pointed at: C1 is now &quot; + g.raw(&quot;C1&quot;));\n        check(numOf(g, &quot;B1&quot;) == 60 &amp;&amp; numOf(g, &quot;C1&quot;) == 200, &quot;so both values are exactly what they were: no silent wrong total&quot;);\n        check(g.raw(&quot;A2&quot;).isEmpty(), &quot;and the inserted row really is blank&quot;);\n        GridEditor.deleteRow(g, 2);\n        check(g.raw(&quot;B1&quot;).equals(&quot;=SUM(A1:A3)&quot;) &amp;&amp; numOf(g, &quot;B1&quot;) == 60, &quot;deleting the blank row put it back: &quot; + g.raw(&quot;B1&quot;));\n        GridEditor.deleteRow(g, 2);                                // now delete a row that had a cell in it\n        check(g.raw(&quot;B1&quot;).equals(&quot;=SUM(A1:A2)&quot;) &amp;&amp; numOf(g, &quot;B1&quot;) == 40,\n                &quot;a range that merely spanned the deleted row shrinks: &quot; + g.raw(&quot;B1&quot;) + &quot; = &quot; + g.get(&quot;B1&quot;).display());\n        check(g.raw(&quot;C1&quot;).equals(&quot;=#REF!*10&quot;) &amp;&amp; g.get(&quot;C1&quot;).display().equals(&quot;#REF!&quot;),\n                &quot;a formula that pointed INTO it says #REF! in the bar and in the box: &quot; + g.raw(&quot;C1&quot;));\n\n        Sheet cp = Sheet.standard();\n        cp.set(&quot;A1&quot;, &quot;2&quot;); cp.set(&quot;B1&quot;, &quot;3&quot;); cp.set(&quot;A2&quot;, &quot;20&quot;); cp.set(&quot;B2&quot;, &quot;30&quot;);\n        cp.set(&quot;C1&quot;, &quot;=A1+B1&quot;); cp.set(&quot;D1&quot;, &quot;=$A$1+B1&quot;); cp.set(&quot;E1&quot;, &quot;=(A1+B1)*2&quot;);\n        GridEditor.copy(cp, &quot;C1&quot;, &quot;C2&quot;); GridEditor.copy(cp, &quot;D1&quot;, &quot;D2&quot;); GridEditor.copy(cp, &quot;E1&quot;, &quot;E2&quot;);\n        check(cp.raw(&quot;C2&quot;).equals(&quot;=A2+B2&quot;) &amp;&amp; numOf(cp, &quot;C2&quot;) == 50, &quot;a copied formula moves its references: &quot; + cp.raw(&quot;C2&quot;));\n        check(cp.raw(&quot;D2&quot;).equals(&quot;=$A$1+B2&quot;) &amp;&amp; numOf(cp, &quot;D2&quot;) == 32, &quot;an anchored reference does not move: &quot; + cp.raw(&quot;D2&quot;));\n        check(cp.raw(&quot;E2&quot;).equals(&quot;=(A2+B2)*2&quot;) &amp;&amp; numOf(cp, &quot;E2&quot;) == 100, &quot;and the brackets survive the round trip: &quot; + cp.raw(&quot;E2&quot;));\n\n        Sheet wide = Sheet.standard();\n        wide.set(&quot;B1&quot;, &quot;=SUM(A1:A1000)&quot;);\n        BlockRangeIndex idx = new BlockRangeIndex();\n        idx.add(CellRef.parse(&quot;B1&quot;), new Rect(0, 0, 999, 0));\n        check(wide.edgeCount() == 1000, &quot;one edge per cell: a 1000-cell range is &quot; + wide.edgeCount() + &quot; edges in the plain graph&quot;);\n        check(idx.entries() == 16, &quot;as 64-cell blocks it is &quot; + idx.entries() + &quot; entries, and the lookup is still one map get&quot;);\n        check(idx.readersOf(CellRef.parse(&quot;A500&quot;)).contains(CellRef.parse(&quot;B1&quot;)), &quot;and B1 is still found as a reader of A500&quot;);\n        check(idx.readersOf(CellRef.parse(&quot;B500&quot;)).isEmpty(), &quot;while B500, which the range does not cover, has no readers&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n\n    /** Eight threads adding 1 to D1, 250 times each: as one locked update(), or as get() then set(). */\n    static long increments(boolean atomic) throws Exception {\n        Sheet s = Sheet.standard();\n        s.set(&quot;D1&quot;, &quot;0&quot;);\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; fs = new ArrayList&lt;&gt;();\n        for (int t = 0; t &lt; 8; t++) fs.add(pool.submit(() -&gt; {\n            go.await();\n            for (int k = 0; k &lt; 250; k++) {\n                if (atomic) s.update(&quot;D1&quot;, v -&gt; v + 1);\n                else s.set(&quot;D1&quot;, new Num(Evaluator.num(s.get(&quot;D1&quot;)) + 1).display());\n            }\n            return null;\n        }));\n        go.countDown();\n        for (Future&lt;?&gt; f : fs) f.get();\n        pool.shutdown();\n        return (long) (double) Evaluator.num(s.get(&quot;D1&quot;));\n    }\n\n    /** Did every cell in the recalculation order come after every cell it reads that is also in the order? */\n    static boolean inDependencyOrder(List&lt;String&gt; order, Map&lt;String, List&lt;String&gt;&gt; reads) {\n        for (int i = 0; i &lt; order.size(); i++)\n            for (String p : reads.getOrDefault(order.get(i), List.of())) {\n                int j = order.indexOf(p);\n                if (j &gt; i) return false;\n            }\n        return true;\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design a spreadsheet. A user types into a cell by its address &mdash; \"A1\" &mdash; and what they type is either a value or a formula like <code>=SUM(A1:A3)*2</code>. When a cell changes, everything that reads it has to change too. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (what a cell can hold, and what a circular reference does, first); then type in the order of Main.java: CellRef, the four Value records, the five Expr records, the Parser, the SheetFunction interface with NumericFunction, the four functions that extend it and the three that decline it, the FunctionRegistry, the ValueSource and the Evaluator, Cell, DependencyGraph, then Sheet with its read-write lock and the order inside <code>set</code>, then a main with eight threads on one cell.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Add a MEDIAN function. Then add IFERROR, which has to swallow the error every other function propagates.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>MEDIAN is a class and one <code>register()</code> line. It extends NumericFunction, so the error propagation, the blank-skipping and the text coercion are already written and it only supplies <code>reduce</code>: sort, take the middle. IFERROR is the interesting half, because it is the one function that must <i>see</i> an error rather than pass it on &mdash; so it implements SheetFunction directly and declines the base class, exactly as IF and COUNT do. That is the whole point of putting propagation in a base class with a documented opt-out instead of in the evaluator: a function that needs the other behaviour simply does not extend it. No engine file is opened for either. VLOOKUP is in the same block, and it shows what the flattening of ranges costs: a function is handed a flat list of values and never sees the rectangle, so the table's width has to be handed to it separately.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a new function -- MEDIAN is one class and one register() line. This is the axis the design exists for.\n/** MEDIAN of the numeric arguments. Extends the base class, so it gets error propagation and blank-skipping free. */\nfinal class MedianFunction extends NumericFunction {\n    public String name() { return &quot;MEDIAN&quot;; }\n    protected Value reduce(List&lt;Double&gt; n) {\n        List&lt;Double&gt; s = new ArrayList&lt;&gt;(n);\n        Collections.sort(s);\n        int m = s.size();\n        return new Num(m % 2 == 1 ? s.get(m / 2) : (s.get(m / 2 - 1) + s.get(m / 2)) / 2);\n    }\n}\n\n/** VLOOKUP over a flattened range: the first column is keys, the rest are columns of answers. */\nfinal class VlookupFunction implements SheetFunction {\n    private final int width;\n    /** width = how many columns the flattened table has, because a range arrives as a flat list of values. */\n    VlookupFunction(int width) { this.width = width; }\n    public String name() { return &quot;VLOOKUP&quot;; }\n    public Value apply(List&lt;Value&gt; args) {\n        if (args.size() &lt; 3) return new Err(&quot;#VALUE!&quot;);\n        Value key = args.get(0);\n        Double col = Evaluator.num(args.get(args.size() - 1));\n        if (col == null) return new Err(&quot;#VALUE!&quot;);\n        List&lt;Value&gt; table = args.subList(1, args.size() - 1);\n        for (int r = 0; r + width &lt;= table.size(); r += width)\n            if (table.get(r).display().equals(key.display())) return table.get(r + col.intValue() - 1);\n        return new Err(&quot;#N/A&quot;);\n    }\n}\n\n// ---- ext: IFERROR -- the one function that must SEE an error, so it declines the propagating base class\n/** IFERROR(value, fallback): the only function allowed to swallow an error, which is why it is not a NumericFunction. */\nfinal class IfErrorFunction implements SheetFunction {\n    public String name() { return &quot;IFERROR&quot;; }\n    public Value apply(List&lt;Value&gt; args) {\n        if (args.size() != 2) return new Err(&quot;#VALUE!&quot;);\n        return args.get(0) instanceof Err ? args.get(1) : args.get(0);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two collaborators type at the same instant. Prove you cannot lose an edit, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading a cell and writing it back. <code>update()</code> does the whole read-modify-write inside one write lock, so no other writer can run in the gap; <code>get()</code> then <code>set()</code> is two lock acquisitions with a gap between them, and the test runs both to show the difference is the boundary of the critical section and nothing else. Eight threads wait on one latch and each add one to the same cell two hundred and fifty times: through <code>update()</code> the cell lands on exactly 2000, through get-then-set it lands somewhere near 1100. The second half of the test is the other shape of the same race: fifty threads write fifty different cells that all feed one SUM, and afterwards the total must equal the cells &mdash; a sheet where it does not is arithmetically impossible, which is a stronger claim than \"no exception was thrown\".</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. fifty threads write fifty DIFFERENT cells that all feed one total: no edit may be lost, and\n        //    when the dust settles the total must equal the cells, or the sheet is arithmetically impossible.\n        Sheet grid = Sheet.standard();\n        for (int i = 1; i &lt;= 50; i++) grid.set(&quot;A&quot; + i, &quot;0&quot;);\n        grid.set(&quot;B1&quot;, &quot;=SUM(A1:A50)&quot;);\n        grid.set(&quot;B2&quot;, &quot;=B1*2&quot;);\n        ExecutorService pool = Executors.newFixedThreadPool(8);\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; fs = new ArrayList&lt;&gt;();\n        for (int i = 1; i &lt;= 50; i++) {\n            final int n = i;\n            fs.add(pool.submit(() -&gt; { go.await(); return grid.set(&quot;A&quot; + n, String.valueOf(n)); }));\n        }\n        go.countDown();\n        int landed = 0;\n        for (Future&lt;?&gt; f : fs) { f.get(); landed++; }\n        check(landed == 50, &quot;50 concurrent edits to 50 different cells all landed&quot;);\n        double sum = 0;\n        for (int i = 1; i &lt;= 50; i++) sum += numOf(grid, &quot;A&quot; + i);\n        check(sum == 1275, &quot;every individual cell holds what its thread wrote: 1 + 2 + ... + 50 = &quot; + (long) sum);\n        check(numOf(grid, &quot;B1&quot;) == 1275, &quot;the total is consistent with the cells it reads: B1 = &quot; + grid.get(&quot;B1&quot;).display());\n        check(numOf(grid, &quot;B2&quot;) == 2550, &quot;and the formula that reads the total is consistent too: B2 = &quot; + grid.get(&quot;B2&quot;).display());\n\n        // 2. eight typists on ONE cell. get() then set() is two steps with a gap; update() is one step\n        //    under one write lock. Only the boundary of the critical section changes.\n        check(increments(true) == 2000, &quot;update(): 8 threads x 250 increments = exactly 2000&quot;);\n        long lossy = increments(false);\n        check(lossy &lt;= 2000, &quot;get() then set(): &quot; + lossy + &quot; of 2000 (the gap between the two calls loses edits)&quot;);\n        pool.shutdown();\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock on the whole sheet. Have you just serialised the spreadsheet?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No, and the answer is arithmetic. The locked part is one forward walk over the dependents map, one set lookup per cell the new formula reads, a rewire of a few edges, Kahn's algorithm over the affected set and one evaluation per affected cell: 0.9 microseconds for an edit that touches three cells and 11.5 for a hundred-cell column, both printed by step 7 of Main.java. A person types five characters a second, so ten collaborators are fifty edits a second, which is forty-five microseconds of lock in every second: five thousandths of one per cent. And it is a read-write lock, so the repaints &mdash; most of what a grid actually does &mdash; never wait for each other at all. If you ever needed more, the ladder is move 8, and the first rung is the code below: an immutable snapshot behind one volatile reference, so a reader takes no lock whatsoever.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: lock-free readers -- an immutable snapshot behind one volatile reference, rebuilt as edits land\n/**\n * A read path that takes no lock at all: every edit publishes a new immutable map, and readers follow one\n * volatile reference. A million cells being repainted never wait for a typist.\n */\nfinal class SnapshotView {\n    private volatile Map&lt;CellRef, Value&gt; view = Map.of();\n    /** Subscribe to a sheet. Each committed change is merged into a fresh immutable map and published. */\n    SnapshotView(Sheet sheet) { sheet.addListener(this::merge); }\n    private synchronized void merge(CellChange c) {\n        Map&lt;CellRef, Value&gt; next = new HashMap&lt;&gt;(view);\n        next.put(c.ref(), c.after());\n        view = Map.copyOf(next);                                              // one volatile write publishes the whole map\n    }\n    /** Read with no lock. At most one edit behind, because listeners run after the write lock is released. */\n    Value get(String a1) { return view.getOrDefault(CellRef.parse(a1), Blank.IT); }\n    /** How many cells the current snapshot holds. */\n    int size() { return view.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; Somebody types =A1 into A1, or builds a loop six cells long. What is the state of the sheet?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was, and there is no rollback code anywhere. The order is the answer: the text is parsed outside the lock, then the write lock is taken and the sheet walks forward from the edited cell over the dependents map to collect everything that would have to recompute. If any cell the new formula reads is already in that set, then that cell reads this one and this one is about to read it, so it throws &mdash; and at that moment not one edge has been rewired and not one value has been written. The test asserts the strong version of that claim: after a refused edit the cell's text is the same, every value is the same, and the cell count and the edge count are the same. The walk is free, incidentally, because it is the same set the recalculation needs.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Text, its tree, and the cells that tree reads. Computed before the lock is taken: this part can throw. */\n    private record Prepared(String text, Expr expr, Set&lt;CellRef&gt; refs) { }\n\n    private Prepared prepare(String text) {\n        Expr parsed;\n        try { parsed = Parser.parseInput(text); }\n        catch (RuntimeException syntax) { parsed = new Lit(new Err(&quot;#PARSE!&quot;)); }   // a typo is a value, not a crash\n        Set&lt;CellRef&gt; refs = new LinkedHashSet&lt;&gt;();\n        parsed.collectRefs(refs);                                   // a range over the cap throws here: the sheet is untouched\n        return new Prepared(text, parsed, refs);\n    }\n\n    /** Steps 2 to 4, with the write lock held. Returns the recalculation order; fills `changes` for the listeners. */\n    private List&lt;String&gt; commit(CellRef ref, Prepared p, List&lt;CellChange&gt; changes) {\n        Set&lt;CellRef&gt; affected = graph.affectedBy(ref);              // 2. one walk: the dirty set AND the cycle test\n        for (CellRef pre : p.refs())\n            if (affected.contains(pre))                             //    a new precedent that already reads me is a loop\n                throw new CircularReferenceException(closed(graph.path(ref, pre), ref));\n        graph.setPrecedents(ref, p.refs());                         // 3. only now commit: edges, then text and tree\n        removed.remove(ref);\n        cells.computeIfAbsent(ref, Cell::new).bind(p.text(), p.expr());\n        edits++; lastEditMs = clock.nowMs();\n        List&lt;String&gt; order = new ArrayList&lt;&gt;(affected.size());\n        recompute(graph.topoOrder(affected), order, changes);       // 4. each affected cell once, after its inputs\n        return order;\n    }\n\n    private void recompute(List&lt;CellRef&gt; order, List&lt;String&gt; names, List&lt;CellChange&gt; changes) {\n        for (CellRef c : order) {\n            Cell cell = cells.get(c);\n            if (cell == null) continue;                             // an address somebody points at but nobody typed into\n            names.add(c.a1());\n            Value before = cell.value();\n            Value after = evaluator.eval(cell.expr(), this::read);\n            if (!after.equals(before)) { cell.setValue(after); changes.add(new CellChange(c, before, after)); }\n        }\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>5 &middot; I edit one cell of a sheet with a million cells. Show me you do not recompute the sheet.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The recalculation walks the dependency graph, not the grid. <code>set</code> returns the addresses it recomputed, in order, which is how the claim is checked rather than asserted: edit A1 in the demo sheet and the order comes back <code>[A1, A3, C1, B1, C2, B2]</code> &mdash; A2 is not in it, because A2 does not read A1, nor anything that reads A1. The set is a forward breadth-first walk over the dependents map, so it is proportional to what the edit affects and completely independent of how big the sheet is. Kahn's algorithm restricted to that set then puts them in an order where every cell comes after everything it reads, and each cell is evaluated exactly once, even in a diamond where two paths reach the same cell.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Who reads whom, in both directions. Precedents (what this cell reads) answer &quot;would this edit make a\n * loop?&quot;; dependents (who reads this cell) answer &quot;who has to be recomputed?&quot;. It stores addresses only,\n * never Cell objects, so an edge to a cell nobody has typed into yet is perfectly legal.\n */\nfinal class DependencyGraph {\n    private final Map&lt;CellRef, Set&lt;CellRef&gt;&gt; precedents = new HashMap&lt;&gt;();\n    private final Map&lt;CellRef, Set&lt;CellRef&gt;&gt; dependents = new HashMap&lt;&gt;();\n\n    /** What this cell reads. */\n    Set&lt;CellRef&gt; precedentsOf(CellRef c) { return precedents.getOrDefault(c, Set.of()); }\n    /** Who reads this cell. */\n    Set&lt;CellRef&gt; dependentsOf(CellRef c) { return dependents.getOrDefault(c, Set.of()); }\n\n    /**\n     * Everything that would have to be recomputed if this cell changed: itself, then forward over dependents.\n     * One walk, two jobs -- it is also the set a new precedent must not be in, or the edit makes a loop.\n     */\n    Set&lt;CellRef&gt; affectedBy(CellRef from) {\n        Set&lt;CellRef&gt; seen = new LinkedHashSet&lt;&gt;();\n        Deque&lt;CellRef&gt; q = new ArrayDeque&lt;&gt;();\n        seen.add(from); q.add(from);\n        while (!q.isEmpty()) { CellRef c = q.poll(); for (CellRef d : dependentsOf(c)) if (seen.add(d)) q.add(d); }\n        return seen;\n    }\n\n    /**\n     * Point this cell at a new set of precedents. Old edges are removed first: the classic leak is a stale\n     * edge, where a cell keeps being recomputed by a cell it no longer reads.\n     */\n    void setPrecedents(CellRef cell, Set&lt;CellRef&gt; refs) {\n        for (CellRef old : precedentsOf(cell)) {\n            Set&lt;CellRef&gt; d = dependents.get(old);\n            if (d != null) { d.remove(cell); if (d.isEmpty()) dependents.remove(old); }\n        }\n        if (refs.isEmpty()) precedents.remove(cell); else precedents.put(cell, new LinkedHashSet&lt;&gt;(refs));\n        for (CellRef p : refs) dependents.computeIfAbsent(p, k -&gt; new LinkedHashSet&lt;&gt;()).add(cell);\n    }\n\n    /**\n     * Kahn&#x27;s algorithm restricted to the dirty set: each cell comes out exactly once, after every precedent\n     * of it that is also dirty. That is a correctness property, not a speed-up -- out of order, a cell reads\n     * a stale input. Throws if the set is not acyclic, which the cycle check has already made impossible.\n     */\n    List&lt;CellRef&gt; topoOrder(Set&lt;CellRef&gt; dirty) {\n        Map&lt;CellRef, Integer&gt; indeg = new HashMap&lt;&gt;();\n        for (CellRef c : dirty) { int n = 0; for (CellRef p : precedentsOf(c)) if (dirty.contains(p)) n++; indeg.put(c, n); }\n        Deque&lt;CellRef&gt; q = new ArrayDeque&lt;&gt;();\n        for (CellRef c : dirty) if (indeg.get(c) == 0) q.add(c);\n        List&lt;CellRef&gt; out = new ArrayList&lt;&gt;(dirty.size());\n        while (!q.isEmpty()) {\n            CellRef c = q.poll();\n            out.add(c);\n            for (CellRef d : dependentsOf(c)) if (dirty.contains(d) &amp;&amp; indeg.merge(d, -1, Integer::sum) == 0) q.add(d);\n        }\n        if (out.size() != dirty.size()) throw new IllegalStateException(&quot;the graph is not a DAG&quot;);\n        return out;\n    }\n\n    /** The chain of reads from `from` to `to` over dependents, for a readable cycle message. */\n    List&lt;CellRef&gt; path(CellRef from, CellRef to) {\n        Map&lt;CellRef, CellRef&gt; parent = new HashMap&lt;&gt;();\n        Deque&lt;CellRef&gt; q = new ArrayDeque&lt;&gt;();\n        q.add(from); parent.put(from, null);\n        while (!q.isEmpty()) {\n            CellRef c = q.poll();\n            if (c.equals(to)) break;\n            for (CellRef d : dependentsOf(c)) if (!parent.containsKey(d)) { parent.put(d, c); q.add(d); }\n        }\n        LinkedList&lt;CellRef&gt; out = new LinkedList&lt;&gt;();\n        for (CellRef c = to; c != null; c = parent.get(c)) out.addFirst(c);\n        return out;\n    }\n\n    /** How many edges the graph holds. A test uses it to prove a rejected edit left no trace. */\n    int edgeCount() { int n = 0; for (Set&lt;CellRef&gt; s : precedents.values()) n += s.size(); return n; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>6 &middot; The screen asks &quot;what is in B7?&quot; a thousand times a second while somebody scrolls. Make it O(1).</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It already is. Every cell caches the value it was last computed to, and only a recalculation pass ever rewrites that, so a read is one hash lookup that evaluates nothing: about 25 nanoseconds, printed by step 7 of Main.java. That is the eager choice paying off &mdash; the sheet does the work once, while it already holds the write lock, instead of once per read. The read lock costs almost nothing and lets every other reader in at the same time; it exists only so that a reader cannot see a sheet halfway through a pass. If even that mattered, the snapshot extension drops it: the sheet publishes an immutable map behind one volatile reference after each edit, and readers follow the reference with no lock whatsoever, at most one edit behind.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Add a listener. Copy-on-write, so a repaint can subscribe while an edit is running. */\n    void addListener(ChangeListener l) { listeners.add(l); }\n\n    // ---------------- reads: one hash lookup, never an evaluation ----------------\n    /** The value in that box. O(1): the cached value, computed when something it reads last changed. */\n    Value get(String a1) { return get(CellRef.parse(a1)); }\n    /** The value at that address. */\n    Value get(CellRef ref) { lock.readLock().lock(); try { return read(ref); } finally { lock.readLock().unlock(); } }\n    /** What the user typed there: the formula bar, not the value. */\n    String raw(String a1) {\n        lock.readLock().lock();\n        try { Cell c = cells.get(CellRef.parse(a1)); return c == null ? &quot;&quot; : c.raw(); }\n        finally { lock.readLock().unlock(); }\n    }\n    /** How many boxes have ever been typed into. The grid is sparse: blanks cost nothing. */\n    int cellCount() { lock.readLock().lock(); try { return cells.size(); } finally { lock.readLock().unlock(); } }\n    /**\n     * Every address that has been typed into, in reading order. What a save, a repaint of the whole grid, or\n     * a structural edit (insert a row) walks; the grid is sparse, so this is the typed cells, not the plane.\n     */\n    List&lt;CellRef&gt; addresses() {\n        lock.readLock().lock();\n        try { List&lt;CellRef&gt; out = new ArrayList&lt;&gt;(cells.keySet()); Collections.sort(out); return out; }\n        finally { lock.readLock().unlock(); }\n    }\n    /** How many read-edges the graph holds. Used by a test to prove a refused edit changed nothing. */\n    int edgeCount() { lock.readLock().lock(); try { return graph.edgeCount(); } finally { lock.readLock().unlock(); } }\n    /** When the last committed edit happened, by the injected clock. */\n    long lastEditMs() { lock.readLock().lock(); try { return lastEditMs; } finally { lock.readLock().unlock(); } }\n    /** How many edits have been committed. */\n    long edits() { lock.readLock().lock(); try { return edits; } finally { lock.readLock().unlock(); } }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; =SUM(A1:A1000) is one formula and a thousand edges in your graph. Now put a hundred of those on the sheet.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A range is expanded into its cells today, so that formula really is a thousand precedent edges &mdash; the test prints the number &mdash; and a hundred such formulas are a hundred thousand edges to build on every edit and walk on every recalculation. The fix is to stop storing a range cell by cell. File each range once per 64-by-64 block of the grid it overlaps: sixteen entries instead of a thousand for a column of that length, and \"who reads A500?\" becomes one map lookup on that cell's block plus a containment test on the few rectangles filed there. An interval tree or an R-tree is the same idea with a sharper lookup, and they are the names to say; blocks are what real grid engines use, because a block id is a shift and a map get. Until then, the cap &mdash; twenty thousand cells, checked before the lock is taken &mdash; is what stops a fat-fingered <code>=SUM(A1:Z10000)</code> from stalling every typist on the sheet.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a range is one edge, not a thousand -- blocks, so =SUM(A1:A1000) does not put a thousand edges in the graph\n/** A rectangle of addresses, the way a formula writes a range. */\nrecord Rect(int r1, int c1, int r2, int c2) {\n    /** Is this address inside the rectangle? */\n    boolean covers(CellRef c) { return c.row() &gt;= r1 &amp;&amp; c.row() &lt;= r2 &amp;&amp; c.col() &gt;= c1 &amp;&amp; c.col() &lt;= c2; }\n}\n\n/**\n * The other way to hold a range&#x27;s dependency. The graph in Main.java gives =SUM(A1:A1000) one edge per cell,\n * so a hundred such formulas are a hundred thousand edges to build and walk. Here a range is filed once per\n * 64x64 block it overlaps -- sixteen entries instead of a thousand -- and &quot;who reads A500?&quot; is one block\n * lookup plus a containment test on the few ranges filed in that block. An interval tree or an R-tree is the\n * same idea wit

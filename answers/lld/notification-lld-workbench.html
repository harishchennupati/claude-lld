8.4 us</text></g><g transform=\"translate(974 193)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">caller 9</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 9.6 us</text></g><g transform=\"translate(1092 193)\"><rect width=\"106\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"53.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">caller 10</text><text x=\"53.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">waits 10.8 us</text></g><text x=\"615\" y=\"261\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the tenth waits about eleven microseconds for the gate, and then up to two hundred milliseconds for its own gateway call:</text><text x=\"615\" y=\"279\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one at a time is true, and nobody can tell, because nothing slow is allowed inside the gate -- and two different users never meet at all</text></svg></div><div class=\"move\"><p>The question you will be asked: if every submit takes a lock, have you serialised the notification service (made it one at a time)? For one user, for about 1.2 microseconds, yes. Inside the gate there is a set lookup for the mute, one time-zone lookup for the local hour, one array read and write for the daily count, and one <code>putIfAbsent</code> for the key: roughly six hash operations, none of which can block. Everything slow is outside it. The template is rendered before the gate is taken, on purpose: that is the part that can throw, and it must not leave a quota half-spent. The gateway call, forty to two hundred milliseconds, happens on a worker with no lock held at all. The wait before a retry happens on a shared timer, not by sleeping a worker. That is the difference between a slow provider costing you nothing and a slow provider taking down every channel. So when ten threads submit for the same user at the same instant, the tenth waits about eleven microseconds for the gate, then waits on its own gateway call like everybody else.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"185\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one gate per user: is it a bottleneck? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">the gated part of a submit: about six map operations, 1.2 us</text><text x=\"35\" y=\"89\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a flash sale: 2,000 submits a second over two million users</text><text x=\"35\" y=\"112\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">that is one per user every 17 minutes on average; even a user</text><text x=\"35\" y=\"135\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">who gets 5 a second holds the gate 6 us a second: 0.0006% busy</text><text x=\"35\" y=\"158\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">so the gate is not the bottleneck. The gateway is:</text><text x=\"35\" y=\"181\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">8 workers x 50 ms per send = 160 sends a second, not 2,000</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1 size each pool by rate x latency</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">Little's law: 500 SMS/s x 80 ms = 40 threads, one pool per channel</text></g><g transform=\"translate(600 108)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2 stop parking threads on sockets</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">non-blocking provider clients: 8 threads can hold 10,000 calls open</text></g><g transform=\"translate(600 158)\"><rect width=\"600\" height=\"42\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"15.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3 a broker, and many instances</text><text x=\"300.0\" y=\"31.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a topic per priority class, Redis SET NX for the claim, a row per record</text></g></svg></div><div class=\"move\"><p>A flash sale is two thousand submits a second, spread across two million users. That is one submit per user every seventeen minutes on average. Even a user who gets five a second holds their gate for six microseconds a second: 0.0006 per cent busy. The gate is not the bottleneck, and saying so out loud is half the answer. The gateway is: eight workers each blocked for fifty milliseconds per send make a hundred and sixty sends a second, not two thousand, and that is the number to fix. The ladder, in the order you would climb it. First, size each pool by rate times latency (how long each call takes); that is Little's law, and it says five hundred SMS a second at eighty milliseconds each needs forty threads. Give each channel its own pool, so a slow SMS provider cannot take email with it. Second, stop parking threads on sockets: non-blocking provider clients (they do not hold a thread while waiting for the reply) let eight threads keep ten thousand calls open. Third, and only then, leave the process: a message broker (a queue outside the process, like Kafka or SQS) with a topic per priority class, the claim in Redis, a row per record in a database. Say the arithmetic first; climbing the ladder without it is complexity nobody asked for.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 500\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 14)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the client retried a timed-out call</text></g><path d=\"M350 31 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 14)\"><rect width=\"820\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">claim the key with putIfAbsent; test 1: fifty threads, one claim, one gateway call</text></g><g transform=\"translate(30 52)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the gateway timed out: did it send?</text></g><path d=\"M350 69 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 52)\"><rect width=\"820\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">record UNKNOWN and retry with the SAME key; test 2: three attempts, ends SENT</text></g><g transform=\"translate(30 90)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the address is malformed</text></g><path d=\"M350 107 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 90)\"><rect width=\"820\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">permanent means no retry at all; test 3: one call, then the dead-letter list</text></g><g transform=\"translate(30 128)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">it sat in the queue past its deadline</text></g><path d=\"M350 145 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 128)\"><rect width=\"820\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">check the deadline before the send; test 4: EXPIRED, the gateway never called</text></g><g transform=\"translate(30 166)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a receipt for an old attempt arrives</text></g><path d=\"M350 183 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 166)\"><rect width=\"820\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a move must raise the rank or do nothing; test 5: the stale receipt changes nothing</text></g><g transform=\"translate(30 204)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3am where the recipient lives</text></g><path d=\"M350 221 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 204)\"><rect width=\"820\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">defer to 08:00 local, do not drop; test 6: held until 08:00 sharp, OTPs walk through</text></g><g transform=\"translate(30 242)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a duplicate eats the daily quota</text></g><path d=\"M350 259 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 242)\"><rect width=\"820\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a guard undoes whatever it reserved; test 7: still one slot used, not two</text></g><g transform=\"translate(30 280)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the provider SDK or a listener throws</text></g><path d=\"M350 297 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 280)\"><rect width=\"820\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one try/catch each, UNKNOWN for the adapter; test 8: the message still goes out</text></g><g transform=\"translate(30 318)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the queue is full in a flash sale</text></g><path d=\"M350 335 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 318)\"><rect width=\"820\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">refuse at the door and undo every reservation; test 9: the slot and the key come back</text></g><g transform=\"translate(30 356)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">push failed: fall back to SMS?</text></g><path d=\"M350 373 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 356)\"><rect width=\"820\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">only a FAILURE climbs, a mute is a decision; test 10: a suppression climbs nothing</text></g><g transform=\"translate(30 394)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">parked at 3am, retried, muted at 7</text></g><path d=\"M350 411 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 394)\"><rect width=\"820\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">judge it again when it wakes; test 11: one buzz at 08:00, and the mute holds</text></g><g transform=\"translate(30 432)\"><rect width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cancelled, then its deadline passes</text></g><path d=\"M350 449 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 432)\"><rect width=\"820\" height=\"34\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"410.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">finished states share one rank; test 12: it stays cancelled, no SMS goes out</text></g><text x=\"615\" y=\"485\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this design makes has a failure test: FailureTests.java runs sixteen blocks (13 to 16 prove the follow-ups) and must print ALL PASS</text></svg></div><div class=\"move\"><p>A client retrying a timed-out call (claim the key atomically; fifty threads, one gateway call). A gateway that times out so you do not know whether it sent (record UNKNOWN and retry with the <i>same</i> key). A malformed address (permanent: no retry at all, straight to the dead-letter list). A message that sat in the queue past its deadline (checked before the send, so the gateway is never called). A receipt for an attempt you have already moved past (a move must raise the rank or do nothing). Three in the morning where the recipient lives (defer to eight, do not drop &mdash; and an OTP walks through). A duplicate quietly eating the user's daily quota (a guard undoes whatever it reserved when a later guard refuses). A provider SDK (its client library) or a metrics listener that throws (one try/catch each; a broken listener is not allowed to stop a notification, and a broken adapter becomes an UNKNOWN rather than a lost worker). A flash sale that fills the bounded queue (refuse at the door, and undo every reservation the guards made, so the slot and the key both come back). And a fallback to another channel that climbs past an opt-out (only a FAILURE climbs; a suppression is a decision somebody made). A message parked at 3am, sent twice by the client and muted at 7am (judge it again when it wakes: one message at 08:00, and the mute holds). A cancelled message whose deadline then passes (it stays cancelled, so it cannot turn into a failure and climb to SMS). Each of these is a few lines in FailureTests.java; a design that cannot show its tests is a claim.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"220\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"310\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"880\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"220\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface Sender { SendResult send(to, words, idempotencyKey); }</text><text x=\"880\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a new channel is a class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Chain of Responsibility</text><text x=\"220\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">for (DeliveryGuard g : guards) if (g.check(...) != ALLOW) break;</text><text x=\"880\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">a fifth reason is a class and one list entry</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"220\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">new CircuitBreakerSender(sms, 2, 60_000, clock) -- still a Sender</text><text x=\"880\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">a dead provider stops costing you workers</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"220\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"310\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">fire(from, to, why) after the change, one try/catch each</text><text x=\"880\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">audit, metrics and receipts, none in the way</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"220\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"310\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">moveTo(attempt, state, why): a higher rank, or nothing at all</text><text x=\"880\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">an out-of-order webhook is harmless</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">Builder</text><text x=\"220\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">move 1</text><text x=\"310\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">Notification.to(u, SMS, \"otp\").priority(CRITICAL).dedupeKey(k)</text><text x=\"880\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">seven fields, four optional: earned here</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"220\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"310\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">the service is handed to its callers; nothing calls getInstance()</text><text x=\"880\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">each test builds a fresh one</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"220\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"310\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">the Channel -&gt; Sender map IS the registry, one line each</text><text x=\"880\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">earns the name when channels are config strings</text><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence, and Builder is the one this problem actually earns</text></svg></div><div class=\"move\"><p>The second column is the defence: every name in the table arrived because a move produced it, so each can be defended in a sentence, and none of them is there because a book said so. One row needs more than a line, because it is the pattern people mis-name: a <b>Decorator</b> implements the same interface it wraps. <code>CircuitBreakerSender</code> holds a <code>Sender</code> and <i>is</i> a <code>Sender</code>; <code>JitteredBackoff</code> holds a <code>RetryPolicy</code> and <i>is</i> a <code>RetryPolicy</code>. The engine cannot tell the difference, which is why every channel gets the behaviour without an edit anywhere. And the two grey rows matter as much as the six above them: an interviewer learns more from a pattern you refused than from one you used, and page 05 has the argument for each.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"490\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"590\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"490\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"590\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">a guard knows one rule; a sender one provider; the record the life cycle</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"490\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"590\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">QuietHoursGuard is a new file plus one entry in the list handed to configure()</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"490\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"590\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">sender.send(to, words, key);  never \"is this the SMS one?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one or two methods each</text><text x=\"490\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"590\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">Clock, Scheduler, listener: one method, a lambda fakes it; Sender, guard: two, a tiny class</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"490\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 6</text><text x=\"590\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">configure(templates, directory, policy, guards, senders, clock, scheduler)</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>Read the table as a check, not a recital: every letter should point at a line of your own code, and if one points at nothing you named the principle rather than followed it. The letter carrying the most weight here is I, small interfaces. Clock, Scheduler and DeliveryListener have one method each, so a test fake is a lambda: <code>() -&gt; threeAm</code> is a clock standing at three in the morning. Sender, DeliveryGuard and RetryPolicy have two, so a fake is a ten-line class, like the gateway that times out twice on purpose. That is how the failure suite hands in a clock, a scheduler that runs every retry at once and a broken gateway, and still finishes in a fraction of a second.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">quiet hours, hold till tomorrow, a fraud hold</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"22.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new class behind DeliveryGuard, dger behind a repository, and moveTo becomes</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">UPDATE ... SET state = ?, rank = ? WHERE id = ? AND rank &lt; ?</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the engine, the queue and the tests do not change; that is the test that the derivation was right</text></svg></div><div class=\"move\"><p>A new rule (quiet hours, hold it for tomorrow, a fraud hold) is a new class behind <code>DeliveryGuard</code> plus one entry in the list handed to configure. Someone new who wants to know (delivery receipts, metrics, a data warehouse) is one more listener; the queue and the gate do not move. A new step in a life (BOUNCED, SCHEDULED) is one more state with a rank and the edges it may come from. A new invariant across messages (a rule that must always hold, such as at most one OTP a minute per user) is the check and the reserve inside the <i>same</i> gate, all or nothing. State that must outlive the process (persist it; ten instances) is the ledger behind a repository interface, and <code>moveTo</code> becomes <code>UPDATE ... SET state = ?, rank = ? WHERE id = ? AND rank &lt; ?</code> &mdash; the database refusing the stale write exactly as the compare-and-set does, with the row count as the boolean. For all five the engine, the queue and the tests do not change; that is the test that the derivation was right. Page 05 has the code for each.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 935\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\" t x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">sent / transientFailure</text><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">permanentFailure / unknown</text></g><g transform=\"translate(670 578)\"><rect width=\"240\" height=\"82\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"120.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Verdict</text><line x1=\"0\" y1=\"26\" x2=\"240\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">kind: ALLOW | SUPPRESS</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">      | DEFER</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">reason / untilMs</text></g><g transform=\"translate(930 20)\"><rect width=\"270\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"135.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"135.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Sender</text><line x1=\"0\" y1=\"34\" x2=\"270\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">channel(): Channel</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">send(to, words, key): SendResult</text></g><g transform=\"translate(930 110)\"><rect width=\"270\" height=\"86\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"135.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"135.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DeliveryGuard</text><line x1=\"0\" y1=\"34\" x2=\"270\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" e=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">3am -&gt; defer</text></g><g transform=\"translate(751 716)\"><rect width=\"146\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"73.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DailyCapGuard</text><line x1=\"0\" y1=\"26\" x2=\"146\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">reserves + undoes</text></g><g transform=\"translate(900 716)\"><rect width=\"146\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"73.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">DedupeGuard</text><line x1=\"0\" y1=\"26\" x2=\"146\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">claims the key</text></g><g transform=\"translate(1049 716)\"><rect width=\"146\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"73.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ExponentialBackoff</text><line x1=\"0\" y1=\"26\" x2=\"146\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--text)\">100, 200, 400</text></g><g transform=\"translate(10 822)\"><rect width=\"1190\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"595.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">the stand-ins that main and the tests hand in, and Main itself</text><line x1=\"0\" y1=\"26\" x2=\"1190\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">InMemoryTemplates (holds MessageTemplate) is a TemplateEngine;   InMemoryDirectory is a RecipientDirectory;   InMemoryPreferences is a PreferenceStore</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">InMemoryDedupeStore is a DedupeStore;   TimerScheduler is a Scheduler;   ConsoleAudit and Metrics are DeliveryListeners;   Main runs the demo</text></g><g><path d=\"M20 915L64 915\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"919\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 915L284 915\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"919\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 915L504 915\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"919\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 915L684 915\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"919\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 915L904 915\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"919\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements, and the three buses along the bottom say it once for each family: three senders, four guards, one retry policy. Filled diamond = owns: the service owns one record per notification and one gate per recipient, and a record owns its progress. Plain arrow = references. Dashed green = handed in through <code>configure(...)</code>; the template engine, the directory and the two stores come in the same way, and are left unlabelled only to keep the picture readable. Dotted blue = notifies. <b>Where state lives:</b> a notification holds nothing that moves &mdash; every field is final &mdash; and neither does a recipient, a rendered message, a guard or a sender. Everything that changes is in two places: the <code>Progress</code> inside a record, swapped as one object by compare-and-set, and the service's own queue, ledger, per-user log and gates. Notice what is <i>not</i> here: no Message class separate from Notification, because the words are rendered once at submit and stored on the record; no Retry class, because a retry is a state plus a scheduled re-queue; and no Boolean anywhere near the word \"sent\". The strip at the bottom names the eight small classes that main and the tests hand in, each with the interface it implements, and Main, which runs the demo.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it does; read only those first for the shape, then the bodies for the mechanics. Each copy button copies that whole file for your IDE. Below Main.java: Extensions.java (every follow-up's reference code, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (sixteen blocks of claims proven; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.time.Instant;\nimport java.time.LocalDate;\nimport java.time.ZoneId;\nimport java.time.ZonedDateTime;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.concurrent.locks.*;\n\n/** Which pipe the message goes down. The value is only a key into the registry of senders; the sender is a class. */\nenum Channel { EMAIL, SMS, PUSH, IN_APP }\n\n/** How urgent. Declared CRITICAL first on purpose: the ordinal is what the queue sorts on, so an OTP outranks a promo. */\nenum Priority { CRITICAL, HIGH, NORMAL, LOW }\n\n/**\n * One notification&#x27;s life. Every value carries a rank, and a record only ever moves to a HIGHER rank, so a late\n * message from a provider or a stale timer can never drag it backwards. Non-terminal ranks are scoped to the\n * attempt number (attempt * 100 + rank), which is what lets attempt 2 outrank everything that happened in\n * attempt 1. The finished (terminal) states all share ONE rank above every attempt, so none of them can replace\n * another: a cancelled message never becomes &quot;expired&quot;. DELIVERED alone sits one higher, because a receipt saying\n * the handset got the message is the truth, whatever we wrote before it.\n */\nenum DeliveryState {\n    CREATED(0, false),            // the record exists; nothing has happened yet\n    DEFERRED(5, false),           // parked: a guard said &quot;not now, try at 08:00&quot;\n    QUEUED(10, false),            // in the priority queue, waiting for a worker\n    SENDING(20, false),           // a worker owns it and the gateway call is in flight\n    UNKNOWN(30, false),           // the gateway timed out: we do not know whether it went out\n    RETRY_SCHEDULED(40, false),   // parked on the timer, will be queued again for the next attempt\n    SENT(50, false),              // the gateway accepted it. NOT the same as the human seeing it\n    // finished: these share one rank above every attempt (see Progress.rankOf), so their own number is unused\n    SUPPRESSED(0, true),          // a guard refused it, or the caller cancelled it: no attempt is made after this\n    EXPIRED(0, true),             // its deadline passed while it sat in the queue; the gateway was never called\n    FAILED_FINAL(0, true),        // permanent failure, or the retry budget ran out: dead letter\n    DELIVERED(0, true);           // a receipt from the provider says the handset got it: ranked above the rest\n\n    private final int rank; private final boolean terminal;\n    DeliveryState(int rank, boolean terminal) { this.rank = rank; this.terminal = terminal; }\n    /** Where this state sits within one attempt. Higher wins. */\n    int rank() { return rank; }\n    /** Finished: outranks every attempt, so a stale message cannot reopen the record. */\n    boolean terminal() { return terminal; }\n}\n\n/** What one call to a provider came back with. Four answers, because they need four different next moves. */\nenum SendOutcome { SENT, TRANSIENT, PERMANENT, UNKNOWN }\n\n/**\n * A provider&#x27;s answer. Not a boolean: &quot;the gateway timed out&quot; and &quot;that address has no @ in it&quot; need opposite\n * handling -- retry the first, never the second -- and a boolean cannot tell them apart.\n */\nrecord SendResult(SendOutcome outcome, String detail) {\n    /** The gateway accepted it and gave us a reference to quote in a support ticket. */\n    static SendResult sent(String providerRef) { return new SendResult(SendOutcome.SENT, providerRef); }\n    /** Try again later: throttled, 503, connection refused. The message is still worth sending. */\n    static SendResult transientFailure(String why) { return new SendResult(SendOutcome.TRANSIENT, why); }\n    /** Never try again: malformed address, unsubscribed at the provider, unknown device token. */\n    static SendResult permanentFailure(String why) { return new SendResult(SendOutcome.PERMANENT, why); }\n    /** The call timed out. It may or may not have gone out; the only safe move is to retry with the SAME key. */\n    static SendResult unknown(String why) { return new SendResult(SendOutcome.UNKNOWN, why); }\n}\n\n/** Where time comes from. Injected everywhere, so a test can stand at 03:00 local without sleeping. */\ninterface Clock { long nowMs(); }\n\n/** Where &quot;later&quot; comes from. Production hands in a timer thread; a test hands in one that runs the task inline. */\ninterface Scheduler {\n    /** Run `task` after `delayMs`. Must not run it on a worker that is waiting for it. */\n    void schedule(Runnable task, long delayMs);\n}\n\n/**\n * The person, the four addresses they can be reached at, and their time zone. A zone, not an hour offset: India\n * is UTC+5:30, and a zone that moves its clocks twice a year has no single offset. Quiet hours and the daily cap\n * both need the recipient&#x27;s own clock.\n */\nrecord Recipient(String userId, String email, String phone, String deviceToken, ZoneId zone) {\n    /** The address for one channel, or null if we do not have one. An exhaustive switch, so a new channel fails to compile. */\n    String addressFor(Channel channel) {\n        return switch (channel) {\n            case EMAIL -&gt; email;\n            case SMS -&gt; phone;\n            case PUSH -&gt; deviceToken;\n            case IN_APP -&gt; userId;\n        };\n    }\n}\n\n/** The finished words: a title and a body, rendered once at submit time and never re-rendered. */\nrecord RenderedMessage(String title, String body) {}\n\n/**\n * The request, exactly as the caller made it: who, which channel, how urgent, which template plus parameters,\n * and optionally a de-dup key and a deadline. Every field is final. A submitted notification never changes,\n * which is why a worker thread and a status query can both hold it without a lock.\n */\nfinal class Notification {\n    private static final AtomicLong SEQ = new AtomicLong();\n    private final long seq;\n    private final String id, userId, templateId, category, dedupeKey;\n    private final Channel channel;\n    private final Priority priority;\n    private final Map&lt;String, String&gt; params;\n    private final long deadlineMs;\n\n    private Notification(Builder b) {\n        this.seq = SEQ.incrementAndGet();\n        this.id = &quot;n-&quot; + seq;\n        this.userId = b.userId; this.channel = b.channel; this.templateId = b.templateId;\n        this.category = b.category; this.dedupeKey = b.dedupeKey; this.priority = b.priority;\n        this.params = Map.copyOf(b.params); this.deadlineMs = b.deadlineMs;\n    }\n    /** Start building one. Three fields are required, so they are here; the rest have defaults. */\n    static Builder to(String userId, Channel channel, String templateId) { return new Builder(userId, channel, templateId); }\n\n    String id() { return id; }\n    long seq() { return seq; }\n    String userId() { return userId; }\n    Channel channel() { return channel; }\n    Priority priority() { return priority; }\n    String templateId() { return templateId; }\n    String category() { return category; }\n    String dedupeKey() { return dedupeKey; }\n    Map&lt;String, String&gt; params() { return params; }\n    long deadlineMs() { return deadlineMs; }\n\n    /**\n     * The key we hand the provider so that a retry after a timeout cannot become a second text message. It is the\n     * caller&#x27;s de-dup key when there is one, and our own id otherwise: stable across every attempt either way.\n     */\n    String idempotencyKey() { return dedupeKey == null ? id : userId + &quot;|&quot; + channel + &quot;|&quot; + dedupeKey; }\n\n    @Override public String toString() { return id + &quot;(&quot; + channel + &quot;,&quot; + priority + &quot;,&quot; + templateId + &quot;)&quot;; }\n\n    /** Seven fields, four of them optional: this is a problem where a builder pays for itself. */\n    static final class Builder {\n        private final String userId, templateId; private final Channel channel;\n        private Priority priority = Priority.NORMAL;\n        private String category = &quot;general&quot;, dedupeKey = null;\n        private Map&lt;String, String&gt; params = Map.of();\n        private long deadlineMs = Long.MAX_VALUE;\n        Builder(String userId, Channel channel, String templateId) { this.userId = userId; this.channel = channel; this.templateId = templateId; }\n        Builder priority(Priority p) { this.priority = p; return this; }\n        Builder category(String c) { this.category = c; return this; }\n        /** Two submits with the same key inside the de-dup window produce exactly one message. */\n        Builder dedupeKey(String k) { this.dedupeKey = k; return this; }\n        Builder params(Map&lt;String, String&gt; p) { this.params = p; return this; }\n        /** After this instant the message is pointless: it is dropped without calling the gateway. */\n        Builder deadlineMs(long t) { this.deadlineMs = t; return this; }\n        Notification build() { return new Notification(this); }\n    }\n}\n\n// &quot;product will change the copy every week and will not wait for a deploy&quot; -&gt; template id + params, rendered here\n/** Turns a template id plus parameters into words. Swappable: today a map, tomorrow Handlebars or a CMS. */\ninterface TemplateEngine {\n    /** Render, or throw if there is no template for this id and channel -- which is a permanent failure, caught at submit. */\n    RenderedMessage render(String templateId, Channel channel, Map&lt;String, String&gt; params);\n}\n\n/** One template: two patterns with {{placeholders}}. Keyed by id AND channel, because an SMS is not a push. */\nrecord MessageTemplate(String titlePattern, String bodyPattern) {\n    RenderedMessage render(Map&lt;String, String&gt; params) { return new RenderedMessage(fill(titlePattern, params), fill(bodyPattern, params)); }\n    private static String fill(String pattern, Map&lt;String, String&gt; params) {\n        String out = pattern;\n        for (Map.Entry&lt;String, String&gt; e : params.entrySet()) out = out.replace(&quot;{{&quot; + e.getKey() + &quot;}}&quot;, e.getValue());\n        return out;\n    }\n}\n\n/** The in-memory registry. Templates are registered at start-up and read-only afterwards. */\nfinal class InMemoryTemplates implements TemplateEngine {\n    private final Map&lt;String, MessageTemplate&gt; byIdAndChannel = new ConcurrentHashMap&lt;&gt;();\n    /** Register one template. Returns this, so the whole registry is one expression in main. */\n    InMemoryTemplates register(String templateId, Channel channel, MessageTemplate t) {\n        byIdAndChannel.put(templateId + &quot;|&quot; + channel, t); return this;\n    }\n    public RenderedMessage render(String templateId, Channel channel, Map&lt;String, String&gt; params) {\n        MessageTemplate t = byIdAndChannel.get(templateId + &quot;|&quot; + channel);\n        if (t == null) throw new NoSuchElementException(&quot;no template &quot; + templateId + &quot; for &quot; + channel);\n        return t.render(params);\n    }\n}\n\n/** Where a user id turns into addresses. Behind an interface so it can become a user service or a cache. */\ninterface RecipientDirectory { Recipient lookup(String userId); }\n\n/** A map of people, for the demo and the tests. */\nfinal class InMemoryDirectory implements RecipientDirectory {\n    private final Map&lt;String, Recipient&gt; people = new ConcurrentHashMap&lt;&gt;();\n    InMemoryDirectory add(Recipient r) { people.put(r.userId(), r); return this; }\n    public Recipient lookup(String userId) {\n        Recipient r = people.get(userId);\n        if (r == null) throw new NoSuchElementException(&quot;no such user: &quot; + userId);\n        return r;\n    }\n}\n\n/** What a user has muted. Behind an interface so it becomes a Redis hash without the engine noticing. */\ninterface PreferenceStore { boolean enabled(String userId, Channel channel, String category); }\n\n/** Opt-outs held as a set of &quot;user|channel|category&quot; keys. */\nfinal class InMemoryPreferences implements PreferenceStore {\n    private final Set&lt;String&gt; muted = ConcurrentHashMap.newKeySet();\n    private static String key(String u, Channel c, String cat) { return u + &quot;|&quot; + c + &quot;|&quot; + cat; }\n    /** Mute one category on one channel for one user. */\n    InMemoryPreferences mute(String userId, Channel c, String category) { muted.add(key(userId, c, category)); return this; }\n    public boolean enabled(String userId, Channel channel, String category) { return !muted.contains(key(userId, channel, category)); }\n}\n\n// &quot;the client&#x27;s HTTP call timed out and they retried; the human must not get two OTPs&quot; -&gt; claim the key, atomically\n/**\n * The claim on an idempotency key. claim() must be ONE operation, not &quot;is it there? no? put it&quot; -- that gap is\n * exactly where eight threads all decide they are the first one.\n */\ninterface DedupeStore {\n    /** True if this caller is the first to claim `key` (or the previous claim has expired). False = a duplicate. */\n    boolean claim(String key, long nowMs, long ttlMs);\n    /** Give the key back, because a later step refused the message and it never went out. */\n    void release(String key);\n}\n\n/** putIfAbsent is the whole design: one atomic operation, so exactly one of fifty threads sees null and wins. */\nfinal class InMemoryDedupeStore implements DedupeStore {\n    private final ConcurrentHashMap&lt;String, Long&gt; expiryByKey = new ConcurrentHashMap&lt;&gt;();\n    public boolean claim(String key, long nowMs, long ttlMs) {\n        while (true) {\n            Long previous = expiryByKey.putIfAbsent(key, nowMs + ttlMs);\n            if (previous == null) return true;                        // nobody held it: this thread wins\n            if (previous &gt; nowMs) return false;                       // somebody holds it and it has not expired\n            if (expiryByKey.replace(key, previous, nowMs + ttlMs)) return true;  // expired: exactly one reclaimer\n        }\n    }\n    public void release(String key) { expiryByKey.remove(key); }\n    /** How many keys are held. For tests and for the eviction follow-up. */\n    int size() { return expiryByKey.size(); }\n}\n\n/** What a guard decided: let it through, refuse it with a reason, or park it until a named instant. */\nrecord Verdict(Verdict.Kind kind, String reason, long untilMs) {\n    enum Kind { ALLOW, SUPPRESS, DEFER }\n    static final Verdict ALLOW = new Verdict(Kind.ALLOW, &quot;&quot;, 0);\n    /** Refuse it for good, with a reason a support agent can read. */\n    static Verdict suppress(String reason) { return new Verdict(Kind.SUPPRESS, reason, 0); }\n    /** Not now: hold it until `untilMs` and then send it. */\n    static Verdict defer(long untilMs, String reason) { return new Verdict(Kind.DEFER, reason, untilMs); }\n}\n\n// &quot;muted / too many today / already sent / 3am where they live&quot; arrive from four teams on four different days\n// -&gt; one reason per class, walked in order -&gt; Chain of Responsibility, and each link is a Strategy\n/**\n * One reason a message might not go out. One method to implement, so a fake is a lambda. A guard that reserves\n * something (a daily slot, a de-dup key) also implements undo(), which is called if a LATER guard refuses the\n * message -- otherwise a duplicate submit would quietly eat the user&#x27;s daily quota.\n */\ninterface DeliveryGuard {\n    /** A short name that ends up in the suppression reason, so support can see which rule stopped it. */\n    String name();\n    /** ALLOW, SUPPRESS or DEFER. Always called with the recipient&#x27;s gate held, so read-modify-write is safe here. */\n    Verdict check(Notification n, Recipient r, long nowMs);\n    /** Give back whatever check() reserved. Most guards reserve nothing, so most never override this. */\n    default void undo(Notification n, Recipient r) {}\n}\n\n/** The user unsubscribed. CRITICAL walks through: nobody mutes their own fraud alert. */\nfinal class PreferenceGuard implements DeliveryGuard {\n    private final PreferenceStore store;\n    PreferenceGuard(PreferenceStore store) { this.store = store; }\n    public String name() { return &quot;preference&quot;; }\n    public Verdict check(Notification n, Recipient r, long nowMs) {\n        if (n.priority() == Priority.CRITICAL) return Verdict.ALLOW;\n        return store.enabled(n.userId(), n.channel(), n.category())\n                ? Verdict.ALLOW\n                : Verdict.suppress(&quot;opted out of &quot; + n.category() + &quot; on &quot; + n.channel());\n    }\n}\n\n/**\n * No buzzing phones between 21:00 and 08:00 where the recipient lives. It does not drop the message, it DEFERS\n * it to 08:00 sharp on their clock, because a receipt the user wanted is still wanted at breakfast. Only noisy\n * channels are affected (an in-app badge wakes nobody), and CRITICAL walks through.\n */\nfinal class QuietHoursGuard implements DeliveryGuard {\n    private final int startHour, endHour;\n    private final Set&lt;Channel&gt; noisy;\n    QuietHoursGuard(int startHour, int endHour, Set&lt;Channel&gt; noisy) { this.startHour = startHour; this.endHour = endHour; this.noisy = noisy; }\n    public String name() { return &quot;quiet-hours&quot;; }\n    public Verdict check(Notification n, Recipient r, long nowMs) {\n        if (n.priority() == Priority.CRITICAL) return Verdict.ALLOW;\n        if (!noisy.contains(n.channel())) return Verdict.ALLOW;\n        ZonedDateTime local = Instant.ofEpochMilli(nowMs).atZone(r.zone());     // their wall clock, not ours\n        if (!quiet(local.getHour())) return Verdict.ALLOW;\n        ZonedDateTime opens = local.toLocalDate().atTime(endHour, 0).atZone(r.zone());\n        if (!opens.isAfter(local)) opens = opens.plusDays(1);                    // 22:30 -&gt; tomorrow&#x27;s 08:00\n        return Verdict.defer(opens.toInstant().toEpochMilli(), &quot;quiet hours, held until &quot; + endHour + &quot;:00 local&quot;);\n    }\n    private boolean quiet(int hour) { return startHour &lt;= endHour ? (hour &gt;= startHour &amp;&amp; hour &lt; endHour) : (hour &gt;= startHour || hour &lt; endHour); }\n}\n\n/**\n * At most N non-critical messages per user per day, counted on the recipient&#x27;s own calendar day. It RESERVES a\n * slot inside check(), so two threads cannot both see &quot;one slot left&quot;; undo() gives the slot back when a later\n * guard refuses the message. The per-user counter is only ever touched by a thread holding that user&#x27;s gate,\n * which is why a plain long[] is safe inside a ConcurrentHashMap: the map handles users appearing, the gate\n * handles one user&#x27;s arithmetic. So never share one DailyCapGuard between two services: each has its own gates.\n */\nfinal class DailyCapGuard implements DeliveryGuard {\n    private final int capPerDay;\n    private final ConcurrentHashMap&lt;String, long[]&gt; used = new ConcurrentHashMap&lt;&gt;();   // userId -&gt; [dayIndex, reserved]\n    DailyCapGuard(int capPerDay) { this.capPerDay = capPerDay; }\n    public String name() { return &quot;daily-cap&quot;; }\n    public Verdict check(Notification n, Recipient r, long nowMs) {\n        if (n.priority() == Priority.CRITICAL) return Verdict.ALLOW;\n        long day = Instant.ofEpochMilli(nowMs).atZone(r.zone()).toLocalDate().toEpochDay();   // their day, not UTC&#x27;s\n        long[] slot = used.computeIfAbsent(n.userId(), k -&gt; new long[]{day, 0});\n        if (slot[0] != day) { slot[0] = day; slot[1] = 0; }                 // a new day resets the count\n        if (slot[1] &gt;= capPerDay) return Verdict.suppress(&quot;already had &quot; + capPerDay + &quot; today&quot;);\n        slot[1]++;                                                          // reserve, do not merely count\n        return Verdict.ALLOW;\n    }\n    public void undo(Notification n, Recipient r) {\n        long[] slot = used.get(n.userId());\n        if (slot != null &amp;&amp; slot[1] &gt; 0) slot[1]--;\n    }\n    /** How many slots this user has spent today. For tests and for a &quot;why did I get nothing&quot; screen. */\n    int usedToday(String userId) { long[] s = used.get(userId); return s == null ? 0 : (int) s[1]; }\n}\n\n/** The claim on the idempotency key, taken LAST so a message we were going to refuse anyway does not burn it. */\nfinal class DedupeGuard implements DeliveryGuard {\n    private final DedupeStore store; private final long ttlMs;\n    DedupeGuard(DedupeStore store, long ttlMs) { this.store = store; this.ttlMs = ttlMs; }\n    public String name() { return &quot;dedupe&quot;; }\n    public Verdict check(Notification n, Recipient r, long nowMs) {\n        if (n.dedupeKey() == null) return Verdict.ALLOW;\n        return store.claim(n.idempotencyKey(), nowMs, ttlMs) ? Verdict.ALLOW : Verdict.suppress(&quot;duplicate of &quot; + n.dedupeKey());\n    }\n    public void undo(Notification n, Recipient r) { if (n.dedupeKey() != null) store.release(n.idempotencyKey()); }\n}\n\n// &quot;email, SMS and push differ in exactly one line: the call to the provider&quot; -&gt; hide that line -&gt; Strategy\n/** One provider. The only thing that genuinely differs between email, SMS and push lives behind this method. */\ninterface Sender {\n    Channel channel();\n    /** Hand the message to the provider. The key is stable across retries, so a provider that honours it cannot double-send. */\n    SendResult send(Recipient to, RenderedMessage message, String idempotencyKey);\n}\n\n/** SMTP. A missing &quot;@&quot; is permanent: retrying a malformed address a hundred times helps nobody. */\nfinal class EmailSender implements Sender {\n    private final AtomicInteger calls = new AtomicInteger();\n    public Channel channel() { return Channel.EMAIL; }\n    public SendResult send(Recipient to, RenderedMessage m, String key) {\n        calls.incrementAndGet();\n        String address = to.addressFor(Channel.EMAIL);\n        if (address == null || !address.contains(&quot;@&quot;)) return SendResult.permanentFailure(&quot;not an email address: &quot; + address);\n        return SendResult.sent(&quot;smtp/&quot; + Integer.toHexString(key.hashCode()));\n    }\n    /** How many times the provider was actually called. The tests assert on this. */\n    int calls() { return calls.get(); }\n}\n\n/**\n * An SMS gateway that fails the first N calls for a given idempotency key and then succeeds -- which is what a\n * real one does when it is being restarted. It counts calls PER KEY, so a retry carrying the same key is\n * recognised as the same message, exactly as a provider that honours idempotency would.\n */\nfinal class FlakySmsSender implements Sender {\n    private final int failuresBeforeSuccess;\n    private final boolean timeoutStyle;\n    private final ConcurrentHashMap&lt;String, AtomicInteger&gt; callsByKey = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicInteger calls = new AtomicInteger();\n    FlakySmsSender(int failuresBeforeSuccess, boolean timeoutStyle) { this.failuresBeforeSuccess = failuresBeforeSuccess; this.timeoutStyle = timeoutStyle; }\n    public Channel channel() { return Channel.SMS; }\n    public SendResult send(Recipient to, RenderedMessage m, String key) {\n        calls.incrementAndGet();\n        int n = callsByKey.computeIfAbsent(key, k -&gt; new AtomicInteger()).incrementAndGet();\n        if (n &lt;= failuresBeforeSuccess)\n            return timeoutStyle ? SendResult.unknown(&quot;gateway timed out on call &quot; + n)\n                                : SendResult.transientFailure(&quot;gateway 503 on call &quot; + n);\n        return SendResult.sent(&quot;sms/&quot; + Integer.toHexString(key.hashCode()));\n    }\n    int calls() { return calls.get(); }\n}\n\n/** APNs / FCM. Always accepts, and counts, so the race test can prove the human was texted exactly once. */\nfinal class PushSender implements Sender {\n    private final AtomicInteger calls = new AtomicInteger();\n    public Channel channel() { return Channel.PUSH; }\n    public SendResult send(Recipient to, RenderedMessage m, String key) {\n        calls.incrementAndGet();\n        if (to.addressFor(Channel.PUSH) == null) return SendResult.permanentFailure(&quot;no device token&quot;);\n        return SendResult.sent(&quot;push/&quot; + Integer.toHexString(key.hashCode()));\n    }\n    int calls() { return calls.get(); }\n}\n\n// &quot;how long do we wait before trying again&quot; is a knob product will turn -&gt; hide it behind two methods -&gt; Strategy\n/** How many attempts, and how long to wait before each one. Fixed, exponential, jittered: all the same shape. */\ninterface RetryPolicy {\n    /** Have we already spent the budget? `attemptsSoFar` is the attempt that just failed. */\n    boolean shouldRetry(int attemptsSoFar);\n    /** Milliseconds to wait before attempt `attemptsSoFar + 1`. */\n    long backoffMs(int attemptsSoFar);\n}\n\n/** Double the wait each time, up to a cap: 100, 200, 400, 800 ... so a dead provider is not hammered. */\nfinal class ExponentialBackoff implements RetryPolicy {\n    private final int maxAttempts; private final long baseMs, capMs;\n    ExponentialBackoff(int maxAttempts, long baseMs, long capMs) { this.maxAttempts = maxAttempts; this.baseMs = baseMs; this.capMs = capMs; }\n    public boolean shouldRetry(int attemptsSoFar) { return attemptsSoFar &lt; maxAttempts; }\n    public long backoffMs(int attemptsSoFar) {\n        int shift = Math.min(attemptsSoFar - 1, 32);                  // never shift a long by more than 32 here\n        return Math.min(capMs, baseMs &lt;&lt; shift);\n    }\n}\n\n/** Anybody who wants to know what happened. Called after every accepted transition, never inside a gate. */\ninterface DeliveryListener {\n    void onTransition(DeliveryRecord record, DeliveryState from, DeliveryState to, String detail);\n}\n\n/** Prints the trace for the demo. In production this is the audit log. */\nfinal class ConsoleAudit implements DeliveryListener {\n    private volatile boolean muted;\n    /** Stop printing. The demo mutes it before the fifty-thread act, which would otherwise fill the screen. */\n    void mute() { muted = true; }\n    public void onTransition(DeliveryRecord r, DeliveryState from, DeliveryState to, String detail) {\n        if (muted) return;\n        System.out.printf(&quot;    %-6s %-12s %-15s -&gt; %-15s %s%n&quot;, r.notification().id(), r.notification().channel(), from, to, detail);\n    }\n}\n\n/** Counts every state a record ever reached. The one listener you would actually page on. */\nfinal class Metrics implements DeliveryListener {\n    private final Map&lt;DeliveryState, AtomicInteger&gt; counts = new EnumMap&lt;&gt;(DeliveryState.class);\n    public void onTransition(DeliveryRecord r, DeliveryState from, DeliveryState to, String detail) {\n        counts.computeIfAbsent(to, k -&gt; new AtomicInteger()).incrementAndGet();\n    }\n    /** How many records ever reached this state. */\n    int count(DeliveryState s) { AtomicInteger a = counts.get(s); return a == null ? 0 : a.get(); }\n    @Override public String toString() {\n        StringBuilder sb = new StringBuilder();\n        for (DeliveryState s : DeliveryState.values()) if (count(s) &gt; 0) sb.append(s).append(&#x27;=&#x27;).append(count(s)).append(&#x27; &#x27;);\n        return sb.toString().trim();\n    }\n}\n\n/** Where a record is, as one immutable triple: which attempt, which state, and why. Swapped as a unit. */\nrecord Progress(int attempt, DeliveryState state, String detail) {\n    static final long FINISHED = 1_000_000L;                   // above any attempt a message will ever reach\n    /** The number a move must beat. Higher always wins. */\n    long rank() { return rankOf(attempt, state); }\n    /**\n     * attempt * 100 + the state&#x27;s number while the message is alive. Every finished state has the same rank,\n     * FINISHED, so one can never replace another; DELIVERED alone is one higher, so a late receipt still lands.\n     */\n    static long rankOf(int attempt, DeliveryState state) {\n        if (state == DeliveryState.DELIVERED) return FINISHED + 1;\n        return state.terminal() ? FINISHED : attempt * 100L + state.rank();\n    }\n}\n\n/**\n * Everything the system remembers about one notification: the immutable request, the words rendered at submit,\n * and where it has got to. The progress lives in ONE AtomicReference, so attempt, state and reason are always\n * consistent, and every move is a compare-and-set against the rank: a move to an equal or lower rank changes\n * nothing and returns false. That single rule is what makes a stale retry timer and an out-of-order provider\n * receipt harmless instead of corrupting.\n */\nfinal class DeliveryRecord {\n    private final Notification notification;\n    private final RenderedMessage message;\n    private final List&lt;DeliveryListener&gt; listeners;\n    private final AtomicReference&lt;Progress&gt; progress = new AtomicReference&lt;&gt;(new Progress(0, DeliveryState.CREATED, &quot;submitted&quot;));\n\n    DeliveryRecord(Notification notification, RenderedMessage message, List&lt;DeliveryListener&gt; listeners) {\n        this.notification = notification; this.message = message; this.listeners = listeners;\n    }\n    Notification notification() { return notification; }\n    RenderedMessage message() { return message; }\n    /** Where it is right now. O(1), lock free. */\n    Progress progress() { return progress.get(); }\n    DeliveryState state() { return progress.get().state(); }\n    /** Which attempt it is on. 0 means it has never been queued. */\n    int attempt() { return progress.get().attempt(); }\n    String detail() { return progress.get().detail(); }\n\n    /**\n     * Move to `state` for `attempt`, but only if that outranks where the record already is. Returns false, and\n     * changes nothing at all, when the move is stale or backwards -- which is the normal answer when a timer\n     * fires late or a provider posts a receipt for an attempt we have already moved past. A finished record\n     * moves only to DELIVERED (the ranks see to it), so a cancelled message is never later written down as\n     * EXPIRED or FAILED.\n     */\n    boolean moveTo(int attempt, DeliveryState state, String detail) {\n        long want = Progress.rankOf(attempt, state);\n        while (true) {\n            Progress current = progress.get();\n            if (want &lt;= current.rank()) return false;                  // stale, backwards, or finished already\n            Progress next = new Progress(attempt, state, detail);\n            if (progress.compareAndSet(current, next)) { fire(current.state(), state, detail); return true; }\n        }\n    }\n    /**\n     * Stop it, but only while it is still ours to stop. Once a worker has moved it to SENDING the gateway call\n     * may already be in flight, so a &quot;cancel&quot; that reported success would be a lie.\n     */\n    boolean cancelIfNotStarted() {\n        while (true) {\n            Progress current = progress.get();\n            DeliveryState s = current.state();\n            if (s.terminal() || s == DeliveryState.SENDING || s == DeliveryState.SENT) return false;\n            Progress next = new Progress(current.attempt(), DeliveryState.SUPPRESSED, &quot;cancelled by the caller&quot;);\n            if (progress.compareAndSet(current, next)) { fire(s, DeliveryState.SUPPRESSED, next.detail()); return true; }\n        }\n    }\n    /** Listeners are told after the change has been committed, one try/catch each: a broken listener breaks nothing. */\n    private void fire(DeliveryState from, DeliveryState to, String detail) {\n        for (DeliveryListener l : listeners) {\n            try { l.onTransition(this, from, to, detail); }\n            catch (RuntimeException ignored) { /* an audit sink is not allowed to stop a notification */ }\n        }\n    }\n    @Override public String toString() { return notification.id() + &quot; &quot; + state() + &quot; (attempt &quot; + attempt() + &quot;: &quot; + detail() + &quot;)&quot;; }\n}\n\n/** One user&#x27;s admission gate: the lock that serialises the guards for that user, and nothing else. */\nfinal class UserGate {\n    final ReentrantLock lock = new ReentrantLock();\n    volatile long lastUsedMs;                         // for the idle-eviction follow-up\n}\n\n/**\n * The aggregate root. It owns the queue, the ledger of records, the worker pool and one gate per user, and it is\n * handed everything else: the templates, the directory, the guards, the senders, the retry policy, the clock and\n * the scheduler. Two flows and one rule:\n *\n *   submit()  runs on the CALLER&#x27;s thread and only decides admission: render, take that user&#x27;s gate, walk the\n *             guards in order, release the gate, then queue it, park it for later, or record the refusal. A\n *             parked message is judged again, by every guard, when it wakes.\n *   deliver() runs on a worker: check the deadline, take ownership by moving to SENDING, call the gateway with NO\n *             lock held at all, then record the outcome. A transient failure or a timeout parks the record on the\n *             scheduler for the next attempt instead of sleeping the worker.\n *\n * The rule: nothing is ever written that claims the message went out until the gateway has said so. A crash\n * between SENDING and SENT leaves the record saying SENDING, which is the truth -- we do not know -- and the\n * retry carries the same idempotency key so the provider can collapse the duplicate.\n */\nfinal class NotificationService {\n    private final int workerCount, queueCapacity;\n    private final Comparator&lt;DeliveryRecord&gt; byUrgency =\n            Comparator.comparingInt((DeliveryRecord r) -&gt; r.notification().priority().ordinal())\n                      .thenComparingLong(r -&gt; r.notification().seq());\n    private final PriorityBlockingQueue&lt;DeliveryRecord&gt; queue;\n    private final AtomicInteger depth = new AtomicInteger();        // PriorityBlockingQueue is unbounded; this bounds it\n    private final AtomicInteger outstanding = new AtomicInteger();  // work the engine still owes, for awaitIdle\n    private final ConcurrentHashMap&lt;String, DeliveryRecord&gt; ledger = new ConcurrentHashMap&lt;&gt;();\n    private final ConcurrentHashMap&lt;String, Queue&lt;DeliveryRecord&gt;&gt; byUser = new ConcurrentHashMap&lt;&gt;();   // the per-user log\n    private final ConcurrentHashMap&lt;String, UserGate&gt; gates = new ConcurrentHashMap&lt;&gt;();\n    private final List&lt;DeliveryListener&gt; listeners = new CopyOnWriteArrayList&lt;&gt;();\n    private final List&lt;Thread&gt; workers = new ArrayList&lt;&gt;();\n    private volatile boolean running;\n\n    private volatile TemplateEngine templates = (id, c, p) -&gt; { throw new IllegalStateException(&quot;configure() first&quot;); };\n    private volatile RecipientDirectory directory = id -&gt; { throw new IllegalStateException(&quot;configure() first&quot;); };\n    private volatile RetryPolicy retryPolicy = new ExponentialBackoff(3, 100, 10_000);\n    private volatile List&lt;DeliveryGuard&gt; guards = List.of();\n    private volatile Map&lt;Channel, Sender&gt; senders = new EnumMap&lt;&gt;(Channel.class);\n    private volatile Clock clock = System::currentTimeMillis;\n    private volatile Scheduler scheduler = new TimerScheduler();\n\n    NotificationService(int workerCount, int queueCapacity) {\n        this.workerCount = workerCount; this.queueCapacity = queueCapacity;\n        this.queue = new PriorityBlockingQueue&lt;&gt;(Math.max(16, Math.min(queueCapacity, 1024)), byUrgency);\n    }\n\n    /**\n     * Hand in every rule. The service builds none of them, which is why a test can hand in a clock that says\n     * 03:00, a scheduler that runs retries inline and a gateway that times out twice. Call before start().\n     */\n    void configure(TemplateEngine templates, RecipientDirectory directory, RetryPolicy retryPolicy,\n                   List&lt;DeliveryGuard&gt; guards, Map&lt;Channel, Sender&gt; senders, Clock clock, Scheduler scheduler) {\n        this.templates = templates; this.directory = directory; this.retryPolicy = retryPolicy;\n        this.guards = List.copyOf(guards);\n        this.senders = new EnumMap&lt;&gt;(senders);                        // O(1) lookup by channel, copied so nobody mutates it later\n        this.clock = clock; this.scheduler = scheduler;\n    }\n    /** Subscribe. Listeners hear about every accepted transition, after it has happened, and cannot veto one. */\n    void addListener(DeliveryListener l) { listeners.add(l); }\n\n    /** Start the worker threads. Nothing is delivered before this; submits before it simply queue up. */\n    void start() {\n        running = true;\n        for (int i = 0; i &lt; workerCount; i++) {\n            Thread t = new Thread(this::workerLoop, &quot;notify-worker-&quot; + i);\n            t.setDaemon(true); t.start(); workers.add(t);\n        }\n    }\n    /** Stop the workers and the timer. Records already queued are simply left where they are. */\n    void shutdown() {\n        running = false;\n        for (Thread t : workers) t.interrupt();\n        if (scheduler instanceof TimerScheduler ts) ts.close();\n    }\n\n    /**\n     * Admission, on the caller&#x27;s thread. The order is the design: resolve and render first, with no gate held\n     * and nothing written, so a missing user or a missing template throws before anything is reserved; then\n     * admit() walks the guards under this user&#x27;s gate. Returns the record either way -- a suppressed message gets\n     * a record with the reason on it, because &quot;why did my user get nothing&quot; is the most common support question.\n     */\n    DeliveryRecord submit(Notification n) {\n        Recipient to = directory.lookup(n.userId());                          // may throw: nothing written yet\n        RenderedMessage words = templates.render(n.templateId(), n.channel(), n.params());  // may throw: nothing written yet\n        DeliveryRecord record = new DeliveryRecord(n, words, listeners);\n        ledg

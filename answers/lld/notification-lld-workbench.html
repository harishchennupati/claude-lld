        NotificationService expiry = new NotificationService(1, 10_000);\n        expiry.configure(templates(), people(), new ExponentialBackoff(4, 1, 100),\n                List.of(), Map.of(Channel.PUSH, counted), () -&gt; clock[0], INLINE);\n        expiry.start();\n        DeliveryRecord late = expiry.submit(Notification.to(&quot;u1&quot;, Channel.PUSH, &quot;promo&quot;)\n                .deadlineMs(clock[0] - 1).params(Map.of(&quot;pct&quot;, &quot;5&quot;)).build());\n        expiry.awaitIdle(5_000);\n        check(late.state() == DeliveryState.EXPIRED, &quot;a message past its deadline is EXPIRED (got &quot; + late.state() + &quot;)&quot;);\n        check(counted.calls() == 0, &quot;and the gateway was never called for it&quot;);\n        expiry.shutdown();\n\n        // 5. the rank rule: a stale receipt, a late DELIVERED, and a cancel that arrives before a worker starts.\n        Notification n5 = Notification.to(&quot;u1&quot;, Channel.SMS, &quot;otp&quot;).params(Map.of(&quot;code&quot;, &quot;1&quot;)).build();\n        DeliveryRecord rec = new DeliveryRecord(n5, new RenderedMessage(&quot;t&quot;, &quot;b&quot;), List.of());\n        rec.moveTo(1, DeliveryState.QUEUED, &quot;q1&quot;);\n        rec.moveTo(1, DeliveryState.SENDING, &quot;s1&quot;);\n        rec.moveTo(1, DeliveryState.RETRY_SCHEDULED, &quot;timed out&quot;);\n        rec.moveTo(2, DeliveryState.QUEUED, &quot;q2&quot;);\n        rec.moveTo(2, DeliveryState.SENDING, &quot;s2&quot;);\n        check(!rec.moveTo(1, DeliveryState.SENT, &quot;receipt for attempt 1&quot;), &quot;a receipt for attempt 1 is ignored while attempt 2 is in flight&quot;);\n        check(rec.state() == DeliveryState.SENDING &amp;&amp; rec.attempt() == 2, &quot;and it changed nothing: still SENDING on attempt 2&quot;);\n        check(rec.moveTo(2, DeliveryState.SENT, &quot;gateway ok&quot;), &quot;the receipt for the attempt in flight is accepted&quot;);\n        check(rec.moveTo(2, DeliveryState.DELIVERED, &quot;handset ack&quot;), &quot;DELIVERED outranks SENT&quot;);\n        check(!rec.moveTo(2, DeliveryState.SENT, &quot;a second, later copy of the SENT webhook&quot;), &quot;a repeated older receipt is ignored&quot;);\n        DeliveryRecord dead = new DeliveryRecord(n5, new RenderedMessage(&quot;t&quot;, &quot;b&quot;), List.of());\n        dead.moveTo(1, DeliveryState.QUEUED, &quot;q&quot;); dead.moveTo(1, DeliveryState.SENDING, &quot;s&quot;);\n        dead.moveTo(1, DeliveryState.FAILED_FINAL, &quot;gave up&quot;);\n        check(dead.moveTo(1, DeliveryState.DELIVERED, &quot;it arrived after all&quot;), &quot;a DELIVERED receipt still wins after we gave up&quot;);\n        check(!dead.moveTo(1, DeliveryState.FAILED_FINAL, &quot;stale&quot;), &quot;and nothing can push it back to FAILED&quot;);\n        DeliveryRecord cancelled = new DeliveryRecord(n5, new RenderedMessage(&quot;t&quot;, &quot;b&quot;), List.of());\n        cancelled.moveTo(1, DeliveryState.QUEUED, &quot;q&quot;);\n        check(cancelled.cancelIfNotStarted(), &quot;a queued message can be cancelled&quot;);\n        check(!cancelled.moveTo(1, DeliveryState.SENDING, &quot;worker picked it up&quot;), &quot;a worker cannot start a cancelled message&quot;);\n        cancelled.moveTo(1, DeliveryState.QUEUED, &quot;q&quot;);\n        DeliveryRecord sending = new DeliveryRecord(n5, new RenderedMessage(&quot;t&quot;, &quot;b&quot;), List.of());\n        sending.moveTo(1, DeliveryState.QUEUED, &quot;q&quot;); sending.moveTo(1, DeliveryState.SENDING, &quot;s&quot;);\n        check(!sending.cancelIfNotStarted(), &quot;a message already at the gateway cannot be cancelled, and we do not pretend&quot;);\n\n        // 6. quiet hours defers instead of dropping, to 08:00 sharp on the recipient&#x27;s clock (India is UTC+5:30),\n        //    and an OTP walks through it.\n        QuietHoursGuard quiet = new QuietHoursGuard(21, 8, Set.of(Channel.SMS, Channel.PUSH));\n        Recipient india = new Recipient(&quot;u1&quot;, &quot;r@example.com&quot;, &quot;+91&quot;, &quot;tok&quot;, IST);\n        long threeAm = atIndia(3, 0), eightAm = atIndia(8, 0);\n        Notification promo = Notification.to(&quot;u1&quot;, Channel.PUSH, &quot;promo&quot;).category(&quot;marketing&quot;).params(Map.of(&quot;pct&quot;, &quot;9&quot;)).build();\n        Notification code = Notification.to(&quot;u1&quot;, Channel.SMS, &quot;otp&quot;).priority(Priority.CRITICAL).params(Map.of(&quot;code&quot;, &quot;1&quot;)).build();\n        Verdict v = quiet.check(promo, india, threeAm);\n        check(v.kind() == Verdict.Kind.DEFER, &quot;a promo at 03:00 local is deferred, not dropped&quot;);\n        check(v.untilMs() == eightAm, &quot;it is held for exactly five hours, until 08:00 local&quot;);\n        check(quiet.check(promo, india, atIndia(3, 40)).untilMs() == eightAm, &quot;at 03:40 it is held until 08:00 sharp, not 08:40&quot;);\n        check(quiet.check(promo, india, eightAm - 1).kind() == Verdict.Kind.DEFER\n              &amp;&amp; quiet.check(promo, india, eightAm).kind() == Verdict.Kind.ALLOW, &quot;07:59:59.999 is quiet; 08:00:00 is not&quot;);\n        check(quiet.check(promo, india, atIndia(22, 30)).untilMs() == eightAm + 86_400_000L, &quot;at 22:30 it waits for tomorrow&#x27;s 08:00&quot;);\n        check(quiet.check(code, india, threeAm).kind() == Verdict.Kind.ALLOW, &quot;an OTP at 03:00 goes out anyway&quot;);\n        Trace nightTrace = new Trace();\n        PushSender nightPush = new PushSender();\n        AtomicLong nightClock = new AtomicLong(threeAm);\n        Scheduler wakeOnTime = (task, delayMs) -&gt; { nightClock.addAndGet(delayMs); task.run(); };   // jump ahead, then run\n        NotificationService night = new NotificationService(1, 10_000);\n        night.configure(templates(), people(), new ExponentialBackoff(3, 1, 100),\n                List.of(quiet), Map.of(Channel.PUSH, nightPush), nightClock::get, wakeOnTime);\n        night.addListener(nightTrace);\n        night.start();\n        DeliveryRecord held = night.submit(Notification.to(&quot;u1&quot;, Channel.PUSH, &quot;promo&quot;).category(&quot;marketing&quot;).params(Map.of(&quot;pct&quot;, &quot;9&quot;)).build());\n        night.awaitIdle(5_000);\n        check(nightTrace.of(held).contains(DeliveryState.DEFERRED), &quot;the record passed through DEFERRED on its way out&quot;);\n        check(held.state() == DeliveryState.SENT, &quot;and it was sent when the window opened, not thrown away&quot;);\n        night.shutdown();\n\n        // 7. the daily cap RESERVES a slot, and a later guard&#x27;s refusal gives it back: a duplicate submit must\n        //    not quietly eat the user&#x27;s quota.\n        DailyCapGuard cap = new DailyCapGuard(2);\n        InMemoryDedupeStore keys = new InMemoryDedupeStore();\n        NotificationService capped = new NotificationService(1, 10_000);\n        capped.configure(templates(), people(), new ExponentialBackoff(3, 1, 100),\n                List.of(cap, new DedupeGuard(keys, 60_000)), Map.of(Channel.EMAIL, new EmailSender()), () -&gt; 1_000L, INLINE);\n        capped.start();\n        capped.submit(Notification.to(&quot;u1&quot;, Channel.EMAIL, &quot;receipt&quot;).dedupeKey(&quot;k1&quot;).params(Map.of(&quot;amt&quot;, &quot;1&quot;)).build());\n        check(cap.usedToday(&quot;u1&quot;) == 1, &quot;the first message spent one of the two daily slots&quot;);\n        DeliveryRecord dup = capped.submit(Notification.to(&quot;u1&quot;, Channel.EMAIL, &quot;receipt&quot;).dedupeKey(&quot;k1&quot;).params(Map.of(&quot;amt&quot;, &quot;1&quot;)).build());\n        check(dup.state() == DeliveryState.SUPPRESSED &amp;&amp; dup.detail().contains(&quot;duplicate&quot;), &quot;the second submit of the same key is a duplicate&quot;);\n        check(cap.usedToday(&quot;u1&quot;) == 1, &quot;and the duplicate gave the reserved slot back: still one used, not two&quot;);\n        capped.submit(Notification.to(&quot;u1&quot;, Channel.EMAIL, &quot;receipt&quot;).dedupeKey(&quot;k2&quot;).params(Map.of(&quot;amt&quot;, &quot;2&quot;)).build());\n        check(cap.usedToday(&quot;u1&quot;) == 2, &quot;a different message spends the second slot&quot;);\n        DeliveryRecord over = capped.submit(Notification.to(&quot;u1&quot;, Channel.EMAIL, &quot;receipt&quot;).dedupeKey(&quot;k3&quot;).params(Map.of(&quot;amt&quot;, &quot;3&quot;)).build());\n        check(over.state() == DeliveryState.SUPPRESSED &amp;&amp; over.detail().contains(&quot;already had 2 today&quot;), &quot;the third is capped, with the reason on the record&quot;);\n        check(keys.size() == 2, &quot;and the capped message never claimed an idempotency key&quot;);\n        check(capped.historyOf(&quot;u1&quot;).size() == 4 &amp;&amp; capped.historyOf(&quot;u1&quot;).get(3).detail().contains(&quot;already had 2&quot;),\n              &quot;the per-user log holds all four, refused ones included, each with its reason&quot;);\n        capped.awaitIdle(5_000);\n        capped.shutdown();\n\n        // 8. a listener that throws and an adapter that throws are both contained.\n        Trace boomTrace = new Trace();\n        NotificationService noisy = new NotificationService(1, 10_000);\n        noisy.configure(templates(), people(), new ExponentialBackoff(3, 1, 100),\n                List.of(), Map.of(Channel.PUSH, new BoomSender()), () -&gt; 1_000L, INLINE);\n        noisy.addListener((r, from, to, detail) -&gt; { throw new RuntimeException(&quot;the metrics sink is down&quot;); });\n        noisy.addListener(boomTrace);\n        noisy.start();\n        DeliveryRecord survived = noisy.submit(Notification.to(&quot;u1&quot;, Channel.PUSH, &quot;promo&quot;).params(Map.of(&quot;pct&quot;, &quot;3&quot;)).build());\n        noisy.awaitIdle(5_000);\n        check(survived.state() == DeliveryState.SENT, &quot;a listener that throws on every transition stops nothing&quot;);\n        check(boomTrace.of(survived).contains(DeliveryState.UNKNOWN), &quot;an adapter that throws is recorded as UNKNOWN, not as a lost worker&quot;);\n        check(survived.attempt() == 2, &quot;and the retry got it out on the second attempt&quot;);\n        noisy.shutdown();\n\n        // 9. back-pressure: the queue is full, so the message is refused at the door -- and everything the\n        //    guards had already reserved for it is handed back. Nothing half-done, not even on the unhappy path.\n        DailyCapGuard capB = new DailyCapGuard(10);\n        InMemoryDedupeStore keysB = new InMemoryDedupeStore();\n        PushSender neverCalled = new PushSender();\n        NotificationService full = new NotificationService(0, 1);        // no workers, and room for exactly one\n        full.configure(templates(), people(), new ExponentialBackoff(3, 1, 100),\n                List.of(capB, new DedupeGuard(keysB, 60_000)), Map.of(Channel.PUSH, neverCalled), () -&gt; 1_000L, INLINE);\n        DeliveryRecord fits = full.submit(Notification.to(&quot;u1&quot;, Channel.PUSH, &quot;promo&quot;).dedupeKey(&quot;b1&quot;).params(Map.of(&quot;pct&quot;, &quot;1&quot;)).build());\n        DeliveryRecord refused = full.submit(Notification.to(&quot;u1&quot;, Channel.PUSH, &quot;promo&quot;).dedupeKey(&quot;b2&quot;).params(Map.of(&quot;pct&quot;, &quot;2&quot;)).build());\n        check(fits.state() == DeliveryState.QUEUED, &quot;the first message fits in a queue of one&quot;);\n        check(refused.state() == DeliveryState.SUPPRESSED &amp;&amp; refused.detail().contains(&quot;back-pressure&quot;),\n                &quot;the second is refused at the door, with the reason on the record (got &quot; + refused.detail() + &quot;)&quot;);\n        check(neverCalled.calls() == 0, &quot;a refused message never reaches a gateway&quot;);\n        check(capB.usedToday(&quot;u1&quot;) == 1, &quot;and it gave back the daily slot it had reserved: one used, not two&quot;);\n        check(keysB.size() == 1, &quot;and released the key it had claimed, so the caller&#x27;s retry is not a duplicate&quot;);\n        full.shutdown();\n\n        // 10. the fallback ladder: a FAILURE climbs to the next channel, a deliberate refusal does not.\n        InMemoryTemplates alerts = new InMemoryTemplates()\n                .register(&quot;alert&quot;, Channel.PUSH, new MessageTemplate(&quot;ALERT&quot;, &quot;{{what}}&quot;))\n                .register(&quot;alert&quot;, Channel.SMS, new MessageTemplate(&quot;ALERT&quot;, &quot;{{what}}&quot;));\n        InMemoryDirectory reachable = new InMemoryDirectory()\n                .add(new Recipient(&quot;u9&quot;, &quot;u9@example.com&quot;, &quot;+91900000009&quot;, null, IST))      // no device token at all\n                .add(new Recipient(&quot;u8&quot;, &quot;u8@example.com&quot;, &quot;+91900000008&quot;, &quot;tok-8&quot;, IST));  // reachable on push\n        PushSender pushA = new PushSender();\n        FlakySmsSender smsA = new FlakySmsSender(0, true);\n        NotificationService climbs = new NotificationService(1, 100);\n        climbs.configure(alerts, reachable, new ExponentialBackoff(2, 1, 10), List.of(),\n                Map.of(Channel.PUSH, pushA, Channel.SMS, smsA), () -&gt; 1_000L, INLINE);\n        ChannelLadder ladder = new ChannelLadder(climbs, List.of(Channel.PUSH, Channel.SMS),\n                channel -&gt; Notification.to(&quot;u9&quot;, channel, &quot;alert&quot;).priority(Priority.CRITICAL)\n                                       .params(Map.of(&quot;what&quot;, &quot;a card was used in Dubai&quot;)).build());\n        climbs.addListener(ladder);\n        climbs.start();\n        DeliveryRecord rung1 = ladder.start();\n        climbs.awaitIdle(5_000);\n        check(rung1.state() == DeliveryState.FAILED_FINAL, &quot;push fails permanently: that user has no device token&quot;);\n        check(ladder.escalations() == 1, &quot;so the ladder climbed exactly one rung (got &quot; + ladder.escalations() + &quot;)&quot;);\n        check(smsA.calls() == 1, &quot;and the same message went out by SMS, once&quot;);\n        climbs.shutdown();\n\n        PushSender pushB = new PushSender();\n        FlakySmsSender smsB = new FlakySmsSender(0, true);\n        NotificationService polite = new NotificationService(1, 100);\n        polite.configure(alerts, reachable, new ExponentialBackoff(2, 1, 10),\n                List.of(new PreferenceGuard(new InMemoryPreferences().mute(&quot;u8&quot;, Channel.PUSH, &quot;marketing&quot;))),\n                Map.of(Channel.PUSH, pushB, Channel.SMS, smsB), () -&gt; 1_000L, INLINE);\n        ChannelLadder respectful = new ChannelLadder(polite, List.of(Channel.PUSH, Channel.SMS),\n                channel -&gt; Notification.to(&quot;u8&quot;, channel, &quot;alert&quot;).priority(Priority.LOW).category(&quot;marketing&quot;)\n                                       .params(Map.of(&quot;what&quot;, &quot;40% off&quot;)).build());\n        polite.addListener(respectful);\n        polite.start();\n        DeliveryRecord mutedRung = respectful.start();\n        polite.awaitIdle(5_000);\n        check(mutedRung.state() == DeliveryState.SUPPRESSED, &quot;a muted channel is SUPPRESSED, which is a decision, not a failure&quot;);\n        check(respectful.escalations() == 0, &quot;so the ladder does NOT climb past an opt-out&quot;);\n        check(smsB.calls() == 0, &quot;and the user who turned push off was not chased onto SMS&quot;);\n        polite.shutdown();\n\n        // 11. a parked message is judged again when it wakes. At 03:00 a client sends one push twice (its HTTP call\n        //     timed out), and a news push is parked too; at 07:00 the user mutes news. At 08:00 the retry meets the\n        //     claim, the mute is honoured, and the one message that goes out counts on the day it is sent.\n        AtomicLong dawnClock = new AtomicLong(threeAm);\n        List&lt;Runnable&gt; parked11 = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        InMemoryPreferences dawnPrefs = new InMemoryPreferences();\n        DailyCapGuard dawnCap = new DailyCapGuard(5);\n        PushSender dawnPush = new PushSender();\n        NotificationService dawn = new NotificationService(1, 100);\n        dawn.configure(templates(), people(), new ExponentialBackoff(3, 1, 100),\n                List.of(new PreferenceGuard(dawnPrefs), new QuietHoursGuard(21, 8, Set.of(Channel.PUSH)), dawnCap,\n                        new DedupeGuard(new InMemoryDedupeStore(), 60_000)),\n                Map.of(Channel.PUSH, dawnPush), dawnClock::get, (task, delayMs) -&gt; parked11.add(task));\n        dawn.start();\n        DeliveryRecord sale = dawn.submit(Notification.to(&quot;u1&quot;, Channel.PUSH, &quot;promo&quot;).category(&quot;marketing&quot;)\n                .dedupeKey(&quot;sale-3am&quot;).params(Map.of(&quot;pct&quot;, &quot;20&quot;)).build());\n        DeliveryRecord saleAgain = dawn.submit(Notification.to(&quot;u1&quot;, Channel.PUSH, &quot;promo&quot;).category(&quot;marketing&quot;)\n                .dedupeKey(&quot;sale-3am&quot;).params(Map.of(&quot;pct&quot;, &quot;20&quot;)).build());\n        DeliveryRecord news = dawn.submit(Notification.to(&quot;u1&quot;, Channel.PUSH, &quot;promo&quot;).category(&quot;news&quot;).params(Map.of(&quot;pct&quot;, &quot;0&quot;)).build());\n        check(sale.state() == DeliveryState.DEFERRED &amp;&amp; saleAgain.state() == DeliveryState.DEFERRED\n              &amp;&amp; news.state() == DeliveryState.DEFERRED &amp;&amp; dawnCap.usedToday(&quot;u1&quot;) == 0, &quot;at 03:00 all three are parked, and nothing is reserved for them&quot;);\n        dawnPrefs.mute(&quot;u1&quot;, Channel.PUSH, &quot;news&quot;);                        // 07:00: the user turns news off\n        dawnClock.set(eightAm);\n        runParked(parked11);\n        dawn.awaitIdle(5_000);\n        check(dawnPush.calls() == 1, &quot;at 08:00 the phone buzzes once, not three times (got &quot; + dawnPush.calls() + &quot;)&quot;);\n        check(saleAgain.state() == DeliveryState.SUPPRESSED &amp;&amp; saleAgain.detail().contains(&quot;duplicate&quot;), &quot;the client&#x27;s retry met the claim&quot;);\n        check(news.state() == DeliveryState.SUPPRESSED &amp;&amp; news.detail().contains(&quot;opted out&quot;), &quot;the mute set at 07:00 was honoured at 08:00&quot;);\n        check(dawnCap.usedToday(&quot;u1&quot;) == 1, &quot;and the one that went out counts against the day it was sent&quot;);\n        dawn.shutdown();\n\n        // 12. a finished record stays finished. A caller cancels a queued push, and its deadline passes before a\n        //     worker reaches it. It must still say &quot;cancelled&quot;: EXPIRED is a failure, a failure climbs the fallback\n        //     ladder, and the user would get an SMS for a message the caller took back.\n        AtomicLong cancelClock = new AtomicLong(1_000L);\n        FlakySmsSender smsC = new FlakySmsSender(0, true);\n        NotificationService taken = new NotificationService(1, 100);\n        taken.configure(alerts, reachable, new ExponentialBackoff(2, 1, 10), List.of(),\n                Map.of(Channel.PUSH, new PushSender(), Channel.SMS, smsC), cancelClock::get, INLINE);\n        ChannelLadder cancelLadder = new ChannelLadder(taken, List.of(Channel.PUSH, Channel.SMS),\n                channel -&gt; Notification.to(&quot;u8&quot;, channel, &quot;alert&quot;).deadlineMs(channel == Channel.PUSH ? 5_000L : Long.MAX_VALUE)\n                                       .params(Map.of(&quot;what&quot;, &quot;your cab is here&quot;)).build());\n        taken.addListener(cancelLadder);\n        DeliveryRecord pushRung = cancelLadder.start();                    // queued; the workers have not started\n        check(taken.cancel(pushRung.notification().id()), &quot;the caller cancels it while it waits in the queue&quot;);\n        cancelClock.set(10_000L);                                           // its deadline passes\n        taken.start();\n        taken.awaitIdle(5_000);\n        check(pushRung.state() == DeliveryState.SUPPRESSED, &quot;it still says cancelled, not EXPIRED (got &quot; + pushRung.state() + &quot;)&quot;);\n        check(cancelLadder.escalations() == 0 &amp;&amp; smsC.calls() == 0, &quot;so the ladder did not text the user a message the caller took back&quot;);\n        check(!pushRung.moveTo(1, DeliveryState.FAILED_FINAL, &quot;a late timer&quot;), &quot;and no later move can turn it into a failure&quot;);\n        taken.shutdown();\n\n        // 13. the policies above the engine. Two digests closed in the same millisecond are two batches, not a\n        //     duplicate; a paced campaign keeps its own copy of the list; a clock stepped back takes no tokens.\n        EmailSender digestMail = new EmailSender();\n        NotificationService bulk = new NotificationService(1, 100);\n        bulk.configure(templates().register(&quot;digest&quot;, Channel.EMAIL, new MessageTemplate(&quot;{{count}} updates&quot;, &quot;{{lines}}&quot;)),\n                people(), new ExponentialBackoff(3, 1, 100), List.of(new DedupeGuard(new InMemoryDedupeStore(), 60_000)),\n                Map.of(Channel.EMAIL, digestMail), () -&gt; 5_000L, INLINE);\n        bulk.start();\n        DigestCollector digest = new DigestCollector(bulk, () -&gt; 5_000L, 60_000, 2);\n        digest.add(&quot;u1&quot;, &quot;invoice 1 paid&quot;); DeliveryRecord firstDigest = digest.add(&quot;u1&quot;, &quot;invoice 2 paid&quot;);\n        digest.add(&quot;u1&quot;, &quot;invoice 3 paid&quot;); DeliveryRecord secondDigest = digest.add(&quot;u1&quot;, &quot;invoice 4 paid&quot;);\n        bulk.awaitIdle(5_000);\n        check(firstDigest.state() == DeliveryState.SENT &amp;&amp; secondDigest.state() == DeliveryState.SENT,\n              &quot;two digests closed in the same millisecond both go out (got &quot; + secondDigest + &quot;)&quot;);\n        List&lt;Runnable&gt; paced = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        List&lt;Notification&gt; campaign = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 4; i++) campaign.add(Notification.to(&quot;u1&quot;, Channel.EMAIL, &quot;receipt&quot;).params(Map.of(&quot;amt&quot;, &quot;&quot; + i)).build());\n        new CampaignPacer(bulk, (task, delayMs) -&gt; paced.add(task)).run(campaign, 60_000, 2);\n        campaign.clear();                                                    // the caller reuses its list before the timer fires\n        boolean pacedOk;\n        try { runParked(paced); pacedOk = true; } catch (ConcurrentModificationException e) { pacedOk = false; }\n        bulk.awaitIdle(5_000);\n        check(pacedOk &amp;&amp; digestMail.calls() == 6, &quot;each paced chunk went out from its own copy, after the caller cleared the list&quot;);\n        bulk.shutdown();\n        AtomicLong bucketClock = new AtomicLong(36_000_000L);\n        RateLimitedSender bucket = new RateLimitedSender(new PushSender(), 2, 1, bucketClock::get);   // two tokens, one more a second\n        Recipient ravi = people().lookup(&quot;u1&quot;);\n        RenderedMessage words = new RenderedMessage(&quot;t&quot;, &quot;b&quot;);\n        bucket.send(ravi, words, &quot;k1&quot;);                                      // one token left\n        bucketClock.addAndGet(-3_600_000L);                                  // NTP steps the clock back an hour\n        check(bucket.send(ravi, words, &quot;k2&quot;).outcome() == SendOutcome.SENT, &quot;a clock stepped back an hour still leaves the token that was there&quot;);\n\n        // 14. Microsoft&#x27;s version: two a day per user, and the third is held for tomorrow instead of dropped. It\n        //     wakes at the user&#x27;s midnight, is judged again, and counts against tomorrow&#x27;s cap, not today&#x27;s.\n        AtomicLong jobClock = new AtomicLong(atIndia(10, 0));\n        List&lt;Runnable&gt; parked14 = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        DailyCapGuard twoADay = new DailyCapGuard(2);\n        EmailSender jobMail = new EmailSender();\n        NotificationService jobs = new NotificationService(1, 100);\n        jobs.configure(templates(), people(), new ExponentialBackoff(3, 1, 100), List.of(new HoldForTomorrowGuard(twoADay)),\n                Map.of(Channel.EMAIL, jobMail), jobClock::get, (task, delayMs) -&gt; parked14.add(task));\n        jobs.start();\n        List&lt;DeliveryRecord&gt; jobDone = new ArrayList&lt;&gt;();\n        for (int i = 1; i &lt;= 3; i++) jobDone.add(jobs.submit(Notification.to(&quot;u1&quot;, Channel.EMAIL, &quot;receipt&quot;).params(Map.of(&quot;amt&quot;, &quot;&quot; + i)).build()));\n        check(jobDone.get(2).state() == DeliveryState.DEFERRED &amp;&amp; jobDone.get(2).detail().contains(&quot;tomorrow&quot;),\n              &quot;the third of the day is held for tomorrow, not dropped (got &quot; + jobDone.get(2) + &quot;)&quot;);\n        check(waitUntil(() -&gt; jobMail.calls() == 2), &quot;the first two went out today&quot;);\n        jobClock.set(atIndia(0, 0) + 86_400_000L);                          // the user&#x27;s midnight\n        runParked(parked14);\n        jobs.awaitIdle(5_000);\n        check(jobDone.get(2).state() == DeliveryState.SENT &amp;&amp; jobMail.calls() == 3, &quot;at midnight it is judged again and goes out&quot;);\n        check(twoADay.usedToday(&quot;u1&quot;) == 1, &quot;and it counts against the new day&#x27;s cap: one used, one left&quot;);\n        jobs.shutdown();\n\n        // 15. Cleartrip&#x27;s version: an order event goes to the people on that order, on the channels they chose.\n        //     SHIPPED reaches the customer and logistics but not the seller; the same event twice sends nothing new;\n        //     a replay goes out again, on the channels the customer has today.\n        InMemoryTemplates orderTemplates = new InMemoryTemplates();\n        for (OrderEvent e : OrderEvent.values())\n            for (Channel c : List.of(Channel.EMAIL, Channel.PUSH))\n                orderTemplates.register(&quot;order-&quot; + e, c, new MessageTemplate(&quot;Order {{order}}&quot;, &quot;is &quot; + e));\n        InMemoryDirectory shopPeople = new InMemoryDirectory()\n                .add(new Recipient(&quot;c1&quot;, &quot;c1@example.com&quot;, &quot;+91900000021&quot;, &quot;tok-c1&quot;, IST))\n                .add(new Recipient(&quot;s1&quot;, &quot;s1@example.com&quot;, &quot;+91900000022&quot;, &quot;tok-s1&quot;, IST))\n                .add(new Recipient(&quot;l1&quot;, &quot;l1@example.com&quot;, &quot;+91900000023&quot;, &quot;tok-l1&quot;, IST));\n        EmailSender orderMail = new EmailSender();\n        PushSender orderPush = new PushSender();\n        NotificationService shop = new NotificationService(2, 100);\n        shop.configure(orderTemplates, shopPeople, new ExponentialBackoff(3, 1, 100),\n                List.of(new DedupeGuard(new InMemoryDedupeStore(), 60_000)),\n                Map.of(Channel.EMAIL, orderMail, Channel.PUSH, orderPush), () -&gt; 1_000L, INLINE);\n        shop.start();\n        OrderNotifier notifier = new OrderNotifier(shop, EnumSet.of(Channel.EMAIL, Channel.PUSH));\n        notifier.linkOrder(&quot;O-1&quot;, Map.of(Role.CUSTOMER, &quot;c1&quot;, Role.SELLER, &quot;s1&quot;, Role.LOGISTICS, &quot;l1&quot;));\n        notifier.subscribe(&quot;c1&quot;, OrderEvent.SHIPPED, Set.of(Channel.EMAIL));          // this customer wants e-mail only for SHIPPED\n        List&lt;DeliveryRecord&gt; shippedOnce = notifier.publish(&quot;O-1&quot;, OrderEvent.SHIPPED);\n        List&lt;DeliveryRecord&gt; shippedTwice = notifier.publish(&quot;O-1&quot;, OrderEvent.SHIPPED);   // the order system retried\n        shop.awaitIdle(5_000);\n        Set&lt;String&gt; who = new TreeSet&lt;&gt;();\n        for (DeliveryRecord r : shippedOnce) who.add(r.notification().userId() + &quot;:&quot; + r.notification().channel());\n        check(who.equals(new TreeSet&lt;&gt;(Set.of(&quot;c1:EMAIL&quot;, &quot;l1:EMAIL&quot;, &quot;l1:PUSH&quot;))),\n              &quot;SHIPPED went to the customer by e-mail and to logistics on both channels, not to the seller (got &quot; + who + &quot;)&quot;);\n        check(shippedTwice.stream().allMatch(r -&gt; r.state() == DeliveryState.SUPPRESSED), &quot;publishing the same event again sent nothing new&quot;);\n        check(orderMail.calls() == 2 &amp;&amp; orderPush.calls() == 1, &quot;three messages reached the gateways, not six&quot;);\n        notifier.unsubscribe(&quot;s1&quot;, OrderEvent.PLACED);\n        check(notifier.publish(&quot;O-1&quot;, OrderEvent.PLACED).stream().noneMatch(r -&gt; r.notification().userId().equals(&quot;s1&quot;)),\n              &quot;a seller who unsubscribed from PLACED hears nothing&quot;);\n        notifier.changeChannel(&quot;c1&quot;, Role.CUSTOMER, OrderEvent.SHIPPED, Channel.EMAIL, false);\n        notifier.changeChannel(&quot;c1&quot;, Role.CUSTOMER, OrderEvent.SHIPPED, Channel.PUSH, true);   // e-mail off, push on\n        List&lt;DeliveryRecord&gt; replayed = notifier.replay(&quot;O-1&quot;, OrderEvent.SHIPPED, Role.CUSTOMER);\n        shop.awaitIdle(5_000);\n        check(replayed.size() == 1 &amp;&amp; replayed.get(0).notification().channel() == Channel.PUSH\n              &amp;&amp; replayed.get(0).state() == DeliveryState.SENT, &quot;a replay goes out again, on the channel the customer has today&quot;);\n        shop.shutdown();\n\n        // 16. Ajio&#x27;s follow-up: &quot;Order Placed&quot; must reach the gateway before &quot;Order Shipped&quot;. Without a rule, PLACED\n        //     gets a 503, waits for its retry, and SHIPPED overtakes it; one message in flight per order fixes it.\n        for (boolean ordered : new boolean[] { false, true }) {\n            List&lt;Runnable&gt; retries = Collections.synchronizedList(new ArrayList&lt;&gt;());\n            FirstPlacedFails gateway = new FirstPlacedFails();\n            NotificationService ajio = new NotificationService(1, 100);\n            ajio.configure(orderTemplates, shopPeople, new ExponentialBackoff(3, 200, 1_000), List.of(),\n                    Map.of(Channel.PUSH, gateway), () -&gt; 1_000L, (task, delayMs) -&gt; retries.add(task));\n            InOrderDispatcher inOrder = new InOrderDispatcher(ajio);\n            ajio.addListener(inOrder);\n            ajio.start();\n            Notification placedN = Notification.to(&quot;c1&quot;, Channel.PUSH, &quot;order-PLACED&quot;).params(Map.of(&quot;order&quot;, &quot;O-7&quot;)).build();\n            Notification shippedN = Notification.to(&quot;c1&quot;, Channel.PUSH, &quot;order-SHIPPED&quot;).params(Map.of(&quot;order&quot;, &quot;O-7&quot;)).build();\n            if (ordered) { inOrder.send(&quot;O-7&quot;, placedN); inOrder.send(&quot;O-7&quot;, shippedN); }\n            else { ajio.submit(placedN); ajio.submit(shippedN); }\n            waitUntil(() -&gt; retries.size() == 1 &amp;&amp; (ordered || gateway.through.size() == 1));   // PLACED failed once and waits\n            runParked(retries);                                                                  // its 200 ms are up\n            ajio.awaitIdle(5_000);\n            List&lt;String&gt; seen = List.copyOf(gateway.through);\n            if (!ordered) check(seen.equals(List.of(&quot;is SHIPPED&quot;, &quot;is PLACED&quot;)), &quot;without it, SHIPPED overtakes the PLACED that waits for its retry (got &quot; + seen + &quot;)&quot;);\n            else check(seen.equals(List.of(&quot;is PLACED&quot;, &quot;is SHIPPED&quot;)), &quot;with one in flight per order, PLACED reaches the gateway first (got &quot; + seen + &quot;)&quot;);\n            ajio.shutdown();\n        }\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design the notification service. Other teams hand it a message &mdash; who it is for, email or SMS or push, how urgent &mdash; and it gets it out: templates, opt-outs, rate caps, retries when the gateway is down. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (idempotency and the delivery guarantee first). Main.java is the complete answer, far more than anyone types in an hour. The must-write core is about 300 lines: Channel, Priority and DeliveryState with its ranks; the Notification with its builder; the Sender interface with one implementation; the DeliveryGuard interface with the de-dup guard; Progress and DeliveryRecord with moveTo; NotificationService with submit, the worker loop and deliver with its retry; and a main with a fifty-thread race on one de-dup key. Then, if time is left, in this order: the other guards (preference, daily cap, quiet hours), the templates, receipts and cancel, back-pressure. Know which version you were asked: Kotak wanted only template registration and a send API (follow-up 1); Cleartrip wanted order events sent to the right people (follow-up 2).</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Add WhatsApp, and let product own the words: one template per message and per channel.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Three companies asked a version of this. Kotak (2026) wanted only two APIs: register a template for each channel, and send with it. Amazon (2025) asked for &ldquo;building message content for different channels&rdquo;, and Adobe (2025) named WhatsApp next to SMS and push. The registry is keyed by template id AND channel, because an SMS is not an email. Rendering happens once, at submit, and the words are stored on the record. A new provider is one class implementing Sender, one line in the map handed to <code>configure</code>, and one template per message; the queue, the guards, the retry policy and the state machine do not know how many channels exist. One cost is not free: Channel is an enum, so a real WhatsApp needs a constant, and the switch in <code>Recipient.addressFor</code> refuses to compile until you say which address it uses. That is the compiler doing your code review.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Turns a template id plus parameters into words. Swappable: today a map, tomorrow Handlebars or a CMS. */\ninterface TemplateEngine {\n    /** Render, or throw if there is no template for this id and channel -- which is a permanent failure, caught at submit. */\n    RenderedMessage render(String templateId, Channel channel, Map&lt;String, String&gt; params);\n}\n\n/** One template: two patterns with {{placeholders}}. Keyed by id AND channel, because an SMS is not a push. */\nrecord MessageTemplate(String titlePattern, String bodyPattern) {\n    RenderedMessage render(Map&lt;String, String&gt; params) { return new RenderedMessage(fill(titlePattern, params), fill(bodyPattern, params)); }\n    private static String fill(String pattern, Map&lt;String, String&gt; params) {\n        String out = pattern;\n        for (Map.Entry&lt;String, String&gt; e : params.entrySet()) out = out.replace(&quot;{{&quot; + e.getKey() + &quot;}}&quot;, e.getValue());\n        return out;\n    }\n}\n\n/** The in-memory registry. Templates are registered at start-up and read-only afterwards. */\nfinal class InMemoryTemplates implements TemplateEngine {\n    private final Map&lt;String, MessageTemplate&gt; byIdAndChannel = new ConcurrentHashMap&lt;&gt;();\n    /** Register one template. Returns this, so the whole registry is one expression in main. */\n    InMemoryTemplates register(String templateId, Channel channel, MessageTemplate t) {\n        byIdAndChannel.put(templateId + &quot;|&quot; + channel, t); return this;\n    }\n    public RenderedMessage render(String templateId, Channel channel, Map&lt;String, String&gt; params) {\n        MessageTemplate t = byIdAndChannel.get(templateId + &quot;|&quot; + channel);\n        if (t == null) throw new NoSuchElementException(&quot;no template &quot; + templateId + &quot; for &quot; + channel);\n        return t.render(params);\n    }\n}\n\n// ---- ext: a new channel -- one class, one registry line, and the compiler points at the rest\n/**\n * WhatsApp. The whole channel is this: one class implementing Sender, one line in the map handed to\n * configure(), and one template registered for it. Nothing in the engine, the queue, the guards or the state\n * machine moves. The one cost that is not free: Channel is an enum, so a real WhatsApp needs a constant of its\n * own, and the exhaustive switch in Recipient.addressFor then fails to compile until you say which address it\n * uses -- which is the compiler doing your review for you. Key the registry by String and even that disappears.\n */\nfinal class WhatsAppSender implements Sender {\n    private final AtomicInteger calls = new AtomicInteger();\n    public Channel channel() { return Channel.IN_APP; }          // a real one gets its own constant; see the note above\n    public SendResult send(Recipient to, RenderedMessage m, String idempotencyKey) {\n        calls.incrementAndGet();\n        String number = to.phone();\n        if (number == null || !number.startsWith(&quot;+&quot;)) return SendResult.permanentFailure(&quot;not an E.164 number: &quot; + number);\n        return SendResult.sent(&quot;wa/&quot; + Integer.toHexString(idempotencyKey.hashCode()));\n    }\n    int calls() { return calls.get(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>2 &middot; Order events: the customer hears every status, the seller only &#x27;placed&#x27;, logistics only &#x27;shipped&#x27;.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>This is Cleartrip's machine-coding question (2025, and again in 2026), and it sits above the engine. <code>OrderNotifier</code> keeps two tables. One says who is on each order: role to user id. The other says which channels each person wants for each event; a missing entry means the role's default. <code>publish(order, event)</code> turns one event into one ordinary notification per person and channel, so guards, retries and records all still apply, and the order system never waits. Each carries the de-dup key order|event|role, so the same event published twice sends nothing new. A replay (their bonus part) uses a fresh key on purpose, and goes to the channels the person has today. Changing a channel uses <code>ConcurrentHashMap.compute</code>, which makes the read-change-write one atomic step per key. The 2026 panel turned down a Kafka design: they wanted it working in 90 minutes. Test 15 proves the routing.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: order events to the people on the order (Cleartrip) -- a table, not a broker\n/** The three moments in an order&#x27;s life that people are told about. */\nenum OrderEvent { PLACED, SHIPPED, DELIVERED }\n/** Who is on an order. Each role hears some events by default. */\nenum Role { CUSTOMER, SELLER, LOGISTICS }\n\n/**\n * Cleartrip&#x27;s machine-coding version: an order event goes only to the people on THAT order, each on the channels\n * they chose. By default the customer hears every event, the seller only PLACED and logistics only SHIPPED, on\n * every channel; anyone can unsubscribe from an event or change its channels. One event becomes one ordinary\n * notification per person and channel, so guards, retries and records all still apply, and the order system never\n * waits: submit only queues. Their panel wanted this demoable in 90 minutes, not a Kafka cluster.\n */\nfinal class OrderNotifier {\n    private static final Map&lt;Role, Set&lt;OrderEvent&gt;&gt; HEARS = Map.of(\n            Role.CUSTOMER, EnumSet.allOf(OrderEvent.class),\n            Role.SELLER, EnumSet.of(OrderEvent.PLACED),\n            Role.LOGISTICS, EnumSet.of(OrderEvent.SHIPPED));\n    private final NotificationService service;\n    private final Set&lt;Channel&gt; allChannels;\n    private final ConcurrentHashMap&lt;String, Map&lt;Role, String&gt;&gt; people = new ConcurrentHashMap&lt;&gt;();   // order id -&gt; role -&gt; user\n    private final ConcurrentHashMap&lt;String, Set&lt;Channel&gt;&gt; chosen = new ConcurrentHashMap&lt;&gt;();       // &quot;user|event&quot; -&gt; channels\n\n    OrderNotifier(NotificationService service, Set&lt;Channel&gt; allChannels) { this.service = service; this.allChannels = Set.copyOf(allChannels); }\n    /** Who is on this order. Only these people ever hear about its events. */\n    void linkOrder(String orderId, Map&lt;Role, String&gt; stakeholders) { people.put(orderId, Map.copyOf(stakeholders)); }\n    /** Replace one person&#x27;s channels for one event, for every order. An empty set is an unsubscribe. */\n    void subscribe(String userId, OrderEvent e, Set&lt;Channel&gt; channels) { chosen.put(userId + &quot;|&quot; + e, Set.copyOf(channels)); }\n    /** Stop hearing about this event on any order. */\n    void unsubscribe(String userId, OrderEvent e) { subscribe(userId, e, Set.of()); }\n    /** Add or drop one channel. compute() makes the read-change-write one atomic step per key, so two edits at once never lose one. */\n    void changeChannel(String userId, Role role, OrderEvent e, Channel c, boolean on) {\n        chosen.compute(userId + &quot;|&quot; + e, (k, old) -&gt; {\n            Set&lt;Channel&gt; s = EnumSet.noneOf(Channel.class);\n            s.addAll(old != null ? old : defaults(role, e));\n            if (on) s.add(c); else s.remove(c);\n            return Set.copyOf(s);\n        });\n    }\n    /** The order system calls this and returns at once. Publishing the same event twice sends nothing new. */\n    List&lt;DeliveryRecord&gt; publish(String orderId, OrderEvent e) { return send(orderId, e, null, orderId + &quot;|&quot; + e); }\n    /** Cleartrip&#x27;s bonus: send an old event again to one role, on the channels they have TODAY. A fresh key, because a replay is meant to go out again. */\n    List&lt;DeliveryRecord&gt; replay(String orderId, OrderEvent e, Role who) { return send(orderId, e, who, orderId + &quot;|&quot; + e + &quot;|replay-&quot; + UUID.randomUUID()); }\n\n    private List&lt;DeliveryRecord&gt; send(String orderId, OrderEvent e, Role only, String key) {\n        List&lt;DeliveryRecord&gt; out = new ArrayList&lt;&gt;();\n        for (Map.Entry&lt;Role, String&gt; p : people.getOrDefault(orderId, Map.of()).entrySet()) {\n            if (only != null &amp;&amp; p.getKey() != only) continue;\n            for (Channel c : chosen.getOrDefault(p.getValue() + &quot;|&quot; + e, defaults(p.getKey(), e)))\n                out.add(service.submit(Notification.to(p.getValue(), c, &quot;order-&quot; + e).category(&quot;order&quot;)\n                        .dedupeKey(key + &quot;|&quot; + p.getKey()).params(Map.of(&quot;order&quot;, orderId)).build()));\n        }\n        return out;\n    }\n    private Set&lt;Channel&gt; defaults(Role role, OrderEvent e) { return HEARS.get(role).contains(e) ? allChannels : Set.of(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>3 &middot; Persist it. And now there are ten instances behind a load balancer.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Ola (2024) and Blinkit (2026) spent most of the round here: the tables, the indexes, and Kafka against a plain API. Two tables and two shared stores, and the engine does not change, only what it is handed. The rank rule maps straight onto SQL: <code>moveTo</code> becomes <code>UPDATE ... SET state = ?, rank = ? WHERE id = ? AND rank &lt; ?</code>, and the row count is the boolean. The de-dup claim is an INSERT into a table with a UNIQUE index on the idempotency key (user, channel, the caller's key), or Redis <code>SET key NX PX ttl</code>. It must be that key, never our own id, because a client's retry arrives with a new id. The queue becomes a broker with a topic per priority class. The hand-off from submit to the queue becomes an outbox row (a note in the same database saying &ldquo;queue this&rdquo;), written in the same transaction as the record, so a crash between &ldquo;accepted&rdquo; and &ldquo;queued&rdquo; is recovered. One thing does change with ten instances: the id. &ldquo;n-&rdquo; plus one process's counter repeats across machines, so it becomes a UUID (a random 128-bit id that is unique without asking anyone).</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence and the outbox -- the same CAS, written in SQL\n/**\n * Everything in memory today becomes two tables. The whole in-memory design survives because the rank rule maps\n * straight onto a conditional UPDATE: the database refuses the stale write exactly as the compare-and-set does.\n *\n *   INSERT INTO notification (id, idem_key, payload, rank) VALUES (?, ?, ?, 0) ON CONFLICT DO NOTHING;\n *   UPDATE notification SET state = ?, attempt = ?, rank = ? WHERE id = ? AND rank &lt; ?;\n *\n * idem_key (user | channel | the caller&#x27;s key) has a UNIQUE index, so the INSERT is also the de-dup claim: of two\n * submits with one key, one row goes in and the other inserts nothing (Redis: SET key 1 NX PX ttl). The claim\n * must be on that key, never on our own id, because a client&#x27;s retry arrives with a new id. The UPDATE is\n * moveTo(): one row updated is a transition accepted, zero rows is moveTo() returning false. The outbox pattern\n * makes the hand-off to the queue crash-safe: the submit transaction writes the row AND an outbox row (a note\n * that says &quot;put this on the queue&quot;), and a relay reads the outbox and enqueues, so a crash between &quot;recorded&quot;\n * and &quot;queued&quot; is recovered instead of lost. With ten instances the id must be unique across all of them (a\n * UUID), not &quot;n-&quot; plus one process&#x27;s counter.\n */\ninterface NotificationRepository {\n    /** Insert the row once. False means it is already there (in SQL: this id, or this idempotency key). */\n    boolean insertIfAbsent(String notificationId, String payload);\n    /** The conditional update. False means a newer rank is already stored, so this write is stale and dropped. */\n    boolean advance(String notificationId, DeliveryState state, int attempt, long rank);\n    /** What the row says now, for a support screen or for recovery after a restart. */\n    Progress read(String notificationId);\n}\n\n/** A map that behaves exactly like those two SQL statements, so the semantics can be tested without a database. */\nfinal class InMemoryRepository implements NotificationRepository {\n    private final ConcurrentHashMap&lt;String, Progress&gt; rows = new ConcurrentHashMap&lt;&gt;();\n    private final ConcurrentHashMap&lt;String, String&gt; payloads = new ConcurrentHashMap&lt;&gt;();\n    public boolean insertIfAbsent(String notificationId, String payload) {\n        boolean first = payloads.putIfAbsent(notificationId, payload) == null;\n        if (first) rows.put(notificationId, new Progress(0, DeliveryState.CREATED, &quot;inserted&quot;));\n        return first;\n    }\n    public boolean advance(String notificationId, DeliveryState state, int attempt, long rank) {\n        while (true) {\n            Progress current = rows.get(notificationId);\n            if (current == null) return false;\n            if (rank &lt;= current.rank()) return false;                       // WHERE rank &lt; ? matched no rows\n            if (rows.replace(notificationId, current, new Progress(attempt, state, &quot;persisted&quot;))) return true;\n        }\n    }\n    public Progress read(String notificationId) { return rows.get(notificationId); }\n}\n\n/**\n * Copies every accepted transition into the repository, after it happened in memory. A listener, so the engine\n * never learns about SQL. It is a write-through copy, not the outbox: in production the table is the truth and\n * moveTo() IS the UPDATE, so there is no second write to lose in a crash.\n */\nfinal class WriteThroughListener implements DeliveryListener {\n    private final NotificationRepository repo;\n    WriteThroughListener(NotificationRepository repo) { this.repo = repo; }\n    public void onTransition(DeliveryRecord r, DeliveryState from, DeliveryState to, String detail) {\n        repo.insertIfAbsent(r.notification().id(), r.notification().toString());\n        repo.advance(r.notification().id(), to, r.attempt(), Progress.rankOf(r.attempt(), to));\n    }\n}\n\n// ---- ext: ten instances behind a load balancer -- and evicting what nobody is using\n/**\n * Two in-memory stores are all that stop this running on ten machines. The de-dup store becomes one Redis call,\n * SET key 1 NX PX ttl, which is the same single atomic claim putIfAbsent was; the per-channel token bucket\n * becomes a small Lua script that refills and spends in one round trip. The queue becomes a broker with a topic\n * per priority class. Nothing in the engine changes, because it never knew where the stores lived.\n *\n * The version below is the in-memory one plus the sweep that a TTL gives you for free in Redis: without it, a\n * process that has seen ten million keys holds ten million entries for ever.\n */\nfinal class SweepingDedupeStore implements DedupeStore {\n    private final ConcurrentHashMap&lt;String, Long&gt; expiryByKey = new ConcurrentHashMap&lt;&gt;();\n    public boolean claim(String key, long nowMs, long ttlMs) {\n        while (true) {\n            Long previous = expiryByKey.putIfAbsent(key, nowMs + ttlMs);    // Redis: SET key 1 NX PX ttlMs\n            if (previous == null) return true;\n            if (previous &gt; nowMs) return false;\n            if (expiryByKey.replace(key, previous, nowMs + ttlMs)) return true;\n        }\n    }\n    public void release(String key) { expiryByKey.remove(key); }            // Redis: DEL key\n    /** Drop every key whose window has closed. Run it on the timer; Redis does this for you. */\n    int sweep(long nowMs) {\n        int before = expiryByKey.size();\n        expiryByKey.entrySet().removeIf(e -&gt; e.getValue() &lt;= nowMs);\n        return before - expiryByKey.size();\n    }\n    int size() { return expiryByKey.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>4 &middot; Which pattern is where, which SOLID letter is where, and where would a Factory or a Builder earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Adobe (2025) and PhonePe (2026) both asked which patterns you used and why. Moves 10 and 11 put every pattern and every SOLID letter next to the move that produced it, so this card is the exhibit: one line of real code each, to point at in the room. Three judgements are worth arguing out loud. Builder is earned: a notification has seven fields, four of them optional, and a seven-argument constructor with three nulls in it is how a promotion goes out on somebody's OTP template. Singleton is not earned: the service is handed to its callers, which is why the failure suite builds a fresh one for every test. Factory is not earned yet: the channel-to-sender map already <i>is</i> the registry, and it earns the name the day channels arrive as strings from a config file. Of the five SOLID letters, the one an interviewer tests is O, by changing a rule mid-round: quiet hours cost one new file and one entry in a list.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: the one line that differs per provider, behind an interface, handed in and never built here\ninterface Sender { Channel channel(); SendResult send(Recipient to, RenderedMessage m, String idempotencyKey); }\n\n// Chain of Responsibility: independent reasons, in order, and the first one that does not say ALLOW stops the walk\nfor (DeliveryGuard g : guards) { Verdict v = g.check(n, to, now); if (v.kind() != ALLOW) { verdict = v; break; } reserved.add(g); }\nif (verdict.kind() != ALLOW) for (int i = reserved.size() - 1; i &gt;= 0; i--) reserved.get(i).undo(n, to);   // refused or parked: keep nothing\n\n// Decorator: a Sender that holds a Sender, and a guard that holds a guard, so the engine cannot tell the difference\nMap.of(Channel.SMS, new CircuitBreakerSender(new RateLimitedSender(sms, 50, 10, clock), 2, 60_000, clock));\nList.of(new HoldForTomorrowGuard(new DailyCapGuard(2)));\n\n// Observer: announced after the change is committed, one try/catch each\nfor (DeliveryListener l : listeners) try { l.onTransition(this, from, to, detail); } catch (RuntimeException ignored) {}\n\n// State: one compare-and-set, and only if the rank goes UP\nif (want &lt;= current.rank()) return false;\n\n// Builder: seven fields, four optional -- this is where a builder stops being ceremony\nNotification.to(&quot;u1&quot;, Channel.SMS, &quot;otp&quot;).priority(Priority.CRITICAL).dedupeKey(&quot;login-77&quot;)\n            .category(&quot;otp&quot;).params(Map.of(&quot;code&quot;, &quot;4821&quot;)).deadlineMs(now + 60_000).build();\n\n// Factory: not yet. The registry is already here; it earns the name when channels come from config strings\nMap&lt;String, Sender&gt; byName = Map.of(&quot;EMAIL&quot;, new EmailSender(), &quot;WHATSAPP&quot;, new WhatsAppSender());\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>5 &middot; Each user may get at most two a day. Over the limit, do not drop the message: deliver it tomorrow.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>This was Microsoft's LLD round (2024): jobs finish, each notifies its user by email or SMS, two a day at most, and the rest wait for the next day. The count is <code>DailyCapGuard</code>. It RESERVES a slot under the user's gate, so two threads cannot both take the last one, and if a later guard refuses the message, <code>undo</code> gives the slot back. The day is the user's own calendar day. Holding for tomorrow is one new class, <code>HoldForTomorrowGuard</code>: it wraps the cap and turns its &ldquo;no&rdquo; into &ldquo;park until the user's midnight&rdquo;. That is a Decorator on a guard. The engine needs no change, because a parked message is judged again, by every guard, when it wakes. At midnight it meets tomorrow's cap like any new message, and quiet hours, if it is in the list, moves it on to 08:00. Test 14 proves it: the third message is parked, goes out at midnight, and counts against the new day.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: over the daily limit, hold it for tomorrow instead of dropping it (Microsoft)\n/**\n * Microsoft&#x27;s version of the cap: two a day per user, and the third is held for tomorrow, not dropped. It is a\n * guard that wraps the daily cap and turns its &quot;no&quot; into &quot;not today&quot;: a Decorator on a guard. It needs nothing\n * new from the engine, because a parked message is judged again when it wakes. At the user&#x27;s midnight it meets\n * tomorrow&#x27;s cap like any new message, and quiet hours, if it is in the list, moves it on to 08:00.\n */\nfinal class HoldForTomorrowGuard implements DeliveryGuard {\n    private final DailyCapGuard cap;\n    HoldForTomorrowGuard(DailyCapGuard cap) { this.cap = cap; }\n    public String name() { return cap.name(); }\n    public Verdict check(Notification n, Recipient r, long nowMs) {\n        Verdict v = cap.check(n, r, nowMs);\n        if (v.kind() != Verdict.Kind.SUPPRESS) return v;\n        long midnight = Instant.ofEpochMilli(nowMs).atZone(r.zone()).toLocalDate().plusDays(1)\n                               .atStartOfDay(r.zone()).toInstant().toEpochMilli();     // the user&#x27;s midnight, not ours\n        return Verdict.defer(midnight, &quot;daily limit reached, held until tomorrow&quot;);\n    }\n    public void undo(Notification n, Recipient r) { cap.undo(n, r); }\n}\n\n/**\n * At most N non-critical messages per user per day, counted on the recipient&#x27;s own calendar day. It RESERVES a\n * slot inside check(), so two threads cannot both see &quot;one slot left&quot;; undo() gives the slot back when a later\n * guard refuses the message. The per-user counter is only ever touched by a thread holding that user&#x27;s gate,\n * which is why a plain long[] is safe inside a ConcurrentHashMap: the map handles users appearing, the gate\n * handles one user&#x27;s arithmetic. So never share one DailyCapGuard between two services: each has its own gates.\n */\nfinal class DailyCapGuard implements DeliveryGuard {\n    private final int capPerDay;\n    private final ConcurrentHashMap&lt;String, long[]&gt; used = new ConcurrentHashMap&lt;&gt;();   // userId -&gt; [dayIndex, reserved]\n    DailyCapGuard(int capPerDay) { this.capPerDay = capPerDay; }\n    public String name() { return &quot;daily-cap&quot;; }\n    public Verdict check(Notification n, Recipient r, long nowMs) {\n        if (n.priority() == Priority.CRITICAL) return Verdict.ALLOW;\n        long day = Instant.ofEpochMilli(nowMs).atZone(r.zone()).toLocalDate().toEpochDay();   // their day, not UTC&#x27;s\n        long[] slot = used.computeIfAbsent(n.userId(), k -&gt; new long[]{day, 0});\n        if (slot[0] != day) { slot[0] = day; slot[1] = 0; }                 // a new day resets the count\n        if (slot[1] &gt;= capPerDay) return Verdict.suppress(&quot;already had &quot; + capPerDay + &quot; today&quot;);\n        slot[1]++;                                                          // reserve, do not merely count\n        return Verdict.ALLOW;\n    }\n    public void undo(Notification n, Recipient r) {\n        long[] slot = used.get(n.userId());\n        if (slot != null &amp;&amp; slot[1] &gt; 0) slot[1]--;\n    }\n    /** How many slots this user has spent today. For tests and for a &quot;why did I get nothing&quot; screen. */\n    int usedToday(String userId) { long[] s = used.get(userId); return s == null ? 0 : (int) s[1]; }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; The SMS gateway times out. Did the message go out or not? What do you write down?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>You do not know, and the design says so. A send has three outcomes, not two: yes (SENT), no (PERMANENT, or TRANSIENT: try later), and no answer (UNKNOWN), which is what a timeout is. The record moves to SENDING before the call and to SENT only after the gateway has answered. A crash in between leaves it saying SENDING, which is the truth, instead of a boolean that is wrong either way. A timeout or a 503 (the provider's &ldquo;busy, try later&rdquo;) is retried with exponential backoff (each wait twice the one before) and with the SAME idempotency key, because the only place a duplicate can be removed is the provider. Exactly-once does not exist across a network you do not control. You pick at-least-once plus an idempotent receiver (a provider that treats a repeated key as one message), which is effectively-once. If the budget runs out while still UNKNOWN, do not guess: ask the provider by the key. Amazon's 2026 round put this as &ldquo;resend notifications if sending failed&rdquo;.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * One attempt. The deadline is checked BEFORE the gateway is called, so an expired message costs nothing;\n     * moving to SENDING is how a worker takes ownership, and it fails if a cancel or a receipt got there first;\n     * the gateway call itself happens with no lock and no gate held, because it is the only slow thing here.\n     */\n    private void deliver(DeliveryRecord record) {\n        Notification n = record.notification();\n        int attempt = record.attempt();\n        if (clock.nowMs() &gt; n.deadlineMs()) { record.moveTo(attempt, DeliveryState.EXPIRED, &quot;deadline passed before the send&quot;); return; }\n        if (!record.moveTo(attempt, DeliveryState.SENDING, &quot;attempt &quot; + attempt)) return;   // cancelled, or already finished\n        Sender sender = senders.get(n.channel());\n        if (sender == null) { record.moveTo(attempt, DeliveryState.FAILED_FINAL, &quot;no sender registered for &quot; + n.channel()); return; }\n\n        SendResult result;\n        try { result = sender.send(directory.lookup(n.userId()), record.message(), n.idempotencyKey()); }\n        catch (RuntimeException e) { result = SendResult.unknown(&quot;the adapter threw: &quot; + e); }   // a broken adapter cannot kill a worker\n\n        switch (result.outcome()) {\n            case SENT -&gt; record.moveTo(attempt, DeliveryState.SENT, result.detail());\n            case PERMANENT -&gt; record.moveTo(attempt, DeliveryState.FAILED_FINAL, result.detail());\n            case UNKNOWN -&gt; {\n                record.moveTo(attempt, DeliveryState.UNKNOWN, result.detail());\n                retryOrGiveUp(record, attempt, result.detail());\n            }\n            case TRANSIENT -&gt; retryOrGiveUp(record, attempt, result.detail());\n        }\n    }\n\n    private void retryOrGiveUp(DeliveryRecord record, int attempt, String why) {\n        if (!retryPolicy.shouldRetry(attempt)) {\n            record.moveTo(attempt, DeliveryState.FAILED_FINAL, &quot;gave up after &quot; + attempt + &quot; attempts: &quot; + why);\n            return;\n        }\n        long delay = retryPolicy.backoffMs(attempt);\n        int next = attempt + 1;\n        record.moveTo(attempt, DeliveryState.RETRY_SCHEDULED, &quot;attempt &quot; + next + &quot; in &quot; + delay + &quot; ms: &quot; + why);\n        later(() -&gt; { if (!offerNow(record, next)) record.moveTo(next, DeliveryState.FAILED_FINAL, &quot;queue full when the retry came due&quot;); }, delay);\n    }\n\n// ---- ext: exactly once is impossible -- and the code says so out loud\n/**\n * There is no exactly-once send to a remote gateway, and pretending otherwise is the mistake this design exists\n * to avoid. The gateway call has three outcomes, not two: yes, no, and no answer. On &quot;no answer&quot; you must choose\n * between never sending (and losing real messages when the reply was merely lost) and sending again (and risking\n * a duplicate). This service chooses at-least-once and then removes the duplicate at the only place it can be\n * removed -- the provider -- by carrying the SAME idempotency key on every attempt. That is effectively-once:\n * at-least-once delivery plus an idempotent receiver. UNKNOWN is the state that makes the choice visible instead\n * of hiding it behind a boolean.\n */\nfinal class EffectivelyOnce {\n    /** What a retry looks like from the provider&#x27;s side: same key, so the second call is recognised, not resent. */\n    static String explain(DeliveryRecord record) {\n        Notification n = record.notification();\n        return &quot;key=&quot; + n.idempotencyKey() + &quot; attempt=&quot; + record.attempt() + &quot; state=&quot; + record.state()\n             + &quot; -&gt; the provider sees one key and collapses attempts 2..n into the first accepted send&quot;;\n    }\n    /** The only honest reconciliation for a record stuck at UNKNOWN when the budget runs out: ask, do not guess. */\n    static String reconcile(DeliveryRecord record) {\n        return record.state() == DeliveryState.UNKNOWN || record.state() == DeliveryState.SENDING\n                ? &quot;query the provider by &quot; + record.notification().idempotencyKey() + &quot; and set the state from THEIR answer&quot;\n                : &quot;nothing to reconcile: &quot; + record.state();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>7 &middot; The SMS provider allows 5,000 a minute, it is throttling us, and every worker is parked on a socket to a gateway that is down.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The first two answers have the same shape: a class that implements Sender and holds a Sender, so the engine cannot tell the difference. The circuit breaker counts failures in a row. Past a threshold it answers TRANSIENT without a network call for the next minute, so a dead gateway costs nothing, and one success closes it again. The rate limiter is a token bucket (a counter that refills at a fixed rate; each send spends one token), per user by default. Amazon's 2026 version is the provider's own limit, 5,000 a minute: the same bucket keyed by channel, with capacity 5,000 and a refill of 83 a second. The bucket is one immutable value inside an AtomicReference, so &ldquo;refill, then spend one&rdquo; is one compare-and-set, and two threads cannot both spend the last token. Being refused is a TRANSIENT failure, so the engine's own backoff waits on the timer, not on a worker. The third failure is the one interviewers name: when the gateway comes back, ten thousand parked retries are all due in the same millisecond. <code>JitteredBackoff</code> is the same trick on the retry policy (it holds one and is one) and adds jitter (a random spread to each wait): three waits of 2,000 ms become 1,730, 1,749 and 1,348.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a flaky provider is eating the workers -- stop calling it for a while (Decorator)\n/**\n * A circuit breaker that IS a Sender, so the engine cannot tell the difference. After `threshold` failures in a\n * row it opens for `openMs` and answers TRANSIENT_FAILURE without making a network call, which means a dead SMS\n * gateway costs nothing instead of parking every worker on a socket timeout. One success closes it again.\n */\nfinal class CircuitBreakerSender implements Sender {\n    private final Sender base; private final int threshold; private final long openMs; private final Clock clock;\n    private final AtomicInteger consecutiveFailures = new AtomicInteger();\n    private final AtomicLong openUntilMs = new AtomicLong();\n    private final AtomicInteger shortCircuited = new AtomicInteger();\n    CircuitBreakerSender(Sender base, int threshold, long openMs, Clock clock) {\n        this.base = base; this.threshold = threshold; this.openMs = openMs; this.clock = clock;\n    }\n    public Channel channel() { return base.channel(); }\n    public SendResult send(Recipient to, RenderedMessage m, String idempotencyKey) {\n        long now = clock.nowMs();\n        if (now &lt; openUntilMs.get()) {\n            shortCircuited.incrementAndGet();\n            return SendResult.transientFailure(&quot;circuit open for &quot; + base.channel() + &quot;, no call made&quot;);\n        }\n        SendResult result = base.send(to, m, idempotencyKey);\n        switch (result.outcome()) {\n            case SENT, PERMANENT -&gt; consecutiveFailures.set(0);      // a permanent failure is the provider working fine\n            case TRANSIENT, UNKNOWN -&gt; { if (consecutiveFailures.incrementAndGet() &gt;= threshold) openUntilMs.set(now + openMs); }\n        }\n        return result;\n    }\n    /** How many calls the breaker swallowed. The number you would put on a dashboard. */\n    int shortCircuited() { return shortCircuited.get(); }\n    boolean isOpen() { return clock.nowMs() &lt; openUntilMs.get(); }\n}\n\n// ---- ext: the provider caps us at N per second -- a token bucket in front of it (Decorator)\n/**\n * A token bucket (a counter that refills at a fixed rate; each send spends one token) in front of a provider,\n * again as a Sender that wraps a Sender. One bucket per user by default; hand in r -&gt; &quot;all&quot; and it is the\n * provider&#x27;s own limit instead (Amazon&#x27;s 5,000 a minute: capacity 5000, refill 83.3 a second). The bucket is one\n * immutable record (tokens plus the instant they were measured) inside an AtomicReference, so &quot;refill by elapsed\n * time, then spend one&quot; is a single compare-and-set: two threads cannot both spend the last token, and no bucket\n * blocks another. Being refused is a TRANSIENT failure, so the engine&#x27;s own backoff does the waiting for us.\n */\nfinal class RateLimitedSender implements Sender {\n    private record Bucket(double tokens, long stampMs) {}\n    private final Sender base; private final double capacity, refillPerSecond; private final Clock clock;\n    private final Function&lt;Recipient, String&gt; bucketOf;\n    private final ConcurrentHashMap&lt;String, AtomicReference&lt;Bucket&gt;&gt; buckets = new ConcurrentHashMap&lt;&gt;();\n    /** One bucket per user. */\n    RateLimitedSender(Sender base, double capacity, double refillPerSecond, Clock clock) {\n        this(base, capacity, refillPerSecond, clock, Recipient::userId);\n    }\n    /** One bucket per whatever `bucketOf` names: the user, or r -&gt; &quot;all&quot; for the provider&#x27;s own limit. */\n    RateLimitedSender(Sender base, double capacity, double refillPerSecond, Clock clock, Function&lt;Recipient, String&gt; bucketOf) {\n        this.base = base; this.capacity = capacity; this.refillPerSecond = refillPerSecond; this.clock = clock; this.bucketOf = bucketOf;\n    }\n    public Channel channel() { return base.channel(); }\n    public SendResult send(Recipient to, RenderedMessage m, String idempotencyKey) {\n        if (!tryAcquire(bucketOf.apply(to))) return SendResult.transientFailure(&quot;rate limited on &quot; + base.channel());\n        return base.send(to, m, idempotencyKey);\n    }\n    private boolean tryAcquire(String key) {\n        AtomicReference&lt;Bucket&gt; ref = buckets.computeIfAbsent(key, k -&gt; new AtomicReference&lt;&gt;(new Bucket(capacity, clock.nowMs())));\n        while (true) {\n            Bucket current = ref.get();\n            long now = Math.max(clock.nowMs(), current.stampMs());          // a clock stepped back counts as no time passing\n            double refilled = Math.min(capacity, current.tokens() + (now - current.stampMs()) / 1000.0 * refillPerSecond);\n            if (refilled &lt; 1.0) return false;\n            if (ref.compareAndSet(current, new Bucket(refilled - 1.0, now))) return true;\n        }\n    }\n}\n\n// ---- ext: jittered backoff -- ten thousand retries must not come back in the same millisecond\n/** Wraps any retry policy and spreads each wait over [50%, 100%] of it, so a recovered provider is not stampeded. */\nfinal class JitteredBackoff implements RetryPolicy {\n    private final RetryPolicy base; private final Random random;\n    JitteredBackoff(RetryPolicy base, Random random) { this.base = base; this.random = random; }\n    public boolean shouldRetry(int attemptsSoFar) { return base.shouldRetry(attemptsSoFar); }\n    public long backoffMs(int attemptsSoFar) {\n        long full = base.backoffMs(attemptsSoFar);\n        return full / 2 + (long) (random.nextDouble() * (full / 2.0));\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>8 &middot; Support asks &quot;what happened to notification n-8, and why did my user get nothing?&quot; a thousand times a second, and wants the log of everything user u1 was sent.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>One hash lookup for the first question. The ledger maps id to record, and the record carries the answer as one immutable triple: which attempt, which state, and the reason in plain words, such as &ldquo;preference: opted out of marketing on PUSH&rdquo; or &ldquo;daily-cap: already had 20 today&rdquo;. A refused message still gets a record, because &ldquo;why did my user get nothing&rdquo; is the most common support question there is. The per-user log is Amazon's 2026 requirement: a second map, user id to that user's records, added to at submit, and <code>historyOf</code> returns a copy, oldest first. Neither read takes a lock: the progress lives in an AtomicReference, so a reader sees the old triple or the new one, never a mixture.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Where a notification got to. O(1): one hash lookup, no lock, no scan of anything. */\n    DeliveryState statusOf(String notificationId) {\n        DeliveryRecord r = ledger.get(notificationId);\n        return r == null ? null : r.state();\n    }\n    /** The whole record, for a support screen: state, attempt and the reason in plain words. */\n    DeliveryRecord recordOf(String notificationId) { return ledger.get(notificationId); }\n    /** Everything one user was sent or refused, oldest first, with the reason on each: the per-user log. */\n    List&lt;DeliveryRecord&gt; historyOf(String userId) {\n        Queue&lt;DeliveryRecord&gt; log = byUser.get(userId);\n        return log == null ? List.of() : List.copyOf(log);\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; Providers now post delivery receipts, late and out of order. And product wants to know who opened and who clicked.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing structural changes, because the rank rule was built for this. Every state carries a number, every move is a compare-and-set that lands only if it raises the rank, and a live state's rank is <code>attempt &times; 100 + its number</code>. So a receipt for attempt 1 that arrives while attempt 2 is in flight is dropped. The finished states share one rank, and DELIVERED alone sits above them, on purpose: if the handset acknowledged it, it arrived, whatever we wrote after giving up. The webhook is a listener that remembers which provider reference belongs to which record, so the HTTP handler is three lines. Opened and clicked (Adobe, 2025) are not states: keep them as events with a time, next to the record. A click does not change whether the message was delivered, and it can arrive twice.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Where a record is, as one immutable triple: which attempt, which state, and why. Swapped as a unit. */\nrecord Progress(int attempt, DeliveryState state, String detail) {\n    static final long FINISHED = 1_000_000L;                   // above any attempt a message will ever reach\n    /** The number a move must beat. Higher always wins. */\n    long rank() { return rankOf(attempt, state); }\n    /**\n     * attempt * 100 + the state&#x27;s number while the message is alive. Every finished state has the same rank,\n     * FINISHED, so one can never replace another; DELIVERED alone is one higher, so a late receipt still lands.\n     */\n    static long rankOf(int attempt, DeliveryState state) {\n        if (state == DeliveryState.DELIVERED) return FINISHED + 1;\n        return state.terminal() ? FINISHED : attempt * 100L + state.rank();\n    }\n}\n\n// ---- ext: delivery receipts -- SENT is not the end of the story\n/**\n * The webhook. It listens for SENT, remembers which provider reference belongs to which record and attempt, and\n * turns a later callback into one rank-ordered move. Everything hard about out-of-order webhooks was already\n * solved by the rank rule: a receipt for an attempt we have moved past is dropped, a DELIVERED outranks every\n * other terminal state, and the same receipt twice changes nothing the second time.\n */\nfinal class ReceiptWebhook implements DeliveryListener {\n    private record Origin(String notificationId, int attempt) {}\n    private final NotificationService service;\n    private final ConcurrentHashMap&lt;String, Origin&gt; byProviderRef = new ConcurrentHashMap&lt;&gt;();\n    ReceiptWebhook(NotificationService service) { this.service = service; }\n    public void onTransition(DeliveryRecord r, DeliveryState from, DeliveryState to, String detail) {\n        if (to == DeliveryState.SENT) byProviderRef.put(detail, new Origin(r.notification().id(), r.attempt()));\n    }\n    /** Called by the HTTP handler. True means the record moved; false means the callback was stale or a repeat. */\n    boolean deliveredAt(String providerRef) { return apply(providerRef, DeliveryState.DELIVERED, &quot;receipt: handset ack&quot;); }\n    /** A hard bounce: the address exists at us but not at the provider. Terminal, and it outranks SENT. */\n    boolean bounced(String providerRef, String why) { return apply(providerRef, DeliveryState.FAILED_FINAL, &quot;bounce: &quot; + why); }\n    private boolean apply(String providerRef, DeliveryState state, String detail) {\n        Origin o = byProviderRef.get(providerRef);\n        return o != null &amp;&amp; service.onReceipt(o.notificationId(), o.attempt(), state, detail);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; &quot;Order Placed&quot; must reach the customer before &quot;Item Dispatched&quot;. Your queue is asynchronous and it retries. How do you keep them in order?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Ajio asked this (2023) right after an asynchronous design. Two workers, or one retry, can reorder two messages: PLACED gets a 503, waits 200 ms for its retry, and SHIPPED overtakes it. <code>InOrderDispatcher</code> keeps one message in flight per ordering key, here the order id. The next message for that key is submitted only when the one before it is SENT or finished; until then it waits in a small queue for that key. It is a listener above the engine, so the engine does not change. SENT is the strongest order we control, bec

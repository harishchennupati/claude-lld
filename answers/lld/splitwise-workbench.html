is expense id has been applied; false means it already had been. */\n    boolean claim(String groupId, String expenseId);\n    /** One person&#x27;s net in one group. */\n    long netOf(String groupId, String userId);\n}\n/** The in-memory implementation, which is what the group uses today wearing a different coat. */\nclass InMemoryLedgerRepository implements LedgerRepository {\n    private final Map&lt;String, Long&gt; net = new ConcurrentHashMap&lt;&gt;();\n    private final Set&lt;String&gt; applied = ConcurrentHashMap.newKeySet();\n    public void addToNet(String groupId, String userId, long delta) { net.merge(groupId + &quot;/&quot; + userId, delta, Long::sum); }\n    public boolean claim(String groupId, String expenseId) { return applied.add(groupId + &quot;/&quot; + expenseId); }\n    public long netOf(String groupId, String userId) { return net.getOrDefault(groupId + &quot;/&quot; + userId, 0L); }\n}\n// the tables are the maps and the log:\n//   grp(id)   member(group_id, user_id)   balance(group_id, user_id, paise)   pair(group_id, debtor, creditor, paise)\n//   expense(id, version, group_id, kind, payer, amount_paise, status)   share(expense_id, version, user_id, paise)\n// the same write in SQL: ONE transaction per expense, in the group&#x27;s order.\n//   SELECT id FROM grp WHERE id = ? FOR UPDATE;\n//     -- the group&#x27;s lock, now a row lock held until COMMIT: two servers take turns per group, so the\n//     -- membership check and &quot;may carol leave?&quot; still see a group nobody else is changing\n//   INSERT INTO expense (id, version, group_id, payer, amount_paise) VALUES (?,1,?,?,?) ON CONFLICT DO NOTHING;\n//     -- 0 rows inserted means a retry: ROLLBACK, the ledger was already moved\n//   INSERT INTO balance (group_id, user_id, paise) VALUES (?,?,?)\n//     ON CONFLICT (group_id, user_id) DO UPDATE SET paise = balance.paise + EXCLUDED.paise;   -- once per person\n//     -- an atomic add that also creates the row the first time; a bare UPDATE would skip a brand-new member\n//   COMMIT;\n\n// ---- ext: the simplification is a suggestion -- prove the plan is valid, and say why greedy is a heuristic\n/** Checks a plan the way a reviewer would: does paying it clear everyone, and is it not more than n-1 payments. */\nclass SimplifyProof {\n    /** True when applying every transfer leaves every single person at zero. */\n    static boolean settlesEveryone(Map&lt;String, Long&gt; net, List&lt;Transfer&gt; plan) {\n        Map&lt;String, Long&gt; after = new TreeMap&lt;&gt;(net);\n        for (Transfer t : plan) { after.merge(t.from(), t.paise(), Long::sum); after.merge(t.to(), -t.paise(), Long::sum); }\n        return after.values().stream().allMatch(v -&gt; v == 0);\n    }\n    /** Greedy never needs more than n-1 payments, because each one zeroes at least one person. */\n    static boolean withinBound(Map&lt;String, Long&gt; net, List&lt;Transfer&gt; plan) {\n        long people = net.values().stream().filter(v -&gt; v != 0).count();\n        return plan.size() &lt;= Math.max(people - 1, 0);\n    }\n    // and the honest caveat: greedy is not always the MINIMUM. a owes 400 and b owes 300; c, d and e are owed\n    // 200, 200 and 300. Greedy pays a-&gt;e 300, b-&gt;c 200, a-&gt;d 100, b-&gt;d 100: four payments. Three would do\n    // (a-&gt;c 200, a-&gt;d 200, b-&gt;e 300), because {a, c, d} and {b, e} each sum to zero and settle on their own.\n    // Finding such groups is a search over subsets (NP-hard in general), so the product ships the greedy plan\n    // and calls it &quot;simplified&quot;, not &quot;minimal&quot;.\n}\n\n// ---- ext: auto-simplify -- what a group shows as &quot;who owes whom&quot; with the toggle on; the log is untouched\n/**\n * The Splitwise toggle, as a view. It changes nothing: it builds a fresh ledger from the suggested transfers,\n * with the same net for every person but far fewer live pairs, and a group with the toggle on shows that one\n * instead of its pairwise map. The expense log and the real ledger are untouched, so switching it off loses nothing.\n */\nclass AutoSimplify {\n    /** A new ledger holding only the simplified transfers. Same nets, fewer pairs. */\n    static Ledger collapse(Map&lt;String, Long&gt; net, SimplifyStrategy strategy) {\n        Ledger collapsed = new Ledger();\n        for (Transfer t : strategy.simplify(net))                         // &quot;to paid t.paise on behalf of from&quot;\n            collapsed.apply(t.to(), List.of(new Share(t.from(), t.paise())), +1);\n        return collapsed;\n    }\n}\n\n// ---- ext: the true minimum -- when the interviewer says greedy is not the fewest payments (LeetCode 465)\n/**\n * The fewest payments, exactly. People whose balances sum to zero can settle among themselves in one payment fewer\n * than their number, so: fewest payments = people with a balance - the most zero-sum groups they split into.\n * best[m] is that most-groups count for the set of people m (a bitmask: one bit per person), built from smaller sets;\n * a walk back cuts out the groups, and greedy settles inside each. O(n * 2^n) for n people with a balance: instant\n * at 15, too slow past about 20, which is why greedy stays the default.\n */\nclass FewestPayments implements SimplifyStrategy {\n    public List&lt;Transfer&gt; simplify(Map&lt;String, Long&gt; net) {\n        List&lt;String&gt; ids = new ArrayList&lt;&gt;();\n        for (Map.Entry&lt;String, Long&gt; e : new TreeMap&lt;&gt;(net).entrySet()) if (e.getValue() != 0) ids.add(e.getKey());\n        int n = ids.size();\n        if (n &gt; 20) return new MinCashFlow().simplify(net);                   // 2^20 sets is the practical ceiling\n        long[] sum = new long[1 &lt;&lt; n];\n        int[] best = new int[1 &lt;&lt; n];\n        for (int m = 1; m &lt; 1 &lt;&lt; n; m++) {\n            sum[m] = sum[m &amp; (m - 1)] + net.get(ids.get(Integer.numberOfTrailingZeros(m)));   // m minus its lowest bit\n            for (int i = 0; i &lt; n; i++) if ((m &gt;&gt; i &amp; 1) == 1) best[m] = Math.max(best[m], best[m ^ (1 &lt;&lt; i)]);\n            if (sum[m] == 0) best[m]++;                                         // m closes one more zero-sum group\n        }\n        List&lt;Transfer&gt; plan = new ArrayList&lt;&gt;();\n        int m = (1 &lt;&lt; n) - 1, top = m;                                          // walk back from everyone\n        while (m != 0) {\n            int want = best[m] - (sum[m] == 0 ? 1 : 0), i = 0;\n            while ((m &gt;&gt; i &amp; 1) == 0 || best[m ^ (1 &lt;&lt; i)] != want) i++;        // drop a person without losing a group\n            m ^= 1 &lt;&lt; i;\n            if (sum[m] == 0) { plan.addAll(settle(ids, net, top ^ m)); top = m; }   // top minus m is one zero-sum group\n        }\n        return plan;\n    }\n    /** Greedy inside one zero-sum group: k people, at most k - 1 payments. */\n    private static List&lt;Transfer&gt; settle(List&lt;String&gt; ids, Map&lt;String, Long&gt; net, int group) {\n        Map&lt;String, Long&gt; part = new TreeMap&lt;&gt;();\n        for (int i = 0; i &lt; ids.size(); i++) if ((group &gt;&gt; i &amp; 1) == 1) part.put(ids.get(i), net.get(ids.get(i)));\n        return new MinCashFlow().simplify(part);\n    }\n}\n\n// ---- ext: many groups -- join a group, and one user&#x27;s balance across every group they are in\n/**\n * A user is in many groups. The directory keeps user -&gt; group ids, updated on every create, join and leave that goes\n * through it, so &quot;Bob, everywhere&quot; reads only Bob&#x27;s groups. Each group is read under its own lock: every number is\n * exact, but the total is not one frozen instant across groups, which is fine for a screen.\n */\nclass Directory {\n    private final Splitwise app;\n    private final Map&lt;String, Set&lt;String&gt;&gt; groupsOf = new ConcurrentHashMap&lt;&gt;();   // user -&gt; ids of their groups\n    /** Every create, join and leave goes through here, so the index never misses one. */\n    Directory(Splitwise app) { this.app = app; }\n    /** Create a group through the app, and index every member. */\n    Group create(String groupId, String... members) {\n        Group g = app.newGroup(groupId, members);\n        for (String u : members) index(u).add(groupId);\n        return g;\n    }\n    /** Join: the group adds the member under its own lock, then the index learns it. */\n    void join(String groupId, String userId) { app.group(groupId).addMember(userId); index(userId).add(groupId); }\n    /** Leave: the group refuses while the net there is not zero; the index forgets only after the group agreed. */\n    void leave(String groupId, String userId) { app.group(groupId).removeMember(userId); index(userId).remove(groupId); }\n    /** What the whole app owes this user: their net summed over every group they are in. */\n    long netEverywhere(String userId) {\n        long total = 0;\n        for (String gid : index(userId)) total += app.group(gid).netOf(userId);\n        return total;\n    }\n    /** How much `debtor` owes `creditor` over every group they share, after netting; never negative. */\n    long owesEverywhere(String debtor, String creditor) {\n        long signed = 0;\n        for (String gid : index(debtor)) {\n            Group g = app.group(gid);\n            signed += g.owes(debtor, creditor) - g.owes(creditor, debtor);\n        }\n        return Math.max(signed, 0);\n    }\n    /** This user&#x27;s group ids, a thread-safe set made on first use. */\n    private Set&lt;String&gt; index(String userId) { return groupsOf.computeIfAbsent(userId, k -&gt; ConcurrentHashMap.newKeySet()); }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) {\n        Splitwise app = new Splitwise();\n\n        // a fourth split rule: one new class, one registry line\n        Group flat = app.newGroup(&quot;flat&quot;, &quot;ann&quot;, &quot;ben&quot;, &quot;cal&quot;);\n        // SplitType is an enum, so a brand-new SHARES constant would be the one extra edit. To show the drop-in\n        // without it, the weights rule is registered on the PERCENT key: the group, the ledger, the checks and\n        // the tests are all untouched, which is exactly the point.\n        flat.configure(new LinkedHashMap&lt;&gt;(Map.of(SplitType.EQUAL, new EqualSplit(), SplitType.EXACT, new ExactSplit(),\n                                                  SplitType.PERCENT, new SharesSplit())), new MinCashFlow());\n        flat.addExpense(&quot;w1&quot;, &quot;ann&quot;, Money.rupees(&quot;400.00&quot;), SplitType.PERCENT,\n            List.of(new Participant(&quot;ann&quot;, 2), new Participant(&quot;ben&quot;, 1), new Participant(&quot;cal&quot;, 1)), &quot;rent 2:1:1&quot;);\n        System.out.println(&quot;shares 2:1:1 of 400.00 -&gt; &quot; + flat.history().get(0).shares());\n\n        // fairness: the odd paise move around\n        RotatingRemainderSplit rot = new RotatingRemainderSplit();\n        List&lt;Participant&gt; three = List.of(Participant.of(&quot;ann&quot;), Participant.of(&quot;ben&quot;), Participant.of(&quot;cal&quot;));\n        for (int i = 0; i &lt; 3; i++) System.out.println(&quot;rotating 100 paise across 3 -&gt; &quot; + rot.split(100, &quot;ann&quot;, three));\n\n        // multi-currency: a euro debt and a rupee debt never mix\n        MultiCurrencyLedger mc = new MultiCurrencyLedger();\n        mc.apply(&quot;INR&quot;, &quot;ann&quot;, List.of(new Share(&quot;ben&quot;, 30000)), +1);\n        mc.apply(&quot;EUR&quot;, &quot;ben&quot;, List.of(new Share(&quot;ann&quot;, 2000)), +1);\n        FxRates fx = (minor, from, to) -&gt; from.equals(to) ? minor : from.equals(&quot;EUR&quot;) ? minor * 90 : minor / 90;\n        System.out.println(&quot;ann: INR net &quot; + Money.fmt(mc.netOf(&quot;INR&quot;, &quot;ann&quot;)) + &quot;, EUR net &quot; + Money.fmt(mc.netOf(&quot;EUR&quot;, &quot;ann&quot;))\n            + &quot;, shown in INR &quot; + Money.fmt(mc.netIn(&quot;INR&quot;, &quot;ann&quot;, fx)));\n\n        // two friends, no group\n        Group pair = Friends.between(app, &quot;ben&quot;, &quot;ann&quot;);\n        pair.addExpense(&quot;f1&quot;, &quot;ann&quot;, Money.rupees(&quot;120.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;ann&quot;), Participant.of(&quot;ben&quot;)), &quot;coffee&quot;);\n        System.out.println(&quot;friends &quot; + pair.id() + &quot;: ben owes ann &quot; + Money.fmt(pair.owes(&quot;ben&quot;, &quot;ann&quot;))\n            + &quot;; the same pair the other way round is &quot; + Friends.between(app, &quot;ann&quot;, &quot;ben&quot;).id());\n\n        // recurring rent, posted twice on purpose\n        Group house = app.newGroup(&quot;house&quot;, &quot;ann&quot;, &quot;ben&quot;);\n        long start = 1_700_000_000_000L, month = 30L * 24 * 3600 * 1000;\n        Recurring rent = new Recurring(&quot;rent&quot;, &quot;ann&quot;, Money.rupees(&quot;20000.00&quot;),\n            List.of(Participant.of(&quot;ann&quot;), Participant.of(&quot;ben&quot;)), start, month);\n        rent.post(house, start + 2 * month);\n        rent.post(house, start + 2 * month);                                        // the job ran twice\n        System.out.println(&quot;recurring rent: &quot; + house.history().size() + &quot; expenses (3 periods, posted once each)&quot;);\n\n        // edit, delete, and the audit view\n        house.edit(&quot;rent#0&quot;, &quot;ann&quot;, Money.rupees(&quot;21000.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;ann&quot;), Participant.of(&quot;ben&quot;)), &quot;rent period 0 (raised)&quot;);\n        System.out.print(&quot;audit of rent#0:\\n&quot; + AuditView.print(house, &quot;rent#0&quot;));\n\n        // ladder rung 2: the same pair moved from many threads with no lock of our own\n        PairLedger pl = new PairLedger();\n        pl.move(&quot;ann&quot;, &quot;ben&quot;, 5000);\n        pl.move(&quot;ben&quot;, &quot;ann&quot;, 5000);                                                // the pair nets to zero\n        System.out.println(&quot;pair ledger: ben owes ann &quot; + Money.fmt(pl.owed(&quot;ben&quot;, &quot;ann&quot;))\n            + &quot;, live pairs &quot; + pl.livePairs());\n\n        // persistence seam\n        LedgerRepository repo = new InMemoryLedgerRepository();\n        if (repo.claim(&quot;house&quot;, &quot;x1&quot;)) { repo.addToNet(&quot;house&quot;, &quot;ann&quot;, 5000); repo.addToNet(&quot;house&quot;, &quot;ben&quot;, -5000); }\n        if (repo.claim(&quot;house&quot;, &quot;x1&quot;)) { repo.addToNet(&quot;house&quot;, &quot;ann&quot;, 5000); repo.addToNet(&quot;house&quot;, &quot;ben&quot;, -5000); }\n        System.out.println(&quot;repository after the same write twice: ann &quot; + Money.fmt(repo.netOf(&quot;house&quot;, &quot;ann&quot;)));\n\n        // simplify: the plan is valid, and collapsing keeps every net\n        Group trip = app.newGroup(&quot;trip&quot;, &quot;a&quot;, &quot;b&quot;, &quot;c&quot;, &quot;d&quot;);\n        trip.addExpense(&quot;t1&quot;, &quot;a&quot;, Money.rupees(&quot;400.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;a&quot;), Participant.of(&quot;b&quot;), Participant.of(&quot;c&quot;), Participant.of(&quot;d&quot;)), &quot;villa&quot;);\n        trip.addExpense(&quot;t2&quot;, &quot;b&quot;, Money.rupees(&quot;120.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;c&quot;), Participant.of(&quot;d&quot;)), &quot;tickets&quot;);\n        Map&lt;String, Long&gt; net = trip.balances();\n        List&lt;Transfer&gt; plan = trip.simplify();\n        System.out.println(&quot;plan &quot; + plan + &quot; settles everyone=&quot; + SimplifyProof.settlesEveryone(net, plan)\n            + &quot; within n-1=&quot; + SimplifyProof.withinBound(net, plan));\n        Ledger collapsed = AutoSimplify.collapse(net, new MinCashFlow());\n        System.out.println(&quot;auto-simplified ledger has the same nets: &quot; + collapsed.netSnapshot().equals(net));\n\n        // the true minimum: greedy makes four payments here, where three would do\n        Map&lt;String, Long&gt; tricky = Map.of(&quot;a&quot;, -40000L, &quot;b&quot;, -30000L, &quot;c&quot;, 20000L, &quot;d&quot;, 20000L, &quot;e&quot;, 30000L);\n        System.out.println(&quot;greedy &quot; + new MinCashFlow().simplify(tricky).size() + &quot; payments; fewest &quot;\n            + new FewestPayments().simplify(tricky));\n\n        // many groups: one user&#x27;s balance everywhere, a join, and a passbook\n        Directory dir = new Directory(new Splitwise());\n        Group goa = dir.create(&quot;goa&quot;, &quot;ann&quot;, &quot;ben&quot;);\n        Group home = dir.create(&quot;home&quot;, &quot;ann&quot;, &quot;ben&quot;, &quot;cal&quot;);\n        goa.addExpense(&quot;g1&quot;, &quot;ann&quot;, Money.rupees(&quot;300.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;ann&quot;), Participant.of(&quot;ben&quot;)), &quot;taxi&quot;);\n        home.addExpense(&quot;h1&quot;, &quot;ben&quot;, Money.rupees(&quot;90.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;ann&quot;), Participant.of(&quot;ben&quot;), Participant.of(&quot;cal&quot;)), &quot;milk&quot;);\n        dir.join(&quot;goa&quot;, &quot;cal&quot;);\n        System.out.println(&quot;ben everywhere &quot; + Money.fmt(dir.netEverywhere(&quot;ben&quot;)) + &quot;; ben owes ann everywhere &quot;\n            + Money.fmt(dir.owesEverywhere(&quot;ben&quot;, &quot;ann&quot;)) + &quot;; cal&#x27;s passbook at home &quot; + AuditView.passbook(home, &quot;cal&quot;));\n    }\n}\n</code></pre></div><div class=\"ed\"><div class=\"tab\"><b>FailureTests.java</b><button class=\"copy\" data-key=\"f2\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\n\n// targeted failure tests: each one proves a claim the design makes on page 02, move 9.\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) { System.out.println((ok ? &quot;PASS &quot; : &quot;FAIL &quot;) + what); if (!ok) failures++; }\n    static long sum(Collection&lt;Long&gt; xs) { long s = 0; for (long x : xs) s += x; return s; }\n\n    public static void main(String[] args) throws Exception {\n        Splitwise app = new Splitwise();\n\n        // 1. fifty people post an expense to ONE group at the same instant: no update may be lost,\n        //    and the sum of every balance must be exactly zero, because every paise owed is a paise owned.\n        Group flat = app.newGroup(&quot;flat&quot;, &quot;u0&quot;, &quot;u1&quot;, &quot;u2&quot;, &quot;u3&quot;, &quot;u4&quot;);\n        List&lt;Participant&gt; five = List.of(Participant.of(&quot;u0&quot;), Participant.of(&quot;u1&quot;), Participant.of(&quot;u2&quot;),\n                                         Participant.of(&quot;u3&quot;), Participant.of(&quot;u4&quot;));\n        ExecutorService pool = Executors.newFixedThreadPool(50);      // fifty threads, all parked on one latch\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; posted = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final int n = i;\n            posted.add(pool.submit(() -&gt; { go.await(); return flat.addExpense(&quot;x&quot; + n, &quot;u&quot; + (n % 5), 100 + n, SplitType.EQUAL, five, &quot;r&quot; + n); }));\n        }\n        go.countDown();\n        int applied = 0;\n        for (Future&lt;?&gt; f : posted) { f.get(); applied++; }\n        pool.shutdown();\n        check(applied == 50, &quot;50 concurrent expenses all landed&quot;);\n        check(flat.history().size() == 50, &quot;the audit log has 50 rows, not 49&quot;);\n        check(sum(flat.balances().values()) == 0, &quot;sum of all balances is exactly zero after the race&quot;);\n        // the two maps must agree: what a user owes minus what is owed to them is the negative of their net\n        boolean agree = true;\n        Map&lt;String, Map&lt;String, Long&gt;&gt; owes = flat.owesTable();\n        for (String u : flat.members()) {\n            long out = sum(owes.getOrDefault(u, Map.of()).values()), in = 0;\n            for (Map.Entry&lt;String, Map&lt;String, Long&gt;&gt; row : owes.entrySet()) in += row.getValue().getOrDefault(u, 0L);\n            if (in - out != flat.netOf(u)) agree = false;\n        }\n        check(agree, &quot;the pairwise map and the net map agree for every member&quot;);\n        // and every number is exactly what one thread gets posting the same fifty expenses in order\n        Group replay = app.newGroup(&quot;replay&quot;, &quot;u0&quot;, &quot;u1&quot;, &quot;u2&quot;, &quot;u3&quot;, &quot;u4&quot;);\n        for (int i = 0; i &lt; 50; i++) replay.addExpense(&quot;x&quot; + i, &quot;u&quot; + (i % 5), 100 + i, SplitType.EQUAL, five, &quot;r&quot; + i);\n        check(flat.balances().equals(replay.balances()) &amp;&amp; flat.owesTable().equals(replay.owesTable()),\n              &quot;every balance equals the same fifty expenses posted by one thread&quot;);\n\n        // 2. an exact split that does not add up to the bill is refused, and NOTHING changes\n        Group goa = app.newGroup(&quot;goa&quot;, &quot;alice&quot;, &quot;bob&quot;, &quot;carol&quot;);\n        goa.addExpense(&quot;e1&quot;, &quot;alice&quot;, Money.rupees(&quot;300.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;), Participant.of(&quot;carol&quot;)), &quot;hotel&quot;);\n        Map&lt;String, Long&gt; before = goa.balances();\n        try {\n            goa.addExpense(&quot;bad&quot;, &quot;alice&quot;, Money.rupees(&quot;500.00&quot;), SplitType.EXACT,\n                List.of(new Participant(&quot;bob&quot;, Money.rupees(&quot;100.00&quot;)), new Participant(&quot;carol&quot;, Money.rupees(&quot;100.00&quot;))), &quot;oops&quot;);\n            check(false, &quot;an exact split that does not reconcile must throw&quot;);\n        } catch (IllegalArgumentException e) { check(true, &quot;exact split rejected: &quot; + e.getMessage()); }\n        check(before.equals(goa.balances()), &quot;the rejected expense changed no balance&quot;);\n        check(goa.history().size() == 1, &quot;the rejected expense is not in the audit log&quot;);\n        try {\n            goa.addExpense(&quot;bad2&quot;, &quot;alice&quot;, Money.rupees(&quot;500.00&quot;), SplitType.PERCENT,\n                List.of(new Participant(&quot;bob&quot;, 6000), new Participant(&quot;carol&quot;, 3000)), &quot;oops&quot;);\n            check(false, &quot;percentages that do not add up to 100% must throw&quot;);\n        } catch (IllegalArgumentException e) { check(true, &quot;percent split rejected: &quot; + e.getMessage()); }\n        check(before.equals(goa.balances()), &quot;the rejected percent expense changed no balance either&quot;);\n\n        // 3. one rupee across three people: the paise must not vanish\n        Group odd = app.newGroup(&quot;odd&quot;, &quot;alice&quot;, &quot;bob&quot;, &quot;carol&quot;);\n        odd.addExpense(&quot;r1&quot;, &quot;alice&quot;, 100, SplitType.EQUAL,\n            List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;), Participant.of(&quot;carol&quot;)), &quot;chai&quot;);\n        long shares = sum(odd.history().get(0).shares().stream().map(Share::paise).toList());\n        check(shares == 100, &quot;100 paise split three ways still sums to 100 (34 + 33 + 33)&quot;);\n        check(odd.history().get(0).shares().get(0).paise() == 34, &quot;the payer absorbs the odd paise: 34&quot;);\n        check(sum(odd.balances().values()) == 0, &quot;the balances of the rounded split sum to zero&quot;);\n        check(odd.netOf(&quot;alice&quot;) == 66 &amp;&amp; odd.netOf(&quot;bob&quot;) == -33, &quot;alice is owed 66 paise, bob owes 33&quot;);\n\n        // 4. delete reverses exactly, and keeps the row\n        Group del = app.newGroup(&quot;del&quot;, &quot;alice&quot;, &quot;bob&quot;);\n        Map&lt;String, Long&gt; empty = del.balances();\n        del.addExpense(&quot;d1&quot;, &quot;alice&quot;, Money.rupees(&quot;250.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;)), &quot;pizza&quot;);\n        check(del.netOf(&quot;bob&quot;) == -Money.rupees(&quot;125.00&quot;), &quot;bob owes 125.00 after the pizza&quot;);\n        del.delete(&quot;d1&quot;);\n        check(del.balances().equals(empty), &quot;delete put every balance back exactly&quot;);\n        check(del.owes(&quot;bob&quot;, &quot;alice&quot;) == 0, &quot;the pairwise entry is gone too&quot;);\n        check(del.history().get(0).status() == ExpenseStatus.DELETED, &quot;the expense is kept, marked DELETED&quot;);\n        try { del.delete(&quot;d1&quot;); check(false, &quot;deleting twice must throw&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;a second delete is refused, not double-reversed&quot;); }\n        check(del.balances().equals(empty), &quot;the refused second delete changed nothing&quot;);\n\n        // 5. a settle-up brings the pair to zero\n        Group s = app.newGroup(&quot;settle&quot;, &quot;alice&quot;, &quot;bob&quot;);\n        s.addExpense(&quot;s0&quot;, &quot;alice&quot;, Money.rupees(&quot;400.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;)), &quot;cab&quot;);\n        long owed = s.owes(&quot;bob&quot;, &quot;alice&quot;);\n        check(owed == Money.rupees(&quot;200.00&quot;), &quot;bob owes alice 200.00&quot;);\n        s.settleUp(&quot;s1&quot;, &quot;bob&quot;, &quot;alice&quot;, owed);\n        check(s.owes(&quot;bob&quot;, &quot;alice&quot;) == 0 &amp;&amp; s.owes(&quot;alice&quot;, &quot;bob&quot;) == 0, &quot;after the settle-up the pair is at zero&quot;);\n        check(s.netOf(&quot;alice&quot;) == 0 &amp;&amp; s.netOf(&quot;bob&quot;) == 0, &quot;and both nets are zero&quot;);\n        s.addExpense(&quot;s2&quot;, &quot;alice&quot;, Money.rupees(&quot;100.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;)), &quot;coffee&quot;);\n        s.settleUp(&quot;s3&quot;, &quot;bob&quot;, &quot;alice&quot;, Money.rupees(&quot;20.00&quot;));     // a PARTIAL payment\n        check(s.owes(&quot;bob&quot;, &quot;alice&quot;) == Money.rupees(&quot;30.00&quot;), &quot;a partial settle-up leaves the rest owed: 30.00&quot;);\n        s.settleUp(&quot;s4&quot;, &quot;bob&quot;, &quot;alice&quot;, Money.rupees(&quot;100.00&quot;));    // MORE than he owes: no special case\n        check(s.owes(&quot;alice&quot;, &quot;bob&quot;) == Money.rupees(&quot;70.00&quot;), &quot;overpaying just flips the pair: alice owes bob 70.00&quot;);\n\n        // 6. simplify is a suggestion: it must not move anybody&#x27;s net by a paise, and its transfers must clear everyone\n        Group sim = app.newGroup(&quot;sim&quot;, &quot;a&quot;, &quot;b&quot;, &quot;c&quot;, &quot;d&quot;);\n        sim.addExpense(&quot;p1&quot;, &quot;a&quot;, Money.rupees(&quot;400.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;a&quot;), Participant.of(&quot;b&quot;), Participant.of(&quot;c&quot;), Participant.of(&quot;d&quot;)), &quot;villa&quot;);\n        sim.addExpense(&quot;p2&quot;, &quot;b&quot;, Money.rupees(&quot;120.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;c&quot;), Participant.of(&quot;d&quot;)), &quot;tickets&quot;);\n        Map&lt;String, Long&gt; netBefore = sim.balances();\n        List&lt;Transfer&gt; plan = sim.simplify();\n        check(sim.balances().equals(netBefore), &quot;simplify changed nobody&#x27;s net&quot;);\n        Map&lt;String, Long&gt; after = new TreeMap&lt;&gt;(netBefore);\n        for (Transfer t : plan) { after.merge(t.from(), t.paise(), Long::sum); after.merge(t.to(), -t.paise(), Long::sum); }\n        boolean allZero = after.values().stream().allMatch(v -&gt; v == 0);\n        check(allZero, &quot;paying the suggested transfers clears every single person&quot;);\n        check(plan.size() &lt;= netBefore.size() - 1, &quot;at most n-1 transfers for n people with a balance: &quot; + plan.size());\n\n        // 7. a notifier that throws must not break the expense\n        Group noisy = app.newGroup(&quot;noisy&quot;, &quot;alice&quot;, &quot;bob&quot;);\n        noisy.addObserver((gid, e) -&gt; { throw new RuntimeException(&quot;push gateway is down&quot;); });\n        Expense landed = noisy.addExpense(&quot;n1&quot;, &quot;alice&quot;, Money.rupees(&quot;100.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;)), &quot;milk&quot;);\n        check(landed != null &amp;&amp; noisy.netOf(&quot;bob&quot;) == -Money.rupees(&quot;50.00&quot;), &quot;the expense landed although the notifier threw&quot;);\n        check(noisy.history().size() == 1, &quot;and it is in the audit log exactly once&quot;);\n\n        // 8. a rule written next year that loses a paise is caught before anything is written\n        Group buggy = app.newGroup(&quot;buggy&quot;, &quot;alice&quot;, &quot;bob&quot;);\n        buggy.configure(Map.of(SplitType.EQUAL, (total, payer, parts) -&gt; {         // deliberately wrong: drops a paise\n            List&lt;Share&gt; out = new ArrayList&lt;&gt;();\n            for (Participant p : parts) out.add(new Share(p.userId(), total / parts.size() - 1));\n            return out;\n        }), new MinCashFlow());\n        try {\n            buggy.addExpense(&quot;b1&quot;, &quot;alice&quot;, Money.rupees(&quot;100.00&quot;), SplitType.EQUAL,\n                List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;)), &quot;broken rule&quot;);\n            check(false, &quot;a rule whose shares do not sum to the bill must be caught&quot;);\n        } catch (IllegalStateException e) { check(true, &quot;CheckedSplit caught the broken rule: &quot; + e.getMessage()); }\n        check(buggy.balances().isEmpty(), &quot;and the broken rule wrote nothing at all&quot;);\n\n        // 9. the same expense id twice (a retried request) is applied once\n        Group idem = app.newGroup(&quot;idem&quot;, &quot;alice&quot;, &quot;bob&quot;);\n        List&lt;Participant&gt; two = List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;));\n        Expense first = idem.addExpense(&quot;k1&quot;, &quot;alice&quot;, Money.rupees(&quot;80.00&quot;), SplitType.EQUAL, two, &quot;tea&quot;);\n        Expense again = idem.addExpense(&quot;k1&quot;, &quot;alice&quot;, Money.rupees(&quot;80.00&quot;), SplitType.EQUAL, two, &quot;tea&quot;);\n        check(first == again &amp;&amp; idem.netOf(&quot;bob&quot;) == -Money.rupees(&quot;40.00&quot;), &quot;a retried expense id is applied exactly once&quot;);\n\n        // 10. money is exact: a thousand indivisible bills. In paise nothing is lost. The same sum in double\n        //     drifts, which is the whole reason there is no double anywhere in Main.java.\n        Group chai = app.newGroup(&quot;chai&quot;, &quot;alice&quot;, &quot;bob&quot;, &quot;carol&quot;);\n        List&lt;Participant&gt; trio = List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;), Participant.of(&quot;carol&quot;));\n        for (int i = 0; i &lt; 1000; i++) chai.addExpense(&quot;c&quot; + i, &quot;alice&quot;, 100, SplitType.EQUAL, trio, &quot;chai&quot;);\n        check(sum(chai.balances().values()) == 0, &quot;1000 bills of 1.00 split three ways still sum to exactly zero&quot;);\n        check(chai.netOf(&quot;alice&quot;) == 66_000, &quot;alice is owed exactly 660.00: 66 paise a time, a thousand times&quot;);\n        double drift = 0;\n        for (int i = 0; i &lt; 1000; i++) drift += 1.00 / 3;              // the same split in rupees, as a double\n        check(drift * 3 != 1000.0, &quot;the same thousand splits in double do not add back to 1000.00: &quot; + (drift * 3));\n\n        // 11. nobody walks away from a debt: leaving is refused until that person&#x27;s net is zero\n        Group leave = app.newGroup(&quot;leave&quot;, &quot;alice&quot;, &quot;bob&quot;, &quot;carol&quot;);\n        leave.addExpense(&quot;l1&quot;, &quot;alice&quot;, Money.rupees(&quot;300.00&quot;), SplitType.EQUAL, trio, &quot;taxi&quot;);\n        try { leave.removeMember(&quot;carol&quot;); check(false, &quot;a member owing 100.00 must not be able to leave&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;leaving is refused while a balance is open: &quot; + e.getMessage()); }\n        leave.settleUp(&quot;l2&quot;, &quot;carol&quot;, &quot;alice&quot;, Money.rupees(&quot;100.00&quot;));\n        leave.removeMember(&quot;carol&quot;);\n        check(!leave.members().contains(&quot;carol&quot;), &quot;once her net is zero, carol can leave&quot;);\n        check(leave.history().size() == 2, &quot;and her rows stay in the log: leaving is not erasing&quot;);\n        try {\n            leave.addExpense(&quot;l3&quot;, &quot;alice&quot;, Money.rupees(&quot;50.00&quot;), SplitType.EQUAL,\n                List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;carol&quot;)), &quot;after she left&quot;);\n            check(false, &quot;an ex-member must not appear in a new expense&quot;);\n        } catch (IllegalArgumentException e) { check(true, &quot;an ex-member cannot be put in a new expense&quot;); }\n        // a zero net can hide a loop: bob owes carol 150.00 and carol owes alice 150.00. Her debts must pass through\n        // her as she leaves, or two debts would name somebody who is gone and could never be settled.\n        Group loop = app.newGroup(&quot;loop&quot;, &quot;alice&quot;, &quot;bob&quot;, &quot;carol&quot;);\n        loop.addExpense(&quot;o1&quot;, &quot;carol&quot;, Money.rupees(&quot;150.00&quot;), SplitType.EXACT,\n            List.of(new Participant(&quot;bob&quot;, Money.rupees(&quot;150.00&quot;))), &quot;bob&#x27;s ticket&quot;);\n        loop.addExpense(&quot;o2&quot;, &quot;alice&quot;, Money.rupees(&quot;150.00&quot;), SplitType.EXACT,\n            List.of(new Participant(&quot;carol&quot;, Money.rupees(&quot;150.00&quot;))), &quot;carol&#x27;s ticket&quot;);\n        Map&lt;String, Long&gt; netsBefore = loop.balances();\n        Set&lt;String&gt; seen = loop.members();\n        loop.removeMember(&quot;carol&quot;);\n        check(loop.owes(&quot;bob&quot;, &quot;carol&quot;) == 0 &amp;&amp; loop.owes(&quot;carol&quot;, &quot;alice&quot;) == 0, &quot;after carol leaves, no pair names her&quot;);\n        check(loop.owes(&quot;bob&quot;, &quot;alice&quot;) == Money.rupees(&quot;150.00&quot;) &amp;&amp; loop.balances().equals(netsBefore),\n              &quot;bob now owes alice 150.00, and nobody&#x27;s net moved&quot;);\n        check(seen.contains(&quot;carol&quot;), &quot;members() handed out a copy: the list taken earlier still has carol&quot;);\n        Map&lt;String, Long&gt; netsAfter = loop.balances();\n        try { loop.delete(&quot;o1&quot;); check(false, &quot;deleting an expense that names someone who left must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;an expense naming someone who left cannot be deleted&quot;); }\n        try {\n            loop.edit(&quot;o2&quot;, &quot;alice&quot;, Money.rupees(&quot;150.00&quot;), SplitType.EXACT,\n                List.of(new Participant(&quot;bob&quot;, Money.rupees(&quot;150.00&quot;))), &quot;moved to bob&quot;);\n            check(false, &quot;editing an expense that names someone who left must be refused&quot;);\n        } catch (IllegalArgumentException e) { check(true, &quot;nor edited: reversing it would reopen her balance&quot;); }\n        check(loop.balances().equals(netsAfter) &amp;&amp; loop.netOf(&quot;carol&quot;) == 0, &quot;and the refused changes moved nothing&quot;);\n\n        // 12. the ladder&#x27;s second rung needs no lock of ours and is still exact: 200 moves from 8 threads, one map\n        PairLedger pairs = new PairLedger();\n        ExecutorService pool2 = Executors.newFixedThreadPool(8);\n        CountDownLatch go2 = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; moves = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 200; i++) {\n            final int n = i;\n            moves.add(pool2.submit(() -&gt; { go2.await(); pairs.move(&quot;u&quot; + (n % 4), &quot;v&quot; + (n % 3), 100); return null; }));\n        }\n        go2.countDown();\n        for (Future&lt;?&gt; f : moves) f.get();\n        pool2.shutdown();\n        long moved = 0;\n        for (int a = 0; a &lt; 4; a++) for (int b = 0; b &lt; 3; b++) moved += pairs.owed(&quot;u&quot; + a, &quot;v&quot; + b);\n        check(moved == 200 * 100, &quot;200 pair moves with no lock of ours all landed: &quot; + Money.fmt(moved));\n        pairs.move(&quot;u0&quot;, &quot;v0&quot;, -pairs.owed(&quot;u0&quot;, &quot;v0&quot;));\n        check(pairs.livePairs() == 11, &quot;a pair that reaches zero drops out of the map: &quot; + pairs.livePairs() + &quot; left&quot;);\n\n        // 13. one group per id. A second newGroup with a used id is refused (a plain put() would drop the first\n        //     group and its balances), and two friends adding their first expense at the same instant share one group.\n        Group dupGroup = app.newGroup(&quot;dup&quot;, &quot;alice&quot;, &quot;bob&quot;);\n        dupGroup.addExpense(&quot;g1&quot;, &quot;alice&quot;, Money.rupees(&quot;100.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;)), &quot;lunch&quot;);\n        try { app.newGroup(&quot;dup&quot;, &quot;alice&quot;, &quot;bob&quot;); check(false, &quot;a second group with the same id must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;a second group with the same id is refused&quot;); }\n        check(app.group(&quot;dup&quot;) == dupGroup &amp;&amp; dupGroup.netOf(&quot;bob&quot;) == -Money.rupees(&quot;50.00&quot;), &quot;and the first group keeps its balances&quot;);\n        int lost = 0;\n        for (int t = 0; t &lt; 200; t++) {\n            Splitwise fresh = new Splitwise();\n            CountDownLatch start = new CountDownLatch(1);\n            ExecutorService both = Executors.newFixedThreadPool(2);\n            List&lt;Participant&gt; pair = List.of(Participant.of(&quot;ann&quot;), Participant.of(&quot;ben&quot;));\n            Future&lt;?&gt; a = both.submit(() -&gt; { start.await(); return Friends.between(fresh, &quot;ann&quot;, &quot;ben&quot;).addExpense(&quot;f1&quot;, &quot;ann&quot;, 100, SplitType.EQUAL, pair, &quot;tea&quot;); });\n            Future&lt;?&gt; b = both.submit(() -&gt; { start.await(); return Friends.between(fresh, &quot;ben&quot;, &quot;ann&quot;).addExpense(&quot;f2&quot;, &quot;ben&quot;, 300, SplitType.EQUAL, pair, &quot;cab&quot;); });\n            start.countDown(); a.get(); b.get(); both.shutdown();\n            if (fresh.group(&quot;pair:ann:ben&quot;).history().size() != 2) lost++;\n        }\n        check(lost == 0, &quot;two friends creating their pair at the same instant: one group, both expenses, in 200 of 200 runs&quot;);\n        try {\n            new Recurring(&quot;rent&quot;, &quot;ann&quot;, 100, List.of(Participant.of(&quot;ann&quot;), Participant.of(&quot;ben&quot;)), 0, 0);\n            check(false, &quot;a schedule with a zero period must be refused&quot;);\n        } catch (IllegalArgumentException e) { check(true, &quot;a schedule with a zero period is refused: post() would never end&quot;); }\n\n        // 14. greedy is short, not always the shortest. a owes 400 and b owes 300; c, d and e are owed 200, 200, 300:\n        //     greedy makes four payments where three would do. On random groups the exact plan is never longer.\n        Map&lt;String, Long&gt; tricky = Map.of(&quot;a&quot;, -40000L, &quot;b&quot;, -30000L, &quot;c&quot;, 20000L, &quot;d&quot;, 20000L, &quot;e&quot;, 30000L);\n        List&lt;Transfer&gt; greedy = new MinCashFlow().simplify(tricky), fewest = new FewestPayments().simplify(tricky);\n        check(greedy.size() == 4 &amp;&amp; fewest.size() == 3, &quot;greedy makes 4 payments where 3 would do: &quot; + fewest);\n        check(SimplifyProof.settlesEveryone(tricky, greedy) &amp;&amp; SimplifyProof.settlesEveryone(tricky, fewest),\n              &quot;and both plans clear everyone&quot;);\n        Random rnd = new Random(7);\n        boolean exactOk = true;\n        for (int t = 0; t &lt; 300; t++) {\n            Map&lt;String, Long&gt; net = new TreeMap&lt;&gt;();\n            long total = 0;\n            int people = 2 + rnd.nextInt(7);\n            for (int i = 0; i &lt; people - 1; i++) { long v = (rnd.nextInt(13) - 6) * 100L; net.put(&quot;p&quot; + i, v); total += v; }\n            net.put(&quot;p&quot; + (people - 1), -total);\n            List&lt;Transfer&gt; f = new FewestPayments().simplify(net);\n            if (!SimplifyProof.settlesEveryone(net, f) || f.size() &gt; new MinCashFlow().simplify(net).size()) exactOk = false;\n        }\n        check(exactOk, &quot;on 300 random groups the exact plan clears everyone and is never longer than greedy&quot;);\n\n        // 15. one user, many groups: the total is the sum over their groups, and joining moves no money\n        Directory dir = new Directory(new Splitwise());\n        Group trip2 = dir.create(&quot;trip&quot;, &quot;alice&quot;, &quot;bob&quot;);\n        Group home = dir.create(&quot;home&quot;, &quot;alice&quot;, &quot;bob&quot;, &quot;carol&quot;);\n        trip2.addExpense(&quot;t1&quot;, &quot;alice&quot;, Money.rupees(&quot;300.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;)), &quot;taxi&quot;);\n        home.addExpense(&quot;h1&quot;, &quot;bob&quot;, Money.rupees(&quot;90.00&quot;), SplitType.EQUAL, trio, &quot;milk&quot;);\n        dir.join(&quot;trip&quot;, &quot;carol&quot;);\n        check(dir.netEverywhere(&quot;bob&quot;) == -Money.rupees(&quot;90.00&quot;), &quot;bob everywhere: -150.00 on the trip, +60.00 at home = -90.00&quot;);\n        check(dir.owesEverywhere(&quot;bob&quot;, &quot;alice&quot;) == Money.rupees(&quot;120.00&quot;), &quot;bob owes alice 120.00 across both groups (150.00 - 30.00)&quot;);\n        check(trip2.members().contains(&quot;carol&quot;) &amp;&amp; trip2.netOf(&quot;carol&quot;) == 0, &quot;carol joined the trip, and joining moved no money&quot;);\n        check(AuditView.passbook(home, &quot;carol&quot;).size() == 1 &amp;&amp; AuditView.passbook(trip2, &quot;carol&quot;).isEmpty(),\n              &quot;carol&#x27;s passbook lists the milk at home and nothing from the trip&quot;);\n\n        System.out.println(failures == 0 ? &quot;ALL PASS&quot; : failures + &quot; FAILED&quot;);\n        if (failures != 0) System.exit(1);\n    }\n}\n</code></pre></div>", "code": ""}, {"id": 5, "stage": "Follow-ups and practice", "title": "Follow-ups and practice", "wide": true, "think": "", "body": "<div class=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Design Splitwise. People in a group log shared expenses &mdash; one person pays, the cost is split among some of them, equally or by exact amounts or by percentage &mdash; and the app tracks who owes whom and lets them settle up. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (money type and leftover paise first); then type in the order of Main.java: the three enums, the Money helpers, the records (User, Participant, Share, Transfer), the Clock, the SplitStrategy interface with its three rules and the CheckedSplit wrapper, the SimplifyStrategy with min cash flow, the observer, Expense, Ledger, then Group with its lock and the order at addExpense, then the thin Splitwise caller, then a main with fifty threads. If the clock runs out, the one thing that must exist is addExpense: the three split rules checked to the paise, then the net map and the pair map updated under the group's lock. Settle-up, edit, delete, leaving and simplify come after.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>1 &middot; Product wants a fourth way to split: by shares, 2:1:1, so a couple pays double a single.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The split rule is already an interface, so this is one new class and one line. It adds up the weights and gives each participant total &times; weight / units, rounded down. The last participant gets whatever paise are left over, so the shares still come out to the bill. Nothing else moves: the group, the ledger, the lock and the tests are untouched, and CheckedSplit polices the new rule exactly as it polices the old ones. The one seam that is not free is that SplitType is an enum, so a brand-new constant is the single extra edit; key the registry (the map from split type to rule) by String and even that disappears.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a fourth way to split -- by shares, 2:1:1. A NEW class and one registry line; nothing else moves.\n/**\n * Weights: a couple sharing a room pays two units, a single pays one. The last participant absorbs the rounding\n * so the shares still sum to the bill to the paise; CheckedSplit would catch it if they did not.\n */\nclass SharesSplit implements SplitStrategy {\n    public List&lt;Share&gt; split(long total, String payerId, List&lt;Participant&gt; parts) {\n        long units = 0;\n        for (Participant p : parts) {\n            if (p.rawValue() &lt;= 0) throw new IllegalArgumentException(&quot;a weight must be positive: &quot; + p.userId());\n            units += p.rawValue();\n        }\n        List&lt;Share&gt; out = new ArrayList&lt;&gt;(parts.size());\n        long allocated = 0;\n        for (int i = 0; i &lt; parts.size(); i++) {\n            long paise = (i == parts.size() - 1) ? total - allocated            // the last one absorbs the drift\n                                                 : total * parts.get(i).rawValue() / units;\n            allocated += paise;\n            out.add(new Share(parts.get(i).userId(), paise));\n        }\n        return out;\n    }\n}\n// the only change at the call site:\n//   group.configure(Map.of(EQUAL, new EqualSplit(), EXACT, new ExactSplit(),\n//                          PERCENT, new PercentSplit(), SHARES, new SharesSplit()), new MinCashFlow());\n// the one seam that is not free: SplitType is an enum, so a new type costs one constant. Key the\n// registry by String and even that disappears.\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Two people add an expense to the same group at the same instant. Prove you cannot lose one, with a test.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The race lives between reading a balance and writing it back. addExpense does that whole read-modify-write inside one lock held by the group (the id check, the membership check, every net and pair update), so no other writer can run in that gap. The proof is arithmetic rather than a count: fifty threads wait on one latch (a gate that opens for all of them at once), all fifty post an expense to the same five-person group, and the test adds up every balance. If a single update had been lost, the total would be non-zero, because a lost credit has no matching lost debit. The test also checks that the two maps agree for every member, and that every number equals the same fifty expenses posted by one thread.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 1. fifty people post an expense to ONE group at the same instant: no update may be lost,\n        //    and the sum of every balance must be exactly zero, because every paise owed is a paise owned.\n        Group flat = app.newGroup(&quot;flat&quot;, &quot;u0&quot;, &quot;u1&quot;, &quot;u2&quot;, &quot;u3&quot;, &quot;u4&quot;);\n        List&lt;Participant&gt; five = List.of(Participant.of(&quot;u0&quot;), Participant.of(&quot;u1&quot;), Participant.of(&quot;u2&quot;),\n                                         Participant.of(&quot;u3&quot;), Participant.of(&quot;u4&quot;));\n        ExecutorService pool = Executors.newFixedThreadPool(50);      // fifty threads, all parked on one latch\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;?&gt;&gt; posted = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++) {\n            final int n = i;\n            posted.add(pool.submit(() -&gt; { go.await(); return flat.addExpense(&quot;x&quot; + n, &quot;u&quot; + (n % 5), 100 + n, SplitType.EQUAL, five, &quot;r&quot; + n); }));\n        }\n        go.countDown();\n        int applied = 0;\n        for (Future&lt;?&gt; f : posted) { f.get(); applied++; }\n        pool.shutdown();\n        check(applied == 50, &quot;50 concurrent expenses all landed&quot;);\n        check(flat.history().size() == 50, &quot;the audit log has 50 rows, not 49&quot;);\n        check(sum(flat.balances().values()) == 0, &quot;sum of all balances is exactly zero after the race&quot;);\n        // the two maps must agree: what a user owes minus what is owed to them is the negative of their net\n        boolean agree = true;\n        Map&lt;String, Map&lt;String, Long&gt;&gt; owes = flat.owesTable();\n        for (String u : flat.members()) {\n            long out = sum(owes.getOrDefault(u, Map.of()).values()), in = 0;\n            for (Map.Entry&lt;String, Map&lt;String, Long&gt;&gt; row : owes.entrySet()) in += row.getValue().getOrDefault(u, 0L);\n            if (in - out != flat.netOf(u)) agree = false;\n        }\n        check(agree, &quot;the pairwise map and the net map agree for every member&quot;);\n        // and every number is exactly what one thread gets posting the same fifty expenses in order\n        Group replay = app.newGroup(&quot;replay&quot;, &quot;u0&quot;, &quot;u1&quot;, &quot;u2&quot;, &quot;u3&quot;, &quot;u4&quot;);\n        for (int i = 0; i &lt; 50; i++) replay.addExpense(&quot;x&quot; + i, &quot;u&quot; + (i % 5), 100 + i, SplitType.EQUAL, five, &quot;r&quot; + i);\n        check(flat.balances().equals(replay.balances()) &amp;&amp; flat.owesTable().equals(replay.owesTable()),\n              &quot;every balance equals the same fifty expenses posted by one thread&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; One lock per group. Does that scale, or have you serialised Splitwise?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>It scales, and the answer is arithmetic rather than opinion. The locked part is about a dozen map operations per person in the split, some forty for a four-person dinner: call it two microseconds. A busy trip group posts forty expenses a day; even an invented group posting a hundred a second holds the lock two hundred microseconds in every second, two hundredths of one per cent. And the lock is per group, so ten million groups never meet. If one group really did get hot, rung two of the ladder is the code below: no group lock at all, every pair its own key in a concurrent map, and a debt moved with one atomic merge, so unrelated pairs never wait. What you pay is the thing the lock was buying: an expense is no longer one step, so a reader can catch a five-way split half applied.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: one atomic merge per pair -- rung 2 of the ladder, for a group with thousands of members\n/**\n * The same arithmetic with no group lock at all: each PAIR is its own key in a concurrent map, and a debt moves\n * with one atomic merge. Two expenses that touch different pairs never wait for each other; two that touch the\n * same pair are ordered by the map, not by a lock you wrote. The key is the two ids in sorted order and the\n * value is signed, so &quot;a owes b&quot; and &quot;b owes a&quot; are still one number and still cannot drift.\n * What it costs: the whole expense is no longer one step, so a reader can see half of a five-way split. Take it\n * only when move 8&#x27;s arithmetic says the single lock is actually the bottleneck.\n */\nclass PairLedger {\n    private final ConcurrentHashMap&lt;String, Long&gt; pairs = new ConcurrentHashMap&lt;&gt;();\n    private static String key(String a, String b) { return a.compareTo(b) &lt; 0 ? a + &quot;|&quot; + b : b + &quot;|&quot; + a; }\n\n    /**\n     * Move `paise` of debt from `debtor` to `creditor`, safe from any number of threads with no lock of ours:\n     * merge() changes one key atomically, briefly locking only that key&#x27;s slot in the map (it is not lock-free).\n     */\n    void move(String debtor, String creditor, long paise) {\n        long signed = debtor.compareTo(creditor) &lt; 0 ? paise : -paise;      // sign says which way round the pair is\n        pairs.merge(key(debtor, creditor), signed, (x, y) -&gt; x + y == 0 ? null : x + y);   // null removes the key\n    }\n    /** How much `debtor` owes `creditor` right now, never negative. */\n    long owed(String debtor, String creditor) {\n        long v = pairs.getOrDefault(key(debtor, creditor), 0L);\n        long forward = debtor.compareTo(creditor) &lt; 0 ? v : -v;\n        return Math.max(forward, 0);\n    }\n    /** How many pairs are still live. A settled pair is removed, so a settled group costs nothing. */\n    int livePairs() { return pairs.size(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>4 &middot; The exact amounts they typed do not add up to the bill. What is the state of the system?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Exactly what it was, and the reason is the order, not a rollback. <code>record</code> splits and checks the shares before the lock is taken and before anything is written. So a bill of five hundred with shares adding up to four hundred throws out of the split rule and never reaches the ledger. Under the lock come the remaining checks (has this expense id been used, is every participant a member), and only after them the changes to the balances, which are map arithmetic that cannot fail half way. So there is no partial expense and nothing to undo: the client fixes the numbers and retries with the same id. The check itself lives in CheckedSplit, which wraps every rule the group is handed, so it also polices rules that do not exist yet; test 8 registers a deliberately broken one and proves nothing was written.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The one write path, used by addExpense and settleUp. The ORDER is the whole design: split and check with\n     * nothing locked and nothing written; take the lock; check the id and the membership; and only then apply\n     * the deltas, which is map arithmetic that cannot fail half way. Anything that throws, throws before the\n     * first write, so a rejected expense leaves every balance exactly as it was.\n     */\n    private Expense record(String expenseId, ExpenseKind kind, String payerId, long totalPaise,\n                           SplitType type, List&lt;Participant&gt; parts, String note) {\n        SplitStrategy rule = splits.get(type);\n        if (rule == null) throw new IllegalStateException(&quot;no rule configured for &quot; + type);\n        List&lt;Share&gt; shares = rule.split(totalPaise, payerId, parts);   // outside the lock: pure, and it may throw\n        Expense e;\n        lock.lock();\n        try {\n            Expense existing = live.get(expenseId);\n            if (existing != null) return existing;                      // idempotent: the same id is applied once\n            checkMembers(payerId, shares);                              // every check before any write\n            e = new Expense(expenseId, id, kind, payerId, totalPaise, shares, 1, clock.nowMs(), note);\n            ledger.apply(payerId, shares, +1);                          // from here nothing can throw\n            live.put(expenseId, e);\n            log.add(e);\n        } finally { lock.unlock(); }\n        publish(e);                                                     // after the lock: a slow phone stalls nobody\n        return e;\n    }\n\n/**\n * Wraps any split rule and enforces the contract: a positive amount, at least one participant, nobody twice,\n * no negative share, and the shares summing to the total to the paise. The group wraps every rule it is handed,\n * so a rule written next year cannot break the ledger. If this throws, nothing has been written anywhere.\n */\nclass CheckedSplit implements SplitStrategy {\n    private final SplitStrategy base;\n    CheckedSplit(SplitStrategy base) { this.base = base; }\n    public List&lt;Share&gt; split(long total, String payerId, List&lt;Participant&gt; parts) {\n        if (total &lt;= 0) throw new IllegalArgumentException(&quot;an amount must be positive: &quot; + total + &quot; paise&quot;);\n        if (parts.isEmpty()) throw new IllegalArgumentException(&quot;an expense needs at least one participant&quot;);\n        Set&lt;String&gt; seen = new HashSet&lt;&gt;();\n        for (Participant p : parts)\n            if (!seen.add(p.userId())) throw new IllegalArgumentException(&quot;participant listed twice: &quot; + p.userId());\n        List&lt;Share&gt; shares = base.split(total, payerId, parts);\n        long sum = 0;\n        for (Share s : shares) {\n            if (s.paise() &lt; 0) throw new IllegalStateException(&quot;negative share for &quot; + s.userId());\n            sum += s.paise();\n        }\n        if (sum != total)                                          // the one place the paise are checked, for every rule\n            throw new IllegalStateException(base.getClass().getSimpleName() + &quot; returned &quot; + Money.fmt(sum)\n                + &quot; for a bill of &quot; + Money.fmt(total));\n        return shares;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; Three people split a bill of one rupee. Where does the last paise go, and how do you know it is not lost?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A hundred paise over three is 33 each with one left over, so the shares are 34, 33 and 33. The extra paise goes to the payer, the person who fronted the money: a rule you can say out loud and repeat. The order is fixed (payer first, then everyone else in the order the client sent), so the same expense always splits the same way, which matters the moment you replay a log. Some statements fix the rule for you: workat.tech's gives the extra paise to the first person listed, which is one line in Remainder. The proof that nothing is lost is not the splitting code. It is the wrapper, which adds the shares up and refuses anything that is not exactly the bill, plus a failure test that checks the shares sum to 100 and the balances to zero. If the interviewer says \"that is unfair to the payer\", the fairness variant that rotates who absorbs the odd paise is a new class and nothing else.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The order the odd paise are handed out in: the payer first if he is a participant, then everyone else in the\n * order the client sent. Deterministic, so the same expense always splits the same way.\n */\nfinal class Remainder {\n    /** The participants, payer first. Used by EQUAL and PERCENT to decide who absorbs the leftover paise. */\n    static List&lt;Participant&gt; payerFirst(String payerId, List&lt;Participant&gt; parts) {\n        List&lt;Participant&gt; out = new ArrayList&lt;&gt;(parts.size());\n        for (Participant p : parts) if (p.userId().equals(payerId)) out.add(p);\n        for (Participant p : parts) if (!p.userId().equals(payerId)) out.add(p);\n        return out;\n    }\n    /** Give one extra paise to each of the first `extra` participants of `order`, and return shares in the ORIGINAL order. */\n    static List&lt;Share&gt; spread(List&lt;Participant&gt; parts, List&lt;Participant&gt; order, Map&lt;String, Long&gt; base, long extra) {\n        Map&lt;String, Long&gt; byUser = new HashMap&lt;&gt;(base);\n        for (int i = 0; i &lt; extra; i++) byUser.merge(order.get(i).userId(), 1L, Long::sum);\n        List&lt;Share&gt; out = new ArrayList&lt;&gt;(parts.size());\n        for (Participant p : parts) out.add(new Share(p.userId(), byUser.get(p.userId())));\n        return out;\n    }\n}\n\n/** Equal shares. 100 paise across 3 is 34/33/33, and the extra paise goes to the payer: nothing is lost. */\nclass EqualSplit implements SplitStrategy {\n    public List&lt;Share&gt; split(long total, String payerId, List&lt;Participant&gt; parts) {\n        int n = parts.size();\n        long base = total / n, extra = total - base * n;          // extra is 0..n-1, never a fraction\n        Map&lt;String, Long&gt; flat = new HashMap&lt;&gt;();\n        for (Participant p : parts) flat.put(p.userId(), base);\n        return Remainder.spread(parts, Remainder.payerFirst(payerId, parts), flat, extra);\n    }\n}\n\n// ---- ext: fairness -- rotate who absorbs the odd paise, instead of the same person always winning them\n/**\n * Same equal split, but the extra paise start from a different participant each time, chosen by a counter kept\n * inside the rule. Over many expenses everyone absorbs the same number of stray paise.\n */\nclass RotatingRemainderSplit implements SplitStrategy {\n    private final java.util.concurrent.atomic.AtomicLong seq = new java.util.concurrent.atomic.AtomicLong();\n    public List&lt;Share&gt; split(long total, String payerId, List&lt;Participant&gt; parts) {\n        int n = parts.size();\n        long base = total / n, extra = total - base * n;\n        int start = (int) Math.floorMod(seq.getAndIncrement(), n);              // rotate the starting point\n        Map&lt;String, Long&gt; byUser = new HashMap&lt;&gt;();\n        for (Participant p : parts) byUser.put(p.userId(), base);\n        for (int i = 0; i &lt; extra; i++) byUser.merge(parts.get((start + i) % n).userId(), 1L, Long::sum);\n        List&lt;Share&gt; out = new ArrayList&lt;&gt;(n);\n        for (Participant p : parts) out.add(new Share(p.userId(), byUser.get(p.userId())));\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>6 &middot; Why is money a long of paise? Talk me out of double, and out of BigDecimal.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A rupee amount in a double is not the number anybody typed. One rupee split three ways and added back a thousand times comes to 999.9999999999955, which test 10 prints; the same thousand splits in paise sum to exactly zero. It breaks valid input too: 47.72% + 38.54% + 13.74% adds up to 99.99999999999999 in double, so a check for 100 refuses it, while in basis points it is exactly 10000. So the system counts in the smallest unit, a <code>long</code> of paise, and there is no double anywhere in Main.java. BigDecimal is exact too, and it is the right answer in a general ledger. But every operation carries a scale and a rounding mode you then have to argue about, and it is an object per amount; with paise the arithmetic is plain integer addition. The boundary is two methods: <code>Money.rupees</code> parses \"1234.50\" through BigDecimal once, at the edge, and <code>Money.fmt</code> prints it back. A long holds about ninety-two thousand trillion rupees, so overflow is not a real worry; what would make me switch is maths that needs fractions of a paise, like interest or exchange rates.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Exact money, in paise. There is no double anywhere in this file; these two helpers are the only boundary. */\nfinal class Money {\n    /** Parse &quot;1234.50&quot; into 123450 paise, exactly. Used at the edge (a form, a file), never in the maths. */\n    static long rupees(String amount) { return new java.math.BigDecimal(amount).movePointRight(2).longValueExact(); }\n    /** Print 123450 paise as &quot;1234.50&quot;. Presentation only. */\n    static String fmt(long paise) {\n        String sign = paise &lt; 0 ? &quot;-&quot; : &quot;&quot;; long a = Math.abs(paise);\n        return sign + (a / 100) + &quot;.&quot; + String.format(&quot;%02d&quot;, a % 100);\n    }\n}\n\n        // 10. money is exact: a thousand indivisible bills. In paise nothing is lost. The same sum in double\n        //     drifts, which is the whole reason there is no double anywhere in Main.java.\n        Group chai = app.newGroup(&quot;chai&quot;, &quot;alice&quot;, &quot;bob&quot;, &quot;carol&quot;);\n        List&lt;Participant&gt; trio = List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;), Participant.of(&quot;carol&quot;));\n        for (int i = 0; i &lt; 1000; i++) chai.addExpense(&quot;c&quot; + i, &quot;alice&quot;, 100, SplitType.EQUAL, trio, &quot;chai&quot;);\n        check(sum(chai.balances().values()) == 0, &quot;1000 bills of 1.00 split three ways still sum to exactly zero&quot;);\n        check(chai.netOf(&quot;alice&quot;) == 66_000, &quot;alice is owed exactly 660.00: 66 paise a time, a thousand times&quot;);\n        double drift = 0;\n        for (int i = 0; i &lt; 1000; i++) drift += 1.00 / 3;              // the same split in rupees, as a double\n        check(drift * 3 != 1000.0, &quot;the same thousand splits in double do not add back to 1000.00: &quot; + (drift * 3));\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>7 &middot; Somebody edited last week&#x27;s expense. Then deleted another one. What happens to the balances?</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Both are reversals, and both are exact, because each expense stores the shares it was applied with instead of recomputing them. A delete applies those stored shares with the sign flipped and marks the row DELETED; the row stays in the log, and a second delete is refused rather than double-reversed. An edit is the same reversal followed at once by the new version, both inside one lock, so nobody can read a group where the old expense is gone and the new one has not arrived. The old row is marked EDITED and version n+1 is appended. As with adding, the new shares are computed before the lock, so an edit that does not add up changes nothing at all. One refusal to know: an expense that names someone who has left cannot be edited or deleted (follow-up 12). \"Who changed what?\" and a user's passbook (every expense they were part of) need no new storage: the audit view below filters the log the group already keeps.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Replace an expense with a new version: the old one&#x27;s stored shares are reversed, it is marked EDITED and\n     * kept, and version n+1 is applied. Both halves happen under ONE lock, so nobody can read a group in which\n     * the old expense is gone and the new one has not landed. The new shares are computed before the lock, so a\n     * bad edit changes nothing at all. The payer may change too; the reversal uses the OLD version&#x27;s payer. An\n     * expense that names someone who has left is refused: reversing it would hand them a balance nobody can settle.\n     */\n    Expense edit(String expenseId, String payerId, long totalPaise, SplitType type, List&lt;Participant&gt; parts, String note) {\n        SplitStrategy rule = splits.get(type);\n        if (rule == null) throw new IllegalStateException(&quot;no rule configured for &quot; + type);\n        List&lt;Share&gt; shares = rule.split(totalPaise, payerId, parts);    // outside the lock: pure, and it may throw\n        Expense next;\n        lock.lock();\n        try {\n            Expense old = current(expenseId);\n            checkMembers(old.payerId(), old.shares());                  // undoing it must not reopen a leaver&#x27;s balance\n            checkMembers(payerId, shares);                              // every check before any write\n            next = new Expense(expenseId, id, old.kind(), payerId, totalPaise, shares,\n                               old.version() + 1, clock.nowMs(), note);\n            ledger.apply(old.payerId(), old.shares(), -1);              // undo the old version, exactly\n            ledger.apply(payerId, shares, +1);                          // apply the new one\n            old.markStatus(ExpenseStatus.EDITED);\n            live.put(expenseId, next);\n            log.add(next);\n        } finally { lock.unlock(); }\n        publish(next);\n        return next;\n    }\n\n    /**\n     * Reverse an expense. Its stored shares are applied with the opposite sign, so the balances go back exactly\n     * to what they were, and the row stays in the log marked DELETED: an audit trail, not an erasure. Deleting\n     * twice is refused rather than double-reversed, and so is deleting an expense that names someone who has left.\n     */\n    Expense delete(String expenseId) {\n        Expense gone;\n        lock.lock();\n        try {\n            gone = current(expenseId);\n            checkMembers(gone.payerId(), gone.shares());                // undoing it must not reopen a leaver&#x27;s balance\n            ledger.apply(gone.payerId(), gone.shares(), -1);\n            gone.markStatus(ExpenseStatus.DELETED);\n        } finally { lock.unlock(); }\n        publish(gone);\n        return gone;\n    }\n\n// ---- ext: the audit view -- every version of one expense, and one user&#x27;s passbook\n/**\n * Reads the append-only log the group already keeps. Nothing new is stored: an edit left version 1 marked EDITED\n * beside version 2, and a delete left the row marked DELETED, which is the whole audit trail.\n */\nclass AuditView {\n    /** Every version of one expense, oldest first. */\n    static List&lt;Expense&gt; historyOf(Group g, String expenseId) {\n        List&lt;Expense&gt; out = new ArrayList&lt;&gt;();\n        for (Expense e : g.history()) if (e.id().equals(expenseId)) out.add(e);\n        return out;\n    }\n    /** A user&#x27;s passbook: every version of every expense they paid for or had a share in, oldest first. */\n    static List&lt;Expense&gt; passbook(Group g, String userId) {\n        List&lt;Expense&gt; out = new ArrayList&lt;&gt;();\n        for (Expense e : g.history())\n            if (e.payerId().equals(userId) || e.shares().stream().anyMatch(s -&gt; s.userId().equals(userId))) out.add(e);\n        return out;\n    }\n    /** One line per version: who paid, how much, what happened to it. */\n    static String print(Group g, String expenseId) {\n        StringBuilder sb = new StringBuilder();\n        for (Expense e : historyOf(g, expenseId))\n            sb.append(&quot;  v&quot;).append(e.version()).append(&quot; &quot;).append(e.status()).append(&quot; &quot;)\n              .append(e.payerId()).append(&quot; &quot;).append(Money.fmt(e.totalPaise())).append(&quot; &quot;).append(e.note()).append(&quot;\\n&quot;);\n        return sb.toString();\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; Bob pays Alice back. Part of it, all of it, more than he owes \u2014 and what if the payment never confirms?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>A settle-up is not a new model. It is an expense of a special kind: paid by the person handing over the money, with exactly one participant owing the whole amount, so it takes the same method, the same lock and the same reversal. That is what makes the edge cases free. Pay twenty of the fifty you owe and thirty is left; pay a hundred against thirty and the pair simply flips, so Alice now owes Bob seventy. The same settle-up id posted twice lands once, and a settle-up sent in error is deleted like any other expense. The one thing this version does not model is real money moving: a UPI transfer can come back yes, no, or with no answer at all. Then the settle-up becomes two steps. Record it as PENDING, and let only a confirmation apply it to the ledger: the gateway's answer, or the bank's next-morning file of payments that really happened (the reconciliation file). That is move 6's \"a new step in a life\": one more status, not a new class.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * A settle-up is an expense of a special kind: `from` hands `to` some money, so it is a bill paid by `from`\n     * with exactly one participant, `to`, owing the whole amount. The same code path, the same lock, the same\n     * reversal \u2014 which is why a wrong settle-up can be deleted like any other expense.\n     */\n    Expense settleUp(String expenseId, String from, String to, long paise) {\n        return record(expenseId, ExpenseKind.SETTLEMENT, from, paise, SplitType.EXACT,\n                      List.of(new Participant(to, paise)), &quot;settle up&quot;);\n    }\n\n        // 5. a settle-up brings the pair to zero\n        Group s = app.newGroup(&quot;settle&quot;, &quot;alice&quot;, &quot;bob&quot;);\n        s.addExpense(&quot;s0&quot;, &quot;alice&quot;, Money.rupees(&quot;400.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;)), &quot;cab&quot;);\n        long owed = s.owes(&quot;bob&quot;, &quot;alice&quot;);\n        check(owed == Money.rupees(&quot;200.00&quot;), &quot;bob owes alice 200.00&quot;);\n        s.settleUp(&quot;s1&quot;, &quot;bob&quot;, &quot;alice&quot;, owed);\n        check(s.owes(&quot;bob&quot;, &quot;alice&quot;) == 0 &amp;&amp; s.owes(&quot;alice&quot;, &quot;bob&quot;) == 0, &quot;after the settle-up the pair is at zero&quot;);\n        check(s.netOf(&quot;alice&quot;) == 0 &amp;&amp; s.netOf(&quot;bob&quot;) == 0, &quot;and both nets are zero&quot;);\n        s.addExpense(&quot;s2&quot;, &quot;alice&quot;, Money.rupees(&quot;100.00&quot;), SplitType.EQUAL,\n            List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;bob&quot;)), &quot;coffee&quot;);\n        s.settleUp(&quot;s3&quot;, &quot;bob&quot;, &quot;alice&quot;, Money.rupees(&quot;20.00&quot;));     // a PARTIAL payment\n        check(s.owes(&quot;bob&quot;, &quot;alice&quot;) == Money.rupees(&quot;30.00&quot;), &quot;a partial settle-up leaves the rest owed: 30.00&quot;);\n        s.settleUp(&quot;s4&quot;, &quot;bob&quot;, &quot;alice&quot;, Money.rupees(&quot;100.00&quot;));    // MORE than he owes: no special case\n        check(s.owes(&quot;alice&quot;, &quot;bob&quot;) == Money.rupees(&quot;70.00&quot;), &quot;overpaying just flips the pair: alice owes bob 70.00&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>9 &middot; Show me the fewest payments that would clear the whole group.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Take a snapshot of the nets (a copy made under the lock at one instant) and run greedy min cash flow over two heaps (priority queues that hand back the biggest amount first). The biggest debtor pays the biggest creditor as much as clears one of them, again and again. Each payment zeroes at least one person, so there are at most n-1 payments for n people with a balance, and the ids break ties so the same group always gets the same plan. It is a suggestion and touches nothing: test 6 checks that every net is identical afterwards and that paying the plan leaves everybody at zero. Say the caveat before the interviewer does: greedy is short, but not always the shortest. When a owes 400 and b owes 300, and c, d and e are owed 200, 200 and 300, greedy makes four payments where three would do; the next card finds the true minimum. With Splitwise's \"simplify debts\" switched on, the group shows the view below instead of its pairwise map, recomputed after every expense: same nets, far fewer pairs, and the expense log untouched.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Min cash flow, greedily: repeatedly make the biggest debtor pay the biggest creditor as much as clears one of\n * them. At most n-1 transfers for n people, because each round removes at least one person from the board.\n * Short, but not always the shortest: two people owing 400 and 300 to three owed 200, 200 and 300 get four\n * payments from greedy, where three would do.\n */\nclass MinCashFlow implements SimplifyStrategy {\n    public List&lt;Transfer&gt; simplify(Map&lt;String, Long&gt; net) {\n        // biggest creditor first, biggest debtor first; the id breaks ties so the output is always the same\n        PriorityQueue&lt;Share&gt; credits = new PriorityQueue&lt;&gt;((a, b) -&gt;\n            a.paise() != b.paise() ? Long.compare(b.paise(), a.paise()) : a.userId().compareTo(b.userId()));\n        PriorityQueue&lt;Share&gt; debts = new PriorityQueue&lt;&gt;((a, b) -&gt;\n            a.paise() != b.paise() ? Long.compare(b.paise(), a.paise()) : a.userId().compareTo(b.userId()));\n        for (Map.Entry&lt;String, Long&gt; e : net.entrySet()) {\n            if (e.getValue() &gt; 0) credits.add(new Share(e.getKey(), e.getValue

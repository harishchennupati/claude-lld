()));\n            else if (e.getValue() &lt; 0) debts.add(new Share(e.getKey(), -e.getValue()));\n        }\n        List&lt;Transfer&gt; out = new ArrayList&lt;&gt;();\n        while (!credits.isEmpty() &amp;&amp; !debts.isEmpty()) {\n            Share c = credits.poll(), d = debts.poll();\n            long amount = Math.min(c.paise(), d.paise());          // clears at least one of the two\n            out.add(new Transfer(d.userId(), c.userId(), amount));\n            if (c.paise() &gt; amount) credits.add(new Share(c.userId(), c.paise() - amount));\n            if (d.paise() &gt; amount) debts.add(new Share(d.userId(), d.paise() - amount));\n        }\n        return out;\n    }\n}\n\n// ---- ext: the simplification is a suggestion -- prove the plan is valid, and say why greedy is a heuristic\n/** Checks a plan the way a reviewer would: does paying it clear everyone, and is it not more than n-1 payments. */\nclass SimplifyProof {\n    /** True when applying every transfer leaves every single person at zero. */\n    static boolean settlesEveryone(Map&lt;String, Long&gt; net, List&lt;Transfer&gt; plan) {\n        Map&lt;String, Long&gt; after = new TreeMap&lt;&gt;(net);\n        for (Transfer t : plan) { after.merge(t.from(), t.paise(), Long::sum); after.merge(t.to(), -t.paise(), Long::sum); }\n        return after.values().stream().allMatch(v -&gt; v == 0);\n    }\n    /** Greedy never needs more than n-1 payments, because each one zeroes at least one person. */\n    static boolean withinBound(Map&lt;String, Long&gt; net, List&lt;Transfer&gt; plan) {\n        long people = net.values().stream().filter(v -&gt; v != 0).count();\n        return plan.size() &lt;= Math.max(people - 1, 0);\n    }\n    // and the honest caveat: greedy is not always the MINIMUM. a owes 400 and b owes 300; c, d and e are owed\n    // 200, 200 and 300. Greedy pays a-&gt;e 300, b-&gt;c 200, a-&gt;d 100, b-&gt;d 100: four payments. Three would do\n    // (a-&gt;c 200, a-&gt;d 200, b-&gt;e 300), because {a, c, d} and {b, e} each sum to zero and settle on their own.\n    // Finding such groups is a search over subsets (NP-hard in general), so the product ships the greedy plan\n    // and calls it &quot;simplified&quot;, not &quot;minimal&quot;.\n}\n\n// ---- ext: auto-simplify -- what a group shows as &quot;who owes whom&quot; with the toggle on; the log is untouched\n/**\n * The Splitwise toggle, as a view. It changes nothing: it builds a fresh ledger from the suggested transfers,\n * with the same net for every person but far fewer live pairs, and a group with the toggle on shows that one\n * instead of its pairwise map. The expense log and the real ledger are untouched, so switching it off loses nothing.\n */\nclass AutoSimplify {\n    /** A new ledger holding only the simplified transfers. Same nets, fewer pairs. */\n    static Ledger collapse(Map&lt;String, Long&gt; net, SimplifyStrategy strategy) {\n        Ledger collapsed = new Ledger();\n        for (Transfer t : strategy.simplify(net))                         // &quot;to paid t.paise on behalf of from&quot;\n            collapsed.apply(t.to(), List.of(new Share(t.from(), t.paise())), +1);\n        return collapsed;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; The interviewer says your greedy plan is not the minimum. Find the true fewest payments.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>They are right, and some interviewers mark greedy down for exactly this; it is LeetCode 465, Optimal Account Balancing. People whose balances sum to zero can settle among themselves in one payment fewer than their number. So the fewest payments equal the people with a balance minus the most zero-sum groups they can be split into: in the four-versus-three example, {a, c, d} and {b, e} give 5 - 2 = 3. FewestPayments finds that most-groups count for every subset of people, written as a bitmask (one bit per person) and built up from smaller subsets; then it walks back to cut the groups out and runs greedy inside each. It is O(n &times; 2^n): instant for fifteen people with a balance, too slow past about twenty, so greedy stays the default and this one is handed in through configure() for small groups. Test 14 checks the example and 300 random groups.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the true minimum -- when the interviewer says greedy is not the fewest payments (LeetCode 465)\n/**\n * The fewest payments, exactly. People whose balances sum to zero can settle among themselves in one payment fewer\n * than their number, so: fewest payments = people with a balance - the most zero-sum groups they split into.\n * best[m] is that most-groups count for the set of people m (a bitmask: one bit per person), built from smaller sets;\n * a walk back cuts out the groups, and greedy settles inside each. O(n * 2^n) for n people with a balance: instant\n * at 15, too slow past about 20, which is why greedy stays the default.\n */\nclass FewestPayments implements SimplifyStrategy {\n    public List&lt;Transfer&gt; simplify(Map&lt;String, Long&gt; net) {\n        List&lt;String&gt; ids = new ArrayList&lt;&gt;();\n        for (Map.Entry&lt;String, Long&gt; e : new TreeMap&lt;&gt;(net).entrySet()) if (e.getValue() != 0) ids.add(e.getKey());\n        int n = ids.size();\n        if (n &gt; 20) return new MinCashFlow().simplify(net);                   // 2^20 sets is the practical ceiling\n        long[] sum = new long[1 &lt;&lt; n];\n        int[] best = new int[1 &lt;&lt; n];\n        for (int m = 1; m &lt; 1 &lt;&lt; n; m++) {\n            sum[m] = sum[m &amp; (m - 1)] + net.get(ids.get(Integer.numberOfTrailingZeros(m)));   // m minus its lowest bit\n            for (int i = 0; i &lt; n; i++) if ((m &gt;&gt; i &amp; 1) == 1) best[m] = Math.max(best[m], best[m ^ (1 &lt;&lt; i)]);\n            if (sum[m] == 0) best[m]++;                                         // m closes one more zero-sum group\n        }\n        List&lt;Transfer&gt; plan = new ArrayList&lt;&gt;();\n        int m = (1 &lt;&lt; n) - 1, top = m;                                          // walk back from everyone\n        while (m != 0) {\n            int want = best[m] - (sum[m] == 0 ? 1 : 0), i = 0;\n            while ((m &gt;&gt; i &amp; 1) == 0 || best[m ^ (1 &lt;&lt; i)] != want) i++;        // drop a person without losing a group\n            m ^= 1 &lt;&lt; i;\n            if (sum[m] == 0) { plan.addAll(settle(ids, net, top ^ m)); top = m; }   // top minus m is one zero-sum group\n        }\n        return plan;\n    }\n    /** Greedy inside one zero-sum group: k people, at most k - 1 payments. */\n    private static List&lt;Transfer&gt; settle(List&lt;String&gt; ids, Map&lt;String, Long&gt; net, int group) {\n        Map&lt;String, Long&gt; part = new TreeMap&lt;&gt;();\n        for (int i = 0; i &lt; ids.size(); i++) if ((group &gt;&gt; i &amp; 1) == 1) part.put(ids.get(i), net.get(ids.get(i)));\n        return new MinCashFlow().simplify(part);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>11 &middot; The app asks &quot;what do I owe Bob?&quot; a thousand times a second. Make it O(1).</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No new structure. The ledger already keeps a net per person and a pairwise map, updated as each expense lands, so both questions are one hash lookup; nothing ever re-reads the expense log to compute a balance. The two maps are written by one method from one signed number, which is why A-owes-B and B-owes-A cannot disagree, and a pair that reaches zero is deleted. The size to watch is not the expenses but the live pairs. A hundred people who never settle can reach a few thousand entries: trivial for memory, but the real reason the simplify toggle exists. \"Who owes the most?\" is one pass over the nets, which is fine at any real group size. The reads take the group's lock so a number is never read half-written, which costs tens of nanoseconds; if that ever mattered, you would keep the nets in a concurrent map and drop the lock on reads.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * The two maps that ARE the balances: a net per person, and who owes whom. Deliberately dumb: it does arithmetic\n * on maps and nothing else. Every method here is called by the group, inside the group&#x27;s lock, so it has no lock\n * of its own. Every paise added to one person is taken from another in the same call (double entry), which is\n * why the nets always sum to zero; move() is why each pair holds at most one direction of `owes`.\n */\nclass Ledger {\n    private final Map&lt;String, Long&gt; net = new HashMap&lt;&gt;();               // user -&gt; paise; + is owed money, - owes money\n    private final Map&lt;String, Map&lt;String, Long&gt;&gt; owes = new HashMap&lt;&gt;(); // debtor -&gt; creditor -&gt; paise, always &gt; 0\n\n    /**\n     * Apply one expense&#x27;s shares. sign is +1 to record it and -1 to reverse it, which is the whole of delete and\n     * half of edit. Pure map arithmetic: it cannot fail, which is why the group validates everything before calling it.\n     */\n    void apply(String payerId, List&lt;Share&gt; shares, int sign) {\n        for (Share s : shares) {\n            if (s.userId().equals(payerId)) continue;                    // the payer&#x27;s own share is his own money\n            long amount = sign * s.paise();\n            bumpNet(payerId, amount);\n            bumpNet(s.userId(), -amount);\n            move(s.userId(), payerId, amount);                           // the participant owes the payer that much more\n        }\n    }\n    /** X&#x27;s net position: positive means the group owes X. O(1). */\n    long netOf(String userId) { return net.getOrDefault(userId, 0L); }\n    /** How much `debtor` owes `creditor` right now, never negative. O(1). */\n    long owed(String debtor, String creditor) { return owes.getOrDefault(debtor, Map.of()).getOrDefault(creditor, 0L); }\n    /**\n     * Someone whose net is zero is leaving, so pass their debts through them: whoever owed them now owes whoever\n     * they owed (bob owed carol 150.00 and carol owed alice 150.00, so now bob owes alice 150.00). No net moves,\n     * and afterwards no pair names them. Only leaving calls it, so the scan of the debtors is fine.\n     */\n    void passThrough(String mid) {\n        List&lt;String&gt; debtors = new ArrayList&lt;&gt;();                                      // everyone who owes mid\n        owes.forEach((d, row) -&gt; { if (row.containsKey(mid)) debtors.add(d); });\n        for (String d : debtors)\n            for (String c : new ArrayList&lt;&gt;(owes.getOrDefault(mid, Map.of()).keySet())) { // everyone mid owes\n                long x = Math.min(owed(d, mid), owed(mid, c));\n                if (x == 0) continue;\n                move(d, mid, -x); move(mid, c, -x); move(d, c, x);                     // d now pays c directly\n            }\n    }\n    /** A copy of every non-zero net, ordered by id so the simplifier&#x27;s output is repeatable. */\n    Map&lt;String, Long&gt; netSnapshot() { return new TreeMap&lt;&gt;(net); }\n    /** A copy of the who-owes-whom map, for a statement screen. */\n    Map&lt;String, Map&lt;String, Long&gt;&gt; owesSnapshot() {\n        Map&lt;String, Map&lt;String, Long&gt;&gt; copy = new TreeMap&lt;&gt;();\n        owes.forEach((d, row) -&gt; copy.put(d, new TreeMap&lt;&gt;(row)));\n        return copy;\n    }\n    private void bumpNet(String userId, long delta) {\n        long now = net.getOrDefault(userId, 0L) + delta;\n        if (now == 0) net.remove(userId); else net.put(userId, now);     // a settled person costs no memory\n    }\n    /**\n     * Move `delta` paise of debt from debtor to creditor, keeping ONE direction per pair: the two entries are\n     * written from one signed number, so A-owes-B and B-owes-A can never drift apart.\n     */\n    private void move(String debtor, String creditor, long delta) {\n        long signed = owed(debtor, creditor) - owed(creditor, debtor) + delta;\n        put(debtor, creditor, Math.max(signed, 0));\n        put(creditor, debtor, Math.max(-signed, 0));\n    }\n    private void put(String debtor, String creditor, long amount) {\n        if (amount == 0) {\n            Map&lt;String, Long&gt; row = owes.get(debtor);\n            if (row != null) { row.remove(creditor); if (row.isEmpty()) owes.remove(debtor); }\n        } else owes.computeIfAbsent(debtor, k -&gt; new HashMap&lt;&gt;()).put(creditor, amount);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>12 &middot; Carol wants to leave the group. She still owes a hundred.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>She cannot yet: <code>removeMember</code> throws unless her net is exactly zero, because a debt to someone who is gone could never be settled. A zero net can still hide a loop: bob owes her 150 and she owes alice 150. So on the way out her debts pass through her: bob now owes alice 150, nobody's net moves, and no pair names carol afterwards. The check, the pass-through and the removal happen inside the <i>same</i> lock, so nobody can post an expense into the gap; that is move 12's fourth twist. Leaving is not erasing: her rows stay in the log. A new expense naming her is refused, and so is editing or deleting an old one, because reversing it would reopen her balance. Test 11 checks all of it.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * Let somebody leave the group. Refused while their net is not zero, because a debt to someone who is gone can\n     * never be settled. A zero net can still hide a loop (bob owes carol 150.00, carol owes alice 150.00), so their\n     * debts are passed through them on the way out: bob now owes alice, and no pair names carol. The check, the\n     * pass-through and the removal happen inside the SAME lock, so nobody can slip an expense into the gap. Their\n     * rows stay in the log: leaving is not erasing.\n     */\n    void removeMember(String userId) {\n        lock.lock();\n        try {\n            if (!members.contains(userId)) throw new IllegalArgumentException(userId + &quot; is not in &quot; + id);\n            long net = ledger.netOf(userId);\n            if (net != 0)\n                throw new IllegalStateException(userId + &quot; cannot leave &quot; + id + &quot;: net is &quot; + Money.fmt(net));\n            ledger.passThrough(userId);                                 // their loop closes without them; no net moves\n            members.remove(userId);\n        } finally { lock.unlock(); }\n    }\n\n/**\n     * Someone whose net is zero is leaving, so pass their debts through them: whoever owed them now owes whoever\n     * they owed (bob owed carol 150.00 and carol owed alice 150.00, so now bob owes alice 150.00). No net moves,\n     * and afterwards no pair names them. Only leaving calls it, so the scan of the debtors is fine.\n     */\n    void passThrough(String mid) {\n        List&lt;String&gt; debtors = new ArrayList&lt;&gt;();                                      // everyone who owes mid\n        owes.forEach((d, row) -&gt; { if (row.containsKey(mid)) debtors.add(d); });\n        for (String d : debtors)\n            for (String c : new ArrayList&lt;&gt;(owes.getOrDefault(mid, Map.of()).keySet())) { // everyone mid owes\n                long x = Math.min(owed(d, mid), owed(mid, c));\n                if (x == 0) continue;\n                move(d, mid, -x); move(mid, c, -x); move(d, c, x);                     // d now pays c directly\n            }\n    }\n\n        // 11. nobody walks away from a debt: leaving is refused until that person&#x27;s net is zero\n        Group leave = app.newGroup(&quot;leave&quot;, &quot;alice&quot;, &quot;bob&quot;, &quot;carol&quot;);\n        leave.addExpense(&quot;l1&quot;, &quot;alice&quot;, Money.rupees(&quot;300.00&quot;), SplitType.EQUAL, trio, &quot;taxi&quot;);\n        try { leave.removeMember(&quot;carol&quot;); check(false, &quot;a member owing 100.00 must not be able to leave&quot;); }\n        catch (IllegalStateException e) { check(true, &quot;leaving is refused while a balance is open: &quot; + e.getMessage()); }\n        leave.settleUp(&quot;l2&quot;, &quot;carol&quot;, &quot;alice&quot;, Money.rupees(&quot;100.00&quot;));\n        leave.removeMember(&quot;carol&quot;);\n        check(!leave.members().contains(&quot;carol&quot;), &quot;once her net is zero, carol can leave&quot;);\n        check(leave.history().size() == 2, &quot;and her rows stay in the log: leaving is not erasing&quot;);\n        try {\n            leave.addExpense(&quot;l3&quot;, &quot;alice&quot;, Money.rupees(&quot;50.00&quot;), SplitType.EQUAL,\n                List.of(Participant.of(&quot;alice&quot;), Participant.of(&quot;carol&quot;)), &quot;after she left&quot;);\n            check(false, &quot;an ex-member must not appear in a new expense&quot;);\n        } catch (IllegalArgumentException e) { check(true, &quot;an ex-member cannot be put in a new expense&quot;); }\n        // a zero net can hide a loop: bob owes carol 150.00 and carol owes alice 150.00. Her debts must pass through\n        // her as she leaves, or two debts would name somebody who is gone and could never be settled.\n        Group loop = app.newGroup(&quot;loop&quot;, &quot;alice&quot;, &quot;bob&quot;, &quot;carol&quot;);\n        loop.addExpense(&quot;o1&quot;, &quot;carol&quot;, Money.rupees(&quot;150.00&quot;), SplitType.EXACT,\n            List.of(new Participant(&quot;bob&quot;, Money.rupees(&quot;150.00&quot;))), &quot;bob&#x27;s ticket&quot;);\n        loop.addExpense(&quot;o2&quot;, &quot;alice&quot;, Money.rupees(&quot;150.00&quot;), SplitType.EXACT,\n            List.of(new Participant(&quot;carol&quot;, Money.rupees(&quot;150.00&quot;))), &quot;carol&#x27;s ticket&quot;);\n        Map&lt;String, Long&gt; netsBefore = loop.balances();\n        Set&lt;String&gt; seen = loop.members();\n        loop.removeMember(&quot;carol&quot;);\n        check(loop.owes(&quot;bob&quot;, &quot;carol&quot;) == 0 &amp;&amp; loop.owes(&quot;carol&quot;, &quot;alice&quot;) == 0, &quot;after carol leaves, no pair names her&quot;);\n        check(loop.owes(&quot;bob&quot;, &quot;alice&quot;) == Money.rupees(&quot;150.00&quot;) &amp;&amp; loop.balances().equals(netsBefore),\n              &quot;bob now owes alice 150.00, and nobody&#x27;s net moved&quot;);\n        check(seen.contains(&quot;carol&quot;), &quot;members() handed out a copy: the list taken earlier still has carol&quot;);\n        Map&lt;String, Long&gt; netsAfter = loop.balances();\n        try { loop.delete(&quot;o1&quot;); check(false, &quot;deleting an expense that names someone who left must be refused&quot;); }\n        catch (IllegalArgumentException e) { check(true, &quot;an expense naming someone who left cannot be deleted&quot;); }\n        try {\n            loop.edit(&quot;o2&quot;, &quot;alice&quot;, Money.rupees(&quot;150.00&quot;), SplitType.EXACT,\n                List.of(new Participant(&quot;bob&quot;, Money.rupees(&quot;150.00&quot;))), &quot;moved to bob&quot;);\n            check(false, &quot;editing an expense that names someone who left must be refused&quot;);\n        } catch (IllegalArgumentException e) { check(true, &quot;nor edited: reversing it would reopen her balance&quot;); }\n        check(loop.balances().equals(netsAfter) &amp;&amp; loop.netOf(&quot;carol&quot;) == 0, &quot;and the refused changes moved nothing&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>13 &middot; Bob is in five groups. Show what he owes and is owed across all of them, and let a friend join a group.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing about the money changes: each group keeps its own ledger and lock, and Bob's overall balance is the sum of his nets in the groups he is in. The directory below keeps an index from user to group ids, updated on every create, join and leave that goes through it, so the sum reads only Bob's five groups, not all ten million. \"What does Bob owe Alice everywhere?\" is the same sum over the groups they share, netted to one number. Joining is <code>addMember</code>: one line under the group's lock, and it moves no money. Each group is read under its own lock, so every number is exact but the total is not one frozen instant, which is fine for a screen. Test 15 checks the sums and the join.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Let somebody join. The members only change under the lock; joining never moves money. */\n    void addMember(String userId) { lock.lock(); try { members.add(userId); } finally { lock.unlock(); } }\n\n// ---- ext: many groups -- join a group, and one user&#x27;s balance across every group they are in\n/**\n * A user is in many groups. The directory keeps user -&gt; group ids, updated on every create, join and leave that goes\n * through it, so &quot;Bob, everywhere&quot; reads only Bob&#x27;s groups. Each group is read under its own lock: every number is\n * exact, but the total is not one frozen instant across groups, which is fine for a screen.\n */\nclass Directory {\n    private final Splitwise app;\n    private final Map&lt;String, Set&lt;String&gt;&gt; groupsOf = new ConcurrentHashMap&lt;&gt;();   // user -&gt; ids of their groups\n    /** Every create, join and leave goes through here, so the index never misses one. */\n    Directory(Splitwise app) { this.app = app; }\n    /** Create a group through the app, and index every member. */\n    Group create(String groupId, String... members) {\n        Group g = app.newGroup(groupId, members);\n        for (String u : members) index(u).add(groupId);\n        return g;\n    }\n    /** Join: the group adds the member under its own lock, then the index learns it. */\n    void join(String groupId, String userId) { app.group(groupId).addMember(userId); index(userId).add(groupId); }\n    /** Leave: the group refuses while the net there is not zero; the index forgets only after the group agreed. */\n    void leave(String groupId, String userId) { app.group(groupId).removeMember(userId); index(userId).remove(groupId); }\n    /** What the whole app owes this user: their net summed over every group they are in. */\n    long netEverywhere(String userId) {\n        long total = 0;\n        for (String gid : index(userId)) total += app.group(gid).netOf(userId);\n        return total;\n    }\n    /** How much `debtor` owes `creditor` over every group they share, after netting; never negative. */\n    long owesEverywhere(String debtor, String creditor) {\n        long signed = 0;\n        for (String gid : index(debtor)) {\n            Group g = app.group(gid);\n            signed += g.owes(debtor, creditor) - g.owes(creditor, debtor);\n        }\n        return Math.max(signed, 0);\n    }\n    /** This user&#x27;s group ids, a thread-safe set made on first use. */\n    private Set&lt;String&gt; index(String userId) { return groupsOf.computeIfAbsent(userId, k -&gt; ConcurrentHashMap.newKeySet()); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>14 &middot; The group is in Goa but two people paid in euros.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Money grows a currency, and the ledger becomes one ledger per currency, so a euro debt is never silently added to a rupee debt. Each expense is split inside a single currency, which keeps the shares exact. Conversion happens at exactly one moment: when somebody settles, or when a screen asks for one number. It goes through an injected rate provider, so yesterday's balances are never re-priced when the rate moves. The group, the lock and the split rules do not change: this is move 5 (a new key on the collection) plus an injected rule.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: multi-currency -- money grows a currency, one ledger per currency, FX only at settle time\n/** An amount with a currency. The minor unit is still an integer: 12345 INR is 123.45 rupees. */\nrecord Amount(String currency, long minor) {}\n\n/** Today&#x27;s rate, handed in. Injected so a settlement can be priced at a rate a test controls. */\ninterface FxRates { long convert(long minor, String from, String to); }\n\n/**\n * One ledger per currency, so a euro debt is never silently added to a rupee debt. Balances are never re-priced\n * when the rate moves: the conversion happens once, at the moment somebody actually settles. Like Ledger it has\n * no lock of its own: the group calls it inside the group&#x27;s lock.\n */\nclass MultiCurrencyLedger {\n    private final Map&lt;String, Ledger&gt; byCurrency = new HashMap&lt;&gt;();\n    /** Apply an expense in its own currency. */\n    void apply(String currency, String payerId, List&lt;Share&gt; shares, int sign) {\n        byCurrency.computeIfAbsent(currency, c -&gt; new Ledger()).apply(payerId, shares, sign);\n    }\n    /** What this person&#x27;s net is in one currency. */\n    long netOf(String currency, String userId) {\n        Ledger l = byCurrency.get(currency);\n        return l == null ? 0 : l.netOf(userId);\n    }\n    /** A single figure for a screen: every currency converted into one, at today&#x27;s rate, for display only. */\n    long netIn(String display, String userId, FxRates fx) {\n        long total = 0;\n        for (Map.Entry&lt;String, Ledger&gt; e : byCurrency.entrySet())\n            total += fx.convert(e.getValue().netOf(userId), e.getKey(), display);\n        return total;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>15 &middot; Rent every month, automatically. And an expense between two friends who are not in any group.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Neither needs a new model. A pair is a group of two whose id is built from the two user ids in sorted order, so alice-bob and bob-alice are the same group, with the same lock and the same ledger. It is created on first use in one atomic step (<code>computeIfAbsent</code>). A look-up followed by a create would let both friends make a group at the same moment, and one expense would vanish with the losing group (test 13). Recurring is a schedule that posts real expenses, and the interesting part is the id. It contains the period number, so running the job twice posts each month exactly once, because addExpense is idempotent by id.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Create a group with its members, wired with the standard rules. An id already in use is refused, not replaced. */\n    Group newGroup(String groupId, String... memberIds) {\n        Group g = wired(groupId, memberIds);\n        if (groups.putIfAbsent(groupId, g) != null)                    // put() would silently drop the old group\n            throw new IllegalArgumentException(&quot;group already exists: &quot; + groupId);\n        return g;\n    }\n    /** The group with this id, made on first use. computeIfAbsent is one atomic step: two callers get one group. */\n    Group groupOrCreate(String groupId, String... memberIds) {\n        return groups.computeIfAbsent(groupId, gid -&gt; wired(gid, memberIds));\n    }\n\n// ---- ext: an expense between two friends with no group -- the pair IS a group of two\n/**\n * Splitwise has no separate &quot;friend expense&quot; model and neither do we: a pair is a group of two with an id built\n * from the two user ids in sorted order, so alice-bob and bob-alice are the same group, created once.\n */\nclass Friends {\n    /**\n     * The two-person group for this pair, created on first use. Same lock, same ledger, same code path. &quot;Look it up,\n     * and create it if missing&quot; as two steps would let both friends create one at the same moment and lose an\n     * expense; groupOrCreate is one atomic step (computeIfAbsent).\n     */\n    static Group between(Splitwise app, String a, String b) {\n        String id = a.compareTo(b) &lt; 0 ? &quot;pair:&quot; + a + &quot;:&quot; + b : &quot;pair:&quot; + b + &quot;:&quot; + a;\n        return app.groupOrCreate(id, a, b);\n    }\n}\n\n// ---- ext: recurring expenses -- a schedule, and a deterministic id so a replay cannot double-charge\n/**\n * The rent, every month. due() returns the expense ids that should exist by now; the id contains the period, so\n * running the job twice, or running it on two servers, posts each month exactly once (addExpense is idempotent).\n */\nclass Recurring {\n    private final String template, payerId; private final long amountPaise, everyMs, startMs;\n    private final List&lt;Participant&gt; parts;\n    Recurring(String template, String payerId, long amountPaise, List&lt;Participant&gt; parts, long startMs, long everyMs) {\n        if (everyMs &lt;= 0) throw new IllegalArgumentException(&quot;the period must be positive, or post() never ends&quot;);\n        this.template = template; this.payerId = payerId; this.amountPaise = amountPaise;\n        this.parts = List.copyOf(parts); this.startMs = startMs; this.everyMs = everyMs;\n    }\n    /** Post every period that has arrived by nowMs. Safe to call as often as you like. */\n    List&lt;Expense&gt; post(Group g, long nowMs) {\n        List&lt;Expense&gt; out = new ArrayList&lt;&gt;();\n        for (long period = 0; startMs + period * everyMs &lt;= nowMs; period++)\n            out.add(g.addExpense(template + &quot;#&quot; + period, payerId, amountPaise, SplitType.EQUAL, parts,\n                                 template + &quot; period &quot; + period));      // the id carries the period: replay-safe\n        return out;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>16 &middot; Persist it: which tables? And now there are two servers.</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The ledger's two maps become rows behind a repository interface. The group is handed one instead of building its own Ledger, and its order (split, check, apply, publish) stays the same. The tables are the maps and the log: balance and pair rows for the two maps, expense and share rows for every version, plus grp and member. Each expense becomes one transaction that first locks the group's row (<code>SELECT ... FOR UPDATE</code>): the ReentrantLock moved into the database, so two servers take turns per group and the membership check and \"may carol leave?\" stay safe. The expense insert carries <code>ON CONFLICT DO NOTHING</code>, so a retry, or a message delivered twice, applies once. Each share is an upsert (insert the row, or add to it if it is already there) with <code>paise = paise + ?</code>; a bare UPDATE would silently skip a brand-new member. That is move 12's fifth twist, and it is why the expense id is a parameter and not generated inside.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: persistence -- the two maps behind a repository, and the idempotent write in SQL\n/**\n * The seam: the ledger&#x27;s work as calls a database can answer. The group would be handed one of these instead of\n * building its own Ledger, and its order (split, check, apply, publish) stays the same. Shown for the nets; the\n * who-owes-whom map is the same shape with a (debtor, creditor) key.\n */\ninterface LedgerRepository {\n    /** Add delta to one person&#x27;s net, atomically. */\n    void addToNet(String groupId, String userId, long deltaPaise);\n    /** Record that this expense id has been applied; false means it already had been. */\n    boolean claim(String groupId, String expenseId);\n    /** One person&#x27;s net in one group. */\n    long netOf(String groupId, String userId);\n}\n/** The in-memory implementation, which is what the group uses today wearing a different coat. */\nclass InMemoryLedgerRepository implements LedgerRepository {\n    private final Map&lt;String, Long&gt; net = new ConcurrentHashMap&lt;&gt;();\n    private final Set&lt;String&gt; applied = ConcurrentHashMap.newKeySet();\n    public void addToNet(String groupId, String userId, long delta) { net.merge(groupId + &quot;/&quot; + userId, delta, Long::sum); }\n    public boolean claim(String groupId, String expenseId) { return applied.add(groupId + &quot;/&quot; + expenseId); }\n    public long netOf(String groupId, String userId) { return net.getOrDefault(groupId + &quot;/&quot; + userId, 0L); }\n}\n// the tables are the maps and the log:\n//   grp(id)   member(group_id, user_id)   balance(group_id, user_id, paise)   pair(group_id, debtor, creditor, paise)\n//   expense(id, version, group_id, kind, payer, amount_paise, status)   share(expense_id, version, user_id, paise)\n// the same write in SQL: ONE transaction per expense, in the group&#x27;s order.\n//   SELECT id FROM grp WHERE id = ? FOR UPDATE;\n//     -- the group&#x27;s lock, now a row lock held until COMMIT: two servers take turns per group, so the\n//     -- membership check and &quot;may carol leave?&quot; still see a group nobody else is changing\n//   INSERT INTO expense (id, version, group_id, payer, amount_paise) VALUES (?,1,?,?,?) ON CONFLICT DO NOTHING;\n//     -- 0 rows inserted means a retry: ROLLBACK, the ledger was already moved\n//   INSERT INTO balance (group_id, user_id, paise) VALUES (?,?,?)\n//     ON CONFLICT (group_id, user_id) DO UPDATE SET paise = balance.paise + EXCLUDED.paise;   -- once per person\n//     -- an atomic add that also creates the row the first time; a bare UPDATE would skip a brand-new member\n//   COMMIT;\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>17 &middot; Where does time come from, and how do you test what an expense was stamped with?</h3><button class=\"timer\" data-min=\"3\">start 3:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The group has a Clock it was handed, and it stamps every expense version with it; nothing else in the system reads the wall clock. A test hands in a clock that returns a fixed instant, posts an expense, moves the instant forward and edits it. It can then assert the exact timestamps on version one and version two. The same seam makes the recurring-expense extension testable: the job is given a now, not asked to find one.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Where time comes from. Injected, so a test can stamp an expense with any instant it likes. */\ninterface Clock { long nowMs(); }\n\n// on the group: handed in, defaulted, never read from the wall clock inside a method\nprivate volatile Clock clock = System::currentTimeMillis;   // volatile: a test sets it, other threads read it\nvoid setClock(Clock c) { clock = c; }\n\n// in a test: pick the instant, then move it\nlong[] now = { 1_700_000_000_000L };\ngroup.setClock(() -&gt; now[0]);\ngroup.addExpense(&quot;e1&quot;, &quot;alice&quot;, 30000, SplitType.EQUAL, parts, &quot;dinner&quot;);\nnow[0] += 7L * 24 * 3600 * 1000;                       // a week later\ngroup.edit(&quot;e1&quot;, &quot;alice&quot;, 25000, SplitType.EQUAL, parts, &quot;dinner, corrected&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>18 &middot; Which pattern is where, which SOLID letter is where, and where would a Factory or a Builder earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None of them was chosen up front; each is what a move produced, which is why each has a one-sentence defence. Strategy is move 3: how to split, how to simplify and where time comes from, each a one-method interface the group is handed. Decorator is the same move's wrapper, CheckedSplit, which adds the sum-to-the-bill check to every rule instead of copying it into each. Observer is move 4's rule that a phone must never be inside the lock. State and Command are both move 6: an expense's life is a fixed set of moves, and its stored shares are its own undo. For SOLID: S is move 2, O is the weights rule, L is that the group calls rule.split and never asks which rule it got, I is four interfaces with one method each, and D is configure() and setClock(), which is exactly why a test can hand in a broken rule. Factory earns its place the day split types arrive as configuration strings, because the SplitType-to-rule map is already the registry. Builder earns it the day an expense gains optional fields, because today every argument is required.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: a rule behind an interface, handed in, never built by the group\ninterface SplitStrategy { List&lt;Share&gt; split(long totalPaise, String payerId, List&lt;Participant&gt; parts); }\nvoid configure(Map&lt;SplitType, SplitStrategy&gt; rules, SimplifyStrategy simplifier) { /* wraps each rule */ }\n\n// Decorator: add the invariant to every rule, present and future, instead of copying the check\nrules.forEach((type, rule) -&gt; checked.put(type, new CheckedSplit(rule)));\n\n// Observer: the group announces; it does not know what a phone is\ninterface ExpenseObserver { void onExpense(String groupId, Expense e); }\nprivate void publish(Expense e) { for (ExpenseObserver o : observers) try { o.onExpense(id, e); } catch (RuntimeException ex) { /* log */ } }\n\n// State + Command: the life is a fixed set of moves, and the expense carries its own undo\nenum ExpenseStatus { RECORDED, EDITED, DELETED }\nledger.apply(gone.payerId(), gone.shares(), -1);        // the stored shares ARE the undo log\n\n// Factory: not yet. The registry is already here; it earns the name when types come from config strings\nMap&lt;String, SplitStrategy&gt; byName = Map.of(&quot;EQUAL&quot;, new EqualSplit(), &quot;SHARES&quot;, new SharesSplit());\n\n// Builder: not yet. Every field is required and only the group calls this; receipts, categories and tags would change that\nnew Expense(id, groupId, kind, payerId, totalPaise, shares, version, atMs, note);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><h3>Miss log</h3></div><div class=\"cb\"><div class=\"miss\"><p>Three specific lines: what the reference did that you did not. Saved in this browser.</p><textarea id=\"miss\" placeholder=\"1.&#10;2.&#10;3.\"></textarea></div></div></div></div>", "code": ""}];
const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\n\n/** How a bill is divided. The value is only a key into the registry of rules; the rule itself is a class. */\nenum SplitType { EQUAL, EXACT, PERCENT }\n\n/** An expense is either a real bill somebody paid, or a settle-up: money handed back. Same maths, different label. */\nenum ExpenseKind { BILL, SETTLEMENT }\n\n/**\n * An expense's life. RECORDED is live; EDITED means a newer version replaced it (this row is kept for the\n * audit trail); DELETED means its effect was reversed (the row is kept too). Nothing is ever erased.\n */\nenum ExpenseStatus { RECORDED, EDITED, DELETED }\n\n/** Exact money, in paise. There is no double anywhere in this file; these two helpers are the only boundary. */\nfinal class Money {\n    /** Parse \"1234.50\" into 123450 paise, exactly. Used at the edge (a form, a file), never in the maths. */\n    static long rupees(String amount) { return new java.math.BigDecimal(amount).movePointRight(2).longValueExact(); }\n    /** Print 123450 paise as \"1234.50\". Presentation only. */\n    static String fmt(long paise) {\n        String sign = paise < 0 ? \"-\" : \"\"; long a = Math.abs(paise);\n        return sign + (a / 100) + \".\" + String.format(\"%02d\", a % 100);\n    }\n}\n\n/** A person. Only the id ever reaches the ledger, so a rename can never move money. */\nrecord User(String id, String name) {}\n\n/**\n * One participant as the client declared them. What rawValue means depends on the split rule: EQUAL ignores\n * it, EXACT reads it as paise, PERCENT reads it as basis points (hundredths of a percent, so 33.33% = 3333).\n */\nrecord Participant(String userId, long rawValue) {\n    /** For an EQUAL split, where the declared number is not used. */\n    static Participant of(String userId) { return new Participant(userId, 0); }\n}\n\n/** One participant's resolved share of one expense, in paise. The shares of an expense always sum to its total. */\nrecord Share(String userId, long paise) {}\n\n/** One suggested payment in a simplified settlement: \"from pays to this many paise\". A suggestion, not a balance. */\nrecord Transfer(String from, String to, long paise) {}\n\n/** Where time comes from. Injected, so a test can stamp an expense with any instant it likes. */\ninterface Clock { long nowMs(); }\n\n// \"they will ask for a fourth way to split before the hour is out\" -> hide the rule behind an interface -> Strategy\n/**\n * The rule that turns one amount into per-person shares. One method, because the split type is the one thing\n * that changes. Implementations MUST return shares that sum to the total exactly, in the participants' order.\n */\ninterface SplitStrategy {\n    /** Shares for this bill, summing to totalPaise. Throws IllegalArgumentException if the declared numbers do not reconcile. */\n    List<Share> split(long totalPaise, String payerId, List<Participant> parts);\n}\n\n/**\n * The order the odd paise are handed out in: the payer first if he is a participant, then everyone else in the\n * order the client sent. Deterministic, so the same expense always splits the same way.\n */\nfinal class Remainder {\n    /** The participants, payer first. Used by EQUAL and PERCENT to decide who absorbs the leftover paise. */\n    static List<Participant> payerFirst(String payerId, List<Participant> parts) {\n        List<Participant> out = new ArrayList<>(parts.size());\n        for (Participant p : parts) if (p.userId().equals(payerId)) out.add(p);\n        for (Participant p : parts) if (!p.userId().equals(payerId)) out.add(p);\n        return out;\n    }\n    /** Give one extra paise to each of the first `extra` participants of `order`, and return shares in the ORIGINAL order. */\n    static List<Share> spread(List<Participant> parts, List<Participant> order, Map<String, Long> base, long extra) {\n        Map<String, Long> byUser = new HashMap<>(base);\n        for (int i = 0; i < extra; i++) byUser.merge(order.get(i).userId(), 1L, Long::sum);\n        List<Share> out = new ArrayList<>(parts.size());\n        for (Participant p : parts) out.add(new Share(p.userId(), byUser.get(p.userId())));\n        return out;\n    }\n}\n\n/** Equal shares. 100 paise across 3 is 34/33/33, and the extra paise goes to the payer: nothing is lost. */\nclass EqualSplit implements SplitStrategy {\n    public List<Share> split(long total, String payerId, List<Participant> parts) {\n        int n = parts.size();\n        long base = total / n, extra = total - base * n;          // extra is 0..n-1, never a fraction\n        Map<String, Long> flat = new HashMap<>();\n        for (Participant p : parts) flat.put(p.userId(), base);\n        return Remainder.spread(parts, Remainder.payerFirst(payerId, parts), flat, extra);\n    }\n}\n\n/** Each participant declares their own paise. They must add up to the bill, or the expense is refused. */\nclass ExactSplit implements SplitStrategy {\n    public List<Share> split(long total, String payerId, List<Participant> parts) {\n        long sum = 0;\n        for (Participant p : parts) {\n            if (p.rawValue() < 0) throw new IllegalArgumentException(\"a share cannot be negative: \" + p.userId());\n            sum += p.rawValue();\n        }\n        if (sum != total)                                          // the whole point of EXACT: it must reconcile\n            throw new IllegalArgumentException(\"exact shares add up to \" + Money.fmt(sum) + \", the bill is \" + Money.fmt(total));\n        List<Share> out = new ArrayList<>(parts.size());\n        for (Participant p : parts) out.add(new Share(p.userId(), p.rawValue()));\n        return out;\n    }\n}\n\n/**\n * Percentages as basis points (33.33% = 3333), so the sum-to-100 check is exact integer arithmetic. Each share\n * is rounded DOWN and the paise that rounding left over go to the payer first.\n */\nclass PercentSplit implements SplitStrategy {\n    private static final long FULL = 10_000;                       // 100.00% in basis points\n    public List<Share> split(long total, String payerId, List<Participant> parts) {\n        long bpSum = 0;\n        for (Participant p : parts) {\n            if (p.rawValue() < 0) throw new IllegalArgumentException(\"a percentage cannot be negative: \" + p.userId());\n            bpSum += p.rawValue();\n        }\n        if (bpSum != FULL)\n            throw new IllegalArgumentException(\"percentages add up to \" + (bpSum / 100.0) + \"%, they must add up to 100%\");\n        Map<String, Long> flat = new HashMap<>();\n        long allocated = 0;\n        for (Participant p : parts) {\n            long share = total * p.rawValue() / FULL;              // integer maths: rounds down\n            flat.put(p.userId(), share); allocated += share;\n        }\n        return Remainder.spread(parts, Remainder.payerFirst(payerId, parts), flat, total - allocated);\n    }\n}\n\n// the invariant \"shares sum to the total\" must hold for rules that do not exist yet -> wrap every rule -> Decorator\n/**\n * Wraps any split rule and enforces the contract: a positive amount, at least one participant, nobody twice,\n * no negative share, and the shares summing to the total to the paise. The group wraps every rule it is handed,\n * so a rule written next year cannot break the ledger. If this throws, nothing has been written anywhere.\n */\nclass CheckedSplit implements SplitStrategy {\n    private final SplitStrategy base;\n    CheckedSplit(SplitStrategy base) { this.base = base; }\n    public List<Share> split(long total, String payerId, List<Participant> parts) {\n        if (total <= 0) throw new IllegalArgumentException(\"an amount must be positive: \" + total + \" paise\");\n        if (parts.isEmpty()) throw new IllegalArgumentException(\"an expense needs at least one participant\");\n        Set<String> seen = new HashSet<>();\n        for (Participant p : parts)\n            if (!seen.add(p.userId())) throw new IllegalArgumentException(\"participant listed twice: \" + p.userId());\n        List<Share> shares = base.split(total, payerId, parts);\n        long sum = 0;\n        for (Share s : shares) {\n            if (s.paise() < 0) throw new IllegalStateException(\"negative share for \" + s.userId());\n            sum += s.paise();\n        }\n        if (sum != total)                                          // the one place the paise are checked, for every rule\n            throw new IllegalStateException(base.getClass().getSimpleName() + \" returned \" + Money.fmt(sum)\n                + \" for a bill of \" + Money.fmt(total));\n        return shares;\n    }\n}\n\n// \"settle with the fewest payments\" is a suggestion, not the truth -> a rule that reads a snapshot -> Strategy\n/** Turns a net position per person into a list of suggested payments. Reads a snapshot; changes nothing. */\ninterface SimplifyStrategy { List<Transfer> simplify(Map<String, Long> net); }\n\n/**\n * Min cash flow, greedily: repeatedly make the biggest debtor pay the biggest creditor as much as clears one of\n * them. At most n-1 transfers for n people, because each round removes at least one person from the board.\n * Short, but not always the shortest: two people owing 400 and 300 to three owed 200, 200 and 300 get four\n * payments from greedy, where three would do.\n */\nclass MinCashFlow implements SimplifyStrategy {\n    public List<Transfer> simplify(Map<String, Long> net) {\n        // biggest creditor first, biggest debtor first; the id breaks ties so the output is always the same\n        PriorityQueue<Share> credits = new PriorityQueue<>((a, b) ->\n            a.paise() != b.paise() ? Long.compare(b.paise(), a.paise()) : a.userId().compareTo(b.userId()));\n        PriorityQueue<Share> debts = new PriorityQueue<>((a, b) ->\n            a.paise() != b.paise() ? Long.compare(b.paise(), a.paise()) : a.userId().compareTo(b.userId()));\n        for (Map.Entry<String, Long> e : net.entrySet()) {\n            if (e.getValue() > 0) credits.add(new Share(e.getKey(), e.getValue()));\n            else if (e.getValue() < 0) debts.add(new Share(e.getKey(), -e.getValue()));\n        }\n        List<Transfer> out = new ArrayList<>();\n        while (!credits.isEmpty() && !debts.isEmpty()) {\n            Share c = credits.poll(), d = debts.poll();\n            long amount = Math.min(c.paise(), d.paise());          // clears at least one of the two\n            out.add(new Transfer(d.userId(), c.userId(), amount));\n            if (c.paise() > amount) credits.add(new Share(c.userId(), c.paise() - amount));\n            if (d.paise() > amount) debts.add(new Share(d.userId(), d.paise() - amount));\n        }\n        return out;\n    }\n}\n\n// \"the others must be told\" must not sit in the money maths -> publish after the write -> Observer\n/** Anyone who wants to hear that an expense landed: a push service, an email digest, analytics. */\ninterface ExpenseObserver { void onExpense(String groupId, Expense e); }\n\n/** A phone notification. Prints here; a real one would call a push gateway, which is why it runs after the lock. */\nclass PushNotifier implements ExpenseObserver {\n    public void onExpense(String groupId, Expense e) {\n        String what = e.status() == ExpenseStatus.DELETED ? \"deleted\" : e.version() > 1 ? \"edited\" : \"added\";\n        System.out.println(\"[push] \" + groupId + \": \" + e.payerId() + \" \" + what + \" \" + e.note()\n            + \" \" + Money.fmt(e.totalPaise()) + \" across \" + e.shares().size());\n    }\n}\n\n/**\n * One version of one expense: who paid, how much, and the resolved shares. The shares are stored, not recomputed,\n * which is what makes a delete or an edit an exact reversal. Immutable apart from its status.\n */\nclass Expense {\n    private final String id, groupId, payerId, note;\n    private final ExpenseKind kind;\n    private final long totalPaise, atMs;\n    private final int version;\n    private final List<Share> shares;\n    private volatile ExpenseStatus status = ExpenseStatus.RECORDED;   // only ever written under the group's lock\n\n    Expense(String id, String groupId, ExpenseKind kind, String payerId, long totalPaise,\n            List<Share> shares, int version, long atMs, String note) {\n        this.id = id; this.groupId = groupId; this.kind = kind; this.payerId = payerId;\n        this.totalPaise = totalPaise; this.shares = List.copyOf(shares);   // copied: the caller cannot change it later\n        this.version = version; this.atMs = atMs; this.note = note;\n    }\n    String id()             { return id; }\n    String groupId()        { return groupId; }\n    ExpenseKind kind()      { return kind; }\n    String payerId()        { return payerId; }\n    long totalPaise()       { return totalPaise; }\n    /** The resolved shares. Unmodifiable, and the undo log for a delete or an edit. */\n    List<Share> shares()    { return shares; }\n    int version()           { return version; }\n    long atMs()             { return atMs; }\n    String note()           { return note; }\n    ExpenseStatus status()  { return status; }\n    /** Called by the group, inside its lock, when a newer version replaces this one or it is reversed. */\n    void markStatus(ExpenseStatus s) { this.status = s; }\n    @Override public String toString() {\n        return id + \" v\" + version + \" \" + status + \" \" + kind + \" \" + payerId + \" \" + Money.fmt(totalPaise) + \" \" + note;\n    }\n}\n\n/**\n * The two maps that ARE the balances: a net per person, and who owes whom. Deliberately dumb: it does arithmetic\n * on maps and nothing else. Every method here is called by the group, inside the group's lock, so it has no lock\n * of its own. Every paise added to one person is taken from another in the same call (double entry), which is\n * why the nets always sum to zero; move() is why each pair holds at most one direction of `owes`.\n */\nclass Ledger {\n    private final Map<String, Long> net = new HashMap<>();               // user -> paise; + is owed money, - owes money\n    private final Map<String, Map<String, Long>> owes = new HashMap<>(); // debtor -> creditor -> paise, always > 0\n\n    /**\n     * Apply one expense's shares. sign is +1 to record it and -1 to reverse it, which is the whole of delete and\n     * half of edit. Pure map arithmetic: it cannot fail, which is why the group validates everything before calling it.\n     */\n    void apply(String payerId, List<Share> shares, int sign) {\n        for (Share s : shares) {\n            if (s.userId().equals(payerId)) continue;                    // the payer's own share is his own money\n            long amount = sign * s.paise();\n            bumpNet(payerId, amount);\n            bumpNet(s.userId(), -amount);\n            move(s.userId(), payerId, amount);                           // the participant owes the payer that much more\n        }\n    }\n    /** X's net position: positive means the group owes X. O(1). */\n    long netOf(String userId) { return net.getOrDefault(userId, 0L); }\n    /** How much `debtor` owes `creditor` right now, never negative. O(1). */\n    long owed(String debtor, String creditor) { return owes.getOrDefault(debtor, Map.of()).getOrDefault(creditor, 0L); }\n    /**\n     * Someone whose net is zero is leaving, so pass their debts through them: whoever owed them now owes whoever\n     * they owed (bob owed carol 150.00 and carol owed alice 150.00, so now bob owes alice 150.00). No net moves,\n     * and afterwards no pair names them. Only leaving calls it, so the scan of the debtors is fine.\n     */\n    void passThrough(String mid) {\n        List<String> debtors = new ArrayList<>();                                      // everyone who owes mid\n        owes.forEach((d, row) -> { if (row.containsKey(mid)) debtors.add(d); });\n        for (String d : debtors)\n            for (String c : new ArrayList<>(owes.getOrDefault(mid, Map.of()).keySet())) { // everyone mid owes\n                long x = Math.min(owed(d, mid), owed(mid, c));\n                if (x == 0) continue;\n                move(d, mid, -x); move(mid, c, -x); move(d, c, x);                     // d now pays c directly\n            }\n    }\n    /** A copy of every non-zero net, ordered by id so the simplifier's output is repeatable. */\n    Map<String, Long> netSnapshot() { return new TreeMap<>(net); }\n    /** A copy of the who-owes-whom map, for a statement screen. */\n    Map<String, Map<String, Long>> owesSnapshot() {\n        Map<String, Map<String, Long>> copy = new TreeMap<>();\n        owes.forEach((d, row) -> copy.put(d, new TreeMap<>(row)));\n        return copy;\n    }\n    private void bumpNet(String userId, long delta) {\n        long now = net.getOrDefault(userId, 0L) + delta;\n        if (now == 0) net.remove(userId); else net.put(userId, now);     // a settled person costs no memory\n    }\n    /**\n     * Move `delta` paise of debt from debtor to creditor, keeping ONE direction per pair: the two entries are\n     * written from one signed number, so A-owes-B and B-owes-A can never drift apart.\n     */\n    private void move(String debtor, String creditor, long delta) {\n        long signed = owed(debtor, creditor) - owed(creditor, debtor) + delta;\n        put(debtor, creditor, Math.max(signed, 0));\n        put(creditor, debtor, Math.max(-signed, 0));\n    }\n    private void put(String debtor, String creditor, long amount) {\n        if (amount == 0) {\n            Map<String, Long> row = owes.get(debtor);\n            if (row != null) { row.remove(creditor); if (row.isEmpty()) owes.remove(debtor); }\n        } else owes.computeIfAbsent(debtor, k -> new HashMap<>()).put(creditor, amount);\n    }\n}\n\n/**\n * The aggregate root: one group owns its members, its ledger, every version of every expense, and ONE lock.\n * Every write is: validate and compute OUTSIDE the lock, then apply all of it inside the lock or none of it,\n * then tell the observers after the lock. Nothing else in the system takes this lock, and two different groups\n * never wait for each other.\n */\nclass Group {\n    private final String id;\n    private final Set<String> members = new LinkedHashSet<>();\n    private final Ledger ledger = new Ledger();\n    private final Map<String, Expense> live = new HashMap<>();        // expense id -> its current version; guarded by lock\n    private final List<Expense> log = new ArrayList<>();              // every version ever written, append only\n    private final ReentrantLock lock = new ReentrantLock();\n    private final List<ExpenseObserver> observers = new CopyOnWriteArrayList<>();\n    // volatile: configure() and setClock() write these without the lock, and other threads must see the new value\n    private volatile Map<SplitType, SplitStrategy> splits = new EnumMap<>(SplitType.class);\n    private volatile SimplifyStrategy simplifier = new MinCashFlow();\n    private volatile Clock clock = System::currentTimeMillis;\n\n    Group(String id, Collection<String> memberIds) { this.id = id; members.addAll(memberIds); }\n    String id() { return id; }\n    /** A copy of the members, taken under the lock: the set itself is only ever read or changed under it. */\n    Set<String> members() {\n        lock.lock(); try { return Collections.unmodifiableSet(new LinkedHashSet<>(members)); } finally { lock.unlock(); }\n    }\n\n    /**\n     * Hand in the rules. Every split rule is wrapped in CheckedSplit here, so no rule \u2014 not even one added later \u2014\n     * can put shares into the ledger that do not sum to the bill. The group never builds a rule itself.\n     */\n    void configure(Map<SplitType, SplitStrategy> rules, SimplifyStrategy simplifier) {\n        Map<SplitType, SplitStrategy> checked = new EnumMap<>(SplitType.class);\n        rules.forEach((type, rule) -> checked.put(type, new CheckedSplit(rule)));\n        this.splits = checked; this.simplifier = simplifier;\n    }\n    /** Tests hand in a fixed clock so an expense's timestamp is whatever the test says. */\n    void setClock(Clock c) { clock = c; }\n    /** Subscribe a listener. Setup only; listeners are called after the lock, never inside it. */\n    void addObserver(ExpenseObserver o) { observers.add(o); }\n\n    /**\n     * Record a bill. The order is the design: compute and validate the shares with nothing locked and nothing\n     * written; then under the lock check the id and the membership and only then apply every delta, which is map\n     * arithmetic that cannot fail. A rejected expense leaves the ledger exactly as it was. The same expense id\n     * twice applies once and returns the first one, so a client retry is safe.\n     */\n    Expense addExpense(String expenseId, String payerId, long totalPaise, SplitType type,\n                       List<Participant> parts, String note) {\n        return record(expenseId, ExpenseKind.BILL, payerId, totalPaise, type, parts, note);\n    }\n\n    /**\n     * A settle-up is an expense of a special kind: `from` hands `to` some money, so it is a bill paid by `from`\n     * with exactly one participant, `to`, owing the whole amount. The same code path, the same lock, the same\n     * reversal \u2014 which is why a wrong settle-up can be deleted like any other expense.\n     */\n    Expense settleUp(String expenseId, String from, String to, long paise) {\n        return record(expenseId, ExpenseKind.SETTLEMENT, from, paise, SplitType.EXACT,\n                      List.of(new Participant(to, paise)), \"settle up\");\n    }\n\n    /**\n     * The one write path, used by addExpense and settleUp. The ORDER is the whole design: split and check with\n     * nothing locked and nothing written; take the lock; check the id and the membership; and only then apply\n     * the deltas, which is map arithmetic that cannot fail half way. Anything that throws, throws before the\n     * first write, so a rejected expense leaves every balance exactly as it was.\n     */\n    private Expense record(String expenseId, ExpenseKind kind, String payerId, long totalPaise,\n                           SplitType type, List<Participant> parts, String note) {\n        SplitStrategy rule = splits.get(type);\n        if (rule == null) throw new IllegalStateException(\"no rule configured for \" + type);\n        List<Share> shares = rule.split(totalPaise, payerId, parts);   // outside the lock: pure, and it may throw\n        Expense e;\n        lock.lock();\n        try {\n            Expense existing = live.get(expenseId);\n            if (existing != null) return existing;                      // idempotent: the same id is applied once\n            checkMembers(payerId, shares);                              // every check before any write\n            e = new Expense(expenseId, id, kind, payerId, totalPaise, shares, 1, clock.nowMs(), note);\n            ledger.apply(payerId, shares, +1);                          // from here nothing can throw\n            live.put(expenseId, e);\n            log.add(e);\n        } finally { lock.unlock(); }\n        publish(e);                                                     // after the lock: a slow phone stalls nobody\n        return e;\n    }\n\n    /**\n     * Replace an expense with a new version: the old one's stored shares are reversed, it is marked EDITED and\n     * kept, and version n+1 is applied. Both halves happen under ONE lock, so nobody can read a group in which\n     * the old expense is gone and the new one has not landed. The new shares are computed before the lock, so a\n     * bad edit changes nothing at all. The payer may change too; the reversal uses the OLD version's payer. An\n     * expense that names someone who has left is refused: reversing it would hand them a balance nobody can settle.\n     */\n    Expense edit(String expenseId, String payerId, long totalPaise, SplitType type, List<Participant> parts, String note) {\n        SplitStrategy rule = splits.get(type);\n        if (rule == null) throw new IllegalStateException(\"no rule configured for \" + type);\n        List<Share> shares = rule.split(totalPaise, payerId, parts);    // outside the lock: pure, and it may throw\n        Expense next;\n        lock.lock();\n        try {\n            Expense old = current(expenseId);\n            checkMembers(old.payerId(), old.shares());                  // undoing it must not reopen a leaver's balance\n            checkMembers(payerId, shares);                              // every check before any write\n            next = new Expense(expenseId, id, old.kind(), payerId, totalPaise, shares,\n                               old.version() + 1, clock.nowMs(), note);\n            ledger.apply(old.payerId(), old.shares(), -1);              // undo the old version, exactly\n            ledger.apply(payerId, shares, +1);                          // apply the new one\n            old.markStatus(ExpenseStatus.EDITED);\n            live.put(expenseId, next);\n            log.add(next);\n        } finally { lock.unlock(); }\n        publish(next);\n        return next;\n    }\n\n    /**\n     * Reverse an expense. Its stored shares are applied with the opposite sign, so the balances go back exactly\n     * to what they were, and the row stays in the log marked DELETED: an audit trail, not an erasure. Deleting\n     * twice is refused rather than double-reversed, and so is deleting an expense that names someone who has left.\n     */\n    Expense delete(String expenseId) {\n        Expense gone;\n        lock.lock();\n        try {\n            gone = current(expenseId);\n            checkMembers(gone.payerId(), gone.shares());                // undoing it must not reopen a leaver's balance\n            ledger.apply(gone.payerId(), gone.shares(), -1);\n            gone.markStatus(ExpenseStatus.DELETED);\n        } finally { lock.unlock(); }\n        publish(gone);\n        return gone;\n    }\n\n    /** Let somebody join. The members only change under the lock; joining never moves money. */\n    void addMember(String userId) { lock.lock(); try { members.add(userId); } finally { lock.unlock(); } }\n\n    /**\n     * Let somebody leave the group. Refused while their net is not zero, because a debt to someone who is gone can\n     * never be settled. A zero net can still hide a loop (bob owes carol 150.00, carol owes alice 150.00), so their\n     * debts are passed through them on the way out: bob now owes alice, and no pair names carol. The check, the\n     * pass-through and the removal happen inside the SAME lock, so nobody can slip an expense into the gap. Their\n     * rows stay in the log: leaving is not erasing.\n     */\n    void removeMember(String userId) {\n        lock.lock();\n        try {\n            if (!members.contains(userId)) throw new IllegalArgumentException(userId + \" is not in \" + id);\n            long net = ledger.netOf(userId);\n            if (net != 0)\n                throw new IllegalStateException(userId + \" cannot leave \" + id + \": net is \" + Money.fmt(net));\n            ledger.passThrough(userId);                                 // their loop closes without them; no net moves\n            members.remove(userId);\n        } finally { lock.unlock(); }\n    }\n\n    /** X's net position: positive means the group owes X. O(1). */\n    long netOf(String userId) { lock.lock(); try { return ledger.netOf(userId); } finally { lock.unlock(); } }\n    /** How much `debtor` owes `creditor`, zero if nothing. O(1). */\n    long owes(String debtor, String creditor) { lock.lock(); try { return ledger.owed(debtor, creditor); } finally { lock.unlock(); } }\n    /** Every non-zero net, taken under the lock so the numbers are from one instant. */\n    Map<String, Long> balances() { lock.lock(); try { return ledger.netSnapshot(); } finally { lock.unlock(); } }\n    /** The who-owes-whom table, taken under the lock. */\n    Map<String, Map<String, Long>> owesTable() { lock.lock(); try { return ledger.owesSnapshot(); } finally { lock.unlock(); } }\n\n    /**\n     * A short list of payments that would clear the group: at most one fewer than the people with a balance. A\n     * SUGGESTION computed from a snapshot outside the lock: it does not touch the ledger, so the pairwise\n     * history stays intact and nobody's net moves by a paise.\n     */\n    List<Transfer> simplify() {\n        Map<String, Long> snapshot = balances();\n        return simplifier.simplify(snapshot);                           // outside the lock: it only reads a copy\n    }\n    /** Every version of every expense, oldest first. The audit trail. */\n    List<Expense> history() { lock.lock(); try { return List.copyOf(log); } finally { lock.unlock(); } }\n\n    private Expense current(String expenseId) {\n        Expense e = live.get(expenseId);\n        if (e == null) throw new NoSuchElementException(\"no such expense: \" + expenseId);\n        if (e.status() != ExpenseStatus.RECORDED) throw new IllegalStateException(expenseId + \" is \" + e.status());\n        return e;\n    }\n    private void checkMembers(String payerId, List<Share> shares) {\n        if (!members.contains(payerId)) throw new IllegalArgumentException(payerId + \" is not in \" + id);\n        for (Share s : shares)\n            if (!members.contains(s.userId())) throw new IllegalArgumentException(s.userId() + \" is not in \" + id);\n    }\n    /** Tell every observer, outside the lock, and survive a listener that throws. */\n    private void publish(Expense e) {\n        for (ExpenseObserver o : observers) {\n            try { o.onExpense(id, e); } catch (RuntimeException ex) { System.err.println(\"[observer failed] \" + ex.getMessage()); }\n        }\n    }\n}\n\n/**\n * The thin caller: it finds the group and calls it. It holds no balances and takes no lock, which is exactly why\n * many people posting expenses at the same time are safe.\n */\nclass Splitwise {\n    private final Map<String, Group> groups = new ConcurrentHashMap<>();\n    private final Map<String, User> users = new ConcurrentHashMap<>();\n    /** Register a person. Ids are what the ledger stores. */\n    void addUser(User u) { users.put(u.id(), u); }\n    /** Create a group with its members, wired with the standard rules. An id already in use is refused, not replaced. */\n    Group newGroup(String groupId, String... memberIds) {\n        Group g = wired(groupId, memberIds);\n        if (groups.putIfAbsent(groupId, g) != null)                    // put() would silently drop the old group\n            throw new IllegalArgumentException(\"group already exists: \" + groupId);\n        return g;\n    }\n    /** The group with this id, made on first use. computeIfAbsent is one atomic step: two callers get one group. */\n    Group groupOrCreate(String groupId, String... memberIds) {\n        return groups.computeIfAbsent(groupId, gid -> wired(gid, memberIds));\n    }\n    /** A new group with the standard rules handed in. */\n    private static Group wired(String groupId, String... memberIds) {\n        Group g = new Group(groupId, Arrays.asList(memberIds));\n        g.configure(Map.of(SplitType.EQUAL, new EqualSplit(),\n                           SplitType.EXACT, new ExactSplit(),\n                           SplitType.PERCENT, new PercentSplit()), new MinCashFlow());\n        return g;\n    }\n    /** The group, or an error. O(1). */\n    Group group(String groupId) {\n        Group g = groups.get(groupId);\n        if (g == null) throw new NoSuchElementException(\"no such group: \" + groupId);\n        return g;\n    }\n    /** A person's name for a screen; the ledger never needs it. */\n    String nameOf(String userId) { User u = users.get(userId); return u == null ? userId : u.name(); }\n}\n\n/**\n * Proof it works: a trip, three ways of splitting, a settle-up, an edit, a delete, a simplify, and fifty people\n * posting expenses to one group at the same instant with the balances still summing to exactly zero.\n */\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        Splitwise app = new Splitwise();\n        app.addUser(new User(\"alice\", \"Alice\")); app.addUser(new User(\"bob\", \"Bob\"));\n        app.addUser(new User(\"carol\", \"Carol\"));\n        Group trip = app.newGroup(\"goa\", \"alice\", \"bob\", \"carol\");\n        trip.addObserver(new PushNotifier());\n\n        // equal: 1000.01 across three is 333.33 each with two paise over: one to the payer, one to the next person\n        trip.addExpense(\"e1\", \"alice\", Money.rupees(\"1000.01\"), SplitType.EQUAL,\n            List.of(Participant.of(\"alice\"), Participant.of(\"bob\"), Participant.of(\"carol\")), \"hotel\");\n        // exact: Bob's cocktail cost more\n        trip.addExpense(\"e2\", \"bob\", Money.rupees(\"900.00\"), SplitType.EXACT,\n            List.of(new Participant(\"alice\", Money.rupees(\"200.00\")),\n                    new Participant(\"bob\",   Money.rupees(\"500.00\")),\n                    new Participant(\"carol\", Money.rupees(\"200.00\"))), \"dinner\");\n        // percent: the car was mostly Carol's idea (basis points: 25% = 2500)\n        trip.addExpense(\"e3\", \"carol\", Money.rupees(\"600.00\"), SplitType.PERCENT,\n            List.of(new Participant(\"alice\", 2500), new Participant(\"bob\", 2500),\n                    new Participant(\"carol\", 5000)), \"cab\");\n        System.out.println(\"balances \" + fmt(trip.balances()));\n        System.out.println(\"bob owes alice \" + Money.fmt(trip.owes(\"bob\", \"alice\")));\n\n        // the same expense id posted twice (a client retry) applies once\n        trip.addExpense(\"e3\", \"carol\", Money.rupees(\"600.00\"), SplitType.PERCENT,\n            List.of(new Participant(\"alice\", 2500), new Participant(\"bob\", 2500),\n                    new Participant(\"carol\", 5000)), \"cab\");\n        System.out.println(\"after a retry of e3, balances are unchanged: \" + fmt(trip.balances()));\n\n        // a rejected expense changes nothing: the exact shares do not add up to the bill\n        Map<String, Long> before = trip.balances();\n        try {\n            trip.addExpense(\"bad\", \"alice\", Money.rupees(\"500.00\"), SplitType.EXACT,\n                List.of(new Participant(\"bob\", Money.rupees(\"100.00\")), new Participant(\"carol\", Money.rupees(\"100.00\"))), \"oops\");\n        } catch (IllegalArgumentException e) { System.out.println(\"expected: \" + e.getMessage()); }\n        System.out.println(\"balances after the rejected expense: \" + before.equals(trip.balances()));\n\n        // the fewest payments that clear the group -- a suggestion; the ledger is untouched\n        System.out.println(\"simplify -> \" + trip.simplify());\n        System.out.println(\"simplify changed nothing: \" + before.equals(trip.balances()));\n\n        // settle up: Bob pays Alice what he owes her, and that pair goes to zero\n        long owed = trip.owes(\"bob\", \"alice\");\n        trip.settleUp(\"s1\", \"bob\", \"alice\", owed);\n        System.out.println(\"after settling, bob owes alice \" + Money.fmt(trip.owes(\"bob\", \"alice\")));\n\n        // the hotel was 900, not 1000.01: edit keeps the old version and reverses it exactly\n        trip.edit(\"e1\", \"alice\", Money.rupees(\"900.00\"), SplitType.EQUAL,\n            List.of(Participant.of(\"alice\"), Participant.of(\"bob\"), Participant.of(\"carol\")), \"hotel (corrected)\");\n        System.out.println(\"after the edit \" + fmt(trip.balances()));\n        trip.delete(\"e2\");\n        System.out.println(\"after deleting dinner \" + fmt(trip.balances()));\n        System.out.println(\"audit trail: \" + trip.history().size() + \" versions, e1 v1 is \" + trip.history().get(0).status());\n\n        // leaving: refused while the net is not zero. carol's net is 0.00, but bob owes her 150.00 and she owes\n        // alice 150.00, so her debts pass through her as she leaves: bob now owes alice, and no pair names carol.\n        try { trip.removeMember(\"bob\"); }\n        catch (IllegalStateException e) { System.out.println(\"expected: \" + e.getMessage()); }\n        trip.removeMember(\"carol\");\n        System.out.println(\"members now \" + trip.members() + \", who owes whom \" + trip.owesTable());\n\n        // fifty people post an expense to ONE group at the same instant; the balances must still sum to zero\n        Group big = app.newGroup(\"flat\", \"u0\", \"u1\", \"u2\", \"u3\", \"u4\");\n        List<Participant> all = List.of(Participant.of(\"u0\"), Participant.of(\"u1\"), Participant.of(\"u2\"),\n                                        Participant.of(\"u3\"), Participant.of(\"u4\"));\n        ExecutorService pool = Executors.newFixedThreadPool(50);        // one thread each, all parked on the latch\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<?>> posted = new ArrayList<>();\n        for (int i = 0; i < 50; i++) {\n            final int n = i;\n            posted.add(pool.submit(() -> {\n                go.await();\n                return big.addExpense(\"x\" + n, \"u\" + (n % 5), 100 + n, SplitType.EQUAL, all, \"round \" + n);\n            }));\n        }\n        go.countDown();\n        int ok = 0;\n        for (Future<?> f : posted) { f.get(); ok++; }\n        pool.shutdown();\n        long sum = 0;\n        for (long v : big.balances().values()) sum += v;\n        System.out.println(\"50 concurrent expenses: applied=\" + ok + \" sum of all balances=\" + sum + \" (must be 0)\");\n        if (sum != 0 || ok != 50) throw new AssertionError(\"the ledger lost an update\");\n    }\n    private static String fmt(Map<String, Long> balances) {\n        StringBuilder sb = new StringBuilder(\"{\");\n        balances.forEach((u, p) -> sb.append(u).append(\"=\").append(Money.fmt(p)).append(\" \"));\n        return sb.append(\"}\").toString();\n    }\n}\n", "f1": "import java.util.*;\nimport java.util.concur

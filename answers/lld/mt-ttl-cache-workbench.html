g it; ExtDemo at the bottom runs all of them so none can rot.\n\n// ---- ext: TTL by key prefix, read from one configuration string -- where a Factory finally earns its name\n/**\n * A TTL rule built from text like \"user:=300000,price:=2000,=60000\". The last entry with an empty\n * prefix is the default. This is the moment the enum-or-map question stops being academic: the rules now\n * arrive from a config file, so a static registry keyed by a prefix beats a switch nobody can extend.\n */\nfinal class TtlRules implements TtlPolicy<String> {\n    private final LinkedHashMap<String, Long> byPrefix = new LinkedHashMap<>();\n    private final long fallbackMs;\n\n    private TtlRules(LinkedHashMap<String, Long> byPrefix, long fallbackMs) {\n        this.byPrefix.putAll(byPrefix); this.fallbackMs = fallbackMs;\n    }\n\n    /** The factory method. Longest prefix wins, so \"user:session:\" can be shorter-lived than \"user:\". */\n    static TtlRules parse(String config) {\n        LinkedHashMap<String, Long> rules = new LinkedHashMap<>();\n        long fallback = 60_000;\n        for (String part : config.split(\",\")) {\n            String[] kv = part.trim().split(\"=\");\n            if (kv.length != 2) continue;\n            if (kv[0].isEmpty()) fallback = Long.parseLong(kv[1].trim());\n            else rules.put(kv[0].trim(), Long.parseLong(kv[1].trim()));\n        }\n        return new TtlRules(rules, fallback);\n    }\n\n    /** The longest matching prefix, or the default. No branching in the cache itself. */\n    public long ttlMsFor(String key) {\n        String best = null;\n        for (String prefix : byPrefix.keySet())\n            if (key.startsWith(prefix) && (best == null || prefix.length() > best.length())) best = prefix;\n        return best == null ? fallbackMs : byPrefix.get(best);\n    }\n}\n\n// ---- ext: refresh-ahead -- serve the value that is still live while exactly one thread reloads behind it\n/**\n * Gives an entry a soft deadline before its hard one. A read past the soft deadline returns the value\n * immediately and kicks off one background reload; a read past the hard deadline blocks on a normal load.\n * Nobody ever waits for a hot key again, at the price of one extra load per key per window. Built on the\n * public API only: the claim map here is a second single-flight, this time for the reload.\n */\nfinal class RefreshAhead<K, V> {\n    private final TtlCache<K, V> cache;\n    private final long refreshAfterMs;\n    private final Clock clock;\n    private final ConcurrentHashMap<K, Long> softDeadline = new ConcurrentHashMap<>();\n    private final ConcurrentHashMap<K, Boolean> refreshing = new ConcurrentHashMap<>();\n    private final ExecutorService pool = Executors.newFixedThreadPool(2, r -> {\n        Thread t = new Thread(r, \"refresh-ahead\"); t.setDaemon(true); return t;\n    });\n\n    RefreshAhead(TtlCache<K, V> cache, long refreshAfterMs, Clock clock) {\n        this.cache = cache; this.refreshAfterMs = refreshAfterMs; this.clock = clock;\n    }\n\n    /** A read that never blocks once the key is warm. */\n    V get(K key, Loader<K, V> loader) {\n        V live = cache.get(key);\n        if (live == null) {                                   // cold or past the hard deadline: a normal load\n            V loaded = cache.getOrLoad(key, loader);\n            softDeadline.put(key, clock.nowMs() + refreshAfterMs);\n            return loaded;\n        }\n        Long soft = softDeadline.get(key);\n        if (soft != null && clock.nowMs() >= soft && refreshing.putIfAbsent(key, Boolean.TRUE) == null) {\n            pool.execute(() -> {                              // one reload, in the background, no caller waits\n                try {\n                    cache.put(key, loader.load(key));\n                    softDeadline.put(key, clock.nowMs() + refreshAfterMs);\n                } catch (RuntimeException ignored) {\n                    // keep serving the value we have; the hard deadline is still the safety net\n                } finally {\n                    refreshing.remove(key);\n                }\n            });\n        }\n        return live;\n    }\n\n    /** Wait for any background reload to finish. Test helper; production never needs it. */\n    boolean quiet(long timeoutMs) throws InterruptedException {\n        long end = System.nanoTime() + timeoutMs * 1_000_000L;\n        while (!refreshing.isEmpty() && System.nanoTime() < end) Thread.sleep(2);\n        return refreshing.isEmpty();\n    }\n\n    void close() { pool.shutdownNow(); }\n}\n\n// ---- ext: negative caching -- a short-lived tombstone so a flood of misses does not become a flood of queries\n/**\n * A key that does not exist is the worst case for a cache: every lookup is a miss, so every lookup reaches\n * the database. Remember the absence too, in a second cache with a much shorter TTL, so a scraper asking\n * for a million ids that do not exist costs one query each per short window instead of one query each.\n */\nfinal class NegativeCache<K, V> {\n    private final TtlCache<K, V> present;\n    private final TtlCache<K, Boolean> absent;\n\n    NegativeCache(TtlCache<K, V> present, TtlCache<K, Boolean> absent) {\n        this.present = present; this.absent = absent;\n    }\n\n    /** Null means \"really not there\", and that answer is remembered for the tombstone TTL. */\n    V get(K key, Loader<K, V> loader) {\n        V hit = present.get(key);\n        if (hit != null) return hit;\n        if (Boolean.TRUE.equals(absent.get(key))) return null;      // remembered: it is not there\n        V loaded = loader.load(key);                                 // may legitimately return null\n        if (loaded == null) { absent.put(key, Boolean.TRUE); return null; }\n        present.put(key, loaded);\n        absent.invalidate(key);\n        return loaded;\n    }\n}\n\n// ---- ext: a size bound -- the seam for it, and why a TTL cache has nothing to rank keys by\n/**\n * The TTL cache is unbounded on purpose, and the reason is worth saying out loud: it records nothing about\n * reads. get() touches no ordering, which is exactly why it takes no lock. So a bound cannot be added to it;\n * it has to be added ON it, together with whatever state the victim rule needs. This wrapper keeps the\n * cheapest such state, the order in which keys were written, and evicts the oldest write. That is FIFO, not\n * LRU, and the honest line in an interview is that it is FIFO because nothing here knows what was read.\n * The bound is also soft: size() is read, then a victim is evicted, and a burst between those two steps\n * overshoots by a handful of entries. A hard bound needs one global counter on every write, which is the one\n * thing this design refuses; Caffeine makes the same trade. The ranking rules themselves -- LRU, LFU,\n * W-TinyLFU and the O(1) structures behind them -- are the subject of the LRU and eviction pages, not this one.\n */\nfinal class BoundedTtlCache<K, V> {\n    private final TtlCache<K, V> cache;\n    private final int capacity;\n    /** Write order, and nothing else: key -> the ticket it took when it was written. */\n    private final ConcurrentHashMap<K, Long> writtenAt = new ConcurrentHashMap<>();\n    private final AtomicLong ticket = new AtomicLong();\n\n    BoundedTtlCache(TtlCache<K, V> cache, int capacity) { this.cache = cache; this.capacity = capacity; }\n\n    /** Store, then evict oldest-first while over the bound. No lock of ours, so the bound is approximate. */\n    void put(K key, V value) {\n        cache.put(key, value);\n        writtenAt.put(key, ticket.incrementAndGet());\n        while (cache.size() > capacity) {\n            K victim = oldestWrite();\n            if (victim == null) break;\n            cache.invalidate(victim);                 // fires the listener with cause EXPLICIT\n            writtenAt.remove(victim);\n        }\n    }\n\n    /** A read does not reorder anything: that is the point of the class comment. */\n    V get(K key) {\n        V v = cache.get(key);\n        if (v == null) writtenAt.remove(key);\n        return v;\n    }\n\n    /** O(n) on purpose: this block exists to show the seam, and an O(1) ordering is what the LRU page builds. */\n    private K oldestWrite() {\n        K best = null; long lowest = Long.MAX_VALUE;\n        for (Map.Entry<K, Long> e : writtenAt.entrySet())\n            if (e.getValue() < lowest) { lowest = e.getValue(); best = e.getKey(); }\n        return best;\n    }\n}\n\n// ---- ext: metrics -- hit rate and load latency, from one listener plus a loader wrapper\n/** Counts removals by reason. Plugged in with addListener; the cache does not know what a metric is. */\nfinal class CacheMetrics<K, V> implements RemovalListener<K, V> {\n    private final EnumMap<RemovalCause, LongAdder> byCause = new EnumMap<>(RemovalCause.class);\n    CacheMetrics() { for (RemovalCause c : RemovalCause.values()) byCause.put(c, new LongAdder()); }\n    /** Never throws; and if it did, the cache would carry on, because it fires inside a try/catch. */\n    public void onRemoval(K key, V value, RemovalCause cause) { byCause.get(cause).increment(); }\n    long count(RemovalCause cause) { return byCause.get(cause).sum(); }\n    /** One line for a dashboard. */\n    public String toString() {\n        StringBuilder sb = new StringBuilder(\"removals\");\n        for (RemovalCause c : RemovalCause.values()) sb.append(' ').append(c).append('=').append(count(c));\n        return sb.toString();\n    }\n}\n\n/** Decorator over a loader: measures it, and is the natural place to put a retry or a circuit breaker. */\nfinal class TimedLoader<K, V> implements Loader<K, V> {\n    private final Loader<K, V> base;\n    private final LongAdder calls = new LongAdder(), totalMicros = new LongAdder();\n    TimedLoader(Loader<K, V> base) { this.base = base; }\n    /** The wrapped load, timed. The cache still calls it with no lock held, so the timing is honest. */\n    public V load(K key) {\n        long t0 = System.nanoTime();\n        try { return base.load(key); }\n        finally { calls.increment(); totalMicros.add((System.nanoTime() - t0) / 1000); }\n    }\n    long calls() { return calls.sum(); }\n    long averageMicros() { return calls.sum() == 0 ? 0 : totalMicros.sum() / calls.sum(); }\n}\n\n// ---- ext: a loader that never returns -- the timeout belongs on the loader, not inside the cache\n/**\n * The cache waits on the winner with join(), which has no deadline: a loader that hangs hangs every waiter.\n * Rather than teach the cache about timeouts, wrap the loader. One decorator, and every cache in the\n * process gets a bounded load, including the ones written next year.\n */\nfinal class BoundedLoader<K, V> implements Loader<K, V> {\n    private final Loader<K, V> base;\n    private final long timeoutMs;\n    private final ExecutorService pool = Executors.newCachedThreadPool(r -> {\n        Thread t = new Thread(r, \"loader\"); t.setDaemon(true); return t;\n    });\n    BoundedLoader(Loader<K, V> base, long timeoutMs) { this.base = base; this.timeoutMs = timeoutMs; }\n    /** Throws instead of hanging. The cache then writes nothing and releases the claim in its finally block. */\n    public V load(K key) {\n        Future<V> f = pool.submit(() -> base.load(key));\n        try {\n            return f.get(timeoutMs, TimeUnit.MILLISECONDS);\n        } catch (TimeoutException te) {\n            f.cancel(true);\n            throw new IllegalStateException(\"load timed out after \" + timeoutMs + \"ms for key \" + key);\n        } catch (ExecutionException ee) {\n            Throwable c = ee.getCause();\n            throw (c instanceof RuntimeException re) ? re : new IllegalStateException(c);\n        } catch (InterruptedException ie) {\n            Thread.currentThread().interrupt();\n            throw new IllegalStateException(\"interrupted while loading \" + key);\n        }\n    }\n    void close() { pool.shutdownNow(); }\n}\n\n// ---- ext: a deadline queue -- so a sweep touches only what died, instead of walking the whole map\n/**\n * The sweep in Main.java is O(n) per pass because it walks every key to find the few that died.\n * Keep the deadlines in a priority queue instead and a pass pops only the ones that are actually due:\n * O(k log n) for k dead keys. The token carried alongside the key is the entry object itself, so the\n * compare-and-remove that protects a refreshed value still works.\n */\nfinal class DeadlineQueue<K> {\n    /** key, the instant it dies, and the exact entry object that dies then. */\n    record Due<K>(long atMs, K key, Object token) {}\n    private final PriorityBlockingQueue<Due<K>> queue =\n        new PriorityBlockingQueue<>(64, Comparator.comparingLong((Due<K> d) -> d.atMs()));\n\n    /** Called on every write. One heap insert, O(log n), off the read path entirely. */\n    void schedule(long atMs, K key, Object token) { queue.add(new Due<>(atMs, key, token)); }\n\n    /** Everything due at or before now, oldest first. Stops at the first key that is not due yet. */\n    List<Due<K>> drainDue(long nowMs) {\n        List<Due<K>> out = new ArrayList<>();\n        while (true) {\n            Due<K> head = queue.peek();\n            if (head == null || head.atMs() > nowMs) return out;\n            Due<K> taken = queue.poll();\n            if (taken != null) out.add(taken);\n        }\n    }\n    int size() { return queue.size(); }\n}\n\n// ---- ext: sharding -- N sub-caches, N sweepers, one facade, when one map's bins stop being enough\n/**\n * The last rung. Each shard is a whole TtlCache with its own map and its own sweeper, and a key belongs to\n * exactly one shard, so a sweep of one shard never walks another shard's keys and resizing one map never\n * pauses the others. Shard count is a power of two so the index is a mask, not a modulo.\n */\nfinal class ShardedTtlCache<K, V> implements Cache<K, V> {\n    private final List<TtlCache<K, V>> shards = new ArrayList<>();\n    private final int mask;\n\n    ShardedTtlCache(int shardCount, long ttlMs, Clock clock) {\n        if (Integer.bitCount(shardCount) != 1) throw new IllegalArgumentException(\"shard count must be a power of two\");\n        this.mask = shardCount - 1;\n        for (int i = 0; i < shardCount; i++) {\n            TtlCache<K, V> s = new TtlCache<>(ttlMs);\n            s.configure(new FixedTtl<>(ttlMs), clock);\n            shards.add(s);\n        }\n    }\n\n    /** The shard a key belongs to. Spread the hash first, the way ConcurrentHashMap does. */\n    private TtlCache<K, V> shardFor(K key) {\n        int h = key.hashCode();\n        h ^= (h >>> 16);\n        return shards.get(h & mask);\n    }\n\n    public void put(K key, V value) { shardFor(key).put(key, value); }\n    public V get(K key) { return shardFor(key).get(key); }\n    public V getOrLoad(K key, Loader<K, V> loader) { return shardFor(key).getOrLoad(key, loader); }\n    public V getOrLoad(K key, Loader<K, V> loader, long timeoutMs) throws TimeoutException, InterruptedException {\n        return shardFor(key).getOrLoad(key, loader, timeoutMs);\n    }\n    public boolean invalidate(K key) { return shardFor(key).invalidate(key); }\n    /** The sum of the shards. Approximate under writes, like every size() on a concurrent structure. */\n    public int size() { int n = 0; for (TtlCache<K, V> s : shards) n += s.size(); return n; }\n    /** One sweeper thread per shard: the passes are independent and never queue behind each other. */\n    void startSweepers(long everyMs) { for (TtlCache<K, V> s : shards) s.startSweeper(everyMs); }\n    void close() { for (TtlCache<K, V> s : shards) s.close(); }\n}\n\n// ---- ext: the naive cache, so both bugs can be seen side by side with the real one\n/**\n * What the same design looks like when the two invariants are not defended: one global lock, expiry\n * removed by key instead of by entry, and no claim on a load. It is here to be measured, not copied.\n */\nfinal class NaiveCache<K, V> {\n    private final Map<K, Object[]> map = new HashMap<>();     // {value, deadline}\n    private final Clock clock;\n    NaiveCache(Clock clock) { this.clock = clock; }\n\n    /** Check-then-act with nothing holding the key: every thread that misses runs the loader. */\n    @SuppressWarnings(\"unchecked\")\n    V getOrLoad(K key, Loader<K, V> loader, long ttlMs) {\n        synchronized (this) {\n            Object[] e = map.get(key);\n            if (e != null && clock.nowMs() < (Long) e[1]) return (V) e[0];\n        }\n        V loaded = loader.load(key);                           // outside the lock, and therefore unclaimed\n        synchronized (this) { map.put(key, new Object[]{loaded, clock.nowMs() + ttlMs}); }\n        return loaded;\n    }\n\n    /** remove(key), not remove(key, entry): this is the line that deletes a value somebody just refreshed. */\n    @SuppressWarnings(\"unchecked\")\n    V getAndExpire(K key) {\n        synchronized (this) {\n            Object[] e = map.get(key);\n            if (e == null) return null;\n            if (clock.nowMs() < (Long) e[1]) return (V) e[0];\n            map.remove(key);\n            return null;\n        }\n    }\n    synchronized void put(K key, V value, long ttlMs) { map.put(key, new Object[]{value, clock.nowMs() + ttlMs}); }\n    synchronized int size() { return map.size(); }\n}\n\n// ---- ext: why not computeIfAbsent -- the bin lock is held for the whole loader call\n/**\n * computeIfAbsent looks like single-flight for free, and for a fast function it is. For a slow loader it is\n * a trap: the bin's lock is held for the whole call, so every other key that hashes to that bin blocks\n * behind a database round trip. Worse, a loader that touches the same map is refused outright.\n * This method proves the second half, which the JDK detects and reports as \"Recursive update\".\n */\nfinal class ComputeIfAbsentTrap {\n    /** Two keys forced into the same bin by a constant hash, so the nested write is detected, not silent. */\n    record SameBin(String id) {\n        public int hashCode() { return 7; }\n    }\n\n    /** Returns what the JDK did when a loader inside computeIfAbsent touched the same map. */\n    static String probe() {\n        ConcurrentHashMap<SameBin, String> map = new ConcurrentHashMap<>();\n        try {\n            map.computeIfAbsent(new SameBin(\"a\"), k -> {\n                map.put(new SameBin(\"b\"), \"written from inside the mapping function\");\n                return \"value\";\n            });\n            return \"no error: the JDK allowed the nested write (bin layout dependent)\";\n        } catch (IllegalStateException ise) {\n            return \"IllegalStateException: \" + ise.getMessage();\n        }\n    }\n}\n\n// ---- ext: the monitor version -- the same single-flight in wait/notify, and a lost wakeup reproduced\n/**\n * The same \"one loader per key\" written the old way, with a monitor instead of a future, because an\n * interviewer on a multi-threading round will ask for it. The protocol has three parts and all three are\n * load-bearing: take the lock, test the condition UNDER the lock, and wait in a LOOP, never an if. The\n * winner changes the state first and signals second, inside the same monitor, so a waiter can only be\n * either before the change (it waits, and the notifyAll reaches it) or after it (done is already true and\n * it never waits at all). Delete the done flag and you have a lost wakeup; replace the while with an if\n * and a spurious wakeup -- a wait() that returns with nobody having signalled, which the JVM is allowed to\n * do -- hands the caller a null. The future version in Main.java has neither hole, because a completed\n * future is a latch and not an edge: joining one that has already completed returns immediately.\n */\nfinal class MonitorSingleFlight<K, V> {\n    /** One per load in flight. Every field is guarded by the slot's own monitor. */\n    private static final class Slot<V> {\n        boolean done;\n        V value;\n        RuntimeException failure;\n    }\n    private final ConcurrentHashMap<K, Slot<V>> slots = new ConcurrentHashMap<>();\n    private final ConcurrentHashMap<K, V> values = new ConcurrentHashMap<>();\n    private final LongAdder loads = new LongAdder();\n\n    /** One loader call per key, however many threads arrive; every waiter gets the winner's answer. */\n    V get(K key, Loader<K, V> loader) throws InterruptedException {\n        V cached = values.get(key);\n        if (cached != null) return cached;\n        Slot<V> mine = new Slot<>();\n        Slot<V> running = slots.putIfAbsent(key, mine);\n        if (running == null) {                                   // this thread won the claim: it loads\n            V value = null; RuntimeException failure = null;\n            try { loads.increment(); value = loader.load(key); values.put(key, value); }\n            catch (RuntimeException re) { failure = re; }\n            finally {\n                slots.remove(key, mine);\n                synchronized (mine) {                            // change the state and signal, same monitor\n                    mine.value = value; mine.failure = failure; mine.done = true;\n                    mine.notifyAll();\n                }\n            }\n            if (failure != null) throw failure;\n            return value;\n        }\n        synchronized (running) {                                 // a loser: the wait protocol, all three parts\n            while (!running.done) running.wait();\n        }\n        if (running.failure != null) throw running.failure;\n        return running.value;\n    }\n\n    long loads() { return loads.sum(); }\n\n    /**\n     * A lost wakeup, reproduced and then made survivable. The waiter is held until the signal has already\n     * been sent, so the notifyAll it is waiting for is gone before it ever waits. With no flag to test there\n     * is nothing in the code that can notice, and the only reason this method returns at all is that the\n     * wait is timed. This is the bug the done flag above exists to make impossible.\n     */\n    static String lostWakeup() throws InterruptedException {\n        Object monitor = new Object();\n        CountDownLatch signalSent = new CountDownLatch(1);\n        Thread signaller = new Thread(() -> {\n            synchronized (monitor) { monitor.notifyAll(); }\n            signalSent.countDown();\n        }, \"signaller\");\n        signaller.start();\n        signalSent.await();                                      // the signal is already spent\n        long t0 = System.nanoTime();\n        synchronized (monitor) { monitor.wait(200); }            // no condition to test: nothing can know\n        long waitedMs = (System.nanoTime() - t0) / 1_000_000L;\n        signaller.join();\n        return waitedMs >= 150\n            ? \"the signal was missed: this wait ended on its 200ms timeout, not on a notify\"\n            : \"the wait ended after \" + waitedMs + \"ms, so the signal was not missed\";\n    }\n}\n\n// ---- ext: two processes -- Redis, and how an invalidation travels between them\n/**\n * The moment there are two servers, an in-process cache is two caches, and a write on one leaves the other\n * one stale. Three moves, in the order you would make them: put the entries in Redis with the TTL as\n * part of the write; keep the in-process cache as a short-lived layer in front of it; and publish an\n * invalidation so the other process drops its copy. The claim becomes a Redis lock with its own TTL.\n */\nfinal class RemoteCacheSketch {\n    /** The write, with the deadline handed to the store rather than tracked here. */\n    static String writeCommand(String key, String value, long ttlMs) {\n        return \"SET \" + key + \" \" + value + \" PX \" + ttlMs;\n    }\n    /** The distributed claim: one loader per key across the whole fleet, and the claim itself expires. */\n    static String claimCommand(String key, String owner, long leaseMs) {\n        return \"SET lock:\" + key + \" \" + owner + \" NX PX \" + leaseMs;\n    }\n    /** What the other process must hear when a row changes, so its own copy is dropped. */\n    static String invalidateCommand(String key) {\n        return \"PUBLISH cache:invalidate \" + key;\n    }\n    /** The listener on the other side. Local drop only; the row in Redis is already correct. */\n    static void onInvalidation(Cache<String, String> local, String key) { local.invalidate(key); }\n}\n\n/** Runs every extension above so none of them can rot. */\nclass ExtDemo {\n    public static void main(String[] args) throws Exception {\n        ManualClock clock = new ManualClock();\n\n        // TTL by prefix, from config\n        TtlRules rules = TtlRules.parse(\"user:=300000, price:=2000, =60000\");\n        System.out.println(\"TTL rules: user:42=\" + rules.ttlMsFor(\"user:42\") + \"ms  price:AAPL=\"\n            + rules.ttlMsFor(\"price:AAPL\") + \"ms  other=\" + rules.ttlMsFor(\"misc\") + \"ms\");\n\n        // jitter: the same nominal TTL, spread\n        TtlPolicy<String> jittered = new JitteredTtl<>(new FixedTtl<>(60_000), 20);\n        long lo = Long.MAX_VALUE, hi = 0;\n        for (int i = 0; i < 1000; i++) { long t = jittered.ttlMsFor(\"k\"); lo = Math.min(lo, t); hi = Math.max(hi, t); }\n        System.out.println(\"jitter:    1000 keys with a 60000ms TTL land between \" + lo + \"ms and \" + hi + \"ms\");\n\n        // refresh-ahead: after the soft deadline the caller is served instantly and one reload runs behind it\n        TtlCache<String, String> ra = new TtlCache<>(10_000);\n        ra.configure(new FixedTtl<>(10_000), clock);\n        AtomicInteger raLoads = new AtomicInteger();\n        Loader<String, String> counting = k -> \"v\" + raLoads.incrementAndGet();\n        RefreshAhead<String, String> ahead = new RefreshAhead<>(ra, 4_000, clock);\n        System.out.println(\"refresh:   first read = \" + ahead.get(\"hot\", counting) + \" (a real load)\");\n        clock.advance(5_000);\n        System.out.println(\"refresh:   read past the soft deadline = \" + ahead.get(\"hot\", counting) + \" (served at once)\");\n        ahead.quiet(2_000);\n        System.out.println(\"refresh:   after the background reload = \" + ra.get(\"hot\") + \", loads = \" + raLoads.get());\n        ahead.close();\n\n        // negative caching\n        TtlCache<String, String> present = new TtlCache<>(60_000); present.configure(new FixedTtl<>(60_000), clock);\n        TtlCache<String, Boolean> absent = new TtlCache<>(5_000);  absent.configure(new FixedTtl<>(5_000), clock);\n        AtomicInteger queries = new AtomicInteger();\n        NegativeCache<String, String> neg = new NegativeCache<>(present, absent);\n        Loader<String, String> maybe = k -> { queries.incrementAndGet(); return k.equals(\"real\") ? \"row\" : null; };\n        for (int i = 0; i < 5; i++) neg.get(\"ghost\", maybe);\n        System.out.println(\"negative:  five lookups of a key that does not exist -> \" + queries.get() + \" query\");\n\n        // a size bound on top of the TTL cache: oldest write leaves, because nothing here tracks reads\n        TtlCache<String, String> inner = new TtlCache<>(60_000); inner.configure(new FixedTtl<>(60_000), clock);\n        BoundedTtlCache<String, String> bounded = new BoundedTtlCache<>(inner, 2);\n        bounded.put(\"a\", \"1\"); bounded.put(\"b\", \"2\");\n        bounded.get(\"a\");                                         // a read changes no ordering: this is FIFO\n        bounded.put(\"c\", \"3\");                                    // over the bound: the oldest write, a, is the victim\n        System.out.println(\"bounded:   a=\" + bounded.get(\"a\") + \" b=\" + bounded.get(\"b\") + \" c=\" + bounded.get(\"c\")\n            + \"  size=\" + inner.size());\n\n        // metrics and a timed loader\n        TtlCache<String, String> metered = new TtlCache<>(1_000);\n        metered.configure(new FixedTtl<>(1_000), clock);\n        CacheMetrics<String, String> metrics = new CacheMetrics<>();\n        metered.addListener(metrics);\n        TimedLoader<String, String> timed = new TimedLoader<>(k -> \"row-\" + k);\n        metered.getOrLoad(\"m1\", timed);\n        metered.put(\"m1\", \"overwritten\");\n        clock.advance(2_000);\n        metered.sweepOnce();\n        metered.invalidate(\"nothing-here\");\n        System.out.println(\"metrics:   \" + metrics + \", loader calls = \" + timed.calls()\n            + \", average \" + timed.averageMicros() + \"us\");\n\n        // a loader that hangs, bounded by a decorator instead of by the cache\n        BoundedLoader<String, String> bl = new BoundedLoader<>(k -> {\n            try { Thread.sleep(5_000); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n            return \"never\";\n        }, 150);\n        try { bl.load(\"stuck\"); System.out.println(\"timeout:   no timeout (unexpected)\"); }\n        catch (IllegalStateException e) { System.out.println(\"timeout:   \" + e.getMessage()); }\n        bl.close();\n\n        // the deadline queue: a pass touches only what actually died\n        DeadlineQueue<String> due = new DeadlineQueue<>();\n        for (int i = 0; i < 10_000; i++) due.schedule(1_000_000 + i, \"k\" + i, new Object());\n        System.out.println(\"deadlines: queued \" + due.size() + \", due by t=1000004 -> \" + due.drainDue(1_000_004).size()\n            + \" (the other \" + due.size() + \" were never looked at)\");\n\n        // sharding\n        ShardedTtlCache<String, String> sharded = new ShardedTtlCache<>(8, 60_000, clock);\n        for (int i = 0; i < 1_000; i++) sharded.put(\"k\" + i, \"v\" + i);\n        System.out.println(\"sharded:   8 shards hold \" + sharded.size() + \" entries, k500=\" + sharded.get(\"k500\"));\n        sharded.close();\n\n        // the naive cache, measured against the real one\n        AtomicInteger naiveLoads = new AtomicInteger(), realLoads = new AtomicInteger();\n        NaiveCache<String, String> naive = new NaiveCache<>(new SystemClock());\n        TtlCache<String, String> real = new TtlCache<>(60_000);\n        real.configure(new FixedTtl<>(60_000), new SystemClock());\n        ExecutorService pool = Executors.newFixedThreadPool(16);\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<?>> fs = new ArrayList<>();\n        for (int i = 0; i < 40; i++) {\n            fs.add(pool.submit(() -> { go.await(); return naive.getOrLoad(\"cold\", k -> {\n                naiveLoads.incrementAndGet(); try { Thread.sleep(30); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); } return \"v\"; }, 60_000); }));\n            fs.add(pool.submit(() -> { go.await(); return real.getOrLoad(\"cold\", k -> {\n                realLoads.incrementAndGet(); try { Thread.sleep(30); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); } return \"v\"; }); }));\n        }\n        go.countDown();\n        for (Future<?> f : fs) f.get(20, TimeUnit.SECONDS);\n        pool.shutdown(); pool.awaitTermination(10, TimeUnit.SECONDS);\n        System.out.println(\"naive:     40 threads, one cold key -> naive loads = \" + naiveLoads.get()\n            + \", single-flight loads = \" + realLoads.get());\n\n        // computeIfAbsent, and what the JDK thinks of a loader that touches the same map\n        System.out.println(\"cIA:       \" + ComputeIfAbsentTrap.probe());\n\n        // the monitor version of the same single-flight, and the lost wakeup it is built to prevent\n        MonitorSingleFlight<String, String> monitor = new MonitorSingleFlight<>();\n        AtomicInteger monitorLoads = new AtomicInteger();\n        ExecutorService mpool = Executors.newFixedThreadPool(30);\n        CountDownLatch mgo = new CountDownLatch(1);\n        List<Future<String>> mfs = new ArrayList<>();\n        for (int i = 0; i < 30; i++) mfs.add(mpool.submit(() -> { mgo.await(); return monitor.get(\"cold\", k -> {\n            monitorLoads.incrementAndGet();\n            try { Thread.sleep(30); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n            return \"v\"; }); }));\n        mgo.countDown();\n        for (Future<String> f : mfs) f.get(20, TimeUnit.SECONDS);\n        mpool.shutdown(); mpool.awaitTermination(10, TimeUnit.SECONDS);\n        System.out.println(\"monitor:   30 threads with wait/notify -> loads = \" + monitorLoads.get()\n            + \" (the future version in Main.java does the same job with no monitor at all)\");\n        System.out.println(\"wakeup:    \" + MonitorSingleFlight.lostWakeup());\n\n        // two processes\n        System.out.println(\"remote:    \" + RemoteCacheSketch.writeCommand(\"user:42\", \"row\", 60_000));\n        System.out.println(\"remote:    \" + RemoteCacheSketch.claimCommand(\"user:42\", \"server-3\", 5_000));\n        System.out.println(\"remote:    \" + RemoteCacheSketch.invalidateCommand(\"user:42\"));\n        real.close(); inner.close(); metered.close(); present.close(); absent.close(); ra.close();\n    }\n}\n", "f2": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\nimport java.util.function.*;\n\n/**\n * Thirteen claims from page 02, move 9, each proved here. Time is injected everywhere except the tests\n * whose whole point is that real threads really run, and every wait has a deadline, so a broken design\n * fails a test instead of hanging it. The whole file finishes in under a second.\n */\npublic class FailureTests {\n    static int failures = 0;\n    static void check(boolean ok, String what) {\n        System.out.println((ok ? \"PASS \" : \"FAIL \") + what);\n        if (!ok) failures++;\n    }\n\n    /** Wait for a condition instead of sleeping a guessed number of milliseconds. Never waits forever. */\n    static boolean waitUntil(BooleanSupplier condition, long timeoutMs) {\n        long end = System.nanoTime() + timeoutMs * 1_000_000L;\n        while (!condition.getAsBoolean()) {\n            if (System.nanoTime() > end) return false;\n            try { Thread.sleep(1); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); return false; }\n        }\n        return true;\n    }\n\n    public static void main(String[] args) throws Exception {\n\n        // 1. an expired value is never handed back, and the read that finds it dead reclaims it\n        ManualClock clock = new ManualClock();\n        TtlCache<String, String> c = new TtlCache<>(100);\n        c.configure(new FixedTtl<>(100), clock);\n        List<RemovalCause> seen = Collections.synchronizedList(new ArrayList<>());\n        c.addListener((k, v, cause) -> seen.add(cause));\n\n        c.put(\"k\", \"v1\");\n        check(\"v1\".equals(c.get(\"k\")), \"a fresh value reads back\");\n        clock.advance(99);\n        check(\"v1\".equals(c.get(\"k\")), \"one millisecond before the deadline it is still served\");\n        clock.advance(1);\n        check(c.get(\"k\") == null, \"at the deadline the value is gone: an expired value is never returned\");\n        check(c.size() == 0, \"the read that found it dead reclaimed the entry, so nothing leaks\");\n        check(seen.equals(List.of(RemovalCause.EXPIRED)), \"and the listener heard EXPIRED exactly once\");\n\n        // a TTL of zero means do not cache: the caller still gets a value, the cache stores nothing\n        TtlCache<String, String> nocache = new TtlCache<>(0);\n        nocache.configure(new FixedTtl<>(0), clock);\n        AtomicInteger zeroLoads = new AtomicInteger();\n        for (int i = 0; i < 5; i++)\n            nocache.getOrLoad(\"k\", key -> { zeroLoads.incrementAndGet(); return \"fresh\"; });\n        check(zeroLoads.get() == 5 && nocache.size() == 0, \"TTL 0 means do not cache: 5 calls, 5 loads, 0 entries\");\n        nocache.put(\"k\", \"v\");\n        check(nocache.size() == 0, \"and put with TTL 0 stores nothing rather than storing something born dead\");\n\n        // 2. the sweeper reclaims what died and leaves every live entry exactly where it was\n        ManualClock clock2 = new ManualClock();\n        TtlCache<String, String> c2 = new TtlCache<>(1_000);\n        c2.configure(key -> key.startsWith(\"short\") ? 50 : 5_000, clock2);\n        c2.put(\"short1\", \"a\"); c2.put(\"short2\", \"b\"); c2.put(\"long1\", \"c\"); c2.put(\"long2\", \"d\");\n        clock2.advance(100);\n        check(c2.sweepOnce() == 2, \"one pass reclaimed exactly the two entries that died\");\n        check(c2.size() == 2 && c2.liveSize() == 2, \"the two live entries are untouched\");\n        check(\"c\".equals(c2.get(\"long1\")) && \"d\".equals(c2.get(\"long2\")), \"and they still read back correctly\");\n        check(c2.sweepOnce() == 0, \"a second pass over the same map removes nothing\");\n\n        // 3. the identity check: a value refreshed while the sweeper was looking at the old one survives.\n        //    The injected clock is the seam: the sweeper reads the clock between picking the entry up and\n        //    removing it, so a clock that writes at that instant reproduces the race exactly, every run.\n        ManualClock clock3 = new ManualClock();\n        TtlCache<String, String> c3 = new TtlCache<>(100);\n        AtomicBoolean armed = new AtomicBoolean(false);\n        c3.configure(new FixedTtl<>(100), () -> {\n            long now = clock3.nowMs();\n            if (armed.compareAndSet(true, false)) c3.put(\"k\", \"refreshed\");   // the concurrent write\n            return now;\n        });\n        c3.put(\"k\", \"stale\");\n        clock3.advance(200);                     // \"stale\" is now past its deadline\n        armed.set(true);                         // the refresh lands inside the sweeper's own clock read\n        check(c3.sweepOnce() == 0, \"the sweeper removed nothing: the entry it held was not the entry in the map\");\n        check(\"refreshed\".equals(c3.get(\"k\")), \"the refreshed value survived a sweep already looking at that key\");\n        check(c3.sweptCount.sum() == 0, \"and nothing was reported as swept\");\n\n        // the same race on the read path: get() must compare-and-remove, not remove by key\n        ManualClock clock4 = new ManualClock();\n        TtlCache<String, String> c4 = new TtlCache<>(100);\n        AtomicBoolean armed2 = new AtomicBoolean(false);\n        c4.configure(new FixedTtl<>(100), () -> {\n            long now = clock4.nowMs();\n            if (armed2.compareAndSet(true, false)) c4.put(\"k\", \"refreshed\");\n            return now;\n        });\n        c4.put(\"k\", \"stale\");\n        clock4.advance(200);\n        armed2.set(true);\n        check(c4.get(\"k\") == null, \"the reader that found a dead entry reports a miss, as it should\");\n        check(\"refreshed\".equals(c4.get(\"k\")), \"but it did not delete the value another thread had just written\");\n\n        // 4. fifty threads miss one cold key at the same instant: the loader runs exactly once.\n        //    The loader does not return until all forty-nine losers are provably waiting on it, so the\n        //    count is the same on a fast laptop and a loaded build box.\n        ExecutorService pool = Executors.newFixedThreadPool(50);\n        TtlCache<String, String> hot = new TtlCache<>(60_000);\n        hot.configure(new FixedTtl<>(60_000), new SystemClock());\n        AtomicInteger calls = new AtomicInteger();\n        Loader<String, String> slow = key -> {\n            calls.incrementAndGet();\n            waitUntil(() -> hot.joins.sum() >= 49, 15_000);      // every other thread is now inside the wait\n            return \"row-\" + key;\n        };\n        CountDownLatch go = new CountDownLatch(1);\n        List<Future<String>> answers = new ArrayList<>();\n        for (int i = 0; i < 50; i++)\n            answers.add(pool.submit(() -> { go.await(); return hot.getOrLoad(\"user:42\", slow); }));\n        go.countDown();\n        Set<String> distinct = new HashSet<>();\n        for (Future<String> f : answers) distinct.add(f.get(30, TimeUnit.SECONDS));\n        check(calls.get() == 1, \"50 threads, one cold key, exactly 1 call to the loader (was \" + calls.get() + \")\");\n        check(distinct.equals(Set.of(\"row-user:42\")), \"and all 50 threads got the same value\");\n        check(hot.joins.sum() == 49, \"the other 49 rode the winner's result instead of loading\");\n        check(hot.size() == 1, \"and exactly one entry was stored\");\n\n        // 5. the claim is per key, not one global gate: ten cold keys mean ten loads, and they overlap.\n        //    All ten loaders are inside the loader at the same moment here -- that is what lets the\n        //    barrier below be reached at all -- so this also proves nothing serialises across keys.\n        TtlCache<String, String> many = new TtlCache<>(60_000);\n        many.configure(new FixedTtl<>(60_000), new SystemClock());\n        AtomicInteger keyCalls = new AtomicInteger();\n        Loader<String, String> counted = key -> {\n            keyCalls.incrementAndGet();\n            waitUntil(() -> many.joins.sum() >= 40, 15_000);\n            return \"v-\" + key;\n        };\n        CountDownLatch go2 = new CountDownLatch(1);\n        List<Future<String>> got = new ArrayList<>();\n        for (int i = 0; i < 50; i++) {\n            final String key = \"k\" + (i % 10);\n            got.add(pool.submit(() -> { go2.await(); return many.getOrLoad(key, counted); }));\n        }\n        go2.countDown();\n        for (Future<String> f : got) f.get(30, TimeUnit.SECONDS);\n        check(keyCalls.get() == 10, \"50 threads over 10 cold keys, exactly 10 loads (was \" + keyCalls.get() + \")\");\n        check(many.joins.sum() == 40, \"the other 40 rode one of those ten loads\");\n        check(many.size() == 10, \"and ten entries were stored\");\n\n        // the counterfactual: the same race with no claim runs the loader once per thread that misses\n        NaiveCache<String, String> naive = new NaiveCache<>(new SystemClock());\n        AtomicInteger naiveCalls = new AtomicInteger();\n        CountDownLatch go3 = new CountDownLatch(1);\n        List<Future<String>> naiveGot = new ArrayList<>();\n        for (int i = 0; i < 40; i++)\n            naiveGot.add(pool.submit(() -> { go3.await(); return naive.getOrLoad(\"cold\", k -> {\n                naiveCalls.incrementAndGet();\n                try { Thread.sleep(60); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n                return \"v\";\n            }, 60_000); }));\n        go3.countDown();\n        for (Future<String> f : naiveGot) f.get(30, TimeUnit.SECONDS);\n        check(naiveCalls.get() >= 10, \"the same race without a claim hammered the loader \" + naiveCalls.get() + \" times\");\n\n        // 6. a loader that throws: nothing is stored, every waiter is told, and the next caller can retry\n        TtlCache<String, String> broken = new TtlCache<>(60_000);\n        broken.configure(new FixedTtl<>(60_000), new SystemClock());\n        AtomicInteger brokenCalls = new AtomicInteger();\n        Loader<String, String> throwing = key -> {\n            brokenCalls.incrementAndGet();\n            waitUntil(() -> broken.joins.sum() >= 19, 15_000);\n            throw new IllegalStateException(\"the database is down\");\n        };\n        CountDownLatch go4 = new CountDownLatch(1);\n        List<Future<String>> attempts = new ArrayList<>();\n        for (int i = 0; i < 20; i++)\n            attempts.add(pool.submit(() -> { go4.await(); return broken.getOrLoad(\"down\", throwing); }));\n        go4.countDown();\n        int failed = 0;\n        for (Future<String> f : attempts) {\n            try { f.get(30, TimeUnit.SECONDS); }\n            catch (ExecutionException ee) { if (ee.getCause() instanceof IllegalStateException) failed++; }\n        }\n        check(failed == 20, \"all 20 callers were told the load failed (\" + failed + \")\");\n        check(brokenCalls.get() == 1, \"and only one of them actually called the broken loader\");\n        check(broken.size() == 0, \"a failed load stored nothing: the key is not poisoned with a bad value\");\n        check(\"recovered\".equals(broken.getOrLoad(\"down\", key -> \"recovered\")), \"the very next caller loads cleanly\");\n\n        // 7. a slow load of one key blocks nothing else: there is no lock of our own anywhere\n        TtlCache<String, String> free = new TtlCache<>(60_000);\n        free.configure(new FixedTtl<>(60_000), new SystemClock());\n        CountDownLatch holdTheLoader = new CountDownLatch(1);\n        CountDownLatch loaderStarted = new CountDownLatch(1);\n        Future<String> stuck = pool.submit(() -> free.getOrLoad(\"slow\", key -> {\n            loaderStarted.countDown();\n            try { holdTheLoader.await(20, TimeUnit.SECONDS); }\n            catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n            return \"slow-value\";\n        }));\n        check(loaderStarted.await(10, TimeUnit.SECONDS), \"the slow loader is running and has not returned\");\n        Future<String> other = pool.submit(() -> {\n            free.put(\"other\", \"written while the slow load is in flight\");\n            return free.getOrLoad(\"fast\", key -> \"fast-value\");\n        });\n        check(\"fast-value\".equals(other.get(10, TimeUnit.SECONDS)),\n              \"another key was written and loaded while the slow load was still in flight\");\n        check(\"written while the slow load is in flight\".equals(free.get(\"other\")), \"and that write is visible\");\n        holdTheLoader.countDown();\n        check(\"slow-value\".equals(stuck.get(20, TimeUnit.SECONDS)), \"the slow load then finished normally\");\n\n        // 8. a listener that throws cannot break anything, and every removal reports the right reason\n        ManualClock clock8 = new ManualClock();\n        TtlCache<String, String> noisy = new TtlCache<>(100);\n        noisy.configure(new FixedTtl<>(100), clock8);\n        List<RemovalCause> causes = Collections.synchronizedList(new ArrayList<>());\n        noisy.addListener((k, v, cause) -> { throw new RuntimeException(\"the metrics client is down\"); });\n        noisy.addListener((k, v, cause) -> causes.add(cause));\n        noisy.put(\"a\", \"1\");\n        noisy.put(\"a\", \"2\");                                               // REPLACED\n        check(\"2\".equals(noisy.get(\"a\")), \"the put landed although the first listener threw\");\n        clock8.advance(200);\n        check(noisy.get(\"a\") == null, \"the expired read still worked\");     // EXPIRED\n        noisy.put(\"b\", \"1\");\n        clock8.advance(200);\n        check(noisy.sweepOnce() == 1, \"the sweep still worked\");            // SWEPT\n        noisy.put(\"c\", \"1\");\n        check(noisy.invalidate(\"c\"), \"the explicit removal still worked\");  // EXPLICIT\n        check(causes.equals(List.of(RemovalCause.REPLACED, RemovalCause.EXPIRED, RemovalCause.SWEPT, RemovalCause.EXPLICIT)),\n              \"every removal reported its reason, in order: \" + causes);\n\n        // 9. the background sweeper really runs: a real thread, a real clock, and a bounded wait\n        TtlCache<String, String> swept = new TtlCache<>(30);\n        swept.configure(new FixedTtl<>(30), new SystemClock());\n        CountDownLatch reclaimed = new CountDownLatch(1);\n        swept.addListener((k, v, cause) -> { if (cause == RemovalCause.SWEPT) reclaimed.countDown(); });\n        swept.put(\"ghost\", \"nobody will ever read me again\");\n        swept.startSweeper(20);\n        check(reclaimed.await(15, TimeUnit.SECONDS), \"the background sweeper reclaimed a key nobody ever read again\");\n        check(swept.size() == 0, \"and the map is empty afterwards\");\n        swept.close();\n        swept.put(\"after\", \"stored with the sweeper stopped\");\n        check(\"stored with the sweeper stopped\".equals(swept.get(\"after\")),\n              \"the cache still works with the sweeper shut down: expiry on read never needed it\");\n\n        // 10. a waiter does not have to wait forever. The deadline belongs to the WAIT, never to the load:\n        //     the thread that is running the loader is not cut off by somebody else's impatience.\n        TtlCache<String, String> wedged = new TtlCache<>(60_000);\n        wedged.configure(new FixedTtl<>(60_000), new SystemClock());\n        CountDownLatch releaseLoader = new CountDownLatch(1), loaderIn = new CountDownLatch(1);\n        Future<String> holder = pool.submit(() -> wedged.getOrLoad(\"k\", key -> {\n            loaderIn.countDown();\n            try { releaseLoader.await(20, TimeUnit.SECONDS); }\n            catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n            return \"eventually\";\n        }));\n        check(loaderIn.await(10, TimeUnit.SECONDS), \"the winner is inside the loader and has not returned\");\n        long waitStart = System.nanoTime();\n        boolean gaveUp = false;\n        try { wedged.getOrLoad(\"k\", key -> \"never called\", 120); }\n        catch (TimeoutException te) { gaveUp = true; }\n        long waitedMs = (System.nanoTime() - waitStart) / 1_000_000L;\n        check(gaveUp, \"a waiter with a 120ms deadline gave up instead of waiting out the load\");\n        check(waitedMs < 5_000, \"it gave up on its own deadline, not when the load finished (\" + waitedMs + \"ms)\");\n        check(wedged.loadCalls.sum() == 1, \"and giving up did not start a second load\");\n        releaseLoader.countDown();\n        check(\"eventually\".equals(holder.get(20, TimeUnit.SECONDS)), \"the winner's own load was never cut off\");\n        check(\"eventually\".equals(wedged.get(\"k\")), \"and the value it loaded is in the cache\");\n\n        // 11. a waiter that is cancelled. The bounded form answers an interrupt instead of swallowing it,\n        //     and the thread that was loading is not disturbed by it.\n        TtlCache<String, String> cancelled = new TtlCache<>(60_000);\n        cancelled.configure(new FixedTtl<>(60_000), new SystemClock());\n        CountDownLatch releaseSlow = new CountDownLatch(1), slowIn = new CountDownLatch(1);\n        Future<String> slowWinner = pool.submit(() -> cancelled.getOrLoad(\"c\", key -> {\n            slowIn.countDown();\n            try { releaseSlow.await(20, TimeUnit.SECONDS); }\n            catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n            return \"done\";\n        }));\n        check(slowIn.await(10, TimeUnit.SECONDS), \"the slow loader is running and is holding the claim\");\n        AtomicBoolean sawInterrupt = new AtomicBoolean(false);\n        Thread waiter = new Thread(() -> {\n            try { cancelled.getOrLoad(\"c\", key -> \"never called\", 20_000); }\n            catch (InterruptedException ie) { sawInterrupt.set(true); }\n            catch (TimeoutException te) { /* a different failure; the check below catches it */ }\n        }, \"waiter\");\n        waiter.start();\n        check(waitUntil(() -> cancelled.joins.sum() >= 1, 10_000), \"a second thread is waiting on that claim\");\n        waiter.interrupt();\n        waiter.join(10_000);\n        check(sawInterrupt.get(), \"the interrupted waiter threw InterruptedException instead of waiting on\");\n        check(!waiter.isAlive(), \"and its thread finished rather than hanging behind a wedged load\");\n        releaseSlow.countDown();\n        check(\"done\".equals(slowWinner.get(20, TimeUnit.SECONDS)), \"the loading thread was untouched by that interrupt\");\n\n        // 12. the retry loop terminates. With a TTL shorter than a load, a waiter is woken with a value that\n        //     has already died, so it goes round again -- and every round either serves or loads, never spins.\n        //     The clock is the seam again: this one is five milliseconds later every time it is read, which\n        //     makes \"the value died before the waiters woke\" happen on every run instead of once in a while.\n        AtomicLong fastForward = new AtomicLong(1_000_000L);\n        TtlCache<String, String> tiny = new TtlCache<>(1);\n        tiny.configure(new FixedTtl<>(1), () -> fastForward.addAndGet(5));\n        AtomicInteger tinyLoads = new AtomicInteger();\n        Loader<String, String> slowish = key -> {\n            tinyLoads.incrementAndGet();\n            try { Thread.sleep(10); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n            return \"v\";\n        };\n        CountDownLatch go5 = new CountDownLatch(1);\n        List<Future<String>> tinyGot = new ArrayList<>();\n        for (int i = 0; i < 10; i++)\n            tinyGot.add(pool.submit(() -> { go5.await(); return tiny.getOrLoad(\"hot\", slowish); }));\n        go5.countDown();\n        int served = 0;\n        for (Future<String> f : tinyGot) if (\"v\".equals(f.get(30, TimeUnit.SECONDS))) served++;\n        check(served == 10, \"all 10 callers returned a value although every value died before they woke\");\n        check(tinyLoads.get() >= 2 && tinyLoads.get() <= 10,\n              \"the loads stayed bounded by the thread count: \" + tinyLoads.get() + \" loads for 10 callers\");\n        check(tiny.staleJoins.sum() > 0, \"the retry loop really ran: \" + tiny.staleJoins.sum() + \" waiters woke to a dead value\");\n\n        // 13. the same wait protocol written with a monitor, and the lost wakeup the done flag prevents\n        MonitorSingleFlight<String, String> monitor = new MonitorSingleFlight<>();\n        AtomicInteger monitorLoads = new AtomicInteger();\n        CountDownLatch go6 = new CountDownLatch(1);\n        List<Future<String>> mon = new ArrayList<>();\n        for (int i = 0; i < 30; i++)\n            mon.add(pool.submit(() -> { go6.await(); return monitor.get(\"cold\", k -> {\n                monitorLoads.incrementAndGet();\n                try { Thread.sleep(30); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n                return \"m\"; }); }));\n        go6.countDown();\n        Set<String> monAnswers = new HashSet<>();\n        for (Future<String> f : mon) monAnswers.add(f.get(30, TimeUnit.SECONDS));\n        check(monitorLoads.get() == 1, \"wait/notify gives the same answer: 30 threads, 1 load (was \" + monitorLoads.get() + \")\");\n        check(monAnswers.equals(Set.of(\"m\")), \"and all 30 threads got the winner's value\");\n        check(MonitorSingleFlight.lostWakeup().startsWith(\"the signal was missed\"),\n              \"a notify sent before the wait began is gone for good: that is the lost wakeup the done flag prevents\");\n\n        pool.shutdownNow();\n        pool.awaitTermination(15, TimeUnit.SECONDS);\n        c.close(); c2.close(); c3.close(); c4.close(); hot.close(); many.close();\n        broken.close(); free.close(); noisy.close(); nocache.close();\n        wedged.close(); cancelled.close(); tiny.close();\n\n        System.out.println(failures == 0 ? \"ALL PASS\" : failures + \" FAILED\");\n        if (failures != 0) System.exit(1);\n    }\n}\n"};
function wireCopy(root){root.querySelectorAll('button.copy').forEach(b=>{b.onclick=()=>{const key=b.dataset.key;const txt=key?RAW[key]:b.closest('.ed').querySelector('code').textContent;navigator.clipboard.writeText(txt).then(()=>{b.textContent='copied';setTimeout(()=>b.textContent='copy',1500);});};});}
const KW=/\b(abstract|boolean|break|case|catch|class|continue|default|do|double|else|enum|extends|final|finally|for|if|implements|import|int|interface|long|new|null|package|private|protected|public|return|static|super|switch|synchronized|this|throw|throws|try|void|while|var|record|true|false)\b/g;
const TY=/\b([A-Z][A-Za-z0-9]*)\b/g;
function hl(src){let inDoc=false;return src.split('\n').map((l,i)=>{let e=l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const t=e.trim();let out;if(inDoc||t.startsWith('/**')){out='<span class="d">'+e+'</span>';if(t.startsWith('/**'))inDoc=!t.endsWith('*/');else if(t.endsWith('*/'))inDoc=false;}else{const parts=e.split(/(\/\/.*$|"(?:[^"\\]|\\.)*")/);out=parts.map((p,j)=>j%2?(p.startsWith('//')?'<span class="c">'+p+'</span>':'<span class="s">'+p+'</span>'):p.replace(KW,'<span class="k">$1</span>').replace(TY,'<span class="t">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>')).join('');}return '<span class="ln">'+(i+1)+'</span>'+out;}).join('\n');}
let cur=parseInt(localStorage.getItem('mt-ttl-cache.step')||'1',10);
const side=document.getElementById('side'),study=document.getElementById('study');
function classesSoFar_unused(n){const out=[];STEPS.filter(s=>s.id<=n&&s.code).forEach(s=>{(s.code.match(/(?:class|interface|enum)\s+([A-Z]\w*)/g)||[]).forEach(m=>out.push({name:m.split(/\s+/)[1],step:s.id}));});return out;}
function render(){
  side.innerHTML='';let g='';STEPS.forEach(s=>{if(s.stage!==g){g=s.stage;side.insertAdjacentHTML('beforeend','<div class="grp">'+g+'</div>');}side.insertAdjacentHTML('beforeend','<div class="st'+(s.id===cur?' on':s.id<cur?' done':'')+'" data-id="'+s.id+'"><span class="n">'+String(s.id).padStart(2,'0')+'</span><span>'+s.title+'</span></div>');});
  const s=STEPS[cur-1];
  study.innerHTML='<div class="hdr"><span class="stage">'+s.stage+'</span><h2>'+String(s.id).padStart(2,'0')+' &middot; '+s.title+'</h2></div>'+(s.think?'<div class="think">'+s.think+'</div>':'')+(s.body||'')+(s.code?'<div class="ed"><div class="tab"><b>'+(s.file||'Main.java')+'</b><button class="copy" data-src="ed">copy</button></div><pre><code class="java">'+hl(s.code)+'</code></pre></div>':'')+'<div class="nav"><button id="prev">&larr; prev</button><button id="next" class="pri">next &rarr;</button></div>';
  study.querySelectorAll('pre code.java').forEach(el=>{el.innerHTML=hl(el.textContent);});wireCopy(study);wireTimers(study);const miss=document.getElementById('miss');if(miss){try{miss.value=localStorage.getItem('mt-ttl-cache.miss')||'';}catch(e){}miss.addEventListener('input',()=>{try{localStorage.setItem('mt-ttl-cache.miss',miss.value);}catch(e){}});}
  document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
  document.querySelector('.wrap').classList.toggle('wide',!!s.wide);document.querySelector('.wrap').classList.toggle('code',!!s.code);localStorage.setItem('mt-ttl-cache.step',cur);study.scrollIntoView();
}
function go(n){if(n<1||n>STEPS.length)return;cur=n;setMode('study');render();}
side.addEventListener('click',e=>{const t=e.target.closest('.st');if(t)go(+t.dataset.id);});
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
const main=document.getElementById('main');
function setMode(m){}
function wireTimers(root){root.querySelectorAll('button.timer[data-min]').forEach(b=>{const total=+b.dataset.min*60;let left=total,id=null;const show=()=>{b.textContent=(id?'':'start ')+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');};b.onclick=()=>{if(id){clearInterval(id);id=null;b.classList.remove('run');show();return;}if(left<=0)left=total;b.classList.remove('done');b.classList.add('run');id=setInterval(()=>{left--;show();if(left<=0){clearInterval(id);id=null;b.classList.remove('run');b.classList.add('done');b.textContent='time -- open the fold';}},1000);show();};show();});}

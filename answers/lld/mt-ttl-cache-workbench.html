dle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), no lock</text></g><g transform=\"translate(30 70)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">is somebody already loading it?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 90 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 70)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ConcurrentHashMap&lt;K, CompletableFuture&gt;</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 90 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 70)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1), one CAS</text></g><g transform=\"translate(30 120)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how long may this key live?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 140 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 120)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TtlPolicy: a method, not a map</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 140 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 120)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1)</text></g><g transform=\"translate(30 170)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">what has died since the last pass?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 190 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 170)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">today: walk every entry</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 190 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 170)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(n) per pass</text></g><g transform=\"translate(30 220)\"><rect width=\"360\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"180.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">how many entries are alive?</text><text x=\"180.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the question</text></g><path d=\"M390 240 H450\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(450 220)\"><rect width=\"520\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"260.0\" y=\"14.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">size() counts the dead too; liveSize() walks</text><text x=\"260.0\" y=\"30.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the shape</text></g><path d=\"M970 240 H1030\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1030 220)\"><rect width=\"170\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"85.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">O(1) / O(n)</text></g><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the only O(n) thing in the whole design is the sweep, and move 8 is where that gets fixed. Everything a caller touches is one hash.</text></svg></div><div class=\"move\"><p>\"Is this key here, and still alive?\" is one hash into a <code>ConcurrentHashMap</code> and one comparison against the clock: O(1), and a read takes no lock. \"Is somebody already loading it?\" is a second map, keyed the same way, holding one future per load in flight; the question is answered by the <code>putIfAbsent</code> that asks it, so asking and claiming are the same operation. \"How long may this key live?\" is not a map at all, it is a method call on the rule that was handed in. Two answers are deliberately not O(1), and saying so out loud is the point of this move. \"What has died since the last pass?\" is a full walk of the map today, O(n) per pass, and move 8 replaces it with a deadline queue. And <code>size()</code> counts entries that have expired but not yet been reclaimed, so it is an estimate that runs high between sweeps; an exact live count would need one shared counter on every write, which is the single global bottleneck this design exists to avoid.</p></div><div class=\"move\"><h3>Move 6: anything with a life cycle is a state machine, and the order of operations is part of the design.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 350\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 45)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ABSENT</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">nothing stored</text></g><g transform=\"translate(290 45)\"><rect width=\"190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"95.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LOADING</text><text x=\"95.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one thread owns it</text></g><g transform=\"translate(560 45)\"><rect width=\"180\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"90.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">LIVE</text><text x=\"90.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">inside its deadline</text></g><g transform=\"translate(820 45)\"><rect width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"100.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">EXPIRED</text><text x=\"100.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">dead, not yet reclaimed</text></g><path d=\"M210 67 H290\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"250\" y=\"36\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">a miss wins</text><path d=\"M480 67 H560\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"520\" y=\"36\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">loader returned</text><path d=\"M740 67 H820\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"780\" y=\"36\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">clock passed it</text><path d=\"M385 45 V22 H120 V43\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"250\" y=\"17\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the loader threw: nothing stored, the claim freed</text><path d=\"M920 89 V122 H120 V91\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"520\" y=\"138\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">a read or a sweep compare-and-removes: only THIS entry, never a value somebody refreshed in between</text><text x=\"615\" y=\"176\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the order at the critical step, on the two threads that meet there</text><g transform=\"translate(180 196)\"><rect width=\"186\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1  claim the key</text><text x=\"93.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">putIfAbsent: one CAS</text></g><path d=\"M366 219 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(382 196)\"><rect width=\"186\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2  call the loader</text><text x=\"93.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">20 ms, nothing held</text></g><path d=\"M568 219 H582\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(584 196)\"><rect width=\"186\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3  map.put(entry)</text><text x=\"93.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">publish it first</text></g><path d=\"M770 219 H784\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(786 196)\"><rect width=\"186\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">4  complete the future</text><text x=\"93.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">then wake the waiters</text></g><path d=\"M972 219 H986\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(988 196)\"><rect width=\"186\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">5  release the claim</text><text x=\"93.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">in a finally block</text></g><text x=\"170\" y=\"222\" text-anchor=\"end\" font-size=\"11.5\" fill=\"var(--acc)\">the winner</text><text x=\"170\" y=\"288\" text-anchor=\"end\" font-size=\"11.5\" fill=\"var(--acc)\">a loser</text><g transform=\"translate(180 264)\"><rect width=\"186\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"93.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">sees the claim taken</text><text x=\"93.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">putIfAbsent returns it</text></g><path d=\"M366 287 H380\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(380 264)\"><rect width=\"388\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"194.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">waits on the winner's future</text><text x=\"194.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">holds no lock; wakes when it completes</text></g><path d=\"M768 287 H782\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(782 264)\"><rect width=\"388\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"194.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">gets the value that was stored</text><text x=\"194.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">never a value the map does not have</text></g><text x=\"615\" y=\"336\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">if the loader throws, steps 3 and 4 never happen: nothing is written, every waiter is told the same failure, and step 5 still runs, so the next caller starts clean</text></svg></div><div class=\"move\"><p>An entry is ABSENT, then LOADING while one thread owns the claim, then LIVE until the clock passes its deadline, then EXPIRED, and then ABSENT again when a read or a sweep reclaims it. Writing the states down forces the two questions an interviewer will ask. First: what if the loader throws? Then LOADING goes straight back to ABSENT and nothing is stored &mdash; the key is not poisoned with a bad value and the next caller starts a clean load. Second: who removes an EXPIRED entry, and what if somebody refreshed it a microsecond ago? That is the whole reason the removal is <code>map.remove(key, entry)</code> and not <code>map.remove(key)</code>: it deletes that exact object or nothing at all. Then the order at the critical step, which is the same rule as \"take the money before you commit\": <b>1</b> claim the key with a compare-and-set; <b>2</b> call the loader, holding nothing, for twenty milliseconds; <b>3</b> put the entry in the map; <b>4</b> only now complete the future; <b>5</b> release the claim in a <code>finally</code>. Publishing to the map before completing the future is what makes the losers' answer safe: a waiter can never be handed a value the map does not already have. It is also move 4's rule with this system's nouns in it &mdash; change the state, then signal, never the other way round. And if step 2 throws, steps 3 and 4 never happen, every waiter is told the same failure, and step 5 still runs. One last thing about the loop around all of this: it is not there for spurious wakeups, which a future does not have. It is there for the one case where the winner's value had already died by the time a waiter was woken, which needs a TTL shorter than a load, and each extra round either hands back a live value or makes that thread the next loader. Page 05 has the proof that it always ends.</p></div><div class=\"move\"><h3>Move 7: yes, there is contention. Ask where it actually is, for how long, and what is inside it.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 435\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 20)\"><rect width=\"540\" height=\"155\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"270.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">inside a lock: about 100 nanoseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">there is no lock of our own in the whole class</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">a get takes none at all: one volatile array read</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">a put takes one bin's lock out of about 16,000</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">what is held: one hash, a short list walk, one write</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">the listener fires after the map call has returned</text></g><path d=\"M570 95 H640\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"605\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--acc)\">no lock</text><g transform=\"translate(640 20)\"><rect width=\"560\" height=\"155\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">outside every lock: milliseconds</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the loader: a database round trip, about 20 ms</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">which is 200,000 times longer than the bin lock</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the removal listener: a metric, a log line</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">a sweep pass over 10,000 entries: about 0.2 ms</text><text x=\"14\" y=\"109\" font-size=\"10.5\" fill=\"var(--muted)\">the caller's own network hop: tens of milliseconds</text></g><text x=\"615\" y=\"192\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">eight threads touch the same key at the same instant</text><path d=\"M134 230 H1160.0\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><path d=\"M140.0 226 V234\" stroke=\"var(--line)\"/><text x=\"140.0\" y=\"220\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">0 ns</text><path d=\"M390.0 226 V234\" stroke=\"var(--line)\"/><text x=\"390.0\" y=\"220\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">100</text><path d=\"M640.0 226 V234\" stroke=\"var(--line)\"/><text x=\"640.0\" y=\"220\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">200</text><path d=\"M890.0 226 V234\" stroke=\"var(--line)\"/><text x=\"890.0\" y=\"220\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">300</text><path d=\"M1140.0 226 V234\" stroke=\"var(--line)\"/><text x=\"1140.0\" y=\"220\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--muted)\">400 ns</text><text x=\"130\" y=\"252\" text-anchor=\"end\" font-size=\"10.5\" fill=\"var(--muted)\">reader 1</text><rect x=\"140\" y=\"240\" width=\"100\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"250\" y=\"252\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">returns at about 40 ns -- it took no lock, so it waited for nobody</text><text x=\"130\" y=\"271\" text-anchor=\"end\" font-size=\"10.5\" fill=\"var(--muted)\">reader 2</text><rect x=\"140\" y=\"259\" width=\"100\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"250\" y=\"271\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">the same instant, the same 40 ns, and still no waiting</text><text x=\"130\" y=\"290\" text-anchor=\"end\" font-size=\"10.5\" fill=\"var(--muted)\">readers 3-6</text><rect x=\"140\" y=\"278\" width=\"100\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"250\" y=\"290\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--muted)\">and four more exactly like them: a reader never queues behind anything</text><text x=\"130\" y=\"311\" text-anchor=\"end\" font-size=\"10.5\" fill=\"var(--acc)\">writer 1</text><rect x=\"140\" y=\"299\" width=\"250\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"400\" y=\"311\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--acc)\">holds one bin for about 100 ns</text><text x=\"130\" y=\"330\" text-anchor=\"end\" font-size=\"10.5\" fill=\"var(--acc)\">writer 2</text><rect x=\"390\" y=\"318\" width=\"250\" height=\"15\" rx=\"3\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-dasharray=\"4 3\"/><text x=\"650\" y=\"330\" text-anchor=\"start\" font-size=\"10.5\" fill=\"var(--acc)\">only if its key lands in the SAME bin: waits 100 ns, then takes its own 100 ns</text><text x=\"615\" y=\"357\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">so \"is everything one by one now?\" -- no. Readers take no lock at all. Two writers only meet when their keys land in the same bin, which with</text><text x=\"615\" y=\"376\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">16,384 bins is about one put in sixteen thousand, for a hundred nanoseconds -- while the twenty-millisecond loader runs with nothing held at all</text><text x=\"615\" y=\"402\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and the honest half of the answer: none of this is fair. The claim goes to whoever wins one compare-and-set -- no queue, no ticket, no order --</text><text x=\"615\" y=\"421\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">so a thread can lose twice running. Nobody starves, because losing means riding somebody else\u2019s result, which is finished work, not another wait.</text></svg></div><div class=\"move\"><p>The honest answer for this design is that there is no lock of our own anywhere in the class, so the question becomes: what does <code>ConcurrentHashMap</code> hold, and for how long? A <code>get</code> holds nothing &mdash; it is a volatile read of one array slot, about forty nanoseconds &mdash; so the eight readers in the picture all return at once and none of them waits for another. A <code>put</code> takes the lock of one bin, for about a hundred nanoseconds, long enough to hash the key, walk a very short list and write one field. Two writers only meet if their keys land in the same bin, and with sixteen thousand bins that is about one put in sixteen thousand. Everything expensive is outside: the loader at twenty milliseconds, which is two hundred thousand times the bin lock; the removal listener, fired after the map call has returned and wrapped in a try/catch; the sweep pass. So when the interviewer asks \"have you not just serialised the whole cache?\", those are the two numbers to give, and the reason they stay that small is that the only slow thing in the system is never allowed inside them. Two more things belong in that answer, because they are what the next question is made of. First, none of this is <i>fair</i>: the claim goes to whichever thread wins one compare-and-set, there is no queue and no ticket and no order, and a thread can lose twice running. Nobody starves, though, and the reason is worth having ready &mdash; losing is not another wait, it is riding a result somebody is already fetching. Second, a waiter is not hostage to the winner: the three-argument <code>getOrLoad</code> takes a deadline in milliseconds and answers an interrupt, while the winner's own load is never cut off by somebody else's impatience, because that bound belongs on the loader and not in the cache.</p></div><div class=\"move\"><h3>Move 8: say the arithmetic, then name the ladder.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 258\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"560\" height=\"205\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"300\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">one hot key: is the stampede real? do the arithmetic</text><text x=\"35\" y=\"66\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a product page: 2,000 reads a second of one key</text><text x=\"35\" y=\"92\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">TTL 60 s, and the loader is a 20 ms database call</text><text x=\"35\" y=\"118\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">every 60 s it dies; in those 20 ms, 40 threads miss it</text><text x=\"35\" y=\"144\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">without a claim: 40 queries a window, 57,600 a day</text><text x=\"35\" y=\"170\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">with a claim: 1 query a window, 1,440 a day -- 40x less</text><text x=\"35\" y=\"196\" text-anchor=\"start\" font-size=\"11\" fill=\"var(--muted)\">a get itself costs ~40 ns: 50,000 a second is 0.2% of a core</text><text x=\"890\" y=\"42\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--text)\">the upgrade ladder, in the order you would climb it</text><g transform=\"translate(600 58)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">1  lazy expiry plus one claim per key</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">this file: no timer, no thread, the loader outside every lock</text></g><g transform=\"translate(600 112)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">2  a deadline queue for the sweeper</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a pass pops only the keys that died: O(k log n), not O(n)</text></g><g transform=\"translate(600 166)\"><rect width=\"600\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">3  shard by hash, or amortise onto reads</text><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">N maps and N sweepers; Caffeine drains a ring buffer and needs no thread</text></g><text x=\"615\" y=\"245\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">say the arithmetic before you climb: at 2,000 reads a second the cache is not the problem and the database is, which is why rung 1 is a claim and not a faster map</text></svg></div><div class=\"move\"><p>Take a product page: two thousand reads a second of one key, a TTL of sixty seconds, a loader that is a twenty-millisecond database call. Every sixty seconds the key dies, and in the twenty milliseconds the reload takes, two thousand times 0.02 &mdash; forty threads &mdash; miss it. Without a claim that is forty identical queries per window and 57,600 a day; with a claim it is one per window and 1,440 a day, forty times less, which is the entire argument for the extra map. The cache itself is not the cost, as the card's last line says. Then the ladder, cheapest first. Rung one is what is in the file, and it needs no timer and no thread. Rung two attacks the one O(n) thing there is: keep the deadlines in a priority queue so a pass pops only the keys that actually died, O(k log n) instead of walking ten thousand entries to find three. Rung three is sharding, N sub-caches by hash with a sweeper each. Say the arithmetic before you climb: at two thousand reads a second the cache was never the problem, the database was, which is why rung one is a claim and not a faster map.</p></div><div class=\"move\"><h3>Move 9: list what can go wrong, and write the test for each before the interview is over.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 305\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 18)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a value is served after it died</text></g><path d=\"M350 37 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 18)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">compare with the clock on every read; an injected clock steps over the deadline (test 1)</text></g><g transform=\"translate(30 60)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the sweeper deletes a fresh value</text></g><path d=\"M350 79 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 60)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">map.remove(key, entry): the entry, not the key; a refresh mid-sweep survives (test 3)</text></g><g transform=\"translate(30 102)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">fifty threads miss one cold key</text></g><path d=\"M350 121 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 102)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one claim per key, putIfAbsent on a future; 50 threads, exactly 1 loader call (test 4)</text></g><g transform=\"translate(30 144)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the loader throws, or wedges forever</text></g><path d=\"M350 163 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 144)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">nothing written, the claim freed in a finally; a waiter may set a deadline (tests 6, 10)</text></g><g transform=\"translate(30 186)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a waiter is cancelled, or wakes too late</text></g><path d=\"M350 205 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 186)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the bounded wait answers the interrupt, and the retry loop always ends (tests 11, 12)</text></g><g transform=\"translate(30 228)\"><rect width=\"320\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a listener throws, or a load is slow</text></g><path d=\"M350 247 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 228)\"><rect width=\"800\" height=\"38\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"19.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">both are called with nothing held, each listener in its own try/catch (tests 7, 8)</text></g><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">every claim this page makes has a test: FailureTests.java runs thirteen of them, fifty-seven checks, finishes in under a second, and must print ALL PASS</text></svg></div><div class=\"move\"><p>The six failures are in the picture, each beside the line that stops it. What is worth saying out loud is how two of them are <i>tested</i>, because they are races, and a race you cannot reproduce is not a test. Both are made deterministic by the seam move 3 already gave us: the injected clock. The sweeper reads the clock between picking an entry up and removing it, so a test clock that performs the refresh inside that read reproduces the interleaving exactly, every single run. The stampede tests use the same idea from the other side: the loader does not return until all forty-nine losers are provably waiting, so the count is one on a fast laptop and one on a loaded build box. The last three are the ones a multi-threading interviewer reaches for: a waiter stuck behind a wedged load (it hands in a deadline, and giving up starts no second load); a waiter that is cancelled (the bounded wait throws <code>InterruptedException</code> instead of swallowing it, and the thread that was loading carries on undisturbed); and the retry loop with a TTL shorter than a load, forced by a clock that jumps five milliseconds a read. FailureTests.java runs thirteen of these, fifty-seven checks, in under a second.</p></div><div class=\"move\"><h3>Move 10: now, and only now, name the patterns. Each one is the result of a move.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">pattern</text><text x=\"230\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">born in</text><text x=\"320\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line in the code</text><text x=\"860\" y=\"39.0\" font-size=\"10.5\" fill=\"var(--acc)\">what it buys</text><rect x=\"20\" y=\"50\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">Strategy</text><text x=\"230\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">interface TtlPolicy&lt;K&gt; { long ttlMsFor(K key); }, handed in by configure()</text><text x=\"860\" y=\"69.0\" font-size=\"11\" fill=\"var(--text)\">a per-key TTL is a new class, not an edit</text><rect x=\"20\" y=\"80\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">Decorator</text><text x=\"230\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">new JitteredTtl&lt;&gt;(base, 20) wraps any TTL rule, present or future</text><text x=\"860\" y=\"99.0\" font-size=\"11\" fill=\"var(--text)\">a million keys stop dying in the same millisecond</text><rect x=\"20\" y=\"110\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">Observer</text><text x=\"230\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"320\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">fire(key, value, cause) after the map write, each one in a try/catch</text><text x=\"860\" y=\"129.0\" font-size=\"11\" fill=\"var(--text)\">metrics without the cache knowing what a metric is</text><rect x=\"20\" y=\"140\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">State</text><text x=\"230\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">move 6</text><text x=\"320\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">ABSENT &rarr; LOADING &rarr; LIVE &rarr; EXPIRED, and the CAS that owns LOADING</text><text x=\"860\" y=\"159.0\" font-size=\"11\" fill=\"var(--text)\">only one thread can be in LOADING for a key</text><rect x=\"20\" y=\"170\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">Future (Promise)</text><text x=\"230\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">move 4</text><text x=\"320\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">loading.putIfAbsent(key, new CompletableFuture&lt;&gt;()): the wait protocol</text><text x=\"860\" y=\"189.0\" font-size=\"11\" fill=\"var(--text)\">a completed future is a latch: no wakeup is lost</text><rect x=\"20\" y=\"200\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">Singleton</text><text x=\"230\" y=\"219.0\" font-size=\"11\" fill=\"var(--text)\">not here</text><text x=\"320\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">the cache is built and handed to its callers; no getInstance()</text><text x=\"860\" y=\"219.0\" font-size=\"11\" fill=\"var(--muted)\">a test builds a fresh cache per claim</text><rect x=\"20\" y=\"230\" width=\"1190\" height=\"30\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">Factory</text><text x=\"230\" y=\"249.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">TtlRules.parse(\"user:=300000, =60000\") in Extensions.java</text><text x=\"860\" y=\"249.0\" font-size=\"11\" fill=\"var(--muted)\">it earns the name the day TTLs come from config</text><rect x=\"20\" y=\"260\" width=\"1190\" height=\"30\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Builder</text><text x=\"230\" y=\"279.0\" font-size=\"11\" fill=\"var(--text)\">not yet</text><text x=\"320\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">three collaborators, all required, one configure(ttl, clock) call</text><text x=\"860\" y=\"279.0\" font-size=\"11\" fill=\"var(--muted)\">Caffeine.newBuilder() is this, at ten knobs</text><text x=\"615\" y=\"305\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">name a pattern only after the move that produced it; then every name has a one-sentence defence and none of them is decoration</text></svg></div><div class=\"move\"><p>The table has the four that any LLD round produces &mdash; Strategy, Decorator, Observer, State &mdash; each with the move that produced it and the line that shows it. Two more rows need a sentence the table cannot hold. The first is the one specific to a multi-threading round: the <b>Future</b>, sometimes called a Promise, <i>is</i> the wait protocol. On a blocking queue the waiters sit on a condition variable and somebody has to remember to signal them after the change; here they hold a handle on somebody else's result, which is strictly better because it blocks nothing and because a result that has already arrived cannot be missed. The second is why two famous names are marked \"not yet\" rather than used. Factory earns its name the day the rules stop being written in Java and arrive as text, which is <code>TtlRules.parse(\"user:=300000, =60000\")</code> in Extensions.java. Builder earns its place at about the sixth optional collaborator; three that are all required is a <code>configure</code> call, and ten optional ones is <code>Caffeine.newBuilder()</code>, which is exactly this pattern in a real library.</p></div><div class=\"move\"><h3>Move 11: run SOLID as a check on the moves, one line each.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 265\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\"></text><text x=\"70\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the rule, in plain words</text><text x=\"460\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">from</text><text x=\"580\" y=\"41.0\" font-size=\"10.5\" fill=\"var(--acc)\">the line that shows it</text><rect x=\"20\" y=\"54\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"75.0\" font-size=\"11\" fill=\"var(--acc)\">S</text><text x=\"70\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">one reason to change per class</text><text x=\"460\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">move 2</text><text x=\"580\" y=\"75.0\" font-size=\"11\" fill=\"var(--text)\">CacheEntry holds a deadline. TtlPolicy answers one question. TtlCache owns the map.</text><rect x=\"20\" y=\"88\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"109.0\" font-size=\"11\" fill=\"var(--acc)\">O</text><text x=\"70\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">new behaviour is a new class, not an edited one</text><text x=\"460\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"109.0\" font-size=\"11\" fill=\"var(--text)\">TtlRules and JitteredTtl are new files; not one line of TtlCache changed</text><rect x=\"20\" y=\"122\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"143.0\" font-size=\"11\" fill=\"var(--acc)\">L</text><text x=\"70\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">any implementation drops in; nobody checks which</text><text x=\"460\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"143.0\" font-size=\"11\" fill=\"var(--text)\">clock.nowMs() and ttl.ttlMsFor(k); never \"is this the test clock?\"</text><rect x=\"20\" y=\"156\" width=\"1190\" height=\"34\" fill=\"var(--bg3)\"/><text x=\"32\" y=\"177.0\" font-size=\"11\" fill=\"var(--acc)\">I</text><text x=\"70\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">small interfaces: one method each</text><text x=\"460\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">move 3</text><text x=\"580\" y=\"177.0\" font-size=\"11\" fill=\"var(--text)\">Clock, TtlPolicy, Loader, RemovalListener: one method each</text><rect x=\"20\" y=\"190\" width=\"1190\" height=\"34\" fill=\"var(--bg2)\"/><text x=\"32\" y=\"211.0\" font-size=\"11\" fill=\"var(--acc)\">D</text><text x=\"70\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">depend on interfaces; implementations are handed in</text><text x=\"460\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">moves 3, 9</text><text x=\"580\" y=\"211.0\" font-size=\"11\" fill=\"var(--text)\">configure(new FixedTtl&lt;&gt;(100), manualClock) is the entire test seam</text><text x=\"615\" y=\"250\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">SOLID is not a list to recite; it is the check that the moves did their job, one line each</text></svg></div><div class=\"move\"><p>S: each class has one reason to change &mdash; an entry holds a value and a deadline, a TTL rule answers one question, a clock tells the time, the cache owns the map. O: a per-key TTL and a jittered TTL are new files, and not one line of <code>TtlCache</code> changed to add them. L: the cache calls <code>clock.nowMs()</code> and <code>ttl.ttlMsFor(k)</code> and never asks which implementation it got, which is precisely why a test clock with a side effect can be dropped in to reproduce a race. I: four interfaces with one method each, so a caller depends only on the slice it uses. D: <code>configure(new FixedTtl&lt;&gt;(100), manualClock)</code> is the whole test seam &mdash; the cache depends on the abstractions and is handed the implementations, which is the difference between testing a one-hour TTL in a millisecond and not testing it at all.</p></div><div class=\"move\"><h3>Move 12: every twist the interviewer adds is one of five moves. Say which before you type.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 325\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new rule</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">refresh-ahead, jitter, negative caching</text></g><path d=\"M360 46 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 24)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new TtlPolicy, or a wrapper round the loader</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the cache itself does not change</text></g><text x=\"1150\" y=\"51\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">someone new wants to know</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">hit rate, load latency, a leak alarm</text></g><path d=\"M360 100 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 78)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more RemovalListener, plus the counters already there</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">fired after the write, in a try/catch</text></g><text x=\"1150\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 3</text><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new step in a life</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">serve stale while a reload runs</text></g><path d=\"M360 154 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 132)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">one more state, REFRESHING, and one more transition</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a soft deadline in front of the hard one</text></g><text x=\"1150\" y=\"159\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 6</text><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a new invariant across keys</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the cache must fit in two gigabytes</text></g><path d=\"M360 208 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 186)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a bound goes ON the cache, with whatever state the victim rule needs</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">soft: a hard bound needs one global counter</text></g><text x=\"1150\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">move 4</text><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">state that must outlive the process</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">two servers, and a restart</text></g><path d=\"M360 262 H420\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(420 240)\"><rect width=\"660\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"330.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the entries in Redis: SET key val PX 60000, and the claim becomes</text><text x=\"330.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">SET lock:key owner NX PX 5000, with PUBLISH to invalidate the other copy</text></g><text x=\"1150\" y=\"267\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">moves 5 + 12</text><text x=\"615\" y=\"312\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">for all five the read path, the claim and the tests do not change; that is the check that the derivation was right</text></svg></div><div class=\"move\"><p>The first three rows of the picture are twists you can answer in one sentence each, and the code for all of them is on page 05. Two need more than a sentence. A new invariant across keys &mdash; \"the cache must fit in two gigabytes\" &mdash; is a size bound, and the point that earns marks is that it goes <i>on</i> this cache and not inside it: a TTL cache records nothing about reads, so the rule that picks a victim has to bring its own state with it. The bound is also deliberately soft, because a hard one needs a global counter on every write, which is the thing this design refuses. Which key to throw away &mdash; LRU, LFU, and the O(1) structures behind them &mdash; belongs to <a href=\"lru-workbench.html\">the LRU page</a> and <a href=\"cache-eviction-workbench.html\">the cache-eviction page</a>, not here. State that must outlive the process (two servers, a restart) hands the deadline to Redis instead of tracking it here, and turns the claim into a lease with a TTL of its own, so a server that dies mid-load does not block the key forever. For all five the read path, the claim and the tests are untouched, and that is the check that the derivation was right.</p></div>", "code": ""}, {"id": 3, "stage": "Design", "title": "The whole design: the class diagram", "wide": true, "think": "", "body": "<div class=\"fullboard\"><svg viewBox=\"0 0 1230 620\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"10\" y=\"10\" width=\"250\" height=\"62\" rx=\"6\" fill=\"var(--bg2)\" stroke=\"var(--acc2)\" stroke-dasharray=\"5 3\"/><text x=\"135.0\" y=\"30\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--acc2)\">50 caller threads</text><text x=\"135.0\" y=\"50\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no class of their own:</text><text x=\"135.0\" y=\"67\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">they bind to the interface</text><rect x=\"710\" y=\"422\" width=\"250\" height=\"110\" rx=\"6\" fill=\"var(--bg2)\" stroke=\"var(--acc2)\" stroke-dasharray=\"5 3\"/><text x=\"835.0\" y=\"442\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--acc2)\">the waiting parties</text><text x=\"835.0\" y=\"462\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">n-1 threads per key,</text><text x=\"835.0\" y=\"479\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">each holding a handle on</text><text x=\"835.0\" y=\"496\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the winner's result:</text><text x=\"835.0\" y=\"513\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no lock, no queue, no class</text><path d=\"M260 41L285 41L310 69\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><path d=\"M485.0 160L485.0 14 "1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><path d=\"M1115.0 200L1115.0 169\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"1121.0\" y=\"188.5\" font-size=\"10.5\" fill=\"var(--muted)\">wraps</text><g transform=\"translate(10 95)\"><rect width=\"250\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Loader</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">load(key): V</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">a database read; may throw</text></g><g transform=\"translate(10 190)\"><rect width=\"250\" height=\"70\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RemovalListener</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">onRemoval(key, value, cause)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">CacheMetrics, or a lambda</text></g><g transform=\"translate(10 285)\"><rect width=\"250\" height=\"66\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;enum&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">RemovalCause</text> middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">Cache</text><line x1=\"0\" y1=\"34\" x2=\"350\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">put(key, value)</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--text)\">get(key): V</text><text x=\"8\" y=\"79\" font-size=\"11.5\" fill=\"var(--text)\">getOrLoad(key, loader): V</text><text x=\"8\" y=\"95\" font-size=\"11.5\" fill=\"var(--text)\">getOrLoad(key, loader, timeoutMs): V</text><text x=\"8\" y=\"111\" font-size=\"11.5\" fill=\"var(--text)\">invalidate(key): boolean</text><text x=\"8\" y=\"127\" font-size=\"11.5\" fill=\"var(--text)\">size(): int</text></g><g transform=\"translate(310 160)\"><rect width=\"350\" height=\"234\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"175.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">TtlCache</text><line x1=\"0\" y1=\"26\" x2=\"350\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">map: ConcurrentHashMap&lt;K, CacheEntry&gt;</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">loading: ConcurrentHashMap&lt;K,</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">     CompletableFuture&lt;CacheEntry&gt;&gt;</text><text x=\"8\" y=\"87\" font-size=\"11.5\" fill=\"var(--muted)\">listeners: CopyOnWriteArrayList</text><text x=\"8\" y=\"103\" font-size=\"11.5\" fill=\"var(--muted)\">ttl: TtlPolicy    clock: Clock</text><text x=\"8\" y=\"119\" font-size=\"11.5\" fill=\"var(--muted)\">sweeper: ScheduledExecutorService</text><text x=\"8\" y=\"135\" font-size=\"11.5\" fill=\"var(--muted)\">7 LongAdder counters (hits, misses, ...)</text><line x1=\"0\" y1=\"144\" x2=\"350\" y2=\"144\" stroke=\"var(--line)\"/><text x=\"8\" y=\"157\" font-size=\"11.5\" fill=\"var(--text)\">configure(ttl, clock) / addListener(l)</text><text x=\"8\" y=\"173\" font-size=\"11.5\" fill=\"var(--text)\">put / get / invalidate</text><text x=\"8\" y=\"189\" font-size=\"11.5\" fill=\"var(--text)\">getOrLoad(k, loader [, timeoutMs])</text><text x=\"8\" y=\"205\" font-size=\"11.5\" fill=\"var(--text)\">startSweeper(everyMs) / sweepOnce() / close()</text><text x=\"8\" y=\"221\" font-size=\"11.5\" fill=\"var(--text)\">size() / liveSize() / stats()</text></g><g transform=\"translate(310 445)\"><rect width=\"350\" height=\"122\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"175.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CacheEntry</text><line x1=\"0\" y1=\"26\" x2=\"350\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">value: V</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">loadedAtMs / expiresAtMs: long</text><text x=\"8\" y=\"71\" font-size=\"11.5\" fill=\"var(--muted)\">all final: safe publication</text><line x1=\"0\" y1=\"80\" x2=\"350\" y2=\"80\" stroke=\"var(--line)\"/><text x=\"8\" y=\"93\" font-size=\"11.5\" fill=\"var(--text)\">isLive(nowMs): boolean</text><text x=\"8\" y=\"109\" font-size=\"11.5\" fill=\"var(--text)\">equals = identity, on purpose</text></g><g transform=\"translate(710 160)\"><rect width=\"250\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;jdk&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">CompletableFuture</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">one per key being loaded</text><line x1=\"0\" y1=\"56\" x2=\"250\" y2=\"56\" stroke=\"var(--line)\"/><text x=\"8\" y=\"69\" font-size=\"11.5\" fill=\"var(--text)\">complete(entry)</text><text x=\"8\" y=\"85\" font-size=\"11.5\" fill=\"var(--text)\">join(): the losers wait here</text></g><g transform=\"translate(710 285)\"><rect width=\"250\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"125.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;jdk&raquo;</text><text x=\"125.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">ScheduledExecutorService</text><line x1=\"0\" y1=\"34\" x2=\"250\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">one daemon thread</text><text x=\"8\" y=\"63\" font-size=\"11.5\" fill=\"var(--muted)\">named ttl-sweeper</text><line x1=\"0\" y1=\"72\" x2=\"250\" y2=\"72\" stroke=\"var(--line)\"/><text x=\"8\" y=\"85\" font-size=\"11.5\" fill=\"var(--text)\">scheduleWithFixedDelay(...)</text></g><g transform=\"translate(1000 10)\"><rect width=\"230\" height=\"54\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"/><text x=\"115.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;interface&raquo;</text><text x=\"115.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">TtlPolicy</text><line x1=\"0\" y1=\"34\" x2=\"230\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--text)\">ttlMsFor(key): long</text></g><g transform=\"translate(1000 95)\"><rect width=\"230\" height=\"74\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">FixedTtl</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">ttlMs: long</text><line x1=\"0\" y1=\"48\" x2=\"230\" y2=\"48\" stroke=\"var(--line)\"/><text x=\"8\" y=\"61\" font-size=\"11.5\" fill=\"var(--text)\">one number for every key</text></g><g transform=\"translate(1000 200)\"><rect width=\"230\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"14\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">JitteredTtl</text><line x1=\"0\" y1=\"26\" x2=\"230\" y2=\"26\" stroke=\"var(--line)\"/><text x=\"8\" y=\"39\" font-size=\"11.5\" fill=\"var(--muted)\">base: TtlPolicy (wrapped)</text><text x=\"8\" y=\"55\" font-size=\"11.5\" fill=\"var(--muted)\">percent: int</text><line x1=\"0\" y1=\"64\" x2=\"230\" y2=\"64\" stroke=\"var(--line)\"/><text x=\"8\" y=\"77\" font-size=\"11.5\" fill=\"var(--text)\">shortens by a random slice</text></g><g transform=\"translate(1000 320)\"><rect width=\"230\" height=\"90\" rx=\"4\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.2\"/><text x=\"115.0\" y=\"12\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">&laquo;Extensions.java&raquo;</text><text x=\"115.0\" y=\"25\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\" fill=\"var(--text)\">TtlRules</text><line x1=\"0\" y1=\"34\" x2=\"230\" y2=\"34\" stroke=\"var(--line)\"/><text x=\"8\" y=\"47\" font-size=\"11.5\" fill=\"var(--muted)\">byPrefix: Map&lt;String, Long&gt;</text><line x1=\"0\" y1=\"56\" x2=\"230\" y2=\"56\" stroke=\"var(--line)\"/><text x=\"8\" y=\"69\" font-size=\"11.5\" fill=\"var(--text)\">parse(config): TtlRules</text><text x=\"8\" y=\"85\" font-size=\"11.5\" fill=\"var(--text)\">longest prefix wins</text></g><g><path d=\"M20 590L64 590\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uTri)\"/><text x=\"72\" y=\"594\" font-size=\"11\" fill=\"var(--muted)\">extends / implements</text><path d=\"M240 590L284 590\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--text)\" marker-start=\"url(#uDia)\" marker-end=\"url(#uArr)\"/><text x=\"292\" y=\"594\" font-size=\"11\" fill=\"var(--muted)\">owns (composition)</text><path d=\"M460 590L504 590\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--muted)\" marker-end=\"url(#uArr)\"/><text x=\"512\" y=\"594\" font-size=\"11\" fill=\"var(--muted)\">references</text><path d=\"M640 590L684 590\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc)\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><text x=\"692\" y=\"594\" font-size=\"11\" fill=\"var(--muted)\">injected (handed in)</text><path d=\"M860 590L904 590\" fill=\"none\" stroke-width=\"1.3\" stroke=\"var(--acc2)\" stroke-dasharray=\"2 3\" marker-end=\"url(#uArr)\"/><text x=\"912\" y=\"594\" font-size=\"11\" fill=\"var(--muted)\">notifies</text></g></svg></div><div class=\"move\"><p><b>How to read a box.</b> Top: the class name (dashed border = interface; &laquo;enum&raquo; = a fixed list of values; &laquo;jdk&raquo; = a class from the standard library that is part of the design; &laquo;Extensions.java&raquo; = a class that lives in the second file, so everything unmarked is Main.java). Middle: its fields, the state it holds. Bottom: its methods. <b>The arrows.</b> Hollow triangle = implements. Filled diamond = owns: the cache owns every entry, every claim in flight, and the sweeper thread, and all three die with it. Plain arrow = references. Dashed green = handed in through <code>configure()</code>. Dotted blue = notifies. <b>Where state lives:</b> everything mutable is in <code>TtlCache</code> &mdash; two concurrent maps, a list of listeners and seven counters &mdash; and nothing else in the diagram has a field that changes. <code>CacheEntry</code> is written once and never touched again, which is what makes it safe to hand across threads without a lock, and its identity is load-bearing: <code>map.remove(key, entry)</code> means <i>this object</i>. <b>What is not here:</b> no lock class, because there is no lock of our own; no Sweeper class, because whoever owns the map decides what leaves it; and no class for the forty-nine threads waiting on a cold key, because they hold a future and wait on a result rather than queueing on anything. The two forms of <code>getOrLoad</code> on the contract are the whole waiting story: the short one waits as long as the load takes, the long one gives this caller a deadline and answers an interrupt.</p></div>", "code": ""}, {"id": 4, "stage": "Code", "title": "The whole code", "wide": true, "think": "", "body": "<div class=\"move\"><p>Read it with page 03 open in a second tab if you want the diagram beside it. The green comment above each class and method says what it is for and what it guarantees; read only those first for the shape, then the bodies. Each copy button copies that whole file. Below Main.java: Extensions.java (the reference code for every follow-up, with an <code>ExtDemo</code> main that runs all of it) and FailureTests.java (thirteen claims and fifty-seven checks; <code>javac Main.java Extensions.java FailureTests.java &amp;&amp; java FailureTests</code> prints ALL PASS in under a second).</p></div><div class=\"ed\"><div class=\"tab\"><b>Main.java</b><button class=\"copy\" data-key=\"f0\">copy</button></div><pre><code class=\"java\">import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n/**\n * Why an entry left the map. The listener is told the reason, so a metric can tell &quot;it timed out&quot;\n * from &quot;the sweeper reclaimed it&quot; from &quot;somebody overwrote it&quot; from &quot;somebody deleted it&quot;.\n */\nenum RemovalCause { EXPIRED, SWEPT, REPLACED, EXPLICIT }\n\n/** Where time comes from. One method, handed in, so a test can jump an hour instead of sleeping an hour. */\ninterface Clock { long nowMs(); }\n\n/** The real clock. nanoTime, not currentTimeMillis: a clock correction must never make a TTL run backwards. */\nfinal class SystemClock implements Clock {\n    /** Milliseconds on a monotonic timeline. Only differences mean anything; the origin is arbitrary. */\n    public long nowMs() { return System.nanoTime() / 1_000_000L; }\n}\n\n/** A clock a test drives by hand. Thread-safe, because race tests read it from many threads while advancing it. */\nfinal class ManualClock implements Clock {\n    private final AtomicLong nowMs = new AtomicLong(1_000_000L);\n    /** The time this clock is standing at. */\n    public long nowMs() { return nowMs.get(); }\n    /** Jump forward. Nothing expires as a side effect: expiry is decided by whoever reads the entry next. */\n    public void advance(long ms) { nowMs.addAndGet(ms); }\n}\n\n/** How long a key is allowed to live, in milliseconds. This is the rule an interviewer changes mid-round. */\ninterface TtlPolicy&lt;K&gt; { long ttlMsFor(K key); }\n\n/** One TTL for every key. Zero or less means &quot;do not cache this at all&quot;: every call goes to the loader. */\nfinal class FixedTtl&lt;K&gt; implements TtlPolicy&lt;K&gt; {\n    private final long ttlMs;\n    FixedTtl(long ttlMs) { this.ttlMs = ttlMs; }\n    /** The same number for every key. */\n    public long ttlMsFor(K key) { return ttlMs; }\n}\n\n/**\n * Decorator over any TTL rule: shortens each TTL by a random slice, up to percent of it.\n * A million keys written in the same minute would otherwise all die in the same millisecond and\n * send a million loads at the database at once. Jitter spreads those deadlines over a window.\n */\nfinal class JitteredTtl&lt;K&gt; implements TtlPolicy&lt;K&gt; {\n    private final TtlPolicy&lt;K&gt; base;\n    private final int percent;\n    JitteredTtl(TtlPolicy&lt;K&gt; base, int percent) {\n        this.base = Objects.requireNonNull(base);\n        if (percent &lt; 0 || percent &gt; 90) throw new IllegalArgumentException(&quot;jitter must be 0..90%&quot;);\n        this.percent = percent;\n    }\n    /** The wrapped rule&#x27;s answer, minus up to percent of it. Never lengthens a TTL, so it cannot serve stale. */\n    public long ttlMsFor(K key) {\n        long ttl = base.ttlMsFor(key);\n        if (ttl &lt;= 0) return ttl;\n        long span = ttl * percent / 100;\n        return span &lt;= 0 ? ttl : ttl - ThreadLocalRandom.current().nextLong(span + 1);\n    }\n}\n\n/** Told after an entry has left the map, outside every lock. A listener that throws cannot break the cache. */\ninterface RemovalListener&lt;K, V&gt; { void onRemoval(K key, V value, RemovalCause cause); }\n\n/** What a miss calls: a database read, an HTTP call. Slow, allowed to throw, never called with a lock held. */\ninterface Loader&lt;K, V&gt; { V load(K key); }\n\n/**\n * A value and the instant it stops being servable. Every field is final, so the memory model freezes them\n * when the constructor returns: a thread that finds this entry in the map can never see a half-built one.\n * That is safe publication, and it is why reading an entry needs no lock of any kind.\n * equals() is deliberately left as identity: map.remove(key, entry) must mean THIS object and no other,\n * which is what stops a sweeper from deleting a value that was refreshed while the sweeper was looking.\n */\nfinal class CacheEntry&lt;V&gt; {\n    final V value;\n    final long loadedAtMs;\n    final long expiresAtMs;\n    CacheEntry(V value, long loadedAtMs, long expiresAtMs) {\n        this.value = value; this.loadedAtMs = loadedAtMs; this.expiresAtMs = expiresAtMs;\n    }\n    /** Live means the clock has not reached the deadline yet. Strictly before, so a TTL of zero is born dead. */\n    boolean isLive(long nowMs) { return nowMs &lt; expiresAtMs; }\n}\n\n/** What a caller binds to, so a test can hand in a fake and the implementation can be swapped underneath. */\ninterface Cache&lt;K, V&gt; {\n    /** Store a value with the TTL the policy gives this key. */\n    void put(K key, V value);\n    /** The value, or null if it is absent or its deadline has passed. An expired value is never returned. */\n    V get(K key);\n    /**\n     * The value; on a miss exactly one thread per key runs the loader and the rest ride its result.\n     * This form waits as long as the loader takes and ignores an interrupt while it waits. That is the\n     * convenience, and the three-argument form below is the one to use when either matters.\n     */\n    V getOrLoad(K key, Loader&lt;K, V&gt; loader);\n    /**\n     * The same, with a ceiling on how long THIS caller will wait for somebody else&#x27;s load, and an interrupt\n     * that is honoured. Both exceptions are checked on purpose: a caller that asked for a deadline has to\n     * decide what to do when it passes. The deadline bounds the wait only; a thread that ends up running the\n     * loader itself is bounded by wrapping the loader (BoundedLoader in Extensions.java).\n     */\n    V getOrLoad(K key, Loader&lt;K, V&gt; loader, long timeoutMs) throws TimeoutException, InterruptedException;\n    /** Remove a key. True if something was there. */\n    boolean invalidate(K key);\n    /** How many entries the map holds, including ones that expired but have not been reclaimed yet. */\n    int size();\n}\n\n/**\n * The thread-safe cache. Two invariants, and everything in the file exists to hold one of them:\n *   1. a value whose deadline has passed is never handed to a caller, and is never deleted if it was refreshed;\n *   2. when many threads miss the same key at once, the loader runs once and the others share its result.\n * There is no lock of our own anywhere in this class. The map&#x27;s own per-bin locks are the only ones,\n * they are held for about a hundred nanoseconds by put and remove, and the slow loader runs outside all of them.\n */\nfinal class TtlCache&lt;K, V&gt; implements Cache&lt;K, V&gt; {\n    /** The store. A read takes no lock at all; a write takes the lock of one bin out of thousands. */\n    private final ConcurrentHashMap&lt;K, CacheEntry&lt;V&gt;&gt; map = new ConcurrentHashMap&lt;&gt;();\n    /** One claim per key that is being loaded right now. Winning a claim is a compare-and-set, not a lock. */\n    private final ConcurrentH

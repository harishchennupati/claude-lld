ass=\"prac on\"><div class=\"grade\"><b>How to use this page.</b> First implement the whole system from a blank file, sixty minutes, until a main compiles and runs. Then take the questions one at a time: read it, start its timer, answer <i>in code</i> in your own file, and only then open the fold. The fold says in plain English what the reference code does, then shows it, with a copy button. The miss log at the bottom is the output of the session.</div><div class=\"card\"><div class=\"ch\"><h3>0 &middot; Implement the system</h3><button class=\"timer\" data-min=\"60\">start 60:00</button></div><div class=\"cb\"><div class=\"prompt\">\"Build me a thread-safe cache with a time to live. <code>put</code>, <code>get</code>, and a <code>getOrLoad</code> that takes a loader for a miss. Entries expire, expired entries must never be served, and they must not pile up forever. Many threads will hammer it at once. I want working code, not a diagram. Go.\"</div>Before typing, write your six to eight clarifying questions (where time comes from is the first one); then type in the order of Main.java: the RemovalCause enum, the Clock interface with its two implementations, the TtlPolicy interface with FixedTtl and the JitteredTtl wrapper, the RemovalListener and Loader interfaces, the immutable CacheEntry, the Cache interface, then TtlCache &mdash; the two maps, get with its compare-and-remove, getOrLoad with the claim and the five-step order, then the bounded form of the wait, sweepOnce and the daemon sweeper &mdash; and finally a main with a manual clock and a fifty-thread race.</div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>1 &middot; A million keys were written in the same minute. At the end of that minute they all expire together and a million loads hit the database at once. Fix it without touching TtlCache.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The TTL is already a rule behind an interface, so this is one new class that wraps the old one. JitteredTtl asks the rule it wraps for a TTL and then subtracts a random slice of it, up to twenty percent, so a million keys written in the same millisecond get a million different deadlines spread over a twelve-second window. It only ever shortens, never lengthens, so it cannot cause a stale value to be served. Nothing else moves: the cache, the tests and the read path are untouched, and it wraps any rule, including the per-prefix one in Extensions.java and any rule written next year. That is Decorator, and it was born in move 3 as a rule that wraps a rule &mdash; not chosen because the pattern is nice.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n * Decorator over any TTL rule: shortens each TTL by a random slice, up to percent of it.\n * A million keys written in the same minute would otherwise all die in the same millisecond and\n * send a million loads at the database at once. Jitter spreads those deadlines over a window.\n */\nfinal class JitteredTtl&lt;K&gt; implements TtlPolicy&lt;K&gt; {\n    private final TtlPolicy&lt;K&gt; base;\n    private final int percent;\n    JitteredTtl(TtlPolicy&lt;K&gt; base, int percent) {\n        this.base = Objects.requireNonNull(base);\n        if (percent &lt; 0 || percent &gt; 90) throw new IllegalArgumentException(&quot;jitter must be 0..90%&quot;);\n        this.percent = percent;\n    }\n    /** The wrapped rule&#x27;s answer, minus up to percent of it. Never lengthens a TTL, so it cannot serve stale. */\n    public long ttlMsFor(K key) {\n        long ttl = base.ttlMsFor(key);\n        if (ttl &lt;= 0) return ttl;\n        long span = ttl * percent / 100;\n        return span &lt;= 0 ? ttl : ttl - ThreadLocalRandom.current().nextLong(span + 1);\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>2 &middot; Fifty threads miss the same cold key at the same instant. Prove, with a test, that the loader ran exactly once.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The test starts fifty threads on a latch so they all miss together, and counts the calls to the loader. The trick that makes it deterministic rather than flaky is that the loader does not return until all forty-nine losers have provably joined: it waits on the cache's own joins counter, with a fifteen-second ceiling so a broken design fails the test instead of hanging it. Without that, a slow machine could let the winner finish before a straggler arrives, and the straggler would get a cache hit instead of joining, and the counts would wobble. Four things are asserted: exactly one call to the loader, all fifty threads got the same value, exactly forty-nine of them rode the winner's result, and exactly one entry was stored.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 4. fifty threads miss one cold key at the same instant: the loader runs exactly once.\n        //    The loader does not return until all forty-nine losers are provably waiting on it, so the\n        //    count is the same on a fast laptop and a loaded build box.\n        ExecutorService pool = Executors.newFixedThreadPool(50);\n        TtlCache&lt;String, String&gt; hot = new TtlCache&lt;&gt;(60_000);\n        hot.configure(new FixedTtl&lt;&gt;(60_000), new SystemClock());\n        AtomicInteger calls = new AtomicInteger();\n        Loader&lt;String, String&gt; slow = key -&gt; {\n            calls.incrementAndGet();\n            waitUntil(() -&gt; hot.joins.sum() &gt;= 49, 15_000);      // every other thread is now inside the wait\n            return &quot;row-&quot; + key;\n        };\n        CountDownLatch go = new CountDownLatch(1);\n        List&lt;Future&lt;String&gt;&gt; answers = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 50; i++)\n            answers.add(pool.submit(() -&gt; { go.await(); return hot.getOrLoad(&quot;user:42&quot;, slow); }));\n        go.countDown();\n        Set&lt;String&gt; distinct = new HashSet&lt;&gt;();\n        for (Future&lt;String&gt; f : answers) distinct.add(f.get(30, TimeUnit.SECONDS));\n        check(calls.get() == 1, &quot;50 threads, one cold key, exactly 1 call to the loader (was &quot; + calls.get() + &quot;)&quot;);\n        check(distinct.equals(Set.of(&quot;row-user:42&quot;)), &quot;and all 50 threads got the same value&quot;);\n        check(hot.joins.sum() == 49, &quot;the other 49 rode the winner&#x27;s result instead of loading&quot;);\n        check(hot.size() == 1, &quot;and exactly one entry was stored&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>3 &middot; You have told me there is no lock of your own anywhere. So what actually serialises here, and when does this stop scaling?</h3><button class=\"timer\" data-min=\"6\">start 6:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Three things, and only the third is a real limit. A read serialises on nothing at all: one volatile read of an array slot, about forty nanoseconds. A write takes one bin of the ConcurrentHashMap for about a hundred nanoseconds, and two writers only collide when their keys land in the same bin, which with sixteen thousand bins is about one put in sixteen thousand &mdash; while the loader, the only slow thing in the system, is called with nothing held. What eventually bites is the sweeper, whose pass is O(n) over the whole map, and the counters, which is why they are LongAdder and not AtomicLong: fifty thousand increments a second on one AtomicLong is itself a contention point. The ladder from there is a deadline queue, then sharding.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The value, or null. The order matters: read the entry first, then read the clock, then decide.\n     * If the deadline has passed the entry is reclaimed with a compare-and-remove on the entry itself,\n     * so a value that another thread installed in the meantime survives. An expired value is never returned.\n     */\n    public V get(K key) {\n        CacheEntry&lt;V&gt; e = map.get(key);                       // no lock: a volatile read of one array slot\n        if (e == null) { misses.increment(); return null; }\n        long now = clock.nowMs();\n        if (e.isLive(now)) { hits.increment(); return e.value; }\n        if (map.remove(key, e)) {                             // identity, not key: never delete a fresher entry\n            expiredOnRead.increment();\n            fire(key, e.value, RemovalCause.EXPIRED);\n        }\n        misses.increment();\n        return null;\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>4 &middot; The forty-nine threads that did not win the claim -- how exactly do they wait, and can one of them miss the wakeup?</h3><button class=\"timer\" data-min=\"6\">start 6:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>They hold the winner's CompletableFuture and call <code>join</code> on it, which parks the thread and holds nothing at all. No wakeup can go missing, and the sentence to have ready is that a completed future is a latch, not a bell: the winner calls <code>complete</code> once, and every thread that joins afterwards returns immediately with the same value. That is the wait protocol &mdash; change the state first, signal second, and let a late arriver test the state instead of listening for the signal. The code below writes the same protocol by hand, and all three lines are load-bearing: take the lock, test the <code>done</code> flag <i>under</i> the lock, and wait in a <i>loop</i>. Delete the flag and a <code>notifyAll</code> sent a microsecond too early is gone for good, which is the <b>lost wakeup</b> that <code>lostWakeup()</code> reproduces on demand, with a timed wait so it reports the bug instead of hanging; use an <code>if</code> where a <code>while</code> belongs and a wakeup nobody sent hands the caller a half-built answer, which is the <b>spurious wakeup</b>. Both versions load once for thirty threads, so the future wins on there being no flag to forget, not on speed.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: the monitor version -- the same single-flight in wait/notify, and a lost wakeup reproduced\n/**\n * The same &quot;one loader per key&quot; written the old way, with a monitor instead of a future, because an\n * interviewer on a multi-threading round will ask for it. The protocol has three parts and all three are\n * load-bearing: take the lock, test the condition UNDER the lock, and wait in a LOOP, never an if. The\n * winner changes the state first and signals second, inside the same monitor, so a waiter can only be\n * either before the change (it waits, and the notifyAll reaches it) or after it (done is already true and\n * it never waits at all). Delete the done flag and you have a lost wakeup; replace the while with an if\n * and a spurious wakeup -- a wait() that returns with nobody having signalled, which the JVM is allowed to\n * do -- hands the caller a null. The future version in Main.java has neither hole, because a completed\n * future is a latch and not an edge: joining one that has already completed returns immediately.\n */\nfinal class MonitorSingleFlight&lt;K, V&gt; {\n    /** One per load in flight. Every field is guarded by the slot&#x27;s own monitor. */\n    private static final class Slot&lt;V&gt; {\n        boolean done;\n        V value;\n        RuntimeException failure;\n    }\n    private final ConcurrentHashMap&lt;K, Slot&lt;V&gt;&gt; slots = new ConcurrentHashMap&lt;&gt;();\n    private final ConcurrentHashMap&lt;K, V&gt; values = new ConcurrentHashMap&lt;&gt;();\n    private final LongAdder loads = new LongAdder();\n\n    /** One loader call per key, however many threads arrive; every waiter gets the winner&#x27;s answer. */\n    V get(K key, Loader&lt;K, V&gt; loader) throws InterruptedException {\n        V cached = values.get(key);\n        if (cached != null) return cached;\n        Slot&lt;V&gt; mine = new Slot&lt;&gt;();\n        Slot&lt;V&gt; running = slots.putIfAbsent(key, mine);\n        if (running == null) {                                   // this thread won the claim: it loads\n            V value = null; RuntimeException failure = null;\n            try { loads.increment(); value = loader.load(key); values.put(key, value); }\n            catch (RuntimeException re) { failure = re; }\n            finally {\n                slots.remove(key, mine);\n                synchronized (mine) {                            // change the state and signal, same monitor\n                    mine.value = value; mine.failure = failure; mine.done = true;\n                    mine.notifyAll();\n                }\n            }\n            if (failure != null) throw failure;\n            return value;\n        }\n        synchronized (running) {                                 // a loser: the wait protocol, all three parts\n            while (!running.done) running.wait();\n        }\n        if (running.failure != null) throw running.failure;\n        return running.value;\n    }\n\n    long loads() { return loads.sum(); }\n\n    /**\n     * A lost wakeup, reproduced and then made survivable. The waiter is held until the signal has already\n     * been sent, so the notifyAll it is waiting for is gone before it ever waits. With no flag to test there\n     * is nothing in the code that can notice, and the only reason this method returns at all is that the\n     * wait is timed. This is the bug the done flag above exists to make impossible.\n     */\n    static String lostWakeup() throws InterruptedException {\n        Object monitor = new Object();\n        CountDownLatch signalSent = new CountDownLatch(1);\n        Thread signaller = new Thread(() -&gt; {\n            synchronized (monitor) { monitor.notifyAll(); }\n            signalSent.countDown();\n        }, &quot;signaller&quot;);\n        signaller.start();\n        signalSent.await();                                      // the signal is already spent\n        long t0 = System.nanoTime();\n        synchronized (monitor) { monitor.wait(200); }            // no condition to test: nothing can know\n        long waitedMs = (System.nanoTime() - t0) / 1_000_000L;\n        signaller.join();\n        return waitedMs &gt;= 150\n            ? &quot;the signal was missed: this wait ended on its 200ms timeout, not on a notify&quot;\n            : &quot;the wait ended after &quot; + waitedMs + &quot;ms, so the signal was not missed&quot;;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>5 &middot; The loader throws halfway through, or never returns at all. What is in the cache afterwards, and what does the next caller see?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Nothing is in the cache. The order is deliberate: the loader is called first, and the map is only written after it returns, so a failure means there was never anything to undo. The future is completed exceptionally, so all nineteen waiters are told the same failure rather than hanging, and the claim is released in a finally block, so the very next caller starts a clean load rather than finding a poisoned key. The test proves all three: twenty callers fail, the loader was called once, the cache is empty, and the next call succeeds. A loader that never returns is a different problem, and it is fixed on the loader rather than inside the cache: BoundedLoader wraps any loader and runs it with a deadline, which turns a hang into an exception the cache already knows how to handle.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The winner&#x27;s path, and the order is the whole design: call the loader with nothing held, store the\n     * entry, and only then release the waiters, so a waiter can never see a value the map does not have.\n     * If the loader throws, nothing was written, every waiter is told, and the claim is released in the\n     * finally block, so the very next caller starts a clean load.\n     */\n    private V loadAndPublish(K key, Loader&lt;K, V&gt; loader, CompletableFuture&lt;CacheEntry&lt;V&gt;&gt; mine) {\n        try {\n            loadCalls.increment();\n            V value = require(key, loader.load(key));         // the slow call: outside every lock in the process\n            long now = clock.nowMs();\n            CacheEntry&lt;V&gt; fresh = new CacheEntry&lt;&gt;(value, now, deadline(now, ttl.ttlMsFor(key)));\n            map.put(key, fresh);                              // publish to the map first ...\n            mine.complete(fresh);                             // ... then wake everyone who is waiting\n            return value;\n        } catch (RuntimeException | Error ex) {\n            mine.completeExceptionally(ex);                   // nothing stored; every waiter sees this failure\n            throw ex;\n        } finally {\n            loading.remove(key, mine);                        // identity again: never drop somebody else&#x27;s claim\n        }\n    }\n\n// ---- ext: a loader that never returns -- the timeout belongs on the loader, not inside the cache\n/**\n * The cache waits on the winner with join(), which has no deadline: a loader that hangs hangs every waiter.\n * Rather than teach the cache about timeouts, wrap the loader. One decorator, and every cache in the\n * process gets a bounded load, including the ones written next year.\n */\nfinal class BoundedLoader&lt;K, V&gt; implements Loader&lt;K, V&gt; {\n    private final Loader&lt;K, V&gt; base;\n    private final long timeoutMs;\n    private final ExecutorService pool = Executors.newCachedThreadPool(r -&gt; {\n        Thread t = new Thread(r, &quot;loader&quot;); t.setDaemon(true); return t;\n    });\n    BoundedLoader(Loader&lt;K, V&gt; base, long timeoutMs) { this.base = base; this.timeoutMs = timeoutMs; }\n    /** Throws instead of hanging. The cache then writes nothing and releases the claim in its finally block. */\n    public V load(K key) {\n        Future&lt;V&gt; f = pool.submit(() -&gt; base.load(key));\n        try {\n            return f.get(timeoutMs, TimeUnit.MILLISECONDS);\n        } catch (TimeoutException te) {\n            f.cancel(true);\n            throw new IllegalStateException(&quot;load timed out after &quot; + timeoutMs + &quot;ms for key &quot; + key);\n        } catch (ExecutionException ee) {\n            Throwable c = ee.getCause();\n            throw (c instanceof RuntimeException re) ? re : new IllegalStateException(c);\n        } catch (InterruptedException ie) {\n            Thread.currentThread().interrupt();\n            throw new IllegalStateException(&quot;interrupted while loading &quot; + key);\n        }\n    }\n    void close() { pool.shutdownNow(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>6 &middot; A request thread cannot sit behind somebody else&#x27;s twenty-second load. Give it a deadline -- and tell me what happens if that thread is cancelled.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The three-argument <code>getOrLoad</code> is this answer. It waits with <code>get(timeout)</code> instead of <code>join</code>, so it throws <code>TimeoutException</code> when the deadline passes and <code>InterruptedException</code> if the thread is interrupted, both checked on purpose: a caller that asked for a deadline has to decide what to do when it arrives. The deadline bounds the <i>wait</i> and nothing else &mdash; the thread running the loader is never cut off by somebody else's impatience, and a load that hangs is bounded by wrapping the loader in <code>BoundedLoader</code> instead. Giving up starts no second load either, because the claim is still the winner's, so an impatient caller costs the database nothing. The interrupt is rethrown rather than swallowed, which is the rule to say out loud: the thread that was asked to stop is the thread that decides how. Tests 10 and 11 prove all of it, including that the loading thread finishes normally after a waiter beside it was interrupted.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * The value, loading it on a miss. Exactly one thread per key runs the loader; the others wait on its\n     * result holding no lock. This form waits as long as the load takes and cannot be interrupted.\n     */\n    public V getOrLoad(K key, Loader&lt;K, V&gt; loader) {\n        try {\n            return valueOrLoad(key, loader, -1L);             // -1 means join(): no deadline, no interrupt\n        } catch (TimeoutException | InterruptedException neither) {\n            throw new AssertionError(&quot;join() throws neither&quot;, neither);\n        }\n    }\n\n    /** The value, giving up after timeoutMs of waiting for another thread&#x27;s load, and honouring an interrupt. */\n    public V getOrLoad(K key, Loader&lt;K, V&gt; loader, long timeoutMs) throws TimeoutException, InterruptedException {\n        if (timeoutMs &lt; 0) throw new IllegalArgumentException(&quot;timeoutMs must not be negative&quot;);\n        return valueOrLoad(key, loader, timeoutMs);\n    }\n\n    /**\n     * One loop for both forms. The loop goes round a second time only when the winner&#x27;s value had already\n     * died by the time the waiter was woken, which needs a TTL shorter than a load; each extra round either\n     * hands back a live value or makes this thread the next loader, so nobody spins without doing work.\n     */\n    private V valueOrLoad(K key, Loader&lt;K, V&gt; loader, long timeoutMs) throws TimeoutException, InterruptedException {\n        Objects.requireNonNull(key, &quot;key&quot;); Objects.requireNonNull(loader, &quot;loader&quot;);\n        if (ttl.ttlMsFor(key) &lt;= 0) { loadCalls.increment(); return require(key, loader.load(key)); }\n        long deadlineNs = timeoutMs &lt; 0 ? 0L : System.nanoTime() + timeoutMs * 1_000_000L;\n        while (true) {\n            V hit = get(key);\n            if (hit != null) return hit;\n            CompletableFuture&lt;CacheEntry&lt;V&gt;&gt; mine = new CompletableFuture&lt;&gt;();\n            CompletableFuture&lt;CacheEntry&lt;V&gt;&gt; running = loading.putIfAbsent(key, mine);\n            if (running == null) return loadAndPublish(key, loader, mine);   // this thread won the claim\n            joins.increment();\n            CacheEntry&lt;V&gt; e = timeoutMs &lt; 0 ? await(running)  // a loser: no lock held, just a handle on a result\n                                            : awaitUntil(running, deadlineNs);\n            if (e.isLive(clock.nowMs())) return e.value;\n            staleJoins.increment();          // the value died while we waited: go round, and one of us reloads\n        }\n    }\n\n/**\n     * The same wait with a deadline, which is also the only form that answers an interrupt. InterruptedException\n     * is rethrown rather than swallowed: the thread that asked for a bounded wait is the thread that must decide.\n     */\n    private static &lt;T&gt; T awaitUntil(CompletableFuture&lt;T&gt; f, long deadlineNs)\n            throws TimeoutException, InterruptedException {\n        long leftNs = deadlineNs - System.nanoTime();\n        if (leftNs &lt;= 0) throw new TimeoutException(&quot;gave up waiting for another thread&#x27;s load&quot;);\n        try {\n            return f.get(leftNs, TimeUnit.NANOSECONDS);\n        } catch (ExecutionException ee) {\n            Throwable cause = ee.getCause();\n            if (cause instanceof RuntimeException re) throw re;\n            if (cause instanceof Error err) throw err;\n            throw new CompletionException(cause);\n        }\n    }\n\n        // 11. a waiter that is cancelled. The bounded form answers an interrupt instead of swallowing it,\n        //     and the thread that was loading is not disturbed by it.\n        TtlCache&lt;String, String&gt; cancelled = new TtlCache&lt;&gt;(60_000);\n        cancelled.configure(new FixedTtl&lt;&gt;(60_000), new SystemClock());\n        CountDownLatch releaseSlow = new CountDownLatch(1), slowIn = new CountDownLatch(1);\n        Future&lt;String&gt; slowWinner = pool.submit(() -&gt; cancelled.getOrLoad(&quot;c&quot;, key -&gt; {\n            slowIn.countDown();\n            try { releaseSlow.await(20, TimeUnit.SECONDS); }\n            catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n            return &quot;done&quot;;\n        }));\n        check(slowIn.await(10, TimeUnit.SECONDS), &quot;the slow loader is running and is holding the claim&quot;);\n        AtomicBoolean sawInterrupt = new AtomicBoolean(false);\n        Thread waiter = new Thread(() -&gt; {\n            try { cancelled.getOrLoad(&quot;c&quot;, key -&gt; &quot;never called&quot;, 20_000); }\n            catch (InterruptedException ie) { sawInterrupt.set(true); }\n            catch (TimeoutException te) { /* a different failure; the check below catches it */ }\n        }, &quot;waiter&quot;);\n        waiter.start();\n        check(waitUntil(() -&gt; cancelled.joins.sum() &gt;= 1, 10_000), &quot;a second thread is waiting on that claim&quot;);\n        waiter.interrupt();\n        waiter.join(10_000);\n        check(sawInterrupt.get(), &quot;the interrupted waiter threw InterruptedException instead of waiting on&quot;);\n        check(!waiter.isAlive(), &quot;and its thread finished rather than hanging behind a wedged load&quot;);\n        releaseSlow.countDown();\n        check(&quot;done&quot;.equals(slowWinner.get(20, TimeUnit.SECONDS)), &quot;the loading thread was untouched by that interrupt&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>7 &middot; Set the TTL to one millisecond and let the loader take thirty. A waiter now wakes to a value that is already dead. Does anybody starve in that loop?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>No, and the reason is worth saying precisely rather than waving at. <code>getOrLoad</code> loops, and a second round only happens when the winner's value had already expired by the time the waiter was woken, which needs a TTL shorter than a load. Each extra round then does one of exactly two things: it finds a live value and returns, or it makes this thread the next winner, which means it runs the loader itself and returns its own value however briefly that value lives. So the number of rounds is bounded by the number of threads and not by time, and nobody spins without doing work &mdash; which is freedom from starvation, not fairness, and the difference is worth naming before the interviewer does. Test 12 makes it deterministic with a clock that jumps five milliseconds every time it is read: ten callers, ten loads, all ten return. The <code>staleJoins</code> counter exists so that in production this is something you can see rather than guess at.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">        // 12. the retry loop terminates. With a TTL shorter than a load, a waiter is woken with a value that\n        //     has already died, so it goes round again -- and every round either serves or loads, never spins.\n        //     The clock is the seam again: this one is five milliseconds later every time it is read, which\n        //     makes &quot;the value died before the waiters woke&quot; happen on every run instead of once in a while.\n        AtomicLong fastForward = new AtomicLong(1_000_000L);\n        TtlCache&lt;String, String&gt; tiny = new TtlCache&lt;&gt;(1);\n        tiny.configure(new FixedTtl&lt;&gt;(1), () -&gt; fastForward.addAndGet(5));\n        AtomicInteger tinyLoads = new AtomicInteger();\n        Loader&lt;String, String&gt; slowish = key -&gt; {\n            tinyLoads.incrementAndGet();\n            try { Thread.sleep(10); } catch (InterruptedException ie) { Thread.currentThread().interrupt(); }\n            return &quot;v&quot;;\n        };\n        CountDownLatch go5 = new CountDownLatch(1);\n        List&lt;Future&lt;String&gt;&gt; tinyGot = new ArrayList&lt;&gt;();\n        for (int i = 0; i &lt; 10; i++)\n            tinyGot.add(pool.submit(() -&gt; { go5.await(); return tiny.getOrLoad(&quot;hot&quot;, slowish); }));\n        go5.countDown();\n        int served = 0;\n        for (Future&lt;String&gt; f : tinyGot) if (&quot;v&quot;.equals(f.get(30, TimeUnit.SECONDS))) served++;\n        check(served == 10, &quot;all 10 callers returned a value although every value died before they woke&quot;);\n        check(tinyLoads.get() &gt;= 2 &amp;&amp; tinyLoads.get() &lt;= 10,\n              &quot;the loads stayed bounded by the thread count: &quot; + tinyLoads.get() + &quot; loads for 10 callers&quot;);\n        check(tiny.staleJoins.sum() &gt; 0, &quot;the retry loop really ran: &quot; + tiny.staleJoins.sum() + &quot; waiters woke to a dead value&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>8 &middot; The sweeper is walking the map when another thread refreshes the very key it is holding. Show me the line that stops the fresh value being deleted, and the test for it.</h3><button class=\"timer\" data-min=\"6\">start 6:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The line is <code>map.remove(key, e)</code> instead of <code>map.remove(key)</code>. The two-argument form is a compare-and-remove: it deletes the mapping only if the value there is still the exact object the sweeper picked up, and CacheEntry deliberately does not override equals, so that comparison is object identity. If a refresh landed in between, the map holds a different object and the remove does nothing. The same line is in the read path, for the same reason. The test makes the interleaving deterministic with the seam move 3 already gave us: the sweeper reads the clock between picking the entry up and removing it, so a test clock that performs the refresh inside that read reproduces the race exactly, every run.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/**\n     * One sweep: reclaim every entry whose deadline has passed, and nothing else. The iterator is weakly\n     * consistent, so it never throws and may miss a key added mid-pass, which is fine: the next pass gets it.\n     * The compare-and-remove is the point of the method. A plain map.remove(key) here would delete the value\n     * a refresh installed in the microsecond between reading the entry and removing it.\n     */\n    int sweepOnce() {\n        int removed = 0;\n        for (Map.Entry&lt;K, CacheEntry&lt;V&gt;&gt; en : map.entrySet()) {\n            CacheEntry&lt;V&gt; e = en.getValue();\n            if (e.isLive(clock.nowMs())) continue;\n            if (map.remove(en.getKey(), e)) {\n                removed++;\n                sweptCount.increment();\n                fire(en.getKey(), e.value, RemovalCause.SWEPT);\n            }\n        }\n        return removed;\n    }\n\n        // 3. the identity check: a value refreshed while the sweeper was looking at the old one survives.\n        //    The injected clock is the seam: the sweeper reads the clock between picking the entry up and\n        //    removing it, so a clock that writes at that instant reproduces the race exactly, every run.\n        ManualClock clock3 = new ManualClock();\n        TtlCache&lt;String, String&gt; c3 = new TtlCache&lt;&gt;(100);\n        AtomicBoolean armed = new AtomicBoolean(false);\n        c3.configure(new FixedTtl&lt;&gt;(100), () -&gt; {\n            long now = clock3.nowMs();\n            if (armed.compareAndSet(true, false)) c3.put(&quot;k&quot;, &quot;refreshed&quot;);   // the concurrent write\n            return now;\n        });\n        c3.put(&quot;k&quot;, &quot;stale&quot;);\n        clock3.advance(200);                     // &quot;stale&quot; is now past its deadline\n        armed.set(true);                         // the refresh lands inside the sweeper&#x27;s own clock read\n        check(c3.sweepOnce() == 0, &quot;the sweeper removed nothing: the entry it held was not the entry in the map&quot;);\n        check(&quot;refreshed&quot;.equals(c3.get(&quot;k&quot;)), &quot;the refreshed value survived a sweep already looking at that key&quot;);\n        check(c3.sweptCount.sum() == 0, &quot;and nothing was reported as swept&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>9 &middot; Where does time come from, and how do you test a one-hour TTL without waiting an hour?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Time comes from a one-method interface that is handed in, never from a call to System.nanoTime inside the cache. Production passes SystemClock, which uses nanoTime rather than currentTimeMillis so that an NTP correction cannot make a TTL run backwards. A test passes ManualClock and jumps it forward by an hour in one statement, so every TTL assertion is exact and instant &mdash; the whole failure-test file runs in under a second. It also buys the thing you cannot get any other way: because the clock is a collaborator, a test can hand in a clock with a side effect and reproduce a two-thread interleaving deterministically, which is how the sweeper race above is tested.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Where time comes from. One method, handed in, so a test can jump an hour instead of sleeping an hour. */\ninterface Clock { long nowMs(); }\n\n/** The real clock. nanoTime, not currentTimeMillis: a clock correction must never make a TTL run backwards. */\nfinal class SystemClock implements Clock {\n    /** Milliseconds on a monotonic timeline. Only differences mean anything; the origin is arbitrary. */\n    public long nowMs() { return System.nanoTime() / 1_000_000L; }\n}\n\n/** A clock a test drives by hand. Thread-safe, because race tests read it from many threads while advancing it. */\nfinal class ManualClock implements Clock {\n    private final AtomicLong nowMs = new AtomicLong(1_000_000L);\n    /** The time this clock is standing at. */\n    public long nowMs() { return nowMs.get(); }\n    /** Jump forward. Nothing expires as a side effect: expiry is decided by whoever reads the entry next. */\n    public void advance(long ms) { nowMs.addAndGet(ms); }\n}\n\n        // 1. an expired value is never handed back, and the read that finds it dead reclaims it\n        ManualClock clock = new ManualClock();\n        TtlCache&lt;String, String&gt; c = new TtlCache&lt;&gt;(100);\n        c.configure(new FixedTtl&lt;&gt;(100), clock);\n        List&lt;RemovalCause&gt; seen = Collections.synchronizedList(new ArrayList&lt;&gt;());\n        c.addListener((k, v, cause) -&gt; seen.add(cause));\n\n        c.put(&quot;k&quot;, &quot;v1&quot;);\n        check(&quot;v1&quot;.equals(c.get(&quot;k&quot;)), &quot;a fresh value reads back&quot;);\n        clock.advance(99);\n        check(&quot;v1&quot;.equals(c.get(&quot;k&quot;)), &quot;one millisecond before the deadline it is still served&quot;);\n        clock.advance(1);\n        check(c.get(&quot;k&quot;) == null, &quot;at the deadline the value is gone: an expired value is never returned&quot;);\n        check(c.size() == 0, &quot;the read that found it dead reclaimed the entry, so nothing leaks&quot;);\n        check(seen.equals(List.of(RemovalCause.EXPIRED)), &quot;and the listener heard EXPIRED exactly once&quot;);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>10 &middot; A hot key expires and every request for it now waits twenty milliseconds for the reload. Serve the old value instead, and refresh it behind the caller.</h3><button class=\"timer\" data-min=\"10\">start 10:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Give the entry a soft deadline in front of its hard one. A read past the soft deadline returns the value it already has, immediately, and kicks off exactly one background reload; a read past the hard deadline still blocks on a normal load, so a value can never be served indefinitely. The single-flight idea appears a second time here, for the reload: a putIfAbsent on a refreshing map means only one background thread is ever reloading a key. It is built on the public API only &mdash; get, getOrLoad and put &mdash; so TtlCache itself does not change. In the state machine it is one new state, REFRESHING, which is why move 12 calls this \"a new step in a life\".</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: refresh-ahead -- serve the value that is still live while exactly one thread reloads behind it\n/**\n * Gives an entry a soft deadline before its hard one. A read past the soft deadline returns the value\n * immediately and kicks off one background reload; a read past the hard deadline blocks on a normal load.\n * Nobody ever waits for a hot key again, at the price of one extra load per key per window. Built on the\n * public API only: the claim map here is a second single-flight, this time for the reload.\n */\nfinal class RefreshAhead&lt;K, V&gt; {\n    private final TtlCache&lt;K, V&gt; cache;\n    private final long refreshAfterMs;\n    private final Clock clock;\n    private final ConcurrentHashMap&lt;K, Long&gt; softDeadline = new ConcurrentHashMap&lt;&gt;();\n    private final ConcurrentHashMap&lt;K, Boolean&gt; refreshing = new ConcurrentHashMap&lt;&gt;();\n    private final ExecutorService pool = Executors.newFixedThreadPool(2, r -&gt; {\n        Thread t = new Thread(r, &quot;refresh-ahead&quot;); t.setDaemon(true); return t;\n    });\n\n    RefreshAhead(TtlCache&lt;K, V&gt; cache, long refreshAfterMs, Clock clock) {\n        this.cache = cache; this.refreshAfterMs = refreshAfterMs; this.clock = clock;\n    }\n\n    /** A read that never blocks once the key is warm. */\n    V get(K key, Loader&lt;K, V&gt; loader) {\n        V live = cache.get(key);\n        if (live == null) {                                   // cold or past the hard deadline: a normal load\n            V loaded = cache.getOrLoad(key, loader);\n            softDeadline.put(key, clock.nowMs() + refreshAfterMs);\n            return loaded;\n        }\n        Long soft = softDeadline.get(key);\n        if (soft != null &amp;&amp; clock.nowMs() &gt;= soft &amp;&amp; refreshing.putIfAbsent(key, Boolean.TRUE) == null) {\n            pool.execute(() -&gt; {                              // one reload, in the background, no caller waits\n                try {\n                    cache.put(key, loader.load(key));\n                    softDeadline.put(key, clock.nowMs() + refreshAfterMs);\n                } catch (RuntimeException ignored) {\n                    // keep serving the value we have; the hard deadline is still the safety net\n                } finally {\n                    refreshing.remove(key);\n                }\n            });\n        }\n        return live;\n    }\n\n    /** Wait for any background reload to finish. Test helper; production never needs it. */\n    boolean quiet(long timeoutMs) throws InterruptedException {\n        long end = System.nanoTime() + timeoutMs * 1_000_000L;\n        while (!refreshing.isEmpty() &amp;&amp; System.nanoTime() &lt; end) Thread.sleep(2);\n        return refreshing.isEmpty();\n    }\n\n    void close() { pool.shutdownNow(); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>11 &middot; A scraper is asking for a million ids that do not exist. Every one of them is a miss and every one of them reaches the database.</h3><button class=\"timer\" data-min=\"6\">start 6:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Remember the absence as well as the value. A second cache, with a much shorter TTL, holds a tombstone for keys the loader said were not there, so a repeated lookup of a missing id is answered from memory for the tombstone window instead of becoming a query. The two TTLs are deliberately different: sixty seconds for a real value, five for a tombstone, because being wrong about an absence is cheap to fix and you do not want a row that appears a second later to stay invisible for a minute. The one thing it changes in the core is a rule that was already there: a loader returning null is an error in TtlCache, so negative caching is an explicit feature rather than a silent default.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: negative caching -- a short-lived tombstone so a flood of misses does not become a flood of queries\n/**\n * A key that does not exist is the worst case for a cache: every lookup is a miss, so every lookup reaches\n * the database. Remember the absence too, in a second cache with a much shorter TTL, so a scraper asking\n * for a million ids that do not exist costs one query each per short window instead of one query each.\n */\nfinal class NegativeCache&lt;K, V&gt; {\n    private final TtlCache&lt;K, V&gt; present;\n    private final TtlCache&lt;K, Boolean&gt; absent;\n\n    NegativeCache(TtlCache&lt;K, V&gt; present, TtlCache&lt;K, Boolean&gt; absent) {\n        this.present = present; this.absent = absent;\n    }\n\n    /** Null means &quot;really not there&quot;, and that answer is remembered for the tombstone TTL. */\n    V get(K key, Loader&lt;K, V&gt; loader) {\n        V hit = present.get(key);\n        if (hit != null) return hit;\n        if (Boolean.TRUE.equals(absent.get(key))) return null;      // remembered: it is not there\n        V loaded = loader.load(key);                                 // may legitimately return null\n        if (loaded == null) { absent.put(key, Boolean.TRUE); return null; }\n        present.put(key, loaded);\n        absent.invalidate(key);\n        return loaded;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">functional</span><h3>12 &middot; This cache is unbounded. It has to fit in memory. Add a size bound.</h3><button class=\"timer\" data-min=\"6\">start 6:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>The half of this answer that earns marks is why the bound cannot go <i>inside</i> TtlCache. The cache records nothing about reads &mdash; <code>get</code> touches no ordering at all, which is exactly why it takes no lock &mdash; so there is nothing in it to rank keys by. A bound therefore goes <i>on</i> it, as a wrapper that brings whatever state the victim rule needs. The one below keeps the cheapest such state, the order keys were written in, and evicts the oldest write: that is FIFO, not LRU, and calling it by its right name is the point. The bound is soft on purpose, because the size is read and then a victim is evicted, so a burst between those two steps overshoots by a handful of entries; Caffeine makes the same trade. Which key to throw away, and the O(1) structures that answer it in one step instead of a scan, belong to <a href=\"lru-workbench.html\">the LRU page</a> and <a href=\"cache-eviction-workbench.html\">the cache-eviction page</a>.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: a size bound -- the seam for it, and why a TTL cache has nothing to rank keys by\n/**\n * The TTL cache is unbounded on purpose, and the reason is worth saying out loud: it records nothing about\n * reads. get() touches no ordering, which is exactly why it takes no lock. So a bound cannot be added to it;\n * it has to be added ON it, together with whatever state the victim rule needs. This wrapper keeps the\n * cheapest such state, the order in which keys were written, and evicts the oldest write. That is FIFO, not\n * LRU, and the honest line in an interview is that it is FIFO because nothing here knows what was read.\n * The bound is also soft: size() is read, then a victim is evicted, and a burst between those two steps\n * overshoots by a handful of entries. A hard bound needs one global counter on every write, which is the one\n * thing this design refuses; Caffeine makes the same trade. The ranking rules themselves -- LRU, LFU,\n * W-TinyLFU and the O(1) structures behind them -- are the subject of the LRU and eviction pages, not this one.\n */\nfinal class BoundedTtlCache&lt;K, V&gt; {\n    private final TtlCache&lt;K, V&gt; cache;\n    private final int capacity;\n    /** Write order, and nothing else: key -&gt; the ticket it took when it was written. */\n    private final ConcurrentHashMap&lt;K, Long&gt; writtenAt = new ConcurrentHashMap&lt;&gt;();\n    private final AtomicLong ticket = new AtomicLong();\n\n    BoundedTtlCache(TtlCache&lt;K, V&gt; cache, int capacity) { this.cache = cache; this.capacity = capacity; }\n\n    /** Store, then evict oldest-first while over the bound. No lock of ours, so the bound is approximate. */\n    void put(K key, V value) {\n        cache.put(key, value);\n        writtenAt.put(key, ticket.incrementAndGet());\n        while (cache.size() &gt; capacity) {\n            K victim = oldestWrite();\n            if (victim == null) break;\n            cache.invalidate(victim);                 // fires the listener with cause EXPLICIT\n            writtenAt.remove(victim);\n        }\n    }\n\n    /** A read does not reorder anything: that is the point of the class comment. */\n    V get(K key) {\n        V v = cache.get(key);\n        if (v == null) writtenAt.remove(key);\n        return v;\n    }\n\n    /** O(n) on purpose: this block exists to show the seam, and an O(1) ordering is what the LRU page builds. */\n    private K oldestWrite() {\n        K best = null; long lowest = Long.MAX_VALUE;\n        for (Map.Entry&lt;K, Long&gt; e : writtenAt.entrySet())\n            if (e.getValue() &lt; lowest) { lowest = e.getValue(); best = e.getKey(); }\n        return best;\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>13 &middot; Why not just use computeIfAbsent? It is one line and the JDK already does single-flight for you.</h3><button class=\"timer\" data-min=\"6\">start 6:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Because computeIfAbsent holds the bin's lock for the whole mapping function. For a fast function that is perfect; for a loader that takes twenty milliseconds it means every other key that hashes to that bin is blocked behind a database round trip, and the bin is one of several thousand keys' homes, not just this one's. There is a second, harder failure: a loader that touches the same map &mdash; a cache that looks something else up, a listener that writes back &mdash; is refused outright, and the JDK reports it as \"Recursive update\", which the probe below reproduces deterministically by forcing two keys into one bin. A future in a separate map costs one extra map and gives the loader the freedom to be slow, to fail, and to touch anything it likes.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: why not computeIfAbsent -- the bin lock is held for the whole loader call\n/**\n * computeIfAbsent looks like single-flight for free, and for a fast function it is. For a slow loader it is\n * a trap: the bin&#x27;s lock is held for the whole call, so every other key that hashes to that bin blocks\n * behind a database round trip. Worse, a loader that touches the same map is refused outright.\n * This method proves the second half, which the JDK detects and reports as &quot;Recursive update&quot;.\n */\nfinal class ComputeIfAbsentTrap {\n    /** Two keys forced into the same bin by a constant hash, so the nested write is detected, not silent. */\n    record SameBin(String id) {\n        public int hashCode() { return 7; }\n    }\n\n    /** Returns what the JDK did when a loader inside computeIfAbsent touched the same map. */\n    static String probe() {\n        ConcurrentHashMap&lt;SameBin, String&gt; map = new ConcurrentHashMap&lt;&gt;();\n        try {\n            map.computeIfAbsent(new SameBin(&quot;a&quot;), k -&gt; {\n                map.put(new SameBin(&quot;b&quot;), &quot;written from inside the mapping function&quot;);\n                return &quot;value&quot;;\n            });\n            return &quot;no error: the JDK allowed the nested write (bin layout dependent)&quot;;\n        } catch (IllegalStateException ise) {\n            return &quot;IllegalStateException: &quot; + ise.getMessage();\n        }\n    }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">non-functional</span><h3>14 &middot; size() is O(1) but it lies. What is the O(1) question this cache can actually answer, and what does the dashboard get?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>size() returns the number of entries in the map, which includes entries that are past their deadline but have not been read or swept yet, so it is an estimate that runs high between sweeps. Saying that out loud is the answer the interviewer wants, because the alternative &mdash; an exact live count &mdash; needs a shared counter updated on every write and every expiry, which is exactly the one global bottleneck the design avoids. liveSize() gives the exact number and is O(n), which is fine for a test or a once-a-minute metric and wrong for a hot path. What the dashboard actually wants is not a size but a hit rate, and that is O(1): seven LongAdders, summed on demand, which is also why they are LongAdders and not AtomicLongs.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">/** Entries held, including ones past their deadline that nobody has read or swept yet. An estimate. */\n    public int size() { return map.size(); }\n\n    /** The exact number of entries that would still be served. O(n): for tests and metrics, not the hot path. */\n    int liveSize() {\n        long now = clock.nowMs();\n        int n = 0;\n        for (CacheEntry&lt;V&gt; e : map.values()) if (e.isLive(now)) n++;\n        return n;\n    }\n\n    /** The counters an interviewer asks for: hit rate first, then how many loads the claim saved. */\n    String stats() {\n        long h = hits.sum(), m = misses.sum();\n        long rate = (h + m) == 0 ? 0 : (h * 100) / (h + m);\n        return &quot;hits=&quot; + h + &quot; misses=&quot; + m + &quot; hitRate=&quot; + rate + &quot;%&quot;\n             + &quot; loads=&quot; + loadCalls.sum() + &quot; joinedALoad=&quot; + joins.sum()\n             + &quot; staleJoins=&quot; + staleJoins.sum()\n             + &quot; expiredOnRead=&quot; + expiredOnRead.sum() + &quot; swept=&quot; + sweptCount.sum();\n    }\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">twist</span><h3>15 &middot; Two servers now. A write on one leaves the other one stale, and a restart empties both.</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Three moves, in the order you would make them. The entries go into Redis with the deadline handed to the store rather than tracked in the process, so expiry is the store's job and a restart loses nothing. The in-process cache stays, in front of it, with a much shorter TTL, because a network hop to Redis is still a hundred microseconds and a local hit is forty nanoseconds. And the claim becomes a lease: SET lock:key owner NX PX 5000, which is the same compare-and-set one layer out, with a TTL on the claim itself so a server that dies mid-load does not block the key forever. Invalidation travels by PUBLISH, and each process drops its own copy when it hears. The thing that does not change is the shape: the same claim, the same identity check, the same order at the critical step.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// ---- ext: two processes -- Redis, and how an invalidation travels between them\n/**\n * The moment there are two servers, an in-process cache is two caches, and a write on one leaves the other\n * one stale. Three moves, in the order you would make them: put the entries in Redis with the TTL as\n * part of the write; keep the in-process cache as a short-lived layer in front of it; and publish an\n * invalidation so the other process drops its copy. The claim becomes a Redis lock with its own TTL.\n */\nfinal class RemoteCacheSketch {\n    /** The write, with the deadline handed to the store rather than tracked here. */\n    static String writeCommand(String key, String value, long ttlMs) {\n        return &quot;SET &quot; + key + &quot; &quot; + value + &quot; PX &quot; + ttlMs;\n    }\n    /** The distributed claim: one loader per key across the whole fleet, and the claim itself expires. */\n    static String claimCommand(String key, String owner, long leaseMs) {\n        return &quot;SET lock:&quot; + key + &quot; &quot; + owner + &quot; NX PX &quot; + leaseMs;\n    }\n    /** What the other process must hear when a row changes, so its own copy is dropped. */\n    static String invalidateCommand(String key) {\n        return &quot;PUBLISH cache:invalidate &quot; + key;\n    }\n    /** The listener on the other side. Local drop only; the row in Redis is already correct. */\n    static void onInvalidation(Cache&lt;String, String&gt; local, String key) { local.invalidate(key); }\n}\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>16 &middot; Caffeine does all of this in one builder call. What did the JDK actually give you here, what did you have to write yourself, and when would you just use the library?</h3><button class=\"timer\" data-min=\"5\">start 5:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>Four things came free from <code>java.util.concurrent</code>, and each replaced something that is easy to write badly: <code>ConcurrentHashMap</code> is the per-bin locking and the lock-free read; <code>CompletableFuture</code> is the wait protocol, with no flag to forget and no monitor to hold; <code>ScheduledExecutorService</code> is the one daemon sweeper, on a fixed delay so passes cannot queue up behind each other; <code>LongAdder</code> is the counter that does not itself become the contention point. What the JDK did not give you is the design: the deadline on the entry, the compare-and-remove that protects a refresh, the claim map that turns a stampede into one load, and the order &mdash; publish, then complete, then release. In real code you use Caffeine, and saying so is a senior answer rather than a cop-out: it does all of the above plus admission control, a size bound, refresh-ahead and cleanup with no dedicated thread, in one dependency. Write it by hand when you need behaviour it does not have, or when an interviewer asks you to.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// what the JDK already did for you, and the line of this design that uses it\nConcurrentHashMap&lt;K, CacheEntry&lt;V&gt;&gt; map;       // per-bin locks; a get takes none at all\nConcurrentHashMap&lt;K, CompletableFuture&lt;...&gt;&gt; loading;  // the claim: one CAS, no lock\nCompletableFuture.complete(entry) / join();    // the wait protocol, latch not bell\nExecutors.newSingleThreadScheduledExecutor();  // one daemon sweeper, fixed delay\nnew LongAdder();                               // counters that do not serialise the hot path\n\n// what you still had to design, and what an interviewer is actually grading\nnew CacheEntry&lt;&gt;(value, now, now + ttlMsFor(key));  // an absolute deadline, on the entry\nmap.remove(key, e);                                 // identity, so a refresh survives a sweep\nmap.put(key, fresh); mine.complete(fresh);          // publish, THEN signal -- never the reverse\n\n// and what you would actually run in production\n// LoadingCache&lt;String,Row&gt; c = Caffeine.newBuilder()\n//     .expireAfterWrite(Duration.ofSeconds(60)).maximumSize(10_000)\n//     .refreshAfterWrite(Duration.ofSeconds(30)).build(this::loadRow);\n</code></pre></div></div></details></div></div><div class=\"card\"><div class=\"ch\"><span class=\"kind\">design</span><h3>17 &middot; Which pattern is where, which SOLID letter is where, and where would a Factory or a Builder earn its place?</h3><button class=\"timer\" data-min=\"8\">start 8:00</button></div><div class=\"cb\"><details><summary>Answer, after the timer</summary><div class=\"ans\"><p>None of the patterns was chosen up front, and the code below is each one as a single line: Strategy is move 3, because how long a key lives is a rule that changes, so it is a one-method interface the cache is handed; Decorator is the same move's wrapper, JitteredTtl; Observer is the fourth rule handed in there, and move 4 is only where it was decided that it fires <i>after</i> the write; State is move 6, the entry's life; and the multi-threading one is the Future, which here is a handle on somebody's result rather than a condition variable. SOLID is the table in move 11, and the letter to defend under pressure is D: <code>configure()</code> is the whole test seam, which is the difference between testing a one-hour TTL in a millisecond and not testing it at all. Factory earns its name the day the rules arrive as text rather than as Java, which is <code>TtlRules.parse</code>; Builder at about the sixth optional collaborator, which is <code>Caffeine.newBuilder()</code>. And the part people fumble, enum against subclass: the TTL rule is deliberately not an enum, because an enum of TTLs has to be edited for every new key prefix, whereas a rule handed in is a new class and no edit at all.</p><div class=\"ed\"><div class=\"tab\"><b>reference</b><button class=\"copy\" data-key=\"\">copy</button></div><pre><code class=\"java\">// Strategy: a rule behind a one-method interface, handed in, never built by the cache\ninterface TtlPolicy&lt;K&gt; { long ttlMsFor(K key); }\nvoid configure(TtlPolicy&lt;K&gt; ttl, Clock clock) { this.ttl = ttl; this.clock = clock; }\n\n// Decorator: add jitter to every rule, present and future, instead of copying the arithmetic\nnew JitteredTtl&lt;&gt;(new FixedTtl&lt;&gt;(60_000), 20);\n\n// Observer: the cache announces; it does not know what a metric is, and a broken one cannot break a put\nfor (RemovalListener&lt;K, V&gt; l : listeners) try { l.onRemoval(key, value, cause); } catch (RuntimeException ignored) { }\n\n// State: the entry&#x27;s life, and the compare-and-set that owns the LOADING slot for one key\n// ABSENT -&gt; LOADING -&gt; LIVE -&gt; EXPIRED -&gt; ABSENT\nCompletableFuture&lt;CacheEntry&lt;V&gt;&gt; running = loading.putIfAbsent(key, mine);\n\n// Future: the wait protocol. A loser holds a handle on a result; it does not hold a lock.\nCacheEntry&lt;V&gt; e = await(running);\n\n// Factory: not yet -- it earns the name the day the rules arrive as text\nTtlRules.parse(&quot;user:=300000, price:=2000, =60000&quot;);\n\n// Builder: not yet -- three required collaborators is a constructor; ten optional ones is Caffeine.newBuilder()\nTtlCache&lt;String, String&gt; cache = new TtlCache&lt;&gt;(60_000);\ncache.configure(new FixedTtl&lt;&gt;(60_000), new SystemClock());\n</code></pre></div> const RAW={"f0": "import java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.*;\n\n/**\n * Why an entry left the map. The listener is told the reason, so a metric can tell \"it timed out\"\n * from \"the sweeper reclaimed it\" from \"somebody overwrote it\" from \"somebody deleted it\".\n */\nenum RemovalCause { EXPIRED, SWEPT, REPLACED, EXPLICIT }\n\n/** Where time comes from. One method, handed in, so a test can jump an hour instead of sleeping an hour. */\ninterface Clock { long nowMs(); }\n\n/** The real clock. nanoTime, not currentTimeMillis: a clock correction must never make a TTL run backwards. */\nfinal class SystemClock implements Clock {\n    /** Milliseconds on a monotonic timeline. Only differences mean anything; the origin is arbitrary. */\n    public long nowMs() { return System.nanoTime() / 1_000_000L; }\n}\n\n/** A clock a test drives by hand. Thread-safe, because race tests read it from many threads while advancing it. */\nfinal class ManualClock implements Clock {\n    private final AtomicLong nowMs = new AtomicLong(1_000_000L);\n    /** The time this clock is standing at. */\n    public long nowMs() { return nowMs.get(); }\n    /** Jump forward. Nothing expires as a side effect: expiry is decided by whoever reads the entry next. */\n    public void advance(long ms) { nowMs.addAndGet(ms); }\n}\n\n/** How long a key is allowed to live, in milliseconds. This is the rule an interviewer changes mid-round. */\ninterface TtlPolicy<K> { long ttlMsFor(K key); }\n\n/** One TTL for every key. Zero or less means \"do not cache this at all\": every call goes to the loader. */\nfinal class FixedTtl<K> implements TtlPolicy<K> {\n    private final long ttlMs;\n    FixedTtl(long ttlMs) { this.ttlMs = ttlMs; }\n    /** The same number for every key. */\n    public long ttlMsFor(K key) { return ttlMs; }\n}\n\n/**\n * Decorator over any TTL rule: shortens each TTL by a random slice, up to percent of it.\n * A million keys written in the

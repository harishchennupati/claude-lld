<div class="top"><h1>TTL Cache</h1><span class="sub">LLD &middot; Java &middot; OpenJDK 21: multi-threading round &mdash; demo, 13 failure tests and a 50-thread stampede</span><span class="sub"><span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> steps</span>

<script>
const STEPS=[{"id": 1, "stage": "Problem", "title": "The problem, and what it must do", "wide": true, "think": "", "body": "<div class=\"move\"><div class=\"prompt\">\"Build me a thread-safe cache with a time to live. <code>put</code>, <code>get</code>, and a <code>getOrLoad</code> that takes a loader for a miss. Entries expire, expired entries must never be served, and they must not pile up forever. Many threads will hammer it at once. I want working code, not a diagram. Go.\"</div></div><div class=\"move\"><h3>The problem, in plain words</h3><p>A service reads the same few thousand rows over and over, and each read costs a database round trip of about twenty milliseconds. A cache keeps those rows in memory so the second reader pays nothing. What makes it a cache and not a map is one extra fact per entry: the instant it goes stale. Once the clock passes that instant the value must never be handed to anybody again &mdash; not once, not to the thread that got there a microsecond late. Fifty request threads use the cache at the same time, so two things go wrong on their own. The first is that a key goes stale and forty threads all miss it inside the twenty milliseconds the loader takes, and all forty ask the database the same question. The second is subtler: something has to reclaim entries nobody reads again, and that something is walking the map while other threads are writing to it, so it can very easily delete a value that was refreshed a microsecond ago. The invariant is one sentence: <b>no expired value is ever returned, no live value is ever deleted, and one cold key costs one load.</b></p></div><div class=\"move\"><h3>What is expected of you in the hour</h3><p>Not a diagram: a file that compiles, with a <code>main</code> that runs a demo and then a fifty-thread race that prints the counts. The interviewer is watching for, in this order: the questions you ask before typing (where time comes from is the first one); which classes exist and who owns the map; the read and the read-or-load end to end; the two races, named out loud &mdash; the stampede and the sweep-versus-refresh; how the threads that are <i>not</i> loading wait, and whether a wakeup can go missing; where the rule that will change (how long a key lives) lives, so a per-key TTL is a new class and not an edit; what the cache holds after a loader throws. Then the twists: refresh-ahead, jitter, negative caching, a deadline on the wait, two servers.</p></div><div class=\"move\"><h3>What the code must do</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 450\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><text x=\"100\" y=\"51\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">write</text><g transform=\"translate(175 20)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">put(key, value)</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the caller never passes a TTL</text></g><path d=\"M415 47 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 20)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ask the rule how long</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">ttl.ttlMsFor(key)</text></g><path d=\"M675 47 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 20)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">stamp an absolute deadline</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">now + ttl, onto the entry</text></g><path d=\"M935 47 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 20)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">map.put, then announce</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the replaced value, after the write</text></g><text x=\"100\" y=\"151\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read</text><g transform=\"translate(175 120)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">get(key)</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">one hash, no lock at all</text></g><path d=\"M415 147 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 120)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">compare with the clock</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the entry knows its own deadline</text></g><path d=\"M675 147 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 120)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">live: hand back the value</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a hit</text></g><path d=\"M935 147 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 120)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">dead: reclaim it, say miss</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">map.remove(key, THIS entry)</text></g><text x=\"100\" y=\"251\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">read or load</text><g transform=\"translate(175 220)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">getOrLoad(key, loader)</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">only after a miss</text></g><path d=\"M415 247 H435\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(435 220)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">claim the key</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">putIfAbsent(key, future)</text></g><path d=\"M675 247 H695\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(695 220)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the winner calls the loader</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">20 ms, with nothing held</text></g><path d=\"M935 247 H955\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(955 220)\"><rect width=\"240\" height=\"54\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"120.0\" y=\"21.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">store it, then wake the rest</text><text x=\"120.0\" y=\"37.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the losers read what was stored</text></g><path d=\"M815 274 V287\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(580 287)\"><rect width=\"470\" height=\"40\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"235.0\" y=\"20.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the loader threw: nothing stored, the claim freed</text></g><text x=\"100\" y=\"352\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">remove</text><text x=\"175\" y=\"352\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">invalidate(key) drops it now and the listener hears EXPLICIT;  a TTL of zero means do not cache at all</text><text x=\"100\" y=\"378\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">sweep</text><text x=\"175\" y=\"378\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">once a second a daemon thread walks what is left and removes only the entries whose deadline has passed</text><text x=\"100\" y=\"404\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--acc)\">ask</text><text x=\"175\" y=\"404\" text-anchor=\"start\" font-size=\"12\" fill=\"var(--text)\">at any instant, without a lock: is this key here?  how many entries are held?  what is the hit rate?</text><text x=\"615\" y=\"436\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"var(--muted)\">fifty threads at the same instant: no value is ever served after its deadline, and one cold key costs one call to the loader, not fifty</text></svg></div><div class=\"move\"><h3>Questions to ask back, and what each answer decides</h3></div><div class=\"move\"><table class=\"ask\"><tr><th>Ask</th><th>Assume this when they say \"you decide\"</th><th>What the answer decides</th></tr><tr><td>Where does time come from, and can I control it in a test?</td><td>An injected clock</td><td>A one-method <code>Clock</code> interface; every TTL test runs in a millisecond (moves 3, 9)</td></tr><tr><td>Is the TTL one number or per key, and counted from the write or the last read?</td><td>One number to start, per key behind an interface; from the write</td><td>A <code>TtlPolicy</code> handed in, and an absolute deadline on the entry (moves 1, 3)</td></tr><tr><td>Many threads miss the same cold key at once. What should happen?</td><td>The loader runs once and the rest share its result</td><td>A claim per key: a future, not a lock (moves 4, 6)</td></tr><tr><td>Is dropping an expired entry when somebody reads it enough?</td><td>No: also sweep in the background</td><td>One daemon thread, and the compare-and-remove that protects a refresh (moves 6, 9)</td></tr><tr><td>Can the loader be slow, and can it fail?</td><td>Yes to both: about 20 ms, and it can throw</td><td>The order at the critical step, and what is left behind after a failure (move 6)</td></tr><tr><td>If one thread&rsquo;s load is slow, may the others wait for it forever?</td><td>No: a caller may hand in a deadline, and an interrupt is honoured</td><td>Two forms of <code>getOrLoad</code>, and the rule that a deadline bounds the wait and never somebody&rsquo;s own load (moves 4, 6)</td></tr><tr><td>Does <code>size()</code> have to be exact?</td><td>No, an estimate is fine</td><td>No global counter and therefore no global lock (moves 5, 8)</td></tr><tr><td>One process, or a cache shared by many servers?</td><td>One process, in memory</td><td>No Redis yet; a follow-up adds it (move 12)</td></tr></table></div><div class=\"move\"><h3>What it must do, and what it must survive</h3></div><div class=\"req\"><div><b>Functional requirements</b><ul>\n<li><code>put(key, value)</code> stores a value with a time to live; <code>get(key)</code> reads it back.</li>\n<li><code>getOrLoad(key, loader)</code> fetches the value on a miss and stores it.</li>\n<li>An entry whose deadline has passed reads as a miss, and is reclaimed by the read that found it.</li>\n<li>A background sweeper reclaims entries that nobody will ever read again.</li>\n<li><code>invalidate(key)</code> removes a key; a replacement is announced too.</li>\n<li>A listener hears every removal with its reason: expired, swept, replaced, explicit.</li>\n<li>The rule for how long a key lives is swappable: one number today, per key tomorrow, with jitter.</li></ul></div>\n<div><b>Non-functional requirements</b><ul>\n<li>Under many threads: a value is never served after its deadline, and a refreshed value is never deleted.</li>\n<li>One cold key costs one call to the loader, however many threads miss it at the same instant.</li>\n<li><code>get</code> and <code>put</code> are O(1) and take no lock of ours; a slow load blocks only its own key.</li>\n<li>The rules that change &mdash; how long a key lives, where time comes from, who hears about a removal &mdash; are handed in and never built inside, which is what lets a one-hour TTL be tested in a millisecond.</li>\n<li>A thread waiting on somebody else\u2019s load can hand in a deadline and can be interrupted; the thread running the loader is never cut off by either.</li>\n<li>Nothing half-done: a loader that throws stores nothing and leaves the key loadable by the next caller.</li>\n<li>In memory, one process, no persistence (say it; a follow-up adds Redis).</li></ul></div></div>\n<div class=\"move\"><h3>One minute, replayed</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><path d=\"M60 40 H1180\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><circle cx=\"185\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M185 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(60 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">10:00:00.000  cold start</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">40 threads ask for user:42 at once</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one wins the claim, 39 wait on it</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">1 database call, not 40</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">deadline set to 10:01:00.000</text></g><circle cx=\"475\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M475 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(350 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">10:00:31.240  a refresh</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">a writer refreshes user:42</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">its deadline moves to 10:01:31</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the sweeper holds the OLD entry</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">remove(key, old) deletes nothing</text></g><circle cx=\"765\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M765 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(640 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">10:01:31.000  the deadline</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">a reader compares it with the clock</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">dead: reclaimed on that very read</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">the caller is told miss</text></g><circle cx=\"1055\" cy=\"40\" r=\"5\" fill=\"var(--acc)\"/><path d=\"M1055 45 V60\" stroke=\"var(--line)\"/><g transform=\"translate(930 60)\"><rect width=\"250\" height=\"115\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"125.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">10:01:31.002  and again</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">2,000 reads a second, all missing</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">one claim, one load, 39 riders</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">1,440 loads that day, not 57,600</text></g></svg></div><div class=\"grade\"><b>Say before typing:</b> time comes from an injected clock, so every TTL test runs in a millisecond. The deadline is absolute and lives on the entry, so checking it is one comparison. Entries are reclaimed twice over &mdash; lazily on a read, and by one daemon sweeper &mdash; and both reclaim by entry identity, never by key. A miss claims the key with a compare-and-set, so the loader runs once; the threads that lose that claim wait on a result rather than on a lock, which is why no wakeup here can be lost. And there is no lock of my own anywhere. Named as out of scope: a size bound and which key to evict, refresh-ahead, negative caching, and anything distributed &mdash; each is a follow-up on page 05.</div>", "code": ""}, {"id": 2, "stage": "Derivation", "title": "From the requirements to the design: twelve moves", "wide": true, "think": "", "body": "<div class=\"move\"><p class=\"lead\">Run these on any LLD and the class diagram, the tests, the patterns, SOLID and the answer to every twist fall out in that order; nothing is chosen up front, and nothing is named before the move that produced it. On a multi-threading problem three of the moves change shape: move 1 also names <i>who waits</i>, move 4 asks what the gap between reading and writing is <i>wide enough</i> to let in and then how the threads that lose the race are made to wait, and move 6 becomes the order of operations across two threads instead of one. Here the gap is twenty milliseconds wide, which is why it is the whole problem.</p></div><div class=\"move\"><h3>Move 1: underline the nouns. Every noun with its own state becomes a class.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><rect x=\"20\" y=\"20\" width=\"1190\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\"/><text x=\"615\" y=\"47\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a CALLER asks the CACHE for a KEY; an ENTRY holds a VALUE and its DEADLINE; a LOADER fetches a miss; a SWEEPER reclaims; a CLOCK says when</text><g transform=\"translate(18 110)\"><rect width=\"158\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"79.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TtlCache</text><text x=\"79.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the map + the claims</text></g><path d=\"M97 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(190 110)\"><rect width=\"158\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"79.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CacheEntry</text><text x=\"79.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">value + deadline</text></g><path d=\"M269 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(362 110)\"><rect width=\"158\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"79.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the sweeper</text><text x=\"79.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">a thread + its period</text></g><path d=\"M441 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(534 110)\"><rect width=\"158\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"79.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the waiters</text><text x=\"79.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no class: a future each</text></g><path d=\"M613 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(706 110)\"><rect width=\"158\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"79.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Loader</text><text x=\"79.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: handed in</text></g><path d=\"M785 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(878 110)\"><rect width=\"158\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"79.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TtlPolicy</text><text x=\"79.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: a rule</text></g><path d=\"M957 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(1050 110)\"><rect width=\"158\" height=\"46\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"79.0\" y=\"17.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"79.0\" y=\"33.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">no state: an interface</text></g><path d=\"M1129 64 V110\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">solid = it has state of its own, so it becomes a class.   dashed = no state: a rule, an interface, or a thread that is only waiting</text></svg></div><div class=\"move\"><p>Reading the prompt again: a <b>caller</b> asks the <b>cache</b> for a <b>key</b>; an <b>entry</b> holds a <b>value</b> and its <b>deadline</b>; a <b>loader</b> fetches a miss; a <b>sweeper</b> reclaims; a <b>clock</b> says when. The cache owns the map of entries and the set of keys currently being loaded, both of which change: a class. An entry holds a value and the instant it dies, and never changes afterwards: a small immutable class. Its three fields are <code>final</code>, and on a multi-threading problem that is not decoration &mdash; final fields are frozen when the constructor returns, so a thread that finds the entry in the map can never see a half-built one. The name for that is <i>safe publication</i>, and it is why reading an entry needs no lock. The sweeper owns a thread and a period: a field on the cache, not a class of its own. The loader, the TTL rule and the clock have no state at all &mdash; they are calculations somebody hands in &mdash; so each is a one-method interface. And the interesting one: the <i>waiting parties</i>, the forty-nine threads that miss a cold key while the fiftieth is loading it, are not a class either. On a multi-threading problem the first thing to name out loud is who waits, and here they wait on a handle to a result, not in a queue and not on a lock.</p></div><div class=\"move\"><h3>Move 2: for every verb, ask which class holds the state it touches. That class gets the method.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 354\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 24)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">read a key</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 46 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 24)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TtlCache  (owns the map)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 46 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 24)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cache.get(k)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 78)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">read it, or fetch it once</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 100 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 78)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TtlCache  (owns the map AND the claims)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 100 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 78)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cache.getOrLoad(k, loader)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 132)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">fetch the value</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 154 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 132)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Loader  (owns nothing: slow, can fail)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 154 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 132)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">loader.load(k)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 186)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">say how long this key lives</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 208 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 186)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TtlPolicy  (owns nothing: a rule)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 208 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 186)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">ttl.ttlMsFor(k)</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><g transform=\"translate(30 240)\"><rect width=\"330\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">reclaim what died</text><text x=\"165.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the verb</text></g><path d=\"M360 262 H430\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(430 240)\"><rect width=\"400\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"200.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TtlCache  (owns the map)</text><text x=\"200.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the class whose state it touches</text></g><path d=\"M830 262 H900\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><g transform=\"translate(900 240)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">cache.sweepOnce()</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the method</text></g><text x=\"615\" y=\"322\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the one verb that is slow and can fail -- fetch the value -- belongs to a collaborator, which is what lets the cache call it with nothing held</text><text x=\"615\" y=\"341\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">and \"reclaim what died\" has the same owner as \"read a key\": whoever owns the map is the only one allowed to decide what leaves it</text></svg></div><div class=\"move\"><p>\"Read a key\" touches the map, so it belongs to the thing that owns the map: <code>cache.get(k)</code>. \"Read it, or fetch it once\" touches the map <i>and</i> the set of claims, and only the cache sees both, so it is <code>cache.getOrLoad(k, loader)</code> and nothing else can own it. \"Fetch the value\" touches nothing of ours at all &mdash; it is a database call that takes twenty milliseconds and may throw &mdash; so it goes to a collaborator, <code>loader.load(k)</code>, and that is not bookkeeping: it is what lets the cache call it with nothing held. \"Say how long this key lives\" is a pure calculation, <code>ttl.ttlMsFor(k)</code>. \"Reclaim what died\" touches the map again, so it has the same owner as the read: <code>cache.sweepOnce()</code>. That is the rule that matters here &mdash; whoever owns the map is the only one allowed to decide what leaves it, which is why the sweeper is a method on the cache and not a class walking somebody else's data.</p></div><div class=\"move\"><h3>Move 3: every rule the interviewer can change mid-round goes behind an interface and is handed in.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 305\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\"uArr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0 0L10 5L0 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/></marker></defs><g transform=\"translate(30 78)\"><rect width=\"220\" height=\"90\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"110.0\" y=\"39.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TtlCache</text><text x=\"110.0\" y=\"55.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">configure(ttl, clock)</text></g><path d=\"M250 123 H330 V42 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 20)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">TtlPolicy</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">60s today, per key tomorrow</text></g><g transform=\"translate(760 20)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">FixedTtl / TtlRules / JitteredTtl</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 42 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 123 H330 V100 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 78)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Clock</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the real one, or a test's</text></g><g transform=\"translate(760 78)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">SystemClock / ManualClock</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 100 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 123 H330 V158 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 136)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">RemovalListener</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">metrics, a log line, close a socket</text></g><g transform=\"translate(760 136)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">CacheMetrics / a lambda / none</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 158 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><path d=\"M250 123 H330 V216 H400\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\" marker-end=\"url(#uArr)\"/><g transform=\"translate(400 194)\"><rect width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"150.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">Loader</text><text x=\"150.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">handed in per call, not per cache</text></g><g transform=\"translate(760 194)\"><rect width=\"420\" height=\"44\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"16.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a database read, an HTTP call</text><text x=\"210.0\" y=\"32.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"10.5\" fill=\"var(--muted)\">the classes that can be handed in</text></g><path d=\"M760 216 H700\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.3\" marker-end=\"url(#uArr)\"/><text x=\"615\" y=\"272\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">dashed green = handed in. The cache never builds one of these, so a per-key TTL is a new class plus one changed line</text><text x=\"615\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">and one rule wraps another: new JitteredTtl(base, 20) shortens every TTL by a random slice, so a million keys written together do not all die in the same millisecond</text></svg></div><div class=\"move\"><p>Four things will change. How long a key lives (sixty seconds today; per key tomorrow; with jitter the day a million keys are written together) becomes <code>TtlPolicy</code>. Where time comes from becomes <code>Clock</code>, and that one is not a nicety: without it a one-hour TTL is tested by sleeping for an hour. Who wants to hear that an entry left becomes <code>RemovalListener</code>. How to fetch a missing value becomes <code>Loader</code>, handed in per call rather than per cache, because two callers of the same cache legitimately load from different places. Each is one method. The cache is <i>given</i> them in <code>configure(...)</code> and never builds one, which is why a test can hand in a clock it drives by hand. This is also where the patterns are born, and nowhere else: a swappable rule behind an interface is <b>Strategy</b>; a rule that wraps another rule and adds to it &mdash; <code>new JitteredTtl(base, 20)</code>, which shortens every TTL by a random slice so a million keys do not all die in the same millisecond &mdash; is <b>Decorator</b>; something that announces \"this entry left\" without knowing what a metric is, is <b>Observer</b>. Name them on page 02, move 10, not now.</p></div><div class=\"move\"><h3>Move 4: state that many callers change at the same time gets one owner and one lock -- and here the answer is no lock at all.</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 538\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font-family:var(--mono)\"><defs><marker id=\"uTri\" viewBox=\"0 0 12 12\" refX=\"11\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M0 0L12 6L0 12z\" fill=\"var(--bg3)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/></marker><marker id=\"uDia\" viewBox=\"0 0 12 12\" refX=\"1\" refY=\"6\" markerWidth=\"12\" markerHeight=\"12\" orient=\"auto\"><path d=\"M1 6L6 1L11 6L6 11z\" fill=\"var(--text)\"/></marker><marker id=\" \"><rect width=\"66\" height=\"24\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"33.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">miss</text></g><g transform=\"translate(250 190)\"><rect width=\"770\" height=\"24\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"385.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">the loader: one database call, 20 ms</text></g><text x=\"170\" y=\"236\" text-anchor=\"end\" font-size=\"11.5\" fill=\"var(--acc)\">thread 2</text><g transform=\"translate(180 220)\"><rect width=\"66\" height=\"24\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"33.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">miss</text></g><g transform=\"translate(250 220)\"><rect width=\"770\" height=\"24\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"385.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">waits on thread 1's future: no lock held</text></g><text x=\"170\" y=\"266\" text-anchor=\"end\" font-size=\"11.5\" fill=\"var(--acc)\">thread 3</text><g transform=\"translate(180 250)\"><rect width=\"66\" height=\"24\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"33.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">miss</text></g><g transform=\"translate(250 250)\"><rect width=\"770\" height=\"24\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"385.0\" y=\"12.0\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">waits on thread 1's future: no lock held</text></g><rect x=\"1040\" y=\"190\" width=\"172\" height=\"84\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\"/><text x=\"1126\" y=\"214\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--acc)\">3 threads</text><text x=\"1126\" y=\"236\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">1 database call</text><text x=\"1126\" y=\"256\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--acc)\">2 rode the result</text><text x=\"615\" y=\"300\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">the gap is everything between \"I saw a miss\" and \"I stored a value\"; every thread that arrives inside those 20 milliseconds also sees a miss</text><text x=\"615\" y=\"320\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">one CompletableFuture per key closes it: the winner loads, the losers hold a handle on its result, and not one of them holds a lock</text><text x=\"615\" y=\"358\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">and now the question a multi-threading round always reaches: how do the losers wait?</text><g transform=\"translate(30 372)\"><rect width=\"570\" height=\"128\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--acc)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">a future: what the code on page 04 does</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">the winner: map.put(entry) first, then future.complete(entry)</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">a loser: future.join() -- a completed future is a latch, not a bell</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">a thread that arrives after complete() returns at once, no wait</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">nobody waiting holds a lock, so nothing else is blocked</text></g><g transform=\"translate(630 372)\"><rect width=\"570\" height=\"128\" rx=\"6\" fill=\"var(--bg3)\" stroke=\"var(--line)\" stroke-width=\"1.3\"/><text x=\"285.0\" y=\"20\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--text)\">wait/notify: the same job by hand, and its two holes</text><text x=\"14\" y=\"41\" font-size=\"10.5\" fill=\"var(--muted)\">synchronized (slot) { while (!slot.done) slot.wait(); }</text><text x=\"14\" y=\"58\" font-size=\"10.5\" fill=\"var(--muted)\">take the lock, test the flag UNDER it, and wait in a LOOP</text><text x=\"14\" y=\"75\" font-size=\"10.5\" fill=\"var(--muted)\">no flag: a notify sent before the wait is gone -- LOST WAKEUP</text><text x=\"14\" y=\"92\" font-size=\"10.5\" fill=\"var(--muted)\">if instead of while: a wakeup nobody sent -- SPURIOUS WAKEUP</text></g><text x=\"615\" y=\"524\" text-anchor=\"middle\" font-size=\"11\" fill=\"var(--muted)\">both give one load for fifty threads, and FailureTests proves it for each; the future is the one to write, because there is no flag to forget</text></svg></div><div class=\"move\"><p>The shared state is the map, and the map is a <code>ConcurrentHashMap</code>, which already has one lock per bin and takes none at all on a read. So the usual move &mdash; one owner, one lock &mdash; is already done by the structure, and the real race is somewhere else. Look at the picture: three threads miss the same cold key, and each one calls a loader that takes twenty milliseconds. The gap is everything between \"I saw a miss\" and \"I stored a value\", and it is twenty milliseconds wide, so every thread that arrives inside it also sees a miss. At two thousand reads a second that is forty threads asking the database the same question. The fix is not a lock around the load &mdash; a lock would make the other forty-nine threads sleep in a queue, and would still have to be released before the slow call to avoid pinning everything. The fix is a <i>claim</i>: one extra map from key to a <code>CompletableFuture</code>, and <code>putIfAbsent</code> on it is a single compare-and-set. Exactly one thread gets null back and becomes the loader; everybody else gets the winner's future and waits on a result. Waiting on a result is not the same as waiting on a lock: nothing is held, nothing else is blocked, and a thread that arrives after the value is stored never waits at all. That last clause is the whole <i>wait protocol</i>, in the words the interviewer is listening for: change the state first, signal second, and let a late arriver test the state instead of listening for the signal. A completed future does all of that for free, because it is a latch and not a bell &mdash; joining one that has already completed returns at once &mdash; so no wakeup here can go missing. It carries the memory guarantee too, which is the half of this question people forget: everything the winner did before <code>complete</code> is visible to every thread that returns from <code>join</code>, exactly as everything done before a <code>map.put</code> is visible to whoever later gets that key. Those two guarantees are why the values this cache hands between threads need no lock and no <code>volatile</code> of their own. The right-hand card is the same protocol written by hand with a monitor, and the two ways it goes wrong have names worth knowing: drop the <code>done</code> flag and a <code>notifyAll</code> sent a microsecond too early is gone for good, which is a <b>lost wakeup</b>; use an <code>if</code> where a <code>while</code> belongs and a wakeup nobody sent hands the caller a half-built answer, which is a <b>spurious wakeup</b>. Extensions.java carries that version and test 13 proves it: one load for thirty threads, and a lost wakeup reproduced on demand. So the reason to write the future is not speed &mdash; it is that there is no flag to forget.</p></div><div class=\"move\"><h3>Move 5: for each collection, ask what question is asked of it, and pick the shape that answers in O(1).</h3></div><div class=\"fullboard mv\"><svg viewBox=\"0 0 1230 305\" xmlns=\"http://www.w3.org/2000/svg\" style=\"fo
